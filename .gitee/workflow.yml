# Gitee Go CI/CD Workflow
# 适配 Gitee 的自动化工作流（类 GitHub Actions）
name: CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  tag_push:
    tags: ['v*']

jobs:
  # ========== 后端测试（Go） ==========
  backend-test:
    name: Backend Tests (Go)
    runs-on: docker
    container:
      image: golang:1.27-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run go vet
        working-directory: backend-go
        run: go vet ./...

      - name: Run tests
        working-directory: backend-go
        run: go test ./... -count=1

  # ========== 前端构建检查 ==========
  frontend-build:
    name: Frontend Build
    runs-on: docker
    container:
      image: node:22-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Type check
        working-directory: frontend-vue
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: frontend-vue
        run: npm run build

  # ========== 构建 Docker 镜像 ==========
  build-docker:
    name: Build Docker Images
    runs-on: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Gitee Container Registry
        uses: docker/login-action@v2
        with:
          registry: gitee.com
          username: ${{ secrets.GITEE_USERNAME }}
          password: ${{ secrets.GITEE_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            gitee.com/${{ github.repository }}/backend:latest
            gitee.com/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=registry,ref=gitee.com/${{ github.repository }}/backend:latest
          cache-to: type=inline

  # ========== 部署到预发布环境 ==========
  deploy-staging:
    name: Deploy to Staging
    runs-on: docker
    if: github.ref == 'refs/heads/develop'
    environment: staging
    needs: [backend-test]

    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/learnstar/staging
            git pull origin develop
            docker-compose pull
            docker-compose up -d --remove-orphans

  # ========== 部署到生产环境 ==========
  deploy-production:
    name: Deploy to Production
    runs-on: docker
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production
    needs: [build-docker]

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/learnstar/production
            git pull origin master
            docker-compose pull
            docker-compose up -d --remove-orphans

  # ========== 通知 ==========
  notify:
    name: Send Notification
    runs-on: docker
    if: always()
    needs:
      - backend-test
      - frontend-build
      - build-docker
      - deploy-staging
      - deploy-production

    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI/CD Pipeline - ${{ job.status }}"
          body: "Pipeline status: ${{ job.status }}\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: CI/CD Bot
