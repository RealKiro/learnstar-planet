# 学宠星球 - Docker Compose 部署配置
#
# 两种部署方式：
#
#   方式一（默认）：SQLite 零依赖
#     docker-compose up -d
#     → 只启动 app 一个容器，数据库为内置 SQLite 文件，无需任何数据库服务
#     → 适合 < 500 学生，Docker 体积最小
#
#   方式二：外置数据库（MySQL / MariaDB / PostgreSQL，全校规模）
#     1. 在你的数据库服务器上创建空库（如 learnstar）和账号
#     2. .env 中注释掉 SQLite 段、启用外置 MySQL/PG 段（DB_HOST 填服务器地址）
#     3. docker-compose up -d app --no-deps
#     → 只启动 app，连接你自己的数据库（Redis 同理可选外置）
#
# 设计说明：本项目刻意不内置 MySQL/Redis 容器，以减小默认部署体积；
#           需要全校规模时请使用你已有的数据库服务器（外置）。
#
# 端口说明：
#   容器内 PHP 内置服务器固定监听 8080，不可改
#   APP_PORT 是宿主机访问端口，可自由修改
#   APP_URL 是 Laravel 生成绝对 URL 用的，填用户浏览器看到的地址

version: '3.8'

services:
  # ===== 应用服务 =====
  app:
    image: ghcr.io/${GITHUB_USERNAME:-realkiro}/learnstar-planet/backend:latest
    container_name: learnstar-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # 基础配置
      - APP_NAME=${APP_NAME:-学宠星球}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_PORT=${APP_PORT:-8080}
      # 时区：默认东八区（考勤/今日积分/日报表的「今天」边界依赖它，留空即用默认值）
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}

      # 数据库配置（默认内置 SQLite；外置 MySQL/PG 时按 .env 填 DB_HOST 等）
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-}
      - DB_USERNAME=${DB_USERNAME:-}
      - DB_PASSWORD=${DB_PASSWORD:-}

      # Redis 配置（可选：默认无 Redis，排行榜降级 SQL；外置 Redis 填 REDIS_HOST）
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

      # 缓存配置（默认 file/database，无需 Redis）
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION:-null}

      # AI 功能配置（可选）
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE=${AI_API_BASE:-}
      - AI_MODEL=${AI_MODEL:-qwen-turbo}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-2000}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}

      # 第三方登录配置（可选）
      - WECHAT_OFFICIAL_APPID=${WECHAT_OFFICIAL_APPID:-}
      - WECHAT_OFFICIAL_SECRET=${WECHAT_OFFICIAL_SECRET:-}
      - WECHAT_WORK_CORPID=${WECHAT_WORK_CORPID:-}
      - WECHAT_WORK_AGENTID=${WECHAT_WORK_AGENTID:-}
      - WECHAT_WORK_SECRET=${WECHAT_WORK_SECRET:-}
      - WECHAT_WORK_TOKEN=${WECHAT_WORK_TOKEN:-}
      - WECHAT_WORK_ENCODING_AES_KEY=${WECHAT_WORK_ENCODING_AES_KEY:-}
      - WECHAT_WORK_LEAVE_TEMPLATE_ID=${WECHAT_WORK_LEAVE_TEMPLATE_ID:-}
      - DINGTALK_APP_KEY=${DINGTALK_APP_KEY:-}
      - DINGTALK_APP_SECRET=${DINGTALK_APP_SECRET:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - QQ_APPID=${QQ_APPID:-}
      - QQ_APPSECRET=${QQ_APPSECRET:-}
      - RENREN_CLIENT_ID=${RENREN_CLIENT_ID:-}
      - RENREN_CLIENT_SECRET=${RENREN_CLIENT_SECRET:-}

      # 超级管理员配置（首次部署自动创建，生产环境请务必修改密码）
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
      - ADMIN_NAME=${ADMIN_NAME:-系统管理员}
      - ADMIN_SCHOOL_NAME=${ADMIN_SCHOOL_NAME:-学宠星球默认学校}
      - ADMIN_SCHOOL_CODE=${ADMIN_SCHOOL_CODE:-learnstar-default}

      # API 机器人账号（外部系统 REST API 对接，拥有全部班级权限）
      - BOT_ENABLED=${BOT_ENABLED:-true}
      - BOT_USERNAME=${BOT_USERNAME:-api-bot}
      - BOT_PASSWORD=${BOT_PASSWORD:-learnstar-bot-2026}
      - BOT_NAME=${BOT_NAME:-API 机器人}
    volumes:
      # ⚠️ 生产镜像 WORKDIR=/app，应用与 SQLite 均在 /app（勿改成 /var/www/html，镜像内不存在该路径）
      - app-uploads:/app/storage/app/uploads
      - app-logs:/app/storage/logs
      - app-db:/app/storage/database.sqlite
    networks:
      - learnstar-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  learnstar-net:
    driver: bridge

volumes:
  app-uploads:
  app-logs:
  app-db:
