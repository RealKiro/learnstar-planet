name: CI - Test & Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ========== 后端测试（Go） ==========
  backend-test:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend-go/go.sum

      - name: Check formatting (gofmt)
        working-directory: backend-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        working-directory: backend-go
        run: go vet ./...

      - name: Run tests
        working-directory: backend-go
        run: go test ./... -count=1

  # ========== 前端构建检查（Vue 3 + Vite + TypeScript） ==========
  frontend-build:
    name: Frontend Build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend-vue
        run: npm ci

      - name: Run TypeScript type check
        working-directory: frontend-vue
        run: npx vue-tsc --noEmit

      - name: Build production bundle
        working-directory: frontend-vue
        run: npm run build:ci

  # ========== 微信小程序检查 ==========
  miniprogram-lint:
    name: WeChat Mini Program Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate mini-program JSON files
        run: |
          echo "Validating mini-program config files..."
          cat mini-program/app.json | jq . > /dev/null && echo "✅ app.json is valid JSON"
          cat mini-program/project.config.json | jq . > /dev/null && echo "✅ project.config.json is valid JSON"
          echo "Mini-program structure validation passed"

      - name: Check mini-program file structure
        run: |
          test -f mini-program/app.js
          test -f mini-program/app.json
          test -f mini-program/app.wxss
          test -d mini-program/pages
          echo "Mini-program file structure OK"
