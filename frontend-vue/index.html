<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学趣星球 - 让学习充满乐趣的成长平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
      /* 主题防闪烁：绘制前按 localStorage / 系统偏好设置 <html> 的 dark 类 */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark;
          if (t === 'dark') dark = true;
          else if (t === 'light') dark = false;
          else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', !!dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 顶部路由加载条 -->
    <div id="route-loading-bar" aria-hidden="true"></div>
    <style>
      #route-loading-bar {
        position: fixed; top: 0; left: 0; height: 3px; width: 0;
        background: linear-gradient(90deg, #F59E0B, #EF4444, #8B5CF6, #F59E0B);
        background-size: 200% 100%;
        opacity: 0; z-index: 9999; pointer-events: none;
        transition: width 0.25s ease, opacity 0.2s ease;
        animation: rlbShine 1.5s linear infinite;
      }
      @keyframes rlbShine { to { background-position: 200% 0; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
