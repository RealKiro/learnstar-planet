<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="东北虎·五阶·山林之王·立雪崖俯瞰山林低吼镇盗爪拨护兽">
  <defs>
    <!-- 背景：北境雪崖夕金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AB8D8"/>
      <stop offset="52%" stop-color="#C8DCE8"/>
      <stop offset="100%" stop-color="#F0E8D8"/>
    </linearGradient>
    <!-- 王者神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 王者光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#F0F8F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F0F8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F0B858"/>
      <stop offset="100%" stop-color="#C89030"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="40" cy="28" r="1.2">
      <animate attributeName="cy" values="28;54;28" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="20" r="1">
      <animate attributeName="cy" values="20;46;20" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 雪崖 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E0E8E8" opacity="0.9"/>
  <g fill="#C8D8DC" opacity="0.6">
    <path d="M 0 148 L 60 138 L 200 148 L 200 200 L 0 200 Z"/>
  </g>

  <!-- 探头盗猎者（右，被镇） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;-1.5 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="164" cy="112" r="4" fill="#5A4E42" stroke="#3E3428" stroke-width="0.5"/>
    <ellipse cx="164" cy="126" rx="5" ry="8" fill="#6E5E4E" stroke="#4E4238" stroke-width="0.7"/>
    <path d="M 160 118 L 156 122" stroke="#4E4238" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 被爪护的困雪小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="56" cy="130" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="54" cy="128.8" r="1" fill="#2E2A24"/>
    <circle cx="59" cy="128.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 山林之王（中，立雪崖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大耳 -->
    <path d="M 82 100 L 70 82 L 88 95 Z" fill="#F0B858" stroke="#B87820" stroke-width="0.9"/>
    <path d="M 112 100 L 124 82 L 106 95 Z" fill="#F0B858" stroke="#B87820" stroke-width="0.9"/>
    <!-- 尾（如王旗） -->
    <path d="M 76 116 Q 56 100 50 114 Q 46 130 62 138 Q 78 140 84 128" stroke="#F0B858" stroke-width="3.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 76 116;4 76 116;-4 76 116" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 56 106 L 58 116 M 68 128 L 69 134" stroke="#3E3228" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 身（橙黄如王，大） -->
    <ellipse cx="96" cy="114" rx="20" ry="15" fill="url(#fur)" stroke="#B87820" stroke-width="1.1"/>
    <!-- 黑纹（如铠） -->
    <path d="M 78 104 Q 96 96 114 104" stroke="#3E3228" stroke-width="1.6" fill="none" opacity="0.85"/>
    <path d="M 80 124 Q 96 116 112 124" stroke="#3E3228" stroke-width="1.4" fill="none" opacity="0.75"/>
    <path d="M 90 102 L 90 112 M 102 102 L 102 112" stroke="#3E3228" stroke-width="1" fill="none" opacity="0.65"/>
    <!-- 腹白 -->
    <ellipse cx="94" cy="126" rx="10" ry="6" fill="#F0E8D0" opacity="0.7"/>
    <!-- 头（王） -->
    <ellipse cx="96" cy="100" rx="11" ry="10" fill="url(#fur)" stroke="#B87820" stroke-width="0.9"/>
    <!-- 额间王纹（如印） -->
    <path d="M 96 90 L 96 96 M 92 94 L 100 94" stroke="#3E3228" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="96" cy="92" r="1.5" fill="#FFF8E0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（含威含温） -->
    <circle cx="90" cy="99" r="2.6" fill="#2E2A24"/>
    <circle cx="90.8" cy="97.8" r="1" fill="#FFF"/>
    <circle cx="102" cy="99" r="2.6" fill="#2E2A24"/>
    <circle cx="102.8" cy="97.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 104 103 L 106 103 L 105 105 Z" fill="#8E6E50"/>
    <!-- 嘴（定） -->
    <path d="M 105 108 Q 107 109.4 109 108" fill="none" stroke="#8E6E50" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 前掌（护兽） -->
    <path d="M 80 120 L 70 126" stroke="#F0B858" stroke-width="3.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 80 120;4 80 120;-4 80 120" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 厚掌 -->
    <path d="M 110 122 L 118 132" stroke="#F0B858" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 吼声波纹 -->
    <g stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 116 106 Q 124 106 130 102">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 120 110 Q 130 110 138 104" opacity="0.35">
        <animate attributeName="opacity" values="0.35;0.13;0.35" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF8E0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
