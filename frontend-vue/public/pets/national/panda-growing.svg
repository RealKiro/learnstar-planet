<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大熊猫·三阶·竹心苦修·为残根挡风浇水">
  <defs>
    <!-- 背景：山间晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8A0"/>
      <stop offset="52%" stop-color="#88AE80"/>
      <stop offset="100%" stop-color="#6E9468"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="70%" cy="26%" r="40%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 嫩竹青 -->
    <radialGradient id="green" cx="34%" cy="58%" r="36%">
      <stop offset="0%" stop-color="#9ED888" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9ED888" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#1E1E28"/>
    </linearGradient>
    <!-- 白毛（沾土） -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F0F2"/>
      <stop offset="100%" stop-color="#C0C0C8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 晨光 -->
  <circle cx="140" cy="52" r="58" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 嫩竹微光 -->
  <circle cx="68" cy="116" r="52" fill="url(#green)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 残林（远处） -->
  <g stroke="#5E8456" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
    <path d="M 150 70 Q 148 110 144 160"/>
    <path d="M 176 66 Q 178 106 174 160"/>
    <path d="M 152 90 L 144 100 M 174 88 L 182 98"/>
  </g>

  <!-- 山间小径 -->
  <path d="M 40 152 Q 90 146 160 152 L 200 152 L 200 200 L 0 200 Z" fill="#6E9468" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#8EAE84" stroke-width="1.4" opacity="0.6"/>

  <!-- 大熊猫（2头身，为残根挡风浇水） -->
  <!-- 腿 -->
  <path d="M 82 146 Q 78 152 84 154 Q 90 154 90 148 Z" fill="#1E1E28"/>
  <path d="M 104 146 Q 108 152 102 154 Q 96 154 96 148 Z" fill="#1E1E28"/>
  <!-- 身体 -->
  <ellipse cx="93" cy="126" rx="20" ry="17" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 爪上带茧（爪） -->
  <path d="M 82 118 L 80 128" stroke="#7E725E" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- 肩部黑色臂带 -->
  <path d="M 73 120 Q 78 108 88 112 L 90 122 Q 80 128 73 120 Z" fill="url(#black)"/>
  <path d="M 113 120 Q 108 108 98 112 L 96 122 Q 106 128 113 120 Z" fill="url(#black)"/>
  <!-- 黑尾 -->
  <circle cx="116" cy="132" r="3.4" fill="#1E1E28"/>

  <!-- 头（黑耳立起，圆眼专注） -->
  <circle cx="93" cy="100" r="13" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 黑耳（立起） -->
  <circle cx="80" cy="89" r="4.4" fill="url(#black)"/>
  <circle cx="106" cy="89" r="4.4" fill="url(#black)"/>
  <!-- 黑眼圈 -->
  <ellipse cx="87" cy="101" rx="4.6" ry="4" fill="url(#black)"/>
  <ellipse cx="99" cy="101" rx="4.6" ry="4" fill="url(#black)"/>
  <!-- 圆眼专注 -->
  <circle cx="87" cy="101" r="2.4" fill="#1E1008"/>
  <circle cx="99" cy="101" r="2.4" fill="#1E1008"/>
  <circle cx="87.6" cy="100.4" r="0.9" fill="#FFF"/>
  <circle cx="99.6" cy="100.4" r="0.9" fill="#FFF"/>
  <!-- 黑鼻 -->
  <ellipse cx="93" cy="106" rx="2.6" ry="1.8" fill="#1E1008"/>
  <!-- 专注抿唇 -->
  <path d="M 89 109 Q 93 110.6 97 109" fill="none" stroke="#6E6E78" stroke-width="1" stroke-linecap="round"/>

  <!-- 前爪（浇水） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 84 118;3 84 118;-4 84 118" dur="2s" repeatCount="indefinite"/>
    <path d="M 84 118 C 78 124 76 130 78 136" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="78" cy="138" r="3.4" fill="#1E1E28"/>
    <!-- 水珠 -->
    <g fill="#A8D8E8">
      <circle cx="72" cy="130" r="1.3"><animate attributeName="cy" values="130;136;130" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="68" cy="126" r="1"><animate attributeName="cy" values="126;132;126" dur="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 右爪（挡风护嫩竹） -->
  <path d="M 102 118 C 108 116 112 118 114 124" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="115" cy="126" r="3.4" fill="#1E1E28"/>

  <!-- 残根嫩竹（被护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 64 144 L 64 138 Q 62 134 64 132 Q 66 134 66 138 L 66 144 Z" fill="#7EB878"/>
    <path d="M 64 134 L 60 128 M 66 134 L 70 128" stroke="#7EB878" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8E0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
