<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="东北虎·四阶·守林初成·跃雪坡立林口低吼震退盗猎生灵安宁">
  <defs>
    <!-- 背景：雪林口 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9EC4DC"/>
      <stop offset="52%" stop-color="#C0D8E4"/>
      <stop offset="100%" stop-color="#E8F0F4"/>
    </linearGradient>
    <!-- 吼威光 -->
    <radialGradient id="glow" cx="40%" cy="36%" r="46%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ECB050"/>
      <stop offset="100%" stop-color="#C88828"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="80" cy="72" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="40" cy="28" r="1.2">
      <animate attributeName="cy" values="28;54;28" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="20" r="1">
      <animate attributeName="cy" values="20;46;20" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E8F0F4" opacity="0.9"/>

  <!-- 惊退的盗猎者（右，逃） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="164" cy="112" r="4" fill="#5A4E42" stroke="#3E3428" stroke-width="0.5"/>
    <ellipse cx="164" cy="126" rx="5" ry="8" fill="#6E5E4E" stroke="#4E4238" stroke-width="0.7"/>
    <path d="M 168 118 L 174 114" stroke="#4E4238" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 160 118 L 156 122" stroke="#4E4238" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 林中安宁的生灵（左后） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="52" cy="130" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="50" cy="128.8" r="1" fill="#2E2A24"/>
    <circle cx="55" cy="128.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 守林口的小东北虎（中，低吼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大耳 -->
    <path d="M 82 102 L 72 88 L 88 97 Z" fill="#ECB050" stroke="#B87820" stroke-width="0.8"/>
    <path d="M 108 102 L 118 88 L 102 97 Z" fill="#ECB050" stroke="#B87820" stroke-width="0.8"/>
    <!-- 尾（扬，威） -->
    <path d="M 74 118 Q 58 106 54 118 Q 52 130 66 136" stroke="#ECB050" stroke-width="3.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 74 118;4 74 118;-4 74 118" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 58 110 L 60 118 M 66 128 L 67 133" stroke="#3E3228" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 身 -->
    <ellipse cx="94" cy="116" rx="18" ry="14" fill="url(#fur)" stroke="#B87820" stroke-width="1"/>
    <!-- 黑纹 -->
    <path d="M 78 108 Q 94 102 110 108" stroke="#3E3228" stroke-width="1.4" fill="none" opacity="0.8"/>
    <path d="M 80 124 Q 94 118 108 124" stroke="#3E3228" stroke-width="1.2" fill="none" opacity="0.7"/>
    <!-- 腹白 -->
    <ellipse cx="92" cy="126" rx="9" ry="5.5" fill="#F0E8D0" opacity="0.7"/>
    <!-- 头（威） -->
    <ellipse cx="94" cy="102" rx="10" ry="9" fill="url(#fur)" stroke="#B87820" stroke-width="0.9"/>
    <!-- 额间王纹（亮） -->
    <path d="M 94 93 L 94 98 M 91 96 L 97 96" stroke="#3E3228" stroke-width="1.1" stroke-linecap="round" opacity="0.9"/>
    <!-- 眼（含威含护） -->
    <circle cx="89" cy="101" r="2.5" fill="#2E2A24"/>
    <circle cx="89.8" cy="99.8" r="1" fill="#FFF"/>
    <circle cx="99" cy="101" r="2.5" fill="#2E2A24"/>
    <circle cx="99.8" cy="99.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 101 105 L 103 105 L 102 107 Z" fill="#8E6E50"/>
    <!-- 嘴（低吼） -->
    <ellipse cx="104" cy="110" rx="3" ry="2.4" fill="#6E4E2E" opacity="0.8"/>
    <path d="M 106 110 L 110 108" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 前掌（威立） -->
    <path d="M 82 124 L 77 133" stroke="#ECB050" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 106 124 L 111 133" stroke="#ECB050" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 吼声波纹 -->
    <g stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 112 108 Q 120 108 126 104">
        <animate attributeName="opacity" values="0.6;0.25;0.6" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 116 112 Q 126 112 134 106" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 震落的雪 -->
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="120" cy="96" r="1.5">
        <animate attributeName="cy" values="96;104;96" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="100" r="1.2">
        <animate attributeName="cy" values="100;108;100" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#FFFFFF">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
