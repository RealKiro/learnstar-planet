<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱鹮·六阶·祥瑞传说·暮色看小朱鹮学啄清鸣我在">
  <defs>
    <!-- 背景：水田暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#D09A5E"/>
      <stop offset="100%" stop-color="#B87E48"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽（暮色染金） -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF8F0"/>
      <stop offset="100%" stop-color="#E4DCC8"/>
    </linearGradient>
    <!-- 粉翼（暮金） -->
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4A8B4"/>
      <stop offset="100%" stop-color="#D890A0"/>
    </linearGradient>
    <!-- 雏鹮绒羽 -->
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#C8C4BA"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="54" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮色稻影 -->
  <g stroke="#8E7A4E" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 14 44 Q 12 96 8 160 M 26 58 Q 22 100 18 160"/>
  </g>
  <g fill="#C8A86E">
    <ellipse cx="12" cy="42" rx="4" ry="7" opacity="0.9"/>
    <ellipse cx="24" cy="56" rx="4" ry="7" opacity="0.9"/>
  </g>
  <!-- 远山 -->
  <path d="M 0 130 Q 50 118 110 126 Q 160 132 200 122 L 200 200 L 0 200 Z" fill="#C89A5E" opacity="0.5"/>

  <!-- 浅水 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E7A4E" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#C4A878" stroke-width="1.4" opacity="0.6"/>
  <path d="M 20 158 Q 48 156 78 158 M 116 164 Q 144 162 176 164" stroke="#F4E4C8" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 新生小朱鹮（左前，学啄） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（绒团） -->
    <ellipse cx="56" cy="138" rx="8" ry="7" fill="url(#down)" stroke="#B0ACA2" stroke-width="0.7"/>
    <!-- 粉翅边 -->
    <path d="M 50 136 Q 45 132 43 127" stroke="#E090A4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 头（探喙学啄） -->
    <circle cx="56" cy="128" r="6" fill="url(#down)" stroke="#B0ACA2" stroke-width="0.7"/>
    <!-- 头冠 -->
    <path d="M 55 123 Q 54 119 55 116 M 58 123 Q 59 118 60 116" stroke="#F0A8B8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- 朱红脸 -->
    <ellipse cx="54" cy="129" rx="3" ry="2.4" fill="#D8705A"/>
    <!-- 长喙（探水学啄） -->
    <path d="M 53 130 L 46 138 L 52 132 Z" fill="#2A2E3A"/>
    <!-- 学啄水花 -->
    <path d="M 44 140 Q 48 138 52 140" stroke="#F4E4C8" stroke-width="1" opacity="0.6" fill="none">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 眼（亮，望老鹮） -->
    <circle cx="58" cy="128" r="1.2" fill="#24180E"/>
    <circle cx="58.4" cy="127.8" r="0.4" fill="#FFF"/>
    <!-- 小爪 -->
    <path d="M 54 143 L 52 145 M 59 143 L 61 145" stroke="#6E7682" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 老鹮（4头身，立浅水，垂首看小鹮，头冠轻颤） -->
  <!-- 腿 -->
  <path d="M 100 126 L 100 150" stroke="#6E7682" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M 110 124 L 112 150" stroke="#6E7682" stroke-width="1.7" stroke-linecap="round"/>
  <!-- 身体 -->
  <ellipse cx="105" cy="114" rx="16" ry="10" fill="url(#white)" stroke="#C8BCA4" stroke-width="0.8"/>
  <!-- 粉翼 -->
  <path d="M 96 108 Q 80 98 64 100 Q 70 112 84 114 Q 92 113 96 108 Z" fill="url(#pink)" stroke="#B08090" stroke-width="0.7"/>
  <path d="M 113 110 Q 122 106 128 108 Q 124 114 118 114 Z" fill="url(#pink)" opacity="0.8"/>
  <!-- 尾羽 -->
  <path d="M 118 118 Q 128 120 134 124" stroke="#F0A8B4" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（垂向小鹮，头冠轻颤） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 100 102;4 100 102;0 100 102" dur="3s" repeatCount="indefinite"/>
    <circle cx="100" cy="102" r="5" fill="url(#white)" stroke="#C8BCA4" stroke-width="0.7"/>
    <!-- 头冠（轻颤） -->
    <path d="M 98 97 Q 96 92 98 88 M 101 97 Q 102 91 104 88 M 104 97 Q 106 93 108 91" stroke="#F0A8B8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 朱红脸 -->
    <ellipse cx="98" cy="103" rx="3.4" ry="2.6" fill="#D8705A"/>
    <!-- 长喙（垂向小鹮） -->
    <path d="M 97 105 L 88 116 L 96 107 Z" fill="#2A2E3A"/>
    <!-- 眼（温和） -->
    <circle cx="102" cy="102" r="1.1" fill="#24180E"/>
    <path d="M 99 100 Q 102 99 104 100" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- 清鸣（"我在"，温和上扬） -->
  <g stroke="#FFF8E0" stroke-width="1.5" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 106 82 Q 114 76 112 68">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 118 88 Q 126 84 128 76">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF8E0">
    <circle cx="34" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
