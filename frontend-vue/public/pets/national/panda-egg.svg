<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大熊猫·一阶·滚滚幼崽·竹坡抱笋慢啃">
  <defs>
    <!-- 背景：竹坡暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8A0"/>
      <stop offset="52%" stop-color="#C8BC7E"/>
      <stop offset="100%" stop-color="#A89E5E"/>
    </linearGradient>
    <!-- 暖阳金 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 竹青 -->
    <radialGradient id="green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9ED888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9ED888" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#1E1E28"/>
    </linearGradient>
    <!-- 白毛 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAFC"/>
      <stop offset="100%" stop-color="#D8D8E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="78" fill="url(#glow)"/>
  <!-- 竹青 -->
  <circle cx="100" cy="110" r="60" fill="url(#green)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 竹影 -->
  <g stroke="#6E9E5E" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
    <path d="M 22 50 L 16 160 M 178 46 L 172 160"/>
    <path d="M 26 70 L 18 88 M 174 68 L 180 86"/>
  </g>
  <!-- 竹叶 -->
  <g fill="#7EB878" opacity="0.7">
    <path d="M 20 54 Q 14 50 12 44 Q 18 46 20 54 Z"/>
    <path d="M 180 50 Q 186 46 188 40 Q 182 42 180 50 Z"/>
  </g>

  <!-- 竹坡 -->
  <path d="M 0 138 Q 60 126 120 132 Q 170 138 200 130 L 200 200 L 0 200 Z" fill="#8E8A5E" opacity="0.6"/>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E8A4E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#88A060" stroke-width="1.4" opacity="0.6"/>

  <!-- 大熊猫（2头身，黑白圆滚，抱竹慢啃） -->
  <!-- 腿（圆短） -->
  <path d="M 82 146 Q 78 152 84 154 Q 90 154 90 148 Z" fill="#1E1E28"/>
  <path d="M 104 146 Q 108 152 102 154 Q 96 154 96 148 Z" fill="#1E1E28"/>
  <!-- 身体（白腹圆滚） -->
  <ellipse cx="93" cy="126" rx="20" ry="17" fill="url(#white)" stroke="#C8C8D0" stroke-width="0.8"/>
  <!-- 肩部黑色臂带 -->
  <path d="M 73 120 Q 78 108 88 112 L 90 122 Q 80 128 73 120 Z" fill="url(#black)"/>
  <path d="M 113 120 Q 108 108 98 112 L 96 122 Q 106 128 113 120 Z" fill="url(#black)"/>
  <!-- 黑尾（短） -->
  <circle cx="116" cy="132" r="3.4" fill="#1E1E28"/>

  <!-- 头（黑耳，黑眼圈圆眼，圆滚） -->
  <circle cx="93" cy="100" r="13" fill="url(#white)" stroke="#C8C8D0" stroke-width="0.8"/>
  <!-- 黑耳 -->
  <circle cx="80" cy="90" r="4.4" fill="url(#black)"/>
  <circle cx="106" cy="90" r="4.4" fill="url(#black)"/>
  <!-- 黑眼圈 -->
  <ellipse cx="87" cy="101" rx="4.6" ry="4" fill="url(#black)"/>
  <ellipse cx="99" cy="101" rx="4.6" ry="4" fill="url(#black)"/>
  <!-- 圆眼慵懒温和 -->
  <circle cx="87" cy="101" r="2.4" fill="#1E1008"/>
  <circle cx="99" cy="101" r="2.4" fill="#1E1008"/>
  <circle cx="87.6" cy="100.4" r="0.9" fill="#FFF"/>
  <circle cx="99.6" cy="100.4" r="0.9" fill="#FFF"/>
  <!-- 黑鼻 -->
  <ellipse cx="93" cy="106" rx="2.6" ry="1.8" fill="#1E1008"/>
  <!-- 慵懒微笑 -->
  <path d="M 88 109 Q 93 111.4 98 109" fill="none" stroke="#6E6E78" stroke-width="1" stroke-linecap="round"/>

  <!-- 前爪（抱竹笋） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 84 118 C 80 124 78 130 80 136" fill="none" stroke="#1E1E28" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="80" cy="138" r="3.6" fill="#1E1E28"/>
    <!-- 竹笋 -->
    <path d="M 76 134 Q 74 140 78 146 Q 82 148 84 144 Q 84 138 82 134 Z" fill="#D8A85E" stroke="#B88848" stroke-width="0.8"/>
    <path d="M 82 134 L 80 130" stroke="#D8A85E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 右爪（捧笋） -->
  <path d="M 102 118 C 106 124 108 130 106 136" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="106" cy="138" r="3.4" fill="#1E1E28"/>

  <!-- 啃笋碎屑 -->
  <g fill="#D8A85E" opacity="0.7">
    <circle cx="76" cy="128" r="1.2"><animate attributeName="cy" values="128;132;128" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="126" r="1"><animate attributeName="cy" values="126;130;126" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 暖阳星尘 -->
  <g fill="#FFF8E0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
