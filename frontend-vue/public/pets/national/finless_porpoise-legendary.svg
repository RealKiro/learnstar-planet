<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="江豚·五阶·长江微笑·笑着巡游长江引鱼避险带小豚回湾">
  <defs>
    <!-- 背景：长江江面夕金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E8AB0"/>
      <stop offset="52%" stop-color="#7AA8C0"/>
      <stop offset="100%" stop-color="#E0C890"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F8F0D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#D8F0F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰黑身 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#869298"/>
      <stop offset="100%" stop-color="#58646A"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 江面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5EA0C0" opacity="0.8"/>
  <g stroke="#B8E0F0" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被引避的鱼群（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="56" cy="128" rx="4" ry="2.5" fill="#C89858" stroke="#A87838" stroke-width="0.4"/>
    <ellipse cx="66" cy="132" rx="3.5" ry="2" fill="#D0A868" stroke="#B08848" stroke-width="0.4"/>
    <ellipse cx="48" cy="133" rx="3" ry="2" fill="#C89858" stroke="#A87838" stroke-width="0.4"/>
  </g>

  <!-- 被带回湾的小豚（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="130" rx="6" ry="4" fill="#6E7A80" stroke="#4E5A60" stroke-width="0.5"/>
    <circle cx="153" cy="128" r="1" fill="#2E2A24"/>
  </g>

  <!-- 长江微笑（中，笑着巡游） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 圆身 -->
    <ellipse cx="98" cy="116" rx="19" ry="13" fill="url(#body)" stroke="#3E4A50" stroke-width="1.1"/>
    <!-- 滑亮（如江光） -->
    <ellipse cx="93" cy="111" rx="11" ry="6" fill="#B0BCC0" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.25;0.4" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 头 -->
    <ellipse cx="98" cy="106" rx="11" ry="9" fill="url(#body)" stroke="#3E4A50" stroke-width="0.8"/>
    <!-- 笑脸（如阳，大上扬） -->
    <path d="M 91 110 Q 98 114.5 105 110" fill="none" stroke="#2E3A40" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 90 109.5 Q 89 108.5 90 108" stroke="#2E3A40" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 106 109.5 Q 107 108.5 106 108" stroke="#2E3A40" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 眼（含威含温） -->
    <circle cx="92" cy="104" r="2.5" fill="#2E2A24"/>
    <circle cx="92.8" cy="102.8" r="1" fill="#FFF"/>
    <circle cx="104" cy="104" r="2.5" fill="#2E2A24"/>
    <circle cx="104.8" cy="102.8" r="1" fill="#FFF"/>
    <!-- 额饰（江光） -->
    <circle cx="98" cy="97" r="2.5" fill="#F8F0D8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 胸鳍 -->
    <path d="M 84 116 L 74 124" stroke="#58646A" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 112 116 L 122 124" stroke="#58646A" stroke-width="3.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 112 116;4 112 116;-4 112 116" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 79 124 Q 68 132 58 124 L 56 134" stroke="#58646A" stroke-width="3.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 79 124;4 79 124;-4 79 124" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 引路水纹 -->
    <g stroke="#B8E0F0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 70 122 Q 62 126 58 128">
        <animate attributeName="opacity" values="0.5;0.22;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 112 128 Q 122 130 130 130">
        <animate attributeName="opacity" values="0.4;0.18;0.4" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#F8F0D8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
