<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="东北虎·一阶·虎崽初生·北境山林雪厚掌拨雪护小兽额间王纹">
  <defs>
    <!-- 背景：北境山林雪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8DC"/>
      <stop offset="52%" stop-color="#C8DCE8"/>
      <stop offset="100%" stop-color="#E8F0F4"/>
    </linearGradient>
    <!-- 雪光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#E8A848"/>
      <stop offset="100%" stop-color="#C88828"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪林 -->
  <g fill="#B8D4E4" opacity="0.6">
    <path d="M 24 148 L 32 100 L 40 148 Z"/>
    <path d="M 168 148 L 176 104 L 184 148 Z"/>
  </g>
  <!-- 飘雪 -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="40" cy="30" r="1.2">
      <animate attributeName="cy" values="30;56;30" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="20" r="1">
      <animate attributeName="cy" values="20;46;20" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E8F0F4" opacity="0.9"/>

  <!-- 被雪压的小兽（右，被拨开） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="132" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="130.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="130.8" r="1.1" fill="#2E2A24"/>
  </g>
  <!-- 拨开的雪 -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="144" cy="128" r="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 小东北虎（中，厚掌拨雪） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大耳（圆） -->
    <path d="M 84 108 L 78 98 L 90 103 Z" fill="#E8A848" stroke="#B87820" stroke-width="0.8"/>
    <path d="M 108 108 L 114 98 L 102 103 Z" fill="#E8A848" stroke="#B87820" stroke-width="0.8"/>
    <!-- 短尾（带纹） -->
    <path d="M 78 122 Q 70 118 68 126 Q 68 132 76 134" stroke="#E8A848" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 70 124 L 71 129" stroke="#2E2A24" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 身（橙黄圆润，黑纹） -->
    <ellipse cx="96" cy="122" rx="16" ry="13" fill="url(#fur)" stroke="#B87820" stroke-width="1"/>
    <!-- 黑纹 -->
    <path d="M 82 116 Q 96 112 110 116" stroke="#3E3228" stroke-width="1.4" fill="none" opacity="0.8"/>
    <path d="M 84 128 Q 96 124 108 128" stroke="#3E3228" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 90 112 L 90 118 M 102 112 L 102 118" stroke="#3E3228" stroke-width="0.9" fill="none" opacity="0.6"/>
    <!-- 腹白 -->
    <ellipse cx="94" cy="132" rx="8" ry="5" fill="#F0E8D0" opacity="0.7"/>
    <!-- 头 -->
    <ellipse cx="96" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#B87820" stroke-width="0.8"/>
    <!-- 额间王纹（隐约） -->
    <path d="M 96 100 L 96 105 M 93 103 L 99 103" stroke="#3E3228" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 眼（圆亮） -->
    <circle cx="92" cy="107" r="2.4" fill="#2E2A24"/>
    <circle cx="92.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="107" r="2.4" fill="#2E2A24"/>
    <circle cx="101.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 103 111 L 105 111 L 104 113 Z" fill="#8E6E50"/>
    <!-- 嘴（轻） -->
    <path d="M 104 114 Q 106 115.4 108 114" fill="none" stroke="#8E6E50" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 厚掌（拨雪） -->
    <path d="M 104 118 L 122 112" stroke="#E8A848" stroke-width="3.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 104 118;5 104 118;-5 104 118" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 后掌 -->
    <path d="M 84 130 L 80 137" stroke="#E8A848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 108 130 L 112 137" stroke="#E8A848" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFFFFF">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
