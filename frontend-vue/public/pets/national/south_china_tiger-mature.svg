<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="华南虎·四阶·虎啸护林·高石一啸震山林">
  <defs>
    <!-- 背景：晨光山林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEAB8"/>
      <stop offset="52%" stop-color="#AAC890"/>
      <stop offset="100%" stop-color="#86AA70"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="42%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄底毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4B65E"/>
      <stop offset="100%" stop-color="#E09A40"/>
    </linearGradient>
    <!-- 白腹 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF2DE"/>
      <stop offset="100%" stop-color="#E6DABE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="52" r="86" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 山林 -->
  <g stroke="#4E8E56" stroke-width="2.8" stroke-linecap="round" opacity="0.6">
    <path d="M 14 40 L 8 160 M 30 52 L 22 160 M 168 42 L 176 160 M 184 36 L 192 160"/>
  </g>
  <g fill="#5E9E62" opacity="0.8">
    <path d="M 12 44 Q 6 38 4 30 Q 10 36 12 44 Z"/>
    <path d="M 168 46 Q 174 40 176 32 Q 170 38 168 46 Z"/>
  </g>

  <!-- 远山 -->
  <path d="M 0 128 Q 50 116 110 124 Q 160 130 200 120 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.5"/>

  <!-- 高石（右） -->
  <path d="M 108 128 L 132 120 Q 142 120 146 128 L 158 152 L 110 152 L 104 134 Z" fill="#8E8478" stroke="#6E6858" stroke-width="1.2"/>
  <path d="M 112 132 Q 124 126 142 128" stroke="#A8A090" stroke-width="1.2" opacity="0.6" fill="none"/>
  <path d="M 118 150 Q 130 146 146 150" stroke="#A8A090" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 伐木人（左下，踉跄而退，斧落地） -->
  <g>
    <path d="M 40 138 Q 44 146 46 152" stroke="#6E5A3E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M 44 146 L 38 144" stroke="#6E5A3E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 斧（落地） -->
    <path d="M 30 150 L 44 146" stroke="#4E5E3E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 28 152 L 36 154 L 34 158 L 27 156 Z" fill="#8E7A5E"/>
    <!-- 头（惊惶回望） -->
    <circle cx="45" cy="132" r="4" fill="#8E7A5E"/>
    <!-- 惊退的衣摆 -->
    <path d="M 40 146 Q 36 150 32 152" stroke="#6E5A3E" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5E9456" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#7EB472" stroke-width="1.4" opacity="0.6"/>

  <!-- 虎啸声波（从虎口向左下扩散） -->
  <g stroke="#FFF8E0" fill="none" stroke-linecap="round" opacity="0.8">
    <g>
      <path d="M 70 104 Q 60 96 56 84 Q 54 76 58 70"/>
      <path d="M 78 112 Q 64 102 58 86 Q 55 74 61 62"/>
      <path d="M 86 120 Q 70 108 62 90 Q 57 74 65 56"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.28" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M 76 108 Q 68 100 66 90 Q 65 82 68 76"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.2" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 青年虎（5头身，立于高石，虎啸震山） -->
  <!-- 后腿（踞石） -->
  <path d="M 118 126 L 112 142 L 118 148 L 128 130 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 身体 -->
  <path d="M 100 104 Q 96 120 106 132 Q 118 138 128 130 Q 134 118 130 102 Q 118 96 100 104 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 白腹 -->
  <path d="M 106 112 Q 102 124 112 130 Q 120 134 124 126 Q 126 118 120 110 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 墨纹（威仪） -->
  <path d="M 100 110 Q 106 113 110 110 M 98 118 Q 106 121 114 118 M 126 108 Q 130 111 132 108" stroke="#2E1E10" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- 前肢（撑石，蓄啸） -->
  <path d="M 108 120 C 102 126 100 130 100 136" fill="none" stroke="url(#fur)" stroke-width="5.4" stroke-linecap="round"/>
  <circle cx="100" cy="138" r="3.6" fill="#F4B65E"/>
  <path d="M 126 118 C 132 124 134 128 134 134" fill="none" stroke="url(#fur)" stroke-width="5.4" stroke-linecap="round"/>
  <circle cx="135" cy="136" r="3.6" fill="#F4B65E"/>

  <!-- 尾巴（如鞭，扬起） -->
  <path d="M 128 124 Q 142 116 148 104" stroke="url(#fur)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <path d="M 130 122 Q 142 115 147 106" stroke="#2E1E10" stroke-width="1.7" stroke-linecap="round" fill="none" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 128 124;-8 128 124;0 128 124" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，王字如炬，张口长啸） -->
  <g>
    <ellipse cx="112" cy="90" rx="14" ry="13" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
    <!-- 虎耳 -->
    <circle cx="99" cy="80" r="4.6" fill="url(#fur)" stroke="#A87828" stroke-width="0.8"/>
    <circle cx="99" cy="80" r="2.3" fill="#FAF2DE"/>
    <circle cx="126" cy="80" r="4.6" fill="url(#fur)" stroke="#A87828" stroke-width="0.8"/>
    <circle cx="126" cy="80" r="2.3" fill="#FAF2DE"/>
    <!-- 额间王字 -->
    <path d="M 106 77 L 118 77 M 106 80 L 118 80 M 106 83 L 118 83 M 112 77 L 112 83" stroke="#2E1E10" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- 白口鼻 -->
    <ellipse cx="108" cy="99" rx="9" ry="5.5" fill="url(#belly)" stroke="#C8BCA0" stroke-width="0.5"/>
    <!-- 虎目（如炬，怒视） -->
    <path d="M 102 88 Q 107 85 112 88 M 108 88 Q 113 85 118 88" stroke="#2E1E10" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="104" cy="89" r="3.2" fill="#F8B84E"/>
    <circle cx="104" cy="89" r="1.7" fill="#2E1E10"/>
    <circle cx="104.6" cy="88.6" r="0.8" fill="#FFF8E0"/>
    <circle cx="117" cy="89" r="3.2" fill="#F8B84E"/>
    <circle cx="117" cy="89" r="1.7" fill="#2E1E10"/>
    <circle cx="117.6" cy="88.6" r="0.8" fill="#FFF8E0"/>
    <!-- 皱鼻怒纹 -->
    <path d="M 101 92 Q 104 94 108 92 M 108 92 Q 112 94 116 92" stroke="#2E1E10" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 鼻 -->
    <ellipse cx="105" cy="97" rx="2.4" ry="1.8" fill="#6E3618"/>
    <!-- 张口长啸 -->
    <path d="M 97 101 Q 104 108 112 102 Q 106 110 97 106 Z" fill="#6E3618" stroke="#8E5A32" stroke-width="0.8"/>
    <path d="M 99 105 L 100 103" stroke="#FAF2DE" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 102 106 L 103 104" stroke="#FAF2DE" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 106 107 L 107 105" stroke="#FAF2DE" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 虎须 -->
    <path d="M 98 100 L 88 98 M 97 102 L 86 103 M 116 98 L 124 97 M 117 100 L 126 101" stroke="#FAF2DE" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 震落的叶（虎啸余威） -->
  <g fill="#7EAA6E">
    <path d="M 52 88 Q 56 84 60 86 Q 58 90 54 90 Q 52 89 52 88 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 12;0 0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 72 Q 154 68 158 70 Q 156 74 152 74 Q 150 73 150 72 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 14;0 0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8D8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
