<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小熊猫·二阶·尾被嘲笑·追竹虫尾绊摔跤小兽笑团红脸看沾土尾">
  <defs>
    <!-- 背景：竹林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#98B868"/>
      <stop offset="52%" stop-color="#B0C880"/>
      <stop offset="100%" stop-color="#7AA858"/>
    </linearGradient>
    <!-- 雾光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="44%">
      <stop offset="0%" stop-color="#E8F0D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 红褐毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#C06840"/>
      <stop offset="100%" stop-color="#984820"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="68" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 竹林 -->
  <g stroke="#5A9868" stroke-width="5" stroke-linecap="round">
    <path d="M 26 148 L 30 42"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7AA858" opacity="0.9"/>
  <!-- 竹根（绊倒） -->
  <path d="M 96 148 Q 100 140 108 144" stroke="#6E9858" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 竹上笑的小兽（右） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="112" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="110.8" r="1" fill="#2E2A24"/>
    <circle cx="155" cy="110.8" r="1" fill="#2E2A24"/>
    <path d="M 149 114 Q 151 115.6 153 114" fill="none" stroke="#A88858" stroke-width="0.5" stroke-linecap="round"/>
  </g>

  <!-- 摔跤的小熊猫（左，看尾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 蓬尾（沾土，垂） -->
    <path d="M 66 132 Q 56 130 54 138 Q 56 144 66 142" fill="url(#fur)" stroke="#7A3A18" stroke-width="0.7"/>
    <path d="M 58 134 L 58 140" stroke="#6E5A3E" stroke-width="1.2" fill="none" opacity="0.7"/>
    <!-- 身（摔坐） -->
    <ellipse cx="72" cy="132" rx="12" ry="10" fill="url(#fur)" stroke="#7A3A18" stroke-width="0.8" transform="rotate(-8 72 132)"/>
    <!-- 头（红脸） -->
    <ellipse cx="72" cy="120" rx="9" ry="8" fill="#E8DCC8" stroke="#C8B89A" stroke-width="0.6" transform="rotate(-8 72 120)"/>
    <!-- 泪纹（红褐，垂） -->
    <path d="M 67 120 Q 69 122 67 124" stroke="#C06840" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 77 120 Q 75 122 77 124" stroke="#C06840" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 眼（含沮） -->
    <circle cx="69" cy="119" r="2" fill="#2E2A24"/>
    <circle cx="69.8" cy="117.8" r="0.8" fill="#FFF"/>
    <circle cx="76" cy="119" r="2" fill="#2E2A24"/>
    <circle cx="76.8" cy="117.8" r="0.8" fill="#FFF"/>
    <circle cx="70" cy="118.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 72 123 L 72 125 Z" stroke="#7A3A18" stroke-width="1" stroke-linecap="round"/>
    <!-- 嘴（低垂） -->
    <path d="M 70 126 Q 72 124.6 74 126" fill="none" stroke="#7A3A18" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 短爪 -->
    <path d="M 62 136 L 58 140" stroke="#984820" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 82 136 L 86 140" stroke="#984820" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#E8F0D0" opacity="0.35">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
