<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="丹顶鹤·一阶·雏鹤破壳·蹭母朱红学步">
  <defs>
    <!-- 背景：湿地晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4DCC8"/>
      <stop offset="52%" stop-color="#A0C2AE"/>
      <stop offset="100%" stop-color="#80A68E"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="42%" cy="30%" r="54%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 母鹤白羽 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E2E6F0"/>
    </linearGradient>
    <!-- 雏鹤绒毛 -->
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C088"/>
      <stop offset="100%" stop-color="#B89A5E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="60" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 芦苇（两侧） -->
  <g stroke="#5E8E6E" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 18 40 Q 16 96 10 160 M 34 52 Q 30 104 26 160"/>
  </g>
  <g fill="#C8A86E">
    <ellipse cx="14" cy="38" rx="4" ry="7" opacity="0.9"/>
    <ellipse cx="30" cy="50" rx="4" ry="7" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1 1;0 0" dur="3.4s" repeatCount="indefinite"/>
  </g>

  <!-- 水面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E9A88" opacity="0.7"/>
  <path d="M 0 150 L 200 150" stroke="#9CC2B2" stroke-width="1.4" opacity="0.6"/>
  <path d="M 20 158 Q 40 156 60 158 M 120 162 Q 140 160 168 162" stroke="#EAF8F2" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 破壳（雏鹤旁） -->
  <path d="M 70 140 Q 76 132 82 138 Q 78 144 74 142 Z" fill="#E4E0D4" stroke="#C8C0AE" stroke-width="0.8"/>
  <path d="M 48 142 Q 44 136 50 132 Q 54 138 52 142 Z" fill="#E4E0D4" stroke="#C8C0AE" stroke-width="0.8"/>

  <!-- 雏鹤（破壳学步，绒毛还湿，蹒跚却站直） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 小爪 -->
    <path d="M 58 146 L 56 148 M 62 146 L 64 148" stroke="#B89050" stroke-width="1" stroke-linecap="round"/>
    <!-- 身体（绒球） -->
    <ellipse cx="60" cy="136" rx="9" ry="8" fill="url(#down)" stroke="#A8884E" stroke-width="0.8"/>
    <!-- 细翅 -->
    <path d="M 52 134 Q 46 130 44 124" stroke="#C8AC72" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 头（初显朱红） -->
    <circle cx="60" cy="125" r="6.5" fill="url(#down)" stroke="#A8884E" stroke-width="0.8"/>
    <circle cx="60" cy="121" r="1.7" fill="#D84A30" opacity="0.85"/>
    <!-- 黑颈雏迹 -->
    <ellipse cx="60" cy="128" rx="2.4" ry="2.2" fill="#4A4E5A" opacity="0.7"/>
    <!-- 喙（长喙初显） -->
    <path d="M 55 126 L 50 124 L 53 127 Z" fill="#8E96A2"/>
    <!-- 小眼（湿漉漉，望母鹤） -->
    <circle cx="57" cy="124" r="1.3" fill="#24180E"/>
    <circle cx="57.4" cy="123.8" r="0.4" fill="#FFF"/>
  </g>

  <!-- 母鹤（高挑，垂首望向雏鹤，头顶朱红） -->
  <!-- 腿 -->
  <path d="M 108 128 L 106 150" stroke="#8E96A2" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 118 126 L 120 150" stroke="#8E96A2" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 身体（白羽） -->
  <ellipse cx="112" cy="118" rx="17" ry="11" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
  <!-- 翅尖墨羽 -->
  <path d="M 126 112 Q 136 108 140 114 Q 136 118 130 118 Z" fill="#2A2E3A"/>
  <path d="M 96 112 Q 86 108 84 114 Q 88 118 94 118 Z" fill="#2A2E3A" opacity="0.7"/>
  <!-- 黑颈（垂首，S 形） -->
  <path d="M 112 108 C 116 96 120 88 112 78 C 106 70 96 66 92 74 C 90 80 94 84 100 82" fill="none" stroke="#2A2E3A" stroke-width="7" stroke-linecap="round"/>
  <!-- 头（黑颈白头，朱红冠） -->
  <circle cx="94" cy="74" r="5.5" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <circle cx="95" cy="70" r="2.2" fill="#D84A30"/>
  <!-- 喙（垂向雏鹤） -->
  <path d="M 89 75 L 78 80 L 89 78 Z" fill="#6E7682"/>
  <!-- 丹凤眼（温柔望雏鹤） -->
  <path d="M 96 73 Q 98 72 100 73" stroke="#24180E" stroke-width="1" stroke-linecap="round" fill="none"/>
  <circle cx="99" cy="73" r="1" fill="#24180E"/>
  <!-- 尾羽 -->
  <path d="M 128 116 Q 138 118 142 122" stroke="#E2E6F0" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M 130 120 Q 140 122 144 126" stroke="#E2E6F0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 幼鹤在母鹤影下（安心） -->
  <path d="M 72 150 L 132 150" stroke="#2A3A44" stroke-width="1.6" opacity="0.25"/>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
