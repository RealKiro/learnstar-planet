<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大熊猫·五阶·竹林之王·坐竹深处护坡守笋">
  <defs>
    <!-- 背景：竹林深处 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E9E6E"/>
      <stop offset="52%" stop-color="#568658"/>
      <stop offset="100%" stop-color="#3E6E44"/>
    </linearGradient>
    <!-- 斑驳光 -->
    <radialGradient id="glow" cx="40%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#E8F0C8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 竹气 -->
    <radialGradient id="green" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#A8D888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8D888" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#1E1E28"/>
    </linearGradient>
    <!-- 白毛如雪 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E0E0E8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 斑驳光 -->
  <circle cx="80" cy="56" r="68" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 竹气 -->
  <circle cx="100" cy="104" r="70" fill="url(#green)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 满坡翠竹 -->
  <g stroke="#4E7E4E" stroke-width="2.6" stroke-linecap="round" opacity="0.6">
    <path d="M 18 40 L 12 160 M 186 38 L 178 160 M 36 60 L 28 160 M 162 58 L 170 160"/>
    <path d="M 22 60 L 14 74 M 178 58 L 186 72 M 34 80 L 26 92 M 166 78 L 174 90"/>
  </g>
  <!-- 竹叶 -->
  <g fill="#6EA868" opacity="0.75">
    <path d="M 16 44 Q 10 40 8 34 Q 14 36 16 44 Z"/>
    <path d="M 184 42 Q 190 38 192 32 Q 186 34 184 42 Z"/>
    <path d="M 34 64 Q 28 60 26 54 Q 32 56 34 64 Z"/>
  </g>

  <!-- 坡地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#3E6E44" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#5E8E5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 小辈（右，抱竹打滚） -->
  <g opacity="0.75">
    <circle cx="158" cy="140" r="7" fill="#F0F0F2"/>
    <circle cx="152" cy="135" r="2.4" fill="#1E1E28"/>
    <circle cx="164" cy="135" r="2.4" fill="#1E1E28"/>
    <circle cx="158" cy="137" r="1.6" fill="#1E1008"/>
    <circle cx="158" cy="138" r="0.8" fill="#FFF"/>
    <path d="M 158 140 L 158 144" stroke="#6EA868" stroke-width="1.2"/>
    <animateTransform attributeName="transform" type="rotate" values="-4 158 140;4 158 140;-4 158 140" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- 大熊猫（2头身，坐竹深处石上，雍容） -->
  <!-- 腿（坐） -->
  <path d="M 80 148 Q 86 152 94 148 Q 96 144 92 142 Q 86 146 80 142 Z" fill="#1E1E28"/>
  <path d="M 102 148 Q 108 152 114 148 Q 116 144 112 142 Q 106 146 100 142 Z" fill="#1E1E28"/>
  <!-- 身体 -->
  <ellipse cx="96" cy="124" rx="21" ry="18" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 腹白如雪 -->
  <ellipse cx="96" cy="128" rx="13" ry="11" fill="#FCFCFE" opacity="0.6"/>
  <!-- 肩带如墨 -->
  <path d="M 75 120 Q 80 106 91 110 L 93 122 Q 82 128 75 120 Z" fill="url(#black)"/>
  <path d="M 117 120 Q 112 106 101 110 L 99 122 Q 110 128 117 120 Z" fill="url(#black)"/>
  <!-- 黑尾 -->
  <circle cx="120" cy="130" r="3.4" fill="#1E1E28"/>

  <!-- 头（黑耳圆立，圆眼沉稳） -->
  <circle cx="96" cy="98" r="13.5" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 黑耳 -->
  <circle cx="82" cy="87" r="4.6" fill="url(#black)"/>
  <circle cx="110" cy="87" r="4.6" fill="url(#black)"/>
  <!-- 黑眼圈 -->
  <ellipse cx="90" cy="99" rx="4.8" ry="4.2" fill="url(#black)"/>
  <ellipse cx="102" cy="99" rx="4.8" ry="4.2" fill="url(#black)"/>
  <!-- 圆眼沉稳（微眯） -->
  <path d="M 87 99 Q 90 97.2 93 99 Q 90 100.8 87 99 Z" fill="#1E1008"/>
  <path d="M 99 99 Q 102 97.2 105 99 Q 102 100.8 99 99 Z" fill="#1E1008"/>
  <circle cx="88.6" cy="98.4" r="0.8" fill="#E8F0C8"/>
  <circle cx="103.4" cy="98.4" r="0.8" fill="#E8F0C8"/>
  <!-- 黑鼻 -->
  <ellipse cx="96" cy="104" rx="2.6" ry="1.8" fill="#1E1008"/>
  <!-- 雍容抿唇 -->
  <path d="M 91 107 Q 96 109.4 101 107" fill="none" stroke="#6E6E78" stroke-width="1" stroke-linecap="round"/>

  <!-- 前爪（搭膝，长者） -->
  <path d="M 88 116 C 82 122 80 128 82 134" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="82" cy="136" r="3.4" fill="#1E1E28"/>
  <!-- 右爪（扶石） -->
  <path d="M 106 116 C 110 122 112 128 110 134" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="110" cy="136" r="3.4" fill="#1E1E28"/>

  <!-- 竹气星尘 -->
  <g fill="#A8D888">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
