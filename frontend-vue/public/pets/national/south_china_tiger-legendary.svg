<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="华南虎·五阶·山林之王·月夜巡山护小兽">
  <defs>
    <!-- 背景：月夜山巅 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2E52"/>
      <stop offset="52%" stop-color="#1A2846"/>
      <stop offset="100%" stop-color="#16223E"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="glow" cx="70%" cy="24%" r="46%">
      <stop offset="0%" stop-color="#F4F8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F4F8FF" stop-opacity="0"/>
    </radialGradient>
    <!-- 王者光晕 -->
    <radialGradient id="halo" cx="50%" cy="56%" r="40%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄底毛（夜色镀金） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B05A"/>
      <stop offset="100%" stop-color="#D0903A"/>
    </linearGradient>
    <!-- 白腹 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E0CC"/>
      <stop offset="100%" stop-color="#D2C8AC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="140" cy="48" r="15" fill="#F4F8FF"/>
  <circle cx="134" cy="44" r="3" fill="#DCE4F4" opacity="0.7"/>
  <circle cx="147" cy="54" r="2.2" fill="#DCE4F4" opacity="0.6"/>
  <circle cx="140" cy="34" r="58" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 王者光晕 -->
  <circle cx="84" cy="104" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 夜林剪影 -->
  <g stroke="#24304A" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 12 40 L 4 160 M 26 48 L 18 160 M 178 40 L 188 160"/>
  </g>
  <!-- 林鸟不惊（静栖枝头） -->
  <g fill="#3A4866">
    <ellipse cx="20" cy="34" rx="3.2" ry="2.4"/>
    <path d="M 22 33 L 27 31 L 24 35 Z" fill="#3A4866"/>
    <ellipse cx="180" cy="30" rx="3" ry="2.2"/>
    <path d="M 182 29 L 177 27 L 180 31 Z" fill="#3A4866"/>
  </g>

  <!-- 远山（月色） -->
  <path d="M 0 130 Q 50 118 110 126 Q 160 132 200 122 L 200 200 L 0 200 Z" fill="#22304E" opacity="0.8"/>
  <path d="M 0 130 Q 50 118 110 126 Q 160 132 200 122" stroke="#5A6E92" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- 山巅（王者所立） -->
  <path d="M 44 150 L 72 128 Q 82 122 92 124 L 128 128 Q 140 130 146 138 L 156 152 L 40 152 Z" fill="#2A3856" stroke="#4A5E7E" stroke-width="1.2"/>
  <path d="M 60 144 Q 90 132 128 136" stroke="#4A5E7E" stroke-width="1" opacity="0.6" fill="none"/>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#182440" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#4A5C7E" stroke-width="1.2" opacity="0.5"/>

  <!-- 落难小兽（伏在虎侧，受庇护） -->
  <g>
    <ellipse cx="118" cy="140" rx="7" ry="5" fill="#A08A6E"/>
    <circle cx="113" cy="136" r="3.4" fill="#B09A7E"/>
    <circle cx="111" cy="135" r="1" fill="#24180E"/>
    <circle cx="115" cy="135" r="1" fill="#24180E"/>
    <path d="M 116 134 L 118 131" stroke="#B09A7E" stroke-width="1" stroke-linecap="round"/>
    <path d="M 119 137 L 125 136 M 119 139 L 126 139" stroke="#C8B89C" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M 112 139 Q 116 138 120 139" stroke="#8E7A5E" stroke-width="0.8" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <!-- 虎啸生风（风线） -->
  <g stroke="#F4F8FF" stroke-width="1.2" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 46 60 Q 56 56 66 60">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 148 64 Q 158 60 168 66">
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山林之王（5头身，立于山巅，巡山之姿） -->
  <!-- 后腿（踞石） -->
  <path d="M 84 122 L 78 138 L 86 144 L 96 126 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 身体（挺立，王者之姿） -->
  <path d="M 68 100 Q 62 118 74 130 Q 86 138 98 130 Q 104 118 100 100 Q 86 92 68 100 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 白腹 -->
  <path d="M 76 108 Q 72 120 82 126 Q 92 130 96 122 Q 98 114 92 106 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 墨纹（威严） -->
  <path d="M 68 106 Q 74 109 78 106 M 66 114 Q 74 117 82 114 M 96 104 Q 100 107 102 104 M 99 112 Q 103 115 105 112" stroke="#2E1E10" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- 前肢（撑立，护于小兽前） -->
  <path d="M 78 118 C 72 124 70 128 70 136" fill="none" stroke="url(#fur)" stroke-width="5.4" stroke-linecap="round"/>
  <circle cx="70" cy="138" r="3.6" fill="#E8B05A"/>
  <path d="M 98 116 C 104 122 106 128 106 134" fill="none" stroke="url(#fur)" stroke-width="5.4" stroke-linecap="round"/>
  <circle cx="107" cy="136" r="3.6" fill="#E8B05A"/>

  <!-- 尾巴（如鞭，扬起） -->
  <path d="M 98 122 Q 112 114 118 102" stroke="url(#fur)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <path d="M 100 120 Q 112 113 117 104" stroke="#2E1E10" stroke-width="1.7" stroke-linecap="round" fill="none" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 98 122;-6 98 122;0 98 122" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，王字威严，虎目含威，俯视山林） -->
  <g>
    <ellipse cx="84" cy="88" rx="14" ry="13" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
    <!-- 虎耳 -->
    <circle cx="71" cy="78" r="4.6" fill="url(#fur)" stroke="#A87828" stroke-width="0.8"/>
    <circle cx="71" cy="78" r="2.3" fill="#E8E0CC"/>
    <circle cx="98" cy="78" r="4.6" fill="url(#fur)" stroke="#A87828" stroke-width="0.8"/>
    <circle cx="98" cy="78" r="2.3" fill="#E8E0CC"/>
    <!-- 额间王字 -->
    <path d="M 78 75 L 90 75 M 78 78 L 90 78 M 78 81 L 90 81 M 84 75 L 84 81" stroke="#2E1E10" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- 白口鼻 -->
    <ellipse cx="84" cy="97" rx="9" ry="5.5" fill="url(#belly)" stroke="#BEB49C" stroke-width="0.5"/>
    <!-- 虎目（含威，虎目如炬） -->
    <path d="M 77 86 Q 81 83 85 86 M 83 86 Q 87 83 91 86" stroke="#2E1E10" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <circle cx="79" cy="87" r="3.1" fill="#F8B84E"/>
    <circle cx="79" cy="87" r="1.6" fill="#2E1E10"/>
    <circle cx="79.6" cy="86.6" r="0.8" fill="#FFF8E0"/>
    <circle cx="89" cy="87" r="3.1" fill="#F8B84E"/>
    <circle cx="89" cy="87" r="1.6" fill="#2E1E10"/>
    <circle cx="89.6" cy="86.6" r="0.8" fill="#FFF8E0"/>
    <!-- 鼻 -->
    <ellipse cx="84" cy="95" rx="2.3" ry="1.8" fill="#6E3618"/>
    <!-- 抿唇（沉静威严） -->
    <path d="M 79 100 Q 84 102.6 89 100" fill="none" stroke="#8E5A32" stroke-width="1" stroke-linecap="round"/>
    <!-- 虎须 -->
    <path d="M 76 97 L 68 96 M 76 99 L 67 100 M 92 97 L 100 96 M 92 99 L 101 100" stroke="#E8E0CC" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 月光星尘 -->
  <g fill="#F4F8FF">
    <circle cx="34" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
