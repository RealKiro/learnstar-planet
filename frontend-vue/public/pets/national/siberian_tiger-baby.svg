<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="东北虎·二阶·王字之惑·蛮力抢占地盘撞伤同伴站原地">
  <defs>
    <!-- 背景：山林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C0CC"/>
      <stop offset="52%" stop-color="#B8CCD4"/>
      <stop offset="100%" stop-color="#D8E4E8"/>
    </linearGradient>
    <!-- 弱雪光 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="44%">
      <stop offset="0%" stop-color="#F0F4F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0F4F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#D89838"/>
      <stop offset="100%" stop-color="#B07018"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="72" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#D8E4E8" opacity="0.9"/>

  <!-- 被撞倒的同伴（右，受伤） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="150" cy="132" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="148" cy="130.8" r="1.1" fill="#2E2A24"/>
    <circle cx="153" cy="130.8" r="1.1" fill="#2E2A24"/>
    <!-- 受伤眼 -->
    <circle cx="154" cy="129.5" r="1" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 152 136 L 155 138" stroke="#D87868" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 站原地的小东北虎（左，愧疚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 大耳 -->
    <path d="M 64 112 L 60 104 L 70 108 Z" fill="#D89838" stroke="#9E5E10" stroke-width="0.7"/>
    <path d="M 84 112 L 88 104 L 78 108 Z" fill="#D89838" stroke="#9E5E10" stroke-width="0.7"/>
    <!-- 短尾（垂） -->
    <path d="M 58 124 Q 50 128 52 134 Q 56 138 62 134" stroke="#D89838" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 身 -->
    <ellipse cx="72" cy="132" rx="14" ry="11" fill="url(#fur)" stroke="#9E5E10" stroke-width="0.9"/>
    <!-- 黑纹（乱） -->
    <path d="M 60 126 Q 72 122 84 126" stroke="#3E3228" stroke-width="1.2" fill="none" opacity="0.7"/>
    <!-- 头（低垂） -->
    <ellipse cx="72" cy="120" rx="9" ry="8" fill="url(#fur)" stroke="#9E5E10" stroke-width="0.8" transform="rotate(-6 72 120)"/>
    <!-- 额间王纹 -->
    <path d="M 72 113 L 72 117 M 69 115 L 75 115" stroke="#3E3228" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <!-- 眼（含愧） -->
    <circle cx="68" cy="119" r="2.2" fill="#2E2A24"/>
    <circle cx="68.8" cy="117.8" r="0.9" fill="#FFF"/>
    <circle cx="77" cy="119" r="2.2" fill="#2E2A24"/>
    <circle cx="77.8" cy="117.8" r="0.9" fill="#FFF"/>
    <circle cx="69" cy="118.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 79 123 L 81 123 L 80 125 Z" fill="#7A5A3E"/>
    <!-- 嘴（低垂） -->
    <path d="M 80 126 Q 78 124.6 76 126" fill="none" stroke="#7A5A3E" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 厚掌（垂） -->
    <path d="M 62 138 L 58 143" stroke="#D89838" stroke-width="3" stroke-linecap="round"/>
    <path d="M 82 138 L 86 143" stroke="#D89838" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#F0F4F8" opacity="0.35">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
