<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="丹顶鹤·三阶·展翅苦修·云海振翅穿云向朝阳">
  <defs>
    <!-- 背景：云海天青 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8E8"/>
      <stop offset="52%" stop-color="#8AAED8"/>
      <stop offset="100%" stop-color="#7A9EC8"/>
    </linearGradient>
    <!-- 朝阳金 -->
    <radialGradient id="glow" cx="30%" cy="66%" r="46%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E0E6F0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 朝阳（左） -->
  <circle cx="46" cy="142" r="18" fill="#FFE8A0" opacity="0.95"/>
  <circle cx="46" cy="142" r="62" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.7;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 千里河山（云海之下） -->
  <g fill="#5E86B0" opacity="0.7">
    <path d="M 0 128 L 36 106 L 66 126 L 96 100 L 128 128 L 164 110 L 200 130 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 36 106 L 66 126 L 96 100" stroke="#8AB0D8" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 云海 -->
  <g fill="#E8EFF8" opacity="0.9">
    <path d="M 0 138 Q 30 128 60 136 Q 90 144 120 136 Q 150 128 180 136 L 200 132 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.85">
    <path d="M 24 140 Q 48 132 76 140 Q 100 146 128 138 Q 156 130 188 140 L 200 138 L 200 200 L 0 200 Z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- 穿云的云缕（掠过翅） -->
  <g stroke="#F6FAFE" stroke-width="2.4" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 40 108 Q 60 102 82 106">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 白羽鹤（4头身，振翅穿云，朝朝阳） -->
  <!-- 腿（后掠） -->
  <path d="M 116 100 L 128 112 M 118 100 L 132 108" stroke="#6E7682" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 尾羽 -->
  <path d="M 118 94 Q 130 92 134 90" stroke="#E0E6F0" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 116 98 Q 130 98 136 96" stroke="#2A2E3A" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 身体（流线） -->
  <ellipse cx="104" cy="92" rx="18" ry="9" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>

  <!-- 后翅（上，扇动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-18 104 84;-32 104 84;-18 104 84" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 100 84 Q 120 52 158 42 Q 150 62 128 74 Q 112 82 100 84 Z" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
    <path d="M 132 52 Q 150 46 158 42 Q 154 54 142 58 Q 134 56 132 52 Z" fill="#2A2E3A"/>
  </g>
  <!-- 前翅（下，扇动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-10 108 88;-22 108 88;-10 108 88" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 106 88 Q 92 64 58 56 Q 66 76 88 82 Q 100 86 106 88 Z" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
    <path d="M 74 64 Q 56 58 58 56 Q 62 68 74 70 Q 76 66 74 64 Z" fill="#2A2E3A"/>
  </g>

  <!-- 长颈（前伸，向朝阳） -->
  <path d="M 92 90 C 84 86 78 80 76 72" fill="none" stroke="#4A4E5A" stroke-width="6.4" stroke-linecap="round"/>
  <!-- 头 -->
  <circle cx="75" cy="70" r="5" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <circle cx="77" cy="67" r="2" fill="#D84A30"/>
  <!-- 喙（朝前） -->
  <path d="M 71 71 L 62 68 L 71 74 Z" fill="#6E7682"/>
  <!-- 丹凤眼（坚定） -->
  <circle cx="73" cy="70" r="1" fill="#24180E"/>
  <path d="M 71 68 Q 73 67 75 68" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="120" cy="54">
      <animate attributeName="cy" values="54;44;54" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="72">
      <animate attributeName="cy" values="72;62;72" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
