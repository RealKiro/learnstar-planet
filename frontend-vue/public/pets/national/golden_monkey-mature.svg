<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金丝猴·四阶·护群初成·背起小猴荡过险境">
  <defs>
    <!-- 背景：林间暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFD8A8"/>
      <stop offset="52%" stop-color="#A0C08C"/>
      <stop offset="100%" stop-color="#82A872"/>
    </linearGradient>
    <!-- 暖阳金 -->
    <radialGradient id="glow" cx="60%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 金色长毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECBC56"/>
      <stop offset="100%" stop-color="#CC9C3C"/>
    </linearGradient>
    <!-- 蓝面 -->
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9EB8E8"/>
      <stop offset="100%" stop-color="#7E96C8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暖阳 -->
  <circle cx="120" cy="52" r="66" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 林间树影 -->
  <g stroke="#6E8E5E" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
    <path d="M 24 44 Q 22 100 16 160 M 180 40 Q 182 98 176 160"/>
    <path d="M 28 64 L 18 76 M 176 62 L 186 74"/>
  </g>

  <!-- 藤蔓（荡过） -->
  <path d="M 20 40 Q 60 28 100 44 Q 130 56 150 44" stroke="#5E8E52" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 前方族群（右，重聚欢呼） -->
  <g opacity="0.6">
    <circle cx="164" cy="118" r="6" fill="#E8B84E"/>
    <ellipse cx="162" cy="116" rx="4.4" ry="3.6" fill="#9EB8E8"/>
    <circle cx="159" cy="115" r="1.4" fill="#1E1008"/>
    <circle cx="165" cy="115" r="1.4" fill="#1E1008"/>
    <path d="M 170 114 L 174 110" stroke="#C89636" stroke-width="1" stroke-linecap="round"/>
    <circle cx="148" cy="130" r="5.4" fill="#E8B84E"/>
    <ellipse cx="146" cy="128" rx="4" ry="3.2" fill="#9EB8E8"/>
    <path d="M 144 126 L 141 123" stroke="#C89636" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#88AE76" stroke-width="1.4" opacity="0.6"/>

  <!-- 金毛小猴（3头身，背着小猴荡过） -->
  <!-- 腿（荡起） -->
  <path d="M 88 128 L 82 146 L 88 148 L 94 130 Z" fill="#B88A30"/>
  <path d="M 104 126 L 112 142 L 108 146 L 100 130 Z" fill="#B88A30"/>
  <!-- 身体 -->
  <path d="M 82 98 Q 78 116 86 132 Q 96 138 104 132 Q 110 116 106 98 Q 94 92 82 98 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 背上小猴（受困者） -->
  <g opacity="0.9">
    <circle cx="98" cy="90" r="6" fill="#E0B04A"/>
    <ellipse cx="96" cy="88" rx="4.4" ry="3.6" fill="#9EB8E8"/>
    <circle cx="93" cy="87" r="1.4" fill="#1E1008"/>
    <circle cx="99" cy="87" r="1.4" fill="#1E1008"/>
    <path d="M 100 87 L 104 84" stroke="#C89636" stroke-width="1" stroke-linecap="round"/>
    <path d="M 94 92 L 88 94 M 102 92 L 108 94" stroke="#C89636" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- 尾巴 -->
  <path d="M 108 126 Q 118 116 122 106" stroke="#CC9C3C" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 108 126;12 108 126;0 108 126" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（蓝面含笑，圆眼泛红） -->
  <ellipse cx="90" cy="92" rx="11" ry="10.5" fill="url(#fur)" stroke="#A87828" stroke-width="0.9"/>
  <!-- 金毛 -->
  <path d="M 82 86 Q 80 80 84 78 M 98 86 Q 102 80 98 78" stroke="#CC9C3C" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 圆耳 -->
  <circle cx="80" cy="84" r="3.4" fill="#ECBC56" stroke="#A87828" stroke-width="0.7"/>
  <circle cx="100" cy="84" r="3.4" fill="#ECBC56" stroke="#A87828" stroke-width="0.7"/>
  <!-- 蓝面 -->
  <ellipse cx="90" cy="96" rx="8.5" ry="6.5" fill="url(#face)" stroke="#6E86B8" stroke-width="0.6"/>
  <!-- 圆眼含笑泛红 -->
  <path d="M 85 93 Q 88 91 91 93 Q 88 95 85 93 Z" fill="#1E1008"/>
  <path d="M 95 93 Q 92 91 89 93 Q 92 95 95 93 Z" fill="#1E1008"/>
  <!-- 泪光（喜悦） -->
  <path d="M 83 94 Q 82 96 83 98" stroke="#C8E8F8" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <animate attributeName="cy" values="94;99;94" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 朝天鼻 -->
  <ellipse cx="90" cy="97" rx="2.8" ry="2.2" fill="#5E6E9E"/>
  <!-- 含笑 -->
  <path d="M 85 101 Q 90 103.6 95 101" fill="none" stroke="#8E6A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（抓藤） -->
  <path d="M 84 102 C 76 106 72 110 70 116" fill="none" stroke="#CC9C3C" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="69" cy="118" r="3" fill="#D8A85E"/>
  <!-- 握藤 -->
  <line x1="69" y1="116" x2="60" y2="108" stroke="#5E8E52" stroke-width="2" stroke-linecap="round"/>

  <!-- 右手（护背上小猴） -->
  <path d="M 102 102 C 108 98 112 94 114 88" fill="none" stroke="#CC9C3C" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="115" cy="86" r="2.8" fill="#D8A85E"/>

  <!-- 暖阳星尘 -->
  <g fill="#FFF8E0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
