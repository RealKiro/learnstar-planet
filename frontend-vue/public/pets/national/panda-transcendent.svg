<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大熊猫·六阶·国宝传说·竹海中央抱笋慢啃">
  <defs>
    <!-- 背景：竹海暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D89A"/>
      <stop offset="52%" stop-color="#88BE7C"/>
      <stop offset="100%" stop-color="#6EA462"/>
    </linearGradient>
    <!-- 暖阳金 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#FFFCE8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFCE8" stop-opacity="0"/>
    </radialGradient>
    <!-- 国宝光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="46%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#1E1E28"/>
    </linearGradient>
    <!-- 白毛 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#D8D8E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暖阳 -->
  <circle cx="100" cy="56" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 国宝光环 -->
  <circle cx="100" cy="100" r="66" fill="url(#halo)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 翠竹千竿 -->
  <g stroke="#4E8E52" stroke-width="2.8" stroke-linecap="round" opacity="0.6">
    <path d="M 16 36 L 10 160 M 188 34 L 180 160 M 36 56 L 28 160 M 166 54 L 174 160 M 100 30 L 96 160"/>
    <path d="M 20 56 L 12 70 M 180 54 L 188 68 M 34 76 L 26 90 M 168 74 L 176 88 M 100 48 L 92 60"/>
  </g>
  <!-- 竹叶 -->
  <g fill="#6EA868" opacity="0.8">
    <path d="M 14 40 Q 8 36 6 30 Q 12 32 14 40 Z"/>
    <path d="M 186 38 Q 192 34 194 28 Q 188 30 186 38 Z"/>
    <path d="M 100 34 Q 96 28 98 22 Q 102 26 100 34 Z"/>
    <path d="M 34 60 Q 28 56 26 50 Q 32 52 34 60 Z"/>
  </g>

  <!-- 坡地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5E9456" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#7EB472" stroke-width="1.4" opacity="0.6"/>

  <!-- 小辈（满坡打滚） -->
  <g opacity="0.7">
    <circle cx="60" cy="144" r="6" fill="#F0F0F2"/>
    <circle cx="55" cy="140" r="2" fill="#1E1E28"/>
    <circle cx="65" cy="140" r="2" fill="#1E1E28"/>
    <circle cx="60" cy="141" r="1.4" fill="#1E1008"/>
    <path d="M 60 143 L 60 147" stroke="#6EA868" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="-5 60 144;5 60 144;-5 60 144" dur="2s" repeatCount="indefinite"/>
    <circle cx="150" cy="146" r="5.4" fill="#F0F0F2"/>
    <circle cx="146" cy="143" r="1.8" fill="#1E1E28"/>
    <circle cx="154" cy="143" r="1.8" fill="#1E1E28"/>
    <path d="M 150 145 L 150 149" stroke="#6EA868" stroke-width="1"/>
    <animateTransform attributeName="transform" type="rotate" values="5 150 146;-5 150 146;5 150 146" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- 人间遥望（右上，虚影） -->
  <g opacity="0.45">
    <path d="M 156 62 Q 158 54 161 52 Q 164 54 164 62 Z" fill="#6E5A6E"/>
    <circle cx="162" cy="50" r="4.5" fill="#D8C8D8"/>
  </g>

  <!-- 大熊猫（2头身，国宝之姿，抱笋慢啃） -->
  <!-- 腿 -->
  <path d="M 82 146 Q 78 152 84 154 Q 90 154 90 148 Z" fill="#1E1E28"/>
  <path d="M 104 146 Q 108 152 102 154 Q 96 154 96 148 Z" fill="#1E1E28"/>
  <!-- 身体 -->
  <ellipse cx="93" cy="124" rx="21" ry="18" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 肩部黑色臂带 -->
  <path d="M 73 120 Q 78 106 89 110 L 91 122 Q 81 128 73 120 Z" fill="url(#black)"/>
  <path d="M 113 120 Q 108 106 97 110 L 95 122 Q 105 128 113 120 Z" fill="url(#black)"/>
  <!-- 黑尾 -->
  <circle cx="117" cy="130" r="3.4" fill="#1E1E28"/>

  <!-- 头（黑耳圆立，圆眼笑眯） -->
  <circle cx="93" cy="98" r="13.5" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 黑耳 -->
  <circle cx="80" cy="87" r="4.6" fill="url(#black)"/>
  <circle cx="106" cy="87" r="4.6" fill="url(#black)"/>
  <!-- 黑眼圈 -->
  <ellipse cx="87" cy="99" rx="4.8" ry="4.2" fill="url(#black)"/>
  <ellipse cx="99" cy="99" rx="4.8" ry="4.2" fill="url(#black)"/>
  <!-- 圆眼笑眯 -->
  <path d="M 84 99 Q 87 97 90 99 Q 87 101 84 99 Z" fill="#1E1008"/>
  <path d="M 96 99 Q 99 97 102 99 Q 99 101 96 99 Z" fill="#1E1008"/>
  <circle cx="85.6" cy="98.4" r="0.7" fill="#FFE8A0"/>
  <circle cx="100.4" cy="98.4" r="0.7" fill="#FFE8A0"/>
  <!-- 黑鼻 -->
  <ellipse cx="93" cy="104" rx="2.6" ry="1.8" fill="#1E1008"/>
  <!-- 憨笑 -->
  <path d="M 88 107 Q 93 109.4 98 107" fill="none" stroke="#6E6E78" stroke-width="1" stroke-linecap="round"/>

  <!-- 前爪（抱竹笋，慢啃） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 84 116 C 80 122 78 128 80 134" fill="none" stroke="#1E1E28" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="80" cy="136" r="3.6" fill="#1E1E28"/>
    <!-- 竹笋 -->
    <path d="M 76 132 Q 74 138 78 144 Q 82 146 84 142 Q 84 136 82 132 Z" fill="#E0B068" stroke="#C09048" stroke-width="0.8"/>
    <path d="M 82 132 L 80 128" stroke="#E0B068" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 右爪（捧笋） -->
  <path d="M 102 116 C 106 122 108 128 106 134" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="106" cy="136" r="3.4" fill="#1E1E28"/>

  <!-- 暖阳星尘 -->
  <g fill="#FFFCE8">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
