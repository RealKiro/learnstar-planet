<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金丝猴·五阶·高山之王·立最高枝哨声传林">
  <defs>
    <!-- 背景：高山之巅 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8E8"/>
      <stop offset="52%" stop-color="#88AED0"/>
      <stop offset="100%" stop-color="#6E94B8"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFFCE8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFCE8" stop-opacity="0"/>
    </radialGradient>
    <!-- 金色长毛（披风） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C05A"/>
      <stop offset="100%" stop-color="#D0A040"/>
    </linearGradient>
    <!-- 蓝面威严 -->
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9EB8E8"/>
      <stop offset="100%" stop-color="#7E96C8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 天光 -->
  <circle cx="100" cy="56" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 群山 -->
  <path d="M 0 130 Q 50 112 110 120 Q 160 126 200 116 L 200 200 L 0 200 Z" fill="#7E9EBE" opacity="0.5"/>
  <path d="M 0 146 Q 60 134 130 142 Q 180 148 200 140 L 200 200 L 0 200 Z" fill="#6E8EAE" opacity="0.6"/>

  <!-- 最高枝 -->
  <path d="M 40 110 Q 80 90 118 78 Q 140 72 150 80" stroke="#5E4A3E" stroke-width="4.4" stroke-linecap="round" fill="none"/>
  <path d="M 118 78 L 112 66 M 118 78 L 128 68" stroke="#5E4A3E" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 哨声传林 -->
  <g stroke="#FFFCE8" stroke-width="1.6" opacity="0.7" stroke-linecap="round" fill="none">
    <path d="M 118 60 Q 126 52 122 40">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 66 Q 140 60 144 50">
      <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 族群围聚（右下） -->
  <g opacity="0.55">
    <circle cx="156" cy="132" r="5.6" fill="#E8B84E"/>
    <ellipse cx="154" cy="130" rx="4" ry="3.4" fill="#9EB8E8"/>
    <circle cx="151" cy="129" r="1.3" fill="#1E1008"/>
    <circle cx="157" cy="129" r="1.3" fill="#1E1008"/>
    <circle cx="170" cy="140" r="5" fill="#E8B84E"/>
    <ellipse cx="168" cy="138" rx="3.6" ry="3" fill="#9EB8E8"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5E7E9E" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#7E9EBE" stroke-width="1.4" opacity="0.6"/>

  <!-- 金毛猴王（3头身，立于最高枝，猴王之气） -->
  <!-- 腿（立） -->
  <path d="M 100 118 Q 96 124 100 128 Q 106 128 108 122 Z" fill="#B88A30"/>
  <!-- 身体 -->
  <path d="M 94 88 Q 90 104 98 118 Q 108 124 114 118 Q 120 104 116 88 Q 106 82 94 88 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 金毛如披风 -->
  <path d="M 94 90 Q 84 100 80 114 Q 88 118 96 112 L 94 96 Z" fill="#D8A848" stroke="#B88830" stroke-width="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 尾巴（长，威仪） -->
  <path d="M 116 112 Q 128 104 134 94 Q 138 84 132 78" stroke="#D0A040" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 116 112;8 116 112;0 116 112" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（蓝面威严，圆眼有神，金毛） -->
  <ellipse cx="105" cy="78" rx="11" ry="10.5" fill="url(#fur)" stroke="#A87828" stroke-width="0.9"/>
  <!-- 金毛披散 -->
  <path d="M 96 72 Q 92 64 96 62 M 114 72 Q 120 66 116 62" stroke="#D0A040" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- 圆耳 -->
  <circle cx="95" cy="70" r="3.4" fill="#F0C05A" stroke="#A87828" stroke-width="0.7"/>
  <circle cx="115" cy="70" r="3.4" fill="#F0C05A" stroke="#A87828" stroke-width="0.7"/>
  <!-- 蓝面 -->
  <ellipse cx="105" cy="82" rx="8.5" ry="6.5" fill="url(#face)" stroke="#6E86B8" stroke-width="0.6"/>
  <!-- 圆眼有神（金瞳） -->
  <circle cx="100" cy="79" r="3" fill="#1E1008"/>
  <circle cx="110" cy="79" r="3" fill="#1E1008"/>
  <circle cx="101" cy="78" r="1" fill="#FFF"/>
  <circle cx="111" cy="78" r="1" fill="#FFF"/>
  <circle cx="100.6" cy="78.6" r="0.7" fill="#FFFCE8"/>
  <circle cx="109.4" cy="78.6" r="0.7" fill="#FFFCE8"/>
  <!-- 朝天鼻 -->
  <ellipse cx="105" cy="83" rx="2.8" ry="2.2" fill="#5E6E9E"/>
  <!-- 威严抿唇 -->
  <path d="M 100 87 Q 105 88.6 110 87" fill="none" stroke="#8E6A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（垂放威仪） -->
  <path d="M 96 92 C 88 96 84 100 82 106" fill="none" stroke="#D0A040" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="81" cy="108" r="3" fill="#D8A85E"/>

  <!-- 右手（哨声手势） -->
  <path d="M 112 92 C 118 88 122 84 124 78" fill="none" stroke="#D0A040" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="125" cy="76" r="2.8" fill="#D8A85E"/>

  <!-- 天光星尘 -->
  <g fill="#FFFCE8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
