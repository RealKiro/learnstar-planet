<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="丹顶鹤·六阶·清泽传说·暮色看新生小鹤学步引颈长鸣">
  <defs>
    <!-- 背景：暮色清泽 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#D09A5E"/>
      <stop offset="100%" stop-color="#B87E48"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽（暮色镀金） -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCF8F0"/>
      <stop offset="100%" stop-color="#E4DCC8"/>
    </linearGradient>
    <!-- 雏鹤绒毛 -->
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C088"/>
      <stop offset="100%" stop-color="#B89A5E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="54" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮色芦苇 -->
  <g stroke="#8E7A4E" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 16 40 Q 14 96 8 160 M 30 54 Q 26 102 22 160"/>
  </g>
  <g fill="#C8A86E">
    <ellipse cx="13" cy="38" rx="4" ry="7" opacity="0.9"/>
    <ellipse cx="27" cy="52" rx="4" ry="7" opacity="0.9"/>
  </g>

  <!-- 清泽水面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E7A4E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#C4A878" stroke-width="1.4" opacity="0.6"/>
  <path d="M 24 158 Q 48 156 76 158 M 120 162 Q 148 160 178 162" stroke="#F4E4C8" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 新生小鹤（左下，学步，蹭彼此朱红） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 小鹤A -->
    <ellipse cx="56" cy="138" rx="8" ry="7" fill="url(#down)" stroke="#A8884E" stroke-width="0.7"/>
    <circle cx="56" cy="128" r="5.8" fill="url(#down)" stroke="#A8884E" stroke-width="0.7"/>
    <circle cx="57" cy="125" r="1.6" fill="#D84A30" opacity="0.85"/>
    <path d="M 52 129 L 47 127 L 52 131 Z" fill="#8E96A2"/>
    <circle cx="53" cy="127" r="1.1" fill="#24180E"/>
    <path d="M 53 140 L 51 142 M 59 140 L 61 142" stroke="#B89050" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 小鹤B（与A互相蹭朱红，低头） -->
    <ellipse cx="76" cy="140" rx="8" ry="7" fill="url(#down)" stroke="#A8884E" stroke-width="0.7"/>
    <circle cx="78" cy="130" r="5.8" fill="url(#down)" stroke="#A8884E" stroke-width="0.7"/>
    <circle cx="76" cy="127" r="1.6" fill="#D84A30" opacity="0.85"/>
    <path d="M 74 131 L 68 130 L 73 133 Z" fill="#8E96A2"/>
    <circle cx="80" cy="129" r="1.1" fill="#24180E"/>
    <path d="M 73 142 L 71 144 M 79 142 L 81 144" stroke="#B89050" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- 蹭朱红的心形光 -->
  <circle cx="66" cy="126" r="3" fill="#FFE8A0" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 老鹤（5头身，立在新生旁，引颈长鸣"我还在"） -->
  <!-- 单足 -->
  <path d="M 108 126 L 106 150" stroke="#6E7682" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 116 124 Q 122 122 124 118" stroke="#6E7682" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- 身体 -->
  <ellipse cx="112" cy="112" rx="17" ry="10" fill="url(#white)" stroke="#C8BCA4" stroke-width="0.8"/>
  <!-- 翅尖墨羽 -->
  <path d="M 126 108 Q 134 104 140 108 Q 134 112 128 112 Z" fill="#2A2E3A" opacity="0.9"/>
  <!-- 尾羽 -->
  <path d="M 126 116 Q 138 118 144 124" stroke="#E4DCC8" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- 长颈（引颈长鸣，温和） -->
  <path d="M 112 106 C 114 92 114 78 108 64 C 104 56 100 50 104 42" fill="none" stroke="#4A4E5A" stroke-width="7" stroke-linecap="round"/>
  <!-- 头（朱红如冠，看小鹤） -->
  <circle cx="104" cy="40" r="5.5" fill="url(#white)" stroke="#C8BCA4" stroke-width="0.7"/>
  <circle cx="106" cy="36.5" r="2.4" fill="#D84A30"/>
  <!-- 喙（长鸣） -->
  <path d="M 101 42 L 92 32 L 104 39 Z" fill="#6E7682"/>
  <path d="M 96 38 L 99 35" stroke="#4A4E5A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 丹凤眼（温和，望新生） -->
  <path d="M 106 40 Q 108 39 109 40" stroke="#24180E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  <circle cx="108" cy="41" r="1" fill="#24180E"/>
  <!-- 长鸣如誓（"我还在"） -->
  <g stroke="#FFF8E0" stroke-width="1.6" opacity="0.7" stroke-linecap="round" fill="none">
    <path d="M 86 28 Q 80 20 82 10">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 74 34 Q 66 24 66 12">
      <animate attributeName="opacity" values="0.5;0.14;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF8E0">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
