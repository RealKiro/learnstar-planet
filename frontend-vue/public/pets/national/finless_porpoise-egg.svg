<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="江豚·一阶·江湾幼豚·长江江湾圆身翻水花吻顶水草救鱼笑脸">
  <defs>
    <!-- 背景：长江江湾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E8AB0"/>
      <stop offset="52%" stop-color="#5EA0C0"/>
      <stop offset="100%" stop-color="#7AC0D8"/>
    </linearGradient>
    <!-- 水光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#D8F0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰黑身 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#7A868C"/>
      <stop offset="100%" stop-color="#4E5A60"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 江面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5EA0C0" opacity="0.8"/>
  <g stroke="#B8E0F0" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被水草缠住的小鱼（右，被顶开） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="152" cy="132" rx="5" ry="3" fill="#C89858" stroke="#A87838" stroke-width="0.5"/>
    <circle cx="148" cy="131" r="1" fill="#2E2A24"/>
    <!-- 尾 -->
    <path d="M 157 132 L 162 130 L 160 134 Z" fill="#C89858" stroke="#A87838" stroke-width="0.4"/>
  </g>
  <!-- 被顶开的水草 -->
  <g fill="#3EA878" stroke="#2E8858" stroke-width="0.5" opacity="0.7">
    <path d="M 144 124 Q 148 116 152 120 Q 148 128 144 126 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小江豚（中，圆身翻花，笑脸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 圆身（灰黑滑亮，无背鳍） -->
    <ellipse cx="98" cy="122" rx="18" ry="12" fill="url(#body)" stroke="#3E4A50" stroke-width="1"/>
    <!-- 滑亮高光 -->
    <ellipse cx="94" cy="118" rx="10" ry="5" fill="#A8B4B8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.25;0.4" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 头（圆） -->
    <ellipse cx="98" cy="112" rx="11" ry="9" fill="url(#body)" stroke="#3E4A50" stroke-width="0.8"/>
    <!-- 天生的笑脸（嘴角上翘） -->
    <path d="M 92 116 Q 98 119.5 104 116" fill="none" stroke="#2E3A40" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 91 115.5 Q 90 114.5 91 114" stroke="#2E3A40" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 105 115.5 Q 106 114.5 105 114" stroke="#2E3A40" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 眼（圆亮） -->
    <circle cx="92" cy="110" r="2.4" fill="#2E2A24"/>
    <circle cx="92.8" cy="108.8" r="1" fill="#FFF"/>
    <circle cx="104" cy="110" r="2.4" fill="#2E2A24"/>
    <circle cx="104.8" cy="108.8" r="1" fill="#FFF"/>
    <!-- 胸鳍（翻花） -->
    <path d="M 84 122 L 76 128" stroke="#4E5A60" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-8 84 122;8 84 122;-8 84 122" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 112 122 L 120 128" stroke="#4E5A60" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾鳍 -->
    <path d="M 80 128 Q 74 134 68 130 L 66 136" stroke="#4E5A60" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 80 128;4 80 128;-4 80 128" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 水花 -->
    <g fill="#D8F0F8" opacity="0.8">
      <circle cx="70" cy="140" r="2">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="124" cy="138" r="1.8">
        <animate attributeName="opacity" values="0.7;0.28;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#D8F0F8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
