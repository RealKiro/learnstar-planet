<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雪豹·五阶·雪山之王·雪线独行巡山长尾如旗护小兽">
  <defs>
    <!-- 背景：雪线暮山 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E86A8"/>
      <stop offset="52%" stop-color="#5A6E92"/>
      <stop offset="100%" stop-color="#4A5C7E"/>
    </linearGradient>
    <!-- 暮光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#FFF0D8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 王者光晕 -->
    <radialGradient id="halo" cx="50%" cy="56%" r="40%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白底毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE0E8"/>
      <stop offset="100%" stop-color="#BCC2CE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暮光 -->
  <circle cx="96" cy="44" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 王者光晕 -->
  <circle cx="100" cy="104" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮色雪山 -->
  <g fill="#5E7694" opacity="0.9">
    <path d="M 0 100 L 40 52 L 76 100 Z"/>
    <path d="M 50 100 L 100 36 L 150 100 Z"/>
  </g>
  <g fill="#7E96B4" opacity="0.6">
    <path d="M 40 52 L 50 64 L 42 74 L 30 64 Z"/>
    <path d="M 100 36 L 112 54 L 102 66 L 88 54 Z"/>
  </g>
  <!-- 雪线 -->
  <path d="M 0 112 Q 50 104 100 110 Q 150 114 200 106" stroke="#DCE8F4" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.5" fill="none"/>

  <!-- 雪峰（所立之巅） -->
  <path d="M 62 138 L 96 108 Q 104 104 112 108 L 140 140 L 60 140 Z" fill="#7E8E9E" stroke="#6A7A8A" stroke-width="1.2"/>
  <path d="M 82 124 Q 104 114 122 124" stroke="#EAF0F8" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- 落难小兽（左前，受护，安心） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="76" cy="136" rx="6" ry="4.4" fill="#A89A88"/>
    <circle cx="71" cy="132" r="3.2" fill="#B8AA98"/>
    <circle cx="69.5" cy="131" r="0.9" fill="#24180E"/>
    <circle cx="73" cy="131" r="0.9" fill="#24180E"/>
    <path d="M 74 130 L 76 127" stroke="#B8AA98" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 78 133 L 83 132 M 78 135 L 84 135" stroke="#C8BCA8" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M 72 135 Q 76 133 80 135" stroke="#9A8C7A" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 雪豹（4头身，立雪峰之巅，独行巡山，长尾如旗） -->
  <!-- 后腿（撑立） -->
  <path d="M 110 116 L 108 138 L 114 140 L 118 120 Z" fill="url(#fur)" stroke="#8E96A2" stroke-width="1"/>
  <!-- 长尾（如旗，扬起） -->
  <path d="M 116 116 Q 130 106 136 92 Q 138 88 136 84" stroke="url(#fur)" stroke-width="3.8" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 116 116;-6 116 116;0 116 116" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 116 116 Q 128 107 134 94" stroke="#4E565E" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- 身体（挺立，王者之姿） -->
  <path d="M 84 104 Q 80 116 88 126 Q 100 132 112 126 Q 118 116 114 104 Q 100 98 84 104 Z" fill="url(#fur)" stroke="#8E96A2" stroke-width="1"/>
  <!-- 黑斑 -->
  <circle cx="90" cy="110" r="1.8" fill="#4E565E"/>
  <circle cx="102" cy="114" r="1.6" fill="#4E565E"/>
  <circle cx="96" cy="122" r="1.5" fill="#4E565E"/>
  <!-- 前腿（撑立） -->
  <path d="M 90 122 C 86 128 86 132 88 138" fill="none" stroke="url(#fur)" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="89" cy="140" r="2.8" fill="#C4CAD2"/>
  <path d="M 106 120 C 112 126 114 130 116 136" fill="none" stroke="url(#fur)" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="117" cy="138" r="2.8" fill="#C4CAD2"/>

  <!-- 头（深邃，望远方） -->
  <g>
    <ellipse cx="92" cy="96" rx="10" ry="8.5" fill="url(#fur)" stroke="#8E96A2" stroke-width="1"/>
    <!-- 圆耳 -->
    <circle cx="83" cy="88" r="3.6" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.7"/>
    <circle cx="102" cy="88" r="3.6" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.7"/>
    <!-- 黑斑 -->
    <circle cx="87" cy="90" r="1.3" fill="#4E565E"/>
    <circle cx="98" cy="90" r="1.3" fill="#4E565E"/>
    <!-- 眼（深邃） -->
    <path d="M 85 94 Q 88 92 91 94 M 93 94 Q 96 92 99 94" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="95.6" r="1.9" fill="#F0D890"/>
    <circle cx="88" cy="95.6" r="1" fill="#24180E"/>
    <circle cx="88.4" cy="95.3" r="0.5" fill="#FFF"/>
    <circle cx="96" cy="95.6" r="1.9" fill="#F0D890"/>
    <circle cx="96" cy="95.6" r="1" fill="#24180E"/>
    <circle cx="96.4" cy="95.3" r="0.5" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="92" cy="100" rx="2.1" ry="1.5" fill="#8E6E5E"/>
    <!-- 长须 -->
    <path d="M 86 99 L 80 98 M 86 101 L 79 102 M 98 99 L 104 98 M 98 101 L 105 102" stroke="#E4ECF4" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#FFF0D8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
