<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雪豹·六阶·雪山传说·雪岩之巅望新豹纵跃低吼我在">
  <defs>
    <!-- 背景：雪山暮色镀金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#D09A5E"/>
      <stop offset="100%" stop-color="#B87E48"/>
    </linearGradient>
    <!-- 暮山金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="54%" r="40%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白底毛（泛岁月光） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E2E6"/>
      <stop offset="100%" stop-color="#C0C4CC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="106" r="64" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪山镀金 -->
  <g fill="#E8E0C8" opacity="0.85">
    <path d="M 0 94 L 40 42 L 76 94 Z"/>
    <path d="M 50 94 L 100 30 L 150 94 Z"/>
  </g>
  <g fill="#F8F0DC" opacity="0.6">
    <path d="M 40 42 L 50 54 L 42 64 L 30 54 Z"/>
    <path d="M 100 30 L 112 48 L 102 60 L 88 48 Z"/>
  </g>

  <!-- 断崖（左，新一代纵跃处） -->
  <path d="M 0 112 Q 24 104 52 110 L 60 200 L 0 200 Z" fill="#A89A7A" stroke="#8E8062" stroke-width="1"/>
  <path d="M 70 116 Q 92 108 116 114 L 124 200 L 70 200 Z" fill="#968A6C" stroke="#7E724E" stroke-width="1"/>

  <!-- 新一代雪豹（左，纵跃断崖，如当年） -->
  <g opacity="0.9">
    <!-- 长尾（平衡） -->
    <path d="M 40 82 Q 30 78 24 72" stroke="url(#fur)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- 身体（纵跃） -->
    <ellipse cx="52" cy="82" rx="11" ry="6.5" fill="url(#fur)" stroke="#9A9EA6" stroke-width="0.7"/>
    <!-- 黑斑 -->
    <circle cx="47" cy="80" r="1.4" fill="#4E565E"/>
    <circle cx="56" cy="84" r="1.3" fill="#4E565E"/>
    <!-- 腿（伸展） -->
    <path d="M 46 86 L 42 92 M 50 87 L 50 94 M 58 86 L 62 92" stroke="url(#fur)" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="62" cy="78" rx="5.5" ry="4.8" fill="url(#fur)" stroke="#9A9EA6" stroke-width="0.6"/>
    <circle cx="60" cy="76" r="1.4" fill="#C4C6CC"/>
    <circle cx="66" cy="76" r="1.4" fill="#C4C6CC"/>
    <circle cx="60" cy="77.4" r="0.8" fill="#24180E"/>
    <circle cx="65" cy="77.4" r="0.8" fill="#24180E"/>
    <!-- 纵跃雪尘 -->
    <g fill="#F8F0DC">
      <circle cx="66" cy="110" r="1.4">
        <animateTransform attributeName="transform" type="translate" values="0 0;5 -5;0 0" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.12;0.7" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="74" cy="112" r="1.2">
        <animateTransform attributeName="transform" type="translate" values="0 0;6 -6;0 0" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 雪岩（右，老豹所立之巅） -->
  <path d="M 108 120 L 140 108 Q 150 106 158 112 L 176 126 L 200 122 L 200 200 L 108 200 Z" fill="#A89A7A" stroke="#8E8062" stroke-width="1.2"/>
  <path d="M 122 118 Q 146 112 170 120" stroke="#F8F0DC" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- 老豹（4头身，立雪岩之巅，长尾垂稳，望新豹，眼神温和深邃） -->
  <!-- 后腿 -->
  <path d="M 136 116 L 134 138 L 140 140 L 144 120 Z" fill="url(#fur)" stroke="#9A9EA6" stroke-width="1"/>
  <!-- 长尾（垂稳，岁月） -->
  <path d="M 142 116 Q 154 118 160 126 Q 164 132 162 138" stroke="url(#fur)" stroke-width="3.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 142 118;4 142 118;0 142 118" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <path d="M 142 116 Q 153 119 158 126" stroke="#4E565E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- 身体（挺立，岁月沉稳） -->
  <path d="M 112 104 Q 108 116 116 126 Q 128 132 140 126 Q 146 116 142 104 Q 128 98 112 104 Z" fill="url(#fur)" stroke="#9A9EA6" stroke-width="1"/>
  <!-- 黑斑 -->
  <circle cx="118" cy="110" r="1.7" fill="#4E565E"/>
  <circle cx="130" cy="114" r="1.5" fill="#4E565E"/>
  <circle cx="124" cy="122" r="1.4" fill="#4E565E"/>
  <!-- 前腿 -->
  <path d="M 118 122 C 114 128 114 132 116 138" fill="none" stroke="url(#fur)" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="117" cy="140" r="2.8" fill="#C4CAD2"/>
  <path d="M 134 120 C 140 126 142 130 144 136" fill="none" stroke="url(#fur)" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="145" cy="138" r="2.8" fill="#C4CAD2"/>

  <!-- 头（望新豹，温和深邃） -->
  <g>
    <ellipse cx="120" cy="96" rx="10" ry="8.5" fill="url(#fur)" stroke="#9A9EA6" stroke-width="1"/>
    <!-- 圆耳（岁月泛光） -->
    <circle cx="111" cy="88" r="3.6" fill="url(#fur)" stroke="#9A9EA6" stroke-width="0.7"/>
    <circle cx="130" cy="88" r="3.6" fill="url(#fur)" stroke="#9A9EA6" stroke-width="0.7"/>
    <!-- 黑斑 -->
    <circle cx="115" cy="90" r="1.3" fill="#4E565E"/>
    <circle cx="126" cy="90" r="1.3" fill="#4E565E"/>
    <!-- 眼（温和深邃） -->
    <path d="M 113 94 Q 116 92 119 94 M 121 94 Q 124 92 127 94" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="116" cy="95.6" r="1.8" fill="#E0C878"/>
    <circle cx="116" cy="95.6" r="1" fill="#24180E"/>
    <circle cx="116.4" cy="95.3" r="0.5" fill="#FFF"/>
    <circle cx="124" cy="95.6" r="1.8" fill="#E0C878"/>
    <circle cx="124" cy="95.6" r="1" fill="#24180E"/>
    <circle cx="124.4" cy="95.3" r="0.5" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="120" cy="100" rx="2.1" ry="1.5" fill="#8E6E5E"/>
    <!-- 长须（泛岁月） -->
    <path d="M 114 99 L 108 98 M 114 101 L 107 102 M 126 99 L 132 98 M 126 101 L 133 102" stroke="#F0F2F4" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 低吼"我在"（温和上扬） -->
  <g stroke="#FFF8E0" stroke-width="1.5" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 128 116 Q 136 110 134 102">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 138 120 Q 146 116 148 108">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#FFF8E0">
    <circle cx="36" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
