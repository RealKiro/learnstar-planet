<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="藏羚羊·三阶·狂奔苦修·四蹄翻飞剑角渐长">
  <defs>
    <!-- 背景：高原旷野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E8"/>
      <stop offset="52%" stop-color="#92B2CE"/>
      <stop offset="100%" stop-color="#72A0B8"/>
    </linearGradient>
    <!-- 高原光 -->
    <radialGradient id="glow" cx="40%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#F4F8E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4F8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 背毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A06E"/>
      <stop offset="100%" stop-color="#A8844E"/>
    </linearGradient>
    <!-- 腹白 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0DC"/>
      <stop offset="100%" stop-color="#E8DCBE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="80" cy="48" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪山 -->
  <g fill="#E8EFF8" opacity="0.9">
    <path d="M 0 92 L 44 34 L 82 92 Z"/>
    <path d="M 56 92 L 108 24 L 156 92 Z"/>
    <path d="M 128 92 L 170 44 L 200 90 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.7">
    <path d="M 44 34 L 54 46 L 46 56 L 34 46 Z"/>
    <path d="M 108 24 L 120 42 L 110 54 L 96 42 Z"/>
    <path d="M 170 44 L 180 56 L 172 66 L 160 56 Z"/>
  </g>

  <!-- 旷野 -->
  <path d="M 0 130 Q 50 120 110 128 Q 160 132 200 124 L 200 200 L 0 200 Z" fill="#A0BC7C" opacity="0.85"/>
  <path d="M 0 130 Q 50 120 110 128 Q 160 132 200 124" stroke="#C0DC98" stroke-width="1.2" opacity="0.6"/>

  <!-- 藏羚羊（4头身，狂奔，四蹄翻飞，剑角渐长） -->
  <!-- 后腿（蹬地翻飞） -->
  <path d="M 118 118 L 130 130 L 134 132 L 126 120 Z" fill="url(#fur)" stroke="#8E6E3E" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 122 122;12 122 122;0 122 122" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M 104 116 L 112 132 L 106 134 L 100 120 Z" fill="url(#belly)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 106 122;-12 106 122;0 106 122" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <!-- 身体（低伸冲刺） -->
  <path d="M 84 108 Q 80 118 90 126 Q 102 132 116 126 Q 122 116 116 106 Q 100 100 84 108 Z" fill="url(#fur)" stroke="#8E6E3E" stroke-width="1"/>
  <!-- 腹白 -->
  <path d="M 86 114 Q 82 124 92 128 Q 104 131 112 124 Q 114 116 108 110 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 前腿（前伸） -->
  <path d="M 92 120 C 86 128 84 132 82 140" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 92 124;-12 92 124;0 92 124" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="82" cy="142" r="2.6" fill="#5E4E3A"/>
  <path d="M 106 120 C 112 126 116 130 118 136" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 106 124;12 106 124;0 106 124" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="119" cy="138" r="2.6" fill="#5E4E3A"/>
  <!-- 尾（扬起） -->
  <path d="M 116 112 Q 124 108 128 102" stroke="#A8844E" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 116 112;12 116 112;0 116 112" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（前伸，剑角渐长，眼神坚定） -->
  <g>
    <ellipse cx="82" cy="100" rx="10" ry="8" fill="url(#fur)" stroke="#8E6E3E" stroke-width="1"/>
    <!-- 白颊 -->
    <ellipse cx="79" cy="103" rx="5.5" ry="4" fill="url(#belly)" stroke="#D8CCA8" stroke-width="0.5"/>
    <!-- 剑角（渐长，如剑指天） -->
    <path d="M 82 94 Q 79 82 72 74" stroke="#5E4E3A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 88 94 Q 89 82 92 74" stroke="#5E4E3A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 耳 -->
    <path d="M 76 94 Q 70 92 68 88" stroke="#C8A06E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（坚定） -->
    <path d="M 76 97 Q 78 96 80 97 M 84 97 Q 86 96 88 97" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="78" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="78.4" cy="98.8" r="0.5" fill="#FFF"/>
    <circle cx="87" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="87.4" cy="98.8" r="0.5" fill="#FFF"/>
    <!-- 鼻（呼吸如鼓） -->
    <path d="M 76 104 Q 80 105.6 84 104" stroke="#8E6E3E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <!-- 呼气 -->
    <g stroke="#F4F8E8" stroke-width="1" opacity="0.5" stroke-linecap="round" fill="none">
      <path d="M 74 105 Q 70 106 68 104">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 扬尘（身后） -->
  <g fill="#C8CCB8">
    <circle cx="140" cy="136" r="2.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 -4;0 0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="140" r="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;-10 -5;0 0" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="132" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-9 -6;0 0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.08;0.5" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 高原光尘 -->
  <g fill="#F4F8E8">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
