<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="丹顶鹤·二阶·湿地之失·风暴荒滩孤鹤引颈长鸣">
  <defs>
    <!-- 背景：风暴荒滩 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA4B0"/>
      <stop offset="52%" stop-color="#7E8894"/>
      <stop offset="100%" stop-color="#66707C"/>
    </linearGradient>
    <!-- 天光惨淡 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#E8ECF2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8ECF2" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽（凌乱沾沙） -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8EAEE"/>
      <stop offset="100%" stop-color="#C8CCD4"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.35;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 风暴云 -->
  <g fill="#5E6874" opacity="0.6">
    <path d="M 0 20 Q 30 12 60 22 Q 90 14 120 24 Q 150 16 180 24 L 200 20 L 200 40 L 0 40 Z"/>
    <path d="M 20 36 Q 60 30 100 38 Q 140 30 180 38 L 200 34 L 200 48 L 0 48 Z" opacity="0.5"/>
  </g>

  <!-- 风线（风暴呜咽） -->
  <g stroke="#C8D0DA" stroke-width="1.4" opacity="0.45" stroke-linecap="round" fill="none">
    <path d="M 24 64 Q 40 60 58 64">
      <animate attributeName="opacity" values="0.45;0.18;0.45" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 56 Q 156 52 176 58">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 90 Q 76 86 94 90">
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 离散的族群远影（左上，越飞越远） -->
  <g stroke="#4E5866" stroke-width="1.6" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 26 56 Q 30 52 34 56"/>
    <path d="M 44 44 Q 48 40 52 44"/>
    <path d="M 62 52 Q 66 48 70 52">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 -4;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 荒滩 -->
  <path d="M 0 138 Q 60 132 130 138 Q 170 140 200 134 L 200 200 L 0 200 Z" fill="#A08E6E" opacity="0.8"/>
  <path d="M 0 138 Q 60 132 130 138 Q 170 140 200 134" stroke="#BCAA8A" stroke-width="1.2" opacity="0.6"/>
  <path d="M 20 150 Q 50 148 90 152 M 120 156 Q 150 154 180 158" stroke="#C4B494" stroke-width="0.8" opacity="0.5" fill="none"/>
  <!-- 枯苇 -->
  <g stroke="#8E7E5E" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
    <path d="M 26 132 Q 24 120 20 108 M 170 130 Q 172 118 176 106"/>
  </g>

  <!-- 孤鹤（3头身，白羽凌乱沾沙，引颈长鸣） -->
  <!-- 腿（立于荒滩） -->
  <path d="M 96 126 L 94 150" stroke="#6E7682" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 104 124 L 106 150" stroke="#6E7682" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 身体（白羽凌乱，沾沙） -->
  <ellipse cx="100" cy="114" rx="16" ry="10" fill="url(#white)" stroke="#AEB2BC" stroke-width="0.8"/>
  <!-- 凌乱羽（沾沙，颤抖） -->
  <path d="M 86 108 Q 80 104 78 98" stroke="#D4D8E0" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 86 108;6 86 108;0 86 108" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 114 106 Q 120 102 122 96" stroke="#D4D8E0" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 114 106;-6 114 106;0 114 106" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <!-- 沙迹 -->
  <path d="M 84 112 L 92 114 M 108 112 L 118 114" stroke="#BCA888" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 翅尖墨羽 -->
  <path d="M 114 110 Q 122 108 126 112 Q 122 116 116 116 Z" fill="#2A2E3A"/>
  <!-- 尾羽低垂 -->
  <path d="M 114 118 Q 124 120 128 124" stroke="#C8CCD4" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 长颈引颈（向上，长鸣） -->
  <path d="M 100 108 C 102 96 106 86 100 74 C 96 66 92 58 96 50" fill="none" stroke="#4A4E5A" stroke-width="7" stroke-linecap="round"/>
  <!-- 头（白，朱红一点，喙朝天） -->
  <circle cx="96" cy="48" r="5.5" fill="url(#white)" stroke="#AEB2BC" stroke-width="0.7"/>
  <circle cx="98" cy="45" r="2.2" fill="#D84A30"/>
  <!-- 喙（朝天长鸣） -->
  <path d="M 93 50 L 86 40 L 96 47 Z" fill="#6E7682"/>
  <!-- 张口（长鸣） -->
  <path d="M 89 46 L 92 44" stroke="#4A4E5A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 丹凤眼（含忧） -->
  <circle cx="99" cy="49" r="1.1" fill="#24180E"/>
  <!-- 长鸣声波（旷野孤鸣） -->
  <g stroke="#E8ECF2" stroke-width="1.4" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 78 36 Q 72 30 74 22">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 42 Q 62 36 62 26">
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 风沙尘 -->
  <g fill="#C4B494">
    <circle cx="50" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
