<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="江豚·六阶·江豚传说·暮光吻碰小江豚传天生笑脸是信护江">
  <defs>
    <!-- 背景：长江江湾暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#8A9E96"/>
      <stop offset="100%" stop-color="#5EA0C0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰黑身 -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#7A868C"/>
      <stop offset="100%" stop-color="#48545A"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 江面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5EA0C0" opacity="0.8"/>
  <g stroke="#B8E0F0" stroke-width="1.2" stroke-linecap="round" opacity="0.4">
    <path d="M 0 158 Q 60 152 120 158 Q 160 162 200 156">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 安游的鱼群（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="90" cy="136" rx="4" ry="2.5" fill="#C89858" stroke="#A87838" stroke-width="0.4"/>
    <ellipse cx="100" cy="140" rx="3.5" ry="2" fill="#D0A868" stroke="#B08848" stroke-width="0.4"/>
    <ellipse cx="82" cy="141" rx="3" ry="2" fill="#C89858" stroke="#A87838" stroke-width="0.4"/>
  </g>

  <!-- 小江豚（右，翻水花） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="144" cy="120" rx="13" ry="8.5" fill="url(#body)" stroke="#3E4A50" stroke-width="0.7"/>
    <ellipse cx="144" cy="112" rx="8" ry="6.5" fill="url(#body)" stroke="#3E4A50" stroke-width="0.6"/>
    <path d="M 139 114 Q 144 117 149 114" fill="none" stroke="#1E2A30" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="140" cy="111" r="1.8" fill="#2E2A24"/>
    <circle cx="140.8" cy="110.2" r="0.7" fill="#FFF"/>
    <circle cx="148" cy="111" r="1.8" fill="#2E2A24"/>
    <circle cx="148.8" cy="110.2" r="0.7" fill="#FFF"/>
    <path d="M 136 122 L 131 126" stroke="#48545A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 152 122 L 157 126" stroke="#48545A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 135 126 L 129 132 L 125 128" stroke="#48545A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老江豚（左，吻碰小江豚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 圆身（大，泛岁月光） -->
    <ellipse cx="80" cy="118" rx="18" ry="12" fill="url(#body)" stroke="#2E3A40" stroke-width="1"/>
    <!-- 滑亮 -->
    <ellipse cx="76" cy="114" rx="10" ry="5" fill="#98A4A8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.2;0.35" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 头 -->
    <ellipse cx="80" cy="106" rx="11" ry="9" fill="url(#body)" stroke="#2E3A40" stroke-width="0.8"/>
    <!-- 吻（伸向小江豚，碰） -->
    <path d="M 88 108 L 112 104" stroke="#48545A" stroke-width="2.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-3 88 108;3 88 108;-3 88 108" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="114" cy="103" r="3" fill="#FFF0D0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 笑脸（温和，目含慈） -->
    <path d="M 74 108 Q 80 111.5 86 108" fill="none" stroke="#1E2A30" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 73 107.5 Q 72 106.5 73 106" stroke="#1E2A30" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M 87 107.5 Q 88 106.5 87 106" stroke="#1E2A30" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 眼（温和） -->
    <path d="M 75 105 Q 77 103.6 79 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 84 105 Q 86 103.6 87 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 胸鳍 -->
    <path d="M 66 118 L 58 126" stroke="#48545A" stroke-width="3" stroke-linecap="round"/>
    <path d="M 94 118 L 102 126" stroke="#48545A" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾鳍 -->
    <path d="M 62 126 L 52 134 L 44 128" stroke="#48545A" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 62 126;4 62 126;-4 62 126" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 吻碰传 -->
    <path d="M 92 100 Q 108 96 128 102" stroke="#B8E0F0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="124" cy="100" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
