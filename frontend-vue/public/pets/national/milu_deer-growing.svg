<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麋鹿·三阶·练四方好·鹿角拨枝牛蹄踏稳马身跃沟驴尾驱蚊">
  <defs>
    <!-- 背景：湿地 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D0B0"/>
      <stop offset="52%" stop-color="#8AB89A"/>
      <stop offset="100%" stop-color="#6EA880"/>
    </linearGradient>
    <!-- 水光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#E8F8E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 褐黄毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#C89868"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 湿地 -->
  <g fill="#5A9868" opacity="0.7">
    <path d="M 24 148 Q 28 132 24 122 Q 30 132 32 120 Q 34 136 30 148 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6EA880" opacity="0.9"/>
  <g stroke="#C8E8D0" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154"/>
  </g>

  <!-- 被拨开的断枝（右） -->
  <g>
    <path d="M 140 108 L 156 100 L 154 110 Z" fill="#8E6E50" stroke="#6E5238" stroke-width="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 被驱散的蚊虫（左） -->
  <g fill="#5A7888" opacity="0.6">
    <circle cx="58" cy="118" r="1.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 -3;0 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="124" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 -3;0 0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年麋鹿（中，练四方好） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鹿角（如枝） -->
    <path d="M 86 96 L 78 84 L 84 89 L 80 76 L 88 86 Z" fill="#A87848" stroke="#8E6838" stroke-width="0.7"/>
    <path d="M 106 96 L 114 84 L 108 89 L 112 76 L 104 86 Z" fill="#A87848" stroke="#8E6838" stroke-width="0.7"/>
    <path d="M 84 92 L 82 86" stroke="#C89868" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M 108 92 L 110 86" stroke="#C89868" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- 大耳（马耳） -->
    <path d="M 84 104 L 76 96 L 88 100 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.7"/>
    <path d="M 108 104 L 116 96 L 104 100 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.7"/>
    <!-- 驴尾（扬，驱蚊） -->
    <path d="M 76 122 Q 66 116 62 122" stroke="#A87848" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-5 76 122;5 76 122;-5 76 122" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="61" cy="123" r="1.8" fill="#8E6838"/>
    <!-- 身（矫健） -->
    <ellipse cx="96" cy="120" rx="16" ry="12" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <!-- 马脸 -->
    <ellipse cx="96" cy="104" rx="10" ry="9" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 100 108 Q 106 108 108 106 Q 106 112 100 112 Z" fill="#E0D0B8" stroke="#C0B098" stroke-width="0.5"/>
    <!-- 眼（沉稳） -->
    <circle cx="92" cy="103" r="2.4" fill="#2E2A24"/>
    <circle cx="92.8" cy="101.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="103" r="2.4" fill="#2E2A24"/>
    <circle cx="101.8" cy="101.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 106 107 L 104 109 L 108 109 Z" fill="#8E6838"/>
    <!-- 嘴（定） -->
    <path d="M 105 112 Q 107 113.4 109 112" fill="none" stroke="#8E6838" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 牛蹄（踏稳，前伸拨枝） -->
    <path d="M 104 116 L 120 108" stroke="#A87848" stroke-width="3.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 104 116;5 104 116;-5 104 116" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 84 128 L 79 136" stroke="#A87848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 108 128 L 113 136" stroke="#A87848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 78 137 L 77 140 M 80 137 L 80 140" stroke="#8E6838" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F8E0">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
