<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麋鹿·五阶·湿地守护·立湿地中央鹿角如枝蹄探陷兽角拨断枝">
  <defs>
    <!-- 背景：湿地 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D0B0"/>
      <stop offset="52%" stop-color="#8AB89A"/>
      <stop offset="100%" stop-color="#6EA880"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F0FCE0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0FCE0" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#E8F8E0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 褐黄毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D0A070"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 湿地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6EA880" opacity="0.9"/>
  <g stroke="#C8E8D0" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154"/>
  </g>

  <!-- 被蹄探的陷泥小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="128" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="56" cy="126.8" r="1" fill="#2E2A24"/>
    <circle cx="61" cy="126.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 断枝（右，被角拨） -->
  <g>
    <path d="M 156 66 L 174 58 L 172 72 Z" fill="#8E6E50" stroke="#6E5238" stroke-width="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 湿地守护（中，鹿角如古枝） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鹿角（如古枝，大） -->
    <path d="M 86 94 L 72 74 L 82 82 L 76 64 L 88 80 Z" fill="#B08050" stroke="#8E6838" stroke-width="0.9"/>
    <path d="M 112 94 L 126 74 L 116 82 L 122 64 L 110 80 Z" fill="#B08050" stroke="#8E6838" stroke-width="0.9"/>
    <path d="M 82 86 L 78 76" stroke="#D0A070" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 116 86 L 120 76" stroke="#D0A070" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- 大耳 -->
    <path d="M 82 104 L 70 94 L 86 100 Z" fill="#D0A070" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 116 104 L 128 94 L 112 100 Z" fill="#D0A070" stroke="#8E6838" stroke-width="0.8"/>
    <!-- 驴尾 -->
    <path d="M 74 122 Q 62 116 56 124" stroke="#A87848" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 74 122;4 74 122;-4 74 122" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="55" cy="125" r="2" fill="#8E6838"/>
    <!-- 身 -->
    <ellipse cx="98" cy="120" rx="19" ry="14" fill="url(#fur)" stroke="#8E6838" stroke-width="1"/>
    <!-- 马脸 -->
    <ellipse cx="98" cy="104" rx="11" ry="10" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <path d="M 102 108 Q 108 108 110 106 Q 108 112 102 112 Z" fill="#E8DCC8" stroke="#C8B8A0" stroke-width="0.6"/>
    <!-- 眼（含威含温） -->
    <circle cx="93" cy="103" r="2.6" fill="#2E2A24"/>
    <circle cx="93.8" cy="101.8" r="1" fill="#FFF"/>
    <circle cx="103" cy="103" r="2.6" fill="#2E2A24"/>
    <circle cx="103.8" cy="101.8" r="1" fill="#FFF"/>
    <!-- 额饰（水光） -->
    <circle cx="98" cy="95" r="2.5" fill="#E8F8E0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 108 107 L 106 109.5 L 110 109.5 Z" fill="#8E6838"/>
    <!-- 嘴（定） -->
    <path d="M 107 112 Q 109 113.4 111 112" fill="none" stroke="#8E6838" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 牛蹄（如掌，前伸探兽） -->
    <path d="M 82 128 L 75 138" stroke="#A87848" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 114 128 L 121 138" stroke="#A87848" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 74 139 L 73 142 M 76 139 L 76 142" stroke="#8E6838" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 120 139 L 121 142 M 122 139 L 122 142" stroke="#8E6838" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 探陷兽的蹄 -->
    <path d="M 106 116 L 80 120" stroke="#A87848" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 106 116;4 106 116;-4 106 116" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#F0FCE0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
