<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="东北虎·六阶·东北虎传说·暮雪厚掌按小虎崽额传王字不是抢来的">
  <defs>
    <!-- 背景：北境雪崖暮雪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#A0A8A0"/>
      <stop offset="100%" stop-color="#D8E4E8"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E8A848"/>
      <stop offset="100%" stop-color="#B87820"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="40" cy="30" r="1.2">
      <animate attributeName="cy" values="30;54;30" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="22" r="1">
      <animate attributeName="cy" values="22;46;22" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 雪地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#D8E4E8" opacity="0.9"/>

  <!-- 安住的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="90" cy="134.8" r="1" fill="#2E2A24"/>
    <circle cx="95" cy="134.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 小虎崽（右，厚掌学走） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="144" cy="122" rx="11" ry="9" fill="url(#fur)" stroke="#9E5E10" stroke-width="0.7"/>
    <path d="M 135 116 Q 144 112 153 116" stroke="#3E3228" stroke-width="1" fill="none" opacity="0.7"/>
    <ellipse cx="144" cy="114" rx="7" ry="6" fill="url(#fur)" stroke="#9E5E10" stroke-width="0.6"/>
    <path d="M 144 107 L 144 111 M 141 109 L 147 109" stroke="#3E3228" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <circle cx="141" cy="113" r="1.8" fill="#2E2A24"/>
    <circle cx="141.8" cy="112.2" r="0.7" fill="#FFF"/>
    <circle cx="149" cy="113" r="1.8" fill="#2E2A24"/>
    <circle cx="149.8" cy="112.2" r="0.7" fill="#FFF"/>
    <path d="M 152 117 L 154 117 L 153 119 Z" fill="#7A5A3E"/>
    <path d="M 136 128 L 133 132" stroke="#B87820" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 152 128 L 155 132" stroke="#B87820" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 老东北虎（左，厚掌按小虎崽额） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳 -->
    <path d="M 66 102 L 56 86 L 72 97 Z" fill="#E8A848" stroke="#8E5E18" stroke-width="0.8"/>
    <path d="M 90 102 L 100 86 L 84 97 Z" fill="#E8A848" stroke="#8E5E18" stroke-width="0.8"/>
    <!-- 尾（如古旗） -->
    <path d="M 60 116 Q 46 106 44 118 Q 42 128 54 134" stroke="#E8A848" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 46 112 L 48 120" stroke="#3E3228" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 身（大，泛岁月光） -->
    <ellipse cx="80" cy="120" rx="19" ry="14" fill="url(#fur)" stroke="#8E5E18" stroke-width="1"/>
    <!-- 黑纹（如古印） -->
    <path d="M 64 112 Q 80 104 96 112" stroke="#3E3228" stroke-width="1.4" fill="none" opacity="0.8"/>
    <path d="M 66 128 Q 80 120 94 128" stroke="#3E3228" stroke-width="1.2" fill="none" opacity="0.7"/>
    <!-- 头 -->
    <ellipse cx="80" cy="106" rx="10" ry="9" fill="url(#fur)" stroke="#8E5E18" stroke-width="0.8"/>
    <!-- 额间王纹（如古印） -->
    <path d="M 80 98 L 80 103 M 77 101 L 83 101" stroke="#3E3228" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 75 105 Q 77 103.6 79 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 85 105 Q 87 103.6 88 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 鼻 -->
    <path d="M 87 109 L 89 109 L 88 111 Z" fill="#6E4E32"/>
    <!-- 嘴（慈） -->
    <path d="M 88 114 Q 86 115.4 84 114" fill="none" stroke="#6E4E32" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 厚掌（按小虎崽额，传） -->
    <path d="M 86 112 L 116 108" stroke="#E8A848" stroke-width="3.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-3 86 112;3 86 112;-3 86 112" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="118" cy="107" r="3" fill="#FFF8E0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 后掌 -->
    <path d="M 68 130 L 62 140" stroke="#E8A848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 94 130 L 100 140" stroke="#E8A848" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 掌传 -->
    <path d="M 94 104 Q 110 102 128 106" stroke="#FFF0D0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="124" cy="104" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
