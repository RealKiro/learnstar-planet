<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大熊猫·四阶·护竹初成·春日蹲新笋笑眯眼">
  <defs>
    <!-- 背景：春日竹坡 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E0B8"/>
      <stop offset="52%" stop-color="#A8C89A"/>
      <stop offset="100%" stop-color="#88B07E"/>
    </linearGradient>
    <!-- 春阳金 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 新笋青 -->
    <radialGradient id="green" cx="50%" cy="56%" r="44%">
      <stop offset="0%" stop-color="#9ED888" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9ED888" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A44"/>
      <stop offset="100%" stop-color="#1E1E28"/>
    </linearGradient>
    <!-- 白毛（沾雪，渐白） -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8FA"/>
      <stop offset="100%" stop-color="#D0D0D8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 春阳 -->
  <circle cx="100" cy="58" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 新笋青 -->
  <circle cx="100" cy="112" r="62" fill="url(#green)">
    <animate attributeName="opacity" values="0.6;0.38;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 残林渐绿 -->
  <g stroke="#5E8E5E" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M 20 64 Q 18 106 14 160 M 178 60 Q 180 102 176 160"/>
    <path d="M 24 84 L 14 96 M 174 82 L 184 94"/>
  </g>

  <!-- 新笋一排 -->
  <g fill="#7EB878">
    <path d="M 54 146 L 54 136 Q 52 132 54 130 Q 56 132 56 136 L 56 146 Z"/>
    <path d="M 70 148 L 70 138 Q 68 134 70 132 Q 72 134 72 138 L 72 148 Z"/>
    <path d="M 86 148 L 86 140 Q 84 136 86 134 Q 88 136 88 140 L 88 148 Z">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 坡地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7EA872" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#96B88A" stroke-width="1.4" opacity="0.6"/>

  <!-- 大熊猫（2头身，蹲新笋旁，笑眯眼） -->
  <!-- 腿 -->
  <path d="M 104 146 Q 100 152 106 154 Q 112 154 112 148 Z" fill="#1E1E28"/>
  <path d="M 126 146 Q 130 152 124 154 Q 118 154 118 148 Z" fill="#1E1E28"/>
  <!-- 身体 -->
  <ellipse cx="115" cy="126" rx="20" ry="17" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 沾雪 -->
  <path d="M 108 122 Q 110 118 114 120" stroke="#F8F8FA" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 肩部黑色臂带 -->
  <path d="M 95 120 Q 100 108 110 112 L 112 122 Q 102 128 95 120 Z" fill="url(#black)"/>
  <path d="M 135 120 Q 130 108 120 112 L 118 122 Q 128 128 135 120 Z" fill="url(#black)"/>
  <!-- 黑尾 -->
  <circle cx="138" cy="132" r="3.4" fill="#1E1E28"/>

  <!-- 头（黑耳立起，圆眼笑眯） -->
  <circle cx="115" cy="100" r="13" fill="url(#white)" stroke="#A8A8B0" stroke-width="0.8"/>
  <!-- 黑耳 -->
  <circle cx="102" cy="89" r="4.4" fill="url(#black)"/>
  <circle cx="128" cy="89" r="4.4" fill="url(#black)"/>
  <!-- 黑眼圈 -->
  <ellipse cx="109" cy="101" rx="4.6" ry="4" fill="url(#black)"/>
  <ellipse cx="121" cy="101" rx="4.6" ry="4" fill="url(#black)"/>
  <!-- 圆眼笑眯 -->
  <path d="M 106 101 Q 109 99 112 101 Q 109 103 106 101 Z" fill="#1E1008"/>
  <path d="M 118 101 Q 121 99 124 101 Q 121 103 118 101 Z" fill="#1E1008"/>
  <!-- 黑鼻 -->
  <ellipse cx="115" cy="106" rx="2.6" ry="1.8" fill="#1E1008"/>
  <!-- 笑眯嘴 -->
  <path d="M 110 109 Q 115 111.4 120 109" fill="none" stroke="#6E6E78" stroke-width="1" stroke-linecap="round"/>

  <!-- 前爪（数笋） -->
  <path d="M 106 118 C 100 124 98 130 100 136" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="100" cy="138" r="3.4" fill="#1E1E28"/>
  <!-- 右爪（撑地） -->
  <path d="M 124 118 C 128 124 130 130 128 136" fill="none" stroke="#1E1E28" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="128" cy="138" r="3.4" fill="#1E1E28"/>

  <!-- 春阳星尘 -->
  <g fill="#FFF8E0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
