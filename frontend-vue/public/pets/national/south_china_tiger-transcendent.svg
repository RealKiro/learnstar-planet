<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="华南虎·六阶·虎王传说·暮色巡山看生灵重鸣长啸如誓">
  <defs>
    <!-- 背景：暮色山林镀金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#D09A5E"/>
      <stop offset="100%" stop-color="#B87E48"/>
    </linearGradient>
    <!-- 暮山金 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 虎王余晖 -->
    <radialGradient id="halo" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄底毛（渐淡仍威严） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0A85A"/>
      <stop offset="100%" stop-color="#C8903E"/>
    </linearGradient>
    <!-- 白腹 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E8D4"/>
      <stop offset="100%" stop-color="#DCD0B2"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暮山金 -->
  <circle cx="100" cy="56" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 虎王余晖 -->
  <circle cx="96" cy="112" r="64" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.3;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 群山镀金 -->
  <path d="M 0 130 Q 50 114 110 122 Q 160 128 200 118 L 200 200 L 0 200 Z" fill="#C89A5E" opacity="0.55"/>
  <path d="M 0 148 Q 60 136 130 144 Q 180 150 200 142 L 200 200 L 0 200 Z" fill="#B08A4E" opacity="0.65"/>

  <!-- 归林飞鸟（生灵重鸣，暮色里归来） -->
  <g stroke="#6E5A4E" stroke-width="1.3" stroke-linecap="round" opacity="0.7" fill="none">
    <path d="M 30 76 Q 36 72 42 76">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 46 60 Q 52 56 58 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;-7 -4;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 62 70 Q 68 66 74 70">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 -3;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 新生小兽（右下，跑过林间，山重新热闹） -->
  <g>
    <ellipse cx="46" cy="146" rx="6.4" ry="4.4" fill="#B08A6E"/>
    <circle cx="41" cy="142" r="3" fill="#C09A7E"/>
    <circle cx="39.5" cy="141" r="0.9" fill="#24180E"/>
    <circle cx="43" cy="141" r="0.9" fill="#24180E"/>
    <path d="M 44 140 L 46 137" stroke="#C09A7E" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 48 143 L 53 142 M 48 145 L 54 145" stroke="#C8B89C" stroke-width="0.6" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
  </g>
  <!-- 幼虎（更小，跟在老虎王旁，新一代） -->
  <g opacity="0.85">
    <ellipse cx="132" cy="142" rx="5.6" ry="4" fill="url(#fur)" stroke="#B08030" stroke-width="0.6"/>
    <path d="M 130 140 L 136 140 M 130 141.6 L 136 141.6 M 133 138.6 L 133 143" stroke="#2E1E10" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="130" cy="139.4" r="1.7" fill="#E0A85A" stroke="#B08030" stroke-width="0.5"/>
    <circle cx="135.6" cy="139.4" r="1.7" fill="#E0A85A" stroke="#B08030" stroke-width="0.5"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E7842" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#B8925E" stroke-width="1.4" opacity="0.6"/>

  <!-- 长啸如誓（一声低低长啸，如誓语） -->
  <g stroke="#FFF8E0" stroke-width="1.8" opacity="0.7" stroke-linecap="round" fill="none">
    <path d="M 118 62 Q 128 50 124 36">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 68 Q 144 60 150 48">
      <animate attributeName="opacity" values="0.5;0.18;0.5" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 58 Q 108 48 112 40">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 虎王（5头身，立山巅，最后一次巡山，虎目温和） -->
  <!-- 后腿 -->
  <path d="M 96 124 L 90 140 L 98 146 L 108 128 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 身体（身形依旧挺，渐淡） -->
  <path d="M 80 102 Q 74 120 86 132 Q 98 140 110 132 Q 116 120 112 102 Q 98 94 80 102 Z" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
  <!-- 白腹 -->
  <path d="M 88 110 Q 84 122 94 128 Q 104 132 108 124 Q 110 116 104 108 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 墨纹（渐淡仍显） -->
  <path d="M 80 108 Q 86 111 90 108 M 78 116 Q 86 119 94 116 M 108 106 Q 112 109 114 106" stroke="#2E1E10" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
  <!-- 前肢（撑立） -->
  <path d="M 90 120 C 84 126 82 130 82 138" fill="none" stroke="url(#fur)" stroke-width="5.2" stroke-linecap="round"/>
  <circle cx="82" cy="140" r="3.5" fill="#E0A85A"/>
  <path d="M 110 118 C 116 124 118 130 118 136" fill="none" stroke="url(#fur)" stroke-width="5.2" stroke-linecap="round"/>
  <circle cx="119" cy="138" r="3.5" fill="#E0A85A"/>

  <!-- 尾巴（低垂，沉稳） -->
  <path d="M 110 124 Q 124 120 130 110" stroke="url(#fur)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M 112 122 Q 124 118 128 112" stroke="#2E1E10" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" values="0 110 124;-4 110 124;0 110 124" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，王字淡却威严，虎目温和） -->
  <g>
    <ellipse cx="96" cy="90" rx="14" ry="13" fill="url(#fur)" stroke="#A87828" stroke-width="1"/>
    <!-- 虎耳 -->
    <circle cx="83" cy="80" r="4.4" fill="url(#fur)" stroke="#A87828" stroke-width="0.8"/>
    <circle cx="83" cy="80" r="2.2" fill="#F0E8D4"/>
    <circle cx="110" cy="80" r="4.4" fill="url(#fur)" stroke="#A87828" stroke-width="0.8"/>
    <circle cx="110" cy="80" r="2.2" fill="#F0E8D4"/>
    <!-- 额间王字（淡却威严） -->
    <path d="M 90 77 L 102 77 M 90 80 L 102 80 M 90 83 L 102 83 M 96 77 L 96 83" stroke="#2E1E10" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 白口鼻 -->
    <ellipse cx="96" cy="99" rx="9" ry="5.5" fill="url(#belly)" stroke="#C8BCA0" stroke-width="0.5"/>
    <!-- 虎目（温和，眼角微垂含善） -->
    <path d="M 88 87 Q 92 85 96 87" stroke="#2E1E10" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 96 87 Q 100 85 104 87" stroke="#2E1E10" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="90" cy="88.5" r="3" fill="#E8A83E"/>
    <circle cx="90" cy="88.5" r="1.5" fill="#2E1E10"/>
    <circle cx="90.5" cy="88.1" r="0.7" fill="#FFF8E0"/>
    <circle cx="102" cy="88.5" r="3" fill="#E8A83E"/>
    <circle cx="102" cy="88.5" r="1.5" fill="#2E1E10"/>
    <circle cx="102.5" cy="88.1" r="0.7" fill="#FFF8E0"/>
    <!-- 鼻 -->
    <ellipse cx="96" cy="97" rx="2.3" ry="1.8" fill="#6E3618"/>
    <!-- 抿唇（安详） -->
    <path d="M 91 101 Q 96 103.4 101 101" fill="none" stroke="#8E5A32" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 虎须 -->
    <path d="M 88 99 L 80 98 M 88 101 L 79 102 M 104 99 L 112 98 M 104 101 L 113 102" stroke="#F0E8D4" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 暮金星尘 -->
  <g fill="#FFF8E0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
