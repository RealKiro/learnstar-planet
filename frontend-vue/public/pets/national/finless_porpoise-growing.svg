<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="江豚·三阶·练辨苦修·浑湾练游稳辨向记礁记草稳游回">
  <defs>
    <!-- 背景：浑浊江湾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E7A8A"/>
      <stop offset="52%" stop-color="#7A8686"/>
      <stop offset="100%" stop-color="#7A9E86"/>
    </linearGradient>
    <!-- 辨江水光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#C8D8D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8D8D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰黑身 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#7E8A90"/>
      <stop offset="100%" stop-color="#525E64"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 浑江面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E7A86" opacity="0.8"/>
  <g stroke="#A8B8B0" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 记下的暗礁（右，识路） -->
  <g fill="#5E6E6E" opacity="0.8">
    <path d="M 150 130 L 166 120 L 172 130 L 158 138 Z"/>
    <circle cx="156" cy="132" r="1.5" fill="#C8D8D0" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 记下的水草（左） -->
  <g fill="#4E8868" stroke="#3E6E58" stroke-width="0.5" opacity="0.7">
    <path d="M 46 148 Q 50 138 46 130 Q 52 138 54 128 Q 56 140 52 148 Z"/>
  </g>

  <!-- 少年江豚（中，稳游辨向） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 圆身 -->
    <ellipse cx="96" cy="120" rx="18" ry="12" fill="url(#body)" stroke="#3E4A50" stroke-width="1"/>
    <!-- 滑亮 -->
    <ellipse cx="92" cy="116" rx="10" ry="5" fill="#A8B4B8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.25;0.4" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 头 -->
    <ellipse cx="96" cy="110" rx="11" ry="9" fill="url(#body)" stroke="#3E4A50" stroke-width="0.8"/>
    <!-- 笑脸（沉稳） -->
    <path d="M 90 114 Q 96 117.5 102 114" fill="none" stroke="#2E3A40" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 89 113.5 Q 88 112.5 89 112" stroke="#2E3A40" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 103 113.5 Q 104 112.5 103 112" stroke="#2E3A40" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 眼（沉稳） -->
    <circle cx="90" cy="108" r="2.4" fill="#2E2A24"/>
    <circle cx="90.8" cy="106.8" r="1" fill="#FFF"/>
    <circle cx="102" cy="108" r="2.4" fill="#2E2A24"/>
    <circle cx="102.8" cy="106.8" r="1" fill="#FFF"/>
    <!-- 额饰（辨江） -->
    <circle cx="96" cy="101" r="2" fill="#C8D8D0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 胸鳍 -->
    <path d="M 82 120 L 74 126" stroke="#525E64" stroke-width="3" stroke-linecap="round"/>
    <path d="M 110 120 L 118 126" stroke="#525E64" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾鳍 -->
    <path d="M 78 128 Q 70 134 62 128 L 60 136" stroke="#525E64" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 78 128;4 78 128;-4 78 128" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 辨向光纹 -->
    <g stroke="#C8D8D0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4">
      <path d="M 108 116 Q 116 116 122 112">
        <animate attributeName="opacity" values="0.4;0.18;0.4" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 86 126 Q 78 128 72 130" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.13;0.3" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#C8D8D0">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
