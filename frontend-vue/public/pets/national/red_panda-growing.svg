<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小熊猫·三阶·练尾苦修·练跑尾轻灵学竖稳稳撑伞挡雨护小兽">
  <defs>
    <!-- 背景：竹林雨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AB8B0"/>
      <stop offset="52%" stop-color="#A8C8A8"/>
      <stop offset="100%" stop-color="#6EA880"/>
    </linearGradient>
    <!-- 雨光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#E8F8E8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8F8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 红褐毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D87850"/>
      <stop offset="100%" stop-color="#A85028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 竹林 -->
  <g stroke="#4E8858" stroke-width="5" stroke-linecap="round">
    <path d="M 24 148 L 28 40"/>
    <path d="M 170 148 L 174 44"/>
  </g>
  <!-- 雨丝 -->
  <g stroke="#8AC0E0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 30 30 L 26 48">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 20" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 160 34 L 156 52">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 20" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6EA880" opacity="0.9"/>

  <!-- 被尾挡雨的小兽（右，安） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="152" cy="132" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="130.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="130.8" r="1.1" fill="#2E2A24"/>
  </g>

  <!-- 少年小熊猫（中，尾如伞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蓬尾（如伞，撑开） -->
    <path d="M 88 114 Q 82 88 94 76 Q 108 88 106 114 Z" fill="url(#fur)" stroke="#8E4020" stroke-width="0.9">
      <animateTransform attributeName="transform" type="rotate" values="-3 94 96;3 94 96;-3 94 96" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 89 98 L 103 94 M 90 108 L 104 106" stroke="#8E4020" stroke-width="1.3" fill="none" opacity="0.6"/>
    <circle cx="96" cy="90" r="4" fill="#F0F8E0" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.18;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 圆耳 -->
    <path d="M 94 98 L 86 88 L 96 94 Z" fill="#D87850" stroke="#8E4020" stroke-width="0.7"/>
    <path d="M 108 98 L 116 88 L 106 94 Z" fill="#D87850" stroke="#8E4020" stroke-width="0.7"/>
    <!-- 身 -->
    <ellipse cx="100" cy="120" rx="14" ry="11" fill="url(#fur)" stroke="#8E4020" stroke-width="0.9"/>
    <!-- 白脸 -->
    <ellipse cx="100" cy="110" rx="9" ry="8" fill="#F0E8DC" stroke="#D8C8B0" stroke-width="0.6"/>
    <path d="M 94 110 Q 96 112 94 114" stroke="#D87850" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 106 110 Q 104 112 106 114" stroke="#D87850" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 眼（专注） -->
    <circle cx="96" cy="109" r="2.3" fill="#2E2A24"/>
    <circle cx="96.8" cy="107.8" r="0.9" fill="#FFF"/>
    <circle cx="104" cy="109" r="2.3" fill="#2E2A24"/>
    <circle cx="104.8" cy="107.8" r="0.9" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 100 113 L 100 115 Z" stroke="#8E4020" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴（定） -->
    <path d="M 98 116 Q 100 117.4 102 116" fill="none" stroke="#8E4020" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 短爪 -->
    <path d="M 88 126 L 83 132" stroke="#A85028" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 112 126 L 117 132" stroke="#A85028" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F8E8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
