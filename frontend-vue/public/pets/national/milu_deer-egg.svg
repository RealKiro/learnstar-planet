<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麋鹿·一阶·湿地幼鹿·湿地浅滩牛蹄探路以身作桥渡陷泥小兽">
  <defs>
    <!-- 背景：湿地浅滩 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D0B0"/>
      <stop offset="52%" stop-color="#8AB89A"/>
      <stop offset="100%" stop-color="#6EA880"/>
    </linearGradient>
    <!-- 水光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8F8E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 褐黄毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#C89868"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 芦苇 -->
  <g fill="#5A9868" opacity="0.7">
    <path d="M 24 148 Q 28 132 24 122 Q 30 132 32 120 Q 34 136 30 148 Z"/>
    <path d="M 168 148 Q 172 134 168 124 Q 174 134 176 122 Q 178 138 174 148 Z"/>
  </g>
  <!-- 浅滩水面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6EA880" opacity="0.9"/>
  <g stroke="#C8E8D0" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154"/>
  </g>

  <!-- 陷泥的小兽（右，被桥渡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="130" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="128.8" r="1.1" fill="#2E2A24"/>
  </g>

  <!-- 小麋鹿（中，牛蹄探路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鹿角（初） -->
    <path d="M 88 100 L 82 92 L 86 94 L 84 88 L 88 92 Z" fill="#A87848" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 102 100 L 108 92 L 104 94 L 106 88 L 102 92 Z" fill="#A87848" stroke="#8E6838" stroke-width="0.6"/>
    <!-- 大耳（马耳） -->
    <path d="M 88 104 L 82 98 L 90 100 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 104 104 L 110 98 L 102 100 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <!-- 驴尾（短，垂） -->
    <path d="M 78 122 Q 72 122 72 126 L 72 129" stroke="#A87848" stroke-width="2" stroke-linecap="round"/>
    <circle cx="72" cy="130" r="1.6" fill="#8E6838"/>
    <!-- 身（褐黄圆润） -->
    <ellipse cx="96" cy="122" rx="15" ry="12" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <!-- 马脸（长吻） -->
    <ellipse cx="96" cy="106" rx="10" ry="9" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 100 110 Q 106 110 108 108 Q 106 114 100 114 Z" fill="#E0D0B8" stroke="#C0B098" stroke-width="0.5"/>
    <!-- 眼（温亮） -->
    <circle cx="92" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="92.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="101.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 106 109 L 104 111 L 108 111 Z" fill="#8E6838"/>
    <!-- 嘴（轻） -->
    <path d="M 105 114 Q 107 115.4 109 114" fill="none" stroke="#8E6838" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 牛蹄（分趾） -->
    <path d="M 84 130 L 80 138" stroke="#A87848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 108 130 L 112 138" stroke="#A87848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 79 139 L 78 142 M 81 139 L 81 142" stroke="#8E6838" stroke-width="1" stroke-linecap="round"/>
    <path d="M 111 139 L 112 142 M 113 139 L 113 142" stroke="#8E6838" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F8E0">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
