<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雪豹·一阶·雪山幼豹·扒岩壁探头看母豹跃断崖">
  <defs>
    <!-- 背景：雪山晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BCD6E8"/>
      <stop offset="52%" stop-color="#9AB8D0"/>
      <stop offset="100%" stop-color="#7E9CB4"/>
    </linearGradient>
    <!-- 雪光 -->
    <radialGradient id="glow" cx="42%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F6FAFE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F6FAFE" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白底毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE0E6"/>
      <stop offset="100%" stop-color="#BCC2CA"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="50" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪山 -->
  <g fill="#EAF0F8" opacity="0.9">
    <path d="M 0 90 L 36 40 L 70 90 Z"/>
    <path d="M 46 90 L 92 26 L 138 90 Z"/>
    <path d="M 112 90 L 154 44 L 200 90 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.7">
    <path d="M 36 40 L 46 52 L 38 62 L 26 52 Z"/>
    <path d="M 92 26 L 104 44 L 94 56 L 80 44 Z"/>
    <path d="M 154 44 L 164 56 L 156 66 L 144 56 Z"/>
  </g>

  <!-- 雪岩（前景，断崖） -->
  <path d="M 0 118 Q 30 108 70 116 Q 100 122 130 116 L 150 118 L 154 200 L 0 200 Z" fill="#9AA6B4" stroke="#7E8A98" stroke-width="1.2"/>
  <path d="M 130 116 L 150 118 L 148 124 L 132 122 Z" fill="#B0BAC6"/>
  <!-- 断崖对面 -->
  <path d="M 158 120 L 184 114 Q 192 114 196 120 L 200 118 L 200 200 L 158 200 Z" fill="#8A96A4" stroke="#707C8A" stroke-width="1"/>
  <!-- 雪迹 -->
  <path d="M 20 128 Q 50 122 84 128 M 30 136 Q 60 132 96 138" stroke="#EAF0F8" stroke-width="1.2" opacity="0.6" fill="none"/>

  <!-- 母豹（跃过断崖，空中） -->
  <g opacity="0.9">
    <!-- 长尾（平衡） -->
    <path d="M 172 78 Q 184 70 192 64" stroke="url(#fur)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 身体（腾跃） -->
    <ellipse cx="166" cy="80" rx="13" ry="8" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.8"/>
    <!-- 黑斑 -->
    <circle cx="160" cy="80" r="1.6" fill="#4E565E"/>
    <circle cx="170" cy="84" r="1.4" fill="#4E565E"/>
    <circle cx="173" cy="76" r="1.5" fill="#4E565E"/>
    <!-- 腿（伸展） -->
    <path d="M 160 84 L 156 92 M 164 86 L 164 94 M 172 84 L 176 92 M 168 84 L 172 92" stroke="url(#fur)" stroke-width="3" stroke-linecap="round"/>
    <!-- 头（看对岸） -->
    <ellipse cx="152" cy="76" rx="6.5" ry="5.5" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.7"/>
    <circle cx="148" cy="74" r="1" fill="#24180E"/>
    <path d="M 150 72 Q 152 71 154 72" stroke="#24180E" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <!-- 圆耳 -->
    <circle cx="148" cy="72" r="2" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.5"/>
    <circle cx="157" cy="72" r="2" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.5"/>
    <!-- 落地雪尘 -->
    <g fill="#EAF0F8">
      <circle cx="150" cy="116" r="1.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;6 -6;0 0" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="162" cy="118" r="1.3">
        <animateTransform attributeName="transform" type="translate" values="0 0;7 -5;0 0" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.12;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 幼豹（4头身，扒岩壁探头，长尾坠着平衡，跃跃欲试） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 后腿（扒岩） -->
    <path d="M 96 132 L 92 146 L 98 148 L 104 136 Z" fill="url(#fur)" stroke="#8E96A2" stroke-width="1"/>
    <!-- 长尾（坠着，平衡） -->
    <path d="M 108 134 Q 122 140 128 148 Q 130 152 126 154" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 108 136;10 108 136;0 108 136" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 136 Q 122 141 127 148" stroke="#4E565E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 身体（探出岩缘） -->
    <path d="M 86 112 Q 82 124 90 132 Q 100 136 108 130 Q 112 122 108 112 Q 98 108 86 112 Z" fill="url(#fur)" stroke="#8E96A2" stroke-width="1"/>
    <!-- 黑斑 -->
    <circle cx="90" cy="118" r="1.7" fill="#4E565E"/>
    <circle cx="100" cy="122" r="1.5" fill="#4E565E"/>
    <circle cx="94" cy="128" r="1.4" fill="#4E565E"/>
    <!-- 前爪（扒岩缘） -->
    <path d="M 92 124 C 88 130 88 134 90 138" fill="none" stroke="url(#fur)" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="91" cy="140" r="2.8" fill="#C4CAD2"/>
    <path d="M 104 122 C 110 128 112 132 114 136" fill="none" stroke="url(#fur)" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="115" cy="138" r="2.8" fill="#C4CAD2"/>
  </g>

  <!-- 头（扒壁探头，跃跃欲试） -->
  <g>
    <ellipse cx="90" cy="104" rx="9.5" ry="8" fill="url(#fur)" stroke="#8E96A2" stroke-width="1"/>
    <!-- 圆耳 -->
    <circle cx="81" cy="97" r="3.4" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.7"/>
    <circle cx="99" cy="97" r="3.4" fill="url(#fur)" stroke="#8E96A2" stroke-width="0.7"/>
    <!-- 黑斑（脸部） -->
    <circle cx="85" cy="99" r="1.2" fill="#4E565E"/>
    <circle cx="95" cy="99" r="1.2" fill="#4E565E"/>
    <!-- 眼（跃跃欲试的光） -->
    <circle cx="85" cy="103" r="2" fill="#F0D890"/>
    <circle cx="85" cy="103" r="1" fill="#24180E"/>
    <circle cx="85.4" cy="102.7" r="0.5" fill="#FFF"/>
    <circle cx="95" cy="103" r="2" fill="#F0D890"/>
    <circle cx="95" cy="103" r="1" fill="#24180E"/>
    <circle cx="95.4" cy="102.7" r="0.5" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="90" cy="107" rx="2" ry="1.4" fill="#8E6E5E"/>
    <!-- 长须 -->
    <path d="M 84 106 L 78 105 M 84 108 L 77 109 M 96 106 L 102 105 M 96 108 L 103 109" stroke="#EAF0F8" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 雪光星尘 -->
  <g fill="#F6FAFE">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
