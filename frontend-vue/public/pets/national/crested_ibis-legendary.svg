<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱鹮·五阶·东方宝石·朝霞单足立粉翼映霞">
  <defs>
    <!-- 背景：水田朝霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2C8C0"/>
      <stop offset="52%" stop-color="#E0B090"/>
      <stop offset="100%" stop-color="#98AE80"/>
    </linearGradient>
    <!-- 霞光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="54%">
      <stop offset="0%" stop-color="#FFE8C0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE8C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 宝石光晕 -->
    <radialGradient id="halo" cx="50%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#FFD8E8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽如雪 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E4E8F0"/>
    </linearGradient>
    <!-- 粉翼映霞 -->
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8B0C0"/>
      <stop offset="100%" stop-color="#E890A8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="58" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 宝石光晕 -->
  <circle cx="100" cy="104" r="58" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 朝霞 -->
  <path d="M 0 130 Q 50 120 110 126 Q 160 130 200 122 L 200 200 L 0 200 Z" fill="#C89A6E" opacity="0.5"/>

  <!-- 水田（浅水） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E9E7C" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#A0C8B0" stroke-width="1.4" opacity="0.6"/>
  <path d="M 24 158 Q 52 156 82 158 M 120 164 Q 148 162 178 164" stroke="#F4FCF4" stroke-width="1" opacity="0.5" fill="none"/>
  <!-- 倒影 -->
  <g opacity="0.3">
    <ellipse cx="100" cy="164" rx="10" ry="3" fill="#E4E8F0"/>
    <path d="M 100 152 Q 98 158 100 168" stroke="#F0A8B8" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 朱鹮（4头身，单足立，粉翼映霞，长喙探水） -->
  <!-- 单足 -->
  <path d="M 100 126 L 100 150" stroke="#6E7682" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 收起的足 -->
  <path d="M 104 124 Q 108 122 110 119" stroke="#6E7682" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- 身体 -->
  <ellipse cx="100" cy="114" rx="16" ry="10" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
  <!-- 粉翼（微展，映霞） -->
  <path d="M 90 108 Q 70 96 52 96 Q 58 112 76 116 Q 86 114 90 108 Z" fill="url(#pink)" stroke="#A87888" stroke-width="0.7">
    <animateTransform attributeName="transform" type="rotate" values="3 90 108;-4 90 108;3 90 108" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 108 110 Q 118 104 126 104 Q 122 112 114 114 Q 110 113 108 110 Z" fill="url(#pink)" opacity="0.85"/>
  <!-- 尾羽 -->
  <path d="M 114 118 Q 124 120 130 124" stroke="#F0A8B8" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- 晨露（抖落） -->
  <g fill="#F4FCF4">
    <circle cx="58" cy="118" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 6;0 0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="66" cy="124" r="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 8;0 0" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 头（长喙探水，头冠蓬松） -->
  <circle cx="96" cy="102" r="5.2" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <!-- 头冠（蓬松） -->
  <path d="M 94 97 Q 92 92 94 88 M 97 97 Q 98 91 100 88 M 100 97 Q 102 93 104 91" stroke="#F0A8B8" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <!-- 朱红脸 -->
  <ellipse cx="94" cy="103" rx="3.6" ry="2.8" fill="#E06A4A"/>
  <!-- 长喙（探水） -->
  <path d="M 93 105 L 84 114 L 92 107 Z" fill="#2A2E3A"/>
  <!-- 探水微澜 -->
  <path d="M 82 116 Q 86 114 90 116" stroke="#F4FCF4" stroke-width="1" opacity="0.6" fill="none">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 眼（明亮） -->
  <circle cx="98" cy="102" r="1.2" fill="#24180E"/>
  <circle cx="98.4" cy="101.8" r="0.4" fill="#FFF"/>
  <path d="M 95 100 Q 98 99 100 100" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 霞光星尘 -->
  <g fill="#FFE8C0">
    <circle cx="38" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
