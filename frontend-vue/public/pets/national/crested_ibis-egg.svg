<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱鹮·一阶·粉翼雏鹮·巢中探头接母衔鱼虾">
  <defs>
    <!-- 背景：水田晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4E4C0"/>
      <stop offset="52%" stop-color="#B0CC9C"/>
      <stop offset="100%" stop-color="#90B080"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="44%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 母鹮白羽 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E4E8F0"/>
    </linearGradient>
    <!-- 粉翼 -->
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4A8B8"/>
      <stop offset="100%" stop-color="#E090A4"/>
    </linearGradient>
    <!-- 雏鹮绒羽 -->
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4E4E0"/>
      <stop offset="100%" stop-color="#C8C8C4"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="58" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 水田稻影 -->
  <g stroke="#5E8E5E" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 14 44 Q 12 96 8 160 M 26 56 Q 22 100 18 160"/>
  </g>
  <g fill="#C4A86E">
    <ellipse cx="12" cy="42" rx="4" ry="7" opacity="0.9"/>
    <ellipse cx="24" cy="54" rx="4" ry="7" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1 1;0 0" dur="3.4s" repeatCount="indefinite"/>
  </g>
  <!-- 远田 -->
  <path d="M 0 132 Q 50 122 110 128 Q 160 132 200 124 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>

  <!-- 水田（浅水） -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E9E7C" opacity="0.75"/>
  <path d="M 0 148 L 200 148" stroke="#9CC4AC" stroke-width="1.4" opacity="0.6"/>
  <path d="M 24 156 Q 52 154 82 156 M 120 162 Q 148 160 178 162" stroke="#EAF8F0" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 巢（浅滩芦苇搭的巢） -->
  <path d="M 74 144 Q 62 142 58 138 Q 58 148 68 152 L 96 152 Q 106 148 104 140 Q 98 144 86 144 Z" fill="#A8905E" stroke="#8E7A4E" stroke-width="1"/>
  <path d="M 66 146 Q 76 144 90 146 M 70 150 Q 82 148 96 150" stroke="#B09A6E" stroke-width="1.2" stroke-linecap="round" opacity="0.8" fill="none"/>

  <!-- 雏鹮（巢中探头，头冠粉羽风里轻颤） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（绒团） -->
    <ellipse cx="80" cy="136" rx="9" ry="8" fill="url(#down)" stroke="#B4B4AE" stroke-width="0.8"/>
    <!-- 粉羽翅边 -->
    <path d="M 72 134 Q 66 130 64 124" stroke="#E090A4" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 头（探头，头冠蓬松粉羽） -->
    <circle cx="80" cy="124" r="7" fill="url(#down)" stroke="#B4B4AE" stroke-width="0.8"/>
    <!-- 头冠（蓬松粉羽，轻颤） -->
    <path d="M 78 117 Q 76 112 78 108 M 80 117 Q 80 111 82 107 M 82 117 Q 84 113 86 110" stroke="#F0A8B8" stroke-width="1.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 80 117;6 80 117;0 80 117" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 朱红脸初显 -->
    <ellipse cx="78" cy="125" rx="3.6" ry="2.8" fill="#E8906E" opacity="0.85"/>
    <!-- 长喙（歪头接食，张） -->
    <path d="M 74 126 L 66 122 L 73 129 Z" fill="#2A2E3A"/>
    <path d="M 70 124 L 68 123" stroke="#2A2E3A" stroke-width="1" stroke-linecap="round"/>
    <!-- 眼（亮，望母） -->
    <circle cx="81" cy="123" r="1.5" fill="#24180E"/>
    <circle cx="81.4" cy="122.8" r="0.5" fill="#FFF"/>
  </g>

  <!-- 母鹮（右，衔鱼虾喂雏，粉翼） -->
  <!-- 腿（立于浅水） -->
  <path d="M 126 128 L 124 150" stroke="#6E7682" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 136 126 L 138 150" stroke="#6E7682" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 身体 -->
  <ellipse cx="130" cy="118" rx="15" ry="9" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
  <!-- 粉翼 -->
  <path d="M 142 112 Q 150 108 154 112 Q 150 118 144 118 Z" fill="url(#pink)"/>
  <!-- 尾羽（粉边） -->
  <path d="M 144 122 Q 152 124 156 128" stroke="#F0A8B8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 头（垂向雏鹮） -->
  <circle cx="114" cy="110" r="4.8" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <!-- 头冠蓬松 -->
  <path d="M 112 105 Q 110 101 112 98 M 115 105 Q 116 101 118 99" stroke="#F0A8B8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- 朱红脸 -->
  <ellipse cx="112" cy="111" rx="3" ry="2.4" fill="#E06A4A"/>
  <!-- 长喙（衔鱼虾，递向雏） -->
  <path d="M 110 111 L 98 108 L 110 113 Z" fill="#2A2E3A"/>
  <!-- 鱼虾 -->
  <ellipse cx="98" cy="106" rx="3.4" ry="2" fill="#8EAAAE"/>
  <path d="M 96 105 L 94 103 L 95 107 Z" fill="#8EAAAE"/>
  <!-- 眼（温柔） -->
  <circle cx="116" cy="110" r="1" fill="#24180E"/>
  <!-- 晨露 -->
  <circle cx="142" cy="116" r="1.4" fill="#EAF8F0" opacity="0.8"/>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
