<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小熊猫·四阶·护竹初成·风雪夜蓬尾拢护小兽焐到天亮">
  <defs>
    <!-- 背景：风雪竹林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A88A0"/>
      <stop offset="52%" stop-color="#88A8B0"/>
      <stop offset="100%" stop-color="#C8DCD0"/>
    </linearGradient>
    <!-- 雪光 -->
    <radialGradient id="glow" cx="40%" cy="40%" r="44%">
      <stop offset="0%" stop-color="#E8F0E0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8F0E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 红褐毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D07048"/>
      <stop offset="100%" stop-color="#A85028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="72" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风雪 -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="34" cy="30" r="1.2">
      <animate attributeName="cy" values="30;56;30" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="20" r="1">
      <animate attributeName="cy" values="20;46;20" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="60" r="1.1">
      <animate attributeName="cy" values="60;86;60" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#B8D0DC" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 20 90 Q 40 84 56 86">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 144 76 Q 162 72 178 74" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 竹林 -->
  <g stroke="#4E6E58" stroke-width="5" stroke-linecap="round">
    <path d="M 170 148 L 174 44"/>
  </g>
  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#C8DCD0" opacity="0.9"/>

  <!-- 被拢进尾下的小兽（中，安睡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="102" cy="134" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="100" cy="132.8" r="1.1" fill="#2E2A24"/>
    <circle cx="105" cy="132.8" r="1.1" fill="#2E2A24"/>
    <path d="M 98 133 Q 100 131.6 102 133" stroke="#7A90A8" stroke-width="0.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 护竹的小熊猫（中，蓬尾拢兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蓬尾（拢兽，如罩） -->
    <path d="M 76 116 Q 84 96 100 92 Q 118 96 122 116 Q 126 132 116 138 Q 100 142 84 138 Q 74 132 76 116 Z" fill="url(#fur)" stroke="#7A3A18" stroke-width="0.9"/>
    <path d="M 82 104 L 96 100 M 104 98 L 118 102 M 86 114 L 100 110" stroke="#7A3A18" stroke-width="1.3" fill="none" opacity="0.6"/>
    <!-- 圆耳 -->
    <path d="M 78 108 L 70 96 L 82 104 Z" fill="#D07048" stroke="#7A3A18" stroke-width="0.7"/>
    <path d="M 112 108 L 120 96 L 108 104 Z" fill="#D07048" stroke="#7A3A18" stroke-width="0.7"/>
    <!-- 身 -->
    <ellipse cx="98" cy="122" rx="14" ry="11" fill="url(#fur)" stroke="#7A3A18" stroke-width="0.9"/>
    <!-- 白脸 -->
    <ellipse cx="98" cy="112" rx="9" ry="8" fill="#F0E8DC" stroke="#C8B89A" stroke-width="0.6"/>
    <path d="M 92 112 Q 94 114 92 116" stroke="#D07048" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 104 112 Q 102 114 104 116" stroke="#D07048" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 眼（含温） -->
    <circle cx="94" cy="111" r="2.3" fill="#2E2A24"/>
    <circle cx="94.8" cy="109.8" r="0.9" fill="#FFF"/>
    <circle cx="102" cy="111" r="2.3" fill="#2E2A24"/>
    <circle cx="102.8" cy="109.8" r="0.9" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 98 115 L 98 117 Z" stroke="#7A3A18" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴（暖） -->
    <path d="M 96 118 Q 98 119.4 100 118" fill="none" stroke="#7A3A18" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 短爪 -->
    <path d="M 86 126 L 82 131" stroke="#A85028" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 110 126 L 114 131" stroke="#A85028" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 风雪拍背 -->
    <circle cx="70" cy="104" r="1.2" fill="#FFFFFF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="100" r="1.1" fill="#FFFFFF" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F0E0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
