<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱鹮·三阶·振翅苦修·穿云探水一击叼鱼虾">
  <defs>
    <!-- 背景：云下晨光浅滩 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8CCE8"/>
      <stop offset="52%" stop-color="#8AB0D4"/>
      <stop offset="100%" stop-color="#7A9EC6"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="34%" cy="34%" r="46%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E0E6F0"/>
    </linearGradient>
    <!-- 粉翼 -->
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4A8B8"/>
      <stop offset="100%" stop-color="#E08CA0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 晨光 -->
  <circle cx="68" cy="72" r="52" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海（下） -->
  <g fill="#E8EFF8" opacity="0.9">
    <path d="M 0 118 Q 30 108 60 116 Q 90 124 120 116 Q 150 108 180 116 L 200 112 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.85">
    <path d="M 20 122 Q 46 114 74 122 Q 100 128 128 120 Q 156 112 188 122 L 200 120 L 200 200 L 0 200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 浅滩（左下，探喙处） -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E9E7C" opacity="0.8"/>
  <path d="M 0 148 L 200 148" stroke="#9CC4AC" stroke-width="1.4" opacity="0.6"/>
  <path d="M 18 156 Q 40 154 64 156 M 100 162 Q 128 160 160 162" stroke="#EAF8F0" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 穿云的云缕 -->
  <g stroke="#F6FAFE" stroke-width="2.2" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 40 84 Q 58 78 78 82">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 96 Q 138 92 158 96">
      <animate attributeName="opacity" values="0.4;0.18;0.4" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 朱鹮（4头身，振翅向浅滩，长喙探水叼鱼虾） -->
  <!-- 腿（收拢） -->
  <path d="M 128 84 L 132 98 M 136 82 L 142 96" stroke="#6E7682" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 尾羽 -->
  <path d="M 134 76 Q 146 74 152 70" stroke="#F0A8B8" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- 身体 -->
  <ellipse cx="122" cy="74" rx="17" ry="10" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>

  <!-- 上翅（扇动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-16 120 68;-30 120 68;-16 120 68" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 118 68 Q 134 36 168 28 Q 162 48 142 58 Q 128 64 118 68 Z" fill="url(#pink)" stroke="#A87888" stroke-width="0.7"/>
    <path d="M 146 40 Q 162 34 168 28 Q 164 40 152 44 Q 148 42 146 40 Z" fill="#F6D8E0"/>
  </g>
  <!-- 下翅（扇动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 124 72;-20 124 72;-8 124 72" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 122 72 Q 106 46 76 40 Q 82 60 102 66 Q 114 70 122 72 Z" fill="url(#pink)" stroke="#A87888" stroke-width="0.7"/>
    <path d="M 96 50 Q 80 44 76 40 Q 80 52 92 54 Q 94 52 96 50 Z" fill="#F6D8E0"/>
  </g>

  <!-- 头（垂向浅滩，长喙探水） -->
  <circle cx="106" cy="76" r="5" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <!-- 头冠（蓬起） -->
  <path d="M 104 71 Q 102 66 104 62 M 107 71 Q 108 65 110 62 M 110 71 Q 112 67 114 65" stroke="#F0A8B8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 朱红脸 -->
  <ellipse cx="104" cy="77" rx="3.4" ry="2.6" fill="#E06A4A"/>
  <!-- 长喙（探入水中，叼起鱼虾） -->
  <path d="M 103 78 L 92 90 L 102 81 Z" fill="#2A2E3A"/>
  <!-- 叼起的鱼虾 -->
  <ellipse cx="92" cy="92" rx="4" ry="2.4" fill="#8EAAAE">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 -2;0 0" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M 89 91 L 86 89 L 88 93 Z" fill="#8EAAAE"/>
  <!-- 探水水花 -->
  <path d="M 88 94 Q 92 92 96 94" stroke="#EAF8F0" stroke-width="1.2" opacity="0.7" fill="none">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- 眼（坚定） -->
  <circle cx="107" cy="76" r="1.1" fill="#24180E"/>
  <path d="M 105 74 Q 107 73 109 74" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="120" cy="48">
      <animate attributeName="cy" values="48;38;48" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="66">
      <animate attributeName="cy" values="66;56;66" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
