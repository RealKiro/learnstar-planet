<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="扬子鳄·三阶·潜伏苦修·影同泥色雷霆一扑">
  <defs>
    <!-- 背景：泥潭江岸 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4C8A4"/>
      <stop offset="52%" stop-color="#94AC8A"/>
      <stop offset="100%" stop-color="#7A9674"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="44%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#F0F8E4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0F8E4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青褐硬鳞（与泥同色） -->
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A6A4E"/>
      <stop offset="100%" stop-color="#4E4E3A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="52" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 江岸芦苇 -->
  <g stroke="#5E8E5E" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 168 44 Q 172 100 178 160"/>
  </g>
  <g fill="#C4A86E">
    <ellipse cx="170" cy="42" rx="4" ry="7" opacity="0.9"/>
  </g>

  <!-- 远山 -->
  <path d="M 0 130 Q 50 120 110 126 Q 160 130 200 122 L 200 200 L 0 200 Z" fill="#6E9876" opacity="0.5"/>

  <!-- 泥潭 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#8E7C52" opacity="0.9"/>
  <path d="M 0 144 L 200 144" stroke="#B0A070" stroke-width="1.4" opacity="0.7"/>
  <!-- 泥水洼 -->
  <ellipse cx="46" cy="152" rx="20" ry="6" fill="#A89062" opacity="0.8"/>

  <!-- 猎物（水鸟，受惊欲起） -->
  <g>
    <!-- 惊起的水鸟 -->
    <ellipse cx="42" cy="128" rx="6" ry="4.6" fill="#A08A6E"/>
    <circle cx="38" cy="123" r="3" fill="#B09A7E"/>
    <path d="M 36 124 L 31 122 L 35 126 Z" fill="#D0B88A"/>
    <circle cx="40" cy="122.6" r="0.9" fill="#24180E"/>
    <!-- 翅（扑棱欲飞） -->
    <path d="M 44 126 Q 50 120 56 118" stroke="#A08A6E" stroke-width="1.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 44 126;-22 44 126;0 44 126" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <!-- 腿 -->
    <path d="M 40 131 L 38 135 M 44 131 L 46 135" stroke="#8E7A5E" stroke-width="1" stroke-linecap="round"/>
    <!-- 惊起的水花 -->
    <path d="M 36 136 Q 42 132 48 136" stroke="#C8B888" stroke-width="1" opacity="0.7" fill="none">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 扬子鳄（潜伏，影与泥同色，雷霆一扑） -->
  <!-- 尾巴（低伏） -->
  <path d="M 124 138 Q 146 132 160 122 Q 166 120 168 126 Q 164 132 150 138 Q 136 142 128 141 Z" fill="url(#scale)" stroke="#3E3E2E" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 124 140;-5 124 140;0 124 140" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 身体（低伏前扑） -->
  <path d="M 80 136 Q 74 124 90 120 Q 110 116 124 124 Q 132 132 126 140 Q 106 144 80 136 Z" fill="url(#scale)" stroke="#3E3E2E" stroke-width="0.9"/>
  <!-- 背棱鳞 -->
  <path d="M 90 122 L 92 116 L 96 122 Z M 101 119 L 103 112 L 107 119 Z M 112 123 L 114 116 L 118 123 Z" fill="#3E3E2E"/>
  <!-- 腹缘 -->
  <path d="M 86 140 Q 106 144 124 139 L 124 142 Q 106 147 86 142 Z" fill="#A89862" opacity="0.8"/>

  <!-- 头（前扑，雷霆之势） -->
  <g>
    <path d="M 58 132 Q 42 128 38 130 L 36 138 Q 50 140 58 136 L 66 134 Z" fill="url(#scale)" stroke="#3E3E2E" stroke-width="0.9"/>
    <!-- 上颚（张口扑） -->
    <path d="M 36 128 Q 46 122 60 126 L 58 130 Q 48 127 38 133 Z" fill="#4E4E3A"/>
    <!-- 张开的嘴 -->
    <path d="M 40 132 Q 48 136 60 133" stroke="#6E5A3E" stroke-width="1" fill="none"/>
    <!-- 细牙 -->
    <path d="M 42 132 L 41 134 M 46 133 L 45 135 M 50 133.5 L 49 135.5" stroke="#C8D4DC" stroke-width="0.8" stroke-linecap="round"/>
    <ellipse cx="64" cy="126" rx="9" ry="6.5" fill="url(#scale)" stroke="#3E3E2E" stroke-width="0.9"/>
    <!-- 凸眼（锐利） -->
    <circle cx="60" cy="122" r="3.2" fill="#F0D890"/>
    <circle cx="60" cy="121.6" r="1.6" fill="#24180E"/>
    <circle cx="60.5" cy="121.2" r="0.6" fill="#FFF"/>
    <circle cx="68" cy="121" r="3" fill="#F0D890"/>
    <circle cx="68" cy="120.6" r="1.5" fill="#24180E"/>
    <!-- 鼻孔 -->
    <circle cx="42" cy="126" r="1.2" fill="#3E3E2E"/>
    <!-- 泥迹（与泥同色） -->
    <path d="M 70 132 L 76 130 M 92 132 L 98 134" stroke="#8E7C52" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 扑起的泥花 -->
  <g fill="#B0A070">
    <circle cx="70" cy="136" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -6;0 0" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="138" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 -5;0 0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 天光星尘 -->
  <g fill="#F0F8E4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
