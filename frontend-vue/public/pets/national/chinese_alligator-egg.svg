<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="扬子鳄·一阶·泥潭幼鳄·露眼扑鱼咬空">
  <defs>
    <!-- 背景：江边泥潭 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFD8C4"/>
      <stop offset="52%" stop-color="#9EC0A2"/>
      <stop offset="100%" stop-color="#82A48A"/>
    </linearGradient>
    <!-- 江光 -->
    <radialGradient id="glow" cx="46%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#F4FFE8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4FFE8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青褐硬鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E6248"/>
      <stop offset="100%" stop-color="#484C36"/>
    </linearGradient>
    <!-- 腹鳞淡黄 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4C07E"/>
      <stop offset="100%" stop-color="#B8A05E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="56" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 江岸芦苇 -->
  <g stroke="#5E8E62" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 14 40 Q 12 96 8 160 M 28 54 Q 24 102 20 160"/>
  </g>
  <g fill="#C4A86E">
    <ellipse cx="12" cy="38" rx="4" ry="7" opacity="0.9"/>
    <ellipse cx="26" cy="52" rx="4" ry="7" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1 1;0 0" dur="3.4s" repeatCount="indefinite"/>
  </g>
  <!-- 远山 -->
  <path d="M 0 132 Q 50 122 110 128 Q 160 132 200 124 L 200 200 L 0 200 Z" fill="#6E9E78" opacity="0.5"/>

  <!-- 泥潭（前景） -->
  <path d="M 0 142 L 200 142 L 200 200 L 0 200 Z" fill="#8E7A52" opacity="0.9"/>
  <path d="M 0 142 L 200 142" stroke="#B09A70" stroke-width="1.4" opacity="0.7"/>
  <!-- 泥中水洼 -->
  <ellipse cx="60" cy="152" rx="16" ry="5" fill="#A89062" opacity="0.7"/>
  <ellipse cx="140" cy="156" rx="20" ry="6" fill="#A89062" opacity="0.7"/>

  <!-- 小鱼（逃过一扑，甩尾游走） -->
  <g>
    <ellipse cx="50" cy="116" rx="7" ry="3.4" fill="#8EAAAE"/>
    <path d="M 44 116 L 38 112 L 38 120 Z" fill="#8EAAAE"/>
    <circle cx="46" cy="115" r="0.9" fill="#24180E"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 -3;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 水花 -->
    <path d="M 42 122 Q 46 118 52 122" stroke="#C8DEE0" stroke-width="1.2" opacity="0.6" fill="none">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 幼鳄（3头身，低伏泥中，露背与眼，一扑咬空） -->
  <!-- 尾巴（露出泥面，长） -->
  <path d="M 128 134 Q 148 130 162 122 Q 168 120 170 126 Q 166 132 152 136 Q 138 138 130 138 Z" fill="url(#scale)" stroke="#3E4230" stroke-width="0.8"/>
  <path d="M 140 132 L 138 128 M 150 128 L 150 124 M 160 124 L 162 121" stroke="#3E4230" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 尾摆动 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 128 136;6 128 136;0 128 136" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 128 134 Q 148 130 162 122 Q 168 120 170 126 Q 166 132 152 136 Q 138 138 130 138 Z" fill="url(#scale)" stroke="#3E4230" stroke-width="0.8"/>
    <path d="M 140 132 L 138 128 M 150 128 L 150 124 M 160 124 L 162 121" stroke="#3E4230" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 身体（低伏泥中，露背） -->
  <path d="M 74 134 Q 70 124 84 120 Q 104 114 124 120 Q 134 126 130 136 Q 108 140 74 134 Z" fill="url(#scale)" stroke="#3E4230" stroke-width="0.9"/>
  <!-- 背棱鳞 -->
  <path d="M 84 122 L 86 116 L 90 122 Z M 96 119 L 98 112 L 102 119 Z M 110 118 L 112 111 L 116 118 Z M 122 122 L 124 115 L 128 122 Z" fill="#3E4230"/>
  <!-- 腹部淡黄（露一缘） -->
  <path d="M 80 138 Q 104 142 128 137 L 128 140 Q 104 145 80 140 Z" fill="url(#belly)" opacity="0.85"/>

  <!-- 头（宽吻扑空，眼凸出） -->
  <g>
    <!-- 宽吻（咬空，张嘴） -->
    <path d="M 62 128 Q 48 126 44 128 L 40 134 Q 52 136 60 134 L 68 132 Z" fill="url(#scale)" stroke="#3E4230" stroke-width="0.9"/>
    <!-- 上颚 -->
    <path d="M 40 126 Q 50 122 62 124 L 60 128 Q 50 126 42 130 Z" fill="#484C36"/>
    <!-- 张开的嘴（咬空） -->
    <path d="M 44 130 Q 52 134 62 132" stroke="#6E5A3E" stroke-width="1" fill="none"/>
    <!-- 细牙 -->
    <path d="M 46 130 L 45 132 M 50 131 L 49 133 M 54 132 L 53 134" stroke="#C8D4DC" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 头冠 -->
    <ellipse cx="70" cy="124" rx="10" ry="7" fill="url(#scale)" stroke="#3E4230" stroke-width="0.9"/>
    <!-- 凸眼（眼高于背） -->
    <circle cx="66" cy="120" r="3.4" fill="#E8D08E"/>
    <circle cx="66" cy="120" r="1.6" fill="#24180E"/>
    <circle cx="66.5" cy="119.6" r="0.6" fill="#FFF"/>
    <circle cx="74" cy="119" r="3.2" fill="#E8D08E"/>
    <circle cx="74" cy="119" r="1.5" fill="#24180E"/>
    <circle cx="74.5" cy="118.6" r="0.6" fill="#FFF"/>
    <!-- 鼻孔 -->
    <circle cx="46" cy="124" r="1.3" fill="#3E4230"/>
    <!-- 腹部 -->
    <path d="M 64 134 Q 74 136 84 134" stroke="#B8A05E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- 江光星尘 -->
  <g fill="#F4FFE8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
