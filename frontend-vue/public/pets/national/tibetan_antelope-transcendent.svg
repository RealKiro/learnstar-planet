<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="藏羚羊·六阶·荒原传说·暮色引幼羚跑过雪线剑角如笔回望天地">
  <defs>
    <!-- 背景：荒原暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#D09A5E"/>
      <stop offset="100%" stop-color="#B87E48"/>
    </linearGradient>
    <!-- 暮山金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 背毛（染暮色） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8B078"/>
      <stop offset="100%" stop-color="#B49058"/>
    </linearGradient>
    <!-- 腹白 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0DC"/>
      <stop offset="100%" stop-color="#E4D8BC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪山镀金 -->
  <g fill="#E8E0C8" opacity="0.85">
    <path d="M 0 94 L 42 40 L 78 94 Z"/>
    <path d="M 54 94 L 104 30 L 150 94 Z"/>
    <path d="M 122 94 L 164 50 L 200 92 Z"/>
  </g>
  <g fill="#F8F0DC" opacity="0.6">
    <path d="M 42 40 L 52 52 L 44 62 L 32 52 Z"/>
    <path d="M 104 30 L 116 48 L 106 60 L 92 48 Z"/>
  </g>

  <!-- 荒原 -->
  <path d="M 0 134 Q 50 124 110 132 Q 160 136 200 128 L 200 200 L 0 200 Z" fill="#A8906A" opacity="0.9"/>
  <path d="M 0 134 Q 50 124 110 132 Q 160 136 200 128" stroke="#C8B088" stroke-width="1.2" opacity="0.6"/>

  <!-- 幼羚（左后，跟着，跑过雪线） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 68 122 L 74 136 L 68 138 L 64 126 Z" fill="url(#belly)" stroke="#C8B892" stroke-width="0.8"/>
    <path d="M 58 120 Q 54 128 60 134 Q 68 137 74 132 Q 76 124 70 118 Q 64 116 58 120 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 62 122 C 56 128 54 132 54 138" fill="none" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="54" cy="140" r="2" fill="#5E4E3A"/>
    <ellipse cx="60" cy="112" rx="7" ry="5.5" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 60 107 Q 58 101 55 98" stroke="#4E3E2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 64 107 Q 65 101 66 98" stroke="#4E3E2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="111" r="1.3" fill="#24180E"/>
    <circle cx="64" cy="111" r="1.3" fill="#24180E"/>
  </g>

  <!-- 老羚（领头，剑角如笔，回望天地） -->
  <!-- 后腿 -->
  <path d="M 124 118 L 136 126 L 140 128 L 132 120 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 130 122;8 130 122;0 130 122" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M 112 116 L 116 130 L 110 132 L 108 120 Z" fill="url(#belly)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 112 122;-10 112 122;0 112 122" dur="1s" repeatCount="indefinite"/>
  </path>
  <!-- 身体 -->
  <path d="M 92 108 Q 88 118 98 126 Q 110 131 124 126 Q 130 116 124 106 Q 108 100 92 108 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="1"/>
  <!-- 腹白 -->
  <path d="M 94 114 Q 90 124 100 128 Q 112 130 120 124 Q 122 116 116 110 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 前腿 -->
  <path d="M 100 120 C 94 128 92 132 90 140" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 100 124;-10 100 124;0 100 124" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle cx="90" cy="142" r="2.6" fill="#5E4E3A"/>
  <path d="M 114 120 C 120 126 124 130 126 136" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 114 124;10 114 124;0 114 124" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle cx="127" cy="138" r="2.6" fill="#5E4E3A"/>
  <!-- 尾 -->
  <path d="M 124 112 Q 132 108 136 102" stroke="#B49058" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（回望，剑角如笔指暮天，眼神温和） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 90 100;6 90 100;0 90 100" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="90" cy="100" rx="10" ry="8" fill="url(#fur)" stroke="#9A7844" stroke-width="1"/>
    <!-- 白颊 -->
    <ellipse cx="87" cy="103" rx="5.5" ry="4" fill="url(#belly)" stroke="#DCCCA8" stroke-width="0.5"/>
    <!-- 剑角如笔（指暮天） -->
    <path d="M 90 94 Q 87 82 80 72" stroke="#4E3E2A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 96 94 Q 97 82 100 72" stroke="#4E3E2A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 耳 -->
    <path d="M 84 94 Q 78 92 76 88" stroke="#D8B078" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（温和，回望） -->
    <circle cx="86" cy="99" r="1.6" fill="#24180E"/>
    <circle cx="86.4" cy="98.8" r="0.5" fill="#FFF"/>
    <circle cx="95" cy="99" r="1.6" fill="#24180E"/>
    <circle cx="95.4" cy="98.8" r="0.5" fill="#FFF"/>
    <path d="M 84 96 Q 86 95 88 96 M 93 96 Q 95 95 97 96" stroke="#24180E" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 鼻 -->
    <path d="M 84 104 Q 88 105.6 92 104" stroke="#9A7844" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 蹄声回响（风里） -->
  <g stroke="#FFF8E0" stroke-width="1.2" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 38 106 Q 50 102 62 106">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 142 100 Q 154 96 166 100">
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#FFF8E0">
    <circle cx="36" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
