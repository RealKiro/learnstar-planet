<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="藏羚羊·四阶·护群初成·冲反方向扬尘引敌护群">
  <defs>
    <!-- 背景：高原晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4DCE8"/>
      <stop offset="52%" stop-color="#9CBCD0"/>
      <stop offset="100%" stop-color="#7EA2BC"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 背毛（带尘） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0A872"/>
      <stop offset="100%" stop-color="#AC8850"/>
    </linearGradient>
    <!-- 腹白 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF2DE"/>
      <stop offset="100%" stop-color="#E8DCBE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪山（远） -->
  <g fill="#E8EFF8" opacity="0.75">
    <path d="M 40 92 L 78 44 L 116 92 Z M 120 92 L 160 50 L 200 92 Z"/>
  </g>

  <!-- 族群脱险（右上，远跑向安全） -->
  <g stroke="#5E7E6E" stroke-width="1.5" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 148 84 Q 152 80 156 84"/>
    <path d="M 164 76 Q 168 72 172 76"/>
    <path d="M 178 84 Q 182 80 186 84">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 2;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 追兵（左上远，被引开） -->
  <g opacity="0.5">
    <path d="M 26 92 L 28 104" stroke="#4E4E42" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="27" cy="88" r="2.6" fill="#5E5E52"/>
    <path d="M 22 98 L 32 98" stroke="#4E4E42" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 20 106 L 34 108" stroke="#5E5E52" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 旷野 -->
  <path d="M 0 130 Q 50 120 110 128 Q 160 132 200 124 L 200 200 L 0 200 Z" fill="#A4BE82" opacity="0.85"/>
  <path d="M 0 130 Q 50 120 110 128 Q 160 132 200 124" stroke="#C4DC9C" stroke-width="1.2" opacity="0.6"/>

  <!-- 藏羚羊（4头身，冲反方向，扬尘引敌，剑角如剑） -->
  <!-- 后腿（猛蹬） -->
  <path d="M 116 118 L 128 128 L 132 130 L 124 120 Z" fill="url(#fur)" stroke="#92703E" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 122 122;10 122 122;0 122 122" dur="0.7s" repeatCount="indefinite"/>
  </path>
  <path d="M 102 116 L 108 132 L 102 134 L 98 120 Z" fill="url(#belly)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 104 122;-14 104 122;0 104 122" dur="0.7s" repeatCount="indefinite"/>
  </path>
  <!-- 身体 -->
  <path d="M 82 108 Q 78 118 88 126 Q 100 132 114 126 Q 120 116 114 106 Q 98 100 82 108 Z" fill="url(#fur)" stroke="#92703E" stroke-width="1"/>
  <!-- 腹白 -->
  <path d="M 84 114 Q 80 124 90 128 Q 102 131 110 124 Q 112 116 106 110 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 前腿（前冲） -->
  <path d="M 90 120 C 84 128 82 132 80 140" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 90 124;-14 90 124;0 90 124" dur="0.7s" repeatCount="indefinite"/>
  </path>
  <circle cx="80" cy="142" r="2.6" fill="#5E4E3A"/>
  <path d="M 104 120 C 110 126 114 130 116 136" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 104 124;14 104 124;0 104 124" dur="0.7s" repeatCount="indefinite"/>
  </path>
  <circle cx="117" cy="138" r="2.6" fill="#5E4E3A"/>
  <!-- 尾（扬起） -->
  <path d="M 114 112 Q 122 108 126 102" stroke="#AC8850" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 114 112;14 114 112;0 114 112" dur="0.7s" repeatCount="indefinite"/>
  </path>

  <!-- 头（前冲，剑角如剑，眼神坚毅） -->
  <g>
    <ellipse cx="80" cy="100" rx="10" ry="8" fill="url(#fur)" stroke="#92703E" stroke-width="1"/>
    <!-- 白颊 -->
    <ellipse cx="77" cy="103" rx="5.5" ry="4" fill="url(#belly)" stroke="#DCCCA8" stroke-width="0.5"/>
    <!-- 剑角如剑 -->
    <path d="M 80 94 Q 77 82 70 72" stroke="#4E3E2A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 86 94 Q 87 82 90 72" stroke="#4E3E2A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 耳 -->
    <path d="M 74 94 Q 68 92 66 88" stroke="#D0A872" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（坚毅） -->
    <path d="M 74 97 Q 76 96 78 97 M 82 97 Q 84 96 86 97" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="76.4" cy="98.8" r="0.5" fill="#FFF"/>
    <circle cx="85" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="85.4" cy="98.8" r="0.5" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 74 104 Q 78 105.6 82 104" stroke="#92703E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 扬尘引敌（大团） -->
  <g fill="#C8CCB8">
    <circle cx="132" cy="134" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-10 -5;0 0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.08;0.8" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="138" r="2.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 -6;0 0" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.08;0.7" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="138" cy="128" r="2.2">
      <animateTransform attributeName="transform" type="translate" values="0 0;-11 -7;0 0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.06;0.6" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="140" r="2">
      <animateTransform attributeName="transform" type="translate" values="0 0;-13 -6;0 0" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8D8">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
