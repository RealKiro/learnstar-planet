<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金丝猴·二阶·族群离散·独踞高枝攥金缕">
  <defs>
    <!-- 背景：山洪后林间 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E8E7E"/>
      <stop offset="52%" stop-color="#7E6E5E"/>
      <stop offset="100%" stop-color="#5E4E3E"/>
    </linearGradient>
    <!-- 迷雾灰 -->
    <radialGradient id="fog" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D8D0C8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D8D0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 山洪褐 -->
    <radialGradient id="flood" cx="34%" cy="56%" r="38%">
      <stop offset="0%" stop-color="#8E6A4E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8E6A4E" stop-opacity="0"/>
    </radialGradient>
    <!-- 金色长毛（沾泥） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8AE48"/>
      <stop offset="100%" stop-color="#AE8430"/>
    </linearGradient>
    <!-- 蓝面含忧 -->
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA8D8"/>
      <stop offset="100%" stop-color="#6E86B8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 迷雾 -->
  <circle cx="100" cy="70" r="74" fill="url(#fog)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 山洪 -->
  <circle cx="68" cy="116" r="54" fill="url(#flood)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 洪水痕迹 -->
  <path d="M 0 142 Q 60 134 120 140 Q 170 144 200 138 L 200 200 L 0 200 Z" fill="#6E5A44" opacity="0.7"/>
  <!-- 倒木 -->
  <path d="M 140 134 Q 152 128 164 132 L 168 138 Q 154 136 144 140 Z" fill="#5E4A3E" opacity="0.6"/>

  <!-- 高枝（独踞） -->
  <path d="M 30 120 Q 60 100 96 92 Q 120 88 130 96" stroke="#5E4A3E" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 96 92 L 88 80 M 96 92 L 108 82" stroke="#5E4A3E" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 迷雾残枝 -->
  <g stroke="#5E4A3E" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M 150 70 Q 154 100 148 130"/>
  </g>

  <!-- 金毛小猴（3头身，独踞高枝，攥金缕） -->
  <!-- 腿（蹲踞） -->
  <path d="M 84 134 Q 90 140 98 136 Q 102 132 98 130 Q 92 134 86 130 Z" fill="#AE8430"/>
  <!-- 身体 -->
  <path d="M 82 100 Q 78 118 86 134 Q 96 140 104 134 Q 110 118 106 100 Q 94 94 82 100 Z" fill="url(#fur)" stroke="#966820" stroke-width="1"/>
  <!-- 泥渍 -->
  <path d="M 88 112 Q 90 118 87 124" stroke="#7E6A4E" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- 尾巴（垂） -->
  <path d="M 106 128 Q 112 124 114 118" stroke="#AE8430" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（蓝面含忧，圆眼蓄泪，金毛凌乱） -->
  <ellipse cx="93" cy="94" rx="11" ry="10.5" fill="url(#fur)" stroke="#966820" stroke-width="0.9"/>
  <!-- 金毛凌乱 -->
  <path d="M 86 88 Q 84 82 88 80 M 100 88 Q 104 82 100 80" stroke="#AE8430" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 圆耳 -->
  <circle cx="83" cy="86" r="3.4" fill="#D8AE48" stroke="#966820" stroke-width="0.7"/>
  <circle cx="103" cy="86" r="3.4" fill="#D8AE48" stroke="#966820" stroke-width="0.7"/>
  <!-- 蓝面 -->
  <ellipse cx="93" cy="98" rx="8.5" ry="6.5" fill="url(#face)" stroke="#5E76A8" stroke-width="0.6"/>
  <!-- 圆眼蓄泪 -->
  <circle cx="88" cy="95" r="3" fill="#1E1008"/>
  <circle cx="98" cy="95" r="3" fill="#1E1008"/>
  <circle cx="89" cy="94" r="1" fill="#FFF"/>
  <circle cx="99" cy="94" r="1" fill="#FFF"/>
  <!-- 泪光 -->
  <path d="M 86 97 Q 85 99 86 101" stroke="#C8E8F8" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <animate attributeName="cy" values="97;102;97" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 朝天鼻 -->
  <ellipse cx="93" cy="99" rx="2.8" ry="2.2" fill="#5E6E9E"/>
  <!-- 忧抿唇 -->
  <path d="M 88 103 Q 93 104.6 98 103" fill="none" stroke="#8E6A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（攥着金缕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 86 104 C 80 108 76 112 74 118" fill="none" stroke="#C89636" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="73" cy="120" r="3" fill="#D8A85E"/>
    <!-- 一缕金毛 -->
    <path d="M 73 122 Q 70 126 72 130 M 73 122 Q 75 127 73 131" stroke="#E8C878" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 右手（抚枝，呼唤） -->
  <path d="M 102 104 C 108 100 112 96 114 90" fill="none" stroke="#C89636" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="115" cy="88" r="2.8" fill="#D8A85E"/>

  <!-- 回音（呼唤） -->
  <path d="M 118 86 Q 124 82 128 76" stroke="#D8D0C8" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 迷雾星尘 -->
  <g fill="#D8D0C8">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
