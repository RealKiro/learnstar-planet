<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="扬子鳄·二阶·江域之危·缩深水望船影">
  <defs>
    <!-- 背景：被挖的江岸，浊水灰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A4AEA0"/>
      <stop offset="52%" stop-color="#849284"/>
      <stop offset="100%" stop-color="#6E7E70"/>
    </linearGradient>
    <!-- 天光惨淡 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#E8ECE4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8ECE4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青褐硬鳞（沾浊泥） -->
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#565A44"/>
      <stop offset="100%" stop-color="#40443A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.35;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 江面船影（陌生，远处） -->
  <g opacity="0.6">
    <path d="M 120 66 Q 138 62 156 66 L 154 72 L 122 72 Z" fill="#5E6A60" stroke="#4E5A52" stroke-width="1"/>
    <path d="M 132 62 L 133 50 M 144 62 L 143 50" stroke="#5E6A60" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 132 52 L 144 52 L 144 56 L 132 56 Z" fill="#4E5A52"/>
    <path d="M 134 62 Q 138 60 142 62" stroke="#4E5A52" stroke-width="0.8" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 堤岸工程（被挖，右） -->
  <g fill="#8E846E" stroke="#6E6652" stroke-width="1">
    <path d="M 152 150 L 176 130 Q 182 128 186 132 L 200 126 L 200 200 L 152 200 Z"/>
    <path d="M 162 138 Q 170 132 182 134" stroke="#A8987E" stroke-width="1.2" opacity="0.7" fill="none"/>
    <path d="M 158 146 L 168 140 M 172 142 L 180 138" stroke="#6E6652" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- 挖开的堤口 -->
  <path d="M 140 150 L 152 132 L 158 150 Z" fill="#A8966E" opacity="0.7"/>

  <!-- 浊江（前景） -->
  <path d="M 0 142 L 200 142 L 200 200 L 0 200 Z" fill="#6E7E6A" opacity="0.9"/>
  <path d="M 0 142 L 200 142" stroke="#8E9C8E" stroke-width="1.4" opacity="0.7"/>
  <!-- 浊水波纹 -->
  <path d="M 30 154 Q 56 152 84 156 M 110 160 Q 138 158 168 162" stroke="#98A898" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M 20 150 Q 44 148 68 150" stroke="#8E9C8E" stroke-width="0.8" opacity="0.4" fill="none"/>

  <!-- 幼鳄（缩在仅剩的深水里，只露背与眼，望船影） -->
  <!-- 身体（半沉，背脊露出） -->
  <path d="M 84 136 Q 78 126 92 122 Q 106 118 118 124 Q 126 132 120 138 Q 104 142 84 136 Z" fill="url(#scale)" stroke="#3A3E32" stroke-width="0.9"/>
  <!-- 背棱鳞 -->
  <path d="M 92 124 L 94 118 L 98 124 Z M 103 121 L 105 114 L 109 121 Z M 114 125 L 116 118 L 120 125 Z" fill="#3A3E32"/>
  <!-- 尾巴（半沉） -->
  <path d="M 118 136 Q 136 132 150 126 Q 156 124 158 130 Q 152 136 138 140 Q 126 142 120 140 Z" fill="url(#scale)" stroke="#3A3E32" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 118 138;-4 118 138;0 118 138" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <!-- 头（眼有忧色，望船影） -->
  <g>
    <path d="M 74 130 Q 62 128 58 130 L 56 136 Q 66 138 72 136 L 78 134 Z" fill="url(#scale)" stroke="#3A3E32" stroke-width="0.9"/>
    <ellipse cx="78" cy="126" rx="9" ry="6.5" fill="url(#scale)" stroke="#3A3E32" stroke-width="0.9"/>
    <!-- 凸眼（忧，望右上船影） -->
    <circle cx="74" cy="122" r="3.2" fill="#D0B878"/>
    <circle cx="74" cy="121" r="1.6" fill="#24180E"/>
    <circle cx="74.4" cy="120.6" r="0.6" fill="#FFF"/>
    <circle cx="82" cy="121" r="3" fill="#D0B878"/>
    <circle cx="82" cy="120" r="1.5" fill="#24180E"/>
    <!-- 浊泥迹 -->
    <path d="M 62 132 L 68 131 M 90 130 L 96 132" stroke="#A89062" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 同伴（近旁，碰身似相问"家还在吗"） -->
  <g opacity="0.9">
    <path d="M 148 138 Q 156 134 164 136 Q 168 140 162 142 Q 154 143 150 140 Z" fill="url(#scale)" stroke="#3A3E32" stroke-width="0.8"/>
    <circle cx="164" cy="134" r="2.8" fill="#D0B878"/>
    <circle cx="164" cy="133.4" r="1.4" fill="#24180E"/>
    <!-- 碰身的水波 -->
    <path d="M 132 140 Q 140 138 148 139" stroke="#98A898" stroke-width="1" opacity="0.6" fill="none">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 浊水尘 -->
  <g fill="#B0A888">
    <circle cx="40" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
