<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="华南虎·一阶·虎崽初生·扑叶对水照见王字">
  <defs>
    <!-- 背景：林边暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2EAB8"/>
      <stop offset="52%" stop-color="#AAC890"/>
      <stop offset="100%" stop-color="#8AAE76"/>
    </linearGradient>
    <!-- 暖阳金 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="54%">
      <stop offset="0%" stop-color="#FFFCE8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFCE8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄底毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2B25A"/>
      <stop offset="100%" stop-color="#DE963A"/>
    </linearGradient>
    <!-- 白腹 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0DC"/>
      <stop offset="100%" stop-color="#E8DCBE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 林边树影 -->
  <g stroke="#5E8E5E" stroke-width="2.6" stroke-linecap="round" opacity="0.5">
    <path d="M 22 40 Q 20 96 14 160 M 182 38 Q 184 96 176 160 M 40 56 Q 36 100 32 160 M 162 54 Q 166 100 160 160"/>
  </g>
  <g fill="#6EA868" opacity="0.7">
    <path d="M 20 44 Q 14 38 12 30 Q 18 34 20 44 Z"/>
    <path d="M 180 42 Q 186 36 188 28 Q 182 32 180 42 Z"/>
    <path d="M 36 60 Q 30 54 28 46 Q 34 50 36 60 Z"/>
  </g>

  <!-- 远山 -->
  <path d="M 0 128 Q 50 116 110 124 Q 160 130 200 120 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#88AE76" stroke-width="1.4" opacity="0.6"/>

  <!-- 水洼（左前，映出倒影与王字） -->
  <ellipse cx="46" cy="162" rx="20" ry="7" fill="#7EC4C8" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.7;0.85" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>
  <!-- 倒影：模糊虎脸 + 王字 -->
  <g opacity="0.55">
    <ellipse cx="46" cy="163" rx="7" ry="5" fill="#DE963A"/>
    <path d="M 42 161 L 50 161 M 42 163 L 50 163 M 42 165 L 50 165 M 46 161 L 46 165" stroke="#2E2013" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 水光 -->
  <path d="M 36 160 Q 42 159 48 160 M 40 164 Q 46 165 54 164" stroke="#EAFCFA" stroke-width="1" opacity="0.7" fill="none"/>

  <!-- 幼虎（4头身，潜行扑叶，虎头虎脑） -->
  <!-- 后腿 -->
  <path d="M 96 130 L 92 144 L 98 148 L 104 134 Z" fill="url(#fur)" stroke="#B87E2E" stroke-width="1"/>
  <!-- 白腹 -->
  <path d="M 88 112 Q 84 126 92 138 Q 100 144 106 138 Q 108 126 102 112 L 88 112 Z" fill="url(#belly)"/>
  <!-- 身体（橙黄+墨纹） -->
  <path d="M 82 104 Q 78 120 86 134 Q 96 140 104 134 Q 110 120 106 104 Q 96 98 82 104 Z" fill="url(#fur)" stroke="#B87E2E" stroke-width="1"/>
  <!-- 墨纹（横纹） -->
  <path d="M 82 110 Q 88 113 92 110 M 80 118 Q 88 121 94 118 M 104 108 Q 108 111 110 108" stroke="#4A3018" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- 前肢（趴低，准备扑） -->
  <path d="M 88 118 C 82 124 78 128 76 134" fill="none" stroke="url(#fur)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="76" cy="136" r="3.4" fill="#F2B25A"/>
  <path d="M 104 118 C 110 124 114 128 116 132" fill="none" stroke="url(#fur)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="117" cy="134" r="3.4" fill="#F2B25A"/>
  <!-- 右前爪扑叶 -->
  <path d="M 116 126 C 122 118 126 112 128 106" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="129" cy="104" r="3" fill="#F2B25A"/>

  <!-- 飘落的叶（虎扑的目标） -->
  <path d="M 134 92 Q 138 88 142 90 Q 140 94 136 94 Q 134 93 134 92 Z" fill="#A8C868">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 6;0 0" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- 尾巴（长，微卷，带纹） -->
  <path d="M 104 132 Q 120 126 128 116" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M 108 130 Q 122 125 127 119" stroke="#4A3018" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 104 132;8 104 132;0 104 132" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，额间王字，歪头看水洼） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 96 90;-6 96 90;0 96 90" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="90" rx="13.5" ry="12.5" fill="url(#fur)" stroke="#B87E2E" stroke-width="1"/>
    <!-- 虎耳（圆立，内耳橙白） -->
    <circle cx="83" cy="80" r="4.4" fill="url(#fur)" stroke="#B87E2E" stroke-width="0.8"/>
    <circle cx="83" cy="80" r="2.2" fill="#F8F0DC"/>
    <circle cx="109" cy="80" r="4.4" fill="url(#fur)" stroke="#B87E2E" stroke-width="0.8"/>
    <circle cx="109" cy="80" r="2.2" fill="#F8F0DC"/>
    <!-- 额间王字 -->
    <path d="M 91 79 L 101 79 M 91 82 L 101 82 M 91 85 L 101 85 M 96 79 L 96 85" stroke="#2E2013" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- 白面颊 / 口鼻 -->
    <ellipse cx="96" cy="98" rx="8.5" ry="5.5" fill="url(#belly)" stroke="#D8CCA8" stroke-width="0.5"/>
    <!-- 虎目（圆亮如炬） -->
    <circle cx="89" cy="90" r="3.4" fill="#E8A83E"/>
    <circle cx="89" cy="90" r="1.8" fill="#2E2013"/>
    <circle cx="89.6" cy="89.6" r="0.7" fill="#FFF8E0"/>
    <circle cx="103" cy="90" r="3.4" fill="#E8A83E"/>
    <circle cx="103" cy="90" r="1.8" fill="#2E2013"/>
    <circle cx="103.6" cy="89.6" r="0.7" fill="#FFF8E0"/>
    <!-- 上眼线（虎目如炬） -->
    <path d="M 85 87 Q 89 85 93 87 M 99 87 Q 103 85 107 87" stroke="#2E2013" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 鼻 -->
    <ellipse cx="96" cy="97" rx="2.2" ry="1.7" fill="#7A3E1E"/>
    <!-- 咧嘴笑（懵懂神气） -->
    <path d="M 91 101 Q 96 103.4 101 101" fill="none" stroke="#8E5A32" stroke-width="1" stroke-linecap="round"/>
    <!-- 虎须 -->
    <path d="M 88 98 L 80 96 M 88 100 L 79 101 M 104 98 L 112 96 M 104 100 L 113 101" stroke="#F8F0DC" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 林光星尘 -->
  <g fill="#FFFCE8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
