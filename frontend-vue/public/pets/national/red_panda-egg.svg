<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小熊猫·一阶·蓬尾幼崽·竹林晨雾竖蓬尾作小伞遮雨护小兽">
  <defs>
    <!-- 背景：竹林晨雾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C878"/>
      <stop offset="52%" stop-color="#C8D890"/>
      <stop offset="100%" stop-color="#8AB86A"/>
    </linearGradient>
    <!-- 晨雾 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#F0F8E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0F8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 红褐毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D07048"/>
      <stop offset="100%" stop-color="#A85028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 竹林 -->
  <g stroke="#5A9868" stroke-width="5" stroke-linecap="round">
    <path d="M 24 148 L 28 40"/>
    <path d="M 170 148 L 174 44"/>
  </g>
  <g fill="#5A9868" opacity="0.7">
    <path d="M 20 60 L 30 48 L 34 62 Z"/>
    <path d="M 168 56 L 178 44 L 182 58 Z"/>
  </g>
  <!-- 晨雾 -->
  <g fill="#F0F8E0" opacity="0.45">
    <ellipse cx="60" cy="138" rx="26" ry="8"/>
    <ellipse cx="150" cy="142" rx="28" ry="9"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8AB86A" opacity="0.9"/>

  <!-- 被雨淋湿的小兽（右，被遮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="132" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="130.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="130.8" r="1.1" fill="#2E2A24"/>
  </g>
  <!-- 落下的雨（被尾挡） -->
  <g stroke="#8AC0E0" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 160 96 L 158 106">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 168 100 L 166 110" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小熊猫（中，竖尾作伞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蓬尾（竖作伞，大） -->
    <path d="M 88 118 Q 84 96 94 86 Q 104 96 104 118 Z" fill="url(#fur)" stroke="#8E4020" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-3 94 104;3 94 104;-3 94 104" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 尾环纹 -->
    <path d="M 90 102 L 100 100 M 91 110 L 101 108" stroke="#8E4020" stroke-width="1.2" fill="none" opacity="0.6"/>
    <!-- 圆耳 -->
    <path d="M 94 100 L 88 92 L 96 96 Z" fill="#D07048" stroke="#8E4020" stroke-width="0.6"/>
    <path d="M 104 100 L 110 92 L 102 96 Z" fill="#D07048" stroke="#8E4020" stroke-width="0.6"/>
    <!-- 身（红褐圆润） -->
    <ellipse cx="98" cy="122" rx="13" ry="11" fill="url(#fur)" stroke="#8E4020" stroke-width="0.8"/>
    <!-- 白脸 -->
    <ellipse cx="98" cy="112" rx="9" ry="8" fill="#F0E8DC" stroke="#D8C8B0" stroke-width="0.6"/>
    <!-- 红褐脸颊（泪纹） -->
    <path d="M 92 112 Q 94 114 92 116" stroke="#D07048" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 104 112 Q 102 114 104 116" stroke="#D07048" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 眼（圆亮） -->
    <circle cx="94" cy="111" r="2.2" fill="#2E2A24"/>
    <circle cx="94.8" cy="109.8" r="0.9" fill="#FFF"/>
    <circle cx="102" cy="111" r="2.2" fill="#2E2A24"/>
    <circle cx="102.8" cy="109.8" r="0.9" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 98 115 L 98 117 Z" stroke="#8E4020" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 嘴（轻） -->
    <path d="M 96 118 Q 98 119.4 100 118" fill="none" stroke="#8E4020" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 短爪 -->
    <path d="M 88 128 L 84 133" stroke="#A85028" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 108 128 L 112 133" stroke="#A85028" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#F0F8E0">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
