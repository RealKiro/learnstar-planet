<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="华南虎·二阶·山林之痛·山脊望山下田地炊烟">
  <defs>
    <!-- 背景：被伐山林与渐近的田，烟灰沉郁 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8C4B6"/>
      <stop offset="52%" stop-color="#A6A090"/>
      <stop offset="100%" stop-color="#86806E"/>
    </linearGradient>
    <!-- 天光惨淡 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#EDEBE0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EDEBE0" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄底毛（略暗） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8A04A"/>
      <stop offset="100%" stop-color="#C0802E"/>
    </linearGradient>
    <!-- 白腹 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4DCC8"/>
      <stop offset="100%" stop-color="#D0C4A6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.45;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 远处田地与炊烟（山下） -->
  <path d="M 96 150 Q 128 142 152 146 Q 176 149 200 142 L 200 200 L 96 200 Z" fill="#B09A6E" opacity="0.6"/>
  <path d="M 118 150 Q 140 146 162 150 L 162 168 L 118 168 Z" fill="#A8905E" opacity="0.5"/>
  <!-- 炊烟 -->
  <g stroke="#8E8A80" stroke-width="1.6" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 158 140 Q 162 128 158 116 Q 154 104 160 92">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 138 Q 146 126 150 114">
      <animate attributeName="opacity" values="0.45;0.2;0.45" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被伐的树桩（前景左） -->
  <g fill="#A89272" stroke="#8E7A5E" stroke-width="1">
    <path d="M 14 132 L 24 132 L 24 158 L 14 158 Z"/>
    <ellipse cx="19" cy="132" rx="5" ry="2.2" fill="#C4B08C"/>
    <path d="M 34 138 L 44 138 L 44 160 L 34 160 Z"/>
    <ellipse cx="39" cy="138" rx="5" ry="2.2" fill="#C4B08C"/>
  </g>

  <!-- 山脊 -->
  <path d="M 0 138 Q 40 130 92 134 Q 130 137 160 132 L 200 128 L 200 200 L 0 200 Z" fill="#6E6858" opacity="0.55"/>

  <!-- 母虎（左后，身形略瘦，低低伏着） -->
  <g opacity="0.9">
    <!-- 尾巴 -->
    <path d="M 44 116 Q 30 114 24 106" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M 44 116 Q 32 114 27 108" stroke="#4A3018" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 身体 -->
    <path d="M 34 100 Q 30 116 38 130 Q 48 136 56 130 Q 62 116 58 100 Q 46 94 34 100 Z" fill="url(#fur)" stroke="#A87028" stroke-width="1"/>
    <!-- 墨纹 -->
    <path d="M 34 106 Q 40 109 44 106 M 32 114 Q 40 117 48 114" stroke="#4A3018" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 前肢 -->
    <path d="M 42 118 C 38 124 36 128 36 132" fill="none" stroke="url(#fur)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="36" cy="134" r="3.4" fill="#D8A04A"/>
    <!-- 头（低伏，目光沉） -->
    <ellipse cx="52" cy="94" rx="11" ry="10" fill="url(#fur)" stroke="#A87028" stroke-width="1"/>
    <circle cx="42" cy="86" r="3.8" fill="url(#fur)" stroke="#A87028" stroke-width="0.8"/>
    <circle cx="63" cy="86" r="3.8" fill="url(#fur)" stroke="#A87028" stroke-width="0.8"/>
    <path d="M 47 84 L 57 84 M 47 87 L 57 87 M 47 90 L 57 90 M 52 84 L 52 90" stroke="#2E2013" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <ellipse cx="52" cy="100" rx="7" ry="4.5" fill="url(#belly)" stroke="#C4B89A" stroke-width="0.5"/>
    <circle cx="47" cy="94" r="2.6" fill="#D8A040"/>
    <circle cx="47" cy="94" r="1.4" fill="#2E2013"/>
    <circle cx="57" cy="94" r="2.6" fill="#D8A040"/>
    <circle cx="57" cy="94" r="1.4" fill="#2E2013"/>
  </g>

  <!-- 幼虎（前景，略瘦，望山下，目光沉郁） -->
  <!-- 后腿 -->
  <path d="M 116 132 L 112 148 L 118 152 L 124 136 Z" fill="url(#fur)" stroke="#A87028" stroke-width="1"/>
  <!-- 身体（略瘦） -->
  <path d="M 100 110 Q 96 126 104 138 Q 114 144 122 138 Q 128 126 124 110 Q 112 104 100 110 Z" fill="url(#fur)" stroke="#A87028" stroke-width="1"/>
  <!-- 白腹 -->
  <path d="M 104 116 Q 100 128 106 136 Q 114 140 118 136 Q 120 128 116 116 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 墨纹 -->
  <path d="M 100 116 Q 106 119 110 116 M 98 124 Q 106 127 114 124 M 120 118 Q 124 121 126 118" stroke="#4A3018" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 前肢 -->
  <path d="M 108 124 C 102 130 100 134 100 138" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="100" cy="140" r="3.2" fill="#D8A04A"/>
  <path d="M 120 124 C 126 130 128 134 128 138" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="129" cy="140" r="3.2" fill="#D8A04A"/>
  <!-- 尾巴（低垂） -->
  <path d="M 122 136 Q 138 132 146 122" stroke="url(#fur)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 124 134 Q 138 130 143 124" stroke="#4A3018" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 122 136;-4 122 136;0 122 136" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，王字仍在，目光沉郁） -->
  <g>
    <ellipse cx="112" cy="98" rx="12" ry="11" fill="url(#fur)" stroke="#A87028" stroke-width="1"/>
    <!-- 虎耳（微耷） -->
    <circle cx="101" cy="90" r="4" fill="url(#fur)" stroke="#A87028" stroke-width="0.8"/>
    <circle cx="101" cy="90" r="2" fill="#E4DCC8"/>
    <circle cx="124" cy="90" r="4" fill="url(#fur)" stroke="#A87028" stroke-width="0.8"/>
    <circle cx="124" cy="90" r="2" fill="#E4DCC8"/>
    <!-- 额间王字 -->
    <path d="M 107 87 L 117 87 M 107 90 L 117 90 M 107 93 L 117 93 M 112 87 L 112 93" stroke="#2E2013" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- 白口鼻 -->
    <ellipse cx="112" cy="106" rx="7.5" ry="4.5" fill="url(#belly)" stroke="#C4B89A" stroke-width="0.5"/>
    <!-- 虎目（沉郁） -->
    <path d="M 106 99 Q 110 101 114 99 L 114 99" fill="none" stroke="#2E2013" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="107" cy="99" r="2.4" fill="#C8903A"/>
    <circle cx="107" cy="99" r="1.3" fill="#2E2013"/>
    <path d="M 118 99 Q 114 101 110 99" fill="none" stroke="#2E2013" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="117" cy="99" r="2.4" fill="#C8903A"/>
    <circle cx="117" cy="99" r="1.3" fill="#2E2013"/>
    <!-- 鼻 -->
    <ellipse cx="112" cy="105" rx="2" ry="1.6" fill="#6E3618"/>
    <!-- 抿唇 -->
    <path d="M 108 109 Q 112 110.6 116 109" fill="none" stroke="#8E5A32" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 虎须 -->
    <path d="M 105 105 L 98 104 M 105 107 L 97 108 M 119 105 L 126 104 M 119 107 L 127 108" stroke="#E4DCC8" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 残叶飘零 -->
  <g fill="#A09068">
    <path d="M 70 62 Q 74 58 78 60 Q 76 64 72 64 Q 70 63 70 62 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 14;0 0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山风呜咽 -->
  <g stroke="#EDEBE0" stroke-width="1.2" opacity="0.35" stroke-linecap="round" fill="none">
    <path d="M 60 60 Q 70 56 82 58">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 56 Q 144 54 156 58">
      <animate attributeName="opacity" values="0.3;0.12;0.3" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
