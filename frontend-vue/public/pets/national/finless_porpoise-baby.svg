<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="江豚·二阶·江浑之困·洪水后江浑看不清路险撞暗礁游回江湾">
  <defs>
    <!-- 背景：浑浊江湾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A7A5E"/>
      <stop offset="52%" stop-color="#9E8E6E"/>
      <stop offset="100%" stop-color="#7A9E86"/>
    </linearGradient>
    <!-- 浑水光 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="44%">
      <stop offset="0%" stop-color="#D8C8A8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D8C8A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰黑身（沾泥） -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#6E7A80"/>
      <stop offset="100%" stop-color="#424E54"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="72" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 浑水 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8A7A5E" opacity="0.8"/>
  <g stroke="#B8A878" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <path d="M 0 156 Q 60 150 120 156 Q 160 160 200 154">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 隐现的暗礁（右） -->
  <g fill="#5E6E5E" opacity="0.8">
    <path d="M 150 128 L 168 116 L 176 128 L 160 138 Z"/>
  </g>

  <!-- 惊惶游回的小江豚（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 圆身（沾泥） -->
    <ellipse cx="92" cy="134" rx="16" ry="11" fill="url(#body)" stroke="#323E44" stroke-width="0.9"/>
    <!-- 泥点 -->
    <circle cx="84" cy="130" r="1.2" fill="#8A7A5E" opacity="0.7"/>
    <circle cx="100" cy="138" r="1" fill="#8A7A5E" opacity="0.6"/>
    <!-- 头（圆） -->
    <ellipse cx="92" cy="124" rx="10" ry="8" fill="url(#body)" stroke="#323E44" stroke-width="0.8"/>
    <!-- 笑脸（微暗） -->
    <path d="M 87 128 Q 92 131 97 128" fill="none" stroke="#1E2A30" stroke-width="1.1" stroke-linecap="round"/>
    <!-- 眼（含惊含坚，微湿） -->
    <circle cx="87" cy="122" r="2.2" fill="#2E2A24"/>
    <circle cx="87.8" cy="120.8" r="0.9" fill="#FFF"/>
    <circle cx="98" cy="122" r="2.2" fill="#2E2A24"/>
    <circle cx="98.8" cy="120.8" r="0.9" fill="#FFF"/>
    <circle cx="88" cy="121.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 胸鳍（急游） -->
    <path d="M 80 132 L 74 138" stroke="#424E54" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 104 132 L 110 138" stroke="#424E54" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾鳍 -->
    <path d="M 78 140 L 70 146 L 64 142" stroke="#424E54" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.3">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
