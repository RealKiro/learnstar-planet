<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="藏羚羊·五阶·高原精灵·雪线引群剑角如旗护幼羚">
  <defs>
    <!-- 背景：雪线下高原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4DCE8"/>
      <stop offset="52%" stop-color="#A0BECE"/>
      <stop offset="100%" stop-color="#84A8BC"/>
    </linearGradient>
    <!-- 高原光 -->
    <radialGradient id="glow" cx="42%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F8FCF4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8FCF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 背毛（如雪光） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8B078"/>
      <stop offset="100%" stop-color="#B49058"/>
    </linearGradient>
    <!-- 腹白 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCF6E4"/>
      <stop offset="100%" stop-color="#E8DCBE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="48" r="86" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪线雪山 -->
  <g fill="#E8EFF8" opacity="0.9">
    <path d="M 0 92 L 40 36 L 76 92 Z"/>
    <path d="M 52 92 L 100 26 L 148 92 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.7">
    <path d="M 40 36 L 50 48 L 42 58 L 30 48 Z"/>
    <path d="M 100 26 L 112 44 L 102 56 L 88 44 Z"/>
  </g>
  <!-- 雪线 -->
  <path d="M 0 100 Q 50 92 100 98 Q 150 102 200 96" stroke="#E8EFF8" stroke-width="1.4" opacity="0.6" fill="none"/>

  <!-- 旷野 -->
  <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z" fill="#A8BE88" opacity="0.85"/>
  <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126" stroke="#C8DC9C" stroke-width="1.2" opacity="0.6"/>

  <!-- 族群（后方跟随，4头） -->
  <g opacity="0.8">
    <path d="M 40 118 L 46 132 L 40 134 L 36 122 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 30 116 Q 26 124 32 130 Q 40 133 46 128 Q 48 120 42 114 Q 36 112 30 116 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 34 118 C 28 124 26 128 26 134" fill="none" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="26" cy="136" r="2" fill="#5E4E3A"/>
    <ellipse cx="32" cy="108" rx="7" ry="5.5" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 32 103 Q 30 96 26 92" stroke="#4E3E2A" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M 36 103 Q 37 96 38 92" stroke="#4E3E2A" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="107" r="1.3" fill="#24180E"/>
    <circle cx="36" cy="107" r="1.3" fill="#24180E"/>
    <path d="M 52 120 Q 50 130 54 136 L 60 136 L 62 122 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 44 118 Q 42 124 48 128 Q 56 132 60 128 Q 62 120 56 114 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 48 120 C 44 124 42 128 42 134" fill="none" stroke="url(#fur)" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="42" cy="136" r="2" fill="#5E4E3A"/>
    <ellipse cx="48" cy="106" rx="6.6" ry="5.2" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 48 101 Q 46 95 44 91" stroke="#4E3E2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 52 101 Q 53 95 54 91" stroke="#4E3E2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="46" cy="105" r="1.2" fill="#24180E"/>
    <circle cx="52" cy="105" r="1.2" fill="#24180E"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;4 1;0 0" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- 落单幼羚（紧跟领头，被护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2s" repeatCount="indefinite"/>
    <path d="M 92 120 L 98 134 L 92 136 L 88 124 Z" fill="url(#belly)" stroke="#C8B892" stroke-width="0.8"/>
    <path d="M 82 118 Q 78 126 84 132 Q 92 135 98 130 Q 100 122 94 116 Q 88 114 82 118 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 86 120 C 80 126 78 130 78 136" fill="none" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="78" cy="138" r="2" fill="#5E4E3A"/>
    <ellipse cx="84" cy="110" rx="7" ry="5.5" fill="url(#fur)" stroke="#9A7844" stroke-width="0.8"/>
    <path d="M 84 105 Q 82 99 79 96" stroke="#4E3E2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 88 105 Q 89 99 90 96" stroke="#4E3E2A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="82" cy="109" r="1.3" fill="#24180E"/>
    <circle cx="88" cy="109" r="1.3" fill="#24180E"/>
    <!-- 被护的微光 -->
    <circle cx="84" cy="112" r="6" fill="#F8FCF4" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.08;0.18" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 领头藏羚羊（精灵，剑角如旗，领跑） -->
  <!-- 后腿 -->
  <path d="M 128 118 L 140 128 L 144 130 L 136 120 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" values="0 134 122;10 134 122;0 134 122" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <path d="M 114 116 L 120 132 L 114 134 L 110 120 Z" fill="url(#belly)" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 116 122;-12 116 122;0 116 122" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <!-- 身体 -->
  <path d="M 94 108 Q 90 118 100 126 Q 112 132 126 126 Q 132 116 126 106 Q 110 100 94 108 Z" fill="url(#fur)" stroke="#9A7844" stroke-width="1"/>
  <!-- 腹白 -->
  <path d="M 96 114 Q 92 124 102 128 Q 114 131 122 124 Q 124 116 118 110 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 前腿 -->
  <path d="M 102 120 C 96 128 94 132 92 140" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 102 124;-12 102 124;0 102 124" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="92" cy="142" r="2.6" fill="#5E4E3A"/>
  <path d="M 116 120 C 122 126 126 130 128 136" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 116 124;12 116 124;0 116 124" dur="0.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="129" cy="138" r="2.6" fill="#5E4E3A"/>
  <!-- 尾（如旗尾） -->
  <path d="M 126 112 Q 134 108 138 102" stroke="#B49058" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 126 112;12 126 112;0 126 112" dur="0.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（剑角如旗，眼神明亮） -->
  <g>
    <ellipse cx="92" cy="100" rx="10" ry="8" fill="url(#fur)" stroke="#9A7844" stroke-width="1"/>
    <!-- 白颊 -->
    <ellipse cx="89" cy="103" rx="5.5" ry="4" fill="url(#belly)" stroke="#DCCCA8" stroke-width="0.5"/>
    <!-- 剑角如旗 -->
    <path d="M 92 94 Q 89 82 82 72" stroke="#4E3E2A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 98 94 Q 99 82 102 72" stroke="#4E3E2A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 耳 -->
    <path d="M 86 94 Q 80 92 78 88" stroke="#D8B078" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（明亮坚定） -->
    <path d="M 86 97 Q 88 96 90 97 M 94 97 Q 96 96 98 97" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="88.4" cy="98.8" r="0.5" fill="#FFF"/>
    <circle cx="97" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="97.4" cy="98.8" r="0.5" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 86 104 Q 90 105.6 94 104" stroke="#9A7844" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 高原光尘 -->
  <g fill="#F8FCF4">
    <circle cx="34" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
