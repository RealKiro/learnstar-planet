<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麋鹿·六阶·麋鹿传说·暮光角碰小鹿角传四不像来四样好">
  <defs>
    <!-- 背景：湿地暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B888"/>
      <stop offset="52%" stop-color="#A8A88A"/>
      <stop offset="100%" stop-color="#6EA880"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 褐黄毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#C89868"/>
      <stop offset="100%" stop-color="#9A6E42"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 湿地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6EA880" opacity="0.9"/>
  <g stroke="#C8E8D0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 0 158 Q 60 152 120 158 Q 160 162 200 156"/>
  </g>

  <!-- 安住的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="90" cy="134.8" r="1" fill="#2E2A24"/>
    <circle cx="95" cy="134.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 小麋鹿（右，牛蹄学走） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 138 116 L 133 108 L 137 110 L 135 104 L 138 108 Z" fill="#A87848" stroke="#8E6838" stroke-width="0.5"/>
    <path d="M 152 116 L 157 108 L 153 110 L 155 104 L 152 108 Z" fill="#A87848" stroke="#8E6838" stroke-width="0.5"/>
    <ellipse cx="145" cy="124" rx="10" ry="8.5" fill="url(#fur)" stroke="#8E6838" stroke-width="0.7"/>
    <ellipse cx="145" cy="118" rx="7" ry="6" fill="url(#fur)" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 149 122 Q 154 122 156 120 Q 154 126 149 126 Z" fill="#D8C8B0" stroke="#B8A890" stroke-width="0.4"/>
    <circle cx="142" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="142.8" cy="116.2" r="0.7" fill="#FFF"/>
    <circle cx="150" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="150.8" cy="116.2" r="0.7" fill="#FFF"/>
    <path d="M 137 129 L 134 133" stroke="#9A6E42" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 153 129 L 156 133" stroke="#9A6E42" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 老麋鹿（左，角碰小鹿角） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 鹿角（如古枝，伸向小鹿角） -->
    <path d="M 74 102 L 60 82 L 70 90 L 64 72 L 76 88 Z" fill="#B08050" stroke="#6E5838" stroke-width="0.9"/>
    <path d="M 96 102 L 112 82 L 102 90 L 108 72 L 96 88 Z" fill="#B08050" stroke="#6E5838" stroke-width="0.9">
      <animateTransform attributeName="transform" type="rotate" values="-3 96 102;3 96 102;-3 96 102" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 94 L 66 84" stroke="#D0A070" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 100 94 L 104 84" stroke="#D0A070" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 大耳 -->
    <path d="M 68 112 L 60 104 L 72 108 Z" fill="#C89868" stroke="#6E5838" stroke-width="0.7"/>
    <path d="M 102 112 L 110 104 L 98 108 Z" fill="#C89868" stroke="#6E5838" stroke-width="0.7"/>
    <!-- 驴尾 -->
    <path d="M 62 122 Q 54 120 52 126" stroke="#9A6E42" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="51" cy="127" r="1.8" fill="#6E5838"/>
    <!-- 身 -->
    <ellipse cx="84" cy="122" rx="17" ry="13" fill="url(#fur)" stroke="#6E5838" stroke-width="0.9"/>
    <!-- 马脸 -->
    <ellipse cx="84" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#6E5838" stroke-width="0.8"/>
    <path d="M 88 112 Q 93 112 95 110 Q 93 116 88 116 Z" fill="#D8C8B0" stroke="#B8A890" stroke-width="0.5"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 79 107 Q 81 105.6 83 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 89 107 Q 91 105.6 92 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 鼻 -->
    <path d="M 92 111 L 90 113.5 L 94 113.5 Z" fill="#6E5838"/>
    <!-- 嘴（慈） -->
    <path d="M 91 116 Q 89 117.4 87 116" fill="none" stroke="#6E5838" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 牛蹄 -->
    <path d="M 70 132 L 65 141" stroke="#9A6E42" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 98 132 L 103 141" stroke="#9A6E42" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 64 142 L 63 145 M 66 142 L 66 145" stroke="#6E5838" stroke-width="1" stroke-linecap="round"/>
    <path d="M 102 142 L 103 145 M 104 142 L 104 145" stroke="#6E5838" stroke-width="1" stroke-linecap="round"/>
    <!-- 角碰传 -->
    <path d="M 98 96 Q 116 90 132 98" stroke="#F0FCE0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="124" cy="98" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
