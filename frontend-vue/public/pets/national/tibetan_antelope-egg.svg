<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="藏羚羊·一阶·高原幼羚·蹦跳奔跑长角初生">
  <defs>
    <!-- 背景：高原草地 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D4E8"/>
      <stop offset="52%" stop-color="#8EB0CC"/>
      <stop offset="100%" stop-color="#6E96B0"/>
    </linearGradient>
    <!-- 高原光 -->
    <radialGradient id="glow" cx="48%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F4F8E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4F8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 背毛白褐 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A06E"/>
      <stop offset="100%" stop-color="#A8844E"/>
    </linearGradient>
    <!-- 腹白 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F0DC"/>
      <stop offset="100%" stop-color="#E8DCBE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪山（背景） -->
  <g fill="#E8EFF8" opacity="0.9">
    <path d="M 0 96 L 40 40 L 74 96 Z"/>
    <path d="M 52 96 L 100 28 L 148 96 Z"/>
    <path d="M 120 96 L 160 48 L 200 96 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.7">
    <path d="M 40 40 L 50 52 L 42 62 L 30 50 Z"/>
    <path d="M 100 28 L 112 46 L 102 58 L 88 46 Z"/>
    <path d="M 160 48 L 170 60 L 162 70 L 150 60 Z"/>
  </g>

  <!-- 高原草地 -->
  <path d="M 0 128 Q 50 118 110 126 Q 160 130 200 122 L 200 200 L 0 200 Z" fill="#9CB878" opacity="0.8"/>
  <path d="M 0 128 Q 50 118 110 126 Q 160 130 200 122" stroke="#BCD894" stroke-width="1.2" opacity="0.6"/>
  <!-- 高原风线 -->
  <g stroke="#E8F0E0" stroke-width="1.2" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 30 112 Q 44 108 58 112">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 108 Q 146 104 162 108">
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 幼羚（4头身，蹦跳奔跑，长角初生） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.6s" repeatCount="indefinite"/>
    <!-- 后腿（蹦起） -->
    <path d="M 116 124 L 124 138 L 130 140 L 124 128 Z" fill="url(#fur)" stroke="#8E6E3E" stroke-width="1"/>
    <path d="M 108 122 L 104 134 L 98 132 L 104 122 Z" fill="url(#belly)" opacity="0.8"/>
    <!-- 身体 -->
    <path d="M 88 108 Q 84 120 92 128 Q 104 132 116 126 Q 120 116 114 106 Q 100 102 88 108 Z" fill="url(#fur)" stroke="#8E6E3E" stroke-width="1"/>
    <!-- 腹白 -->
    <path d="M 90 114 Q 86 124 94 128 Q 106 130 112 124 Q 114 116 108 110 Z" fill="url(#belly)" opacity="0.9"/>
    <!-- 前腿（腾空） -->
    <path d="M 94 122 C 88 128 84 132 82 140" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="82" cy="142" r="2.6" fill="#5E4E3A"/>
    <path d="M 108 122 C 114 128 118 132 120 138" fill="none" stroke="url(#fur)" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="121" cy="140" r="2.6" fill="#5E4E3A"/>
    <!-- 尾（短） -->
    <path d="M 116 112 Q 124 110 128 106" stroke="#A8844E" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 116 112;14 116 112;0 116 112" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 头（长脸，长角初生，眼神明亮） -->
  <g>
    <ellipse cx="86" cy="100" rx="10" ry="8" fill="url(#fur)" stroke="#8E6E3E" stroke-width="1"/>
    <!-- 白颊 -->
    <ellipse cx="84" cy="103" rx="5.5" ry="4" fill="url(#belly)" stroke="#D8CCA8" stroke-width="0.5"/>
    <!-- 长角初生（一对小角） -->
    <path d="M 86 94 Q 84 86 80 82" stroke="#5E4E3A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 90 94 Q 92 87 94 83" stroke="#5E4E3A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 耳 -->
    <path d="M 80 94 Q 74 92 72 88" stroke="#C8A06E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（明亮） -->
    <circle cx="82" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="82.4" cy="98.8" r="0.6" fill="#FFF"/>
    <circle cx="91" cy="99" r="1.7" fill="#24180E"/>
    <circle cx="91.4" cy="98.8" r="0.6" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 80 104 Q 84 105.6 88 104" stroke="#8E6E3E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <!-- 蹦跳咧嘴 -->
    <path d="M 79 106 Q 83 108 87 106" fill="none" stroke="#8E6E3E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 高原光尘 -->
  <g fill="#F4F8E8">
    <circle cx="40" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
