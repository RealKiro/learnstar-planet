<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱鹮·二阶·栖息之失·被填浅滩盘旋探喙只叼泥沙">
  <defs>
    <!-- 背景：被填的浅滩，水田灰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4B8AC"/>
      <stop offset="52%" stop-color="#969A90"/>
      <stop offset="100%" stop-color="#7E8278"/>
    </linearGradient>
    <!-- 天光惨淡 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8ECE4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8ECE4" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽（沾浊水） -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6E8EC"/>
      <stop offset="100%" stop-color="#C8CCD2"/>
    </linearGradient>
    <!-- 粉翼（微垂） -->
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC9AA8"/>
      <stop offset="100%" stop-color="#C08092"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="44" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.35;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 填滩工地（右，土堆田埂） -->
  <g fill="#8E8A74" stroke="#6E6A58" stroke-width="1">
    <path d="M 148 150 L 170 128 Q 176 126 180 130 L 200 124 L 200 200 L 148 200 Z"/>
    <path d="M 156 136 Q 166 130 178 132" stroke="#A89A80" stroke-width="1.2" opacity="0.7" fill="none"/>
    <path d="M 152 144 L 162 138 M 168 140 L 176 136" stroke="#6E6A58" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- 填土车辙 -->
  <path d="M 100 148 L 140 146 M 110 152 L 150 150" stroke="#7E7A66" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 被填的浅滩（前景，浊水只剩泥） -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E7A62" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#9E9A80" stroke-width="1.4" opacity="0.7"/>
  <!-- 一洼浊水 -->
  <ellipse cx="66" cy="156" rx="22" ry="7" fill="#6E7668" opacity="0.85"/>
  <path d="M 50 154 Q 62 152 76 155 M 56 158 Q 66 157 78 159" stroke="#8E9688" stroke-width="0.8" opacity="0.5" fill="none"/>

  <!-- 朱鹮（盘旋浅滩，探喙只叼泥沙） -->
  <!-- 腿（收拢，垂着） -->
  <path d="M 92 102 L 88 116 M 98 102 L 102 116" stroke="#6E7682" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 身体 -->
  <ellipse cx="95" cy="92" rx="15" ry="9" fill="url(#white)" stroke="#AEB2BC" stroke-width="0.8"/>
  <!-- 粉翼（展开微垂，盘旋） -->
  <path d="M 88 88 Q 72 78 64 70 Q 78 74 84 82 Q 86 86 88 88 Z" fill="url(#pink)" stroke="#A87888" stroke-width="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 88 88;-10 88 88;0 88 88" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M 102 88 Q 118 78 126 70 Q 112 74 106 82 Q 104 86 102 88 Z" fill="url(#pink)" stroke="#A87888" stroke-width="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 102 88;10 102 88;0 102 88" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 白羽沾浊泥 -->
  <path d="M 86 94 L 92 92 M 100 94 L 106 92" stroke="#9A9078" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 头冠（微垂） -->
  <path d="M 96 80 Q 94 75 94 71 M 99 80 Q 100 74 100 70" stroke="#E090A4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 头（垂下探喙） -->
  <circle cx="97" cy="80" r="5" fill="url(#white)" stroke="#AEB2BC" stroke-width="0.7"/>
  <!-- 朱红脸（微垂） -->
  <ellipse cx="96" cy="81" rx="3.2" ry="2.5" fill="#C85A3E" opacity="0.85"/>
  <!-- 长喙（探进浊水） -->
  <path d="M 95 83 L 88 96 L 93 85 Z" fill="#2A2E3A"/>
  <!-- 叼起的一点泥沙 -->
  <circle cx="88" cy="98" r="1.6" fill="#9A9078">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 4;0 0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="100" r="1.1" fill="#8E8470">
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 5;0 0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 眼（含忧） -->
  <circle cx="99" cy="80" r="1.1" fill="#24180E"/>
  <path d="M 97 78 Q 99 77 101 78" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 浊水尘 -->
  <g fill="#9A9A86">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
