<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="丹顶鹤·四阶·长鸣护伴·长鸣呼群羽翼挡风">
  <defs>
    <!-- 背景：清泽渐近 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4E0D0"/>
      <stop offset="52%" stop-color="#A2C4AE"/>
      <stop offset="100%" stop-color="#82A88E"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="46%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽如雪 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E2E6F0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 清泽（前景水面） -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E9E88" opacity="0.75"/>
  <path d="M 0 148 L 200 148" stroke="#9CC4B2" stroke-width="1.4" opacity="0.6"/>
  <path d="M 30 156 Q 56 154 84 158 M 130 162 Q 156 160 184 162" stroke="#EAF8F2" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 族群飞来（左上，循声而至） -->
  <g stroke="#4E5E72" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 30 64 Q 34 60 38 64"/>
    <path d="M 48 52 Q 52 48 56 52">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 68 46 Q 72 42 76 46">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 5;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 受伤同伴（右下，卧着，翅垂，被护） -->
  <g>
    <ellipse cx="138" cy="136" rx="12" ry="7" fill="#E0E4EC" stroke="#AEB2BC" stroke-width="0.7"/>
    <!-- 垂下的受伤翅 -->
    <path d="M 142 130 Q 150 126 154 132 Q 150 136 144 134 Z" fill="#C8CCD4"/>
    <path d="M 134 132 Q 130 128 130 122" stroke="#D4D8E0" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 头（低垂） -->
    <circle cx="128" cy="130" r="4.4" fill="#F0F2F6"/>
    <circle cx="130" cy="127" r="1.7" fill="#D84A30" opacity="0.7"/>
    <path d="M 126 132 L 120 130 L 126 134 Z" fill="#8E96A2"/>
    <!-- 眼（微弱抬望） -->
    <path d="M 130 129 Q 132 128 133 129" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 主角鹤（4头身，立于受伤同伴旁，长鸣呼群，羽翼挡风） -->
  <!-- 腿 -->
  <path d="M 96 120 L 94 150" stroke="#6E7682" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M 106 120 L 108 150" stroke="#6E7682" stroke-width="1.7" stroke-linecap="round"/>
  <!-- 身体 -->
  <ellipse cx="101" cy="110" rx="17" ry="10" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
  <!-- 翅尖墨羽 -->
  <path d="M 114 106 Q 122 102 126 106 Q 122 110 116 110 Z" fill="#2A2E3A"/>
  <!-- 尾羽 -->
  <path d="M 116 114 Q 126 116 130 120" stroke="#E2E6F0" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 挡风翅（左翅展开如伞，为同伴遮风） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="6 92 104;0 92 104;6 92 104" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 92 104 Q 70 92 52 96 Q 60 110 78 114 Q 88 112 92 104 Z" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
    <path d="M 64 100 Q 56 96 52 96 Q 56 108 66 110 Q 64 104 64 100 Z" fill="#2A2E3A" opacity="0.9"/>
  </g>

  <!-- 长颈（引颈长鸣） -->
  <path d="M 100 104 C 102 92 104 82 98 70 C 94 62 90 54 94 46" fill="none" stroke="#4A4E5A" stroke-width="7" stroke-linecap="round"/>
  <!-- 头（朱红明亮） -->
  <circle cx="94" cy="44" r="5.5" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <circle cx="96" cy="41" r="2.2" fill="#D84A30"/>
  <!-- 喙（长鸣） -->
  <path d="M 91 46 L 84 36 L 94 43 Z" fill="#6E7682"/>
  <path d="M 87 42 L 90 40" stroke="#4A4E5A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 丹凤眼 -->
  <circle cx="97" cy="45" r="1.1" fill="#24180E"/>
  <!-- 长鸣声波（呼群） -->
  <g stroke="#FFF8DC" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 76 34 Q 70 28 72 20">
      <animate attributeName="opacity" values="0.6;0.18;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 66 40 Q 58 34 58 24">
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 泽水闪光 -->
  <g fill="#FFF8DC">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
