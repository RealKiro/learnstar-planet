<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="丹顶鹤·五阶·松鹤仙姿·清泽单足立声闻九天">
  <defs>
    <!-- 背景：清泽之畔 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E4D2"/>
      <stop offset="52%" stop-color="#A4C8B0"/>
      <stop offset="100%" stop-color="#86AA90"/>
    </linearGradient>
    <!-- 仙泽光 -->
    <radialGradient id="glow" cx="44%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#FFFCE0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFCE0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽如雪 -->
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFCFE"/>
      <stop offset="100%" stop-color="#E2E6F0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="54" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 松影（右后） -->
  <g fill="#4E6E56" opacity="0.75">
    <path d="M 150 148 L 156 116 L 148 120 L 154 96 L 146 102 L 154 70 L 162 102 L 156 96 L 162 122 L 154 118 L 160 148 Z"/>
  </g>
  <g stroke="#4E6E56" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M 156 148 L 156 164"/>
  </g>

  <!-- 清泽（水面） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E9E8A" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#9CC4B4" stroke-width="1.4" opacity="0.6"/>
  <path d="M 20 158 Q 44 156 72 158 M 120 162 Q 148 160 178 162" stroke="#EAF8F2" stroke-width="1" opacity="0.5" fill="none"/>
  <!-- 鹤的倒影 -->
  <g opacity="0.3">
    <path d="M 92 152 Q 96 160 98 172" stroke="#2A2E3A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="92" cy="162" rx="12" ry="4" fill="#E2E6F0"/>
  </g>

  <!-- 白羽飘落（仙鹤落羽） -->
  <g>
    <path d="M 58 108 Q 62 104 66 106 Q 64 110 60 110 Q 58 109 58 108 Z" fill="#FCFCFE" stroke="#D8DCE6" stroke-width="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 10;0 0" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 丹顶鹤（5头身，单足而立，引颈长鸣，朱红如冠） -->
  <!-- 单足（收一足） -->
  <path d="M 96 126 L 94 150" stroke="#6E7682" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 收起的足（折于腹下） -->
  <path d="M 102 124 Q 108 122 110 118" stroke="#6E7682" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- 身体（高挑） -->
  <ellipse cx="100" cy="112" rx="17" ry="10" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.8"/>
  <!-- 翅尖墨羽 -->
  <path d="M 114 108 Q 122 104 128 108 Q 122 112 116 112 Z" fill="#2A2E3A"/>
  <!-- 尾羽（如裙） -->
  <path d="M 114 116 Q 126 118 132 124" stroke="#E2E6F0" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M 116 120 Q 128 124 134 130" stroke="#E2E6F0" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- 长颈（竖直引颈，声闻九天） -->
  <path d="M 100 106 C 102 92 102 78 96 64 C 92 56 88 50 92 42" fill="none" stroke="#4A4E5A" stroke-width="7" stroke-linecap="round"/>
  <!-- 头（朱红如冠） -->
  <circle cx="92" cy="40" r="5.5" fill="url(#white)" stroke="#C4C8D8" stroke-width="0.7"/>
  <circle cx="94" cy="36.5" r="2.4" fill="#D84A30"/>
  <!-- 喙（朝天长鸣） -->
  <path d="M 89 42 L 80 32 L 92 39 Z" fill="#6E7682"/>
  <path d="M 84 38 L 87 35" stroke="#4A4E5A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 丹凤眼 -->
  <path d="M 94 40 Q 96 39 97 40" stroke="#24180E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  <circle cx="96" cy="41" r="1" fill="#24180E"/>
  <!-- 声闻九天（长鸣声波高扬） -->
  <g stroke="#FFF8E0" stroke-width="1.6" opacity="0.7" stroke-linecap="round" fill="none">
    <path d="M 74 28 Q 68 20 70 10">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 62 34 Q 54 24 54 12">
      <animate attributeName="opacity" values="0.5;0.14;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 仙泽星尘 -->
  <g fill="#FFFCE0">
    <circle cx="40" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
