<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="华南虎·三阶·潜行苦修·月夜踏叶无声扑击碎木">
  <defs>
    <!-- 背景：月夜山林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26385C"/>
      <stop offset="52%" stop-color="#1E2C4A"/>
      <stop offset="100%" stop-color="#182440"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="glow" cx="76%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#F4F8FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4F8FF" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄底毛（夜色略沉） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D09A44"/>
      <stop offset="100%" stop-color="#B87E30"/>
    </linearGradient>
    <!-- 白腹 -->
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCD4C4"/>
      <stop offset="100%" stop-color="#C8C0AE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="44" r="17" fill="#F4F8FF"/>
  <circle cx="146" cy="40" r="3.4" fill="#DCE4F4" opacity="0.7"/>
  <circle cx="158" cy="50" r="2.4" fill="#DCE4F4" opacity="0.6"/>
  <circle cx="150" cy="54" r="1.8" fill="#DCE4F4" opacity="0.5"/>
  <circle cx="156" cy="30" r="64" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 夜林剪影 -->
  <g stroke="#24304A" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 16 44 L 8 160 M 34 50 L 26 160 M 174 40 L 184 160"/>
  </g>
  <g fill="#24304A" opacity="0.7">
    <path d="M 16 48 Q 10 40 8 32 Q 14 38 16 48 Z"/>
    <path d="M 174 44 Q 180 36 182 28 Q 176 34 174 44 Z"/>
  </g>

  <!-- 月光落在山脊 -->
  <path d="M 0 132 Q 50 122 110 130 Q 150 136 200 126 L 200 200 L 0 200 Z" fill="#22304E" opacity="0.8"/>
  <path d="M 0 132 Q 50 122 110 130 Q 150 136 200 126" stroke="#5A6E92" stroke-width="1.2" opacity="0.5" fill="none"/>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#1A2640" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#4A5C7E" stroke-width="1.2" opacity="0.5"/>

  <!-- 碎木（扑击目标，右） -->
  <g fill="#7E6A4E" stroke="#5E4E38" stroke-width="1">
    <path d="M 128 142 L 148 140 L 150 148 L 130 150 Z"/>
    <path d="M 138 140 L 146 128 L 152 130 L 146 142 Z"/>
    <path d="M 150 130 L 160 122 L 164 126 L 156 134 Z"/>
  </g>
  <!-- 碎屑 -->
  <g fill="#8E7A5E">
    <circle cx="142" cy="136" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -6;0 0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="132" r="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -4;0 0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年虎（4头身，身形渐健，潜行扑击） -->
  <!-- 后腿（蹬地发力） -->
  <path d="M 92 130 L 88 146 L 94 150 L 102 134 Z" fill="url(#fur)" stroke="#9E6E26" stroke-width="1"/>
  <!-- 身体 -->
  <path d="M 78 108 Q 74 124 82 136 Q 92 142 102 136 Q 108 124 104 108 Q 92 102 78 108 Z" fill="url(#fur)" stroke="#9E6E26" stroke-width="1"/>
  <!-- 白腹 -->
  <path d="M 84 116 Q 80 128 88 134 Q 96 138 100 132 Q 102 124 98 114 Z" fill="url(#belly)" opacity="0.9"/>
  <!-- 墨纹（清晰） -->
  <path d="M 78 114 Q 84 117 88 114 M 76 122 Q 84 125 92 122 M 102 116 Q 106 119 108 116" stroke="#24180E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- 前肢（前扑） -->
  <path d="M 86 122 C 80 128 76 132 74 138" fill="none" stroke="url(#fur)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="74" cy="140" r="3.4" fill="#D09A44"/>
  <path d="M 102 122 C 108 126 112 128 116 132" fill="none" stroke="url(#fur)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="118" cy="134" r="3.4" fill="#D09A44"/>
  <!-- 右前爪（拍向碎木） -->
  <path d="M 116 124 C 122 118 128 112 132 106" fill="none" stroke="url(#fur)" stroke-width="4.8" stroke-linecap="round"/>
  <circle cx="134" cy="104" r="3.2" fill="#D09A44"/>

  <!-- 尾巴（低摆，蓄势） -->
  <path d="M 102 132 Q 120 124 130 116" stroke="url(#fur)" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M 104 130 Q 120 123 128 118" stroke="#24180E" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 102 132;-6 102 132;0 102 132" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 头（王字如墨，目光如炬） -->
  <g>
    <ellipse cx="94" cy="94" rx="12.5" ry="11.5" fill="url(#fur)" stroke="#9E6E26" stroke-width="1"/>
    <!-- 虎耳 -->
    <circle cx="82" cy="85" r="4.2" fill="url(#fur)" stroke="#9E6E26" stroke-width="0.8"/>
    <circle cx="82" cy="85" r="2.1" fill="#DCD4C4"/>
    <circle cx="107" cy="85" r="4.2" fill="url(#fur)" stroke="#9E6E26" stroke-width="0.8"/>
    <circle cx="107" cy="85" r="2.1" fill="#DCD4C4"/>
    <!-- 额间王字 -->
    <path d="M 89 82 L 99 82 M 89 85 L 99 85 M 89 88 L 99 88 M 94 82 L 94 88" stroke="#24180E" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <!-- 白口鼻 -->
    <ellipse cx="94" cy="101" rx="8" ry="5" fill="url(#belly)" stroke="#BEB49C" stroke-width="0.5"/>
    <!-- 虎目（如炬） -->
    <path d="M 87 91 Q 91 89 95 91 M 93 91 Q 97 89 101 91" stroke="#24180E" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="92" r="2.9" fill="#F0A83E"/>
    <circle cx="88" cy="92" r="1.5" fill="#24180E"/>
    <circle cx="88.5" cy="91.5" r="0.7" fill="#FFF8E0"/>
    <circle cx="100" cy="92" r="2.9" fill="#F0A83E"/>
    <circle cx="100" cy="92" r="1.5" fill="#24180E"/>
    <circle cx="100.5" cy="91.5" r="0.7" fill="#FFF8E0"/>
    <!-- 鼻 -->
    <ellipse cx="94" cy="100" rx="2.2" ry="1.7" fill="#6E3618"/>
    <!-- 抿唇（含劲） -->
    <path d="M 89 104 Q 94 106.4 99 104" fill="none" stroke="#8E5A32" stroke-width="1" stroke-linecap="round"/>
    <!-- 虎须 -->
    <path d="M 86 101 L 78 100 M 86 103 L 77 104 M 102 101 L 110 100 M 102 103 L 111 104" stroke="#DCD4C4" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 踏叶无声（落叶轻旋） -->
  <g fill="#7E8E6E">
    <path d="M 56 96 Q 60 92 64 94 Q 62 98 58 98 Q 56 97 56 96 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 10;0 0" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 月光星尘 -->
  <g fill="#F4F8FF">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
