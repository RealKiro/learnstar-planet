<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小熊猫·五阶·竹林暖尾·蓬尾如暖伞巡走竖尾遮雨拢尾焐兽">
  <defs>
    <!-- 背景：竹林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#98B868"/>
      <stop offset="52%" stop-color="#B0C880"/>
      <stop offset="100%" stop-color="#7AA858"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F0F8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0F8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#E8F0D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 红褐毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D88058"/>
      <stop offset="100%" stop-color="#A85028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 竹林 -->
  <g stroke="#4E8858" stroke-width="5" stroke-linecap="round">
    <path d="M 24 148 L 28 40"/>
    <path d="M 170 148 L 174 44"/>
  </g>
  <g fill="#4E8858" opacity="0.7">
    <path d="M 20 58 L 30 46 L 34 60 Z"/>
    <path d="M 168 54 L 178 42 L 182 56 Z"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7AA858" opacity="0.9"/>

  <!-- 被遮雨的小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="128" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="56" cy="126.8" r="1" fill="#2E2A24"/>
    <circle cx="61" cy="126.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 被焐的幼兽（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="150" cy="130" r="3.5" fill="#D0B888" stroke="#B09868" stroke-width="0.5"/>
    <circle cx="148" cy="128.8" r="0.9" fill="#2E2A24"/>
    <circle cx="153" cy="128.8" r="0.9" fill="#2E2A24"/>
  </g>

  <!-- 竹林暖尾（中，蓬尾如暖伞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蓬尾（如暖伞，大展） -->
    <path d="M 88 112 Q 78 84 94 68 Q 112 84 112 112 Z" fill="url(#fur)" stroke="#7A3A18" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="-3 94 92;3 94 92;-3 94 92" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 87 94 L 105 88 M 88 106 L 106 102" stroke="#7A3A18" stroke-width="1.4" fill="none" opacity="0.6"/>
    <circle cx="96" cy="84" r="5" fill="#F0F8E0" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.18;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 圆耳 -->
    <path d="M 92 96 L 82 84 L 96 92 Z" fill="#D88058" stroke="#7A3A18" stroke-width="0.8"/>
    <path d="M 112 96 L 122 84 L 108 92 Z" fill="#D88058" stroke="#7A3A18" stroke-width="0.8"/>
    <!-- 身 -->
    <ellipse cx="102" cy="118" rx="15" ry="12" fill="url(#fur)" stroke="#7A3A18" stroke-width="1"/>
    <!-- 白脸 -->
    <ellipse cx="102" cy="108" rx="10" ry="9" fill="#F0E8DC" stroke="#C8B89A" stroke-width="0.7"/>
    <path d="M 95 108 Q 97 110 95 112" stroke="#D88058" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 109 108 Q 107 110 109 112" stroke="#D88058" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 眼（含威含温） -->
    <circle cx="97" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="97.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="107" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="107.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 额饰（竹暖） -->
    <circle cx="102" cy="99" r="2" fill="#E8F0D0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 102 111 L 102 113 Z" stroke="#7A3A18" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 嘴（定） -->
    <path d="M 100 115 Q 102 116.4 104 115" fill="none" stroke="#7A3A18" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 短爪 -->
    <path d="M 90 124 L 84 131" stroke="#A85028" stroke-width="3" stroke-linecap="round"/>
    <path d="M 114 124 L 120 131" stroke="#A85028" stroke-width="3" stroke-linecap="round"/>
    <!-- 焐右幼兽的尾 -->
    <path d="M 108 120 Q 120 124 128 128" stroke="#D88058" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="-3 108 120;3 108 120;-3 108 120" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#F0F8E0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
