<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="馄饨·三阶·练包苦修·褶细皮牢馅紧久煮不破元宝稳">
  <defs>
    <!-- 背景：冬至厨房晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D0AC78"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 馄饨皮 -->
    <radialGradient id="skin" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </radialGradient>
    <!-- 暖光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F0E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8F0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 锅（右，稳浮） -->
  <g>
    <path d="M 142 116 Q 154 104 166 116 Q 164 128 154 128 Q 144 128 142 116 Z" fill="#6E6256" stroke="#544A40" stroke-width="0.9"/>
    <ellipse cx="154" cy="116" rx="12" ry="5" fill="#B8B0A0"/>
    <!-- 汤面 -->
    <ellipse cx="154" cy="116" rx="9" ry="3.5" fill="#E0D8C0"/>
    <!-- 浮着的馄饨 -->
    <path d="M 152 112 Q 154 108 156 112 Q 158 116 154 116 Q 150 116 152 112 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年馄饨（中，元宝稳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="102" r="18" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 元宝身（皮牢） -->
    <path d="M 88 92 Q 100 80 112 92 Q 120 106 112 118 Q 100 124 88 118 Q 80 106 88 92 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="1"/>
    <!-- 褶细 -->
    <path d="M 92 88 Q 93 83 96 82" stroke="#C8B898" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 100 85 Q 101 80 103 80" stroke="#C8B898" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 108 88 Q 109 83 111 82" stroke="#C8B898" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <!-- 馅紧（透粉） -->
    <ellipse cx="100" cy="108" rx="7" ry="6" fill="#E8A888" opacity="0.55"/>
    <!-- 眼（专注） -->
    <circle cx="94" cy="103" r="2" fill="#2E2A24"/>
    <circle cx="94.6" cy="102.4" r="0.65" fill="#FFF"/>
    <circle cx="106" cy="103" r="2" fill="#2E2A24"/>
    <circle cx="106.6" cy="102.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 96 109 Q 100 111 104 109" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
