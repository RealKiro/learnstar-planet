<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="腊八粥·四阶·暖冬初成·雪夜巡夜人捧粥呼白气一口化开暖冬">
  <defs>
    <!-- 背景：雪夜灶台 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A78"/>
      <stop offset="52%" stop-color="#7A726A"/>
      <stop offset="100%" stop-color="#A89272"/>
    </linearGradient>
    <!-- 暖灯 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 粥热 -->
    <radialGradient id="porridge" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F4D898"/>
      <stop offset="100%" stop-color="#DCB470"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#F8F4E8" opacity="0.6">
    <circle cx="40" cy="30" r="1.2">
      <animate attributeName="cy" values="30;58;30" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="20" r="1">
      <animate attributeName="cy" values="20;48;20" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="16" r="1.1">
      <animate attributeName="cy" values="16;44;16" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 灶台 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 舀粥的家人（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="122" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="58" cy="136" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 64 128 Q 70 124 72 120" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 舀粥的勺 -->
    <path d="M 70 122 L 82 126" stroke="#8E6E50" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="86" cy="127" rx="3" ry="2" fill="#D8C8B0" stroke="#A89878" stroke-width="0.5"/>
  </g>

  <!-- 捧碗的巡夜人（右，呼白气） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="112" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="148" cy="130" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 皮帽 -->
    <path d="M 141 108 Q 148 102 156 108 L 152 111 L 144 111 Z" fill="#6E564A" stroke="#4E3A30" stroke-width="0.7"/>
    <!-- 捧碗的手 -->
    <path d="M 142 120 L 132 124 M 154 120 L 158 124" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 手里的碗（热粥） -->
    <path d="M 134 122 Q 144 118 154 122 Q 152 130 144 130 Q 136 130 134 122 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.8"/>
    <ellipse cx="144" cy="122" rx="10" ry="3.5" fill="#F0D898"/>
    <!-- 眼（眯，暖） -->
    <path d="M 143 110 Q 145 108.6 147 110 M 151 110 Q 153 108.6 154 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 145 114 Q 148 116 151 114" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 呼出的白气 -->
    <path d="M 148 108 Q 152 104 156 106" stroke="#F0EAE0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
