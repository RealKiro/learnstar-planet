<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="腊八粥·二阶·糊锅之痛·火大熬糊底层焦黑香变焦味缩锅底">
  <defs>
    <!-- 背景：腊八灶台 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#A88A68"/>
      <stop offset="100%" stop-color="#8E7660"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糊粥 -->
    <radialGradient id="porridge" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#C89858"/>
      <stop offset="100%" stop-color="#8E6830"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 皱眉的家人（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="154" cy="116" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="154" cy="131" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 149 114 Q 152 112.6 155 114" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 157 114 Q 159 112.6 160 114" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 156 113 Q 158 114 157 115" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E7660" opacity="0.9"/>

  <!-- 糊锅的粥（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 锅身（糊底焦黑） -->
    <path d="M 72 110 Q 100 98 128 110 Q 126 132 100 132 Q 74 132 72 110 Z" fill="#6E6256" stroke="#544A40" stroke-width="1"/>
    <!-- 焦黑底层 -->
    <path d="M 72 126 Q 100 138 128 126 Q 126 132 100 132 Q 74 132 72 126 Z" fill="#3E3226" opacity="0.9"/>
    <ellipse cx="100" cy="110" rx="28" ry="6" fill="#8E8270" stroke="#6E6256" stroke-width="0.9"/>
    <!-- 糊粥面 -->
    <ellipse cx="100" cy="110" rx="25" ry="5" fill="url(#porridge)"/>
    <!-- 焦粒 -->
    <circle cx="92" cy="109" r="1.7" fill="#3E3226"/>
    <circle cx="108" cy="108" r="1.5" fill="#3E3226"/>
    <!-- 粥面脸（沮） -->
    <circle cx="94" cy="108" r="1.7" fill="#2E241E"/>
    <circle cx="106" cy="108" r="1.7" fill="#2E241E"/>
    <path d="M 96 111 Q 100 109.4 104 111" fill="none" stroke="#6E5238" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 焦烟 -->
    <path d="M 100 96 Q 97 88 100 80" stroke="#4A3E32" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.4">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
