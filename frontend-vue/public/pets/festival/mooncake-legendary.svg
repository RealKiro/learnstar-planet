<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="月饼·五阶·中秋之圆·圆如满月皮润馅足家人切分赏月圆包月">
  <defs>
    <!-- 背景：中秋夜家 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A5E"/>
      <stop offset="52%" stop-color="#5A5A7E"/>
      <stop offset="100%" stop-color="#8E8268"/>
    </linearGradient>
    <!-- 中秋神光 -->
    <radialGradient id="glow" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 中秋光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 饼皮（润如月） -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F8D088"/>
      <stop offset="100%" stop-color="#C89038"/>
    </radialGradient>
    <!-- 甜光 -->
    <radialGradient id="sweet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="40" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 圆月 -->
  <circle cx="100" cy="40" r="17" fill="#F8F4E8" opacity="0.95"/>
  <circle cx="106" cy="36" r="15" fill="#EFE8DA" opacity="0.85"/>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#E8EEF4">
    <circle cx="36" cy="60" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="56" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 饭桌 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E7260" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#7A6250" stroke-width="2"/>

  <!-- 家人（切分赏月） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="60" cy="128" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="60" cy="142" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 56 134 Q 50 128 48 124" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="128" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="150" cy="142" rx="5.5" ry="8" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8"/>
    <path d="M 154 134 Q 160 128 162 124" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 中秋之饼（中，圆如满月） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="110" r="26" fill="url(#sweet)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="104" cy="110" r="17" fill="url(#cake)" stroke="#A87028" stroke-width="1.1"/>
    <!-- 花纹（如月） -->
    <path d="M 94 98 Q 100 92 108 98" stroke="#A87028" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 92 104 Q 92 110 95 114" stroke="#A87028" stroke-width="1.1" fill="none" opacity="0.8"/>
    <path d="M 116 104 Q 116 110 113 114" stroke="#A87028" stroke-width="1.1" fill="none" opacity="0.8"/>
    <path d="M 102 92 L 106 92 M 102 128 L 106 128" stroke="#A87028" stroke-width="0.9" fill="none" opacity="0.7"/>
    <!-- 眼（含威含温） -->
    <circle cx="98" cy="108" r="2.3" fill="#2E2A24"/>
    <circle cx="98.6" cy="107.4" r="0.75" fill="#FFF"/>
    <circle cx="110" cy="108" r="2.3" fill="#2E2A24"/>
    <circle cx="110.6" cy="107.4" r="0.75" fill="#FFF"/>
    <!-- 嘴（喜） -->
    <path d="M 99 113 Q 104 115.6 109 113" fill="none" stroke="#8E6E3E" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
