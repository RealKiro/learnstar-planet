<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="粽子·六阶·粽子传说·暮光红绳碰小粽子家人围桌传叶裹团圆">
  <defs>
    <!-- 背景：端午灶台暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 老粽叶（泛岁月光） -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EB894"/>
      <stop offset="100%" stop-color="#6A9A72"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 饭桌 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E7260" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#7A6250" stroke-width="2"/>

  <!-- 围桌的家人（下，安享） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="132" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="56" cy="143" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <circle cx="100" cy="134" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="100" cy="145" rx="5" ry="7" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.7"/>
    <circle cx="144" cy="132" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="144" cy="143" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
  </g>

  <!-- 小粽子（右，叶里探脑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 三角身（小） -->
    <path d="M 138 108 L 158 150 Q 158 156 138 156 Q 118 156 118 150 Z" fill="url(#leaf)" stroke="#4E8858" stroke-width="0.9"/>
    <!-- 糯米面 -->
    <ellipse cx="138" cy="128" rx="12" ry="9.5" fill="#F4F0E4" stroke="#D8D0C0" stroke-width="0.7"/>
    <!-- 眼（亮） -->
    <circle cx="133" cy="126" r="1.6" fill="#2E2A24"/>
    <circle cx="133.4" cy="125.6" r="0.5" fill="#FFF"/>
    <circle cx="143" cy="126" r="1.6" fill="#2E2A24"/>
    <circle cx="143.4" cy="125.6" r="0.5" fill="#FFF"/>
    <!-- 嘴（笑） -->
    <path d="M 134 130 Q 138 131.8 142 130" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 红绳 -->
    <path d="M 124 140 Q 138 143 152 140" stroke="#D84048" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 叶尖 -->
    <path d="M 138 108 L 135 98 L 141 98 Z" fill="url(#leaf)" stroke="#4E8858" stroke-width="0.8"/>
  </g>

  <!-- 老粽子（左，红绳碰小粽，传团圆） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="118" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 三角身（大，岁月光） -->
    <path d="M 76 76 L 112 148 Q 112 156 76 156 Q 40 156 40 148 Z" fill="url(#leaf)" stroke="#3E6E46" stroke-width="1.1"/>
    <!-- 叶纹（如史） -->
    <path d="M 56 100 Q 60 122 56 146" stroke="#3E6E46" stroke-width="0.9" fill="none" opacity="0.7"/>
    <path d="M 96 100 Q 92 122 96 146" stroke="#3E6E46" stroke-width="0.9" fill="none" opacity="0.7"/>
    <!-- 糯米面（如古玉） -->
    <ellipse cx="76" cy="120" rx="16" ry="12" fill="#F4F0E4" stroke="#D8D0C0" stroke-width="0.8"/>
    <!-- 眼（温和，目含慈） -->
    <circle cx="70" cy="118" r="2" fill="#2E2A24"/>
    <circle cx="70.5" cy="117.5" r="0.65" fill="#FFF"/>
    <circle cx="82" cy="118" r="2" fill="#2E2A24"/>
    <circle cx="82.5" cy="117.5" r="0.65" fill="#FFF"/>
    <!-- 嘴（慈笑） -->
    <path d="M 72 123 Q 76 125.4 80 123" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 红绳（伸向小粽，碰光） -->
    <path d="M 88 134 Q 100 140 116 140" stroke="#E04850" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 88 134;4 88 134;-4 88 134" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光（老绳→小粽） -->
    <circle cx="120" cy="136" r="9" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 叶尖 -->
    <path d="M 76 76 L 71 62 L 81 62 Z" fill="url(#leaf)" stroke="#3E6E46" stroke-width="1"/>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
