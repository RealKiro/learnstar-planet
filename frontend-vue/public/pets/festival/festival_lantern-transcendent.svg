<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="花灯·六阶·花灯传说·暮光灯穗碰小花灯孩童提灯跑过传灯心要稳">
  <defs>
    <!-- 背景：元宵灯铺暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灯身 -->
    <radialGradient id="lamp" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F8E4C0"/>
      <stop offset="100%" stop-color="#E8B878"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灯铺台面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 提灯跑过的孩童（下） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.2 0;0 0" dur="3s" repeatCount="indefinite"/>
    <circle cx="100" cy="134" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="100" cy="147" rx="5" ry="7" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <path d="M 96 141 Q 90 133 88 125" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M 86 124 L 86 112" stroke="#8E6E50" stroke-width="1"/>
    <ellipse cx="86" cy="102" rx="6" ry="7" fill="#F0A858" opacity="0.9"/>
    <path d="M 86 95 L 86 109" stroke="#C88848" stroke-width="0.7"/>
  </g>

  <!-- 小花灯（右，竹骨初扎） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 提绳 -->
    <path d="M 150 78 L 150 70" stroke="#8E6E50" stroke-width="1" stroke-linecap="round"/>
    <!-- 顶盖 -->
    <path d="M 138 78 Q 150 73 162 78 L 162 81 Q 150 76 138 81 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.7"/>
    <!-- 小灯身 -->
    <ellipse cx="150" cy="94" rx="12" ry="14" fill="url(#lamp)" stroke="#C89858" stroke-width="0.8"/>
    <path d="M 138 89 Q 150 85 162 89" stroke="#C89858" stroke-width="0.6" fill="none" opacity="0.7"/>
    <circle cx="150" cy="92" r="4.5" fill="#FFF0D0" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.28;0.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="92" r="1.4" fill="#3E2E24"/>
    <circle cx="154" cy="92" r="1.4" fill="#3E2E24"/>
    <path d="M 148 95.5 Q 150 96.8 152 95.5" fill="none" stroke="#B08A6A" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 底盖 -->
    <path d="M 140 106 Q 150 110 160 106 L 160 108 Q 150 112 140 108 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.7"/>
    <!-- 灯穗 -->
    <path d="M 150 111 L 150 118" stroke="#D84048" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 老花灯（左，灯穗碰小花灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="110" r="26" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 挂绳 -->
    <path d="M 76 62 L 76 54" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 顶盖 -->
    <path d="M 54 62 Q 76 54 98 62 L 98 67 Q 76 59 54 67 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.9"/>
    <!-- 大灯身（如古月） -->
    <ellipse cx="76" cy="92" rx="22" ry="25" fill="url(#lamp)" stroke="#C89858" stroke-width="1.1"/>
    <path d="M 54 84 Q 76 76 98 84" stroke="#C89858" stroke-width="0.8" fill="none" opacity="0.7"/>
    <path d="M 54 92 L 98 92" stroke="#C89858" stroke-width="0.8" fill="none" opacity="0.7"/>
    <circle cx="76" cy="90" r="10" fill="#FFF0D0" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.35;0.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 脸（温和，目含慈） -->
    <circle cx="69" cy="90" r="2.2" fill="#3E2E24"/>
    <circle cx="69.6" cy="89.4" r="0.7" fill="#FFF"/>
    <circle cx="83" cy="90" r="2.2" fill="#3E2E24"/>
    <circle cx="83.6" cy="89.4" r="0.7" fill="#FFF"/>
    <path d="M 72 95 Q 76 97 80 95" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 底盖 -->
    <path d="M 57 115 Q 76 122 95 115 L 95 119 Q 76 126 57 119 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.9"/>
    <!-- 灯穗（伸向小灯，碰光） -->
    <path d="M 76 123 Q 100 128 126 118" stroke="#D84048" stroke-width="1.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 76 123;4 76 123;-4 76 123" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="116" cy="116" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
