<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="年糕·六阶·年糕传说·暮光糯身碰小年糕家人围桌传年年高为底">
  <defs>
    <!-- 背景：过年厨房暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 年糕 -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 餐桌 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 围桌家人（下） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="136" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="56" cy="148" rx="5" ry="7" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <circle cx="144" cy="136" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="144" cy="148" rx="5" ry="7" fill="#A8886E" stroke="#8E6E50" stroke-width="0.7"/>
  </g>

  <!-- 小年糕（右，被打） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <rect x="130" y="124" width="24" height="18" rx="6" fill="url(#cake)" stroke="#D0C8B8" stroke-width="0.8"/>
    <circle cx="138" cy="131" r="1.5" fill="#2E2A24"/>
    <circle cx="138.4" cy="130.6" r="0.5" fill="#FFF"/>
    <circle cx="146" cy="131" r="1.5" fill="#2E2A24"/>
    <circle cx="146.4" cy="130.6" r="0.5" fill="#FFF"/>
    <path d="M 139 134.5 Q 142 136 145 134.5" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 头顶槌印 -->
    <path d="M 138 122 Q 142 118 146 122" stroke="#C8C0B0" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- 老年糕（左，糯身碰小年糕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="82" cy="116" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="66" y="104" width="34" height="26" rx="9" fill="url(#cake)" stroke="#C8C0B0" stroke-width="1"/>
    <!-- 眼（温和，目含慈） -->
    <circle cx="76" cy="116" r="2.1" fill="#2E2A24"/>
    <circle cx="76.6" cy="115.4" r="0.7" fill="#FFF"/>
    <circle cx="90" cy="116" r="2.1" fill="#2E2A24"/>
    <circle cx="90.6" cy="115.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（慈笑） -->
    <path d="M 79 121 Q 83 123.4 87 121" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 传心微光 -->
    <circle cx="112" cy="122" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
