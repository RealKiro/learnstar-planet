<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="馄饨·六阶·馄饨传说·暮光褶碰小馄饨晚归人捧碗传元宝为周">
  <defs>
    <!-- 背景：冬至案上暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 馄饨皮 -->
    <radialGradient id="skin" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#E4D8C4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 案板 -->
  <path d="M 30 146 L 178 146 L 186 160 L 22 160 Z" fill="#B08A5E" stroke="#9E7A4E" stroke-width="1.2"/>
  <!-- 灶台 -->
  <path d="M 0 160 L 200 160 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 捧碗的晚归人（下） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="136" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="148" cy="150" rx="5.5" ry="8" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 142 142 Q 136 138 134 134" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="136" cy="146" rx="6" ry="2" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.5"/>
    <path d="M 133 143 Q 135 141 137 143 Q 139 145 135 145 Q 133 145 133 143 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.4"/>
  </g>

  <!-- 小馄饨（右，元宝初包） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 128 126 Q 138 116 148 126 Q 154 136 148 144 Q 138 148 128 144 Q 122 136 128 126 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.8"/>
    <path d="M 132 122 Q 133 117 136 116" stroke="#C8B898" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <path d="M 138 120 Q 139 115 141 115" stroke="#C8B898" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <circle cx="134" cy="132" r="1.5" fill="#2E2A24"/>
    <circle cx="142" cy="132" r="1.5" fill="#2E2A24"/>
    <path d="M 136 137 Q 138 138.4 140 137" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 老馄饨（左，褶碰小馄饨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="116" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 元宝身（大，如古） -->
    <path d="M 60 104 Q 76 92 92 104 Q 100 120 92 132 Q 76 138 60 132 Q 52 120 60 104 Z" fill="url(#skin)" stroke="#C8B8A0" stroke-width="1"/>
    <!-- 褶（如古） -->
    <path d="M 66 98 Q 67 93 70 92" stroke="#C0B098" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 76 96 Q 77 91 79 91" stroke="#C0B098" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 86 98 Q 87 93 89 92" stroke="#C0B098" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <ellipse cx="76" cy="118" rx="7" ry="6" fill="#E0A080" opacity="0.5"/>
    <!-- 眼（温和，目含慈） -->
    <circle cx="70" cy="114" r="2" fill="#2E2A24"/>
    <circle cx="70.6" cy="113.4" r="0.65" fill="#FFF"/>
    <circle cx="82" cy="114" r="2" fill="#2E2A24"/>
    <circle cx="82.6" cy="113.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（慈笑） -->
    <path d="M 72 120 Q 76 122 80 120" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 褶碰（传） -->
    <path d="M 92 116 Q 104 116 114 120" stroke="#FFF0D0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="112" cy="120" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
