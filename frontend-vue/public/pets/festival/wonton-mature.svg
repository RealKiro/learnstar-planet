<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="馄饨·四阶·暖冬初成·冬至晚归人捧碗喝口热汤热汽糊镜说家馄饨最暖">
  <defs>
    <!-- 背景：冬至夜桌 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6E"/>
      <stop offset="52%" stop-color="#7A7268"/>
      <stop offset="100%" stop-color="#A89278"/>
    </linearGradient>
    <!-- 夜暖 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 馄饨皮 -->
    <radialGradient id="skin" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#F8F4E8" opacity="0.6">
    <circle cx="40" cy="26" r="1.2">
      <animate attributeName="cy" values="26;52;26" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="18" r="1">
      <animate attributeName="cy" values="18;44;18" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 桌 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 端碗的家人（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="120" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="58" cy="134" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 64 126 Q 70 122 72 118" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 捧碗的晚归人（右，喝汤） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="110" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="148" cy="130" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 眼镜（糊雾） -->
    <path d="M 142 109 Q 148 107 154 109" stroke="#4E4A44" stroke-width="1" fill="none"/>
    <path d="M 154 109 L 158 109" stroke="#4E4A44" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="143" cy="109" rx="2.6" ry="3.4" fill="none" stroke="#4E4A44" stroke-width="0.8"/>
    <ellipse cx="152" cy="109" rx="2.6" ry="3.4" fill="none" stroke="#4E4A44" stroke-width="0.8"/>
    <!-- 糊镜的雾 -->
    <circle cx="143" cy="109" r="1.4" fill="#F0F4F8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="109" r="1.3" fill="#F0F4F8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 捧碗的手 -->
    <path d="M 142 120 L 132 124 M 154 120 L 158 124" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 手里的碗 -->
    <path d="M 134 122 Q 144 118 154 122 Q 152 130 144 130 Q 136 130 134 122 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.8"/>
    <ellipse cx="144" cy="122" rx="10" ry="3.5" fill="#F0E0C8"/>
    <!-- 碗里馄饨 -->
    <path d="M 141 120 Q 143 117 145 120 Q 147 123 143 123 Q 140 123 141 120 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.5"/>
    <!-- 嘴（笑说） -->
    <path d="M 145 114 Q 148 116 151 114" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 桌上的一碗馄饨（中，热气） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 92 130 Q 104 122 116 130 Q 113 140 104 140 Q 95 140 92 130 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.9"/>
    <ellipse cx="104" cy="130" rx="12" ry="4.5" fill="#F0E0C8"/>
    <path d="M 100 127 Q 102 123 104 127 Q 106 131 102 131 Q 99 131 100 127 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.6"/>
    <circle cx="100" cy="128" r="1.3" fill="#2E2A24"/>
    <circle cx="106" cy="128" r="1.3" fill="#2E2A24"/>
    <path d="M 101 130 Q 103 131 105 130" fill="none" stroke="#B08A6A" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 热气 -->
    <path d="M 102 120 Q 99 112 102 104" stroke="#F8F0E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
