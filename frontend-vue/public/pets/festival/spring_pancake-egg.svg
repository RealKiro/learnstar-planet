<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="春饼·一阶·面皮初擀·立春厨房擀薄如翼透亮窗外柳芽发">
  <defs>
    <!-- 背景：立春厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D0A8"/>
      <stop offset="52%" stop-color="#C0C8A0"/>
      <stop offset="100%" stop-color="#9EA890"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 春饼（薄透） -->
    <radialGradient id="pancake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4D0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 窗外柳芽（右） -->
  <g>
    <path d="M 150 60 Q 160 66 168 78" stroke="#6E9E5E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 156 70 L 160 72 L 156 74 Z" fill="#7AB878"/>
    <path d="M 162 76 L 166 78 L 162 80 Z" fill="#7AB878"/>
    <path d="M 150 62 L 152 60 L 151 64 Z" fill="#7AB878"/>
    <!-- 窗框 -->
    <g stroke="#6E6256" stroke-width="1.3">
      <path d="M 146 52 L 146 92 M 178 52 L 178 92 M 146 72 L 178 72"/>
    </g>
  </g>

  <!-- 案板 -->
  <path d="M 40 138 L 170 138 L 178 152 L 32 152 Z" fill="#B08A5E" stroke="#9E7A4E" stroke-width="1.2"/>
  <!-- 灶台 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#9EA890" opacity="0.9"/>

  <!-- 小春饼（中，薄如翼透亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 薄饼身 -->
    <ellipse cx="100" cy="124" rx="22" ry="10" fill="url(#pancake)" stroke="#D8D0BC" stroke-width="0.9"/>
    <!-- 透亮微光 -->
    <ellipse cx="100" cy="123" rx="16" ry="7" fill="#FFF" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.2;0.35" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 眼（探看） -->
    <circle cx="93" cy="122" r="2" fill="#2E2A24"/>
    <circle cx="93.5" cy="121.5" r="0.65" fill="#FFF"/>
    <circle cx="107" cy="122" r="2" fill="#2E2A24"/>
    <circle cx="107.5" cy="121.5" r="0.65" fill="#FFF"/>
    <!-- 嘴（轻） -->
    <path d="M 96 126.5 Q 100 128 104 126.5" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="50" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
