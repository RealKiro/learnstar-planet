<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="桂花糕·一阶·桂花初点·秋日厨房雪白软糯桂点金黄窗外桂花落">
  <defs>
    <!-- 背景：秋日厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C8A0"/>
      <stop offset="52%" stop-color="#D4A878"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕身雪白 -->
    <radialGradient id="cake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE2D0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 窗外桂花（右） -->
  <g>
    <path d="M 150 52 Q 160 66 166 80" stroke="#8E7A50" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <g fill="#F0C040">
      <circle cx="156" cy="66" r="1.6"/>
      <circle cx="160" cy="62" r="1.5"/>
      <circle cx="162" cy="68" r="1.5"/>
    </g>
    <g stroke="#6E6256" stroke-width="1.2">
      <path d="M 146 44 L 146 88 L 178 88"/>
    </g>
    <!-- 飘落的桂花 -->
    <circle cx="144" cy="96" r="1.4" fill="#F0C040">
      <animate attributeName="cy" values="96;112;96" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="100" r="1.3" fill="#F0C040">
      <animate attributeName="cy" values="100;116;100" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 蒸笼 -->
  <ellipse cx="100" cy="138" rx="30" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="1.2"/>
  <path d="M 70 138 Q 100 132 130 138 Q 100 146 70 138 Z" fill="#B89E6E" stroke="#A89060" stroke-width="0.8"/>

  <!-- 小桂花糕（中，雪白桂点） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 糕身 -->
    <rect x="84" y="112" width="32" height="26" rx="7" fill="url(#cake)" stroke="#D0C8B4" stroke-width="0.9"/>
    <!-- 桂点（金黄） -->
    <g fill="#F0C040">
      <circle cx="92" cy="114" r="1.6"/>
      <circle cx="104" cy="112" r="1.5"/>
      <circle cx="112" cy="115" r="1.4"/>
      <circle cx="97" cy="111" r="1.3"/>
    </g>
    <!-- 眼 -->
    <circle cx="93" cy="124" r="1.9" fill="#2E2A24"/>
    <circle cx="93.5" cy="123.5" r="0.6" fill="#FFF"/>
    <circle cx="107" cy="124" r="1.9" fill="#2E2A24"/>
    <circle cx="107.5" cy="123.5" r="0.6" fill="#FFF"/>
    <!-- 嘴 -->
    <path d="M 96 129 Q 100 130.8 104 129" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 桂香散 -->
    <path d="M 94 108 Q 90 100 94 92" stroke="#F8E8C0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 106 110 Q 110 102 106 94" stroke="#F8E8C0" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#F8E8C0">
    <circle cx="50" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
