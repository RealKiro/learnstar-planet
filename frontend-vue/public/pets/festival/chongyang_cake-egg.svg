<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="重阳糕·一阶·糕层初叠·重阳厨房层叠枣栗菊花缀看孩抬糕往长辈屋">
  <defs>
    <!-- 背景：重阳厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#D0A478"/>
      <stop offset="100%" stop-color="#B08E6E"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕层 -->
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C878"/>
      <stop offset="100%" stop-color="#D0A858"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 抬糕往长辈屋的孩子（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="122" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="156" cy="134" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <path d="M 160 128 Q 166 124 168 120" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 抬的糕 -->
    <rect x="168" y="118" width="14" height="8" rx="1.5" fill="#E0BE78" stroke="#C89E58" stroke-width="0.6"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 小重阳糕（中，层叠，菊缀） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 底层 -->
    <rect x="80" y="128" width="40" height="14" rx="4" fill="#D0A858" stroke="#B08A3E" stroke-width="0.8"/>
    <!-- 中层 -->
    <rect x="83" y="115" width="34" height="13" rx="4" fill="#DCB468" stroke="#B08A3E" stroke-width="0.8"/>
    <!-- 顶层（脸层） -->
    <rect x="86" y="102" width="28" height="13" rx="4" fill="url(#cake)" stroke="#B08A3E" stroke-width="0.8"/>
    <!-- 枣栗点缀 -->
    <circle cx="88" cy="135" r="1.8" fill="#8E4A3E"/>
    <circle cx="110" cy="121" r="1.8" fill="#8E4A3E"/>
    <circle cx="94" cy="121" r="1.5" fill="#B0803E"/>
    <!-- 眼（层间） -->
    <circle cx="96" cy="106" r="1.9" fill="#3E2E24"/>
    <circle cx="96.5" cy="105.5" r="0.6" fill="#FFF"/>
    <circle cx="104" cy="106" r="1.9" fill="#3E2E24"/>
    <circle cx="104.5" cy="105.5" r="0.6" fill="#FFF"/>
    <!-- 嘴（笑） -->
    <path d="M 97 110 Q 100 111.6 103 110" fill="none" stroke="#9E6E3E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 顶菊花（晃） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 100 94;3 100 94;-3 100 94" dur="2.2s" repeatCount="indefinite"/>
      <ellipse cx="98" cy="95" rx="2.4" ry="5" fill="#F0C040" transform="rotate(-30 98 95)"/>
      <ellipse cx="102" cy="95" rx="2.4" ry="5" fill="#F8D060" transform="rotate(30 102 95)"/>
      <ellipse cx="100" cy="94" rx="2.4" ry="5" fill="#E8B038" transform="rotate(0 100 94)"/>
      <circle cx="100" cy="94" r="1.8" fill="#F8E080"/>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="50" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
