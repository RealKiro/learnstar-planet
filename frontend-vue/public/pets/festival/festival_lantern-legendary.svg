<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="花灯·五阶·元宵之诗·灯彩如霞烛光如月孩童提灯家人许愿">
  <defs>
    <!-- 背景：元宵夜家 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A5E"/>
      <stop offset="52%" stop-color="#5A5A7E"/>
      <stop offset="100%" stop-color="#8E8268"/>
    </linearGradient>
    <!-- 元宵神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 元宵光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灯身（如霞） -->
    <radialGradient id="lamp" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FCE8C8"/>
      <stop offset="100%" stop-color="#F0C080"/>
    </radialGradient>
    <!-- 烛光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#E8EEF4">
    <circle cx="36" cy="30" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="28" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#6E6256" opacity="0.9"/>

  <!-- 提灯的孩童（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="60" cy="128" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="60" cy="141" rx="5" ry="7.5" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <path d="M 66 133 Q 72 129 74 125" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 72 124 L 72 114" stroke="#8E6E50" stroke-width="1"/>
    <ellipse cx="72" cy="104" rx="6" ry="7" fill="#F0A858" opacity="0.9"/>
    <path d="M 72 97 L 72 111" stroke="#C88848" stroke-width="0.7"/>
  </g>
  <!-- 许愿的家人（右） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="124" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="148" cy="141" rx="6" ry="9" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 142 133 Q 136 128 134 124" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 合十许愿 -->
    <path d="M 142 129 L 138 135" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 154 129 L 158 135" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 元宵之诗（中，檐下稳亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="84" r="30" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 挂绳 -->
    <path d="M 104 44 L 104 54" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 顶盖 -->
    <path d="M 82 54 Q 104 46 126 54 L 126 59 Q 104 51 82 59 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.9"/>
    <!-- 大灯身 -->
    <ellipse cx="104" cy="82" rx="22" ry="25" fill="url(#lamp)" stroke="#C89858" stroke-width="1.1"/>
    <!-- 竹骨纹 -->
    <path d="M 82 74 Q 104 66 126 74" stroke="#C89858" stroke-width="0.8" fill="none" opacity="0.7"/>
    <path d="M 82 82 L 126 82" stroke="#C89858" stroke-width="0.8" fill="none" opacity="0.7"/>
    <path d="M 82 90 Q 104 98 126 90" stroke="#C89858" stroke-width="0.8" fill="none" opacity="0.7"/>
    <!-- 烛光如月 -->
    <circle cx="104" cy="80" r="11" fill="#FFF0D0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.38;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 脸（含威含温） -->
    <circle cx="97" cy="80" r="2.3" fill="#3E2E24"/>
    <circle cx="97.6" cy="79.4" r="0.75" fill="#FFF"/>
    <circle cx="111" cy="80" r="2.3" fill="#3E2E24"/>
    <circle cx="111.6" cy="79.4" r="0.75" fill="#FFF"/>
    <path d="M 100 86 Q 104 88.2 108 86" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 底盖 -->
    <path d="M 85 105 Q 104 112 123 105 L 123 109 Q 104 116 85 109 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.9"/>
    <!-- 灯穗（如霞） -->
    <path d="M 104 113 L 104 123" stroke="#D84048" stroke-width="1.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 104 113;4 104 113;-4 104 113" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="104" cy="126" r="2.4" fill="#D84048"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
