<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="年糕·二阶·硬心之困·放久变硬咬不动孩子嫌硬缩盘立志">
  <defs>
    <!-- 背景：过年餐桌 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B890"/>
      <stop offset="52%" stop-color="#B89870"/>
      <stop offset="100%" stop-color="#9E8468"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 年糕（硬白） -->
    <radialGradient id="cake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#C8C4B8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 嫌硬的孩子（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="116" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="152" cy="129" rx="5" ry="7.5" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <!-- 皱眉（嫌硬） -->
    <path d="M 147 114 Q 150 112.6 153 114" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 155 114 Q 157 112.6 158 114" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 154 113 Q 156 114 155 115" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 餐桌 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 硬白的年糕（中，缩盘） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 盘 -->
    <ellipse cx="96" cy="136" rx="20" ry="5" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.8"/>
    <!-- 硬糕（缩，硬白） -->
    <rect x="84" y="118" width="26" height="20" rx="6" fill="url(#cake)" stroke="#B0AC9E" stroke-width="0.9"/>
    <!-- 硬纹 -->
    <path d="M 90 122 L 94 126" stroke="#B0AC9E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 104 124 L 100 120" stroke="#B0AC9E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 眼（含沮） -->
    <circle cx="91" cy="126" r="1.8" fill="#2E2A24"/>
    <circle cx="103" cy="126" r="1.8" fill="#2E2A24"/>
    <!-- 嘴（低垂） -->
    <path d="M 93 130.5 Q 97 129 101 130.5" fill="none" stroke="#9E8E74" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.4">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
