<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="花灯·二阶·风吹灯灭·元宵刚点风噗吹灭孩点三次急跺脚看暗灯身">
  <defs>
    <!-- 背景：元宵夜灯铺 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A5A"/>
      <stop offset="52%" stop-color="#4A4A5E"/>
      <stop offset="100%" stop-color="#7A6E5E"/>
    </linearGradient>
    <!-- 弱光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="30%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灯身（暗） -->
    <radialGradient id="lamp" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="100%" stop-color="#A88850"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="60" fill="url(#glow)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风痕 -->
  <g stroke="#8EA4BC" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 24 60 Q 44 54 58 56">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 44 Q 168 40 180 42">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 跺脚的小孩（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="118" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="156" cy="132" rx="5.5" ry="8" fill="#C87868" stroke="#A86050" stroke-width="0.8"/>
    <path d="M 160 126 Q 165 122 166 118" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 跺脚 -->
    <path d="M 158 140 L 160 148 M 154 140 L 152 148" stroke="#C87868" stroke-width="1.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- 气鼓鼓 -->
    <path d="M 151 116 Q 154 114.6 157 116" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 159 116 Q 161 114.6 162 116" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 台面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E5E50" opacity="0.9"/>

  <!-- 烛灭的小花灯（中，暗） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 顶盖 -->
    <path d="M 84 86 Q 100 80 116 86 L 116 90 Q 100 84 84 90 Z" fill="#A89050" stroke="#8E7840" stroke-width="0.8"/>
    <!-- 灯身（暗） -->
    <ellipse cx="100" cy="108" rx="16" ry="18" fill="url(#lamp)" stroke="#967A48" stroke-width="1"/>
    <!-- 竹骨纹 -->
    <path d="M 84 102 Q 100 96 116 102" stroke="#967A48" stroke-width="0.7" fill="none" opacity="0.7"/>
    <path d="M 84 108 L 116 108" stroke="#967A48" stroke-width="0.7" fill="none" opacity="0.7"/>
    <!-- 内亮（灭，余烬） -->
    <circle cx="100" cy="106" r="5" fill="#F0C060" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.07;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 脸（沮） -->
    <circle cx="95" cy="106" r="1.8" fill="#3E2E24"/>
    <circle cx="105" cy="106" r="1.8" fill="#3E2E24"/>
    <path d="M 97 111 Q 100 109.4 103 111" fill="none" stroke="#8E6E4E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 底盖 -->
    <path d="M 86 124 Q 100 130 114 124 L 114 127 Q 100 133 86 127 Z" fill="#A89050" stroke="#8E7840" stroke-width="0.8"/>
    <!-- 灯穗（垂） -->
    <path d="M 100 131 L 100 139" stroke="#A83840" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.3">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
