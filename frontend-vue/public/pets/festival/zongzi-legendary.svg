<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="粽子·五阶·端午之味·叶裹糯玉红绳如喜家人解绳分食香散最远">
  <defs>
    <!-- 背景：端午人家暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D4AC74"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 端午神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 端午光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 粽叶（青玉） -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#84BC8E"/>
      <stop offset="100%" stop-color="#5C9A6A"/>
    </linearGradient>
    <!-- 糯米珠玉 -->
    <radialGradient id="rice" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 饭桌 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#8E7260" opacity="0.9"/>
  <path d="M 0 146 L 200 146" stroke="#7A6250" stroke-width="2"/>

  <!-- 家人（左，解绳） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="60" cy="118" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="60" cy="133" rx="6" ry="9" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 66 126 Q 72 124 74 120" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 63 121 Q 65 120.4 67 121" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>
  <!-- 家人（右，分食） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="140" cy="120" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="140" cy="134" rx="5.5" ry="8.5" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8"/>
    <path d="M 134 127 Q 128 123 126 119" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 端午之粽（中，叶如青玉，红绳如喜） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="110" r="26" fill="#F0E4C8" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.1;0.18" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 三角身（青玉） -->
    <path d="M 100 70 L 136 144 Q 136 152 100 152 Q 64 152 64 144 Z" fill="url(#leaf)" stroke="#3E6E46" stroke-width="1.1"/>
    <!-- 叶纹 -->
    <path d="M 80 94 Q 84 118 80 144" stroke="#3E6E46" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M 120 94 Q 116 118 120 144" stroke="#3E6E46" stroke-width="1" fill="none" opacity="0.7"/>
    <!-- 糯米面（珠玉） -->
    <ellipse cx="100" cy="116" rx="18" ry="13.5" fill="#F8F4E8" stroke="#D8D0C0" stroke-width="0.8"/>
    <ellipse cx="100" cy="116" rx="18" ry="13.5" fill="url(#rice)"/>
    <!-- 眼（含威含温） -->
    <circle cx="93" cy="114" r="2.2" fill="#2E2A24"/>
    <circle cx="93.6" cy="113.4" r="0.7" fill="#FFF"/>
    <circle cx="107" cy="114" r="2.2" fill="#2E2A24"/>
    <circle cx="107.6" cy="113.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（喜） -->
    <path d="M 94 119 Q 100 122.6 106 119" fill="none" stroke="#B08A6A" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 红绳如喜（双道） -->
    <path d="M 76 130 Q 100 135 124 130" stroke="#E04850" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-3 100 133;3 100 133;-3 100 133" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 78 136 Q 100 140 122 136" stroke="#E04850" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 叶尖 -->
    <path d="M 100 70 L 95 56 L 105 56 Z" fill="url(#leaf)" stroke="#3E6E46" stroke-width="1"/>
  </g>

  <!-- 满桌香气 -->
  <g stroke="#FFF4E0" stroke-linecap="round" fill="none">
    <path d="M 82 94 Q 78 80 84 68" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 118 92 Q 122 78 116 66" stroke-width="1.5" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 64 Q 97 52 102 44" stroke-width="1.4" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="46" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
