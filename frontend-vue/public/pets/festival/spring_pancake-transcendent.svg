<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="春饼·六阶·春饼传说·暮光轻托小春饼小孩咬春传薄饼卷春">
  <defs>
    <!-- 背景：立春厨房暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C4A0"/>
      <stop offset="52%" stop-color="#B8A47E"/>
      <stop offset="100%" stop-color="#8E9E8A"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 春饼 -->
    <radialGradient id="pancake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮柳 -->
  <g stroke="#5E9E4E" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M 158 34 Q 166 50 162 64"/>
  </g>

  <!-- 案板 -->
  <path d="M 30 146 L 178 146 L 186 160 L 22 160 Z" fill="#B08A5E" stroke="#9E7A4E" stroke-width="1.2"/>
  <!-- 灶台 -->
  <path d="M 0 160 L 200 160 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 咬春的小孩（下） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="150" cy="134" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="150" cy="147" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <ellipse cx="136" cy="143" rx="7" ry="4.5" fill="url(#pancake)" stroke="#D8D0BC" stroke-width="0.7" transform="rotate(-20 136 143)"/>
    <path d="M 145 145 Q 148 146.6 151 145" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 小春饼（右，擀薄） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="138" cy="126" rx="15" ry="7" fill="url(#pancake)" stroke="#D0C8B4" stroke-width="0.8"/>
    <circle cx="134" cy="124" r="1.5" fill="#2E2A24"/>
    <circle cx="134.4" cy="123.6" r="0.5" fill="#FFF"/>
    <circle cx="143" cy="124" r="1.5" fill="#2E2A24"/>
    <circle cx="143.4" cy="123.6" r="0.5" fill="#FFF"/>
    <path d="M 136 127 Q 138 128.4 140 127" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 老春饼（左，轻托小春饼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="78" cy="114" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="78" cy="114" rx="22" ry="12" fill="url(#pancake)" stroke="#C8C0AC" stroke-width="1"/>
    <!-- 透亮微光 -->
    <ellipse cx="78" cy="113" rx="16" ry="8" fill="#FFF" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.17;0.3" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 眼（温和，目含慈） -->
    <circle cx="71" cy="112" r="2" fill="#2E2A24"/>
    <circle cx="71.6" cy="111.4" r="0.65" fill="#FFF"/>
    <circle cx="85" cy="112" r="2" fill="#2E2A24"/>
    <circle cx="85.6" cy="111.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（慈笑） -->
    <path d="M 74 117 Q 78 119 82 117" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 托向小饼的手（轻托） -->
    <path d="M 96 116 Q 110 118 120 122" stroke="#E8E0D0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-3 96 116;3 96 116;-3 96 116" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="116" cy="122" r="9" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
