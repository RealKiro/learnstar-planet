<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="年糕·一阶·糯米初打·过年厨房木槌捶打糯白劲道孩子围灶等">
  <defs>
    <!-- 背景：过年厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#D0A478"/>
      <stop offset="100%" stop-color="#B08E6E"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 年糕糯白 -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 春联红（背景） -->
  <g fill="#C83838" opacity="0.85">
    <rect x="150" y="56" width="34" height="8" rx="2"/>
    <rect x="154" y="70" width="26" height="6" rx="2"/>
  </g>

  <!-- 孩子（右，围灶等） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="118" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="152" cy="131" rx="5" ry="7.5" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <path d="M 156 126 Q 161 122 162 118" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <circle cx="149" cy="116.5" r="1.3" fill="#24180E"/>
    <circle cx="149.4" cy="116.1" r="0.45" fill="#FFF"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>
  <!-- 案板 -->
  <path d="M 62 138 L 130 138 L 136 148 L 56 148 Z" fill="#B08A5E" stroke="#9E7A4E" stroke-width="1"/>

  <!-- 木槌（捶打） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="1.4s" repeatCount="indefinite"/>
    <rect x="96" y="96" width="10" height="22" rx="3" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8" transform="rotate(6 101 108)"/>
    <path d="M 92 92 Q 101 84 110 92 Q 107 96 101 96 Q 95 96 92 92 Z" fill="#8E6E50" stroke="#6E5238" stroke-width="0.8"/>
  </g>

  <!-- 小年糕（中，被打，糯白劲道） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="1.4s" repeatCount="indefinite"/>
    <!-- 白胖身 -->
    <rect x="84" y="116" width="32" height="24" rx="8" fill="url(#cake)" stroke="#D0C8B8" stroke-width="0.9"/>
    <!-- 眼（亮） -->
    <circle cx="94" cy="124" r="2" fill="#2E2A24"/>
    <circle cx="94.5" cy="123.5" r="0.65" fill="#FFF"/>
    <circle cx="106" cy="124" r="2" fill="#2E2A24"/>
    <circle cx="106.5" cy="123.5" r="0.65" fill="#FFF"/>
    <!-- 嘴（挺劲） -->
    <path d="M 96 129 Q 100 131 104 129" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="50" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
