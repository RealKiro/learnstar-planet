<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="粽子·三阶·炼香苦修·裹紧糯亮解开满灶香老少皆宜">
  <defs>
    <!-- 背景：端午灶台晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D0AC78"/>
      <stop offset="100%" stop-color="#B08E6A"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 粽叶（裹紧，青亮） -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AB884"/>
      <stop offset="100%" stop-color="#56926A"/>
    </linearGradient>
    <!-- 糯米亮 -->
    <radialGradient id="rice" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0E8D8" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 142 L 200 142 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>
  <path d="M 0 142 L 200 142" stroke="#8E7260" stroke-width="2"/>

  <!-- 粽子（中，裹紧糯亮，香飘） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 三角身（裹紧） -->
    <path d="M 100 76 L 132 140 Q 132 148 100 148 Q 68 148 68 140 Z" fill="url(#leaf)" stroke="#3E6E46" stroke-width="1"/>
    <!-- 叶纹（紧） -->
    <path d="M 82 98 Q 86 118 82 142" stroke="#3E6E46" stroke-width="0.9" fill="none" opacity="0.7"/>
    <path d="M 118 98 Q 114 118 118 142" stroke="#3E6E46" stroke-width="0.9" fill="none" opacity="0.7"/>
    <!-- 糯米面（晶亮） -->
    <ellipse cx="100" cy="118" rx="16" ry="12.5" fill="#F8F4E8" stroke="#D8D0C0" stroke-width="0.8"/>
    <ellipse cx="100" cy="118" rx="16" ry="12.5" fill="url(#rice)"/>
    <!-- 眼（专注） -->
    <circle cx="94" cy="116" r="2" fill="#2E2A24"/>
    <circle cx="94.5" cy="115.5" r="0.65" fill="#FFF"/>
    <circle cx="106" cy="116" r="2" fill="#2E2A24"/>
    <circle cx="106.5" cy="115.5" r="0.65" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 95 121 Q 100 124 105 121" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 红绳（喜） -->
    <path d="M 78 131 Q 100 135 122 131" stroke="#D84048" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-3 100 133;3 100 133;-3 100 133" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 叶尖 -->
    <path d="M 100 76 L 96 64 L 104 64 Z" fill="url(#leaf)" stroke="#3E6E46" stroke-width="0.9"/>
  </g>

  <!-- 满灶香气（环绕） -->
  <g stroke="#FFF4E0" stroke-linecap="round" fill="none">
    <path d="M 66 104 Q 62 94 66 86" stroke-width="1.4" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 136 102 Q 140 92 136 84" stroke-width="1.4" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 62 Q 98 52 102 46" stroke-width="1.3" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 米粒点缀（香） -->
  <g fill="#F8F4E8">
    <circle cx="62" cy="96" r="1.3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="142" cy="92" r="1.2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
