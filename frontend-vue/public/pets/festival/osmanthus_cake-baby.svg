<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="桂花糕·二阶·香散之惑·放一晚香散味淡没人尝低头看淡">
  <defs>
    <!-- 背景：秋日桌角 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#A88A68"/>
      <stop offset="100%" stop-color="#8E7660"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕身（淡白） -->
    <radialGradient id="cake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ECE4D4"/>
      <stop offset="100%" stop-color="#CEC4B0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;0.3;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 吃别样的家人（右后） -->
  <g opacity="0.6">
    <circle cx="158" cy="112" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="158" cy="126" rx="5" ry="7.5" fill="#A8886E" stroke="#8E6E50" stroke-width="0.7"/>
    <path d="M 162 120 Q 167 116 168 112" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 桌角 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E7660" opacity="0.9"/>

  <!-- 香淡的小桂花糕（左，没人尝） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 糕身（淡白） -->
    <rect x="66" y="122" width="28" height="22" rx="6" fill="url(#cake)" stroke="#B4AC9A" stroke-width="0.8"/>
    <!-- 桂点（淡） -->
    <g fill="#C89840" opacity="0.7">
      <circle cx="74" cy="124" r="1.3"/>
      <circle cx="84" cy="123" r="1.2"/>
    </g>
    <!-- 眼（含惑） -->
    <circle cx="74" cy="132" r="1.7" fill="#2E2A24"/>
    <circle cx="86" cy="132" r="1.7" fill="#2E2A24"/>
    <!-- 嘴（低垂） -->
    <path d="M 76 136 Q 80 134.6 84 136" fill="none" stroke="#9E8E74" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.35">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
