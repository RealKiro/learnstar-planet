<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="粽子·二阶·受凉之困·被忘灶台角落放凉空碗无人解">
  <defs>
    <!-- 背景：灶台角落 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#A88A68"/>
      <stop offset="100%" stop-color="#8E7660"/>
    </linearGradient>
    <!-- 弱灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 粽叶（凉） -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A8A62"/>
      <stop offset="100%" stop-color="#42704A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="50" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 142 L 200 142 L 200 200 L 0 200 Z" fill="#8E7660" opacity="0.9"/>
  <path d="M 0 142 L 200 142" stroke="#7A6250" stroke-width="2"/>

  <!-- 空碗（右） -->
  <g>
    <path d="M 150 136 Q 160 128 170 136 Q 168 146 160 146 Q 152 146 150 136 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.8"/>
    <ellipse cx="160" cy="136" rx="10" ry="3.5" fill="#C8BCA8"/>
  </g>
  <!-- 远笑的小孩（右后） -->
  <g opacity="0.8">
    <circle cx="174" cy="122" r="3.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="174" cy="133" rx="4.5" ry="6.5" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <path d="M 177 129 Q 181 127 182 124" stroke="#E8D0B4" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 被忘的小粽子（左下，放凉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.6;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 三角身（凉） -->
    <path d="M 84 92 L 108 144 Q 108 150 84 150 Q 60 150 60 144 Z" fill="url(#leaf)" stroke="#38603E" stroke-width="1"/>
    <!-- 叶纹 -->
    <path d="M 68 106 Q 72 122 68 142" stroke="#38603E" stroke-width="0.8" fill="none" opacity="0.7"/>
    <!-- 红绳（垂，凉） -->
    <path d="M 66 134 Q 84 137 102 134" stroke="#B84048" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 102 134 Q 106 140 104 146" stroke="#B84048" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- 糯米面（凉，不冒气） -->
    <ellipse cx="84" cy="118" rx="13" ry="10.5" fill="#E0DCC8" stroke="#C0BCA8" stroke-width="0.7"/>
    <!-- 眼（含惑，黯） -->
    <circle cx="78" cy="116" r="1.8" fill="#2E2A24"/>
    <circle cx="90" cy="116" r="1.8" fill="#2E2A24"/>
    <!-- 嘴（低垂） -->
    <path d="M 80 121 Q 84 119.4 88 121" fill="none" stroke="#9E8E74" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 叶尖（垂） -->
    <path d="M 84 92 L 81 80 L 87 80 Z" fill="url(#leaf)" stroke="#38603E" stroke-width="0.8"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.4">
    <circle cx="48" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
