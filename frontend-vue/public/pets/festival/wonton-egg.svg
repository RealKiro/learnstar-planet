<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="馄饨·一阶·皮馅初合·冬至厨房元宝样排案窗外飘雪">
  <defs>
    <!-- 背景：冬至厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8BCA0"/>
      <stop offset="52%" stop-color="#C0A078"/>
      <stop offset="100%" stop-color="#A88A68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 馄饨皮（薄白） -->
    <radialGradient id="skin" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 窗外飘雪 -->
  <g>
    <g stroke="#6E6256" stroke-width="1.2">
      <path d="M 146 44 L 146 88 L 178 88"/>
    </g>
    <g fill="#F8F4E8" opacity="0.8">
      <circle cx="152" cy="60" r="1.6">
        <animate attributeName="cy" values="58;74;58" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="166" cy="52" r="1.4">
        <animate attributeName="cy" values="50;66;50" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="76" r="1.3">
        <animate attributeName="cy" values="74;90;74" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 案板 -->
  <path d="M 40 140 L 170 140 L 178 154 L 32 154 Z" fill="#B08A5E" stroke="#9E7A4E" stroke-width="1.2"/>
  <!-- 灶台 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#A88A68" opacity="0.9"/>

  <!-- 案上其他馄饨（背景小） -->
  <g fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.5">
    <path d="M 66 126 Q 72 118 78 126 Q 78 136 72 136 Q 66 136 66 126 Z"/>
    <path d="M 128 128 Q 134 120 140 128 Q 140 138 134 138 Q 128 138 128 128 Z"/>
  </g>

  <!-- 小馄饨（中，元宝样） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 元宝身 -->
    <path d="M 92 118 Q 100 108 108 118 Q 114 128 108 136 Q 100 140 92 136 Q 86 128 92 118 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.9"/>
    <!-- 褶（顶部） -->
    <path d="M 96 114 Q 97 110 99 109" stroke="#C8B898" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M 100 112 Q 101 108 103 108" stroke="#C8B898" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M 104 114 Q 105 110 107 109" stroke="#C8B898" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <!-- 透馅粉 -->
    <ellipse cx="100" cy="128" rx="6" ry="5" fill="#E8A888" opacity="0.5"/>
    <!-- 眼 -->
    <circle cx="95" cy="124" r="1.9" fill="#2E2A24"/>
    <circle cx="95.5" cy="123.5" r="0.6" fill="#FFF"/>
    <circle cx="105" cy="124" r="1.9" fill="#2E2A24"/>
    <circle cx="105.5" cy="123.5" r="0.6" fill="#FFF"/>
    <!-- 嘴 -->
    <path d="M 97 129 Q 100 130.8 103 129" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="50" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
