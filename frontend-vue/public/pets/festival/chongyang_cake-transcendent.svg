<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="重阳糕·六阶·重阳糕传说·暮光菊碰小重阳糕孩子递层给奶奶传最高的给长辈">
  <defs>
    <!-- 背景：重阳案上暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕层 -->
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECC878"/>
      <stop offset="100%" stop-color="#D0A858"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 案桌 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 递层给奶奶的孩子（下右） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="136" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="152" cy="148" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <path d="M 156 141 Q 160 138 162 135" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 奶奶（下左，接） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="136" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <path d="M 51 132 Q 56 127 61 132" fill="#D8D8D4" stroke="#B8B8B4" stroke-width="0.5"/>
    <ellipse cx="56" cy="149" rx="5.5" ry="7.5" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 53 139 Q 56 140.8 59 139" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 小重阳糕（右，叠第一层） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <rect x="130" y="132" width="26" height="10" rx="3" fill="#D0A858" stroke="#B08A3E" stroke-width="0.7"/>
    <rect x="132" y="123" width="22" height="9" rx="3" fill="#DCB468" stroke="#B08A3E" stroke-width="0.7"/>
    <circle cx="137" cy="128" r="1.2" fill="#B0803E"/>
    <circle cx="135" cy="127" r="1.2" fill="#2E241E"/>
    <circle cx="144" cy="127" r="1.2" fill="#2E241E"/>
    <path d="M 137 129.5 Q 140 130.8 142 129.5" fill="none" stroke="#9E6E3E" stroke-width="0.6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 140 120;3 140 120;-3 140 120" dur="2.2s" repeatCount="indefinite"/>
      <ellipse cx="139" cy="121" rx="1.8" ry="3.8" fill="#F0C040" transform="rotate(-30 139 121)"/>
      <ellipse cx="142" cy="121" rx="1.8" ry="3.8" fill="#F8D060" transform="rotate(30 142 121)"/>
      <circle cx="140" cy="121" r="1.3" fill="#F8E080"/>
    </g>
  </g>

  <!-- 老重阳糕（左，菊碰小糕，传敬） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="84" cy="118" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 底层 -->
    <rect x="66" y="128" width="36" height="12" rx="4" fill="#C8A050" stroke="#A8883E" stroke-width="0.8"/>
    <!-- 中层 -->
    <rect x="68" y="117" width="32" height="11" rx="4" fill="#D4AE5E" stroke="#A8883E" stroke-width="0.8"/>
    <!-- 顶层 -->
    <rect x="70" y="106" width="28" height="11" rx="4" fill="url(#cake)" stroke="#A8883E" stroke-width="0.8"/>
    <!-- 眼（温和，目含慈） -->
    <circle cx="78" cy="110" r="1.9" fill="#3E2E24"/>
    <circle cx="78.6" cy="109.4" r="0.6" fill="#FFF"/>
    <circle cx="90" cy="110" r="1.9" fill="#3E2E24"/>
    <circle cx="90.6" cy="109.4" r="0.6" fill="#FFF"/>
    <path d="M 81 114 Q 84 115.6 87 114" fill="none" stroke="#9E6E3E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 顶菊（如古金，碰小糕） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 84 100;2 84 100;-2 84 100" dur="2.6s" repeatCount="indefinite"/>
      <ellipse cx="82" cy="102" rx="2.2" ry="4.5" fill="#E8B038" transform="rotate(-30 82 102)"/>
      <ellipse cx="86" cy="102" rx="2.2" ry="4.5" fill="#F0C040" transform="rotate(30 86 102)"/>
      <circle cx="84" cy="102" r="1.6" fill="#F0D868"/>
    </g>
    <!-- 传心微光 -->
    <circle cx="116" cy="118" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
