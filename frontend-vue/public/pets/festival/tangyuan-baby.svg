<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汤圆·二阶·煮糊之痛·火大煮破甜馅流尽瘪瘪空空">
  <defs>
    <!-- 背景：元宵锅台 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#A88A68"/>
      <stop offset="100%" stop-color="#8E7660"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 汤圆（瘪） -->
    <radialGradient id="ball" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E8E4D8"/>
      <stop offset="100%" stop-color="#C8C4B4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 锅（左后，空锅，甜馅流汤） -->
  <g>
    <path d="M 40 120 Q 50 110 60 120 Q 58 130 50 130 Q 42 130 40 120 Z" fill="#6E6256" stroke="#544A40" stroke-width="0.8"/>
    <ellipse cx="50" cy="120" rx="10" ry="4" fill="#C8C0B0"/>
    <!-- 流尽的甜馅汤 -->
    <ellipse cx="50" cy="122" rx="8" ry="3" fill="#D8A878" opacity="0.8"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E7660" opacity="0.9"/>

  <!-- 被煮破的小汤圆（中，瘪瘪空空） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 瘪身（不规则） -->
    <path d="M 100 118 Q 110 124 108 132 Q 104 138 96 138 Q 88 138 90 130 Q 90 122 100 118 Z" fill="url(#ball)" stroke="#B8B4A4" stroke-width="0.9"/>
    <!-- 破口（流馅处） -->
    <path d="M 104 134 Q 108 138 106 142" stroke="#D8A878" stroke-width="1.5" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 眼（含沮） -->
    <circle cx="94" cy="126" r="1.8" fill="#2E2A24"/>
    <circle cx="105" cy="126" r="1.8" fill="#2E2A24"/>
    <!-- 嘴（低垂） -->
    <path d="M 96 130.5 Q 100 128.6 104 130.5" fill="none" stroke="#9E8E74" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.4">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
