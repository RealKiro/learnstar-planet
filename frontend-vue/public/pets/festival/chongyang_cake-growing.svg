<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="重阳糕·三阶·炼敬苦修·练叠层层层贴合顶层最高也最牢菊正">
  <defs>
    <!-- 背景：重阳厨房晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D0AC78"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕层 -->
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECC878"/>
      <stop offset="100%" stop-color="#D4AC5E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 少年重阳糕（中，层层贴合） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 底层 -->
    <rect x="78" y="128" width="44" height="14" rx="4" fill="#D0A858" stroke="#B08A3E" stroke-width="0.8"/>
    <!-- 中层 -->
    <rect x="80" y="115" width="40" height="13" rx="4" fill="#DCB468" stroke="#B08A3E" stroke-width="0.8"/>
    <!-- 顶层（脸层，最稳） -->
    <rect x="82" y="102" width="36" height="13" rx="4" fill="url(#cake)" stroke="#B08A3E" stroke-width="0.8"/>
    <!-- 枣栗分明 -->
    <circle cx="86" cy="135" r="1.8" fill="#8E4A3E"/>
    <circle cx="116" cy="135" r="1.8" fill="#8E4A3E"/>
    <circle cx="90" cy="121" r="1.5" fill="#B0803E"/>
    <circle cx="112" cy="121" r="1.5" fill="#B0803E"/>
    <!-- 眼（专注） -->
    <circle cx="94" cy="106" r="2" fill="#3E2E24"/>
    <circle cx="94.6" cy="105.4" r="0.65" fill="#FFF"/>
    <circle cx="106" cy="106" r="2" fill="#3E2E24"/>
    <circle cx="106.6" cy="105.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 97 110.5 Q 100 112.4 103 110.5" fill="none" stroke="#9E6E3E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 顶菊（正） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 100 94;2 100 94;-2 100 94" dur="2.4s" repeatCount="indefinite"/>
      <ellipse cx="98" cy="96" rx="2.5" ry="5" fill="#F0C040" transform="rotate(-30 98 96)"/>
      <ellipse cx="102" cy="96" rx="2.5" ry="5" fill="#F8D060" transform="rotate(30 102 96)"/>
      <ellipse cx="100" cy="95" rx="2.5" ry="5" fill="#E8B038" transform="rotate(0 100 95)"/>
      <circle cx="100" cy="95" r="1.8" fill="#F8E080"/>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
