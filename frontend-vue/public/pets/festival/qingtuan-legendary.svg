<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青团·五阶·清明之青·各家案上翠绿而立祭扫人尝沉默思念人出神">
  <defs>
    <!-- 背景：清明雨青 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E8EA2"/>
      <stop offset="52%" stop-color="#8EA8A4"/>
      <stop offset="100%" stop-color="#9EA892"/>
    </linearGradient>
    <!-- 清明神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#E8F0E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F0E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 清明光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#C8D8C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#C8D8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青团（翠亮） -->
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#9ED4A4"/>
      <stop offset="100%" stop-color="#5A9A62"/>
    </radialGradient>
    <!-- 艾香光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8E0BE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B8E0BE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 细雨 -->
  <g stroke="#B8D0D0" stroke-width="1" stroke-linecap="round" opacity="0.35">
    <path d="M 30 20 L 26 40">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 24" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 168 16 L 164 36">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 24" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 10 L 66 30">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 24" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 案桌 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E9E86" opacity="0.9"/>

  <!-- 祭扫人（右，尝沉默） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="116" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="152" cy="131" rx="5.5" ry="8.5" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 146 124 Q 140 118 138 114" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 149 114.5 Q 151 113.9 153 114.5" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>
  <!-- 思念人（左，出神） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="118" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="56" cy="133" rx="5.5" ry="8.5" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 60 126 Q 66 122 68 118" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="122" r="2" fill="#4E5E7E"/>
  </g>

  <!-- 清明之青（中，翠绿立案） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="112" r="24" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="104" cy="112" r="16" fill="url(#ball)" stroke="#3E7A46" stroke-width="1"/>
    <!-- 眼（含威含温） -->
    <circle cx="98" cy="110" r="2.2" fill="#1E2E22"/>
    <circle cx="98.6" cy="109.4" r="0.7" fill="#FFF"/>
    <circle cx="110" cy="110" r="2.2" fill="#1E2E22"/>
    <circle cx="110.6" cy="109.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（静默） -->
    <path d="M 100 114.5 Q 104 116 108 114.5" fill="none" stroke="#4E6E3E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 艾香悠悠 -->
    <path d="M 98 94 Q 94 84 98 76" stroke="#F4F0E4" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 112 96 Q 116 86 112 78" stroke="#F4F0E4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F0E8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
