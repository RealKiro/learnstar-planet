<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青团·一阶·艾草初青·清明厨房竹叶托艾香看墙角旧照">
  <defs>
    <!-- 背景：清明厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9EB8A8"/>
      <stop offset="52%" stop-color="#B8C8AC"/>
      <stop offset="100%" stop-color="#9EA890"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青团（翠绿） -->
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#86BE92"/>
      <stop offset="100%" stop-color="#5A945E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 墙角旧照（右） -->
  <g>
    <rect x="150" y="66" width="30" height="36" rx="2" fill="#8E8270" stroke="#6E6256" stroke-width="1.2"/>
    <rect x="155" y="71" width="20" height="26" fill="#C8B898"/>
    <circle cx="165" cy="80" r="5" fill="#A8906E"/>
    <ellipse cx="165" cy="92" rx="6" ry="7" fill="#B0986E"/>
    <path d="M 150 102 L 180 102" stroke="#6E6256" stroke-width="1"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#8E9E86" opacity="0.9"/>

  <!-- 竹叶托 -->
  <path d="M 66 138 Q 100 122 140 138 Q 120 150 100 150 Q 78 150 66 138 Z" fill="#6E9E5E" stroke="#4E7A48" stroke-width="1"/>
  <path d="M 70 136 Q 100 126 134 136" stroke="#4E7A48" stroke-width="0.8" fill="none" opacity="0.7"/>

  <!-- 小青团（竹叶托，艾香） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 圆身（翠绿） -->
    <circle cx="102" cy="120" r="14" fill="url(#ball)" stroke="#3E7A46" stroke-width="1"/>
    <!-- 艾香 -->
    <path d="M 96 102 Q 92 96 96 90" stroke="#F4F0E4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 104 Q 112 98 108 92" stroke="#F4F0E4" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 眼（看旧照，柔） -->
    <circle cx="96" cy="118" r="2" fill="#1E2E22"/>
    <circle cx="96.5" cy="117.5" r="0.65" fill="#FFF"/>
    <circle cx="108" cy="118" r="2" fill="#1E2E22"/>
    <circle cx="108.5" cy="117.5" r="0.65" fill="#FFF"/>
    <!-- 嘴（轻） -->
    <path d="M 98 122.5 Q 102 124 106 122.5" fill="none" stroke="#4E6E3E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="50" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
