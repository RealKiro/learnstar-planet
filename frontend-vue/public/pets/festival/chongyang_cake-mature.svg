<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="重阳糕·四阶·敬老初成·孩子捧糕掰最高层递奶奶奶咬一口笑纹起">
  <defs>
    <!-- 背景：重阳院中 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0BC90"/>
      <stop offset="52%" stop-color="#C8A07A"/>
      <stop offset="100%" stop-color="#A88A68"/>
    </linearGradient>
    <!-- 院暖 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕层 -->
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECC878"/>
      <stop offset="100%" stop-color="#D4AC5E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 院景 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 掰顶层递奶奶的孩子（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="60" cy="118" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="60" cy="132" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <!-- 递顶层的手 -->
    <path d="M 66 124 Q 74 120 80 118" stroke="#E8D0B4" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    <!-- 手里掰下的顶层 -->
    <rect x="78" y="112" width="14" height="7" rx="2" fill="#E8C878" stroke="#B08A3E" stroke-width="0.6"/>
  </g>

  <!-- 笑着接的奶奶（右，笑纹） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="138" cy="112" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <!-- 银发 -->
    <path d="M 132 108 Q 138 102 145 108" fill="#D8D8D4" stroke="#B8B8B4" stroke-width="0.6"/>
    <ellipse cx="138" cy="130" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 接顶层的手 -->
    <path d="M 132 120 L 118 118" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（笑纹） -->
    <path d="M 133 111 Q 135 109.6 137 111" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 141 111 Q 143 109.6 145 111" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 眼角笑纹 -->
    <path d="M 132 112 Q 130 114 129 116" stroke="#B09880" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <path d="M 146 112 Q 148 114 149 116" stroke="#B09880" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <!-- 嘴（笑） -->
    <path d="M 135 116 Q 138 118.4 141 116" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 盘中的重阳糕（中，顶层被掰） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 盘 -->
    <ellipse cx="100" cy="136" rx="20" ry="5" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.9"/>
    <!-- 底层 -->
    <rect x="86" y="126" width="28" height="10" rx="3" fill="#D0A858" stroke="#B08A3E" stroke-width="0.7"/>
    <!-- 中层 -->
    <rect x="88" y="118" width="24" height="9" rx="3" fill="#DCB468" stroke="#B08A3E" stroke-width="0.7"/>
    <!-- 顶层缺（剩一层矮边） -->
    <rect x="90" y="110" width="20" height="9" rx="3" fill="url(#cake)" stroke="#B08A3E" stroke-width="0.7"/>
    <!-- 眼（含温） -->
    <circle cx="96" cy="114" r="1.6" fill="#3E2E24"/>
    <circle cx="96.4" cy="113.6" r="0.5" fill="#FFF"/>
    <circle cx="104" cy="114" r="1.6" fill="#3E2E24"/>
    <circle cx="104.4" cy="113.6" r="0.5" fill="#FFF"/>
    <path d="M 98 117 Q 100 118.2 102 117" fill="none" stroke="#9E6E3E" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
