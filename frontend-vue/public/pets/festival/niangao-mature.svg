<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="年糕·四阶·年高初成·守岁围桌老人夹块软糯年糕笑说吃了年糕年年高">
  <defs>
    <!-- 背景：守岁年夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A3850"/>
      <stop offset="52%" stop-color="#A8605E"/>
      <stop offset="100%" stop-color="#C89872"/>
    </linearGradient>
    <!-- 年夜暖 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 年糕（糯软） -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4D8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 春联红 -->
  <g fill="#E04848" opacity="0.9">
    <rect x="152" y="48" width="34" height="8" rx="2"/>
    <rect x="156" y="62" width="26" height="6" rx="2"/>
  </g>

  <!-- 餐桌 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 围桌的家人（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="124" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="58" cy="137" rx="5" ry="7.5" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <path d="M 62 131 Q 67 127 68 123" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 夹年糕的老人（右，笑说年年高） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="112" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <path d="M 142 108 Q 148 102 155 108" fill="#D8D8D4" stroke="#B8B8B4" stroke-width="0.6"/>
    <ellipse cx="148" cy="130" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 夹糕的手 -->
    <path d="M 142 120 L 130 124" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 132 122 L 126 125" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 夹起的年糕块 -->
    <rect x="124" y="120" width="8" height="7" rx="2" fill="#F8F4E8" stroke="#D0C8B8" stroke-width="0.6"/>
    <!-- 眼（笑） -->
    <path d="M 143 111 Q 145 109.6 147 111 M 151 111 Q 153 109.6 154 111" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（笑） -->
    <path d="M 145 115 Q 148 117.4 151 115" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 盘中的年糕（中，糯软冒气） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 盘 -->
    <ellipse cx="100" cy="138" rx="22" ry="5" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.9"/>
    <!-- 年糕 -->
    <rect x="86" y="124" width="28" height="16" rx="6" fill="url(#cake)" stroke="#D0C8B8" stroke-width="0.8"/>
    <!-- 眼（含温） -->
    <circle cx="95" cy="131" r="1.8" fill="#2E2A24"/>
    <circle cx="95.4" cy="130.6" r="0.6" fill="#FFF"/>
    <circle cx="105" cy="131" r="1.8" fill="#2E2A24"/>
    <circle cx="105.4" cy="130.6" r="0.6" fill="#FFF"/>
    <path d="M 97 134.5 Q 100 136 103 134.5" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 热气 -->
    <path d="M 94 120 Q 90 112 94 104" stroke="#F8F0E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
