<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="春饼·二阶·破皮之痛·学卷菜贪多撑破面皮菜馅撒桌">
  <defs>
    <!-- 背景：立春厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B89A"/>
      <stop offset="52%" stop-color="#9EA890"/>
      <stop offset="100%" stop-color="#8E987E"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 春饼（破） -->
    <radialGradient id="pancake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F4F0E0"/>
      <stop offset="100%" stop-color="#D8D0BC"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;0.3;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E987E" opacity="0.9"/>

  <!-- 撒桌的菜馅 -->
  <g>
    <circle cx="140" cy="138" r="2.5" fill="#E8B048"/>
    <circle cx="150" cy="142" r="2" fill="#7AA868"/>
    <circle cx="136" cy="144" r="1.8" fill="#C87848"/>
    <circle cx="156" cy="136" r="2.2" fill="#7AA868"/>
    <circle cx="146" cy="132" r="1.6" fill="#E8B048"/>
  </g>

  <!-- 破皮的小春饼（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 薄饼身（破口） -->
    <ellipse cx="100" cy="128" rx="21" ry="9.5" fill="url(#pancake)" stroke="#C8C0AC" stroke-width="0.9"/>
    <!-- 破口 -->
    <path d="M 88 122 L 96 118 L 94 126 L 90 132" stroke="#C8C0AC" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M 96 118 L 100 124" stroke="#C8C0AC" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- 撒出的馅 -->
    <circle cx="92" cy="132" r="2" fill="#E8B048"/>
    <circle cx="100" cy="134" r="1.7" fill="#7AA868"/>
    <!-- 眼（含沮） -->
    <circle cx="93" cy="126" r="1.8" fill="#2E2A24"/>
    <circle cx="107" cy="126" r="1.8" fill="#2E2A24"/>
    <!-- 嘴（低垂） -->
    <path d="M 96 130.5 Q 100 129 104 130.5" fill="none" stroke="#9E8E74" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.35">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
