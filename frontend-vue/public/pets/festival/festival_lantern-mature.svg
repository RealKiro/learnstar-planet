<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="花灯·四阶·照人初成·元宵孩提灯走巷烛光洒开照老人牵孩子">
  <defs>
    <!-- 背景：元宵夜巷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A5A"/>
      <stop offset="52%" stop-color="#4A4A5E"/>
      <stop offset="100%" stop-color="#7A6E5E"/>
    </linearGradient>
    <!-- 灯暖 -->
    <radialGradient id="glow" cx="36%" cy="30%" r="36%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灯身 -->
    <radialGradient id="lamp" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FCE8C8"/>
      <stop offset="100%" stop-color="#F0C080"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="72" cy="60" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 巷墙 -->
  <g fill="#0E121C" opacity="0.7">
    <path d="M 0 88 L 16 84 L 16 200 L 0 200 Z"/>
    <path d="M 184 92 L 200 88 L 200 200 L 184 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5E5048" opacity="0.9"/>

  <!-- 被照亮的老人牵孩子（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 老人 -->
    <circle cx="146" cy="116" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <path d="M 140 112 Q 146 106 153 112" fill="#D8D8D4" stroke="#B8B8B4" stroke-width="0.6"/>
    <ellipse cx="146" cy="134" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 牵孩子的手 -->
    <path d="M 140 126 L 124 130" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 眼（笑） -->
    <path d="M 141 115 Q 143 113.6 145 115 M 149 115 Q 151 113.6 152 115" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 143 119 Q 146 121 149 119" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 孩子 -->
    <circle cx="116" cy="128" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="116" cy="141" rx="5" ry="7.5" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 120 136 Q 126 132 128 128" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 提灯的小孩（左，照亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="52" cy="124" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="52" cy="138" rx="5.5" ry="8" fill="#C87868" stroke="#A86050" stroke-width="0.8"/>
    <!-- 举灯的手 -->
    <path d="M 58 128 Q 66 122 72 112" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 提着的花灯（左上，光照开） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="72" cy="92" r="22" fill="#FFF0D0" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.12;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 提绳 -->
    <path d="M 72 66 L 72 58" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 顶盖 -->
    <path d="M 58 66 Q 72 60 86 66 L 86 70 Q 72 64 58 70 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.8"/>
    <!-- 灯身 -->
    <ellipse cx="72" cy="84" rx="14" ry="16" fill="url(#lamp)" stroke="#C89858" stroke-width="0.9"/>
    <path d="M 58 78 Q 72 73 86 78" stroke="#C89858" stroke-width="0.6" fill="none" opacity="0.7"/>
    <path d="M 58 84 L 86 84" stroke="#C89858" stroke-width="0.6" fill="none" opacity="0.7"/>
    <circle cx="72" cy="82" r="6" fill="#FFF0D0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.38;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 脸 -->
    <circle cx="68" cy="82" r="1.6" fill="#3E2E24"/>
    <circle cx="76" cy="82" r="1.6" fill="#3E2E24"/>
    <path d="M 70 86 Q 72 87.4 74 86" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 底盖 -->
    <path d="M 60 98 Q 72 103 84 98 L 84 101 Q 72 106 60 101 Z" fill="#C8A868" stroke="#A89048" stroke-width="0.8"/>
    <!-- 灯穗 -->
    <path d="M 72 104 L 72 112" stroke="#D84048" stroke-width="1.3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 72 104;4 72 104;-4 72 104" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 光照开（洒向老人孩子） -->
    <path d="M 86 88 Q 100 100 112 118" stroke="#FFF0D0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.2;0.45" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
