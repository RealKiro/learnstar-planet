<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="桂花糕·三阶·藏香苦修·软糯藏香越放越香桂点入心">
  <defs>
    <!-- 背景：秋日厨房晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D0AC78"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕身 -->
    <radialGradient id="cake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4D0"/>
    </radialGradient>
    <!-- 香光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8E8C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8E8C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 少年桂花糕（中，藏香） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="104" r="18" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 糕身 -->
    <rect x="82" y="92" width="36" height="28" rx="8" fill="url(#cake)" stroke="#D0C8B4" stroke-width="0.9"/>
    <!-- 桂点入心（金黄） -->
    <g fill="#F0C040">
      <circle cx="90" cy="94" r="1.7"/>
      <circle cx="102" cy="92" r="1.6"/>
      <circle cx="112" cy="95" r="1.5"/>
    </g>
    <!-- 眼（专注） -->
    <circle cx="94" cy="104" r="2" fill="#2E2A24"/>
    <circle cx="94.6" cy="103.4" r="0.65" fill="#FFF"/>
    <circle cx="106" cy="104" r="2" fill="#2E2A24"/>
    <circle cx="106.6" cy="103.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 96 109 Q 100 111 104 109" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 藏香（含蓄，缭绕） -->
    <path d="M 96 88 Q 93 80 97 72" stroke="#F8E8C0" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#F8E8C0">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
