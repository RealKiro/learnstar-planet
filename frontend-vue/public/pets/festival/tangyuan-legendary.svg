<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汤圆·五阶·元宵之味·元宵夜碗里浮沉圆滚如玉家人围桌分食">
  <defs>
    <!-- 背景：元宵夜家 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A6E"/>
      <stop offset="52%" stop-color="#5A5A7E"/>
      <stop offset="100%" stop-color="#8E8268"/>
    </linearGradient>
    <!-- 元宵神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 元宵光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 汤圆（如玉） -->
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4D8"/>
    </radialGradient>
    <!-- 甜光 -->
    <radialGradient id="sweet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星（元宵烟火） -->
  <g fill="#F8E4A0">
    <circle cx="36" cy="32" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="28" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="186" cy="52" r="1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 饭桌 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E7260" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#7A6250" stroke-width="2"/>

  <!-- 围桌分食的家人 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="60" cy="130" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="60" cy="144" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <circle cx="148" cy="130" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="148" cy="144" rx="5.5" ry="8" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8"/>
  </g>

  <!-- 碗里的元宵之粽（中，圆滚如玉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="110" r="26" fill="url(#sweet)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 碗 -->
    <path d="M 84 132 Q 104 120 124 132 Q 120 148 104 148 Q 88 148 84 132 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="1"/>
    <ellipse cx="104" cy="132" rx="20" ry="6.5" fill="#E8E0D0"/>
    <!-- 汤圆（圆滚如玉） -->
    <circle cx="104" cy="126" r="14" fill="url(#ball)" stroke="#D0C8B8" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（含威含温） -->
    <circle cx="98" cy="124" r="2.2" fill="#2E2A24"/>
    <circle cx="98.6" cy="123.4" r="0.7" fill="#FFF"/>
    <circle cx="110" cy="124" r="2.2" fill="#2E2A24"/>
    <circle cx="110.6" cy="123.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（喜） -->
    <path d="M 99 129 Q 104 131.6 109 129" fill="none" stroke="#B08A6A" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 热气 -->
    <path d="M 100 106 Q 96 96 102 88" stroke="#FFF4E0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 108 Q 114 98 108 90" stroke="#FFF4E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
