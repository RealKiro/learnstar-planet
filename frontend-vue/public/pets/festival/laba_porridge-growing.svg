<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="腊八粥·三阶·炼火苦修·小火慢熬不焦不糊五谷糯化香散开">
  <defs>
    <!-- 背景：腊八灶台晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D0AC78"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 粥稠香暖 -->
    <radialGradient id="porridge" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F4D898"/>
      <stop offset="100%" stop-color="#DCB470"/>
    </radialGradient>
    <!-- 香光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8E8C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8E8C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 少年腊八粥（中，小火慢熬） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="104" r="20" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 锅身 -->
    <path d="M 72 106 Q 100 94 128 106 Q 126 128 100 128 Q 74 128 72 106 Z" fill="#6E6256" stroke="#544A40" stroke-width="1"/>
    <ellipse cx="100" cy="106" rx="28" ry="6" fill="#8E8270" stroke="#6E6256" stroke-width="0.9"/>
    <!-- 粥面（香暖，糯化） -->
    <ellipse cx="100" cy="106" rx="25" ry="5" fill="url(#porridge)"/>
    <!-- 五谷糯化（均匀，冒泡） -->
    <g>
      <circle cx="88" cy="104" r="1.7" fill="#C85848">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="105" r="1.5" fill="#F0E8D0">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.7;0 0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="112" cy="104" r="1.6" fill="#B08048">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.9;0 0" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 粥面脸（专注） -->
    <circle cx="94" cy="104" r="1.8" fill="#3E2E24"/>
    <circle cx="94.6" cy="103.4" r="0.6" fill="#FFF"/>
    <circle cx="106" cy="104" r="1.8" fill="#3E2E24"/>
    <circle cx="106.6" cy="103.4" r="0.6" fill="#FFF"/>
    <path d="M 97 107 Q 100 108.6 103 107" fill="none" stroke="#8E6E3E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 暖香热气 -->
    <path d="M 92 94 Q 88 84 92 76" stroke="#F8F0E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 96 Q 112 86 108 78" stroke="#F8F0E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
