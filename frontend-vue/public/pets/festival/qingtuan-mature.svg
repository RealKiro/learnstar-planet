<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青团·四阶·记念初成·祭扫归来的老人咬一口沉默良久说她也爱吃这个">
  <defs>
    <!-- 背景：清明院中 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EA8A0"/>
      <stop offset="52%" stop-color="#A8BCA8"/>
      <stop offset="100%" stop-color="#9EA88E"/>
    </linearGradient>
    <!-- 院暖 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青团（温） -->
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#8EC696"/>
      <stop offset="100%" stop-color="#5A965E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 院景（清明细雨青） -->
  <g fill="#6E8E7E" opacity="0.4">
    <path d="M 0 96 Q 50 88 110 94 Q 160 98 200 90 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#8E9E86" opacity="0.9"/>

  <!-- 静坐的家人（左） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="120" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="56" cy="133" rx="5" ry="7.5" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
  </g>

  <!-- 祭扫归来的老人（右，咬一口，沉默） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="110" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="152" cy="128" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 银发 -->
    <path d="M 147 106 Q 152 102 158 106" stroke="#C8C0B8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- 手（托青团） -->
    <path d="M 146 118 L 134 122" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 手里咬过的青团 -->
    <circle cx="130" cy="122" r="4.5" fill="url(#ball)" stroke="#3E7A46" stroke-width="0.7"/>
    <path d="M 128 120 L 132 119 L 131 122" fill="none" stroke="#3E7A46" stroke-width="0.6"/>
    <!-- 眼（沉默，含湿） -->
    <circle cx="149" cy="108.5" r="1.5" fill="#24180E"/>
    <circle cx="149.4" cy="108.1" r="0.5" fill="#FFF"/>
    <circle cx="156" cy="108.5" r="1.5" fill="#24180E"/>
    <circle cx="156.5" cy="107.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（轻轻说） -->
    <path d="M 150 113 Q 153 114.6 155 113" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 桌上的青团（中，艾香散） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="132" r="12" fill="url(#ball)" stroke="#3E7A46" stroke-width="0.9"/>
    <circle cx="94" cy="130" r="1.8" fill="#1E2E22"/>
    <circle cx="94.4" cy="129.6" r="0.6" fill="#FFF"/>
    <circle cx="106" cy="130" r="1.8" fill="#1E2E22"/>
    <circle cx="106.4" cy="129.6" r="0.6" fill="#FFF"/>
    <path d="M 96 134.5 Q 100 136.2 104 134.5" fill="none" stroke="#4E6E3E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 艾香 -->
    <path d="M 96 118 Q 92 112 96 106" stroke="#F4F0E4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="46" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
