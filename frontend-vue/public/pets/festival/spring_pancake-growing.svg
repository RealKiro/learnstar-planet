<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="春饼·三阶·练卷苦修·薄皮卷稳不破菜色分明口感均衡">
  <defs>
    <!-- 背景：立春厨房晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0D4A8"/>
      <stop offset="52%" stop-color="#C8CC9E"/>
      <stop offset="100%" stop-color="#9EA890"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 春饼（薄透） -->
    <radialGradient id="pancake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4D0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 柳枝（背景新绿） -->
  <g stroke="#6E9E5E" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M 40 30 Q 34 46 38 60"/>
    <path d="M 158 26 Q 164 42 160 56"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9EA890" opacity="0.9"/>

  <!-- 少年春饼（中，卷稳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 卷起的春饼（圆柱，透亮） -->
    <ellipse cx="100" cy="118" rx="16" ry="20" fill="url(#pancake)" stroke="#D8D0BC" stroke-width="0.9" transform="rotate(-8 100 118)"/>
    <!-- 卷的菜色（两端露出） -->
    <ellipse cx="84" cy="118" rx="3.5" ry="8" fill="#E8B048" opacity="0.8" transform="rotate(-8 84 118)"/>
    <ellipse cx="116" cy="118" rx="3.5" ry="8" fill="#7AA868" opacity="0.8" transform="rotate(-8 116 118)"/>
    <!-- 眼（专注） -->
    <circle cx="95" cy="112" r="2" fill="#2E2A24"/>
    <circle cx="95.6" cy="111.4" r="0.65" fill="#FFF"/>
    <circle cx="107" cy="112" r="2" fill="#2E2A24"/>
    <circle cx="107.6" cy="111.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 97 118 Q 101 119.8 105 118" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
