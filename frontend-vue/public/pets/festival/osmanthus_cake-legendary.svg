<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="桂花糕·五阶·秋日之信·雪白如月桂如金点老人掰配茶离乡捧出神">
  <defs>
    <!-- 背景：秋日人家暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D4AC78"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 秋日神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 秋日光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E8D0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E8D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕身 -->
    <radialGradient id="cake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE2D0"/>
    </radialGradient>
    <!-- 香光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8E8C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8E8C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 窗外秋叶 -->
  <g fill="#E8A838">
    <ellipse cx="164" cy="56" rx="2.5" ry="3" transform="rotate(20 164 56)"/>
    <ellipse cx="170" cy="66" rx="2.5" ry="3" transform="rotate(-30 170 66)"/>
  </g>

  <!-- 桌 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 掰糕配茶的老人（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="118" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <path d="M 52 114 Q 58 108 65 114" fill="#D8D8D4" stroke="#B8B8B4" stroke-width="0.6"/>
    <ellipse cx="58" cy="136" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 64 128 Q 70 124 72 120" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 68 124 L 62 128" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- 捧糕出神的离乡人（右） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="150" cy="118" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="150" cy="136" rx="6.5" ry="10" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8"/>
    <path d="M 144 128 L 132 126" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <rect x="126" y="122" width="12" height="10" rx="3" fill="url(#cake)" stroke="#D0C8B4" stroke-width="0.7"/>
    <circle cx="132" cy="124" r="1.4" fill="#F0C040"/>
    <circle cx="152" cy="116" r="2" fill="#4E5E7E"/>
  </g>

  <!-- 秋日之信（中，雪白桂点） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="108" r="26" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 糕身 -->
    <rect x="84" y="94" width="40" height="32" rx="8" fill="url(#cake)" stroke="#D0C8B4" stroke-width="1"/>
    <!-- 桂点如金 -->
    <g fill="#F0C040">
      <circle cx="94" cy="97" r="1.9"/>
      <circle cx="108" cy="95" r="1.8"/>
      <circle cx="118" cy="98" r="1.7"/>
      <circle cx="100" cy="94" r="1.5"/>
    </g>
    <!-- 眼（含威含温） -->
    <circle cx="96" cy="108" r="2.1" fill="#2E2A24"/>
    <circle cx="96.6" cy="107.4" r="0.7" fill="#FFF"/>
    <circle cx="112" cy="108" r="2.1" fill="#2E2A24"/>
    <circle cx="112.6" cy="107.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（秋信） -->
    <path d="M 99 114 Q 104 116 109 114" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 桂香悠远 -->
    <path d="M 96 88 Q 92 78 98 68" stroke="#F8E8C0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 114 90 Q 118 80 112 70" stroke="#F8E8C0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#F8E8C0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
