<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="馄饨·二阶·破皮之痛·下锅皮没包牢一煮就破馅露汤浑">
  <defs>
    <!-- 背景：冬至锅台 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#A88A68"/>
      <stop offset="100%" stop-color="#8E7660"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 破皮馄饨 -->
    <radialGradient id="skin" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F0E8DC"/>
      <stop offset="100%" stop-color="#D0C4B0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.45;0.3;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E7660" opacity="0.9"/>

  <!-- 浑汤的碗（中） -->
  <g>
    <path d="M 74 132 Q 96 120 118 132 Q 114 148 96 148 Q 78 148 74 132 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.9"/>
    <ellipse cx="96" cy="132" rx="22" ry="6" fill="#C8C0A8"/>
    <!-- 浑汤 -->
    <ellipse cx="96" cy="134" rx="18" ry="4.5" fill="#C8A878" opacity="0.8"/>
  </g>

  <!-- 煮破的小馄饨（中，瘪） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 破身（瘪，皮散） -->
    <path d="M 88 118 Q 96 112 104 118 Q 108 128 102 134 Q 96 137 90 132 Q 86 126 88 118 Z" fill="url(#skin)" stroke="#B8AC98" stroke-width="0.9"/>
    <!-- 破口 -->
    <path d="M 96 126 L 92 130 M 96 126 L 100 131" stroke="#C8B898" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- 露馅 -->
    <circle cx="94" cy="132" r="2.2" fill="#E8A888"/>
    <circle cx="100" cy="134" r="1.8" fill="#E8A888"/>
    <!-- 褶散 -->
    <path d="M 92 116 Q 93 112 96 111" stroke="#B8AC98" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <path d="M 100 114 Q 101 110 103 110" stroke="#B8AC98" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <!-- 眼（含沮） -->
    <circle cx="90" cy="124" r="1.7" fill="#2E2A24"/>
    <circle cx="102" cy="124" r="1.7" fill="#2E2A24"/>
    <!-- 嘴（低垂） -->
    <path d="M 92 128.5 Q 96 127 100 128.5" fill="none" stroke="#9E8E74" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 飘在汤里的碎馅 -->
  <g fill="#E8A888" opacity="0.7">
    <circle cx="110" cy="136" r="1.5">
      <animate attributeName="cy" values="136;134;136" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="84" cy="137" r="1.3">
      <animate attributeName="cy" values="137;135;137" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.35">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
