<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="桂花糕·六阶·桂花糕传说·暮光桂香绕小桂花糕游子捧糕传香为情书">
  <defs>
    <!-- 背景：秋日案上暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕身 -->
    <radialGradient id="cake" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E0D0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 案桌 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 捧糕的游子（下） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="150" cy="134" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="150" cy="148" rx="5.5" ry="8" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <rect x="140" y="140" width="12" height="9" rx="3" fill="url(#cake)" stroke="#D0C8B4" stroke-width="0.6"/>
    <circle cx="146" cy="141.5" r="1.3" fill="#F0C040"/>
  </g>

  <!-- 小桂花糕（右，雪白点桂） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <rect x="132" y="122" width="24" height="18" rx="5" fill="url(#cake)" stroke="#D0C8B4" stroke-width="0.8"/>
    <g fill="#F0C040">
      <circle cx="138" cy="124" r="1.4"/>
      <circle cx="150" cy="123" r="1.3"/>
    </g>
    <circle cx="140" cy="130" r="1.5" fill="#2E2A24"/>
    <circle cx="140.4" cy="129.6" r="0.5" fill="#FFF"/>
    <circle cx="149" cy="130" r="1.5" fill="#2E2A24"/>
    <circle cx="149.4" cy="129.6" r="0.5" fill="#FFF"/>
    <path d="M 142 134 Q 144 135.2 146 134" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 老桂花糕（左，桂香绕小糕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="116" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="58" y="102" width="36" height="30" rx="8" fill="url(#cake)" stroke="#C8C0AC" stroke-width="1"/>
    <!-- 桂如古金 -->
    <g fill="#E8B840">
      <circle cx="68" cy="105" r="1.8"/>
      <circle cx="80" cy="103" r="1.7"/>
      <circle cx="90" cy="106" r="1.6"/>
    </g>
    <!-- 眼（温和，目含慈） -->
    <circle cx="70" cy="116" r="2" fill="#2E2A24"/>
    <circle cx="70.6" cy="115.4" r="0.65" fill="#FFF"/>
    <circle cx="82" cy="116" r="2" fill="#2E2A24"/>
    <circle cx="82.6" cy="115.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（慈笑） -->
    <path d="M 73 121 Q 76 122.8 79 121" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 桂香绕小糕 -->
    <path d="M 94 110 Q 106 102 118 106 Q 128 110 130 114" stroke="#FFF0D0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="116" cy="112" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
