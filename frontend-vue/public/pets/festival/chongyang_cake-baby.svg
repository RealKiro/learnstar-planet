<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="重阳糕·二阶·顶层被吃·孩抢先啃最高层才想起奶奶顶层空菊歪">
  <defs>
    <!-- 背景：重阳厨房 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B890"/>
      <stop offset="52%" stop-color="#B89870"/>
      <stop offset="100%" stop-color="#9E8468"/>
    </linearGradient>
    <!-- 弱暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 糕层 -->
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0C070"/>
      <stop offset="100%" stop-color="#C8A050"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 哎呀的孩子（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="120" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="152" cy="133" rx="5" ry="7.5" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <!-- 拍额头的手（哎呀） -->
    <path d="M 156 126 Q 162 120 160 114" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 嘴（哎呀） -->
    <ellipse cx="152" cy="121" rx="1.2" ry="1.5" fill="#B06858"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#8E7660" opacity="0.9"/>

  <!-- 顶层被吃的小重阳糕（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 底层 -->
    <rect x="82" y="130" width="36" height="13" rx="4" fill="#C8A050" stroke="#A8883E" stroke-width="0.8"/>
    <!-- 中层 -->
    <rect x="84" y="118" width="32" height="12" rx="4" fill="#D4AE5E" stroke="#A8883E" stroke-width="0.8"/>
    <!-- 顶层（被啃，缺角） -->
    <path d="M 86 106 L 108 106 Q 116 106 114 114 L 86 116 Z" fill="url(#cake)" stroke="#A8883E" stroke-width="0.8"/>
    <path d="M 104 106 Q 108 110 103 112" stroke="#C8A050" stroke-width="1.2" fill="none"/>
    <!-- 眼（含沮） -->
    <circle cx="96" cy="112" r="1.9" fill="#3E2E24"/>
    <circle cx="104" cy="112" r="1.9" fill="#3E2E24"/>
    <!-- 嘴（低垂） -->
    <path d="M 97 117 Q 100 115.4 103 117" fill="none" stroke="#8E6E3E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 顶菊（歪） -->
    <g transform="rotate(14 102 104)">
      <ellipse cx="99" cy="101" rx="2" ry="4" fill="#D8A838" transform="rotate(-30 99 101)"/>
      <ellipse cx="103" cy="101" rx="2" ry="4" fill="#E0B040" transform="rotate(30 103 101)"/>
      <circle cx="101" cy="101" r="1.5" fill="#E8C860"/>
    </g>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8C8A8" opacity="0.4">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
