<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="馄饨·五阶·冬至之周·元宝如玉皮亮汤清家人围桌晚归捧碗">
  <defs>
    <!-- 背景：冬至人家暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A87870"/>
      <stop offset="52%" stop-color="#C89878"/>
      <stop offset="100%" stop-color="#C89E78"/>
    </linearGradient>
    <!-- 冬至神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 冬至光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E8D0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E8D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 馄饨皮 -->
    <radialGradient id="skin" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </radialGradient>
    <!-- 暖光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F0E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8F0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 桌 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8E72" opacity="0.9"/>

  <!-- 围桌家人 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="122" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="58" cy="135" rx="5" ry="7.5" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <path d="M 62 128 Q 67 124 68 120" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="150" cy="122" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="150" cy="136" rx="5.5" ry="8" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 144 128 Q 138 124 136 120" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="150" cy="138" rx="7" ry="2.5" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.6"/>
  </g>

  <!-- 冬至之周（中，元宝如玉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="104" r="28" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 大碗 -->
    <path d="M 74 132 Q 104 118 134 132 Q 130 150 104 150 Q 78 150 74 132 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="1"/>
    <ellipse cx="104" cy="132" rx="30" ry="7" fill="#E8E0D0"/>
    <!-- 清汤 -->
    <ellipse cx="104" cy="133" rx="26" ry="5.5" fill="#F0E8D0"/>
    <!-- 主馄饨（脸，元宝如玉） -->
    <path d="M 92 118 Q 104 106 116 118 Q 124 132 116 142 Q 104 148 92 142 Q 84 132 92 118 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="1"/>
    <path d="M 97 112 Q 98 107 101 106" stroke="#C8B898" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 104 110 Q 105 105 107 105" stroke="#C8B898" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <path d="M 111 112 Q 112 107 114 106" stroke="#C8B898" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <ellipse cx="104" cy="130" rx="7" ry="6" fill="#E8A888" opacity="0.5"/>
    <!-- 眼（含威含温） -->
    <circle cx="97" cy="125" r="2" fill="#2E2A24"/>
    <circle cx="97.6" cy="124.4" r="0.65" fill="#FFF"/>
    <circle cx="111" cy="125" r="2" fill="#2E2A24"/>
    <circle cx="111.6" cy="124.4" r="0.65" fill="#FFF"/>
    <!-- 嘴（周） -->
    <path d="M 100 131 Q 104 133 108 131" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 其他馄饨（浮） -->
    <path d="M 128 128 Q 130 124 132 128 Q 134 132 130 132 Q 128 132 128 128 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 82 129 Q 84 125 86 129 Q 88 133 84 133 Q 82 133 82 129 Z" fill="url(#skin)" stroke="#D8C8B0" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.7;0 0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <!-- 热气 -->
    <path d="M 98 106 Q 94 96 100 86" stroke="#F8F0E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 114 108 Q 118 98 112 88" stroke="#F8F0E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
