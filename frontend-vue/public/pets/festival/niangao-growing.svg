<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="年糕·三阶·炼糯苦修·揉糯练软久不硬控火蒸透糯匀">
  <defs>
    <!-- 背景：过年厨房晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CCA0"/>
      <stop offset="52%" stop-color="#D0AC78"/>
      <stop offset="100%" stop-color="#B08E68"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 年糕（糯软韧亮） -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4D8"/>
    </radialGradient>
    <!-- 糯光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F0E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8F0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 春联红 -->
  <g fill="#C83838" opacity="0.85">
    <rect x="150" y="52" width="34" height="8" rx="2"/>
    <rect x="154" y="66" width="26" height="6" rx="2"/>
  </g>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 少年年糕（中，揉糯练软） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="102" r="18" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 白胖身（糯软韧） -->
    <rect x="82" y="92" width="36" height="28" rx="9" fill="url(#cake)" stroke="#D0C8B8" stroke-width="0.9"/>
    <!-- 眼（专注） -->
    <circle cx="94" cy="104" r="2.1" fill="#2E2A24"/>
    <circle cx="94.6" cy="103.4" r="0.7" fill="#FFF"/>
    <circle cx="106" cy="104" r="2.1" fill="#2E2A24"/>
    <circle cx="106.6" cy="103.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 95 109 Q 100 111.4 105 109" fill="none" stroke="#B08A6A" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 热气 -->
    <path d="M 92 90 Q 88 82 92 74" stroke="#F8F0E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 88 Q 112 80 108 72" stroke="#F8F0E0" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
