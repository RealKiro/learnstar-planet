<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰糖葫芦·四阶·甜人初成·庙会夜小孩举糖葫芦满街跑糖壳映灯亮晶晶">
  <defs>
    <!-- 背景：庙会夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A6E"/>
      <stop offset="52%" stop-color="#5A5A7E"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 庙会灯 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 山楂 -->
    <radialGradient id="berry" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#EC7858"/>
      <stop offset="100%" stop-color="#CC4840"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 庙会彩灯 -->
  <g fill="#F0C860" opacity="0.8">
    <circle cx="36" cy="56" r="6">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 36 50 L 36 45 M 36 62 L 36 67" stroke="#C8A040" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="36" cy="56" r="3" fill="#E87830"/>
  </g>
  <g fill="#E878C8" opacity="0.8">
    <circle cx="168" cy="48" r="6">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 168 42 L 168 37 M 168 54 L 168 59" stroke="#C858A0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="168" cy="48" r="3" fill="#F0A0D8"/>
  </g>
  <g fill="#68C8A0" opacity="0.7">
    <circle cx="102" cy="30" r="5">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M 102 25 L 102 21" stroke="#48A880" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#6E6256" opacity="0.9"/>

  <!-- 举串跑过的小孩（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="118" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="148" cy="132" rx="5.5" ry="8" fill="#C87868" stroke="#A86050" stroke-width="0.8"/>
    <!-- 举高高的手 -->
    <path d="M 144 124 Q 136 116 132 106" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴里喊（我有糖葫芦） -->
    <ellipse cx="145" cy="121" rx="1.5" ry="1.8" fill="#B06858"/>
  </g>

  <!-- 举着的糖葫芦（上，糖壳映灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 竹签 -->
    <path d="M 130 104 L 116 44" stroke="#D8C8A8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 下果 -->
    <circle cx="127" cy="88" r="7" fill="url(#berry)" stroke="#A83030" stroke-width="0.7"/>
    <circle cx="125" cy="86" r="2.2" fill="#FFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 中果 -->
    <circle cx="124" cy="68" r="7" fill="url(#berry)" stroke="#A83030" stroke-width="0.7"/>
    <circle cx="122" cy="66" r="2.2" fill="#FFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 顶果（脸） -->
    <circle cx="120" cy="48" r="8" fill="url(#berry)" stroke="#A83030" stroke-width="0.7"/>
    <circle cx="118" cy="46" r="2.4" fill="#FFF" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="117" cy="47" r="1.5" fill="#4E2020"/>
    <circle cx="124" cy="47" r="1.5" fill="#4E2020"/>
    <path d="M 118 50 Q 120 51.4 122 50" fill="none" stroke="#8E3E30" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 纸旗（飘） -->
    <path d="M 116 44 L 108 38 L 110 42 L 104 38 L 108 44 Z" fill="#F0E8D0" stroke="#C8BE9E" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="-4 116 44;4 116 44;-4 116 44" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
