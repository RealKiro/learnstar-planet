<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="月饼·四阶·中秋初成·家人切饼游子咬一口就是这个味眼湿">
  <defs>
    <!-- 背景：中秋饭桌 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A6E"/>
      <stop offset="52%" stop-color="#6E6A7E"/>
      <stop offset="100%" stop-color="#A88662"/>
    </linearGradient>
    <!-- 月光暖 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 饼皮 -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F0C878"/>
      <stop offset="100%" stop-color="#C89038"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="36" r="12" fill="#F8F4E8" opacity="0.95"/>

  <!-- 饭桌 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E7260" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#7A6250" stroke-width="2"/>

  <!-- 家人（左，切饼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="122" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="56" cy="136" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 62 128 Q 68 126 70 122" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 游子（右，咬一口，眼湿） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="112" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="152" cy="130" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 146 122 L 134 126" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 手里的饼角 -->
    <path d="M 130 124 Q 126 130 130 134 Q 136 132 134 126 Z" fill="url(#cake)" stroke="#A87028" stroke-width="0.7"/>
    <!-- 眼（湿） -->
    <circle cx="149" cy="110.5" r="1.5" fill="#24180E"/>
    <circle cx="149.4" cy="110.1" r="0.5" fill="#FFF"/>
    <circle cx="156" cy="110.5" r="1.5" fill="#24180E"/>
    <circle cx="156.5" cy="109.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 150 114 Q 153 115.6 155 114" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 切开的月饼（中，纹层酥，馅流沙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 整饼 -->
    <circle cx="100" cy="128" r="15" fill="url(#cake)" stroke="#A87028" stroke-width="1"/>
    <!-- 切开的口（露出蛋黄流沙） -->
    <path d="M 92 118 L 100 112 L 108 118" stroke="#8E6E3E" stroke-width="0.8" fill="none"/>
    <circle cx="100" cy="124" r="4" fill="#E8B050"/>
    <path d="M 96 124 Q 100 126 104 124" stroke="#C89038" stroke-width="0.7" fill="none"/>
    <!-- 眼（含温） -->
    <circle cx="93" cy="132" r="1.8" fill="#2E2A24"/>
    <circle cx="93.5" cy="131.5" r="0.6" fill="#FFF"/>
    <circle cx="107" cy="132" r="1.8" fill="#2E2A24"/>
    <circle cx="107.5" cy="131.5" r="0.6" fill="#FFF"/>
    <path d="M 95 136 Q 100 138 105 136" fill="none" stroke="#8E6E3E" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
