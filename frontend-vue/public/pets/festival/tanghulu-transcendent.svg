<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰糖葫芦·六阶·糖葫芦传说·暮光糖光碰小糖葫芦小孩举串跑过灯传甜为亮路">
  <defs>
    <!-- 背景：庙会草把暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 山楂 -->
    <radialGradient id="berry" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#EC7058"/>
      <stop offset="100%" stop-color="#C84840"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮色灯 -->
  <g fill="#F0C860" opacity="0.8">
    <circle cx="36" cy="50" r="5">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E6256" opacity="0.9"/>

  <!-- 举串跑过的小孩（下中） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.2 0;0 0" dur="3s" repeatCount="indefinite"/>
    <circle cx="100" cy="134" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="100" cy="147" rx="5" ry="7" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <path d="M 96 140 Q 90 132 88 124" stroke="#E8D0B4" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 举的小串 -->
    <path d="M 86 122 L 80 98" stroke="#D8C8A8" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="83" cy="108" r="4.5" fill="url(#berry)" stroke="#A83030" stroke-width="0.6"/>
    <circle cx="81" cy="101" r="4.5" fill="url(#berry)" stroke="#A83030" stroke-width="0.6"/>
    <circle cx="80" cy="95" r="2" fill="#FFF" opacity="0.8"/>
  </g>

  <!-- 小糖葫芦（右，糖初亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 148 138 L 156 78" stroke="#D8C8A8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="149" cy="120" r="7" fill="url(#berry)" stroke="#A83030" stroke-width="0.7"/>
    <circle cx="152" cy="102" r="7" fill="url(#berry)" stroke="#A83030" stroke-width="0.7"/>
    <circle cx="154" cy="84" r="8" fill="url(#berry)" stroke="#A83030" stroke-width="0.7"/>
    <circle cx="151" cy="81" r="2.2" fill="#FFF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="151" cy="83" r="1.5" fill="#4E2020"/>
    <circle cx="157" cy="83" r="1.5" fill="#4E2020"/>
    <path d="M 152 86 Q 154 87.2 156 86" fill="none" stroke="#8E3E30" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M 156 78 L 162 72" stroke="#C8BE9E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 老糖葫芦（左，糖光碰小糖葫芦） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 竹签 -->
    <path d="M 70 138 L 84 64" stroke="#D8C8A8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 下果 -->
    <circle cx="72" cy="122" r="9" fill="url(#berry)" stroke="#983030" stroke-width="0.8"/>
    <circle cx="70" cy="119" r="2.6" fill="#FFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 中果 -->
    <circle cx="76" cy="100" r="9" fill="url(#berry)" stroke="#983030" stroke-width="0.8"/>
    <circle cx="74" cy="97" r="2.6" fill="#FFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 顶果（脸） -->
    <circle cx="80" cy="78" r="10" fill="url(#berry)" stroke="#983030" stroke-width="0.8"/>
    <circle cx="77" cy="75" r="2.8" fill="#FFF" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 脸（温和，目含慈） -->
    <circle cx="76" cy="77" r="1.8" fill="#4E2020"/>
    <circle cx="84" cy="77" r="1.8" fill="#4E2020"/>
    <path d="M 78 81 Q 80 82.4 82 81" fill="none" stroke="#8E3E30" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 纸旗（飘） -->
    <path d="M 84 64 L 92 56 L 90 60 L 95 55 L 91 62 Z" fill="#F0E8D0" stroke="#C8BE9E" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="-3 84 64;3 84 64;-3 84 64" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 糖光（碰小糖） -->
    <path d="M 88 90 Q 108 88 124 84" stroke="#FFF0D0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="116" cy="88" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
