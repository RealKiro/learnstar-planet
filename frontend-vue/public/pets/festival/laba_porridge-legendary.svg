<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="腊八粥·五阶·腊八之暖·一锅五谷如珠香暖赶路人捧碗三九寒化开">
  <defs>
    <!-- 背景：腊八雪夜人家 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A78"/>
      <stop offset="52%" stop-color="#7A726A"/>
      <stop offset="100%" stop-color="#B09878"/>
    </linearGradient>
    <!-- 腊八神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 腊八光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 粥稠 -->
    <radialGradient id="porridge" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F6DC9C"/>
      <stop offset="100%" stop-color="#E0BA74"/>
    </radialGradient>
    <!-- 暖香光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8E8C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8E8C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#F8F4E8" opacity="0.6">
    <circle cx="40" cy="26" r="1.2">
      <animate attributeName="cy" values="26;54;26" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="18" r="1">
      <animate attributeName="cy" values="18;46;18" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="14" r="1.1">
      <animate attributeName="cy" values="14;42;14" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 灶台 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 捧碗的赶路人（右） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="154" cy="114" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="154" cy="132" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 147 110 Q 154 104 162 110 L 158 113 L 150 113 Z" fill="#6E564A" stroke="#4E3A30" stroke-width="0.7"/>
    <path d="M 148 122 L 138 126" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 140 123 Q 148 119 156 123 Q 154 131 148 131 Q 142 131 140 123 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.8"/>
    <ellipse cx="148" cy="123" rx="8" ry="3" fill="#F0D898"/>
    <path d="M 149 112 Q 151 114.6 153 112" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 腊八之暖（中，一锅五谷） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="102" r="28" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 大锅 -->
    <path d="M 62 106 Q 100 90 138 106 Q 135 134 100 134 Q 65 134 62 106 Z" fill="#6E6256" stroke="#544A40" stroke-width="1.1"/>
    <ellipse cx="100" cy="106" rx="38" ry="8" fill="#8E8270" stroke="#6E6256" stroke-width="1"/>
    <!-- 粥面（如珠） -->
    <ellipse cx="100" cy="106" rx="34" ry="6.5" fill="url(#porridge)"/>
    <!-- 五谷如珠 -->
    <g>
      <circle cx="84" cy="104" r="2" fill="#C85848">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="98" cy="106" r="1.8" fill="#F0E8D0">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="104" r="1.9" fill="#B08048">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="106" r="1.7" fill="#E8C080">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.9;0 0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="92" cy="107" r="1.6" fill="#A87848">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.7;0 0" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 粥面脸（含威含温） -->
    <circle cx="94" cy="104" r="2" fill="#3E2E24"/>
    <circle cx="94.6" cy="103.4" r="0.7" fill="#FFF"/>
    <circle cx="108" cy="104" r="2" fill="#3E2E24"/>
    <circle cx="108.6" cy="103.4" r="0.7" fill="#FFF"/>
    <path d="M 98 108 Q 101 109.6 104 108" fill="none" stroke="#8E6E3E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 暖香热气 -->
    <path d="M 92 92 Q 88 80 94 70" stroke="#F8F0E0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 94 Q 114 82 108 72" stroke="#F8F0E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
