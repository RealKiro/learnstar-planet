<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="年糕·五阶·年年高·糯如脂玉韧如筋家人围桌夹念年年高">
  <defs>
    <!-- 背景：过年人家暖阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A85050"/>
      <stop offset="52%" stop-color="#C8786E"/>
      <stop offset="100%" stop-color="#C89E78"/>
    </linearGradient>
    <!-- 过年神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 过年光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 年糕（脂玉） -->
    <radialGradient id="cake" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE4D8"/>
    </radialGradient>
    <!-- 糯光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F0E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8F0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 春联红 -->
  <g fill="#E04848" opacity="0.9">
    <rect x="152" y="46" width="34" height="8" rx="2"/>
    <rect x="156" y="60" width="26" height="6" rx="2"/>
  </g>

  <!-- 餐桌 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 围桌家人 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="126" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="58" cy="139" rx="5" ry="7.5" fill="#C87868" stroke="#A86050" stroke-width="0.7"/>
    <path d="M 62 132 Q 67 128 68 124" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="146" cy="126" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="146" cy="139" rx="5" ry="7.5" fill="#A8886E" stroke="#8E6E50" stroke-width="0.7"/>
    <path d="M 142 132 Q 138 128 136 125" stroke="#E8D0B4" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 年年高（中，糯如脂玉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="102" cy="104" r="26" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 盘 -->
    <ellipse cx="102" cy="136" rx="24" ry="5.5" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.9"/>
    <!-- 年糕（厚，脂玉） -->
    <rect x="84" y="112" width="36" height="26" rx="9" fill="url(#cake)" stroke="#D0C8B8" stroke-width="1"/>
    <!-- 眼（含威含温） -->
    <circle cx="95" cy="124" r="2.2" fill="#2E2A24"/>
    <circle cx="95.6" cy="123.4" r="0.7" fill="#FFF"/>
    <circle cx="109" cy="124" r="2.2" fill="#2E2A24"/>
    <circle cx="109.6" cy="123.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（喜） -->
    <path d="M 97 129 Q 102 131.6 107 129" fill="none" stroke="#B08A6A" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 热气 -->
    <path d="M 94 108 Q 90 98 96 90" stroke="#F8F0E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 110 Q 114 100 108 92" stroke="#F8F0E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
