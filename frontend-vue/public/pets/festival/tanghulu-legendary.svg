<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰糖葫芦·五阶·庙会之亮·红果如灯糖壳如晶小孩踮脚买大人举着哄">
  <defs>
    <!-- 背景：庙会夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A6E"/>
      <stop offset="52%" stop-color="#5A5A7E"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 庙会神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 庙会光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 山楂 -->
    <radialGradient id="berry" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F07858"/>
      <stop offset="100%" stop-color="#D04840"/>
    </radialGradient>
    <!-- 糖光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.64;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 庙会彩灯 -->
  <g fill="#F0C860" opacity="0.8">
    <circle cx="36" cy="52" r="6">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="52" r="3" fill="#E87830"/>
  </g>
  <g fill="#68C8A0" opacity="0.7">
    <circle cx="168" cy="44" r="6">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="44" r="3" fill="#A0E8C8"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E6256" opacity="0.9"/>

  <!-- 踮脚买的孩子（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="60" cy="122" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="60" cy="135" rx="5.5" ry="8" fill="#C87868" stroke="#A86050" stroke-width="0.8"/>
    <path d="M 66 127 Q 72 123 74 119" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 举着哄的大人（右） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="122" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="152" cy="139" rx="6" ry="9" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 146 130 Q 140 126 138 122" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 156 128 Q 160 124 160 120" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 庙会之亮（中，红果如灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="104" cy="82" r="34" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 草把 -->
    <path d="M 82 146 L 122 146 L 125 152 L 79 152 Z" fill="#B0985E" stroke="#9E8650" stroke-width="1"/>
    <!-- 竹签 -->
    <path d="M 104 144 L 116 56" stroke="#D8C8A8" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 下果 -->
    <circle cx="107" cy="124" r="10" fill="url(#berry)" stroke="#A83030" stroke-width="0.9"/>
    <circle cx="104" cy="121" r="3" fill="#FFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 中果 -->
    <circle cx="111" cy="100" r="10" fill="url(#berry)" stroke="#A83030" stroke-width="0.9"/>
    <circle cx="108" cy="97" r="3" fill="#FFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 顶果（脸） -->
    <circle cx="115" cy="76" r="11" fill="url(#berry)" stroke="#A83030" stroke-width="0.9"/>
    <circle cx="112" cy="73" r="3.2" fill="#FFF" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 脸 -->
    <circle cx="110" cy="75" r="2" fill="#4E2020"/>
    <circle cx="119" cy="75" r="2" fill="#4E2020"/>
    <path d="M 112 79 Q 115 80.8 118 79" fill="none" stroke="#8E3E30" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 纸旗（飘红） -->
    <path d="M 116 56 L 128 44 L 126 52 L 136 42 L 130 52 L 134 50 L 126 56 Z" fill="#F0E8D0" stroke="#C8BE9E" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="-3 116 56;3 116 56;-3 116 56" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
