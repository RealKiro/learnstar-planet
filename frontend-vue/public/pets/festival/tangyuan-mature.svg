<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汤圆·四阶·甜糯初成·冬夜赶路人舀汤圆入喉眯眼一口暖到心里">
  <defs>
    <!-- 背景：冬夜饭桌 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A4A5E"/>
      <stop offset="52%" stop-color="#6E6256"/>
      <stop offset="100%" stop-color="#8E7A64"/>
    </linearGradient>
    <!-- 灯暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 汤圆（热） -->
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4D8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 饭桌 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E7260" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#7A6250" stroke-width="2"/>

  <!-- 端上汤圆的孩童（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="52" cy="124" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="52" cy="138" rx="5.5" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <path d="M 58 130 Q 64 128 66 124" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 赶路人（右，舀汤圆入喉，眯眼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="108" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="156" cy="126" rx="6.5" ry="10" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <!-- 围巾 -->
    <path d="M 150 114 Q 156 116 162 114" stroke="#B06858" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 舀入口的手 -->
    <path d="M 150 118 L 136 122" stroke="#E8D0B4" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 138 120 L 130 123" stroke="#8E6E50" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 眼（眯，暖） -->
    <path d="M 152 106 Q 154 104.6 156 106 M 159 106 Q 161 104.6 162 106" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 153 110 Q 156 111.8 159 110" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 碗里的汤圆（中，热气） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 碗 -->
    <path d="M 92 128 Q 104 118 116 128 Q 113 140 104 140 Q 95 140 92 128 Z" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.9"/>
    <ellipse cx="104" cy="128" rx="12" ry="4.5" fill="#E8E0D0"/>
    <!-- 汤圆（冒热气） -->
    <circle cx="102" cy="126" r="6" fill="url(#ball)" stroke="#D0C8B8" stroke-width="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（含温） -->
    <circle cx="100" cy="125" r="1.4" fill="#2E2A24"/>
    <circle cx="105" cy="125" r="1.4" fill="#2E2A24"/>
    <!-- 热气 -->
    <path d="M 100 116 Q 97 108 100 100" stroke="#F4F0E4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 118 Q 111 110 108 104" stroke="#F4F0E4" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF0D0">
    <circle cx="48" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
