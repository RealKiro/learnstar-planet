<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="腊八粥·六阶·腊八粥传说·暮光暖香绕小腊八粥家人捧碗传一锅暖">
  <defs>
    <!-- 背景：腊八灶台暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#CC9E74"/>
      <stop offset="100%" stop-color="#9E8872"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 粥稠 -->
    <radialGradient id="porridge" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F0D090"/>
      <stop offset="100%" stop-color="#D8AE68"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E8268" opacity="0.9"/>

  <!-- 捧碗的家人（下） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="58" cy="134" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="58" cy="147" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.7"/>
    <circle cx="148" cy="134" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.6"/>
    <ellipse cx="148" cy="147" rx="5" ry="7" fill="#A8886E" stroke="#8E6E50" stroke-width="0.7"/>
    <ellipse cx="58" cy="147" rx="6" ry="2" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.5"/>
    <ellipse cx="148" cy="147" rx="6" ry="2" fill="#D8CCB8" stroke="#B8AC98" stroke-width="0.5"/>
  </g>

  <!-- 小腊八粥（右，五谷翻滚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 小锅 -->
    <path d="M 128 112 Q 148 102 168 112 Q 166 128 148 128 Q 130 128 128 112 Z" fill="#6E6256" stroke="#544A40" stroke-width="0.9"/>
    <ellipse cx="148" cy="112" rx="20" ry="4.5" fill="#8E8270" stroke="#6E6256" stroke-width="0.8"/>
    <ellipse cx="148" cy="112" rx="17" ry="3.5" fill="url(#porridge)"/>
    <g>
      <circle cx="141" cy="110.5" r="1.4" fill="#C85848">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.7;0 0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="153" cy="111" r="1.3" fill="#F0E8D0">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 粥面脸 -->
    <circle cx="144" cy="110.5" r="1.4" fill="#3E2E24"/>
    <circle cx="152" cy="110.5" r="1.4" fill="#3E2E24"/>
    <path d="M 146 113 Q 148 114 150 113" fill="none" stroke="#8E6E3E" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 热气 -->
    <path d="M 146 104 Q 143 98 146 92" stroke="#F8F0E0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 老腊八粥（左，暖香绕小粥） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="84" cy="112" r="24" fill="#F0E4C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 大锅 -->
    <path d="M 56 114 Q 84 100 112 114 Q 110 134 84 134 Q 58 134 56 114 Z" fill="#6E6256" stroke="#544A40" stroke-width="1"/>
    <ellipse cx="84" cy="114" rx="28" ry="6" fill="#8E8270" stroke="#6E6256" stroke-width="0.9"/>
    <ellipse cx="84" cy="114" rx="25" ry="5" fill="url(#porridge)"/>
    <!-- 五谷如古 -->
    <circle cx="76" cy="112.5" r="1.6" fill="#C85848"/>
    <circle cx="90" cy="113" r="1.5" fill="#F0E8D0"/>
    <!-- 粥面脸（温和，目含慈） -->
    <circle cx="78" cy="112" r="1.9" fill="#3E2E24"/>
    <circle cx="78.6" cy="111.4" r="0.6" fill="#FFF"/>
    <circle cx="90" cy="112" r="1.9" fill="#3E2E24"/>
    <circle cx="90.6" cy="111.4" r="0.6" fill="#FFF"/>
    <path d="M 81 115 Q 84 116.4 87 115" fill="none" stroke="#8E6E3E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 暖香（绕小粥） -->
    <path d="M 100 104 Q 112 96 126 100 Q 136 104 140 108" stroke="#FFF0D0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="112" r="9" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
