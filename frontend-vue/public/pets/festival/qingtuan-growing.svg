<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青团·三阶·炼糯苦修·揉糯练软久放仍青配艾练香愈久念">
  <defs>
    <!-- 背景：清明厨房晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8CCA8"/>
      <stop offset="52%" stop-color="#C0CCAC"/>
      <stop offset="100%" stop-color="#9EA890"/>
    </linearGradient>
    <!-- 灶暖 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青团（翠亮） -->
    <radialGradient id="ball" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#96CE9E"/>
      <stop offset="100%" stop-color="#5A9A64"/>
    </radialGradient>
    <!-- 艾香光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8E0BE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B8E0BE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 灶台 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#8E9E86" opacity="0.9"/>

  <!-- 少年青团（中，练糯，翠亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="100" cy="106" r="17" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 圆身（翠亮透） -->
    <circle cx="100" cy="106" r="15" fill="url(#ball)" stroke="#3E7A46" stroke-width="1"/>
    <!-- 眼（专注） -->
    <circle cx="94" cy="104" r="2.1" fill="#1E2E22"/>
    <circle cx="94.6" cy="103.4" r="0.7" fill="#FFF"/>
    <circle cx="106" cy="104" r="2.1" fill="#1E2E22"/>
    <circle cx="106.6" cy="103.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（自信） -->
    <path d="M 95 109 Q 100 111.6 105 109" fill="none" stroke="#4E6E3E" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 艾香（持久，环绕） -->
  <g stroke="#F4F0E4" stroke-linecap="round" fill="none">
    <path d="M 82 98 Q 78 88 82 80" stroke-width="1.3" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 118 96 Q 122 86 118 78" stroke-width="1.3" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#B8E0BE">
    <circle cx="60" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
