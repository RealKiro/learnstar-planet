<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="魔杖猫·四阶·引路初成·夜巷尾光引走失孩子穿巷停门母抱">
  <defs>
    <!-- 背景：夜巷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6E"/>
      <stop offset="52%" stop-color="#3A4A5E"/>
      <stop offset="100%" stop-color="#8E968C"/>
    </linearGradient>
    <!-- 尾光 -->
    <radialGradient id="glow" cx="55%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#F8E4A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F8E4A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年魔杖猫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="110" cy="60" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星夜 -->
  <g fill="#E8EEF4">
    <circle cx="40" cy="30" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="24" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 亮灯的家门（右下） -->
  <g>
    <path d="M 136 118 L 136 152 L 186 152 L 186 118 Z" fill="#6E6658"/>
    <path d="M 130 118 L 161 102 L 192 118 Z" fill="#8E8474"/>
    <!-- 门（亮灯） -->
    <path d="M 154 124 L 154 152 L 172 152 L 172 124 Z" fill="#F8E4A0"/>
    <circle cx="163" cy="138" r="4" fill="#FFF0C0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 门口抱住孩子的母亲（右下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="170" cy="128" r="4" fill="#C8B898"/>
    <path d="M 166 132 L 164 140 M 170 132 L 170 140 M 174 132 L 176 140" stroke="#A8906E" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 被引的孩子（左，跟尾光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="72" cy="138" r="4" fill="#D8C8A8"/>
    <path d="M 68 142 L 66 148 M 72 142 L 72 148 M 76 142 L 78 148" stroke="#B0986E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 引路光带（尾→孩子→门） -->
  <path d="M 96 134 Q 84 138 78 140" stroke="#F8E4A0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M 78 140 Q 110 142 150 140" stroke="#F8E4A0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 少年魔杖猫（引路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="102" cy="130" rx="12" ry="9.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 94 137 L 92 144 M 110 137 L 112 144" stroke="#C8C2B8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 尾（如灯，引路） -->
    <path d="M 114 134 Q 122 132 126 138" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 114 134;-6 114 134;0 114 134" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="127" cy="139" r="2.6" fill="#F8E4A0">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年魔杖猫头（含温含亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="102" cy="112" rx="9" ry="8" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 尖耳 -->
    <path d="M 94 106 L 90 98 L 99 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 110 106 L 114 98 L 105 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <!-- 眼（含温） -->
    <circle cx="97.5" cy="110" r="2.2" fill="#24180E"/>
    <circle cx="98.1" cy="109.4" r="0.7" fill="#FFF"/>
    <circle cx="106.5" cy="110" r="2.2" fill="#24180E"/>
    <circle cx="107.1" cy="109.4" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 101 114 L 103 114 L 102 115.4 Z" fill="#E8A0A0"/>
    <!-- 嘴（引路，笑） -->
    <path d="M 99 116.5 Q 102 117.8 105 116.5" fill="none" stroke="#C8B0A0" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 夜光星尘 -->
  <g fill="#F8E4A0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
