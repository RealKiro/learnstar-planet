<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="元素灯灵·一阶·灯心初燃·古灯探身光点颤颤照夜猫走来">
  <defs>
    <!-- 背景：长夜街角 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A56"/>
      <stop offset="52%" stop-color="#1E2A42"/>
      <stop offset="100%" stop-color="#18202E"/>
    </linearGradient>
    <!-- 灯暖 -->
    <radialGradient id="glow" cx="74%" cy="38%" r="34%">
      <stop offset="0%" stop-color="#F8C860" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8C860" stop-opacity="0"/>
    </radialGradient>
    <!-- 焰身 -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8C860"/>
      <stop offset="100%" stop-color="#E87830"/>
    </linearGradient>
    <!-- 光点 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="148" cy="74" r="64" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.58;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#E8EEF4">
    <circle cx="36" cy="32" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="60" r="1">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 夜猫（左，循光而来） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="66" cy="138" rx="10" ry="6.5" fill="#2A2C34" stroke="#16181E" stroke-width="0.8"/>
    <path d="M 56 139 L 52 146 M 60 141 L 58 146 M 72 141 L 74 146 M 76 139 L 79 145" stroke="#16181E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 76 136 Q 82 134 84 138" stroke="#2A2C34" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 头（望光） -->
    <ellipse cx="74" cy="128" rx="5.5" ry="4.5" fill="#2A2C34" stroke="#16181E" stroke-width="0.7"/>
    <path d="M 71 124 L 69 119 L 73 123 Z" fill="#2A2C34"/>
    <path d="M 77 124 L 79 119 L 75 123 Z" fill="#2A2C34"/>
    <circle cx="75" cy="127" r="1.2" fill="#F8D080">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 古灯（右，灯盏） -->
  <g>
    <rect x="142" y="138" width="16" height="5" rx="2" fill="#6E6256" stroke="#544A40" stroke-width="0.7"/>
    <path d="M 148 143 L 148 152" stroke="#6E6256" stroke-width="3" stroke-linecap="round"/>
    <path d="M 138 152 L 158 152" stroke="#6E6256" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 144 130 L 144 138 L 154 138 L 154 130 Z" fill="#8E8270" stroke="#6E6256" stroke-width="0.8"/>
  </g>

  <!-- 小灯灵（灯盏探身，光点小） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 光点（小圈） -->
    <circle cx="149" cy="116" r="11" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身（探出） -->
    <path d="M 149 108 Q 155 114 155 119 Q 155 124 149 124 Q 143 124 143 119 Q 143 114 149 108 Z" fill="url(#flame)" stroke="#B85A28" stroke-width="0.7"/>
    <!-- 焰发 -->
    <path d="M 147 108 Q 145 102 148 100 Q 149 105 150 104 Q 152 98 154 100 Q 153 105 151 108" fill="#F8D080" stroke="#D87828" stroke-width="0.5"/>
    <!-- 眼（亮如星） -->
    <circle cx="146.5" cy="117" r="1.4" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="151.5" cy="117" r="1.4" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光（摇曳） -->
    <path d="M 149 124 Q 149 129 152 132" stroke="#F8C860" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="-3 149 124;3 149 124;-3 149 124" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="152" cy="133" r="2" fill="#F8D080">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 月光星尘 -->
  <g fill="#F8D080">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="178" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
