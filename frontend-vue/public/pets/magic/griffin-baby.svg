<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮鹫·二阶·坠翼之惧·初飞坠地摔草坡缩翼发抖怕再飞">
  <defs>
    <!-- 背景：崖下草坡暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0C8B4"/>
      <stop offset="52%" stop-color="#A0AC98"/>
      <stop offset="100%" stop-color="#7E907E"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E4E4D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E4E4D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 小狮鹫毛（沾土） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0B488"/>
      <stop offset="100%" stop-color="#B49A6E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 崖壁（右上） -->
  <g fill="#A0A8AC" opacity="0.6">
    <path d="M 0 0 L 90 0 L 78 44 Q 68 74 82 100 L 56 100 L 0 60 Z"/>
  </g>

  <!-- 草坡 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E72" opacity="0.8"/>

  <!-- 围观的小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="144" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="52" cy="137" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 小狮鹫（坠地，缩翼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（趴） -->
    <ellipse cx="104" cy="140" rx="12" ry="8.5" fill="url(#fur)" stroke="#9E8256" stroke-width="0.9" transform="rotate(-8 104 140)"/>
    <!-- 缩着的翼 -->
    <path d="M 98 136 L 86 130 L 84 138 L 96 140 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="0.7"/>
    <path d="M 112 138 L 122 134 L 122 142 L 112 142 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="0.7"/>
    <!-- 狮腿（缩） -->
    <path d="M 98 146 L 96 151 M 112 146 L 114 151" stroke="#9E8256" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 小狮鹫头（缩，惧） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="126" rx="8" ry="7" fill="url(#fur)" stroke="#9E8256" stroke-width="0.8"/>
    <!-- 眼（惧） -->
    <circle cx="101" cy="124.5" r="2" fill="#24180E"/>
    <circle cx="101.5" cy="124.1" r="0.65" fill="#FFF"/>
    <circle cx="107.5" cy="124.5" r="2" fill="#24180E"/>
    <circle cx="108" cy="124.1" r="0.65" fill="#FFF"/>
    <!-- 喙（垂） -->
    <path d="M 103 128.5 L 101 131 L 105 130.4 Z" fill="#C0A858"/>
    <!-- 耳羽（耷拉） -->
    <path d="M 98 121 Q 97 118 99 117" stroke="#D0B488" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 110 121 Q 111 118 109 117" stroke="#D0B488" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E4E4D0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
