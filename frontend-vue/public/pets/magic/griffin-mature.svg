<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮鹫·四阶·护山初成·盘旋锁定狮爪稳抓困崖兽放回安">
  <defs>
    <!-- 背景：崖边夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B4"/>
      <stop offset="52%" stop-color="#C8BC94"/>
      <stop offset="100%" stop-color="#98ACA8"/>
    </linearGradient>
    <!-- 护山威光 -->
    <radialGradient id="glow" cx="52%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#F4F4E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F4F4E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年狮鹫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#BCA474"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 崖 -->
  <g fill="#A0A8AC" opacity="0.6">
    <path d="M 120 200 L 130 170 Q 150 160 170 168 L 200 160 L 200 200 Z"/>
  </g>

  <!-- 被抓住的小兽（狮爪下，正放回） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="122" cy="148" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="122" cy="141" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 少年狮鹫（鹰眼锁定，狮爪抓兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鹰翼（展） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 94 108;6 94 108;-6 94 108" dur="2s" repeatCount="indefinite"/>
      <path d="M 86 112 L 52 96 L 60 108 L 42 98 L 56 112 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="0.9"/>
      <path d="M 86 112 L 120 96 L 112 108 L 130 98 L 116 112 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="0.9"/>
    </g>
    <!-- 狮身 -->
    <ellipse cx="92" cy="118" rx="9" ry="6.5" fill="url(#fur)" stroke="#9E8256" stroke-width="0.8"/>
    <!-- 狮尾 -->
    <path d="M 100 120 L 110 122 L 112 126" stroke="#C8A878" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 狮爪（抓兽） -->
    <path d="M 96 122 Q 108 130 116 138" stroke="#C8A878" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 96 122;6 96 122;0 96 122" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年狮鹫头（鹰眼锁定，含威含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="92" cy="106" rx="8.5" ry="7.5" fill="url(#fur)" stroke="#9E8256" stroke-width="0.8"/>
    <!-- 眼（锁定） -->
    <circle cx="88.5" cy="104.5" r="2.1" fill="#D89020"/>
    <circle cx="89" cy="104.1" r="0.7" fill="#FFF"/>
    <circle cx="95.5" cy="104.5" r="2.1" fill="#D89020"/>
    <circle cx="96" cy="104.1" r="0.7" fill="#FFF"/>
    <!-- 喙 -->
    <path d="M 91 109 L 89 111.4 L 93 110.8 Z" fill="#C8B058"/>
    <!-- 耳羽 -->
    <path d="M 86 101 Q 85 98 87 97" stroke="#D8C090" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 98 101 Q 99 98 97 97" stroke="#D8C090" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 额间护光 -->
    <circle cx="92" cy="99" r="2.4" fill="#F4F4E0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 护山星尘 -->
  <g fill="#F4F4E0">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
