<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="炼金魔像·一阶·造物初醒·撞翻试剂又扶好主人后退学蹲下">
  <defs>
    <!-- 背景：工坊灯火 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0BC90"/>
      <stop offset="52%" stop-color="#C09A72"/>
      <stop offset="100%" stop-color="#9E8268"/>
    </linearGradient>
    <!-- 灯暖 -->
    <radialGradient id="glow" cx="60%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青石身 -->
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A909C"/>
      <stop offset="100%" stop-color="#5E7480"/>
    </linearGradient>
    <!-- 眼窝光 -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 木架（右，试剂瓶） -->
  <g>
    <rect x="128" y="112" width="60" height="6" rx="2" fill="#8E6E50" stroke="#6E5238" stroke-width="0.7"/>
    <path d="M 134 118 L 134 148 M 150 118 L 150 148 M 168 118 L 168 148" stroke="#8E6E50" stroke-width="2" stroke-linecap="round"/>
    <!-- 试剂瓶 -->
    <path d="M 134 96 L 134 112 L 144 112 L 144 96 Z" fill="#E87830" opacity="0.85" rx="1"/>
    <path d="M 146 88 L 146 104 L 156 104 L 156 88 Z" fill="#3EA8C8" opacity="0.85" rx="1"/>
    <path d="M 160 92 L 160 108 L 170 108 L 170 92 Z" fill="#E8C860" opacity="0.85" rx="1"/>
  </g>

  <!-- 撞翻的试剂瓶（右下，洒出彩液） -->
  <g>
    <path d="M 142 150 L 142 158 L 152 158 L 152 150 Z" fill="#3EA8C8" opacity="0.7" transform="rotate(-20 147 154)"/>
    <path d="M 132 158 Q 140 156 150 160 Q 158 163 164 160" stroke="#3EA8C8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 主人（左，后退） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="38" cy="126" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="38" cy="140" rx="6" ry="9" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8" transform="rotate(-10 38 140)"/>
    <!-- 惊退的手 -->
    <path d="M 42 134 Q 48 130 50 124" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="124" r="1.4" fill="#24180E"/>
    <circle cx="38.4" cy="123.6" r="0.45" fill="#FFF"/>
  </g>

  <!-- 青石魔像（中，蹲下扶试剂架，笨拙学步） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 石腿（蹲） -->
    <path d="M 88 124 L 84 142 M 106 124 L 110 142" stroke="url(#stone)" stroke-width="7" stroke-linecap="round"/>
    <!-- 石身 -->
    <rect x="86" y="92" width="22" height="32" rx="8" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
    <!-- 篆纹（胸前） -->
    <path d="M 94 104 L 94 110 M 92 108 L 96 108" stroke="#C8B058" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <path d="M 100 102 L 100 108" stroke="#C8B058" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <!-- 右臂（扶试剂架，前伸） -->
    <path d="M 106 100 L 122 116 L 128 138" stroke="url(#stone)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 106 100;-4 106 100;0 106 100" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 左臂（垂，笨拙） -->
    <path d="M 88 100 L 82 118" stroke="url(#stone)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 石面（眼窝亮光，懵懂） -->
    <g>
      <rect x="88" y="70" width="20" height="18" rx="5" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
      <!-- 左眼窝 -->
      <circle cx="93.5" cy="80" r="2.4" fill="#2E3E46"/>
      <circle cx="93.5" cy="80" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="93.5" cy="80" r="4.5" fill="#F8D080" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <!-- 右眼窝 -->
      <circle cx="102.5" cy="80" r="2.4" fill="#2E3E46"/>
      <circle cx="102.5" cy="80" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="102.5" cy="80" r="4.5" fill="#F8D080" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 灯火星尘 -->
  <g fill="#FFF0D0">
    <circle cx="60" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="66">
      <animate attributeName="cy" values="66;56;66" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
