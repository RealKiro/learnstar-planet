<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="美人鱼·四阶·引航初成·顶浪唱歌引船避流回港安">
  <defs>
    <!-- 背景：风浪海面 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E96AE"/>
      <stop offset="52%" stop-color="#66829A"/>
      <stop offset="100%" stop-color="#C8B880"/>
    </linearGradient>
    <!-- 引航光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 美人鱼尾鳞（沾浪） -->
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62BEAA"/>
      <stop offset="100%" stop-color="#4CA296"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.48;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雨线 -->
  <g stroke="#C0D4DC" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 40 10 L 36 44" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 10 L 136 46" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 浪（急） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E8EA0" opacity="0.8"/>
  <g stroke="#8EAEBC" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 20 158 Q 60 152 100 158 Q 140 164 180 158">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 避流回港的船（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 140 156 L 166 154 L 172 160 L 134 160 Z" fill="#8E7A5E"/>
    <path d="M 152 154 L 154 146 L 158 154 Z" fill="#C8B898"/>
    <!-- 船尾水花 -->
    <g fill="#8EAEBC" opacity="0.6">
      <circle cx="138" cy="160" r="1.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 引航的光（歌→船） -->
  <path d="M 96 138 Q 116 146 134 152" stroke="#F0E8C8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 少年美人鱼（顶浪唱歌引航） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 鱼尾（顶浪） -->
    <path d="M 88 126 Q 98 118 110 112" stroke="url(#tail)" stroke-width="5" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 88 126;6 88 126;0 88 126" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 108 110 L 118 102 L 116 116 Z" fill="url(#tail)" stroke="#48A08E" stroke-width="0.8"/>
    <!-- 上身 -->
    <ellipse cx="86" cy="118" rx="8" ry="9" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 贝壳饰 -->
    <path d="M 83 122 Q 82 126 86 126 Q 90 126 89 122 Z" fill="#E8B8B0" opacity="0.8"/>
  </g>

  <!-- 少年美人鱼头（顶浪唱歌，坚毅含亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="86" cy="102" rx="7.5" ry="8" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 眼（含亮，望船） -->
    <circle cx="82.5" cy="101" r="1.8" fill="#24180E"/>
    <circle cx="82.9" cy="100.6" r="0.6" fill="#FFF"/>
    <circle cx="89.5" cy="101" r="1.8" fill="#24180E"/>
    <circle cx="89.9" cy="100.6" r="0.6" fill="#FFF"/>
    <!-- 嘴（唱歌） -->
    <path d="M 83 106 Q 86 107.4 89 106" fill="none" stroke="#C09880" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 长发贴颊 -->
    <path d="M 82 97 Q 77 90 72 88" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 90 97 Q 95 90 100 88" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 82 94 Q 76 94 72 97" stroke="#5A8A80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 额贝饰 -->
    <circle cx="86" cy="96" r="1.6" fill="#F0E4C8"/>
    <!-- 歌声波纹（引航） -->
    <g stroke="#F0E8C8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 92 100 Q 100 96 106 92">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 92 104 Q 102 100 110 96">
        <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 引航星尘 -->
  <g fill="#F0E8C8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
