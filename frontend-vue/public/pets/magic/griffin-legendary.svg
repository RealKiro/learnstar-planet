<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮鹫·五阶·群山之王·盘旋山巅鹰眼巡俯冲示警爪托落难">
  <defs>
    <!-- 背景：群山云海夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B0"/>
      <stop offset="52%" stop-color="#C8BC90"/>
      <stop offset="100%" stop-color="#A0AEB0"/>
    </linearGradient>
    <!-- 王之神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FCF4D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCF4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECEC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECEC" stop-opacity="0"/>
    </radialGradient>
    <!-- 群山之王毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#B8A070"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F0F4F0" opacity="0.85">
    <path d="M 0 132 Q 50 124 110 130 Q 160 134 200 128 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 群山（下） -->
  <g fill="#A0ACB0" opacity="0.5">
    <path d="M 0 150 L 0 178 Q 40 170 80 176 Q 120 182 160 174 Q 180 170 200 176 L 200 200 L 0 200 Z"/>
  </g>

  <!-- 被托起的落难小兽（左） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="142" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="52" cy="135" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <!-- 托起的光 -->
    <path d="M 58 138 Q 72 134 84 136" stroke="#FCF4D8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 越界被示警的入侵者（右远） -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="158" cy="146" rx="8" ry="5.5" fill="#5E6658" stroke="#4E5648" stroke-width="0.7"/>
    <circle cx="154" cy="140" r="4.5" fill="#5E6658"/>
  </g>

  <!-- 群山之王狮鹫（盘旋，鹰眼巡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鹰翼（大展如云） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 96 96;8 96 96;-8 96 96" dur="2.2s" repeatCount="indefinite"/>
      <path d="M 86 100 L 48 82 L 58 96 L 34 86 L 54 102 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="1.1"/>
      <path d="M 86 100 L 124 82 L 114 96 L 138 86 L 118 102 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="1.1"/>
    </g>
    <!-- 狮身 -->
    <ellipse cx="92" cy="106" rx="9.5" ry="7" fill="url(#fur)" stroke="#9E8256" stroke-width="0.9"/>
    <!-- 狮尾 -->
    <path d="M 100 108 L 112 110 L 115 116" stroke="#C8A878" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 狮爪（托落难） -->
    <path d="M 88 110 Q 76 118 68 126" stroke="#C8A878" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 88 110;5 88 110;0 88 110" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 群山之王头（鹰眼巡，含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="92" cy="94" rx="9" ry="8" fill="url(#fur)" stroke="#9E8256" stroke-width="0.9"/>
    <!-- 眼（锐，巡） -->
    <path d="M 85 92 Q 87 90.6 89 92 M 96 92 Q 98 90.6 99 92" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="87" cy="93" r="2.2" fill="#D89020"/>
    <circle cx="87.6" cy="92.4" r="0.7" fill="#FFF"/>
    <circle cx="97.5" cy="93" r="2.2" fill="#D89020"/>
    <circle cx="98.1" cy="92.4" r="0.7" fill="#FFF"/>
    <!-- 喙 -->
    <path d="M 91 98 L 88 100.4 L 94 99.8 Z" fill="#C8B058"/>
    <!-- 耳羽 -->
    <path d="M 85 89 Q 83 86 85 85" stroke="#D8C090" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 99 89 Q 101 86 99 85" stroke="#D8C090" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 额间王光 -->
    <circle cx="92" cy="87" r="2.8" fill="#FCF4D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 示警波纹 -->
    <g stroke="#E0E8E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 100 90 Q 108 86 114 82">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 王光星尘 -->
  <g fill="#FCF4D8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
