<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精灵·六阶·精灵传说·暮光翼尖托小精灵传守护不看大小">
  <defs>
    <!-- 背景：花田暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C8A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#9CB49C"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 精灵光身 -->
    <linearGradient id="glowbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0E0"/>
      <stop offset="100%" stop-color="#E4D8B8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 花田 -->
  <g fill="#6E9E7A" opacity="0.4">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#86AE8A" opacity="0.8"/>

  <!-- 舒展的花（左，安） -->
  <g>
    <path d="M 42 148 L 42 140" stroke="#7E9E6E" stroke-width="1.2" stroke-linecap="round"/>
    <g fill="#F0A0B8">
      <circle cx="39.4" cy="136" r="3"/>
      <circle cx="44.6" cy="136" r="3"/>
      <circle cx="42" cy="133" r="3"/>
      <circle cx="42" cy="139" r="3"/>
      <circle cx="42" cy="136" r="1.8" fill="#F8E8A0"/>
    </g>
  </g>

  <!-- 小精灵（左下，扑翼学飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="62" cy="124" rx="5" ry="6.5" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.7"/>
    <!-- 翼（嫩，扑） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 58 118;10 58 118;-10 58 118" dur="1.6s" repeatCount="indefinite"/>
      <path d="M 58 118 Q 50 108 46 100 L 60 112 Z" fill="#F0E8F4" opacity="0.6"/>
      <path d="M 58 118 Q 66 108 70 100 L 56 112 Z" fill="#F0E8F4" opacity="0.6"/>
    </g>
  </g>
  <!-- 小精灵头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="62" cy="112" rx="4.5" ry="5" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.6"/>
    <circle cx="60" cy="111" r="1.2" fill="#24180E"/>
    <circle cx="60.3" cy="110.7" r="0.4" fill="#FFF"/>
    <circle cx="64.3" cy="111" r="1.2" fill="#24180E"/>
    <circle cx="64.6" cy="110.7" r="0.4" fill="#FFF"/>
    <path d="M 61 114 Q 62 114.8 63 114" fill="none" stroke="#C0B090" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M 60 109 Q 60 106 62 105 M 64 108 Q 65 106 67 107" stroke="#F0D8A0" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 光点（小） -->
    <circle cx="60" cy="118" r="1" fill="#FFF0D0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老精灵（翼尖托小精灵，传守护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="112" cy="110" rx="7" ry="9" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.8"/>
    <!-- 翼（大展，托） -->
    <path d="M 106 104 Q 92 92 84 82 L 108 98 Z" fill="#F0E8F4" opacity="0.65"/>
    <path d="M 106 104 Q 120 92 128 82 L 104 98 Z" fill="#F0E8F4" opacity="0.65"/>
    <!-- 翼尖（垂，托小精灵） -->
    <path d="M 84 82 Q 76 92 72 102" stroke="#F0E8F4" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 84 82;8 84 82;0 84 82" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 光点（洒） -->
    <g fill="#FFF0D0">
      <circle cx="104" cy="102" r="1.5">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 老精灵头（温和，传守护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="94" rx="5.5" ry="6" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.7"/>
    <circle cx="109.5" cy="93" r="1.4" fill="#24180E"/>
    <circle cx="109.8" cy="92.7" r="0.45" fill="#FFF"/>
    <circle cx="114.8" cy="93" r="1.4" fill="#24180E"/>
    <circle cx="115.1" cy="92.7" r="0.45" fill="#FFF"/>
    <path d="M 110 96.5 Q 112 97.6 114 96.5" fill="none" stroke="#C0B090" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M 109 91 Q 109 87 112 86 M 114 90 Q 116 87 118 88" stroke="#F0D8A0" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 传心微光 -->
    <circle cx="84" cy="104" r="6" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
