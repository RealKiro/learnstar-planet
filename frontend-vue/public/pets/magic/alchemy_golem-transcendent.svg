<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="炼金魔像·六阶·魔像传说·暮光扶正小魔像撞倒的试剂架石指碰光传石身护人">
  <defs>
    <!-- 背景：工坊暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C4A0"/>
      <stop offset="52%" stop-color="#D0A878"/>
      <stop offset="100%" stop-color="#9E9E94"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 古青石身（泛岁月光） -->
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8AA0AC"/>
      <stop offset="100%" stop-color="#6A808C"/>
    </linearGradient>
    <!-- 眼窝光 -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#A89C84" opacity="0.85"/>

  <!-- 被扶正的试剂架（中右，已正） -->
  <g>
    <rect x="112" y="126" width="42" height="5" rx="2" fill="#8E6E50" stroke="#6E5238" stroke-width="0.7"/>
    <path d="M 118 131 L 118 150 M 134 131 L 134 150 M 150 131 L 150 150" stroke="#8E6E50" stroke-width="2" stroke-linecap="round"/>
    <path d="M 122 112 L 122 126 L 132 126 L 132 112 Z" fill="#E8C860" opacity="0.85" rx="1"/>
  </g>

  <!-- 小魔像（右，眼窝光慌张，仰看） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 石腿 -->
    <path d="M 142 152 L 140 162 M 156 152 L 158 162" stroke="url(#stone)" stroke-width="6" stroke-linecap="round"/>
    <!-- 石身 -->
    <rect x="140" y="134" width="20" height="22" rx="7" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
    <!-- 篆纹 -->
    <path d="M 148 142 L 148 148 M 146 146 L 150 146" stroke="#C8B058" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- 石面（亮而慌张） -->
    <g>
      <rect x="140" y="116" width="20" height="17" rx="5" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
      <circle cx="146" cy="125" r="2.6" fill="#2E3E46"/>
      <circle cx="146" cy="125" r="2.1" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="146" cy="125" r="4.6" fill="#F8D080" opacity="0.34">
        <animate attributeName="opacity" values="0.34;0.14;0.34" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="154" cy="125" r="2.6" fill="#2E3E46"/>
      <circle cx="154" cy="125" r="2.1" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="154" cy="125" r="4.6" fill="#F8D080" opacity="0.34">
        <animate attributeName="opacity" values="0.34;0.14;0.34" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 老魔像（左，俯身扶正，裂纹如史，石指碰光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 石腿 -->
    <path d="M 70 138 L 64 158 M 96 138 L 102 158" stroke="url(#stone)" stroke-width="9" stroke-linecap="round"/>
    <!-- 石身（如史碑） -->
    <rect x="68" y="92" width="30" height="48" rx="10" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9" transform="rotate(6 83 116)"/>
    <!-- 裂纹如史（多道岁月纹） -->
    <path d="M 76 100 L 78 106 L 74 110" stroke="#4A5A66" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 88 98 L 90 103 L 87 107" stroke="#4A5A66" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 82 120 L 84 126" stroke="#4A5A66" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 篆纹（如史，微光） -->
    <path d="M 82 112 L 82 122 M 79 119 L 85 119" stroke="#F0D080" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 左臂（垂） -->
    <path d="M 74 102 L 66 122" stroke="url(#stone)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- 右臂（扶正试剂架，石指碰光） -->
    <path d="M 96 104 L 108 116 L 116 126" stroke="url(#stone)" stroke-width="8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 96 104;-4 96 104;0 96 104" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 石指（碰小魔像的光） -->
    <circle cx="118" cy="128" r="3" fill="url(#stone)" stroke="#4E6470" stroke-width="0.7"/>
    <!-- 传心微光（老→小） -->
    <circle cx="130" cy="126" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 石面（温和，目含慈） -->
    <g>
      <rect x="70" y="68" width="24" height="20" rx="6" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
      <path d="M 82 74 L 82 78" stroke="#4A5A66" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
      <circle cx="77" cy="79" r="2.5" fill="#2E3E46"/>
      <circle cx="77" cy="79" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.62;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="77" cy="79" r="4.8" fill="#F8D080" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.14;0.32" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="89" cy="79" r="2.5" fill="#2E3E46"/>
      <circle cx="89" cy="79" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.62;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="89" cy="79" r="4.8" fill="#F8D080" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.14;0.32" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
