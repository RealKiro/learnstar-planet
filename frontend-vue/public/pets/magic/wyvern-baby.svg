<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="飞龙·二阶·焰火之惧·学喷火失控燎焦草缩巢看烟">
  <defs>
    <!-- 背景：崖巢暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C4B0"/>
      <stop offset="52%" stop-color="#9EAC9A"/>
      <stop offset="100%" stop-color="#7E8E7E"/>
    </linearGradient>
    <!-- 火光 -->
    <radialGradient id="glow" cx="56%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#E8B878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8B878" stop-opacity="0"/>
    </radialGradient>
    <!-- 小飞龙皮（沾灰） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#669488"/>
      <stop offset="100%" stop-color="#527A6E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="112" cy="72" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 崖巢（右下） -->
  <g fill="#A0A8B0" opacity="0.5">
    <path d="M 120 200 L 130 168 Q 150 158 170 166 L 200 158 L 200 200 Z"/>
  </g>
  <path d="M 140 166 Q 152 158 168 164" stroke="#8E969E" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 被燎焦的巢边草（右） -->
  <g>
    <path d="M 168 162 L 166 154 M 172 163 L 172 155 M 176 164 L 178 156" stroke="#3A3028" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 170 162 L 168 156" stroke="#5E5040" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 焦烟 -->
    <g stroke="#6E6A5E" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M 170 154 Q 172 148 170 144">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 焦痕 -->
    <circle cx="170" cy="160" r="6" fill="#3A3028" opacity="0.4"/>
  </g>

  <!-- 小飞龙（缩巢，看烟） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（缩） -->
    <ellipse cx="150" cy="156" rx="10" ry="7.5" fill="url(#skin)" stroke="#46786C" stroke-width="0.9"/>
    <ellipse cx="147" cy="160" rx="6" ry="4" fill="#D8C088" opacity="0.7"/>
    <!-- 翼膜（微焦，收） -->
    <path d="M 146 152 L 136 148 L 138 156 Z" fill="#C8705A"/>
    <!-- 尾（垂） -->
    <path d="M 160 159 Q 167 160 169 164" stroke="url(#skin)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小飞龙头（看冒烟的嘴，惧） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="144" rx="7" ry="6" fill="url(#skin)" stroke="#46786C" stroke-width="0.8"/>
    <!-- 眼（惧） -->
    <circle cx="147" cy="142.5" r="1.8" fill="#24180E"/>
    <circle cx="147.5" cy="142.1" r="0.6" fill="#FFF"/>
    <circle cx="153.5" cy="142.5" r="1.8" fill="#24180E"/>
    <circle cx="154" cy="142.1" r="0.6" fill="#FFF"/>
    <!-- 嘴（冒烟） -->
    <path d="M 148 146.5 L 146 149 L 150 148.4 Z" fill="#46786C"/>
    <!-- 冒出的烟 -->
    <g stroke="#A8A49A" stroke-width="1.1" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M 150 146 Q 152 142 150 139">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 头上角 -->
    <path d="M 147 139 L 146 136 M 152 139 L 154 136" stroke="#6E9E8E" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 火光星尘 -->
  <g fill="#E8B878">
    <circle cx="96" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
