<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="龙骑士·一阶·幼龙之伴·爬龙背被颠滚成团拍鼻笑">
  <defs>
    <!-- 背景：草原晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE8CC"/>
      <stop offset="52%" stop-color="#BCCEA8"/>
      <stop offset="100%" stop-color="#92AC82"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼龙皮 -->
    <linearGradient id="dragon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9E8E"/>
      <stop offset="100%" stop-color="#56847A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远丘 -->
  <g fill="#6E9E78" opacity="0.3">
    <path d="M 0 108 Q 50 102 110 106 Q 160 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#86AE7E" opacity="0.8"/>

  <!-- 幼龙（青鳞，被爬） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="118" cy="132" rx="18" ry="12" fill="url(#dragon)" stroke="#46786C" stroke-width="1"/>
    <!-- 腹 -->
    <ellipse cx="114" cy="137" rx="10" ry="6" fill="#D8E0D4" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 106 141 L 104 148 M 132 141 L 134 148" stroke="#46786C" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 136 136 Q 146 132 150 126" stroke="url(#dragon)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 136 136;6 136 136;0 136 136" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 小翼（展开） -->
    <path d="M 108 126 L 98 116 L 104 126 Z" fill="url(#dragon)" stroke="#46786C" stroke-width="0.7"/>
    <path d="M 130 126 L 140 116 L 134 126 Z" fill="url(#dragon)" stroke="#46786C" stroke-width="0.7"/>
  </g>

  <!-- 幼龙头（回望笑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="102" cy="120" rx="10" ry="8.5" fill="url(#dragon)" stroke="#46786C" stroke-width="0.9"/>
    <!-- 眼（笑弯） -->
    <path d="M 96 118 Q 98 116.6 100 118 M 105 118 Q 107 116.6 108 118" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 鼻/嘴（被拍，笑） -->
    <path d="M 100 123 L 98 125.4 L 102 124.8 Z" fill="#46786C"/>
    <!-- 头上角 -->
    <path d="M 96 114 L 93 108 M 107 114 L 110 108" stroke="#6E9E8E" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 小骑士（被颠下，滚成一团，拍鼻笑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（滚地） -->
    <ellipse cx="76" cy="140" rx="10" ry="7" fill="#D8C0A0" stroke="#C0A888" stroke-width="0.9" transform="rotate(-15 76 140)"/>
    <!-- 软皮甲 -->
    <path d="M 70 136 L 82 138 L 80 144 L 68 142 Z" fill="#A8886E" opacity="0.8"/>
    <!-- 圆盾（旁） -->
    <circle cx="60" cy="146" r="4" fill="#C8B058" stroke="#A89838" stroke-width="0.7"/>
    <!-- 手（拍鼻，笑） -->
    <path d="M 82 134 Q 88 130 92 128" stroke="#D8C0A0" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 82 134;-8 82 134;0 82 134" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小骑士头（笑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="80" cy="126" rx="8" ry="8" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <!-- 眼（笑弯） -->
    <path d="M 75 124 Q 77 122.6 79 124 M 82 124 Q 84 122.6 85 124" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <!-- 嘴（大笑） -->
    <path d="M 77 129 Q 80 130.8 83 129" fill="none" stroke="#B08A6A" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 短发 -->
    <path d="M 77 120 Q 80 117 83 120 M 80 118 L 80 116" stroke="#8E6E4E" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
