<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="独角兽·四阶·净化初成·角抵水面光漾化污鱼群重游绕蹄">
  <defs>
    <!-- 背景：林间小溪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E4D8"/>
      <stop offset="52%" stop-color="#B0C8BC"/>
      <stop offset="100%" stop-color="#90AC9E"/>
    </linearGradient>
    <!-- 净光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#F0FCF4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0FCF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 独角兽毛（如雪） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 小溪 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EB8C8" opacity="0.75"/>
  <g stroke="#B0D0DC" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 30 162 Q 70 158 110 162 Q 150 166 190 162">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 净化漾开的光（角抵水面） -->
  <g>
    <circle cx="100" cy="150" r="8" fill="#F0FCF4" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="150" r="15" fill="none" stroke="#F0FCF4" stroke-width="1" opacity="0.3">
      <animateTransform attributeName="transform" type="scale" values="1 1;1.4 1.4;1 1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 鱼群重游（绕蹄） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 56 156 L 64 154 L 62 158 Z" fill="#C0A888"/>
    <path d="M 68 160 L 76 158 L 74 162 Z" fill="#C0A888"/>
    <path d="M 62 164 L 70 162 L 68 166 Z" fill="#C0A888"/>
    <path d="M 120 160 L 128 158 L 126 162 Z" fill="#C0A888"/>
  </g>

  <!-- 少年独角兽（角抵水面净化） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="132" rx="15" ry="10.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 腿（溪边） -->
    <path d="M 95 139 L 93 148 M 115 139 L 117 148" stroke="#C8C2B8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 119 136 Q 128 132 132 126" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 119 136;6 119 136;0 119 136" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年独角兽头（低头角抵水面） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="112" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 眼（专注含亮） -->
    <circle cx="99.5" cy="110" r="2.3" fill="#24180E"/>
    <circle cx="100.1" cy="109.4" r="0.75" fill="#FFF"/>
    <circle cx="109.5" cy="110" r="2.3" fill="#24180E"/>
    <circle cx="110.1" cy="109.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="104" cy="115" rx="1.6" ry="1.2" fill="#C8A0A0"/>
    <!-- 嘴 -->
    <path d="M 100 118 Q 104 119.4 108 118" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 耳 -->
    <path d="M 95 106 L 91 99 L 99 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 113 106 L 117 99 L 109 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <!-- 独角（亮，抵水） -->
    <path d="M 104 105 L 104 97" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="104" cy="96" r="2.8" fill="#F0FCF4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 净光星尘 -->
  <g fill="#F0FCF4">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
