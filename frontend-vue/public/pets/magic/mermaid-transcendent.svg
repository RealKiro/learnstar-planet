<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="美人鱼·六阶·美人鱼传说·浅湾暮光尾碰小美人鱼传歌为引航">
  <defs>
    <!-- 背景：浅湾暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C8A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#8EB0BC"/>
    </linearGradient>
    <!-- 暮光金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 美人鱼尾鳞 -->
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EC8B8"/>
      <stop offset="100%" stop-color="#52AC9C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 海面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9EAC" opacity="0.8"/>
  <g stroke="#9EBEBC" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 158 Q 60 155 90 158 Q 120 161 150 158"/>
  </g>

  <!-- 纸船（左下，飘远） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 40 152 L 56 150 L 62 156 L 36 156 Z" fill="#F0E4C8"/>
    <path d="M 42 150 L 50 147 L 58 150 Z" fill="#E8D4A8"/>
  </g>

  <!-- 小美人鱼（左下，摆尾学游） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鱼尾（笨摆） -->
    <path d="M 56 138 Q 64 146 70 152" stroke="url(#tail)" stroke-width="4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 56 138;8 56 138;0 56 138" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 68 152 Q 74 156 72 162 Q 64 158 68 152 Z" fill="url(#tail)" stroke="#48A08E" stroke-width="0.6"/>
    <!-- 上身 -->
    <ellipse cx="54" cy="132" rx="6" ry="7" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
  </g>
  <!-- 小美人鱼头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="54" cy="120" rx="6" ry="6.5" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <circle cx="51" cy="119" r="1.5" fill="#24180E"/>
    <circle cx="51.4" cy="118.6" r="0.5" fill="#FFF"/>
    <circle cx="57.5" cy="119" r="1.5" fill="#24180E"/>
    <circle cx="57.9" cy="118.6" r="0.5" fill="#FFF"/>
    <path d="M 52 123 Q 54 124.2 56 123" fill="none" stroke="#C09880" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M 51 115 Q 48 110 45 108" stroke="#5A8A80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 57 115 Q 60 110 63 108" stroke="#5A8A80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老美人鱼（尾碰小美人鱼，传歌为引航） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 鱼尾（垂，碰小美人鱼） -->
    <path d="M 96 138 Q 104 134 112 132" stroke="url(#tail)" stroke-width="5" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 96 138;-5 96 138;0 96 138" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍（轻碰） -->
    <path d="M 112 132 Q 116 128 118 124" stroke="url(#tail)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 上身 -->
    <ellipse cx="94" cy="128" rx="8" ry="9" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 贝壳饰 -->
    <path d="M 91 132 Q 90 136 94 136 Q 98 136 97 132 Z" fill="#E8B8B0" opacity="0.8"/>
  </g>

  <!-- 老美人鱼头（温和，传歌） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="94" cy="112" rx="7.5" ry="8" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <circle cx="90.5" cy="111" r="1.7" fill="#24180E"/>
    <circle cx="90.9" cy="110.6" r="0.55" fill="#FFF"/>
    <circle cx="97.5" cy="111" r="1.7" fill="#24180E"/>
    <circle cx="97.9" cy="110.6" r="0.55" fill="#FFF"/>
    <path d="M 91 116 Q 94 117.4 97 116" fill="none" stroke="#C09880" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M 90 107 Q 85 100 80 98" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 98 107 Q 103 100 108 98" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 90 104 Q 83 104 78 107" stroke="#5A8A80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 额贝饰 -->
    <circle cx="94" cy="106" r="1.6" fill="#F0E4C8"/>
    <!-- 传心微光 -->
    <circle cx="74" cy="120" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
