<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="元素灯灵·三阶·炼光苦修·风口练燃光焰心稳风过光不灭">
  <defs>
    <!-- 背景：风口夜色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283650"/>
      <stop offset="52%" stop-color="#1C2840"/>
      <stop offset="100%" stop-color="#162030"/>
    </linearGradient>
    <!-- 炼光神光 -->
    <radialGradient id="glow" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
    <!-- 焰身（稳） -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8D080"/>
      <stop offset="100%" stop-color="#E87830"/>
    </linearGradient>
    <!-- 光环 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="84" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 环绕的风痕（吹过，光不灭） -->
  <g stroke="#8EA4BC" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 24 70 Q 44 64 58 66">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 142 58 Q 158 54 174 56">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 40 110 Q 56 106 68 108">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 120 Q 148 116 162 118">
      <animateTransform attributeName="transform" type="translate" values="0 0;9 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 少年灯灵（浮空，焰心稳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 光环（稳而亮） -->
    <circle cx="100" cy="84" r="16" fill="url(#aura)">
      <animate attributeName="opacity" values="0.45;0.26;0.45" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身 -->
    <path d="M 100 68 Q 109 77 109 86 Q 109 95 100 95 Q 91 95 91 86 Q 91 77 100 68 Z" fill="url(#flame)" stroke="#B85A28" stroke-width="0.8"/>
    <!-- 焰发（如灯，稳） -->
    <path d="M 97 68 Q 94 58 98 54 Q 100 62 101 61 Q 104 52 107 55 Q 105 62 103 68" fill="#F8D080" stroke="#D87828" stroke-width="0.5"/>
    <!-- 眼（专注） -->
    <circle cx="96.5" cy="82" r="1.6" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="103.5" cy="82" r="1.6" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光（稳曳） -->
    <path d="M 100 95 Q 100 103 104 108" stroke="#F8C860" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-3 100 95;3 100 95;-3 100 95" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="104" cy="110" r="2.4" fill="#F8D080">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#F8D080">
    <circle cx="46" cy="130">
      <animate attributeName="cy" values="130;122;130" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
