<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="炼金魔像·二阶·力量之惧·看自己石拳矿粉撒木架倒缩墙角">
  <defs>
    <!-- 背景：工坊昏暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#A08060"/>
      <stop offset="100%" stop-color="#8E7260"/>
    </linearGradient>
    <!-- 弱灯火 -->
    <radialGradient id="glow" cx="55%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#F0D8A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0D8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青石身 -->
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#748A96"/>
      <stop offset="100%" stop-color="#586E7A"/>
    </linearGradient>
    <!-- 眼窝光（暗） -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C060" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E8C060" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="110" cy="44" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 矿粉（右，撒一地） -->
  <g fill="#9E8268" opacity="0.8">
    <ellipse cx="140" cy="152" rx="12" ry="3"/>
    <ellipse cx="160" cy="156" rx="8" ry="2.5"/>
  </g>
  <g fill="#6E5A46" opacity="0.9">
    <circle cx="146" cy="146" r="2"/>
    <circle cx="154" cy="150" r="1.6"/>
    <circle cx="136" cy="150" r="1.8"/>
  </g>

  <!-- 倒下的木架（右） -->
  <g>
    <path d="M 130 128 L 174 160 L 178 154 L 134 122 Z" fill="#8E6E50" stroke="#6E5238" stroke-width="0.9"/>
    <path d="M 144 132 L 162 147" stroke="#6E5238" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 青石魔像（缩墙角，看自己石拳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 石腿（缩，蹲） -->
    <path d="M 84 130 L 80 146 M 102 130 L 106 146" stroke="url(#stone)" stroke-width="7" stroke-linecap="round"/>
    <!-- 石身（蜷，微缩） -->
    <rect x="82" y="98" width="24" height="34" rx="9" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9" transform="rotate(-6 94 114)"/>
    <!-- 篆纹（身侧） -->
    <path d="M 88 110 L 88 116 M 86 114 L 90 114" stroke="#C8B058" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- 抬起的石拳（看拳，举到面前） -->
    <path d="M 84 106 L 74 118" stroke="url(#stone)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 84 106;-5 84 106;0 84 106" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 石拳 -->
    <circle cx="72" cy="124" r="4.5" fill="url(#stone)" stroke="#4E6470" stroke-width="0.8"/>
    <circle cx="72" cy="122.5" r="1" fill="#9E8268" opacity="0.8"/>
    <!-- 垂下的石臂 -->
    <path d="M 104 106 L 112 124" stroke="url(#stone)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 石面（眼窝光暗，惧） -->
    <g>
      <rect x="84" y="76" width="22" height="19" rx="6" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9" transform="rotate(-6 95 85)"/>
      <!-- 左眼窝（暗） -->
      <circle cx="90" cy="86" r="2.4" fill="#2E3E46"/>
      <circle cx="90" cy="86" r="1.8" fill="url(#eye)">
        <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <!-- 右眼窝（暗） -->
      <circle cx="100" cy="86" r="2.4" fill="#2E3E46"/>
      <circle cx="100" cy="86" r="1.8" fill="url(#eye)">
        <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 尘灰 -->
  <g fill="#E8D8B8" opacity="0.6">
    <circle cx="52" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="70">
      <animate attributeName="cy" values="70;62;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
