<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精灵·三阶·练翼苦修·迎风练飞稳盘旋引露滴进枯花心">
  <defs>
    <!-- 背景：花田风口 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4D4"/>
      <stop offset="52%" stop-color="#B8CCBC"/>
      <stop offset="100%" stop-color="#98AC9E"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F8F8EC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F8F8EC" stop-opacity="0"/>
    </radialGradient>
    <!-- 精灵光身（渐亮） -->
    <linearGradient id="glowbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0E0"/>
      <stop offset="100%" stop-color="#E8DCBC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风痕 -->
  <g stroke="#E4ECE0" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 10 60 Q 50 54 90 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 花田 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#86AE8A" opacity="0.8"/>

  <!-- 枯叶的花（右，被滴露） -->
  <g>
    <path d="M 140 150 L 140 142" stroke="#7E9E6E" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 138 141 Q 140 138 142 141 Z" fill="#C8B088"/>
    <!-- 滴下的露（引） -->
    <circle cx="140" cy="138" r="1.4" fill="#DCE8F0" opacity="0.8">
      <animate attributeName="cy" values="138;134;138" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="144" r="2.2" fill="#DCE8F0" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年精灵（迎风练飞稳，引露） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="96" cy="116" rx="7" ry="9" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.8"/>
    <!-- 翼（迎风，稳） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 90 110;8 90 110;-8 90 110" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 90 110 Q 80 98 74 88 L 92 104 Z" fill="#F0E8F4" opacity="0.6"/>
      <path d="M 90 110 Q 100 98 106 88 L 88 104 Z" fill="#F0E8F4" opacity="0.6"/>
    </g>
    <!-- 指尖引露（右伸） -->
    <path d="M 100 116 Q 108 112 114 108" stroke="#D0C098" stroke-width="1.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 100 116;8 100 116;0 100 116" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 指尖露珠 -->
    <circle cx="115" cy="107" r="1.6" fill="#DCE8F0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 光点（更亮） -->
    <g fill="#F8F8EC">
      <circle cx="92" cy="110" r="1.4">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 少年精灵头（专注，稳飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="100" rx="6" ry="6.5" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.7"/>
    <!-- 眼（专注） -->
    <circle cx="93" cy="99" r="1.5" fill="#24180E"/>
    <circle cx="93.4" cy="98.6" r="0.5" fill="#FFF"/>
    <circle cx="99" cy="99" r="1.5" fill="#24180E"/>
    <circle cx="99.4" cy="98.6" r="0.5" fill="#FFF"/>
    <!-- 笑（稳了） -->
    <path d="M 94 103 Q 96 104.2 98 103" fill="none" stroke="#C0B090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 发 -->
    <path d="M 92 96 Q 92 92 96 91 M 98 95 Q 100 92 102 93" stroke="#F0D8A0" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F8EC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
