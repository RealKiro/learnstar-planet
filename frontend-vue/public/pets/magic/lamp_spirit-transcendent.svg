<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="元素灯灵·六阶·灯灵传说·暮色尾光碰小灯灵的光传光为照路走失童安睡">
  <defs>
    <!-- 背景：长街暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="52%" stop-color="#967A62"/>
      <stop offset="100%" stop-color="#4A4450"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 焰身（如古灯） -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E4A0"/>
      <stop offset="100%" stop-color="#E08840"/>
    </linearGradient>
    <!-- 光晕 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="96" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 安睡的窗（右，走失童已归家） -->
  <g>
    <rect x="156" y="84" width="34" height="40" rx="2" fill="#8E8270" stroke="#6E6256" stroke-width="1"/>
    <rect x="162" y="90" width="22" height="20" rx="1" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <path d="M 166 92 L 168 100 M 176 92 L 174 100" stroke="#6E6256" stroke-width="1" stroke-linecap="round"/>
    <circle cx="171" cy="97" r="3.4" fill="#E8D0B4" stroke="#C8B090" stroke-width="0.5"/>
    <path d="M 171 100 L 171 104" stroke="#D8C0A0" stroke-width="1" stroke-linecap="round"/>
    <path d="M 170 106 Q 171 107 172 106" fill="none" stroke="#B0905E" stroke-width="0.8"/>
  </g>

  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#3E3842" opacity="0.9"/>

  <!-- 小灯灵（右，光点颤颤，探出） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="128" cy="120" r="11" fill="url(#aura)">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身（小） -->
    <path d="M 128 110 Q 134 116 134 121 Q 134 126 128 126 Q 122 126 122 121 Q 122 116 128 110 Z" fill="url(#flame)" stroke="#B85A28" stroke-width="0.7"/>
    <!-- 焰发 -->
    <path d="M 126 110 Q 124 105 127 103 Q 128 108 129 107 Q 131 102 133 104 Q 132 109 130 110" fill="#F8D080" stroke="#D87828" stroke-width="0.5"/>
    <!-- 眼（颤颤，望老灯灵） -->
    <circle cx="125.5" cy="119" r="1.4" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130.5" cy="119" r="1.4" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光（小） -->
    <path d="M 128 126 Q 128 130 130 133" stroke="#F8C860" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="-3 128 126;3 128 126;-3 128 126" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="130" cy="134" r="2" fill="#F8D080">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老灯灵（左，尾光碰小灯灵的光，传照路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 大光环（如古灯） -->
    <circle cx="76" cy="96" r="20" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身（大，如古灯） -->
    <path d="M 76 74 Q 87 84 87 97 Q 87 109 76 109 Q 65 109 65 97 Q 65 84 76 74 Z" fill="url(#flame)" stroke="#B86828" stroke-width="0.9"/>
    <!-- 焰发（如金） -->
    <path d="M 72 74 Q 68 62 73 57 Q 76 67 77 66 Q 81 54 85 58 Q 82 67 80 74" fill="#F8E4A0" stroke="#D07828" stroke-width="0.5"/>
    <!-- 眼（温和，目含慈） -->
    <circle cx="71.5" cy="94" r="1.8" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80.5" cy="94" r="1.8" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光（伸向小灯灵，碰光） -->
    <path d="M 76 109 Q 86 118 100 120" stroke="#F8E4A0" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-3 76 109;3 76 109;-3 76 109" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光（老尾光→小灯灵） -->
    <circle cx="104" cy="116" r="9" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
