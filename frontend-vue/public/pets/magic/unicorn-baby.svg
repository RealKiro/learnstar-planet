<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="独角兽·二阶·角未亮之惑·角暗点水无效小兽失望离开">
  <defs>
    <!-- 背景：污浊水塘 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B4A4"/>
      <stop offset="52%" stop-color="#8E9C8C"/>
      <stop offset="100%" stop-color="#6E7E72"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#D8E0D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D8E0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 独角兽毛（沾雾） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F2EC"/>
      <stop offset="100%" stop-color="#DCD8D0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 污浊水塘 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E8E78" opacity="0.85"/>
  <!-- 污水泡 -->
  <g fill="#9A9A82" opacity="0.7">
    <circle cx="60" cy="162" r="1.8">
      <animate attributeName="cy" values="162;158;162" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="158" r="1.4">
      <animate attributeName="cy" values="158;154;158" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="164" r="1.6">
      <animate attributeName="cy" values="164;160;164" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.28;0.65" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 失望离开的小兽（右，咳嗽） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="156" cy="142" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="156" cy="135" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 152 141 L 150 146 M 160 141 L 162 146" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 小独角兽（蹲水边，角暗） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="136" rx="14" ry="10" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 96 143 L 94 149 M 114 143 L 116 149" stroke="#B8B2A8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 118 140 Q 126 142 128 147" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小独角兽头（角暗，低头看水） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="116" rx="10" ry="9" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.9"/>
    <!-- 眼（惑） -->
    <circle cx="99.5" cy="114" r="2.3" fill="#24180E"/>
    <circle cx="100.1" cy="113.4" r="0.75" fill="#FFF"/>
    <circle cx="109.5" cy="114" r="2.3" fill="#24180E"/>
    <circle cx="110.1" cy="113.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="104" cy="119" rx="1.6" ry="1.2" fill="#C8A0A0"/>
    <!-- 嘴 -->
    <path d="M 100 122 Q 104 123.4 108 122" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 耳 -->
    <path d="M 95 110 L 91 104 L 99 108 Z" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.6"/>
    <path d="M 113 110 L 117 104 L 109 108 Z" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.6"/>
    <!-- 独角（暗） -->
    <path d="M 104 109 L 104 101" stroke="#C8C0B0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 点水无效（无光） -->
    <circle cx="104" cy="100" r="1.6" fill="#B0A890" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#D8E0D0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
