<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梦魇夜马·三阶·练夜苦修·最黑夜里蹄光稳稳鬃光引幼兽回窝">
  <defs>
    <!-- 背景：黑林夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28344A"/>
      <stop offset="52%" stop-color="#1A2434"/>
      <stop offset="100%" stop-color="#141C28"/>
    </linearGradient>
    <!-- 月侧光 -->
    <radialGradient id="moon" cx="22%" cy="18%" r="46%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 鬃毛月光 -->
    <radialGradient id="mane" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8D0E8" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="44" cy="36" r="66" fill="url(#moon)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="36" r="12" fill="#E8F0F8" opacity="0.9"/>

  <!-- 黑林 -->
  <g fill="#0E121C" opacity="0.9">
    <path d="M 0 70 L 6 38 L 12 66 L 18 44 L 24 74 L 0 200 L 0 74 Z"/>
    <path d="M 178 64 L 188 30 L 196 60 L 200 52 L 200 200 L 178 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 被引回窝的幼兽（右，跟随光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="158" cy="138" rx="8" ry="6" fill="#6E5A46" stroke="#4E3E30" stroke-width="0.8"/>
    <path d="M 154 140 L 152 146 M 164 140 L 166 146" stroke="#4E3E30" stroke-width="2" stroke-linecap="round"/>
    <path d="M 166 138 Q 172 136 174 142" stroke="#6E5A46" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 头（回头望光） -->
    <ellipse cx="148" cy="130" rx="5" ry="4.5" fill="#6E5A46" stroke="#4E3E30" stroke-width="0.8"/>
    <path d="M 145 127 L 143 123 L 147 126 Z" fill="#6E5A46"/>
    <path d="M 150 127 L 152 123 L 149 126 Z" fill="#6E5A46"/>
    <circle cx="145.5" cy="129" r="1.2" fill="#24180E"/>
    <circle cx="149" cy="129" r="1.2" fill="#24180E"/>
  </g>
  <!-- 引路光带（鬃→幼兽） -->
  <path d="M 120 104 Q 138 110 150 122" stroke="#C8DCE8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 少年梦魇马（蹄光稳稳，引路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 76 132 L 74 146 M 88 132 L 88 146" stroke="#1E202C" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 前腿 -->
    <path d="M 100 130 L 100 144 M 112 128 L 114 142" stroke="#1E202C" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="94" cy="126" rx="20" ry="10" fill="#242634" stroke="#0E0E16" stroke-width="0.9"/>
    <!-- 颈 -->
    <path d="M 110 120 Q 122 108 130 98" stroke="#242634" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- 头 -->
    <ellipse cx="136" cy="94" rx="8" ry="6" fill="#242634" stroke="#0E0E16" stroke-width="0.8"/>
    <path d="M 132 89 L 130 82 L 136 88 Z" fill="#242634" stroke="#0E0E16" stroke-width="0.6"/>
    <circle cx="139" cy="93" r="1.6" fill="#E8F0F8">
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 鬃毛如纱 -->
    <g fill="none" stroke="#D8E8F4" stroke-linecap="round" opacity="0.95">
      <path d="M 132 90 Q 120 80 106 84" stroke-width="2.2"/>
      <path d="M 130 94 Q 116 86 102 90" stroke-width="1.8" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="-2 130 94;2 130 94;-2 130 94" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 128 98 Q 114 92 104 96" stroke-width="1.4" opacity="0.6"/>
    </g>
    <circle cx="112" cy="86" r="8" fill="url(#mane)">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾毛 -->
    <path d="M 76 126 Q 62 122 56 130 Q 52 138 60 142" stroke="#D8E8F4" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-3 76 126;3 76 126;-3 76 126" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="64" cy="128" r="7" fill="url(#mane)">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 蹄光稳稳 -->
    <g fill="#C8DCE8" opacity="0.8">
      <circle cx="75" cy="147" r="1.7">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="87" cy="147" r="1.5">
        <animate attributeName="opacity" values="0.7;0.35;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="101" cy="145" r="1.6">
        <animate attributeName="opacity" values="0.75;0.38;0.75" dur="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 月尘 -->
  <g fill="#E8F0F8">
    <circle cx="70" cy="98">
      <animate attributeName="cy" values="98;90;98" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
