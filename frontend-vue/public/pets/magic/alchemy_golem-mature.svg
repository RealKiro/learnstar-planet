<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="炼金魔像·四阶·守护初成·石身硬扛横梁护主人石肩裂纹">
  <defs>
    <!-- 背景：塌方工坊尘光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E8070"/>
      <stop offset="52%" stop-color="#6E6256"/>
      <stop offset="100%" stop-color="#5A5048"/>
    </linearGradient>
    <!-- 尘光柱 -->
    <radialGradient id="glow" cx="50%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#E8DCC0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8DCC0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青石身 -->
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A909C"/>
      <stop offset="100%" stop-color="#5E7480"/>
    </linearGradient>
    <!-- 眼窝光（亮而坚） -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="40" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 散落碎石 -->
  <g fill="#7A6E60" opacity="0.9">
    <path d="M 20 152 L 30 146 L 36 154 Z"/>
    <path d="M 168 148 L 178 142 L 182 150 Z"/>
    <circle cx="58" cy="156" r="2.5"/>
  </g>

  <!-- 压下的横梁（左上→右下，压肩） -->
  <g>
    <path d="M 24 62 L 156 120" stroke="#6E5238" stroke-width="13" stroke-linecap="round"/>
    <path d="M 30 60 L 44 68 M 60 72 L 74 80 M 92 84 L 106 92 M 124 100 L 138 108" stroke="#543E28" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 被护的主人（右下，蜷在魔像旁） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="122" cy="140" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="122" cy="152" rx="5.5" ry="7" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8" transform="rotate(-20 122 152)"/>
    <!-- 抱头的手 -->
    <path d="M 118 146 Q 116 140 118 136" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 127 146 Q 130 141 128 137" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 青石魔像（扛梁，护主） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.2s" repeatCount="indefinite"/>
    <!-- 石腿（扎稳） -->
    <path d="M 84 132 L 78 156 M 110 132 L 118 156" stroke="url(#stone)" stroke-width="9" stroke-linecap="round"/>
    <!-- 石身（扛梁，前倾） -->
    <rect x="84" y="100" width="28" height="40" rx="10" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9" transform="rotate(-10 98 120)"/>
    <!-- 篆纹 -->
    <path d="M 92 116 L 92 124 M 90 122 L 94 122" stroke="#C8B058" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
    <!-- 石肩（顶梁处，裂纹） -->
    <path d="M 92 100 Q 100 94 112 104" stroke="url(#stone)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 102 96 L 104 102 L 100 106 L 104 110" stroke="#4A5A66" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 双臂（撑梁） -->
    <path d="M 90 106 L 82 96 L 78 84" stroke="url(#stone)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 112 108 L 122 100 L 130 92" stroke="url(#stone)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- 石面（仰看梁，坚） -->
    <g>
      <rect x="88" y="74" width="22" height="19" rx="6" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9" transform="rotate(6 99 83)"/>
      <circle cx="94" cy="84" r="2.4" fill="#2E3E46"/>
      <circle cx="94" cy="84" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="94" cy="84" r="4.5" fill="#F8D080" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.14;0.32" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="84" r="2.4" fill="#2E3E46"/>
      <circle cx="104" cy="84" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="84" r="4.5" fill="#F8D080" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.14;0.32" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 尘灰 -->
  <g fill="#E8DCC0" opacity="0.55">
    <circle cx="52" cy="102">
      <animate attributeName="cy" values="102;94;102" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;78;86" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
