<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="灰袍智者·三阶·学艺苦修·翻烂书边查字练咒稳当光亮">
  <defs>
    <!-- 背景：塔楼藏书阁晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8CCB8"/>
      <stop offset="52%" stop-color="#B8AC98"/>
      <stop offset="100%" stop-color="#9A8E7A"/>
    </linearGradient>
    <!-- 知识光 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F0E8D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0E8D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年灰袍（整洁） -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8A8A8"/>
      <stop offset="100%" stop-color="#8E8E8E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 书架（满） -->
  <g>
    <path d="M 14 100 L 66 100 L 66 152 L 14 152 Z" fill="#7E6E56"/>
    <g stroke="#9A8A6E" stroke-width="1.4">
      <path d="M 14 112 L 66 112 M 14 124 L 66 124 M 14 136 L 66 136"/>
    </g>
    <g fill="#C8A050">
      <rect x="18" y="102" width="6" height="10"/>
      <rect x="26" y="102" width="6" height="10" fill="#C86050"/>
      <rect x="34" y="102" width="6" height="10" fill="#50A0C8"/>
      <rect x="18" y="114" width="6" height="10" fill="#80B060"/>
      <rect x="26" y="114" width="6" height="10" fill="#A050A0"/>
    </g>
  </g>

  <!-- 摊开的咒语书（右，光） -->
  <g>
    <path d="M 120 132 L 176 128 L 180 150 L 124 154 Z" fill="#E8DCB8"/>
    <g stroke="#B8A878" stroke-width="0.6">
      <path d="M 128 136 L 172 132 M 128 140 L 172 136 M 128 144 L 172 140"/>
    </g>
    <!-- 书页间亮起的光 -->
    <circle cx="150" cy="140" r="12" fill="#F0E8D0" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.18;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年灰袍（翻书练咒） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <path d="M 88 150 L 88 112 Q 88 102 96 102 L 96 150 Z" fill="url(#robe)" stroke="#7A7A7A" stroke-width="0.9"/>
    <!-- 腰系书签（满带） -->
    <path d="M 88 128 L 96 128" stroke="#C8A050" stroke-width="1.4"/>
    <path d="M 96 130 L 104 130" stroke="#C86050" stroke-width="1.2"/>
    <!-- 伸向书的指尖 -->
    <path d="M 96 116 Q 106 120 114 126" stroke="#C8B89A" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 96 116;6 96 116;0 96 116" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年灰袍头（专注，镜反光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="88" cy="92" rx="8" ry="8" fill="#E8D8C0" stroke="#C8B89A" stroke-width="0.7"/>
    <!-- 圆镜（反光） -->
    <circle cx="84" cy="91" r="2.6" fill="none" stroke="#8E8E82" stroke-width="0.8"/>
    <circle cx="92" cy="91" r="2.6" fill="none" stroke="#8E8E82" stroke-width="0.8"/>
    <path d="M 86.6 91 L 89.4 91" stroke="#8E8E82" stroke-width="0.6"/>
    <!-- 镜后眼（专注） -->
    <circle cx="84" cy="91" r="1.2" fill="#24180E"/>
    <circle cx="92" cy="91" r="1.2" fill="#24180E"/>
    <!-- 嘴（默念） -->
    <path d="M 85 96 Q 88 97.2 91 96" fill="none" stroke="#A8886A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 头发束起 -->
    <path d="M 86 86 Q 88 82 90 86" stroke="#6E5638" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 额间知识光 -->
    <circle cx="88" cy="85" r="2.4" fill="#F0E8D0" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 知识光星尘 -->
  <g fill="#F0E8D0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
