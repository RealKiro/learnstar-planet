<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮鹫·六阶·狮鹫传说·暮色翼尖托小狮鹫传鹰眼狮心皆为护">
  <defs>
    <!-- 背景：群山暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C4A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#A0AEAC"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 老狮鹫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#B8A070"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F0F4F0" opacity="0.85">
    <path d="M 0 132 Q 50 124 110 130 Q 160 134 200 128 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 崖 -->
  <g fill="#A0A8AC" opacity="0.5">
    <path d="M 140 200 L 146 176 Q 162 170 180 174 L 200 170 L 200 200 Z"/>
  </g>

  <!-- 安卧的小兽（左下崖上） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="48" cy="146" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="48" cy="139" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 小狮鹫（左下，学扑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（嫩） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 66 112;10 66 112;-10 66 112" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 62 116 L 52 110 L 56 118 Z" fill="#C8A878"/>
      <path d="M 62 116 L 72 110 L 68 118 Z" fill="#C8A878"/>
    </g>
    <!-- 身 -->
    <ellipse cx="64" cy="120" rx="6.5" ry="4.8" fill="url(#fur)" stroke="#9E8256" stroke-width="0.7"/>
  </g>
  <!-- 小狮鹫头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="112" rx="5.5" ry="5" fill="url(#fur)" stroke="#9E8256" stroke-width="0.7"/>
    <circle cx="61.5" cy="110.5" r="1.4" fill="#D89020"/>
    <circle cx="61.9" cy="110.1" r="0.45" fill="#FFF"/>
    <circle cx="66.5" cy="110.5" r="1.4" fill="#D89020"/>
    <circle cx="66.9" cy="110.1" r="0.45" fill="#FFF"/>
    <path d="M 63 114 L 61.6 116.4 L 64.4 115.8 Z" fill="#C8B058"/>
  </g>

  <!-- 老狮鹫（翼尖托小狮鹫，传护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 鹰翼（大展） -->
    <path d="M 92 108 L 58 92 L 66 104 L 46 94 L 62 108 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="1"/>
    <path d="M 92 108 L 126 92 L 118 104 L 138 94 L 122 108 Z" fill="url(#fur)" stroke="#9E8256" stroke-width="1"/>
    <!-- 翼尖（垂，托小狮鹫） -->
    <path d="M 62 108 Q 58 114 56 118" stroke="url(#fur)" stroke-width="1.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 62 108;8 62 108;0 62 108" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 狮身 -->
    <ellipse cx="96" cy="112" rx="9" ry="6.5" fill="url(#fur)" stroke="#9E8256" stroke-width="0.9"/>
    <!-- 狮尾 -->
    <path d="M 104 114 L 114 116 L 117 120" stroke="#C8A878" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老狮鹫头（温和，传护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="102" rx="8" ry="7" fill="url(#fur)" stroke="#9E8256" stroke-width="0.8"/>
    <circle cx="92.5" cy="100.5" r="1.9" fill="#D89020"/>
    <circle cx="92.9" cy="100.1" r="0.6" fill="#FFF"/>
    <circle cx="99.5" cy="100.5" r="1.9" fill="#D89020"/>
    <circle cx="99.9" cy="100.1" r="0.6" fill="#FFF"/>
    <path d="M 95 105 L 92.6 107.4 L 97 106.8 Z" fill="#C8B058"/>
    <path d="M 89 97 Q 87 94 89 93" stroke="#D8C090" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 103 97 Q 105 94 103 93" stroke="#D8C090" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 传心微光 -->
    <circle cx="76" cy="104" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
