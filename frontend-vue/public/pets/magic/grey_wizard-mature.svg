<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="灰袍智者·四阶·解惑初成·村口枯井咒引暗流井涌村人欢呼">
  <defs>
    <!-- 背景：村口夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D4B4"/>
      <stop offset="52%" stop-color="#C0B494"/>
      <stop offset="100%" stop-color="#9A9E84"/>
    </linearGradient>
    <!-- 井光 -->
    <radialGradient id="glow" cx="42%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#A8D0C0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A8D0C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年灰袍（沾土） -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A4A4A4"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="120" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.48;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 村屋（右） -->
  <g>
    <path d="M 150 120 L 150 152 L 196 152 L 196 120 Z" fill="#B8A884"/>
    <path d="M 144 120 L 173 104 L 202 120 Z" fill="#9E8E6E"/>
  </g>

  <!-- 枯井（左中） -->
  <g>
    <path d="M 56 150 Q 60 138 72 136 Q 84 138 88 150 Z" fill="#8E8E82"/>
    <ellipse cx="72" cy="136" rx="16" ry="6" fill="#3A342A"/>
    <!-- 井水涌出（引暗流） -->
    <g fill="#A8D0C0" opacity="0.8">
      <path d="M 66 138 Q 72 134 78 138 Q 72 142 66 138 Z">
        <animateTransform attributeName="transform" type="scale" values="1 1;1.2 1.2;1 1" dur="2s" repeatCount="indefinite"/>
      </path>
      <circle cx="72" cy="132" r="2.4">
        <animate attributeName="cy" values="132;128;132" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 井口溢出的水光 -->
    <path d="M 58 150 Q 60 148 72 148 Q 84 148 86 150" stroke="#A8D0C0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 欢呼的村民（左） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="40" cy="134" r="4" fill="#C8B898"/>
    <path d="M 36 138 L 34 146 M 40 138 L 40 146 M 44 138 L 46 146" stroke="#A8906E" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 欢呼 -->
    <path d="M 36 130 Q 34 128 32 129" stroke="#A8906E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年灰袍（咒引暗流） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <path d="M 96 152 L 96 116 Q 96 108 102 108 L 102 152 Z" fill="url(#robe)" stroke="#767676" stroke-width="0.9"/>
    <!-- 伸向井口的指尖（引咒） -->
    <path d="M 100 120 Q 94 126 88 132" stroke="#C8B89A" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 100 120;6 100 120;0 100 120" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 引暗流的光（指尖→井） -->
    <path d="M 92 130 Q 86 134 80 136" stroke="#A8D0C0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年灰袍头（含亮，专注） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="98" cy="98" rx="8" ry="8" fill="#E8D8C0" stroke="#C8B89A" stroke-width="0.7"/>
    <!-- 圆镜（反光） -->
    <circle cx="94" cy="97" r="2.6" fill="none" stroke="#8E8E82" stroke-width="0.8"/>
    <circle cx="102" cy="97" r="2.6" fill="none" stroke="#8E8E82" stroke-width="0.8"/>
    <!-- 镜后眼（亮） -->
    <circle cx="94" cy="97" r="1.2" fill="#24180E"/>
    <circle cx="102" cy="97" r="1.2" fill="#24180E"/>
    <!-- 嘴（默念咒） -->
    <path d="M 95 102 Q 98 103.2 101 102" fill="none" stroke="#A8886A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 头发束起 -->
    <path d="M 96 92 Q 98 88 100 92" stroke="#6E5638" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 额间解疑光 -->
    <circle cx="98" cy="91" r="2.6" fill="#A8D0C0" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 井光星尘 -->
  <g fill="#A8D0C0">
    <circle cx="50" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
