<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="炼金魔像·三阶·练力苦修·指尖捧羽毛不皱搬矿不破轻扶木架">
  <defs>
    <!-- 背景：工坊晨暖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C8A0"/>
      <stop offset="52%" stop-color="#CEA87E"/>
      <stop offset="100%" stop-color="#A89270"/>
    </linearGradient>
    <!-- 晨暖 -->
    <radialGradient id="glow" cx="50%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青石身（打磨发亮） -->
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86A0AC"/>
      <stop offset="100%" stop-color="#66808C"/>
    </linearGradient>
    <!-- 眼窝光（亮） -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="36" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 扶正的木架（右背景） -->
  <g>
    <rect x="146" y="118" width="40" height="5" rx="2" fill="#8E6E50" stroke="#6E5238" stroke-width="0.7"/>
    <path d="M 152 123 L 152 148 M 168 123 L 168 148" stroke="#8E6E50" stroke-width="2" stroke-linecap="round"/>
    <path d="M 150 130 L 158 130 M 162 130 L 170 130" stroke="#6E5238" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 主人（左，放心看着） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <circle cx="38" cy="112" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="38" cy="128" rx="6" ry="9" fill="#B0806E" stroke="#9E6E5C" stroke-width="0.8"/>
    <path d="M 42 122 Q 47 120 48 116" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 41 125 Q 43 124 45 125" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 青石魔像（立稳，5头身） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 石腿（稳） -->
    <path d="M 92 128 L 90 150 M 110 128 L 112 150" stroke="url(#stone)" stroke-width="8" stroke-linecap="round"/>
    <!-- 石身（高，打磨发亮） -->
    <rect x="86" y="88" width="26" height="42" rx="9" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
    <!-- 篆纹（发亮） -->
    <path d="M 95 104 L 95 112 M 92 110 L 98 110" stroke="#F0D080" stroke-width="1.1" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 102 106 L 102 112 M 100 110 L 104 110" stroke="#F0D080" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <!-- 左臂（托矿石，不破） -->
    <path d="M 90 96 L 76 110 L 72 124" stroke="url(#stone)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- 整袋矿石（稳稳托着） -->
    <g>
      <path d="M 60 120 L 82 120 L 80 134 L 62 134 Z" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
      <circle cx="70" cy="114" r="3" fill="#6E5A46"/>
      <circle cx="76" cy="112" r="2.4" fill="#8E6E52"/>
      <circle cx="65" cy="116" r="2" fill="#6E5A46"/>
    </g>
    <!-- 右臂（指尖捧羽毛，缓缓抬起） -->
    <path d="M 110 96 L 124 96 L 134 88" stroke="url(#stone)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 110 96;-4 110 96;0 110 96" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 指尖（轻捏） -->
    <circle cx="137" cy="85" r="2.8" fill="url(#stone)" stroke="#4E6470" stroke-width="0.6"/>
    <!-- 羽毛（不皱） -->
    <path d="M 140 76 Q 148 78 150 88 Q 144 92 138 88 Q 136 80 140 76 Z" fill="#F4EEE4" stroke="#D8D0C4" stroke-width="0.6">
      <animateTransform attributeName="transform" type="rotate" values="-3 142 82;3 142 82;-3 142 82" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 77 L 146 87" stroke="#C8BEAC" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 石面（沉稳，眼窝亮） -->
    <g>
      <rect x="88" y="66" width="22" height="19" rx="6" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
      <circle cx="94" cy="76" r="2.4" fill="#2E3E46"/>
      <circle cx="94" cy="76" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="94" cy="76" r="4.5" fill="#F8D080" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="76" r="2.4" fill="#2E3E46"/>
      <circle cx="104" cy="76" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.55;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="104" cy="76" r="4.5" fill="#F8D080" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 晨星尘 -->
  <g fill="#FFF0D0">
    <circle cx="46" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
