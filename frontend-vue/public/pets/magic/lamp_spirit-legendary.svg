<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="元素灯灵·五阶·元素灯灵·悬街灯柱光如暖灯照夜归人引暗处幼兽">
  <defs>
    <!-- 背景：长夜街道 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3C58"/>
      <stop offset="52%" stop-color="#223048"/>
      <stop offset="100%" stop-color="#182238"/>
    </linearGradient>
    <!-- 暖灯光 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="44%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
    <!-- 焰身 -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8E4A0"/>
      <stop offset="100%" stop-color="#E87830"/>
    </linearGradient>
    <!-- 光环 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="72" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.62;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#E8EEF4">
    <circle cx="36" cy="30" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="26" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="186" cy="56" r="1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 街灯柱（中） -->
  <g>
    <path d="M 96 132 L 96 158" stroke="#6E6256" stroke-width="4" stroke-linecap="round"/>
    <path d="M 88 158 L 104 158" stroke="#6E6256" stroke-width="3" stroke-linecap="round"/>
    <path d="M 92 126 L 92 134 L 108 134 L 108 126 Z" fill="#8E8270" stroke="#6E6256" stroke-width="0.8"/>
  </g>
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 暗处幼兽（左，被引到亮处） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="46" cy="140" rx="8" ry="5.5" fill="#5A4A3E" stroke="#42362C" stroke-width="0.8"/>
    <path d="M 54 138 Q 60 136 62 141" stroke="#5A4A3E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="40" cy="132" rx="4.5" ry="4" fill="#5A4A3E" stroke="#42362C" stroke-width="0.7"/>
    <path d="M 37 129 L 35 125 L 39 128 Z" fill="#5A4A3E"/>
    <path d="M 42 129 L 44 125 L 41 128 Z" fill="#5A4A3E"/>
    <circle cx="38.5" cy="131" r="1.1" fill="#F8D080">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 引兽光带 -->
  <path d="M 60 116 Q 52 128 50 136" stroke="#F8D080" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 夜归人（右，循光而行） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;0.8 0;0 0" dur="3s" repeatCount="indefinite"/>
    <circle cx="156" cy="128" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="156" cy="142" rx="5.5" ry="8" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 152 136 Q 146 130 142 126" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 160 136 Q 166 130 168 128" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 元素灯灵（悬灯柱，光如暖灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.6;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大光环（如月） -->
    <circle cx="100" cy="72" r="22" fill="url(#aura)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="72" r="34" fill="#F8D080" opacity="0.14">
      <animate attributeName="opacity" values="0.14;0.07;0.14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身（如月，大） -->
    <path d="M 100 52 Q 111 62 111 74 Q 111 85 100 85 Q 89 85 89 74 Q 89 62 100 52 Z" fill="url(#flame)" stroke="#B85A28" stroke-width="0.9"/>
    <!-- 焰发（如灯） -->
    <path d="M 96 52 Q 92 40 97 35 Q 100 44 101 43 Q 105 32 109 36 Q 106 44 104 52" fill="#F8E4A0" stroke="#D87828" stroke-width="0.5"/>
    <!-- 眼（含威含温） -->
    <circle cx="95.5" cy="70" r="1.8" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="104.5" cy="70" r="1.8" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光 -->
    <path d="M 100 85 Q 100 95 105 102" stroke="#F8E4A0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-3 100 85;3 100 85;-3 100 85" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="105" cy="105" r="2.8" fill="#F8D080">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#F8D080">
    <circle cx="46" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
