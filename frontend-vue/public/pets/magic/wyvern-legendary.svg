<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="飞龙·五阶·崖巢之王·盘旋巢上翼如穹喷火照巢口龙归">
  <defs>
    <!-- 背景：崖巢暮云 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D0A8"/>
      <stop offset="52%" stop-color="#C8B488"/>
      <stop offset="100%" stop-color="#96A8A0"/>
    </linearGradient>
    <!-- 王之神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FCF0C8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCF0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECF0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 飞龙皮（如青玉） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9E8E"/>
      <stop offset="100%" stop-color="#4E7C72"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F0F6F0" opacity="0.85">
    <path d="M 0 132 Q 50 124 110 130 Q 160 134 200 128 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 崖巢（下） -->
  <g fill="#A0A8B0" opacity="0.5">
    <path d="M 140 200 L 146 176 Q 162 170 180 174 L 200 170 L 200 200 Z"/>
  </g>

  <!-- 巢口（下，被照） -->
  <path d="M 158 178 Q 170 172 182 176" stroke="#8E969E" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 夜归的小飞龙（左，飞回） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 70 100 L 58 94 L 62 102 L 52 98 L 60 104 Z" fill="#6E9E8E"/>
    <ellipse cx="72" cy="102" rx="5" ry="3.6" fill="#6E9E8E"/>
  </g>

  <!-- 崖巢之王飞龙（盘旋，翼如穹） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（大展如穹） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 104 96;8 104 96;-8 104 96" dur="2.2s" repeatCount="indefinite"/>
      <path d="M 92 100 L 52 82 L 60 96 L 36 86 L 56 102 Z" fill="url(#skin)" stroke="#46786C" stroke-width="1.1"/>
      <path d="M 92 100 L 132 82 L 124 96 L 148 86 L 128 102 Z" fill="url(#skin)" stroke="#46786C" stroke-width="1.1"/>
    </g>
    <!-- 身 -->
    <ellipse cx="96" cy="106" rx="9" ry="7" fill="url(#skin)" stroke="#46786C" stroke-width="0.9"/>
    <!-- 尾 -->
    <path d="M 103 110 L 114 112 L 117 118" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 崖巢之王头（含威含温，喷火照巢口） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="96" rx="8" ry="7" fill="url(#skin)" stroke="#46786C" stroke-width="0.8"/>
    <!-- 眼（含威含温） -->
    <circle cx="92" cy="94.5" r="1.9" fill="#24180E"/>
    <circle cx="92.4" cy="94.1" r="0.6" fill="#FFF"/>
    <circle cx="100" cy="94.5" r="1.9" fill="#24180E"/>
    <circle cx="100.4" cy="94.1" r="0.6" fill="#FFF"/>
    <!-- 鼻/嘴 -->
    <path d="M 95 99 L 93 101.6 L 97 101 Z" fill="#46786C"/>
    <!-- 头上角 -->
    <path d="M 93 91 L 90 86 M 98 91 L 101 86" stroke="#6E9E8E" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 额间王光 -->
    <circle cx="96" cy="89" r="2.6" fill="#FCF0C8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 喷火照巢口（下） -->
    <g fill="#F0A030" opacity="0.8">
      <path d="M 98 100 Q 104 108 110 114 Q 106 118 100 116 Q 96 108 98 100 Z">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <circle cx="104" cy="112" r="2.4" fill="#F8C878" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.25;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 照向巢口的光 -->
    <path d="M 104 114 Q 128 140 166 172" stroke="#FCF0C8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 王光星尘 -->
  <g fill="#FCF0C8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
