<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="龙骑士·五阶·大地守护·银甲盘旋龙喷水柱引民避火守大地">
  <defs>
    <!-- 背景：大地高空 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E8ABE"/>
      <stop offset="48%" stop-color="#9EB6DA"/>
      <stop offset="100%" stop-color="#6E9E7A"/>
    </linearGradient>
    <!-- 守护圣光 -->
    <radialGradient id="glow" cx="30%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#F8F4E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F4E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="44%">
      <stop offset="0%" stop-color="#E8EEF4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8EEF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 龙皮 -->
    <linearGradient id="dragon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9E8E"/>
      <stop offset="100%" stop-color="#528478"/>
    </linearGradient>
    <!-- 银甲 -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="60" cy="34" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="82" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云 -->
  <g fill="#F8F4E8" opacity="0.5">
    <ellipse cx="148" cy="34" rx="18" ry="6"/>
    <ellipse cx="168" cy="44" rx="12" ry="4.5"/>
    <ellipse cx="36" cy="30" rx="14" ry="5"/>
  </g>

  <!-- 大地 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#6E9E7A" opacity="0.85"/>
  <g fill="#86AE7E" opacity="0.5">
    <path d="M 0 156 Q 50 150 110 155 Q 160 159 200 153 L 200 200 L 0 200 Z"/>
  </g>

  <!-- 被引避火的村民（左下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="34" cy="160" r="4" fill="#C8B898"/>
    <path d="M 30 164 L 28 172 M 34 164 L 34 172 M 38 164 L 40 172" stroke="#A8906E" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="48" cy="162" r="3.6" fill="#D0B898"/>
    <path d="M 45 166 L 43 173 M 48 166 L 48 173 M 51 166 L 53 173" stroke="#B0986E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 野火（右下，被水柱压） -->
  <g>
    <path d="M 142 162 Q 145 152 149 162 Z" fill="#E87830" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 162 Q 155 150 160 162 Z" fill="#F0A040" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.6;0.85" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 147 162 Q 149 155 152 162 Z" fill="#F8C860" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 156 163 Q 160 156 164 163 Z" fill="#E87830" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 龙与骑士（盘旋俯冲） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 龙翼（拍动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 92 74;4 92 74;-4 92 74" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 92 76 L 60 56 L 68 66 L 54 60 L 66 72 Z" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
      <path d="M 92 76 L 124 56 L 116 66 L 130 60 L 118 72 Z" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
    </g>
    <!-- 龙身 -->
    <ellipse cx="92" cy="86" rx="15" ry="9" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
    <ellipse cx="88" cy="91" rx="9" ry="4.5" fill="#D8E0D4" opacity="0.6"/>
    <!-- 龙尾 -->
    <path d="M 78 88 L 64 92 L 58 86 L 54 92" stroke="url(#dragon)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 78 88;5 78 88;0 78 88" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 龙头（喷水） -->
    <g>
      <ellipse cx="112" cy="74" rx="8" ry="7" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
      <circle cx="116" cy="72" r="1.8" fill="#24180E"/>
      <circle cx="116.4" cy="71.6" r="0.6" fill="#FFF"/>
      <path d="M 108 70 L 105 64 M 114 70 L 117 63" stroke="#6E9E8E" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 118 77 L 122 75.5 L 118 79.5 Z" fill="#528478"/>
    </g>
    <!-- 水柱（喷向野火） -->
    <g stroke="#C8E8F4" stroke-linecap="round" fill="none">
      <path d="M 121 76 Q 134 104 146 138" stroke-width="1.6" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 122 78 Q 136 110 148 144" stroke-width="1.2" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 水花（压火） -->
    <g fill="#C8E8F4" opacity="0.8">
      <circle cx="147" cy="148" r="1.8">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="152" cy="152" r="1.4">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 骑士（银甲，引民） -->
    <g>
      <ellipse cx="88" cy="62" rx="6" ry="9" fill="url(#silver)" stroke="#9AA8B8" stroke-width="0.8" transform="rotate(-6 88 62)"/>
      <path d="M 84 58 Q 74 62 66 70" stroke="url(#silver)" stroke-width="2.4" stroke-linecap="round" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 84 58;-6 84 58;0 84 58" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <circle cx="85" cy="60" r="1" fill="#FFF" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="91" cy="67" r="1" fill="#FFF" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 骑士头（银盔束发） -->
    <g>
      <ellipse cx="88" cy="48" rx="6.5" ry="6.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
      <path d="M 81 46 Q 88 40 95 46 L 95 43 Q 88 38 81 43 Z" fill="url(#silver)" stroke="#9AA8B8" stroke-width="0.7"/>
      <circle cx="85" cy="47" r="1.6" fill="#24180E"/>
      <circle cx="85.4" cy="46.6" r="0.5" fill="#FFF"/>
      <circle cx="91" cy="47" r="1.6" fill="#24180E"/>
      <circle cx="91.4" cy="46.6" r="0.5" fill="#FFF"/>
      <path d="M 86 51.5 Q 88 52.6 90 51.5" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 引路光带（骑士→村民） -->
  <path d="M 62 74 Q 48 110 42 148" stroke="#F8E4A0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 守护星尘 -->
  <g fill="#F8E4A0">
    <circle cx="36" cy="112">
      <animate attributeName="cy" values="112;100;112" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="92">
      <animate attributeName="cy" values="92;80;92" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
