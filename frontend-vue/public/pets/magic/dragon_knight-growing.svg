<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="龙骑士·三阶·练骑苦修·翻身即上口令手势配合盘旋如一">
  <defs>
    <!-- 背景：草原上空云 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0DCE0"/>
      <stop offset="52%" stop-color="#B0C0C4"/>
      <stop offset="100%" stop-color="#94A8A0"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F0F8F4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0F8F4" stop-opacity="0"/>
    </radialGradient>
    <!-- 龙皮 -->
    <linearGradient id="dragon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9E8E"/>
      <stop offset="100%" stop-color="#528478"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F0F8F4" opacity="0.85">
    <path d="M 0 136 Q 60 128 120 134 Q 170 138 200 132 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 大地（下） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EAE7E" opacity="0.7"/>

  <!-- 风痕 -->
  <g stroke="#E0ECE4" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 20 70 Q 60 64 100 70">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年龙骑士与龙（盘旋，动作如一） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 龙翼（展） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 88 92;6 88 92;-6 88 92" dur="2s" repeatCount="indefinite"/>
      <path d="M 80 96 L 48 84 L 56 94 L 40 88 L 52 98 Z" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
      <path d="M 80 96 L 112 84 L 104 94 L 120 88 L 108 98 Z" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
    </g>
    <!-- 龙身 -->
    <ellipse cx="84" cy="100" rx="10" ry="7" fill="url(#dragon)" stroke="#3E6E62" stroke-width="0.9"/>
    <!-- 龙尾 -->
    <path d="M 94 102 L 104 104 L 107 108" stroke="url(#dragon)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年骑士（骑在龙背上，配合） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（骑龙） -->
    <ellipse cx="84" cy="84" rx="7" ry="9" fill="#D8C0A0" stroke="#C0A888" stroke-width="0.8" transform="rotate(-8 84 84)"/>
    <!-- 皮甲 -->
    <path d="M 78 78 L 90 80 L 88 88 L 76 86 Z" fill="#A8886E" opacity="0.8"/>
    <!-- 抬臂（口令手势） -->
    <path d="M 82 78 Q 78 70 84 64" stroke="#D8C0A0" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 82 78;-8 82 78;0 82 78" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 缰绳（束腕） -->
    <path d="M 90 82 L 96 92" stroke="#8E6E4E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 少年骑士头（专注，动作如一） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="84" cy="68" rx="7" ry="7" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <!-- 眼（专注） -->
    <circle cx="81" cy="66.5" r="1.7" fill="#24180E"/>
    <circle cx="81.4" cy="66.1" r="0.55" fill="#FFF"/>
    <circle cx="87.5" cy="66.5" r="1.7" fill="#24180E"/>
    <circle cx="87.9" cy="66.1" r="0.55" fill="#FFF"/>
    <!-- 嘴（喊口令） -->
    <path d="M 82 71 Q 84 72.2 86 71" fill="none" stroke="#B08A6A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 短发 -->
    <path d="M 81 63 Q 84 60 87 63 M 84 61 L 84 59" stroke="#8E6E4E" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 龙眼（配合，亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="76" cy="96" rx="5" ry="4.5" fill="url(#dragon)"/>
    <circle cx="74.5" cy="95" r="1.3" fill="#D8E04C"/>
    <circle cx="74.9" cy="94.7" r="0.45" fill="#FFF"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F0F8F4">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
