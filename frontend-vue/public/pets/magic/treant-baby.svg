<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="树人·二阶·旱林之痛·大旱叶黄接枯叶泪滑干根寻水">
  <defs>
    <!-- 背景：旱林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8BC94"/>
      <stop offset="52%" stop-color="#A89C78"/>
      <stop offset="100%" stop-color="#8A7E62"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#E0D8BC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0D8BC" stop-opacity="0"/>
    </radialGradient>
    <!-- 小树人树皮（干裂） -->
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#967C54"/>
      <stop offset="100%" stop-color="#7E6646"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 旱裂地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9E9272" opacity="0.8"/>
  <g stroke="#8A7E5E" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 40 162 L 50 170 M 90 158 L 96 170 M 140 160 L 146 170"/>
  </g>

  <!-- 枯黄的树（周围） -->
  <g stroke="#6E5640" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M 150 150 Q 150 130 148 118"/>
    <path d="M 149 130 L 140 124 M 149 122 L 158 116"/>
  </g>
  <g fill="#A8904C">
    <path d="M 140 124 Q 136 120 134 116 Q 138 120 142 122 Z"/>
    <path d="M 158 116 Q 162 112 164 108 Q 160 112 156 114 Z"/>
  </g>

  <!-- 接住的枯叶（小树人枝头） -->
  <path d="M 108 92 Q 111 89 114 92 Q 111 95 108 92 Z" fill="#A8904C"/>

  <!-- 小树人（接枯叶，根寻水） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 根（四处寻水） -->
    <g stroke="#6E5638" stroke-width="2.2" stroke-linecap="round">
      <path d="M 90 148 L 82 158 M 92 148 L 88 160 M 108 148 L 116 156 M 108 148 L 112 160"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="3s" repeatCount="indefinite"/>
    </g>
    <!-- 树干 -->
    <path d="M 96 148 L 96 116 Q 100 108 104 116 L 104 148 Z" fill="url(#bark)" stroke="#6A5036" stroke-width="0.9"/>
    <!-- 树皮裂纹 -->
    <path d="M 98 126 L 102 128 M 98 136 L 102 138" stroke="#5E462E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 枝（垂） -->
    <path d="M 100 110 Q 103 102 106 98" stroke="#7E9666" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 96 112 Q 90 106 87 102" stroke="#7E9666" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小树人头（含悲含志） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 头顶枯叶 -->
    <g fill="#A8904C">
      <path d="M 98 110 Q 94 107 92 104 Q 96 107 100 109 Z"/>
    </g>
    <!-- 眼（悲） -->
    <circle cx="97.5" cy="120" r="1.6" fill="#2E2012"/>
    <circle cx="102.5" cy="120" r="1.6" fill="#2E2012"/>
    <!-- 嘴（悲） -->
    <path d="M 98 125 Q 100 124 102 125" fill="none" stroke="#5E4A30" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 泪（滑干） -->
    <path d="M 98 121.6 Q 96 124.6 96.5 127" stroke="#A8CCE8" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E0D8BC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
