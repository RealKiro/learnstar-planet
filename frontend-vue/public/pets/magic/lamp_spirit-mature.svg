<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="元素灯灵·四阶·照路初成·暗巷光稳引走失孩子回家母亲门口抱住">
  <defs>
    <!-- 背景：暗巷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3448"/>
      <stop offset="52%" stop-color="#1E2838"/>
      <stop offset="100%" stop-color="#16202C"/>
    </linearGradient>
    <!-- 灯灵照路 -->
    <radialGradient id="glow" cx="30%" cy="44%" r="36%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
    <!-- 门口灯暖 -->
    <radialGradient id="door" cx="86%" cy="56%" r="30%">
      <stop offset="0%" stop-color="#F8E4A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8E4A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 焰身 -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8D080"/>
      <stop offset="100%" stop-color="#E87830"/>
    </linearGradient>
    <!-- 光环 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="60" cy="88" r="64" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="172" cy="112" r="52" fill="url(#door)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 巷墙 -->
  <g fill="#0E121C" opacity="0.7">
    <path d="M 0 90 L 18 86 L 18 200 L 0 200 Z"/>
    <path d="M 182 96 L 200 92 L 200 200 L 182 200 Z"/>
  </g>
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 家门口（右，亮灯） -->
  <g>
    <rect x="158" y="108" width="30" height="42" rx="2" fill="#6E6256" stroke="#544A40" stroke-width="0.9"/>
    <rect x="166" y="116" width="8" height="11" rx="1" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- 灯沿 -->
    <path d="M 158 108 L 188 108" stroke="#8E8270" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 抱住孩子的母亲（门口） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="150" cy="128" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="150" cy="140" rx="6" ry="9" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 144 132 Q 138 128 134 126" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 被抱的孩子 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="138" cy="136" r="4" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="138" cy="148" rx="5" ry="7" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
  </g>

  <!-- 引路光带（灯灵→孩子） -->
  <path d="M 72 104 Q 96 116 116 128" stroke="#F8D080" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 少年灯灵（左，光稳引路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="60" cy="88" r="15" fill="url(#aura)">
      <animate attributeName="opacity" values="0.45;0.26;0.45" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身 -->
    <path d="M 60 72 Q 69 80 69 89 Q 69 97 60 97 Q 51 97 51 89 Q 51 80 60 72 Z" fill="url(#flame)" stroke="#B85A28" stroke-width="0.8"/>
    <!-- 焰发 -->
    <path d="M 57 72 Q 54 62 58 58 Q 60 66 61 65 Q 64 56 67 59 Q 65 66 63 72" fill="#F8D080" stroke="#D87828" stroke-width="0.5"/>
    <!-- 眼（含温含亮） -->
    <circle cx="56.5" cy="86" r="1.6" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="63.5" cy="86" r="1.6" fill="#FFF2E0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光 -->
    <path d="M 60 97 Q 60 105 64 110" stroke="#F8C860" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-3 60 97;3 60 97;-3 60 97" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="64" cy="112" r="2.4" fill="#F8D080">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#F8D080">
    <circle cx="46" cy="130">
      <animate attributeName="cy" values="130;122;130" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="76">
      <animate attributeName="cy" values="76;68;76" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
