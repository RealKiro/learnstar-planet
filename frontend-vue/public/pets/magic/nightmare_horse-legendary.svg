<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梦魇夜马·五阶·夜行守护·立岔路口鬃毛月光如灯引夜归旅人带幼兽">
  <defs>
    <!-- 背景：岔路口星夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3C5E"/>
      <stop offset="52%" stop-color="#22304C"/>
      <stop offset="100%" stop-color="#182238"/>
    </linearGradient>
    <!-- 夜灯神光 -->
    <radialGradient id="glow" cx="46%" cy="40%" r="46%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 鬃毛如灯 -->
    <radialGradient id="mane" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0F6FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8E0F0" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="80" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.62;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#E8EEF4">
    <circle cx="36" cy="30" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="26" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="188" cy="50" r="1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 岔路 -->
  <path d="M 0 152 L 200 150 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>
  <path d="M 88 152 L 84 200 M 120 152 L 124 200" stroke="#2A3444" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 被引的夜归旅人（右，跟随光） -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="164" cy="130" r="4.5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="164" cy="144" rx="5.5" ry="8" fill="#A8886E" stroke="#8E6E50" stroke-width="0.8"/>
    <path d="M 161 138 Q 154 132 150 128" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 167 138 Q 172 132 174 130" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 引路光带（鬃→旅人） -->
  <path d="M 128 100 Q 142 112 156 122" stroke="#C8DCE8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 岔路口的梦魇夜马（鬃毛如灯，黑为夜灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 78 134 L 75 150 M 92 134 L 92 150" stroke="#1E202C" stroke-width="5" stroke-linecap="round"/>
    <!-- 前腿 -->
    <path d="M 106 132 L 106 148 M 120 130 L 122 146" stroke="#1E202C" stroke-width="5" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="100" cy="128" rx="22" ry="11" fill="#242634" stroke="#0E0E16" stroke-width="1"/>
    <!-- 颈 -->
    <path d="M 118 120 Q 132 106 142 94" stroke="#242634" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- 头 -->
    <ellipse cx="148" cy="90" rx="9" ry="6.5" fill="#242634" stroke="#0E0E16" stroke-width="0.9"/>
    <path d="M 144 84 L 141 76 L 148 83 Z" fill="#242634" stroke="#0E0E16" stroke-width="0.6"/>
    <circle cx="151" cy="89" r="1.8" fill="#F0F6FC">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 鬃毛如灯（宽亮） -->
    <g fill="none" stroke="#F0F6FC" stroke-linecap="round" opacity="0.95">
      <path d="M 144 86 Q 130 74 112 78" stroke-width="2.6"/>
      <path d="M 142 90 Q 126 80 108 84" stroke-width="2" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" values="-2 142 90;2 142 90;-2 142 90" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 140 94 Q 124 86 110 90" stroke-width="1.6" opacity="0.7"/>
    </g>
    <circle cx="122" cy="80" r="11" fill="url(#mane)">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="122" cy="80" r="18" fill="#E8F0F8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.08;0.16" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾毛 -->
    <path d="M 78 128 Q 60 122 52 132 Q 47 142 56 146" stroke="#F0F6FC" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="-3 78 128;3 78 128;-3 78 128" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="62" cy="130" r="9" fill="url(#mane)">
      <animate attributeName="opacity" values="0.55;0.28;0.55" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 蹄踏星尘 -->
    <g fill="#E8F0F8" opacity="0.9">
      <circle cx="76" cy="151" r="1.9">
        <animate attributeName="opacity" values="0.9;0.45;0.9" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="91" cy="151" r="1.7">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="107" cy="149" r="1.8">
        <animate attributeName="opacity" values="0.85;0.42;0.85" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="121" cy="147" r="1.6">
        <animate attributeName="opacity" values="0.75;0.38;0.75" dur="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 月尘 -->
  <g fill="#E8F0F8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
