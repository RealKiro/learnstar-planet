<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="灰袍智者·二阶·咒语之误·念错音节咒失控掀翻厨房缩架后">
  <defs>
    <!-- 背景：塔楼厨房暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8AC94"/>
      <stop offset="52%" stop-color="#9A8E76"/>
      <stop offset="100%" stop-color="#7E7260"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#E0D4B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0D4B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 小灰袍（沾灰） -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#868686"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 掀翻的锅碗（狼藉） -->
  <g>
    <path d="M 60 150 Q 66 144 72 148 L 70 154 Q 64 154 60 150 Z" fill="#8E7A5E" transform="rotate(-20 66 149)"/>
    <path d="M 84 154 L 88 150 L 92 154 Z" fill="#C8B898" transform="rotate(15 88 152)"/>
    <circle cx="76" cy="152" r="3" fill="#B06050"/>
    <circle cx="70" cy="158" r="2" fill="#B06050"/>
    <path d="M 120 150 L 126 146 L 130 152 Z" fill="#8E7A5E" transform="rotate(-12 125 149)"/>
  </g>
  <!-- 乱飞的书页/菜叶 -->
  <g opacity="0.7">
    <path d="M 96 120 Q 100 116 104 120 Q 100 124 96 120 Z" fill="#A8A080"/>
    <path d="M 132 112 Q 136 108 140 112 Q 136 116 132 112 Z" fill="#A8A080"/>
  </g>

  <!-- 瞪眼的老猫（右，瞪） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="156" cy="140" rx="7" ry="5" fill="#6E6A5E"/>
    <circle cx="156" cy="132" r="4.5" fill="#6E6A5E"/>
    <circle cx="153.6" cy="131" r="1.1" fill="#C8D860"/>
    <circle cx="154" cy="130.8" r="0.5" fill="#24180E"/>
    <circle cx="158.4" cy="131" r="1.1" fill="#C8D860"/>
    <circle cx="158.8" cy="130.8" r="0.5" fill="#24180E"/>
    <path d="M 154 135 Q 156 136 158 135" fill="none" stroke="#4E4A3E" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 书架（左） -->
  <g>
    <path d="M 14 110 L 54 110 L 54 152 L 14 152 Z" fill="#7E6E56"/>
    <g stroke="#9A8A6E" stroke-width="1.4">
      <path d="M 14 122 L 54 122 M 14 134 L 54 134"/>
    </g>
  </g>

  <!-- 小灰袍（缩书架后，看狼藉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（缩） -->
    <path d="M 60 150 L 60 126 Q 60 118 66 118 L 66 150 Z" fill="url(#robe)" stroke="#6E6E6E" stroke-width="0.8"/>
  </g>

  <!-- 小灰袍头（缩，惧+悟） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="108" rx="7.5" ry="7.5" fill="#E8D8C0" stroke="#C8B89A" stroke-width="0.7"/>
    <!-- 圆镜（沾灰） -->
    <circle cx="56.5" cy="107" r="2.4" fill="none" stroke="#8E8E82" stroke-width="0.7"/>
    <circle cx="63.5" cy="107" r="2.4" fill="none" stroke="#8E8E82" stroke-width="0.7"/>
    <!-- 镜后眼（惧） -->
    <circle cx="56.5" cy="107" r="1.1" fill="#24180E"/>
    <circle cx="63.5" cy="107" r="1.1" fill="#24180E"/>
    <!-- 嘴（闯祸，微张） -->
    <path d="M 57.5 112 Q 60 113.2 62.5 112" fill="none" stroke="#A8886A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 头发乱 -->
    <path d="M 56 102 Q 54 98 57 97 M 62 101 Q 64 97 67 98" stroke="#6E5638" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 惧汗 -->
    <circle cx="60" cy="98" r="1" fill="#A8CCE8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E0D4B8">
    <circle cx="96" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
