<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精灵·二阶·风大翼弱·被风吹落摔叶上折花旁光暗淡">
  <defs>
    <!-- 背景：风后花田 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D4C0"/>
      <stop offset="52%" stop-color="#A8B8A4"/>
      <stop offset="100%" stop-color="#88A08C"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8E4D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8E4D4" stop-opacity="0"/>
    </radialGradient>
    <!-- 精灵光身（暗淡） -->
    <linearGradient id="glowbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE4D4"/>
      <stop offset="100%" stop-color="#D8CCB0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风痕 -->
  <g stroke="#C8D4C4" stroke-width="1.3" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 10 60 Q 50 54 90 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 84 Q 60 78 100 84">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 花田 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7EA87E" opacity="0.8"/>

  <!-- 被吹折的花（右） -->
  <g>
    <path d="M 150 150 Q 150 144 150 140" stroke="#7E9E6E" stroke-width="1.2" stroke-linecap="round"/>
    <g fill="#E89AB0" opacity="0.8">
      <circle cx="148" cy="137" r="2.6"/>
      <circle cx="152" cy="137" r="2.6"/>
      <circle cx="150" cy="135" r="2.6"/>
      <circle cx="150" cy="139" r="2.6"/>
    </g>
    <!-- 折痕 -->
    <path d="M 148 143 L 152 143" stroke="#7E9E6E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 小精灵（摔在叶上，光暗淡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 落叶（垫） -->
    <path d="M 96 146 Q 104 142 112 146 Q 104 150 96 146 Z" fill="#C89850"/>
    <!-- 身体（趴叶上） -->
    <ellipse cx="104" cy="138" rx="6" ry="7.5" fill="url(#glowbody)" stroke="#C8B898" stroke-width="0.7" transform="rotate(-10 104 138)"/>
    <!-- 翼（凌乱，垂） -->
    <path d="M 100 134 Q 92 130 88 126 L 102 132 Z" fill="#E0D8E4" opacity="0.5"/>
    <path d="M 100 134 Q 96 132 92 130 L 102 134 Z" fill="#E0D8E4" opacity="0.4"/>
    <!-- 光点（暗淡） -->
    <circle cx="102" cy="134" r="1" fill="#E8E0C8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 小精灵头（抬头看折花，含惑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="124" rx="5.5" ry="6" fill="url(#glowbody)" stroke="#C8B898" stroke-width="0.7"/>
    <!-- 眼（含惑） -->
    <circle cx="101.5" cy="123" r="1.5" fill="#24180E"/>
    <circle cx="101.9" cy="122.6" r="0.5" fill="#FFF"/>
    <circle cx="106.5" cy="123" r="1.5" fill="#24180E"/>
    <circle cx="106.9" cy="122.6" r="0.5" fill="#FFF"/>
    <!-- 嘴（委屈） -->
    <path d="M 102 127 Q 104 127.8 106 127" fill="none" stroke="#B8A888" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 发（乱） -->
    <path d="M 102 120 Q 102 117 105 116 M 106 119 Q 108 116 110 117" stroke="#E0C890" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 委屈泪 -->
    <path d="M 103 125 Q 101 127.4 101.5 129" stroke="#A8CCE8" stroke-width="0.9" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E8E4D4">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
