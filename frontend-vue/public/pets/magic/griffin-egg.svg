<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮鹫·一阶·幼狮鹫·狮爪拨石鹰眼望鸟翼羽未丰">
  <defs>
    <!-- 背景：高山崖巢晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D4C0"/>
      <stop offset="52%" stop-color="#C0B498"/>
      <stop offset="100%" stop-color="#A0A8AC"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F8F4E4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4E4" stop-opacity="0"/>
    </radialGradient>
    <!-- 小狮鹫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8BC90"/>
      <stop offset="100%" stop-color="#C0A478"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F4F4EC" opacity="0.85">
    <path d="M 0 132 Q 50 124 110 130 Q 160 134 200 128 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 崖巢（右下） -->
  <g fill="#A0A8AC" opacity="0.6">
    <path d="M 120 200 L 130 170 Q 150 160 170 168 L 200 160 L 200 200 Z"/>
  </g>

  <!-- 飞过的鸟（左上，鹰眼望） -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 40 70 L 48 68 L 44 74 Z" fill="#8E989E"/>
    <path d="M 40 70 L 32 68 L 36 74 Z" fill="#8E989E"/>
    <ellipse cx="40" cy="72" rx="4" ry="3" fill="#8E989E"/>
  </g>

  <!-- 小狮鹫（狮爪拨石，鹰眼望鸟） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（前半鹰后半狮） -->
    <ellipse cx="132" cy="146" rx="14" ry="10" fill="url(#fur)" stroke="#A88C60" stroke-width="0.9"/>
    <!-- 狮后腿 -->
    <path d="M 124 153 L 122 159 M 140 153 L 142 159" stroke="#A88C60" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 狮尾（短） -->
    <path d="M 146 150 Q 152 152 154 156" stroke="#C8A878" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 146 150;7 146 150;0 146 150" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 鹰翼（未丰） -->
    <path d="M 126 142 Q 118 136 114 130 L 128 138 Z" fill="url(#fur)" stroke="#A88C60" stroke-width="0.8"/>
    <!-- 狮爪（拨石） -->
    <path d="M 120 146 Q 114 142 110 138" stroke="#C8A878" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 146;-8 120 146;0 120 146" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小狮鹫头（鹰头，锐亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="120" cy="128" rx="9" ry="8" fill="url(#fur)" stroke="#A88C60" stroke-width="0.9"/>
    <!-- 鹰眼（锐） -->
    <path d="M 112 126 Q 114 124.6 116 126 M 125 126 Q 127 124.6 128 126" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="114" cy="127" r="2.2" fill="#D89020"/>
    <circle cx="114.6" cy="126.4" r="0.7" fill="#FFF"/>
    <circle cx="126.5" cy="127" r="2.2" fill="#D89020"/>
    <circle cx="127.1" cy="126.4" r="0.7" fill="#FFF"/>
    <!-- 鹰喙（短） -->
    <path d="M 118 131 L 116 133.4 L 120 132.8 Z" fill="#C8B058"/>
    <!-- 耳羽 -->
    <path d="M 112 122 Q 111 118 113 117" stroke="#D8C090" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 128 122 Q 129 118 127 117" stroke="#D8C090" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4E4">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
