<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梦魇夜马·一阶·夜驹初生·月下黑林学跑蹄踏微光夜枭歪头">
  <defs>
    <!-- 背景：月下黑林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3852"/>
      <stop offset="52%" stop-color="#1E2838"/>
      <stop offset="100%" stop-color="#141C28"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 鬃毛月光 -->
    <radialGradient id="mane" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8D0E8" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="152" cy="46" r="70" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="46" r="15" fill="#E8F0F8" opacity="0.95"/>
  <circle cx="156" cy="42" r="14" fill="#DCE6F0" opacity="0.8"/>

  <!-- 黑林 -->
  <g fill="#0E121C" opacity="0.9">
    <path d="M 0 80 L 8 40 L 16 78 L 20 52 L 28 84 L 0 200 L 0 84 Z"/>
    <path d="M 176 72 L 186 36 L 194 70 L 200 60 L 200 200 L 176 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 树梢夜枭（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 40 78 L 74 70" stroke="#0E121C" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="52" cy="68" rx="5" ry="7" fill="#2E3E52" stroke="#18202E" stroke-width="0.8"/>
    <path d="M 49 62 L 47 56 L 51 61 Z" fill="#2E3E52"/>
    <path d="M 55 62 L 57 56 L 53 61 Z" fill="#2E3E52"/>
    <circle cx="50" cy="68" r="1.8" fill="#F8E4A0"/>
    <circle cx="55" cy="68" r="1.8" fill="#F8E4A0"/>
  </g>

  <!-- 小梦魇马（月光学跑，蹄踏微光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 88 140 L 86 152 M 98 140 L 98 152" stroke="#1E202C" stroke-width="4" stroke-linecap="round"/>
    <!-- 前腿（一抬，学跑） -->
    <path d="M 112 138 L 114 148" stroke="#1E202C" stroke-width="4" stroke-linecap="round"/>
    <path d="M 122 136 L 126 144 L 124 147" stroke="#1E202C" stroke-width="4" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="132" rx="17" ry="9" fill="#242634" stroke="#0E0E16" stroke-width="0.9"/>
    <!-- 颈 -->
    <path d="M 116 126 Q 124 118 130 110" stroke="#242634" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- 头 -->
    <ellipse cx="134" cy="106" rx="7" ry="5.5" fill="#242634" stroke="#0E0E16" stroke-width="0.8"/>
    <path d="M 131 101 L 129 95 L 134 100 Z" fill="#242634" stroke="#0E0E16" stroke-width="0.6"/>
    <!-- 眼（亮温和） -->
    <circle cx="136" cy="105" r="1.5" fill="#E8F0F8">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 鬃毛月光（晃） -->
    <g fill="none" stroke="#D8E8F4" stroke-linecap="round" opacity="0.9">
      <path d="M 130 102 Q 118 94 108 98" stroke-width="2"/>
      <path d="M 128 106 Q 114 100 104 104" stroke-width="1.6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="-2 128 106;2 128 106;-2 128 106" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="112" cy="98" r="7" fill="url(#mane)">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾毛月光 -->
    <path d="M 88 132 Q 76 128 70 134 Q 66 140 72 144" stroke="#D8E8F4" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="-3 88 132;3 88 132;-3 88 132" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="78" cy="134" r="6" fill="url(#mane)">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 蹄踏微光 -->
    <g fill="#C8DCE8" opacity="0.7">
      <circle cx="87" cy="154" r="1.4">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="97" cy="154" r="1.2">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 月尘 -->
  <g fill="#E8F0F8">
    <circle cx="60" cy="110">
      <animate attributeName="cy" values="110;102;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
