<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="炼金魔像·五阶·炼金守护·蹲下温和待童起身挡野狼镇人唤石头哥">
  <defs>
    <!-- 背景：小镇星夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A68"/>
      <stop offset="52%" stop-color="#5A6A8E"/>
      <stop offset="100%" stop-color="#8E7664"/>
    </linearGradient>
    <!-- 街灯暖 -->
    <radialGradient id="glow" cx="18%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#F8E4A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8E4A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护神光 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="44%">
      <stop offset="0%" stop-color="#E8E4C8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 古青石身 -->
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#849AA6"/>
      <stop offset="100%" stop-color="#627884"/>
    </linearGradient>
    <!-- 眼窝光 -->
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D080" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8D080" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="36" cy="60" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="66" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 街灯（左） -->
  <g>
    <path d="M 30 150 L 30 88 L 38 88 L 38 150" stroke="#8E8270" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 22 84 Q 34 76 46 84 L 42 88 L 26 88 Z" fill="#8E8270"/>
    <ellipse cx="34" cy="92" rx="4" ry="3" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#6E6256" opacity="0.85"/>

  <!-- 被挡的野狼（右，退回） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;-1.2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 152 148 Q 166 140 176 132 Q 180 138 172 144 Q 182 146 178 152 L 162 156 Q 154 158 150 154 Z" fill="#4A4A52" stroke="#3A3A42" stroke-width="0.8"/>
    <path d="M 176 132 L 174 126 L 179 130 Z" fill="#4A4A52"/>
    <path d="M 178 132 L 182 128 L 181 133 Z" fill="#4A4A52"/>
    <circle cx="174" cy="136" r="1.1" fill="#E8C860">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 150 156 Q 140 158 134 162" stroke="#4A4A52" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 蹲下的孩童（前，安然） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="72" cy="130" r="5" fill="#E8D0B4" stroke="#D0B89A" stroke-width="0.7"/>
    <ellipse cx="72" cy="142" rx="6" ry="8" fill="#C8A878" stroke="#B0905E" stroke-width="0.8"/>
    <!-- 仰看魔像 -->
    <path d="M 76 138 Q 82 134 86 130" stroke="#E8D0B4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <circle cx="69" cy="128.5" r="1.4" fill="#24180E"/>
    <circle cx="69.4" cy="128.1" r="0.45" fill="#FFF"/>
  </g>

  <!-- 青石魔像（蹲下，温和，纹如碑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 石腿（蹲，稳） -->
    <path d="M 100 132 L 94 154 M 126 132 L 132 154" stroke="url(#stone)" stroke-width="9" stroke-linecap="round"/>
    <!-- 石身（如古碑） -->
    <rect x="98" y="88" width="30" height="46" rx="10" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
    <!-- 碑纹（篆纹，发光） -->
    <path d="M 106 102 L 106 116 M 102 112 L 110 112" stroke="#F0D080" stroke-width="1.4" stroke-linecap="round" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 116 104 L 116 114 M 113 111 L 119 111" stroke="#F0D080" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <!-- 岁月裂纹（古，不惊） -->
    <path d="M 110 92 L 112 96 L 108 99" stroke="#4A5A66" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 右臂（轻放膝上，待童） -->
    <path d="M 126 100 L 136 118 L 134 130" stroke="url(#stone)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- 左臂（伸向童，温和） -->
    <path d="M 102 102 L 92 118 L 86 128" stroke="url(#stone)" stroke-width="8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 102 102;-4 102 102;0 102 102" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 石面（含威含温） -->
    <g>
      <rect x="102" y="64" width="24" height="20" rx="6" fill="url(#stone)" stroke="#4E6470" stroke-width="0.9"/>
      <circle cx="108" cy="75" r="2.5" fill="#2E3E46"/>
      <circle cx="108" cy="75" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="108" cy="75" r="4.8" fill="#F8D080" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.14;0.32" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="75" r="2.5" fill="#2E3E46"/>
      <circle cx="120" cy="75" r="2" fill="url(#eye)">
        <animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="75" r="4.8" fill="#F8D080" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.14;0.32" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#E8EEF4">
    <circle cx="60" cy="40" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="36" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="60" r="1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
