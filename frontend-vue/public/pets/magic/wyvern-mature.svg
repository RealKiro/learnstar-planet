<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="飞龙·四阶·护巢初成·喷火墙退鹰守巢边蛋安然">
  <defs>
    <!-- 背景：崖巢夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B0"/>
      <stop offset="52%" stop-color="#C8BC90"/>
      <stop offset="100%" stop-color="#94A898"/>
    </linearGradient>
    <!-- 火墙威光 -->
    <radialGradient id="glow" cx="52%" cy="30%" r="54%">
      <stop offset="0%" stop-color="#F8E0A8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F8E0A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年飞龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9E8E"/>
      <stop offset="100%" stop-color="#54807A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.48;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 崖巢（右下） -->
  <g fill="#A0A8B0" opacity="0.5">
    <path d="M 130 200 L 138 170 Q 156 162 176 168 L 200 162 L 200 200 Z"/>
  </g>
  <path d="M 146 170 Q 158 164 172 168" stroke="#8E969E" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 巢中的蛋（右下） -->
  <g>
    <ellipse cx="164" cy="172" rx="5" ry="6" fill="#F0E8D8" stroke="#C8B89A" stroke-width="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 被火逼退的鹰（右上，逃） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 鹰翼 -->
    <path d="M 150 60 L 164 48 L 160 58 L 170 56 L 162 64 Z" fill="#6E6A5E"/>
    <path d="M 144 62 L 132 52 L 138 60 L 130 62 L 140 66 Z" fill="#6E6A5E"/>
    <!-- 身 -->
    <ellipse cx="148" cy="64" rx="5" ry="3.6" fill="#6E6A5E"/>
    <!-- 惊 -->
    <circle cx="145" cy="62" r="1" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火墙（鹰前） -->
  <g fill="#F0A030" opacity="0.8">
    <path d="M 128 74 Q 132 68 134 62 Q 136 68 132 74 Z">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 136 82 Q 140 76 142 70 Q 144 76 140 82 Z">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年飞龙（喷火守巢，翼展如盖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 翼（展，护巢） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 106 118;6 106 118;-6 106 118" dur="2s" repeatCount="indefinite"/>
      <path d="M 96 122 L 64 108 L 70 120 L 50 110 L 66 124 Z" fill="url(#skin)" stroke="#46786C" stroke-width="1"/>
      <path d="M 96 122 L 128 108 L 122 120 L 142 110 L 126 124 Z" fill="url(#skin)" stroke="#46786C" stroke-width="1"/>
    </g>
    <!-- 身 -->
    <ellipse cx="98" cy="126" rx="9" ry="7" fill="url(#skin)" stroke="#46786C" stroke-width="0.9"/>
    <!-- 尾 -->
    <path d="M 105 130 L 116 132 L 119 137" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年飞龙头（喷火守巢，含威含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="98" cy="116" rx="7.5" ry="6.5" fill="url(#skin)" stroke="#46786C" stroke-width="0.8"/>
    <!-- 眼（含威含护） -->
    <circle cx="94.5" cy="114.5" r="1.8" fill="#24180E"/>
    <circle cx="94.9" cy="114.1" r="0.6" fill="#FFF"/>
    <circle cx="101.5" cy="114.5" r="1.8" fill="#24180E"/>
    <circle cx="101.9" cy="114.1" r="0.6" fill="#FFF"/>
    <!-- 鼻/嘴 -->
    <path d="M 97 119 L 95 121.6 L 99 121 Z" fill="#46786C"/>
    <!-- 头上角（长） -->
    <path d="M 95 111 L 92 106 M 100 111 L 103 106" stroke="#6E9E8E" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 喷火（守巢） -->
    <g fill="#F0A030">
      <path d="M 98 119 Q 100 116 102 118 Q 100 121 98 119 Z">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 夕照星尘 -->
  <g fill="#F8E0A8">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
