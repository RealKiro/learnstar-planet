<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="美人鱼·五阶·海域歌者·礁上唱歌声悠传迷船循歌避暗流">
  <defs>
    <!-- 背景：月下海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E7E9A"/>
      <stop offset="52%" stop-color="#4A6A86"/>
      <stop offset="100%" stop-color="#C8B880"/>
    </linearGradient>
    <!-- 歌之神光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 歌者光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#C8D8DC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C8D8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 美人鱼尾鳞（如月） -->
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EC8B8"/>
      <stop offset="100%" stop-color="#52AC9C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.56;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 歌者光环 -->
  <circle cx="100" cy="110" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 月 -->
  <circle cx="150" cy="30" r="12" fill="#F0F6F8" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.75;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 海面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E8EA0" opacity="0.8"/>
  <g stroke="#8EAEBC" stroke-width="1.3" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 20 158 Q 60 154 100 158 Q 140 162 180 158"/>
  </g>

  <!-- 暗流（右远，被示警） -->
  <g opacity="0.6">
    <path d="M 170 156 Q 182 152 190 156" stroke="#5E6E7E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 循歌的迷船（左下） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 34 158 L 56 156 L 62 162 L 28 162 Z" fill="#8E7A5E"/>
    <path d="M 44 156 L 46 148 L 50 156 Z" fill="#C8B898"/>
    <!-- 循歌光 -->
    <path d="M 72 150 Q 60 154 56 158" stroke="#F0E8C8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 海域歌者美人鱼（礁上唱歌） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 礁 -->
    <path d="M 88 152 Q 96 144 108 146 Q 116 150 118 156 L 96 162 Z" fill="#8E8E82"/>
    <!-- 鱼尾（垂） -->
    <path d="M 100 142 Q 104 148 106 154" stroke="url(#tail)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- 尾鳍 -->
    <path d="M 106 154 Q 112 158 108 164 Q 100 160 106 154 Z" fill="url(#tail)" stroke="#48A08E" stroke-width="0.7"/>
    <!-- 上身（坐礁） -->
    <ellipse cx="98" cy="132" rx="8" ry="9" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 贝壳饰 -->
    <path d="M 95 136 Q 94 140 98 140 Q 102 140 101 136 Z" fill="#E8B8B0" opacity="0.8"/>
  </g>

  <!-- 海域歌者头（唱歌，含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="98" cy="116" rx="7.5" ry="8" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 眼（闭，唱） -->
    <path d="M 94 115 Q 96 113.6 98 115 M 99 115 Q 101 113.6 102 115" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <!-- 嘴（唱歌） -->
    <path d="M 95 120 Q 98 121.4 101 120" fill="none" stroke="#C09880" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 长发如瀑 -->
    <path d="M 94 111 Q 89 104 84 102" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 102 111 Q 107 104 112 102" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 94 108 Q 87 108 82 111" stroke="#5A8A80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 额贝饰 -->
    <circle cx="98" cy="110" r="1.6" fill="#F0E4C8"/>
    <!-- 歌声波纹（悠远护航） -->
    <g stroke="#F0E8C8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 104 114 Q 112 110 118 106">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 104 118 Q 114 114 122 110">
        <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 歌者光 -->
    <circle cx="98" cy="109" r="2.4" fill="#F0E8C8" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 歌者星尘 -->
  <g fill="#F0E8C8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
