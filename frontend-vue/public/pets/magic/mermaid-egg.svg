<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="美人鱼·一阶·礁间幼鱼·摆尾学游扶正纸船看飘远">
  <defs>
    <!-- 背景：珊瑚礁浅湾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4D8E4"/>
      <stop offset="52%" stop-color="#90BCD0"/>
      <stop offset="100%" stop-color="#6EA0B8"/>
    </linearGradient>
    <!-- 海光 -->
    <radialGradient id="glow" cx="48%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#F0FAFC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0FAFC" stop-opacity="0"/>
    </radialGradient>
    <!-- 美人鱼尾鳞 -->
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EC8B8"/>
      <stop offset="100%" stop-color="#58B0A0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="40" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 光斑 -->
  <g fill="#F0FAFC" opacity="0.6">
    <circle cx="120" cy="26" r="3.5">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 珊瑚礁（右） -->
  <g fill="#E8A8A8">
    <path d="M 160 168 Q 156 150 164 140 Q 170 148 170 160 Z"/>
    <path d="M 172 170 Q 170 154 178 148 Q 182 156 182 168 Z"/>
  </g>
  <g fill="#F0C0B0" opacity="0.8">
    <circle cx="168" cy="146" r="3"/>
    <circle cx="176" cy="150" r="2.5"/>
  </g>

  <!-- 海底沙 -->
  <path d="M 0 170 L 200 170 L 200 200 L 0 200 Z" fill="#C8D8D4" opacity="0.7"/>

  <!-- 被扶正的纸船（左，飘远） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 60 146 L 78 144 L 84 150 L 56 150 Z" fill="#F0E4C8"/>
    <path d="M 62 144 L 72 140 L 80 144 Z" fill="#E8D4A8"/>
  </g>

  <!-- 小美人鱼（摆尾学游） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 鱼尾（笨摆） -->
    <path d="M 104 128 Q 112 122 122 118" stroke="url(#tail)" stroke-width="5" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 104 128;8 104 128;0 104 128" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 120 116 L 130 110 L 128 122 Z" fill="url(#tail)" stroke="#48A08E" stroke-width="0.8"/>
    <!-- 上身 -->
    <ellipse cx="102" cy="120" rx="8" ry="9" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 贝壳饰 -->
    <path d="M 99 124 Q 98 128 102 128 Q 106 128 105 124 Z" fill="#E8B8B0" opacity="0.8"/>
  </g>

  <!-- 小美人鱼头（望纸船） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="102" cy="104" rx="7.5" ry="8" fill="#F0DCC0" stroke="#D8C0A0" stroke-width="0.7"/>
    <!-- 眼（大温柔，望船） -->
    <circle cx="98.5" cy="103" r="1.8" fill="#24180E"/>
    <circle cx="98.9" cy="102.6" r="0.6" fill="#FFF"/>
    <circle cx="105.5" cy="103" r="1.8" fill="#24180E"/>
    <circle cx="105.9" cy="102.6" r="0.6" fill="#FFF"/>
    <!-- 笑 -->
    <path d="M 99 107 Q 102 108.4 105 107" fill="none" stroke="#C09880" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 长发青丝 -->
    <path d="M 98 99 Q 94 92 90 90" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 106 99 Q 110 92 114 90" stroke="#5A8A80" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 98 96 Q 92 96 88 98" stroke="#5A8A80" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 额头贝饰 -->
    <circle cx="102" cy="98" r="1.6" fill="#F0E4C8"/>
  </g>

  <!-- 海光星尘 -->
  <g fill="#F0FAFC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
