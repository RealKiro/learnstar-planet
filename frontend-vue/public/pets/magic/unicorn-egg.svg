<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="独角兽·一阶·林间幼驹·踏月学奔溪边角漾银光">
  <defs>
    <!-- 背景：月光林间 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D8E8"/>
      <stop offset="52%" stop-color="#A8B8CC"/>
      <stop offset="100%" stop-color="#8AA0B8"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="glow" cx="24%" cy="18%" r="36%">
      <stop offset="0%" stop-color="#F0F6FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 独角兽毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE8E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="46" cy="34" r="60" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.62;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 月 -->
  <circle cx="42" cy="30" r="12" fill="#F0F6FC" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.75;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 月林 -->
  <g fill="#5E6E82" opacity="0.3">
    <path d="M 0 108 Q 50 100 110 106 Q 160 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9686" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#9EB8A6" stroke-width="1.4" opacity="0.55"/>

  <!-- 小溪（右下） -->
  <path d="M 130 150 Q 145 155 160 152 Q 175 149 200 154 L 200 200 L 130 200 Z" fill="#8EB8C8" opacity="0.7"/>
  <g stroke="#B0D0DC" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 150 162 Q 160 159 170 162">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 溪边的角光（漾开） -->
  <g>
    <circle cx="150" cy="150" r="6" fill="#F0F6FC" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.18;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="11" fill="none" stroke="#F0F6FC" stroke-width="0.8" opacity="0.3">
      <animateTransform attributeName="transform" type="scale" values="1 1;1.4 1.4;1 1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 小独角兽（踏月学奔） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="132" rx="15" ry="10.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 95 139 L 93 148 M 115 139 L 117 148" stroke="#C8C2B8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 119 136 Q 128 132 132 126" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 119 136;7 119 136;0 119 136" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 前蹄（踏月） -->
    <path d="M 94 128 L 90 122" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 94 128;-8 94 128;0 94 128" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小独角兽头（角未亮，微漾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="112" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 眼（大温柔） -->
    <circle cx="99.5" cy="110" r="2.4" fill="#24180E"/>
    <circle cx="100.1" cy="109.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="110" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="109.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="104" cy="115" rx="1.7" ry="1.3" fill="#C8A0A0"/>
    <!-- 嘴 -->
    <path d="M 100 118 Q 104 119.6 108 118" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 耳 -->
    <path d="M 95 106 L 91 99 L 99 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 113 106 L 117 99 L 109 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <!-- 独角（未亮，微光） -->
    <path d="M 104 105 L 104 97" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="104" cy="96" r="1.6" fill="#F0F6FC" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 月光星尘 -->
  <g fill="#F0F6FC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
