<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="魔杖猫·二阶·魔杖之误·乱挥魔杖缠布掀罐缩角落耳耷拉">
  <defs>
    <!-- 背景：魔法小镇街道暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8A88E"/>
      <stop offset="52%" stop-color="#9A8A72"/>
      <stop offset="100%" stop-color="#7E7260"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#E0D4B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0D4B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 小魔杖猫毛（沾布丝） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F2EC"/>
      <stop offset="100%" stop-color="#DCD8D0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 被缠成一团的布（右） -->
  <g fill="#C86050" opacity="0.85">
    <path d="M 140 140 Q 148 132 156 136 Q 152 144 144 146 Z"/>
    <path d="M 150 146 Q 158 142 164 146 Q 158 152 150 148 Z"/>
  </g>
  <g fill="#50A0C8" opacity="0.8">
    <path d="M 158 130 Q 164 126 170 130 Q 166 136 158 134 Z"/>
  </g>
  <!-- 掀翻的猫粮罐（左） -->
  <g>
    <path d="M 60 148 Q 64 142 70 144 L 68 152 Q 62 152 60 148 Z" fill="#8E7A5E" transform="rotate(-18 65 148)"/>
    <g fill="#C8A050" opacity="0.8">
      <circle cx="66" cy="154" r="1.6"/>
      <circle cx="70" cy="156" r="1.4"/>
    </g>
  </g>

  <!-- 小魔杖猫（缩角落，耳耷拉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（缩） -->
    <ellipse cx="96" cy="138" rx="12" ry="9" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.9"/>
    <!-- 腿（缩） -->
    <path d="M 88 144 L 86 150 M 104 144 L 106 150" stroke="#B8B2A8" stroke-width="2" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 108 142 Q 114 144 116 149" stroke="url(#fur)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小魔杖猫头（缩，愧） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="118" rx="9" ry="8" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.9"/>
    <!-- 尖耳（耷拉） -->
    <path d="M 89 112 L 86 106 L 94 110 Z" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.6" transform="rotate(-8 89 112)"/>
    <path d="M 103 112 L 106 106 L 98 110 Z" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.6" transform="rotate(8 103 112)"/>
    <!-- 眼（愧） -->
    <circle cx="92" cy="116" r="2.2" fill="#24180E"/>
    <circle cx="92.6" cy="115.4" r="0.7" fill="#FFF"/>
    <circle cx="100" cy="116" r="2.2" fill="#24180E"/>
    <circle cx="100.6" cy="115.4" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 95 120 L 97 120 L 96 121.4 Z" fill="#E8A0A0"/>
    <!-- 嘴（闯祸） -->
    <path d="M 93 122.5 Q 96 123.8 99 122.5" fill="none" stroke="#C8B0A0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 愧汗 -->
    <circle cx="96" cy="110" r="1" fill="#A8CCE8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 沾的布丝 -->
    <path d="M 92 113 Q 90 111 91 110" stroke="#C86050" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E0D4B8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
