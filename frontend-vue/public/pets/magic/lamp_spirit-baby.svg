<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="元素灯灵·二阶·光灭之惧·风吹光灭跌回灯盏黑暗发抖缩灯沿">
  <defs>
    <!-- 背景：风夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263046"/>
      <stop offset="52%" stop-color="#1A2234"/>
      <stop offset="100%" stop-color="#141A26"/>
    </linearGradient>
    <!-- 残光 -->
    <radialGradient id="glow" cx="50%" cy="56%" r="30%">
      <stop offset="0%" stop-color="#F0C060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0C060" stop-opacity="0"/>
    </radialGradient>
    <!-- 焰身（暗） -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0A850"/>
      <stop offset="100%" stop-color="#C87830"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="108" r="50" fill="url(#glow)">
    <animate attributeName="opacity" values="0.35;0.18;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风痕 -->
  <g stroke="#8EA4BC" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 20 44 Q 40 40 52 42">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 30 Q 150 26 164 28">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 24 Q 76 20 86 22">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 160 90 Q 176 86 186 88">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#18202E" opacity="0.9"/>

  <!-- 古灯（中） -->
  <g>
    <rect x="92" y="140" width="16" height="5" rx="2" fill="#6E6256" stroke="#544A40" stroke-width="0.7"/>
    <path d="M 98 145 L 98 154" stroke="#6E6256" stroke-width="3" stroke-linecap="round"/>
    <path d="M 88 154 L 108 154" stroke="#6E6256" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 94 130 L 94 140 L 106 140 L 106 130 Z" fill="#8E8270" stroke="#6E6256" stroke-width="0.8"/>
  </g>

  <!-- 小灯灵（光灭，跌回灯盏，发抖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 弱光 -->
    <circle cx="100" cy="132" r="7" fill="#F0C060" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.07;0.16" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 焰身（缩成一点，跌坐灯沿） -->
    <path d="M 100 124 Q 106 129 106 133 Q 106 138 100 138 Q 94 138 94 133 Q 94 129 100 124 Z" fill="url(#flame)" stroke="#A86828" stroke-width="0.7"/>
    <!-- 焰发（低垂） -->
    <path d="M 98 124 Q 96 120 99 118 Q 100 122 101 121 Q 103 117 105 119 Q 104 123 102 124" fill="#D89848" stroke="#B86828" stroke-width="0.4"/>
    <!-- 眼（惧，颤） -->
    <circle cx="98" cy="131" r="1.3" fill="#FFF2E0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="102" cy="131" r="1.3" fill="#FFF2E0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾光（灭，余烬） -->
    <path d="M 100 138 Q 100 142 102 145" stroke="#D89848" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="-4 100 138;4 100 138;-4 100 138" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 风尘 -->
  <g fill="#8EA4BC" opacity="0.35">
    <circle cx="48" cy="110">
      <animate attributeName="cy" values="110;104;110" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="96">
      <animate attributeName="cy" values="96;90;96" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
