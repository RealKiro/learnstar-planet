<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="魔杖猫·五阶·魔法使者·蹲钟楼顶尾光如灯引迷巷旅人">
  <defs>
    <!-- 背景：小镇星夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6E"/>
      <stop offset="52%" stop-color="#3A4A5E"/>
      <stop offset="100%" stop-color="#C8B880"/>
    </linearGradient>
    <!-- 使者神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#F8E4A0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8E4A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 使者光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 魔法使者毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 使者光环 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星夜 -->
  <g fill="#E8EEF4">
    <circle cx="40" cy="28" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="22" r="1.2">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="44" r="1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 钟楼（下） -->
  <g fill="#8E8474">
    <path d="M 60 132 L 140 132 L 140 152 L 60 152 Z"/>
    <path d="M 72 132 L 72 152" stroke="#6E6658" stroke-width="1"/>
  </g>
  <!-- 钟 -->
  <circle cx="100" cy="142" r="5" fill="#C8B058"/>

  <!-- 迷巷的旅人（左，被引） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="40" cy="136" r="4.5" fill="#B0986E"/>
    <path d="M 36 140 L 34 148 M 40 140 L 40 148 M 44 140 L 46 148" stroke="#8E7A5E" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 引路光带 -->
    <path d="M 58 134 Q 70 136 80 138" stroke="#F8E4A0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 魔法使者魔杖猫（蹲钟楼顶，尾光如灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（蹲） -->
    <ellipse cx="100" cy="112" rx="13" ry="10" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 92 119 L 90 128 M 108 119 L 110 128" stroke="#C8C2B8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 尾（如灯，垂亮） -->
    <path d="M 113 116 Q 122 114 126 120" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 113 116;-5 113 116;0 113 116" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 尾灯（亮） -->
    <circle cx="127" cy="121" r="3" fill="#F8E4A0">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="127" cy="121" r="6" fill="#F8E4A0" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.12;0.25" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 魔法使者头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="94" rx="9.5" ry="8.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 尖耳 -->
    <path d="M 92 88 L 88 80 L 97 85 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 108 88 L 112 80 L 103 85 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <!-- 眼（含威含温） -->
    <path d="M 93 92 Q 95 90.6 97 92 M 104 92 Q 106 90.6 107 92" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="93" r="2.3" fill="#24180E"/>
    <circle cx="95.6" cy="92.4" r="0.75" fill="#FFF"/>
    <circle cx="105.5" cy="93" r="2.3" fill="#24180E"/>
    <circle cx="106.1" cy="92.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 99 97 L 101 97 L 100 98.4 Z" fill="#E8A0A0"/>
    <!-- 嘴 -->
    <path d="M 97 99.5 Q 100 100.8 103 99.5" fill="none" stroke="#C8B0A0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 额间使者光 -->
    <circle cx="100" cy="87" r="2.8" fill="#F8E4A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 使者星尘 -->
  <g fill="#F8E4A0">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
