<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="灰袍智者·六阶·灰袍传说·暮光扶正小灰袍的书传智者授光">
  <defs>
    <!-- 背景：塔楼暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C4A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#9A8E7A"/>
    </linearGradient>
    <!-- 暮光金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8A8A8"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 书架 -->
  <g>
    <path d="M 14 108 L 56 108 L 56 152 L 14 152 Z" fill="#7E6E56"/>
    <g stroke="#9A8A6E" stroke-width="1.4">
      <path d="M 14 120 L 56 120 M 14 132 L 56 132"/>
    </g>
  </g>

  <!-- 安卧的小鸟（左下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="40" cy="146" rx="5" ry="3.6" fill="#8E9E88"/>
    <circle cx="40" cy="140" r="3.2" fill="#8E9E88"/>
  </g>

  <!-- 小灰袍（左下，抱书） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <path d="M 56 152 L 56 128 Q 56 122 60 122 L 60 152 Z" fill="url(#robe)" stroke="#767676" stroke-width="0.7"/>
    <!-- 抱的书 -->
    <path d="M 56 130 L 70 127 L 72 138 L 58 141 Z" fill="#7E6E56"/>
  </g>
  <!-- 小灰袍头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="116" rx="6.5" ry="6.5" fill="#E8D8C0" stroke="#C8B89A" stroke-width="0.6"/>
    <circle cx="55" cy="115" r="2" fill="none" stroke="#8E8E82" stroke-width="0.6"/>
    <circle cx="61" cy="115" r="2" fill="none" stroke="#8E8E82" stroke-width="0.6"/>
    <circle cx="55" cy="115" r="1" fill="#24180E"/>
    <circle cx="61" cy="115" r="1" fill="#24180E"/>
    <path d="M 55.5 119 Q 58 120.2 60.5 119" fill="none" stroke="#A8886A" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M 55 111 Q 53 108 55 107 M 60 110 Q 62 107 64 108" stroke="#6E5638" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 老灰袍（扶正小灰袍的书，传授光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <path d="M 108 152 L 108 110 Q 108 102 116 102 L 116 152 Z" fill="url(#robe)" stroke="#767676" stroke-width="0.9"/>
    <!-- 扶书的手（伸向小灰袍的书） -->
    <path d="M 110 116 Q 100 120 94 124" stroke="#C8B89A" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 110 116;6 110 116;0 110 116" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 扶正的光 -->
    <path d="M 94 124 Q 84 126 74 128" stroke="#FFF0D0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 老灰袍头（温和，传授光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="114" cy="94" rx="8" ry="8" fill="#E8D8C0" stroke="#C8B89A" stroke-width="0.7"/>
    <!-- 圆镜（如古月） -->
    <circle cx="110" cy="93" r="2.6" fill="none" stroke="#8E8E82" stroke-width="0.7"/>
    <circle cx="118" cy="93" r="2.6" fill="none" stroke="#8E8E82" stroke-width="0.7"/>
    <circle cx="110" cy="93" r="1.2" fill="#24180E"/>
    <circle cx="118" cy="93" r="1.2" fill="#24180E"/>
    <!-- 嘴（授光） -->
    <path d="M 111 98 Q 114 99.2 117 98" fill="none" stroke="#A8886A" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 白发束起 -->
    <path d="M 112 88 Q 114 84 116 88" stroke="#C8C0B0" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 传心微光 -->
    <circle cx="88" cy="104" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
