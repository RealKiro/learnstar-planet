<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精灵·一阶·花间幼灵·扑翼学飞扶花瓣光点洒身">
  <defs>
    <!-- 背景：花田晨露 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8E4"/>
      <stop offset="52%" stop-color="#D0B8CC"/>
      <stop offset="100%" stop-color="#A8C8AC"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#FCF8EC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FCF8EC" stop-opacity="0"/>
    </radialGradient>
    <!-- 精灵光身 -->
    <linearGradient id="glowbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0E0"/>
      <stop offset="100%" stop-color="#E8DCBC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 花田 -->
  <g fill="#6E9E7A" opacity="0.3">
    <path d="M 0 108 Q 50 102 110 106 Q 160 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#86AE8A" opacity="0.8"/>

  <!-- 花（大） -->
  <g>
    <path d="M 60 148 L 60 138" stroke="#7E9E6E" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#F0A0B8">
      <circle cx="57" cy="134" r="3.5"/>
      <circle cx="63" cy="134" r="3.5"/>
      <circle cx="60" cy="131" r="3.5"/>
      <circle cx="60" cy="137" r="3.5"/>
      <circle cx="60" cy="134" r="2" fill="#F8E8A0"/>
    </g>
    <path d="M 148 148 L 148 140" stroke="#7E9E6E" stroke-width="1.4" stroke-linecap="round"/>
    <g fill="#F8C860">
      <circle cx="145.4" cy="136" r="3"/>
      <circle cx="150.6" cy="136" r="3"/>
      <circle cx="148" cy="133" r="3"/>
      <circle cx="148" cy="139" r="3"/>
      <circle cx="148" cy="136" r="1.8" fill="#FCF4D0"/>
    </g>
  </g>

  <!-- 晨露（花瓣上） -->
  <circle cx="60" cy="130" r="1.5" fill="#DCE8F0" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 小精灵（扑翼扶花，光点洒） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（小巧，光） -->
    <ellipse cx="104" cy="120" rx="7" ry="9" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.8"/>
    <!-- 透明翼 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12 98 114;12 98 114;-12 98 114" dur="1.6s" repeatCount="indefinite"/>
      <path d="M 98 114 Q 88 102 82 92 L 100 108 Z" fill="#F0E8F4" opacity="0.6"/>
      <path d="M 98 114 Q 108 102 114 92 L 96 108 Z" fill="#F0E8F4" opacity="0.6"/>
    </g>
    <!-- 光点（指尖） -->
    <g fill="#FCF8EC">
      <circle cx="98" cy="112" r="1.4">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="110" r="1.2">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 扶花的指尖 -->
    <path d="M 106 126 L 110 130" stroke="#D0C098" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 小精灵头（圆眼亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="104" rx="6" ry="6.5" fill="url(#glowbody)" stroke="#D0C098" stroke-width="0.7"/>
    <!-- 眼（大闪亮） -->
    <circle cx="101" cy="103" r="1.6" fill="#24180E"/>
    <circle cx="101.4" cy="102.6" r="0.55" fill="#FFF"/>
    <circle cx="107" cy="103" r="1.6" fill="#24180E"/>
    <circle cx="107.4" cy="102.6" r="0.55" fill="#FFF"/>
    <!-- 笑 -->
    <path d="M 102 107 Q 104 108.2 106 107" fill="none" stroke="#C0B090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 发（星光） -->
    <path d="M 100 100 Q 100 96 104 95 M 106 99 Q 108 96 110 97" stroke="#F0D8A0" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FCF8EC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
