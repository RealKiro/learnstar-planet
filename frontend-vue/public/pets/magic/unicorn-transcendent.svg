<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="独角兽·六阶·独角兽传说·暮光角碰小独角兽传角为净化语">
  <defs>
    <!-- 背景：圣林暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C8A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#94A8BC"/>
    </linearGradient>
    <!-- 暮光金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 独角兽毛（泛岁月光） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6E2DA"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 圣林 -->
  <g fill="#5E6E82" opacity="0.35">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9686" opacity="0.8"/>

  <!-- 安卧的小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="44" cy="144" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="44" cy="137" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 小独角兽（左下，踏月学奔） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="60" cy="136" rx="11" ry="8" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.8"/>
    <!-- 腿 -->
    <path d="M 54 141 L 52 147 M 67 141 L 69 147" stroke="#C8C2B8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 71 140 Q 77 138 79 143" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 前蹄（踏月） -->
    <path d="M 56 130 L 52 125" stroke="url(#fur)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 小独角兽头（角未亮，发愁） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="124" rx="8.5" ry="7.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.8"/>
    <circle cx="56.5" cy="122.5" r="2" fill="#24180E"/>
    <circle cx="57" cy="122" r="0.65" fill="#FFF"/>
    <circle cx="64" cy="122.5" r="2" fill="#24180E"/>
    <circle cx="64.5" cy="122" r="0.65" fill="#FFF"/>
    <ellipse cx="60" cy="126.5" rx="1.4" ry="1" fill="#C8A0A0"/>
    <path d="M 55 118 L 52 112 L 59 116 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.5"/>
    <path d="M 65 118 L 68 112 L 61 116 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.5"/>
    <path d="M 60 118 L 60 111" stroke="#E8E0D0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="60" cy="110" r="1.4" fill="#FFF0D0" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老独角兽（角碰小角，传净化） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="118" cy="128" rx="16" ry="11" fill="url(#fur)" stroke="#C8C2B8" stroke-width="1"/>
    <!-- 腿 -->
    <path d="M 108 136 L 105 146 M 130 136 L 133 146" stroke="#C8C2B8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 134 132 Q 142 128 146 122" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 头（低，角碰小角） -->
    <path d="M 110 122 Q 100 124 92 124" stroke="url(#fur)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="88" cy="126" rx="9" ry="8" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <circle cx="84" cy="124" r="1.9" fill="#24180E"/>
    <circle cx="84.5" cy="123.6" r="0.6" fill="#FFF"/>
    <circle cx="92" cy="124" r="1.9" fill="#24180E"/>
    <circle cx="92.5" cy="123.6" r="0.6" fill="#FFF"/>
    <!-- 独角（垂，碰小角） -->
    <path d="M 86 130 Q 80 128 76 126" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 86 130;-5 86 130;0 86 130" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="72" cy="116" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
