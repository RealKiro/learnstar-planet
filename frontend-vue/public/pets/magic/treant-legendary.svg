<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="树人·五阶·森林之祖·立森林高根如网伸根遮洞引水浇苗">
  <defs>
    <!-- 背景：森林夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B0"/>
      <stop offset="52%" stop-color="#C8BC90"/>
      <stop offset="100%" stop-color="#92AC94"/>
    </linearGradient>
    <!-- 祖之神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#F8F4DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F4DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8E4CC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8E4CC" stop-opacity="0"/>
    </radialGradient>
    <!-- 森林之祖树皮 -->
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A88A60"/>
      <stop offset="100%" stop-color="#86704C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林 -->
  <g fill="#6E9E78" opacity="0.35">
    <path d="M 0 124 Q 60 116 130 122 Q 170 126 200 120 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#86A87A" opacity="0.8"/>

  <!-- 树洞中的小兽（左，被遮） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 34 150 Q 40 140 52 142 Q 58 148 56 152 L 40 154 Z" fill="#5E4A30"/>
    <ellipse cx="46" cy="146" rx="5" ry="3.6" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <circle cx="46" cy="141" r="3" fill="#C4C8B0"/>
    <!-- 遮洞的根光 -->
    <path d="M 40 140 Q 52 136 62 140" stroke="#8E7048" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- 缺水的小树苗（右前，被引水） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 150 150 L 150 142" stroke="#6E5640" stroke-width="1.2" stroke-linecap="round"/>
    <g fill="#6E9E5E">
      <path d="M 148 142 Q 144 138 142 134 Q 147 138 150 140 Z"/>
      <path d="M 152 142 Q 156 138 158 134 Q 153 138 150 140 Z"/>
    </g>
    <!-- 引水光（根→苗） -->
    <path d="M 138 152 Q 144 148 148 144" stroke="#A8D0BC" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 森林之祖树人（立高，根如网） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 根（如网铺四方） -->
    <g stroke="#6E5638" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M 92 148 Q 74 144 58 144"/>
      <path d="M 92 148 L 84 158 L 78 166"/>
      <path d="M 108 148 Q 126 144 140 146"/>
      <path d="M 108 148 L 116 158 L 122 164"/>
    </g>
    <!-- 树干（高大如华盖） -->
    <path d="M 92 148 L 92 96 Q 100 82 108 96 L 108 148 Z" fill="url(#bark)" stroke="#7A5E3E" stroke-width="1.2"/>
    <!-- 树皮纹 -->
    <path d="M 95 118 L 105 118 M 95 128 L 105 128 M 95 138 L 105 138" stroke="#6E5638" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 枝（如华盖） -->
    <path d="M 98 92 Q 94 76 82 68" stroke="#7E9E6E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 102 92 Q 108 78 120 70" stroke="#7E9E6E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 森林之祖头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 华盖叶 -->
    <g fill="#7EAE6E">
      <path d="M 82 68 Q 76 62 72 56 Q 80 60 84 66 Z"/>
      <path d="M 120 70 Q 126 64 130 58 Q 122 62 118 68 Z"/>
      <path d="M 92 84 Q 86 78 82 72 Q 90 76 94 82 Z"/>
      <path d="M 108 84 Q 114 78 118 72 Q 110 76 106 82 Z"/>
    </g>
    <!-- 眼（含威含温，在树干上） -->
    <path d="M 94 104 Q 96 102.6 98 104 M 102 104 Q 104 102.6 105 104" stroke="#3E2E1A" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="105" r="2.2" fill="#3E2E1A"/>
    <circle cx="96.6" cy="104.4" r="0.7" fill="#F0E8D0"/>
    <circle cx="104" cy="105" r="2.2" fill="#3E2E1A"/>
    <circle cx="104.6" cy="104.4" r="0.7" fill="#F0E8D0"/>
    <!-- 嘴 -->
    <path d="M 96 109 Q 100 110.4 104 109" fill="none" stroke="#5E4A30" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 额间祖光 -->
    <circle cx="100" cy="98" r="3" fill="#F8F4DC" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 祖光星尘 -->
  <g fill="#F8F4DC">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
