<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="飞龙·六阶·飞龙传说·暮色翼拢小飞龙传翼为穹顶火为灯">
  <defs>
    <!-- 背景：崖巢暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C8A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#98A8A0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 老飞龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9E8E"/>
      <stop offset="100%" stop-color="#4E7C72"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F0F6F0" opacity="0.85">
    <path d="M 0 132 Q 50 124 110 130 Q 160 134 200 128 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 崖巢 -->
  <g fill="#A0A8B0" opacity="0.5">
    <path d="M 140 200 L 146 178 Q 162 172 180 176 L 200 172 L 200 200 Z"/>
  </g>

  <!-- 巢中的蛋（右下，安然） -->
  <g>
    <ellipse cx="168" cy="178" rx="4.5" ry="5.5" fill="#F0E8D8" stroke="#C8B89A" stroke-width="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.5;0 0" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 小飞龙（左下，扑翼学飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（嫩，扑） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 66 110;8 66 110;-8 66 110" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 62 114 L 50 108 L 54 116 Z" fill="#D8785E"/>
      <path d="M 62 114 L 74 108 L 70 116 Z" fill="#D8785E"/>
    </g>
    <!-- 身 -->
    <ellipse cx="64" cy="118" rx="6" ry="4.6" fill="url(#skin)" stroke="#46786C" stroke-width="0.7"/>
    <!-- 尾 -->
    <path d="M 70 120 L 76 121 L 78 125" stroke="url(#skin)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 小飞龙头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="110" rx="5.5" ry="4.8" fill="url(#skin)" stroke="#46786C" stroke-width="0.7"/>
    <circle cx="61.5" cy="108.5" r="1.4" fill="#24180E"/>
    <circle cx="61.8" cy="108.2" r="0.45" fill="#FFF"/>
    <circle cx="66.5" cy="108.5" r="1.4" fill="#24180E"/>
    <circle cx="66.8" cy="108.2" r="0.45" fill="#FFF"/>
    <path d="M 63 112 L 61.6 114.4 L 64.4 113.8 Z" fill="#46786C"/>
  </g>

  <!-- 老飞龙（翼拢小飞龙，传护巢） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 翼（拢，如穹顶） -->
    <path d="M 92 116 L 60 104 L 66 116 L 46 108 L 62 120 Z" fill="url(#skin)" stroke="#46786C" stroke-width="1"/>
    <path d="M 92 116 L 124 104 L 118 116 L 138 108 L 122 120 Z" fill="url(#skin)" stroke="#46786C" stroke-width="1"/>
    <!-- 身 -->
    <ellipse cx="96" cy="120" rx="9" ry="7" fill="url(#skin)" stroke="#46786C" stroke-width="0.9"/>
    <!-- 尾 -->
    <path d="M 103 124 L 114 126 L 117 131" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 翼尖轻拢（下，托小飞龙） -->
    <path d="M 66 116 Q 62 120 60 123" stroke="url(#skin)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老飞龙头（温和，传护巢） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="110" rx="7.5" ry="6.5" fill="url(#skin)" stroke="#46786C" stroke-width="0.8"/>
    <circle cx="92.5" cy="108.5" r="1.7" fill="#24180E"/>
    <circle cx="92.9" cy="108.1" r="0.55" fill="#FFF"/>
    <circle cx="99.5" cy="108.5" r="1.7" fill="#24180E"/>
    <circle cx="99.9" cy="108.1" r="0.55" fill="#FFF"/>
    <path d="M 95 113 L 93 115.6 L 97 115 Z" fill="#46786C"/>
    <path d="M 93 105 L 90 100 M 98 105 L 101 100" stroke="#6E9E8E" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 传心微光 -->
    <circle cx="78" cy="108" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
