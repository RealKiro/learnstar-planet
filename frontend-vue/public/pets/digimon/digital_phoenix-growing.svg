<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="比丘兽·三阶·练羽苦修·森林练飞穿隙稳一啄解藤小兽蹭它抹泪笑">
  <defs>
    <!-- 背景：数码森林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AA878"/>
      <stop offset="52%" stop-color="#6AB880"/>
      <stop offset="100%" stop-color="#4E9868"/>
    </linearGradient>
    <!-- 森林光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#C8F0D8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄羽毛（亮） -->
    <radialGradient id="feather" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F8CC68"/>
      <stop offset="100%" stop-color="#E8A838"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林树影 -->
  <g fill="#3E7848" opacity="0.45">
    <path d="M 0 56 L 10 18 L 20 54 L 26 28 L 34 60 L 0 200 L 0 60 Z"/>
    <path d="M 172 52 L 182 14 L 190 50 L 200 40 L 200 200 L 172 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#4E9868" opacity="0.9"/>

  <!-- 被啄开的数据藤（右，已解） -->
  <g>
    <g stroke="#5AA8E8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 140 112 L 148 116">
        <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 146 120 L 152 124" opacity="0.4">
        <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 脱困的小兽（蹭它） -->
    <circle cx="146" cy="128" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年比丘兽（中，穿隙稳飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翅（稳张） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 82 112;5 82 112;-5 82 112" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 82 112 L 64 98 L 72 104 L 58 96 L 70 108 Z" fill="#F0C860" stroke="#C88828" stroke-width="0.7"/>
      <path d="M 82 112 L 66 106 L 76 108" stroke="#D8A848" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 120 108;5 120 108;-5 120 108" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 120 108 L 138 94 L 130 100 L 144 92 L 132 104 Z" fill="#F0C860" stroke="#C88828" stroke-width="0.7"/>
      <path d="M 120 108 L 136 102 L 126 104" stroke="#D8A848" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <!-- 身 -->
    <ellipse cx="100" cy="116" rx="14" ry="12" fill="url(#feather)" stroke="#C88828" stroke-width="0.9"/>
    <!-- 蓬毛尾 -->
    <path d="M 88 126 Q 80 130 84 134 Q 90 132 94 128" fill="#F0C860" stroke="#C88828" stroke-width="0.6"/>
    <!-- 头顶毛（亮） -->
    <path d="M 96 106 Q 100 98 104 106 M 92 108 Q 96 102 100 108" fill="#F0C860" stroke="#C88828" stroke-width="0.5"/>
    <!-- 头 -->
    <ellipse cx="100" cy="106" rx="9" ry="8" fill="url(#feather)" stroke="#C88828" stroke-width="0.8"/>
    <!-- 眼（沉稳，微笑） -->
    <circle cx="96" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="96.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="105" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="105.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 嘴（精啄） -->
    <path d="M 107 107 L 114 106.5 L 107 109 Z" fill="#E88848" stroke="#C86828" stroke-width="0.5"/>
    <!-- 抹泪的翅（已稳） -->
    <path d="M 92 100 Q 88 94 90 90" stroke="#F0C860" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8F0D8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
