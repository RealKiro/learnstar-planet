<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巴达兽·五阶·天空守护·翼展如穹盘旋天空接住跌倒翼挡风暴">
  <defs>
    <!-- 背景：数码天空最高处 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A6AC8"/>
      <stop offset="52%" stop-color="#7AB0E0"/>
      <stop offset="100%" stop-color="#C8E8F8"/>
    </linearGradient>
    <!-- 圣光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F8FCF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FCF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 圣兽光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乳白身 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0E8"/>
    </radialGradient>
    <!-- 圣羽 -->
    <radialGradient id="wing" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C0D8E8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.66;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="82" r="66" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云层 -->
  <g fill="#F8FCF8" opacity="0.7">
    <ellipse cx="52" cy="140" rx="26" ry="9"/>
    <ellipse cx="150" cy="146" rx="30" ry="10"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#A8D8F0" opacity="0.6"/>

  <!-- 被接住的跌倒者（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="116" r="4" fill="#A8E0E8" stroke="#68A8C8" stroke-width="0.5"/>
    <circle cx="56" cy="114.8" r="1" fill="#24180E"/>
    <circle cx="61" cy="114.8" r="1" fill="#24180E"/>
  </g>

  <!-- 被挡的数据风暴（右） -->
  <g stroke="#5AA8E8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 168 66 Q 176 80 172 92">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 176 70 Q 184 84 180 96" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 守护圣兽（中，翼展如穹） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 圣翼（如穹） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 82 108;4 82 108;-4 82 108" dur="2.2s" repeatCount="indefinite"/>
      <path d="M 82 108 L 46 78 L 62 94 L 40 76 L 58 100 Z" fill="url(#wing)" stroke="#A8C0D8" stroke-width="1"/>
      <path d="M 82 108 L 52 92 L 70 96" stroke="#B8CCE0" stroke-width="0.7" fill="none" opacity="0.7"/>
      <path d="M 62 94 L 56 84" stroke="#B8CCE0" stroke-width="0.5" fill="none" opacity="0.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 126 106;4 126 106;-4 126 106" dur="2.2s" repeatCount="indefinite"/>
      <path d="M 126 106 L 162 76 L 146 92 L 168 74 L 150 98 Z" fill="url(#wing)" stroke="#A8C0D8" stroke-width="1"/>
      <path d="M 126 106 L 156 90 L 138 94" stroke="#B8CCE0" stroke-width="0.7" fill="none" opacity="0.7"/>
      <path d="M 146 92 L 152 82" stroke="#B8CCE0" stroke-width="0.5" fill="none" opacity="0.6"/>
    </g>
    <!-- 身 -->
    <ellipse cx="104" cy="114" rx="16" ry="12" fill="url(#body)" stroke="#D0D0CA" stroke-width="1"/>
    <ellipse cx="102" cy="120" rx="10" ry="6.5" fill="#F8F4F0" opacity="0.7"/>
    <!-- 吻 -->
    <path d="M 116 112 Q 124 112 126 110 Q 124 116 116 116 Z" fill="#F0F0EA" stroke="#C8C8C2" stroke-width="0.6"/>
    <!-- 眼（含威含温） -->
    <circle cx="108" cy="110" r="2.8" fill="#2E2A24"/>
    <circle cx="109" cy="108.8" r="1.1" fill="#FFF"/>
    <circle cx="117" cy="110" r="2.8" fill="#2E2A24"/>
    <circle cx="118" cy="108.8" r="1.1" fill="#FFF"/>
    <!-- 额饰（圣） -->
    <path d="M 110 104 Q 114 101 118 104 L 114 107 Z" fill="#5AA8E8" opacity="0.8"/>
    <!-- 嘴（定） -->
    <path d="M 113 115 Q 116 116.6 119 115" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 尾鳍 -->
    <path d="M 89 118 Q 80 112 78 120 Q 80 128 89 124 Z" fill="#F0F0EA" stroke="#C8C8C2" stroke-width="0.6"/>
  </g>

  <!-- 星尘 -->
  <g fill="#F8FCF8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
