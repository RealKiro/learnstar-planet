<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哥玛兽·二阶·被嘲之痛·笨手被取笑蹲浅海边看鳍怕下水">
  <defs>
    <!-- 背景：数码浅海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9AC8"/>
      <stop offset="52%" stop-color="#6AA8D8"/>
      <stop offset="100%" stop-color="#7AC0E0"/>
    </linearGradient>
    <!-- 弱海光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#D8F0F8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 海狮白毛（乱） -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F0F4F6"/>
      <stop offset="100%" stop-color="#C4D0D4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 笑作一团的伙伴（右） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="116" r="4" fill="#A8E0E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="170" cy="108" r="3.5" fill="#B8E8F8" stroke="#68B8D8" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- 笑的嘴 -->
    <path d="M 153 117 Q 155 119 157 117" fill="none" stroke="#7A90A8" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 海边 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6AA8D8" opacity="0.8"/>
  <!-- 水纹 -->
  <g stroke="#B8E0F0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 0 156 Q 60 152 120 156 Q 160 159 200 155"/>
  </g>

  <!-- 蹲海边的小哥玛兽（左，看鳍） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 身（蹲，毛乱） -->
    <ellipse cx="66" cy="136" rx="13" ry="10" fill="url(#fur)" stroke="#AEC0C4" stroke-width="0.9"/>
    <!-- 头顶毛（乱） -->
    <path d="M 62 128 Q 66 122 70 128 M 60 130 Q 64 124 68 130" fill="#D0D8DC" stroke="#AEC0C4" stroke-width="0.5"/>
    <!-- 头（低垂看鳍） -->
    <ellipse cx="66" cy="128" rx="8" ry="7" fill="url(#fur)" stroke="#AEC0C4" stroke-width="0.8" transform="rotate(-10 66 128)"/>
    <!-- 眼（含沮，看鳍） -->
    <circle cx="62" cy="127" r="2.2" fill="#2E2A24"/>
    <circle cx="62.8" cy="125.8" r="0.9" fill="#FFF"/>
    <circle cx="71" cy="127" r="2.2" fill="#2E2A24"/>
    <circle cx="71.8" cy="125.8" r="0.9" fill="#FFF"/>
    <!-- 嘴（低垂） -->
    <path d="M 64 131 Q 67 129.6 70 131" fill="none" stroke="#9EB0B4" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 鳍（缠线，垂） -->
    <path d="M 56 136 L 52 142" stroke="#C4D0D4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 76 136 L 80 142" stroke="#C4D0D4" stroke-width="3" stroke-linecap="round"/>
    <!-- 缠在鳍上的数据线 -->
    <path d="M 54 138 Q 58 140 56 144" stroke="#5A7A9A" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M 78 138 Q 74 140 76 144" stroke="#5A7A9A" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8F0F8" opacity="0.35">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
