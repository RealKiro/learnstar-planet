<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="比丘兽·二阶·被弃之泪·慌手帮倒忙被赶走蹲树后哭一整夜">
  <defs>
    <!-- 背景：数码森林夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A5A"/>
      <stop offset="52%" stop-color="#3E5068"/>
      <stop offset="100%" stop-color="#4E6A58"/>
    </linearGradient>
    <!-- 泪光 -->
    <radialGradient id="glow" cx="38%" cy="34%" r="34%">
      <stop offset="0%" stop-color="#A8C8E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8C8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄羽毛（微乱） -->
    <radialGradient id="feather" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E8B858"/>
      <stop offset="100%" stop-color="#C89028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="76" cy="68" r="64" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#C8D8E8" opacity="0.5">
    <circle cx="160" cy="36" r="1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="60" r="0.9">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 远走的伙伴（右） -->
  <g opacity="0.5">
    <circle cx="160" cy="112" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="174" cy="104" r="3.5" fill="#B8E8F8" stroke="#68B8D8" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#3E5068" opacity="0.9"/>

  <!-- 树（后） -->
  <path d="M 90 148 L 96 60 L 104 60 L 108 148 Z" fill="#2E3A4E" opacity="0.8"/>
  <ellipse cx="100" cy="56" rx="22" ry="14" fill="#2E3A4E" opacity="0.7"/>

  <!-- 蹲树后哭的小比丘兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 身（蹲，蓬乱） -->
    <ellipse cx="66" cy="134" rx="13" ry="11" fill="url(#feather)" stroke="#B07820" stroke-width="0.9"/>
    <!-- 蓬毛（乱） -->
    <path d="M 56 140 Q 50 144 54 147 Q 60 145 64 141" fill="#D8A848" stroke="#B07820" stroke-width="0.5"/>
    <!-- 头（低垂） -->
    <ellipse cx="66" cy="124" rx="8.5" ry="7.5" fill="url(#feather)" stroke="#B07820" stroke-width="0.8" transform="rotate(8 66 124)"/>
    <path d="M 60 118 Q 64 112 68 118" fill="#D8A848" stroke="#B07820" stroke-width="0.5"/>
    <!-- 眼（含泪，湿） -->
    <circle cx="62" cy="123" r="2.4" fill="#2E2A24"/>
    <circle cx="62.8" cy="121.8" r="0.9" fill="#FFF"/>
    <circle cx="71" cy="123" r="2.4" fill="#2E2A24"/>
    <circle cx="71.8" cy="121.8" r="0.9" fill="#FFF"/>
    <circle cx="63" cy="122.5" r="1.1" fill="#A8D4E8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="122.5" r="1" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（低垂） -->
    <path d="M 72 127 L 77 126.5 L 72 129 Z" fill="#D87838" stroke="#B05828" stroke-width="0.5"/>
    <!-- 翅（垂） -->
    <path d="M 56 126 L 50 132" stroke="#D8A848" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 泪珠 -->
  <g fill="#A8D4E8" opacity="0.8">
    <circle cx="66" cy="140" r="1.3">
      <animate attributeName="cy" values="140;144;140" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 尘灰 -->
  <g fill="#8EA4BC" opacity="0.3">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
