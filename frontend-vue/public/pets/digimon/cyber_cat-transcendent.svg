<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="迪路兽·六阶·迪路兽传说·暮光老圣兽尾尖碰小迪路兽传信自己光会亮">
  <defs>
    <!-- 背景：数码暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#9E9868"/>
      <stop offset="100%" stop-color="#5E7A9A"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0DA"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5E7A9A" opacity="0.9"/>

  <!-- 得救的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="90" cy="134.5" r="1" fill="#24180E"/>
    <circle cx="94" cy="134.5" r="1" fill="#24180E"/>
  </g>

  <!-- 小迪路兽（右，旧线缠） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="142" cy="126" rx="10" ry="8" fill="url(#fur)" stroke="#C8C8C2" stroke-width="0.8"/>
    <ellipse cx="142" cy="116" rx="7.5" ry="6.5" fill="url(#fur)" stroke="#C8C8C2" stroke-width="0.7"/>
    <path d="M 135 113 Q 131 118 133 123 Q 136 121 138 117 Z" fill="#D8D8D4" stroke="#C0C0BA" stroke-width="0.5"/>
    <path d="M 149 113 Q 153 118 151 123 Q 148 121 146 117 Z" fill="#D8D8D4" stroke="#C0C0BA" stroke-width="0.5"/>
    <path d="M 146 122 Q 152 124 150 128" stroke="#5A7A9A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="138" cy="115" r="1.6" fill="#2E2A24"/>
    <circle cx="138.6" cy="114.2" r="0.6" fill="#FFF"/>
    <circle cx="147" cy="115" r="1.6" fill="#2E2A24"/>
    <circle cx="147.6" cy="114.2" r="0.6" fill="#FFF"/>
    <path d="M 140 119 Q 142 120.2 144 119" fill="none" stroke="#B0A090" stroke-width="0.5" stroke-linecap="round"/>
  </g>

  <!-- 老迪路兽（左，尾尖碰小迪路兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾（扬，伸向小迪路兽） -->
    <path d="M 82 108 Q 100 102 116 108" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-3 82 108;3 82 108;-3 82 108" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 腿 -->
    <path d="M 64 132 L 59 150 M 82 132 L 87 150" stroke="#E0E0DA" stroke-width="5" stroke-linecap="round"/>
    <!-- 身（大，泛岁月光） -->
    <ellipse cx="76" cy="124" rx="15" ry="13" fill="url(#fur)" stroke="#C8C4BC" stroke-width="1"/>
    <!-- 头 -->
    <ellipse cx="76" cy="108" rx="10" ry="8.5" fill="url(#fur)" stroke="#C8C4BC" stroke-width="0.9"/>
    <path d="M 67 103 Q 62 94 68 93 Q 72 99 73 104 Z" fill="#FFFFFF" stroke="#C8C4BC" stroke-width="0.6"/>
    <path d="M 83 103 Q 88 94 82 93 Q 78 99 77 104 Z" fill="#FFFFFF" stroke="#C8C4BC" stroke-width="0.6"/>
    <path d="M 72 102 Q 76 99 80 102 L 76 105 Z" fill="#5AA8E8" opacity="0.7"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 71 107 Q 73 105.6 75 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 80 107 Q 82 105.6 83 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 74 112 Q 77 113.6 80 112" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 尾尖微光 -->
    <circle cx="118" cy="106" r="2.5" fill="#FFF8D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 传心微光 -->
    <circle cx="124" cy="110" r="9" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
