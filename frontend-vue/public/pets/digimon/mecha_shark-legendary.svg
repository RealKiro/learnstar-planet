<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哥玛兽·五阶·海流守护·鳍如古桨巡游海流接住被冲拍浪墙挡漩涡">
  <defs>
    <!-- 背景：数码海流 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A7AC8"/>
      <stop offset="52%" stop-color="#5AA8E0"/>
      <stop offset="100%" stop-color="#8AD0F0"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#E8F8FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#D8F0F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 海狮白毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECEE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 海流 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5AA8E0" opacity="0.8"/>
  <g stroke="#B8E8F8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 0 156 Q 60 148 120 156 Q 160 162 200 156">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被接住的冲流小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="112" r="4" fill="#A8E0E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="56" cy="110.8" r="1" fill="#24180E"/>
    <circle cx="61" cy="110.8" r="1" fill="#24180E"/>
  </g>

  <!-- 数据漩涡（右，被浪墙挡） -->
  <g>
    <circle cx="168" cy="96" r="20" fill="none" stroke="#5AA8E8" stroke-width="1.3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 168 96;40 168 96;0 168 96" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="96" r="13" fill="none" stroke="#5AA8E8" stroke-width="1" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 168 96;-40 168 96;0 168 96" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 浪墙 -->
  <path d="M 136 148 Q 144 110 136 72" stroke="#E8F8FC" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 守护圣兽（中，鳍如古桨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身（大，如铠） -->
    <ellipse cx="100" cy="112" rx="17" ry="13" fill="url(#fur)" stroke="#C8D4D8" stroke-width="1"/>
    <ellipse cx="98" cy="117" rx="10" ry="6.5" fill="#F8FAFA" opacity="0.7"/>
    <!-- 尾鳍（如桨） -->
    <path d="M 84 116 Q 70 116 64 126 Q 70 132 84 124 Z" fill="#E8ECEE" stroke="#C8D4D8" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="-4 84 118;4 84 118;-4 84 118" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 大鳍（如古桨） -->
    <path d="M 114 106 L 134 92" stroke="#E8ECEE" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 114 106;5 114 106;-5 114 106" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 86 116 L 72 126" stroke="#E8ECEE" stroke-width="4" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="100" cy="102" rx="10" ry="9" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.9"/>
    <!-- 头顶毛如冠 -->
    <path d="M 96 95 Q 100 88 104 95 M 94 97 Q 98 90 102 97" fill="#E8ECEE" stroke="#C8D4D8" stroke-width="0.6"/>
    <circle cx="100" cy="90" r="2.5" fill="#E8F8FC" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（含威含温） -->
    <circle cx="95" cy="101" r="2.6" fill="#2E2A24"/>
    <circle cx="95.8" cy="99.8" r="1" fill="#FFF"/>
    <circle cx="106" cy="101" r="2.6" fill="#2E2A24"/>
    <circle cx="106.8" cy="99.8" r="1" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 97 106 Q 100 107.6 103 106" fill="none" stroke="#B0BCC0" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 水花 -->
    <g fill="#E8F8FC" opacity="0.8">
      <circle cx="70" cy="132" r="2.2">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="126" r="2">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F8FC">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
