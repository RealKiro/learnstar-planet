<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="加布兽·四阶·暖伴初成·暴风雪夜张皮拢护冻兽群焐到天亮">
  <defs>
    <!-- 背景：暴风雪夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4A72"/>
      <stop offset="52%" stop-color="#5E7A9A"/>
      <stop offset="100%" stop-color="#A8C8DC"/>
    </linearGradient>
    <!-- 雪夜光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="40%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝白皮 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#7AACD0"/>
      <stop offset="100%" stop-color="#5284B0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="68" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 暴风雪 -->
  <g fill="#E8F0F8" opacity="0.6">
    <circle cx="30" cy="30" r="1.2">
      <animate attributeName="cy" values="30;58;30" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="20" r="1">
      <animate attributeName="cy" values="20;48;20" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="60" r="1.1">
      <animate attributeName="cy" values="60;88;60" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#A8C8E0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 20 90 Q 40 84 56 86">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 144 80 Q 162 76 178 78" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#A8C8DC" opacity="0.9"/>

  <!-- 暖伴的加布兽（中，张皮拢护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 张开的皮（如罩） -->
    <path d="M 100 108 Q 74 100 64 112 Q 58 122 64 132 Q 100 142 136 132 Q 142 122 136 112 Q 126 100 100 108 Z" fill="url(#fur)" stroke="#3A6088" stroke-width="1.1"/>
    <!-- 皮内暖光 -->
    <ellipse cx="100" cy="122" rx="30" ry="16" fill="#F8F0D8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 皮内的小兽（拢护） -->
    <g>
      <circle cx="86" cy="120" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
      <circle cx="100" cy="124" r="3.5" fill="#B8E8F8" stroke="#68B8D8" stroke-width="0.5"/>
      <circle cx="112" cy="119" r="3.5" fill="#A8E0E8" stroke="#5AA8C8" stroke-width="0.5"/>
    </g>
    <!-- 头（露在皮外，圆眼） -->
    <ellipse cx="100" cy="102" rx="10" ry="9" fill="url(#fur)" stroke="#3A6088" stroke-width="0.9"/>
    <ellipse cx="98" cy="99" rx="7" ry="4.5" fill="#F0F6FC" stroke="#D8E8F0" stroke-width="0.5"/>
    <!-- 眼（含温，望向小兽） -->
    <circle cx="94" cy="99" r="2.8" fill="#2E2A24"/>
    <circle cx="95" cy="97.8" r="1.1" fill="#FFF"/>
    <circle cx="105" cy="99" r="2.8" fill="#2E2A24"/>
    <circle cx="106" cy="97.8" r="1.1" fill="#FFF"/>
    <!-- 嘴（暖） -->
    <path d="M 96 104 Q 100 105.8 104 104" fill="none" stroke="#5E7E9E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 风雪拍背的痕 -->
    <circle cx="70" cy="96" r="1.2" fill="#E8F0F8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="94" r="1.1" fill="#E8F0F8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F0F8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
