<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="迪路兽·一阶·遗忘小猫·数码废墟旧数据线缠身见夹想帮线绊倒">
  <defs>
    <!-- 背景：数码废墟 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E6A82"/>
      <stop offset="52%" stop-color="#4A566E"/>
      <stop offset="100%" stop-color="#3A4458"/>
    </linearGradient>
    <!-- 数据光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#A8E0F8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0DC"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.28;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 废墟碎片 -->
  <g fill="#6E7A92" opacity="0.6">
    <rect x="16" y="110" width="22" height="10" rx="2"/>
    <path d="M 156 104 L 182 96 L 184 102 L 160 110 Z"/>
    <path d="M 140 88 L 156 84 L 154 90 L 142 93 Z"/>
  </g>

  <!-- 数据墙（夹住小兽） -->
  <g>
    <g stroke="#5AA8E8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 126 110 L 132 118 M 136 112 L 142 120 M 128 122 L 134 130">
        <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="130" cy="114" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="128" cy="112.5" r="1" fill="#24180E"/>
    <circle cx="133" cy="112.5" r="1" fill="#24180E"/>
  </g>

  <!-- 废墟地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#3A4458" opacity="0.9"/>

  <!-- 被旧线绊倒的小迪路兽（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（白，倒下） -->
    <ellipse cx="86" cy="134" rx="14" ry="11" fill="url(#fur)" stroke="#C8C8C2" stroke-width="0.9" transform="rotate(-10 86 134)"/>
    <!-- 旧数据线（缠身） -->
    <path d="M 74 130 Q 86 126 98 132 Q 104 135 100 140" stroke="#5A7A9A" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-4 86 134;4 86 134;-4 86 134" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 头（白，垂耳） -->
    <ellipse cx="86" cy="120" rx="10" ry="8.5" fill="url(#fur)" stroke="#C8C8C2" stroke-width="0.8"/>
    <!-- 垂耳 -->
    <path d="M 77 116 Q 72 122 74 128 Q 78 126 80 121 Z" fill="#D8D8D4" stroke="#C0C0BA" stroke-width="0.6"/>
    <path d="M 95 116 Q 100 122 98 128 Q 94 126 92 121 Z" fill="#D8D8D4" stroke="#C0C0BA" stroke-width="0.6"/>
    <!-- 眼（大温柔） -->
    <circle cx="81" cy="119" r="2.4" fill="#2E2A24"/>
    <circle cx="81.8" cy="118" r="1" fill="#FFF"/>
    <circle cx="91" cy="119" r="2.4" fill="#2E2A24"/>
    <circle cx="91.8" cy="118" r="1" fill="#FFF"/>
    <!-- 嘴（想帮忙） -->
    <path d="M 83 124 Q 86 125.6 89 124" fill="none" stroke="#B0A090" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 小短爪 -->
    <path d="M 76 128 L 72 133" stroke="#E8E8E2" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 96 128 L 100 133" stroke="#E8E8E2" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#A8E0F8">
    <circle cx="48" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
