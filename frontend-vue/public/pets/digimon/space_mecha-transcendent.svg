<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巴达兽·六阶·巴达兽传说·暮光老圣兽翼尖托小巴达兽传跌倒了向光飞">
  <defs>
    <!-- 背景：数码暮光云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#9EA88A"/>
      <stop offset="100%" stop-color="#7AC0E8"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乳白身 -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E4DC"/>
    </radialGradient>
    <!-- 翼羽 -->
    <radialGradient id="wing" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F8FCF8"/>
      <stop offset="100%" stop-color="#C0D4E8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F8FCF8" opacity="0.75">
    <ellipse cx="60" cy="146" rx="28" ry="9"/>
    <ellipse cx="150" cy="152" rx="32" ry="10"/>
  </g>
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#A8D8F0" opacity="0.6"/>

  <!-- 得救的同伴（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="100" cy="136" r="4" fill="#A8E0E8" stroke="#68A8C8" stroke-width="0.5"/>
    <circle cx="98" cy="134.8" r="1" fill="#24180E"/>
    <circle cx="103" cy="134.8" r="1" fill="#24180E"/>
  </g>

  <!-- 小巴达兽（右，扑小翼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="142" cy="122" rx="11" ry="9" fill="url(#body)" stroke="#C8C8C2" stroke-width="0.8"/>
    <path d="M 152 120 Q 158 120 160 118 Q 158 124 152 124 Z" fill="#E8E8E2" stroke="#C0C0B8" stroke-width="0.5"/>
    <circle cx="146" cy="118" r="2" fill="#2E2A24"/>
    <circle cx="146.8" cy="117.2" r="0.8" fill="#FFF"/>
    <circle cx="153" cy="118" r="2" fill="#2E2A24"/>
    <circle cx="153.8" cy="117.2" r="0.8" fill="#FFF"/>
    <path d="M 148 122 Q 151 123.6 154 122" fill="none" stroke="#B0A090" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 小翼 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 136 120;5 136 120;-5 136 120" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 136 120 L 128 114 L 132 117 L 126 113 L 131 118 Z" fill="#E8F0F8" stroke="#B8D0E8" stroke-width="0.6"/>
      <path d="M 148 120 L 156 114 L 152 117 L 158 113 L 153 118 Z" fill="#E8F0F8" stroke="#B8D0E8" stroke-width="0.6"/>
    </g>
  </g>

  <!-- 老巴达兽（左，翼尖托小巴达兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 圣翼（大，伸向小巴达兽） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 82 108;4 82 108;-4 82 108" dur="2.4s" repeatCount="indefinite"/>
      <path d="M 82 108 L 52 82 L 66 96 L 46 80 L 62 102 Z" fill="url(#wing)" stroke="#A0B8D0" stroke-width="0.9"/>
      <path d="M 82 108 L 58 94 L 74 97" stroke="#B0C4D8" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <!-- 身 -->
    <ellipse cx="84" cy="116" rx="15" ry="11" fill="url(#body)" stroke="#C0C0B8" stroke-width="0.9"/>
    <ellipse cx="82" cy="122" rx="9" ry="6" fill="#F4F0EA" opacity="0.7"/>
    <!-- 吻（垂向小巴达兽） -->
    <path d="M 96 114 Q 104 114 106 112 Q 104 118 96 118 Z" fill="#E8E8E0" stroke="#B8B8B0" stroke-width="0.6"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 88 112 Q 90 110.6 92 112" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 96 112 Q 98 110.6 99 112" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 91 117 Q 94 118.6 97 117" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 翼尖托（传） -->
    <path d="M 74 98 Q 100 92 126 104" stroke="#F8FCF8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="108" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾鳍 -->
    <path d="M 72 120 Q 63 114 61 122 Q 63 130 72 126 Z" fill="#E8E8E0" stroke="#B8B8B0" stroke-width="0.6"/>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
