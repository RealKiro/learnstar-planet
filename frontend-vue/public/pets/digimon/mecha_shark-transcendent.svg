<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哥玛兽·六阶·哥玛兽传说·暮光老战士鳍轻托小哥玛兽传笨拙练成稳">
  <defs>
    <!-- 背景：数码浅海暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#A0A890"/>
      <stop offset="100%" stop-color="#5AB0E0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 海狮白毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E4E6"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 海底 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5AB0E0" opacity="0.8"/>
  <g stroke="#B8E0F0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 0 158 Q 60 154 120 158 Q 160 161 200 157"/>
  </g>

  <!-- 得救的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="90" cy="136" r="4" fill="#A8E0E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="88" cy="134.8" r="1" fill="#24180E"/>
    <circle cx="93" cy="134.8" r="1" fill="#24180E"/>
  </g>

  <!-- 小哥玛兽（右，笨拙扑腾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="140" cy="122" rx="11" ry="9" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.8" transform="rotate(6 140 122)"/>
    <path d="M 136 118 Q 140 112 144 118" fill="#E0E8EA" stroke="#C8D4D8" stroke-width="0.4"/>
    <ellipse cx="140" cy="116" rx="7" ry="6" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.7"/>
    <circle cx="137" cy="115" r="1.8" fill="#2E2A24"/>
    <circle cx="137.8" cy="114.2" r="0.7" fill="#FFF"/>
    <circle cx="144" cy="115" r="1.8" fill="#2E2A24"/>
    <circle cx="144.8" cy="114.2" r="0.7" fill="#FFF"/>
    <path d="M 139 119 Q 141 120.4 143 119" fill="none" stroke="#B0BCC0" stroke-width="0.5" stroke-linecap="round"/>
    <path d="M 132 124 L 128 129" stroke="#E0E8EA" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 148 124 L 152 129" stroke="#E0E8EA" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 老哥玛兽（左，鳍轻托小哥玛兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 身（大，泛岁月光） -->
    <ellipse cx="78" cy="120" rx="16" ry="12" fill="url(#fur)" stroke="#C0CCD0" stroke-width="1"/>
    <ellipse cx="76" cy="125" rx="10" ry="6.5" fill="#F4F8FA" opacity="0.7"/>
    <!-- 尾鳍 -->
    <path d="M 62 124 Q 50 126 46 134 Q 52 138 62 132 Z" fill="#E0E4E6" stroke="#C0CCD0" stroke-width="0.6"/>
    <!-- 大鳍（轻托小哥玛兽） -->
    <path d="M 90 114 L 116 110" stroke="#E0E4E6" stroke-width="3.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 90 114;4 90 114;-4 90 114" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 头 -->
    <ellipse cx="78" cy="106" rx="10" ry="9" fill="url(#fur)" stroke="#C0CCD0" stroke-width="0.9"/>
    <!-- 头顶毛如古雪 -->
    <path d="M 74 99 Q 78 92 82 99 M 72 101 Q 76 94 80 101" fill="#E0E4E6" stroke="#C0CCD0" stroke-width="0.5"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 73 105 Q 75 103.6 77 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 83 105 Q 85 103.6 86 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 76 110 Q 79 111.6 82 110" fill="none" stroke="#B0BCC0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 鳍托（传） -->
    <path d="M 96 112 Q 110 112 122 114" stroke="#E8F8FC" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="112" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
