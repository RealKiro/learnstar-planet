<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巴达兽·二阶·跌落之惧·高飞被风暴吹落砸数据岩翼微伤趴岩">
  <defs>
    <!-- 背景：数据风暴 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A566E"/>
      <stop offset="52%" stop-color="#3A4458"/>
      <stop offset="100%" stop-color="#2E3648"/>
    </linearGradient>
    <!-- 数据风暴光 -->
    <radialGradient id="glow" cx="70%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#5AA8E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5AA8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乳白身（沾尘） -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E8E8E0"/>
      <stop offset="100%" stop-color="#C0C0B8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="48" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 数据风暴 -->
  <g stroke="#5AA8E8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 24 60 Q 44 54 58 56">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 40 Q 168 36 182 38">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 30 Q 116 26 128 28">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 数据岩 -->
  <path d="M 20 148 L 200 148 L 200 200 L 0 200 Z" fill="#3A4458" opacity="0.9"/>
  <path d="M 40 148 L 90 128 L 130 148 Z" fill="#4A5A72" stroke="#3E4E64" stroke-width="1"/>

  <!-- 摔落趴岩的小巴达兽（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 身（趴） -->
    <ellipse cx="96" cy="138" rx="14" ry="9" fill="url(#body)" stroke="#AEACA6" stroke-width="0.9" transform="rotate(-8 96 138)"/>
    <!-- 沾尘 -->
    <circle cx="88" cy="132" r="1.2" fill="#8EA4BC" opacity="0.6"/>
    <circle cx="104" cy="140" r="1" fill="#8EA4BC" opacity="0.5"/>
    <!-- 翼（微伤） -->
    <path d="M 84 130 L 74 124" stroke="#C0C0B8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 108 128 L 118 122" stroke="#C0C0B8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 翼伤 -->
    <path d="M 108 128 L 112 126" stroke="#D87868" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 头（趴，垂） -->
    <ellipse cx="92" cy="128" rx="9" ry="7" fill="url(#body)" stroke="#AEACA6" stroke-width="0.8" transform="rotate(-10 92 128)"/>
    <!-- 吻（垂） -->
    <path d="M 98 124 Q 104 124 106 122 Q 104 128 98 128 Z" fill="#C8C8C0" stroke="#AEACA6" stroke-width="0.5"/>
    <!-- 眼（含惧含坚，微湿） -->
    <circle cx="88" cy="126" r="2" fill="#2E2A24"/>
    <circle cx="88.8" cy="125" r="0.8" fill="#FFF"/>
    <circle cx="96" cy="126" r="2" fill="#2E2A24"/>
    <circle cx="96.8" cy="125" r="0.8" fill="#FFF"/>
    <circle cx="89" cy="125" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（抖） -->
    <path d="M 92 130 Q 94 128.6 96 130" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#8EA4BC" opacity="0.3">
    <circle cx="50" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
