<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="比丘兽·一阶·爱哭小鸟·数码森林学飞摔跤泪汪汪抹泪扑救被缠小兽">
  <defs>
    <!-- 背景：数码森林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AA878"/>
      <stop offset="52%" stop-color="#6AB880"/>
      <stop offset="100%" stop-color="#4E9868"/>
    </linearGradient>
    <!-- 森林光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#C8F0D8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄羽毛 -->
    <radialGradient id="feather" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F8C860"/>
      <stop offset="100%" stop-color="#E8A030"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林树影 -->
  <g fill="#3E7848" opacity="0.5">
    <path d="M 0 60 L 10 20 L 20 58 L 26 30 L 34 62 L 0 200 L 0 62 Z"/>
    <path d="M 176 56 L 186 18 L 194 54 L 200 44 L 200 200 L 176 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#4E9868" opacity="0.9"/>

  <!-- 被数据藤缠住的小兽（右） -->
  <g>
    <g stroke="#5AA8E8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M 136 116 Q 142 112 148 118">
        <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 140 124 Q 146 122 150 128" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="144" cy="120" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="142" cy="118.8" r="1" fill="#24180E"/>
    <circle cx="147" cy="118.8" r="1" fill="#24180E"/>
  </g>

  <!-- 小比丘兽（中，抹泪扑救） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身（橙黄蓬松） -->
    <ellipse cx="96" cy="124" rx="14" ry="13" fill="url(#feather)" stroke="#C88828" stroke-width="0.9"/>
    <!-- 蓬毛（尾） -->
    <path d="M 84 132 Q 76 138 80 142 Q 86 140 90 136" fill="#F0C860" stroke="#C88828" stroke-width="0.6"/>
    <!-- 翅（扑救，张开） -->
    <path d="M 86 116 L 72 108 L 78 112 L 66 106 L 76 114 Z" fill="#F0C860" stroke="#C88828" stroke-width="0.6">
      <animateTransform attributeName="transform" type="rotate" values="-6 86 116;6 86 116;-6 86 116" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- 头顶毛蓬 -->
    <path d="M 92 112 Q 96 104 100 112 M 88 114 Q 92 108 96 114" fill="#F0C860" stroke="#C88828" stroke-width="0.5"/>
    <!-- 头 -->
    <ellipse cx="96" cy="112" rx="9" ry="8" fill="url(#feather)" stroke="#C88828" stroke-width="0.8"/>
    <!-- 眼（大含泪） -->
    <circle cx="92" cy="111" r="2.6" fill="#2E2A24"/>
    <circle cx="92.8" cy="109.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="111" r="2.6" fill="#2E2A24"/>
    <circle cx="101.8" cy="109.8" r="1" fill="#FFF"/>
    <circle cx="93" cy="110.5" r="1" fill="#A8D4E8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（嘟，想帮忙） -->
    <path d="M 102 113 L 108 112.5 L 102 115 Z" fill="#E88848" stroke="#C86828" stroke-width="0.5"/>
    <!-- 抹泪的翅 -->
    <path d="M 84 112 Q 78 106 80 100" stroke="#F0C860" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8F0D8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
