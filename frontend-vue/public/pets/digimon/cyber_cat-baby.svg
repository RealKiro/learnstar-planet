<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="迪路兽·二阶·被弃之痛·数据危机伴逃散留原地蹲路尾垂">
  <defs>
    <!-- 背景：数据路 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A566E"/>
      <stop offset="52%" stop-color="#3A4458"/>
      <stop offset="100%" stop-color="#2E3648"/>
    </linearGradient>
    <!-- 数据乱流光 -->
    <radialGradient id="glow" cx="70%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#5AA8E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5AA8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛（沾尘） -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E8E8E2"/>
      <stop offset="100%" stop-color="#C4C4BE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="60" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 逃散的伙伴远影（右） -->
  <g opacity="0.5">
    <circle cx="158" cy="104" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="176" cy="96" r="3.5" fill="#B8E8F8" stroke="#68B8D8" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 170 92 Q 180 88 186 90" stroke="#5AA8E8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 数据路 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#2E3648" opacity="0.9"/>
  <g stroke="#5AA8E8" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <path d="M 0 162 Q 60 158 120 162 Q 160 165 200 160"/>
  </g>

  <!-- 蹲路的被弃小迪路兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 身体（蹲，尾垂） -->
    <ellipse cx="72" cy="134" rx="13" ry="10" fill="url(#fur)" stroke="#B0B0AA" stroke-width="0.9"/>
    <!-- 垂尾 -->
    <path d="M 60 138 Q 52 144 54 150 Q 56 154 60 152" stroke="#C4C4BE" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 60 138;4 60 138;-4 60 138" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 旧线（垂） -->
    <path d="M 82 132 Q 88 136 86 142" stroke="#5A7A9A" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 头（垂耳，更低） -->
    <ellipse cx="72" cy="122" rx="9" ry="8" fill="url(#fur)" stroke="#B0B0AA" stroke-width="0.8"/>
    <path d="M 64 118 Q 59 124 61 130 Q 65 128 67 123 Z" fill="#C4C4BE" stroke="#B0B0AA" stroke-width="0.6"/>
    <path d="M 80 118 Q 85 124 83 130 Q 79 128 77 123 Z" fill="#C4C4BE" stroke="#B0B0AA" stroke-width="0.6"/>
    <!-- 眼（含痛含志，微湿） -->
    <circle cx="67" cy="121" r="2.2" fill="#2E2A24"/>
    <circle cx="67.8" cy="120" r="0.9" fill="#FFF"/>
    <circle cx="77" cy="121" r="2.2" fill="#2E2A24"/>
    <circle cx="77.8" cy="120" r="0.9" fill="#FFF"/>
    <circle cx="68" cy="120" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（低垂） -->
    <path d="M 70 126 Q 72 124.6 74 126" fill="none" stroke="#9E8E80" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 爪 -->
    <path d="M 64 130 L 60 134" stroke="#D8D8D2" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 80 130 L 84 134" stroke="#D8D8D2" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#8EA4BC" opacity="0.3">
    <circle cx="50" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
