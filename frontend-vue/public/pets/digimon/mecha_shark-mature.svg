<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哥玛兽·四阶·救伴初成·破浪游进急流鳍稳托住伙伴逆流游回浅海">
  <defs>
    <!-- 背景：数码急流 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9AC8"/>
      <stop offset="52%" stop-color="#5AB0E0"/>
      <stop offset="100%" stop-color="#7AC8E8"/>
    </linearGradient>
    <!-- 浪光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#E8F8FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 海狮白毛（湿） -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E8EA"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 急流 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5AB0E0" opacity="0.8"/>
  <g stroke="#B8E8F8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 0 156 Q 50 148 100 156 Q 150 164 200 156">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 166 Q 60 160 120 166 Q 160 170 200 164" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被托住的伙伴（上，抓鳍） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="104" cy="92" r="4.5" fill="#A8E0E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="102" cy="90.8" r="1.1" fill="#24180E"/>
    <circle cx="107" cy="90.8" r="1.1" fill="#24180E"/>
  </g>

  <!-- 救伴的哥玛兽（中，鳍托逆流） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="96" cy="112" rx="16" ry="12" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.9"/>
    <ellipse cx="94" cy="117" rx="10" ry="6" fill="#F8FAFA" opacity="0.7"/>
    <!-- 尾鳍（逆流拍） -->
    <path d="M 80 116 Q 68 118 64 126 Q 70 130 80 124 Z" fill="#E8ECEE" stroke="#C8D4D8" stroke-width="0.6">
      <animateTransform attributeName="transform" type="rotate" values="-4 80 118;4 80 118;-4 80 118" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 上鳍（托住伙伴） -->
    <path d="M 104 106 L 108 96" stroke="#E8ECEE" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 下鳍（破浪） -->
    <path d="M 88 116 L 78 124" stroke="#E8ECEE" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="96" cy="102" rx="9" ry="8" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.8"/>
    <!-- 头顶毛（湿） -->
    <path d="M 92 96 Q 96 90 100 96" fill="#E8ECEE" stroke="#C8D4D8" stroke-width="0.5"/>
    <!-- 眼（含温含亮） -->
    <circle cx="91" cy="101" r="2.4" fill="#2E2A24"/>
    <circle cx="91.8" cy="99.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="101" r="2.4" fill="#2E2A24"/>
    <circle cx="101.8" cy="99.8" r="1" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 94 106 Q 97 107.4 100 106" fill="none" stroke="#B0BCC0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 浪花 -->
    <g fill="#E8F8FC" opacity="0.8">
      <circle cx="70" cy="126" r="2">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="122" cy="122" r="2.2">
        <animate attributeName="opacity" values="0.75;0.3;0.75" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F8FC">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
