<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="加布兽·三阶·练力苦修·雪原练爪力精准破数据结不伤同伴皮挡风雪">
  <defs>
    <!-- 背景：数码雪原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0CCE8"/>
      <stop offset="52%" stop-color="#C0E0F0"/>
      <stop offset="100%" stop-color="#F0F8FC"/>
    </linearGradient>
    <!-- 雪光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝白皮 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#6E9EC8"/>
      <stop offset="100%" stop-color="#4A7AA8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E8F4FC" opacity="0.9"/>

  <!-- 被破开的数据结（右，内含同伴，未伤） -->
  <g>
    <g stroke="#5AA8E8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M 138 104 Q 146 100 148 108">
        <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 142 116 Q 148 112 146 120" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 结内同伴（安然） -->
    <circle cx="144" cy="110" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="142" cy="108.8" r="1" fill="#24180E"/>
    <circle cx="147" cy="108.8" r="1" fill="#24180E"/>
  </g>

  <!-- 少年加布兽（中，爪力精准） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蓝白皮身 -->
    <ellipse cx="92" cy="118" rx="17" ry="14" fill="url(#fur)" stroke="#3A6088" stroke-width="1"/>
    <!-- 皮纹 -->
    <path d="M 77 112 Q 92 108 107 112" stroke="#A8D0F0" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M 79 126 Q 92 122 105 126" stroke="#A8D0F0" stroke-width="1.3" fill="none" opacity="0.6"/>
    <!-- 露出白毛 -->
    <ellipse cx="92" cy="106" rx="11" ry="6" fill="#F0F6FC" stroke="#D8E8F0" stroke-width="0.6"/>
    <!-- 眼（沉稳） -->
    <circle cx="86" cy="106" r="3" fill="#2E2A24"/>
    <circle cx="87" cy="104.8" r="1.2" fill="#FFF"/>
    <circle cx="98" cy="106" r="3" fill="#2E2A24"/>
    <circle cx="99" cy="104.8" r="1.2" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 89 111 Q 92 112.6 95 111" fill="none" stroke="#5E7E9E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 前爪（伸向数据结，破结） -->
    <path d="M 104 112 L 122 106" stroke="#3A6088" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 钩爪 -->
    <path d="M 124 104 L 128 102 M 124 106 L 129 105" stroke="#D8E8F0" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 后爪 -->
    <path d="M 80 128 L 76 134" stroke="#3A6088" stroke-width="3" stroke-linecap="round"/>
    <path d="M 104 128 L 108 134" stroke="#3A6088" stroke-width="3" stroke-linecap="round"/>
    <!-- 皮挡风雪（左护） -->
    <path d="M 76 112 Q 66 116 62 124" stroke="#6E9EC8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- 风雪痕（被皮挡） -->
  <g stroke="#A8C8E0" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 24 70 Q 42 64 56 66">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 34 90 Q 50 86 62 88" opacity="0.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#FFFFFF">
    <circle cx="48" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
