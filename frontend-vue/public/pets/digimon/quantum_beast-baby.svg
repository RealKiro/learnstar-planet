<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="加布兽·二阶·被惧之痛·外表凶被怕躲进雪影温柔被皮挡">
  <defs>
    <!-- 背景：数码雪原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AB8D8"/>
      <stop offset="52%" stop-color="#A8D0E8"/>
      <stop offset="100%" stop-color="#D8E8F0"/>
    </linearGradient>
    <!-- 弱雪光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝白皮（皱） -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#5E88B8"/>
      <stop offset="100%" stop-color="#3E6898"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 躲开的数码兽（右） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="116" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="154" cy="114.8" r="1" fill="#24180E"/>
    <circle cx="159" cy="114.8" r="1" fill="#24180E"/>
    <path d="M 160 112 Q 164 108 165 104" stroke="#5AA8C8" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="172" cy="124" r="3.5" fill="#B8E8F8" stroke="#68B8D8" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 雪原 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#D8E8F0" opacity="0.9"/>
  <!-- 雪影（左，退进） -->
  <path d="M 0 148 L 70 144 L 90 160 L 0 200 Z" fill="#B8D0E0" opacity="0.8"/>

  <!-- 低头退进雪影的小加布兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 皮身（皱，低头） -->
    <ellipse cx="60" cy="132" rx="14" ry="12" fill="url(#fur)" stroke="#2E5688" stroke-width="1" transform="rotate(6 60 132)"/>
    <!-- 皮纹（皱） -->
    <path d="M 48 126 Q 60 122 72 126" stroke="#8AB4D8" stroke-width="1.3" fill="none" opacity="0.6"/>
    <!-- 头（低垂） -->
    <ellipse cx="56" cy="120" rx="9" ry="8" fill="url(#fur)" stroke="#2E5688" stroke-width="0.9" transform="rotate(8 56 120)"/>
    <ellipse cx="54" cy="117" rx="7" ry="4" fill="#E8F0F8" stroke="#C8DCE8" stroke-width="0.5"/>
    <!-- 眼（含惑，暗） -->
    <circle cx="51" cy="117" r="2.4" fill="#1E2430"/>
    <circle cx="51.8" cy="116" r="0.9" fill="#FFF"/>
    <circle cx="60" cy="117" r="2.4" fill="#1E2430"/>
    <circle cx="60.8" cy="116" r="0.9" fill="#FFF"/>
    <!-- 嘴（低垂） -->
    <path d="M 53 121 Q 56 119.6 59 121" fill="none" stroke="#4E6E8E" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 爪影（利，垂） -->
    <path d="M 48 130 L 44 136" stroke="#2E5688" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 72 130 L 76 136" stroke="#2E5688" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 爪影（更利） -->
    <path d="M 43 137 L 42 140 M 45 137 L 45 140" stroke="#B8D0E0" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#FFFFFF" opacity="0.4">
    <circle cx="100" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.14;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
