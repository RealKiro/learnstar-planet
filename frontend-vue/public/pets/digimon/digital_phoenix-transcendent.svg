<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="比丘兽·六阶·比丘兽传说·暮光老圣鸟羽尖蹭小比丘兽传眼泪淬羽非认输">
  <defs>
    <!-- 背景：数码森林暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#9EA888"/>
      <stop offset="100%" stop-color="#5AA878"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 羽毛 -->
    <radialGradient id="feather" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F0C060"/>
      <stop offset="100%" stop-color="#D89830"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#4E9868" opacity="0.9"/>

  <!-- 得救的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="90" cy="136" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="88" cy="134.8" r="1" fill="#24180E"/>
    <circle cx="93" cy="134.8" r="1" fill="#24180E"/>
  </g>

  <!-- 小比丘兽（右，爱哭） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="142" cy="122" rx="10" ry="9" fill="url(#feather)" stroke="#C88828" stroke-width="0.8"/>
    <path d="M 138 118 Q 142 112 146 118 M 134 120 Q 138 114 142 120" fill="#F0C060" stroke="#C88828" stroke-width="0.4"/>
    <ellipse cx="142" cy="116" rx="7" ry="6" fill="url(#feather)" stroke="#C88828" stroke-width="0.7"/>
    <circle cx="139" cy="115" r="1.8" fill="#2E2A24"/>
    <circle cx="139.8" cy="114.2" r="0.7" fill="#FFF"/>
    <circle cx="146" cy="115" r="1.8" fill="#2E2A24"/>
    <circle cx="146.8" cy="114.2" r="0.7" fill="#FFF"/>
    <circle cx="140" cy="114.5" r="0.8" fill="#A8D4E8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 147 117 L 152 116.5 L 147 119 Z" fill="#E88848" stroke="#C86828" stroke-width="0.4"/>
  </g>

  <!-- 老比丘兽（左，羽尖蹭小比丘兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 圣翼（大，伸向小比丘兽） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 82 108;4 82 108;-4 82 108" dur="2.4s" repeatCount="indefinite"/>
      <path d="M 82 108 L 52 84 L 66 96 L 46 82 L 62 104 Z" fill="url(#feather)" stroke="#B87820" stroke-width="0.9"/>
      <path d="M 82 108 L 58 94 L 74 97" stroke="#D8A848" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <!-- 身 -->
    <ellipse cx="84" cy="118" rx="15" ry="12" fill="url(#feather)" stroke="#B87820" stroke-width="1"/>
    <!-- 头顶毛如冠（古） -->
    <path d="M 80 108 Q 84 100 88 108 M 76 110 Q 80 104 84 110" fill="#E8B858" stroke="#B87820" stroke-width="0.5"/>
    <!-- 头 -->
    <ellipse cx="84" cy="108" rx="9" ry="8" fill="url(#feather)" stroke="#B87820" stroke-width="0.8"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 79 107 Q 81 105.6 83 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 88 107 Q 90 105.6 91 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 91 109 L 98 108.5 L 91 111 Z" fill="#D87838" stroke="#B05828" stroke-width="0.5"/>
    <!-- 羽尖蹭（传） -->
    <path d="M 74 98 Q 100 90 128 102" stroke="#FFF0D0" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="124" cy="106" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 蓬毛尾 -->
    <path d="M 72 126 Q 64 130 68 134 Q 74 132 78 128" fill="#E8B858" stroke="#B87820" stroke-width="0.6"/>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
