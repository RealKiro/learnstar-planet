<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="亚古兽·五阶·守护暴龙·立数码山脊喷火截断乱流尾拨迷路幼兽回">
  <defs>
    <!-- 背景：数码世界山脊 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6AA8C8"/>
      <stop offset="52%" stop-color="#5A9868"/>
      <stop offset="100%" stop-color="#3E7848"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F8D878" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8D878" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#E8F0C8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙鳞 -->
    <radialGradient id="scale" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F8CC68"/>
      <stop offset="100%" stop-color="#E4A430"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 数码粒子 -->
  <g fill="#C8F0E0" opacity="0.5">
    <circle cx="36" cy="30" r="1.1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="28" r="1.2">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 被截断的数据乱流（右） -->
  <g stroke="#5AA8E8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 172 88 Q 180 100 176 112">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 178 92 Q 186 104 182 116" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山脊 -->
  <path d="M 0 140 L 200 138 L 200 200 L 0 200 Z" fill="#4E8858" opacity="0.9"/>

  <!-- 被尾拨回的迷路幼兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="56" cy="132" r="4.5" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.6"/>
    <circle cx="54" cy="130.5" r="1.2" fill="#24180E"/>
    <circle cx="59" cy="130.5" r="1.2" fill="#24180E"/>
    <path d="M 52 136 L 50 141 M 60 136 L 62 141" stroke="#5AA8C8" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 守护暴龙（中，山脊挺立） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 尾（拨幼兽） -->
    <path d="M 74 122 Q 62 114 56 122 Q 52 130 60 132" stroke="url(#scale)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 74 122;4 74 122;-4 74 122" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 腿（粗，稳） -->
    <path d="M 92 130 L 87 152 M 116 130 L 121 152" stroke="url(#scale)" stroke-width="9" stroke-linecap="round"/>
    <!-- 身（大，如铠） -->
    <ellipse cx="106" cy="118" rx="26" ry="16" fill="url(#scale)" stroke="#C88828" stroke-width="1.1"/>
    <ellipse cx="103" cy="125" rx="17" ry="9" fill="#F8E8B8" opacity="0.6"/>
    <!-- 背脊 -->
    <path d="M 84 106 L 80 92 L 89 104 L 88 88 L 97 102 L 98 86 L 107 100" stroke="#C88828" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- 颈 -->
    <path d="M 124 108 Q 136 94 140 80" stroke="url(#scale)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- 头（大） -->
    <ellipse cx="144" cy="76" rx="13" ry="11" fill="url(#scale)" stroke="#C88828" stroke-width="1.1"/>
    <path d="M 137 67 L 132 56 M 149 67 L 154 56" stroke="#E8B048" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 眼（含威含温） -->
    <circle cx="139" cy="74" r="2.6" fill="#2E241E"/>
    <circle cx="140" cy="72.8" r="1" fill="#FFF"/>
    <circle cx="151" cy="74" r="2.6" fill="#2E241E"/>
    <circle cx="152" cy="72.8" r="1" fill="#FFF"/>
    <!-- 嘴（喷火截断） -->
    <path d="M 155 80 L 162 82" stroke="#A85830" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 截断乱流的火 -->
    <path d="M 162 82 Q 168 80 172 86" stroke="#F89838" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 162 81 Q 170 78 176 84" stroke="#F8C860" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- 短臂 -->
    <path d="M 92 110 L 82 122" stroke="url(#scale)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 120 110 L 130 122" stroke="url(#scale)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#F8D878">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
