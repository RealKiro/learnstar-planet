<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="加布兽·五阶·雪原守护·立雪原最高处皮猎猎张皮拢护冻兽挡风雪">
  <defs>
    <!-- 背景：数码雪原最高处 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A9AC8"/>
      <stop offset="52%" stop-color="#A8D0E8"/>
      <stop offset="100%" stop-color="#F0F8FC"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#D8E8F8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#D8E8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝白皮 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#8AB8DC"/>
      <stop offset="100%" stop-color="#5A88B4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.64;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="96" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.32;0.2;0.32" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#E8F4FC" opacity="0.9"/>
  <path d="M 0 150 Q 60 144 130 149 Q 170 151 200 147" stroke="#D0E4F0" stroke-width="1.5" fill="none"/>

  <!-- 被拢护的冻兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="126" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="70" cy="130" r="3.5" fill="#B8E8F8" stroke="#68B8D8" stroke-width="0.5"/>
  </g>

  <!-- 被挡的风雪（右） -->
  <g fill="#D0E4F0" opacity="0.6">
    <circle cx="166" cy="70" r="1.4">
      <animate attributeName="cy" values="70;96;70" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="54" r="1.2">
      <animate attributeName="cy" values="54;80;54" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 守护圣兽（中，立雪原最高） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 皮（如蓝雪，猎猎） -->
    <path d="M 104 120 Q 74 108 60 124 Q 52 136 60 144 Q 104 156 148 144 Q 156 136 148 124 Q 134 108 104 120 Z" fill="url(#fur)" stroke="#3A6088" stroke-width="1.2"/>
    <!-- 皮纹 -->
    <path d="M 78 118 Q 104 112 130 118" stroke="#A8D0F0" stroke-width="1.6" fill="none" opacity="0.7"/>
    <path d="M 72 136 Q 104 128 136 136" stroke="#A8D0F0" stroke-width="1.4" fill="none" opacity="0.6"/>
    <!-- 暖光（怀里） -->
    <ellipse cx="104" cy="134" rx="32" ry="16" fill="#F8F0D8" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.28;0.45" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 头 -->
    <ellipse cx="104" cy="104" rx="12" ry="10" fill="url(#fur)" stroke="#3A6088" stroke-width="1"/>
    <ellipse cx="102" cy="100" rx="8" ry="5" fill="#F0F6FC" stroke="#D8E8F0" stroke-width="0.6"/>
    <!-- 角（圣兽） -->
    <path d="M 94 96 L 90 86" stroke="#E8EFF4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 114 96 L 118 86" stroke="#E8EFF4" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 眼（含威含温） -->
    <circle cx="97" cy="101" r="3" fill="#2E2A24"/>
    <circle cx="98" cy="99.8" r="1.2" fill="#FFF"/>
    <circle cx="110" cy="101" r="3" fill="#2E2A24"/>
    <circle cx="111" cy="99.8" r="1.2" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 100 107 Q 104 108.8 108 107" fill="none" stroke="#5E7E9E" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 钩爪 -->
    <path d="M 90 140 L 84 148 M 118 140 L 124 148" stroke="#3A6088" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 82 149 L 80 153 M 86 149 L 86 153" stroke="#D8E8F0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 122 149 L 124 153 M 126 149 L 126 153" stroke="#D8E8F0" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFFFFF">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
