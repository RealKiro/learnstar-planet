<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巴达兽·四阶·救伴初成·翼展如穹俯冲翼托坠落同伴划过天际落回云海">
  <defs>
    <!-- 背景：数码云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AC0E8"/>
      <stop offset="52%" stop-color="#A0D4F0"/>
      <stop offset="100%" stop-color="#C8E8F8"/>
    </linearGradient>
    <!-- 云光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#F8FCF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8FCF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乳白身 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAEAE4"/>
    </radialGradient>
    <!-- 翼羽 -->
    <radialGradient id="wing" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F8FCF8"/>
      <stop offset="100%" stop-color="#C8D8E8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 崩塌的数据云（右后） -->
  <g fill="#C8E0F0" opacity="0.7">
    <path d="M 140 40 Q 160 34 172 44 Q 168 58 150 56 Q 140 52 140 40 Z"/>
    <path d="M 160 46 L 166 58" stroke="#A8C8E0" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 146 50 L 152 62" stroke="#A8C8E0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 云海 -->
  <g fill="#F8FCF8" opacity="0.8">
    <ellipse cx="60" cy="144" rx="28" ry="9"/>
    <ellipse cx="150" cy="152" rx="32" ry="10"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#A8D8F0" opacity="0.6"/>

  <!-- 被托住的伙伴（上，抱翼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="102" cy="86" r="4.5" fill="#A8E0E8" stroke="#68A8C8" stroke-width="0.5"/>
    <circle cx="100" cy="84.8" r="1.1" fill="#24180E"/>
    <circle cx="105" cy="84.8" r="1.1" fill="#24180E"/>
  </g>

  <!-- 救伴的巴达兽（中，翼展如穹托伴） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大翼（展如穹） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 80 116;5 80 116;-5 80 116" dur="2s" repeatCount="indefinite"/>
      <path d="M 80 116 L 52 92 L 64 104 L 46 90 L 60 108 Z" fill="url(#wing)" stroke="#A8C0D8" stroke-width="0.9"/>
      <path d="M 80 116 L 58 106 L 72 108" stroke="#B8CCE0" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 122 114;5 122 114;-5 122 114" dur="2s" repeatCount="indefinite"/>
      <path d="M 122 114 L 150 90 L 138 102 L 156 88 L 142 106 Z" fill="url(#wing)" stroke="#A8C0D8" stroke-width="0.9"/>
      <path d="M 122 114 L 144 104 L 130 106" stroke="#B8CCE0" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <!-- 身 -->
    <ellipse cx="100" cy="122" rx="16" ry="12" fill="url(#body)" stroke="#D0D0CA" stroke-width="0.9"/>
    <ellipse cx="98" cy="128" rx="10" ry="6.5" fill="#F8F4F0" opacity="0.7"/>
    <!-- 吻 -->
    <path d="M 112 120 Q 120 120 122 118 Q 120 124 112 124 Z" fill="#F0F0EA" stroke="#C8C8C2" stroke-width="0.6"/>
    <!-- 眼（含温含亮） -->
    <circle cx="104" cy="118" r="2.7" fill="#2E2A24"/>
    <circle cx="105" cy="116.8" r="1.1" fill="#FFF"/>
    <circle cx="113" cy="118" r="2.7" fill="#2E2A24"/>
    <circle cx="114" cy="116.8" r="1.1" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 109 122 Q 112 123.6 115 122" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 尾鳍 -->
    <path d="M 85 126 Q 76 120 74 128 Q 76 136 85 132 Z" fill="#F0F0EA" stroke="#C8C8C2" stroke-width="0.6"/>
  </g>

  <!-- 星尘 -->
  <g fill="#F8FCF8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
