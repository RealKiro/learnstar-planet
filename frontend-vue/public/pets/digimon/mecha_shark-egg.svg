<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哥玛兽·一阶·笨拙海狮·数码浅海扑腾被浪打翻小兽被冲走">
  <defs>
    <!-- 背景：数码浅海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AB0E0"/>
      <stop offset="52%" stop-color="#6AC8E8"/>
      <stop offset="100%" stop-color="#8AE0F0"/>
    </linearGradient>
    <!-- 海光 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#E8F8FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 海狮白毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E8EA"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 海底 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6AC8E8" opacity="0.8"/>
  <!-- 海草 -->
  <g fill="#3EA878" opacity="0.6">
    <path d="M 30 148 Q 34 132 30 120 Q 36 132 38 120 Q 40 136 36 148 Z"/>
    <path d="M 170 148 Q 174 132 170 120 Q 176 132 178 120 Q 180 136 176 148 Z"/>
  </g>

  <!-- 被冲走的小兽（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="150" cy="122" r="4" fill="#A8E0E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="148" cy="120.8" r="1" fill="#24180E"/>
    <circle cx="153" cy="120.8" r="1" fill="#24180E"/>
    <!-- 海流冲走 -->
    <g stroke="#B8E8F8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 138 116 Q 144 114 148 110">
        <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 被浪打翻的小哥玛兽（中，笨拙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身（翻个跟头，白） -->
    <ellipse cx="92" cy="132" rx="15" ry="12" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.9" transform="rotate(14 92 132)"/>
    <!-- 白肚 -->
    <ellipse cx="90" cy="136" rx="9" ry="6" fill="#F8FAFA" opacity="0.7"/>
    <!-- 短鳍（拍水） -->
    <path d="M 78 128 L 72 122" stroke="#E0E8EA" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-8 78 128;8 78 128;-8 78 128" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 106 128 L 112 122" stroke="#E0E8EA" stroke-width="3" stroke-linecap="round"/>
    <!-- 头（圆） -->
    <ellipse cx="92" cy="122" rx="9" ry="8" fill="url(#fur)" stroke="#C8D4D8" stroke-width="0.8" transform="rotate(8 92 122)"/>
    <!-- 头顶海狮毛 -->
    <path d="M 88 116 Q 92 110 96 116 M 86 118 Q 90 112 94 118" fill="#E8EEF0" stroke="#C8D4D8" stroke-width="0.5"/>
    <!-- 眼（圆，被浪打翻的懵） -->
    <circle cx="88" cy="121" r="2.4" fill="#2E2A24"/>
    <circle cx="88.8" cy="119.8" r="1" fill="#FFF"/>
    <circle cx="97" cy="121" r="2.4" fill="#2E2A24"/>
    <circle cx="97.8" cy="119.8" r="1" fill="#FFF"/>
    <!-- 嘴（懵） -->
    <path d="M 90 126 Q 93 127.4 96 126" fill="none" stroke="#B0BCC0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 浪花（打翻） -->
    <g fill="#E8F8FC" opacity="0.8">
      <circle cx="70" cy="138" r="2">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="112" cy="136" r="1.8">
        <animate attributeName="opacity" values="0.7;0.28;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F8FC">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
