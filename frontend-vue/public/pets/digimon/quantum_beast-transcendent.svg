<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="加布兽·六阶·加布兽传说·暮光皮拢小加布兽传外表再冷怀是暖">
  <defs>
    <!-- 背景：数码雪原暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#A8A8A0"/>
      <stop offset="100%" stop-color="#D8E8F0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝白皮 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#7AACD0"/>
      <stop offset="100%" stop-color="#4E80AC"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#D8E8F0" opacity="0.9"/>

  <!-- 安暖的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="88" cy="136" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="86" cy="134.8" r="1" fill="#24180E"/>
    <circle cx="91" cy="134.8" r="1" fill="#24180E"/>
  </g>

  <!-- 小加布兽（右，裹皮让皮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="142" cy="124" rx="11" ry="9" fill="url(#fur)" stroke="#3A6088" stroke-width="0.8"/>
    <path d="M 130 118 Q 142 114 154 118" stroke="#A8D0F0" stroke-width="1.1" fill="none" opacity="0.7"/>
    <ellipse cx="140" cy="116" rx="7" ry="4.5" fill="#E8F0F8" stroke="#C8DCE8" stroke-width="0.5"/>
    <circle cx="136" cy="115" r="2" fill="#2E2A24"/>
    <circle cx="136.8" cy="114.2" r="0.8" fill="#FFF"/>
    <circle cx="145" cy="115" r="2" fill="#2E2A24"/>
    <circle cx="145.8" cy="114.2" r="0.8" fill="#FFF"/>
    <path d="M 138 119 Q 141 120.4 144 119" fill="none" stroke="#5E7E9E" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M 134 130 L 131 134" stroke="#3A6088" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 150 130 L 153 134" stroke="#3A6088" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 扯下的一角皮（让给冻兽） -->
    <path d="M 142 133 Q 138 140 134 142" stroke="#7AACD0" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- 老加布兽（左，皮拢小加布兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 皮（大，伸向小加布兽） -->
    <path d="M 78 120 Q 50 110 42 126 Q 36 136 42 144 Q 78 154 112 144 Q 120 136 114 128 Q 108 114 78 120 Z" fill="url(#fur)" stroke="#3A6088" stroke-width="1.1"/>
    <path d="M 56 116 Q 78 110 100 116" stroke="#A8D0F0" stroke-width="1.4" fill="none" opacity="0.7"/>
    <!-- 头 -->
    <ellipse cx="78" cy="106" rx="11" ry="9.5" fill="url(#fur)" stroke="#3A6088" stroke-width="1"/>
    <ellipse cx="76" cy="102" rx="7" ry="4.5" fill="#E8F0F8" stroke="#C8DCE8" stroke-width="0.5"/>
    <path d="M 68 98 L 64 89" stroke="#E8EFF4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 88 98 L 92 89" stroke="#E8EFF4" stroke-width="2" stroke-linecap="round"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 72 103 Q 74 101.6 76 103" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 82 103 Q 84 101.6 85 103" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 75 108 Q 78 109.6 81 108" fill="none" stroke="#5E7E9E" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 皮拢（传） -->
    <path d="M 100 116 Q 114 116 124 120" stroke="#A8D0F0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="118" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
