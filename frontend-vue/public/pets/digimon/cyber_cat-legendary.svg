<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="迪路兽·五阶·守护圣兽·立圣光塔顶指尖洒光引迷路兽结界护方">
  <defs>
    <!-- 背景：数码世界圣光塔 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A6AC8"/>
      <stop offset="52%" stop-color="#4A5AA0"/>
      <stop offset="100%" stop-color="#3A4A78"/>
    </linearGradient>
    <!-- 圣光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F8E8B8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8E8B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 圣兽光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#E8F0C8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛如光 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0ECE2"/>
    </radialGradient>
    <!-- 指尖圣光 -->
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="80" r="66" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 数据粒子 -->
  <g fill="#C8E0F8" opacity="0.5">
    <circle cx="36" cy="30" r="1.1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="28" r="1.2">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 被引的迷路兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="48" cy="116" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="46" cy="114.5" r="1" fill="#24180E"/>
    <circle cx="51" cy="114.5" r="1" fill="#24180E"/>
    <path d="M 44 120 L 42 125 M 52 120 L 54 125" stroke="#5AA8C8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- 引路光 -->
  <path d="M 60 100 Q 70 110 80 116" stroke="#F8E8B8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.22;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 数据危机（右，被结界挡） -->
  <g stroke="#5AA8E8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 168 70 Q 176 82 172 94">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 176 74 Q 184 86 180 98" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 圣光结界（半圆） -->
  <path d="M 140 148 Q 158 90 140 40" stroke="#F8E8B8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#3A4A78" opacity="0.9"/>

  <!-- 圣光塔 -->
  <path d="M 96 148 L 100 52 L 104 148 Z" fill="#6E7A9A" opacity="0.6"/>
  <circle cx="100" cy="56" r="4" fill="#F8E8B8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 守护圣兽（塔顶，圣光洒下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 尾（扬） -->
    <path d="M 92 44 Q 82 38 84 30 Q 90 26 94 32" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-3 92 44;3 92 44;-3 92 44" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 身 -->
    <ellipse cx="100" cy="38" rx="12" ry="11" fill="url(#fur)" stroke="#D0CCC4" stroke-width="0.9"/>
    <!-- 前爪（洒光） -->
    <path d="M 106 32 L 118 26" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 指尖圣光 -->
    <circle cx="120" cy="24" r="4" fill="url(#dot)">
      <animate attributeName="opacity" values="1;0.72;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="24" r="8" fill="#F8E8B8" opacity="0.32">
      <animate attributeName="opacity" values="0.32;0.18;0.32" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 圣光洒下 -->
    <path d="M 120 24 Q 100 60 84 116" stroke="#F8E8B8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 头 -->
    <ellipse cx="100" cy="22" rx="9" ry="8" fill="url(#fur)" stroke="#D0CCC4" stroke-width="0.8"/>
    <path d="M 92 17 Q 88 8 93 7 Q 97 13 98 18 Z" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="0.6"/>
    <path d="M 106 17 Q 110 8 105 7 Q 101 13 100 18 Z" fill="#FFFFFF" stroke="#D0CCC4" stroke-width="0.6"/>
    <path d="M 96 16 Q 100 13 104 16 L 100 19 Z" fill="#5AA8E8" opacity="0.8"/>
    <!-- 眼（含威含温） -->
    <circle cx="95" cy="21" r="2" fill="#2E2A24"/>
    <circle cx="95.8" cy="20" r="0.8" fill="#FFF"/>
    <circle cx="106" cy="21" r="2" fill="#2E2A24"/>
    <circle cx="106.8" cy="20" r="0.8" fill="#FFF"/>
    <!-- 嘴 -->
    <path d="M 98 26 Q 101 27.4 104 26" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#F8E8B8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
