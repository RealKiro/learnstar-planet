<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="亚古兽·二阶·成长之茫·数据塔崩伙伴被困进化闪灭失败跪废墟">
  <defs>
    <!-- 背景：崩塌数据塔 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A78"/>
      <stop offset="52%" stop-color="#3A485E"/>
      <stop offset="100%" stop-color="#2E3A4E"/>
    </linearGradient>
    <!-- 数据乱流光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#5AA8E8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5AA8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙黄圆身（沾尘） -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#E0B050"/>
      <stop offset="100%" stop-color="#C89028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="74" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 崩塌数据塔碎片 -->
  <g fill="#5E7A96" opacity="0.8">
    <path d="M 120 96 L 150 84 L 154 92 L 126 102 Z"/>
    <path d="M 152 108 L 176 100 L 178 106 L 156 114 Z"/>
    <rect x="136" y="88" width="12" height="6" rx="1" opacity="0.6"/>
  </g>

  <!-- 数据乱流（卷走伙伴） -->
  <g stroke="#5AA8E8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 140 120 Q 160 128 176 122">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 148 134 Q 168 140 182 136">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 被卷走的伙伴 -->
  <circle cx="160" cy="122" r="3.5" fill="#C8E8F8" stroke="#5AA8E8" stroke-width="0.5" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 废墟 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#3A485E" opacity="0.9"/>

  <!-- 跪废墟的小亚古兽（左，茫） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 圆身（跪坐，沾尘） -->
    <ellipse cx="80" cy="134" rx="16" ry="14" fill="url(#body)" stroke="#A87820" stroke-width="1"/>
    <!-- 数据尘 -->
    <circle cx="72" cy="128" r="1.2" fill="#5AA8E8" opacity="0.6"/>
    <circle cx="88" cy="136" r="1" fill="#5AA8E8" opacity="0.5"/>
    <!-- 眼（含茫含坚，微亮） -->
    <circle cx="74" cy="128" r="2.6" fill="#2E241E"/>
    <circle cx="74.6" cy="127" r="1" fill="#FFF"/>
    <circle cx="86" cy="128" r="2.6" fill="#2E241E"/>
    <circle cx="86.6" cy="127" r="1" fill="#FFF"/>
    <!-- 嘴（咬牙） -->
    <path d="M 77 134 Q 80 132.4 83 134" fill="none" stroke="#8E4E28" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 短爪（垂） -->
    <path d="M 66 134 L 62 140" stroke="#C89028" stroke-width="3" stroke-linecap="round"/>
    <path d="M 94 134 L 98 140" stroke="#C89028" stroke-width="3" stroke-linecap="round"/>
    <!-- 小火苗（弱，将熄） -->
    <path d="M 80 118 Q 79 113 81 110 Q 82 114 83 113 Q 84 109 85 112 Q 84 116 83 118" fill="#E89838" stroke="#C87828" stroke-width="0.5">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 尘灰 -->
  <g fill="#8EA4BC" opacity="0.35">
    <circle cx="50" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
