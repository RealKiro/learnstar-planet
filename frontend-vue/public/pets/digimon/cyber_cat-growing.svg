<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="迪路兽·三阶·练光苦修·数据湖冥想指尖微光亮起帮卡住小兽">
  <defs>
    <!-- 背景：数据湖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8AC8"/>
      <stop offset="52%" stop-color="#4A6AA0"/>
      <stop offset="100%" stop-color="#3A5078"/>
    </linearGradient>
    <!-- 圣光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#F8E8B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F8E8B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛（渐亮） -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E2"/>
    </radialGradient>
    <!-- 指尖光 -->
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="68" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 数据粒子 -->
  <g fill="#A8E0F8" opacity="0.4">
    <circle cx="36" cy="56" r="1.2">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="44" r="1">
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 湖面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#3A5078" opacity="0.9"/>
  <g stroke="#A8E0F8" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 20 158 Q 60 152 100 158 Q 140 164 180 158">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被帮的小兽（右，卡住被光引） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="148" cy="128" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="146" cy="126.5" r="1" fill="#24180E"/>
    <circle cx="151" cy="126.5" r="1" fill="#24180E"/>
  </g>
  <!-- 光引带 -->
  <path d="M 106 112 Q 122 118 140 124" stroke="#F8E8B8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.2;0.45" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 少年迪路兽（坐，冥想，指尖光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（坐） -->
    <ellipse cx="88" cy="126" rx="13" ry="11" fill="url(#fur)" stroke="#C8C8C2" stroke-width="0.9"/>
    <!-- 尾（盘） -->
    <path d="M 76 132 Q 66 132 64 124 Q 64 118 72 118" stroke="#E8E8E2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 旧线（变有用，绕爪） -->
    <path d="M 96 124 Q 104 122 108 116" stroke="#5A7A9A" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- 头（白，耳微立） -->
    <ellipse cx="86" cy="112" rx="9" ry="8" fill="url(#fur)" stroke="#C8C8C2" stroke-width="0.8"/>
    <path d="M 78 107 Q 75 100 79 99 Q 83 104 83 108 Z" fill="#F0F0EA" stroke="#C8C8C2" stroke-width="0.6"/>
    <path d="M 92 107 Q 95 100 91 99 Q 87 104 87 108 Z" fill="#F0F0EA" stroke="#C8C8C2" stroke-width="0.6"/>
    <!-- 眼（专注，闭冥想） -->
    <path d="M 80 111 Q 83 109.6 86 111" stroke="#2E2A24" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M 90 111 Q 93 109.6 95 111" stroke="#2E2A24" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <!-- 嘴（微定） -->
    <path d="M 84 116 Q 87 117.2 90 116" fill="none" stroke="#B0A090" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 伸出的前爪（指尖光） -->
    <path d="M 92 120 L 104 114" stroke="#F0F0EA" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 指尖微光 -->
    <circle cx="106" cy="112" r="3" fill="url(#dot)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="106" cy="112" r="6" fill="#F8E8B8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#F8E8B8">
    <circle cx="48" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
