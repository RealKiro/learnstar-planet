<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="亚古兽·三阶·练进苦修·数据湖进化暴龙兽稳稳立湖畔喷火精准">
  <defs>
    <!-- 背景：数据湖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A8AC8"/>
      <stop offset="52%" stop-color="#4A6AA0"/>
      <stop offset="100%" stop-color="#3A5078"/>
    </linearGradient>
    <!-- 数据湖光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#A8E0F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 橙鳞 -->
    <radialGradient id="scale" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#F8C860"/>
      <stop offset="100%" stop-color="#E0A028"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 数据粒子 -->
  <g fill="#A8E0F8" opacity="0.5">
    <circle cx="36" cy="56" r="1.2">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="44" r="1">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 数据湖面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#3A5078" opacity="0.9"/>
  <g stroke="#A8E0F8" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <path d="M 20 158 Q 60 152 100 158 Q 140 164 180 158">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暴龙兽（练进，立湖畔） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 尾（粗，垂） -->
    <path d="M 62 124 Q 48 118 44 128 Q 42 136 52 138" stroke="url(#scale)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 腿 -->
    <path d="M 84 132 L 80 150 M 104 132 L 108 150" stroke="url(#scale)" stroke-width="8" stroke-linecap="round"/>
    <!-- 身（暴龙） -->
    <ellipse cx="96" cy="120" rx="22" ry="14" fill="url(#scale)" stroke="#C88828" stroke-width="1"/>
    <!-- 腹 -->
    <ellipse cx="94" cy="126" rx="14" ry="8" fill="#F8E8B8" opacity="0.6"/>
    <!-- 背脊 -->
    <path d="M 76 112 L 72 100 L 80 110 L 78 96 L 86 108 L 86 94 L 94 106" stroke="#C88828" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- 颈 -->
    <path d="M 112 112 Q 122 100 126 88" stroke="url(#scale)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- 头（暴龙头，大） -->
    <ellipse cx="130" cy="84" rx="12" ry="10" fill="url(#scale)" stroke="#C88828" stroke-width="1"/>
    <!-- 角 -->
    <path d="M 124 76 L 120 66 M 134 76 L 138 66" stroke="#E8B048" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 眼（沉稳） -->
    <circle cx="125" cy="82" r="2.4" fill="#2E241E"/>
    <circle cx="125.8" cy="81" r="1" fill="#FFF"/>
    <circle cx="136" cy="82" r="2.4" fill="#2E241E"/>
    <circle cx="136.8" cy="81" r="1" fill="#FFF"/>
    <!-- 嘴（喷火，精准） -->
    <path d="M 140 88 L 146 90" stroke="#A85830" stroke-width="2" stroke-linecap="round"/>
    <!-- 精准火柱 -->
    <path d="M 146 90 Q 156 92 160 84" stroke="#F89838" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 146 89 Q 155 88 162 80" stroke="#F8C860" stroke-width="1.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- 短臂 -->
    <path d="M 84 112 L 76 122" stroke="url(#scale)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 108 112 L 116 122" stroke="url(#scale)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#A8E0F8">
    <circle cx="48" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
