<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双子座·撒加·三阶·伪教皇·恶面夺舍暗影如蝠">
  <defs>
    <!-- 背景：教皇殿幽暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A4E"/>
      <stop offset="52%" stop-color="#2A1E3E"/>
      <stop offset="100%" stop-color="#1E142E"/>
    </linearGradient>
    <!-- 暗影如蝠 -->
    <radialGradient id="shadow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#6E4E8E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6E4E8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 教皇袍白 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#C0B8B0"/>
    </linearGradient>
    <!-- 双面圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9AA6"/>
      <stop offset="100%" stop-color="#5E6A76"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>

    <!-- 头部模板：俊美面容·面具半掩·眼神阴鸷（脸中心 0,0） -->
    <g id="gemini-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 善恶双相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.8 -1.8 -0.6 L -1.8 0.9 Q -4.5 0.1 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.8 1.8 -0.6 L 1.8 0.9 Q 4.5 0.1 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0" r="1.6" fill="#A8282E"/>
      <circle cx="4.5" cy="0" r="1.6" fill="#A8282E"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暗影 -->
  <circle cx="100" cy="130" r="76" fill="url(#shadow)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 教皇殿柱 -->
  <g opacity="0.4">
    <path d="M 24 0 L 32 0 L 32 200 L 24 200 Z" fill="#4E3E6E"/>
    <path d="M 168 0 L 176 0 L 176 200 L 168 200 Z" fill="#4E3E6E"/>
  </g>

  <!-- 暗影如蝠（身后展开） -->
  <g fill="#4E3E8E" opacity="0.5">
    <path d="M 100 80 Q 70 56 52 60 Q 68 80 100 92 Z"/>
    <path d="M 100 80 Q 130 56 148 60 Q 132 80 100 92 Z"/>
    <path d="M 100 90 Q 64 74 46 82 Q 66 96 100 100 Z"/>
    <path d="M 100 90 Q 136 74 154 82 Q 134 96 100 100 Z"/>
  </g>

  <!-- 宝座（背景） -->
  <g opacity="0.35">
    <path d="M 80 60 L 120 60 L 126 120 L 74 120 Z" fill="#3E2E5E" stroke="#5E4E7E" stroke-width="1"/>
  </g>

  <!-- 教皇殿地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#1E142E" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#2E223E" stroke-width="1.4" opacity="0.6"/>

  <!-- 伪教皇（戴面具，教皇袍，双面圣衣黑金狰狞） -->
  <!-- 腿 -->
  <path d="M 90 132 L 86 156 L 92 156 L 96 134 Z" fill="#8E9AA6"/>
  <path d="M 106 132 L 114 158 L 108 158 L 102 134 Z" fill="#8E9AA6"/>
  <!-- 教皇袍 -->
  <path d="M 88 120 Q 98 132 110 124 Q 114 118 110 110 Q 104 122 96 118 Q 88 122 88 120 Z" fill="url(#robe)"/>
  <!-- 双面圣衣（上身） -->
  <path d="M 88 92 Q 84 106 90 122 Q 100 128 110 122 Q 116 106 112 92 Q 100 86 88 92 Z" fill="url(#armor)" stroke="#4E5A66" stroke-width="1"/>
  <!-- 黑金狰狞纹 -->
  <path d="M 92 98 Q 94 104 92 110 M 106 98 Q 104 104 106 110" stroke="#6E4E8E" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#C8B8A8" stroke-width="1.6"/>

  <!-- 头（面具，阴鸷） -->
  <use href="#gemini-face" transform="translate(100,84) scale(1)"/>
  <!-- 束发（教皇帽/长发垂下） -->
  <path d="M 96 76 Q 100 73 104 76 Q 102 71 100 71 Q 98 71 96 76 Z" fill="#2E2620"/>
  <!-- 教皇高冠 -->
  <path d="M 92 76 L 108 76 L 104 66 L 96 66 Z" fill="#D8D0C8" stroke="#A8A098" stroke-width="0.8"/>

  <!-- 左臂负背 -->
  <path d="M 90 96 C 84 102 82 108 84 116" fill="none" stroke="#E8E4DC" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 右臂（号令/挥向殿前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 108 96 C 116 98 120 102 122 108" fill="none" stroke="#E8E4DC" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="123" cy="110" r="3.2" fill="#D0B8A0"/>
    <!-- 恶念之光 -->
    <path d="M 124 112 Q 132 118 136 126" stroke="#6E4E8E" stroke-width="1.8" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暗影蝠尘 -->
  <g fill="#6E4E8E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
