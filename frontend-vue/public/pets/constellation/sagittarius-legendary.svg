<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="射手座·艾俄洛斯·五阶·星空守望·英魂星辉永守圣域">
  <defs>
    <!-- 背景：夜穹射手座星辉 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E7E"/>
      <stop offset="52%" stop-color="#2E3E66"/>
      <stop offset="100%" stop-color="#1E2E4E"/>
    </linearGradient>
    <!-- 星辉银 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 射手金 -->
    <radialGradient id="gold" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 英魂星辉 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#C8D8E8"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：青年面容·含笑·眼神温柔守望（星辉半透明） -->
    <g id="sag-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D0BCA0" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 眉目温厚 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <!-- 眼含仁光（温柔守望） -->
      <ellipse cx="-4.3" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <ellipse cx="4.3" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <circle cx="-4.8" cy="-0.4" r="0.7" fill="#E8F0FA"/>
      <circle cx="3.8" cy="-0.4" r="0.7" fill="#E8F0FA"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C8B098" stroke-width="1" stroke-linecap="round"/>
      <!-- 含笑 -->
      <path d="M -3 5.4 Q 0 7.4 3 5.4" fill="none" stroke="#A89070" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 浩瀚星空 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
    <circle cx="100" cy="10" r="1"/>
  </g>

  <!-- 射手座星辉（背景，星连线） -->
  <g opacity="0.7">
    <circle cx="40" cy="56" r="1.8" fill="#FFF3C4"/>
    <circle cx="56" cy="46" r="1.5" fill="#FFF3C4"/>
    <circle cx="74" cy="52" r="1.6" fill="#FFF3C4"/>
    <circle cx="68" cy="70" r="1.3" fill="#FFF3C4"/>
    <path d="M 40 56 L 56 46 L 74 52 L 68 70" stroke="#FFF3C4" stroke-width="0.8" opacity="0.7"/>
    <path d="M 68 70 L 96 96" stroke="#FFF3C4" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 星辉光晕 -->
  <circle cx="100" cy="84" r="76" fill="url(#aura)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 射手金 -->
  <circle cx="100" cy="84" r="62" fill="url(#gold)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="84" r="60" fill="none" stroke="#FFF3C4" stroke-width="2.2" opacity="0.8">
      <animate attributeName="r" values="60;65;60" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="84" r="52" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.45">
      <animate attributeName="r" values="52;55;52" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 下方圣域宫阙（被星辉护） -->
  <g opacity="0.5">
    <path d="M 0 158 Q 40 150 90 156 Q 140 162 200 154 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 150 L 40 140 L 52 140 L 52 150 M 120 152 L 120 144 L 132 144 L 132 152" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 星辉如雨洒落（护佑） -->
  <g fill="#E8F0FA" opacity="0.7">
    <circle cx="50" cy="130" r="1.4"><animate attributeName="cy" values="130;146;130" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="124" r="1.2"><animate attributeName="cy" values="124;140;124" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="128" r="1.3"><animate attributeName="cy" values="128;144;128" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="122" r="1.1"><animate attributeName="cy" values="122;138;122" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 英魂虚影（持弓立于星间，半透明） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="4s" repeatCount="indefinite"/>
    <!-- 腿 -->
    <path d="M 92 132 L 88 152 L 94 152 L 98 134 Z" fill="#C8D8E8"/>
    <path d="M 106 132 L 114 154 L 108 154 L 102 134 Z" fill="#C8D8E8"/>
    <!-- 英魂星辉衣 -->
    <path d="M 90 92 Q 86 108 92 128 Q 100 134 108 128 Q 114 108 110 92 Q 100 86 90 92 Z" fill="url(#robe)" stroke="#B8C8D8" stroke-width="1"/>
    <!-- 腰带 -->
    <path d="M 90 110 L 110 110" stroke="#E8F0FA" stroke-width="1.4"/>

    <!-- 头（面部模板） -->
    <use href="#sag-face" transform="translate(100,84) scale(1)"/>

    <!-- 左臂（持弓） -->
    <path d="M 92 96 C 86 98 82 100 80 104" fill="none" stroke="#E8F0FA" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="78" cy="106" r="3" fill="#E0D0B8"/>

    <!-- 黄金之弓虚影 -->
    <path d="M 66 76 Q 76 96 70 116 Q 84 104 92 96 Q 82 96 70 108" fill="none" stroke="#FFF3C4" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
    <line x1="66" y1="76" x2="92" y2="96" stroke="#E8F0FA" stroke-width="1.2" opacity="0.7"/>

    <!-- 右手（搭弦，星辉之箭待发） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M 108 96 C 114 98 118 100 120 104" fill="none" stroke="#E8F0FA" stroke-width="3.8" stroke-linecap="round"/>
      <circle cx="122" cy="106" r="3" fill="#E0D0B8"/>
      <!-- 指尖星辉 -->
      <circle cx="122" cy="104" r="7" fill="url(#gold)">
        <animate attributeName="r" values="7;11;7" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 星辉星尘 -->
  <g fill="#E8F0FA">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
