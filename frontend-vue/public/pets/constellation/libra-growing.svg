<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天秤座·童虎·三阶·升龙霸·一拳破云瀑布倒卷">
  <defs>
    <!-- 背景：庐山瀑布青山 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9086"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 升龙金 -->
    <radialGradient id="dragon" cx="50%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 水光蓝 -->
    <radialGradient id="water" cx="50%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#9AC8D8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9AC8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜天秤圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容·浓眉·虎目如龙（脸中心 0,0） -->
    <g id="libra-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 浓眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 虎目如龙 -->
      <ellipse cx="-4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <circle cx="-4.8" cy="-0.4" r="0.8" fill="#FFF3C4"/>
      <circle cx="3.8" cy="-0.4" r="0.8" fill="#FFF3C4"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 坚毅 -->
      <path d="M -3 5.4 Q 0 7 3 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 升龙光 -->
  <circle cx="100" cy="80" r="84" fill="url(#dragon)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 升龙破云（龙影冲天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 升龙身形 -->
    <path d="M 88 96 Q 78 80 84 66 Q 90 54 100 52 Q 112 50 118 60 Q 122 70 114 80 Q 106 88 96 90 Z" fill="#FFF3C4" opacity="0.85" stroke="#E8C878" stroke-width="1"/>
    <!-- 龙头 -->
    <path d="M 100 50 Q 94 44 98 38 Q 104 36 108 40 Q 110 46 106 50 Z" fill="#FFE9A8" stroke="#E8C878" stroke-width="0.8"/>
    <!-- 龙角 -->
    <path d="M 98 40 L 94 32 L 100 36 Z" fill="#FFE9A8"/>
    <path d="M 104 40 L 108 32 L 102 36 Z" fill="#FFE9A8"/>
    <!-- 龙目 -->
    <circle cx="101" cy="42" r="1.4" fill="#8E6A2E"/>
    <!-- 龙须 -->
    <path d="M 94 44 Q 88 46 86 52 M 110 44 Q 116 46 118 52" stroke="#FFE9A8" stroke-width="1" opacity="0.7" fill="none"/>
    <!-- 升龙光尾 -->
    <path d="M 88 96 Q 80 106 84 116" stroke="#FFF3C4" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 破云（龙影处云散） -->
  <g stroke="#C8DCE8" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <path d="M 84 60 Q 76 54 72 46">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 58 Q 128 52 132 44">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 瀑布倒卷（左侧） -->
  <g opacity="0.7">
    <path d="M 40 40 Q 30 70 40 100 Q 50 70 44 40 Z" fill="#E0ECF4" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="40" cy="60" r="30" fill="url(#water)">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#5E7268" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#7E9086" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜天秤圣斗士（6头身，一拳升龙） -->
  <!-- 腿 -->
  <path d="M 90 132 L 86 154 L 92 154 L 96 134 Z" fill="#9EAEA0"/>
  <path d="M 106 132 L 114 156 L 108 156 L 102 134 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 90 122 Q 100 130 112 122 Q 116 116 112 108 Q 106 120 98 116 Q 90 120 90 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 90 92 Q 86 106 92 122 Q 102 128 112 122 Q 118 106 114 92 Q 102 86 90 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 天秤纹 -->
  <path d="M 94 98 L 98 116 M 108 98 L 104 116" stroke="#E8F0E8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 90 108 L 114 108" stroke="#E8F0E8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#libra-face" transform="translate(102,84) scale(1)"/>

  <!-- 左臂（护身，蓄） -->
  <path d="M 92 96 C 86 100 84 106 86 114" fill="none" stroke="#C8D0C8" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="86" cy="116" r="3.2" fill="#D0B090"/>

  <!-- 右拳轰天（升龙破云） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 110 96 C 116 92 120 88 122 82" fill="none" stroke="#C8D0C8" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="123" cy="80" r="3.6" fill="#D0B090"/>
    <!-- 拳上升龙光 -->
    <circle cx="124" cy="78" r="10" fill="url(#dragon)">
      <animate attributeName="r" values="10;14;10" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 升龙星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
