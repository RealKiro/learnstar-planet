<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天秤座·童虎·一阶·庐山修行·瀑布练拳少年">
  <defs>
    <!-- 背景：庐山瀑布青山 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9086"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 水花白 -->
    <radialGradient id="spray" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8F4F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA0B0"/>
      <stop offset="100%" stop-color="#5E7484"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 远山 -->
  <path d="M 0 130 Q 40 110 90 120 Q 140 128 200 116 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>

  <!-- 飞瀑（左侧） -->
  <path d="M 40 40 Q 36 80 40 120" stroke="#C8DCE8" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 34 44 Q 30 84 34 124" stroke="#E0ECF4" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <!-- 瀑布下潭 -->
  <circle cx="40" cy="130" r="40" fill="url(#spray)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 水花飞溅 -->
  <g fill="#E8F4F8">
    <circle cx="52" cy="118" r="2"><animate attributeName="cy" values="118;112;118" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="126" r="1.6"><animate attributeName="cy" values="126;120;126" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 溪石 -->
  <path d="M 70 150 Q 82 142 94 148 Q 104 152 98 160 Q 78 162 70 150 Z" fill="#7E8E84"/>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#5E7268" opacity="0.7"/>
  <path d="M 0 154 L 200 154" stroke="#7E9086" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜学徒少年（5头身，练拳，英武） -->
  <!-- 腿 -->
  <path d="M 88 134 L 84 156 L 90 156 L 94 136 Z" fill="#5E7484"/>
  <path d="M 104 134 L 112 158 L 106 158 L 100 136 Z" fill="#5E7484"/>
  <!-- 青铜学徒服 -->
  <path d="M 86 100 Q 82 116 88 134 Q 98 140 106 134 Q 112 116 108 100 Q 98 94 86 100 Z" fill="url(#robe)" stroke="#4E5E6E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 86 116 L 106 116" stroke="#A8B8C8" stroke-width="1.6"/>

  <!-- 头（少年面容，浓眉虎目有神） -->
  <circle cx="97" cy="92" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 短发 -->
  <path d="M 88 86 Q 92 82 97 82 Q 102 82 106 86 Q 102 83 97 83 Q 92 83 88 86 Z" fill="#2E2620"/>
  <!-- 浓眉 -->
  <path d="M 89 87 Q 93 85.5 96 86 M 99 86 Q 102 85.5 105 87" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- 虎目有神 -->
  <ellipse cx="93" cy="90" rx="2.4" ry="2.2" fill="#1E1008"/>
  <ellipse cx="101" cy="90" rx="2.4" ry="2.2" fill="#1E1008"/>
  <circle cx="94" cy="89.2" r="0.8" fill="#FFF"/>
  <circle cx="102" cy="89.2" r="0.8" fill="#FFF"/>
  <!-- 鼻梁 -->
  <path d="M 97 92.5 L 97 95" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 坚毅 -->
  <path d="M 92 98.5 Q 97 100.8 102 98.5" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 左臂（收于身侧） -->
  <path d="M 88 104 C 82 108 80 114 82 120" fill="none" stroke="#7E8E9E" stroke-width="4" stroke-linecap="round"/>

  <!-- 右拳练拳（水花随拳起） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 104 104;4 104 104;-5 104 104" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 104 104 C 112 100 118 96 120 90" fill="none" stroke="#7E8E9E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="122" cy="89" r="3.4" fill="#D0B090"/>
    <!-- 水花随拳 -->
    <g fill="#E8F4F8" opacity="0.7">
      <circle cx="124" cy="86" r="1.8"><animate attributeName="cy" values="86;80;86" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="90" r="1.4"><animate attributeName="cy" values="90;84;90" dur="1.9s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 瀑布水光尘 -->
  <g fill="#E8F4F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
