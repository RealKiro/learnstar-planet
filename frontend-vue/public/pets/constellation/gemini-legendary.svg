<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双子座·撒加·五阶·回归本心·双面合一赎罪身">
  <defs>
    <!-- 背景：黄金圣殿 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B878"/>
      <stop offset="52%" stop-color="#B8965E"/>
      <stop offset="100%" stop-color="#8E7850"/>
    </linearGradient>
    <!-- 圣光白 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="56%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 暗影紫 -->
    <radialGradient id="shadow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#6E4E8E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6E4E8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黄金双子圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D8B64E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>

    <!-- 头部模板：俊美面容·眉目释然·眼含悲悯（双面合一） -->
    <g id="gemini-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 善恶双相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.8 -1.8 -0.6 L -1.8 0.9 Q -4.5 0.1 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.8 1.8 -0.6 L 1.8 0.9 Q 4.5 0.1 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0" r="1.6" fill="#A8282E"/>
      <circle cx="4.5" cy="0" r="1.6" fill="#A8282E"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 圣光 -->
  <circle cx="100" cy="94" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 暗影交融 -->
  <circle cx="100" cy="94" r="80" fill="url(#shadow)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="94" r="62" fill="none" stroke="#FFF7E0" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="94" r="54" fill="none" stroke="#FFF7E0" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 善恶双面圣衣（身后，归于一体） -->
  <g opacity="0.45">
    <!-- 善面（左，白） -->
    <circle cx="46" cy="76" r="9" fill="#FFF0D0"/>
    <path d="M 42 76 Q 45 75 48 76 M 50 76 Q 52 75 54 76" stroke="#B8965E" stroke-width="1" fill="none"/>
    <!-- 恶面（右，暗） -->
    <circle cx="154" cy="76" r="9" fill="#5E4E8E"/>
    <path d="M 150 74 Q 153 72.5 156 74 M 152 78 Q 155 79.5 158 78" stroke="#6E4E8E" stroke-width="1" fill="none"/>
  </g>

  <!-- 黄金殿堂柱 -->
  <g opacity="0.4">
    <path d="M 18 0 L 26 0 L 26 200 L 18 200 Z" fill="#B8965E"/>
    <path d="M 174 0 L 182 0 L 182 200 L 174 200 Z" fill="#B8965E"/>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.6">
    <path d="M 0 150 Q 50 142 100 148 Q 150 154 200 146 L 200 200 L 0 200 Z" fill="#C8AC84">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 黄金双子圣斗士（负手而立，坦然而立） -->
  <!-- 腿 -->
  <path d="M 90 132 L 86 156 L 92 156 L 96 134 Z" fill="#D8B64E"/>
  <path d="M 106 132 L 114 158 L 108 158 L 102 134 Z" fill="#D8B64E"/>
  <!-- 圣衣（下摆） -->
  <path d="M 88 122 Q 98 130 110 122 Q 114 116 110 108 Q 104 120 96 116 Q 88 120 88 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 92 Q 84 106 90 122 Q 100 128 110 122 Q 116 106 112 92 Q 100 86 88 92 Z" fill="url(#armor)" stroke="#B8964E" stroke-width="1.2"/>
  <!-- 双面合一纹（金紫交织） -->
  <path d="M 92 98 Q 94 106 92 112" stroke="#FFF0C0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 106 98 Q 104 106 106 112" stroke="#6E4E8E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#FFF0C0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#gemini-face" transform="translate(100,84) scale(1)"/>

  <!-- 左臂负手 -->
  <path d="M 90 96 C 84 102 82 108 84 116" fill="none" stroke="#FFE9A8" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 右臂负手 -->
  <path d="M 110 96 C 116 102 118 108 116 116" fill="none" stroke="#FFE9A8" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 赎罪之光（心口，圣光暗影交融） -->
  <circle cx="100" cy="108" r="12" fill="#FFF7E0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
