<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双鱼座·阿布罗狄·二阶·以玫瑰为兵·漫天血玫飞射">
  <defs>
    <!-- 背景：训练场绯红 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E5E6E"/>
      <stop offset="52%" stop-color="#6E4A58"/>
      <stop offset="100%" stop-color="#4E3644"/>
    </linearGradient>
    <!-- 玫瑰绯红 -->
    <radialGradient id="rose" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#E8627E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8627E" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜训练服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E9E"/>
      <stop offset="100%" stop-color="#6E7E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="pisces-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 绝美·桃花眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1 Q -4.5 0.2 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.4 1.8 -0.4 L 1.8 1 Q 4.5 0.2 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.5" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 玫瑰绯红 -->
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 漫天血玫飞射（四散） -->
  <g>
    <!-- 玫瑰弹 -->
    <circle cx="56" cy="60" r="5" fill="#E8627E" opacity="0.9">
      <animate attributeName="cy" values="60;50;60" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="52" r="5" fill="#E8627E" opacity="0.9">
      <animate attributeName="cy" values="52;42;52" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100" r="4.5" fill="#E8627E" opacity="0.85">
      <animate attributeName="cy" values="100;90;100" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="110" r="4" fill="#E8627E" opacity="0.8">
      <animate attributeName="cy" values="110;100;110" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 飞射轨迹 -->
    <g stroke="#E8627E" stroke-width="1.3" opacity="0.5" stroke-linecap="round">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#3E2E3E" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#5E4A58" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜美少年（6头身，身绕玫瑰藤，抬手血玫飞射） -->
  <!-- 腿 -->
  <path d="M 88 134 L 84 156 L 90 156 L 94 136 Z" fill="#6E7E7E"/>
  <path d="M 104 134 L 112 158 L 106 158 L 100 136 Z" fill="#6E7E7E"/>
  <!-- 训练服 -->
  <!-- 玫瑰藤（身绕） -->
  <path d="M 84 96 Q 78 104 82 114 Q 86 122 82 130" stroke="#5E8E5E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="104" r="2.4" fill="#E8627E"/>
  <circle cx="83" cy="124" r="2.4" fill="#E8627E"/>
  <!-- 腰带 -->
  <path d="M 88 114 L 108 114" stroke="#A8B8B8" stroke-width="1.4"/>

  <!-- 头（绝美面容，长发，桃花眼微眯） -->
  <!-- 细眉 -->
  <!-- 桃花眼微眯 -->
  <!-- 鼻梁 -->
  <!-- 唇色如玫瑰 -->

  <!-- 左臂负背 -->
  <path d="M 90 100 C 84 104 82 110 84 118" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>

  <!-- 右手（抬起，血玫飞射） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 106 100 C 112 96 116 92 120 88" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="86" r="3" fill="#E2C8A8"/>
    <!-- 掌心血玫 -->
    <circle cx="123" cy="84" r="7" fill="#E8627E">
      <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 玫瑰星尘 -->
  <g fill="#E8627E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#pisces-face" transform="translate(98,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 89 86 Q 93 81 98 81 Q 103 81 107 86 Q 103 82 98 82 Q 93 82 89 86 Z" fill="#2E2620"/>
</svg>
