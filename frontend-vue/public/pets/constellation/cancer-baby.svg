<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨蟹座·迪斯马斯克·二阶·狂妄渐浓·一掌击飞张狂笑">
  <defs>
    <!-- 背景：演武场圣域宫阙 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E9090"/>
      <stop offset="52%" stop-color="#6E7676"/>
      <stop offset="100%" stop-color="#4E5656"/>
    </linearGradient>
    <!-- 冥气灰绿 -->
    <radialGradient id="yin" cx="50%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#7E9E9E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7E9E9E" stop-opacity="0"/>
    </radialGradient>
    <!-- 血战红 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#B8432E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8432E" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜巨蟹圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0C8C8"/>
      <stop offset="100%" stop-color="#8E9E9E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="cancer-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 阴柔·狞笑 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.3 Q -5 -2.4 -2 -2 M 8 -1.3 Q 5 -2.4 2 -2" stroke="#1E1008" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.4 5.8 Q 0 8 3.4 5.8" fill="none" stroke="#8E5A3E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冥气 -->
  <circle cx="100" cy="140" r="70" fill="url(#yin)">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 血战红 -->
  <circle cx="156" cy="52" r="48" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 被击飞同门（右，倒飞出去） -->
  <g opacity="0.85">
    <circle cx="160" cy="120" r="5" fill="#E0C8A8"/>
    <path d="M 157 116 Q 160 113 163 116 Q 162 118 160 118 Q 158 118 157 116 Z" fill="#2E2620"/>
    <path d="M 158 125 Q 156 134 158 138 Q 162 138 162 125 Z" fill="#8E9EA6"/>
    <path d="M 160 128 L 163 120" fill="none" stroke="#E0C8A8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 倒飞轨迹 -->
    <path d="M 140 108 Q 148 112 156 118" stroke="#C8C0B8" stroke-width="1.2" opacity="0.5" fill="none"/>
  </g>

  <!-- 圣域宫阙（背景） -->
  <g opacity="0.4">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#4E5656"/>
    <path d="M 20 20 L 64 20" stroke="#6E7676" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#3E4646" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#5E6666" stroke-width="1.4" opacity="0.6"/>

  <!-- 巨蟹少年（6头身，一掌推出，张狂大笑） -->
  <!-- 腿 -->
  <path d="M 86 134 L 82 156 L 88 156 L 92 136 Z" fill="#8E9E9E"/>
  <path d="M 102 134 L 110 158 L 104 158 L 98 136 Z" fill="#8E9E9E"/>
  <!-- 青铜巨蟹圣衣 -->
  <!-- 蟹甲冥光 -->
  <path d="M 90 102 Q 92 108 90 114 M 104 102 Q 102 108 104 114" stroke="#7E9E9E" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 86 114 L 106 114" stroke="#C8D0D0" stroke-width="1.4"/>

  <!-- 头（阴柔面容，狂笑，眼神轻蔑） -->
  <!-- 细眉（狂） -->
  <!-- 狭长眼（轻蔑） -->
  <!-- 鼻梁 -->
  <!-- 狂笑 -->

  <!-- 左臂负背 -->
  <path d="M 88 100 C 82 104 80 110 82 118" fill="none" stroke="#AEB8B8" stroke-width="4" stroke-linecap="round"/>

  <!-- 右掌推出（一掌击飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 104 100 C 112 104 118 108 122 114" fill="none" stroke="#AEB8B8" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 掌 -->
    <path d="M 124 116 Q 128 116 130 120 L 128 123 Q 124 122 122 118 Z" fill="#D0B8A0"/>
    <!-- 击飞气浪 -->
    <path d="M 130 122 Q 140 128 144 134" stroke="#C8D0D0" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 狂笑音浪 -->
  <g stroke="#C8D0D0" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 冥气星尘 -->
  <g fill="#7E9E9E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#cancer-face" transform="translate(97,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 93 79 Q 97 76 101 79 Q 99 74 97 74 Q 95 74 93 79 Z" fill="#2E2620"/>
  <path d="M 88 86 Q 92 81 97 81 Q 102 81 106 86 Q 102 82 97 82 Q 92 82 88 86 Z" fill="#2E2620"/>
</svg>
