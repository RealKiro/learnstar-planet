<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨蟹座·迪斯马斯克·五阶·巨蟹宫主·黄金巨蟹冥气凝徽">
  <defs>
    <!-- 背景：巨蟹宫大殿幽冷金色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8A878"/>
      <stop offset="52%" stop-color="#9E8E5E"/>
      <stop offset="100%" stop-color="#7E6E48"/>
    </linearGradient>
    <!-- 冥气灰绿 -->
    <radialGradient id="yin" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7E9E9E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7E9E9E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黄金巨蟹圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D8B64E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>

    <!-- 头部模板：阴柔面容·眼含幽光·嘴角冷峭 -->
    <g id="cancer-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 阴柔·狞笑 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.3 Q -5 -2.4 -2 -2 M 8 -1.3 Q 5 -2.4 2 -2" stroke="#1E1008" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.4 5.8 Q 0 8 3.4 5.8" fill="none" stroke="#8E5A3E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冥气 -->
  <circle cx="100" cy="94" r="82" fill="url(#yin)">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="94" r="62" fill="none" stroke="#FFE9A8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="94" r="54" fill="none" stroke="#FFE9A8" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 巨蟹宫星象（背景） -->
  <g opacity="0.5">
    <g fill="#FFF0C0">
      <circle cx="40" cy="70" r="1.8"/>
      <circle cx="52" cy="60" r="1.4"/>
      <circle cx="66" cy="66" r="1.6"/>
    </g>
    <path d="M 40 70 L 52 60 L 66 66" stroke="#FFF0C0" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 冥气凝为蟹形徽记（身后） -->
  <g opacity="0.6">
    <circle cx="150" cy="64" r="10" fill="none" stroke="#7E9E9E" stroke-width="1.6"/>
    <!-- 蟹钳 -->
    <path d="M 150 60 Q 146 54 140 54 Q 136 58 142 60 Q 146 62 148 58" fill="none" stroke="#7E9E9E" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 150 60 Q 154 54 160 54 Q 164 58 158 60 Q 154 62 152 58" fill="none" stroke="#7E9E9E" stroke-width="1.4" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- 黄金殿堂柱 -->
  <g opacity="0.4">
    <path d="M 18 0 L 26 0 L 26 200 L 18 200 Z" fill="#9E8E5E"/>
    <path d="M 174 0 L 182 0 L 182 200 L 174 200 Z" fill="#9E8E5E"/>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.6">
    <path d="M 0 150 Q 50 142 100 148 Q 150 154 200 146 L 200 200 L 0 200 Z" fill="#B8A878">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 黄金巨蟹圣斗士（端坐，孤冷） -->
  <!-- 腿（盘坐） -->
  <path d="M 88 136 Q 94 144 106 140 Q 110 136 108 130 Q 100 140 92 134 Z" fill="#D8B64E"/>
  <!-- 圣衣（下摆） -->
  <path d="M 88 126 Q 98 134 110 126 Q 114 120 110 112 Q 104 124 96 120 Q 88 124 88 126 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 94 Q 84 108 90 126 Q 100 132 110 126 Q 116 108 112 94 Q 100 88 88 94 Z" fill="url(#armor)" stroke="#B8964E" stroke-width="1.2"/>
  <!-- 蟹甲金纹 -->
  <path d="M 92 100 Q 94 106 92 112 M 106 100 Q 104 106 106 112" stroke="#7E9E9E" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#FFF0C0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#cancer-face" transform="translate(100,86) scale(1)"/>

  <!-- 左臂抚膝 -->
  <path d="M 90 98 C 84 102 82 108 84 116" fill="none" stroke="#FFE9A8" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="84" cy="118" r="3.2" fill="#D0B8A0"/>

  <!-- 右臂（指尖幽光，引渡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 108 98 C 114 96 118 92 120 86" fill="none" stroke="#FFE9A8" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="121" cy="84" r="3" fill="#D0B8A0"/>
    <!-- 指尖幽光 -->
    <circle cx="122" cy="82" r="8" fill="#7E9E9E" opacity="0.6">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 冥金星尘 -->
  <g fill="#7E9E9E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFE9A8" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
