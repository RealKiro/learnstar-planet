<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="处女座·沙加·一阶·佛子降世·沙罗双树闭目冥想">
  <defs>
    <!-- 背景：沙罗双树下圣域 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EA890"/>
      <stop offset="52%" stop-color="#6E8E72"/>
      <stop offset="100%" stop-color="#4E6E56"/>
    </linearGradient>
    <!-- 佛光微晕 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8B8A8"/>
      <stop offset="100%" stop-color="#7E8E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="virgo-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 闭目·禅相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 佛光 -->
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 沙罗双树（两侧） -->
  <g>
    <!-- 左树 -->
    <path d="M 30 140 Q 28 116 32 96" stroke="#4E6E4E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="92" r="10" fill="#7EA878"/>
    <circle cx="24" cy="96" r="6" fill="#6E9E68"/>
    <circle cx="40" cy="94" r="6" fill="#6E9E68"/>
    <!-- 右树 -->
    <path d="M 170 140 Q 172 116 168 96" stroke="#4E6E4E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="168" cy="92" r="10" fill="#7EA878"/>
    <circle cx="160" cy="96" r="6" fill="#6E9E68"/>
    <circle cx="176" cy="94" r="6" fill="#6E9E68"/>
  </g>
  <!-- 沙罗叶落 -->
  <g fill="#A8C878">
    <path d="M 60 108 L 62 116 L 58 114 Z" opacity="0.7">
      <animate attributeName="cy" values="108;120;108" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 104 L 142 112 L 138 110 Z" opacity="0.6">
      <animate attributeName="cy" values="104;116;104" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 圣域地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#4E6E56" opacity="0.7"/>
  <path d="M 0 154 L 200 154" stroke="#6E8E72" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜学徒小童（5头身，合十闭目静坐，清瘦） -->
  <!-- 腿（盘坐） -->
  <path d="M 88 140 Q 94 148 106 144 Q 110 140 108 134 Q 100 144 92 138 Z" fill="#7E8E7E"/>
  <!-- 青铜学徒服 -->
  <!-- 腰带 -->
  <path d="M 88 120 L 110 120" stroke="#C8D8C8" stroke-width="1.4"/>

  <!-- 头（清秀面容，双目紧闭，眉宇含慈悲） -->
  <!-- 眉宇含慈悲 -->
  <!-- 双目紧闭 -->
  <!-- 鼻梁 -->
  <!-- 嘴角微阖 -->

  <!-- 双手合十（胸前） -->
  <path d="M 94 116 Q 99 112 104 116 Q 99 119 94 116 Z" fill="#DCC8A8" stroke="#C8B098" stroke-width="0.8"/>

  <!-- 佛光微晕（身周） -->
    <animate attributeName="r" values="16;21;16" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 一念窥因果（眉心一点光） -->
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 佛光金尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#virgo-face" transform="translate(99,96) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 90 90 Q 94 86 99 86 Q 104 86 108 90 Q 104 87 99 87 Q 94 87 90 90 Z" fill="#2E2620"/>
</svg>
