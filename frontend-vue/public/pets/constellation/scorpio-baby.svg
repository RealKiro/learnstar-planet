<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天蝎座·米罗·二阶·毒针初练·深红针影如雨">
  <defs>
    <!-- 背景：训练场天蝎宫 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E6E6E"/>
      <stop offset="52%" stop-color="#6E5256"/>
      <stop offset="100%" stop-color="#4E3A3E"/>
    </linearGradient>
    <!-- 深红针光 -->
    <radialGradient id="needle" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#E8624A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8624A" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜训练服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E9E"/>
      <stop offset="100%" stop-color="#6E7E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="scorpio-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 忠义·剑眉 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 深红针光 -->
    <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 靶（右侧，被针雨点中） -->
  <g>
    <circle cx="156" cy="110" r="22" fill="none" stroke="#C8B8A8" stroke-width="2"/>
    <circle cx="156" cy="110" r="14" fill="none" stroke="#C8B8A8" stroke-width="1.4"/>
    <circle cx="156" cy="110" r="7" fill="#C8402E" opacity="0.8"/>
    <!-- 靶心针痕 -->
    <g stroke="#E8624A" stroke-width="1.2" opacity="0.8">
      <path d="M 150 104 L 162 116"/>
      <path d="M 150 116 L 162 104"/>
    </g>
  </g>
  <!-- 针影如雨（飞向靶） -->
  <g stroke="#E8624A" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <path d="M 120 100 Q 134 102 142 106">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 122 106 Q 134 110 142 112">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 118 112 Q 130 116 140 118">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 天蝎宫（背景） -->
  <g opacity="0.4">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#6E5256"/>
    <path d="M 20 20 L 64 20" stroke="#8E6E6E" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#3A2E32" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#5A4A4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜少年（6头身，指尖蓄光，专注） -->
  <!-- 腿 -->
  <path d="M 88 134 L 84 156 L 90 156 L 94 136 Z" fill="#6E7E7E"/>
  <path d="M 104 134 L 112 158 L 106 158 L 100 136 Z" fill="#6E7E7E"/>
  <!-- 训练服 -->
  <!-- 腰带 -->
  <path d="M 88 114 L 108 114" stroke="#A8B8B8" stroke-width="1.4"/>

  <!-- 头（少年面容，剑眉虎目专注） -->
  <!-- 剑眉 -->
  <!-- 虎目专注 -->
  <!-- 鼻梁 -->
  <!-- 专注 -->

  <!-- 左臂负背 -->
  <path d="M 90 100 C 84 104 82 110 84 118" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>

  <!-- 右手（指尖蓄猩红光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 106 100 C 112 96 116 92 118 86" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>
    <!-- 指尖针光 -->
    <circle cx="120" cy="84" r="3" fill="#E8624A"/>
    <path d="M 121 83 L 125 78" stroke="#E8624A" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="120" cy="84" r="10" fill="url(#needle)">
      <animate attributeName="r" values="10;14;10" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 猩红星尘 -->
  <g fill="#E8624A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#scorpio-face" transform="translate(98,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 89 82 Q 93 78 98 78 Q 103 78 107 82 Q 103 79 98 79 Q 93 79 89 82 Z" fill="#2E2620"/>
</svg>
