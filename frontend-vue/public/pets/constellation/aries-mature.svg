<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白羊座·穆·四阶·圣战死斗·水晶墙挡万箭星光灭绝">
  <defs>
    <!-- 背景：白羊宫前圣战 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3A5E"/>
      <stop offset="52%" stop-color="#3A2A48"/>
      <stop offset="100%" stop-color="#2A1E34"/>
    </linearGradient>
    <!-- 水晶墙透蓝 -->
    <radialGradient id="crystal" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#9AC8E8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9AC8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火金 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 星光灭绝 -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：青年面容·眉目坚毅·眼含战意又温柔 -->
    <g id="aries-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 温柔·贤者 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 战火 -->
  <circle cx="156" cy="52" r="54" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 漫天攻击（左上，被水晶墙挡住） -->
  <g>
    <!-- 箭矢/能量弹 -->
    <g stroke="#E8A84E" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
      <path d="M 40 40 L 70 62">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 28 60 L 62 74">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <path d="M 46 76 L 74 84">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 弹头 -->
    <circle cx="70" cy="62" r="3" fill="#E8A84E" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 攻击被水晶墙挡回（迸溅） -->
  <g fill="#E8A84E" opacity="0.6">
    <circle cx="80" cy="58" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="70" r="1.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 水晶墙（月幕，左侧大） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 24 50 Q 56 42 84 52 Q 96 58 96 68 L 96 136 Q 60 146 24 136 Z" fill="url(#crystal)" opacity="0.65"/>
    <path d="M 30 60 L 84 56 M 30 76 L 86 72 M 30 92 L 88 88" stroke="#C8E0F8" stroke-width="1.1" opacity="0.6" stroke-linecap="round"/>
    <path d="M 24 50 Q 56 42 84 52 L 96 68 L 96 136 Q 60 146 24 136 Z" fill="none" stroke="#C8E0F8" stroke-width="1.6" opacity="0.75"/>
  </g>

  <!-- 白羊宫（背景） -->
  <g opacity="0.4">
    <path d="M 128 20 L 188 20 L 180 34 Q 158 42 140 38 Z" fill="#4E3A5E"/>
    <path d="M 128 20 L 188 20" stroke="#6E5A7E" stroke-width="1.2"/>
  </g>

  <!-- 圣域地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#2A1E34" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3E2E4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银圣斗士（6头身，双臂交叉，立于宫前） -->
  <!-- 腿 -->
  <path d="M 100 132 L 96 154 L 102 154 L 106 134 Z" fill="#B8C4D0"/>
  <path d="M 118 132 L 126 156 L 120 156 L 114 134 Z" fill="#B8C4D0"/>
  <!-- 白银圣衣（下摆） -->
  <path d="M 100 122 Q 110 130 122 122 Q 126 116 122 108 Q 116 120 108 116 Q 100 120 100 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 100 92 Q 96 106 102 122 Q 112 128 122 122 Q 128 106 124 92 Q 112 86 100 92 Z" fill="url(#armor)" stroke="#9EACB8" stroke-width="1"/>
  <!-- 圣衣纹 -->
  <path d="M 104 98 L 108 116 M 116 98 L 112 116" stroke="#D8E4EC" stroke-width="1" opacity="0.7"/>
  <!-- 白羊角（凛然） -->
  <path d="M 102 86 Q 96 78 98 70" stroke="#E8ECF0" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M 122 86 Q 128 78 126 70" stroke="#E8ECF0" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- 腰带 -->
  <path d="M 100 106 L 124 106" stroke="#D8E4EC" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#aries-face" transform="translate(112,84) scale(1)"/>

  <!-- 左臂（交叉，挡攻击） -->
  <path d="M 102 96 C 96 100 94 104 96 110" fill="none" stroke="#E8ECF0" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="96" cy="112" r="3.2" fill="#DCC4A0"/>

  <!-- 右臂（交叉，指尖星光灭绝横扫） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 122 96;3 122 96;-4 122 96" dur="2s" repeatCount="indefinite"/>
    <path d="M 120 96 C 126 94 130 90 132 84" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="133" cy="82" r="3" fill="#DCC4A0"/>
    <!-- 星光灭绝横扫（扇形） -->
    <path d="M 134 82 L 152 66 M 136 84 L 156 76" stroke="#FFF7E0" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="134" cy="82" r="10" fill="url(#star)">
      <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 敌群虚影（右下，被横扫） -->
  <g opacity="0.5">
    <path d="M 160 140 Q 162 130 166 127 Q 170 129 170 140 Z" fill="#2A1E34"/>
    <path d="M 176 142 Q 178 132 182 129 Q 186 131 186 142 Z" fill="#241A2E"/>
  </g>

  <!-- 星屑战尘 -->
  <g fill="#C8E0F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
