<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="摩羯座·修罗·二阶·圣剑初芒·双臂凝剑一剑裂石">
  <defs>
    <!-- 背景：练剑房夜月 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E7E8E"/>
      <stop offset="52%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#4E5E6E"/>
    </linearGradient>
    <!-- 剑芒银 -->
    <radialGradient id="sword" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 夜月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜训练服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E9E"/>
      <stop offset="100%" stop-color="#6E7E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 夜月 -->
  <circle cx="152" cy="48" r="40" fill="url(#moon)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 剑芒 -->
  <circle cx="100" cy="100" r="76" fill="url(#sword)">
    <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 巨石（被一剑裂开） -->
  <g>
    <path d="M 130 110 Q 140 100 152 104 Q 160 110 158 122 Q 152 132 140 132 Q 128 128 130 110 Z" fill="#8E9898" stroke="#6E7878" stroke-width="1.2"/>
    <!-- 裂痕 -->
    <path d="M 142 104 L 138 120 L 140 130" stroke="#5E6868" stroke-width="1.6" fill="none" opacity="0.8"/>
    <!-- 碎石 -->
    <circle cx="148" cy="108" r="2.4" fill="#9AA4A4"/>
    <circle cx="136" cy="114" r="1.8" fill="#9AA4A4"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#4E5E6E" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#5E6E7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜少年（6头身，双臂凝作剑芒） -->
  <!-- 腿 -->
  <path d="M 88 134 L 84 156 L 90 156 L 94 136 Z" fill="#6E7E7E"/>
  <path d="M 104 134 L 112 158 L 106 158 L 100 136 Z" fill="#6E7E7E"/>
  <!-- 训练服 -->
  <path d="M 88 96 Q 84 112 90 132 Q 100 138 108 132 Q 114 112 110 96 Q 100 90 88 96 Z" fill="url(#robe)" stroke="#5E6E6E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 114 L 108 114" stroke="#A8B8B8" stroke-width="1.4"/>

  <!-- 头（少年面容，剑眉，眼含剑光） -->
  <circle cx="98" cy="88" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 短发 -->
  <path d="M 89 82 Q 93 78 98 78 Q 103 78 107 82 Q 103 79 98 79 Q 93 79 89 82 Z" fill="#2E2620"/>
  <!-- 剑眉 -->
  <path d="M 90 83 Q 94 81.5 97 82 M 99 82 Q 102 81.5 106 83" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- 眼含剑光 -->
  <ellipse cx="94" cy="86" rx="2.4" ry="2.2" fill="#1E1008"/>
  <ellipse cx="102" cy="86" rx="2.4" ry="2.2" fill="#1E1008"/>
  <circle cx="95" cy="85.2" r="0.7" fill="#E8F0F8"/>
  <circle cx="103" cy="85.2" r="0.7" fill="#E8F0F8"/>
  <!-- 鼻梁 -->
  <path d="M 98 88.5 L 98 91" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 坚毅 -->
  <path d="M 93 94.5 Q 98 95.8 103 94.5" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 双臂凝作剑芒（圣剑初成） -->
  <!-- 左臂剑芒 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 90 100;3 90 100;-4 90 100" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 90 100 C 84 96 80 92 78 86" fill="none" stroke="#AEB8BE" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 左臂剑芒 -->
    <path d="M 78 86 L 64 66" stroke="#E8F0F8" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="63" cy="65" r="3" fill="#E8F0F8" opacity="0.7">
      <animate attributeName="r" values="3;4.6;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右臂剑芒（挥向巨石） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 106 100;4 106 100;-5 106 100" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 106 100 C 112 96 116 92 118 86" fill="none" stroke="#AEB8BE" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 右臂剑芒（一剑裂石） -->
    <path d="M 118 86 L 140 62" stroke="#E8F0F8" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>
    <circle cx="141" cy="60" r="3.4" fill="#E8F0F8" opacity="0.8">
      <animate attributeName="r" values="3.4;5;3.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 剑光如瀑（剑痕） -->
  <path d="M 140 62 Q 146 54 142 46" stroke="#E8F0F8" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 剑芒星尘 -->
  <g fill="#E8F0F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
