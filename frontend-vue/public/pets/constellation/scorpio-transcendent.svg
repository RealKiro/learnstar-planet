<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天蝎座·米罗·六阶·心宿之刺·猩红星芒护圣域">
  <defs>
    <!-- 背景：天蝎宫顶星河天蝎座 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E3E6E"/>
      <stop offset="52%" stop-color="#2E2E56"/>
      <stop offset="100%" stop-color="#1E1E46"/>
    </linearGradient>
    <!-- 猩红星芒 -->
    <radialGradient id="needle" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#E8624A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8624A" stop-opacity="0"/>
    </radialGradient>
    <!-- 星芒金 -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·天蝎 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：青年面容·剑眉·虎目含光·嘴角含笑 -->
    <g id="scorpio-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 忠义·剑眉 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 天蝎座星象（背景） -->
  <g opacity="0.6">
    <circle cx="40" cy="56" r="1.8" fill="#E8624A"/>
    <circle cx="54" cy="48" r="1.5" fill="#E8624A"/>
    <circle cx="70" cy="46" r="1.6" fill="#E8624A"/>
    <path d="M 40 56 L 54 48 L 70 46" stroke="#E8624A" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 猩红星芒 -->
  <circle cx="100" cy="92" r="84" fill="url(#needle)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="92" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="54" fill="none" stroke="#FFF3C4" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 圣域剪影（下方，被心宿之刺护住） -->
  <g opacity="0.5">
    <path d="M 0 158 Q 30 150 60 156 Q 90 162 120 154 Q 150 148 180 154 L 200 158 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 150 L 40 140 L 52 140 L 52 150" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 心宿星光垂落圣域（护） -->
  <g stroke="#E8624A" stroke-width="1.5" opacity="0.55" stroke-linecap="round">
    <path d="M 60 120 Q 52 136 54 152">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 120 Q 148 136 146 152">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 心宿之刺（指尖一点，贯穿夜空） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 心宿之星（刺尖） -->
    <circle cx="132" cy="60" r="10" fill="url(#star)">
      <animate attributeName="r" values="10;15;10" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="60" r="5" fill="#FFF3C4" opacity="0.95"/>
    <!-- 贯穿夜空针光 -->
    <path d="M 120 70 L 132 60 L 146 48" stroke="#E8624A" stroke-width="2" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 天蝎之心（猩红光） -->
    <path d="M 132 60 L 136 66 L 128 66 Z" fill="#E8624A" opacity="0.8"/>
    <!-- 星芒四射 -->
    <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
      <path d="M 134 50 Q 138 44 144 40">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 140 58 Q 146 54 152 56">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 神圣衣·天蝎圣斗士（指尖引刺，立于宫顶） -->
  <!-- 腿 -->
  <path d="M 88 130 L 84 152 L 90 152 L 94 132 Z" fill="#E8C878"/>
  <path d="M 106 130 L 114 154 L 108 154 L 102 132 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 120 Q 98 128 110 120 Q 114 114 110 106 Q 104 118 96 114 Q 88 118 88 120 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 90 Q 84 104 90 120 Q 100 126 110 120 Q 116 104 112 90 Q 100 84 88 90 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 尾针（左肩后，星芒） -->
  <path d="M 88 92 Q 74 84 68 72" stroke="#FFF0D0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="66" cy="70" r="3.6" fill="#E8624A">
    <animate attributeName="r" values="3.6;5;3.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 圣衣纹 -->
  <path d="M 92 96 L 96 114 M 104 96 L 100 114" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 106 L 112 106" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#scorpio-face" transform="translate(100,82) scale(1)"/>

  <!-- 左臂负背 -->
  <path d="M 90 94 C 84 100 82 106 84 114" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 右手引心宿之刺（指向夜空） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 106 94 C 112 90 116 86 118 80" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="119" cy="78" r="3.2" fill="#D0B090"/>
    <!-- 指尖蓄光 -->
    <circle cx="120" cy="76" r="8" fill="url(#needle)">
      <animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 猩红星尘 -->
  <g fill="#E8624A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
