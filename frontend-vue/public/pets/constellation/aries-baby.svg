<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白羊座·穆·二阶·圣衣修复·星光缝合裂纹">
  <defs>
    <!-- 背景：白羊宫工坊暖光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E8070"/>
      <stop offset="52%" stop-color="#6E6052"/>
      <stop offset="100%" stop-color="#4E4438"/>
    </linearGradient>
    <!-- 工坊暖光 -->
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </radialGradient>
    <!-- 星光缝合 -->
    <radialGradient id="stitch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA0B0"/>
      <stop offset="100%" stop-color="#5E7484"/>
    </linearGradient>
    <!-- 圣衣金 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D8A8"/>
      <stop offset="100%" stop-color="#B8A878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="aries-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 温柔·贤者 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 工坊背景（工具与典籍） -->
  <g opacity="0.5">
    <rect x="18" y="40" width="8" height="70" rx="2" fill="#5E4E3E"/>
    <rect x="32" y="52" width="8" height="58" rx="2" fill="#6E5E4E"/>
    <path d="M 168 40 L 176 40 L 176 110 L 168 110 Z" fill="#5E4E3E"/>
    <!-- 典籍 -->
    <rect x="150" y="52" width="14" height="9" rx="1" fill="#A8906E"/>
    <rect x="150" y="64" width="14" height="9" rx="1" fill="#B8A07E"/>
  </g>

  <!-- 圣衣（工作台上，泛金光） -->
  <g>
    <path d="M 40 130 L 160 130 L 164 140 L 36 140 Z" fill="#5E4E3E"/>
    <path d="M 40 130 L 160 130" stroke="#7E6E5E" stroke-width="1.4" opacity="0.7"/>
    <!-- 圣衣部件（胸甲） -->
    <path d="M 96 96 Q 90 108 98 122 Q 104 126 110 122 Q 118 108 112 96 Q 104 90 96 96 Z" fill="url(#armor)" stroke="#9E8E5E" stroke-width="1.2"/>
    <!-- 裂纹 -->
    <path d="M 100 102 L 106 110 L 102 116" stroke="#6E5E3E" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M 108 100 L 112 106" stroke="#6E5E3E" stroke-width="1" fill="none" opacity="0.7"/>
    <!-- 圣衣泛光 -->
    <circle cx="104" cy="108" r="22" fill="url(#stitch)" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星光缝合（丝线） -->
  <g stroke="#C8E0F8" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <path d="M 100 102 Q 102 106 106 110 Q 104 113 102 116">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 106 100 Q 109 103 112 106">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年（俯身修复，专注） -->
  <!-- 腿 -->
  <path d="M 66 138 L 62 158 L 68 158 L 72 140 Z" fill="#5E7484"/>
  <path d="M 82 138 L 90 162 L 84 162 L 78 140 Z" fill="#5E7484"/>
  <!-- 学徒服 -->
  <!-- 腰带 -->
  <path d="M 66 118 L 84 118" stroke="#A8B8C8" stroke-width="1.4"/>

  <!-- 头（俯身，专注，眼含星光） -->
  <!-- 眉目专注 -->
  <!-- 眼含星光 -->
  <!-- 鼻梁 -->
  <!-- 专注抿唇 -->

  <!-- 左臂持小锤（敲） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 68 106;3 68 106;-4 68 106" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 68 106 C 62 110 58 112 56 118" fill="none" stroke="#7E8E9E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="55" cy="120" r="2.8" fill="#DCC4A0"/>
    <!-- 小锤 -->
    <line x1="55" y1="120" x2="52" y2="128" stroke="#5E4E3E" stroke-width="2" stroke-linecap="round"/>
    <path d="M 48 128 L 56 128 L 55 133 L 49 133 Z" fill="#A8906E"/>
  </g>

  <!-- 右手（扶圣衣） -->
  <path d="M 84 106 C 90 108 94 112 96 116" fill="none" stroke="#7E8E9E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="98" cy="118" r="2.8" fill="#DCC4A0"/>

  <!-- 星光星尘 -->
  <g fill="#C8E0F8">
    <circle cx="120" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="90">
      <animate attributeName="cy" values="90;82;90" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#aries-face" transform="translate(76,94) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 72 85 Q 76 82 80 85 Q 78 80 76 80 Q 74 80 72 85 Z" fill="#2E2620"/>
  <path d="M 67 92 Q 71 87 76 87 Q 81 87 85 92 Q 81 88 76 88 Q 71 88 67 92 Z" fill="#2E2620"/>
</svg>
