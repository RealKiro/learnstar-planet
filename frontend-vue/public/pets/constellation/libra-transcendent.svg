<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天秤座·童虎·六阶·升龙传说·百龙归元护圣域">
  <defs>
    <!-- 背景：五老峰巅天地变色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E6E"/>
      <stop offset="52%" stop-color="#2E3E56"/>
      <stop offset="100%" stop-color="#1E2E46"/>
    </linearGradient>
    <!-- 龙神金 -->
    <radialGradient id="dragon" cx="50%" cy="38%" r="56%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 升龙蓝 -->
    <radialGradient id="water" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9AC8D8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9AC8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·天秤 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容·虎目如龙·含光 -->
    <g id="libra-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 少年·虎目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 龙神光 -->
  <circle cx="100" cy="86" r="84" fill="url(#dragon)">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="86" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="86" r="54" fill="none" stroke="#FFF3C4" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 百龙归元成龙神（冲天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 龙神身形（升天盘旋） -->
    <path d="M 84 70 Q 70 52 78 34 Q 86 20 102 18 Q 118 18 124 32 Q 128 46 118 58 Q 108 68 94 68 Z" fill="#FFE9A8" opacity="0.9" stroke="#D8B64E" stroke-width="1.2"/>
    <!-- 龙神首 -->
    <path d="M 100 16 Q 92 8 98 0 Q 106 -4 112 2 Q 116 10 110 16 Z" fill="#FFF3C4" stroke="#D8B64E" stroke-width="1"/>
    <!-- 龙角 -->
    <path d="M 100 8 L 94 -2 L 102 4 Z" fill="#FFE9A8"/>
    <path d="M 108 8 L 114 -2 L 106 4 Z" fill="#FFE9A8"/>
    <!-- 龙目 -->
    <circle cx="103" cy="6" r="1.6" fill="#8E6A2E"/>
    <!-- 龙须 -->
    <path d="M 94 12 Q 86 16 84 24 M 116 12 Q 124 16 126 24" stroke="#FFE9A8" stroke-width="1.2" opacity="0.8" fill="none"/>
    <!-- 龙神尾光 -->
    <path d="M 84 70 Q 74 78 80 88" stroke="#FFF3C4" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 归元光点（百龙化入） -->
    <g fill="#FFF3C4" opacity="0.7">
      <circle cx="60" cy="50" r="1.8"><animate attributeName="cy" values="50;40;50" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="46" r="1.6"><animate attributeName="cy" values="46;36;46" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="30" r="1.4"><animate attributeName="cy" values="30;20;30" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 圣域与群山（下方，被护） -->
  <g opacity="0.5">
    <path d="M 0 152 Q 40 144 90 150 Q 140 156 200 148 L 200 200 L 0 200 Z" fill="#1E2E46"/>
    <path d="M 40 148 L 40 138 L 52 138 L 52 148 M 120 150 L 120 142 L 132 142 L 132 150" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 龙神护光（垂落） -->
  <g stroke="#FFF3C4" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M 60 110 Q 52 128 54 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 110 Q 148 128 146 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 紫龙（右，看师父升龙） -->
  <g opacity="0.8">
    <circle cx="160" cy="140" r="4" fill="#E0C8A8"/>
    <path d="M 157 137 Q 160 135 163 137 Q 162 139 160 139 Q 158 139 157 137 Z" fill="#2E2620"/>
    <path d="M 158 144 Q 156 152 158 156 Q 162 156 162 144 Z" fill="#7E8E9E"/>
  </g>

  <!-- 神圣衣·天秤圣斗士（一拳轰出，龙气缠身） -->
  <!-- 腿 -->
  <path d="M 90 128 L 86 150 L 92 150 L 96 130 Z" fill="#E8C878"/>
  <path d="M 106 128 L 114 152 L 108 152 L 102 130 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 118 Q 98 126 110 118 Q 114 112 110 104 Q 104 116 96 112 Q 88 116 88 118 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 88 Q 84 102 90 118 Q 100 124 110 118 Q 116 102 112 88 Q 100 82 88 88 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 龙气缠身 -->
  <path d="M 92 94 Q 94 102 92 110" stroke="#FFE9A8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 108 94 Q 106 102 108 110" stroke="#FFE9A8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 104 L 112 104" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#libra-face" transform="translate(100,80) scale(1)"/>

  <!-- 左臂（蓄力，护身前） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 90 92;3 90 92;-4 90 92" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 90 92 C 82 96 78 100 76 106" fill="none" stroke="#FFF0D0" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="75" cy="108" r="3.4" fill="#D0B090"/>
    <!-- 拳上龙气 -->
    <path d="M 75 110 Q 68 114 70 120" stroke="#FFE9A8" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右拳轰天（升龙归元） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 108 92 C 116 88 120 84 122 78" fill="none" stroke="#FFF0D0" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="123" cy="76" r="3.6" fill="#D0B090"/>
    <!-- 拳上升龙 -->
    <circle cx="124" cy="74" r="12" fill="url(#dragon)">
      <animate attributeName="r" values="12;17;12" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 龙金星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
