<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="射手座·艾俄洛斯·六阶·穿云破晓·一箭迎来圣域阳">
  <defs>
    <!-- 背景：夜穹之巅破晓天地 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3A6E"/>
      <stop offset="46%" stop-color="#3E2E5E"/>
      <stop offset="100%" stop-color="#2E1E4E"/>
    </linearGradient>
    <!-- 曙光金 -->
    <radialGradient id="dawn" cx="76%" cy="26%" r="40%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 破晓橙 -->
    <radialGradient id="sunrise" cx="76%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#F5A85E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5A85E" stop-opacity="0"/>
    </radialGradient>
    <!-- 星辉银 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·射手 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <!-- 星辉翼 -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：青年面容·含笑·眼含破晓之光 -->
    <g id="sag-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 仁厚·星目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 曙光破晓（右上，金色曙光冲破黑夜） -->
  <circle cx="156" cy="48" r="54" fill="url(#sunrise)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="156" cy="48" r="14" fill="url(#dawn)" opacity="0.95">
    <animate attributeName="r" values="14;17;14" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 曙光射线 -->
  <g stroke="#FFE066" stroke-width="1.5" opacity="0.7" stroke-linecap="round">
    <path d="M 156 24 L 156 14 M 174 34 L 184 28 M 174 62 L 184 68 M 138 34 L 128 28 M 138 62 L 128 68"/>
  </g>

  <!-- 穿云破晓之箭（一箭破黑夜） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 箭身（金色，穿云） -->
    <line x1="116" y1="100" x2="150" y2="56" stroke="#FFE066" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 箭头 -->
    <path d="M 152 54 L 162 46 L 155 58 Z" fill="#FFE066"/>
    <!-- 箭羽 -->
    <path d="M 120 96 L 114 92 L 118 100 Z" fill="#FFF0C0"/>
    <!-- 破云裂空 -->
    <path d="M 150 56 Q 156 48 154 40" stroke="#FFE066" stroke-width="2" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 曙光迸射（箭落处，黑夜破） -->
    <circle cx="158" cy="46" r="12" fill="url(#dawn)">
      <animate attributeName="r" values="12;18;12" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星辉翼（身后展开） -->
  <g fill="url(#wing)" stroke="#E8F0FA" stroke-width="0.8" opacity="0.85">
    <path d="M 72 68 Q 42 40 24 44 Q 40 64 74 78 Z"/>
    <path d="M 74 82 Q 38 72 22 80 Q 42 92 76 90 Z"/>
    <path d="M 128 68 Q 158 40 176 44 Q 160 64 126 78 Z"/>
    <path d="M 126 82 Q 162 72 178 80 Q 158 92 124 90 Z"/>
  </g>

  <!-- 圣域剪影（下方，被破晓曙光护住） -->
  <g opacity="0.5">
    <path d="M 0 158 Q 40 150 90 156 Q 140 162 200 154 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 150 L 40 140 L 52 140 L 52 150 M 120 152 L 120 144 L 132 144 L 132 152" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 曙光遍洒圣域 -->
  <g stroke="#FFE066" stroke-width="1.5" opacity="0.55" stroke-linecap="round">
    <path d="M 100 130 Q 92 142 94 152">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 134 Q 54 144 56 152">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 神圣衣·射手圣斗士（张弓搭箭，夜穹之巅） -->
  <!-- 腿 -->
  <path d="M 90 128 L 86 150 L 92 150 L 96 130 Z" fill="#E8C878"/>
  <path d="M 106 128 L 114 152 L 108 152 L 102 130 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 118 Q 98 126 110 118 Q 114 112 110 104 Q 104 116 96 112 Q 88 116 88 118 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 88 Q 84 102 90 118 Q 100 124 110 118 Q 116 102 112 88 Q 100 82 88 88 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 圣衣纹 -->
  <path d="M 92 94 L 96 112 M 104 94 L 100 112" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 104 L 112 104" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#sag-face" transform="translate(100,80) scale(1)"/>

  <!-- 左臂（持弓前伸） -->
  <path d="M 90 92 C 84 94 80 96 78 100" fill="none" stroke="#FFF0D0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="102" r="3.2" fill="#DCC8A8"/>

  <!-- 黄金之弓 -->
  <path d="M 64 72 Q 74 92 68 112 Q 82 100 90 92 Q 80 92 68 104" fill="none" stroke="#FFE066" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="64" y1="72" x2="90" y2="92" stroke="#E8F0FA" stroke-width="1.2"/>

  <!-- 右手（拉满弦，放矢） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 106 92 C 112 94 116 96 118 100" fill="none" stroke="#FFF0D0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="102" r="3.2" fill="#DCC8A8"/>
  </g>

  <!-- 曙光星尘 -->
  <g fill="#FFE066">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFE066" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
