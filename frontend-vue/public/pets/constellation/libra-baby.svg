<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天秤座·童虎·二阶·返老还童·少年之身藏千秋">
  <defs>
    <!-- 背景：庐山之巅山川千年 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9086"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 时光金 -->
    <radialGradient id="time" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 时光金晕 -->
  <circle cx="100" cy="92" r="80" fill="url(#time)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 时光流转虚影（老/少/老，环绕） -->
  <g opacity="0.4">
    <!-- 老影（左） -->
    <path d="M 30 100 Q 31 90 35 87 Q 39 89 39 100 Z" fill="#8E9EA0"/>
    <circle cx="36" cy="85" r="4" fill="#D8C8A8"/>
    <!-- 少影（右） -->
    <path d="M 164 96 Q 165 86 169 83 Q 173 85 173 96 Z" fill="#9EAEA0"/>
    <circle cx="170" cy="81" r="4" fill="#E0CCB0"/>
    <!-- 时光线 -->
    <path d="M 40 96 Q 100 70 160 92" stroke="#FFF3C4" stroke-width="1.2" opacity="0.6" fill="none">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 40 104 Q 100 116 160 100" stroke="#FFF3C4" stroke-width="1.2" opacity="0.6" fill="none">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 远山 -->
  <path d="M 0 140 Q 40 122 90 132 Q 140 140 200 128 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#5E7268" opacity="0.7"/>

  <!-- 青铜少年（5头身，少年身形含沧桑，负手而立） -->
  <!-- 腿 -->
  <path d="M 90 136 L 86 158 L 92 158 L 96 138 Z" fill="#9EAEA0"/>
  <path d="M 106 136 L 114 160 L 108 160 L 102 138 Z" fill="#9EAEA0"/>
  <!-- 青铜圣衣 -->
  <path d="M 88 100 Q 84 116 90 136 Q 100 142 108 136 Q 114 116 110 100 Q 100 94 88 100 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 116 L 110 116" stroke="#E8F0E8" stroke-width="1.4"/>

  <!-- 头（少年面容，眼神却苍老深沉） -->
  <circle cx="99" cy="92" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 短发 -->
  <path d="M 90 86 Q 94 82 99 82 Q 104 82 108 86 Q 104 83 99 83 Q 94 83 90 86 Z" fill="#2E2620"/>
  <!-- 浓眉 -->
  <path d="M 91 87 Q 95 85.5 98 86 M 101 86 Q 104 85.5 107 87" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 眼（苍老深沉） -->
  <ellipse cx="95" cy="90" rx="2.4" ry="2.2" fill="#1E1008"/>
  <ellipse cx="103" cy="90" rx="2.4" ry="2.2" fill="#1E1008"/>
  <circle cx="96" cy="89.2" r="0.6" fill="#FFF3C4"/>
  <circle cx="104" cy="89.2" r="0.6" fill="#FFF3C4"/>
  <!-- 鼻梁 -->
  <path d="M 99 92.5 L 99 95" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 含沧桑 -->
  <path d="M 94 98.5 Q 99 100 104 98.5" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 左臂负背 -->
  <path d="M 90 104 C 84 108 82 114 84 120" fill="none" stroke="#B8C4B8" stroke-width="4" stroke-linecap="round"/>

  <!-- 右臂负背 -->
  <path d="M 108 104 C 114 108 116 114 114 120" fill="none" stroke="#B8C4B8" stroke-width="4" stroke-linecap="round"/>

  <!-- 秘法光（身周，时光金环） -->
  <g stroke="#FFF3C4" stroke-width="1.2" opacity="0.5" fill="none">
    <circle cx="99" cy="104" r="14">
      <animate attributeName="r" values="14;19;14" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="99" cy="104" r="20">
      <animate attributeName="r" values="20;25;20" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 时光金尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
