<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="水瓶座·卡妙·四阶·为弟子凝冰·以身凝冰护弟子">
  <defs>
    <!-- 背景：冰原圣战风雪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E9EB0"/>
      <stop offset="52%" stop-color="#6E8EA0"/>
      <stop offset="100%" stop-color="#5E7E90"/>
    </linearGradient>
    <!-- 冰晶蓝 -->
    <radialGradient id="ice" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 血绛 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#B8432E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8432E" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银水瓶圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：青年面容·凤目温柔·嘴角含笑 -->
    <g id="aquarius-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 清冷·凤目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 血绛 -->
  <circle cx="156" cy="52" r="52" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 冰晶 -->
  <circle cx="100" cy="96" r="72" fill="url(#ice)">
    <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 风雪 -->
  <g fill="#E8F4FA" opacity="0.7">
    <circle cx="40" cy="40" r="1.4"><animate attributeName="cy" values="40;56;40" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="30" r="1.2"><animate attributeName="cy" values="30;46;30" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 来袭剑影（左上，被以身挡住） -->
  <path d="M 50 30 L 78 62" stroke="#C8CCD4" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 78 62 L 82 68" stroke="#C8CCD4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- 挡下迸溅 -->
  <g fill="#C8E8F8" opacity="0.6">
    <circle cx="84" cy="66" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="76" r="1.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 弟子（右，被推向生路） -->
  <g opacity="0.9">
    <path d="M 148 138 L 146 126 L 151 123 L 156 126 L 156 138 Z" fill="#7E8E9E"/>
    <circle cx="151" cy="120" r="4.5" fill="#E0C8A8"/>
    <path d="M 148 117 Q 151 115 154 117 Q 153 119 151 119 Q 149 119 148 117 Z" fill="#2E2620"/>
    <!-- 被推向远方 -->
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <!-- 地面（冰原） -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#5E7E90" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#7E9EB0" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银水瓶圣斗士（以身凝冰，冰封自身） -->
  <!-- 腿 -->
  <path d="M 92 134 L 88 156 L 94 156 L 98 136 Z" fill="#B8C4D0"/>
  <path d="M 108 134 L 116 158 L 110 158 L 104 136 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 124 Q 102 132 114 124 Q 118 118 114 110 Q 108 122 100 118 Q 92 122 92 124 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 94 Q 88 108 94 124 Q 104 130 114 124 Q 120 108 116 94 Q 104 88 92 94 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 凝霜（冰封自身） -->
  <g stroke="#C8E8F8" stroke-width="1.2" opacity="0.7" stroke-linecap="round">
    <path d="M 96 100 L 100 106 M 98 108 L 102 114 M 110 104 L 114 110"/>
  </g>
  <!-- 染血痕 -->
  <path d="M 104 108 Q 106 114 104 120" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 水瓶纹 -->
  <path d="M 96 100 L 100 118 M 110 100 L 106 118" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 110 L 116 110" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#aquarius-face" transform="translate(104,86) scale(1)"/>

  <!-- 左臂（凝冰，护身前挡剑） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 94 98;2 94 98;-3 94 98" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 94 98 C 86 94 82 90 80 84" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 左臂凝冰 -->
    <path d="M 80 84 L 74 72" stroke="#C8E8F8" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 右臂（推向弟子，生路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 114 98 C 120 100 126 102 130 106" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="132" cy="108" r="3.2" fill="#DCC8A8"/>
    <!-- 推往生路之光 -->
    <path d="M 132 108 Q 142 106 148 104" stroke="#C8E8F8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 冰晶星尘 -->
  <g fill="#C8E8F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
