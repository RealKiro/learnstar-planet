<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="摩羯座·修罗·三阶·圣剑裂空·一剑劈开万山峰">
  <defs>
    <!-- 背景：山壁前群山 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9086"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 剑虹银 -->
    <radialGradient id="sword" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜摩羯圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容·剑眉·眼含剑意（脸中心 0,0） -->
    <g id="capricorn-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 剑士·锐利 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 剑虹 -->
  <circle cx="100" cy="96" r="82" fill="url(#sword)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 山壁（右侧，被一剑劈开） -->
  <g>
    <path d="M 140 40 Q 130 90 138 140 L 148 170 L 160 170 Q 156 120 162 80 Q 166 60 162 40 Z" fill="#7E8E80" stroke="#6E7E70" stroke-width="1.2"/>
    <!-- 裂痕（剑劈开） -->
    <path d="M 148 44 L 144 90 L 148 138 L 152 168" stroke="#9AA8A0" stroke-width="2" fill="none" opacity="0.9"/>
    <!-- 崩裂碎石 -->
    <circle cx="140" cy="70" r="2.6" fill="#8E9E90"/>
    <circle cx="154" cy="96" r="2" fill="#8E9E90"/>
    <circle cx="144" cy="120" r="2.2" fill="#8E9E90"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#5E7268" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#7E9086" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜摩羯圣斗士（6头身，圣剑裂空） -->
  <!-- 腿 -->
  <path d="M 84 132 L 80 154 L 86 154 L 90 134 Z" fill="#9EAEA0"/>
  <path d="M 100 132 L 108 156 L 102 156 L 96 134 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 84 122 Q 94 130 106 122 Q 110 116 106 108 Q 100 120 92 116 Q 84 120 84 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 84 92 Q 80 106 86 122 Q 96 128 106 122 Q 112 106 108 92 Q 96 86 84 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 摩羯纹 -->
  <path d="M 88 98 L 92 116 M 102 98 L 98 116" stroke="#E8F0E8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 84 108 L 108 108" stroke="#E8F0E8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#capricorn-face" transform="translate(96,84) scale(1)"/>

  <!-- 左臂（护身，剑势） -->
  <path d="M 86 96 C 80 100 78 106 80 114" fill="none" stroke="#C8D0C8" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="80" cy="116" r="3.2" fill="#D0B090"/>

  <!-- 右臂（圣剑裂空，劈向山壁） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 104 96;4 104 96;-6 104 96" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 102 96 C 108 92 114 88 120 84" fill="none" stroke="#C8D0C8" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 右臂剑芒（圣剑） -->
    <path d="M 120 84 L 148 50" stroke="#E8F0F8" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>
    <circle cx="149" cy="49" r="4" fill="#E8F0F8" opacity="0.8">
      <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 剑虹 -->
    <path d="M 148 50 Q 154 42 150 34" stroke="#E8F0F8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 剑光如虹 -->
  <g stroke="#E8F0F8" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <path d="M 122 92 Q 130 86 134 78">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 124 96 Q 132 90 136 82">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 剑芒星尘 -->
  <g fill="#E8F0F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
