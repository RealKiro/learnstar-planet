<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天秤座·童虎·四阶·上代圣战·百龙齐出血战苍穹">
  <defs>
    <!-- 背景：庐山顶战火残云 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E3A3E"/>
      <stop offset="52%" stop-color="#462A2E"/>
      <stop offset="100%" stop-color="#321E22"/>
    </linearGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 百龙金 -->
    <radialGradient id="dragon" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银天秤圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容染血·虎目不屈 -->
    <g id="libra-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 少年·虎目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 战火 -->
  <circle cx="156" cy="52" r="52" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 百龙 -->
  <circle cx="100" cy="80" r="76" fill="url(#dragon)">
    <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 百龙齐出（多条龙影，漫天生光） -->
  <g opacity="0.7">
    <!-- 龙影群 -->
    <g fill="#FFF3C4">
      <path d="M 60 70 Q 52 58 58 48 Q 66 44 72 50 Q 74 58 68 64 Z" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 130 60 Q 138 48 132 38 Q 124 34 118 40 Q 116 48 122 54 Z" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -4;0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 96 56 Q 90 44 96 34 Q 104 30 110 36 Q 112 44 106 50 Z" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 龙影连线（百龙） -->
    <g stroke="#FFF3C4" stroke-width="1" opacity="0.5">
      <path d="M 60 70 Q 80 60 96 56"/>
      <path d="M 96 56 Q 112 56 130 60"/>
    </g>
  </g>

  <!-- 敌群虚影（四周） -->
  <g opacity="0.4">
    <path d="M 30 100 Q 32 90 36 87 Q 40 89 40 100 Z" fill="#241A2E"/>
    <path d="M 160 110 Q 162 100 166 97 Q 170 99 170 110 Z" fill="#241A2E"/>
    <path d="M 120 140 Q 122 132 125 130 Q 128 132 128 140 Z" fill="#201628"/>
  </g>

  <!-- 圣域方向曙光（左下） -->
  <path d="M 20 130 Q 30 122 40 128" stroke="#E8B64C" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#321E22" opacity="0.8"/>

  <!-- 白银天秤圣斗士（立山顶，浴血，百龙护身） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#B8C4D0"/>
  <path d="M 108 132 L 116 156 L 110 156 L 104 134 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 122 Q 102 130 114 122 Q 118 116 114 108 Q 108 120 100 116 Q 92 120 92 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 92 Q 88 106 94 122 Q 104 128 114 122 Q 120 106 116 92 Q 104 86 92 92 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 染血痕 -->
  <path d="M 96 100 Q 98 106 96 112" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 110 104 Q 112 110 110 116" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 天秤纹 -->
  <path d="M 96 98 L 100 116 M 110 98 L 106 116" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 108 L 116 108" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#libra-face" transform="translate(104,84) scale(1)"/>

  <!-- 左臂（百龙出，护身前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 94 96 C 88 100 86 104 86 110" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="85" cy="112" r="3.2" fill="#D0B090"/>
  </g>

  <!-- 右拳（百龙齐出） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 112 96 C 118 92 122 88 124 82" fill="none" stroke="#E8ECF0" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="125" cy="80" r="3.6" fill="#D0B090"/>
    <!-- 拳上百龙 -->
    <circle cx="126" cy="78" r="12" fill="url(#dragon)">
      <animate attributeName="r" values="12;17;12" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 重伤沉眠（眼睑微垂的倦意，化为光点） -->
  <g fill="#FFF3C4">
    <circle cx="104" cy="116" r="2">
      <animate attributeName="cy" values="116;108;116" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="110" r="1.6">
      <animate attributeName="cy" values="110;102;110" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 百龙星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
