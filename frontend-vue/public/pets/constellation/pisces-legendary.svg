<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双鱼座·阿布罗狄·五阶·双鱼宫主·黄金双鱼满宫玫瑰">
  <defs>
    <!-- 背景：双鱼宫大殿金色殿堂 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B878"/>
      <stop offset="52%" stop-color="#B8965E"/>
      <stop offset="100%" stop-color="#8E7850"/>
    </linearGradient>
    <!-- 玫瑰金红 -->
    <radialGradient id="rose" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E8809E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8809E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黄金双鱼圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D8B64E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：绝美面容·细眉·桃花眼含笑 -->
    <g id="pisces-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 绝美·桃花眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1 Q -4.5 0.2 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.4 1.8 -0.4 L 1.8 1 Q 4.5 0.2 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.5" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 玫瑰金红 -->
  <circle cx="100" cy="94" r="80" fill="url(#rose)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="94" r="62" fill="none" stroke="#FFE9A8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="94" r="54" fill="none" stroke="#FFE9A8" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 双鱼宫星象（背景） -->
  <g opacity="0.5">
    <g fill="#FFF0C0">
      <circle cx="40" cy="70" r="1.8"/>
      <circle cx="52" cy="60" r="1.4"/>
      <circle cx="66" cy="66" r="1.6"/>
    </g>
    <path d="M 40 70 L 52 60 L 66 66" stroke="#FFF0C0" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 满宫玫瑰（四周盛开） -->
  <g>
    <circle cx="30" cy="110" r="6" fill="#E8809E"/>
    <circle cx="28" cy="107" r="4" fill="#F0A0B8"/>
    <circle cx="32" cy="107" r="4" fill="#F0A0B8"/>
    <path d="M 30 116 Q 28 124 32 132" stroke="#5E8E5E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="170" cy="112" r="6" fill="#E8809E"/>
    <circle cx="168" cy="109" r="4" fill="#F0A0B8"/>
    <circle cx="172" cy="109" r="4" fill="#F0A0B8"/>
    <path d="M 170 118 Q 172 126 168 134" stroke="#5E8E5E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="140" r="5" fill="#E8809E" opacity="0.8"/>
    <circle cx="150" cy="142" r="5" fill="#E8809E" opacity="0.8"/>
  </g>

  <!-- 金色殿堂柱 -->
  <g opacity="0.4">
    <path d="M 18 0 L 26 0 L 26 200 L 18 200 Z" fill="#B8965E"/>
    <path d="M 174 0 L 182 0 L 182 200 L 174 200 Z" fill="#B8965E"/>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.6">
    <path d="M 0 150 Q 50 142 100 148 Q 150 154 200 146 L 200 200 L 0 200 Z" fill="#C8AC84">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 黄金双鱼圣斗士（端坐，金色藤蔓绕身） -->
  <!-- 腿（盘坐） -->
  <path d="M 88 136 Q 94 144 106 140 Q 110 136 108 130 Q 100 140 92 134 Z" fill="#D8B64E"/>
  <!-- 圣衣（下摆） -->
  <path d="M 88 126 Q 98 134 110 126 Q 114 120 110 112 Q 104 124 96 120 Q 88 124 88 126 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 94 Q 84 108 90 126 Q 100 132 110 126 Q 116 108 112 94 Q 100 88 88 94 Z" fill="url(#armor)" stroke="#B8964E" stroke-width="1.2"/>
  <!-- 金色藤蔓绕身 -->
  <path d="M 86 96 Q 82 106 86 116 Q 90 124 86 132" stroke="#FFE066" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="85" cy="106" r="2.6" fill="#E8809E"/>
  <circle cx="86" cy="124" r="2.6" fill="#E8809E"/>
  <!-- 双鱼纹 -->
  <path d="M 92 100 L 96 118 M 104 100 L 100 118" stroke="#FFF0C0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#FFF0C0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#pisces-face" transform="translate(100,86) scale(1)"/>

  <!-- 左臂抚膝 -->
  <path d="M 90 98 C 84 102 82 108 84 116" fill="none" stroke="#FFE9A8" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="84" cy="118" r="3.2" fill="#E2C8A8"/>

  <!-- 右手（捻金玫） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 108 98 C 114 96 118 92 120 86" fill="none" stroke="#FFE9A8" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="121" cy="84" r="3.2" fill="#E2C8A8"/>
    <!-- 指尖金玫 -->
    <circle cx="123" cy="80" r="7" fill="#E8809E" stroke="#C85068" stroke-width="1">
      <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M 121 78 Q 123 75 125 78 Q 123 80 121 78 Z" fill="#F0A0B8"/>
  </g>

  <!-- 玫瑰星尘 -->
  <g fill="#E8809E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFE9A8" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
