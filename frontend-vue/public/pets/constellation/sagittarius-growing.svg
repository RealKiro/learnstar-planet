<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="射手座·艾俄洛斯·三阶·正义之矢·仁心化箭破黑暗">
  <defs>
    <!-- 背景：圣域演武场夜穹 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E7E"/>
      <stop offset="52%" stop-color="#2E3E66"/>
      <stop offset="100%" stop-color="#1E2E4E"/>
    </linearGradient>
    <!-- 正义金光 -->
    <radialGradient id="arrow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜射手圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：少年面容·眉目温厚·眼含正义 -->
    <g id="sag-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 仁厚·星目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 正义金光 -->
  <circle cx="100" cy="90" r="84" fill="url(#arrow)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="20" r="1.1"/>
    <circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 黑暗（下方，被正义之矢划开） -->
  <g opacity="0.5">
    <path d="M 0 150 Q 40 142 90 148 Q 140 154 200 146 L 200 200 L 0 200 Z" fill="#141E3E"/>
    <!-- 黑暗散 -->
    <path d="M 60 130 Q 56 140 62 146 M 140 132 Q 144 142 138 148" stroke="#141E3E" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 正义之矢划开黑暗的光痕 -->
  <path d="M 130 70 Q 120 100 116 130" stroke="#FFF3C4" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 正义之矢（破空） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="2.4s" repeatCount="indefinite"/>
    <line x1="118" y1="98" x2="148" y2="56" stroke="#FFF3C4" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 150 54 L 158 48 L 152 58 Z" fill="#FFF3C4"/>
    <path d="M 122 94 L 116 90 L 120 98 Z" fill="#E8C878"/>
    <circle cx="140" cy="64" r="10" fill="url(#arrow)">
      <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#22304A" opacity="0.8"/>

  <!-- 青铜射手圣斗士（6头身，一箭正义之矢） -->
  <!-- 腿 -->
  <path d="M 90 132 L 86 154 L 92 154 L 96 134 Z" fill="#9EAEA0"/>
  <path d="M 106 132 L 114 156 L 108 156 L 102 134 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 90 122 Q 100 130 112 122 Q 116 116 112 108 Q 106 120 98 116 Q 90 120 90 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 90 92 Q 86 106 92 122 Q 102 128 112 122 Q 118 106 114 92 Q 102 86 90 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 射手纹 -->
  <path d="M 94 98 L 98 116 M 108 98 L 104 116" stroke="#E8F0E8" stroke-width="1.2" opacity="0.7"/>
  <!-- 黄金弓（背） -->
  <path d="M 88 96 Q 78 108 80 124" stroke="#E8C878" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- 腰带 -->
  <path d="M 90 108 L 114 108" stroke="#E8F0E8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#sag-face" transform="translate(102,84) scale(1)"/>

  <!-- 左臂（执弓前伸） -->
  <path d="M 92 96 C 86 98 82 100 80 104" fill="none" stroke="#C8D0C8" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="78" cy="106" r="3" fill="#DCC8A8"/>

  <!-- 黄金之弓（左手） -->
  <path d="M 66 76 Q 76 96 70 116 Q 84 104 92 96 Q 82 96 70 108" fill="none" stroke="#E8C878" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="66" y1="76" x2="92" y2="96" stroke="#C8B098" stroke-width="1.2"/>

  <!-- 右手（拉弦放矢，正义之矢出） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 110 96 C 116 98 120 100 122 104" fill="none" stroke="#C8D0C8" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="124" cy="106" r="3" fill="#DCC8A8"/>
  </g>

  <!-- 正义星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
