<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="水瓶座·卡妙·一阶·绝对零度的冷静·指尖凝冰静看纹">
  <defs>
    <!-- 背景：水瓶宫水畔清冷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8B0"/>
      <stop offset="52%" stop-color="#7E8E98"/>
      <stop offset="100%" stop-color="#5E6E7A"/>
    </linearGradient>
    <!-- 冰晶蓝 -->
    <radialGradient id="ice" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 水光白 -->
    <radialGradient id="water" cx="50%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#E8F4FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8F4FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA0B0"/>
      <stop offset="100%" stop-color="#5E7484"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="aquarius-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 清冷·凤目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冰晶 -->
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 清冷宫阙 -->
  <g opacity="0.4">
    <path d="M 20 20 L 72 20 L 62 34 Q 40 42 28 38 Z" fill="#5E6E7A"/>
    <path d="M 20 20 L 72 20" stroke="#7E8E98" stroke-width="1.2"/>
  </g>

  <!-- 水畔 -->
  <path d="M 0 150 Q 40 142 90 148 Q 140 154 200 146 L 200 200 L 0 200 Z" fill="#6E8E9E" opacity="0.6"/>
  <path d="M 20 160 Q 60 152 100 158 Q 140 164 180 156" stroke="#9AC8D8" stroke-width="1.4" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#5E6E7A" opacity="0.7"/>

  <!-- 青铜学徒少年（5头身，清冷） -->
  <!-- 腿 -->
  <path d="M 88 136 L 84 158 L 90 158 L 94 138 Z" fill="#5E7484"/>
  <path d="M 104 136 L 112 160 L 106 160 L 100 138 Z" fill="#5E7484"/>
  <!-- 青铜学徒服 -->
  <!-- 腰带 -->
  <path d="M 88 118 L 110 118" stroke="#A8B8C8" stroke-width="1.6"/>

  <!-- 头（少年面容，剑眉凤目清冷） -->
  <!-- 剑眉 -->
  <!-- 凤目清冷 -->
  <!-- 鼻梁 -->
  <!-- 唇线薄而静 -->

  <!-- 左臂垂持 -->
  <path d="M 90 106 C 84 110 82 114 84 120" fill="none" stroke="#7E8E9E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="84" cy="122" r="2.8" fill="#DCC8A8"/>

  <!-- 右手（指尖凝出冰晶，静看） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 106 106 C 112 104 114 100 114 96" fill="none" stroke="#7E8E9E" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="115" cy="94" r="2.8" fill="#DCC8A8"/>
    <!-- 指尖冰晶 -->
    <path d="M 115 92 L 117 84 L 119 92 Z" fill="#C8E8F8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 冰晶光 -->
    <circle cx="116" cy="90" r="7" fill="url(#ice)">
      <animate attributeName="r" values="7;10;7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 冰晶星尘 -->
  <g fill="#C8E8F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#aquarius-face" transform="translate(99,94) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 90 88 Q 94 84 99 84 Q 104 84 108 88 Q 104 85 99 85 Q 94 85 90 88 Z" fill="#2E2620"/>
</svg>
