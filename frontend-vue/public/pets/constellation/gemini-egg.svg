<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双子座·撒加·一阶·善恶双生·月下暗影潜伏">
  <defs>
    <!-- 背景：圣域夜空双子宫 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E7E"/>
      <stop offset="52%" stop-color="#2E3E66"/>
      <stop offset="100%" stop-color="#1E2E4E"/>
    </linearGradient>
    <!-- 月光银 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="32%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 暗影紫 -->
    <radialGradient id="shadow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6E4E8E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6E4E8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA0B0"/>
      <stop offset="100%" stop-color="#5E7484"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="48" r="44" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="11" fill="#E8F0FA" opacity="0.9"/>

  <!-- 双子宫（背景） -->
  <g opacity="0.4">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#3E4E7E"/>
    <path d="M 20 20 L 64 20" stroke="#5E6E8E" stroke-width="1.2"/>
    <path d="M 32 36 L 32 80 M 52 36 L 52 80" stroke="#3E4E7E" stroke-width="1.4"/>
  </g>

  <!-- 暗影（月下，影子长出另一张面孔） -->
  <g opacity="0.65">
    <circle cx="100" cy="150" r="50" fill="url(#shadow)">
      <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 影子（拉长，另一张面孔） -->
    <path d="M 84 140 Q 78 148 82 156 Q 88 162 98 156 Q 106 150 104 142 Q 98 138 84 140 Z" fill="#2A1E3E"/>
    <!-- 影面孔（阴笑） -->
    <circle cx="91" cy="146" r="4" fill="#2A1E3E"/>
    <path d="M 87 144 Q 89 142.5 91 143 M 93 143 Q 95 142.5 97 144" stroke="#5E4E8E" stroke-width="1" fill="none"/>
    <path d="M 89 149 Q 92 151 95 149" stroke="#5E4E8E" stroke-width="1" fill="none"/>
    <!-- 影之手（伸向少年） -->
    <path d="M 100 154 Q 106 156 110 152" stroke="#2A1E3E" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 圣域地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#22304A" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3A4A62" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜学徒少年（立于宫前，俊美，眼神幽深） -->
  <!-- 腿 -->
  <path d="M 90 136 L 86 158 L 92 158 L 96 138 Z" fill="#5E7484"/>
  <path d="M 106 136 L 114 160 L 108 160 L 102 138 Z" fill="#5E7484"/>
  <!-- 青铜学徒服 -->
  <path d="M 88 102 Q 84 118 90 136 Q 100 142 108 136 Q 114 118 110 102 Q 100 96 88 102 Z" fill="url(#robe)" stroke="#4E5E6E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 118 L 110 118" stroke="#A8B8C8" stroke-width="1.6"/>

  <!-- 头（俊美面容，束发，眼神幽深） -->
  <circle cx="99" cy="94" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 束发（长发） -->
  <path d="M 95 85 Q 99 82 103 85 Q 101 80 99 80 Q 97 80 95 85 Z" fill="#2E2620"/>
  <!-- 额发 -->
  <path d="M 90 92 Q 94 87 99 87 Q 104 87 108 92 Q 104 88 99 88 Q 94 88 90 92 Z" fill="#2E2620"/>
  <!-- 眉目温柔 -->
  <path d="M 91 92 Q 95 90.5 98 91 M 100 91 Q 103 90.5 107 92" stroke="#1E1008" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- 眼含仁善（偶现幽深） -->
  <ellipse cx="95" cy="94.6" rx="2.2" ry="2" fill="#1E1008"/>
  <ellipse cx="103" cy="94.6" rx="2.2" ry="2" fill="#1E1008"/>
  <circle cx="96" cy="93.8" r="0.7" fill="#FFF"/>
  <circle cx="104" cy="93.8" r="0.7" fill="#FFF"/>
  <circle cx="95" cy="94.6" r="0.5" fill="#6E4E8E" opacity="0.6"/>
  <!-- 鼻梁 -->
  <path d="M 99 96.5 L 99 98.5" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 温和 -->
  <path d="M 95 102 Q 99 103.8 103 102" fill="none" stroke="#8E5A3E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂垂持 -->
  <path d="M 90 106 C 84 110 82 114 84 120" fill="none" stroke="#7E8E9E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="84" cy="122" r="2.8" fill="#DCC4A0"/>

  <!-- 右手（抬起，压下暗影/捧善念光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 108 106 C 114 108 116 112 116 118" fill="none" stroke="#7E8E9E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="116" cy="120" r="2.8" fill="#DCC4A0"/>
  </g>

  <!-- 善念微光（胸口一点） -->
  <circle cx="99" cy="112" r="6" fill="#E8F0FA" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星尘 -->
  <g fill="#E8F0FA">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
