<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金牛座·阿鲁迪巴·一阶·大地之重·扛巨石憨笑">
  <defs>
    <!-- 背景：金牛宫外旷野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8A890"/>
      <stop offset="52%" stop-color="#8E9070"/>
      <stop offset="100%" stop-color="#6E7248"/>
    </linearGradient>
    <!-- 天光金 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E8E"/>
      <stop offset="100%" stop-color="#6E7E6E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>

  <!-- 远山大地 -->
  <path d="M 0 130 Q 40 108 90 118 Q 140 126 200 112 L 200 200 L 0 200 Z" fill="#7E8258" opacity="0.6"/>
  <path d="M 0 152 Q 60 138 120 146 Q 170 152 200 142 L 200 200 L 0 200 Z" fill="#6E7248" opacity="0.7"/>

  <!-- 尘土（扛石行走） -->
  <g fill="#A89060" opacity="0.6">
    <circle cx="60" cy="156" r="4">
      <animate attributeName="cy" values="156;148;156" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="164" r="3">
      <animate attributeName="cy" values="164;156;164" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 魁梧少年（6头身，扛巨石，憨笑回头） -->
  <!-- 腿（粗壮） -->
  <path d="M 92 134 L 88 158 L 95 158 L 100 136 Z" fill="#6E7E6E"/>
  <path d="M 108 134 L 116 160 L 109 160 L 102 136 Z" fill="#6E7E6E"/>
  <!-- 青铜学徒服（魁梧） -->
  <path d="M 90 96 Q 84 114 92 136 Q 102 144 112 136 Q 118 114 114 96 Q 102 88 90 96 Z" fill="url(#robe)" stroke="#5E6E5E" stroke-width="1.2"/>
  <!-- 腰带 -->
  <path d="M 90 116 L 114 116" stroke="#A8B8A8" stroke-width="1.8"/>
  <!-- 宽肩 -->
  <path d="M 86 94 Q 90 90 102 90 Q 114 90 118 94 L 116 100 L 88 100 Z" fill="#7E8E7E"/>

  <!-- 头（圆脸憨厚，粗眉大眼豪迈） -->
  <circle cx="103" cy="86" r="10.5" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
  <!-- 短发 -->
  <path d="M 94 80 Q 98 76 103 76 Q 108 76 112 80 Q 108 77 103 77 Q 98 77 94 80 Z" fill="#2E2620"/>
  <!-- 粗眉 -->
  <path d="M 95 84 Q 99 82.5 102 83 M 105 83 Q 108 82.5 111 84" stroke="#2E1A10" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 大眼豪迈 -->
  <circle cx="99" cy="87" r="2.6" fill="#1E1008"/>
  <circle cx="107" cy="87" r="2.6" fill="#1E1008"/>
  <circle cx="100" cy="86.2" r="0.8" fill="#FFF"/>
  <circle cx="108" cy="86.2" r="0.8" fill="#FFF"/>
  <!-- 鼻梁宽 -->
  <circle cx="103" cy="90" r="2" fill="#C8A880"/>
  <!-- 咧嘴憨笑 -->
  <path d="M 97 94.5 Q 103 97.6 109 94.5" fill="none" stroke="#8E5A3E" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 扛巨石（右肩） -->
  <g>
    <path d="M 122 82 Q 132 74 146 76 Q 156 78 158 86 Q 158 94 146 94 Q 132 94 124 88 Z" fill="#8A8258" stroke="#6E6A44" stroke-width="1.4"/>
    <path d="M 128 80 L 152 84 M 126 88 L 154 90" stroke="#6E6A44" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- 右臂托石 -->
  <path d="M 112 98 C 118 96 122 94 124 90" fill="none" stroke="#7E8E7E" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="126" cy="89" r="3.4" fill="#D0B090"/>

  <!-- 左臂摆动（行走） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 92 100;4 92 100;-6 92 100" dur="2s" repeatCount="indefinite"/>
    <path d="M 92 100 C 86 104 82 108 80 114" fill="none" stroke="#7E8E7E" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="79" cy="116" r="3.2" fill="#D0B090"/>
  </g>

  <!-- 天光金尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
