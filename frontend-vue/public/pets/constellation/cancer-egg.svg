<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨蟹座·迪斯马斯克·一阶·黄泉回响·指尖阴气探冥界">
  <defs>
    <!-- 背景：巨蟹宫暗影处月光惨淡 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5E6E"/>
      <stop offset="52%" stop-color="#3E4E5E"/>
      <stop offset="100%" stop-color="#2E3A46"/>
    </linearGradient>
    <!-- 惨白月光 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#C8D8E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 冥界青灰 -->
    <radialGradient id="yin" cx="50%" cy="66%" r="50%">
      <stop offset="0%" stop-color="#7E9E9E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7E9E9E" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9EA6"/>
      <stop offset="100%" stop-color="#5E7480"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 惨白月 -->
  <circle cx="152" cy="48" r="42" fill="url(#moon)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#D8E8F4" opacity="0.9"/>

  <!-- 黄泉比良坡虚影（背景） -->
  <g opacity="0.4">
    <path d="M 20 130 Q 50 116 80 124 Q 110 132 140 122 Q 160 118 180 124 L 200 130 L 200 200 L 0 200 Z" fill="#5E7E7E"/>
    <!-- 比良坡之门影 -->
    <path d="M 70 40 L 90 40 L 88 118 L 72 118 Z" fill="#4E6E6E" opacity="0.6"/>
  </g>

  <!-- 冥气（指尖探向冥界） -->
  <circle cx="100" cy="140" r="60" fill="url(#yin)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 阴气丝线 -->
  <g stroke="#7E9E9E" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M 100 132 Q 96 144 100 156 Q 104 168 100 178">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 106 134 Q 110 146 106 158">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 圣域地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#2E3A46" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3E4E5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 阴柔少年（5头身，练影，指尖阴气） -->
  <!-- 腿 -->
  <path d="M 88 136 L 84 158 L 90 158 L 94 138 Z" fill="#5E7480"/>
  <path d="M 104 136 L 112 160 L 106 160 L 100 138 Z" fill="#5E7480"/>
  <!-- 青铜学徒服 -->
  <path d="M 88 102 Q 84 118 90 136 Q 100 142 108 136 Q 114 118 110 102 Q 100 96 88 102 Z" fill="url(#robe)" stroke="#4E5E6E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 118 L 110 118" stroke="#A8B8C0" stroke-width="1.4"/>

  <!-- 头（阴柔面容，束发） -->
  <circle cx="99" cy="94" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 束发 -->
  <path d="M 95 85 Q 99 82 103 85 Q 101 80 99 80 Q 97 80 95 85 Z" fill="#2E2620"/>
  <!-- 额发 -->
  <path d="M 90 92 Q 94 87 99 87 Q 104 87 108 92 Q 104 88 99 88 Q 94 88 90 92 Z" fill="#2E2620"/>
  <!-- 细眉 -->
  <path d="M 91 92 Q 94 90.8 97 91 M 101 91 Q 104 90.8 107 92" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <!-- 狭长眼含戾气 -->
  <path d="M 92 95 Q 95 93.8 97 94.4 M 101 94.4 Q 103 93.8 106 95" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <circle cx="95" cy="94.6" r="1.6" fill="#1E1008"/>
  <circle cx="103" cy="94.6" r="1.6" fill="#1E1008"/>
  <circle cx="95.5" cy="93.9" r="0.5" fill="#7E9E9E"/>
  <!-- 鼻梁 -->
  <path d="M 99 96.5 L 99 98.5" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 薄唇微勾（邪笑） -->
  <path d="M 95 101.5 Q 98 103.2 101 101.8" fill="none" stroke="#8E5A3E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂负背 -->
  <path d="M 90 106 C 84 110 82 114 84 120" fill="none" stroke="#7E8E9E" stroke-width="3.6" stroke-linecap="round"/>

  <!-- 右手（指尖阴气探冥界） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 108 106 C 112 104 114 100 114 96" fill="none" stroke="#7E8E9E" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="114" cy="94" r="2.8" fill="#D0B8A0"/>
    <!-- 指尖阴气 -->
    <path d="M 114 93 Q 116 88 114 84" stroke="#7E9E9E" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 冥气星尘 -->
  <g fill="#7E9E9E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
