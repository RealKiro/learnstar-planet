<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双子座·撒加·六阶·善恶归一·双子归元护圣域">
  <defs>
    <!-- 背景：双子星座下星河浩瀚 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3E6E"/>
      <stop offset="52%" stop-color="#1E2E56"/>
      <stop offset="100%" stop-color="#14203E"/>
    </linearGradient>
    <!-- 神光白 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F4FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 双子黑 -->
    <radialGradient id="dark" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#6E4E8E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6E4E8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 银河银 -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·双子 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>

    <!-- 头部模板：俊美面容·眉目平和·善恶双相皆含于一眼 -->
    <g id="gemini-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 善恶双相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.8 -1.8 -0.6 L -1.8 0.9 Q -4.5 0.1 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.8 1.8 -0.6 L 1.8 0.9 Q 4.5 0.1 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0" r="1.6" fill="#A8282E"/>
      <circle cx="4.5" cy="0" r="1.6" fill="#A8282E"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 双子星座（背景，两颗星） -->
  <g opacity="0.7">
    <circle cx="40" cy="60" r="2.4" fill="#C8E0F8"/>
    <circle cx="58" cy="48" r="1.8" fill="#C8E0F8"/>
    <path d="M 40 60 L 58 48" stroke="#C8E0F8" stroke-width="0.8" opacity="0.6"/>
    <circle cx="150" cy="56" r="2" fill="#8E6EB8"/>
    <circle cx="166" cy="44" r="1.6" fill="#8E6EB8"/>
    <path d="M 150 56 L 166 44" stroke="#8E6EB8" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 神光与暗影交融 -->
  <circle cx="100" cy="92" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="92" r="80" fill="url(#dark)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="92" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="54" fill="none" stroke="#C8E0F8" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 圣域剪影（下方，被双子归元护住） -->
  <g opacity="0.5">
    <path d="M 0 158 Q 30 150 60 156 Q 90 162 120 154 Q 150 148 180 154 L 200 158 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 150 L 40 140 L 52 140 L 52 150" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 双子归元光洒圣域 -->
  <g stroke="#FFF3C4" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M 60 120 Q 52 136 54 152">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 120 Q 148 136 146 152">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 银河星爆·双子归元（环绕，善恶双相） -->
  <g opacity="0.7">
    <!-- 白相（左） -->
    <path d="M 38 88 Q 26 80 30 72 Q 42 76 44 84 Z" fill="#FFF0D0" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0 38 80;-20 38 80;0 38 80" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- 黑相（右） -->
    <path d="M 162 88 Q 174 80 170 72 Q 158 76 156 84 Z" fill="#6E4E8E" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0 162 80;20 162 80;0 162 80" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 双子圣斗士（双手一合，黑白归元） -->
  <!-- 腿 -->
  <path d="M 90 130 L 86 152 L 92 152 L 96 132 Z" fill="#E8C878"/>
  <path d="M 106 130 L 114 154 L 108 154 L 102 132 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 120 Q 98 128 110 120 Q 114 114 110 106 Q 104 118 96 114 Q 88 118 88 120 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 90 Q 84 104 90 120 Q 100 126 110 120 Q 116 104 112 90 Q 100 84 88 90 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 黑白归元纹 -->
  <path d="M 92 96 Q 94 104 92 110" stroke="#FFF0D0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 106 96 Q 104 104 106 110" stroke="#6E4E8E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 106 L 112 106" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#gemini-face" transform="translate(100,82) scale(1)"/>

  <!-- 双手一合（双子归元） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 左臂（合向中） -->
    <path d="M 90 94 C 82 96 76 96 74 92" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="73" cy="91" r="3.2" fill="#D0B8A0"/>
    <!-- 右臂（合向中） -->
    <path d="M 110 94 C 118 96 124 96 126 92" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="127" cy="91" r="3.2" fill="#D0B8A0"/>
    <!-- 双手相合（双掌之间） -->
    <path d="M 78 90 Q 87 84 96 88" fill="none" stroke="#FFF3C4" stroke-width="1.6" opacity="0.7"/>
    <path d="M 122 90 Q 113 84 104 88" fill="none" stroke="#FFF3C4" stroke-width="1.6" opacity="0.7"/>
  </g>

  <!-- 双子归元核心（双掌之间，善恶合一之光） -->
  <circle cx="100" cy="88" r="14" fill="url(#star)">
    <animate attributeName="r" values="14;19;14" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="8" fill="#FFF7E0" opacity="0.9">
    <animate attributeName="r" values="8;11;8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
