<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="处女座·沙加·四阶·沙罗之战·合十悟第八感">
  <defs>
    <!-- 背景：沙罗双树下血染叶落 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E5E5E"/>
      <stop offset="52%" stop-color="#5E423E"/>
      <stop offset="100%" stop-color="#3E2A2E"/>
    </linearGradient>
    <!-- 佛光冲霄 -->
    <radialGradient id="aura" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银处女圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：清秀面容·闭目微笑·佛相圆满 -->
    <g id="virgo-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 闭目·禅相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 佛光冲霄 -->
  <circle cx="100" cy="80" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 佛光柱（冲霄） -->
  <path d="M 94 70 L 90 30 L 98 26 L 100 0 L 104 0 L 104 30 L 110 34 L 106 72 Z" fill="#FFF3C4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 六道轮回虚影（光中流转） -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 96;15 100 96;0 100 96" dur="16s" repeatCount="indefinite"/>
    <circle cx="100" cy="46" r="3.4" fill="#FFF3C4"/>
    <circle cx="150" cy="78" r="3" fill="#FFF0C0"/>
    <circle cx="136" cy="140" r="3" fill="#F5E0A8"/>
    <circle cx="64" cy="140" r="3" fill="#F5E0A8"/>
    <circle cx="50" cy="78" r="3" fill="#FFF0C0"/>
    <circle cx="100" cy="154" r="3.4" fill="#FFF3C4"/>
    <circle cx="100" cy="96" r="38" fill="none" stroke="#FFF3C4" stroke-width="1.1" opacity="0.5" stroke-dasharray="3 8"/>
  </g>

  <!-- 沙罗双树（血染） -->
  <g>
    <path d="M 28 140 Q 26 116 30 96" stroke="#4E3E3E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="92" r="10" fill="#8E6E5E"/>
    <path d="M 172 140 Q 174 116 170 96" stroke="#4E3E3E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="170" cy="92" r="10" fill="#8E6E5E"/>
  </g>
  <!-- 血染落叶 -->
  <g fill="#B8432E">
    <path d="M 60 104 L 62 112 L 58 110 Z" opacity="0.8">
      <animate attributeName="cy" values="104;118;104" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 102 L 142 110 L 138 108 Z" opacity="0.7">
      <animate attributeName="cy" values="102;116;102" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#3E2A2E" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#5E423E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银处女圣斗士（立于落叶中，血染圣衣，合十微笑） -->
  <!-- 腿 -->
  <path d="M 88 134 L 84 156 L 90 156 L 94 136 Z" fill="#B8C4D0"/>
  <path d="M 104 134 L 112 158 L 106 158 L 100 136 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 88 124 Q 98 132 110 124 Q 114 118 110 110 Q 104 122 96 118 Q 88 122 88 124 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 94 Q 84 108 90 124 Q 100 130 110 124 Q 116 108 112 94 Q 100 88 88 94 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 染血痕 -->
  <path d="M 94 100 Q 96 106 94 112" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 104 104 Q 106 110 104 116" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 白金纹 -->
  <path d="M 92 100 L 96 118 M 104 100 L 100 118" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#virgo-face" transform="translate(100,86) scale(1)"/>

  <!-- 双手合十（临死微笑，悟第八感） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 94 112 Q 100 108 106 112 Q 100 115 94 112 Z" fill="#DCC8A8" stroke="#C8B098" stroke-width="0.8"/>
    <!-- 双掌间第八感光 -->
    <circle cx="100" cy="110" r="10" fill="#FFF3C4" opacity="0.8">
      <animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 佛光金尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
