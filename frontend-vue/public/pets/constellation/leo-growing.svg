<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮子座·艾奥里亚·三阶·第七感·光子爆发光柱冲天">
  <defs>
    <!-- 背景：圣域演武场夜穹 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E7E"/>
      <stop offset="52%" stop-color="#2E3E66"/>
      <stop offset="100%" stop-color="#1E2E4E"/>
    </linearGradient>
    <!-- 光子金 -->
    <radialGradient id="photon" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜狮子圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容·剑眉·虎目如炬（脸中心 0,0） -->
    <g id="leo-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 剑眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 虎目如炬 -->
      <ellipse cx="-4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <circle cx="-4.8" cy="-0.4" r="0.8" fill="#FFF3C4"/>
      <circle cx="3.8" cy="-0.4" r="0.8" fill="#FFF3C4"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 坚毅 -->
      <path d="M -3 5.4 Q 0 7 3 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 光子爆发（一拳轰出，光柱冲天） -->
  <circle cx="100" cy="90" r="70" fill="url(#photon)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 光柱 -->
  <path d="M 94 70 L 90 24 L 98 20 L 100 0 L 104 0 L 104 26 L 110 30 L 106 72 Z" fill="#FFF3C4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 光柱底光 -->
  <circle cx="100" cy="74" r="10" fill="#FFF7E0" opacity="0.9">
    <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 星夜 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="30" r="1.2"/>
    <circle cx="180" cy="70" r="1"/>
  </g>

  <!-- 圣域宫阙（背景） -->
  <g opacity="0.4">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#3E4E7E"/>
    <path d="M 20 20 L 64 20" stroke="#5E6E8E" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#22304A" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3A4A62" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜狮子圣斗士（6头身，一拳轰出光子爆发，金鬃威光） -->
  <!-- 腿 -->
  <path d="M 86 132 L 82 154 L 88 154 L 92 134 Z" fill="#9EAEA0"/>
  <path d="M 102 132 L 110 156 L 104 156 L 98 134 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 86 122 Q 96 130 108 122 Q 112 116 108 108 Q 102 120 94 116 Q 86 120 86 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 86 92 Q 82 106 88 122 Q 98 128 108 122 Q 114 106 110 92 Q 98 86 86 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 金鬃（肩甲鬃毛） -->
  <path d="M 84 90 Q 78 88 76 92 Q 80 96 86 96 Z" fill="#E8C878"/>
  <path d="M 112 90 Q 118 88 120 92 Q 116 96 110 96 Z" fill="#E8C878"/>
  <!-- 圣衣纹 -->
  <path d="M 90 98 L 94 116 M 102 98 L 98 116" stroke="#E8F0E8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 86 108 L 110 108" stroke="#E8F0E8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#leo-face" transform="translate(98,84) scale(1)"/>

  <!-- 左臂（蓄力，护胸） -->
  <path d="M 88 96 C 82 100 80 106 82 114" fill="none" stroke="#C8D0C8" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="82" cy="116" r="3.2" fill="#D0B090"/>

  <!-- 右拳轰天（光子爆发） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 106 96 C 112 92 116 88 118 82" fill="none" stroke="#C8D0C8" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 拳 -->
    <circle cx="119" cy="80" r="3.6" fill="#D0B090"/>
    <!-- 拳上光子 -->
    <circle cx="120" cy="78" r="8" fill="url(#photon)">
      <animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 狮牙突袭光（一闪） -->
  <path d="M 96 80 Q 92 72 96 64" stroke="#FFF3C4" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 光子星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
