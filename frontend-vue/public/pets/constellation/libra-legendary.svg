<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天秤座·童虎·五阶·五老峰守望·黄金天秤两百年">
  <defs>
    <!-- 背景：五老峰巅群山 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B878"/>
      <stop offset="52%" stop-color="#B8965E"/>
      <stop offset="100%" stop-color="#8E7850"/>
    </linearGradient>
    <!-- 守望金 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 黄金天秤圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D8B64E"/>
    </linearGradient>
    <!-- 黄金武器 -->
    <linearGradient id="weapon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0C0"/>
      <stop offset="100%" stop-color="#D8B64E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容·浓眉·虎目含沧桑 -->
    <g id="libra-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 浓眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 虎目含沧桑 -->
      <ellipse cx="-4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <circle cx="-4.8" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="3.8" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.3" cy="0.4" r="0.5" fill="#FFE9A8"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 守望 -->
      <path d="M -3 5.4 Q 0 7 3 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 守望金 -->
  <circle cx="100" cy="94" r="82" fill="url(#aura)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="94" r="62" fill="none" stroke="#FFE9A8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="94" r="54" fill="none" stroke="#FFE9A8" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 五峰群峰（背景） -->
  <g opacity="0.5">
    <path d="M 20 120 Q 34 108 48 114 Q 58 118 56 124 L 20 124 Z" fill="#8E7850"/>
    <path d="M 40 116 Q 52 106 64 112 Q 74 116 72 122 L 40 122 Z" fill="#9E885A"/>
    <path d="M 150 118 Q 162 106 174 112 Q 184 116 182 122 L 150 122 Z" fill="#8E7850"/>
  </g>

  <!-- 十二件黄金武器（身后列阵） -->
  <g>
    <line x1="46" y1="80" x2="60" y2="100" stroke="url(#weapon)" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="76" x2="68" y2="96" stroke="url(#weapon)" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="72" x2="76" y2="92" stroke="url(#weapon)" stroke-width="2" stroke-linecap="round"/>
    <line x1="136" y1="80" x2="122" y2="100" stroke="url(#weapon)" stroke-width="2" stroke-linecap="round"/>
    <line x1="146" y1="76" x2="134" y2="96" stroke="url(#weapon)" stroke-width="2" stroke-linecap="round"/>
    <line x1="156" y1="72" x2="146" y2="92" stroke="url(#weapon)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="46" cy="79" r="1.5" fill="#FFF0C0"/>
    <circle cx="56" cy="75" r="1.5" fill="#FFF0C0"/>
    <circle cx="136" cy="79" r="1.5" fill="#FFF0C0"/>
    <circle cx="146" cy="75" r="1.5" fill="#FFF0C0"/>
  </g>

  <!-- 圣域远影（背景右） -->
  <g opacity="0.4">
    <path d="M 156 40 L 188 40 L 182 52 Q 172 58 160 56 Z" fill="#C8A868"/>
    <path d="M 156 40 L 188 40" stroke="#E8C878" stroke-width="1"/>
  </g>

  <!-- 紫龙少年（右，练拳） -->
  <g opacity="0.85">
    <path d="M 156 140 L 154 152 L 160 152 L 162 140 Z" fill="#8E9EA6"/>
    <path d="M 158 128 Q 155 134 157 140 Q 161 142 164 138 Q 165 132 162 128 Q 160 126 158 128 Z" fill="#7E8E9E"/>
    <circle cx="160" cy="124" r="4.5" fill="#E0C8A8"/>
    <path d="M 157 121 Q 160 119 163 121 Q 162 123 160 123 Q 158 123 157 121 Z" fill="#2E2620"/>
    <!-- 练拳水花 -->
    <g fill="#9AC8D8" opacity="0.6">
      <circle cx="166" cy="126" r="1.6"><animate attributeName="cy" values="126;120;126" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#7E6E4E" opacity="0.7"/>
  <path d="M 0 154 L 200 154" stroke="#9E8E6E" stroke-width="1.4" opacity="0.6"/>

  <!-- 黄金天秤圣斗士（负手而立，背负武器，守望） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#D8B64E"/>
  <path d="M 108 132 L 116 156 L 110 156 L 104 134 Z" fill="#D8B64E"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 122 Q 102 130 114 122 Q 118 116 114 108 Q 108 120 100 116 Q 92 120 92 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 92 Q 88 106 94 122 Q 104 128 114 122 Q 120 106 116 92 Q 104 86 92 92 Z" fill="url(#armor)" stroke="#B8964E" stroke-width="1.2"/>
  <!-- 天秤纹 -->
  <path d="M 96 98 L 100 116 M 110 98 L 106 116" stroke="#FFF0C0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 92 108 L 116 108" stroke="#FFF0C0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#libra-face" transform="translate(104,84) scale(1)"/>

  <!-- 左臂负手 -->
  <path d="M 94 96 C 88 102 86 108 88 116" fill="none" stroke="#FFE9A8" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 右臂负手 -->
  <path d="M 114 96 C 120 102 122 108 120 116" fill="none" stroke="#FFE9A8" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 守望之心（望圣域方向） -->
  <path d="M 120 78 Q 134 70 146 66" stroke="#FFE9A8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 黄金星尘 -->
  <g fill="#FFE9A8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFE9A8" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
