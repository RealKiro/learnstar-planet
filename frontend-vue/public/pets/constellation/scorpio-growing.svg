<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天蝎座·米罗·三阶·猩红连刺·心宿二终针破长空">
  <defs>
    <!-- 背景：圣域演武场夜穹 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E3E4E"/>
      <stop offset="52%" stop-color="#462E3E"/>
      <stop offset="100%" stop-color="#321E2E"/>
    </linearGradient>
    <!-- 猩红针光 -->
    <radialGradient id="needle" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E8624A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8624A" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜天蝎圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：少年面容·剑眉·虎目如电（脸中心 0,0） -->
    <g id="scorpio-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 剑眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 虎目如电 -->
      <ellipse cx="-4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <circle cx="-4.8" cy="-0.4" r="0.8" fill="#E8624A"/>
      <circle cx="3.8" cy="-0.4" r="0.8" fill="#E8624A"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 坚毅 -->
      <path d="M -3 5.4 Q 0 7 3 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 猩红针光 -->
  <circle cx="100" cy="90" r="82" fill="url(#needle)">
    <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 星夜 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="30" r="1.2"/>
    <circle cx="180" cy="70" r="1"/>
  </g>

  <!-- 猩红连刺（漫天针雨） -->
  <g stroke="#E8624A" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M 100 76 Q 88 62 90 48">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 112 80 Q 124 66 122 52">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 88 80 Q 76 66 78 52">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 心宿二·终针（右上，星芒炸裂） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <circle cx="140" cy="48" r="12" fill="#E8624A" opacity="0.9">
      <animate attributeName="r" values="12;17;12" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 终针星芒 -->
    <g stroke="#E8624A" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <path d="M 142 36 Q 146 28 152 24">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 150 44 Q 158 40 164 42">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 天蝎宫（背景） -->
  <g opacity="0.4">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#3E2E3E"/>
    <path d="M 20 20 L 64 20" stroke="#5E4E5E" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#321E2E" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#462E3E" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜天蝎圣斗士（6头身，指尖连刺，尾针猩红） -->
  <!-- 腿 -->
  <path d="M 88 132 L 84 154 L 90 154 L 94 134 Z" fill="#9EAEA0"/>
  <path d="M 104 132 L 112 156 L 106 156 L 100 134 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 88 122 Q 98 130 110 122 Q 114 116 110 108 Q 104 120 96 116 Q 88 120 88 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 92 Q 84 106 90 122 Q 100 128 110 122 Q 116 106 112 92 Q 100 86 88 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 天蝎纹 -->
  <path d="M 92 98 L 96 116 M 104 98 L 100 116" stroke="#E8F0E8" stroke-width="1.2" opacity="0.7"/>
  <!-- 尾针（左肩后，猩红） -->
  <path d="M 86 96 Q 72 88 66 76" stroke="#9EAEA0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="64" cy="74" r="3" fill="#E8624A">
    <animate attributeName="r" values="3;4.4;3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#E8F0E8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#scorpio-face" transform="translate(100,84) scale(1)"/>

  <!-- 左臂负背 -->
  <path d="M 90 96 C 84 100 82 106 84 114" fill="none" stroke="#C8D0C8" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 右手连刺（指尖猩红针雨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 108 96 C 114 92 118 88 120 82" fill="none" stroke="#C8D0C8" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="122" cy="80" r="3.2" fill="#D0B090"/>
    <!-- 指尖猩红 -->
    <circle cx="123" cy="78" r="8" fill="url(#needle)">
      <animate attributeName="r" values="8;12;8" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 猩红星尘 -->
  <g fill="#E8624A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
