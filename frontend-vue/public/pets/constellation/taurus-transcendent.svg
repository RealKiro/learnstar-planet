<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金牛座·阿鲁迪巴·六阶·大地共鸣·一拳轰地护圣域">
  <defs>
    <!-- 背景：旷野大地天地浩大 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#C8985E"/>
      <stop offset="100%" stop-color="#9E7850"/>
    </linearGradient>
    <!-- 大地共鸣金色波纹 -->
    <radialGradient id="resonance" cx="50%" cy="72%" r="52%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神光金 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·金牛 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：圆脸·粗眉·虎目含光·咧嘴 -->
    <g id="taurus-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 国字·宽鼻 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 神光 -->
  <circle cx="100" cy="92" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 大地共鸣波纹（自地面扩散） -->
  <circle cx="100" cy="170" r="52" fill="url(#resonance)">
    <animate attributeName="r" values="52;62;52" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 金色波纹线 -->
  <g stroke="#FFE9A8" stroke-width="1.8" opacity="0.7" fill="none">
    <circle cx="100" cy="170" r="30">
      <animate attributeName="r" values="30;46;30" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="170" r="40">
      <animate attributeName="r" values="40;56;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 山岳呼应（两侧） -->
  <g opacity="0.6">
    <path d="M 0 150 Q 20 132 40 140 Q 50 144 48 152 L 0 152 Z" fill="#A8A080"/>
    <path d="M 152 148 Q 168 134 184 142 Q 192 146 190 152 L 152 152 Z" fill="#A8A080"/>
  </g>

  <!-- 圣域宫阙（身后） -->
  <g opacity="0.5">
    <path d="M 30 118 L 30 106 L 48 106 L 48 118 L 56 118 L 56 98 L 22 98 L 22 118 Z" fill="#C8A878"/>
    <path d="M 38 106 L 38 96 L 37 106 Z" fill="#C8A878"/>
  </g>

  <!-- 大地（前景） -->
  <path d="M 0 158 L 200 158 L 200 200 L 0 200 Z" fill="#7E6A4E" opacity="0.8"/>
  <path d="M 0 158 L 200 158" stroke="#9E8A6E" stroke-width="1.6" opacity="0.7"/>

  <!-- 神圣衣·金牛圣斗士（一拳轰地，护身后） -->
  <!-- 腿（弓步稳如岳） -->
  <path d="M 88 134 L 84 158 L 91 158 L 96 136 Z" fill="#E8C878"/>
  <path d="M 108 134 L 118 162 L 111 162 L 104 136 Z" fill="#E8C878"/>
  <!-- 圣衣（下摆） -->
  <path d="M 88 124 Q 100 132 112 124 Q 116 118 112 110 Q 106 122 98 118 Q 88 122 88 124 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 92 Q 84 108 90 124 Q 102 130 112 124 Q 118 108 114 92 Q 102 84 88 92 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 宽肩 -->
  <path d="M 84 90 Q 88 86 100 86 Q 112 86 116 90 L 114 96 L 86 96 Z" fill="#FFF0D0"/>
  <!-- 圣衣纹 -->
  <path d="M 92 98 L 96 118 M 106 98 L 102 118" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 114 108" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#taurus-face" transform="translate(101,84) scale(1)"/>

  <!-- 左臂（巨型号角起势，护身前） -->
  <path d="M 90 96 C 84 100 82 106 84 112" fill="none" stroke="#FFF0D0" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="84" cy="114" r="3.4" fill="#D0B090"/>

  <!-- 右拳轰向大地（大地共鸣） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 108 96 C 116 104 120 112 122 122" fill="none" stroke="#FFF0D0" stroke-width="5" stroke-linecap="round"/>
    <!-- 铁拳（轰地） -->
    <circle cx="122" cy="126" r="4.4" fill="#D0B090"/>
    <!-- 轰地金光 -->
    <circle cx="122" cy="130" r="10" fill="url(#resonance)">
      <animate attributeName="r" values="10;16;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 共鸣之力（金色扩散） -->
    <g stroke="#FFE9A8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <path d="M 122 136 Q 118 144 112 150">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 126 140 Q 132 146 140 150">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 神光星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
