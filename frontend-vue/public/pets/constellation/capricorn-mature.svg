<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="摩羯座·修罗·四阶·摩羯宫战·以身为剑忠不弯">
  <defs>
    <!-- 背景：摩羯宫前圣战 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E3A3E"/>
      <stop offset="52%" stop-color="#462A2E"/>
      <stop offset="100%" stop-color="#321E22"/>
    </linearGradient>
    <!-- 剑光银 -->
    <radialGradient id="sword" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 血战红 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银摩羯圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：青年面容·剑眉·眼含剑意不屈 -->
    <g id="capricorn-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 剑士·锐利 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 血战红 -->
  <circle cx="156" cy="52" r="52" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 剑光 -->
  <circle cx="100" cy="96" r="72" fill="url(#sword)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 敌群（左上，被圣剑连斩） -->
  <g opacity="0.5">
    <path d="M 40 40 Q 42 30 46 27 Q 50 29 50 40 Z" fill="#241A2E"/>
    <path d="M 56 46 Q 58 36 62 33 Q 66 35 66 46 Z" fill="#2A2034"/>
  </g>
  <!-- 剑光斩向敌群 -->
  <path d="M 84 70 Q 74 58 70 48" stroke="#E8F0F8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 摩羯宫（背景） -->
  <g opacity="0.4">
    <path d="M 128 20 L 188 20 L 180 34 Q 158 42 140 38 Z" fill="#3E2A2E"/>
    <path d="M 128 20 L 188 20" stroke="#5E4A4E" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#2A1E22" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3E2A2E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银摩羯圣斗士（立宫前，圣剑连斩，剑痕遍布） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#B8C4D0"/>
  <path d="M 108 132 L 116 156 L 110 156 L 104 134 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 122 Q 102 130 114 122 Q 118 116 114 108 Q 108 120 100 116 Q 92 120 92 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 92 Q 88 106 94 122 Q 104 128 114 122 Q 120 106 116 92 Q 104 86 92 92 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 剑痕 -->
  <path d="M 96 100 L 100 106 M 98 108 L 102 114 M 110 104 L 114 110" stroke="#9EAEBE" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- 染血痕 -->
  <path d="M 104 108 Q 106 114 104 120" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 圣衣纹 -->
  <path d="M 96 98 L 100 116 M 110 98 L 106 116" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 108 L 116 108" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#capricorn-face" transform="translate(104,84) scale(1)"/>

  <!-- 左臂（剑芒，护身前） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 94 96;3 94 96;-4 94 96" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 94 96 C 88 92 84 88 82 82" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 82 82 L 70 64" stroke="#E8F0F8" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- 右臂（圣剑连斩） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 112 96;4 112 96;-6 112 96" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 112 96 C 118 92 124 88 130 84" fill="none" stroke="#E8ECF0" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 右臂剑芒 -->
    <path d="M 130 84 L 156 54" stroke="#E8F0F8" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <circle cx="157" cy="52" r="4" fill="#E8F0F8" opacity="0.8">
      <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 剑断忠不断（身后断剑虚影） -->
  <path d="M 82 96 L 76 120" stroke="#B8C4D0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 76 120 L 75 126" stroke="#B8C4D0" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- 剑光星尘 -->
  <g fill="#E8F0F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
