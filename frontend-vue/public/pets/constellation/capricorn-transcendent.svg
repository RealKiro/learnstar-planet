<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="摩羯座·修罗·六阶·以身归剑·圣剑化虹护圣域">
  <defs>
    <!-- 背景：摩羯宫顶剑光星河 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E6E"/>
      <stop offset="52%" stop-color="#2E3E56"/>
      <stop offset="100%" stop-color="#1E2E46"/>
    </linearGradient>
    <!-- 剑芒银 -->
    <radialGradient id="sword" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神光金 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·摩羯 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：青年面容·剑眉·眼含剑魂 -->
    <g id="capricorn-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 剑眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼含剑魂 -->
      <ellipse cx="-4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.3" cy="0.4" rx="2.4" ry="2.2" fill="#1E1008"/>
      <circle cx="-4.8" cy="-0.4" r="0.7" fill="#E8F0F8"/>
      <circle cx="3.8" cy="-0.4" r="0.7" fill="#E8F0F8"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 剑魂 -->
      <path d="M -3 5.4 Q 0 7 3 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 剑芒神光 -->
  <circle cx="100" cy="86" r="84" fill="url(#sword)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="86" r="70" fill="url(#aura)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="86" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="86" r="54" fill="none" stroke="#FFF3C4" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 圣域剪影（下方，被身化剑芒护住） -->
  <g opacity="0.5">
    <path d="M 0 158 Q 40 150 90 156 Q 140 162 200 154 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 150 L 40 140 L 52 140 L 52 150 M 120 152 L 120 144 L 132 144 L 132 152" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 剑虹垂落圣域（护） -->
  <g stroke="#E8F0F8" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M 60 110 Q 52 128 54 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 110 Q 148 128 146 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 通天圣剑（双臂并作，一剑化虹贯穿天地） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 圣剑虹身 -->
    <line x1="100" y1="120" x2="100" y2="14" stroke="#E8F0F8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <!-- 剑锋 -->
    <path d="M 100 14 L 95 4 L 105 4 Z" fill="#FFF3C4"/>
    <!-- 剑虹光晕 -->
    <circle cx="100" cy="70" r="26" fill="url(#sword)">
      <animate attributeName="r" values="26;32;26" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- 贯穿天地光 -->
    <path d="M 100 120 Q 96 130 100 140" stroke="#FFF3C4" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 神圣衣·摩羯圣斗士（双臂并剑，身化剑芒） -->
  <!-- 腿 -->
  <path d="M 90 128 L 86 150 L 92 150 L 96 130 Z" fill="#E8C878"/>
  <path d="M 106 128 L 114 152 L 108 152 L 102 130 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 118 Q 98 126 110 118 Q 114 112 110 104 Q 104 116 96 112 Q 88 116 88 118 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 88 Q 84 102 90 118 Q 100 124 110 118 Q 116 102 112 88 Q 100 82 88 88 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 圣衣纹 -->
  <path d="M 92 94 L 96 112 M 104 94 L 100 112" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 104 L 112 104" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#capricorn-face" transform="translate(100,80) scale(1)"/>

  <!-- 双臂并作圣剑（举起冲天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 左臂（并剑） -->
    <path d="M 90 92 C 86 84 84 76 84 68" fill="none" stroke="#FFF0D0" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 右臂（并剑） -->
    <path d="M 108 92 C 112 84 114 76 114 68" fill="none" stroke="#FFF0D0" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 双手并剑核心 -->
    <circle cx="99" cy="66" r="8" fill="url(#sword)">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 剑魂星尘 -->
  <g fill="#E8F0F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
