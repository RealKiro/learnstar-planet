<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白羊座·穆·六阶·万星朝圣·星光灭绝护圣域">
  <defs>
    <!-- 背景：白羊宫顶漫天星辰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3E6E"/>
      <stop offset="52%" stop-color="#1E2E56"/>
      <stop offset="100%" stop-color="#14203E"/>
    </linearGradient>
    <!-- 神光白 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F4FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 万星金 -->
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 星河水晶 -->
    <radialGradient id="crystal" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#9AC8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9AC8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·白羊 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <!-- 星光翼 -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8E0F8" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：面容温柔·眉目含光·眼如星海 -->
    <g id="aries-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 温柔·贤者 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
    <circle cx="70" cy="8" r="0.9"/><circle cx="120" cy="6" r="0.8"/>
  </g>

  <!-- 神光 -->
  <circle cx="100" cy="92" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="92" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="54" fill="none" stroke="#FFF3C4" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 万星朝圣（双手一展，星光遍洒圣域） -->
  <!-- 圣域剪影（下方，被星光护住） -->
  <g opacity="0.6">
    <path d="M 0 158 Q 30 150 60 156 Q 90 162 120 154 Q 150 148 180 154 L 200 158 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <!-- 圣域建筑 -->
    <path d="M 40 150 L 40 140 L 52 140 L 52 150 M 56 148 L 56 140 L 68 140 L 68 148" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 星光遍洒（垂落圣域） -->
  <g stroke="#FFF3C4" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M 60 120 Q 52 136 54 152">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 120 Q 148 136 146 152">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 水晶墙化作星河（环绕） -->
  <g>
    <circle cx="100" cy="92" r="74" fill="url(#crystal)" opacity="0.35">
      <animate attributeName="r" values="74;80;74" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="74" fill="none" stroke="#C8E0F8" stroke-width="1.4" opacity="0.5"/>
    <!-- 星河星点 -->
    <g fill="#C8E0F8">
      <circle cx="36" cy="80" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="56" cy="48" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="56" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="168" cy="100" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 星光翼（身后展开） -->
  <g fill="url(#wing)" stroke="#C8E0F8" stroke-width="0.8" opacity="0.85">
    <path d="M 74 70 Q 44 44 26 48 Q 42 66 76 78 Z"/>
    <path d="M 76 82 Q 40 72 24 80 Q 44 92 78 90 Z"/>
    <path d="M 126 70 Q 156 44 174 48 Q 158 66 124 78 Z"/>
    <path d="M 124 82 Q 160 72 176 80 Q 156 92 122 90 Z"/>
  </g>

  <!-- 神圣衣·白羊圣斗士（立于星光之巅） -->
  <!-- 腿 -->
  <path d="M 88 130 L 84 152 L 90 152 L 94 132 Z" fill="#E8C878"/>
  <path d="M 106 130 L 114 154 L 108 154 L 102 132 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 122 Q 98 130 110 122 Q 114 116 110 108 Q 104 120 96 116 Q 88 120 88 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 92 Q 84 106 90 122 Q 100 128 110 122 Q 116 106 112 92 Q 100 86 88 92 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 圣衣纹（星光） -->
  <path d="M 92 98 L 96 116 M 104 98 L 100 116" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 白羊角（星角） -->
  <path d="M 90 84 Q 84 76 86 68" stroke="#FFF3C4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 110 84 Q 116 76 114 68" stroke="#FFF3C4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 腰带 -->
  <path d="M 88 106 L 112 106" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#aries-face" transform="translate(100,84) scale(1)"/>

  <!-- 双手一展（万星朝圣） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 90 96 C 80 94 70 92 62 88" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="60" cy="87" r="3.2" fill="#DCC4A0"/>
    <!-- 左掌心万星 -->
    <circle cx="58" cy="86" r="9" fill="url(#star)">
      <animate attributeName="r" values="9;13;9" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -2;0 0" dur="3.2s" repeatCount="indefinite"/>
    <path d="M 110 96 C 120 94 130 92 138 88" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="140" cy="87" r="3.2" fill="#DCC4A0"/>
    <circle cx="142" cy="86" r="9" fill="url(#star)">
      <animate attributeName="r" values="9;13;9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 万星星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
