<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="狮子座·艾奥里亚·二阶·光速之拳·拳影如雷碎石">
  <defs>
    <!-- 背景：训练场星夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E6E"/>
      <stop offset="52%" stop-color="#2E3E56"/>
      <stop offset="100%" stop-color="#1E2E46"/>
    </linearGradient>
    <!-- 电光蓝 -->
    <radialGradient id="bolt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9AC8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 汗光金 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜训练服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E9E"/>
      <stop offset="100%" stop-color="#6E7E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="leo-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 虎目·正义 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 星夜 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="30" r="1.2"/>
    <circle cx="180" cy="70" r="1"/>
  </g>
  <!-- 电光 -->
  <circle cx="100" cy="110" r="60" fill="url(#bolt)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 沙袋（右，被击） -->
  <g>
    <path d="M 150 70 L 150 120" stroke="#5E6E7E" stroke-width="2.4"/>
    <ellipse cx="158" cy="130" rx="14" ry="18" fill="#8E6A4E" stroke="#6E5238" stroke-width="1.2"/>
    <path d="M 158 148 Q 154 154 158 158 Q 162 154 158 148 Z" fill="#8E6A4E"/>
    <!-- 被击凹 -->
    <ellipse cx="146" cy="124" rx="4" ry="6" fill="#6E5238" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 碎石四溅 -->
  <g fill="#8E9898">
    <circle cx="140" cy="100" r="2"><animate attributeName="cy" values="100;92;100" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="118" r="1.6"><animate attributeName="cy" values="118;110;118" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 156 L 200 156 L 200 200 L 0 200 Z" fill="#22304A" opacity="0.8"/>
  <path d="M 0 156 L 200 156" stroke="#3A4A62" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜少年（6头身，连击，拳影如电） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 156 L 86 156 L 90 136 Z" fill="#6E7E7E"/>
  <path d="M 100 134 L 108 158 L 102 158 L 96 136 Z" fill="#6E7E7E"/>
  <!-- 训练服 -->
  <!-- 腰带 -->
  <path d="M 84 114 L 104 114" stroke="#A8B8B8" stroke-width="1.4"/>

  <!-- 头（少年面容，剑眉虎目如电，咧嘴） -->
  <!-- 剑眉 -->
  <!-- 虎目如电 -->
  <!-- 鼻梁 -->
  <!-- 咧嘴 -->

  <!-- 左臂（收于身侧，蓄） -->
  <path d="M 86 100 C 80 104 78 110 80 118" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>

  <!-- 右拳连击（闪电光速） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 102 100;4 102 100;-6 102 100" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 102 100 C 110 96 116 92 120 86" fill="none" stroke="#8E9E9E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="122" cy="85" r="3.4" fill="#D0B090"/>
    <!-- 拳影如电（连击残影） -->
    <g stroke="#9AC8F0" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <path d="M 122 84 L 132 76">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 124 88 L 136 82">
        <animate attributeName="opacity" values="0.5;0.12;0.5" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 120 90 L 128 84">
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 汗珠 -->
  <g fill="#9AC8F0">
  </g>

  <!-- 电光星尘 -->
  <g fill="#9AC8F0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#leo-face" transform="translate(95,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 86 82 Q 90 78 95 78 Q 100 78 104 82 Q 100 79 95 79 Q 90 79 86 82 Z" fill="#2E2620"/>
</svg>
