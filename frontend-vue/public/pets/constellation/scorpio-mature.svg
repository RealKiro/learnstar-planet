<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天蝎座·米罗·四阶·天蝎宫战·深红毒针义战">
  <defs>
    <!-- 背景：天蝎宫前圣战 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E3A3E"/>
      <stop offset="52%" stop-color="#462A2E"/>
      <stop offset="100%" stop-color="#321E22"/>
    </linearGradient>
    <!-- 猩红针光 -->
    <radialGradient id="needle" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E8624A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8624A" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火金 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银天蝎圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：青年面容·剑眉·虎目坚定 -->
    <g id="scorpio-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 忠义·剑眉 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 战火 -->
  <circle cx="156" cy="52" r="52" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 猩红针光 -->
  <circle cx="100" cy="96" r="72" fill="url(#needle)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 敌群（左上，被毒针雨破） -->
  <g opacity="0.5">
    <path d="M 40 40 Q 42 30 46 27 Q 50 29 50 40 Z" fill="#241A2E"/>
    <path d="M 56 46 Q 58 36 62 33 Q 66 35 66 46 Z" fill="#2A2034"/>
  </g>
  <!-- 毒针雨（破敌） -->
  <g stroke="#E8624A" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M 84 66 Q 74 56 70 48">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 88 70 Q 78 60 74 52">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 天蝎宫（背景） -->
  <g opacity="0.4">
    <path d="M 128 20 L 188 20 L 180 34 Q 158 42 140 38 Z" fill="#3E2A2E"/>
    <path d="M 128 20 L 188 20" stroke="#5E4A4E" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#2A1E22" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3E2A2E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银天蝎圣斗士（立宫前，毒针连发） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#B8C4D0"/>
  <path d="M 108 132 L 116 156 L 110 156 L 104 134 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 122 Q 102 130 114 122 Q 118 116 114 108 Q 108 120 100 116 Q 92 120 92 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 92 Q 88 106 94 122 Q 104 128 114 122 Q 120 106 116 92 Q 104 86 92 92 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 尾针（左肩后，猩红凛冽） -->
  <path d="M 90 96 Q 76 88 70 76" stroke="#B8C4D0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="68" cy="74" r="3.4" fill="#E8624A">
    <animate attributeName="r" values="3.4;4.8;3.4" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 圣衣纹 -->
  <path d="M 96 98 L 100 116 M 112 98 L 108 116" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 108 L 116 108" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#scorpio-face" transform="translate(104,84) scale(1)"/>

  <!-- 左臂（护身） -->
  <path d="M 94 96 C 88 100 86 106 88 114" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="88" cy="116" r="3.2" fill="#D0B090"/>

  <!-- 右手连刺（猩红毒针） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 112 96 C 118 92 122 88 124 82" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="126" cy="80" r="3.2" fill="#D0B090"/>
    <!-- 指尖猩红连刺 -->
    <g stroke="#E8624A" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <path d="M 126 78 L 138 66">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 128 82 L 142 74">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="126" cy="80" r="10" fill="url(#needle)">
      <animate attributeName="r" values="10;14;10" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 猩红星尘 -->
  <g fill="#E8624A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
