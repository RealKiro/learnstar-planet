<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双鱼座·阿布罗狄·六阶·玫瑰之殇·血色终章护圣域">
  <defs>
    <!-- 背景：双鱼宫顶绯红星夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E3E5E"/>
      <stop offset="52%" stop-color="#4E324E"/>
      <stop offset="100%" stop-color="#3E2640"/>
    </linearGradient>
    <!-- 玫瑰绯红 -->
    <radialGradient id="rose" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#E8627E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8627E" stop-opacity="0"/>
    </radialGradient>
    <!-- 血色深红 -->
    <radialGradient id="crimson" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#C8405E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8405E" stop-opacity="0"/>
    </radialGradient>
    <!-- 神光金 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·双鱼 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <!-- 玫瑰翼 -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0A0B8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8627E" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：绝美面容·桃花眼含慈悲 -->
    <g id="pisces-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D8C0A0" stroke-width="0.8"/>
      <!-- 长发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <path d="M -8 -4 L -12 -2 M 8 -4 L 12 -2" stroke="#2E2620" stroke-width="1.6" stroke-linecap="round"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 细眉 -->
      <path d="M -8 -1.5 Q -5 -3 -2 -2.4 M 8 -1.5 Q 5 -3 2 -2.4" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 桃花眼含慈悲 -->
      <path d="M -7 0.4 Q -4.5 -0.8 -2 -0.2 L -2 1 Q -4.5 0.4 -7 1.6 Z" fill="#1E1008"/>
      <path d="M 7 0.4 Q 4.5 -0.8 2 -0.2 L 2 1 Q 4.5 0.4 7 1.6 Z" fill="#1E1008"/>
      <circle cx="-4.2" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.2" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-4.2" cy="0.3" r="0.5" fill="#FFF3C4"/>
      <circle cx="4.2" cy="0.3" r="0.5" fill="#FFF3C4"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#D0B898" stroke-width="1" stroke-linecap="round"/>
      <!-- 慈悲 -->
      <path d="M -3 5.4 Q 0 7.2 3 5.4" fill="none" stroke="#C85068" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 漫天星辰 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 玫瑰绯红 -->
  <circle cx="100" cy="86" r="84" fill="url(#rose)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 血色深红 -->
  <circle cx="100" cy="86" r="70" fill="url(#crimson)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 神光 -->
  <circle cx="100" cy="86" r="56" fill="url(#aura)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="86" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="86" r="54" fill="none" stroke="#E8627E" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 圣域剪影（下方，被玫瑰之殇护住） -->
  <g opacity="0.5">
    <path d="M 0 158 Q 40 150 90 156 Q 140 162 200 154 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 150 L 40 140 L 52 140 L 52 150 M 120 152 L 120 144 L 132 144 L 132 152" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 血色终章垂落圣域（护） -->
  <g stroke="#E8627E" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M 60 110 Q 52 128 54 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 110 Q 148 128 146 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 玫瑰之殇（漫天玫瑰化作血色终章） -->
  <g>
    <!-- 漫天玫瑰 -->
    <circle cx="56" cy="56" r="5" fill="#E8627E" opacity="0.9">
      <animate attributeName="cy" values="56;46;56" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="50" r="5" fill="#E8627E" opacity="0.9">
      <animate attributeName="cy" values="50;40;50" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="136" cy="88" r="4.5" fill="#C8405E" opacity="0.85">
      <animate attributeName="cy" values="88;78;88" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="100" r="4" fill="#C8405E" opacity="0.8">
      <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- 玫瑰之殇光痕 -->
    <g stroke="#E8627E" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
      <path d="M 90 78 Q 74 68 60 58">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 106 72 Q 124 60 142 54">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 玫瑰翼（身后展开） -->
  <g fill="url(#wing)" stroke="#E8627E" stroke-width="0.8" opacity="0.85">
    <path d="M 72 66 Q 42 38 24 42 Q 40 62 74 76 Z"/>
    <path d="M 74 80 Q 38 70 22 78 Q 42 90 76 88 Z"/>
    <path d="M 128 66 Q 158 38 176 42 Q 160 62 126 76 Z"/>
    <path d="M 126 80 Q 162 70 178 78 Q 158 90 124 88 Z"/>
  </g>

  <!-- 神圣衣·双鱼圣斗士（一挥手，玫瑰之殇） -->
  <!-- 腿 -->
  <path d="M 90 128 L 86 150 L 92 150 L 96 130 Z" fill="#E8C878"/>
  <path d="M 106 128 L 114 152 L 108 152 L 102 130 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 118 Q 98 126 110 118 Q 114 112 110 104 Q 104 116 96 112 Q 88 116 88 118 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 88 Q 84 102 90 118 Q 100 124 110 118 Q 116 102 112 88 Q 100 82 88 88 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 藤蔓（金红） -->
  <path d="M 86 94 Q 82 104 86 112" stroke="#E8809E" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 圣衣纹 -->
  <path d="M 92 94 L 96 112 M 104 94 L 100 112" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 104 L 112 104" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#pisces-face" transform="translate(100,80) scale(1)"/>

  <!-- 左臂（垂持，玫瑰落） -->
  <path d="M 90 92 C 84 98 82 104 84 112" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 右手（一挥手，玫瑰之殇） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 108 92 C 114 88 118 84 120 78" fill="none" stroke="#FFF0D0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="121" cy="76" r="3.2" fill="#E2C8A8"/>
    <!-- 掌心玫瑰之殇 -->
    <circle cx="123" cy="74" r="9" fill="#E8627E">
      <animate attributeName="r" values="9;13;9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 挥手玫瑰化殇 -->
    <g stroke="#E8627E" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
      <path d="M 122 72 L 134 60">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 124 76 L 138 70">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 零落成泥（花瓣飘落） -->
  <g fill="#C8405E" opacity="0.7">
    <circle cx="70" cy="130" r="2"><animate attributeName="cy" values="130;142;130" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="134" r="1.8"><animate attributeName="cy" values="134;146;134" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 玫瑰星尘 -->
  <g fill="#E8627E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
