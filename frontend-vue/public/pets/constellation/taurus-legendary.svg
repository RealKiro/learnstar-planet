<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金牛座·阿鲁迪巴·五阶·金牛宫主·黄金金牛镇圣宫">
  <defs>
    <!-- 背景：金牛宫大殿金色殿堂 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B878"/>
      <stop offset="52%" stop-color="#B8965E"/>
      <stop offset="100%" stop-color="#8E7850"/>
    </linearGradient>
    <!-- 金牛威光 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 黄金金牛圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#D8B64E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：圆脸·粗眉·虎目豪迈·咧嘴 -->
    <g id="taurus-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 双角（金角如柱） -->
      <path d="M -8 -6 Q -12 -10 -11 -15" stroke="#FFE9A8" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <path d="M 8 -6 Q 12 -10 11 -15" stroke="#FFE9A8" stroke-width="2.8" stroke-linecap="round" fill="none"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#2E2620"/>
      <!-- 粗眉 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- 虎目 -->
      <ellipse cx="-4.5" cy="0.4" rx="2.5" ry="2.3" fill="#1E1008"/>
      <ellipse cx="4.5" cy="0.4" rx="2.5" ry="2.3" fill="#1E1008"/>
      <circle cx="-5" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4" cy="-0.4" r="0.8" fill="#FFF"/>
      <!-- 鼻梁宽 -->
      <circle cx="0" cy="3" r="2" fill="#C8A880"/>
      <!-- 咧嘴 -->
      <path d="M -3.4 6 Q 0 8 3.4 6" fill="none" stroke="#8E5A3E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 金牛威光 -->
  <circle cx="100" cy="96" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="96" r="62" fill="none" stroke="#FFE9A8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="96" r="54" fill="none" stroke="#FFE9A8" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 金牛宫星象（背景，身后） -->
  <g opacity="0.5">
    <g fill="#FFF0C0">
      <circle cx="40" cy="70" r="1.8"/>
      <circle cx="52" cy="60" r="1.4"/>
      <circle cx="66" cy="66" r="1.6"/>
      <circle cx="60" cy="80" r="1.2"/>
    </g>
    <path d="M 40 70 L 52 60 L 66 66 L 60 80" stroke="#FFF0C0" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 金色殿堂柱 -->
  <g opacity="0.4">
    <path d="M 18 0 L 26 0 L 26 200 L 18 200 Z" fill="#B8965E"/>
    <path d="M 174 0 L 182 0 L 182 200 L 174 200 Z" fill="#B8965E"/>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.6">
    <path d="M 0 150 Q 50 142 100 148 Q 150 154 200 146 L 200 200 L 0 200 Z" fill="#C8AC84">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 黄金金牛圣斗士（负手而立，魁梧如山） -->
  <!-- 腿 -->
  <path d="M 90 134 L 86 158 L 93 158 L 98 136 Z" fill="#D8B64E"/>
  <path d="M 110 134 L 120 162 L 113 162 L 106 136 Z" fill="#D8B64E"/>
  <!-- 圣衣（下摆） -->
  <path d="M 90 124 Q 102 132 114 124 Q 118 118 114 110 Q 108 122 100 118 Q 90 122 90 124 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 90 92 Q 86 108 92 124 Q 104 130 114 124 Q 120 108 116 92 Q 104 84 90 92 Z" fill="url(#armor)" stroke="#B8964E" stroke-width="1.2"/>
  <!-- 宽肩 -->
  <path d="M 86 90 Q 90 86 102 86 Q 114 86 118 90 L 116 96 L 88 96 Z" fill="#FFE9A8"/>
  <!-- 圣衣纹 -->
  <path d="M 94 98 L 98 118 M 108 98 L 104 118" stroke="#FFF0C0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 90 108 L 116 108" stroke="#FFF0C0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#taurus-face" transform="translate(103,84) scale(1)"/>

  <!-- 左臂负手 -->
  <path d="M 92 96 C 86 102 84 108 86 116" fill="none" stroke="#FFE9A8" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 右臂负手 -->
  <path d="M 114 96 C 120 102 122 108 120 116" fill="none" stroke="#FFE9A8" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 金牛威光尘 -->
  <g fill="#FFE9A8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFE9A8" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
