<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="处女座·沙加·六阶·万法皆空·阿赖耶识渡尽众生">
  <defs>
    <!-- 背景：云端星海金莲 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E6E9E"/>
      <stop offset="52%" stop-color="#5E4E82"/>
      <stop offset="100%" stop-color="#3E3662"/>
    </linearGradient>
    <!-- 佛光圆满 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 万法皆空之光 -->
    <radialGradient id="white" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F4E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F4E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神圣衣·处女 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E8C878"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：清秀面容·闭目·佛相圆满慈悲 -->
    <g id="virgo-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D0BCA0" stroke-width="0.8"/>
      <!-- 短发（佛相） -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 眉含慈悲 -->
      <path d="M -8 -1.5 Q -5 -3 -2 -2.4 M 8 -1.5 Q 5 -3 2 -2.4" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 双目紧闭 -->
      <path d="M -7 0.6 Q -4.5 1.8 -2 0.6 M 2 0.6 Q 4.5 1.8 7 0.6" stroke="#1E1008" stroke-width="1" stroke-linecap="round" fill="none"/>
      <!-- 眉间佛印 -->
      <circle cx="0" cy="-3.4" r="1.6" fill="#FFF3C4" opacity="0.95">
        <animate attributeName="r" values="1.6;2.2;1.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- 鼻梁 -->
      <path d="M 0 2 L 0 4" stroke="#C8B098" stroke-width="1" stroke-linecap="round"/>
      <!-- 圆满慈悲 -->
      <path d="M -3 7 Q 0 8.6 3 7" fill="none" stroke="#A89070" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 浩瀚星海 -->
  <g fill="#E8F0FA">
    <circle cx="20" cy="30" r="1.4"/><circle cx="50" cy="14" r="1"/>
    <circle cx="140" cy="18" r="1.3"/><circle cx="180" cy="50" r="1.1"/>
    <circle cx="30" cy="130" r="1"/><circle cx="170" cy="150" r="1.2"/>
  </g>

  <!-- 佛光圆满 -->
  <circle cx="100" cy="92" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光（双环） -->
  <g>
    <circle cx="100" cy="92" r="62" fill="none" stroke="#FFF3C4" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="54" fill="none" stroke="#FFF3C4" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 100 30 L 101.5 34 L 99 34.5 L 100 38" fill="none" stroke="#FFF3C4" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 六道轮回尽归空（光中流转消散） -->
  <g opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 100 92;15 100 92;0 100 92" dur="20s" repeatCount="indefinite"/>
    <circle cx="100" cy="44" r="3" fill="#FFF3C4">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="78" r="2.6" fill="#FFF0C0">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="136" cy="142" r="2.6" fill="#F5E0A8">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="64" cy="142" r="2.6" fill="#F5E0A8">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="78" r="2.6" fill="#FFF0C0">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="142" r="3" fill="#FFF3C4">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="36" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.4" stroke-dasharray="2 8"/>
  </g>

  <!-- 云海（托莲台） -->
  <g opacity="0.7">
    <path d="M 0 148 Q 50 140 100 146 Q 150 152 200 144 L 200 200 L 0 200 Z" fill="#4E3E72">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 金莲为座（脚下） -->
  <g>
    <path d="M 70 150 Q 100 138 130 150 Q 112 156 88 156 Q 78 154 70 150 Z" fill="#E8C878" stroke="#C8A868" stroke-width="1"/>
    <path d="M 76 148 Q 100 138 124 148 Q 110 152 90 152 Z" fill="#F0D898"/>
    <!-- 莲瓣 -->
    <path d="M 80 148 Q 74 140 84 138 Q 90 142 88 148 Z" fill="#E8C878"/>
    <path d="M 120 148 Q 126 140 116 138 Q 110 142 112 148 Z" fill="#E8C878"/>
    <!-- 莲光 -->
    <circle cx="100" cy="148" r="16" fill="#FFF3C4" opacity="0.3">
      <animate attributeName="r" values="16;22;16" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 神圣衣·处女圣斗士（合十而立，莲台为座） -->
  <!-- 腿 -->
  <path d="M 90 128 L 86 148 L 92 148 L 96 130 Z" fill="#E8C878"/>
  <path d="M 106 128 L 114 150 L 108 150 L 102 130 Z" fill="#E8C878"/>
  <!-- 神圣衣（下摆） -->
  <path d="M 88 118 Q 98 126 110 118 Q 114 112 110 104 Q 104 116 96 112 Q 88 116 88 118 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 88 88 Q 84 102 90 118 Q 100 124 110 118 Q 116 102 112 88 Q 100 82 88 88 Z" fill="url(#armor)" stroke="#C8A868" stroke-width="1.2"/>
  <!-- 白金纹 -->
  <path d="M 92 94 L 96 112 M 104 94 L 100 112" stroke="#FFF7E0" stroke-width="1.2" opacity="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 104 L 112 104" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#virgo-face" transform="translate(100,80) scale(1)"/>

  <!-- 双手合十（渡尽众生） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 94 108 Q 100 104 106 108 Q 100 111 94 108 Z" fill="#DCC8A8" stroke="#C8B098" stroke-width="0.8"/>
    <!-- 掌心万法皆空之光 -->
    <circle cx="100" cy="106" r="11" fill="url(#white)">
      <animate attributeName="r" values="11;16;11" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 万法皆空之光（遍洒，渡尽众生） -->
  <g stroke="#F8F4E8" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <path d="M 100 118 Q 84 132 78 148">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 118 Q 116 132 122 148">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 佛光星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 20 L 100 10"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
