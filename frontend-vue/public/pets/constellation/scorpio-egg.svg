<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="天蝎座·米罗·一阶·忠义初立·与伙伴并肩立誓">
  <defs>
    <!-- 背景：圣域天蝎宫金色宫阙 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8B878"/>
      <stop offset="52%" stop-color="#B8965E"/>
      <stop offset="100%" stop-color="#8E7850"/>
    </linearGradient>
    <!-- 天蝎红 -->
    <radialGradient id="fire" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#C8402E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8402E" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜学徒服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA0B0"/>
      <stop offset="100%" stop-color="#5E7484"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 天蝎红 -->
  <circle cx="100" cy="96" r="66" fill="url(#fire)">
    <animate attributeName="opacity" values="0.4;0.25;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色宫阙 -->
  <g opacity="0.5">
    <path d="M 20 20 L 72 20 L 62 34 Q 40 42 28 38 Z" fill="#B8965E"/>
    <path d="M 20 20 L 72 20" stroke="#D8B878" stroke-width="1.2"/>
  </g>

  <!-- 伙伴（左，并肩） -->
  <g opacity="0.9">
    <path d="M 66 138 L 65 126 L 70 123 L 75 126 L 75 138 Z" fill="#7E8E9E"/>
    <circle cx="70" cy="120" r="4.5" fill="#E0C8A8"/>
    <path d="M 67 117 Q 70 115 73 117 Q 72 119 70 119 Q 68 119 67 117 Z" fill="#2E2620"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#7E6E4E" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#9E8E6E" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜学徒少年（5头身，英气，立誓） -->
  <!-- 腿 -->
  <path d="M 88 136 L 84 158 L 90 158 L 94 138 Z" fill="#5E7484"/>
  <path d="M 104 136 L 112 160 L 106 160 L 100 138 Z" fill="#5E7484"/>
  <!-- 青铜学徒服 -->
  <path d="M 88 102 Q 84 118 90 136 Q 100 142 108 136 Q 114 118 110 102 Q 100 96 88 102 Z" fill="url(#robe)" stroke="#4E5E6E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 118 L 110 118" stroke="#A8B8C8" stroke-width="1.6"/>

  <!-- 头（少年面容，剑眉虎目坚定） -->
  <circle cx="99" cy="94" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 短发 -->
  <path d="M 90 88 Q 94 84 99 84 Q 104 84 108 88 Q 104 85 99 85 Q 94 85 90 88 Z" fill="#2E2620"/>
  <!-- 剑眉 -->
  <path d="M 91 89 Q 95 87.5 98 88 M 100 88 Q 103 87.5 107 89" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 虎目坚定 -->
  <ellipse cx="95" cy="92" rx="2.4" ry="2.2" fill="#1E1008"/>
  <ellipse cx="103" cy="92" rx="2.4" ry="2.2" fill="#1E1008"/>
  <circle cx="96" cy="91.2" r="0.8" fill="#FFF"/>
  <circle cx="104" cy="91.2" r="0.8" fill="#FFF"/>
  <!-- 鼻梁 -->
  <path d="M 99 94.5 L 99 97" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 坚毅 -->
  <path d="M 94 100.5 Q 99 102.8 104 100.5" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 左臂（搭伙伴肩，义气） -->
  <path d="M 90 106 C 84 104 78 102 74 100" fill="none" stroke="#7E8E9E" stroke-width="3.8" stroke-linecap="round"/>

  <!-- 右手（握拳立誓） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 106 106;3 106 106;-4 106 106" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 106 106 C 112 108 116 110 118 116" fill="none" stroke="#7E8E9E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="118" r="3.4" fill="#D0B090"/>
    <path d="M 117 116 Q 121 114 123 118 L 121 120 Q 117 120 117 116 Z" fill="#D0B090"/>
  </g>

  <!-- 忠义火苗（心口一点） -->
  <circle cx="99" cy="110" r="6" fill="#C8402E" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.2;0.45" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 天蝎红星尘 -->
  <g fill="#C8402E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
