<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双子座·撒加·二阶·神之化身·银河星爆惊动圣域">
  <defs>
    <!-- 背景：圣域演武场夜空 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E7E"/>
      <stop offset="52%" stop-color="#2E3E66"/>
      <stop offset="100%" stop-color="#1E2E4E"/>
    </linearGradient>
    <!-- 星光银 -->
    <radialGradient id="star" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C8E0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 暗影紫 -->
    <radialGradient id="shadow" cx="50%" cy="72%" r="50%">
      <stop offset="0%" stop-color="#6E4E8E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6E4E8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜圣衣（黑金交织） -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8C0C8"/>
      <stop offset="100%" stop-color="#8E9AA6"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="gemini-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 善恶双相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.8 -1.8 -0.6 L -1.8 0.9 Q -4.5 0.1 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.8 1.8 -0.6 L 1.8 0.9 Q 4.5 0.1 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0" r="1.6" fill="#A8282E"/>
      <circle cx="4.5" cy="0" r="1.6" fill="#A8282E"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 星光 -->
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 银河星爆（掌心，初窥） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 星爆中心 -->
    <circle cx="120" cy="76" r="14" fill="#E8F0FA" opacity="0.9">
      <animate attributeName="r" values="14;20;14" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 星爆射线 -->
    <g stroke="#C8E0F8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <path d="M 122 62 Q 128 54 136 50">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 132 70 Q 142 64 152 64">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 110 66 Q 104 58 100 50">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 星屑 -->
    <g fill="#C8E0F8">
      <circle cx="140" cy="56" r="1.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="48" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="146" cy="70" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 双子宫（背景） -->
  <g opacity="0.4">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#3E4E7E"/>
    <path d="M 20 20 L 64 20" stroke="#5E6E8E" stroke-width="1.2"/>
  </g>

  <!-- 月光下影子渐生暗面 -->
  <g opacity="0.6">
    <path d="M 70 140 Q 64 148 68 156 Q 74 162 84 156 Q 92 150 90 142 Q 84 138 70 140 Z" fill="#2A1E3E"/>
    <!-- 影暗面（半张狰狞脸） -->
    <circle cx="78" cy="146" r="4" fill="#2A1E3E"/>
    <path d="M 74 144 Q 76 142.5 78 143 M 80 143 Q 82 142.5 84 144" stroke="#5E4E8E" stroke-width="0.9" fill="none"/>
    <path d="M 76 149 Q 78 150.5 80 149" stroke="#5E4E8E" stroke-width="0.9" fill="none"/>
  </g>

  <!-- 圣域地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#22304A" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#3A4A62" stroke-width="1.4" opacity="0.6"/>

  <!-- 少年（6头身，气质如神，掌出星爆） -->
  <!-- 腿 -->
  <path d="M 86 134 L 82 156 L 88 156 L 92 136 Z" fill="#8E9AA6"/>
  <path d="M 102 134 L 110 158 L 104 158 L 98 136 Z" fill="#8E9AA6"/>
  <!-- 青铜圣衣（黑金交织） -->
  <!-- 黑金纹 -->
  <path d="M 90 102 Q 92 108 90 114 M 104 102 Q 102 108 104 114" stroke="#6E4E8E" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 86 114 L 106 114" stroke="#C8D0D8" stroke-width="1.4"/>

  <!-- 头（俊美，束发，明暗交替） -->
  <!-- 眉目圣洁 -->
  <!-- 眼（明暗交替，微幽深） -->
  <!-- 鼻梁 -->
  <!-- 温和（微压暗影） -->

  <!-- 左臂负背 -->
  <path d="M 88 100 C 82 104 80 110 82 118" fill="none" stroke="#A8B4BE" stroke-width="4" stroke-linecap="round"/>

  <!-- 右臂推出银河星爆 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 104 100 C 110 96 114 92 116 86" fill="none" stroke="#A8B4BE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="117" cy="84" r="3" fill="#DCC4A0"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8E0F8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#gemini-face" transform="translate(97,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 93 79 Q 97 76 101 79 Q 99 74 97 74 Q 95 74 93 79 Z" fill="#2E2620"/>
  <path d="M 88 86 Q 92 81 97 81 Q 102 81 106 86 Q 102 82 97 82 Q 92 82 88 86 Z" fill="#2E2620"/>
</svg>
