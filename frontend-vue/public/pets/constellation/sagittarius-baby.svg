<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="射手座·艾俄洛斯·二阶·黄金之弓·一箭穿云射天狼">
  <defs>
    <!-- 背景：圣域月夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4E7E"/>
      <stop offset="52%" stop-color="#2E3E66"/>
      <stop offset="100%" stop-color="#1E2E4E"/>
    </linearGradient>
    <!-- 箭光金 -->
    <radialGradient id="arrow" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜训练服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E9E"/>
      <stop offset="100%" stop-color="#6E7E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：少年面容·眉目温厚·眼含坚毅（脸中心 0,0） -->
    <g id="sag-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 仁厚·星目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="48" r="40" fill="url(#moon)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="20" r="1.1"/>
    <circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 箭光 -->
  <circle cx="100" cy="70" r="60" fill="url(#arrow)">
    <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 一箭穿云（箭光划破夜空，射向月/天狼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 箭身 -->
    <line x1="112" y1="104" x2="148" y2="60" stroke="#FFF3C4" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 箭头 -->
    <path d="M 150 58 L 158 52 L 152 62 Z" fill="#FFF3C4"/>
    <!-- 箭羽 -->
    <path d="M 116 100 L 110 96 L 114 104 Z" fill="#E8C878"/>
    <!-- 箭尾光 -->
    <path d="M 112 104 Q 104 110 108 118" stroke="#FFF3C4" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 天狼星（箭头所指，星芒） -->
  <g>
    <circle cx="158" cy="50" r="4" fill="#FFF3C4" opacity="0.8">
      <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#FFF3C4" stroke-width="1.2" opacity="0.6" stroke-linecap="round">
      <path d="M 158 44 L 158 38 M 164 50 L 170 50 M 152 50 L 146 50"/>
    </g>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#22304A" opacity="0.8"/>

  <!-- 青铜少年（6头身，张弓搭箭） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#6E7E7E"/>
  <path d="M 108 132 L 116 156 L 110 156 L 104 134 Z" fill="#6E7E7E"/>
  <!-- 训练服 -->
  <path d="M 90 94 Q 86 110 92 132 Q 102 138 110 132 Q 116 110 112 94 Q 102 88 90 94 Z" fill="url(#robe)" stroke="#5E6E6E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 90 112 L 112 112" stroke="#A8B8B8" stroke-width="1.4"/>

  <!-- 头（面部模板，侧向拉弓） -->
  <use href="#sag-face" transform="translate(102,86) scale(1)"/>

  <!-- 左臂（执弓前伸） -->
  <path d="M 92 96 C 86 98 82 100 80 104" fill="none" stroke="#8E9E9E" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="78" cy="106" r="3" fill="#DCC8A8"/>

  <!-- 黄金之弓（左手持） -->
  <path d="M 66 76 Q 76 96 70 116 Q 84 104 92 96 Q 82 96 70 108" fill="none" stroke="#E8C878" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 弓弦 -->
  <line x1="66" y1="76" x2="92" y2="96" stroke="#C8B098" stroke-width="1.2"/>

  <!-- 右手（拉弦，搭箭） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 110 96 C 116 98 120 100 122 104" fill="none" stroke="#8E9E9E" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="124" cy="106" r="3" fill="#DCC8A8"/>
    <!-- 拉弦手势 -->
    <path d="M 124 104 L 128 102" stroke="#C8B098" stroke-width="1.2"/>
  </g>

  <!-- 箭光星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
