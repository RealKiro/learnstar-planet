<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="水瓶座·卡妙·二阶·冰原严师·授徒挡风寒">
  <defs>
    <!-- 背景：冰原风雪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8DCE8"/>
      <stop offset="52%" stop-color="#A8C4D4"/>
      <stop offset="100%" stop-color="#8EACBE"/>
    </linearGradient>
    <!-- 风雪蓝 -->
    <radialGradient id="snow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#E8F4FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F4FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜训练服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E9E9E"/>
      <stop offset="100%" stop-color="#6E7E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：少年面容·剑眉·凤目清冷·嘴角一丝温度（脸中心 0,0） -->
    <g id="aquarius-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D0BCA0" stroke-width="0.8"/>
      <!-- 短发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -8.5 -3.5 Q -5 -8 0 -8 Q 5 -8 8.5 -3.5 Q 5 -7 0 -7 Q -5 -7 -8.5 -3.5 Z" fill="#2E2620"/>
      <!-- 剑眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 凤目清冷 -->
      <path d="M -7 0.4 Q -4.5 -0.8 -2 -0.2 L -2 1 Q -4.5 0.4 -7 1.6 Z" fill="#1E1008"/>
      <path d="M 7 0.4 Q 4.5 -0.8 2 -0.2 L 2 1 Q 4.5 0.4 7 1.6 Z" fill="#1E1008"/>
      <circle cx="-4.2" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.2" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-4.2" cy="0.3" r="0.5" fill="#C8E8F8"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C8B098" stroke-width="1" stroke-linecap="round"/>
      <!-- 一丝温度 -->
      <path d="M -3 5.6 Q 0 7.2 3 5.6" fill="none" stroke="#A89070" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 风雪 -->
  <circle cx="100" cy="96" r="80" fill="url(#snow)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 飘雪 -->
  <g fill="#E8F4FA" opacity="0.8">
    <circle cx="30" cy="40" r="1.4"><animate attributeName="cy" values="40;56;40" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="30" r="1.2"><animate attributeName="cy" values="30;46;30" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="20" r="1"><animate attributeName="cy" values="20;36;20" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 冰川（背景） -->
  <g opacity="0.6">
    <path d="M 20 120 L 44 96 L 64 110 L 84 100 L 104 116 L 130 102 L 152 118 L 172 108 L 192 120 L 200 130 L 200 200 L 0 200 Z" fill="#A8C4D4"/>
    <path d="M 20 120 L 44 96 L 64 110 L 84 100 L 104 116 L 130 102 L 152 118 L 172 108 L 192 120" stroke="#8EACBE" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- 地面（冰原） -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#9AB6C8" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#B8D0E0" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜少年（立于风雪中，冰气绕身，默默挡风） -->
  <!-- 腿 -->
  <path d="M 96 134 L 92 156 L 98 156 L 102 136 Z" fill="#6E7E7E"/>
  <path d="M 112 134 L 120 158 L 114 158 L 108 136 Z" fill="#6E7E7E"/>
  <!-- 训练服 -->
  <path d="M 94 96 Q 90 112 96 132 Q 106 138 114 132 Q 120 112 116 96 Q 106 90 94 96 Z" fill="url(#robe)" stroke="#5E6E6E" stroke-width="1"/>
  <!-- 冰气绕身 -->
  <circle cx="105" cy="104" r="30" fill="url(#snow)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.25;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 腰带 -->
  <path d="M 94 114 L 116 114" stroke="#A8B8B8" stroke-width="1.4"/>

  <!-- 头（面部模板，口鼻呵白气） -->
  <use href="#aquarius-face" transform="translate(105,88) scale(1)"/>
  <!-- 呵出的白气 -->
  <path d="M 96 96 Q 90 92 86 88" stroke="#E8F4FA" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 弟子（左，冻得发抖，被挡在风口后） -->
  <g opacity="0.85">
    <path d="M 58 138 L 56 126 L 61 123 L 66 126 L 66 138 Z" fill="#7E8E9E"/>
    <circle cx="61" cy="120" r="4.5" fill="#E0C8A8"/>
    <path d="M 58 117 Q 61 115 64 117 Q 63 119 61 119 Q 59 119 58 117 Z" fill="#2E2620"/>
    <!-- 发抖 -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0.8 0;0 0" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <!-- 风口（右侧风雪吹向弟子） -->
  <g stroke="#E8F4FA" stroke-width="1.3" opacity="0.5" stroke-linecap="round">
    <path d="M 170 90 L 150 96 L 130 102">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 170 100 L 148 106 L 126 112">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 左臂（张开，挡风） -->
  <path d="M 96 100 C 88 104 82 108 78 114" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="116" r="3" fill="#DCC8A8"/>

  <!-- 右手（负背，严师） -->
  <path d="M 114 100 C 120 104 122 110 120 118" fill="none" stroke="#8E9E9E" stroke-width="4" stroke-linecap="round"/>

  <!-- 冰晶星尘 -->
  <g fill="#C8E8F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
