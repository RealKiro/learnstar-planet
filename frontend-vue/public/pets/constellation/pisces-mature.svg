<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双鱼座·阿布罗狄·四阶·血色终章·玫瑰漫天护圣域">
  <defs>
    <!-- 背景：双鱼宫前圣战绯红 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E3E4E"/>
      <stop offset="52%" stop-color="#6E3242"/>
      <stop offset="100%" stop-color="#5E2634"/>
    </linearGradient>
    <!-- 血色玫红 -->
    <radialGradient id="rose" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#E8627E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8627E" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火金 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银双鱼圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：绝美面容·细眉·桃花眼从容 -->
    <g id="pisces-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 绝美·桃花眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1 Q -4.5 0.2 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.4 1.8 -0.4 L 1.8 1 Q 4.5 0.2 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.5" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 战火 -->
  <circle cx="156" cy="52" r="52" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 血色玫红 -->
  <circle cx="100" cy="96" r="76" fill="url(#rose)">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 玫瑰漫天 -->
  <g fill="#E8627E" opacity="0.9">
    <circle cx="56" cy="60" r="5"><animate attributeName="cy" values="60;50;60" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="148" cy="52" r="5"><animate attributeName="cy" values="52;42;52" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="4.5"><animate attributeName="cy" values="90;80;90" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="100" r="4"><animate attributeName="cy" values="100;90;100" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <!-- 黑玫瑰·吸魂（暗玫） -->
  <g fill="#8E3E5E" opacity="0.85">
    <circle cx="70" cy="80" r="4"><animate attributeName="cy" values="80;72;80" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="136" cy="72" r="4"><animate attributeName="cy" values="72;64;72" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 敌群（左上，被玫瑰吸魂） -->
  <g opacity="0.5">
    <path d="M 40 40 Q 42 30 46 27 Q 50 29 50 40 Z" fill="#241A2E"/>
  </g>

  <!-- 双鱼宫（背景） -->
  <g opacity="0.4">
    <path d="M 128 20 L 188 20 L 180 34 Q 158 42 140 38 Z" fill="#3E2A2E"/>
    <path d="M 128 20 L 188 20" stroke="#5E4A4E" stroke-width="1.2"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#5E2634" opacity="0.8"/>
  <path d="M 0 152 L 200 152" stroke="#7E3E4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银双鱼圣斗士（立宫前，血色染身仍绽笑） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#B8C4D0"/>
  <path d="M 108 132 L 116 156 L 110 156 L 104 134 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 122 Q 102 130 114 122 Q 118 116 114 108 Q 108 120 100 116 Q 92 120 92 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 92 Q 88 106 94 122 Q 104 128 114 122 Q 120 106 116 92 Q 104 86 92 92 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 血色染身 -->
  <path d="M 96 100 Q 98 106 96 112" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 110 104 Q 112 110 110 116" stroke="#E8627E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 血色藤蔓 -->
  <path d="M 90 96 Q 86 104 90 112" stroke="#E8627E" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="88" cy="104" r="2.4" fill="#E8627E"/>
  <!-- 圣衣纹 -->
  <path d="M 96 98 L 100 116 M 110 98 L 106 116" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 108 L 116 108" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#pisces-face" transform="translate(104,84) scale(1)"/>

  <!-- 左臂（玫瑰藤绕，护身） -->
  <path d="M 94 96 C 88 100 86 106 88 114" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="88" cy="116" r="3.2" fill="#E2C8A8"/>

  <!-- 右手（扬起，黑玫瑰齐飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 112 96 C 118 92 122 88 124 82" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="125" cy="80" r="3.2" fill="#E2C8A8"/>
    <!-- 掌心血玫 -->
    <circle cx="126" cy="78" r="8" fill="#E8627E">
      <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 玫瑰星尘 -->
  <g fill="#E8627E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
