<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="射手座·艾俄洛斯·四阶·圣战牺牲·护神中箭含笑陨落">
  <defs>
    <!-- 背景：圣战乱局烽火圣域 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E3A3E"/>
      <stop offset="52%" stop-color="#462A2E"/>
      <stop offset="100%" stop-color="#321E22"/>
    </linearGradient>
    <!-- 圣火金 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 仁心化光 -->
    <radialGradient id="light" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银射手圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：青年面容·含笑·眼神安详 -->
    <g id="sag-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 仁厚·星目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 圣火 -->
  <circle cx="156" cy="52" r="52" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 仁心化光（怀中婴儿） -->
  <circle cx="110" cy="100" r="40" fill="url(#light)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 烽火圣域（背景） -->
  <g opacity="0.5">
    <path d="M 20 20 L 64 20 L 58 32 Q 40 40 28 36 Z" fill="#3E2A2E"/>
    <path d="M 20 20 L 64 20" stroke="#5E4A4E" stroke-width="1.2"/>
    <path d="M 30 60 Q 26 52 30 44" stroke="#E8A84E" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#2A1E22" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#3E2A2E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银射手圣斗士（抱婴突围，背后中箭，血染圣衣） -->
  <!-- 腿（踉跄） -->
  <path d="M 92 136 L 88 158 L 94 158 L 98 138 Z" fill="#B8C4D0"/>
  <path d="M 108 136 L 116 160 L 110 160 L 104 138 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 126 Q 102 134 114 126 Q 118 120 114 112 Q 108 124 100 120 Q 92 124 92 126 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 92 96 Q 88 110 94 126 Q 104 132 114 126 Q 120 110 116 96 Q 104 90 92 96 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 中箭（背后，箭头露出胸前） -->
  <path d="M 84 92 Q 88 96 92 100" stroke="#C8B098" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 90 99 L 96 103 L 92 105 Z" fill="#C8B098"/>
  <!-- 染血痕 -->
  <path d="M 96 104 Q 98 110 96 116" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 110 108 Q 112 114 110 120" stroke="#B8432E" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <!-- 射手纹 -->
  <path d="M 96 102 L 100 120 M 110 102 L 106 120" stroke="#F0F4F8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 112 L 116 112" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#sag-face" transform="translate(104,88) scale(1)"/>

  <!-- 怀中襁褓（小雅典娜，仁光） -->
  <g>
    <path d="M 118 108 Q 124 104 130 108 Q 132 114 128 118 Q 120 120 116 114 Z" fill="#F0E8E0" stroke="#C8BCB0" stroke-width="1"/>
    <circle cx="124" cy="110" r="4" fill="#E8C8A8"/>
    <!-- 襁褓仁光 -->
    <circle cx="124" cy="112" r="12" fill="#FFF3C4" opacity="0.3">
      <animate attributeName="r" values="12;17;12" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右臂（紧护襁褓） -->
  <path d="M 114 98 C 118 102 120 106 120 110" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="121" cy="112" r="3" fill="#DCC8A8"/>

  <!-- 左臂（托付同伴，前伸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 94 100 C 86 104 82 108 80 112" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="79" cy="114" r="3" fill="#DCC8A8"/>
    <!-- 托付之光 -->
    <path d="M 79 116 Q 70 120 72 128" stroke="#FFF3C4" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 英魂化光（临终，含笑） -->
  <g fill="#FFF3C4">
    <circle cx="104" cy="70">
      <animate attributeName="cy" values="70;56;70" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="116" cy="64">
      <animate attributeName="cy" values="64;50;64" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
