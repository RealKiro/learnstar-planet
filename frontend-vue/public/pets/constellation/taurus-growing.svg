<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="金牛座·阿鲁迪巴·三阶·巨型号角·一角震山">
  <defs>
    <!-- 背景：山谷群峰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B8A0"/>
      <stop offset="52%" stop-color="#8E9E86"/>
      <stop offset="100%" stop-color="#6E7E68"/>
    </linearGradient>
    <!-- 冲撞气浪 -->
    <radialGradient id="burst" cx="50%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜金牛圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="100%" stop-color="#D0B090"/>
    </radialGradient>

    <!-- 头部模板：圆脸·粗眉·虎目如炬·咧嘴（脸中心 0,0） -->
    <g id="taurus-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 国字·宽鼻 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冲撞气浪 -->
  <circle cx="100" cy="140" r="70" fill="url(#burst)">
    <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 群峰 -->
  <path d="M 0 150 Q 40 132 80 140 Q 120 148 160 134 Q 180 128 200 134 L 200 200 L 0 200 Z" fill="#8E9E86" opacity="0.6"/>

  <!-- 碎石四溅 -->
  <g fill="#7E8268">
    <circle cx="56" cy="140" r="3"><animate attributeName="cy" values="140;132;140" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="152" r="2.4"><animate attributeName="cy" values="152;144;152" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="138" r="2.8"><animate attributeName="cy" values="138;130;138" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 158 L 200 158 L 200 200 L 0 200 Z" fill="#6E7E68" opacity="0.8"/>
  <path d="M 0 158 L 200 158" stroke="#7E8E78" stroke-width="1.4" opacity="0.6"/>

  <!-- 青铜金牛圣斗士（低头一角，冲撞） -->
  <!-- 腿（冲撞姿态） -->
  <path d="M 92 134 L 86 158 L 93 158 L 98 136 Z" fill="#9EAEA0"/>
  <path d="M 112 134 L 122 162 L 115 162 L 108 136 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 92 124 Q 102 132 114 124 Q 118 118 114 110 Q 108 122 100 118 Q 92 122 92 124 Z" fill="url(#armor)"/>
  <!-- 上身（魁梧如塔） -->
  <path d="M 92 92 Q 88 108 94 124 Q 104 130 114 124 Q 120 108 116 92 Q 104 84 92 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1.2"/>
  <!-- 宽肩 -->
  <path d="M 88 90 Q 92 86 104 86 Q 116 86 120 90 L 118 96 L 90 96 Z" fill="#AEBCA8"/>
  <!-- 圣衣纹 -->
  <path d="M 96 98 L 100 118 M 110 98 L 106 118" stroke="#D8E4D8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 92 108 L 116 108" stroke="#D8E4D8" stroke-width="1.6"/>

  <!-- 头（面部模板，低头一角） -->
  <use href="#taurus-face" transform="translate(104,84) scale(1)"/>

  <!-- 左臂（冲撞前伸） -->
  <path d="M 94 96 C 88 100 84 104 82 110" fill="none" stroke="#C8D0C8" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="81" cy="112" r="3.4" fill="#D0B090"/>

  <!-- 右臂（巨型号角前撞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 112 96 C 120 100 126 104 130 110" fill="none" stroke="#C8D0C8" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="132" cy="112" r="3.4" fill="#D0B090"/>
    <!-- 冲撞气浪（前） -->
    <path d="M 134 112 Q 146 108 152 116" stroke="#FFF7E0" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 巨型号角音浪（吼） -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <path d="M 90 84 Q 80 78 76 70">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 92 88 Q 80 82 74 74">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 尘金 -->
  <g fill="#FFF7E0">
    <circle cx="48" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
