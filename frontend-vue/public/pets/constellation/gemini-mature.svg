<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="双子座·撒加·四阶·银河星爆·善恶争抢跪地挣扎">
  <defs>
    <!-- 背景：双子宫前破碎星穹 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3A5E"/>
      <stop offset="52%" stop-color="#3A2A4A"/>
      <stop offset="100%" stop-color="#2A1E34"/>
    </linearGradient>
    <!-- 银河银 -->
    <radialGradient id="star" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C8E0F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C8E0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 白银双子圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#B8C4D0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>

    <!-- 头部模板：俊美面容·一半狰狞一半悲悯（脸中心 0,0） -->
    <g id="gemini-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 善恶双相 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.8 -1.8 -0.6 L -1.8 0.9 Q -4.5 0.1 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.8 1.8 -0.6 L 1.8 0.9 Q 4.5 0.1 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0" r="1.6" fill="#A8282E"/>
      <circle cx="4.5" cy="0" r="1.6" fill="#A8282E"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 银河星爆（大，中央） -->
  <circle cx="100" cy="90" r="84" fill="url(#star)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 战火 -->
  <circle cx="156" cy="52" r="50" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 群星破碎（星屑四溅） -->
  <g fill="#C8E0F8">
    <circle cx="30" cy="60" r="1.5"><animate attributeName="cy" values="60;70;60" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="36" r="1.2"><animate attributeName="cy" values="36;46;36" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="80" r="1.4"><animate attributeName="cy" values="80;90;80" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="36" r="1.2"><animate attributeName="cy" values="36;46;36" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 星爆射线（破碎） -->
  <g stroke="#C8E0F8" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
    <path d="M 100 60 Q 92 48 96 38">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 80 Q 134 74 146 76">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 80 80 Q 66 74 54 76">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 双子宫（背景） -->
  <g opacity="0.4">
    <path d="M 128 20 L 188 20 L 180 34 Q 158 42 140 38 Z" fill="#3E2A4E"/>
    <path d="M 128 20 L 188 20" stroke="#5E4A6E" stroke-width="1.2"/>
  </g>

  <!-- 圣域地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#2A1E34" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#3E2A4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白银双子圣斗士（跪地挣扎） -->
  <!-- 腿（跪） -->
  <path d="M 96 134 L 92 156 L 99 156 L 102 136 Z" fill="#B8C4D0"/>
  <path d="M 110 134 L 118 160 L 111 160 L 104 136 Z" fill="#B8C4D0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 94 124 Q 104 132 116 124 Q 120 118 116 110 Q 110 122 102 118 Q 94 122 94 124 Z" fill="url(#armor)"/>
  <!-- 上身（前倾挣扎） -->
  <path d="M 94 94 Q 90 108 96 124 Q 106 130 116 124 Q 122 108 118 94 Q 106 88 94 94 Z" fill="url(#armor)" stroke="#8E9CAC" stroke-width="1.2"/>
  <!-- 黑金纹 -->
  <path d="M 98 100 L 102 118 M 112 100 L 108 118" stroke="#6E4E8E" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 94 108 L 118 108" stroke="#F0F4F8" stroke-width="1.6"/>

  <!-- 头（面部模板，明暗交替） -->
  <use href="#gemini-face" transform="translate(106,86) scale(1)"/>

  <!-- 左臂（撑地，挣扎） -->
  <path d="M 96 98 C 90 104 88 110 90 118" fill="none" stroke="#E8ECF0" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="90" cy="120" r="3.2" fill="#D0B8A0"/>

  <!-- 右手（按头，跪地挣扎） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 116 98;3 116 98;-4 116 98" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 114 98 C 120 96 122 92 122 86" fill="none" stroke="#E8ECF0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="122" cy="84" r="3.2" fill="#D0B8A0"/>
  </g>

  <!-- 善恶争抢光（身体两侧，明暗） -->
  <circle cx="94" cy="104" r="20" fill="#C8E0F8" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.1;0.2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="122" cy="104" r="20" fill="#6E4E8E" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.12;0.25" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 星爆星尘 -->
  <g fill="#C8E0F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
