<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="水瓶座·卡妙·三阶·曙光女神·绝对零度冰封大地">
  <defs>
    <!-- 背景：冰原夜寒星 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E8EAE"/>
      <stop offset="52%" stop-color="#5E7E9E"/>
      <stop offset="100%" stop-color="#4E6E8E"/>
    </linearGradient>
    <!-- 冰晶蓝 -->
    <radialGradient id="ice" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 曙光银 -->
    <radialGradient id="dawn" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#E8F4FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F4FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜水瓶圣衣 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0C8"/>
      <stop offset="100%" stop-color="#9EAEA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E0CC"/>
      <stop offset="100%" stop-color="#DCC8A8"/>
    </radialGradient>

    <!-- 头部模板：少年面容·剑眉·凤目如冰 -->
    <g id="aquarius-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 清冷·凤目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 寒星 -->
  <g fill="#E8F4FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="30" r="1.2"/>
    <circle cx="180" cy="70" r="1"/>
  </g>
  <!-- 冰晶蓝 -->
  <circle cx="100" cy="92" r="84" fill="url(#ice)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 绝对零度（双拳并出，冰封大地） -->
  <!-- 冰封大地（下方凝霜） -->
  <g opacity="0.7">
    <path d="M 0 150 Q 40 142 90 148 Q 140 154 200 146 L 200 200 L 0 200 Z" fill="#A8C8D8"/>
    <path d="M 30 158 Q 60 152 90 156 Q 130 160 170 154" stroke="#E8F4FA" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 凝霜晶 -->
    <path d="M 60 140 L 62 132 L 64 140 Z" fill="#E8F4FA" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M 140 136 L 142 128 L 144 136 Z" fill="#E8F4FA" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.8s" repeatCount="indefinite"/></path>
  </g>

  <!-- 曙光（自双拳涌出） -->
  <circle cx="100" cy="70" r="30" fill="url(#dawn)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#4E6E8E" opacity="0.7"/>

  <!-- 青铜水瓶圣斗士（6头身，双拳并出） -->
  <!-- 腿 -->
  <path d="M 90 132 L 86 154 L 92 154 L 96 134 Z" fill="#9EAEA0"/>
  <path d="M 106 132 L 114 156 L 108 156 L 102 134 Z" fill="#9EAEA0"/>
  <!-- 圣衣（下摆） -->
  <path d="M 90 122 Q 100 130 112 122 Q 116 116 112 108 Q 106 120 98 116 Q 90 120 90 122 Z" fill="url(#armor)"/>
  <!-- 上身 -->
  <path d="M 90 92 Q 86 106 92 122 Q 102 128 112 122 Q 118 106 114 92 Q 102 86 90 92 Z" fill="url(#armor)" stroke="#7E8E80" stroke-width="1"/>
  <!-- 水瓶纹 -->
  <path d="M 94 98 L 98 116 M 108 98 L 104 116" stroke="#E8F0E8" stroke-width="1.2" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 90 108 L 114 108" stroke="#E8F0E8" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#aquarius-face" transform="translate(102,84) scale(1)"/>

  <!-- 左拳（并出） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 92 96 C 88 90 86 84 86 78" fill="none" stroke="#C8D0C8" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="85" cy="76" r="3.4" fill="#DCC8A8"/>
    <!-- 拳上曙光 -->
    <circle cx="85" cy="74" r="8" fill="url(#dawn)">
      <animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右拳（并出） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 112 96 C 116 90 118 84 118 78" fill="none" stroke="#C8D0C8" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="119" cy="76" r="3.4" fill="#DCC8A8"/>
    <circle cx="119" cy="74" r="8" fill="url(#dawn)">
      <animate attributeName="r" values="8;12;8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 绝对零度光带（双拳间） -->
  <path d="M 85 74 Q 102 64 119 74" stroke="#E8F4FA" stroke-width="1.8" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 冰晶星尘 -->
  <g fill="#C8E8F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
