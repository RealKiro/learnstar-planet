<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="棘龙·四阶·护河初成·跳河张帆挡急流叼兽回岸帆挂珠">
  <defs>
    <!-- 背景：涨水河口 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B898"/>
      <stop offset="52%" stop-color="#A8987A"/>
      <stop offset="100%" stop-color="#8EAE92"/>
    </linearGradient>
    <!-- 护河威光 -->
    <radialGradient id="glow" cx="52%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#F0E4C0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0E4C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年棘龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8BCA8"/>
      <stop offset="100%" stop-color="#8CA48C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 涨水（浪急） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9AAE8E" opacity="0.8"/>
  <g stroke="#C8D8BC" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 20 158 Q 60 152 100 158 Q 140 164 180 158">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 172 Q 70 166 110 172 Q 150 178 190 172">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被叼回的小兽（棘龙嘴里） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="148" rx="5.5" ry="4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="96" cy="141" r="3.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
    <path d="M 94 143 L 92 148 M 99 143 L 101 148" stroke="#AAA090" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 少年棘龙（跳河，张帆挡急流，叼兽回岸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="112" cy="132" rx="18" ry="12" fill="url(#skin)" stroke="#6E8670" stroke-width="1.1"/>
    <ellipse cx="108" cy="136" rx="10" ry="6.5" fill="#D8DCC8" opacity="0.7"/>
    <!-- 背帆（大张，挡流） -->
    <path d="M 101 124 Q 107 100 120 100 Q 126 112 131 124 Q 116 114 101 124 Z" fill="#E09070"/>
    <g stroke="#C8785C" stroke-width="0.9" fill="none" opacity="0.6">
      <path d="M 106 118 L 114 108 M 112 122 L 121 110 M 117 124 L 126 114"/>
    </g>
    <!-- 腿（踏水） -->
    <path d="M 102 140 L 100 148 M 124 140 L 126 148" stroke="#6E8670" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾（甩水） -->
    <path d="M 130 136 Q 142 130 148 120" stroke="url(#skin)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 130 136;6 130 136;0 130 136" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 短手（搂兽） -->
    <path d="M 98 126 L 92 132" stroke="url(#skin)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年棘龙头（叼兽，含威含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="112" rx="11.5" ry="10" fill="url(#skin)" stroke="#6E8670" stroke-width="0.9"/>
    <!-- 眼（含威含护） -->
    <path d="M 104 110 Q 106 108.6 108 110 M 117 110 Q 119 108.6 120 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="106" cy="111" r="2.3" fill="#24180E"/>
    <circle cx="106.6" cy="110.4" r="0.75" fill="#FFF"/>
    <circle cx="118.5" cy="111" r="2.3" fill="#24180E"/>
    <circle cx="119.1" cy="110.4" r="0.75" fill="#FFF"/>
    <!-- 嘴（叼兽，张开） -->
    <path d="M 103 116 Q 112 119 121 116" fill="none" stroke="#6E8670" stroke-width="1" stroke-linecap="round"/>
    <path d="M 106 116 L 105 119 M 114 117.4 L 114 120" stroke="#6E8670" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 帆挂的水珠 -->
    <g fill="#C8D8CC" opacity="0.7">
      <circle cx="110" cy="106" r="1.3">
        <animate attributeName="cy" values="106;112;106" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 护河星尘 -->
  <g fill="#F0E4C0">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
