<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梁龙·五阶·群之长颈·立泽探颈过水面卷下困枝指迷途">
  <defs>
    <!-- 背景：沼泽夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B0"/>
      <stop offset="52%" stop-color="#C8BC90"/>
      <stop offset="100%" stop-color="#94AA98"/>
    </linearGradient>
    <!-- 长颈神光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E4E4CC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E4E4CC" stop-opacity="0"/>
    </radialGradient>
    <!-- 梁龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B8A4"/>
      <stop offset="100%" stop-color="#82A08A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="110" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 沼泽 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8AB2A2" opacity="0.8"/>
  <g stroke="#A8D0C0" stroke-width="1.4" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 20 160 Q 60 154 100 160 Q 140 166 180 160"/>
  </g>

  <!-- 困在树枝的小兽（左上，被卷下） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="48" cy="104" rx="5.5" ry="4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="48" cy="97" r="3.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <!-- 困枝 -->
    <path d="M 38 92 L 58 94" stroke="#6E5640" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 迷途的小兽（右前，指方向） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="146" rx="6" ry="4.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="150" cy="139" r="3.8" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
  </g>

  <!-- 群之长颈梁龙（立泽，探颈） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如柱） -->
    <ellipse cx="112" cy="132" rx="18" ry="12" fill="url(#skin)" stroke="#7A947E" stroke-width="1.1"/>
    <ellipse cx="108" cy="137" rx="11" ry="6.5" fill="#E0E8D8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 101 141 L 99 149 M 125 141 L 127 149" stroke="#7A947E" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 130 136 Q 142 130 150 120" stroke="url(#skin)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 长颈（如柱探水面，够高卷低） -->
    <path d="M 106 126 Q 100 112 108 98 Q 118 84 136 78" stroke="url(#skin)" stroke-width="7" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 106 126;3 106 126;0 106 126" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 下探卷困枝（颈） -->
    <path d="M 130 80 Q 118 90 112 100" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 群之长颈头（含威含温，指迷途） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="136" cy="76" rx="8" ry="7" fill="url(#skin)" stroke="#7A947E" stroke-width="0.8"/>
    <circle cx="132" cy="74.5" r="1.8" fill="#24180E"/>
    <circle cx="132.4" cy="74.1" r="0.6" fill="#FFF"/>
    <circle cx="140" cy="74.5" r="1.8" fill="#24180E"/>
    <circle cx="140.4" cy="74.1" r="0.6" fill="#FFF"/>
    <path d="M 134 79 L 132 81.6 L 136 81 Z" fill="#8E9278"/>
    <!-- 额间长颈光 -->
    <circle cx="136" cy="69" r="2.6" fill="#F8F4D8" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 指迷途的光带 -->
    <path d="M 140 80 Q 148 96 152 116" stroke="#F8F4D8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.16;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 长颈星尘 -->
  <g fill="#F8F4D8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
