<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="猛犸象·四阶·护群初成·长牙横档护幼象狼群退散">
  <defs>
    <!-- 背景：冰原雪坡夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D4AC"/>
      <stop offset="52%" stop-color="#C8B084"/>
      <stop offset="100%" stop-color="#94AEC4"/>
    </linearGradient>
    <!-- 护群威光 -->
    <radialGradient id="glow" cx="52%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#F0F8F4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0F8F4" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年猛犸绒毛（如甲） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AC885C"/>
      <stop offset="100%" stop-color="#907448"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪坡 -->
  <g fill="#C8D8E4" opacity="0.6">
    <path d="M 0 118 Q 60 110 130 116 Q 170 120 200 114 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#EAF2F6" opacity="0.9"/>

  <!-- 被护住的幼象（左后） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="76" cy="144" rx="9" ry="7" fill="#A08058" stroke="#8E7048" stroke-width="0.8"/>
    <circle cx="76" cy="135" r="5.5" fill="#A08058" stroke="#8E7048" stroke-width="0.7"/>
    <path d="M 72 133.6 Q 70 131.6 70 129.6" stroke="#A08058" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="74" cy="134" r="1.3" fill="#24180E"/>
    <circle cx="78.6" cy="134" r="1.3" fill="#24180E"/>
  </g>

  <!-- 退散的狼群（右，退走） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="152" cy="142" rx="9" ry="5.5" fill="#6E7A6E" stroke="#5E6A5E" stroke-width="0.8"/>
    <circle cx="162" cy="136" r="4.5" fill="#6E7A6E" stroke="#5E6A5E" stroke-width="0.7"/>
    <path d="M 145 144 L 138 146" stroke="#6E7A6E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="160.4" cy="135" r="1.1" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="170" cy="144" rx="7" ry="4.4" fill="#626E62" stroke="#546054" stroke-width="0.7"/>
    <circle cx="178" cy="140" r="3.6" fill="#626E62"/>
  </g>

  <!-- 少年猛犸（长牙横档，护幼象） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如墙） -->
    <ellipse cx="112" cy="132" rx="19" ry="13" fill="url(#fur)" stroke="#7E6240" stroke-width="1.1"/>
    <!-- 腿（扎稳） -->
    <path d="M 102 142 L 100 151 M 124 142 L 126 151" stroke="#7E6240" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 长牙（横档，如月） -->
    <path d="M 98 128 Q 84 128 74 122" stroke="#E8E0CC" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M 102 128 Q 114 130 122 134" stroke="#E8E0CC" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年猛犸头（含威含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="114" rx="11.5" ry="10.5" fill="url(#fur)" stroke="#7E6240" stroke-width="0.9"/>
    <!-- 眼（含威含护） -->
    <path d="M 104 112 Q 106 110.6 108 112 M 118 112 Q 120 110.6 121 112" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="106" cy="113" r="2.3" fill="#24180E"/>
    <circle cx="106.6" cy="112.4" r="0.75" fill="#FFF"/>
    <circle cx="119.5" cy="113" r="2.3" fill="#24180E"/>
    <circle cx="120.1" cy="112.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 108 118 L 116 118 L 112 120.5 Z" fill="#5E4628"/>
    <!-- 耳 -->
    <path d="M 103 107 Q 98 103 99 99 Q 103 101 105 105 Z" fill="#98784E"/>
    <path d="M 121 107 Q 126 103 125 99 Q 121 101 119 105 Z" fill="#98784E"/>
    <!-- 象鸣威纹 -->
    <g stroke="#D0E0E0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 122 104 Q 130 100 136 96">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 夕照星尘 -->
  <g fill="#F0F8F4">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
