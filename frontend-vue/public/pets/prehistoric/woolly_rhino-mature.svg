<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰河犀牛·四阶·护群初成·角横挡狼群护幼犀等母来">
  <defs>
    <!-- 背景：冰原夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4E8"/>
      <stop offset="52%" stop-color="#B8C8D0"/>
      <stop offset="100%" stop-color="#92AEB8"/>
    </linearGradient>
    <!-- 护群威光 -->
    <radialGradient id="glow" cx="52%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#E8F4F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F4F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年冰犀厚毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AC885C"/>
      <stop offset="100%" stop-color="#90744A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪坡 -->
  <g fill="#C8D8E4" opacity="0.6">
    <path d="M 0 118 Q 60 110 130 116 Q 170 120 200 114 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#EAF2F6" opacity="0.9"/>

  <!-- 被护住的幼犀（左后） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="76" cy="144" rx="9" ry="7" fill="#A08058" stroke="#8E7048" stroke-width="0.8"/>
    <circle cx="76" cy="135" r="5.5" fill="#A08058" stroke="#8E7048" stroke-width="0.7"/>
    <path d="M 72 133.6 Q 70 131.6 70 129.6" stroke="#A08058" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="74" cy="134" r="1.3" fill="#24180E"/>
    <circle cx="78.6" cy="134" r="1.3" fill="#24180E"/>
  </g>

  <!-- 退散的狼群（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="154" cy="142" rx="9" ry="5.5" fill="#6E7A6E" stroke="#5E6A5E" stroke-width="0.8"/>
    <circle cx="164" cy="136" r="4.5" fill="#6E7A6E" stroke="#5E6A5E" stroke-width="0.7"/>
    <path d="M 147 144 L 140 146" stroke="#6E7A6E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="162.4" cy="135" r="1.1" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年冰犀（角横挡，护幼犀） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如墙） -->
    <ellipse cx="112" cy="132" rx="18" ry="12.5" fill="url(#fur)" stroke="#7E6240" stroke-width="1.1"/>
    <!-- 腿（扎稳） -->
    <path d="M 102 141 L 100 150 M 124 141 L 126 150" stroke="#7E6240" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 130 136 Q 138 134 141 139" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年冰犀头（角如刃横挡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="112" rx="11.5" ry="10" fill="url(#fur)" stroke="#7E6240" stroke-width="0.9"/>
    <!-- 眼（含威含护） -->
    <path d="M 104 110 Q 106 108.6 108 110 M 117 110 Q 119 108.6 120 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="106" cy="111" r="2.3" fill="#24180E"/>
    <circle cx="106.6" cy="110.4" r="0.75" fill="#FFF"/>
    <circle cx="118.5" cy="111" r="2.3" fill="#24180E"/>
    <circle cx="119.1" cy="110.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 108 116 L 116 116 L 112 118.5 Z" fill="#5E4628"/>
    <!-- 耳 -->
    <circle cx="104" cy="105" r="2.4" fill="#98784E"/>
    <circle cx="120" cy="105" r="2.4" fill="#98784E"/>
    <!-- 角（如刃，横挡） -->
    <path d="M 106 110 Q 102 102 98 98" stroke="#E0D8C4" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 114 110 Q 118 102 122 98" stroke="#E0D8C4" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 低吼威纹 -->
    <g stroke="#C8D8E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 122 102 Q 130 98 136 94">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 护群星尘 -->
  <g fill="#E8F4F0">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
