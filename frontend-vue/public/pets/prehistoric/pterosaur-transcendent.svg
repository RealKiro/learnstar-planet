<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="翼龙·六阶·翼龙传说·暮色翼尖托小翼龙传翼为护生语">
  <defs>
    <!-- 背景：白垩崖暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAC74"/>
      <stop offset="100%" stop-color="#94AEB0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8D890" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8D890" stop-opacity="0"/>
    </radialGradient>
    <!-- 老翼龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8C0C8"/>
      <stop offset="100%" stop-color="#9CA6AE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F4F8FC" opacity="0.85">
    <path d="M 0 130 Q 50 122 100 128 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 崖（右） -->
  <g fill="#A0A8B0" opacity="0.5">
    <path d="M 140 200 L 148 174 Q 166 166 184 172 L 200 168 L 200 200 Z"/>
  </g>

  <!-- 安卧的小兽（左下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="46" cy="146" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="46" cy="139" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 44 141 L 42 146 M 49 141 L 51 146" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 小翼龙（左下，扑翼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 72 120 L 60 112 L 62 118 L 54 114 L 62 120 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="0.8"/>
    <ellipse cx="72" cy="124" rx="6" ry="4.6" fill="url(#skin)" stroke="#8E989E" stroke-width="0.7"/>
  </g>
  <!-- 小翼龙头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="72" cy="118" rx="5" ry="4.4" fill="url(#skin)" stroke="#8E989E" stroke-width="0.7"/>
    <circle cx="69.5" cy="117" r="1.4" fill="#24180E"/>
    <circle cx="69.8" cy="116.7" r="0.45" fill="#FFF"/>
    <circle cx="74.8" cy="117" r="1.4" fill="#24180E"/>
    <circle cx="75.1" cy="116.7" r="0.45" fill="#FFF"/>
    <path d="M 71 120 L 69.6 122.4 L 72.4 121.8 Z" fill="#C0B888"/>
  </g>

  <!-- 老翼龙（翼尖托小翼龙，传护生） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 翼（大展，翼尖轻托） -->
    <path d="M 96 108 L 60 92 L 66 104 L 44 96 L 64 108 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="1"/>
    <!-- 翼尖托（下探轻托小翼龙） -->
    <path d="M 64 108 L 56 116 L 54 120" stroke="url(#skin)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 96 108 L 132 94 L 126 104 L 148 96 L 128 108 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="1"/>
    <!-- 身 -->
    <ellipse cx="96" cy="112" rx="8" ry="6" fill="url(#skin)" stroke="#8E989E" stroke-width="0.8"/>
    <!-- 尾 -->
    <path d="M 102 114 L 112 116 L 114 120" stroke="url(#skin)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老翼龙头（温和，传护生） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="102" rx="6.5" ry="5.5" fill="url(#skin)" stroke="#8E989E" stroke-width="0.8"/>
    <circle cx="93" cy="100.5" r="1.6" fill="#24180E"/>
    <circle cx="93.4" cy="100.1" r="0.5" fill="#FFF"/>
    <circle cx="99.4" cy="100.5" r="1.6" fill="#24180E"/>
    <circle cx="99.8" cy="100.1" r="0.5" fill="#FFF"/>
    <path d="M 95 104 L 93 107 L 97 106.4 Z" fill="#C0B888"/>
    <path d="M 93 98 L 92 95 M 98 98 L 100 95" stroke="#B8C0C8" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 传心微光 -->
    <circle cx="84" cy="108" r="6" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
