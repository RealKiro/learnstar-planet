<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="翼龙·一阶·翼膜初展·破壳探看云海母喙理翼膜">
  <defs>
    <!-- 背景：白垩崖云 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0DCE4"/>
      <stop offset="52%" stop-color="#B0C4D0"/>
      <stop offset="100%" stop-color="#8EA6B8"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F0F8FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 小翼龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8C0C8"/>
      <stop offset="100%" stop-color="#A0AAB2"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F4F8FC" opacity="0.9">
    <path d="M 0 128 Q 40 120 90 126 Q 140 132 200 124 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M 20 138 Q 60 130 110 136 Q 160 142 200 134 L 200 200 L 0 200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 远崖（右下） -->
  <g fill="#A0A8B0" opacity="0.5">
    <path d="M 120 200 L 130 170 Q 150 160 170 168 L 200 160 L 200 200 Z"/>
  </g>

  <!-- 崖巢窝（右下） -->
  <path d="M 138 168 Q 150 160 166 166" stroke="#8E969E" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 小翼龙（破壳，探看云海） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（窝中） -->
    <ellipse cx="152" cy="158" rx="11" ry="8" fill="url(#skin)" stroke="#8E989E" stroke-width="0.9"/>
    <!-- 破壳 -->
    <path d="M 138 156 Q 134 150 136 146 Q 141 151 143 155 Z" fill="#F0E8D8"/>
    <!-- 翼膜（湿贴） -->
    <path d="M 156 154 L 166 150 L 168 154 L 160 156 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="0.7"/>
  </g>

  <!-- 小翼龙头（探看云海） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="152" cy="146" rx="7" ry="6" fill="url(#skin)" stroke="#8E989E" stroke-width="0.8"/>
    <!-- 眼（望云） -->
    <circle cx="149" cy="144.5" r="1.8" fill="#24180E"/>
    <circle cx="149.5" cy="144" r="0.6" fill="#FFF"/>
    <circle cx="155.5" cy="144.5" r="1.8" fill="#24180E"/>
    <circle cx="156" cy="144" r="0.6" fill="#FFF"/>
    <!-- 喙 -->
    <path d="M 151 148 L 149 150.5 L 153 150 Z" fill="#C0B888"/>
    <!-- 头上小冠 -->
    <path d="M 149 141 L 148 138 M 153 141 L 155 138" stroke="#B8C0C8" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 母翼龙（右上，低头理翼膜） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 翼（展开） -->
    <path d="M 120 120 L 96 104 L 100 116 L 88 112 L 100 120 Z" fill="#B0B8C0"/>
    <!-- 头（低，喙理） -->
    <ellipse cx="128" cy="128" rx="8" ry="6" fill="#B0B8C0"/>
    <path d="M 130 132 L 128 136 L 134 134 Z" fill="#C0B888"/>
    <!-- 长喙 -->
    <path d="M 124 128 L 114 126 L 120 130 Z" fill="#C0B888"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F0F8FC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
