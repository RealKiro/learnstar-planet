<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="霸王龙·一阶·破壳初醒·破壳仰头蹭母吞浆果">
  <defs>
    <!-- 背景：白垩丛林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4C0"/>
      <stop offset="52%" stop-color="#B4CC9E"/>
      <stop offset="100%" stop-color="#8EAE78"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A878"/>
      <stop offset="100%" stop-color="#B08E60"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 巨蕨 -->
  <g stroke="#5E8E68" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 18 150 Q 20 110 14 84"/>
    <path d="M 17 116 L 4 106 M 17 104 L 6 92 M 17 92 L 8 80"/>
    <path d="M 180 152 Q 182 116 178 92"/>
    <path d="M 180 124 L 192 114 M 180 112 L 192 102"/>
  </g>
  <g fill="#6EAE7A" opacity="0.5">
    <path d="M 0 96 Q 50 88 110 94 Q 160 98 200 92 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7EAA7E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#A0C89E" stroke-width="1.4" opacity="0.55"/>

  <!-- 破开的蛋壳（左） -->
  <g fill="#F0E8D8">
    <path d="M 44 140 Q 34 128 38 116 Q 44 126 50 132 Q 52 140 44 140 Z"/>
    <path d="M 56 142 Q 50 132 52 124 Q 58 132 60 138 Q 60 142 56 142 Z"/>
  </g>
  <path d="M 44 140 L 50 132 M 52 142 L 56 132" stroke="#C8B89A" stroke-width="1" stroke-linecap="round"/>

  <!-- 幼霸王龙（破壳，仰头蹭母） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="132" rx="17" ry="12" fill="url(#skin)" stroke="#96784C" stroke-width="1"/>
    <!-- 腹（米白） -->
    <ellipse cx="100" cy="138" rx="10" ry="6" fill="#F0E4D0" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 94 141 L 92 149 M 114 141 L 116 149" stroke="#A08A5E" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 120 136 Q 130 132 134 124" stroke="url(#skin)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 136;7 120 136;0 120 136" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 小短手 -->
    <path d="M 92 128 L 86 122" stroke="url(#skin)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 幼霸王龙头（眼大，蹭母） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="112" rx="12" ry="10.5" fill="url(#skin)" stroke="#96784C" stroke-width="0.9"/>
    <!-- 眼 -->
    <circle cx="99" cy="110" r="2.6" fill="#24180E"/>
    <circle cx="99.7" cy="109.3" r="0.9" fill="#FFF"/>
    <circle cx="110" cy="110" r="2.6" fill="#24180E"/>
    <circle cx="110.7" cy="109.3" r="0.9" fill="#FFF"/>
    <!-- 鼻 -->
    <circle cx="100" cy="114" r="0.8" fill="#8E7044"/>
    <circle cx="109" cy="114" r="0.8" fill="#8E7044"/>
    <!-- 嘴（微张） -->
    <path d="M 98 118 Q 104 120 110 118" fill="none" stroke="#8E7044" stroke-width="1" stroke-linecap="round"/>
    <!-- 头上小角 -->
    <path d="M 99 103 L 97 98 M 109 103 L 111 98" stroke="#D8C090" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 浆果（嘴边） -->
    <circle cx="112" cy="119" r="2.6" fill="#E0684E">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 母霸王龙（右，低头蹭幼） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 巨大身形（部分入画） -->
    <path d="M 158 150 L 158 96 Q 148 88 140 92 Q 134 98 132 108 L 128 122 L 146 150 Z" fill="#A08A5E"/>
    <!-- 低头的头（蹭幼） -->
    <ellipse cx="132" cy="106" rx="8" ry="7" fill="#A08A5E" stroke="#8E7A4E" stroke-width="0.8"/>
    <circle cx="129" cy="104" r="1.8" fill="#24180E"/>
    <circle cx="129.5" cy="103.5" r="0.6" fill="#FFF"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
