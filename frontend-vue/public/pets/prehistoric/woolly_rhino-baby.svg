<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰河犀牛·二阶·角伤同伴·角撞同伴肩头拱头低鸣悔怕">
  <defs>
    <!-- 背景：冰原暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8CCDC"/>
      <stop offset="52%" stop-color="#98B2C8"/>
      <stop offset="100%" stop-color="#7696B0"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#E0EEF4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0EEF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 小冰犀厚毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9E7E52"/>
      <stop offset="100%" stop-color="#84664A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E8F0F4" opacity="0.9"/>

  <!-- 被撞伤的同伴（左，捂肩） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="56" cy="142" rx="7" ry="5.2" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="56" cy="135" r="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 52 133.6 Q 50 131.6 50 129.6" stroke="#C4C8B0" stroke-width="1" stroke-linecap="round"/>
    <!-- 受伤的肩 -->
    <circle cx="58" cy="140" r="1.8" fill="#C84030" opacity="0.75"/>
    <!-- 捂肩的前蹄 -->
    <path d="M 54 138 Q 50 140 52 143" stroke="#A6AA90" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 小冰犀（拱头低鸣，悔怕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="138" rx="15" ry="11" fill="url(#fur)" stroke="#6E5436" stroke-width="1"/>
    <!-- 腿 -->
    <path d="M 95 146 L 93 153 M 113 146 L 115 153" stroke="#6E5436" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 角（渐硬） -->
    <path d="M 98 134 Q 95 132 95 130" stroke="#D8D0BC" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小冰犀头（拱同伴，低鸣悔怕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="118" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#6E5436" stroke-width="0.9"/>
    <!-- 眼（悔） -->
    <circle cx="99" cy="116" r="2.3" fill="#24180E"/>
    <circle cx="99.6" cy="115.4" r="0.75" fill="#FFF"/>
    <circle cx="109.5" cy="116" r="2.3" fill="#24180E"/>
    <circle cx="110.1" cy="115.4" r="0.75" fill="#FFF"/>
    <!-- 鼻（低鸣） -->
    <path d="M 100 121 L 108 121 L 104 123.5 Z" fill="#5E4628"/>
    <!-- 耳 -->
    <circle cx="96" cy="110" r="2.4" fill="#8E7048"/>
    <circle cx="112" cy="110" r="2.4" fill="#8E7048"/>
    <!-- 低鸣波纹 -->
    <g stroke="#D8E4E8" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M 112 118 Q 116 116 118 118">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 悔泪 -->
    <path d="M 102 118.6 Q 100 121 100.5 123" stroke="#A8CCE8" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E0EEF4">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
