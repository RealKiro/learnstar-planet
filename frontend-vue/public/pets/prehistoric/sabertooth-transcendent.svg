<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="剑齿虎·六阶·剑齿传说·暮雪长牙拨枝教小虎最长的牙最克制">
  <defs>
    <!-- 背景：雪林暮雪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DCC0"/>
      <stop offset="52%" stop-color="#C8BC94"/>
      <stop offset="100%" stop-color="#9AAE96"/>
    </linearGradient>
    <!-- 暮雪金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8D890" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8D890" stop-opacity="0"/>
    </radialGradient>
    <!-- 老剑齿虎毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#B8A074"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪林丘 -->
  <g fill="#8EAE98" opacity="0.4">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E6EEE8" opacity="0.9"/>
  <!-- 暮雪 -->
  <g fill="#F0F8FC" opacity="0.8">
    <circle cx="40" cy="40" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="30" r="1.1">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 安卧的幼鹿（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="46" cy="144" rx="6" ry="4.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="46" cy="137" r="3.8" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
    <path d="M 44 139 L 42 144 M 49 139 L 51 144" stroke="#AAA090" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 小剑齿虎（左下，学扑蝶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="62" cy="136" rx="10" ry="7.5" fill="url(#fur)" stroke="#A89060" stroke-width="0.8"/>
    <!-- 腿 -->
    <path d="M 56 141 L 54 147 M 69 141 L 71 147" stroke="#A89060" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 72 140 Q 78 138 79 143" stroke="url(#fur)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 小剑齿虎头（扑蝶，牙未长） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="62" cy="124" rx="8" ry="7" fill="url(#fur)" stroke="#A89060" stroke-width="0.8"/>
    <path d="M 56 119 L 53 113 L 60 117 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.5"/>
    <path d="M 68 119 L 71 113 L 64 117 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.5"/>
    <circle cx="58.5" cy="122.5" r="1.9" fill="#24180E"/>
    <circle cx="59" cy="122.1" r="0.6" fill="#FFF"/>
    <circle cx="65.5" cy="122.5" r="1.9" fill="#24180E"/>
    <circle cx="66" cy="122.1" r="0.6" fill="#FFF"/>
    <ellipse cx="62" cy="126" rx="1.3" ry="1" fill="#C09070"/>
    <path d="M 60 128 Q 62 129 64 128" fill="none" stroke="#8E7850" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 老剑齿虎（长牙拨枝，传克制） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="118" cy="130" rx="16" ry="10.5" fill="url(#fur)" stroke="#A89060" stroke-width="1"/>
    <ellipse cx="115" cy="135" rx="9" ry="5.5" fill="#ECE4D4" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 108 137 L 106 146 M 130 137 L 132 146" stroke="#A89060" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 134 134 Q 142 130 146 124" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 长牙（垂，拨枝） -->
    <path d="M 112 124 Q 104 122 100 118" stroke="#F0E8D8" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 112 124;-6 112 124;0 112 124" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 拨开的树枝（传） -->
    <path d="M 100 118 L 94 114 L 88 116" stroke="#8E7044" stroke-width="1.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;-1 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="88" cy="110" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老剑齿虎头（温和，传克制） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="118" cy="112" rx="11" ry="9.5" fill="url(#fur)" stroke="#A89060" stroke-width="0.9"/>
    <path d="M 109 105 L 104 97 L 113 102 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.6"/>
    <path d="M 127 105 L 132 97 L 123 102 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.6"/>
    <!-- 眼（温和） -->
    <path d="M 110 110 Q 112 108.6 114 110 M 123 110 Q 125 108.6 126 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="112" cy="111" r="2.2" fill="#24180E"/>
    <circle cx="112.6" cy="110.4" r="0.7" fill="#FFF"/>
    <circle cx="124.5" cy="111" r="2.2" fill="#24180E"/>
    <circle cx="125.1" cy="110.4" r="0.7" fill="#FFF"/>
    <ellipse cx="118" cy="115" rx="1.7" ry="1.3" fill="#C09070"/>
    <!-- 长牙（如月，泛岁月） -->
    <path d="M 113 117 Q 110 123 109 129" stroke="#F4F0E4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 123 117 Q 126 123 127 129" stroke="#F4F0E4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 暮雪星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
