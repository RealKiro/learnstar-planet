<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="三角龙·一阶·角未长全·角芽软白跟母身本能护前">
  <defs>
    <!-- 背景：草原晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE8C8"/>
      <stop offset="52%" stop-color="#BCCEA8"/>
      <stop offset="100%" stop-color="#94AE82"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼三角龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8CCB8"/>
      <stop offset="100%" stop-color="#B0B49E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远丘 -->
  <g fill="#6E9E78" opacity="0.3">
    <path d="M 0 108 Q 50 102 110 106 Q 160 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#86AE7E" opacity="0.8"/>
  <path d="M 0 148 L 200 148" stroke="#A8C89E" stroke-width="1.4" opacity="0.55"/>

  <!-- 远龙（右上，经过） -->
  <g opacity="0.6">
    <ellipse cx="168" cy="98" rx="10" ry="6.5" fill="#A0A898"/>
    <circle cx="178" cy="94" r="3" fill="#A0A898"/>
  </g>

  <!-- 母三角龙（右，低头吃草） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="150" cy="134" rx="19" ry="11.5" fill="#AEB29E" stroke="#949884" stroke-width="1"/>
    <!-- 颈与头（低头） -->
    <path d="M 138 128 Q 128 118 126 110" stroke="#AEB29E" stroke-width="8" stroke-linecap="round" fill="none"/>
    <ellipse cx="124" cy="106" rx="7" ry="6" fill="#AEB29E"/>
    <!-- 角 -->
    <path d="M 122 102 L 116 98 M 127 102 L 133 98" stroke="#D8D0B8" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 138 142 L 136 149 M 160 142 L 163 149" stroke="#949884" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 小三角龙（角芽软白，跟母身，本能护前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="136" rx="16" ry="11" fill="url(#skin)" stroke="#949884" stroke-width="0.9"/>
    <!-- 腹（浅） -->
    <ellipse cx="101" cy="141" rx="9" ry="5.5" fill="#E4E0D0" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 94 144 L 92 151 M 114 144 L 116 151" stroke="#989C88" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 120 140 Q 128 138 132 143" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 140;6 120 140;0 120 140" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小三角龙头（角芽软白，本能护前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="116" rx="11" ry="9.5" fill="url(#skin)" stroke="#949884" stroke-width="0.8"/>
    <!-- 眼 -->
    <circle cx="99.5" cy="114" r="2.4" fill="#24180E"/>
    <circle cx="100.1" cy="113.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="114" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="113.4" r="0.8" fill="#FFF"/>
    <!-- 鼻/喙 -->
    <path d="M 101 119 L 108 119 L 104.5 121 Z" fill="#8E927E"/>
    <!-- 三根角芽（软白） -->
    <path d="M 99 108 L 97 102" stroke="#E8E0CC" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 104 107 L 104 100" stroke="#E8E0CC" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 109 108 L 111 102" stroke="#E8E0CC" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 颈甲边 -->
    <path d="M 92 112 Q 88 118 90 124" stroke="#989C88" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 116 112 Q 120 118 118 124" stroke="#989C88" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
