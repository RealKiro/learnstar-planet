<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="翼龙·二阶·坠地之惧·初飞坠地缩翼小兽围观">
  <defs>
    <!-- 背景：白垩崖下草丛 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D8C0"/>
      <stop offset="52%" stop-color="#A8BCA0"/>
      <stop offset="100%" stop-color="#86A484"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8F0E4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F0E4" stop-opacity="0"/>
    </radialGradient>
    <!-- 小翼龙皮（沾土） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0B8C0"/>
      <stop offset="100%" stop-color="#969EA6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 崖壁（右上） -->
  <g fill="#A0A8B0" opacity="0.6">
    <path d="M 0 0 L 90 0 L 80 40 Q 70 70 84 96 L 60 96 L 0 60 Z"/>
  </g>

  <!-- 草丛 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E72" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#9EBE92" stroke-width="1.4" opacity="0.55"/>

  <!-- 围观的小兽（左，好奇） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="144" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="52" cy="137" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 50 139 L 48 144 M 55 139 L 57 144" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 小翼龙（坠地，缩翼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（趴地） -->
    <ellipse cx="104" cy="140" rx="12" ry="8" fill="url(#skin)" stroke="#8E989E" stroke-width="0.9" transform="rotate(-8 104 140)"/>
    <!-- 缩着的翼 -->
    <path d="M 98 136 L 86 130 L 84 138 L 96 140 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="0.7"/>
    <path d="M 112 138 L 122 134 L 122 142 L 112 142 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="0.7"/>
    <!-- 腿（缩） -->
    <path d="M 98 146 L 96 151 M 112 146 L 114 151" stroke="#8E989E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 小翼龙头（缩，惧） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="126" rx="7" ry="6" fill="url(#skin)" stroke="#8E989E" stroke-width="0.8"/>
    <!-- 眼（惧） -->
    <circle cx="101" cy="124.5" r="1.8" fill="#24180E"/>
    <circle cx="101.5" cy="124" r="0.6" fill="#FFF"/>
    <circle cx="107.5" cy="124.5" r="1.8" fill="#24180E"/>
    <circle cx="108" cy="124" r="0.6" fill="#FFF"/>
    <!-- 喙（垂） -->
    <path d="M 103 128 L 101 131 L 105 130.4 Z" fill="#C0B888"/>
    <!-- 头冠（耷拉） -->
    <path d="M 101 121 Q 99 119 100 118" stroke="#B0B8C0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 106 121 Q 108 119 107 118" stroke="#B0B8C0" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E8F0E4">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
