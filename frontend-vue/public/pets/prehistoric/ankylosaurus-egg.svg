<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="甲龙·一阶·尾锤未硬·嫩甲挡同伴前尾锤软软">
  <defs>
    <!-- 背景：白垩灌木丛晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4C8"/>
      <stop offset="52%" stop-color="#B8CCA8"/>
      <stop offset="100%" stop-color="#90AE82"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 小甲龙皮（嫩甲） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B4B8A0"/>
      <stop offset="100%" stop-color="#9CA48E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 灌木 -->
  <g fill="#6E9E72" opacity="0.4">
    <path d="M 0 108 Q 50 102 110 106 Q 160 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7EAA82" opacity="0.8"/>
  <path d="M 0 148 L 200 148" stroke="#A0C8A4" stroke-width="1.4" opacity="0.55"/>

  <!-- 同伴（左前，被挡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="142" rx="7" ry="5.2" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="58" cy="135" r="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 54 133.6 Q 52 131.6 52 129.6" stroke="#C4C8B0" stroke-width="1" stroke-linecap="round"/>
    <circle cx="55.6" cy="134" r="1.1" fill="#24180E"/>
    <circle cx="60.4" cy="134" r="1.1" fill="#24180E"/>
  </g>

  <!-- 小甲龙（嫩甲，挡同伴前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（圆厚如甲） -->
    <ellipse cx="104" cy="134" rx="17" ry="12" fill="url(#skin)" stroke="#8E9680" stroke-width="1"/>
    <!-- 甲片 -->
    <g stroke="#8E9680" stroke-width="1" fill="none" opacity="0.6">
      <path d="M 92 130 Q 104 124 116 130 Q 104 136 92 130 Z"/>
      <path d="M 104 124 L 104 118 M 92 130 L 82 128 M 116 130 L 126 128"/>
    </g>
    <!-- 腹（黄） -->
    <ellipse cx="101" cy="141" rx="9" ry="5.5" fill="#E4DCC8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 94 143 L 92 150 M 114 143 L 116 150" stroke="#8E9680" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾锤（软软） -->
    <path d="M 121 138 Q 130 136 134 140" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 121 138;6 121 138;0 121 138" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="136" cy="140" rx="4" ry="3" fill="url(#skin)" stroke="#8E9680" stroke-width="0.7"/>
  </g>

  <!-- 小甲龙头（护意，眼大温亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="114" rx="11" ry="9.5" fill="url(#skin)" stroke="#8E9680" stroke-width="0.9"/>
    <!-- 眼 -->
    <circle cx="99" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="99.6" cy="111.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="111.4" r="0.8" fill="#FFF"/>
    <!-- 鼻/喙 -->
    <path d="M 101 117 L 108 117 L 104.5 119.5 Z" fill="#8E9278"/>
    <!-- 头侧甲 -->
    <path d="M 93 108 Q 89 114 91 120" stroke="#8E9680" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 115 108 Q 119 114 117 120" stroke="#8E9680" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
