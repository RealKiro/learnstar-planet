<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨齿鲨·一阶·浅海幼鲨·追鱼又忍住鱼群聚拢自问">
  <defs>
    <!-- 背景：浅海光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B4D4E4"/>
      <stop offset="52%" stop-color="#8CB8D0"/>
      <stop offset="100%" stop-color="#6E9EB8"/>
    </linearGradient>
    <!-- 海光 -->
    <radialGradient id="glow" cx="48%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#EFF8FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EFF8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼巨齿鲨皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E9EB4"/>
      <stop offset="100%" stop-color="#66869C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="40" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 光斑 -->
  <g fill="#EFF8FC" opacity="0.6">
    <circle cx="120" cy="28" r="4">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="36" r="3.2">
      <animate attributeName="opacity" values="0.55;0.28;0.55" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 海底沙 -->
  <path d="M 0 168 L 200 168 L 200 200 L 0 200 Z" fill="#C0D4D4" opacity="0.7"/>
  <g stroke="#5E9E8E" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 40 170 Q 38 152 42 140">
      <animateTransform attributeName="transform" type="rotate" values="0 40 170;-8 40 170;0 40 170" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 158 172 Q 160 154 156 142">
      <animateTransform attributeName="transform" type="rotate" values="0 158 172;8 158 172;0 158 172" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 聚拢的鱼群（左，重聚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 60 152 L 66 150 L 64 154 Z" fill="#C0A890"/>
    <path d="M 72 149 L 78 147 L 76 151 Z" fill="#C0A890"/>
    <path d="M 68 156 L 74 154 L 72 158 Z" fill="#C0A890"/>
    <path d="M 82 152 L 88 150 L 86 154 Z" fill="#C0A890"/>
  </g>

  <!-- 幼巨齿鲨（追鱼又忍住） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="108" cy="126" rx="16" ry="8.5" fill="url(#skin)" stroke="#527286" stroke-width="1"/>
    <ellipse cx="105" cy="130" rx="10" ry="5" fill="#DCE8EC" opacity="0.7"/>
    <!-- 尾 -->
    <path d="M 124 128 Q 134 124 140 118" stroke="url(#skin)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 124 128;8 124 128;0 124 128" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 138 116 L 148 110 L 146 120 Z" fill="url(#skin)" stroke="#527286" stroke-width="0.8"/>
    <!-- 背鳍 -->
    <path d="M 104 118 L 102 104 L 110 116 Z" fill="url(#skin)" stroke="#527286" stroke-width="0.7"/>
    <!-- 胸鳍 -->
    <path d="M 100 124 L 90 118 L 92 128 Z" fill="url(#skin)" stroke="#527286" stroke-width="0.7"/>
  </g>

  <!-- 幼巨齿鲨头（张嘴又收，看鱼聚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="94" cy="122" rx="10" ry="7.5" fill="url(#skin)" stroke="#527286" stroke-width="0.9"/>
    <!-- 眼（好奇） -->
    <circle cx="90" cy="120" r="2.4" fill="#24180E"/>
    <circle cx="90.6" cy="119.4" r="0.8" fill="#FFF"/>
    <circle cx="98" cy="120" r="2.4" fill="#24180E"/>
    <circle cx="98.6" cy="119.4" r="0.8" fill="#FFF"/>
    <!-- 嘴（半张又收） -->
    <path d="M 86 126 Q 94 130 102 126" fill="none" stroke="#527286" stroke-width="1" stroke-linecap="round"/>
    <!-- 小牙（露） -->
    <path d="M 88 126 L 89 128.4 M 93 127.6 L 94 130 M 98 126 L 97 128.4" stroke="#F0E8D8" stroke-width="1" stroke-linecap="round"/>
    <!-- 额间忍光 -->
    <circle cx="94" cy="114" r="2" fill="#EFF8FC" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 海光星尘 -->
  <g fill="#EFF8FC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
