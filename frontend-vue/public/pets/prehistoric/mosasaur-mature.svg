<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="沧龙·四阶·护海初成·身横挡猎食者小海兽钻腹下游回浅海">
  <defs>
    <!-- 背景：浅海护生 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CC4D8"/>
      <stop offset="52%" stop-color="#7AA8C0"/>
      <stop offset="100%" stop-color="#5E8AA6"/>
    </linearGradient>
    <!-- 护生威光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="54%">
      <stop offset="0%" stop-color="#E0F2F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0F2F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年沧龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8298"/>
      <stop offset="100%" stop-color="#466A82"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 海面光 -->
  <g fill="#E0F2F8" opacity="0.6">
    <circle cx="120" cy="30" r="4">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 被弹开的猎食者（右上，悻悻游走） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 猎食者（鱼形） -->
    <path d="M 150 92 Q 162 84 172 88 L 178 92 L 170 96 Q 158 98 150 92 Z" fill="#4A5E72"/>
    <circle cx="156" cy="89" r="1.4" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 钻腹下的小海兽（左，安然） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="84" cy="148" rx="5.5" ry="4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="84" cy="141" r="3.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
    <path d="M 82 143 L 80 148 M 87 143 L 89 148" stroke="#AAA090" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="84" cy="146" rx="9" ry="4" fill="#E0F2F8" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.12;0.25" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 少年沧龙（身横挡，庞大） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（庞大如墙，横挡） -->
    <ellipse cx="112" cy="128" rx="20" ry="11" fill="url(#skin)" stroke="#466A82" stroke-width="1.1"/>
    <ellipse cx="108" cy="132" rx="13" ry="7" fill="#D8E4E8" opacity="0.7"/>
    <!-- 尾（甩） -->
    <path d="M 130 130 Q 144 124 150 116" stroke="url(#skin)" stroke-width="4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 130 130;6 130 130;0 130 130" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 鳍 -->
    <path d="M 100 124 L 90 118 L 94 130 Z" fill="url(#skin)" stroke="#466A82" stroke-width="0.9"/>
    <path d="M 124 124 L 136 118 L 132 130 Z" fill="url(#skin)" stroke="#466A82" stroke-width="0.9"/>
  </g>

  <!-- 少年沧龙头（含威含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="94" cy="124" rx="11" ry="8.5" fill="url(#skin)" stroke="#466A82" stroke-width="1"/>
    <!-- 眼（含威含护） -->
    <path d="M 86 122 Q 88 120.6 90 122 M 99 122 Q 101 120.6 102 122" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="123" r="2.3" fill="#24180E"/>
    <circle cx="88.6" cy="122.4" r="0.75" fill="#FFF"/>
    <circle cx="100.5" cy="123" r="2.3" fill="#24180E"/>
    <circle cx="101.1" cy="122.4" r="0.75" fill="#FFF"/>
    <!-- 嘴（护，闭） -->
    <path d="M 85 129 Q 94 131.5 103 129" fill="none" stroke="#466A82" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 护生星尘 -->
  <g fill="#E0F2F8">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
