<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨齿鲨·六阶·巨齿传说·暮光鳍碰小鲨传利牙收嘴身为堤">
  <defs>
    <!-- 背景：深海暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A9AB8"/>
      <stop offset="52%" stop-color="#5E829E"/>
      <stop offset="100%" stop-color="#A8C4CC"/>
    </linearGradient>
    <!-- 暮光金 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#B8D8E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 老巨齿鲨皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A7E96"/>
      <stop offset="100%" stop-color="#42667E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.48;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.2;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 海面光 -->
  <g fill="#F0E8C8" opacity="0.5">
    <circle cx="120" cy="26" r="4">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 海底沙 -->
  <path d="M 0 172 L 200 172 L 200 200 L 0 200 Z" fill="#8AA8B8" opacity="0.7"/>

  <!-- 安然鱼群（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 40 152 L 48 150 L 46 154 Z" fill="#C0A888"/>
    <path d="M 52 154 L 60 152 L 58 156 Z" fill="#C0A888"/>
  </g>

  <!-- 小巨齿鲨（左下，追鱼又忍） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="68" cy="140" rx="11" ry="6" fill="url(#skin)" stroke="#4E6E82" stroke-width="0.8"/>
    <ellipse cx="66" cy="143" rx="7" ry="3.8" fill="#DCE8EC" opacity="0.7"/>
    <!-- 尾 -->
    <path d="M 79 142 Q 87 140 91 146" stroke="url(#skin)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 背鳍 -->
    <path d="M 66 136 L 64 126 L 70 134 Z" fill="url(#skin)" stroke="#4E6E82" stroke-width="0.6"/>
  </g>
  <!-- 小巨齿鲨头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="136" rx="7.5" ry="5.5" fill="url(#skin)" stroke="#4E6E82" stroke-width="0.8"/>
    <circle cx="57" cy="134.5" r="1.8" fill="#24180E"/>
    <circle cx="57.4" cy="134.1" r="0.6" fill="#FFF"/>
    <circle cx="63.4" cy="134.5" r="1.8" fill="#24180E"/>
    <circle cx="63.8" cy="134.1" r="0.6" fill="#FFF"/>
    <path d="M 56 139 Q 60 141 64 139" fill="none" stroke="#4E6E82" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 追的光点 -->
    <circle cx="52" cy="128" r="1.6" fill="#F0E8C8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老巨齿鲨（鳍碰小鲨，传安） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="118" cy="128" rx="22" ry="11" fill="url(#skin)" stroke="#32566E" stroke-width="1.1"/>
    <ellipse cx="112" cy="132" rx="13" ry="6.5" fill="#C8DCE4" opacity="0.7"/>
    <!-- 尾 -->
    <path d="M 138 130 Q 148 124 154 116" stroke="url(#skin)" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <!-- 尾鳍 -->
    <path d="M 152 114 L 162 106 L 160 118 Z" fill="url(#skin)" stroke="#32566E" stroke-width="0.9"/>
    <!-- 胸鳍（垂，碰小鲨，传安） -->
    <path d="M 102 124 L 90 116 L 96 130 Z" fill="url(#skin)" stroke="#32566E" stroke-width="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0 102 124;-6 102 124;0 102 124" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="84" cy="120" r="7" fill="#F0E8C8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老巨齿鲨头（温和） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="122" rx="11" ry="8" fill="url(#skin)" stroke="#32566E" stroke-width="0.9"/>
    <circle cx="94" cy="120" r="2.1" fill="#24180E"/>
    <circle cx="94.5" cy="119.5" r="0.7" fill="#FFF"/>
    <circle cx="106" cy="120" r="2.1" fill="#24180E"/>
    <circle cx="106.5" cy="119.5" r="0.7" fill="#FFF"/>
    <path d="M 91 126 Q 100 128.6 109 126" fill="none" stroke="#32566E" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 暮光星尘 -->
  <g fill="#F0E8C8">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
