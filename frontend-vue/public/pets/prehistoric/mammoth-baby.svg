<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="猛犸象·二阶·走失冰原·顶风独行族影远去喷白气">
  <defs>
    <!-- 背景：暴风雪冰原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8CCDC"/>
      <stop offset="52%" stop-color="#98B2C8"/>
      <stop offset="100%" stop-color="#7696B0"/>
    </linearGradient>
    <!-- 风雪光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#E0EEF4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0EEF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 小猛犸绒毛（结冰） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9E7E52"/>
      <stop offset="100%" stop-color="#84664A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风雪 -->
  <g fill="#E0EEF4" opacity="0.8">
    <circle cx="30" cy="30" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 6;0 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="50" r="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 7;0 0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="40" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 8;0 0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="70" r="1.1">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 6;0 0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 风痕 -->
  <g stroke="#E0EEF4" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 10 60 Q 50 54 90 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 88 Q 60 82 100 88">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 远去的族群（左远，模糊） -->
  <g opacity="0.35">
    <path d="M 20 140 Q 16 128 22 120 Q 28 128 26 138 Z" fill="#7E6240"/>
    <path d="M 34 142 Q 30 130 36 122 Q 42 130 40 140 Z" fill="#8E7048"/>
  </g>

  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E8F0F4" opacity="0.9"/>

  <!-- 小猛犸（顶风独行） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（绒毛结冰） -->
    <ellipse cx="104" cy="136" rx="15" ry="11" fill="url(#fur)" stroke="#6E5436" stroke-width="1"/>
    <!-- 腿（顶风） -->
    <path d="M 95 144 L 93 152 M 113 144 L 115 152" stroke="#6E5436" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 小牙 -->
    <path d="M 98 132 Q 96 130 96 128" stroke="#E8E0CC" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小猛犸头（顶风，坚定） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="118" rx="10" ry="9" fill="url(#fur)" stroke="#6E5436" stroke-width="0.9"/>
    <!-- 眼（含坚） -->
    <path d="M 96 116 Q 98 114.6 100 116 M 109 116 Q 111 114.6 112 116" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="117" r="2.2" fill="#24180E"/>
    <circle cx="98.6" cy="116.4" r="0.7" fill="#FFF"/>
    <circle cx="110.5" cy="117" r="2.2" fill="#24180E"/>
    <circle cx="111.1" cy="116.4" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 101 122 L 107 122 L 104 124.5 Z" fill="#5E4628"/>
    <!-- 耳（沾雪） -->
    <path d="M 96 112 Q 92 108 93 104 Q 97 106 99 110 Z" fill="#8E7048"/>
    <path d="M 112 112 Q 116 108 115 104 Q 111 106 109 110 Z" fill="#8E7048"/>
    <!-- 鼻上挂霜 -->
    <circle cx="100" cy="121" r="1" fill="#E0EEF4" opacity="0.7"/>
    <!-- 顶风白气（用力） -->
    <g stroke="#E0EEF4" stroke-width="1.3" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M 110 122 Q 114 120 116 122">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 风雪星尘 -->
  <g fill="#E0EEF4">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
