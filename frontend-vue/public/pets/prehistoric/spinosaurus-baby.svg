<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="棘龙·二阶·帆小之惑·大雨淋湿背帆小兽笑帆小低头立志">
  <defs>
    <!-- 背景：雨后芦荡暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AEC0B0"/>
      <stop offset="52%" stop-color="#92AA98"/>
      <stop offset="100%" stop-color="#748E78"/>
    </linearGradient>
    <!-- 雨后光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#DCE8DC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DCE8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼棘龙皮（湿） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B4A0"/>
      <stop offset="100%" stop-color="#86A086"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雨云（上） -->
  <g fill="#7E968C" opacity="0.6">
    <path d="M 40 30 Q 60 20 80 28 Q 100 18 120 26 Q 140 20 158 30 L 150 40 L 48 40 Z"/>
  </g>
  <!-- 雨线 -->
  <g stroke="#C8D8CC" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 60 44 L 56 66" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 44 L 116 68" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 芦荡 -->
  <g stroke="#7E9678" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 26 150 Q 24 132 28 120"/>
    <path d="M 174 152 Q 172 134 176 122"/>
  </g>

  <!-- 水塘 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#86AC98" opacity="0.8"/>
  <g stroke="#A0C0B0" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 164 Q 60 161 90 164 Q 120 167 150 164"/>
  </g>

  <!-- 笑帆小的兽（右，远笑） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="156" cy="142" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="156" cy="135" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 幼棘龙（湿帆，缩芦荡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="138" rx="15" ry="10" fill="url(#skin)" stroke="#6E8670" stroke-width="0.9"/>
    <ellipse cx="101" cy="142" rx="9" ry="5" fill="#D8DCC8" opacity="0.7"/>
    <!-- 背帆（湿耷拉，嫩红转暗） -->
    <path d="M 97 132 Q 99 116 107 116 Q 110 124 114 131 Q 105 126 97 132 Z" fill="#C87A5E"/>
    <!-- 水珠（帆上） -->
    <circle cx="102" cy="122" r="1.2" fill="#C8D8CC" opacity="0.7">
      <animate attributeName="cy" values="122;128;122" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 腿 -->
    <path d="M 95 146 L 93 152 M 113 146 L 115 152" stroke="#6E8670" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 119 141 Q 127 141 129 146" stroke="url(#skin)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 幼棘龙头（低头，立志） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="118" rx="10.5" ry="9" fill="url(#skin)" stroke="#6E8670" stroke-width="0.9"/>
    <!-- 眼（惑+志） -->
    <path d="M 96 116 Q 98 114.6 100 116 M 109 116 Q 111 114.6 112 116" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="117" r="2.2" fill="#24180E"/>
    <circle cx="98.6" cy="116.4" r="0.7" fill="#FFF"/>
    <circle cx="110.5" cy="117" r="2.2" fill="#24180E"/>
    <circle cx="111.1" cy="116.4" r="0.7" fill="#FFF"/>
    <!-- 嘴（闭，委屈） -->
    <path d="M 98 122 Q 104 123.4 110 122" fill="none" stroke="#6E8670" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 鼻 -->
    <circle cx="100" cy="120" r="0.8" fill="#5E7658"/>
    <circle cx="108" cy="120" r="0.8" fill="#5E7658"/>
    <!-- 帆湿的水痕 -->
    <path d="M 100 114 L 108 112" stroke="#C8D8CC" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 雨后星尘 -->
  <g fill="#DCE8DC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
