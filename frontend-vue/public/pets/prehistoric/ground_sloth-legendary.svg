<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大地懒·五阶·森林之巨·慢巡森林稳攀放小兽爪覆穴">
  <defs>
    <!-- 背景：森林夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B0"/>
      <stop offset="52%" stop-color="#C8BC90"/>
      <stop offset="100%" stop-color="#96AC96"/>
    </linearGradient>
    <!-- 森林之巨神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#F8F4DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F4DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8E4CC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8E4CC" stop-opacity="0"/>
    </radialGradient>
    <!-- 森林之巨毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A08E76"/>
      <stop offset="100%" stop-color="#82705A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林 -->
  <g fill="#6E9E78" opacity="0.35">
    <path d="M 0 122 Q 60 114 130 120 Q 170 124 200 118 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#86A87A" opacity="0.8"/>

  <!-- 高枝上的小兽（左，被放回） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 40 104 L 60 106" stroke="#6E5640" stroke-width="1.8" stroke-linecap="round"/>
    <ellipse cx="50" cy="100" rx="5.5" ry="4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="50" cy="93" r="3.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 被覆的小穴（右前） -->
  <g opacity="0.85">
    <ellipse cx="150" cy="150" rx="7" ry="4" fill="#5E6E58"/>
    <path d="M 142 150 Q 150 146 158 150 L 156 152 L 144 152 Z" fill="#7E9E6E"/>
  </g>

  <!-- 森林之巨大地懒（慢巡，稳攀放兽、覆穴） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如巨） -->
    <ellipse cx="104" cy="132" rx="19" ry="13.5" fill="url(#fur)" stroke="#6E5E46" stroke-width="1.1"/>
    <ellipse cx="100" cy="138" rx="11" ry="7" fill="#DCD0B8" opacity="0.7"/>
    <!-- 腿（如柱） -->
    <path d="M 93 142 L 90 150 M 118 142 L 121 150" stroke="#6E5E46" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 123 138 Q 131 137 134 142" stroke="url(#fur)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 爪（稳攀放兽） -->
    <path d="M 98 126 Q 88 118 78 112" stroke="url(#fur)" stroke-width="3.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 98 126;-6 98 126;0 98 126" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 爪（覆穴） -->
    <path d="M 118 128 Q 128 124 136 122" stroke="url(#fur)" stroke-width="3.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 118 128;6 118 128;0 118 128" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 森林之巨头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="112" rx="12" ry="10.5" fill="url(#fur)" stroke="#6E5E46" stroke-width="0.9"/>
    <!-- 眼（含威含温） -->
    <path d="M 96 110 Q 98 108.6 100 110 M 109 110 Q 111 108.6 112 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="98.6" cy="110.4" r="0.8" fill="#FFF"/>
    <circle cx="110.5" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="111.1" cy="110.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="104" cy="116" rx="2" ry="1.5" fill="#5E4E3A"/>
    <!-- 嘴 -->
    <path d="M 100 119 Q 104 120.6 108 119" fill="none" stroke="#8E7A5E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 圆耳 -->
    <circle cx="93" cy="105" r="2.4" fill="#7E6A52"/>
    <circle cx="115" cy="105" r="2.4" fill="#7E6A52"/>
    <!-- 额间巨之光 -->
    <circle cx="104" cy="103" r="2.8" fill="#F8F4DC" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 森林之巨星尘 -->
  <g fill="#F8F4DC">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
