<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梁龙·四阶·护群初成·长颈探出卷起落难小兽轻轻回岸">
  <defs>
    <!-- 背景：沼泽夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E8CC"/>
      <stop offset="52%" stop-color="#B4CCB0"/>
      <stop offset="100%" stop-color="#8AA89A"/>
    </linearGradient>
    <!-- 护群威光 -->
    <radialGradient id="glow" cx="52%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#F0F8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0F8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年梁龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B8A4"/>
      <stop offset="100%" stop-color="#84A08C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 沼泽（深水区） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7EAC9E" opacity="0.8"/>
  <g stroke="#A0C8B8" stroke-width="1.4" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 20 158 Q 60 152 100 158 Q 140 164 180 158">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被卷起的小兽（颈卷，正回岸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="88" cy="142" rx="6" ry="4.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="88" cy="135" r="3.8" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
    <path d="M 86 137 L 84 142 M 91 137 L 93 142" stroke="#AAA090" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 少年梁龙（长颈卷起小兽回岸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="118" cy="132" rx="17" ry="11.5" fill="url(#skin)" stroke="#7A947E" stroke-width="1"/>
    <ellipse cx="114" cy="137" rx="10" ry="6" fill="#E0E8D8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 108 140 L 106 148 M 130 140 L 132 148" stroke="#7A947E" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 135 136 Q 144 132 150 124" stroke="url(#skin)" stroke-width="2.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 135 136;5 135 136;0 135 136" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 长颈（卷起小兽，回岸） -->
    <path d="M 112 126 Q 104 116 104 108 Q 104 100 100 96 Q 94 92 92 88" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 112 126;5 112 126;0 112 126" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 颈卷的下探（卷小兽） -->
    <path d="M 96 90 Q 88 104 90 120 Q 92 130 94 136" stroke="url(#skin)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年梁龙头（卷起，含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="92" cy="86" rx="7.5" ry="6.5" fill="url(#skin)" stroke="#7A947E" stroke-width="0.8"/>
    <circle cx="88.5" cy="84.5" r="1.7" fill="#24180E"/>
    <circle cx="88.9" cy="84.1" r="0.55" fill="#FFF"/>
    <circle cx="95.5" cy="84.5" r="1.7" fill="#24180E"/>
    <circle cx="95.9" cy="84.1" r="0.55" fill="#FFF"/>
    <path d="M 90 89 L 88 91.6 L 92 91 Z" fill="#8E9278"/>
    <!-- 颈上水珠 -->
    <circle cx="100" cy="100" r="1.2" fill="#A8D0C0" opacity="0.7">
      <animate attributeName="cy" values="100;106;100" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 护群星尘 -->
  <g fill="#F0F8E8">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
