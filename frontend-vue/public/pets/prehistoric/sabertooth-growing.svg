<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="剑齿虎·三阶·练牙苦修·对雪练扑精准长牙划过皮毛不伤">
  <defs>
    <!-- 背景：雪林晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE4D8"/>
      <stop offset="52%" stop-color="#BCCAB8"/>
      <stop offset="100%" stop-color="#9AAE9E"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F8EC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F8F8EC" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年剑齿虎毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#C0A878"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪丘 -->
  <g fill="#8EAE98" opacity="0.3">
    <path d="M 0 110 Q 50 104 110 108 Q 160 112 200 106 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E6EEE8" opacity="0.9"/>

  <!-- 练扑的雪堆（右，爪痕） -->
  <g>
    <path d="M 146 140 Q 160 132 170 136 L 164 150 L 148 150 Z" fill="#EFF6F2"/>
    <!-- 爪痕 -->
    <g stroke="#C8D8D0" stroke-width="1.4" stroke-linecap="round">
      <path d="M 152 138 L 156 148 M 158 136 L 162 148 M 164 136 L 166 146"/>
    </g>
    <circle cx="158" cy="142" r="6" fill="#F8F8EC" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.14;0.28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 走过安然的小兽（左，长牙划过不伤） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="54" cy="142" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="54" cy="135" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 52 137 L 50 142 M 57 137 L 59 142" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 少年剑齿虎（练扑，身姿矫健） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（前扑） -->
    <ellipse cx="102" cy="132" rx="16" ry="10.5" fill="url(#fur)" stroke="#A89060" stroke-width="1" transform="rotate(-8 102 132)"/>
    <ellipse cx="99" cy="137" rx="9" ry="5.5" fill="#ECE4D4" opacity="0.7"/>
    <!-- 后腿（蹬） -->
    <path d="M 110 139 L 114 148 M 94 139 L 91 148" stroke="#A89060" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 118 136 Q 128 132 134 124" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 118 136;7 118 136;0 118 136" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 前爪（扑） -->
    <path d="M 92 126 L 86 118" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 92 126;-10 92 126;0 92 126" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年剑齿虎头（专注，长牙如月） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="102" cy="112" rx="11.5" ry="10" fill="url(#fur)" stroke="#A89060" stroke-width="0.9"/>
    <!-- 圆耳 -->
    <path d="M 92 105 L 87 97 L 96 102 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.6"/>
    <path d="M 112 105 L 117 97 L 108 102 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.6"/>
    <!-- 眼（专注） -->
    <path d="M 93 110 Q 95 108.6 97 110 M 108 110 Q 110 108.6 111 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="95.6" cy="110.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="110.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="102" cy="115" rx="1.8" ry="1.4" fill="#C09070"/>
    <!-- 长牙（如月） -->
    <path d="M 97 117 Q 94 123 93 128" stroke="#F0E8D8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 107 117 Q 110 123 111 128" stroke="#F0E8D8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F8EC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
