<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="三角龙·三阶·练角苦修·顶石又收角同伴安然站角前">
  <defs>
    <!-- 背景：草原巨石前晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE8CC"/>
      <stop offset="52%" stop-color="#BCCEA8"/>
      <stop offset="100%" stop-color="#96AE84"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年三角龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8CCB8"/>
      <stop offset="100%" stop-color="#ACB09A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远丘 -->
  <g fill="#6E9E78" opacity="0.3">
    <path d="M 0 110 Q 50 104 110 108 Q 160 112 200 106 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#86AE7E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#A8C89E" stroke-width="1.4" opacity="0.55"/>

  <!-- 被顶出浅坑的巨石（右） -->
  <g>
    <path d="M 148 138 L 172 134 L 178 148 L 152 152 Z" fill="#B0A88C"/>
    <path d="M 156 140 L 158 148 M 164 138 L 166 148" stroke="#8E8268" stroke-width="1.1" stroke-linecap="round"/>
    <!-- 顶出浅坑 -->
    <path d="M 154 136 Q 160 133 166 135" stroke="#C8C0A8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <circle cx="160" cy="138" r="5" fill="#F4E8C8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.14;0.28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 安然站角前的同伴（左，信任） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="56" cy="142" rx="7" ry="5.2" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.7"/>
    <circle cx="56" cy="135" r="4.4" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.6"/>
    <path d="M 52 133.6 Q 50 131.6 50 129.6" stroke="#BCC0A8" stroke-width="1" stroke-linecap="round"/>
    <circle cx="53.6" cy="134" r="1.1" fill="#24180E"/>
    <circle cx="58.4" cy="134" r="1.1" fill="#24180E"/>
  </g>

  <!-- 少年三角龙（顶石又收角，控力） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（敦实） -->
    <ellipse cx="104" cy="134" rx="17" ry="11.5" fill="url(#skin)" stroke="#949884" stroke-width="1"/>
    <ellipse cx="100" cy="139" rx="10" ry="6" fill="#E4E0D0" opacity="0.7"/>
    <!-- 腿（立稳） -->
    <path d="M 94 142 L 92 150 M 116 142 L 118 150" stroke="#989C88" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾（有力） -->
    <path d="M 121 138 Q 130 134 134 126" stroke="url(#skin)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 121 138;5 121 138;0 121 138" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年三角龙头（沉稳，角如月牙，收角） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="114" rx="11.5" ry="10" fill="url(#skin)" stroke="#949884" stroke-width="0.9"/>
    <!-- 眼（专注） -->
    <circle cx="99" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="99.6" cy="111.4" r="0.8" fill="#FFF"/>
    <circle cx="110" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="110.6" cy="111.4" r="0.8" fill="#FFF"/>
    <!-- 鼻/喙 -->
    <path d="M 100 117 L 108 117 L 104 119.5 Z" fill="#8E927E"/>
    <!-- 三根角（如月牙） -->
    <path d="M 98 106 L 94 98" stroke="#E0D8C0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 104 105 L 104 96" stroke="#E0D8C0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 110 106 L 114 98" stroke="#E0D8C0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 颈甲 -->
    <path d="M 91 108 Q 86 116 89 124" stroke="#989C88" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M 117 108 Q 122 116 119 124" stroke="#989C88" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- 收角的光（点到即止） -->
    <circle cx="98" cy="98" r="2.2" fill="#F4E8C8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
