<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梁龙·二阶·长颈之困·弯颈够地难小兽围笑蹲下委屈">
  <defs>
    <!-- 背景：沼泽暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AEC8B4"/>
      <stop offset="52%" stop-color="#90AE9C"/>
      <stop offset="100%" stop-color="#728E7E"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#DCE8DC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DCE8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 小梁龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#98B09E"/>
      <stop offset="100%" stop-color="#7E9A88"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 沼泽 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8AAE9E" opacity="0.8"/>
  <g stroke="#A0C8B8" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 164 Q 60 161 90 164 Q 120 167 150 164"/>
  </g>

  <!-- 地上的草（够不到） -->
  <g>
    <path d="M 92 152 L 90 148" stroke="#7EAE6E" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 98 153 L 98 149" stroke="#7EAE6E" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 104 152 L 106 148" stroke="#7EAE6E" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 围笑的小兽（右，笑） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="144" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="150" cy="137" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 148 139 L 146 144 M 153 139 L 155 144" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 小梁龙（弯颈够地难，蹲下委屈） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（蹲） -->
    <ellipse cx="104" cy="138" rx="14" ry="10" fill="url(#skin)" stroke="#6E8A78" stroke-width="0.9"/>
    <ellipse cx="101" cy="142" rx="8" ry="5" fill="#D8E0D4" opacity="0.7"/>
    <!-- 腿（蹲） -->
    <path d="M 95 145 L 93 151 M 113 145 L 115 151" stroke="#6E8A78" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 118 142 Q 126 142 129 147" stroke="url(#skin)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 长颈（弯得发酸，够地） -->
    <path d="M 102 134 Q 96 126 92 118 Q 88 110 92 104" stroke="url(#skin)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小梁龙头（低垂，委屈） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="92" cy="102" rx="7" ry="6" fill="url(#skin)" stroke="#6E8A78" stroke-width="0.8"/>
    <!-- 眼（委屈） -->
    <circle cx="89" cy="100.5" r="1.7" fill="#24180E"/>
    <circle cx="89.4" cy="100.1" r="0.55" fill="#FFF"/>
    <circle cx="95.4" cy="100.5" r="1.7" fill="#24180E"/>
    <circle cx="95.8" cy="100.1" r="0.55" fill="#FFF"/>
    <!-- 嘴（垂） -->
    <path d="M 89 105 L 87 107.6 L 91 107 Z" fill="#8E9278"/>
    <!-- 委屈泪 -->
    <path d="M 90 102.6 Q 88 105 88.5 107" stroke="#A8CCE8" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#DCE8DC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
