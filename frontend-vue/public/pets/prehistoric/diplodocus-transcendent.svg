<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梁龙·六阶·梁龙传说·暮色长颈轻带小梁龙传颈为护生语">
  <defs>
    <!-- 背景：沼泽暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C4A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#94AC98"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8D890" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8D890" stop-opacity="0"/>
    </radialGradient>
    <!-- 老梁龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B8A4"/>
      <stop offset="100%" stop-color="#82A08A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 沼泽 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EB8A8" opacity="0.8"/>
  <g stroke="#A8D0C0" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 162 Q 60 159 90 162 Q 120 165 150 162"/>
  </g>

  <!-- 安卧的小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="44" cy="144" rx="6" ry="4.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="44" cy="137" r="3.8" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
  </g>

  <!-- 小梁龙（左下，颤颈够叶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="60" cy="136" rx="11" ry="8" fill="url(#skin)" stroke="#7A947E" stroke-width="0.8"/>
    <ellipse cx="58" cy="140" rx="6" ry="4" fill="#E0E8D8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 54 141 L 52 147 M 67 141 L 69 147" stroke="#7A947E" stroke-width="2" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 71 140 Q 77 138 79 143" stroke="url(#skin)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 颤颈（够叶） -->
    <path d="M 58 130 Q 57 120 63 110 Q 69 100 77 94" stroke="url(#skin)" stroke-width="4.5" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 58 130;5 58 130;0 58 130" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 小梁龙头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="79" cy="92" rx="6" ry="5.2" fill="url(#skin)" stroke="#7A947E" stroke-width="0.7"/>
    <circle cx="76" cy="90.5" r="1.4" fill="#24180E"/>
    <circle cx="76.3" cy="90.2" r="0.45" fill="#FFF"/>
    <circle cx="82" cy="90.5" r="1.4" fill="#24180E"/>
    <circle cx="82.3" cy="90.2" r="0.45" fill="#FFF"/>
    <path d="M 77 94 L 75.6 96.4 L 78.4 95.8 Z" fill="#8E9278"/>
  </g>

  <!-- 老梁龙（长颈轻带小梁龙，传护生） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="122" cy="130" rx="18" ry="12" fill="url(#skin)" stroke="#7A947E" stroke-width="1.1"/>
    <ellipse cx="118" cy="135" rx="10" ry="6.5" fill="#E0E8D8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 111 139 L 109 147 M 135 139 L 137 147" stroke="#7A947E" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 140 134 Q 150 130 156 122" stroke="url(#skin)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 长颈（探下，轻带小梁龙头） -->
    <path d="M 116 124 Q 108 112 108 104 Q 108 96 104 94 Q 100 92 96 90" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 116 124;-4 116 124;0 116 124" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 颈尖轻带（蹭小梁龙头） -->
    <path d="M 92 88 L 86 90" stroke="url(#skin)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老梁龙头（温和，传护生） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="90" cy="86" rx="7.5" ry="6.5" fill="url(#skin)" stroke="#7A947E" stroke-width="0.8"/>
    <circle cx="86.5" cy="84.5" r="1.7" fill="#24180E"/>
    <circle cx="86.9" cy="84.1" r="0.55" fill="#FFF"/>
    <circle cx="93.5" cy="84.5" r="1.7" fill="#24180E"/>
    <circle cx="93.9" cy="84.1" r="0.55" fill="#FFF"/>
    <path d="M 88 89 L 86 91.6 L 90 91 Z" fill="#8E9278"/>
    <!-- 传心微光 -->
    <circle cx="84" cy="80" r="6" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
