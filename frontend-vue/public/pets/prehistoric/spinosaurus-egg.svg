<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="棘龙·一阶·背帆初显·浅水拍玩背帆嫩红见鱼不追">
  <defs>
    <!-- 背景：河口芦荡晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4D0"/>
      <stop offset="52%" stop-color="#B8CCA8"/>
      <stop offset="100%" stop-color="#8EAE8E"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼棘龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0C0A8"/>
      <stop offset="100%" stop-color="#96AC90"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 芦荡 -->
  <g stroke="#8EAE82" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M 30 150 Q 28 130 32 116"/>
    <path d="M 26 136 L 16 132 M 28 126 L 20 120"/>
    <path d="M 170 152 Q 168 132 172 118"/>
    <path d="M 170 138 L 180 134 M 171 128 L 180 122"/>
  </g>

  <!-- 河口浅水 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EB8A0" opacity="0.8"/>
  <g stroke="#A8D0BC" stroke-width="1.3" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 160 Q 60 157 90 160 Q 120 163 150 160">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小鱼（游过） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 120 164 L 128 162 L 126 166 Z" fill="#C0A888"/>
    <path d="M 134 166 L 142 164 L 140 168 Z" fill="#C0A888"/>
  </g>

  <!-- 幼棘龙（浅水拍玩，背帆嫩红） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="138" rx="16" ry="11" fill="url(#skin)" stroke="#7E9678" stroke-width="1"/>
    <ellipse cx="101" cy="143" rx="9" ry="5.5" fill="#E4E0D0" opacity="0.7"/>
    <!-- 背帆（嫩红） -->
    <path d="M 96 130 Q 100 112 108 112 Q 112 122 116 130 Q 106 124 96 130 Z" fill="#E09070"/>
    <!-- 腿（浅水） -->
    <path d="M 94 146 L 92 152 M 114 146 L 116 152" stroke="#7E9678" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 120 142 Q 128 138 130 132" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 142;7 120 142;0 120 142" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 短手（拨水） -->
    <path d="M 92 130 Q 86 126 84 122" stroke="url(#skin)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 92 130;-10 92 130;0 92 130" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 拨起的水花 -->
    <g fill="#C8E4D8" opacity="0.6">
      <circle cx="82" cy="120" r="1.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 幼棘龙头（见鱼不追，看） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="118" rx="11" ry="9.5" fill="url(#skin)" stroke="#7E9678" stroke-width="0.9"/>
    <!-- 眼（好奇） -->
    <circle cx="99" cy="116" r="2.4" fill="#24180E"/>
    <circle cx="99.6" cy="115.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="116" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="115.4" r="0.8" fill="#FFF"/>
    <!-- 嘴（微张） -->
    <path d="M 98 122 Q 104 124.4 110 122" fill="none" stroke="#7E9678" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 鼻 -->
    <circle cx="100" cy="120" r="0.8" fill="#5E7658"/>
    <circle cx="108" cy="120" r="0.8" fill="#5E7658"/>
    <!-- 背帆上沿（嫩红） -->
    <path d="M 100 114 Q 104 110 108 114" stroke="#E0A080" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
