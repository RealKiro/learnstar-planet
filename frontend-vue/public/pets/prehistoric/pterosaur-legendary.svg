<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="翼龙·五阶·天空之王·盘旋高空俯瞰俯冲驮兽长鸣示警">
  <defs>
    <!-- 背景：白垩高空夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8A8"/>
      <stop offset="52%" stop-color="#D0BC8C"/>
      <stop offset="100%" stop-color="#A0B0B8"/>
    </linearGradient>
    <!-- 神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FCF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECF0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 翼龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8C0C8"/>
      <stop offset="100%" stop-color="#9CA6AE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F4F8FC" opacity="0.85">
    <path d="M 0 126 Q 50 118 100 124 Q 160 130 200 122 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 大地（下） -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EAE7E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#AEC89E" stroke-width="1.4" opacity="0.55"/>

  <!-- 被驮起的小兽（左，翼下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="142" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="58" cy="135" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
  </g>

  <!-- 被困崖的小兽（右下，待救） -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="146" rx="5.5" ry="4" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.6"/>
    <circle cx="150" cy="140" r="3.4" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.5"/>
    <!-- 被困（崖边） -->
    <path d="M 148 144 L 152 144" stroke="#9EA28C" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 天空之王翼龙（盘旋俯瞰） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（大展如云） -->
    <path d="M 96 96 L 56 78 L 64 92 L 40 82 L 62 96 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="1"/>
    <path d="M 96 96 L 136 78 L 128 92 L 152 82 L 130 96 Z" fill="url(#skin)" stroke="#8E989E" stroke-width="1"/>
    <!-- 身 -->
    <ellipse cx="96" cy="102" rx="8.5" ry="6.5" fill="url(#skin)" stroke="#8E989E" stroke-width="0.9"/>
    <!-- 尾 -->
    <path d="M 102 105 L 114 107 L 116 112" stroke="url(#skin)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 天空之王头（俯瞰，长鸣示警） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="92" rx="7" ry="6" fill="url(#skin)" stroke="#8E989E" stroke-width="0.8"/>
    <circle cx="93" cy="90.5" r="1.7" fill="#24180E"/>
    <circle cx="93.4" cy="90.1" r="0.55" fill="#FFF"/>
    <circle cx="99.4" cy="90.5" r="1.7" fill="#24180E"/>
    <circle cx="99.8" cy="90.1" r="0.55" fill="#FFF"/>
    <path d="M 95 94 L 93 97 L 97 96.4 Z" fill="#C0B888"/>
    <path d="M 93 88 L 92 85 M 98 88 L 100 85" stroke="#B8C0C8" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 长鸣示警波纹 -->
    <g stroke="#E8F0F0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 102 88 Q 110 84 116 80">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 额间神光 -->
    <circle cx="96" cy="86" r="2.4" fill="#FCF0D0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 神光星尘 -->
  <g fill="#FCF0D0">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
