<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大地懒·六阶·大地懒传说·暮色爪碰小懒传慢不是弱看得清">
  <defs>
    <!-- 背景：森林暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C4A0"/>
      <stop offset="52%" stop-color="#D8AC78"/>
      <stop offset="100%" stop-color="#96AC98"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8D890" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8D890" stop-opacity="0"/>
    </radialGradient>
    <!-- 老大地懒毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A08E76"/>
      <stop offset="100%" stop-color="#82705A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林 -->
  <g fill="#6E9E78" opacity="0.4">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#86A87A" opacity="0.8"/>

  <!-- 落叶（小懒在扒） -->
  <path d="M 66 148 Q 70 144 74 148 Q 70 152 66 148 Z" fill="#C89850"/>

  <!-- 小大地懒（左下，扒叶慢看） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="58" cy="136" rx="11" ry="8" fill="url(#fur)" stroke="#6E5E46" stroke-width="0.8"/>
    <ellipse cx="56" cy="140" rx="6" ry="4" fill="#DCD0B8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 52 141 L 50 147 M 65 141 L 67 147" stroke="#6E5E46" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 爪（扒叶） -->
    <path d="M 62 130 Q 66 126 68 128" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 小大地懒头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="124" rx="8" ry="7.5" fill="url(#fur)" stroke="#6E5E46" stroke-width="0.8"/>
    <circle cx="54.5" cy="122.5" r="1.9" fill="#24180E"/>
    <circle cx="55" cy="122.1" r="0.6" fill="#FFF"/>
    <circle cx="62" cy="122.5" r="1.9" fill="#24180E"/>
    <circle cx="62.5" cy="122.1" r="0.6" fill="#FFF"/>
    <ellipse cx="58" cy="126.5" rx="1.4" ry="1" fill="#5E4E3A"/>
    <circle cx="51" cy="118" r="2" fill="#7E6A52"/>
    <circle cx="65" cy="118" r="2" fill="#7E6A52"/>
  </g>

  <!-- 老大地懒（爪碰小懒，传稳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="120" cy="128" rx="18" ry="12.5" fill="url(#fur)" stroke="#6E5E46" stroke-width="1.1"/>
    <ellipse cx="116" cy="133" rx="10" ry="6.5" fill="#DCD0B8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 110 137 L 108 146 M 132 137 L 134 146" stroke="#6E5E46" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 138 133 Q 144 132 147 136" stroke="url(#fur)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 头（低，爪碰小懒） -->
    <path d="M 112 122 Q 100 124 92 124" stroke="url(#fur)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <!-- 大爪（垂，碰小懒） -->
    <path d="M 88 126 Q 80 122 76 124" stroke="url(#fur)" stroke-width="3.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 88 126;-6 88 126;0 88 126" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 老大地懒头（温和，传稳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="92" cy="118" rx="9" ry="8" fill="url(#fur)" stroke="#6E5E46" stroke-width="0.9"/>
    <circle cx="88.5" cy="116" r="2" fill="#24180E"/>
    <circle cx="89" cy="115.6" r="0.65" fill="#FFF"/>
    <circle cx="96" cy="116" r="2" fill="#24180E"/>
    <circle cx="96.5" cy="115.6" r="0.65" fill="#FFF"/>
    <ellipse cx="92" cy="120" rx="1.7" ry="1.3" fill="#5E4E3A"/>
    <path d="M 89 123 Q 92 124.4 95 123" fill="none" stroke="#8E7A5E" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="84" cy="112" r="2" fill="#7E6A52"/>
    <circle cx="100" cy="112" r="2" fill="#7E6A52"/>
    <!-- 传心微光 -->
    <circle cx="76" cy="112" r="7" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
