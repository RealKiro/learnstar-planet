<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梁龙·三阶·练颈苦修·长颈探梢够叶卷起玩具还主">
  <defs>
    <!-- 背景：高树边晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE8D4"/>
      <stop offset="52%" stop-color="#BCCCB8"/>
      <stop offset="100%" stop-color="#94AA98"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F4FAF0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4FAF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年梁龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B8A4"/>
      <stop offset="100%" stop-color="#86A28E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 沼泽 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EB8A8" opacity="0.8"/>
  <g stroke="#A8D0C0" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 162 Q 60 159 90 162 Q 120 165 150 162"/>
  </g>

  <!-- 高树（右） -->
  <g>
    <path d="M 168 150 Q 166 108 158 80" stroke="#6E5640" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M 160 92 Q 148 84 140 76 M 162 104 Q 150 98 142 92 M 158 80 Q 152 72 146 66" stroke="#6E5640" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <g fill="#7EAE6E">
      <path d="M 140 76 Q 134 70 130 64 Q 138 68 142 72 Z"/>
      <path d="M 142 92 Q 136 88 132 84 Q 139 87 144 89 Z"/>
      <path d="M 146 66 Q 140 60 136 54 Q 144 60 148 64 Z"/>
    </g>
  </g>

  <!-- 水边滑落的小玩具（右前，被卷起） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 130 146 Q 136 142 140 144 L 136 150 Z" fill="#E0A048"/>
  </g>

  <!-- 少年梁龙（长颈探梢够叶，卷物） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="134" rx="16" ry="11" fill="url(#skin)" stroke="#7A947E" stroke-width="1"/>
    <ellipse cx="101" cy="139" rx="10" ry="6" fill="#E0E8D8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 95 142 L 93 149 M 115 142 L 117 149" stroke="#7A947E" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 120 138 Q 130 134 136 126" stroke="url(#skin)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 138;6 120 138;0 120 138" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 长颈（探梢，如长臂） -->
    <path d="M 100 130 Q 96 118 106 104 Q 116 90 130 82" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 卷物的颈（下探卷玩具） -->
    <path d="M 128 84 Q 138 104 134 132" stroke="url(#skin)" stroke-width="5.5" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 128 84;6 128 84;0 128 84" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年梁龙头（探梢够叶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="130" cy="80" rx="7" ry="6" fill="url(#skin)" stroke="#7A947E" stroke-width="0.8"/>
    <circle cx="127" cy="78.5" r="1.6" fill="#24180E"/>
    <circle cx="127.4" cy="78.1" r="0.5" fill="#FFF"/>
    <circle cx="133.4" cy="78.5" r="1.6" fill="#24180E"/>
    <circle cx="133.8" cy="78.1" r="0.5" fill="#FFF"/>
    <path d="M 128 83 L 126 85.6 L 130 85 Z" fill="#8E9278"/>
    <!-- 够到叶的光 -->
    <circle cx="134" cy="74" r="2.2" fill="#F4FAF0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F4FAF0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
