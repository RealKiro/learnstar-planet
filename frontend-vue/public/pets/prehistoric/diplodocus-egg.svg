<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="梁龙·一阶·长颈初伸·颤颈够叶母颈轻带身稳立">
  <defs>
    <!-- 背景：白垩沼泽晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E0D0"/>
      <stop offset="52%" stop-color="#B0C8B8"/>
      <stop offset="100%" stop-color="#8EAE98"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F0F8EC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0F8EC" stop-opacity="0"/>
    </radialGradient>
    <!-- 小梁龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A0B8A4"/>
      <stop offset="100%" stop-color="#88A290"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 沼泽水 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EB8A8" opacity="0.8"/>
  <g stroke="#A8D0C0" stroke-width="1.3" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 160 Q 60 157 90 160 Q 120 163 150 160">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 高树（右，嫩叶） -->
  <g>
    <path d="M 168 150 Q 166 110 158 84" stroke="#6E5640" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M 160 96 Q 148 88 140 80 M 162 108 Q 150 102 142 96 M 158 84 Q 152 76 146 70" stroke="#6E5640" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <g fill="#7EAE6E">
      <path d="M 140 80 Q 134 74 130 68 Q 138 72 142 76 Z"/>
      <path d="M 142 96 Q 136 92 132 88 Q 139 91 144 93 Z"/>
      <path d="M 146 70 Q 140 64 136 58 Q 144 64 148 68 Z"/>
    </g>
  </g>

  <!-- 小梁龙（长颈颤颤够叶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="136" rx="15" ry="10.5" fill="url(#skin)" stroke="#7A947E" stroke-width="0.9"/>
    <ellipse cx="101" cy="141" rx="9" ry="5.5" fill="#E0E8D8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 95 144 L 93 150 M 114 144 L 116 150" stroke="#7A947E" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾（如鞭） -->
    <path d="M 119 140 Q 128 136 132 130" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 119 140;6 119 140;0 119 140" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 长颈（颤颤向上够叶） -->
    <path d="M 102 130 Q 100 116 108 104 Q 116 92 128 84" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 102 130;4 102 130;0 102 130" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小梁龙头（够叶，差一点） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="130" cy="82" rx="7" ry="6" fill="url(#skin)" stroke="#7A947E" stroke-width="0.8"/>
    <circle cx="127" cy="80.5" r="1.6" fill="#24180E"/>
    <circle cx="127.4" cy="80.1" r="0.5" fill="#FFF"/>
    <circle cx="133.4" cy="80.5" r="1.6" fill="#24180E"/>
    <circle cx="133.8" cy="80.1" r="0.5" fill="#FFF"/>
    <!-- 嘴（够叶） -->
    <path d="M 128 85 L 126 87.6 L 130 87 Z" fill="#8E9278"/>
    <!-- 够叶的着急光 -->
    <circle cx="136" cy="78" r="2" fill="#F0F8EC" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 母梁龙（右后，长颈轻带） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 长颈（垂下来轻带小梁龙头） -->
    <path d="M 178 120 Q 164 96 146 86" stroke="#8EA898" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- 母头（低） -->
    <ellipse cx="142" cy="84" rx="7" ry="6" fill="#8EA898"/>
    <!-- 轻带（颈蹭小梁龙） -->
    <path d="M 136 86 L 132 84" stroke="#8EA898" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F0F8EC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
