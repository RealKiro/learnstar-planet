<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="甲龙·二阶·尾锤之痛·甩尾锤锤倒同伴蹲身甲挡悔怕">
  <defs>
    <!-- 背景：灌木丛暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C4B0"/>
      <stop offset="52%" stop-color="#9EAC98"/>
      <stop offset="100%" stop-color="#7E927E"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E4E4D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E4E4D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 小甲龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ACB09A"/>
      <stop offset="100%" stop-color="#949A86"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 灌木影 -->
  <g fill="#5E6E58" opacity="0.35">
    <path d="M 0 112 Q 60 104 130 110 Q 170 114 200 108 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E76" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#9EBE96" stroke-width="1.4" opacity="0.5"/>

  <!-- 被锤晕的同伴（左，坐地） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="142" rx="7" ry="5.2" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="58" cy="135" r="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 54 133.6 Q 52 131.6 52 129.6" stroke="#C4C8B0" stroke-width="1" stroke-linecap="round"/>
    <!-- 晕圈 -->
    <g stroke="#A6AA90" stroke-width="0.9" fill="none" opacity="0.6">
      <path d="M 62 130 Q 65 128 67 130">
        <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 受伤处 -->
    <circle cx="60" cy="140" r="1.6" fill="#C84030" opacity="0.7"/>
  </g>

  <!-- 小甲龙（蹲身甲挡，尾锤垂） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（蹲，甲） -->
    <ellipse cx="104" cy="136" rx="15" ry="11" fill="url(#skin)" stroke="#8E9680" stroke-width="0.9"/>
    <g stroke="#8E9680" stroke-width="0.9" fill="none" opacity="0.6">
      <path d="M 93 133 Q 104 127 115 133 Q 104 139 93 133 Z"/>
    </g>
    <ellipse cx="101" cy="142" rx="8" ry="5" fill="#E4DCC8" opacity="0.7"/>
    <!-- 腿（蹲） -->
    <path d="M 95 144 L 93 150 M 113 144 L 115 150" stroke="#8E9680" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾锤（垂，悔） -->
    <path d="M 119 140 Q 127 142 130 147" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="132" cy="148" rx="4" ry="3" fill="url(#skin)" stroke="#8E9680" stroke-width="0.7"/>
  </g>

  <!-- 小甲龙头（蹲，慌悔） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="116" rx="10.5" ry="9" fill="url(#skin)" stroke="#8E9680" stroke-width="0.9"/>
    <!-- 眼（慌悔） -->
    <circle cx="99" cy="114" r="2.3" fill="#24180E"/>
    <circle cx="99.6" cy="113.4" r="0.75" fill="#FFF"/>
    <circle cx="109.5" cy="114" r="2.3" fill="#24180E"/>
    <circle cx="110.1" cy="113.4" r="0.75" fill="#FFF"/>
    <!-- 鼻/喙 -->
    <path d="M 101 119 L 108 119 L 104.5 121.5 Z" fill="#8E9278"/>
    <!-- 头侧甲 -->
    <path d="M 94 110 Q 90 116 92 122" stroke="#8E9680" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 114 110 Q 118 116 116 122" stroke="#8E9680" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E4E4D0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
