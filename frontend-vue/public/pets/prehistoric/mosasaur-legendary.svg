<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="沧龙·五阶·海渊之王·庞大巡游海渊猎者退避小海兽安">
  <defs>
    <!-- 背景：深海渊靛 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46627E"/>
      <stop offset="52%" stop-color="#36526E"/>
      <stop offset="100%" stop-color="#7A9EBC"/>
    </linearGradient>
    <!-- 王之神光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#B8D8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#8EB0C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8EB0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 海渊之王皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#466A84"/>
      <stop offset="100%" stop-color="#34546E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="110" r="70" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 深渊微光 -->
  <g fill="#A8C8DC" opacity="0.5">
    <circle cx="40" cy="160" r="1.6">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="170" r="1.3">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 退避的猎者（右上远） -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 150 70 Q 162 62 172 66 L 178 70 L 170 74 Q 158 76 150 70 Z" fill="#2A3A48"/>
  </g>

  <!-- 安然的小海兽（左） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="142" rx="5.5" ry="4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="52" cy="135" r="3.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
  </g>

  <!-- 海渊之王沧龙（庞大巡游） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（庞大如堤） -->
    <ellipse cx="112" cy="120" rx="26" ry="13" fill="url(#skin)" stroke="#2E4E64" stroke-width="1.2"/>
    <ellipse cx="106" cy="125" rx="16" ry="8" fill="#C8D8E0" opacity="0.7"/>
    <!-- 尾（如桨，有力） -->
    <path d="M 136 122 Q 152 116 160 106" stroke="url(#skin)" stroke-width="4.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 136 122;5 136 122;0 136 122" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 尾桨 -->
    <path d="M 158 104 L 170 96 L 168 108 Z" fill="url(#skin)" stroke="#2E4E64" stroke-width="0.9"/>
    <!-- 鳍 -->
    <path d="M 100 114 L 88 106 L 94 120 Z" fill="url(#skin)" stroke="#2E4E64" stroke-width="1"/>
    <path d="M 126 114 L 140 106 L 134 120 Z" fill="url(#skin)" stroke="#2E4E64" stroke-width="1"/>
  </g>

  <!-- 海渊之王头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="90" cy="112" rx="12" ry="9" fill="url(#skin)" stroke="#2E4E64" stroke-width="1"/>
    <!-- 眼（含威含温） -->
    <path d="M 81 110 Q 83 108.6 85 110 M 96 110 Q 98 108.6 99 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="83" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="83.6" cy="110.4" r="0.8" fill="#FFF"/>
    <circle cx="97.5" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="98.1" cy="110.4" r="0.8" fill="#FFF"/>
    <!-- 嘴（闭，巡游） -->
    <path d="M 80 117 Q 90 119.5 100 117" fill="none" stroke="#2E4E64" stroke-width="1" stroke-linecap="round"/>
    <!-- 额间王光 -->
    <circle cx="90" cy="104" r="2.6" fill="#B8D8E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 王光星尘 -->
  <g fill="#B8D8E8">
    <circle cx="36" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
