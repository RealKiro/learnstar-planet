<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨齿鲨·五阶·海洋之王·深海巡游庞大如堤猎者退避">
  <defs>
    <!-- 背景：深海渊 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46627E"/>
      <stop offset="52%" stop-color="#36526E"/>
      <stop offset="100%" stop-color="#7A9EBC"/>
    </linearGradient>
    <!-- 王之神光 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#B8D8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#8EB0C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8EB0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 海洋之王皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A7E96"/>
      <stop offset="100%" stop-color="#42667E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="110" r="70" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 深渊微光 -->
  <g fill="#A8C8DC" opacity="0.5">
    <circle cx="40" cy="160" r="1.6">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="170" r="1.3">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 退避的猎者（右上远） -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 148 70 Q 160 62 170 66 L 176 70 L 168 74 Q 156 76 148 70 Z" fill="#2A3A48"/>
  </g>

  <!-- 安然的小海兽（左） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="142" rx="5.5" ry="4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="52" cy="135" r="3.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
  </g>

  <!-- 海洋之王巨齿鲨（庞大巡游） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如堤如山） -->
    <ellipse cx="116" cy="122" rx="27" ry="13" fill="url(#skin)" stroke="#32566E" stroke-width="1.2"/>
    <ellipse cx="108" cy="126" rx="16" ry="8" fill="#C8DCE4" opacity="0.7"/>
    <!-- 尾 -->
    <path d="M 141 124 Q 154 118 162 108" stroke="url(#skin)" stroke-width="4.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 141 124;5 141 124;0 141 124" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 160 106 L 172 96 L 170 110 Z" fill="url(#skin)" stroke="#32566E" stroke-width="0.9"/>
    <!-- 背鳍 -->
    <path d="M 112 112 L 108 92 L 120 110 Z" fill="url(#skin)" stroke="#32566E" stroke-width="1"/>
    <!-- 胸鳍 -->
    <path d="M 102 118 L 88 106 L 94 122 Z" fill="url(#skin)" stroke="#32566E" stroke-width="1"/>
  </g>

  <!-- 海洋之王头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="94" cy="116" rx="13" ry="9.5" fill="url(#skin)" stroke="#32566E" stroke-width="1"/>
    <!-- 眼（含威含温） -->
    <path d="M 85 114 Q 87 112.6 89 114 M 100 114 Q 102 112.6 103 114" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="87" cy="115" r="2.4" fill="#24180E"/>
    <circle cx="87.6" cy="114.4" r="0.8" fill="#FFF"/>
    <circle cx="101.5" cy="115" r="2.4" fill="#24180E"/>
    <circle cx="102.1" cy="114.4" r="0.8" fill="#FFF"/>
    <!-- 嘴（闭，巡游） -->
    <path d="M 83 121 Q 94 124 105 121" fill="none" stroke="#32566E" stroke-width="1.1" stroke-linecap="round"/>
    <!-- 牙（如月） -->
    <path d="M 86 121 L 87 123.6 M 94 122.4 L 95 125" stroke="#F4F0E4" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 额间王光 -->
    <circle cx="94" cy="108" r="2.8" fill="#B8D8E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 王光星尘 -->
  <g fill="#B8D8E8">
    <circle cx="36" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
