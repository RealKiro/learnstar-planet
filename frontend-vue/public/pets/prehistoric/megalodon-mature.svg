<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="巨齿鲨·四阶·护海初成·身横挡猎者鱼群绕身游过安">
  <defs>
    <!-- 背景：浅海护生 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#96C0D4"/>
      <stop offset="52%" stop-color="#74A8C0"/>
      <stop offset="100%" stop-color="#5890AA"/>
    </linearGradient>
    <!-- 护生威光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#E0F2F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E0F2F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年巨齿鲨皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7696AC"/>
      <stop offset="100%" stop-color="#5C7E92"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 光斑 -->
  <g fill="#E0F2F8" opacity="0.5">
    <circle cx="120" cy="28" r="3.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 海底沙 -->
  <path d="M 0 170 L 200 170 L 200 200 L 0 200 Z" fill="#A8C0C8" opacity="0.7"/>

  <!-- 被弹开的猎者（右上） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 146 88 Q 158 80 168 84 L 174 88 L 166 92 Q 154 94 146 88 Z" fill="#4A5E72"/>
    <circle cx="152" cy="85" r="1.3" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 绕身游过的鱼群（左下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 50 150 L 58 148 L 56 152 Z" fill="#C0A888"/>
    <path d="M 62 154 L 70 152 L 68 156 Z" fill="#C0A888"/>
    <path d="M 56 158 L 64 156 L 62 160 Z" fill="#C0A888"/>
  </g>

  <!-- 少年巨齿鲨（身横挡，庞大） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（庞大如堤，横挡） -->
    <ellipse cx="112" cy="126" rx="22" ry="11" fill="url(#skin)" stroke="#4E6E82" stroke-width="1.1"/>
    <ellipse cx="106" cy="130" rx="13" ry="6.5" fill="#DCE8EC" opacity="0.7"/>
    <!-- 尾 -->
    <path d="M 132 128 Q 144 122 152 114" stroke="url(#skin)" stroke-width="3.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 132 128;5 132 128;0 132 128" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 尾鳍 -->
    <path d="M 150 112 L 160 104 L 158 116 Z" fill="url(#skin)" stroke="#4E6E82" stroke-width="0.9"/>
    <!-- 背鳍 -->
    <path d="M 108 116 L 104 98 L 114 114 Z" fill="url(#skin)" stroke="#4E6E82" stroke-width="0.9"/>
    <!-- 胸鳍 -->
    <path d="M 100 122 L 88 112 L 92 126 Z" fill="url(#skin)" stroke="#4E6E82" stroke-width="0.9"/>
  </g>

  <!-- 少年巨齿鲨头（含威含护） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="94" cy="122" rx="12" ry="9" fill="url(#skin)" stroke="#4E6E82" stroke-width="1"/>
    <!-- 眼（含威含护） -->
    <path d="M 86 120 Q 88 118.6 90 120 M 99 120 Q 101 118.6 102 120" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="88" cy="121" r="2.4" fill="#24180E"/>
    <circle cx="88.6" cy="120.4" r="0.8" fill="#FFF"/>
    <circle cx="100.5" cy="121" r="2.4" fill="#24180E"/>
    <circle cx="101.1" cy="120.4" r="0.8" fill="#FFF"/>
    <!-- 嘴（闭，护群） -->
    <path d="M 84 127 Q 94 130 104 127" fill="none" stroke="#4E6E82" stroke-width="1" stroke-linecap="round"/>
    <!-- 牙（如玉） -->
    <path d="M 86 127 L 87 129.4 M 94 128.4 L 95 130.8" stroke="#F0E8D8" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 护海星尘 -->
  <g fill="#E0F2F8">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
