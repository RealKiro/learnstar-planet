<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="霸王龙·五阶·白垩霸主·立崖巅俯瞰领地低吼镇界护幼兽">
  <defs>
    <!-- 背景：白垩原野夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4DCA8"/>
      <stop offset="52%" stop-color="#DCC08C"/>
      <stop offset="100%" stop-color="#A8B47C"/>
    </linearGradient>
    <!-- 霸主神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFF4D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECF0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 霸主皮（如铠） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B89870"/>
      <stop offset="100%" stop-color="#9E8258"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="110" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 原野 -->
  <g fill="#8EA878" opacity="0.5">
    <path d="M 0 126 Q 60 118 130 124 Q 170 128 200 122 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9EAE78" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#BEC89A" stroke-width="1.4" opacity="0.55"/>

  <!-- 远护的幼兽（左，安然） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="144" rx="6" ry="4.4" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.7"/>
    <circle cx="52" cy="137" r="3.8" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.6"/>
    <path d="M 50 139 L 48 144 M 55 139 L 57 144" stroke="#B8AC96" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 被镇的入侵者（右远，低首） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="160" cy="140" rx="8" ry="5.5" fill="#5E6658" stroke="#4E5648" stroke-width="0.7"/>
    <circle cx="156" cy="134" r="4.5" fill="#5E6658" stroke="#4E5648" stroke-width="0.6"/>
    <circle cx="154" cy="133" r="1" fill="#C84030" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 霸主霸王龙（立崖巅，俯瞰） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如铠） -->
    <ellipse cx="104" cy="124" rx="19" ry="12" fill="url(#skin)" stroke="#8E7248" stroke-width="1.1"/>
    <ellipse cx="99" cy="129" rx="11" ry="6.5" fill="#E8DCC8" opacity="0.7"/>
    <!-- 腿（如山） -->
    <path d="M 92 133 L 89 146 M 118 133 L 121 146" stroke="#987C50" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 尾（如鞭） -->
    <path d="M 123 128 Q 136 120 142 108" stroke="url(#skin)" stroke-width="3.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 123 128;5 123 128;0 123 128" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 短手（前指） -->
    <path d="M 90 118 L 84 110" stroke="url(#skin)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 霸主霸王龙头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="102" rx="13.5" ry="11.5" fill="url(#skin)" stroke="#8E7248" stroke-width="1"/>
    <!-- 眼（含威含温） -->
    <path d="M 93 100 Q 95.6 98.4 99 100 M 110 100 Q 112.4 98.4 115 100" stroke="#24180E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="101" r="2.5" fill="#24180E"/>
    <circle cx="96.6" cy="100.4" r="0.85" fill="#FFF"/>
    <circle cx="113" cy="101" r="2.5" fill="#24180E"/>
    <circle cx="113.6" cy="100.4" r="0.85" fill="#FFF"/>
    <!-- 嘴（镇界，不露齿） -->
    <path d="M 96 107 Q 104 110 112 107" fill="none" stroke="#8E7044" stroke-width="1.1" stroke-linecap="round"/>
    <!-- 头上角（如圭） -->
    <path d="M 99 93 L 94 86 M 110 93 L 115 86" stroke="#D8C090" stroke-width="2" stroke-linecap="round"/>
    <!-- 额间霸主光 -->
    <circle cx="104" cy="92" r="3" fill="#FFF4D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 霸主星尘 -->
  <g fill="#FFF4D8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
