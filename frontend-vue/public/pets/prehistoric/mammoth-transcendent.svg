<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="猛犸象·六阶·猛犸传说·暮雪长牙替小猛犸拨雪露草传开路">
  <defs>
    <!-- 背景：冰原暮雪 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D4BC"/>
      <stop offset="52%" stop-color="#C8B494"/>
      <stop offset="100%" stop-color="#9AB2BE"/>
    </linearGradient>
    <!-- 暮雪金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8D890" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8D890" stop-opacity="0"/>
    </radialGradient>
    <!-- 老猛犸绒毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AC885C"/>
      <stop offset="100%" stop-color="#8E7248"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 冰川 -->
  <g fill="#C8D8E4" opacity="0.55">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#EAF2F6" opacity="0.9"/>
  <!-- 暮雪 -->
  <g fill="#F0F8FC" opacity="0.8">
    <circle cx="50" cy="40" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="30" r="1.1">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 小猛犸（左下，学拨雪） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="60" cy="136" rx="11" ry="8" fill="url(#fur)" stroke="#7E6240" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 54 141 L 52 148 M 67 141 L 69 148" stroke="#7E6240" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 小牙（试着拨） -->
    <path d="M 55 132 Q 50 133 47 136" stroke="#E8E0CC" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 小猛犸头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="124" rx="8.5" ry="7.5" fill="url(#fur)" stroke="#7E6240" stroke-width="0.8"/>
    <circle cx="56.5" cy="122.5" r="2" fill="#24180E"/>
    <circle cx="57" cy="122" r="0.65" fill="#FFF"/>
    <circle cx="64.5" cy="122.5" r="2" fill="#24180E"/>
    <circle cx="65" cy="122" r="0.65" fill="#FFF"/>
    <path d="M 57 127 L 63 127 L 60 129.5 Z" fill="#5E4628"/>
    <path d="M 53 119 Q 49 116 50 113 Q 53 114 55 117 Z" fill="#98784E"/>
    <path d="M 67 119 Q 71 116 70 113 Q 67 114 65 117 Z" fill="#98784E"/>
  </g>

  <!-- 老猛犸（长牙替小猛犸拨雪，露草） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="118" cy="128" rx="19" ry="13" fill="url(#fur)" stroke="#7E6240" stroke-width="1.1"/>
    <!-- 腿 -->
    <path d="M 108 138 L 105 149 M 130 138 L 133 149" stroke="#7E6240" stroke-width="3.6" stroke-linecap="round"/>
    <!-- 长牙（替拨雪） -->
    <path d="M 102 122 Q 90 122 82 116" stroke="#E8E0CC" stroke-width="3.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 102 122;-5 102 122;0 102 122" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 拨开的雪露草（传） -->
    <g>
      <path d="M 78 120 Q 74 116 72 112" stroke="#7EAE6E" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 72 112 Q 68 108 66 104 Q 71 108 74 110 Z" fill="#7EAE6E">
        <animateTransform attributeName="transform" type="scale" values="1 1;1.12 1.12;1 1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <circle cx="84" cy="114" r="7" fill="#FFF0D0" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 老猛犸头（温和，传开路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="118" cy="110" rx="11.5" ry="10" fill="url(#fur)" stroke="#7E6240" stroke-width="0.9"/>
    <!-- 眼（温和） -->
    <path d="M 110 108 Q 112 106.6 114 108 M 123 Q 125 106.6 126 108" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="112" cy="109" r="2.2" fill="#24180E"/>
    <circle cx="112.6" cy="108.4" r="0.7" fill="#FFF"/>
    <circle cx="124.5" cy="109" r="2.2" fill="#24180E"/>
    <circle cx="125.1" cy="108.4" r="0.7" fill="#FFF"/>
    <path d="M 113 113 L 123 113 L 118 115.5 Z" fill="#5E4628"/>
    <path d="M 108 104 Q 103 100 104 96 Q 108 98 110 102 Z" fill="#98784E"/>
    <path d="M 128 104 Q 133 100 132 96 Q 128 98 126 102 Z" fill="#98784E"/>
  </g>

  <!-- 暮雪星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
