<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="霸王龙·四阶·守巢初成·守巢口低吼翼龙逃窜蛋安">
  <defs>
    <!-- 背景：白垩巢边夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8A8"/>
      <stop offset="52%" stop-color="#D8BC84"/>
      <stop offset="100%" stop-color="#9EB078"/>
    </linearGradient>
    <!-- 吼威青光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F4F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼龙皮（守巢） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8AC80"/>
      <stop offset="100%" stop-color="#A88C60"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远林 -->
  <g fill="#8EA878" opacity="0.5">
    <path d="M 0 120 Q 60 112 130 118 Q 170 122 200 116 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E9E72" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#AEBE90" stroke-width="1.4" opacity="0.55"/>

  <!-- 巢中的蛋（右下） -->
  <g>
    <ellipse cx="138" cy="146" rx="7" ry="9" fill="#F0E8D8" stroke="#C8B89A" stroke-width="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="152" cy="148" rx="6.5" ry="8.5" fill="#F0E8D8" stroke="#C8B89A" stroke-width="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.6;0 0" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 逃窜的翼龙（右上，背影） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼 -->
    <path d="M 160 56 L 176 44 L 172 54 L 182 56 L 172 60 Z" fill="#A8A08A"/>
    <path d="M 152 60 L 140 50 L 146 58 L 138 62 L 148 64 Z" fill="#A8A08A"/>
    <!-- 身 -->
    <ellipse cx="156" cy="62" rx="5" ry="3.4" fill="#A8A08A"/>
    <!-- 惊叫 -->
    <path d="M 150 56 Q 147 54 145 52" stroke="#8E8268" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- 少年霸王龙（守巢口，低吼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="130" rx="18" ry="11.5" fill="url(#skin)" stroke="#8E7248" stroke-width="1"/>
    <ellipse cx="100" cy="135" rx="10" ry="6" fill="#E8DCC8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 94 138 L 92 148 M 116 138 L 118 148" stroke="#987C50" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾（微扬） -->
    <path d="M 122 134 Q 132 128 136 120" stroke="url(#skin)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 122 134;5 122 134;0 122 134" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 短手（前立） -->
    <path d="M 92 124 L 88 118" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年霸王龙头（含威，低吼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="110" rx="13" ry="11" fill="url(#skin)" stroke="#8E7248" stroke-width="0.9"/>
    <!-- 眼（含威） -->
    <path d="M 93 108 Q 95 106.4 98 108 M 111 108 Q 113 106.4 115 108" stroke="#24180E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <circle cx="95.5" cy="109" r="2.4" fill="#24180E"/>
    <circle cx="96.1" cy="108.4" r="0.8" fill="#FFF"/>
    <circle cx="113.5" cy="109" r="2.4" fill="#24180E"/>
    <circle cx="114.1" cy="108.4" r="0.8" fill="#FFF"/>
    <!-- 嘴（低吼露齿） -->
    <path d="M 96 115 Q 104 118 112 115" fill="none" stroke="#8E7044" stroke-width="1" stroke-linecap="round"/>
    <path d="M 98 115 L 99 118 M 103 116.6 L 103 119.4 M 108 115 L 107 118" stroke="#F4F0E4" stroke-width="1" stroke-linecap="round"/>
    <!-- 头上角（显威） -->
    <path d="M 99 101 L 95 95 M 110 101 L 114 95" stroke="#D8C090" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 吼威震纹 -->
    <g stroke="#C8D8E8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M 116 100 Q 124 96 130 90">
        <animate attributeName="opacity" values="0.55;0.18;0.55" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 118 114 Q 126 116 132 118">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 夕照星尘 -->
  <g fill="#F8E8C0">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
