<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰河犀牛·五阶·冰原之壁·角挡寒风护幼犀群取暖">
  <defs>
    <!-- 背景：冰原夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B0"/>
      <stop offset="52%" stop-color="#C8B488"/>
      <stop offset="100%" stop-color="#98B2C0"/>
    </linearGradient>
    <!-- 冰壁神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FCF4D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCF4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECF0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 冰犀厚毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AC885C"/>
      <stop offset="100%" stop-color="#8E7248"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 冰川 -->
  <g fill="#C8D8E4" opacity="0.6">
    <path d="M 0 120 Q 60 112 130 118 Q 170 122 200 116 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#EAF2F6" opacity="0.9"/>

  <!-- 寒风 -->
  <g stroke="#D8E4EC" stroke-width="1.3" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 10 60 Q 50 54 90 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 84 Q 60 78 100 84">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 取暖的幼犀群（左下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="50" cy="144" rx="6" ry="4.4" fill="#A08058" stroke="#8E7048" stroke-width="0.7"/>
    <circle cx="50" cy="137" r="3.8" fill="#A08058" stroke="#8E7048" stroke-width="0.6"/>
    <ellipse cx="64" cy="146" rx="5" ry="3.8" fill="#987A50" stroke="#8E7048" stroke-width="0.6"/>
    <circle cx="64" cy="140" r="3" fill="#987A50"/>
    <ellipse cx="56" cy="146" rx="9" ry="3.5" fill="#FCF4D8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.14;0.28" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 冰原之壁冰犀（角挡寒风） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如壁） -->
    <ellipse cx="116" cy="128" rx="20" ry="13.5" fill="url(#fur)" stroke="#7E6240" stroke-width="1.2"/>
    <!-- 腿 -->
    <path d="M 105 138 L 102 149 M 129 138 L 132 149" stroke="#7E6240" stroke-width="3.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 136 132 Q 143 130 146 135" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 冰原之壁头（角挡寒风） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="108" rx="12" ry="10.5" fill="url(#fur)" stroke="#7E6240" stroke-width="0.9"/>
    <!-- 眼（含威含温） -->
    <path d="M 108 106 Q 110 104.6 112 106 M 121 106 Q 123 104.6 124 106" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="107" r="2.3" fill="#24180E"/>
    <circle cx="110.6" cy="106.4" r="0.75" fill="#FFF"/>
    <circle cx="122.5" cy="107" r="2.3" fill="#24180E"/>
    <circle cx="123.1" cy="106.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 112 112 L 120 112 L 116 114.5 Z" fill="#5E4628"/>
    <!-- 耳 -->
    <circle cx="107" cy="101" r="2.4" fill="#98784E"/>
    <circle cx="125" cy="101" r="2.4" fill="#98784E"/>
    <!-- 角（如圭，挡风） -->
    <path d="M 110 105 Q 106 96 102 92" stroke="#E0D8C4" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M 119 105 Q 123 96 127 92" stroke="#E0D8C4" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- 额间冰壁光 -->
    <circle cx="116" cy="99" r="2.8" fill="#FCF4D8" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 冰壁星尘 -->
  <g fill="#FCF4D8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
