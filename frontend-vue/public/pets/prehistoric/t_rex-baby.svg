<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="霸王龙·二阶·懵懂之怒·愣看沾血的牙小兽哀鸣">
  <defs>
    <!-- 背景：白垩林隙暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C0A8"/>
      <stop offset="52%" stop-color="#9EA88E"/>
      <stop offset="100%" stop-color="#7E9278"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8DCC0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8DCC0" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼龙皮（沾土） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0A070"/>
      <stop offset="100%" stop-color="#A88A58"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 林隙暗影 -->
  <g fill="#5E6E58" opacity="0.35">
    <path d="M 0 108 Q 60 100 130 106 Q 170 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E9E72" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#A8B488" stroke-width="1.4" opacity="0.5"/>

  <!-- 被咬伤的小兽（左，哀鸣） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="142" rx="7" ry="5.2" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.7"/>
    <circle cx="58" cy="135" r="4.4" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.6"/>
    <path d="M 54 133.6 Q 52 131.6 52 129.6" stroke="#D8CCB4" stroke-width="1" stroke-linecap="round"/>
    <circle cx="55.6" cy="134" r="1.1" fill="#24180E"/>
    <circle cx="60.4" cy="134" r="1.1" fill="#24180E"/>
    <!-- 受伤的腿 -->
    <path d="M 60 142 L 62 148" stroke="#B8AC96" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 血迹 -->
    <circle cx="62" cy="146" r="1.6" fill="#C84030" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 哀鸣波纹 -->
    <g stroke="#A8B488" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 50 132 Q 47 130 45 128">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 幼霸王龙（愣看沾血的牙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="136" rx="15" ry="10.5" fill="url(#skin)" stroke="#8E7248" stroke-width="0.9"/>
    <ellipse cx="100" cy="141" rx="9" ry="5.5" fill="#E8DCC8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 95 144 L 93 151 M 113 144 L 115 151" stroke="#987C50" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 119 140 Q 128 140 132 146" stroke="url(#skin)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 短手（抬起看牙） -->
    <path d="M 93 130 Q 88 124 84 122" stroke="url(#skin)" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 93 130;-8 93 130;0 93 130" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 幼霸王龙头（愣，沾血） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="116" rx="11.5" ry="10" fill="url(#skin)" stroke="#8E7248" stroke-width="0.9"/>
    <!-- 眼（愣） -->
    <circle cx="99" cy="114" r="2.6" fill="#24180E"/>
    <circle cx="99.7" cy="113.3" r="0.9" fill="#FFF"/>
    <circle cx="110" cy="114" r="2.6" fill="#24180E"/>
    <circle cx="110.7" cy="113.3" r="0.9" fill="#FFF"/>
    <!-- 嘴（半张，沾血） -->
    <path d="M 97 118 Q 104 121 111 118" fill="none" stroke="#8E7044" stroke-width="1" stroke-linecap="round"/>
    <circle cx="100" cy="119" r="1.4" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 头上小角 -->
    <path d="M 99 107 L 97 102 M 109 107 L 111 102" stroke="#D8C090" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E8DCC0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
