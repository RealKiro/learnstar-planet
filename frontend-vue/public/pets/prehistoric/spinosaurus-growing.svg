<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="棘龙·三阶·练帆苦修·风口练帆散热一爪入水稳捞鱼">
  <defs>
    <!-- 背景：河口风口夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D8B8"/>
      <stop offset="52%" stop-color="#C8BC98"/>
      <stop offset="100%" stop-color="#8EAE92"/>
    </linearGradient>
    <!-- 夕光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#FCF0D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FCF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年棘龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8BCA8"/>
      <stop offset="100%" stop-color="#8CA48C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 风痕 -->
  <g stroke="#F0E4C8" stroke-width="1.3" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 10 50 Q 50 44 90 50">
      <animateTransform attributeName="transform" type="translate" values="0 0;7 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 76 Q 60 70 100 76">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 芦荡 -->
  <g stroke="#7E9678" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 28 150 Q 26 132 30 120"/>
    <path d="M 172 152 Q 170 134 174 122"/>
  </g>

  <!-- 河口浅水 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EB8A0" opacity="0.8"/>
  <g stroke="#A8D0BC" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 162 Q 60 159 90 162 Q 120 165 150 162">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被捞起的鱼（右前，爪上） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 138 136 Q 150 130 160 134 L 166 138 L 158 142 Q 148 142 138 136 Z" fill="#C0A888"/>
    <circle cx="146" cy="134" r="1.2" fill="#24180E"/>
    <circle cx="152" cy="137" r="3" fill="#FCF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年棘龙（张帆，一爪入水） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="134" rx="17" ry="11.5" fill="url(#skin)" stroke="#6E8670" stroke-width="1"/>
    <ellipse cx="101" cy="138" rx="10" ry="6" fill="#D8DCC8" opacity="0.7"/>
    <!-- 背帆（渐高，如旗） -->
    <path d="M 95 126 Q 99 104 110 104 Q 114 116 119 126 Q 107 118 95 126 Z" fill="#E09070"/>
    <!-- 帆纹 -->
    <g stroke="#C8785C" stroke-width="0.9" fill="none" opacity="0.6">
      <path d="M 99 120 L 105 112 M 103 124 L 110 114 M 107 126 L 114 116"/>
    </g>
    <!-- 腿 -->
    <path d="M 94 142 L 92 149 M 116 142 L 118 149" stroke="#6E8670" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 121 138 Q 132 132 138 124" stroke="url(#skin)" stroke-width="2.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 121 138;6 121 138;0 121 138" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 短手（入水捞鱼） -->
    <path d="M 90 128 Q 100 122 132 136" stroke="url(#skin)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 90 128;8 90 128;0 90 128" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年棘龙头（专注，帆影长） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="114" rx="11.5" ry="10" fill="url(#skin)" stroke="#6E8670" stroke-width="0.9"/>
    <!-- 眼（专注） -->
    <path d="M 95 112 Q 97 110.6 99 112 M 110 112 Q 112 110.6 113 112" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="97" cy="113" r="2.3" fill="#24180E"/>
    <circle cx="97.6" cy="112.4" r="0.75" fill="#FFF"/>
    <circle cx="111.5" cy="113" r="2.3" fill="#24180E"/>
    <circle cx="112.1" cy="112.4" r="0.75" fill="#FFF"/>
    <!-- 嘴 -->
    <path d="M 98 118 Q 104 120.4 110 118" fill="none" stroke="#6E8670" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 鼻 -->
    <circle cx="100" cy="116" r="0.8" fill="#5E7658"/>
    <circle cx="108" cy="116" r="0.8" fill="#5E7658"/>
  </g>

  <!-- 夕照星尘 -->
  <g fill="#FCF0D0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
