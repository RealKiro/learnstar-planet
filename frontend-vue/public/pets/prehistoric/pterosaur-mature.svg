<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="翼龙·四阶·巡天初成·暴风雨中俯冲爪携小兽上岸">
  <defs>
    <!-- 背景：暴风雨河面 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EA6B8"/>
      <stop offset="52%" stop-color="#6E8A9E"/>
      <stop offset="100%" stop-color="#5A768A"/>
    </linearGradient>
    <!-- 雨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#D0E4EC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D0E4EC" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年翼龙皮（淋湿） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8B2BA"/>
      <stop offset="100%" stop-color="#8E9AA2"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雨线 -->
  <g stroke="#D0E4EC" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 30 10 L 26 40" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 80 10 L 76 44" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 10 L 136 42" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 180 10 L 176 40" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="0.85s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 河面（浪） -->
  <g fill="#7E9EAE" opacity="0.8">
    <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z"/>
  </g>
  <g stroke="#A8C0CC" stroke-width="1.4" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 20 158 Q 60 154 100 158 Q 140 162 180 158">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 30 172 Q 70 168 110 172 Q 150 176 190 172">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 岸边（右下） -->
  <path d="M 150 150 L 200 150 L 200 200 L 150 200 Z" fill="#6E8A6A" opacity="0.8"/>

  <!-- 被救起的小兽（翼龙爪下） -->
  <g>
    <ellipse cx="104" cy="150" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="104" cy="143" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <circle cx="102.4" cy="142.4" r="1" fill="#24180E"/>
    <circle cx="105.6" cy="142.4" r="1" fill="#24180E"/>
  </g>

  <!-- 少年翼龙（俯冲爪携，带水） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（展） -->
    <path d="M 92 122 L 58 108 L 64 120 L 44 112 L 62 124 Z" fill="url(#skin)" stroke="#7E8A92" stroke-width="0.9"/>
    <path d="M 92 122 L 126 108 L 120 120 L 140 112 L 122 124 Z" fill="url(#skin)" stroke="#7E8A92" stroke-width="0.9"/>
    <!-- 身 -->
    <ellipse cx="92" cy="128" rx="8" ry="6" fill="url(#skin)" stroke="#7E8A92" stroke-width="0.8"/>
    <!-- 爪（抓小兽皮毛，提起） -->
    <path d="M 90 132 L 96 138 L 100 142" stroke="#8E9AA2" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 尾 -->
    <path d="M 98 130 L 108 132 L 110 136" stroke="url(#skin)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年翼龙头（俯冲，坚毅） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="92" cy="118" rx="6.5" ry="5.5" fill="url(#skin)" stroke="#7E8A92" stroke-width="0.8"/>
    <circle cx="89" cy="116.5" r="1.6" fill="#24180E"/>
    <circle cx="89.4" cy="116.1" r="0.5" fill="#FFF"/>
    <circle cx="95.4" cy="116.5" r="1.6" fill="#24180E"/>
    <circle cx="95.8" cy="116.1" r="0.5" fill="#FFF"/>
    <path d="M 91 120 L 89 123 L 93 122.4 Z" fill="#C0B888"/>
    <path d="M 89 114 L 88 111 M 94 114 L 96 111" stroke="#A8B2BA" stroke-width="1.3" stroke-linecap="round"/>
    <!-- 水滴（翼上） -->
    <circle cx="86" cy="118" r="1" fill="#D0E4EC" opacity="0.7">
      <animate attributeName="cy" values="118;124;118" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 雨光星尘 -->
  <g fill="#D0E4EC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
