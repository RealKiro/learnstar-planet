<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="三角龙·二阶·角伤同伴·愣看自己刚硬的角同伴捂腹">
  <defs>
    <!-- 背景：草原林边暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C8A8"/>
      <stop offset="52%" stop-color="#9EB08E"/>
      <stop offset="100%" stop-color="#7E9A72"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8E4CC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8E4CC" stop-opacity="0"/>
    </radialGradient>
    <!-- 幼三角龙皮（角渐长） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4C8B4"/>
      <stop offset="100%" stop-color="#ACB09A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 林影 -->
  <g fill="#5E6E58" opacity="0.35">
    <path d="M 0 112 Q 60 104 130 110 Q 170 114 200 108 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8E9E72" opacity="0.75"/>
  <path d="M 0 150 L 200 150" stroke="#A8B488" stroke-width="1.4" opacity="0.5"/>

  <!-- 被撞的同伴（左，捂腹） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="140" rx="7" ry="5.2" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.7"/>
    <circle cx="58" cy="133" r="4.4" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.6"/>
    <path d="M 54 131.6 Q 52 129.6 52 127.6" stroke="#BCC0A8" stroke-width="1" stroke-linecap="round"/>
    <circle cx="55.6" cy="132" r="1.1" fill="#24180E"/>
    <circle cx="60.4" cy="132" r="1.1" fill="#24180E"/>
    <!-- 捂腹的前蹄 -->
    <path d="M 56 136 Q 52 139 54 142" stroke="#9EA28C" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 受伤的腹侧 -->
    <path d="M 58 142 L 58 145" stroke="#C84030" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 小三角龙（愣看自己刚硬的角） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="138" rx="15" ry="10.5" fill="url(#skin)" stroke="#949884" stroke-width="0.9"/>
    <ellipse cx="101" cy="143" rx="9" ry="5.5" fill="#E4E0D0" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 95 146 L 93 152 M 113 146 L 115 152" stroke="#989C88" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 119 142 Q 128 142 132 148" stroke="url(#skin)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小三角龙头（愣，角渐硬） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="118" rx="10.5" ry="9" fill="url(#skin)" stroke="#949884" stroke-width="0.8"/>
    <!-- 眼（愣） -->
    <circle cx="99.5" cy="116" r="2.4" fill="#24180E"/>
    <circle cx="100.1" cy="115.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="116" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="115.4" r="0.8" fill="#FFF"/>
    <!-- 鼻/喙 -->
    <path d="M 101 121 L 108 121 L 104.5 123 Z" fill="#8E927E"/>
    <!-- 三根角（渐硬） -->
    <path d="M 99 110 L 96 103" stroke="#D8D0B8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 104 109 L 104 101" stroke="#D8D0B8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 109 110 L 112 103" stroke="#D8D0B8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 颈甲边 -->
    <path d="M 93 114 Q 89 120 91 126" stroke="#989C88" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 115 114 Q 119 120 117 126" stroke="#989C88" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E8E4CC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
