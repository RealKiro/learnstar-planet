<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰河犀牛·三阶·练角苦修·对冰练顶角顶开层屑不乱碰即收">
  <defs>
    <!-- 背景：冰原晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E0EC"/>
      <stop offset="52%" stop-color="#B0C8DC"/>
      <stop offset="100%" stop-color="#92B2C8"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F0F8FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年冰犀厚毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AC885C"/>
      <stop offset="100%" stop-color="#92744C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 冰川 -->
  <g fill="#C8D8E4" opacity="0.7">
    <path d="M 0 104 Q 60 96 130 102 Q 170 106 200 100 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#EAF2F6" opacity="0.9"/>

  <!-- 被顶开的冰层（右，裂开露水） -->
  <g>
    <path d="M 144 140 Q 158 134 170 138 L 166 152 L 146 152 Z" fill="#D8E8F0"/>
    <g stroke="#B0C8D8" stroke-width="1.4" fill="none">
      <path d="M 150 140 L 154 148 M 158 138 L 162 148 M 166 140 L 168 148"/>
    </g>
    <!-- 顶开的裂缝（露水光） -->
    <path d="M 148 142 Q 158 138 168 142" stroke="#F0F8FC" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="158" cy="144" r="6" fill="#F0F8FC" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.12;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 站角前的同伴（左，信任） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="54" cy="142" rx="7" ry="5.2" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="54" cy="135" r="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 50 133.6 Q 48 131.6 48 129.6" stroke="#C4C8B0" stroke-width="1" stroke-linecap="round"/>
    <circle cx="51.6" cy="134" r="1.1" fill="#24180E"/>
    <circle cx="56.4" cy="134" r="1.1" fill="#24180E"/>
  </g>

  <!-- 少年冰犀（角顶冰，控力） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（如墙） -->
    <ellipse cx="106" cy="134" rx="17" ry="12" fill="url(#fur)" stroke="#7E6240" stroke-width="1"/>
    <!-- 腿（扎稳） -->
    <path d="M 96 143 L 94 150 M 118 143 L 120 150" stroke="#7E6240" stroke-width="3" stroke-linecap="round"/>
    <!-- 短尾 -->
    <path d="M 123 138 Q 129 136 131 140" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年冰犀头（沉稳，角如月牙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="106" cy="114" rx="11.5" ry="10" fill="url(#fur)" stroke="#7E6240" stroke-width="0.9"/>
    <!-- 眼（专注） -->
    <circle cx="101" cy="112" r="2.3" fill="#24180E"/>
    <circle cx="101.6" cy="111.4" r="0.75" fill="#FFF"/>
    <circle cx="111.5" cy="112" r="2.3" fill="#24180E"/>
    <circle cx="112.1" cy="111.4" r="0.75" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 102 118 L 110 118 L 106 120.5 Z" fill="#5E4628"/>
    <!-- 耳 -->
    <circle cx="98" cy="107" r="2.4" fill="#98784E"/>
    <circle cx="114" cy="107" r="2.4" fill="#98784E"/>
    <!-- 角（如月牙，顶冰） -->
    <path d="M 103 112 Q 100 104 96 100" stroke="#E0D8C4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M 109 112 Q 112 104 116 100" stroke="#E0D8C4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 控角的光（点到即止） -->
    <circle cx="96" cy="100" r="2.2" fill="#F0F8FC" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F0F8FC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
