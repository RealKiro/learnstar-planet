<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="三角龙·五阶·草原之盾·立族群外围角对来路低吼镇界">
  <defs>
    <!-- 背景：草原夕照金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4DCA8"/>
      <stop offset="52%" stop-color="#DCC08C"/>
      <stop offset="100%" stop-color="#A8B47C"/>
    </linearGradient>
    <!-- 盾之神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFF4D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECF0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 三角龙皮（如盾） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8BCA4"/>
      <stop offset="100%" stop-color="#9EA488"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 草原 -->
  <g fill="#6E9E78" opacity="0.35">
    <path d="M 0 122 Q 60 114 130 120 Q 170 124 200 118 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#8EAE7E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#AEC89E" stroke-width="1.4" opacity="0.55"/>

  <!-- 身后安然的族群（左，低头吃草） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="46" cy="144" rx="6.5" ry="4.8" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.6"/>
    <circle cx="46" cy="137" r="4" fill="#BCC0A8" stroke="#9EA28C" stroke-width="0.5"/>
    <path d="M 43 135.6 Q 41 133.6 41 131.6" stroke="#BCC0A8" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 46 141 L 44 145" stroke="#9EA28C" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 被镇的入侵者（右远） -->
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="160" cy="140" rx="8" ry="5.5" fill="#5E6658" stroke="#4E5648" stroke-width="0.7"/>
    <circle cx="156" cy="134" r="4.5" fill="#5E6658" stroke="#4E5648" stroke-width="0.6"/>
  </g>

  <!-- 三角龙之盾（立族群外围，角对来路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（如盾壁） -->
    <ellipse cx="108" cy="126" rx="19" ry="12.5" fill="url(#skin)" stroke="#949884" stroke-width="1.1"/>
    <ellipse cx="103" cy="131" rx="11" ry="6.5" fill="#E4E0D0" opacity="0.7"/>
    <!-- 腿（如山） -->
    <path d="M 97 136 L 94 148 M 121 136 L 124 148" stroke="#989C88" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 尾（如鞭） -->
    <path d="M 127 130 Q 138 124 144 114" stroke="url(#skin)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 127 130;5 127 130;0 127 130" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 三角龙之盾头（角对来路，低吼镇界） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="108" cy="104" rx="12.5" ry="11" fill="url(#skin)" stroke="#949884" stroke-width="0.9"/>
    <!-- 眼（含威含温） -->
    <path d="M 99 102 Q 101.6 100.4 104 102 M 113 102 Q 115.4 100.4 117 102" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="101.5" cy="103" r="2.3" fill="#24180E"/>
    <circle cx="102.1" cy="102.4" r="0.75" fill="#FFF"/>
    <circle cx="115.5" cy="103" r="2.3" fill="#24180E"/>
    <circle cx="116.1" cy="102.4" r="0.75" fill="#FFF"/>
    <!-- 鼻/喙 -->
    <path d="M 104 108 L 112 108 L 108 110.5 Z" fill="#8E927E"/>
    <!-- 三根角（如圭亮） -->
    <path d="M 101 97 L 95 88" stroke="#E8E0C8" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 108 96 L 108 86" stroke="#E8E0C8" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 115 97 L 121 88" stroke="#E8E0C8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 颈甲（如盾） -->
    <path d="M 94 98 Q 89 106 92 116" stroke="#989C88" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 122 98 Q 127 106 124 116" stroke="#989C88" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 额间盾之光 -->
    <circle cx="108" cy="94" r="2.8" fill="#FFF4D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 低吼镇界 -->
    <g stroke="#C8D8D0" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M 120 92 Q 128 88 134 84">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 盾之神星尘 -->
  <g fill="#FFF4D8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
