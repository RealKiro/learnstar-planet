<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大地懒·四阶·护林初成·慢爪掀起倒木救出小兽拍安慰">
  <defs>
    <!-- 背景：森林夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D8BC"/>
      <stop offset="52%" stop-color="#C0B898"/>
      <stop offset="100%" stop-color="#94AC96"/>
    </linearGradient>
    <!-- 护林威光 -->
    <radialGradient id="glow" cx="52%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#F0F8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0F8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年大地懒毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A08E76"/>
      <stop offset="100%" stop-color="#84725A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.42;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林 -->
  <g fill="#6E9E78" opacity="0.35">
    <path d="M 0 116 Q 60 108 130 114 Q 170 118 200 112 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7EAA82" opacity="0.8"/>

  <!-- 被掀起的倒木（右，掀起） -->
  <g>
    <path d="M 130 150 Q 138 136 152 132 Q 162 132 168 142 L 158 150 Z" fill="#8E7044" transform="rotate(-12 150 142)"/>
    <path d="M 136 146 L 142 138 M 146 144 L 152 136" stroke="#6E5230" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 掀起的木屑光 -->
    <circle cx="144" cy="142" r="6" fill="#F0F8E8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.14;0.28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 被救出的小兽（左，抖蹭） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="144" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="58" cy="137" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 56 139 L 54 144 M 61 139 L 63 144" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
    <!-- 感激蹭 -->
    <path d="M 64 140 Q 68 138 70 140" stroke="#A6AA90" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 少年大地懒（慢爪掀起倒木救兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="104" cy="134" rx="17" ry="12" fill="url(#fur)" stroke="#6E5E46" stroke-width="1"/>
    <ellipse cx="101" cy="140" rx="10" ry="6" fill="#DCD0B8" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 94 143 L 92 150 M 116 143 L 118 150" stroke="#6E5E46" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 121 138 Q 128 137 130 141" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 爪（掀起倒木） -->
    <path d="M 100 128 Q 112 118 124 116" stroke="url(#fur)" stroke-width="3.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 100 128;10 100 128;0 100 128" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年大地懒头（含护，稳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="114" rx="11" ry="10" fill="url(#fur)" stroke="#6E5E46" stroke-width="0.9"/>
    <!-- 眼（含护） -->
    <circle cx="99" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="99.6" cy="111.4" r="0.8" fill="#FFF"/>
    <circle cx="109.5" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="110.1" cy="111.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="104" cy="117" rx="1.9" ry="1.4" fill="#5E4E3A"/>
    <!-- 嘴（慢慢说） -->
    <path d="M 100 120 Q 104 121.6 108 120" fill="none" stroke="#8E7A5E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 圆耳 -->
    <circle cx="94" cy="106" r="2.3" fill="#7E6A52"/>
    <circle cx="114" cy="106" r="2.3" fill="#7E6A52"/>
  </g>

  <!-- 护林星尘 -->
  <g fill="#F0F8E8">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
