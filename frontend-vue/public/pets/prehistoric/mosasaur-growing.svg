<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="沧龙·三阶·潜渊苦修·潜渊记礁憋气穿渊尾鳍如桨">
  <defs>
    <!-- 背景：深海渊蓝 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A7A94"/>
      <stop offset="52%" stop-color="#4A6A84"/>
      <stop offset="100%" stop-color="#86A8BE"/>
    </linearGradient>
    <!-- 深渊微光 -->
    <radialGradient id="glow" cx="60%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#A8C8DC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8C8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 少年沧龙皮（渐深） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8298"/>
      <stop offset="100%" stop-color="#466A82"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="120" cy="146" r="90" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 深渊微光（下方发光生物） -->
  <g fill="#A8C8DC" opacity="0.6">
    <circle cx="150" cy="170" r="1.8">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="180" r="1.4">
      <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 深渊礁石（记住的暗礁） -->
  <g fill="#3A4E62">
    <path d="M 40 200 L 50 170 Q 60 160 72 166 L 80 200 Z"/>
    <path d="M 120 200 L 128 180 Q 136 174 144 178 L 150 200 Z"/>
  </g>
  <!-- 暗礁上记的标记光 -->
  <circle cx="56" cy="168" r="1.6" fill="#A8C8DC" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 少年沧龙（潜渊，尾鳍如桨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="100" cy="130" rx="16" ry="9" fill="url(#skin)" stroke="#466A82" stroke-width="1"/>
    <ellipse cx="97" cy="134" rx="10" ry="5.5" fill="#D8E4E8" opacity="0.7"/>
    <!-- 尾（如桨，有力） -->
    <path d="M 114 132 Q 128 126 138 118" stroke="url(#skin)" stroke-width="3.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 114 132;8 114 132;0 114 132" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 尾桨叶 -->
    <path d="M 136 116 L 146 110 L 144 120 Z" fill="url(#skin)" stroke="#466A82" stroke-width="0.8"/>
    <!-- 鳍 -->
    <path d="M 92 126 L 84 120 L 88 132 Z" fill="url(#skin)" stroke="#466A82" stroke-width="0.8"/>
    <path d="M 110 126 L 120 120 L 116 132 Z" fill="url(#skin)" stroke="#466A82" stroke-width="0.8"/>
  </g>

  <!-- 少年沧龙头（沉稳，憋气穿渊） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="86" cy="126" rx="10" ry="7.5" fill="url(#skin)" stroke="#466A82" stroke-width="0.9"/>
    <!-- 眼（专注沉稳） -->
    <circle cx="82.5" cy="124" r="2.2" fill="#24180E"/>
    <circle cx="83" cy="123.5" r="0.7" fill="#FFF"/>
    <circle cx="90.5" cy="124" r="2.2" fill="#24180E"/>
    <circle cx="91" cy="123.5" r="0.7" fill="#FFF"/>
    <!-- 嘴（闭，憋气） -->
    <path d="M 78 130 Q 86 132 94 130" fill="none" stroke="#466A82" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 穿渊的水线 -->
    <g stroke="#A8C8DC" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M 76 122 Q 70 118 66 116">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 深渊星尘 -->
  <g fill="#A8C8DC">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
