<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="剑齿虎·二阶·长牙之惧·长牙卡猎物疼蹲看牙悟">
  <defs>
    <!-- 背景：雪林暗 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C4B4"/>
      <stop offset="52%" stop-color="#9EAC9E"/>
      <stop offset="100%" stop-color="#7E947E"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8E4D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8E4D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 小剑齿虎毛（长牙初露） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0B884"/>
      <stop offset="100%" stop-color="#B8A070"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪林影 -->
  <g fill="#5E6E5E" opacity="0.35">
    <path d="M 0 112 Q 60 104 130 110 Q 170 114 200 108 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#E4ECE8" opacity="0.9"/>

  <!-- 挣脱逃远的小兽（右，跑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="156" cy="142" rx="6" ry="4.4" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.7"/>
    <circle cx="156" cy="135" r="3.8" fill="#C4C8B0" stroke="#A6AA90" stroke-width="0.6"/>
    <path d="M 152 141 L 150 146 M 160 141 L 162 146" stroke="#A6AA90" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 小剑齿虎（长牙卡猎物，疼蹲） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体（蹲） -->
    <ellipse cx="104" cy="136" rx="14" ry="10" fill="url(#fur)" stroke="#A89060" stroke-width="0.9"/>
    <ellipse cx="101" cy="141" rx="8" ry="5" fill="#ECE4D4" opacity="0.7"/>
    <!-- 腿 -->
    <path d="M 95 144 L 93 150 M 113 144 L 115 150" stroke="#A89060" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 118 140 Q 126 142 128 148" stroke="url(#fur)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 前爪（疼，摸牙） -->
    <path d="M 94 130 Q 90 126 88 122" stroke="url(#fur)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 94 130;-8 94 130;0 94 130" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小剑齿虎头（疼，看牙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="104" cy="116" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#A89060" stroke-width="0.9"/>
    <!-- 圆耳 -->
    <path d="M 95 109 L 90 102 L 99 107 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.6"/>
    <path d="M 113 109 L 118 102 L 109 107 Z" fill="url(#fur)" stroke="#A89060" stroke-width="0.6"/>
    <!-- 眼（疼） -->
    <path d="M 96 114 Q 98 112.6 100 114 M 109 114 Q 111 112.6 112 114" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="115" r="2.4" fill="#24180E"/>
    <circle cx="98.6" cy="114.4" r="0.8" fill="#FFF"/>
    <circle cx="110.5" cy="115" r="2.4" fill="#24180E"/>
    <circle cx="111.1" cy="114.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="104" cy="119" rx="1.7" ry="1.3" fill="#C09070"/>
    <!-- 长牙（初露，卡过疼） -->
    <path d="M 99 121 Q 96 126 95 130" stroke="#F0E8D8" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 109 121 Q 112 126 113 130" stroke="#F0E8D8" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 嘴角破皮 -->
    <circle cx="97" cy="121" r="1.2" fill="#C84030" opacity="0.7"/>
    <!-- 疼的泪 -->
    <path d="M 98 116.6 Q 96 119 96.5 121" stroke="#A8CCE8" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 昏光星尘 -->
  <g fill="#E8E4D0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
