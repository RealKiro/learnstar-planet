<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="棘龙·五阶·河口之王·高石张帆风雨中帆为灯塔兽顺光回">
  <defs>
    <!-- 背景：河口风雨夕 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C8B0"/>
      <stop offset="52%" stop-color="#98AE92"/>
      <stop offset="100%" stop-color="#C8BC90"/>
    </linearGradient>
    <!-- 帆灯神光 -->
    <radialGradient id="glow" cx="52%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#FCF0C8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCF0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E4C0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E4C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 棘龙皮 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8BCA8"/>
      <stop offset="100%" stop-color="#8AA48C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="112" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 风雨 -->
  <g stroke="#D0DCC8" stroke-width="1" stroke-linecap="round" opacity="0.5">
    <path d="M 40 20 L 36 48" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 20 L 146 50" >
      <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 河口 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9AAE8E" opacity="0.8"/>
  <g stroke="#C8D8BC" stroke-width="1.4" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 20 160 Q 60 154 100 160 Q 140 166 180 160">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 顺帆光回岸的小兽（左） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="48" cy="146" rx="6" ry="4.4" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.7"/>
    <circle cx="48" cy="139" r="3.8" fill="#C8BCA4" stroke="#AAA090" stroke-width="0.6"/>
    <!-- 帆光引路（光带） -->
    <path d="M 60 142 Q 80 136 100 138" stroke="#FCF0C8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 河口之王棘龙（高石张帆） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 高石 -->
    <path d="M 96 150 L 108 132 L 130 150 Z" fill="#8E9E8E"/>
    <!-- 身体 -->
    <ellipse cx="116" cy="126" rx="19" ry="12.5" fill="url(#skin)" stroke="#6E8670" stroke-width="1.1"/>
    <ellipse cx="112" cy="130" rx="11" ry="7" fill="#D8DCC8" opacity="0.7"/>
    <!-- 背帆（如旗高张，发光） -->
    <path d="M 103 118 Q 110 92 126 92 Q 133 106 139 118 Q 121 108 103 118 Z" fill="#E89878"/>
    <g stroke="#C8785C" stroke-width="1" fill="none" opacity="0.6">
      <path d="M 109 110 L 119 98 M 116 115 L 127 102 M 122 118 L 133 106"/>
    </g>
    <!-- 帆光（如灯） -->
    <circle cx="118" cy="104" r="10" fill="#FCF0C8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.16;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 腿 -->
    <path d="M 105 135 L 103 146 M 129 135 L 131 146" stroke="#6E8670" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 135 130 Q 146 124 152 114" stroke="url(#skin)" stroke-width="3.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 135 130;5 135 130;0 135 130" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 河口之王头（含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="104" rx="12" ry="10.5" fill="url(#skin)" stroke="#6E8670" stroke-width="0.9"/>
    <!-- 眼（含威含温） -->
    <path d="M 108 102 Q 110 100.6 112 102 M 121 102 Q 123 100.6 124 102" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="103" r="2.3" fill="#24180E"/>
    <circle cx="110.6" cy="102.4" r="0.75" fill="#FFF"/>
    <circle cx="122.5" cy="103" r="2.3" fill="#24180E"/>
    <circle cx="123.1" cy="102.4" r="0.75" fill="#FFF"/>
    <!-- 嘴（闭，守河） -->
    <path d="M 107 108 Q 116 110.4 125 108" fill="none" stroke="#6E8670" stroke-width="1" stroke-linecap="round"/>
    <!-- 鼻 -->
    <circle cx="111" cy="106" r="0.8" fill="#5E7658"/>
    <circle cx="121" cy="106" r="0.8" fill="#5E7658"/>
    <!-- 额间帆灯 -->
    <circle cx="116" cy="96" r="2.8" fill="#FCF0C8" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 帆灯星尘 -->
  <g fill="#FCF0C8">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
