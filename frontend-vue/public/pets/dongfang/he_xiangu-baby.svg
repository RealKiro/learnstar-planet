<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="何仙姑·二阶·食云母轻身·踏草而行步履如飞">
  <defs>
    <!-- 背景：岭南溪谷云雾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C0B0"/>
      <stop offset="55%" stop-color="#8EA89A"/>
      <stop offset="100%" stop-color="#6E8E80"/>
    </linearGradient>
    <!-- 云母白光 -->
    <radialGradient id="mica" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 素裙 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#D8D4CC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="he_xiangu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 柳眉·杏眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 云母光晕 -->
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山云雾 -->
  <path d="M 0 140 Q 40 122 90 132 Q 140 140 200 128 L 200 200 L 0 200 Z" fill="#7E9E90" opacity="0.5"/>

  <!-- 草尖（她踏草而行，草尖微弯不折） -->
  <g>
    <path d="M 50 160 Q 48 152 52 146 M 70 164 Q 68 156 72 150" stroke="#7EA878" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 50 160;4 50 160;0 50 160" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 158 Q 118 150 122 144 M 150 162 Q 148 154 152 148" stroke="#7EA878" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 158;-4 120 158;0 120 158" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 脚下生风（云母白） -->
  <circle cx="100" cy="154" r="18" fill="#FFFFFF" opacity="0.4">
    <animate attributeName="r" values="18;24;18" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 素裙少女（踏草而行，衣袂轻扬，展臂迎风） -->
  <!-- 腿（凌空轻踏） -->
  <path d="M 90 130 L 84 146 L 90 146 L 94 132 Z" fill="#C8C4BC"/>
  <path d="M 106 130 L 114 148 L 108 148 L 102 132 Z" fill="#C8C4BC"/>
  <!-- 素裙（飘动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 98 122;3 98 122;-4 98 122" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 88 116 Q 86 126 90 132 Q 98 138 106 132 Q 110 126 108 116 Q 100 112 88 116 Z" fill="url(#gown)" stroke="#C8C4BC" stroke-width="1"/>
  </g>
  <!-- 上身 -->
  <!-- 腰带 -->
  <path d="M 92 110 L 106 110" stroke="#A8906E" stroke-width="1.4"/>
  <!-- 竹篓仍在（背） -->

  <!-- 头（清秀面容，眼神明亮） -->
  <!-- 青丝 + 荆钗 -->
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 眉眼明亮 -->
  <!-- 鼻梁 -->
  <!-- 含笑 -->

  <!-- 双臂展臂迎风 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 94 100;4 94 100;-6 94 100" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 94 100 C 88 102 84 106 82 112" fill="none" stroke="#E8E4DC" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="81" cy="114" r="3" fill="#E2C8A8"/>
    <path d="M 81 112 Q 74 116 72 122" fill="none" stroke="#D8D4CC" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="6 104 100;-4 104 100;6 104 100" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 104 100 C 110 102 114 106 116 112" fill="none" stroke="#E8E4DC" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="117" cy="114" r="3" fill="#E2C8A8"/>
    <path d="M 117 112 Q 124 116 126 122" fill="none" stroke="#D8D4CC" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 云母白尘 -->
  <g fill="#FFFFFF">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#he_xiangu-face" transform="translate(99,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 93 80 Q 97 76 101 80 Q 99 75 97 75 Q 95 75 93 80 Z" fill="#1E1814"/>
  <path d="M 90 86 Q 94 81 99 81 Q 104 81 108 86 Q 104 82 99 82 Q 94 82 90 86 Z" fill="#1E1814"/>
</svg>
