<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="何仙姑·三阶·吕祖点化·手持如意莲花仙缘已定">
  <defs>
    <!-- 背景：山间溪畔 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8C0"/>
      <stop offset="52%" stop-color="#8EACB0"/>
      <stop offset="100%" stop-color="#6E9298"/>
    </linearGradient>
    <!-- 莲花光晕 -->
    <radialGradient id="lotus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D8E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 仙白素衣 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：清秀面容·眉目含仙气·嘴角带笑（脸中心 0,0） -->
    <g id="hexiangu-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D8BC98" stroke-width="0.8"/>
      <!-- 青丝披肩 -->
      <path d="M -5 -8 Q 0 -11 5 -8 Q 3 -12 0 -12 Q -3 -12 -5 -8 Z" fill="#1E1814"/>
      <path d="M -9 -3 Q -11 -1 -11 2 Q -10 4 -9 1 Z" fill="#1E1814" opacity="0.9"/>
      <!-- 莲花簪 -->
      <path d="M -5 -10 Q -2 -12 0 -11 L -1 -8 Z" fill="#E8A0C8"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目含仙气 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.6 M 8 -1.5 Q 5 -3.2 2 -2.6" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.2" cy="0.4" rx="2.1" ry="1.9" fill="#1E1008"/>
      <ellipse cx="4.2" cy="0.4" rx="2.1" ry="1.9" fill="#1E1008"/>
      <circle cx="-4.7" cy="-0.4" r="0.7" fill="#FFF"/>
      <circle cx="3.7" cy="-0.4" r="0.7" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C8A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 带笑 -->
      <path d="M -3 5.4 Q 0 7.4 3 5.4" fill="none" stroke="#B06A4A" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 云中吕祖（左上，隐约） -->
  <g opacity="0.6">
    <path d="M 0 0 L 64 0 L 56 14 Q 34 22 14 20 Z" fill="#D8E0E8" opacity="0.8"/>
    <path d="M 30 26 Q 32 18 36 15 Q 40 18 40 26 Z" fill="#E8E0D0"/>
    <circle cx="36" cy="13" r="4" fill="#E0C8A8"/>
    <path d="M 33 11 Q 36 8 39 11 Q 37 7 36 7 Q 35 7 33 11 Z" fill="#2E2620"/>
    <!-- 吕祖拂尘 -->
    <path d="M 40 22 L 50 40" stroke="#C8C0B8" stroke-width="1.6"/>
  </g>

  <!-- 溪水 -->
  <path d="M 0 156 Q 40 148 90 154 Q 140 160 200 150 L 200 200 L 0 200 Z" fill="#7E9EA8"/>
  <path d="M 20 166 Q 60 158 100 164 Q 140 170 180 162" stroke="#A8C8D0" stroke-width="1.6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 莲花满池（前景） -->
  <g opacity="0.9">
    <path d="M 30 152 Q 26 142 30 136" stroke="#6E9E6E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="134" r="5" fill="#E8A0C8"/>
    <circle cx="28" cy="132" r="3" fill="#F0B8D8"/>
    <path d="M 168 148 Q 164 138 168 132" stroke="#6E9E6E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="168" cy="130" r="5" fill="#E8A0C8"/>
    <circle cx="166" cy="128" r="3" fill="#F0B8D8"/>
    <circle cx="56" cy="148" r="6" fill="#F0D8E8" opacity="0.7"/>
    <circle cx="146" cy="150" r="6" fill="#F0D8E8" opacity="0.6"/>
  </g>

  <!-- 白衣仙姑（手持如意莲花） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#D8D4CC"/>
  <path d="M 106 132 L 112 156 L 106 156 L 102 134 Z" fill="#D8D4CC"/>
  <!-- 仙裙 -->
  <path d="M 90 118 Q 88 130 92 138 Q 100 144 108 138 Q 112 130 110 118 Q 100 112 90 118 Z" fill="url(#gown)" stroke="#D0C8C0" stroke-width="1"/>
  <!-- 上身 -->
  <path d="M 94 96 Q 90 106 94 118 Q 100 124 106 118 Q 110 106 106 96 Q 100 92 94 96 Z" fill="url(#gown)" stroke="#D0C8C0" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 94 110 L 106 110" stroke="#A8906E" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#hexiangu-face" transform="translate(100,88) scale(1)"/>

  <!-- 左臂垂持 -->
  <path d="M 96 100 C 90 104 88 108 88 114" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>

  <!-- 右臂拈如意莲花 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 104 100 C 110 102 114 104 118 102" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="120" cy="101" r="3" fill="#E2C8A8"/>
    <!-- 如意莲花（绽放） -->
    <g>
      <circle cx="122" cy="88" r="12" fill="url(#lotus)">
        <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="122" cy="86" r="8" fill="#E8A0C8"/>
      <path d="M 118 84 Q 122 80 126 84 Q 122 86 118 84 Z" fill="#F0B8D8"/>
      <path d="M 118 89 Q 122 85 126 89 Q 122 91 118 89 Z" fill="#F0B8D8"/>
      <path d="M 120 90 Q 122 87 124 90 Q 122 92 120 90 Z" fill="#F0B8D8"/>
      <circle cx="122" cy="86" r="2" fill="#F8E8A0"/>
    </g>
    <!-- 莲花光晕 -->
    <circle cx="122" cy="88" r="18" fill="#F8D8E8" opacity="0.35">
      <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 百花相和（莲花引动） -->
  <g fill="#E8A0C8">
    <circle cx="40" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
