<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨任·一阶·直言上大夫·犯颜直谏">
  <defs>
    <!-- 背景：商朝朝堂玄黑 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3238"/>
      <stop offset="60%" stop-color="#241E22"/>
      <stop offset="100%" stop-color="#161214"/>
    </linearGradient>
    <!-- 烛火金 -->
    <radialGradient id="glow" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 朝服绛红 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8402E"/>
      <stop offset="100%" stop-color="#6E2418"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8BC98"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="80" r="86" fill="url(#glow)"/>

  <!-- 朝堂大殿柱 -->
  <path d="M 18 0 L 26 0 L 26 200 L 18 200 Z" fill="#3E3238" opacity="0.8"/>
  <path d="M 174 0 L 182 0 L 182 200 L 174 200 Z" fill="#3E3238" opacity="0.8"/>
  <!-- 殿顶垂帐 -->
  <path d="M 0 0 L 200 0 L 200 44 Q 100 62 0 44 Z" fill="#4E4048" opacity="0.7"/>

  <!-- 群臣唯唯虚影（背景） -->
  <g opacity="0.22">
    <path d="M 120 120 Q 122 108 128 104 Q 134 106 134 120 Z" fill="#1A1418"/>
    <path d="M 142 124 Q 143 112 149 108 Q 155 110 154 124 Z" fill="#1E161A"/>
    <path d="M 158 122 Q 160 110 165 106 Q 171 109 169 122 Z" fill="#1A1418"/>
    <path d="M 96 126 Q 97 114 103 110 Q 109 112 108 126 Z" fill="#1E161A"/>
    <path d="M 74 128 Q 75 116 81 112 Q 87 114 86 128 Z" fill="#1A1418"/>
  </g>

  <!-- 金阶 -->
  <path d="M 40 156 L 160 156 L 168 172 L 32 172 Z" fill="#6E5A3E"/>
  <path d="M 40 156 L 160 156" stroke="#8E7A4E" stroke-width="1.6" opacity="0.7"/>
  <path d="M 32 172 L 200 172 L 200 200 L 0 200 L 0 172 Z" fill="#3A2E24"/>

  <!-- 朝服文臣（7头身，立于阶前，手持谏章） -->
  <!-- 腿 -->
  <path d="M 84 138 L 80 164 L 86 164 L 90 140 Z" fill="#4E2620"/>
  <path d="M 108 138 L 114 164 L 108 164 L 104 140 Z" fill="#4E2620"/>
  <!-- 朝服下摆 -->
  <path d="M 82 128 Q 96 140 112 134 Q 116 128 112 120 Q 104 130 96 128 Q 88 130 82 128 Z" fill="url(#robe)"/>
  <!-- 身体 -->
  <path d="M 84 92 Q 80 110 86 128 Q 98 134 110 128 Q 116 110 112 92 Q 98 86 84 92 Z" fill="url(#robe)" stroke="#541E14" stroke-width="1"/>
  <!-- 玉带 -->
  <path d="M 84 114 L 112 114" stroke="#E8D8A8" stroke-width="2.4"/>
  <rect x="96" y="112" width="6" height="4" rx="1" fill="#E8D8A8"/>
  <!-- 领口 -->
  <path d="M 92 90 Q 98 96 104 90" stroke="#541E14" stroke-width="1.6" fill="none"/>
  <!-- 左臂垂持 -->
  <path d="M 86 96 C 80 102 78 110 80 118" fill="none" stroke="#8E3628" stroke-width="5" stroke-linecap="round"/>

  <!-- 右手高举谏章（力谏） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 110 94;3 110 94;-4 110 94" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 110 94 C 116 90 120 86 122 80" fill="none" stroke="#8E3628" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="123" cy="79" r="3.4" fill="#D8BC98"/>
    <!-- 谏章（竹简卷） -->
    <rect x="116" y="60" width="14" height="20" rx="2" fill="#C8B48E" stroke="#8E7A4E" stroke-width="1"/>
    <line x1="120" y1="62" x2="120" y2="78" stroke="#8E7A4E" stroke-width="0.8"/>
    <line x1="124" y1="62" x2="124" y2="78" stroke="#8E7A4E" stroke-width="0.8"/>
    <line x1="128" y1="62" x2="128" y2="78" stroke="#8E7A4E" stroke-width="0.8"/>
  </g>

  <!-- 头（国字脸，浓眉虎目清正） -->
  <circle cx="98" cy="84" r="11" fill="url(#skin)" stroke="#C8B090" stroke-width="0.9"/>
  <!-- 冠冕 -->
  <path d="M 84 76 Q 98 68 112 76 L 112 74 Q 98 64 84 74 Z" fill="#E8D8A8" stroke="#B8A068" stroke-width="0.8"/>
  <path d="M 90 72 L 90 66 L 94 66 L 94 71 M 102 72 L 102 66 L 106 66 L 106 71" stroke="#E8D8A8" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 额发 -->
  <path d="M 88 82 Q 92 78 98 78 Q 104 78 108 82 Q 104 79 98 79 Q 92 79 88 82 Z" fill="#1E1814"/>
  <!-- 浓眉 -->
  <path d="M 88 84 Q 93 82 96 83 M 100 83 Q 103 82 108 84" stroke="#1E1008" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 虎目清正 -->
  <ellipse cx="93" cy="88" rx="2.6" ry="2.4" fill="#1E1008"/>
  <ellipse cx="103" cy="88" rx="2.6" ry="2.4" fill="#1E1008"/>
  <circle cx="94" cy="87.2" r="0.9" fill="#FFF"/>
  <circle cx="104" cy="87.2" r="0.9" fill="#FFF"/>
  <!-- 鼻梁挺 -->
  <path d="M 98 89 L 98 92" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
  <!-- 唇线刚直 -->
  <path d="M 93 96 Q 98 97.6 103 96" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 烛火金尘 -->
  <g fill="#E8A84E">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="102">
      <animate attributeName="cy" values="102;94;102" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
