<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哪吒·四阶·淬炼·莲花化身">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241A14"/>
      <stop offset="70%" stop-color="#17100C"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFE9D4"/>
      <stop offset="100%" stop-color="#F0D4B8"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#D43A2A"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FFC24A"/>
    </linearGradient>

    <g id="nezha-head">
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#FBEBD6" stroke="#D8B894" stroke-width="1"/>
      <circle cx="-14" cy="-21" r="7" fill="#2A1A0A"/>
      <circle cx="14" cy="-21" r="7" fill="#2A1A0A"/>
      <path d="M -10 -14 Q -4 -18 0 -15 Q 4 -18 10 -14" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="-5.4" cy="-3.6" r="1.5" fill="#FFF"/>
      <circle cx="8.6" cy="-3.6" r="1.5" fill="#FFF"/>
      <path d="M -11 -6 Q -8 -9 -5 -8 M 11 -6 Q 8 -9 5 -8" fill="none" stroke="#2A1A0A" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -4 6 Q 0 9 4 6" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-11" cy="4" r="3.6" fill="#C85A4A" opacity="0.35"/>
      <circle cx="11" cy="4" r="3.6" fill="#C85A4A" opacity="0.35"/>
      <path d="M 0 -18 Q 2 -22 5 -23" fill="none" stroke="#2A1A0A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：天火（跃动） -->
  <g>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 20 186 Q 32 166 46 180 Q 56 160 70 176 Q 82 156 96 174 Q 108 158 120 176 Q 132 162 144 180 Q 154 164 168 182 Q 176 170 186 186 Z" fill="#8B1A1A"/>
    <path d="M 30 188 Q 44 170 58 182 Q 70 164 84 178 Q 96 164 110 180 Q 122 166 134 182 Q 146 170 158 184 Q 168 172 178 188 Z" fill="#D43A2A" opacity="0.6"/>
  </g>

  <!-- 风火轮（脚下） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 80 158;60 80 158;120 80 158" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="80" cy="158" r="13" fill="none" stroke="url(#fire)" stroke-width="4.5"/>
    <path d="M 80 145 L 80 171 M 67 158 L 93 158" stroke="#FFC24A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 120 152;60 120 152;120 120 152" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="120" cy="152" r="13" fill="none" stroke="url(#fire)" stroke-width="4.5"/>
    <path d="M 120 139 L 120 165 M 107 152 L 133 152" stroke="#FFC24A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 腿（腾跃） -->
  <path d="M 88 134 C 82 144 78 150 76 156" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 112 132 C 116 142 118 146 120 150" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round" transform="rotate(-10 116 140)"/>

  <!-- 侧头×2（三头六臂初现，半透明） -->
  <use href="#nezha-head" transform="translate(70,84) scale(0.7) rotate(-45)" opacity="0.55"/>
  <use href="#nezha-head" transform="translate(130,84) scale(0.7) rotate(45)" opacity="0.55"/>

  <!-- 身体（莲花化身，战甲燃焰） -->
  <path d="M 90 92 Q 82 108 88 128 Q 100 138 112 128 Q 118 108 112 92 Q 104 86 90 92 Z" fill="url(#skin)"/>
  <path d="M 88 96 Q 100 88 112 96 L 110 116 Q 100 122 90 116 Z" fill="#C22A1A"/>
  <path d="M 96 94 L 96 118 M 104 94 L 104 118" stroke="#FFC24A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- 多臂（六臂：正面2 + 两侧各2） -->
  <path d="M 102 100 C 110 92 118 82 124 74" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="126" cy="72" r="4" fill="url(#skin)"/>
  <path d="M 96 100 C 84 102 76 108 70 116" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <!-- 侧臂 -->
  <path d="M 90 104 C 76 110 66 118 58 128" fill="none" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="56" cy="131" r="3.5" fill="url(#skin)" opacity="0.9"/>
  <path d="M 112 104 C 126 110 136 118 142 126" fill="none" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="144" cy="129" r="3.5" fill="url(#skin)" opacity="0.9"/>

  <!-- 火尖枪（持于主臂） -->
  <line x1="60" y1="150" x2="130" y2="44" stroke="#8E1A12" stroke-width="5" stroke-linecap="round"/>
  <path d="M 130 44 L 140 34 L 130 38 L 136 30 Z" fill="#FFC24A"/>
  <!-- 枪头火焰 -->
  <path d="M 134 36 C 128 26 132 18 136 12 C 140 18 142 26 134 36 Z" fill="url(#fire)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- 掷出的乾坤圈 -->
  <circle cx="58" cy="120" r="6.5" fill="none" stroke="#F5D742" stroke-width="3">
    <animate attributeName="cx" values="58;40;58" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 头（主头，头部模板 scale 1.0） -->
  <use href="#nezha-head" transform="translate(100,78) scale(1)"/>
  <!-- 发丝燃火光 -->
  <path d="M 112 60 C 124 56 134 60 140 56" fill="none" stroke="#FFC24A" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <animateTransform attributeName="transform" type="rotate" values="0 112 60;8 112 60;0 112 60" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 燃烧光环 -->
  <circle cx="100" cy="110" r="62" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.5" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 110;20 100 110;0 100 110" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- 火星（飘浮） -->
  <g fill="#F97316">
    <circle cx="56" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
