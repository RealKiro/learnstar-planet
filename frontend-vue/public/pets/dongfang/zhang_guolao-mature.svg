<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="张果老·四阶·屡召不朝·闭目装死游戏君王">
  <defs>
    <!-- 背景：客舍 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A8A72"/>
      <stop offset="55%" stop-color="#7E6E5A"/>
      <stop offset="100%" stop-color="#5E5242"/>
    </linearGradient>
    <!-- 诏书金 -->
    <radialGradient id="glow" cx="68%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#E8B64C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8B64C" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="136" cy="72" r="60" fill="url(#glow)"/>

  <!-- 客舍窗 -->
  <path d="M 24 30 L 72 30 L 72 78 L 24 78 Z" fill="#6E5A46" stroke="#8E7A4E" stroke-width="2"/>
  <path d="M 24 54 L 72 54 M 48 30 L 48 78" stroke="#8E7A4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 诏书（案上，金） -->
  <g opacity="0.9">
    <rect x="120" y="60" width="34" height="22" rx="2" fill="#E8D8A8" stroke="#B8964E" stroke-width="1" transform="rotate(-4 137 71)"/>
    <path d="M 124 66 L 150 62" stroke="#B8964E" stroke-width="1.2" opacity="0.7"/>
    <path d="M 124 72 L 150 68" stroke="#B8964E" stroke-width="1.2" opacity="0.7"/>
    <rect x="118" y="58" width="6" height="6" rx="1" fill="#E8B64C" transform="rotate(-4 121 61)"/>
  </g>

  <!-- 使者（右，躬身查验） -->
  <g opacity="0.9">
    <path d="M 160 96 Q 162 82 168 78 Q 174 80 173 96 Z" fill="#8E3A2E"/>
    <circle cx="170" cy="74" r="6" fill="#E0C8A8"/>
    <path d="M 166 71 Q 170 68 174 71 Q 172 66 170 66 Q 168 66 166 71 Z" fill="#2E1A10"/>
    <!-- 使者俯身 -->
    <path d="M 164 86 Q 156 84 152 88" stroke="#8E3A2E" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#4E4036" opacity="0.7"/>
  <path d="M 0 148 L 200 148" stroke="#6E5E4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白驴（一旁吃草） -->
  <path d="M 70 136 Q 64 128 70 122 Q 80 116 90 120 Q 102 124 104 134 Q 105 142 98 146 Q 88 150 78 146 Q 70 142 70 136 Z" fill="#D8D8D4" stroke="#A8A8A4" stroke-width="1"/>
  <path d="M 104 134 Q 112 130 116 126 Q 120 122 116 120 Q 110 120 106 124 Q 104 130 104 134 Z" fill="#C8C8C4" stroke="#A8A8A4" stroke-width="0.8"/>
  <path d="M 113 122 L 111 114 L 116 119 Z" fill="#C8C8C4"/>
  <path d="M 116 122 L 118 114 L 120 120 Z" fill="#C8C8C4"/>
  <!-- 吃草 -->
  <path d="M 118 126 L 122 132" stroke="#C8C8C4" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 122 132 Q 124 134 122 136" stroke="#7E9E6E" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 驴尾 -->
  <path d="M 70 130 Q 62 126 60 118" stroke="#A8A8A4" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 70 130;8 70 130;0 70 130" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 道翁（横卧装死，一脸安详 + 捉狭笑） -->
  <!-- 身体（横卧） -->
  <path d="M 40 128 Q 36 136 42 142 Q 62 150 82 142 Q 92 138 88 128 Q 64 116 40 128 Z" fill="url(#robe)" stroke="#A8A8A4" stroke-width="1"/>
  <!-- 腿 -->
  <path d="M 84 134 L 92 150 L 97 148 L 90 132 Z" fill="#C8C4BC"/>
  <path d="M 96 140 L 106 156 L 100 157 L 92 142 Z" fill="#C8C4BC"/>

  <!-- 头（侧卧，闭目安详，嘴角捉狭） -->
  <circle cx="52" cy="124" r="10" fill="url(#skin)" stroke="#C8A880" stroke-width="0.8"/>
  <!-- 白发 -->
  <path d="M 44 120 Q 42 114 46 110" stroke="#E8E0D0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 白眉 -->
  <path d="M 45 122 Q 48 121 51 121.5 M 55 121.5 Q 58 121 61 122" stroke="#E8E0D0" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 闭目安详 -->
  <path d="M 46 125 Q 49 126 52 125 M 56 125 Q 59 126 62 125" stroke="#2E1A10" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- 嘴角捉狭笑意 -->
  <path d="M 46 131 Q 50 133.6 54 131" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 白须 -->
  <path d="M 44 132 Q 40 138 42 144 M 52 133 Q 50 140 52 146" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- 气息全无（头顶一缕"魂"淡出） -->
  <g stroke="#C8C4BC" stroke-width="1.2" opacity="0.4" stroke-linecap="round">
    <path d="M 52 114 Q 48 108 52 104 Q 56 100 52 96">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 游戏君王金尘 -->
  <g fill="#E8B64C">
    <circle cx="140" cy="90">
      <animate attributeName="cy" values="90;82;90" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="116" cy="52">
      <animate attributeName="cy" values="52;44;52" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
