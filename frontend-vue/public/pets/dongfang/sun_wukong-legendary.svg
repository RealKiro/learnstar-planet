<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·五阶·封神·五百年劫">
  <defs>
    <!-- 背景：紫金辉煌 -->
    <radialGradient id="bg" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#5B2A8A"/>
      <stop offset="55%" stop-color="#3A1A5E"/>
      <stop offset="100%" stop-color="#1E0E34"/>
    </radialGradient>
    <radialGradient id="fur" cx="44%" cy="38%" r="76%">
      <stop offset="0%" stop-color="#EBC55A"/>
      <stop offset="60%" stop-color="#E0B13B"/>
      <stop offset="100%" stop-color="#C08E26"/>
    </radialGradient>
    <radialGradient id="face" cx="46%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#F7E6C6"/>
      <stop offset="100%" stop-color="#E8D3A8"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 神性：完整圆形背光 -->
  <circle cx="100" cy="104" r="86" fill="#F5D742" opacity="0.1"/>
  <circle cx="100" cy="104" r="78" fill="none" stroke="#F5D742" stroke-width="2" opacity="0.45"/>
  <circle cx="100" cy="104" r="68" fill="none" stroke="#F5D742" stroke-width="1" opacity="0.22"/>
  <!-- 紫气 -->
  <circle cx="100" cy="104" r="60" fill="#9A6EC4" opacity="0.12"/>

  <!-- 云台（对称） -->
  <path d="M 22 180 C 42 170 56 178 76 172 C 92 168 98 176 100 172 C 98 178 84 176 72 180 C 56 186 38 184 22 180 Z" fill="#C9B37E" opacity="0.32"/>
  <path d="M 178 180 C 158 170 144 178 124 172 C 108 168 102 176 100 172 C 102 178 116 176 128 180 C 144 186 162 184 178 180 Z" fill="#C9B37E" opacity="0.32"/>

  <!-- 金箍棒（立于右侧） -->
  <line x1="146" y1="46" x2="146" y2="164" stroke="#F5D742" stroke-width="6" stroke-linecap="round"/>
  <line x1="146" y1="46" x2="146" y2="164" stroke="#C9A227" stroke-width="1.6" opacity="0.6"/>
  <path d="M 138 44 L 154 44 L 150 52 L 142 52 Z" fill="#F5D742"/>

  <!-- 红袍（端坐，展开） -->
  <path d="M 78 128 Q 100 122 122 128 L 130 150 Q 100 168 70 150 Z" fill="#B82E2A"/>
  <path d="M 88 128 Q 100 124 112 128 L 116 148 Q 100 158 84 148 Z" fill="#8E221E" opacity="0.55"/>
  <!-- 金甲（上身） -->
  <path d="M 80 100 Q 100 92 120 100 L 118 126 Q 100 134 82 126 Z" fill="#E0B13B"/>
  <path d="M 88 98 Q 100 104 112 98" fill="none" stroke="#8E6E14" stroke-width="1.8" opacity="0.8"/>
  <path d="M 90 110 L 86 126 M 100 108 L 100 128 M 110 110 L 114 126" stroke="#8E6E14" stroke-width="1.8" opacity="0.7"/>
  <!-- 肩甲（对称） -->
  <circle cx="76" cy="106" r="8" fill="#F5D742"/>
  <circle cx="124" cy="106" r="8" fill="#F5D742"/>

  <!-- 手（搭膝，对称） -->
  <ellipse cx="84" cy="120" rx="6" ry="8" fill="#C08E26"/>
  <ellipse cx="116" cy="120" rx="6" ry="8" fill="#C08E26"/>

  <!-- 头（俯视） -->
  <ellipse cx="100" cy="66" rx="21" ry="20" fill="url(#fur)"/>
  <!-- 猴脸 -->
  <path d="M 89 72 Q 89 86 100 90 Q 111 86 111 72 Q 102 62 89 72 Z" fill="url(#face)"/>
  <!-- 耳 -->
  <circle cx="77" cy="64" r="6" fill="#C08E26"/>
  <circle cx="123" cy="64" r="6" fill="#C08E26"/>

  <!-- 凤翅紫金冠（对称华丽） -->
  <path d="M 80 52 C 68 42 66 30 78 22 L 88 36 L 96 26 L 100 42" fill="none" stroke="#F5D742" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 120 52 C 132 42 134 30 122 22 L 112 36 L 104 26 L 100 42" fill="none" stroke="#F5D742" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 冠冕金箍 -->
  <path d="M 80 60 Q 100 52 120 60" fill="none" stroke="#F5D742" stroke-width="3.6" stroke-linecap="round"/>
  <!-- 冠顶明珠 -->
  <circle cx="100" cy="38" r="4" fill="#F5D742"/>
  <circle cx="100" cy="38" r="1.6" fill="#FFF"/>

  <!-- 火眼金睛（深邃） -->
  <circle cx="90" cy="72" r="5.4" fill="#F5D742"/>
  <circle cx="110" cy="72" r="5.4" fill="#F5D742"/>
  <circle cx="90" cy="72" r="2.6" fill="#7A1A12"/>
  <circle cx="110" cy="72" r="2.6" fill="#7A1A12"/>
  <circle cx="91.6" cy="70.4" r="1.8" fill="#FFF"/>

  <!-- 嘴（威仪） -->
  <path d="M 93 84 Q 100 88 107 84" fill="none" stroke="#B0852A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 祥光放射（对称） -->
  <g stroke="#F5D742" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M 34 70 L 26 62"/>
    <path d="M 166 70 L 174 62"/>
    <path d="M 44 38 L 38 28"/>
    <path d="M 156 38 L 162 28"/>
    <path d="M 28 122 L 20 120"/>
    <path d="M 172 122 L 180 120"/>
  </g>

  <!-- 紫金光点 -->
  <circle cx="54" cy="118" r="1.9" fill="#F5D742" opacity="0.85"/>
  <circle cx="146" cy="118" r="1.9" fill="#F5D742" opacity="0.85"/>
  <circle cx="100" cy="186" r="1.5" fill="#9A6EC4" opacity="0.6"/>
</svg>
