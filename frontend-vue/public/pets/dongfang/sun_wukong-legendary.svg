<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·五阶·封神·斗战胜佛">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#5B2A8A"/>
      <stop offset="55%" stop-color="#3A1A5E"/>
      <stop offset="100%" stop-color="#1E0E34"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kasaya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B82E2A"/>
      <stop offset="100%" stop-color="#7E1A18"/>
    </linearGradient>

    <g id="wukong-head">
      <path d="M 0 -34 C 16 -34 21 -20 19 -7 C 17 5 9 13 0 16 C -9 13 -17 5 -19 -7 C -21 -20 -16 -34 0 -34 Z" fill="#F7E6C6" stroke="#8B6914" stroke-width="1.2"/>
      <circle cx="-21" cy="-8" r="5" fill="#E0B13B"/>
      <circle cx="21" cy="-8" r="5" fill="#E0B13B"/>
      <path d="M -8 -33 Q -6 -42 -1 -46 Q 3 -43 5 -40 Q 8 -44 12 -42 Q 10 -34 6 -32" fill="none" stroke="#C08E26" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -18 -10 Q -25 -6 -27 -1 M 18 -10 Q 25 -6 27 -1" fill="none" stroke="#C08E26" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <path d="M -12 -6 Q -6 -14 2 -9 Q -6 -3 -12 -6 Z" fill="#1A0A0A"/>
      <path d="M -2 -9 Q 6 -14 12 -6 Q 6 -3 -2 -9 Z" fill="#1A0A0A"/>
      <circle cx="-4" cy="-9" r="1.4" fill="#F5D742"/>
      <circle cx="4" cy="-9" r="1.4" fill="#F5D742"/>
      <path d="M -13 -7 Q -11 -3 -8 -5" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <path d="M 13 -7 Q 11 -3 8 -5" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <path d="M -6 8 Q 0 14 6 8 Q 0 16 -6 8 Z" fill="#B0852A"/>
      <path d="M -4 10 Q 0 13 4 10" fill="none" stroke="#8E5A14" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-15" cy="2" r="4" fill="#C85A4A" opacity="0.2"/>
      <circle cx="15" cy="2" r="4" fill="#C85A4A" opacity="0.2"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 佛光（呼吸） -->
  <circle cx="100" cy="104" r="84" fill="url(#glow)">
    <animate attributeName="r" values="84;94;84" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="84" r="40" fill="none" stroke="#F5D742" stroke-width="1.6" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.75;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 莲花座 -->
  <path d="M 84 166 Q 88 154 92 164 Q 96 150 100 162 Q 104 150 108 164 Q 112 154 116 166 Q 104 174 84 166 Z" fill="#F5EEDC" opacity="0.9"/>
  <path d="M 70 170 Q 84 158 96 170 Q 110 158 122 168 Q 112 178 96 174 Q 84 176 70 170 Z" fill="#E8DCC0" opacity="0.8"/>

  <!-- 锦斓袈裟（端坐，金格纹） -->
  <path d="M 74 96 Q 100 88 126 96 L 120 148 Q 100 160 80 148 Z" fill="url(#kasaya)"/>
  <path d="M 84 100 Q 100 94 116 100 L 112 144 Q 100 152 88 144 Z" fill="#7E1A18" opacity="0.5"/>
  <path d="M 86 102 L 86 144 M 96 98 L 96 150 M 106 98 L 106 150 M 114 102 L 114 144" stroke="#C9B37E" stroke-width="1" opacity="0.6"/>
  <path d="M 82 114 Q 100 108 118 114 M 84 128 Q 100 122 116 128" stroke="#C9B37E" stroke-width="1" opacity="0.5"/>

  <!-- 合十手（胸前，庄严） -->
  <path d="M 94 108 Q 100 112 106 108 L 102 122 Q 100 124 98 122 Z" fill="#F5EEDC" opacity="0.9"/>
  <path d="M 94 106 Q 100 110 106 106" fill="none" stroke="#C9B37E" stroke-width="1.2" opacity="0.8"/>

  <!-- 金箍棒（收起，横放身侧） -->
  <line x1="134" y1="146" x2="176" y2="146" stroke="#C22A1A" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
  <rect x="133" y="143" width="5" height="5" rx="1" fill="#F5D742" opacity="0.8"/>
  <rect x="175" y="143" width="5" height="5" rx="1" fill="#F5D742" opacity="0.8"/>

  <!-- 头（头部模板 scale 0.95，庄严肃穆眉眼留猴性） -->
  <use href="#wukong-head" transform="translate(100,74) scale(0.95)"/>

  <!-- 毗卢帽（佛帽） -->
  <path d="M 82 48 Q 100 38 118 48 L 118 36 Q 100 26 82 36 Z" fill="#C22A1A" opacity="0.9"/>
  <path d="M 88 40 L 88 30 M 96 36 L 96 26 M 104 36 L 104 26 M 112 40 L 112 30" stroke="#F5D742" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 92 30 Q 100 26 108 30 Q 104 36 100 36 Q 96 36 92 30 Z" fill="#F5D742" opacity="0.9"/>

  <!-- 佛光粒子（飘浮） -->
  <g fill="#F5D742">
    <circle cx="54" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
