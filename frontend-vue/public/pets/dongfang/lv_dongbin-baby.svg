<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="吕洞宾·二阶·黄粱一梦·功名如梦大梦初醒">
  <defs>
    <!-- 背景：邯郸客店 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E6A52"/>
      <stop offset="55%" stop-color="#5E4E3E"/>
      <stop offset="100%" stop-color="#40362C"/>
    </linearGradient>
    <!-- 梦幻金 -->
    <radialGradient id="dream" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8B64C" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#E8B64C" stop-opacity="0"/>
    </radialGradient>
    <!-- 梦魇青 -->
    <radialGradient id="night" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6E9EAE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6E9EAE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="lv_dongbin-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 剑眉星目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 梦幻金晕 -->
  <circle cx="100" cy="80" r="70" fill="url(#dream)">
    <animate attributeName="opacity" values="0.65;0.4;0.65" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 三幕虚影（头顶，状元/宰相/囚徒） -->
  <g opacity="0.55">
    <!-- 状元（左，红袍） -->
    <path d="M 52 44 Q 54 34 58 31 Q 62 34 62 44 Z" fill="#A8402E"/>
    <circle cx="57" cy="29" r="4" fill="#E0C8A8"/>
    <path d="M 53 27 Q 57 24 61 27 Q 59 22 57 22 Q 55 22 53 27 Z" fill="#1E1814"/>
    <!-- 宰相（中，紫袍） -->
    <path d="M 90 34 Q 92 24 96 21 Q 100 24 100 34 Z" fill="#6E4E8E"/>
    <circle cx="95" cy="19" r="4" fill="#E0C8A8"/>
    <path d="M 91 17 Q 95 14 99 17 Q 97 12 95 12 Q 93 12 91 17 Z" fill="#1E1814"/>
    <!-- 囚徒（右，囚衣） -->
    <path d="M 138 40 Q 140 30 144 27 Q 148 30 148 40 Z" fill="#8A98A8"/>
    <circle cx="143" cy="25" r="4" fill="#E0C8A8"/>
    <path d="M 139 23 Q 143 20 147 23 Q 145 18 143 18 Q 141 18 139 23 Z" fill="#1E1814"/>
  </g>

  <!-- 虚影连接光带 -->
  <path d="M 57 46 Q 80 70 95 88 M 95 36 Q 98 60 108 86 M 143 42 Q 122 66 112 86" stroke="#E8B64C" stroke-width="1.2" opacity="0.4" fill="none">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 客店炕床 -->
  <path d="M 40 130 L 168 130 L 168 176 L 40 176 Z" fill="#6E5A3E"/>
  <path d="M 40 130 L 168 130" stroke="#8E7A4E" stroke-width="1.4" opacity="0.7"/>
  <!-- 枕 -->
  <rect x="120" y="120" width="26" height="12" rx="4" fill="#A8906E"/>
  <!-- 炉上黄粱（右，正熟） -->
  <path d="M 168 128 L 180 128 L 178 140 L 170 140 Z" fill="#8E6A42"/>
  <path d="M 170 128 Q 174 122 178 128" fill="#E8A84E" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <!-- 黄粱蒸气 -->
  <g stroke="#E8E0C8" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
    <path d="M 174 120 Q 170 114 174 108 Q 178 102 174 96">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 177 122 Q 180 116 178 110">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青衫儒生（倚枕而卧，梦醒） -->
  <!-- 身体（半卧） -->
  <path d="M 70 118 Q 64 126 70 134 Q 96 146 122 134 Q 132 128 128 118 Q 100 106 70 118 Z" fill="#5E7E9E" stroke="#3E5E7E" stroke-width="1"/>
  <!-- 青衫 -->
  <path d="M 70 118 Q 64 126 70 134 Q 84 140 98 134 Q 104 130 100 122 Q 86 118 70 118 Z" fill="#6E8EAE" stroke="#4E6E8E" stroke-width="1"/>
  <!-- 枕边书箱 -->
  <rect x="120" y="128" width="18" height="12" rx="2" fill="#8E7A4E"/>

  <!-- 头（侧卧，梦醒目光澄明） -->
  <!-- 儒巾散落 -->
  <!-- 眉（醒时澄明） -->
  <!-- 目（睁大微怔，勘破） -->
  <!-- 鼻梁 -->
  <!-- 唇（微启，若有所悟） -->

  <!-- 梦醒金尘 -->
  <g fill="#E8B64C">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="60">
      <animate attributeName="cy" values="60;52;60" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#lv_dongbin-face" transform="translate(98,108) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 89 107 Q 93 102 98 102 Q 103 102 107 107 Q 103 103 98 103 Q 93 103 89 107 Z" fill="#1E1814"/>
</svg>
