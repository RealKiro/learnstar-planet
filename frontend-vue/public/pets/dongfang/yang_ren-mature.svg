<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨任·四阶·辅周伐纣·云霞兽飞电枪以目破敌">
  <defs>
    <!-- 背景：烽火云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5A6E"/>
      <stop offset="50%" stop-color="#3A4254"/>
      <stop offset="100%" stop-color="#2A2E3E"/>
    </linearGradient>
    <!-- 掌目照敌光华 -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 电光蓝 -->
    <radialGradient id="bolt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6E9EF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 道袍外罩战甲 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8B0C0"/>
      <stop offset="100%" stop-color="#6E7A8E"/>
    </linearGradient>
    <!-- 云霞兽 -->
    <linearGradient id="beast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A0B0"/>
      <stop offset="100%" stop-color="#B86078"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8BC98"/>
    </radialGradient>

    <!-- 头部模板：国字脸·浓眉·掌目威光（脸中心 0,0） -->
    <g id="yangren-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 白眉·掌目 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 烽火（右下） -->
  <radialGradient id="fire" cx="80%" cy="85%" r="45%">
    <stop offset="0%" stop-color="#E8623A" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
  </radialGradient>
  <circle cx="160" cy="170" r="70" fill="url(#fire)"/>

  <!-- 云海 -->
  <g opacity="0.7">
    <path d="M 0 140 Q 50 132 100 138 Q 150 144 200 136 L 200 200 L 0 200 Z" fill="#5A6A7E">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 云霞兽（踏云突袭） -->
  <!-- 法云托足 -->
  <path d="M 52 158 Q 80 148 108 158 Q 120 164 106 174 Q 84 182 60 174 Q 46 164 52 158 Z" fill="#E8D8DC" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 前腿腾空 -->
  <path d="M 78 148 L 66 136 L 72 134 L 82 146 Z" fill="#B86078"/>
  <path d="M 92 150 L 82 138 L 88 136 L 96 148 Z" fill="#C87088"/>
  <!-- 后腿 -->
  <path d="M 66 152 L 60 164 L 65 164 L 70 154 Z" fill="#B86078"/>
  <path d="M 112 152 L 118 162 L 113 162 L 108 154 Z" fill="#B86078"/>
  <!-- 兽身（云霞兽，粉紫身） -->
  <path d="M 66 132 Q 58 120 66 108 Q 78 100 90 102 Q 110 106 114 122 Q 116 136 110 146 Q 98 152 86 150 Q 72 148 66 132 Z" fill="url(#beast)" stroke="#A85068" stroke-width="1.2"/>
  <!-- 兽头 -->
  <path d="M 68 118 Q 56 108 54 98 Q 54 90 62 88 Q 70 88 74 94 Q 76 104 72 114 Z" fill="#C87088" stroke="#A85068" stroke-width="1"/>
  <path d="M 56 94 Q 48 92 46 86 Q 46 80 52 78 Q 58 78 62 84 Q 64 90 60 94 Z" fill="#C87088" stroke="#A85068" stroke-width="1"/>
  <!-- 兽角 -->
  <path d="M 52 84 L 46 72 L 54 78 Z" fill="#E8A0B0"/>
  <circle cx="54" cy="88" r="1.5" fill="#1E1008"/>
  <!-- 云霞鬃毛 -->
  <path d="M 62 92 Q 56 98 52 104" stroke="#B86078" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- 尾巴 -->
  <g stroke="#A85068" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 114 130 Q 124 124 128 116">
      <animateTransform attributeName="transform" type="rotate" values="0 114 130;12 114 130;0 114 130" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青袍将军（道袍外罩战甲，骑云霞兽） -->
  <!-- 战袍下摆 -->
  <path d="M 82 124 Q 90 134 104 134 Q 110 128 108 118 Q 102 128 94 126 Q 86 128 82 124 Z" fill="#3E5E52"/>
  <!-- 战甲上身 -->
  <path d="M 86 92 Q 82 106 88 124 Q 98 130 108 124 Q 114 106 110 92 Q 98 86 86 92 Z" fill="url(#armor)" stroke="#5A6678" stroke-width="1"/>
  <path d="M 90 96 L 94 120 M 104 96 L 100 120" stroke="#C8D0DC" stroke-width="1" opacity="0.7"/>
  <!-- 肩甲 -->
  <circle cx="85" cy="94" r="4.4" fill="#C8D0DC" stroke="#8E9AAE" stroke-width="0.8"/>
  <circle cx="109" cy="94" r="4.4" fill="#C8D0DC" stroke="#8E9AAE" stroke-width="0.8"/>
  <!-- 左臂勒缰 -->
  <path d="M 88 96 C 78 100 74 104 72 112" fill="none" stroke="#6E7A8E" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 头（面部模板） -->
  <use href="#yangren-face" transform="translate(98,84) scale(1)"/>

  <!-- 右手掌目照向前方（照破虚实） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 106 96 C 114 94 120 92 126 88" fill="none" stroke="#6E7A8E" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="128" cy="87" r="6" fill="#E8D8C0" stroke="#B8A888" stroke-width="0.8"/>
    <ellipse cx="128" cy="87" rx="3.4" ry="3" fill="#1E1008"/>
    <circle cx="128.6" cy="86.2" r="1.1" fill="#FFF"/>
    <circle cx="128" cy="87" r="18" fill="url(#eyeGlow)">
      <animate attributeName="r" values="18;24;18" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 掌目照破虚妄之光（扇形） -->
  <g stroke="#FFF3C4" stroke-width="1.8" opacity="0.5" stroke-linecap="round">
    <path d="M 130 90 Q 158 84 178 70">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 88 Q 162 92 182 92">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 左手飞电枪（如电指敌） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 88 96;3 88 96;-3 88 96" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 90 98 C 84 102 80 108 76 114" fill="none" stroke="#6E7A8E" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="75" cy="116" r="3.4" fill="#D8BC98"/>
    <!-- 飞电枪 -->
    <line x1="76" y1="114" x2="40" y2="140" stroke="#C8E8FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 40 140 L 32 148" stroke="#E8F4FF" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 电光 -->
    <circle cx="40" cy="138" r="12" fill="url(#bolt)">
      <animate attributeName="r" values="12;17;12" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 敌军虚影（被掌目照破） -->
  <path d="M 170 100 Q 172 110 166 118 Q 176 122 180 114 Q 184 102 176 96 Q 172 96 170 100 Z" fill="#1E2230" opacity="0.5"/>

  <!-- 电光星屑 -->
  <g fill="#C8E8FF">
    <circle cx="52" cy="128">
      <animate attributeName="cy" values="128;118;128" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.12;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
