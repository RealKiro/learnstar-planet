<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="曹国舅·一阶·皇亲国舅·凭栏赏花富贵满门">
  <defs>
    <!-- 背景：富贵庭院 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B08A6E"/>
      <stop offset="52%" stop-color="#8E6E52"/>
      <stop offset="100%" stop-color="#6E523E"/>
    </linearGradient>
    <!-- 华庭暖光 -->
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </radialGradient>
    <!-- 锦袍金 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A04E"/>
      <stop offset="100%" stop-color="#9E7E3E"/>
    </linearGradient>
    <!-- 富贵紫 -->
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6E9E"/>
      <stop offset="100%" stop-color="#6E4E7E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="cao_guojiu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 温润·桃花眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1 Q -4.5 0.2 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.4 1.8 -0.4 L 1.8 1 Q 4.5 0.2 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.5" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 金楼玉阶 -->
  <path d="M 0 0 L 72 0 L 62 16 Q 40 26 20 24 Z" fill="#B08A5E"/>
  <path d="M 0 0 L 72 0" stroke="#D8B478" stroke-width="1.4"/>
  <!-- 廊柱 -->
  <path d="M 26 24 L 26 120 L 30 120 L 30 24 Z" fill="#9E7E5E"/>
  <path d="M 56 24 L 56 104 L 60 104 L 60 24 Z" fill="#9E7E5E"/>

  <!-- 侍从（背景） -->
  <g opacity="0.4">
    <path d="M 140 120 Q 142 108 147 104 Q 152 106 152 120 Z" fill="#6E5E4E"/>
    <path d="M 158 122 Q 160 110 165 106 Q 170 108 170 122 Z" fill="#5E6E5E"/>
  </g>

  <!-- 花（凭栏赏花） -->
  <g opacity="0.95">
    <path d="M 148 128 Q 144 118 148 110" stroke="#5E8E5E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="148" cy="108" r="6" fill="#E8A0C8"/>
    <circle cx="145" cy="105" r="4" fill="#F0B8D8"/>
    <circle cx="151" cy="106" r="4" fill="#F0B8D8"/>
    <path d="M 160 134 Q 158 126 162 120" stroke="#5E8E5E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="162" cy="118" r="5" fill="#E8A0C8"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E5E4E" opacity="0.7"/>
  <path d="M 0 150 L 200 150" stroke="#8E7A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 锦袍公子（凭栏，华服映日） -->
  <!-- 腿 -->
  <path d="M 90 136 L 86 158 L 92 158 L 96 138 Z" fill="#8E7E5E"/>
  <path d="M 108 136 L 116 160 L 110 160 L 104 138 Z" fill="#8E7E5E"/>
  <!-- 锦袍（金紫） -->
  <path d="M 88 124 Q 86 132 90 140 Q 100 146 108 140 Q 114 132 112 124 Q 100 118 88 124 Z" fill="url(#purple)"/>
  <!-- 上身 -->
  <!-- 玉带 -->
  <path d="M 90 112 L 110 112" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="110" cy="113" r="2.4" fill="#E8D8A8"/>
  <!-- 锦袍纹 -->

  <!-- 头（俊逸面容，莲花冠） -->
  <circle cx="100" cy="71" r="3" fill="#F0C8D8"/>
  <path d="M 97 70 Q 100 68 103 70 Q 100 71.5 97 70 Z" fill="#F0C8D8"/>
  <!-- 眉目温润 -->
  <!-- 眼含富贵气 -->
  <!-- 鼻梁 -->
  <!-- 含笑 -->

  <!-- 左臂扶栏 -->
  <path d="M 92 100 C 86 104 82 108 80 114" fill="none" stroke="#C8A04E" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 右臂持折扇（轻摇） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 108 100;4 108 100;-5 108 100" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 108 100 C 114 104 118 106 120 112" fill="none" stroke="#C8A04E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="121" cy="114" r="3" fill="#D8C0A0"/>
    <!-- 折扇 -->
    <path d="M 121 112 Q 130 106 136 110 Q 138 116 130 120 Q 124 122 120 116 Z" fill="#E8D8A8" stroke="#C8B068" stroke-width="0.8"/>
  </g>

  <!-- 富贵金尘 -->
  <g fill="#E8C07A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#cao_guojiu-face" transform="translate(100,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 90 86 Q 94 81 100 81 Q 106 81 110 86 Q 106 82 100 82 Q 94 82 90 86 Z" fill="#1E1814"/>
</svg>
