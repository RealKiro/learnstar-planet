<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汉钟离·三阶·东华传法·芭蕉扇烈焰滔天">
  <defs>
    <!-- 背景：山间道场赤阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A878"/>
      <stop offset="52%" stop-color="#C88058"/>
      <stop offset="100%" stop-color="#9E5E3E"/>
    </linearGradient>
    <!-- 大日金 -->
    <radialGradient id="sun" cx="76%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 烈焰橙 -->
    <radialGradient id="fire" cx="40%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#F58A3E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F58A3E" stop-opacity="0"/>
    </radialGradient>
    <!-- 红袍道衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0484E"/>
      <stop offset="100%" stop-color="#8E2E38"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D0B0"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </radialGradient>

    <!-- 头部模板：赤发·浓眉·虎目含火·虬髯方正（脸中心 0,0） -->
    <g id="hanzhongli-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 赤发·虬髯 -->
      <path d="M -4.5 7 Q -2 9 0 7.4 M 0 7.4 Q 2 9 4.5 7 M -2 9.2 Q 0 11 2 9.2" stroke="#2E1A10" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 大日初升 -->
  <circle cx="152" cy="52" r="50" fill="url(#sun)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="13" fill="#FFF3C4" opacity="0.9">
    <animate attributeName="r" values="13;15;13" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 烈焰滔天（扇向左侧） -->
  <circle cx="40" cy="140" r="70" fill="url(#fire)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <g fill="#F58A3E" opacity="0.85">
    <path d="M 30 132 Q 22 120 30 112 Q 40 106 46 116 Q 42 126 32 132 Z">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 50 148 Q 40 138 48 130 Q 58 124 64 134 Q 60 144 52 148 Z">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 24 150 Q 14 140 22 132 Q 32 126 38 136 Q 34 146 26 150 Z">
      <animate attributeName="opacity" values="0.75;0.3;0.75" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山影 -->
  <path d="M 0 160 Q 60 148 120 156 Q 170 162 200 154 L 200 200 L 0 200 Z" fill="#8E4E3E" opacity="0.5"/>

  <!-- 红袍道人（持芭蕉扇，赤发飞舞） -->
  <!-- 腿 -->
  <path d="M 88 134 L 84 158 L 90 158 L 94 136 Z" fill="#7E242E"/>
  <path d="M 106 134 L 114 160 L 108 160 L 102 136 Z" fill="#7E242E"/>
  <!-- 红袍道衣 -->
  <path d="M 88 96 Q 84 112 90 134 Q 100 140 110 134 Q 116 112 112 96 Q 100 90 88 96 Z" fill="url(#robe)" stroke="#6E1E2A" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 116 L 112 116" stroke="#E8D8A8" stroke-width="2"/>
  <!-- 道袍赤阳纹 -->
  <path d="M 94 102 Q 96 106 94 110 M 104 102 Q 102 106 104 110" stroke="#E8A0A8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- 头（面部模板） -->
  <use href="#hanzhongli-face" transform="translate(100,88) scale(1)"/>

  <!-- 左臂背扇（负） -->
  <path d="M 90 100 C 82 104 78 110 80 118" fill="none" stroke="#C0484E" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 右臂持芭蕉扇（一扇火海） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 108 98;4 108 98;-6 108 98" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 106 98 C 112 94 118 92 122 88" fill="none" stroke="#C0484E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="124" cy="87" r="3.4" fill="#D8B894"/>
    <!-- 芭蕉扇 -->
    <path d="M 124 84 Q 140 76 150 86 Q 152 96 140 100 Q 128 100 122 90 Z" fill="#6EA878" stroke="#4E885E" stroke-width="1.2"/>
    <path d="M 124 86 Q 136 82 144 88 M 124 90 Q 134 88 140 94" stroke="#4E885E" stroke-width="1" opacity="0.7" fill="none"/>
  </g>

  <!-- 扇风火线（扇向烈焰） -->
  <g stroke="#FFE066" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <path d="M 120 92 Q 100 100 80 108">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 122 96 Q 104 104 86 114">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 赤阳真火星尘 -->
  <g fill="#FFE066">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
