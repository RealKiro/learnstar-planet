<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·六阶·渭水归去·无钩垂钓">
  <defs>
    <!-- 背景：水墨远山暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4E0D8"/>
      <stop offset="70%" stop-color="#D8D8D4"/>
      <stop offset="100%" stop-color="#A8B8B8"/>
    </linearGradient>
    <!-- 夕阳暖黄 -->
    <radialGradient id="sun" cx="72%" cy="22%" r="40%">
      <stop offset="0%" stop-color="#E8B87A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8B87A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0DCD6" stop-opacity="0.6"/>
    </radialGradient>

    <g id="jiangziya-face">
      <ellipse cx="0" cy="0" rx="16" ry="15" fill="#F0DCC0" stroke="#C8B498" stroke-width="1"/>
      <path d="M -9 -6 Q -5 -9 -1 -7 M 9 -6 Q 5 -9 1 -7" fill="none" stroke="#9A8A70" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -7 -4 Q -4 -2 -1 -4 M 7 -4 Q 4 -2 1 -4" fill="none" stroke="#6E5E4E" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C8B498" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M -3 6 Q 0 8 3 6" fill="none" stroke="#B0A088" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M -6 9 Q -3 17 0 20 Q 3 17 6 9 Q 3 12 0 13 Q -3 12 -6 9 Z" fill="#F0EEE8" opacity="0.95"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="146" cy="44" r="56" fill="url(#sun)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山（水墨） -->
  <path d="M 0 158 Q 50 130 100 146 Q 150 162 200 140 L 200 200 L 0 200 Z" fill="#A8B8B8" opacity="0.5"/>
  <path d="M 0 170 Q 60 154 120 166 Q 160 174 200 162 L 200 200 L 0 200 Z" fill="#B8C0BE" opacity="0.4"/>

  <!-- 渭水（与天融为一体） -->
  <path d="M 0 172 Q 50 166 100 170 Q 150 174 200 168 L 200 200 L 0 200 Z" fill="#C8D0CC" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.4s" repeatCount="indefinite"/>
  </path>

  <!-- 青石 -->
  <path d="M 60 158 L 92 158 L 88 170 L 64 170 Z" fill="#B8BCBC" opacity="0.85"/>

  <!-- 白发披散（侧坐） -->
  <path d="M 72 76 Q 64 84 66 94 Q 70 104 78 106" fill="none" stroke="#F5F0E8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M 80 72 Q 70 78 72 90 Q 76 100 84 102" fill="none" stroke="#F5F0E8" stroke-width="3.4" stroke-linecap="round" opacity="0.85"/>

  <!-- 角色：白发老者独坐青石（布衣鹤氅） -->
  <path d="M 70 94 Q 64 110 68 128 Q 80 140 90 128 Q 94 112 92 98 Z" fill="url(#robe)"/>
  <!-- 头（基础脸，侧坐） -->
  <use href="#jiangziya-face" transform="translate(82,86) scale(0.95) rotate(-6)"/>

  <!-- 竹竿横膝（不垂不钓） -->
  <line x1="62" y1="142" x2="108" y2="150" stroke="#8E6E3A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 草鞋 -->
  <ellipse cx="76" cy="164" rx="9" ry="5" fill="#A89878" opacity="0.8"/>

  <!-- 竹杖（手边） -->
  <line x1="104" y1="120" x2="100" y2="168" stroke="#8E6E3A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 归真粒子（飘浮） -->
  <g fill="#C0B0A0">
    <circle cx="56" cy="116">
      <animate attributeName="cy" values="116;108;116" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
