<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·六阶·道果·姜太公临">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE8DE"/>
      <stop offset="70%" stop-color="#E8E6E2"/>
      <stop offset="100%" stop-color="#C9CFD8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A8FB8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9A8FB8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#E4E0DC" stop-opacity="0.6"/>
    </linearGradient>

    <g id="jiangziya-head">
      <ellipse cx="0" cy="0" rx="17" ry="16" fill="#F5EEDC" stroke="#D0C0A8" stroke-width="1"/>
      <path d="M -10 -6 Q -6 -10 -2 -8 M 10 -6 Q 6 -10 2 -8" fill="none" stroke="#9A8A70" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -8 -4 Q -5 -2 -2 -4 M 8 -4 Q 5 -2 2 -4" fill="none" stroke="#6E5E4E" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C8B498" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M -4 7 Q 0 9 4 7" fill="none" stroke="#B0A088" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -14 -8 Q -10 -18 0 -20 Q 10 -18 14 -8 Q 8 -14 0 -15 Q -8 -14 -14 -8 Z" fill="#F5F0E8" opacity="0.95"/>
      <circle cx="0" cy="-22" r="5" fill="#F5F0E8" opacity="0.9"/>
      <path d="M -7 10 Q -4 20 0 24 Q 4 20 7 10 Q 3 14 0 15 Q -3 14 -7 10 Z" fill="#F5F0E8" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 神光 + 万法光环（呼吸） -->
  <circle cx="100" cy="104" r="84" fill="url(#glow)">
    <animate attributeName="r" values="84;94;84" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="66" fill="none" stroke="#9A8FB8" stroke-width="1.8" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 100 104;30 100 104;0 100 104" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="54" fill="none" stroke="#9A8FB8" stroke-width="1" opacity="0.3" stroke-dasharray="4 6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 104;-25 100 104;0 100 104" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- 云台（端坐） -->
  <path d="M 26 176 C 46 168 62 176 82 170 Q 100 164 118 172" fill="none" stroke="#C0B0C0" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M 30 182 Q 60 174 90 178 Q 120 182 150 176" fill="none" stroke="#D8D0E0" stroke-width="7" stroke-linecap="round" opacity="0.5"/>

  <!-- 法身（素白道袍，端坐） -->
  <path d="M 76 98 Q 100 90 124 98 L 118 148 Q 100 160 82 148 Z" fill="url(#robe)"/>
  <path d="M 92 96 L 92 150 M 108 96 L 108 150" stroke="#D8D4E0" stroke-width="1.2" opacity="0.6"/>

  <!-- 封神榜（执于身前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3.4s" repeatCount="indefinite"/>
    <rect x="86" y="112" width="16" height="26" rx="2" fill="#E8D8C0" opacity="0.9"/>
    <path d="M 88 116 L 100 116 M 88 122 L 100 122" stroke="#C9B37E" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- 手（捧榜） -->
  <ellipse cx="88" cy="140" rx="5" ry="6" fill="#F5EEDC" opacity="0.9"/>
  <ellipse cx="100" cy="142" rx="5" ry="6" fill="#F5EEDC" opacity="0.9"/>

  <!-- 头（头部模板 scale 1.0，垂目） -->
  <use href="#jiangziya-head" transform="translate(100,84) scale(1)"/>

  <!-- 垂目（慈眉） -->
  <path d="M -8 -4 Q -5 -2 -2 -4 M 8 -4 Q 5 -2 2 -4" fill="none" stroke="#8E7E6E" stroke-width="2" stroke-linecap="round"/>

  <!-- 万法符文（环绕几道淡紫光符） -->
  <g stroke="#9A8FB8" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <path d="M 46 78 L 40 70 M 154 78 L 160 70 M 40 118 L 34 116 M 160 118 L 166 116"/>
  </g>

  <!-- 归真粒子（飘浮） -->
  <g fill="#9A8FB8">
    <circle cx="58" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="144" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
