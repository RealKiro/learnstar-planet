<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="钟馗·五阶·封神·五方鬼卒">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#5B2A8A"/>
      <stop offset="55%" stop-color="#3A1A5E"/>
      <stop offset="100%" stop-color="#1E0E34"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#D86A4A"/>
      <stop offset="60%" stop-color="#C85A4A"/>
      <stop offset="100%" stop-color="#A8463A"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2434"/>
      <stop offset="100%" stop-color="#181420"/>
    </linearGradient>

    <g id="zhongkui-head">
      <ellipse cx="0" cy="0" rx="20" ry="18" fill="url(#skin)"/>
      <path d="M 0 -15 L 0 -7" stroke="#8E3A2A" stroke-width="2" stroke-linecap="round"/>
      <path d="M -16 -10 Q -10 -15 -4 -13 M 16 -10 Q 10 -15 4 -13" fill="none" stroke="#1A0A0A" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="-8" cy="-4" r="5.6" fill="#FFF"/>
      <circle cx="8" cy="-4" r="5.6" fill="#FFF"/>
      <circle cx="-8" cy="-4" r="2.4" fill="#1A0A0A"/>
      <circle cx="8" cy="-4" r="2.4" fill="#1A0A0A"/>
      <path d="M -6 6 L -3 9 L 3 9 L 6 6" fill="#8E3A2A" opacity="0.8"/>
      <path d="M -14 4 Q -17 13 -10 20 Q 0 26 10 20 Q 17 13 14 4 Q 10 9 0 9 Q -10 9 -14 4 Z" fill="#1A0A0A"/>
      <path d="M -12 11 Q -8 16 -4 13 M 12 11 Q 8 16 4 13 M 0 10 L 0 18 M -6 8 L -9 12 M 6 8 L 9 12" stroke="#2A1A0A" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 完整背光（呼吸） -->
  <g>
    <animate attributeName="opacity" values="1;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <circle cx="100" cy="104" r="86" fill="#F5D742" opacity="0.1"/>
    <circle cx="100" cy="104" r="78" fill="none" stroke="#F5D742" stroke-width="2" opacity="0.45"/>
    <circle cx="100" cy="104" r="68" fill="none" stroke="#F5D742" stroke-width="1" opacity="0.22"/>
  </g>

  <!-- 青锋剑（斜背） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 132 64;3 132 64;0 132 64" dur="2.6s" repeatCount="indefinite"/>
    <line x1="114" y1="96" x2="146" y2="36" stroke="#F5D742" stroke-width="4" stroke-linecap="round"/>
    <path d="M 146 36 L 154 28 L 146 32 L 151 24 Z" fill="#E8E0D0"/>
    <path d="M 114 96 L 110 104" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 玄黑蟒袍下摆 + 官靴 -->
  <path d="M 82 138 L 118 138 L 120 158 L 80 158 Z" fill="url(#robe)"/>
  <path d="M 86 154 L 94 154 L 96 162 L 84 162 Z" fill="#0E0A16"/>
  <path d="M 106 154 L 114 154 L 116 162 L 104 162 Z" fill="#0E0A16"/>

  <!-- 身体（玄黑蟒袍，魁梧端立） -->
  <path d="M 80 92 Q 72 108 78 130 Q 100 142 122 130 Q 128 108 120 92 Q 100 84 80 92 Z" fill="url(#robe)"/>
  <!-- 金纹补子 -->
  <circle cx="100" cy="108" r="11" fill="none" stroke="#F5D742" stroke-width="1.6" opacity="0.6"/>
  <path d="M 100 99 Q 104 104 100 108 Q 96 104 100 99" fill="#F5D742" opacity="0.7"/>
  <path d="M 100 106 Q 104 110 100 114 Q 96 110 100 106" fill="#F5D742" opacity="0.7"/>
  <!-- 蟒袍金边 -->
  <path d="M 82 92 Q 100 84 118 92" fill="none" stroke="#F5D742" stroke-width="1.4" opacity="0.6"/>

  <!-- 手臂（一持判官笔，一握剑柄） -->
  <path d="M 90 100 C 84 108 80 118 82 128" fill="none" stroke="url(#robe)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="82" cy="132" r="5" fill="#D0B8A0"/>
  <path d="M 112 102 C 122 110 126 120 122 130" fill="none" stroke="url(#robe)" stroke-width="9" stroke-linecap="round"/>

  <!-- 判官笔 -->
  <line x1="120" y1="110" x2="126" y2="150" stroke="#6A5540" stroke-width="3" stroke-linecap="round"/>
  <line x1="126" y1="150" x2="128" y2="158" stroke="#C9A227" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 头（头部模板 scale 1.05） -->
  <use href="#zhongkui-head" transform="translate(100,80) scale(1.05)"/>

  <!-- 紫金冠（对称华丽） -->
  <path d="M 82 56 Q 100 46 118 56 L 118 46 Q 100 36 82 46 Z" fill="#F5D742" opacity="0.95"/>
  <path d="M 88 48 L 88 36 M 96 44 L 96 32 M 104 44 L 104 32 M 112 48 L 112 36" stroke="#C9A227" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="100" cy="32" r="4" fill="#F5D742">
    <animate attributeName="r" values="4;5;4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 祥光放射（对称） -->
  <g stroke="#F5D742" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M 34 70 L 26 62"/>
    <path d="M 166 70 L 174 62"/>
    <path d="M 44 38 L 38 28"/>
    <path d="M 156 38 L 162 28"/>
  </g>

  <!-- 神光粒子（飘浮） -->
  <g fill="#F5D742">
    <circle cx="54" cy="114">
      <animate attributeName="cy" values="114;104;114" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="114">
      <animate attributeName="cy" values="114;104;114" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
