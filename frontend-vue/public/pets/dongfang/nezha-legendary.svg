<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哪吒·五阶·封神·三太子">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#5B2A8A"/>
      <stop offset="55%" stop-color="#3A1A5E"/>
      <stop offset="100%" stop-color="#1E0E34"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFE9D4"/>
      <stop offset="100%" stop-color="#F0D4B8"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>

    <g id="nezha-head">
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#FBEBD6" stroke="#D8B894" stroke-width="1"/>
      <circle cx="-14" cy="-21" r="7" fill="#2A1A0A"/>
      <circle cx="14" cy="-21" r="7" fill="#2A1A0A"/>
      <path d="M -10 -14 Q -4 -18 0 -15 Q 4 -18 10 -14" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="-5.4" cy="-3.6" r="1.5" fill="#FFF"/>
      <circle cx="8.6" cy="-3.6" r="1.5" fill="#FFF"/>
      <path d="M -11 -6 Q -8 -9 -5 -8 M 11 -6 Q 8 -9 5 -8" fill="none" stroke="#2A1A0A" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -4 6 Q 0 9 4 6" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-11" cy="4" r="3.6" fill="#C85A4A" opacity="0.32"/>
      <circle cx="11" cy="4" r="3.6" fill="#C85A4A" opacity="0.32"/>
      <path d="M 0 -18 Q 2 -22 5 -23" fill="none" stroke="#2A1A0A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 完整背光（呼吸） -->
  <g>
    <animate attributeName="opacity" values="1;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <circle cx="100" cy="104" r="86" fill="#F5D742" opacity="0.1"/>
    <circle cx="100" cy="104" r="78" fill="none" stroke="#F5D742" stroke-width="2" opacity="0.45"/>
    <circle cx="100" cy="104" r="68" fill="none" stroke="#F5D742" stroke-width="1" opacity="0.22"/>
  </g>

  <!-- 风火轮（踏焰） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 82 158;60 82 158;120 82 158" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="82" cy="158" r="13" fill="none" stroke="#FFC24A" stroke-width="4.5"/>
    <path d="M 82 145 L 82 171 M 69 158 L 95 158" stroke="#FFC24A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 118 158;60 118 158;120 118 158" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="118" cy="158" r="13" fill="none" stroke="#FFC24A" stroke-width="4.5"/>
    <path d="M 118 145 L 118 171 M 105 158 L 131 158" stroke="#FFC24A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 腿 -->
  <path d="M 88 136 C 84 146 82 152 82 158" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 112 136 C 116 146 118 152 118 158" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>

  <!-- 身体（莲花金甲） -->
  <path d="M 90 92 Q 82 108 88 128 Q 100 138 112 128 Q 118 108 112 92 Q 104 86 90 92 Z" fill="url(#skin)"/>
  <path d="M 88 96 Q 100 88 112 96 L 110 118 Q 100 124 90 118 Z" fill="url(#armor)"/>
  <path d="M 96 94 L 96 120 M 104 94 L 104 120" stroke="#8E6E14" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="86" cy="104" r="7" fill="url(#armor)"/>
  <circle cx="114" cy="104" r="7" fill="url(#armor)"/>

  <!-- 多臂（正面2 + 两侧各1） -->
  <path d="M 102 100 C 112 92 120 84 126 74" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="72" r="4" fill="url(#skin)"/>
  <path d="M 96 100 C 86 102 78 108 72 116" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 90 104 C 74 110 62 120 54 130" fill="none" stroke="url(#skin)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="52" cy="133" r="3.5" fill="url(#skin)" opacity="0.9"/>

  <!-- 火尖枪 -->
  <line x1="60" y1="152" x2="132" y2="44" stroke="#8E1A12" stroke-width="5" stroke-linecap="round"/>
  <path d="M 132 44 L 142 34 L 132 38 L 138 30 Z" fill="#FFC24A"/>

  <!-- 掷出的乾坤圈 -->
  <circle cx="58" cy="118" r="6.5" fill="none" stroke="#F5D742" stroke-width="3">
    <animate attributeName="cx" values="58;40;58" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 混天绫（飘） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 3;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 112 122 C 136 124 150 134 146 148 C 156 140 154 124 140 118 C 130 114 118 118 112 122 Z" fill="#C22A1A" opacity="0.92"/>
  </g>

  <!-- 主头（头部模板 scale 1.05） -->
  <use href="#nezha-head" transform="translate(100,82) scale(1.05)"/>

  <!-- 金冠束发 -->
  <path d="M 82 60 Q 100 52 118 60" fill="none" stroke="#F5D742" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="100" cy="48" r="3.6" fill="#F5D742">
    <animate attributeName="r" values="3.6;4.6;3.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 祥光放射（对称） -->
  <g stroke="#F5D742" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M 36 70 L 28 62"/>
    <path d="M 164 70 L 172 62"/>
    <path d="M 44 38 L 38 28"/>
    <path d="M 156 38 L 162 28"/>
  </g>

  <!-- 神光粒子（飘浮） -->
  <g fill="#F5D742">
    <circle cx="54" cy="114">
      <animate attributeName="cy" values="114;104;114" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="114">
      <animate attributeName="cy" values="114;104;114" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
