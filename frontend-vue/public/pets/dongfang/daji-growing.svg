<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妲己·三阶·魅惑君王·摘星楼凭栏九尾隐现">
  <defs>
    <!-- 背景：摘星楼夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E3050"/>
      <stop offset="55%" stop-color="#2E2438"/>
      <stop offset="100%" stop-color="#201828"/>
    </linearGradient>
    <!-- 奢靡金 -->
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 凤冠霞帔 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C04878"/>
      <stop offset="100%" stop-color="#963058"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：鹅蛋脸·细眉入鬓·狐目迷离·朱唇（脸中心 0,0） -->
    <g id="daji-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 狐目·朱唇 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.6 -1.8 -0.5 L -1.8 0.9 Q -4.5 0.1 -7.5 1.9 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.6 1.8 -0.5 L 1.8 0.9 Q 4.5 0.1 7.5 1.9 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.2" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.2" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.6" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.6" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="92" r="84" fill="url(#glow)"/>

  <!-- 星空 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="36" r="1"/>
    <circle cx="70" cy="22" r="0.8"/>
    <circle cx="150" cy="30" r="1.1"/>
    <circle cx="176" cy="58" r="0.8"/>
  </g>

  <!-- 摘星楼栏 -->
  <path d="M 0 118 L 200 118 L 200 132 L 0 132 Z" fill="#6E5A3E"/>
  <path d="M 0 118 L 200 118" stroke="#8E7A4E" stroke-width="1.6" opacity="0.7"/>
  <path d="M 20 118 L 20 96 M 60 118 L 60 96 M 140 118 L 140 96 M 180 118 L 180 96" stroke="#6E5A3E" stroke-width="2" opacity="0.7"/>

  <!-- 朝歌万家灯火（楼下远景） -->
  <g opacity="0.55">
    <circle cx="40" cy="142" r="2" fill="#E8A84E"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="150" r="1.6" fill="#E8A84E"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="146" r="1.8" fill="#E8A84E"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="152" r="1.5" fill="#E8A84E"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="176" cy="144" r="1.7" fill="#E8A84E"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- 酒池（左下，水光） -->
  <path d="M 0 168 Q 30 160 60 166 Q 90 172 60 178 Q 20 178 0 172 Z" fill="#6E8A9A" opacity="0.6"/>
  <path d="M 8 170 Q 28 164 52 169" stroke="#9AB8C8" stroke-width="1.2" opacity="0.7"/>

  <!-- 凤冠霞帔妖姬（凭栏而立，裙下九尾隐现） -->
  <!-- 裙摆 -->
  <path d="M 82 124 Q 96 138 116 130 Q 122 124 118 114 Q 108 126 96 122 Q 86 126 82 124 Z" fill="url(#gown)"/>
  <path d="M 84 124 L 90 156 Q 100 162 112 156 L 116 126" fill="none" stroke="#6E1E3E" stroke-width="1.2"/>
  <!-- 上身 -->
  <path d="M 88 94 Q 84 106 90 122 Q 98 128 108 122 Q 114 106 110 94 Q 98 88 88 94 Z" fill="url(#gown)" stroke="#6E1E3E" stroke-width="1"/>
  <!-- 霞帔 -->
  <path d="M 86 98 Q 80 106 82 118 M 112 98 Q 118 104 116 116" fill="none" stroke="#F0C0D8" stroke-width="2.4" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- 腰带 -->
  <path d="M 88 108 L 110 108" stroke="#E8B64C" stroke-width="1.8"/>
  <!-- 裙下九尾隐现 -->
  <g fill="#F6F2EC" stroke="#C8C8D8" stroke-width="0.8" opacity="0.7">
    <path d="M 96 142 Q 88 152 84 160 Q 92 158 98 150 Z"/>
    <path d="M 104 142 Q 112 152 116 160 Q 108 158 102 150 Z"/>
    <path d="M 100 144 Q 98 156 100 164 Q 104 158 102 148 Z"/>
  </g>

  <!-- 头（面部模板） -->
  <use href="#daji-face" transform="translate(99,86) scale(1)"/>
  <!-- 凤冠 -->
  <path d="M 88 76 Q 99 68 110 76 L 108 72 Q 99 64 90 72 Z" fill="#E8B64C" opacity="0.9"/>
  <circle cx="99" cy="66" r="3" fill="#E8B64C">
    <animate attributeName="r" values="3;4;3" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 左臂长袖轻舞 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 90 98;4 90 98;-4 90 98" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 90 98 C 82 102 78 106 78 114" fill="none" stroke="#C04878" stroke-width="4.6" stroke-linecap="round"/>
    <!-- 长袖 -->
    <path d="M 78 112 Q 68 118 70 128 Q 78 130 82 122" fill="#E8A0C8" opacity="0.8"/>
  </g>

  <!-- 右臂扶栏 -->
  <path d="M 108 98 C 116 100 120 104 122 110" fill="none" stroke="#C04878" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 魅惑之瞳光 -->
  <g stroke="#B8436E" stroke-width="1.6" opacity="0.4" stroke-linecap="round">
    <path d="M 84 92 Q 70 96 62 104">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 妖媚紫尘 -->
  <g fill="#B8436E">
    <circle cx="44" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="154" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
