<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·四阶·淬炼·大闹天宫">
  <defs>
    <!-- 背景：墨褐 + 血绛火光 -->
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241A14"/>
      <stop offset="70%" stop-color="#17100C"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </radialGradient>
    <radialGradient id="fur" cx="42%" cy="36%" r="76%">
      <stop offset="0%" stop-color="#E8BE4E"/>
      <stop offset="60%" stop-color="#D9A830"/>
      <stop offset="100%" stop-color="#B8861F"/>
    </radialGradient>
    <radialGradient id="face" cx="45%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F5E2BE"/>
      <stop offset="100%" stop-color="#E4CE9E"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：天劫雷电 -->
  <path d="M 26 40 L 44 58 L 34 62 L 52 80" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M 178 90 L 162 104 L 174 108 L 156 128" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- 环境：天火 -->
  <path d="M 20 188 Q 32 168 46 182 Q 56 162 70 178 Q 82 158 96 176 Q 108 160 120 178 Q 132 164 144 182 Q 154 166 168 184 Q 176 172 186 188 Z" fill="#8B1A1A" opacity="0.5"/>
  <path d="M 30 190 Q 44 172 58 184 Q 70 166 84 180 Q 96 166 110 182 Q 122 168 134 184 Q 146 172 158 186 Q 168 174 178 190 Z" fill="#D43A2A" opacity="0.35"/>

  <!-- 红披风（身后飘） -->
  <path d="M 108 96 C 136 100 150 120 142 150 C 136 164 122 168 116 158 C 112 150 112 130 106 108 Z" fill="#C22A1A" opacity="0.9"/>
  <path d="M 104 96 C 120 104 128 126 122 146 C 118 158 108 160 104 150 Z" fill="#8E1A12" opacity="0.7"/>

  <!-- 腿（腾跃，一后蹬一前收） -->
  <path d="M 84 138 C 76 150 70 158 66 164" fill="none" stroke="url(#fur)" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="64" cy="166" rx="8" ry="6" fill="#B8861F"/>
  <path d="M 116 136 C 124 148 128 154 130 160" fill="none" stroke="url(#fur)" stroke-width="9" stroke-linecap="round" transform="rotate(-14 128 150)"/>
  <ellipse cx="132" cy="162" rx="8" ry="6" fill="#B8861F"/>

  <!-- 躯干（腾跃前倾，精瘦） -->
  <path d="M 90 92 Q 84 110 88 130 Q 100 140 114 128 Q 118 110 114 94 Q 104 88 90 92 Z" fill="url(#fur)" transform="rotate(-10 100 112)"/>

  <!-- 锁子黄金甲（胸甲 + 甲片） -->
  <path d="M 88 100 Q 100 92 112 100 L 112 124 Q 100 132 88 124 Z" fill="url(#armor)" transform="rotate(-10 100 112)"/>
  <path d="M 96 98 L 94 126 M 106 98 L 106 130 M 116 100 L 116 124" stroke="#8E6E14" stroke-width="1.8" opacity="0.8" transform="rotate(-10 100 112)"/>
  <path d="M 92 106 Q 100 112 108 106" fill="none" stroke="#8E6E14" stroke-width="1.8" opacity="0.8"/>
  <!-- 肩甲 -->
  <circle cx="84" cy="104" r="8" fill="url(#armor)"/>
  <circle cx="118" cy="104" r="8" fill="url(#armor)"/>

  <!-- 手臂（右手高举棒，左手在侧） -->
  <path d="M 96 96 C 100 86 106 80 112 72" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="114" cy="68" r="5" fill="#B8861F"/>
  <path d="M 108 100 C 118 106 122 116 120 126" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="119" cy="129" r="4.4" fill="#B8861F"/>

  <!-- 金箍棒（红金两色，高举斜劈） -->
  <line x1="128" y1="36" x2="62" y2="150" stroke="#C22A1A" stroke-width="6" stroke-linecap="round"/>
  <line x1="126" y1="42" x2="66" y2="144" stroke="#F5D742" stroke-width="1.8" opacity="0.9"/>
  <rect x="127" y="32" width="7" height="6" rx="1.2" fill="#F5D742"/>
  <rect x="58" y="150" width="7" height="6" rx="1.2" fill="#F5D742"/>

  <!-- 尾巴（卷） -->
  <path d="M 112 128 C 138 132 154 118 152 100 C 151 92 144 90 140 94" fill="none" stroke="url(#fur)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- 头（桃心脸，桀骜） -->
  <ellipse cx="100" cy="64" rx="16" ry="14" fill="url(#fur)" transform="rotate(8 100 64)"/>
  <path d="M 100 48 C 115 48 121 59 119 70 C 117 81 108 89 100 92 C 92 89 83 81 81 70 C 79 59 85 48 100 48 Z" fill="url(#face)" transform="rotate(8 100 70)"/>
  <!-- 耳 -->
  <circle cx="82" cy="62" r="5" fill="#B8861F"/>
  <circle cx="118" cy="62" r="5" fill="#B8861F"/>

  <!-- 金毛（桀骜炸毛） -->
  <path d="M 92 50 Q 88 42 94 36 Q 98 42 100 38 Q 104 42 108 38 Q 112 46 108 50" fill="none" stroke="#B8861F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 丹凤眼（桀骜上挑）+ 红晕 -->
  <path d="M 85 62 Q 93 54 101 60 Q 93 65 85 62 Z" fill="#1A0A0A"/>
  <path d="M 99 60 Q 107 54 115 62 Q 107 65 99 60 Z" fill="#1A0A0A"/>
  <circle cx="94" cy="60" r="1.5" fill="#F5D742"/>
  <circle cx="106" cy="60" r="1.5" fill="#F5D742"/>
  <path d="M 82 63 Q 84 67 87 65" fill="none" stroke="#C85A4A" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 118 63 Q 116 67 113 65" fill="none" stroke="#C85A4A" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <!-- 怒眉 -->
  <path d="M 84 56 Q 92 52 100 56" fill="none" stroke="#8E5A14" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 雷公嘴（龇牙） -->
  <path d="M 92 78 Q 100 84 108 78 Q 100 88 92 78 Z" fill="#B0852A"/>
  <path d="M 96 81 Q 100 84 104 81" fill="none" stroke="#FFF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>

  <!-- 凤翅紫金冠（斜戴） -->
  <path d="M 82 46 C 72 36 72 26 82 20 L 92 34 L 98 26 L 100 40" fill="none" stroke="#F5D742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 118 54 C 128 46 132 38 124 34 L 116 44 L 110 40 L 108 50" fill="none" stroke="#F5D742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 80 56 Q 100 48 120 56" fill="none" stroke="#F5D742" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 战斗光环 -->
  <circle cx="100" cy="110" r="58" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.5" stroke-dasharray="7 6"/>

  <!-- 火星 -->
  <circle cx="60" cy="116" r="1.8" fill="#F97316" opacity="0.85"/>
  <circle cx="144" cy="112" r="1.5" fill="#D43A2A" opacity="0.7"/>
  <circle cx="100" cy="182" r="1.4" fill="#F5D742" opacity="0.6"/>
</svg>
