<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·四阶·淬炼·齐天大圣">
  <defs>
    <radialGradient id="bg" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#B03030"/>
      <stop offset="60%" stop-color="#7A1E1E"/>
      <stop offset="100%" stop-color="#3E1016"/>
    </radialGradient>
    <radialGradient id="fur" cx="42%" cy="36%" r="76%">
      <stop offset="0%" stop-color="#E8BE4E"/>
      <stop offset="60%" stop-color="#D9A830"/>
      <stop offset="100%" stop-color="#B8861F"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>

    <g id="wukong-head">
      <path d="M 0 -34 C 16 -34 21 -20 19 -7 C 17 5 9 13 0 16 C -9 13 -17 5 -19 -7 C -21 -20 -16 -34 0 -34 Z" fill="#F7E6C6" stroke="#8B6914" stroke-width="1.2"/>
      <circle cx="-21" cy="-8" r="5" fill="#E0B13B"/>
      <circle cx="21" cy="-8" r="5" fill="#E0B13B"/>
      <path d="M -8 -33 Q -6 -42 -1 -46 Q 3 -43 5 -40 Q 8 -44 12 -42 Q 10 -34 6 -32" fill="none" stroke="#C08E26" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -18 -10 Q -25 -6 -27 -1 M 18 -10 Q 25 -6 27 -1" fill="none" stroke="#C08E26" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <path d="M -12 -6 Q -6 -14 2 -9 Q -6 -3 -12 -6 Z" fill="#1A0A0A"/>
      <path d="M -2 -9 Q 6 -14 12 -6 Q 6 -3 -2 -9 Z" fill="#1A0A0A"/>
      <circle cx="-4" cy="-9" r="1.4" fill="#F5D742"/>
      <circle cx="4" cy="-9" r="1.4" fill="#F5D742"/>
      <path d="M -13 -7 Q -11 -3 -8 -5" fill="none" stroke="#C85A4A" stroke-width="1.8" stroke-linecap="round" opacity="1"/>
      <path d="M 13 -7 Q 11 -3 8 -5" fill="none" stroke="#C85A4A" stroke-width="1.8" stroke-linecap="round" opacity="1"/>
      <path d="M -6 8 Q 0 14 6 8 Q 0 16 -6 8 Z" fill="#B0852A"/>
      <path d="M -4 10 Q 0 13 4 10" fill="none" stroke="#8E5A14" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-16" cy="3" r="5" fill="#C85A4A" opacity="0.4"/>
      <circle cx="16" cy="3" r="5" fill="#C85A4A" opacity="0.4"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 红披风（身后，微飘） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 3;0 0" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 104 90 C 134 94 150 116 144 146 C 138 162 122 166 116 154 C 112 146 112 126 106 104 Z" fill="#C22A1A" opacity="0.92"/>
    <path d="M 100 90 C 118 100 126 124 120 146 C 116 158 106 160 102 148 Z" fill="#8E1A12" opacity="0.75"/>
  </g>

  <!-- 藕丝步云履（云纹靴） -->
  <g>
    <path d="M 74 158 L 92 158 L 94 168 Q 83 172 72 166 Z" fill="url(#armor)"/>
    <path d="M 106 158 L 126 158 L 128 166 Q 117 172 104 168 Z" fill="url(#armor)"/>
    <path d="M 70 168 Q 80 174 94 170 M 106 170 Q 120 174 130 168" fill="none" stroke="#F5D742" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 腿（金甲护腿） -->
  <path d="M 88 128 L 86 158 M 112 128 L 114 158" stroke="#B8861F" stroke-width="9" stroke-linecap="round"/>
  <path d="M 88 132 Q 82 144 82 152 M 112 132 Q 118 144 118 152" stroke="url(#armor)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

  <!-- 尾巴（卷，劲力） -->
  <path d="M 112 126 C 140 132 156 118 154 98 C 153 90 146 88 142 92" fill="none" stroke="url(#fur)" stroke-width="5.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 124 112;6 124 112;0 124 112" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 躯干（正立矫健，锁子黄金甲） -->
  <path d="M 88 92 Q 82 108 88 126 Q 100 134 112 126 Q 118 108 112 92 Q 100 86 88 92 Z" fill="url(#fur)"/>
  <!-- 胸甲 + 甲片 -->
  <path d="M 86 94 Q 100 86 114 94 L 112 118 Q 100 126 88 118 Z" fill="url(#armor)"/>
  <path d="M 96 92 L 94 122 M 104 92 L 104 124" stroke="#8E6E14" stroke-width="1.8" opacity="0.8"/>
  <path d="M 90 100 Q 100 106 110 100" fill="none" stroke="#8E6E14" stroke-width="1.8" opacity="0.8"/>
  <!-- 披膊肩甲 -->
  <circle cx="82" cy="100" r="9" fill="url(#armor)"/>
  <circle cx="118" cy="100" r="9" fill="url(#armor)"/>

  <!-- 手臂（一扛棒，一叉腰） -->
  <path d="M 104 96 C 108 88 112 82 112 76" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="112" cy="72" r="5" fill="#B8861F"/>
  <path d="M 96 98 C 88 102 84 110 84 118" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>

  <!-- 金箍棒（完整版，红金，扛肩） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 108 42;3 108 42;0 108 42" dur="1.2s" repeatCount="indefinite"/>
    <line x1="126" y1="38" x2="78" y2="150" stroke="#C22A1A" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="44" x2="80" y2="144" stroke="#F5D742" stroke-width="1.8" opacity="0.9"/>
    <rect x="125" y="34" width="7" height="6" rx="1.2" fill="#F5D742"/>
    <rect x="74" y="150" width="7" height="6" rx="1.2" fill="#F5D742"/>
  </g>

  <!-- 头（头部模板 scale 1.05，身体正上方） -->
  <use href="#wukong-head" transform="translate(100,70) scale(1.05)"/>

  <!-- 凤翅紫金冠（四阶特有） -->
  <path d="M 82 46 C 70 36 68 26 78 20 L 90 32 L 97 24 L 100 38" fill="none" stroke="#F5D742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 118 46 C 130 36 132 26 122 20 L 110 32 L 103 24 L 100 38" fill="none" stroke="#F5D742" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 80 52 Q 100 44 120 52" fill="none" stroke="#F5D742" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="100" cy="30" r="4" fill="#F5D742">
    <animate attributeName="r" values="4;5;4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 战斗光晕 -->
  <circle cx="100" cy="108" r="62" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.5" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 108;15 100 108;0 100 108" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 火星（飘浮） -->
  <g fill="#F97316">
    <circle cx="58" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="144" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
