<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="土行孙·二阶·偷学土遁·从土里探出半身">
  <defs>
    <!-- 背景：夹龙山间土坡 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B09A6E"/>
      <stop offset="50%" stop-color="#8E7A50"/>
      <stop offset="100%" stop-color="#6E5E3E"/>
    </linearGradient>
    <!-- 泥土青草 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E9862"/>
      <stop offset="100%" stop-color="#5E7A4E"/>
    </linearGradient>
    <!-- 灰布短打 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A907E"/>
      <stop offset="100%" stop-color="#6E6656"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="tu_xingsun-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 胖腮·蒜头鼻 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.3 Q -5 -2.4 -2 -2 M 8 -1.3 Q 5 -2.4 2 -2" stroke="#1E1008" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 远山 -->
  <path d="M 0 130 Q 40 108 90 118 Q 140 126 200 112 L 200 200 L 0 200 Z" fill="#7E6E4E" opacity="0.5"/>

  <!-- 土丘（他钻出的地方） -->
  <path d="M 40 178 Q 60 150 96 156 Q 132 160 150 180 L 200 180 L 200 200 L 0 200 Z" fill="url(#grass)"/>
  <path d="M 52 170 Q 72 152 104 156 Q 132 160 148 178" stroke="#4E6840" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- 溅起的泥土 -->
  <g fill="#8E6A42">
    <circle cx="70" cy="150" r="3.4"/>
    <circle cx="82" cy="158" r="2.4"/>
    <circle cx="120" cy="150" r="3"/>
  </g>

  <!-- 矮小少年（2.5头身，从土里探出半身，得意贼笑） -->
  <!-- 下半身隐于土 -->
  <!-- 身体（灰衣沾泥） -->
  <!-- 沾泥点 -->
  <circle cx="86" cy="128" r="1.6" fill="#8E6A42" opacity="0.7"/>
  <circle cx="96" cy="138" r="1.4" fill="#8E6A42" opacity="0.6"/>
  <circle cx="102" cy="130" r="1.6" fill="#8E6A42" opacity="0.7"/>
  <!-- 腰带 -->
  <path d="M 82 132 L 102 132" stroke="#7E6A42" stroke-width="1.8"/>
  <!-- 镔铁棍（腰间） -->
  <path d="M 82 128 L 78 138" stroke="#5A5E66" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 左臂撑地 -->
  <path d="M 84 122 C 78 126 76 132 78 140" fill="none" stroke="url(#cloth)" stroke-width="4.2" stroke-linecap="round"/>
  <!-- 右臂挠头（得意） -->
  <path d="M 100 122 C 106 118 110 116 112 110" fill="none" stroke="url(#cloth)" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="113" cy="109" r="3" fill="#DCC4A0"/>

  <!-- 头（圆脸沾土，眯眼贼笑） -->
  <!-- 脸上泥点 -->
  <!-- 细眉扬起 -->
  <!-- 眯眼贼笑 -->
  <!-- 蒜头鼻 -->
  <!-- 咧嘴 -->

  <!-- 土中金尘（土遁微光） -->
  <g fill="#E8C07A">
    <circle cx="60" cy="150">
      <animate attributeName="cy" values="150;140;150" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="134" cy="146">
      <animate attributeName="cy" values="146;136;146" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.12;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 头顶泥土滑落（细节） -->
  <g fill="#8E6A42">
      <animate attributeName="cy" values="100;106;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
      <animate attributeName="cy" values="102;108;102" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#tu_xingsun-face" transform="translate(92,112) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 82 108 Q 86 105 92 105 Q 98 105 102 108 Q 98 104 92 104 Q 86 104 82 108 Z" fill="#3A2E24"/>
</svg>
