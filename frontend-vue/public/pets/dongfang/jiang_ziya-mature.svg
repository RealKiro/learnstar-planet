<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·四阶·封神大战·西岐拜相">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241A14"/>
      <stop offset="70%" stop-color="#17100C"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>

    <g id="jiangziya-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉·白须 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 战火雷电 -->
  <path d="M 24 40 L 42 56 L 32 60 L 48 78" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 176 90 L 160 102 L 172 106 L 154 124" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 20 184 Q 32 164 46 178 Q 56 158 70 174 Q 82 154 96 172 Q 108 156 120 174 Q 132 160 144 178 Q 154 162 168 180 Z" fill="#8B1A1A" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 封神榜（身后展开如云） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 30 50 Q 44 42 58 52 Q 52 70 58 86 Q 44 78 30 50 Z" fill="#D8B894" opacity="0.85"/>
    <path d="M 60 44 Q 76 38 90 48 Q 84 70 92 90 Q 74 84 60 44 Z" fill="#E8D8C0" opacity="0.7"/>
    <path d="M 40 56 L 54 56 M 42 64 L 54 64 M 66 52 L 82 52" stroke="#C9B37E" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 玄色披风（身后飘） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 3;0 0" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 104 96 C 132 100 146 120 138 150 C 132 164 118 168 112 158 C 108 150 108 130 102 108 Z" fill="#1A1210" opacity="0.9"/>
  </g>

  <!-- 金甲战袍 -->
  <path d="M 84 92 Q 74 108 80 130 Q 100 142 120 128 Q 126 108 118 92 Q 100 84 84 92 Z" fill="url(#armor)" transform="rotate(-6 100 110)"/>
  <path d="M 94 90 L 92 132 M 106 90 L 106 134" stroke="#8E6E14" stroke-width="1.6" opacity="0.8"/>
  <circle cx="78" cy="104" r="7" fill="#F5D742"/>
  <circle cx="122" cy="104" r="7" fill="#F5D742"/>
  <!-- 腰悬打神鞭 -->
  <line x1="110" y1="132" x2="112" y2="152" stroke="#F5D742" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 手臂（一手持杏黄旗，一手掐诀） -->
  <path d="M 92 100 C 86 108 82 118 84 128" fill="none" stroke="url(#armor)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 110 102 C 122 110 128 122 124 132" fill="none" stroke="url(#armor)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="123" cy="136" r="4" fill="#DCC4A0"/>

  <!-- 杏黄旗（视觉中心） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 128 56;6 128 56;-8 128 56" dur="2s" repeatCount="indefinite"/>
    <line x1="128" y1="34" x2="128" y2="152" stroke="#8E6E3A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 128 36 L 168 48 L 168 64 L 128 54 Z" fill="#F5D742" opacity="0.95"/>
    <path d="M 130 42 L 162 52" stroke="#C9A227" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 头（金甲战冠 + 白发） -->
  <use href="#jiangziya-face" transform="translate(100,84) scale(1)"/>
  <!-- 金冠束发 -->
  <path d="M 82 70 Q 100 62 118 70 L 118 60 Q 100 52 82 60 Z" fill="#F5D742" opacity="0.9"/>

  <!-- 淬炼光环 -->
  <circle cx="100" cy="110" r="58" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.5" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 110;20 100 110;0 100 110" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- 火星 -->
  <g fill="#F97316">
    <circle cx="56" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
