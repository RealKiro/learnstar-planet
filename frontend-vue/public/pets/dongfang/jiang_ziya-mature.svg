<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·四阶·淬炼·杏黄旗展">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241A14"/>
      <stop offset="70%" stop-color="#17100C"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#C8B890"/>
      <stop offset="60%" stop-color="#B8A878"/>
      <stop offset="100%" stop-color="#8E7E58"/>
    </radialGradient>

    <g id="jiangziya-head">
      <ellipse cx="0" cy="0" rx="17" ry="16" fill="#F5EEDC" stroke="#D8C0A0" stroke-width="1"/>
      <path d="M -11 -6 Q -6 -11 -1 -8 M 11 -6 Q 6 -11 1 -8" fill="none" stroke="#6E5A3A" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -8 -4 Q -5 -2 -2 -4 M 8 -4 Q 5 -2 2 -4" fill="none" stroke="#3A2A1A" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C0A884" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M -4 7 Q 0 9 4 7" fill="none" stroke="#A08A68" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -14 -8 Q -10 -18 0 -20 Q 10 -18 14 -8 Q 8 -14 0 -15 Q -8 -14 -14 -8 Z" fill="#F5F0E8" opacity="0.95"/>
      <circle cx="0" cy="-22" r="5" fill="#F5F0E8" opacity="0.9"/>
      <path d="M -7 10 Q -4 20 0 24 Q 4 20 7 10 Q 3 14 0 15 Q -3 14 -7 10 Z" fill="#F5F0E8" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 天劫雷电（闪动） -->
  <path d="M 28 44 L 46 60 L 36 64 L 52 82" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 176 92 L 160 104 L 172 108 L 154 126" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- 封神榜（背后展开） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <rect x="36" y="44" width="22" height="120" rx="3" fill="#D8B894" opacity="0.7"/>
    <path d="M 40 50 L 54 50 M 40 60 L 54 60 M 40 70 L 52 70 M 40 140 L 54 140" stroke="#C9B37E" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- 天火 -->
  <path d="M 20 186 Q 32 166 46 180 Q 56 160 70 176 Q 82 156 96 174 Q 108 158 120 176 Q 132 162 144 180 Q 154 164 168 182 Z" fill="#8B1A1A" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 道袍身体（动势） -->
  <path d="M 84 92 Q 74 110 80 132 Q 100 144 120 130 Q 128 108 118 92 Q 100 84 84 92 Z" fill="url(#robe)" transform="rotate(-6 100 110)"/>
  <path d="M 100 90 L 100 132" stroke="#8E7E58" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- 手臂（一挥旗，一持榜） -->
  <path d="M 92 100 C 86 108 82 118 84 128" fill="none" stroke="url(#robe)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 110 102 C 122 110 128 122 124 132" fill="none" stroke="url(#robe)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="123" cy="136" r="4" fill="#D8C0A0"/>

  <!-- 杏黄旗（挥动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 128 60;6 128 60;-8 128 60" dur="2s" repeatCount="indefinite"/>
    <line x1="128" y1="38" x2="128" y2="152" stroke="#8E6E3A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 128 40 L 164 52 L 164 68 L 128 58 Z" fill="#F5D742" opacity="0.95"/>
    <path d="M 130 46 L 158 56" stroke="#C9A227" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 头（头部模板 scale 1.0） -->
  <use href="#jiangziya-head" transform="translate(100,84) scale(1)"/>

  <!-- 道冠峨立 -->
  <path d="M 82 70 Q 100 60 118 70 L 118 58 Q 100 48 82 58 Z" fill="#4A5A6A" opacity="0.9"/>
  <path d="M 90 60 L 90 48 M 98 56 L 98 44 M 106 56 L 106 44 M 110 60 L 110 50" stroke="#C9B37E" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>

  <!-- 淬炼光环 -->
  <circle cx="100" cy="110" r="58" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.5" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" values="0 100 110;20 100 110;0 100 110" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- 火星 -->
  <g fill="#F97316">
    <circle cx="56" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
