<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="曹国舅·四阶·清修苦行·晨击玉磬磬音涤尘">
  <defs>
    <!-- 背景：山中草庐晨曦 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9088"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 晨曦金 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 磬光玉白 -->
    <radialGradient id="qing" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#E8F4E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8F4E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白衣鹤氅 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#D0CCC4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：清俊面容·眉目淡泊·眼含道意·嘴角宁静 -->
    <g id="caoguojiu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 道髻 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#1E1814"/>
      <path d="M -1 -11 L 2 -11 L 3 -14 L 0 -14 Z" fill="#8E7A5E"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8.5 0 -8.5 Q 5 -8.5 9 -3.5 Q 5 -7.5 0 -7.5 Q -5 -7.5 -9 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目淡泊 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 宁静眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.4" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 宁静 -->
      <path d="M -3.2 6 Q 0 7.2 3.2 6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="72" r="78" fill="url(#glow)"/>

  <!-- 远山松影 -->
  <path d="M 0 134 Q 40 116 90 126 Q 140 134 200 122 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>
  <!-- 古松（右） -->
  <path d="M 168 108 Q 164 90 168 72" stroke="#5E6E5E" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="168" cy="68" r="10" fill="#7EA878"/>
  <circle cx="160" cy="72" r="5.5" fill="#6E9E68"/>
  <circle cx="176" cy="70" r="5.5" fill="#6E9E68"/>

  <!-- 草庐（左） -->
  <path d="M 20 110 L 20 96 L 52 96 L 52 110 Z" fill="#8E7252"/>
  <path d="M 16 96 L 56 96 L 46 88 L 26 88 Z" fill="#7E6842" stroke="#6E5238" stroke-width="1"/>

  <!-- 石台 -->
  <path d="M 60 160 L 140 152 L 148 172 L 52 172 Z" fill="#6E7E74"/>
  <path d="M 60 160 L 140 152" stroke="#7E8E84" stroke-width="1.6" opacity="0.6"/>

  <!-- 白衣道者（晨击玉磬） -->
  <!-- 腿 -->
  <path d="M 90 136 L 86 158 L 92 158 L 96 138 Z" fill="#C8C4BC"/>
  <path d="M 106 136 L 114 160 L 108 160 L 102 138 Z" fill="#C8C4BC"/>
  <!-- 白衣鹤氅 -->
  <path d="M 88 98 Q 84 114 90 136 Q 100 142 108 136 Q 114 114 110 98 Q 100 92 88 98 Z" fill="url(#robe)" stroke="#C0BCB4" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 118 L 110 118" stroke="#B8B0A8" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#caoguojiu-face" transform="translate(99,90) scale(1)"/>

  <!-- 左臂托玉磬 -->
  <path d="M 90 104 C 84 108 80 112 78 118" fill="none" stroke="#E8E4DC" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="77" cy="120" r="3" fill="#D8C0A0"/>

  <!-- 右臂执磬槌（击磬） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 108 102;5 108 102;-6 108 102" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 106 102 C 112 98 116 94 118 88" fill="none" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round"/>
    <circle cx="119" cy="86" r="3" fill="#D8C0A0"/>
    <!-- 磬槌 -->
    <line x1="119" y1="88" x2="116" y2="78" stroke="#8E7A5E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="116" cy="76" r="2.6" fill="#C8B498"/>
  </g>

  <!-- 玉磬（悬于左臂下） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 76 132;-6 76 132;0 76 132" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 70 128 Q 76 124 82 128 Q 84 134 78 137 Q 72 137 70 132 Z" fill="#E8F4E8" stroke="#B8D8C8" stroke-width="1"/>
    <!-- 磬光 -->
    <circle cx="76" cy="131" r="12" fill="url(#qing)">
      <animate attributeName="r" values="12;16;12" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 磬音波 -->
    <g stroke="#E8F4E8" stroke-width="1.4" opacity="0.6" fill="none">
      <circle cx="76" cy="131" r="20">
        <animate attributeName="r" values="20;30;20" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="76" cy="131" r="28">
        <animate attributeName="r" values="28;38;28" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.08;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 磬音涤尘（山间清音波） -->
  <g stroke="#E8F4E8" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
    <path d="M 100 60 Q 90 52 96 44">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 84 Q 148 78 146 70">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 晨曦金尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="86">
      <animate attributeName="cy" values="86;78;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
