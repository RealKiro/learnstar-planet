<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="申公豹·四阶·助纣为虐·十绝阵煞气腾腾">
  <defs>
    <!-- 背景：战云密布 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3448"/>
      <stop offset="52%" stop-color="#382434"/>
      <stop offset="100%" stop-color="#22141E"/>
    </linearGradient>
    <!-- 阵煞紫黑 -->
    <radialGradient id="aura" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#8E4A6E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8E4A6E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A2E42"/>
      <stop offset="100%" stop-color="#1E1628"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>

    <!-- 头部模板：长脸·剑眉倒竖·目含戾气·薄唇冷峭 -->
    <g id="shenface">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8AC90" stroke-width="0.9"/>
      <!-- 束发 -->
      <path d="M -5 -10 Q 0 -13 5 -10 Q 3 -14 0 -14 Q -3 -14 -5 -10 Z" fill="#1E1814"/>
      <!-- 额发 -->
      <path d="M -10 -4 Q -6 -9 0 -9 Q 6 -9 10 -4 Q 6 -8 0 -8 Q -6 -8 -10 -4 Z" fill="#1E1814"/>
      <!-- 剑眉倒竖 -->
      <path d="M -9 -3 Q -5.5 -4.6 -2 -3.2 M 9 -3 Q 5.5 -4.6 2 -3.2" stroke="#1E1008" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- 目含戾气 -->
      <path d="M -8 0.5 Q -5 -1.8 -2 -0.6 L -2 0.8 Q -5 0.2 -8 2 Z" fill="#1E1008"/>
      <path d="M 8 0.5 Q 5 -1.8 2 -0.6 L 2 0.8 Q 5 0.2 8 2 Z" fill="#1E1008"/>
      <circle cx="-5" cy="0" r="1.6" fill="#A8282E"/>
      <circle cx="5" cy="0" r="1.6" fill="#A8282E"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.5" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 薄唇冷峭 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#6E4A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 战云绛 -->
  <radialGradient id="fire" cx="76%" cy="22%" r="42%">
    <stop offset="0%" stop-color="#B8432E" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#B8432E" stop-opacity="0"/>
  </radialGradient>
  <circle cx="152" cy="44" r="56" fill="url(#fire)"/>
  <circle cx="100" cy="150" r="70" fill="url(#aura)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 战旗 -->
  <g opacity="0.7">
    <path d="M 20 26 L 20 90" stroke="#1E1418" stroke-width="2"/>
    <path d="M 20 26 L 48 34 L 20 44 Z" fill="#8E2E22">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 十绝阵煞气（脚下） -->
  <path d="M 0 162 Q 30 150 60 160 Q 90 170 120 158 Q 160 146 200 158 L 200 200 L 0 200 Z" fill="#2E1E34"/>
  <path d="M 20 166 L 40 160 M 60 168 L 80 160 M 100 170 L 120 160 M 140 168 L 160 158" stroke="#6E4A7E" stroke-width="1.4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 煞气升腾 -->
  <g stroke="#8E4A6E" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M 60 150 Q 52 142 56 132">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 146 Q 148 138 144 128">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 截教众仙云集（背景） -->
  <g opacity="0.35">
    <path d="M 30 120 Q 32 106 38 102 Q 44 104 44 120 Z" fill="#3A2E42"/>
    <path d="M 52 124 Q 54 110 60 106 Q 66 108 66 124 Z" fill="#462E52"/>
    <path d="M 148 118 Q 150 104 156 100 Q 162 102 162 118 Z" fill="#3A2E42"/>
    <path d="M 168 122 Q 170 108 176 104 Q 182 106 182 122 Z" fill="#462E52"/>
  </g>

  <!-- 黑袍道人（负手立于云端） -->
  <!-- 腿 -->
  <path d="M 84 136 L 80 160 L 86 160 L 90 138 Z" fill="#1E1628"/>
  <path d="M 108 136 L 114 162 L 108 162 L 104 138 Z" fill="#1E1628"/>
  <!-- 黑袍下摆（猎猎） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 96 128;3 96 128;-4 96 128" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 84 126 Q 96 138 110 132 Q 114 126 110 118 Q 104 128 96 124 Q 88 128 84 126 Z" fill="url(#robe)"/>
  </g>
  <!-- 身体 -->
  <path d="M 86 92 Q 82 108 88 126 Q 98 132 108 126 Q 114 108 110 92 Q 98 86 86 92 Z" fill="url(#robe)" stroke="#100A18" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 86 112 L 110 112" stroke="#6E4A7E" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#shenface" transform="translate(98,84) scale(1)"/>

  <!-- 双剑在手（腰间两侧斜出） -->
  <path d="M 88 102 L 78 120 M 108 102 L 118 120" stroke="#C8CCD4" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>

  <!-- 左臂负手 -->
  <path d="M 88 96 C 80 102 78 110 80 118" fill="none" stroke="#3A2E42" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 右臂负手 -->
  <path d="M 108 96 C 116 102 118 110 116 118" fill="none" stroke="#3A2E42" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 阵前煞气（身周暗红光） -->
  <circle cx="98" cy="104" r="40" fill="#8E4A6E" opacity="0.16">
    <animate attributeName="opacity" values="0.16;0.09;0.16" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 妖风煞尘 -->
  <g fill="#8E4A6E">
    <circle cx="44" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="72">
      <animate attributeName="cy" values="72;62;72" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
