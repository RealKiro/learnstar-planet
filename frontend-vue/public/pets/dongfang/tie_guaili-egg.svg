<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="铁拐李·一阶·隐士李玄·华岳山中静修">
  <defs>
    <!-- 背景：华岳山间草庐 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9086"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 松风云白 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青布道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8E7E"/>
      <stop offset="100%" stop-color="#3E6E5E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>

  <!-- 远山云海 -->
  <path d="M 0 130 Q 40 108 90 118 Q 140 126 200 112 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>
  <!-- 仙云 -->
  <g opacity="0.6">
    <path d="M 0 96 Q 28 86 52 94 Q 66 102 54 110 Q 34 118 10 108 Q 0 102 0 96 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 草庐（右） -->
  <path d="M 148 92 L 148 76 L 180 76 L 180 92 Z" fill="#8E7252"/>
  <path d="M 144 76 L 184 76 L 174 66 L 154 66 Z" fill="#7E6842" stroke="#6E5238" stroke-width="1"/>
  <path d="M 160 76 L 160 92 M 168 76 L 168 92" stroke="#6E5238" stroke-width="1.4" opacity="0.6"/>

  <!-- 松（左） -->
  <path d="M 30 112 Q 26 94 30 76" stroke="#4E5E4E" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 30 90 Q 16 84 8 88 M 30 82 Q 44 76 52 80 M 30 98 Q 42 94 48 100" stroke="#4E5E4E" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- 石台（静坐处） -->
  <path d="M 60 160 L 130 152 L 138 172 L 52 172 Z" fill="#6E7E74"/>
  <path d="M 60 160 L 130 152" stroke="#7E8E84" stroke-width="1.6" opacity="0.6"/>

  <!-- 青袍隐士（7头身，闭目吐纳） -->
  <!-- 腿（盘坐） -->
  <path d="M 88 142 Q 94 150 106 146 Q 110 142 108 136 Q 100 146 92 140 Z" fill="#3E6E5E"/>
  <!-- 道袍 -->
  <path d="M 88 102 Q 84 120 90 140 Q 100 146 108 140 Q 114 120 110 102 Q 100 96 88 102 Z" fill="url(#robe)" stroke="#2E5E4E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 118 L 110 118" stroke="#8E9A6E" stroke-width="1.6"/>
  <!-- 领口 -->
  <path d="M 94 102 Q 99 106 104 102" stroke="#2E5E4E" stroke-width="1.4" fill="none"/>

  <!-- 头（长脸清癯，束发，闭目） -->
  <circle cx="99" cy="94" r="10.5" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
  <!-- 束发道髻 -->
  <path d="M 95 85 Q 99 82 103 85 Q 101 80 99 80 Q 97 80 95 85 Z" fill="#1E1814"/>
  <!-- 额发 -->
  <path d="M 89 92 Q 93 87 99 87 Q 105 87 109 92 Q 105 88 99 88 Q 93 88 89 92 Z" fill="#1E1814"/>
  <!-- 眉目淡泊 -->
  <path d="M 90 92 Q 94 90.5 97 91 M 101 91 Q 104 90.5 108 92" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- 闭目 -->
  <path d="M 92 95 Q 95 96 98 95 M 102 95 Q 105 96 108 95" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <!-- 鼻梁挺 -->
  <path d="M 99 97 L 99 99.5" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 平和 -->
  <path d="M 94 103.5 Q 99 105 104 103.5" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 双手结印于膝 -->
  <circle cx="94" cy="130" r="3.2" fill="#D8C0A0"/>
  <circle cx="106" cy="130" r="3.2" fill="#D8C0A0"/>

  <!-- 吐纳之气 -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.5" fill="none" stroke-linecap="round">
    <circle cx="99" cy="122" r="8">
      <animate attributeName="r" values="8;12;8" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 松风金尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
