<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="曹国舅·六阶·磬音清心·磬音化清光涤尽尘愁">
  <defs>
    <!-- 背景：云海霞光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B8A8"/>
      <stop offset="52%" stop-color="#C89078"/>
      <stop offset="100%" stop-color="#9E6E5E"/>
    </linearGradient>
    <!-- 磬光玉白 -->
    <radialGradient id="qing" cx="50%" cy="44%" r="54%">
      <stop offset="0%" stop-color="#E8F4E8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F4E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 霞光金 -->
    <radialGradient id="aura" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 白衣鹤氅 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#D0CCC4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：清俊面容·眉目慈悲·眼含温润 -->
    <g id="caoguojiu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 莲花冠 -->
      <path d="M -6 -8 Q 0 -11 6 -8 Q 4 -12 0 -12 Q -4 -12 -6 -8 Z" fill="#E8D8A8" stroke="#C8B068" stroke-width="0.7"/>
      <circle cx="0" cy="-11" r="2.6" fill="#F0C8D8"/>
      <path d="M -2.4 -12 Q 0 -13.6 2.4 -12 Q 0 -11 0 -11 Z" fill="#F0C8D8"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8.5 0 -8.5 Q 5 -8.5 9 -3.5 Q 5 -7.5 0 -7.5 Q -5 -7.5 -9 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目慈悲 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 温润眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.6" cy="0.4" r="0.6" fill="#E8F4E8"/>
      <circle cx="4.6" cy="0.4" r="0.6" fill="#E8F4E8"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.4" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 温润 -->
      <path d="M -3.2 6 Q 0 7.4 3.2 6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 霞光 -->
  <circle cx="152" cy="52" r="54" fill="url(#aura)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="13" fill="#FFF3C4" opacity="0.9">
    <animate attributeName="r" values="13;15;13" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 磬光 -->
  <circle cx="100" cy="92" r="82" fill="url(#qing)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g opacity="0.7">
    <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#E8E0D0">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 172 Q 60 164 120 170 Q 170 176 200 168 L 200 200 L 0 200 Z" fill="#D8CCB8" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 1;0 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 下方人间（尘世愁云尽散，沐磬光） -->
  <path d="M 0 162 Q 40 154 80 160 Q 120 166 160 158 Q 180 154 200 160 L 200 200 L 0 200 Z" fill="#7E9E6E"/>
  <!-- 城池 -->
  <g opacity="0.9">
    <path d="M 20 154 L 20 142 L 40 142 L 40 154 L 48 154 L 48 136 L 12 136 L 12 154 Z" fill="#A87A56"/>
    <path d="M 30 142 L 30 134 L 29 142 Z" fill="#A87A56"/>
    <path d="M 150 156 L 150 146 L 166 146 L 166 156 L 172 156 L 172 140 L 144 140 L 144 156 Z" fill="#B08A62"/>
    <path d="M 158 146 L 158 138 L 157 146 Z" fill="#B08A62"/>
  </g>
  <!-- 愁云尽散（上飘，被磬光涤净） -->
  <g stroke="#C8C0B0" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M 100 150 Q 96 144 100 138 Q 104 132 100 126">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 156 Q 144 150 140 144 Q 136 138 140 132">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 白衣儒仙（击磬云端） -->
  <!-- 腿 -->
  <path d="M 90 126 L 86 148 L 92 148 L 96 128 Z" fill="#C8C4BC"/>
  <path d="M 106 126 L 114 152 L 108 152 L 102 128 Z" fill="#C8C4BC"/>
  <!-- 白衣鹤氅 -->
  <path d="M 88 98 Q 84 114 90 132 Q 100 138 108 132 Q 114 114 110 98 Q 100 92 88 98 Z" fill="url(#robe)" stroke="#C0BCB4" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 114 L 110 114" stroke="#B8B0A8" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#caoguojiu-face" transform="translate(99,90) scale(1)"/>

  <!-- 左臂托玉磬 -->
  <path d="M 90 104 C 84 108 80 112 78 118" fill="none" stroke="#E8E4DC" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="77" cy="120" r="3" fill="#D8C0A0"/>

  <!-- 右臂执磬槌（一击，磬音化清光） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 108 102;5 108 102;-6 108 102" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 106 102 C 112 98 116 94 118 88" fill="none" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round"/>
    <circle cx="119" cy="86" r="3" fill="#D8C0A0"/>
    <line x1="119" y1="88" x2="116" y2="78" stroke="#8E7A5E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="116" cy="76" r="2.6" fill="#C8B498"/>
  </g>

  <!-- 玉磬（化清光） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 76 132;-6 76 132;0 76 132" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 70 128 Q 76 124 82 128 Q 84 134 78 137 Q 72 137 70 132 Z" fill="#E8F4E8" stroke="#B8D8C8" stroke-width="1"/>
    <circle cx="76" cy="131" r="14" fill="url(#qing)">
      <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 磬音清波 -->
    <g stroke="#E8F4E8" stroke-width="1.4" opacity="0.6" fill="none">
      <circle cx="76" cy="131" r="22">
        <animate attributeName="r" values="22;32;22" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 磬音化清光（洒向人间，涤尽尘愁） -->
  <g stroke="#E8F4E8" stroke-width="1.8" opacity="0.55" stroke-linecap="round">
    <path d="M 76 140 Q 80 152 88 164">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 150 Q 100 160 98 172">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 清光粒子 -->
  <g fill="#E8F4E8">
    <circle cx="60" cy="148">
      <animate attributeName="cy" values="148;158;148" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="146">
      <animate attributeName="cy" values="146;156;146" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="158">
      <animate attributeName="cy" values="158;168;158" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 磬音雅尘 -->
  <g fill="#E8F4E8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="60">
      <animate attributeName="cy" values="60;50;60" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
