<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨戬·一阶·桃山遗孤·望山思母">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A7A68"/>
      <stop offset="100%" stop-color="#5B5248"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC0"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 杨戬基础脸（清秀眉目 + 额间天眼；发型每阶单独） -->
    <g id="yangjian-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 天眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 桃山（远景，如囚牢） -->
  <path d="M 60 60 Q 100 20 140 60 L 160 200 L 40 200 Z" fill="#4A4438" opacity="0.8"/>
  <path d="M 80 70 Q 100 50 120 70 L 130 200 L 70 200 Z" fill="#3E3A30" opacity="0.6"/>
  <!-- 山顶封印微光 -->
  <circle cx="100" cy="44" r="10" fill="#C9B37E" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 96 40 L 104 40 M 100 36 L 100 44" stroke="#C9B37E" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 旷野地面 -->
  <path d="M 0 160 Q 60 154 120 158 Q 170 162 200 156 L 200 200 L 0 200 Z" fill="#5B5248" opacity="0.7"/>

  <!-- 角色：少年杨戬立于山脚望山 -->
  <!-- 草鞋 -->
  <ellipse cx="70" cy="168" rx="8" ry="5" fill="#6E5A48"/>
  <ellipse cx="88" cy="168" rx="8" ry="5" fill="#6E5A48"/>
  <!-- 粗布短褐身体 -->
  <path d="M 76 96 Q 70 110 74 128 Q 84 138 90 128 Q 94 112 92 100 Z" fill="#8E7E5C"/>
  <!-- 黑发束髻（少年） -->
  <path d="M 76 76 Q 86 68 96 74 L 94 66 Q 84 60 78 66 Z" fill="#2A1A0A"/>
  <!-- 头（基础脸，仰头望山） -->
  <use href="#yangjian-face" transform="translate(84,86) scale(0.95) rotate(-12)"/>

  <!-- 天眼微光（呼吸） -->
  <circle cx="86" cy="66" r="9" fill="url(#eye)">
    <animate attributeName="r" values="9;13;9" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 手臂（握拳/握拳仰望） -->
  <path d="M 82 102 C 76 110 72 118 74 126" fill="none" stroke="#8E7E5C" stroke-width="7" stroke-linecap="round"/>
  <circle cx="73" cy="130" r="3.5" fill="#DCC4A0"/>

  <!-- 晨光微粒 -->
  <g fill="#C9B37E">
    <circle cx="52" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
