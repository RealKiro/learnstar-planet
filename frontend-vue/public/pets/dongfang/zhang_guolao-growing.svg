<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="张果老·三阶·倒骑白驴·鱼鼓轻敲看云闲">
  <defs>
    <!-- 背景：云山古道 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9088"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 云海白 -->
    <radialGradient id="aura" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E4DC"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
    <!-- 白驴 -->
    <linearGradient id="donkey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F0EC"/>
      <stop offset="100%" stop-color="#C8C8C4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：圆脸慈祥·白眉长垂·眼含笑·嘴角悠然（脸中心 0,0） -->
    <g id="zhangguolao-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉长垂 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="92" r="82" fill="url(#aura)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g opacity="0.65">
    <path d="M 0 130 Q 50 122 100 128 Q 150 134 200 126 L 200 200 L 0 200 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 前方道路蜿蜒（左） -->
  <path d="M 0 150 Q 30 144 50 150 Q 70 156 90 148" fill="none" stroke="#7E9088" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

  <!-- 白驴（倒行，驴头朝右/画面朝后，实际倒骑=道翁面向左） -->
  <!-- 驴身 -->
  <path d="M 88 118 Q 80 108 88 100 Q 100 94 112 98 Q 128 102 132 116 Q 134 128 126 134 Q 114 140 100 138 Q 88 136 88 118 Z" fill="url(#donkey)" stroke="#A8A8A4" stroke-width="1"/>
  <!-- 驴腿 -->
  <path d="M 94 134 L 90 152 L 96 152 L 100 136 Z" fill="#C8C8C4"/>
  <path d="M 122 136 L 128 154 L 123 154 L 118 138 Z" fill="#C8C8C4"/>
  <!-- 驴头（向右，悠然吃/看云） -->
  <path d="M 130 116 Q 140 110 144 104 Q 148 98 142 96 Q 134 96 130 102 Q 128 110 130 116 Z" fill="#D8D8D4" stroke="#A8A8A4" stroke-width="1"/>
  <!-- 驴耳 -->
  <path d="M 138 98 L 136 88 L 142 94 Z" fill="#C8C8C4"/>
  <path d="M 142 98 L 142 88 L 146 94 Z" fill="#C8C8C4"/>
  <!-- 驴眼（悠然） -->
  <path d="M 139 102 Q 141 101.5 143 102" stroke="#2E2E2A" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- 驴鬃 -->
  <path d="M 128 102 Q 126 98 128 94" stroke="#A8A8A4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- 驴尾 -->
  <path d="M 90 112 Q 82 108 80 100" stroke="#A8A8A4" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 90 112;8 90 112;0 90 112" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 驴鞍 -->
  <path d="M 92 108 Q 104 104 116 108 L 114 118 L 94 118 Z" fill="#8E6A42" stroke="#6E5238" stroke-width="1"/>

  <!-- 道翁（倒骑，面向左，鱼鼓轻敲） -->
  <!-- 腿（跨驴背，面向后） -->
  <path d="M 92 112 L 88 124 M 112 112 L 116 124" stroke="#C8C4BC" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 道袍（坐驴背，面向左） -->
  <path d="M 86 96 Q 82 106 86 116 Q 94 120 102 116 Q 106 106 104 96 Q 94 90 86 96 Z" fill="url(#robe)" stroke="#A8A8A4" stroke-width="1"/>

  <!-- 头（面部模板，面向左） -->
  <use href="#zhangguolao-face" transform="translate(95,86) scale(1)"/>

  <!-- 左臂持鱼鼓（轻敲） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 88 96;4 88 96;-5 88 96" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 90 96 C 84 100 80 104 78 110" fill="none" stroke="#C8C4BC" stroke-width="4" stroke-linecap="round"/>
    <!-- 鱼鼓 -->
    <ellipse cx="76" cy="116" rx="5" ry="7" fill="#A86A3E" stroke="#8E5A2E" stroke-width="0.8"/>
    <path d="M 76 109 L 76 123" stroke="#8E5A2E" stroke-width="1.2"/>
  </g>

  <!-- 右臂负背看云 -->
  <path d="M 102 96 C 108 100 112 104 114 110" fill="none" stroke="#C8C4BC" stroke-width="4" stroke-linecap="round"/>

  <!-- 鱼鼓音浪（定风波） -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M 70 112 Q 62 108 58 102">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 72 118 Q 62 114 56 108">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 云海白尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
