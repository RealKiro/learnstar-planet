<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="吕洞宾·四阶·仗剑行侠·御剑飞行剑斩妖雾">
  <defs>
    <!-- 背景：江湖山水间 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AB8C8"/>
      <stop offset="52%" stop-color="#7EA0B4"/>
      <stop offset="100%" stop-color="#5E8298"/>
    </linearGradient>
    <!-- 剑光银 -->
    <radialGradient id="sword" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E0E8"/>
    </linearGradient>
    <!-- 妖雾 -->
    <radialGradient id="evil" cx="70%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#6E4A6E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6E4A6E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>

    <!-- 头部模板：俊逸面容·眉目含笑·温润带剑意 -->
    <g id="lvdongbin-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8AC90" stroke-width="0.9"/>
      <!-- 逍遥巾束发 -->
      <path d="M -6 -8 Q 0 -11 6 -8 Q 4 -12 0 -12 Q -4 -12 -6 -8 Z" fill="#1E1814"/>
      <path d="M -8 -5 L -12 -2 M 8 -5 L 12 -2" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <!-- 额发 -->
      <path d="M -9.5 -3.5 Q -5.5 -8.5 0 -8.5 Q 5.5 -8.5 9.5 -3.5 Q 5.5 -7.5 0 -7.5 Q -5.5 -7.5 -9.5 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目含笑 -->
      <path d="M -8.5 -1.5 Q -5.5 -3.4 -2 -2.6 M 8.5 -1.5 Q 5.5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 温润眼神 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.3" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.3" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.6" cy="0.4" r="0.7" fill="#FFF7E0"/>
      <circle cx="4.6" cy="0.4" r="0.7" fill="#FFF7E0"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.4" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 含笑 -->
      <path d="M -3 5.6 Q 0 7.4 3 5.6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 大好河山（下方） -->
  <path d="M 0 130 Q 40 114 90 124 Q 140 132 200 120 L 200 200 L 0 200 Z" fill="#6E9E7E" opacity="0.8"/>
  <path d="M 0 150 Q 60 138 120 146 Q 170 152 200 144 L 200 200 L 0 200 Z" fill="#5E8E6E"/>

  <!-- 妖雾（右下，被斩开） -->
  <circle cx="148" cy="150" r="60" fill="url(#evil)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0.6">
    <path d="M 120 140 Q 110 146 114 156 Q 122 162 130 154 Q 134 146 124 142 Z" fill="#4E2E4E">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 158 168 Q 166 172 170 180 Q 162 180 156 174 Z" fill="#4E2E4E">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 妖雾被斩开的光痕 -->
  <path d="M 120 136 Q 140 128 156 122" fill="none" stroke="#FFF7E0" stroke-width="2" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 白衣剑仙（御剑飞行，身姿飘逸） -->
  <!-- 御剑（脚下） -->
  <path d="M 60 118 L 132 104" stroke="#E8F0F8" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M 132 104 L 140 103" stroke="#E8F0F8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 60 118 L 56 118" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round"/>
  <!-- 剑光托足 -->
  <circle cx="96" cy="108" r="18" fill="url(#sword)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 白衣身（侧飞） -->
  <path d="M 92 76 Q 88 88 92 102 Q 98 108 104 102 Q 108 88 106 76 Q 98 72 92 76 Z" fill="url(#robe)" stroke="#C8D0D8" stroke-width="1"/>
  <!-- 衣袂飘飘 -->
  <path d="M 92 100 Q 84 108 82 118 Q 90 114 94 106" fill="url(#robe)" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 92 100;-6 92 100;0 92 100" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M 106 96 Q 114 102 116 112 Q 108 110 104 102" fill="url(#robe)" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 106 96;6 106 96;0 106 96" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 腰带 -->
  <path d="M 92 94 L 104 94" stroke="#C8A84E" stroke-width="1.4"/>
  <!-- 腰悬酒葫芦 -->
  <path d="M 92 92 Q 86 98 90 106 Q 94 110 98 106 Q 100 98 94 92 Z" fill="#A86A3E" stroke="#8E5A2E" stroke-width="0.8"/>

  <!-- 头（面部模板） -->
  <use href="#lvdongbin-face" transform="translate(99,68) scale(1)"/>

  <!-- 左臂背剑 -->
  <path d="M 94 80 C 86 84 82 90 82 98" fill="none" stroke="#D8E0E8" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 右手剑指（御剑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 104 80 C 112 82 118 84 122 80" fill="none" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round"/>
    <!-- 剑指 -->
    <path d="M 124 79 L 128 74" stroke="#D8C0A4" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- 剑气纵横 -->
  <g stroke="#FFF7E0" stroke-width="1.6" opacity="0.55" stroke-linecap="round">
    <path d="M 128 74 Q 142 66 150 58">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 76 Q 144 72 154 68">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 剑气星尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="44">
      <animate attributeName="cy" values="44;34;44" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
