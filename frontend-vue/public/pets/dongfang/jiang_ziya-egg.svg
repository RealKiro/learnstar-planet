<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·一阶·朝歌市井·卖面演卦">
  <defs>
    <!-- 背景：灰黄市井晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B890"/>
      <stop offset="100%" stop-color="#9A8A68"/>
    </linearGradient>
    <!-- 晨光（左侧斜照） -->
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC0"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#B8A888"/>
      <stop offset="100%" stop-color="#8E7E60"/>
    </radialGradient>

    <!-- 姜子牙基础脸（慈眉善目 + 白须；发型每阶单独） -->
    <g id="jiangziya-face">
      <ellipse cx="0" cy="0" rx="16" ry="15" fill="url(#skin)" stroke="#C0A888" stroke-width="1"/>
      <path d="M -9 -6 Q -5 -9 -1 -7 M 9 -6 Q 5 -9 1 -7" fill="none" stroke="#8E7A5A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -7 -4 Q -4 -2 -1 -4 M 7 -4 Q 4 -2 1 -4" fill="none" stroke="#5A4A3A" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M -3 6 Q 0 8 3 6" fill="none" stroke="#A08A68" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M -6 9 Q -3 17 0 20 Q 3 17 6 9 Q 3 12 0 13 Q -3 12 -6 9 Z" fill="#E8E0D0" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#sun)"/>

  <!-- 破旧城墙（背景） -->
  <path d="M 120 60 L 200 60 L 200 200 L 120 200 Z" fill="#A89068" opacity="0.55"/>
  <path d="M 130 70 L 130 190 M 150 60 L 150 200 M 170 60 L 170 200 M 190 60 L 190 200" stroke="#8E7E5A" stroke-width="1.4" opacity="0.5"/>
  <path d="M 120 80 L 200 80" stroke="#8E7E5A" stroke-width="2" opacity="0.5"/>

  <!-- 市井街巷（远处虚影） -->
  <path d="M 0 170 L 200 170" stroke="#8E7E5A" stroke-width="2" opacity="0.4"/>
  <ellipse cx="40" cy="168" rx="10" ry="14" fill="#A89878" opacity="0.35"/>
  <ellipse cx="56" cy="172" rx="8" ry="6" fill="#A89878" opacity="0.3"/>

  <!-- 角色：蹲坐城墙根演卦 -->
  <!-- 草鞋 -->
  <ellipse cx="84" cy="170" rx="9" ry="5" fill="#6E5E48"/>
  <ellipse cx="112" cy="170" rx="9" ry="5" fill="#6E5E48"/>
  <!-- 蹲坐身体（粗布褐衣 + 补丁） -->
  <path d="M 88 96 Q 80 110 84 130 Q 100 140 114 128 Q 120 110 112 96 Q 100 90 88 96 Z" fill="url(#robe)"/>
  <rect x="88" y="112" width="8" height="9" rx="2" fill="#8E7E5C" opacity="0.8"/>
  <!-- 木簪发髻（黑发 + 鬓角白发） -->
  <path d="M 84 76 Q 100 66 114 74 L 112 66 Q 100 58 86 66 Z" fill="#4A3A2A"/>
  <path d="M 100 62 Q 102 56 106 54" stroke="#E0D8C8" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <line x1="108" y1="62" x2="118" y2="72" stroke="#8E6E3A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 头（基础脸） -->
  <use href="#jiangziya-face" transform="translate(100,88) scale(0.95)"/>

  <!-- 手臂（以指画地演卦） -->
  <path d="M 100 102 C 96 110 94 118 96 124" fill="none" stroke="url(#robe)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="96" cy="128" r="3.5" fill="#DCC4A0"/>
  <!-- 画出的卦纹 -->
  <path d="M 78 146 L 96 146 M 80 152 L 94 152 M 76 140 L 98 140" stroke="#E8E0D0" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

  <!-- 晨光微粒 -->
  <g fill="#E8C07A">
    <circle cx="44" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="132">
      <animate attributeName="cy" values="132;124;132" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
