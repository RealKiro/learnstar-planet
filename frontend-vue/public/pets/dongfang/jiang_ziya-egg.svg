<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·一阶·灵胎·灵光种子">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6A"/>
      <stop offset="100%" stop-color="#2A3542"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spirit" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>

    <!-- 姜子牙头部模板（白发老翁·慈眉善目·白须） -->
    <g id="jiangziya-head">
      <ellipse cx="0" cy="0" rx="17" ry="16" fill="#F5EEDC" stroke="#D8C0A0" stroke-width="1"/>
      <!-- 慈眉 -->
      <path d="M -10 -6 Q -6 -10 -2 -8 M 10 -6 Q 6 -10 2 -8" fill="none" stroke="#8E7A5A" stroke-width="1.6" stroke-linecap="round"/>
      <!-- 微眯慈目 -->
      <path d="M -8 -4 Q -5 -2 -2 -4 M 8 -4 Q 5 -2 2 -4" fill="none" stroke="#5A4A3A" stroke-width="1.6" stroke-linecap="round"/>
      <!-- 鼻 -->
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C0A884" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 口 -->
      <path d="M -4 7 Q 0 9 4 7" fill="none" stroke="#A08A68" stroke-width="1.4" stroke-linecap="round"/>
      <!-- 白发（头顶 + 发髻） -->
      <path d="M -14 -8 Q -10 -18 0 -20 Q 10 -18 14 -8 Q 8 -14 0 -15 Q -8 -14 -14 -8 Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="-22" r="5" fill="#FFFFFF" opacity="0.9"/>
      <!-- 白须（垂） -->
      <path d="M -7 10 Q -4 20 0 24 Q 4 20 7 10 Q 3 14 0 15 Q -3 14 -7 10 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 仙山云雾 -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="6s" repeatCount="indefinite"/>
    <path d="M 34 172 Q 60 164 88 170 Q 112 176 140 168 Q 162 162 182 170 L 176 184 Q 140 178 112 184 Q 84 190 52 184 Z" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- 渭水（底部水纹） -->
  <path d="M 30 168 Q 60 172 100 170 Q 140 168 170 172" fill="none" stroke="#8A9BA8" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 仙金灵光（呼吸） -->
  <circle cx="100" cy="138" r="44" fill="url(#halo)">
    <animate attributeName="r" values="44;52;44" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 垂钓老者剪影（半透明）+ 钓竿 -->
  <g opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.8;0.55" dur="3s" repeatCount="indefinite"/>
    <circle cx="100" cy="134" r="26" fill="url(#spirit)"/>
    <use href="#jiangziya-head" transform="translate(100,132) scale(0.55)"/>
    <!-- 钓竿 -->
    <path d="M 88 140 C 76 132 68 124 66 112" fill="none" stroke="#8E6E3A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 66 112 L 62 96" fill="none" stroke="#8E6E3A" stroke-width="0.8"/>
  </g>

  <!-- 封神榜卷（身侧浮沉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.4s" repeatCount="indefinite"/>
    <rect x="118" y="120" width="14" height="18" rx="2" fill="#D8B894" opacity="0.85"/>
    <path d="M 118 122 L 132 122" stroke="#C9B37E" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- 仙气粒子 -->
  <g fill="#C9B37E">
    <circle cx="68" cy="150">
      <animate attributeName="cy" values="150;142;150" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="134" cy="146">
      <animate attributeName="cy" values="146;138;146" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
