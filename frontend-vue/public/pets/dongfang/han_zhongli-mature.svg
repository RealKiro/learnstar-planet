<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汉钟离·四阶·度人点化·黄粱点化吕洞宾">
  <defs>
    <!-- 背景：邯郸客店烛影 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E6A52"/>
      <stop offset="55%" stop-color="#5E4E3E"/>
      <stop offset="100%" stop-color="#40362C"/>
    </linearGradient>
    <!-- 烛火金 -->
    <radialGradient id="candle" cx="30%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#E8B64C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8B64C" stop-opacity="0"/>
    </radialGradient>
    <!-- 灵光金 -->
    <radialGradient id="light" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 红袍道衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0484E"/>
      <stop offset="100%" stop-color="#8E2E38"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D0B0"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </radialGradient>

    <!-- 头部模板：赤发·浓眉·虎目含笑·虬髯慈严并具 -->
    <g id="hanzhongli-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 赤发·虬髯 -->
      <path d="M -4.5 7 Q -2 9 0 7.4 M 0 7.4 Q 2 9 4.5 7 M -2 9.2 Q 0 11 2 9.2" stroke="#2E1A10" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="60" cy="90" r="70" fill="url(#candle)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 客店窗 -->
  <path d="M 156 30 L 192 30 L 192 66 L 156 66 Z" fill="#5E4A3A" stroke="#8E7A4E" stroke-width="2"/>
  <path d="M 156 48 L 192 48 M 174 30 L 174 66" stroke="#8E7A4E" stroke-width="1.4" opacity="0.6"/>
  <!-- 窗外月 -->
  <circle cx="174" cy="40" r="5" fill="#FFF7E0" opacity="0.7"/>

  <!-- 炕床（吕洞宾卧处） -->
  <path d="M 96 140 L 176 140 L 176 172 L 96 172 Z" fill="#5E4A3A"/>
  <path d="M 96 140 L 176 140" stroke="#7E6A4E" stroke-width="1.4" opacity="0.7"/>
  <!-- 枕 -->
  <rect x="140" y="132" width="22" height="10" rx="3" fill="#A8906E"/>
  <!-- 炉上黄粱 -->
  <path d="M 176 136 L 188 136 L 186 146 L 178 146 Z" fill="#8E6A42"/>
  <path d="M 178 136 Q 182 130 186 136" fill="#E8A84E" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <g stroke="#E8E0C8" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
    <path d="M 182 128 Q 178 122 182 116">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 卧榻上吕洞宾（青衫，入梦） -->
  <path d="M 112 130 Q 108 136 114 140 Q 134 146 150 140 Q 156 136 152 130 Q 136 122 112 130 Z" fill="#5E7E9E" stroke="#3E5E7E" stroke-width="1"/>
  <!-- 吕洞宾头（侧卧） -->
  <circle cx="128" cy="126" r="8" fill="#F0DCC6" stroke="#C8AC90" stroke-width="0.8"/>
  <path d="M 122 122 Q 126 119 130 122 Q 128 118 126 118 Q 124 118 122 122 Z" fill="#1E1814"/>
  <!-- 闭目入梦 -->
  <path d="M 123 126 Q 125 127 127 126 M 130 126 Q 132 127 134 126" stroke="#1E1008" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- 梦中浮影（头顶，三幕虚影） -->
  <g opacity="0.5">
    <path d="M 120 96 Q 122 88 125 85 Q 128 88 128 96 Z" fill="#A8402E"/>
    <path d="M 138 100 Q 140 92 143 89 Q 146 92 146 100 Z" fill="#6E4E8E"/>
    <circle cx="125" cy="83" r="3" fill="#E0C8A8"/>
    <circle cx="143" cy="87" r="3" fill="#E0C8A8"/>
  </g>
  <!-- 点化灵光（指尖入梦） -->
  <path d="M 96 96 Q 108 92 120 94" fill="none" stroke="#FFF3C4" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 红袍道人（立于榻前，指尖一点灵光） -->
  <!-- 腿 -->
  <path d="M 62 134 L 58 158 L 64 158 L 68 136 Z" fill="#7E242E"/>
  <path d="M 82 134 L 90 160 L 84 160 L 78 136 Z" fill="#7E242E"/>
  <!-- 红袍 -->
  <path d="M 64 96 Q 60 112 66 134 Q 76 140 86 134 Q 92 112 88 96 Q 76 90 64 96 Z" fill="url(#robe)" stroke="#6E1E2A" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 64 116 L 88 116" stroke="#E8D8A8" stroke-width="2"/>

  <!-- 头（面部模板，面向右） -->
  <use href="#hanzhongli-face" transform="translate(76,88) scale(1)"/>

  <!-- 左臂持芭蕉扇（负身侧） -->
  <path d="M 66 100 C 58 104 54 110 56 118" fill="none" stroke="#C0484E" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 56 116 Q 48 120 52 128 Q 60 130 62 122" fill="#6EA878" stroke="#4E885E" stroke-width="1" opacity="0.9"/>

  <!-- 右臂指尖点化 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 84 98 C 90 96 94 94 96 92" fill="none" stroke="#C0484E" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 指尖灵光 -->
    <circle cx="98" cy="90" r="3" fill="#FFF3C4"/>
    <path d="M 98 88 L 100 84" stroke="#FFF3C4" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="98" cy="90" r="10" fill="url(#light)">
      <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 点化金尘 -->
  <g fill="#FFF3C4">
    <circle cx="120" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
