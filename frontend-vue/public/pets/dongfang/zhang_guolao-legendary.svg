<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="张果老·五阶·八仙过海·倒骑驴踏浪鱼鼓定风波">
  <defs>
    <!-- 背景：沧海明月 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E8EAE"/>
      <stop offset="52%" stop-color="#4E7E9E"/>
      <stop offset="100%" stop-color="#3E6E8E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="32%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
    <!-- 白驴 -->
    <linearGradient id="donkey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F0EC"/>
      <stop offset="100%" stop-color="#C8C8C4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：慈祥面容·白眉·眼含笑·嘴角悠然 -->
    <g id="zhangguolao-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 白发束起 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#E8E0D0"/>
      <!-- 白眉长垂 -->
      <path d="M -8 -2 Q -5 -3.5 -2 -3 M 8 -2 Q 5 -3.5 2 -3" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M -9 -1 Q -11 1 -11 3" stroke="#E8E0D0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 9 -1 Q 11 1 11 3" stroke="#E8E0D0" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眼含笑 -->
      <path d="M -7 0 Q -4.5 -1.2 -2 -0.4 L -2 0.6 Q -4.5 0 -7 1.2 Z" fill="#2E1A10"/>
      <path d="M 7 0 Q 4.5 -1.2 2 -0.4 L 2 0.6 Q 4.5 0 7 1.2 Z" fill="#2E1A10"/>
      <!-- 鼻梁圆 -->
      <circle cx="0" cy="2.6" r="1.8" fill="#C8A880"/>
      <!-- 悠然 -->
      <path d="M -3 5.6 Q 0 7.2 3 5.6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 明月 -->
  <circle cx="152" cy="52" r="44" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="11" fill="#F4F8FC" opacity="0.95"/>

  <!-- 沧海 -->
  <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#3E6E8E"/>
  <path d="M 0 160 Q 60 152 120 158 Q 170 164 200 156 L 200 200 L 0 200 Z" fill="#2E5E7E"/>

  <!-- 八仙虚影 -->
  <g opacity="0.4">
    <path d="M 28 132 Q 30 120 35 116 Q 40 118 40 132 Z" fill="#C8C0A8"/>
    <path d="M 50 136 Q 51 124 56 120 Q 61 122 60 136 Z" fill="#B8A878"/>
    <path d="M 166 130 Q 167 118 172 114 Q 177 116 176 130 Z" fill="#A8B8A8"/>
    <path d="M 148 134 Q 149 122 154 118 Q 159 120 158 134 Z" fill="#D8C8A8"/>
  </g>

  <!-- 浪头托驴足 -->
  <circle cx="96" cy="142" r="20" fill="#E8F0FA" opacity="0.4">
    <animate attributeName="r" values="20;26;20" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 白驴（踏浪） -->
  <path d="M 84 118 Q 76 108 84 100 Q 96 94 108 98 Q 124 102 128 116 Q 130 128 122 134 Q 110 140 96 138 Q 84 136 84 118 Z" fill="url(#donkey)" stroke="#A8A8A4" stroke-width="1"/>
  <path d="M 90 134 L 86 152 L 92 152 L 96 136 Z" fill="#C8C8C4"/>
  <path d="M 118 136 L 124 154 L 119 154 L 114 138 Z" fill="#C8C8C4"/>
  <!-- 驴头（踏浪昂首） -->
  <path d="M 126 116 Q 136 110 140 104 Q 144 98 138 96 Q 130 96 126 102 Q 124 110 126 116 Z" fill="#D8D8D4" stroke="#A8A8A4" stroke-width="1"/>
  <path d="M 134 98 L 132 88 L 138 94 Z" fill="#C8C8C4"/>
  <path d="M 138 98 L 138 88 L 142 94 Z" fill="#C8C8C4"/>
  <path d="M 135 102 Q 137 101.5 139 102" stroke="#2E2E2A" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M 124 102 Q 122 98 124 94" stroke="#A8A8A4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 86 112 Q 78 108 76 100" stroke="#A8A8A4" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 86 112;8 86 112;0 86 112" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 驴鞍 -->
  <path d="M 88 108 Q 100 104 112 108 L 110 118 L 90 118 Z" fill="#8E6A42" stroke="#6E5238" stroke-width="1"/>

  <!-- 道翁（倒骑，鱼鼓一拍） -->
  <!-- 腿 -->
  <path d="M 88 112 L 84 124 M 108 112 L 112 124" stroke="#C8C4BC" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 道袍 -->
  <path d="M 82 96 Q 78 106 82 116 Q 90 120 98 116 Q 102 106 100 96 Q 90 90 82 96 Z" fill="url(#robe)" stroke="#A8A8A4" stroke-width="1"/>

  <!-- 头（面部模板，面向左） -->
  <use href="#zhangguolao-face" transform="translate(91,86) scale(1)"/>

  <!-- 左臂持鱼鼓（一拍定风波） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 84 96;4 84 96;-6 84 96" dur="2s" repeatCount="indefinite"/>
    <path d="M 86 96 C 80 100 76 104 74 110" fill="none" stroke="#C8C4BC" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="72" cy="116" rx="5" ry="7" fill="#A86A3E" stroke="#8E5A2E" stroke-width="0.8"/>
    <path d="M 72 109 L 72 123" stroke="#8E5A2E" stroke-width="1.2"/>
  </g>
  <!-- 鱼鼓定风波（音浪扩散） -->
  <g stroke="#FFF7E0" stroke-width="1.5" opacity="0.5" fill="none">
    <circle cx="72" cy="116" r="14">
      <animate attributeName="r" values="14;22;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右臂负背 -->
  <path d="M 98 96 C 104 100 108 104 110 110" fill="none" stroke="#C8C4BC" stroke-width="4" stroke-linecap="round"/>

  <!-- 波光银尘 -->
  <g fill="#E8F0FA">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
