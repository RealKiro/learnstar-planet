<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="钟馗·六阶·道果·钟馗捉鬼">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#5B2A5E"/>
      <stop offset="55%" stop-color="#3A1A3E"/>
      <stop offset="100%" stop-color="#1E0E24"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#D86A4A"/>
      <stop offset="60%" stop-color="#C85A4A"/>
      <stop offset="100%" stop-color="#A8463A"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C22A1A"/>
      <stop offset="100%" stop-color="#8E1A12"/>
    </linearGradient>
    <radialGradient id="seal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>

    <g id="zhongkui-head">
      <ellipse cx="0" cy="0" rx="20" ry="18" fill="url(#skin)"/>
      <path d="M 0 -15 L 0 -7" stroke="#8E3A2A" stroke-width="2" stroke-linecap="round"/>
      <path d="M -16 -10 Q -10 -15 -4 -13 M 16 -10 Q 10 -15 4 -13" fill="none" stroke="#1A0A0A" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-8" cy="-4" r="6" fill="#FFF"/>
      <circle cx="8" cy="-4" r="6" fill="#FFF"/>
      <circle cx="-8" cy="-4" r="2.4" fill="#1A0A0A"/>
      <circle cx="8" cy="-4" r="2.4" fill="#1A0A0A"/>
      <path d="M -6 6 L -3 9 L 3 9 L 6 6" fill="#8E3A2A" opacity="0.8"/>
      <path d="M -14 4 Q -17 13 -10 20 Q 0 26 10 20 Q 17 13 14 4 Q 10 9 0 9 Q -10 9 -14 4 Z" fill="#1A0A0A"/>
      <path d="M -12 11 Q -8 16 -4 13 M 12 11 Q 8 16 4 13 M 0 10 L 0 18 M -6 8 L -9 12 M 6 8 L 9 12" stroke="#2A1A0A" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 镇宅金光（呼吸） -->
  <circle cx="100" cy="108" r="78" fill="url(#seal)">
    <animate attributeName="r" values="78;88;78" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 小鬼（底部，被镇） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1.8s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="166" rx="16" ry="11" fill="#4A8A6A" opacity="0.85"/>
    <circle cx="108" cy="160" r="5" fill="#4A8A6A" opacity="0.9"/>
    <circle cx="110" cy="158" r="1.4" fill="#FFF"/>
    <path d="M 122 158 Q 128 162 134 160" fill="none" stroke="#2A5A3A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
    <!-- 鬼气 -->
    <path d="M 104 172 C 100 178 96 176 98 182" fill="none" stroke="#6AB88A" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青锋剑（横立身后） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 136 70;3 136 70;0 136 70" dur="2.4s" repeatCount="indefinite"/>
    <line x1="114" y1="100" x2="148" y2="38" stroke="#E8E0D0" stroke-width="4" stroke-linecap="round"/>
    <path d="M 148 38 L 156 30 L 148 34 L 153 26 Z" fill="#F5D742"/>
  </g>

  <!-- 红袍下摆 + 官靴（一踏鬼，一立地） -->
  <path d="M 82 138 L 118 138 L 120 158 L 80 158 Z" fill="url(#robe)"/>
  <path d="M 84 154 L 92 154 L 94 162 L 82 162 Z" fill="#1A0A0A"/>
  <path d="M 108 154 L 116 154 L 118 166 L 106 164 Z" fill="#1A0A0A" opacity="0.9"/>

  <!-- 身体（红袍，魁梧前倾镇鬼） -->
  <path d="M 80 92 Q 72 108 78 130 Q 100 142 122 130 Q 128 108 120 92 Q 100 84 80 92 Z" fill="url(#robe)" transform="rotate(-4 100 110)"/>
  <circle cx="100" cy="108" r="10" fill="#F5D742" opacity="0.2"/>

  <!-- 手臂（一持判官笔指鬼，一挥剑） -->
  <path d="M 90 100 C 84 108 80 118 82 128" fill="none" stroke="url(#robe)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="82" cy="132" r="5" fill="#D0B8A0"/>
  <path d="M 112 102 C 122 108 126 118 124 128" fill="none" stroke="url(#robe)" stroke-width="9" stroke-linecap="round"/>

  <!-- 判官笔（左手持，笔尖指鬼） -->
  <line x1="118" y1="108" x2="128" y2="154" stroke="#6A5540" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="154" x2="131" y2="164" stroke="#F5D742" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 头（头部模板 scale 1.0，虬髯怒张豹眼圆睁） -->
  <use href="#zhongkui-head" transform="translate(100,84) scale(1)"/>

  <!-- 紫金冠（镇宅，斜戴） -->
  <path d="M 82 60 Q 100 50 118 60 L 118 50 Q 100 40 82 50 Z" fill="#F5D742" opacity="0.95"/>
  <path d="M 90 52 L 90 42 M 98 48 L 98 38 M 106 48 L 106 38 M 110 52 L 110 44" stroke="#C9A227" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="100" cy="38" r="3.6" fill="#F5D742">
    <animate attributeName="r" values="3.6;4.6;3.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 镇宅光符（几道金符光） -->
  <g stroke="#F5D742" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <path d="M 50 84 L 42 76 M 150 84 L 158 76 M 42 118 L 34 116 M 158 118 L 166 116"/>
  </g>

  <!-- 神光粒子（飘浮） -->
  <g fill="#F5D742">
    <circle cx="56" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
