<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="曹国舅·二阶·良心难安·见弟为恶锦衣如芒刺">
  <defs>
    <!-- 背景：华庭月夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E5A72"/>
      <stop offset="52%" stop-color="#4A4658"/>
      <stop offset="100%" stop-color="#3A3646"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 烛火金 -->
    <radialGradient id="candle" cx="30%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 锦袍金 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0A04E"/>
      <stop offset="100%" stop-color="#8E7E3E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D0B4"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="cao_guojiu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 温润·桃花眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1 Q -4.5 0.2 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.4 1.8 -0.4 L 1.8 1 Q 4.5 0.2 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.5" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="156" cy="48" r="40" fill="url(#moon)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="156" cy="48" r="10" fill="#E8F0FA" opacity="0.85"/>

  <!-- 金屋（背景，生寒） -->
  <path d="M 0 0 L 96 0 L 82 16 Q 54 26 28 24 Z" fill="#6E5A4E"/>
  <path d="M 0 0 L 96 0" stroke="#8E7A5E" stroke-width="1.2"/>
  <!-- 窗外百姓指点影 -->
  <g opacity="0.4">
    <path d="M 140 120 Q 142 110 146 107 Q 150 109 150 120 Z" fill="#2E2A38"/>
    <path d="M 156 124 Q 157 114 161 111 Q 165 113 164 124 Z" fill="#2A2634"/>
  </g>

  <!-- 烛台 -->
  <path d="M 48 108 L 44 114 L 52 114 Z" fill="#6E5A3E"/>
  <circle cx="48" cy="106" r="4" fill="#E8A84E">
    <animate attributeName="r" values="4;5;4" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#2E2A38" opacity="0.8"/>
  <path d="M 0 148 L 200 148" stroke="#423E4E" stroke-width="1.4" opacity="0.6"/>

  <!-- 锦袍公子（独坐，烛火明灭，眉间忧色） -->
  <!-- 腿（坐） -->
  <path d="M 88 138 Q 94 148 108 146 Q 112 142 110 136 Q 102 144 94 138 Z" fill="#8E7E5E"/>
  <!-- 锦袍 -->
  <!-- 玉带 -->
  <path d="M 90 122 L 110 122" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 头（俊逸面容，眉微蹙，眼含愧意） -->
  <!-- 眉微蹙 -->
  <!-- 眼含愧意 -->
  <!-- 鼻梁 -->
  <!-- 嘴角抿紧 -->

  <!-- 左臂撑膝（垂首） -->
  <path d="M 92 110 C 88 114 86 118 88 124" fill="none" stroke="#C0A04E" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 右臂抚心（良心之灼） -->
  <path d="M 108 110 C 112 114 114 118 112 124" fill="none" stroke="#C0A04E" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="111" cy="116" r="3" fill="#D8B894"/>

  <!-- 良心之灼（心口一点青影/火光） -->
    <animate attributeName="opacity" values="0.15;0.08;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>
    <animate attributeName="r" values="4;5.5;4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 愧影青尘 -->
  <g fill="#8EA8C8">
    <circle cx="44" cy="110">
      <animate attributeName="cy" values="110;102;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#cao_guojiu-face" transform="translate(100,100) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 90 98 Q 94 93 100 93 Q 106 93 110 98 Q 106 94 100 94 Q 94 94 90 98 Z" fill="#1E1814"/>
</svg>
