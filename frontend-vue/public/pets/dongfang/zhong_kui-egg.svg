<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="钟馗·一阶·灵胎·终南寒窗">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4452"/>
      <stop offset="100%" stop-color="#232A34"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#D86A4A"/>
      <stop offset="60%" stop-color="#C85A4A"/>
      <stop offset="100%" stop-color="#A8463A"/>
    </radialGradient>

    <!-- 钟馗头部模板（赤面/豹头环眼/虬髯/额间竖纹；脸中心 0,0，官帽另放） -->
    <g id="zhongkui-head">
      <ellipse cx="0" cy="0" rx="20" ry="18" fill="url(#skin)"/>
      <path d="M 0 -15 L 0 -7" stroke="#8E3A2A" stroke-width="2" stroke-linecap="round"/>
      <path d="M -16 -10 Q -10 -15 -4 -13 M 16 -10 Q 10 -15 4 -13" fill="none" stroke="#2A1A0A" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="-8" cy="-4" r="5.4" fill="#FFF"/>
      <circle cx="8" cy="-4" r="5.4" fill="#FFF"/>
      <circle cx="-8" cy="-4" r="2.2" fill="#2A1A0A"/>
      <circle cx="8" cy="-4" r="2.2" fill="#2A1A0A"/>
      <path d="M -6 6 L -3 9 L 3 9 L 6 6" fill="#8E3A2A" opacity="0.8"/>
      <!-- 虬髯（络腮胡，卷曲覆盖下颌） -->
      <path d="M -14 4 Q -16 12 -10 18 Q 0 24 10 18 Q 16 12 14 4 Q 10 8 0 8 Q -10 8 -14 4 Z" fill="#2A1A0A"/>
      <path d="M -12 10 Q -8 14 -4 12 M 12 10 Q 8 14 4 12" stroke="#3A2A1A" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 孤灯微光（呼吸） -->
  <circle cx="78" cy="128" r="46" fill="url(#lamp)">
    <animate attributeName="r" values="46;54;46" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 书案 -->
  <path d="M 40 156 L 160 156 L 156 168 L 44 168 Z" fill="#4A3A28"/>
  <path d="M 40 156 L 160 156" stroke="#6A5540" stroke-width="2"/>

  <!-- 书卷（摊开） -->
  <path d="M 86 144 Q 100 136 114 144 L 114 152 Q 100 144 86 152 Z" fill="#E8DCC0" opacity="0.9"/>
  <path d="M 90 148 L 110 146 M 90 150 L 108 148" stroke="#8E7A5A" stroke-width="0.8" opacity="0.7"/>

  <!-- 孤灯（案上） -->
  <path d="M 74 144 L 82 144 L 80 154 L 76 154 Z" fill="#8E6E3A"/>
  <path d="M 78 144 C 74 138 76 135 78 133 C 80 135 82 138 78 144 Z" fill="#F5D742">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 字迹成链（光点链） -->
  <g fill="#C9B37E">
    <circle cx="100" cy="132" r="1.2">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="126" r="1.1">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="116" cy="120" r="1"/>
    <circle cx="124" cy="114" r="0.9"/>
  </g>

  <!-- 书生轮廓（赤面虬髯隐约，布巾束发，半透明） -->
  <g opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    <path d="M 88 100 Q 82 116 88 136 Q 100 144 112 136 Q 118 116 112 100 Q 100 94 88 100 Z" fill="#3A4452" opacity="0.6"/>
    <use href="#zhongkui-head" transform="translate(100,84) scale(0.7)"/>
  </g>

  <!-- 布巾束发 -->
  <path d="M 82 76 Q 100 68 118 76 L 116 68 Q 100 60 84 68 Z" fill="#4A5A6A" opacity="0.7"/>

  <!-- 夜读微光粒子 -->
  <g fill="#E8B84B">
    <circle cx="60" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="130">
      <animate attributeName="cy" values="130;122;130" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
