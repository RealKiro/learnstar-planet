<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妲己·四阶·罪孽滔天·炮烙虿盆狐心沉沦">
  <defs>
    <!-- 背景：朝歌刑场血色宫阙 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E2A22"/>
      <stop offset="55%" stop-color="#4E1E18"/>
      <stop offset="100%" stop-color="#301412"/>
    </linearGradient>
    <!-- 炮烙青烟 -->
    <radialGradient id="smoke" cx="28%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#8A98A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8A98A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 华服妖气 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E2E52"/>
      <stop offset="100%" stop-color="#5E1E38"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>

    <!-- 头部模板：鹅蛋脸·细眉微蹙·狐目含煞·朱唇染血 -->
    <g id="daji-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#D8BC98" stroke-width="0.8"/>
      <!-- 云髻 -->
      <path d="M -6 -8 Q 0 -12 6 -8 Q 4 -13 0 -13 Q -4 -13 -6 -8 Z" fill="#1E1412"/>
      <circle cx="0" cy="-12" r="4.5" fill="#1E1412"/>
      <!-- 步摇（妖气） -->
      <path d="M -9 -4 L -13 -1 M 9 -4 L 13 -1" stroke="#A86A8E" stroke-width="0.9" stroke-linecap="round" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <!-- 细眉微蹙 -->
      <path d="M -8.5 -2 Q -5 -3.5 -1.8 -2.5 M 8.5 -2 Q 5 -3.5 1.8 -2.5" stroke="#2E1E1A" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 狐目含煞 -->
      <path d="M -7 0.5 Q -4.5 -1.5 -1.8 -0.4 L -1.8 1 Q -4.5 0.3 -7 2 Z" fill="#1E1412"/>
      <path d="M 7 0.5 Q 4.5 -1.5 1.8 -0.4 L 1.8 1 Q 4.5 0.3 7 2 Z" fill="#1E1412"/>
      <circle cx="-4.2" cy="0" r="1.5" fill="#A82028"/>
      <circle cx="4.2" cy="0" r="1.5" fill="#A82028"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.2" stroke="#C8A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 朱唇染血 -->
      <path d="M -3 5.6 Q 0 7.2 3 5.6" fill="none" stroke="#B02028" stroke-width="1.3" stroke-linecap="round"/>
      <!-- 眉间阴鸷 -->
      <path d="M -1 -4.5 L 1 -2.5" stroke="#2E1E1A" stroke-width="0.8" opacity="0.7"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 炮烙青烟 -->
  <circle cx="56" cy="60" r="50" fill="url(#smoke)">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 血色宫阙飞檐 -->
  <g opacity="0.6">
    <path d="M 0 0 L 80 0 L 66 18 Q 42 30 16 26 Z" fill="#4E1E18"/>
    <path d="M 0 0 L 80 0" stroke="#6E2A22" stroke-width="1.4"/>
  </g>

  <!-- 铜柱炮烙（左） -->
  <g>
    <rect x="40" y="70" width="22" height="86" rx="4" fill="#6E4836" stroke="#8E5A42" stroke-width="1"/>
    <rect x="40" y="70" width="22" height="8" rx="4" fill="#B8432E"/>
    <!-- 炮烙焦痕 -->
    <path d="M 44 90 Q 48 100 44 110 M 54 96 Q 58 106 54 118" stroke="#2E1A12" stroke-width="1.4" opacity="0.6"/>
    <!-- 青烟 -->
    <g stroke="#8A98A8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M 51 68 Q 44 56 48 44 Q 52 32 46 22">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 56 64 Q 60 52 56 42">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 火盆（炮烙下） -->
    <path d="M 36 156 L 66 156 L 62 166 L 40 166 Z" fill="#B8432E"/>
    <path d="M 40 156 Q 50 150 60 156" fill="#E8623A" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 虿盆（右下，毒蛇涌动） -->
  <g opacity="0.85">
    <path d="M 124 166 L 184 166 L 178 184 L 130 184 Z" fill="#3A2A2A"/>
    <path d="M 124 166 L 184 166" stroke="#5A3E3E" stroke-width="1.4"/>
    <!-- 毒蛇 -->
    <path d="M 136 176 Q 142 170 148 176 Q 152 182 158 178 Q 162 172 166 178" stroke="#6E8E5E" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 142 182 Q 150 176 156 182" stroke="#7E9E6E" stroke-width="1.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 170 Q 156 168 162 172" stroke="#5E7E4E" stroke-width="1.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 妖姬立于高台（裙下九尾张扬） -->
  <!-- 高台 -->
  <path d="M 70 128 L 130 128 L 138 146 L 62 146 Z" fill="#3A2620"/>
  <path d="M 70 128 L 130 128" stroke="#5A3A32" stroke-width="1.4" opacity="0.6"/>

  <!-- 裙下九尾张扬 -->
  <g fill="#F6F2EC" stroke="#C8C8D8" stroke-width="0.8" opacity="0.85">
    <path d="M 92 142 Q 78 152 72 162 Q 84 160 94 150 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 92 142;8 92 142;0 92 142" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 142 Q 122 152 128 162 Q 116 160 106 150 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 108 142;-8 108 142;0 108 142" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 144 Q 96 158 100 170 Q 106 162 104 150 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 100 144;6 100 144;0 100 144" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 裙摆 -->
  <path d="M 82 122 Q 96 136 116 128 Q 122 122 118 112 Q 108 124 96 120 Q 86 124 82 122 Z" fill="url(#gown)"/>
  <path d="M 84 122 L 90 152 Q 100 158 112 152 L 116 124" fill="none" stroke="#4E1630" stroke-width="1.2"/>
  <!-- 上身 -->
  <path d="M 88 92 Q 84 104 90 120 Q 98 126 108 120 Q 114 104 110 92 Q 98 86 88 92 Z" fill="url(#gown)" stroke="#4E1630" stroke-width="1"/>
  <!-- 妖气带 -->
  <path d="M 88 106 L 110 106" stroke="#A86A8E" stroke-width="1.8"/>
  <!-- 长袖（一侧微扬） -->
  <path d="M 86 96 C 78 102 76 108 78 116" fill="none" stroke="#8E2E52" stroke-width="4.6" stroke-linecap="round"/>
  <!-- 另一袖垂落 -->
  <path d="M 110 96 C 118 100 122 106 122 114" fill="none" stroke="#8E2E52" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 头（面部模板） -->
  <use href="#daji-face" transform="translate(100,84) scale(1)"/>

  <!-- 妖氛青烟（身周） -->
  <g fill="#6E3A6E" opacity="0.5">
    <circle cx="42" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="100">
      <animate attributeName="cy" values="100;92;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
