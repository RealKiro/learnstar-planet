<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="申公豹·五阶·镇压北海眼·穷途悔悟迟来的清醒">
  <defs>
    <!-- 背景：北海漆黑海天 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3E4E"/>
      <stop offset="55%" stop-color="#1E2E3E"/>
      <stop offset="100%" stop-color="#141E28"/>
    </linearGradient>
    <!-- 海眼漩涡 -->
    <radialGradient id="whirl" cx="50%" cy="72%" r="52%">
      <stop offset="0%" stop-color="#5A7E9E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3A5E7E" stop-opacity="0"/>
    </radialGradient>
    <!-- 悔恨金光 -->
    <radialGradient id="regret" cx="50%" cy="38%" r="30%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </radialGradient>
    <!-- 零落道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4E5E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D4BE"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="shen_gongbao-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 鹰目·薄唇 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 悔恨金光（望昆仑方向） -->
  <circle cx="76" cy="52" r="44" fill="url(#regret)">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 昆仑方向微光 -->
  <path d="M 70 40 L 78 40 M 74 36 L 74 44" stroke="#E8C07A" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>

  <!-- 海眼漩涡 -->
  <circle cx="100" cy="168" r="70" fill="url(#whirl)">
    <animate attributeName="r" values="70;78;70" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 漩涡纹（旋转） -->
  <g fill="none" stroke="#9AB8C8" stroke-width="1.8" opacity="0.7">
    <path d="M 56 168 Q 76 148 100 152 Q 128 156 138 176">
      <animateTransform attributeName="transform" type="rotate" values="0 100 168;30 100 168;0 100 168" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 182 Q 88 162 112 168 Q 132 174 142 188">
      <animateTransform attributeName="transform" type="rotate" values="0 100 168;-25 100 168;0 100 168" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 浪花白 -->
  <g fill="#D8E8F0" opacity="0.8">
    <circle cx="48" cy="156" r="2"/>
    <circle cx="160" cy="164" r="2.4"/>
    <circle cx="130" cy="192" r="2"/>
  </g>

  <!-- 波涛（天际线） -->
  <path d="M 0 96 Q 40 88 80 94 Q 120 100 160 92 Q 180 88 200 94 L 200 200 L 0 200 Z" fill="#24384A" opacity="0.8"/>

  <!-- 被压道人残影（被漩涡吞入，回望昆仑） -->
  <!-- 下半身已被漩涡吞 -->
  <path d="M 96 128 Q 94 136 96 144 Q 100 150 104 144 Q 106 136 104 128 Z" fill="url(#robe)"/>
  <!-- 道袍零落（上半身仰起回望） -->
  <!-- 破袍 -->
  <!-- 腰带残断 -->
  <path d="M 92 122 L 106 122" stroke="#8E7A6E" stroke-width="1.2"/>

  <!-- 头（回望昆仑，眉目颓然目含悔恨） -->
  <!-- 眉目颓然 -->
  <!-- 目含悔恨（垂） -->
  <!-- 鼻梁 -->
  <!-- 薄唇颤抖 -->

  <!-- 左臂伸向昆仑（悔恨） -->
  <path d="M 92 110 C 84 106 78 100 76 92" fill="none" stroke="#5E6E7E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="75" cy="90" r="3" fill="#D8C0A4"/>

  <!-- 悔恨泪光（眼角一点） -->
    <animate attributeName="cy" values="100;104;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 水沫星尘 -->
  <g fill="#9AB8C8">
    <circle cx="48" cy="116">
      <animate attributeName="cy" values="116;106;116" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#shen_gongbao-face" transform="translate(100,100) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 90 96 Q 95 93 100 93 Q 105 93 110 96 Q 105 92 100 92 Q 95 92 90 96 Z" fill="#1E1814"/>
</svg>
