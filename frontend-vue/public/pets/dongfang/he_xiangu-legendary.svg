<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="何仙姑·五阶·八仙过海·踏荷凌波各显神通">
  <defs>
    <!-- 背景：沧海月明 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E8EAE"/>
      <stop offset="52%" stop-color="#4E7E9E"/>
      <stop offset="100%" stop-color="#3E6E8E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="78%" cy="26%" r="32%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 莲花粉 -->
    <radialGradient id="lotus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D8E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 素衣仙裙 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：清秀面容·眉目灵动·嘴角含笑 -->
    <g id="hexiangu-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D8BC98" stroke-width="0.8"/>
      <!-- 青丝 + 莲花簪 -->
      <path d="M -5 -8 Q 0 -11 5 -8 Q 3 -12 0 -12 Q -3 -12 -5 -8 Z" fill="#1E1814"/>
      <path d="M -5 -10 Q -2 -12 0 -11 L -1 -8 Z" fill="#E8A0C8"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目灵动 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.6 M 8 -1.5 Q 5 -3.2 2 -2.6" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.2" cy="0.4" rx="2.1" ry="1.9" fill="#1E1008"/>
      <ellipse cx="4.2" cy="0.4" rx="2.1" ry="1.9" fill="#1E1008"/>
      <circle cx="-4.7" cy="-0.4" r="0.7" fill="#FFF"/>
      <circle cx="3.7" cy="-0.4" r="0.7" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C8A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 含笑 -->
      <path d="M -3 5.4 Q 0 7.4 3 5.4" fill="none" stroke="#B06A4A" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 明月沧波 -->
  <circle cx="156" cy="52" r="46" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="156" cy="52" r="11" fill="#F4F8FC" opacity="0.95"/>

  <!-- 沧海 -->
  <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#3E6E8E"/>
  <path d="M 0 160 Q 60 152 120 158 Q 170 164 200 156 L 200 200 L 0 200 Z" fill="#2E5E7E"/>
  <!-- 浪头 -->
  <path d="M 16 164 Q 56 156 96 162 Q 136 168 176 160" stroke="#9AC8E0" stroke-width="1.6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 八仙虚影（随行） -->
  <g opacity="0.45">
    <path d="M 30 132 Q 32 120 37 116 Q 42 118 42 132 Z" fill="#C8C0A8"/>
    <path d="M 52 136 Q 53 124 58 120 Q 63 122 62 136 Z" fill="#B8A878"/>
    <path d="M 168 130 Q 169 118 174 114 Q 179 116 178 130 Z" fill="#A8B8A8"/>
    <path d="M 148 134 Q 149 122 154 118 Q 159 120 158 134 Z" fill="#D8C8A8"/>
  </g>

  <!-- 荷叶（她踏荷而行，脚下莲舟） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 96 140;4 96 140;0 96 140" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="140" rx="22" ry="8" fill="#6EA878" stroke="#5E9878" stroke-width="1"/>
    <path d="M 76 140 Q 96 134 116 140" fill="none" stroke="#5E9878" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- 仙姑（踏荷凌波） -->
  <!-- 腿 -->
  <path d="M 92 122 L 88 136 L 94 136 L 98 124 Z" fill="#D8D4CC"/>
  <path d="M 104 122 L 110 138 L 105 138 L 101 124 Z" fill="#D8D4CC"/>
  <!-- 仙裙（飘动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 98 112;3 98 112;-4 98 112" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 90 108 Q 88 118 92 124 Q 100 130 108 124 Q 112 118 110 108 Q 100 102 90 108 Z" fill="url(#gown)" stroke="#D0C8C0" stroke-width="1"/>
  </g>
  <!-- 上身 -->
  <path d="M 94 88 Q 90 98 94 110 Q 100 116 106 110 Q 110 98 106 88 Q 100 84 94 88 Z" fill="url(#gown)" stroke="#D0C8C0" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 94 102 L 106 102" stroke="#A8906E" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#hexiangu-face" transform="translate(100,80) scale(1)"/>

  <!-- 左臂垂持 -->
  <path d="M 96 92 C 90 96 88 100 88 106" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>

  <!-- 右臂拈莲（镇波） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 104 92 C 110 94 114 96 118 92" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="120" cy="91" r="3" fill="#E2C8A8"/>
    <g>
      <circle cx="120" cy="78" r="10" fill="url(#lotus)">
        <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="77" r="7" fill="#E8A0C8"/>
      <path d="M 116 75 Q 120 71 124 75 Q 120 77 116 75 Z" fill="#F0B8D8"/>
      <path d="M 116 80 Q 120 76 124 80 Q 120 82 116 80 Z" fill="#F0B8D8"/>
    </g>
  </g>

  <!-- 莲花绽放镇波（脚下海波平静） -->
  <g opacity="0.7">
    <circle cx="96" cy="148" r="16" fill="#F8D8E8" opacity="0.3">
      <animate attributeName="r" values="16;20;16" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M 60 150 Q 96 144 132 150" stroke="#F0D8E8" stroke-width="1.4" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 莲花星尘 -->
  <g fill="#F8D8E8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
