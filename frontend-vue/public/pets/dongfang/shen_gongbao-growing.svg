<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="申公豹·三阶·游说万仙·道友请留步">
  <defs>
    <!-- 背景：云雾山头 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8B0"/>
      <stop offset="52%" stop-color="#7E8E96"/>
      <stop offset="100%" stop-color="#5E6E78"/>
    </linearGradient>
    <!-- 诡紫妖风 -->
    <radialGradient id="aura" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#8E6E9E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8E6E9E" stop-opacity="0"/>
    </radialGradient>
    <!-- 截教黑道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E4256"/>
      <stop offset="100%" stop-color="#2E2638"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>

    <!-- 头部模板：长脸·剑眉·目带狡黠·薄唇含笑 -->
    <g id="shenface">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8AC90" stroke-width="0.9"/>
      <!-- 束发 -->
      <path d="M -5 -10 Q 0 -13 5 -10 Q 3 -14 0 -14 Q -3 -14 -5 -10 Z" fill="#1E1814"/>
      <!-- 额发 -->
      <path d="M -10 -4 Q -6 -9 0 -9 Q 6 -9 10 -4 Q 6 -8 0 -8 Q -6 -8 -10 -4 Z" fill="#1E1814"/>
      <!-- 剑眉 -->
      <path d="M -9 -2 Q -5.5 -4 -2 -3 M 9 -2 Q 5.5 -4 2 -3" stroke="#1E1008" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <!-- 目带狡黠 -->
      <path d="M -8 0.5 Q -5 -1.5 -2 -0.5 L -2 0.7 Q -5 0 -8 1.8 Z" fill="#1E1008"/>
      <path d="M 8 0.5 Q 5 -1.5 2 -0.5 L 2 0.7 Q 5 0 8 1.8 Z" fill="#1E1008"/>
      <circle cx="-5" cy="0" r="1.5" fill="#1E1008"/>
      <circle cx="5" cy="0" r="1.5" fill="#1E1008"/>
      <circle cx="-5.5" cy="-0.6" r="0.5" fill="#FFF"/>
      <circle cx="4.5" cy="-0.6" r="0.5" fill="#FFF"/>
      <!-- 鼻梁高挺 -->
      <path d="M 0 1.5 L 0 3.5" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 薄唇含笑 -->
      <path d="M -3.2 6 Q 0 7.6 3.2 6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="96" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <path d="M 0 136 Q 40 118 90 128 Q 140 136 200 124 L 200 200 L 0 200 Z" fill="#6E8090" opacity="0.5"/>

  <!-- 各路仙影（赴约而来，背景） -->
  <g opacity="0.4">
    <path d="M 24 110 Q 26 96 32 92 Q 38 94 38 110 Z" fill="#3E4A5A"/>
    <path d="M 44 116 Q 46 102 52 98 Q 58 100 58 116 Z" fill="#4E5E6E"/>
    <path d="M 150 112 Q 152 98 158 94 Q 164 96 164 112 Z" fill="#3E4A5A"/>
    <path d="M 170 116 Q 172 102 178 98 Q 184 100 184 116 Z" fill="#4E5E6E"/>
  </g>

  <!-- 仙云 -->
  <g opacity="0.6">
    <path d="M 0 150 Q 40 142 80 148 Q 120 154 160 146 L 200 150 L 200 200 L 0 200 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 被拦仙人（右上，驻足） -->
  <g opacity="0.85">
    <path d="M 144 96 Q 142 84 148 78 Q 154 80 154 92 Z" fill="#5E7E9E"/>
    <circle cx="149" cy="74" r="6.5" fill="#E0C8A8"/>
    <path d="M 145 72 Q 149 69 153 72 Q 151 67 149 67 Q 147 67 145 72 Z" fill="#2E2620"/>
    <!-- 仙者回首（被叫住） -->
    <path d="M 140 88 Q 132 84 128 78" stroke="#5E7E9E" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- 黑袍道人（截教黑道袍，双剑在背，拦住攀谈） -->
  <!-- 腿 -->
  <path d="M 84 136 L 80 160 L 86 160 L 90 138 Z" fill="#2E2638"/>
  <path d="M 108 136 L 114 162 L 108 162 L 104 138 Z" fill="#2E2638"/>
  <!-- 道袍下摆 -->
  <path d="M 84 126 Q 96 138 110 132 Q 114 126 110 118 Q 104 128 96 124 Q 88 128 84 126 Z" fill="url(#robe)"/>
  <!-- 身体 -->
  <path d="M 86 92 Q 82 108 88 126 Q 98 132 108 126 Q 114 108 110 92 Q 98 86 86 92 Z" fill="url(#robe)" stroke="#1E1828" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 86 112 L 110 112" stroke="#8E6E9E" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#shenface" transform="translate(98,84) scale(1)"/>

  <!-- 双剑在背 -->
  <path d="M 92 82 L 88 108 M 104 82 L 108 108" stroke="#C8CCD4" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>

  <!-- 左臂负背 -->
  <path d="M 88 96 C 80 100 78 106 78 114" fill="none" stroke="#4E4256" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 右臂挽袖攀谈（"道友请留步"） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 110 96;4 110 96;-4 110 96" dur="2s" repeatCount="indefinite"/>
    <path d="M 108 96 C 116 100 122 104 126 110" fill="none" stroke="#4E4256" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="128" cy="112" r="3.4" fill="#D8C0A4"/>
  </g>

  <!-- 舌灿莲花（口前诡紫音浪） -->
  <g fill="none" stroke="#B88AC8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <path d="M 82 96 Q 72 92 66 88">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 84 100 Q 72 96 64 92">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 86 104 Q 74 100 66 96">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 妖风随行 -->
  <g fill="#8E6E9E">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="68">
      <animate attributeName="cy" values="68;58;68" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
