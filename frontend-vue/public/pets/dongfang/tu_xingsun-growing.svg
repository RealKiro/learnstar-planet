<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="土行孙·三阶·被撺掇下山·捆仙绳误用低头认错">
  <defs>
    <!-- 背景：玄黑夜营，商周对峙 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E3448"/>
      <stop offset="55%" stop-color="#2A2234"/>
      <stop offset="100%" stop-color="#1E1826"/>
    </linearGradient>
    <!-- 帐中火光 -->
    <radialGradient id="fire" cx="70%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 战甲短打 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E8A98"/>
      <stop offset="100%" stop-color="#5E5A68"/>
    </linearGradient>
    <!-- 捆仙绳金 -->
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C8A028"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：圆脸·细眉·眯眼精明·蒜头鼻（脸中心 0,0） -->
    <g id="tuxingsun-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 胖腮·蒜头鼻 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.3 Q -5 -2.4 -2 -2 M 8 -1.3 Q 5 -2.4 2 -2" stroke="#1E1008" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="140" r="80" fill="url(#fire)"/>

  <!-- 军帐布帷 -->
  <path d="M 0 0 L 200 0 L 200 70 Q 100 92 0 70 Z" fill="#4E4256" opacity="0.6"/>
  <path d="M 0 70 Q 100 92 200 70" stroke="#5E5266" stroke-width="2" opacity="0.5"/>
  <!-- 帐外旌旗（远处） -->
  <g opacity="0.4">
    <path d="M 24 30 L 24 90" stroke="#1E1826" stroke-width="2"/>
    <path d="M 24 30 L 46 38 L 24 46 Z" fill="#8E2E1E"/>
    <path d="M 172 26 L 172 86" stroke="#1E1826" stroke-width="2"/>
    <path d="M 172 26 L 150 32 L 172 42 Z" fill="#3A4E78"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 158 L 200 158 L 200 200 L 0 200 Z" fill="#1E1826" opacity="0.7"/>
  <path d="M 0 158 L 200 158" stroke="#3E3448" stroke-width="1.4" opacity="0.6"/>

  <!-- 申公豹黑影（右后，鼓舌） -->
  <g opacity="0.5">
    <path d="M 164 150 Q 162 124 168 112 Q 158 108 160 100 Q 164 94 172 98 Q 176 104 172 112 Q 178 122 176 150 Z" fill="#1A1420"/>
    <circle cx="168" cy="96" r="6.5" fill="#1A1420"/>
  </g>
  <!-- 鼓舌线（挑拨） -->
  <path d="M 158 108 Q 150 104 146 98" stroke="#C8A028" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 矮小战将（2.5头身，手持捆仙绳，垂头丧气） -->
  <!-- 腿 -->
  <path d="M 80 138 L 78 156 L 84 156 L 86 140 Z" fill="#5E5A68"/>
  <path d="M 100 138 L 104 156 L 98 156 L 96 140 Z" fill="#5E5A68"/>
  <!-- 战甲短打 -->
  <path d="M 80 100 Q 76 120 80 138 Q 90 144 100 138 Q 106 120 102 100 Q 90 94 80 100 Z" fill="url(#armor)" stroke="#4A4654" stroke-width="1"/>
  <!-- 甲线 -->
  <path d="M 82 110 L 100 110 M 82 124 L 100 124" stroke="#7A7684" stroke-width="1" opacity="0.6"/>
  <!-- 腰带 -->
  <path d="M 80 116 L 102 116" stroke="#8E7A4E" stroke-width="1.8"/>

  <!-- 头（面部模板，垂头） -->
  <use href="#tuxingsun-face" transform="translate(91,90) scale(1)"/>

  <!-- 左臂持捆仙绳（金光脱手，垂落） -->
  <g>
    <path d="M 82 104 C 76 108 74 114 76 122" fill="none" stroke="#8E8A98" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="76" cy="124" r="3" fill="#DCC4A0"/>
    <!-- 捆仙绳（一端垂落） -->
    <path d="M 76 124 C 68 130 66 140 72 148 C 78 156 86 158 94 154 C 100 150 102 144 100 138" fill="none" stroke="url(#rope)" stroke-width="2.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0.8;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右臂背棍（镔铁棍斜背） -->
  <path d="M 100 104 C 106 108 108 114 106 122" fill="none" stroke="#8E8A98" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 96 96 L 104 148" stroke="#5A5E66" stroke-width="3" stroke-linecap="round"/>

  <!-- 捆仙绳金光（一闪） -->
  <circle cx="76" cy="124" r="12" fill="#F5D742" opacity="0.35">
    <animate attributeName="r" values="12;16;12" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.12;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 军帐烛火 -->
  <g>
    <path d="M 150 132 L 149 120 L 152 128 Z" fill="#E8A84E" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="150" cy="134" r="2" fill="#E8A84E"/>
  </g>

  <!-- 悔悟尘雾 -->
  <g fill="#4E4256">
    <circle cx="56" cy="150">
      <animate attributeName="cy" values="150;142;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="154">
      <animate attributeName="cy" values="154;146;154" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
