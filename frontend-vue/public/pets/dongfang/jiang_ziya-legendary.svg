<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·五阶·封神台·册封诸神">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#5B2A8A"/>
      <stop offset="55%" stop-color="#3A1A5E"/>
      <stop offset="100%" stop-color="#1E0E34"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8B44A"/>
      <stop offset="60%" stop-color="#B8862A"/>
      <stop offset="100%" stop-color="#8E5E1E"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>

    <g id="jiangziya-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉·白须 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 完整背光 + 神光星辰 -->
  <g>
    <animate attributeName="opacity" values="1;0.7;1" dur="3.2s" repeatCount="indefinite"/>
    <circle cx="100" cy="104" r="86" fill="#F5D742" opacity="0.1"/>
    <circle cx="100" cy="104" r="78" fill="none" stroke="#F5D742" stroke-width="2" opacity="0.45"/>
  </g>
  <!-- 神光星辰（台下亮起） -->
  <g fill="#F5D742">
    <circle cx="40" cy="150" r="2.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="56" cy="168" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="144" cy="150" r="2.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="170" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="176" r="1.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="160" r="1.6"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="162" r="1.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 封神台（高台） -->
  <path d="M 56 168 L 144 168 L 138 180 L 62 180 Z" fill="#8E7E6A" opacity="0.7"/>
  <path d="M 50 180 L 150 180" stroke="#B8A888" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 紫金道袍（封神相） -->
  <path d="M 78 98 Q 100 90 122 98 L 116 140 Q 100 150 84 140 Z" fill="url(#robe)"/>
  <path d="M 92 96 L 92 142 M 108 96 L 108 142" stroke="#8E5E1E" stroke-width="1.4" opacity="0.8"/>
  <!-- 手持玉笏/榜单 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <rect x="84" y="104" width="22" height="30" rx="3" fill="#F0E6D0" opacity="0.95"/>
    <path d="M 88 110 L 102 110 M 88 118 L 102 118 M 88 126 L 100 126" stroke="#C9B37E" stroke-width="1.2" opacity="0.8"/>
  </g>
  <!-- 手（捧榜） -->
  <ellipse cx="88" cy="138" rx="5" ry="6" fill="#DCC4A0" opacity="0.9"/>
  <ellipse cx="102" cy="140" rx="5" ry="6" fill="#DCC4A0" opacity="0.9"/>

  <!-- 头（白发白须神仙相） -->
  <use href="#jiangziya-face" transform="translate(100,84) scale(1)"/>

  <!-- 莲花冠 -->
  <path d="M 82 68 Q 100 58 118 68 L 118 58 Q 100 48 82 58 Z" fill="#F5D742" opacity="0.95"/>
  <path d="M 92 60 Q 100 56 108 60 Q 104 64 100 64 Q 96 64 92 60 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 88 52 Q 96 46 104 52 Q 100 54 96 54 Q 92 54 88 52 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- 祥光放射 -->
  <g stroke="#F5D742" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M 36 70 L 28 62"/><path d="M 164 70 L 172 62"/>
    <path d="M 44 38 L 38 28"/><path d="M 156 38 L 162 28"/>
  </g>
</svg>
