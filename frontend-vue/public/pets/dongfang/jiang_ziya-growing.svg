<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·三阶·渭水垂钓·愿者上钩">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E0D8"/>
      <stop offset="100%" stop-color="#A8B8AC"/>
    </linearGradient>
    <!-- 夕阳淡金 -->
    <radialGradient id="sun" cx="70%" cy="24%" r="45%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#D8D4CC"/>
    </radialGradient>

    <g id="jiangziya-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉·白须 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="48" r="60" fill="url(#sun)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 + 长空流云 -->
  <path d="M 0 140 Q 60 108 120 128 Q 160 140 200 118 L 200 200 L 0 200 Z" fill="#A8B8AC" opacity="0.7"/>
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;-5 0;0 0" dur="8s" repeatCount="indefinite"/>
    <path d="M 20 90 Q 60 82 100 88 Q 140 94 180 86" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M 40 110 Q 80 104 120 110" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 渭水（水面） -->
  <path d="M 0 160 Q 60 154 120 158 Q 170 162 200 156 L 200 200 L 0 200 Z" fill="#8A9BA8" opacity="0.5"/>
  <path d="M 30 168 Q 70 164 110 167 Q 150 170 180 166" fill="none" stroke="#A8B8AC" stroke-width="1.4" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 青石 -->
  <path d="M 58 154 L 92 154 L 88 166 L 62 166 Z" fill="#B0B8BC" opacity="0.85"/>

  <!-- 角色：白衣老者坐青石持竿垂钓 -->
  <!-- 白衣鹤氅身体 -->
  <path d="M 74 98 Q 68 114 72 132 Q 84 142 92 132 Q 96 116 94 102 Z" fill="url(#robe)"/>
  <!-- 逍遥巾（白发束头巾） -->
  <path d="M 76 82 Q 88 74 100 80 L 98 72 Q 88 64 78 72 Z" fill="#D8D4CC" opacity="0.95"/>
  <!-- 头（白发老翁，面东） -->
  <use href="#jiangziya-face" transform="translate(88,90) scale(0.95) rotate(-6)"/>

  <!-- 手臂（持竿） -->
  <path d="M 92 104 C 100 108 106 114 108 120" fill="none" stroke="url(#robe)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="109" cy="123" r="3.5" fill="#DCC4A0"/>

  <!-- 竹竿 + 直钩（离水三尺，红绳） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 109 123;3 109 123;0 109 123" dur="4s" repeatCount="indefinite"/>
    <path d="M 109 123 C 118 116 128 110 140 104" fill="none" stroke="#8E6E3A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 140 104 L 146 140" fill="none" stroke="#8E6E3A" stroke-width="0.8"/>
    <!-- 直钩离水 + 红绳 -->
    <path d="M 144 136 L 150 140 M 144 142 L 150 138" stroke="#C9B37E" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M 146 140 L 146 146" stroke="#D84A3A" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 身侧竹简 -->
  <path d="M 66 136 L 84 132 L 84 146 L 66 150 Z" fill="#C8B890" opacity="0.85"/>

  <!-- 夕阳微粒 -->
  <g fill="#E8B84B">
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
