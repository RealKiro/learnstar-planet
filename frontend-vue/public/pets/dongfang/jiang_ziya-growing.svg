<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·三阶·初成·悟道下山">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="62%">
      <stop offset="0%" stop-color="#B8502E"/>
      <stop offset="60%" stop-color="#8E3A22"/>
      <stop offset="100%" stop-color="#5A2416"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#F0EDE4"/>
      <stop offset="60%" stop-color="#E4E0D4"/>
      <stop offset="100%" stop-color="#C8C4B8"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>

    <g id="jiangziya-head">
      <ellipse cx="0" cy="0" rx="17" ry="16" fill="#F5EEDC" stroke="#D8C0A0" stroke-width="1"/>
      <path d="M -10 -6 Q -6 -10 -2 -8 M 10 -6 Q 6 -10 2 -8" fill="none" stroke="#8E7A5A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -8 -4 Q -5 -2 -2 -4 M 8 -4 Q 5 -2 2 -4" fill="none" stroke="#5A4A3A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C0A884" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M -4 7 Q 0 9 4 7" fill="none" stroke="#A08A68" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -14 -8 Q -10 -18 0 -20 Q 10 -18 14 -8 Q 8 -14 0 -15 Q -8 -14 -14 -8 Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="-22" r="5" fill="#FFFFFF" opacity="0.9"/>
      <path d="M -7 10 Q -4 20 0 24 Q 4 20 7 10 Q 3 14 0 15 Q -3 14 -7 10 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="112" r="68" fill="url(#core)">
    <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="56" fill="none" stroke="#F5D742" stroke-width="1.6" opacity="0.45"/>

  <!-- 道袍下摆 + 布鞋 -->
  <path d="M 88 138 L 112 138 L 114 156 L 86 156 Z" fill="url(#robe)"/>
  <ellipse cx="92" cy="158" rx="8" ry="5" fill="#4A5A66"/>
  <ellipse cx="108" cy="158" rx="8" ry="5" fill="#4A5A66"/>

  <!-- 身体（素净道袍） -->
  <path d="M 84 92 Q 76 108 82 130 Q 100 142 118 130 Q 124 108 116 92 Q 100 84 84 92 Z" fill="url(#robe)"/>
  <!-- 衣襟 + 道纹 -->
  <path d="M 100 90 L 100 132" stroke="#B8B4A8" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 88 96 L 88 128 M 112 96 L 112 128" stroke="#B8B4A8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- 手臂（一持杏黄旗，一垂） -->
  <path d="M 90 98 C 84 104 82 112 84 120" fill="none" stroke="url(#robe)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 112 100 C 120 106 124 114 124 122" fill="none" stroke="url(#robe)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="124" cy="126" r="4" fill="#D8C0A0"/>

  <!-- 杏黄旗（初展） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 128 60;4 128 60;0 128 60" dur="3s" repeatCount="indefinite"/>
    <line x1="128" y1="40" x2="128" y2="150" stroke="#8E6E3A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 128 42 L 160 52 L 160 66 L 128 58 Z" fill="#F5D742" opacity="0.92"/>
    <path d="M 130 48 L 154 55" stroke="#C9A227" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- 头（头部模板 scale 1.0，身体正上方） -->
  <use href="#jiangziya-head" transform="translate(100,88) scale(1)"/>

  <!-- 道髻高束（插簪） -->
  <path d="M 84 72 Q 100 64 116 72 L 116 64 Q 100 56 84 64 Z" fill="#4A5A6A" opacity="0.9"/>
  <line x1="110" y1="62" x2="120" y2="72" stroke="#C9B37E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 悟道光点 -->
  <g fill="#F5D742">
    <circle cx="60" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="102">
      <animate attributeName="cy" values="102;94;102" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
