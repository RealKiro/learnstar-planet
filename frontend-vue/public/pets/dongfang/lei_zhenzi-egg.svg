<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雷震子·一阶·燕山雷婴·雷雨降生">
  <defs>
    <!-- 背景：燕山古洞灰褐 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E6258"/>
      <stop offset="100%" stop-color="#463C34"/>
    </linearGradient>
    <!-- 洞口淡金微光 -->
    <radialGradient id="glow" cx="32%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </radialGradient>
    <!-- 襁褓麻布 -->
    <radialGradient id="cloth" cx="45%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#B8A888"/>
      <stop offset="100%" stop-color="#86764E"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 洞口光（左下） -->
  <circle cx="62" cy="160" r="72" fill="url(#glow)">
    <animate attributeName="opacity" values="1;0.72;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 洞壁（上部阴影） -->
  <path d="M 0 0 L 200 0 L 200 42 Q 100 78 0 58 Z" fill="#382F2A" opacity="0.6"/>
  <path d="M 0 0 L 120 0 L 56 62 L 0 84 Z" fill="#2C2522" opacity="0.5"/>

  <!-- 未散的雷光（金线游走，一阶淡金微光） -->
  <g stroke="#E8C07A" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 150 90 L 158 78 L 152 78 L 160 64">
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 172 108 L 180 96 L 174 96 L 182 82">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青石（婴儿卧处） -->
  <path d="M 62 158 L 136 158 L 132 172 L 66 172 Z" fill="#78726A"/>
  <path d="M 62 158 L 136 158" stroke="#8A847C" stroke-width="2" opacity="0.6"/>

  <!-- 文王背影（右缘俯身欲抱，模糊剪影） -->
  <g opacity="0.5">
    <path d="M 188 170 Q 178 140 165 132 Q 158 152 162 170 Z" fill="#211A16"/>
    <circle cx="165" cy="127" r="8" fill="#211A16"/>
  </g>

  <!-- 襁褓婴儿（蜷卧） -->
  <path d="M 78 137 Q 74 118 88 110 Q 100 104 112 110 Q 128 116 126 132 Q 124 147 108 151 Q 90 153 80 145 Z" fill="url(#cloth)" stroke="#756546" stroke-width="1"/>
  <path d="M 84 149 Q 100 141 122 147" fill="none" stroke="#756546" stroke-width="1.2" opacity="0.7"/>

  <!-- 婴儿脸（露头，闭眼） -->
  <circle cx="98" cy="116" r="8.5" fill="url(#skin)"/>
  <!-- 胎发 -->
  <path d="M 89 112 Q 97 105 107 112 Q 104 110 98 108 Q 92 109 89 112 Z" fill="#2E2620"/>
  <!-- 闭眼 -->
  <path d="M 92 117 Q 95 119 98 117 M 98 117 Q 101 119 104 117" fill="none" stroke="#5A4A3A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 小嘴 -->
  <path d="M 96 122 Q 98 124 100 122" fill="none" stroke="#B08A6A" stroke-width="1" stroke-linecap="round"/>
  <!-- 眉心雷纹（老天爷的戳） -->
  <path d="M 98 106 L 99.5 110 L 97.5 110.5 L 98 113" fill="none" stroke="#E8C07A" stroke-width="1.2" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 金尘（命定微光） -->
  <g fill="#E8C07A">
    <circle cx="46" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="128">
      <animate attributeName="cy" values="128;120;128" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="88">
      <animate attributeName="cy" values="88;80;88" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
