<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汉钟离·五阶·正阳帝君·云端大日火凤绕身">
  <defs>
    <!-- 背景：赤霞云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C88A6E"/>
      <stop offset="52%" stop-color="#A86A52"/>
      <stop offset="100%" stop-color="#7E4E3E"/>
    </linearGradient>
    <!-- 大日金 -->
    <radialGradient id="sun" cx="76%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 正阳红 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#FF8A6E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF8A6E" stop-opacity="0"/>
    </radialGradient>
    <!-- 红袍大氅 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0484E"/>
      <stop offset="100%" stop-color="#8E2E38"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D0B0"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </radialGradient>

    <!-- 头部模板：赤发·浓眉·虎目如日·虬髯方正威严 -->
    <g id="hanzhongli-face">
      <ellipse cx="0" cy="0" rx="11" ry="11" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 赤发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#B8432E"/>
      <path d="M -8 -4 L -12 -2 M 8 -4 L 12 -2" stroke="#B8432E" stroke-width="1.6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#B8432E"/>
      <!-- 浓眉 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- 虎目如日 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.5" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.5" ry="2.2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.6" cy="0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.6" cy="0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 虬髯 -->
      <path d="M -5 6 Q -3 8 0 6.5 M 0 6.5 Q 3 8 5 6 M -2 8.5 Q 0 10 2 8.5" stroke="#2E1A10" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 大日 -->
  <circle cx="152" cy="52" r="54" fill="url(#sun)">
    <animate attributeName="opacity" values="0.95;0.7;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="15" fill="#FFF3C4" opacity="0.95">
    <animate attributeName="r" values="15;17;15" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 正阳神光 -->
  <circle cx="100" cy="94" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="94" r="60" fill="none" stroke="#FFE066" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="60;65;60" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="94" r="52" fill="none" stroke="#FFE066" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="52;55;52" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火凤绕身 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="rotate" values="0 100 94;360 100 94" dur="15s" repeatCount="indefinite"/>
    <path d="M 156 70 Q 164 62 166 54 Q 158 56 154 62 Q 148 70 154 74 Q 156 74 156 70 Z" fill="#F58A3E" stroke="#D8602A" stroke-width="1"/>
    <path d="M 154 68 Q 144 58 140 50 Q 150 56 156 64 Z" fill="#FFB85E" opacity="0.9"/>
    <path d="M 158 72 Q 150 84 146 94 Q 154 84 160 74 Z" fill="#E8603A" opacity="0.8"/>
    <path d="M 154 76 Q 148 84 146 92" stroke="#FFE066" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 八仙虚影 -->
  <g opacity="0.4">
    <path d="M 30 120 Q 32 108 37 104 Q 42 106 42 120 Z" fill="#C8C0A8"/>
    <path d="M 52 124 Q 53 112 58 108 Q 63 110 62 124 Z" fill="#B8A878"/>
    <path d="M 148 128 Q 149 116 154 112 Q 159 114 158 128 Z" fill="#D8C8A8"/>
  </g>

  <!-- 云海 -->
  <g opacity="0.7">
    <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#B8785E">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 红袍帝君（持芭蕉扇，威震三界） -->
  <!-- 腿 -->
  <path d="M 88 132 L 84 156 L 90 156 L 94 134 Z" fill="#7E242E"/>
  <path d="M 106 132 L 114 158 L 108 158 L 102 134 Z" fill="#7E242E"/>
  <!-- 红袍大氅 -->
  <path d="M 86 124 Q 98 134 110 126 Q 114 120 110 112 Q 104 124 96 120 Q 88 124 86 124 Z" fill="url(#robe)"/>
  <!-- 上身 -->
  <path d="M 88 92 Q 84 108 90 124 Q 100 130 110 124 Q 116 108 112 92 Q 100 86 88 92 Z" fill="url(#robe)" stroke="#6E1E2A" stroke-width="1"/>
  <!-- 帝君冠 -->
  <path d="M 90 84 Q 100 76 110 84 L 108 80 Q 100 72 92 80 Z" fill="#FFE066" opacity="0.9"/>
  <circle cx="100" cy="74" r="3.4" fill="#FFF3C4">
    <animate attributeName="r" values="3.4;4.6;3.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 腰带 -->
  <path d="M 88 112 L 112 112" stroke="#E8D8A8" stroke-width="2"/>

  <!-- 头（面部模板） -->
  <use href="#hanzhongli-face" transform="translate(100,76) scale(1)"/>

  <!-- 左臂持芭蕉扇（负身侧） -->
  <path d="M 90 96 C 82 100 78 106 78 114" fill="none" stroke="#C0484E" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M 76 112 Q 68 116 72 124 Q 80 126 82 118" fill="#6EA878" stroke="#4E885E" stroke-width="1" opacity="0.9"/>

  <!-- 右臂指向大日（一扇火海/号令） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 108 96 C 114 92 120 88 124 82" fill="none" stroke="#C0484E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="126" cy="80" r="3.4" fill="#D8B894"/>
    <!-- 指向大日的火线 -->
    <path d="M 126 80 Q 136 68 144 60" fill="none" stroke="#FFE066" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 正阳星尘 -->
  <g fill="#FFE066">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="44">
      <animate attributeName="cy" values="44;34;44" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
