<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨戬·四阶·封神大战·西岐先锋">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#241A14"/>
      <stop offset="70%" stop-color="#17100C"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC24A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC24A" stop-opacity="0"/>
    </radialGradient>

    <g id="yangjian-face">
      <ellipse cx="0" cy="0" rx="16" ry="15" fill="#F0DCC0" stroke="#C8B090" stroke-width="1"/>
      <path d="M -10 -6 Q -6 -9 -2 -7 M 10 -6 Q 6 -9 2 -7" fill="none" stroke="#2A1A0A" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="3.4" fill="#1A0A0A"/>
      <circle cx="7" cy="-2" r="3.4" fill="#1A0A0A"/>
      <circle cx="-5.8" cy="-3.2" r="1.2" fill="#FFF"/>
      <circle cx="8.2" cy="-3.2" r="1.2" fill="#FFF"/>
      <path d="M -1 3 L 1 3 L 0 6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M -3 8 Q 0 10 3 8" fill="none" stroke="#A08A68" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 0 -13 L 2.8 -10 L 2.8 -6 L 0 -3 L -2.8 -6 L -2.8 -10 Z" fill="#F5D742" stroke="#FFC24A" stroke-width="1" opacity="1"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 战火雷电 -->
  <path d="M 26 42 L 44 58 L 34 62 L 50 80" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 178 92 L 162 104 L 174 108 L 156 126" fill="none" stroke="#E8E0D0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 18 186 Q 30 166 44 180 Q 54 160 68 176 Q 80 156 94 174 Q 106 158 118 176 Q 130 162 142 180 Q 152 164 166 182 Q 176 170 188 186 Z" fill="#8B1A1A" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 妖雾（右上） -->
  <g opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 120 60 Q 140 48 160 56 Q 180 64 190 56 Q 178 72 158 72 Q 138 72 120 60 Z" fill="#3A2A3A" opacity="0.6"/>
  </g>

  <!-- 哮天犬（如电随行） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="0.9s" repeatCount="indefinite"/>
    <path d="M 120 150 Q 132 140 144 148 L 146 158 Q 132 162 122 156 Z" fill="#F0EEE8"/>
    <circle cx="142" cy="140" r="5" fill="#F0EEE8"/>
    <circle cx="143.5" cy="138.5" r="1.2" fill="#E53935"/>
    <path d="M 136 140 L 130 136 M 130 136 L 126 138" stroke="#F0EEE8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 角色：银甲杨戬横扫 -->
  <!-- 银甲 -->
  <path d="M 76 90 Q 66 106 70 130 Q 86 142 102 128 Q 108 108 102 92 Q 90 82 76 90 Z" fill="url(#armor)" transform="rotate(-8 88 110)"/>
  <path d="M 88 86 L 88 132" stroke="#A8A49C" stroke-width="1.4" opacity="0.8"/>
  <circle cx="72" cy="100" r="6" fill="#D8D4CC"/>
  <circle cx="104" cy="98" r="6" fill="#D8D4CC"/>

  <!-- 头（基础脸，天眼） -->
  <use href="#yangjian-face" transform="translate(84,78) scale(1) rotate(-4)"/>
  <!-- 金冠 -->
  <path d="M 72 64 Q 84 56 96 62 L 94 54 Q 82 48 74 54 Z" fill="#F5D742" opacity="0.95"/>

  <!-- 天眼照妖（光柱） -->
  <g>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 82 46 L 90 20 L 100 44 Z" fill="#FFC24A" opacity="0.6"/>
  </g>

  <!-- 手臂（横扫持刀） -->
  <path d="M 88 96 C 102 100 114 102 122 106" fill="none" stroke="url(#armor)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="124" cy="108" r="4" fill="#DCC4A0"/>

  <!-- 三尖两刃刀（横扫） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 132 44;6 132 44;-8 132 44" dur="1.6s" repeatCount="indefinite"/>
    <line x1="110" y1="120" x2="140" y2="30" stroke="#D8D4CC" stroke-width="4" stroke-linecap="round"/>
    <path d="M 140 30 L 148 16 L 140 22 L 150 12 L 140 26 Z" fill="#F0EEE8"/>
    <path d="M 140 30 L 132 22 L 140 26 L 134 36 Z" fill="#F0EEE8"/>
  </g>

  <!-- 战斗光环 -->
  <circle cx="88" cy="110" r="54" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.5" stroke-dasharray="7 6">
    <animateTransform attributeName="transform" type="rotate" values="0 88 110;20 88 110;0 88 110" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- 火星 -->
  <g fill="#F97316">
    <circle cx="56" cy="112"><animate attributeName="cy" values="112;102;112" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0.15;0.85" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="108"><animate attributeName="cy" values="108;98;108" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
