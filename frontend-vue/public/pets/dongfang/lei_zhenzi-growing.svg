<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雷震子·三阶·玉柱变形·仙杏生翅">
  <defs>
    <!-- 背景：终南晚照，暖朱赤金 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C07A4E"/>
      <stop offset="55%" stop-color="#9A5A3E"/>
      <stop offset="100%" stop-color="#6E4A4E"/>
    </linearGradient>
    <!-- 赤金暮光 -->
    <radialGradient id="sun" cx="68%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#F0B050" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0B050" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝靛面 -->
    <linearGradient id="faceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E8CE0"/>
      <stop offset="100%" stop-color="#3E5CB0"/>
    </linearGradient>
    <!-- 风雷翅（宝蓝） -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A7CC8"/>
      <stop offset="100%" stop-color="#2E4E8E"/>
    </linearGradient>
    <!-- 道袍 -->
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#7E9AAE"/>
      <stop offset="100%" stop-color="#4E6E84"/>
    </radialGradient>
    <!-- 黄金棍 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C8901E"/>
    </linearGradient>

    <!-- 鸟面雷公（蓝靛面/朱砂发/金瞳雷纹/鸟喙獠牙） -->
    <g id="leizhenzi-face">
      <ellipse cx="0" cy="0" rx="10" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -7 7 Q 0 13 7 7 Q 4 14 0 14 Q -4 14 -7 7 Z" fill="url(#skin)" opacity="0.5"/>
      <!-- 蓝靛面·鸟喙 -->
      
      <!-- 眉 -->
      <path d="M -8 -2 L 8 -2" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <circle cx="-4.6" cy="0.4" r="2.8" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="2.8" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.5" r="1" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="1" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="48" r="74" fill="url(#sun)"/>

  <!-- 云海（青蓝） -->
  <path d="M 0 108 Q 50 98 100 106 Q 150 114 200 104 L 200 120 L 0 120 Z" fill="#7E9AAE" opacity="0.5"/>
  <path d="M 0 128 Q 60 120 120 126 Q 160 130 200 124 L 200 138 L 0 138 Z" fill="#5E7E96" opacity="0.4"/>

  <!-- 古松（右侧苍苍） -->
  <g fill="#2E4E3E" opacity="0.85">
    <path d="M 168 60 Q 164 86 168 108 Q 172 124 174 138 Q 170 110 174 92 Q 176 74 168 60 Z"/>
    <path d="M 168 60 Q 156 50 148 54 Q 156 56 158 62 Z" fill="#3A6A4E"/>
    <path d="M 168 60 Q 180 48 186 52 Q 178 58 174 62 Z" fill="#3A6A4E"/>
    <path d="M 168 64 Q 184 66 186 78 Q 178 72 172 70 Z" fill="#3A6A4E"/>
  </g>

  <!-- 水面（底部，倒影所在） -->
  <path d="M 0 162 Q 50 158 100 160 Q 150 162 200 158 L 200 200 L 0 200 Z" fill="#3E5C8E" opacity="0.7"/>

  <!-- 水面倒影（角色下方淡蓝光斑） -->
  <path d="M 84 164 Q 100 158 116 164 Q 112 178 100 180 Q 88 178 84 164 Z" fill="#7EA8E0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3.4s" repeatCount="indefinite"/>
  </path>

  <!-- 仙杏（地上两颗，缘起） -->
  <ellipse cx="64" cy="156" rx="4" ry="3.4" fill="#F5D742"/>
  <ellipse cx="72" cy="160" rx="4" ry="3.4" fill="#E8C04A"/>

  <!-- 少年雷震子（青布道袍，鸟面，回望水面） -->
  <!-- 道袍身体 -->
  <path d="M 84 92 Q 78 110 82 134 Q 100 144 118 134 Q 122 110 116 92 Q 100 84 84 92 Z" fill="url(#robe)"/>
  <path d="M 100 92 L 100 138" stroke="#3E5C70" stroke-width="1.2" opacity="0.6"/>
  <!-- 手臂（一手拄棍） -->
  <path d="M 114 100 Q 124 108 128 120" fill="none" stroke="url(#robe)" stroke-width="6" stroke-linecap="round"/>

  <!-- 头（鸟面，回望水面微侧） -->
  <use href="#leizhenzi-face" transform="translate(100,74) scale(1.02) rotate(-8)"/>

  <!-- 双翅初展（比五阶小） -->
  <g fill="url(#wing)" stroke="#2E4E8E" stroke-width="0.8">
    <path d="M 84 92 Q 62 84 54 90 Q 62 102 82 100 Z"/>
    <path d="M 84 100 Q 60 96 52 104 Q 60 114 82 108 Z"/>
    <path d="M 84 108 Q 62 108 56 116 Q 64 124 82 116 Z"/>
    <path d="M 116 92 Q 138 84 146 90 Q 138 102 118 100 Z"/>
    <path d="M 116 100 Q 140 96 148 104 Q 140 114 118 108 Z"/>
    <path d="M 116 108 Q 138 108 144 116 Q 136 124 118 116 Z"/>
  </g>
  <!-- 翅根风雷金圈 -->
  <circle cx="88" cy="98" r="6" fill="#F5D742" opacity="0.95">
    <animate attributeName="r" values="6;7;6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="112" cy="98" r="6" fill="#F5D742" opacity="0.95">
    <animate attributeName="r" values="6;7;6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 翅上雷纹 -->
  <path d="M 86 95 L 90 98 L 87.5 98 L 90 101 L 88 98.5 L 87 99 Z" fill="#2E4488"/>
  <path d="M 114 95 L 110 98 L 112.5 98 L 110 101 L 112 98.5 L 113 99 Z" fill="#2E4488"/>

  <!-- 黄金棍（拄地，初得） -->
  <line x1="132" y1="96" x2="128" y2="160" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="127" y="92" width="9" height="5" rx="2" fill="#C8901E"/>
  <rect x="126" y="158" width="9" height="5" rx="2" fill="#C8901E"/>

  <!-- 风雷金光流转（翅缘微光） -->
  <g fill="none" stroke="#F5D742" stroke-width="1" opacity="0.55">
    <path d="M 54 90 Q 60 80 70 78">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 146 90 Q 140 80 130 78">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 光尘 -->
  <g fill="#F5D742">
    <circle cx="46" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
