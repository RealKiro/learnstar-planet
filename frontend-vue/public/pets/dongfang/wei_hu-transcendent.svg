<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="韦护·六阶·杵化慈悲·怒目即菩萨护安睡小兽">
  <defs>
    <!-- 背景：暮色山门 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E6E9E"/>
      <stop offset="52%" stop-color="#5E4E82"/>
      <stop offset="100%" stop-color="#3E3662"/>
    </linearGradient>
    <!-- 柔月金光 -->
    <radialGradient id="moon" cx="76%" cy="30%" r="34%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 胸前玉杵温润 -->
    <radialGradient id="jade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8FFE0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A8E0A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 金身便装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C8A0"/>
      <stop offset="100%" stop-color="#A88A5E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：韦陀方脸·剑眉舒展·怒目含慈·嘴角慈悲 -->
    <g id="weihu-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.9"/>
      <!-- 束发 -->
      <path d="M -5 -10 Q 0 -13 5 -10 Q 3 -14 0 -14 Q -3 -14 -5 -10 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -10 -4 Q -6 -9 0 -9 Q 6 -9 10 -4 Q 6 -8 0 -8 Q -6 -8 -10 -4 Z" fill="#2E2620"/>
      <!-- 剑眉舒展 -->
      <path d="M -9 -1.6 Q -5.5 -3.6 -2 -2.6 M 9 -1.6 Q 5.5 -3.6 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 怒目含慈 -->
      <ellipse cx="-5" cy="0.5" rx="2.2" ry="1.8" fill="#1E1008"/>
      <ellipse cx="5" cy="0.5" rx="2.2" ry="1.8" fill="#1E1008"/>
      <circle cx="-5.5" cy="-0.3" r="0.8" fill="#FFF7E0"/>
      <circle cx="4.5" cy="-0.3" r="0.8" fill="#FFF7E0"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 嘴角慈悲（微扬） -->
      <path d="M -3.2 6.4 Q 0 7.8 3.2 6.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月轮 -->
  <circle cx="152" cy="60" r="44" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="60" r="13" fill="#FFF7E0" opacity="0.9">
    <animate attributeName="r" values="13;15;13" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 苍山如黛 -->
  <path d="M 0 150 Q 40 132 90 142 Q 140 150 200 138 L 200 200 L 0 200 Z" fill="#3E364E" opacity="0.85"/>

  <!-- 山门石阶 -->
  <path d="M 40 164 L 160 156 L 168 174 L 30 174 Z" fill="#4E4664"/>
  <path d="M 40 164 L 160 156" stroke="#6E6284" stroke-width="1.6" opacity="0.6"/>

  <!-- 阶前安睡小兽（度化锚点，柔光护佑） -->
  <g>
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    <!-- 小兽（蜷睡小狐/小鹿） -->
    <path d="M 148 162 Q 152 156 158 158 Q 164 160 164 166 Q 164 172 158 173 Q 152 174 148 168 Q 146 164 148 162 Z" fill="#9AA0B8" stroke="#7E84A0" stroke-width="0.8"/>
    <path d="M 152 162 Q 152 158 154 156 Q 156 158 156 161 Z" fill="#9AA0B8"/>
    <path d="M 158 160 Q 158 157 160 156 Q 161 158 161 161 Z" fill="#9AA0B8"/>
    <!-- 小兽安睡闭眼 -->
    <path d="M 153 163 Q 154 164 155 163 M 158 163 Q 159 164 160 163" stroke="#6E728E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 尾巴蜷 -->
    <path d="M 164 168 Q 166 164 163 162" stroke="#7E84A0" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 护佑柔光（自胸前玉杵漫下） -->
  <path d="M 100 88 Q 120 112 148 146" fill="none" stroke="#FFF7E0" stroke-width="1.8" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 韦陀便装（金光内敛，背对落日） -->
  <!-- 腿 -->
  <path d="M 88 130 L 84 154 L 90 154 L 94 132 Z" fill="#A88A5E"/>
  <path d="M 106 130 L 114 156 L 108 156 L 102 132 Z" fill="#A88A5E"/>
  <!-- 便服下摆 -->
  <path d="M 86 122 Q 98 132 110 124 Q 114 118 110 110 Q 104 122 96 118 Q 88 122 86 122 Z" fill="url(#robe)"/>
  <!-- 上身 -->
  <path d="M 88 88 Q 84 104 90 122 Q 100 128 110 122 Q 116 104 112 88 Q 100 82 88 88 Z" fill="url(#robe)" stroke="#8E7248" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#FFF7E0" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#weihu-face" transform="translate(100,80) scale(1)"/>

  <!-- 左臂竖掌（慈印） -->
  <path d="M 90 92 C 82 98 78 104 78 114" fill="none" stroke="#D8C8A0" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="77" cy="116" r="3.4" fill="#DCC4A0"/>

  <!-- 右臂（降魔杵化作胸前玉杵） -->
  <path d="M 108 92 C 116 96 118 102 116 110" fill="none" stroke="#D8C8A0" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 胸前玉杵（温润如月） -->
  <g>
    <path d="M 100 96 L 106 88 L 108 96 Z" fill="#B8E0B8" stroke="#8EBC8E" stroke-width="1"/>
    <path d="M 102 92 L 105 95 L 103 96 L 100 93 Z" fill="#D8F0D8"/>
    <circle cx="104" cy="94" r="9" fill="url(#jade)">
      <animate attributeName="r" values="9;13;9" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 柔月金光粒子 -->
  <g fill="#FFF7E0">
    <circle cx="46" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="44">
      <animate attributeName="cy" values="44;34;44" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
