<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雷震子·二阶·西岐王孙·文王百子">
  <defs>
    <!-- 背景：青灰+暖黄晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4CDD6"/>
      <stop offset="60%" stop-color="#E4D5B0"/>
      <stop offset="100%" stop-color="#CBB67F"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#F2C878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F2C878" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloth" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#8E9AA8"/>
      <stop offset="100%" stop-color="#5E6E80"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="148" cy="52" r="70" fill="url(#sun)"/>

  <!-- 宫苑檐角（远处，青瓦） -->
  <path d="M 0 0 L 200 0 L 200 26 L 150 18 L 150 26 L 112 20 L 74 26 L 74 18 L 0 26 Z" fill="#5E6E80" opacity="0.5"/>
  <path d="M 112 20 Q 116 28 108 34 Q 112 26 108 24 Z" fill="#7A8896" opacity="0.5"/>

  <!-- 地面 -->
  <rect x="0" y="150" width="200" height="50" fill="#C9B687" opacity="0.65"/>
  <path d="M 0 150 L 200 150" stroke="#B4A273" stroke-width="2" opacity="0.5"/>

  <!-- 城门石狮（右下，蹲坐） -->
  <g fill="#9A8A70" opacity="0.9">
    <path d="M 152 138 Q 144 128 146 118 Q 152 114 158 118 Q 160 128 154 138 Z"/>
    <circle cx="147" cy="116" r="4"/>
    <circle cx="158" cy="116" r="4"/>
    <path d="M 150 122 L 152 126 L 154 122 Z" fill="#8A7A60"/>
    <path d="M 146 138 L 160 138 L 160 146 L 146 146 Z"/>
  </g>

  <!-- 少年雷震子（普通童面，蹲身抱石锁） -->
  <!-- 身体（素色布衣，蹲姿） -->
  <path d="M 76 142 Q 72 116 84 108 L 92 108 Q 100 118 98 142 Z" fill="url(#cloth)" stroke="#4E5E70" stroke-width="1"/>
  <!-- 腿（蹲） -->
  <path d="M 76 136 Q 68 146 72 152 L 88 152 Q 88 146 82 140 Z" fill="#5E6E80"/>
  <!-- 手臂（抱向石锁） -->
  <path d="M 88 118 Q 102 122 110 132" fill="none" stroke="url(#cloth)" stroke-width="7" stroke-linecap="round"/>

  <!-- 石锁（哑铃） -->
  <rect x="104" y="142" width="34" height="5" rx="2" fill="#7A7A76"/>
  <rect x="100" y="136" width="9" height="16" rx="3" fill="#6E6E6A"/>
  <rect x="133" y="136" width="9" height="16" rx="3" fill="#6E6E6A"/>
  <path d="M 104 143 L 138 143" stroke="#5E5E5A" stroke-width="1.5"/>

  <!-- 头（普通童面） -->
  <circle cx="88" cy="102" r="11" fill="url(#skin)"/>
  <!-- 总角（双髻） -->
  <circle cx="81" cy="88" r="4.6" fill="#2E2620"/>
  <circle cx="95" cy="88" r="4.6" fill="#2E2620"/>
  <path d="M 77 92 Q 88 84 99 92 Q 88 96 77 92 Z" fill="#2E2620"/>
  <!-- 眼（黑亮） -->
  <circle cx="83" cy="102" r="2.2" fill="#1A140F"/>
  <circle cx="93" cy="102" r="2.2" fill="#1A140F"/>
  <!-- 眉 -->
  <path d="M 81 96 Q 83 95 85 96 M 91 96 Q 93 95 95 96" fill="none" stroke="#3A3028" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 红晕 + 笑嘴 -->
  <circle cx="79" cy="105" r="2" fill="#E8A080" opacity="0.6"/>
  <circle cx="97" cy="105" r="2" fill="#E8A080" opacity="0.6"/>
  <path d="M 86 108 Q 88 110 90 108" fill="none" stroke="#7A5A42" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 眉心雷纹（淡淡的，似有若无） -->
  <path d="M 88 94 L 89 96 L 87.6 96.2 L 88 98" fill="none" stroke="#E8C07A" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>

  <!-- 晨光尘 -->
  <g fill="#F2C878">
    <circle cx="42" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="106">
      <animate attributeName="cy" values="106;98;106" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
