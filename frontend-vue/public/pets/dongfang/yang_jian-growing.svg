<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨戬·三阶·劈山救母·一刀开山">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#5B3A2E"/>
      <stop offset="55%" stop-color="#3A2418"/>
      <stop offset="100%" stop-color="#1E1210"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>

    <g id="yangjian-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 天眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 桃山裂开（两半） -->
  <path d="M 30 40 Q 60 80 56 140 L 60 200 L 20 200 Q 24 120 30 40 Z" fill="#4A3A28" opacity="0.9"/>
  <path d="M 170 36 Q 140 78 146 142 L 142 200 L 182 200 Q 178 118 170 36 Z" fill="#3E3020" opacity="0.9"/>
  <!-- 裂口金光（母出） -->
  <circle cx="100" cy="110" r="46" fill="url(#burst)">
    <animate attributeName="r" values="46;56;46" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 母亲身影（光中得见天日） -->
  <g opacity="0.8">
    <path d="M 92 70 Q 88 86 92 102 Q 100 110 108 102 Q 112 86 108 70 Q 100 64 92 70 Z" fill="#FFF7D6" opacity="0.6"/>
    <path d="M 94 102 L 100 120 L 106 102" fill="none" stroke="#FFF7D6" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- 天光破云 -->
  <g stroke="#F5D742" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M 60 40 L 52 28"/><path d="M 140 40 L 148 28"/>
    <path d="M 100 20 L 100 30"/>
  </g>

  <!-- 角色：银甲杨戬持刀立于山前 -->
  <!-- 银甲身体 -->
  <path d="M 76 90 Q 68 106 72 128 Q 86 140 100 126 Q 104 108 100 92 Q 90 84 76 90 Z" fill="url(#armor)"/>
  <path d="M 88 88 L 88 130" stroke="#A8A49C" stroke-width="1.4" opacity="0.8"/>
  <!-- 头（基础脸，天眼怒张） -->
  <use href="#yangjian-face" transform="translate(86,80) scale(1)"/>
  <!-- 银冠束发 -->
  <path d="M 74 66 Q 86 58 98 64 L 96 56 Q 84 50 76 56 Z" fill="#D8D4CC" opacity="0.95"/>

  <!-- 天眼怒张神光（放光柱） -->
  <g>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 84 48 L 88 28 L 92 48 Z" fill="#FFC24A" opacity="0.7"/>
  </g>

  <!-- 手臂（持刀挥劈） -->
  <path d="M 88 96 C 100 100 110 104 116 110" fill="none" stroke="url(#armor)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="118" cy="113" r="4" fill="#DCC4A0"/>

  <!-- 三尖两刃刀（劈山） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 120 40;2 120 40;-4 120 40" dur="1.4s" repeatCount="indefinite"/>
    <line x1="108" y1="124" x2="132" y2="34" stroke="#D8D4CC" stroke-width="4" stroke-linecap="round"/>
    <path d="M 132 34 L 138 20 L 132 26 L 142 16 L 132 30 Z" fill="#F0EEE8"/>
    <path d="M 132 34 L 124 26 L 132 30 L 126 40 Z" fill="#F0EEE8"/>
  </g>

  <!-- 碎石迸裂 -->
  <g fill="#4A3A28">
    <circle cx="70" cy="150" r="3"><animate attributeName="cy" values="150;158;150" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="146" r="2.4"><animate attributeName="cy" values="146;154;146" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
