<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="太上老君·三阶·太清炼丹·八卦炉九转金丹">
  <defs>
    <!-- 背景：兜率宫云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E6E9E"/>
      <stop offset="52%" stop-color="#6E4E82"/>
      <stop offset="100%" stop-color="#4E3662"/>
    </linearGradient>
    <!-- 炉火红 -->
    <radialGradient id="fire" cx="50%" cy="62%" r="52%">
      <stop offset="0%" stop-color="#F58A3E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F58A3E" stop-opacity="0"/>
    </radialGradient>
    <!-- 金丹金 -->
    <radialGradient id="dan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫金道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EB8"/>
      <stop offset="100%" stop-color="#5E4E8E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="100%" stop-color="#E0C8A8"/>
    </radialGradient>

    <!-- 头部模板：童颜鹤发·眉目含丹意·眼含炉火之光（脸中心 0,0） -->
    <g id="laojun-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#D0B890" stroke-width="0.9"/>
      <!-- 白发 -->
      <path d="M -5 -8 Q 0 -11 5 -8 Q 3 -12 0 -12 Q -3 -12 -5 -8 Z" fill="#E8E4DC"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8.5 0 -8.5 Q 5 -8.5 9 -3.5 Q 5 -7.5 0 -7.5 Q -5 -7.5 -9 -3.5 Z" fill="#E8E4DC"/>
      <!-- 眉目含丹意 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#B8B0A8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 眼含炉火之光 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.1" fill="#1E1814"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.1" fill="#1E1814"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF3C4"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF3C4"/>
      <circle cx="-4.6" cy="0.4" r="0.6" fill="#F58A3E"/>
      <circle cx="4.6" cy="0.4" r="0.6" fill="#F58A3E"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.4" stroke="#D0B890" stroke-width="1" stroke-linecap="round"/>
      <!-- 白须 -->
      <path d="M -4.5 6 Q -2 8.2 0 6.4 M 0 6.4 Q 2 8.2 4.5 6" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 含笑 -->
      <path d="M -3.4 5 Q 0 6.6 3.4 5" fill="none" stroke="#A89070" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 宫阙云海（背景） -->
  <path d="M 0 134 Q 50 126 100 132 Q 150 138 200 130 L 200 200 L 0 200 Z" fill="#4E3662" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- 八卦炉 -->
  <g>
    <circle cx="100" cy="150" r="46" fill="url(#fire)">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 炉身 -->
    <path d="M 72 108 Q 66 122 72 140 Q 80 156 100 158 Q 120 156 128 140 Q 134 122 128 108 Q 100 98 72 108 Z" fill="#6E4E3E" stroke="#8E6A4E" stroke-width="1.4"/>
    <!-- 炉膛口（炉火） -->
    <ellipse cx="100" cy="140" rx="18" ry="9" fill="#2E1E16"/>
    <path d="M 82 140 Q 100 128 118 140" fill="#F58A3E" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <g stroke="#F58A3E" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <path d="M 88 136 Q 84 130 88 126 Q 92 122 88 118">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 112 138 Q 116 132 112 128 Q 108 124 112 120">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 炉耳 -->
    <path d="M 74 118 Q 68 122 72 130" fill="none" stroke="#8E6A4E" stroke-width="2.4"/>
    <path d="M 126 118 Q 132 122 128 130" fill="none" stroke="#8E6A4E" stroke-width="2.4"/>
    <!-- 八卦纹 -->
    <circle cx="100" cy="150" r="8" fill="none" stroke="#B8964E" stroke-width="1" opacity="0.8"/>
    <path d="M 100 142 L 100 158 M 92 150 L 108 150" stroke="#B8964E" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- 九转金丹（炉顶，丹光流转） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="100" cy="88" r="8" fill="#FFE066" stroke="#E8B64C" stroke-width="1.2"/>
    <circle cx="100" cy="88" r="18" fill="url(#dan)">
      <animate attributeName="r" values="18;24;18" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 丹光映天 -->
    <g stroke="#FFE066" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
      <path d="M 100 60 L 100 48"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M 82 66 L 74 58"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/></path>
      <path d="M 118 66 L 126 58"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- 白发道祖（炉前执扇炼丹） -->
  <!-- 腿 -->
  <path d="M 52 132 L 48 156 L 54 156 L 58 134 Z" fill="#5E4E8E"/>
  <path d="M 68 132 L 76 158 L 70 158 L 64 134 Z" fill="#5E4E8E"/>
  <!-- 紫金道袍 -->
  <path d="M 52 96 Q 48 110 54 132 Q 62 138 70 132 Q 76 110 72 96 Q 62 90 52 96 Z" fill="url(#robe)" stroke="#4E3E7E" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 52 114 L 72 114" stroke="#E8D8A8" stroke-width="1.4"/>

  <!-- 头（面部模板，面向炉） -->
  <use href="#laojun-face" transform="translate(62,88) scale(1)"/>

  <!-- 左臂持芭蕉扇（扇炉） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 58 98;4 58 98;-5 58 98" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 58 98 C 52 100 48 102 46 108" fill="none" stroke="#7E6E9E" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="45" cy="110" r="3" fill="#E0C8A8"/>
    <!-- 芭蕉扇 -->
    <path d="M 44 106 Q 34 104 32 112 Q 34 120 44 118 Q 50 114 46 108 Z" fill="#6EA878" stroke="#4E885E" stroke-width="1"/>
  </g>

  <!-- 右臂抚炉（点化丹炉） -->
  <path d="M 70 98 C 78 100 84 104 88 110" fill="none" stroke="#7E6E9E" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="90" cy="112" r="3" fill="#E0C8A8"/>

  <!-- 丹火星尘 -->
  <g fill="#FFE066">
    <circle cx="120" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
