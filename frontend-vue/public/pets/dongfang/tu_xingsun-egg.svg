<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="土行孙·一阶·夹龙山童·踩高跷扫地">
  <defs>
    <!-- 背景：夹龙山云雾 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A8A72"/>
      <stop offset="55%" stop-color="#7E6E5A"/>
      <stop offset="100%" stop-color="#5E5042"/>
    </linearGradient>
    <!-- 山间暖黄晨光 -->
    <radialGradient id="glow" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰布短打 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A89E8E"/>
      <stop offset="100%" stop-color="#7E7464"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="80" r="88" fill="url(#glow)"/>

  <!-- 远山 -->
  <path d="M 0 120 Q 40 96 90 108 Q 140 118 200 104 L 200 200 L 0 200 Z" fill="#5E5042" opacity="0.6"/>
  <path d="M 0 150 Q 50 134 110 142 Q 160 148 200 138 L 200 200 L 0 200 Z" fill="#4E4034" opacity="0.7"/>

  <!-- 仙云 -->
  <g opacity="0.65">
    <path d="M 0 92 Q 28 82 52 90 Q 66 98 54 106 Q 34 114 10 104 Q 0 100 0 92 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 夹龙山飞云洞（右上） -->
  <path d="M 138 74 Q 132 96 140 120 Q 146 134 152 146 L 200 146 L 200 74 Z" fill="#6E6254"/>
  <ellipse cx="158" cy="108" rx="14" ry="10" fill="#2E2822"/>
  <path d="M 144 104 Q 158 96 172 104 Q 158 112 144 104 Z" fill="#3A342C"/>
  <!-- 洞顶古藤 -->
  <path d="M 146 96 Q 152 88 150 82" stroke="#4E5034" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- 山门石阶 -->
  <path d="M 30 168 L 120 158 L 132 178 L 18 178 Z" fill="#5E5042"/>
  <path d="M 30 168 L 120 158" stroke="#6E6254" stroke-width="1.6" opacity="0.6"/>

  <!-- 矮小道童（2.5头身，踩高跷扫地） -->
  <!-- 高跷腿 -->
  <line x1="80" y1="138" x2="76" y2="170" stroke="#6E5A3E" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="140" x2="112" y2="172" stroke="#6E5A3E" stroke-width="3" stroke-linecap="round"/>
  <!-- 短打裤 -->
  <path d="M 78 122 L 76 138 L 84 138 L 84 122 Z" fill="url(#cloth)"/>
  <path d="M 102 124 L 106 140 L 98 140 L 98 124 Z" fill="url(#cloth)"/>
  <!-- 身体（矮胖道童） -->
  <path d="M 80 92 Q 76 108 80 122 Q 92 130 104 122 Q 110 108 104 92 Q 92 86 80 92 Z" fill="url(#cloth)" stroke="#5E5242" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 80 112 L 104 112" stroke="#8E7A4E" stroke-width="1.8"/>
  <!-- 左臂（平衡） -->
  <path d="M 82 96 C 74 100 72 106 74 114" fill="none" stroke="url(#cloth)" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 右臂持短扫帚 -->
  <path d="M 102 96 C 108 100 112 106 112 114" fill="none" stroke="url(#cloth)" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M 112 114 L 116 128" stroke="#8E7A4E" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 108 128 L 120 128" stroke="#8E7A4E" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 头（圆脸胖腮，扎小髻） -->
  <circle cx="92" cy="84" r="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 小髻 -->
  <circle cx="92" cy="74" r="4" fill="#2E2620"/>
  <!-- 额发 -->
  <path d="M 82 82 Q 86 77 92 77 Q 98 77 102 82 Q 98 78 92 78 Q 86 78 82 82 Z" fill="#2E2620"/>
  <!-- 细眉眯眼（机灵相） -->
  <path d="M 85 82 Q 88 81 91 81.5 M 93 81.5 Q 96 81 99 82" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M 86 85 Q 88 87 90 85.5 M 94 85.5 Q 96 87 98 85" stroke="#1E1008" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- 蒜头鼻 -->
  <circle cx="92" cy="89" r="2" fill="#E0C0A0"/>
  <!-- 咧嘴笑 -->
  <path d="M 86 94 Q 92 98 98 94" fill="none" stroke="#B06A4A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 扫地扬尘 -->
  <g fill="#A89E8E" opacity="0.6">
    <circle cx="112" cy="124">
      <animate attributeName="cy" values="124;116;124" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="130">
      <animate attributeName="cy" values="130;122;130" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 山间金尘 -->
  <g fill="#E8C07A">
    <circle cx="46" cy="110">
      <animate attributeName="cy" values="110;102;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="60">
      <animate attributeName="cy" values="60;52;60" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
