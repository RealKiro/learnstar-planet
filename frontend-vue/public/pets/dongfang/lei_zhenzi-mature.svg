<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雷震子·四阶·潼关救主·雷翼护主">
  <defs>
    <!-- 背景：玄黑深红雷夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1420"/>
      <stop offset="55%" stop-color="#52182A"/>
      <stop offset="100%" stop-color="#241018"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E9CF0"/>
      <stop offset="100%" stop-color="#3E5CB0"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A7CC8"/>
      <stop offset="100%" stop-color="#24408A"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8B4C8"/>
      <stop offset="100%" stop-color="#5E6E8E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C8901E"/>
    </linearGradient>

    <g id="leizhenzi-face">
      <ellipse cx="0" cy="0" rx="16" ry="15" fill="url(#faceBlue)" stroke="#2E4488" stroke-width="1"/>
      <path d="M -15 -3 Q -14 -15 -5 -15 Q 0 -14 5 -15 Q 14 -15 15 -3 Q 8 -9 0 -8 Q -8 -9 -15 -3 Z" fill="#D84A2A"/>
      <path d="M -15 -2 Q -17 4 -14 8 Q -13 3 -15 -2 Z" fill="#D84A2A"/>
      <path d="M 15 -2 Q 17 4 14 8 Q 13 3 15 -2 Z" fill="#D84A2A"/>
      <path d="M -13 -9 Q -9 -11 -6 -10 M 13 -9 Q 9 -11 6 -10" fill="none" stroke="#B0402A" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M -12 -4 L -6 -7 L -6 0 Z" fill="#FFF8E0" stroke="#B0402A" stroke-width="0.8"/>
      <path d="M 12 -4 L 6 -7 L 6 0 Z" fill="#FFF8E0" stroke="#B0402A" stroke-width="0.8"/>
      <circle cx="-9" cy="-3" r="1.5" fill="#F5D742"/>
      <circle cx="9" cy="-3" r="1.5" fill="#F5D742"/>
      <path d="M 0 -12 L 1.4 -9 L -1.4 -8.6 L 0 -5.5" fill="none" stroke="#F5D742" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M -3.5 3 Q 0 8.5 3.5 3 L 0 5 Z" fill="#E8A83A" stroke="#C0802A" stroke-width="0.7"/>
      <path d="M -5 7 L -4 10.5 L -3 7 Z" fill="#FFFDF2"/>
      <path d="M 5 7 L 4 10.5 L 3 7 Z" fill="#FFFDF2"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="74" r="90" fill="url(#glow)">
    <animate attributeName="opacity" values="1;0.6;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雷云（背景翻滚） -->
  <g opacity="0.5">
    <path d="M 0 40 Q 40 30 80 38 Q 120 46 160 36 Q 180 32 200 40 L 200 60 L 0 60 Z" fill="#4A1E2C">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 20 Q 50 10 100 18 Q 150 26 200 16 L 200 34 L 0 34 Z" fill="#5A2436" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 闪电（闪烁） -->
  <g stroke="#E8F4FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 40 16 L 52 34 L 44 34 L 58 56">
      <animate attributeName="opacity" values="0.85;0.1;0.85" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 170 22 L 158 44 L 166 44 L 152 68">
      <animate attributeName="opacity" values="0.1;0.85;0.1" dur="2.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 潼关城楼（底部剪影） -->
  <path d="M 34 150 L 34 132 L 44 132 L 44 150 M 64 150 L 64 126 L 76 126 L 76 150 M 120 150 L 120 130 L 132 130 L 132 150 M 158 150 L 158 134 L 170 134 L 170 150 L 200 150 L 200 200 L 0 200 L 0 150 Z" fill="#1A0C12" opacity="0.9"/>
  <path d="M 34 150 L 170 150" stroke="#3A1420" stroke-width="3"/>

  <!-- 追兵虚影（旗/枪尖） -->
  <g opacity="0.5" fill="#2A1220">
    <path d="M 20 200 L 26 156 L 30 156 L 36 200 Z"/>
    <path d="M 18 160 L 34 160 L 34 164 L 18 164 Z"/>
    <path d="M 182 200 L 174 158 L 178 158 L 188 200 Z"/>
    <path d="M 170 162 L 186 162 L 186 166 L 170 166 Z"/>
  </g>

  <!-- 角色：雷震子展翅负父，银蓝战袍 -->
  <!-- 负于背后的文王（白发老者，伏卧） -->
  <g opacity="0.95">
    <ellipse cx="132" cy="50" rx="8" ry="7" fill="#E8D8BC"/>
    <path d="M 126 42 Q 132 36 140 42 Q 138 46 132 46 Q 126 46 126 42 Z" fill="#F0EEE8"/>
    <path d="M 122 48 Q 126 54 132 56 Q 138 54 142 48" fill="none" stroke="#F5F2EA" stroke-width="3" stroke-linecap="round"/>
    <path d="M 128 44 Q 132 46 136 44" fill="none" stroke="#8A7A5E" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 雷震子身体（倾斜飞翔，银蓝战袍） -->
  <path d="M 86 90 Q 80 116 96 138 Q 112 130 114 106 Q 112 92 86 90 Z" fill="url(#armor)"/>
  <path d="M 96 92 L 100 134" stroke="#4E5E7E" stroke-width="1.2" opacity="0.7"/>
  <!-- 负父的手（向后托住文王） -->
  <path d="M 114 96 Q 124 90 128 72" fill="none" stroke="#DCC4A0" stroke-width="4" stroke-linecap="round"/>

  <!-- 头（鸟面） -->
  <use href="#leizhenzi-face" transform="translate(100,66) scale(1.05) rotate(6)"/>

  <!-- 双翅全开 -->
  <g fill="url(#wing)" stroke="#24408A" stroke-width="0.9">
    <path d="M 82 84 Q 52 62 38 66 Q 46 84 76 90 Z"/>
    <path d="M 80 92 Q 46 80 32 84 Q 40 100 74 100 Z"/>
    <path d="M 78 100 Q 44 96 32 102 Q 42 116 72 108 Z"/>
    <path d="M 76 108 Q 46 110 38 118 Q 48 128 72 116 Z"/>
    <path d="M 118 84 Q 148 62 162 66 Q 154 84 124 90 Z"/>
    <path d="M 120 92 Q 154 80 168 84 Q 160 100 126 100 Z"/>
    <path d="M 122 100 Q 156 96 168 102 Q 158 116 128 108 Z"/>
    <path d="M 124 108 Q 154 110 162 118 Q 152 128 128 116 Z"/>
  </g>
  <circle cx="86" cy="92" r="6" fill="#F5D742" opacity="0.95">
    <animate attributeName="r" values="6;7.5;6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="114" cy="92" r="6" fill="#F5D742" opacity="0.95">
    <animate attributeName="r" values="6;7.5;6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 84 89 L 88 92 L 85.5 92 L 88 95 L 86 92.5 L 85 93 Z" fill="#2E4488"/>
  <path d="M 116 89 L 112 92 L 114.5 92 L 112 95 L 114 92.5 L 115 93 Z" fill="#2E4488"/>

  <!-- 黄金棍（斜指城下，荡开箭雨） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 112 104;-1 112 104;-4 112 104" dur="2.2s" repeatCount="indefinite"/>
    <line x1="112" y1="104" x2="152" y2="148" stroke="url(#gold)" stroke-width="3.6" stroke-linecap="round"/>
    <rect x="107" y="99" width="9" height="5" rx="2" fill="#C8901E" transform="rotate(45 111 101)"/>
    <rect x="147" y="143" width="9" height="5" rx="2" fill="#C8901E" transform="rotate(45 151 145)"/>
    <!-- 棍头金光 -->
    <circle cx="153" cy="149" r="5" fill="#F5D742" opacity="0.5">
      <animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 身侧雷光如蛇 -->
  <g stroke="#B8D8FF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 40 88 Q 50 96 44 108 Q 40 116 46 124">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 160 92 Q 150 102 156 114 Q 162 122 156 130">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
