<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="韦护·四阶·护法先锋·金光如幢护法台">
  <defs>
    <!-- 背景：两军阵前 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A2E"/>
      <stop offset="52%" stop-color="#3E2418"/>
      <stop offset="100%" stop-color="#241210"/>
    </linearGradient>
    <!-- 护法金光如幢 -->
    <radialGradient id="canopy" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 敌军妖法 -->
    <radialGradient id="evil" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#6E3A6E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6E3A6E" stop-opacity="0"/>
    </radialGradient>
    <!-- 护法金甲 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D880"/>
      <stop offset="100%" stop-color="#B8964E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：方脸·剑眉怒目·眼如金刚 -->
    <g id="weihu-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.9"/>
      <!-- 束发 -->
      <path d="M -5 -10 Q 0 -13 5 -10 Q 3 -14 0 -14 Q -3 -14 -5 -10 Z" fill="#2E2620"/>
      <!-- 额发 -->
      <path d="M -10 -4 Q -6 -9 0 -9 Q 6 -9 10 -4 Q 6 -8 0 -8 Q -6 -8 -10 -4 Z" fill="#2E2620"/>
      <!-- 剑眉怒 -->
      <path d="M -9 -2.5 Q -5.5 -4 -2 -3 M 9 -2.5 Q 5.5 -4 2 -3" stroke="#1E1008" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- 怒目如金刚 -->
      <ellipse cx="-5" cy="0.5" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="5" cy="0.5" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.5" cy="-0.3" r="0.8" fill="#FFE9A8"/>
      <circle cx="4.5" cy="-0.3" r="0.8" fill="#FFE9A8"/>
      <!-- 鼻梁挺 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇线坚毅 -->
      <path d="M -3.2 6.4 Q 0 7 3.2 6.4" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 敌军妖法（右上黑紫气） -->
  <circle cx="160" cy="80" r="60" fill="url(#evil)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 148 60 Q 140 66 144 74 Q 152 80 158 72 Q 160 64 152 62 Z" fill="#4E2E4E" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 战火旌旗 -->
  <g opacity="0.8">
    <path d="M 20 24 L 20 118" stroke="#2E241C" stroke-width="2.2"/>
    <path d="M 20 24 L 52 32 L 20 42 Z" fill="#B8432E">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 176 26 L 176 100" stroke="#2E241C" stroke-width="2.2"/>
    <path d="M 176 26 L 148 32 L 176 44 Z" fill="#3A4E78">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 军阵（远处剪影） -->
  <g opacity="0.3">
    <path d="M 44 120 Q 46 110 50 108 Q 54 110 54 120 Z" fill="#1A1410"/>
    <path d="M 62 122 Q 63 112 67 110 Q 71 112 70 122 Z" fill="#1E1612"/>
    <path d="M 126 120 Q 128 110 132 108 Q 136 110 136 120 Z" fill="#1A1410"/>
    <path d="M 144 122 Q 145 112 149 110 Q 153 112 152 122 Z" fill="#1E1612"/>
  </g>

  <!-- 护法高台 -->
  <path d="M 80 128 L 120 128 L 128 146 L 72 146 Z" fill="#5A3A2E"/>
  <path d="M 80 128 L 120 128" stroke="#7E5A48" stroke-width="1.6" opacity="0.7"/>
  <!-- 姜子牙法台（台后） -->
  <path d="M 96 116 L 104 116 L 106 128 L 94 128 Z" fill="#8E7A4E" opacity="0.8"/>

  <!-- 护法金光如幢 -->
  <circle cx="100" cy="88" r="78" fill="url(#canopy)">
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 光幢边缘 -->
  <path d="M 40 118 Q 30 100 36 78 Q 44 58 66 50" fill="none" stroke="#FFE9A8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 160 118 Q 170 100 164 78 Q 156 58 134 50" fill="none" stroke="#FFE9A8" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- 敌军妖法被金光挡住四散 -->
  <g opacity="0.5">
    <path d="M 120 40 Q 128 48 124 56 Q 118 60 114 52 Z" fill="#6E3A6E">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 60 Q 138 62 138 70 Q 130 72 128 66 Z" fill="#6E3A6E">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 金甲护法（7头身，手持降魔杵，巍然） -->
  <!-- 腿 -->
  <path d="M 88 126 L 84 148 L 90 148 L 94 128 Z" fill="#A8904E"/>
  <path d="M 106 126 L 114 150 L 108 150 L 102 128 Z" fill="#A8904E"/>
  <!-- 金甲下摆 -->
  <path d="M 86 118 Q 98 128 110 120 Q 114 114 110 106 Q 104 118 96 114 Q 88 118 86 118 Z" fill="url(#armor)"/>
  <!-- 金甲上身 -->
  <path d="M 88 88 Q 84 102 90 118 Q 100 124 110 118 Q 116 102 112 88 Q 100 82 88 88 Z" fill="url(#armor)" stroke="#8E7032" stroke-width="1"/>
  <path d="M 92 92 L 96 114 M 104 92 L 100 114" stroke="#E8C860" stroke-width="1" opacity="0.7"/>
  <!-- 肩甲 -->
  <circle cx="87" cy="90" r="4.4" fill="#E8B64C" stroke="#A87E26" stroke-width="0.8"/>
  <circle cx="111" cy="90" r="4.4" fill="#E8B64C" stroke="#A87E26" stroke-width="0.8"/>
  <!-- 腰带 -->
  <path d="M 88 106 L 112 106" stroke="#E8D8A8" stroke-width="2"/>

  <!-- 头（面部模板） -->
  <use href="#weihu-face" transform="translate(100,80) scale(1)"/>

  <!-- 左臂竖掌（护法印） -->
  <g>
    <path d="M 90 92 C 82 98 78 104 78 114" fill="none" stroke="#E8D880" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="77" cy="116" r="3.6" fill="#DCC4A0"/>
  </g>

  <!-- 右臂持降魔杵（杵尖向下，斜立） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 112 92;2 112 92;-2 112 92" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 108 92 C 116 88 122 84 128 78" fill="none" stroke="#E8D880" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="130" cy="76" r="3.6" fill="#DCC4A0"/>
    <!-- 降魔杵（杵尖向下） -->
    <path d="M 130 78 L 144 108" stroke="#E8C860" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M 144 108 L 147 116" stroke="#FFE066" stroke-width="4.2" stroke-linecap="round"/>
  </g>

  <!-- 杵尖金光 -->
  <circle cx="146" cy="112" r="8" fill="#FFE066" opacity="0.7">
    <animate attributeName="r" values="8;12;8" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 金光粒子 -->
  <g fill="#FFE066">
    <circle cx="46" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="154" cy="46">
      <animate attributeName="cy" values="46;36;46" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
