<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="何仙姑·四阶·济世救人·莲花化雨露枯苗回绿">
  <defs>
    <!-- 背景：村野灾后 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B890"/>
      <stop offset="52%" stop-color="#8EA878"/>
      <stop offset="100%" stop-color="#6E8E5E"/>
    </linearGradient>
    <!-- 甘霖蓝 -->
    <radialGradient id="rain" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#9AC8E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9AC8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 莲花粉 -->
    <radialGradient id="lotus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8D8E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 素衣仙裙 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E4DC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>

    <!-- 头部模板：清秀面容·眉目慈悲·济世微笑 -->
    <g id="hexiangu-face">
      <ellipse cx="0" cy="0" rx="10" ry="10.5" fill="url(#skin)" stroke="#D8BC98" stroke-width="0.8"/>
      <!-- 青丝 + 莲花簪 -->
      <path d="M -5 -8 Q 0 -11 5 -8 Q 3 -12 0 -12 Q -3 -12 -5 -8 Z" fill="#1E1814"/>
      <path d="M -5 -10 Q -2 -12 0 -11 L -1 -8 Z" fill="#E8A0C8"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目慈悲 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.6 M 8 -1.5 Q 5 -3.2 2 -2.6" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.2" cy="0.4" rx="2.1" ry="1.9" fill="#1E1008"/>
      <ellipse cx="4.2" cy="0.4" rx="2.1" ry="1.9" fill="#1E1008"/>
      <circle cx="-4.7" cy="-0.4" r="0.7" fill="#FFF"/>
      <circle cx="3.7" cy="-0.4" r="0.7" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.6 L 0 3.2" stroke="#C8A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 济世微笑 -->
      <path d="M -3 5.4 Q 0 7.6 3 5.4" fill="none" stroke="#B06A4A" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 甘霖雨幕 -->
  <circle cx="100" cy="96" r="84" fill="url(#rain)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 雨丝 -->
  <g stroke="#9AC8E8" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
    <path d="M 60 60 L 56 84">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 56 L 136 80">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 40 L 98 64">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 村庄（重焕生机） -->
  <g opacity="0.9">
    <path d="M 22 96 L 22 84 L 40 84 L 40 96 L 50 96 L 50 76 L 14 76 L 14 96 Z" fill="#A87A56"/>
    <path d="M 30 84 L 30 74 L 29 84 Z" fill="#A87A56"/>
    <path d="M 158 92 L 158 80 L 174 80 L 174 92 L 182 92 L 182 72 L 150 72 L 150 92 Z" fill="#B08A62"/>
    <path d="M 166 80 L 166 72 L 165 80 Z" fill="#B08A62"/>
  </g>

  <!-- 枯苗回绿（前景田地） -->
  <path d="M 0 150 Q 40 142 80 148 Q 120 154 160 146 Q 180 142 200 148 L 200 200 L 0 200 Z" fill="#7E9E6E"/>
  <g stroke="#A8C878" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 40 158 Q 38 150 42 144">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 162 Q 58 154 62 148">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 160 Q 138 152 142 146">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 百姓叩谢（右下） -->
  <g opacity="0.95">
    <circle cx="156" cy="142" r="4.5" fill="#E8D8BC"/>
    <path d="M 153 138 Q 156 135 159 138 Q 158 140 156 140 Q 154 140 153 138 Z" fill="#2E2620"/>
    <path d="M 154 146 Q 152 156 154 162 Q 158 162 158 146 Z" fill="#8E7E6E"/>
    <circle cx="134" cy="146" r="4" fill="#E8D8BC"/>
    <path d="M 131 142.5 Q 134 140 137 142.5 Q 136 144 134 144 Q 132 144 131 142.5 Z" fill="#2E2620"/>
    <path d="M 132 150 Q 130 158 132 162 Q 136 162 136 150 Z" fill="#C8B498"/>
  </g>

  <!-- 仙姑（飘然若仙，抛莲化雨） -->
  <!-- 腿 -->
  <path d="M 92 132 L 88 154 L 94 154 L 98 134 Z" fill="#D8D4CC"/>
  <path d="M 106 132 L 112 156 L 106 156 L 102 134 Z" fill="#D8D4CC"/>
  <!-- 仙裙（飘动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 98 122;3 98 122;-4 98 122" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 90 118 Q 88 130 92 138 Q 100 144 108 138 Q 112 130 110 118 Q 100 112 90 118 Z" fill="url(#gown)" stroke="#D0C8C0" stroke-width="1"/>
  </g>
  <!-- 上身 -->
  <path d="M 94 96 Q 90 106 94 118 Q 100 124 106 118 Q 110 106 106 96 Q 100 92 94 96 Z" fill="url(#gown)" stroke="#D0C8C0" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 94 110 L 106 110" stroke="#A8906E" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#hexiangu-face" transform="translate(100,88) scale(1)"/>

  <!-- 左臂垂持 -->
  <path d="M 96 100 C 90 104 88 108 88 114" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>

  <!-- 右臂抛起莲花（化雨露） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 104 100 C 110 102 114 104 118 100" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="120" cy="99" r="3" fill="#E2C8A8"/>
    <!-- 莲花脱手（在上方化雨） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.8s" repeatCount="indefinite"/>
      <circle cx="120" cy="76" r="10" fill="url(#lotus)">
        <animate attributeName="r" values="10;14;10" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="75" r="7" fill="#E8A0C8"/>
      <path d="M 116 73 Q 120 69 124 73 Q 120 75 116 73 Z" fill="#F0B8D8"/>
      <path d="M 116 78 Q 120 74 124 78 Q 120 80 116 78 Z" fill="#F0B8D8"/>
    </g>
    <!-- 化雨（莲花上方） -->
    <g stroke="#9AC8E8" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
      <path d="M 120 64 Q 118 58 120 52">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 128 66 Q 130 60 128 54">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 甘霖新绿尘 -->
  <g fill="#A8C878">
    <circle cx="44" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
