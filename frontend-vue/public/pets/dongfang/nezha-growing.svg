<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哪吒·三阶·初成·闹海屠龙">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="62%">
      <stop offset="0%" stop-color="#B8502E"/>
      <stop offset="60%" stop-color="#8E3A22"/>
      <stop offset="100%" stop-color="#5A2416"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFEBD8"/>
      <stop offset="100%" stop-color="#F5D9C0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <g id="nezha-head">
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#FBEBD6" stroke="#D8B894" stroke-width="1"/>
      <circle cx="-14" cy="-21" r="7" fill="#2A1A0A"/>
      <circle cx="14" cy="-21" r="7" fill="#2A1A0A"/>
      <path d="M -10 -14 Q -4 -18 0 -15 Q 4 -18 10 -14" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="-5.4" cy="-3.6" r="1.5" fill="#FFF"/>
      <circle cx="8.6" cy="-3.6" r="1.5" fill="#FFF"/>
      <path d="M -11 -6 Q -8 -9 -5 -8 M 11 -6 Q 8 -9 5 -8" fill="none" stroke="#2A1A0A" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -4 6 Q 0 9 4 6" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-11" cy="4" r="3.6" fill="#C85A4A" opacity="0.32"/>
      <circle cx="11" cy="4" r="3.6" fill="#C85A4A" opacity="0.32"/>
      <path d="M 0 -18 Q 2 -22 5 -23" fill="none" stroke="#2A1A0A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="116" r="70" fill="url(#core)">
    <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="112" r="56" fill="none" stroke="#F5D742" stroke-width="1.6" opacity="0.45"/>

  <!-- 风火轮（脚下火轮） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 84 160;60 84 160;120 84 160" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="84" cy="160" r="12" fill="none" stroke="url(#fire)" stroke-width="4"/>
    <path d="M 84 148 L 84 172 M 72 160 L 96 160" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 116 160;60 116 160;120 116 160" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="116" cy="160" r="12" fill="none" stroke="url(#fire)" stroke-width="4"/>
    <path d="M 116 148 L 116 172 M 104 160 L 128 160" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 腿 -->
  <path d="M 90 136 C 86 146 84 152 84 158" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 110 136 C 114 146 116 152 116 158" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>

  <!-- 身体（莲花战甲初成） -->
  <path d="M 90 92 Q 82 108 88 128 Q 100 138 112 128 Q 118 108 112 92 Q 104 86 90 92 Z" fill="url(#skin)"/>
  <!-- 红甲胸片 -->
  <path d="M 88 96 Q 100 88 112 96 L 110 112 Q 100 118 90 112 Z" fill="#D82A1A"/>
  <path d="M 96 94 L 96 116 M 104 94 L 104 116" stroke="#FFE9C0" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <!-- 肩甲 -->
  <circle cx="86" cy="102" r="6" fill="#F5D742"/>
  <circle cx="114" cy="102" r="6" fill="#F5D742"/>

  <!-- 乾坤圈（套颈） -->
  <circle cx="100" cy="116" r="7" fill="none" stroke="#F5D742" stroke-width="3.4"/>

  <!-- 火尖枪（手持） -->
  <line x1="60" y1="150" x2="120" y2="66" stroke="#8E1A12" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 120 66 L 128 58 L 120 60 L 124 54 Z" fill="#F5D742"/>

  <!-- 手臂（一持枪，一掷乾坤圈） -->
  <path d="M 102 100 C 108 94 112 90 112 84" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="112" cy="80" r="4" fill="url(#skin)"/>
  <path d="M 96 100 C 88 102 82 104 78 108" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <!-- 掷出的乾坤圈 -->
  <circle cx="66" cy="112" r="6" fill="none" stroke="#F5D742" stroke-width="3">
    <animate attributeName="cx" values="66;50;66" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 混天绫（飘） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 3;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 114 120 C 136 122 148 132 144 146 C 154 138 152 124 140 118 C 130 114 120 116 114 120 Z" fill="#C22A1A" opacity="0.9"/>
  </g>

  <!-- 头（头部模板 scale 1.0，身体正上方） -->
  <use href="#nezha-head" transform="translate(100,84) scale(1)"/>
  <!-- 束发带（飞扬） -->
  <path d="M 120 62 C 134 58 144 62 150 58" fill="none" stroke="#F5D742" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 120 62;8 120 62;0 120 62" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 悟道光点（飘浮） -->
  <g fill="#F5D742">
    <circle cx="58" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="146" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
