<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="太上老君·五阶·三清之首·紫气东来万法道祖">
  <defs>
    <!-- 背景：太清境云海紫霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E7EB8"/>
      <stop offset="52%" stop-color="#7E5E9E"/>
      <stop offset="100%" stop-color="#5E4E7E"/>
    </linearGradient>
    <!-- 紫气 -->
    <radialGradient id="ziqi" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#C89ED8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C89ED8" stop-opacity="0"/>
    </radialGradient>
    <!-- 圣白 -->
    <radialGradient id="white" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫金道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9E7EB8"/>
      <stop offset="100%" stop-color="#6E5E8E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="100%" stop-color="#E0C8A8"/>
    </radialGradient>

    <!-- 头部模板：童颜鹤发·眉目慈悲·眼含无量道 -->
    <g id="laojun-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 鹤发童颜 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 圣白光 -->
  <circle cx="100" cy="92" r="84" fill="url(#white)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 紫气 -->
  <circle cx="100" cy="92" r="88" fill="url(#ziqi)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="92" r="62" fill="none" stroke="#FFF7E0" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="62;67;62" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="54" fill="none" stroke="#FFF7E0" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="54;57;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 三清虚影（身后） -->
  <g opacity="0.35">
    <path d="M 40 80 Q 42 66 48 62 Q 54 64 54 80 Z" fill="#D8E0F0"/>
    <circle cx="48" cy="60" r="5" fill="#F0E8D8"/>
    <path d="M 146 80 Q 148 66 154 62 Q 160 64 160 80 Z" fill="#D8E0F0"/>
    <circle cx="154" cy="60" r="5" fill="#F0E8D8"/>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.7">
    <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#6E5E8E">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 万仙朝拜（虚影） -->
  <g opacity="0.35">
    <path d="M 30 136 Q 32 124 37 120 Q 42 122 42 136 Z" fill="#C8C0D8"/>
    <path d="M 52 140 Q 53 128 58 124 Q 63 126 62 140 Z" fill="#B8B0C8"/>
    <path d="M 138 138 Q 139 126 144 122 Q 149 124 148 138 Z" fill="#C8C0D8"/>
    <path d="M 160 140 Q 161 128 166 124 Q 171 126 170 140 Z" fill="#B8B0C8"/>
  </g>

  <!-- 道祖（端坐，拂尘一挥） -->
  <!-- 腿（盘坐） -->
  <path d="M 88 132 Q 94 140 106 136 Q 110 132 108 126 Q 100 136 92 130 Z" fill="#6E5E8E"/>
  <!-- 紫金道袍 -->
  <path d="M 88 92 Q 84 110 90 132 Q 100 138 108 132 Q 114 110 110 92 Q 100 86 88 92 Z" fill="url(#robe)" stroke="#5E4E7E" stroke-width="1"/>
  <!-- 紫气纹 -->
  <path d="M 92 100 Q 94 106 92 112 M 106 100 Q 104 106 106 112" stroke="#D0B8E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 头（面部模板） -->
  <use href="#laojun-face" transform="translate(99,84) scale(1)"/>

  <!-- 左臂持拂尘（一挥紫气东来） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 92 92;3 92 92;-4 92 92" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 92 92 C 84 94 80 96 78 92" fill="none" stroke="#8E7EAE" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="77" cy="91" r="3" fill="#E0C8A8"/>
    <!-- 拂尘柄 -->
    <line x1="77" y1="92" x2="62" y2="70" stroke="#8E7A5E" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 拂尘丝（紫气东来） -->
    <path d="M 64 72 Q 50 64 40 58 M 66 68 Q 56 60 46 52" stroke="#C89ED8" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 紫气东来（自拂尘涌出） -->
    <g fill="#C89ED8" opacity="0.6">
      <circle cx="44" cy="56"><animate attributeName="cy" values="56;46;56" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="52" cy="44"><animate attributeName="cy" values="44;34;44" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 右手抚膝（端坐） -->
  <path d="M 106 94 C 110 98 112 104 110 112" fill="none" stroke="#8E7EAE" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="109" cy="114" r="3" fill="#E0C8A8"/>

  <!-- 紫气星尘 -->
  <g fill="#C89ED8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 44 L 48 36"/><path d="M 144 44 L 152 36"/>
  </g>
</svg>
