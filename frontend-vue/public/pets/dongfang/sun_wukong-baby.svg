<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·二阶·凡尘·破石出山">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#414E5A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fur" cx="42%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#EBC55A"/>
      <stop offset="60%" stop-color="#E0B13B"/>
      <stop offset="100%" stop-color="#C08E26"/>
    </radialGradient>
    <radialGradient id="stone" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#6A7A8A"/>
      <stop offset="60%" stop-color="#5A6A7A"/>
      <stop offset="100%" stop-color="#44505E"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>

    <!-- 孙悟空头部模板（脸中心 0,0；桃心脸+丹凤眼+雷公嘴） -->
    <g id="wukong-head">
      <path d="M 0 -34 C 16 -34 21 -20 19 -7 C 17 5 9 13 0 16 C -9 13 -17 5 -19 -7 C -21 -20 -16 -34 0 -34 Z" fill="#F7E6C6" stroke="#8B6914" stroke-width="1.2"/>
      <circle cx="-21" cy="-8" r="5" fill="#E0B13B"/>
      <circle cx="21" cy="-8" r="5" fill="#E0B13B"/>
      <path d="M -8 -33 Q -6 -42 -1 -46 Q 3 -43 5 -40 Q 8 -44 12 -42 Q 10 -34 6 -32" fill="none" stroke="#C08E26" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -18 -10 Q -25 -6 -27 -1 M 18 -10 Q 25 -6 27 -1" fill="none" stroke="#C08E26" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <path d="M -12 -6 Q -6 -14 2 -9 Q -6 -3 -12 -6 Z" fill="#1A0A0A"/>
      <path d="M -2 -9 Q 6 -14 12 -6 Q 6 -3 -2 -9 Z" fill="#1A0A0A"/>
      <circle cx="-4" cy="-9" r="1.4" fill="#F5D742"/>
      <circle cx="4" cy="-9" r="1.4" fill="#F5D742"/>
      <path d="M -13 -7 Q -11 -3 -8 -5" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M 13 -7 Q 11 -3 8 -5" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M -6 8 Q 0 14 6 8 Q 0 16 -6 8 Z" fill="#B0852A"/>
      <path d="M -4 10 Q 0 13 4 10" fill="none" stroke="#8E5A14" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-15" cy="2" r="4" fill="#C85A4A" opacity="0.25"/>
      <circle cx="15" cy="2" r="4" fill="#C85A4A" opacity="0.25"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#side)"/>

  <!-- 晨光灵光（呼吸） -->
  <circle cx="100" cy="112" r="70" fill="url(#core)">
    <animate attributeName="r" values="70;80;70" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 尾巴（长卷，轻摆） -->
  <path d="M 112 122 C 138 128 154 114 152 98 C 151 90 144 86 140 91" fill="none" stroke="url(#fur)" stroke-width="5.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 118 106;7 118 106;0 118 106" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 碎裂的石头（破壳） -->
  <path d="M 62 146 L 74 134 L 88 142 L 100 130 L 100 168 L 84 174 L 68 166 Z" fill="url(#stone)"/>
  <path d="M 138 144 L 126 136 L 112 144 L 100 132 L 100 168 L 116 174 L 132 164 Z" fill="url(#stone)"/>
  <!-- 裂口金光 -->
  <path d="M 100 130 L 100 168" stroke="#F5D742" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 身体（金毛躯干，从石中探出，微弯腰） -->
  <path d="M 88 96 Q 82 110 88 128 Q 100 136 114 128 Q 120 110 116 96 Q 104 90 88 96 Z" fill="url(#fur)"/>

  <!-- 手臂（一手搭凉棚远眺，一手扶石） -->
  <path d="M 104 102 C 110 100 116 96 118 90" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="119" cy="87" r="4" fill="#C08E26"/>
  <path d="M 96 104 C 90 110 88 118 90 124" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>

  <!-- 头（头部模板 scale 0.8，身体正上方） -->
  <use href="#wukong-head" transform="translate(100,84) scale(0.8)"/>

  <!-- 晨光微粒（飘浮） -->
  <g fill="#E8B84B">
    <circle cx="40" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
