<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·二阶·凡尘·花果山王">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#414E5A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fur" cx="42%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#EBC55A"/>
      <stop offset="60%" stop-color="#E0B13B"/>
      <stop offset="100%" stop-color="#C08E26"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#side)"/>

  <!-- 环境：地面 + 草丛 -->
  <path d="M 12 168 Q 60 163 108 166 T 196 162" fill="none" stroke="#333F4A" stroke-width="2" opacity="0.7"/>
  <path d="M 150 164 l 3 -11 M 158 163 l 2 -8 M 146 165 l 2 -6" stroke="#4A5A66" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 晨光灵光（呼吸） -->
  <circle cx="100" cy="120" r="66" fill="url(#core)">
    <animate attributeName="r" values="66;74;66" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 尾巴（长卷，猴尾） -->
  <path d="M 114 136 C 140 140 154 126 152 108 C 151 100 144 96 140 101" fill="none" stroke="url(#fur)" stroke-width="5.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 118 118;7 118 118;0 118 118" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 蹲姿腿（弯曲在前） -->
  <path d="M 92 134 C 84 146 80 154 78 160" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 108 134 C 114 146 118 154 120 160" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="76" cy="162" rx="7" ry="5" fill="#C08E26"/>
  <ellipse cx="122" cy="162" rx="7" ry="5" fill="#C08E26"/>

  <!-- 躯干（蹲踞前倾，精瘦） -->
  <path d="M 94 94 Q 84 110 88 130 Q 100 140 112 130 Q 118 110 112 96 Q 104 90 94 94 Z" fill="url(#fur)"/>
  <!-- 藤叶衣 -->
  <path d="M 90 124 Q 100 118 110 124 L 112 138 Q 100 144 88 136 Z" fill="#6B7A5A" opacity="0.9"/>
  <path d="M 106 126 L 112 136 L 120 130 Z" fill="#7A8A68" opacity="0.9"/>

  <!-- 手臂（一挠头·猴性，一撑地） -->
  <path d="M 100 100 C 96 96 90 94 86 90" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="85" cy="88" r="4" fill="#C08E26"/>
  <path d="M 112 102 C 120 108 126 118 128 128" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>

  <!-- 头（尖桃心脸雏形） -->
  <ellipse cx="86" cy="70" rx="14" ry="12" fill="url(#fur)" transform="rotate(-10 86 70)"/>
  <path d="M 86 60 C 95 60 99 68 97 75 C 95 81 90 85 86 87 C 82 85 77 81 75 75 C 73 68 77 60 86 60 Z" fill="#F5E6C6"/>
  <!-- 猴耳 -->
  <circle cx="72" cy="68" r="4.5" fill="#C08E26"/>
  <!-- 金毛 -->
  <path d="M 84 62 Q 81 55 86 51 Q 88 56 90 60" fill="none" stroke="#C08E26" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 丹凤眼雏形（细长上挑） -->
  <path d="M 79 68 Q 85 62 91 66 Q 85 70 79 68 Z" fill="#1A0A0A"/>
  <circle cx="85" cy="66" r="1.1" fill="#F5D742"/>
  <path d="M 77 69 Q 79 72 82 70" fill="none" stroke="#C85A4A" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- 雷公嘴雏形（凸） -->
  <path d="M 80 78 Q 86 83 92 78 Q 86 86 80 78 Z" fill="#B0852A"/>

  <!-- 晨光微粒（飘浮） -->
  <g fill="#E8B84B">
    <circle cx="34" cy="112">
      <animate attributeName="cy" values="112;104;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
