<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·二阶·凡尘·花果山王">
  <defs>
    <!-- 背景：黛青 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#414E5A"/>
    </linearGradient>
    <!-- 侧光 -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <!-- 金毛 -->
    <radialGradient id="fur" cx="42%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#EBC55A"/>
      <stop offset="60%" stop-color="#E0B13B"/>
      <stop offset="100%" stop-color="#C08E26"/>
    </radialGradient>
    <!-- 桃心脸 -->
    <radialGradient id="face" cx="45%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F7E6C6"/>
      <stop offset="100%" stop-color="#E8D3A8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#side)"/>

  <!-- 环境：地面 + 草丛 -->
  <path d="M 12 168 Q 60 163 108 166 T 196 162" fill="none" stroke="#333F4A" stroke-width="2" opacity="0.7"/>
  <path d="M 150 164 l 3 -11 M 158 163 l 2 -8 M 146 165 l 2 -6" stroke="#4A5A66" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 尾巴（长而卷） -->
  <path d="M 116 138 C 140 142 154 128 152 110 C 151 100 144 96 140 100" fill="none" stroke="url(#fur)" stroke-width="6" stroke-linecap="round"/>

  <!-- 腿（蹲姿） -->
  <path d="M 92 138 C 88 150 84 156 80 160" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 108 138 C 112 150 116 156 120 160" fill="none" stroke="url(#fur)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="78" cy="161" rx="7" ry="5" fill="#C08E26"/>
  <ellipse cx="122" cy="161" rx="7" ry="5" fill="#C08E26"/>

  <!-- 躯干（细长，精瘦猴形，非蛋形） -->
  <path d="M 92 96 Q 88 112 92 132 Q 100 142 110 138 Q 116 120 114 100 Q 108 92 92 96 Z" fill="url(#fur)"/>
  <!-- 藤叶衣（腰间） -->
  <path d="M 92 128 Q 100 122 110 128 L 108 138 Q 100 142 92 136 Z" fill="#6B7A5A" opacity="0.9"/>
  <path d="M 104 130 L 110 140 L 118 134 Z" fill="#7A8A68" opacity="0.9"/>

  <!-- 手臂（一挠头，一撑膝） -->
  <path d="M 98 100 C 90 96 84 92 84 86" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="84" cy="84" r="4" fill="#C08E26"/>
  <path d="M 112 102 C 120 108 124 118 124 126" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>

  <!-- 头（桃心脸雏形，回望朝左） -->
  <ellipse cx="86" cy="72" rx="15" ry="13" fill="url(#fur)" transform="rotate(-10 86 72)"/>
  <!-- 桃心脸（上宽下尖） -->
  <path d="M 86 62 C 93 62 96 69 94 75 C 92 80 88 83 86 85 C 84 83 80 80 78 75 C 76 69 79 62 86 62 Z" fill="url(#face)"/>
  <!-- 耳 -->
  <circle cx="74" cy="70" r="4.5" fill="#C08E26"/>

  <!-- 金毛（头顶簇） -->
  <path d="M 84 62 Q 82 56 86 52 Q 88 56 90 60" fill="none" stroke="#C08E26" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 丹凤眼雏形（细长上挑）+ 红晕 -->
  <path d="M 80 68 Q 84 65 88 68 Q 84 70 80 68 Z" fill="#2A1A0A"/>
  <path d="M 78 69 Q 80 71 82 70" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- 雷公嘴雏形（嘴部微凸） -->
  <path d="M 82 79 Q 86 82 90 79 Q 86 84 82 79 Z" fill="#B0852A"/>

  <!-- 手持树枝（生活道具） -->
  <line x1="66" y1="158" x2="80" y2="112" stroke="#7A5A2A" stroke-width="3" stroke-linecap="round"/>

  <!-- 晨光微粒 -->
  <circle cx="34" cy="112" r="1.3" fill="#E8B84B" opacity="0.6"/>
  <circle cx="150" cy="120" r="1.1" fill="#E8B84B" opacity="0.4"/>
  <circle cx="120" cy="156" r="1" fill="#E8B84B" opacity="0.35"/>
</svg>
