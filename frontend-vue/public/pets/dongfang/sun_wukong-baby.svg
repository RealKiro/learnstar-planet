<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·二阶·凡尘·花果山王">
  <defs>
    <!-- 背景：黛青 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#414E5A"/>
    </linearGradient>
    <!-- 侧光 -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <!-- 金毛 -->
    <radialGradient id="fur" cx="42%" cy="38%" r="74%">
      <stop offset="0%" stop-color="#EBC55A"/>
      <stop offset="60%" stop-color="#E0B13B"/>
      <stop offset="100%" stop-color="#C9982A"/>
    </radialGradient>
    <radialGradient id="face" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F5E3C0"/>
      <stop offset="100%" stop-color="#E8D3A8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#side)"/>

  <!-- 环境：地面 + 草丛 -->
  <path d="M 12 168 Q 60 163 108 166 T 196 162" fill="none" stroke="#333F4A" stroke-width="2" opacity="0.7"/>
  <path d="M 150 164 l 3 -11 M 158 163 l 2 -8 M 146 165 l 2 -6" stroke="#4A5A66" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 尾（卷曲） -->
  <path d="M 128 138 C 148 138 158 126 154 112" fill="none" stroke="url(#fur)" stroke-width="7" stroke-linecap="round"/>

  <!-- 身体（金毛，侧身） -->
  <ellipse cx="112" cy="132" rx="21" ry="16" fill="url(#fur)" transform="rotate(14 112 132)"/>
  <!-- 藤叶衣 -->
  <path d="M 98 140 Q 106 148 118 142 Q 112 152 100 148 Z" fill="#6B7A5A" opacity="0.9"/>
  <path d="M 108 148 Q 114 156 124 150 Z" fill="#7A8A68" opacity="0.9"/>

  <!-- 金箍棒（斜持） -->
  <line x1="64" y1="162" x2="96" y2="108" stroke="#F5D742" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="162" x2="96" y2="108" stroke="#C9A227" stroke-width="1.2" opacity="0.6"/>

  <!-- 手（抓棒） -->
  <circle cx="92" cy="112" r="4" fill="#C9982A"/>

  <!-- 头（回望朝左） -->
  <ellipse cx="86" cy="116" rx="14" ry="13" fill="url(#fur)" transform="rotate(-14 86 116)"/>
  <!-- 猴脸 -->
  <path d="M 78 116 Q 78 126 86 130 Q 94 126 94 116 Q 88 108 78 116 Z" fill="url(#face)"/>
  <!-- 耳朵 -->
  <circle cx="76" cy="110" r="4" fill="#C9982A"/>
  <!-- 金毛簇 -->
  <path d="M 86 106 Q 84 100 88 96 Q 90 100 90 104" fill="none" stroke="#C9982A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 火眼金睛（回望） -->
  <circle cx="84" cy="115" r="4.6" fill="#F5D742"/>
  <circle cx="84" cy="115" r="2.2" fill="#8B1A1A"/>
  <circle cx="85.4" cy="113.6" r="1.6" fill="#FFF"/>

  <!-- 嘴 -->
  <path d="M 82 126 Q 86 129 90 126" fill="none" stroke="#B0852A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 晨光微粒 -->
  <circle cx="34" cy="110" r="1.3" fill="#E8B84B" opacity="0.6"/>
  <circle cx="150" cy="124" r="1.1" fill="#E8B84B" opacity="0.4"/>
  <circle cx="120" cy="156" r="1" fill="#E8B84B" opacity="0.35"/>
</svg>
