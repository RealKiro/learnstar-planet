<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨任·六阶·明照幽明·掌目双光照人间幽冥护迷途">
  <defs>
    <!-- 背景：黄昏阴阳交汇 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E6E9E"/>
      <stop offset="50%" stop-color="#6E4E82"/>
      <stop offset="100%" stop-color="#4E3662"/>
    </linearGradient>
    <!-- 明光金 -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 幽冥蓝 -->
    <radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6E9EF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 太岁便服 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8C8A0"/>
      <stop offset="100%" stop-color="#A88A5E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8BC98"/>
    </radialGradient>

    <!-- 头部模板：国字脸·眉目明澈·浩然正气 -->
    <g id="yangren-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 白眉·掌目 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 岁月流转金光 -->
  <circle cx="100" cy="96" r="82" fill="url(#goldGlow)" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.35;0.55" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 阴阳分界（地平线光带） -->
  <path d="M 0 128 Q 50 124 100 128 Q 150 132 200 128 L 200 132 L 0 132 Z" fill="#FFF3C4" opacity="0.4"/>

  <!-- 人间城郭（上半，受明光照护） -->
  <g opacity="0.85">
    <path d="M 26 60 L 26 46 L 48 46 L 48 60 L 58 60 L 58 38 L 16 38 L 16 60 Z" fill="#7E6E5E"/>
    <path d="M 30 60 L 30 88 L 44 88 L 44 60" fill="none" stroke="#6E5E4E" stroke-width="1.2"/>
    <path d="M 34 46 L 34 42 L 40 42 L 40 46" fill="#8E7E6E"/>
    <path d="M 44 38 L 44 30 L 42 38 Z" fill="#8E7E6E"/>
    <!-- 城中灯火 -->
    <path d="M 34 80 Q 33.6 76 34 72" stroke="#F5D742" stroke-width="1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 迷途旅人（城下，被指明路） -->
    <g opacity="0.95">
      <circle cx="34" cy="96" r="3.4" fill="#E8D8BC"/>
      <path d="M 32 92.5 Q 34 90.5 36 92.5 Q 35 93.5 34 93.5 Q 33 93.5 32 92.5 Z" fill="#2E2620"/>
      <path d="M 33 99 Q 31 106 33 110 Q 36 110 36 99 Z" fill="#7E6A56"/>
      <path d="M 34 100 L 36 94" fill="none" stroke="#E8D8BC" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 幽冥微光（下半，被蓝光照护） -->
  <g opacity="0.6">
    <!-- 幽冥雾 -->
    <path d="M 0 170 Q 30 164 60 170 Q 90 176 120 168 Q 160 160 200 168 L 200 200 L 0 200 Z" fill="#3E4E7E" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- 迷途游魂（被指引） -->
    <g>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
      <circle cx="138" cy="168" r="3.6" fill="#C8D8F0" opacity="0.5"/>
      <path d="M 136 164 Q 138 161 140 164 Q 139 166 138 166 Z" fill="#8EA8D8" opacity="0.7"/>
      <path d="M 137 171 Q 135 178 137 182 Q 140 182 140 171 Z" fill="#8EA8D8" opacity="0.4"/>
    </g>
    <circle cx="148" cy="176" r="2.4" fill="#9AC8F0" opacity="0.5"/>
    <circle cx="126" cy="180" r="2" fill="#9AC8F0" opacity="0.4"/>
  </g>

  <!-- 角色：太岁便服（浩然正气，立于分界） -->
  <!-- 便服下摆 -->
  <path d="M 84 124 Q 98 136 112 126 Q 118 120 114 112 Q 106 124 96 120 Q 88 124 84 124 Z" fill="url(#robe)"/>
  <!-- 上身 -->
  <path d="M 86 86 Q 82 104 88 124 Q 98 130 108 124 Q 114 104 110 86 Q 98 80 86 86 Z" fill="url(#robe)" stroke="#8E7248" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 86 108 L 110 108" stroke="#8E9A6E" stroke-width="1.8"/>
  <!-- 浩然正气光 -->
  <circle cx="98" cy="98" r="40" fill="#FFF3C4" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.1;0.18" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 头（面部模板） -->
  <use href="#yangren-face" transform="translate(98,78) scale(1)"/>

  <!-- 左掌（掌目，明光一道照人间城郭） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 88 88 C 76 92 68 88 62 80" fill="none" stroke="#D8C8A0" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="60" cy="78" r="6" fill="#E8D8C0" stroke="#B8A888" stroke-width="0.8"/>
    <ellipse cx="60" cy="78" rx="3.4" ry="3" fill="#3A2A1E"/>
    <circle cx="60.6" cy="77.2" r="1.1" fill="#FFF"/>
    <circle cx="60" cy="78" r="16" fill="url(#goldGlow)">
      <animate attributeName="r" values="16;21;16" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 明光一道照人间 -->
  <g stroke="#FFF3C4" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <path d="M 60 78 Q 44 100 36 124">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右掌（掌目，幽冥蓝光一道照幽冥） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="3.4s" repeatCount="indefinite"/>
    <path d="M 110 88 C 122 92 130 88 136 80" fill="none" stroke="#D8C8A0" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="138" cy="78" r="6" fill="#E8D8C0" stroke="#B8A888" stroke-width="0.8"/>
    <ellipse cx="138" cy="78" rx="3.4" ry="3" fill="#3A2A1E"/>
    <circle cx="138.6" cy="77.2" r="1.1" fill="#FFF"/>
    <circle cx="138" cy="78" r="16" fill="url(#ghostGlow)">
      <animate attributeName="r" values="16;21;16" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 幽冥蓝光一道照幽冥 -->
  <g stroke="#9AC8F0" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <path d="M 138 78 Q 152 110 146 146">
      <animate attributeName="opacity" values="0.5;0.18;0.5" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 岁月流转（身周） -->
  <g opacity="0.7">
    <circle cx="98" cy="66" r="8" fill="none" stroke="#F5D742" stroke-width="1.2" stroke-dasharray="2 4">
      <animateTransform attributeName="transform" type="rotate" values="0 98 66;360 98 66" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 神性金尘 -->
  <g fill="#FFE066">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="52">
      <animate attributeName="cy" values="52;42;52" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="120">
      <animate attributeName="cy" values="120;110;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
