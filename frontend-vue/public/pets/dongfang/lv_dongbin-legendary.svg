<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="吕洞宾·五阶·八仙之首·踏剑凌波万剑归宗">
  <defs>
    <!-- 背景：沧海海天相接 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E8EAE"/>
      <stop offset="52%" stop-color="#4E7E9E"/>
      <stop offset="100%" stop-color="#3E6E8E"/>
    </linearGradient>
    <!-- 剑光白 -->
    <radialGradient id="sword" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 白衣道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E0E8"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>

    <!-- 头部模板：俊逸面容·眉目含笑·气度从容 -->
    <g id="lvdongbin-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8AC90" stroke-width="0.9"/>
      <!-- 道髻逍遥巾 -->
      <path d="M -5 -9 Q 0 -12 5 -9 Q 3 -13 0 -13 Q -3 -13 -5 -9 Z" fill="#1E1814"/>
      <path d="M -7 -6 L -12 -3 M 7 -6 L 12 -3" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <!-- 额发 -->
      <path d="M -9.5 -3.5 Q -5.5 -8.5 0 -8.5 Q 5.5 -8.5 9.5 -3.5 Q 5.5 -7.5 0 -7.5 Q -5.5 -7.5 -9.5 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目含笑 -->
      <path d="M -8.5 -1.5 Q -5.5 -3.4 -2 -2.6 M 8.5 -1.5 Q 5.5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 从容眼神 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.3" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.3" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.4" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 从容含笑 -->
      <path d="M -3 5.6 Q 0 7.2 3 5.6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 剑光圆 -->
  <circle cx="100" cy="92" r="84" fill="url(#sword)" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 沧海波涛 -->
  <path d="M 0 150 Q 50 140 100 148 Q 150 156 200 146 L 200 200 L 0 200 Z" fill="#3E6E8E"/>
  <path d="M 0 164 Q 60 154 120 162 Q 170 168 200 160 L 200 200 L 0 200 Z" fill="#2E5E7E"/>
  <!-- 浪头 -->
  <path d="M 20 168 Q 60 160 100 166 Q 140 172 180 164" stroke="#9AC8E0" stroke-width="1.6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 八仙虚影（随行，背景） -->
  <g opacity="0.5">
    <path d="M 20 120 Q 22 108 27 104 Q 32 106 32 120 Z" fill="#C8C0A8"/>
    <path d="M 46 128 Q 47 116 52 112 Q 57 114 56 128 Z" fill="#B8A878"/>
    <path d="M 170 124 Q 171 112 176 108 Q 181 110 180 124 Z" fill="#A8B8A8"/>
    <path d="M 150 130 Q 151 118 156 114 Q 161 116 160 130 Z" fill="#D8C8A8"/>
  </g>

  <!-- 白衣剑仙（踏剑凌波） -->
  <!-- 踏剑（脚下） -->
  <path d="M 66 112 L 126 100" stroke="#E8F0F8" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M 126 100 L 134 99" stroke="#E8F0F8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="96" cy="104" r="16" fill="url(#sword)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 白衣身 -->
  <path d="M 92 74 Q 88 86 92 100 Q 98 106 104 100 Q 108 86 106 74 Q 98 70 92 74 Z" fill="url(#robe)" stroke="#C8D0D8" stroke-width="1"/>
  <!-- 衣袂猎猎 -->
  <path d="M 92 98 Q 84 106 82 116 Q 90 112 94 104" fill="url(#robe)" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 92 98;-8 92 98;0 92 98" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 腰带 -->
  <path d="M 92 92 L 104 92" stroke="#C8A84E" stroke-width="1.4"/>
  <!-- 腰悬酒葫芦 -->
  <path d="M 92 90 Q 86 96 90 104 Q 94 108 98 104 Q 100 96 94 90 Z" fill="#A86A3E" stroke="#8E5A2E" stroke-width="0.8"/>

  <!-- 头（面部模板） -->
  <use href="#lvdongbin-face" transform="translate(99,66) scale(1)"/>

  <!-- 左臂袖袍一挥 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 94 78;4 94 78;-5 94 78" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 94 78 C 86 82 82 88 82 96" fill="none" stroke="#D8E0E8" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 袖袍 -->
    <path d="M 82 94 Q 72 100 74 110 Q 82 112 86 102" fill="url(#robe)" opacity="0.9"/>
  </g>

  <!-- 右手剑指（万剑归宗） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 104 78 C 112 80 118 82 122 78" fill="none" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 124 77 L 128 72" stroke="#D8C0A4" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 万剑归宗（万千剑影如虹散开） -->
  <g stroke="#E8F0F8" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
    <path d="M 128 74 L 152 60">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 126 78 L 156 76">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 124 82 L 150 92">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g stroke="#FFF7E0" stroke-width="1.3" stroke-linecap="round" opacity="0.5">
    <path d="M 130 70 L 160 52"/>
    <path d="M 128 74 L 164 66"/>
    <path d="M 126 78 L 162 82"/>
  </g>

  <!-- 剑气星尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="48">
      <animate attributeName="cy" values="48;38;48" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
