<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="雷震子·五阶·封神先锋·雷部先锋">
  <defs>
    <!-- 背景：战场天穹，紫金+圣白 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A2E78"/>
      <stop offset="48%" stop-color="#7A3E96"/>
      <stop offset="100%" stop-color="#2E1A4A"/>
    </linearGradient>
    <radialGradient id="holy" cx="50%" cy="34%" r="46%">
      <stop offset="0%" stop-color="#FFF0D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF0D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EACFF"/>
      <stop offset="100%" stop-color="#4E6CC8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E92E0"/>
      <stop offset="100%" stop-color="#2E50A0"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8D0E0"/>
      <stop offset="100%" stop-color="#6E84AE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#D8A020"/>
    </linearGradient>

    <g id="leizhenzi-face">
      <ellipse cx="0" cy="0" rx="16" ry="15" fill="url(#faceBlue)" stroke="#2E4488" stroke-width="1"/>
      <path d="M -15 -3 Q -14 -15 -5 -15 Q 0 -14 5 -15 Q 14 -15 15 -3 Q 8 -9 0 -8 Q -8 -9 -15 -3 Z" fill="#E04E2A"/>
      <path d="M -15 -2 Q -17 4 -14 8 Q -13 3 -15 -2 Z" fill="#E04E2A"/>
      <path d="M 15 -2 Q 17 4 14 8 Q 13 3 15 -2 Z" fill="#E04E2A"/>
      <path d="M -13 -9 Q -9 -11 -6 -10 M 13 -9 Q 9 -11 6 -10" fill="none" stroke="#C04A2A" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M -12 -4 L -6 -7 L -6 0 Z" fill="#FFF8E0" stroke="#C04A2A" stroke-width="0.8"/>
      <path d="M 12 -4 L 6 -7 L 6 0 Z" fill="#FFF8E0" stroke="#C04A2A" stroke-width="0.8"/>
      <circle cx="-9" cy="-3" r="1.6" fill="#FFE066"/>
      <circle cx="9" cy="-3" r="1.6" fill="#FFE066"/>
      <path d="M 0 -12 L 1.4 -9 L -1.4 -8.6 L 0 -5.5" fill="none" stroke="#FFE066" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M -3.5 3 Q 0 8.5 3.5 3 L 0 5 Z" fill="#F0B040" stroke="#D0902A" stroke-width="0.7"/>
      <path d="M -5 7 L -4 10.5 L -3 7 Z" fill="#FFFDF2"/>
      <path d="M 5 7 L 4 10.5 L 3 7 Z" fill="#FFFDF2"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="92" fill="url(#holy)">
    <animate attributeName="opacity" values="1;0.7;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 圣光放射（五阶受封威临） -->
  <g stroke="#FFE066" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <path d="M 100 16 L 100 4"/><path d="M 100 184 L 100 196"/>
    <path d="M 30 70 L 20 62"/><path d="M 170 70 L 180 62"/>
    <path d="M 52 34 L 44 24"/><path d="M 148 34 L 156 24"/>
    <path d="M 52 114 L 44 124"/><path d="M 148 114 L 156 124"/>
  </g>

  <!-- 西岐旌旗（身后左上） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -3;0 0" dur="3s" repeatCount="indefinite"/>
    <line x1="26" y1="12" x2="26" y2="92" stroke="#8E6E3A" stroke-width="2.4"/>
    <path d="M 26 16 L 58 24 L 26 34 Z" fill="#C8402A"/>
    <path d="M 28 20 L 48 26 L 28 31 Z" fill="#FFF" opacity="0.85"/>
  </g>

  <!-- 角色：雷震子悬空展翅（银蓝战甲 + 金冠） -->
  <!-- 战甲身体（直立） -->
  <path d="M 86 90 Q 82 114 92 136 Q 108 140 114 132 Q 118 112 112 90 Q 100 82 86 90 Z" fill="url(#armor)"/>
  <path d="M 96 88 L 98 134 M 104 88 L 102 134" stroke="#4E5E7E" stroke-width="1.2" opacity="0.7"/>
  <!-- 肩甲 -->
  <circle cx="82" cy="94" r="8" fill="#C8D0E0" stroke="#8E9AC0" stroke-width="1"/>
  <circle cx="118" cy="94" r="8" fill="#C8D0E0" stroke="#8E9AC0" stroke-width="1"/>
  <!-- 披风（玄色） -->
  <path d="M 92 92 Q 76 116 70 148 Q 88 142 96 134 Z" fill="#3A2A5A" opacity="0.8"/>

  <!-- 头（鸟面，金冠） -->
  <use href="#leizhenzi-face" transform="translate(100,64) scale(1.06)"/>
  <!-- 束发金冠 -->
  <path d="M 84 52 Q 100 44 116 52 L 116 46 Q 100 38 84 46 Z" fill="#FFE066" opacity="0.95"/>
  <circle cx="100" cy="40" r="3.4" fill="#FFE066">
    <animate attributeName="r" values="3.4;4.6;3.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 双翅全开（五阶最大） -->
  <g fill="url(#wing)" stroke="#2E50A0" stroke-width="0.9">
    <path d="M 80 84 Q 46 58 28 62 Q 36 82 72 90 Z"/>
    <path d="M 78 92 Q 38 76 22 82 Q 30 100 70 100 Z"/>
    <path d="M 76 100 Q 36 96 22 104 Q 32 118 68 108 Z"/>
    <path d="M 74 108 Q 40 112 30 122 Q 42 132 70 116 Z"/>
    <path d="M 120 84 Q 154 58 172 62 Q 164 82 128 90 Z"/>
    <path d="M 122 92 Q 162 76 178 82 Q 170 100 130 100 Z"/>
    <path d="M 124 100 Q 164 96 178 104 Q 168 118 132 108 Z"/>
    <path d="M 126 108 Q 160 112 170 122 Q 158 132 130 116 Z"/>
  </g>
  <circle cx="84" cy="92" r="7" fill="#FFE066" opacity="0.95">
    <animate attributeName="r" values="7;8.5;7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="116" cy="92" r="7" fill="#FFE066" opacity="0.95">
    <animate attributeName="r" values="7;8.5;7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 82 88 L 86 92 L 83.5 92 L 86 95 L 84 92.5 L 83 93 Z" fill="#2E4488"/>
  <path d="M 118 88 L 114 92 L 116.5 92 L 114 95 L 116 92.5 L 117 93 Z" fill="#2E4488"/>

  <!-- 黄金棍横空（左低右高） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 100 106;0 100 106;-3 100 106" dur="2.6s" repeatCount="indefinite"/>
    <line x1="62" y1="118" x2="138" y2="94" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <rect x="56" y="114" width="10" height="5.5" rx="2" fill="#D8A020" transform="rotate(-18 61 117)"/>
    <rect x="133" y="90" width="10" height="5.5" rx="2" fill="#D8A020" transform="rotate(-18 138 93)"/>
  </g>

  <!-- 雷电自翅尖迸发 -->
  <g stroke="#B8D8FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 30 64 L 18 48 L 26 48 L 14 30">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 170 64 L 182 48 L 174 48 L 186 30">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 34 120 L 22 132 L 30 132 L 18 146">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 166 120 L 178 132 L 170 132 L 182 146">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 下方山河云海 -->
  <path d="M 0 162 Q 60 152 120 160 Q 160 166 200 158 L 200 200 L 0 200 Z" fill="#2E1A4A" opacity="0.85"/>
  <path d="M 0 170 Q 80 164 150 170 Q 180 174 200 168 L 200 200 L 0 200 Z" fill="#4A2E78" opacity="0.7"/>

  <!-- 光尘 -->
  <g fill="#FFE066">
    <circle cx="48" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="112">
      <animate attributeName="cy" values="112;104;112" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
