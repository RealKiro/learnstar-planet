<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="曹国舅·三阶·散家弃官·散尽家财释然入山">
  <defs>
    <!-- 背景：宫门之外山野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B8A0"/>
      <stop offset="52%" stop-color="#8EA898"/>
      <stop offset="100%" stop-color="#6E8E7E"/>
    </linearGradient>
    <!-- 山青释然光 -->
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青衫 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8E7E"/>
      <stop offset="100%" stop-color="#3E6E5E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：清俊面容·眉目释然·眼含宁静·嘴角浅笑（脸中心 0,0） -->
    <g id="caoguojiu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 温润·桃花眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7.5 0.4 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1 Q -4.5 0.2 -7.5 1.8 Z" fill="#1E1008"/>
      <path d="M 7.5 0.4 Q 4.5 -1.4 1.8 -0.4 L 1.8 1 Q 4.5 0.2 7.5 1.8 Z" fill="#1E1008"/>
      <circle cx="-4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="4.5" cy="0.3" r="1.5" fill="#1E1008"/>
      <circle cx="-5" cy="-0.5" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="92" r="82" fill="url(#glow)"/>

  <!-- 远山 -->
  <path d="M 0 138 Q 40 118 90 128 Q 140 136 200 124 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>

  <!-- 宫门（右，回望） -->
  <g opacity="0.7">
    <path d="M 144 40 L 196 40 L 190 56 Q 168 66 150 62 Z" fill="#A8906E"/>
    <path d="M 144 40 L 196 40" stroke="#C8B068" stroke-width="1.2"/>
    <rect x="164" y="56" width="12" height="40" rx="2" fill="#8E7A5E" stroke="#A8906E" stroke-width="1"/>
    <rect x="152" y="56" width="8" height="40" rx="2" fill="#8E7A5E" stroke="#A8906E" stroke-width="1"/>
  </g>

  <!-- 山径 -->
  <path d="M 40 168 Q 70 156 100 160 Q 130 164 160 154 L 180 158 L 180 200 L 20 200 Z" fill="#7E9E86" opacity="0.7"/>

  <!-- 贫民接金袋（右） -->
  <g opacity="0.95">
    <circle cx="140" cy="140" r="4.5" fill="#E8D8BC"/>
    <path d="M 137 136 Q 140 133 143 136 Q 142 138 140 138 Q 138 138 137 136 Z" fill="#2E2620"/>
    <path d="M 138 144 Q 136 154 138 160 Q 142 160 142 144 Z" fill="#8E7E6E"/>
    <!-- 接金袋的手 -->
    <path d="M 136 146 C 132 148 130 150 130 154" fill="none" stroke="#E8D8BC" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 金袋（递出） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 124 142 Q 128 136 134 138 Q 138 140 136 146 Q 132 150 126 148 Q 122 146 124 142 Z" fill="#E8C07A" stroke="#C8A05E" stroke-width="1"/>
  </g>

  <!-- 青衫公子（散发，转身入山，释然一笑） -->
  <!-- 腿 -->
  <path d="M 90 136 L 86 158 L 92 158 L 96 138 Z" fill="#3E6E5E"/>
  <path d="M 106 136 L 114 160 L 108 160 L 102 138 Z" fill="#3E6E5E"/>
  <!-- 青衫 -->
  <path d="M 88 96 Q 84 112 90 134 Q 100 140 108 134 Q 114 112 110 96 Q 100 90 88 96 Z" fill="url(#robe)" stroke="#2E5E4E" stroke-width="1"/>
  <!-- 素腰带 -->
  <path d="M 88 116 L 110 116" stroke="#8E9A6E" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#caoguojiu-face" transform="translate(99,88) scale(1)"/>

  <!-- 左臂递金袋（已递出，手微张） -->
  <path d="M 90 100 C 84 104 82 108 82 114" fill="none" stroke="#5E8E7E" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="81" cy="116" r="3" fill="#D8C0A0"/>

  <!-- 右臂负背（转身前行） -->
  <path d="M 108 100 C 114 104 118 108 118 114" fill="none" stroke="#5E8E7E" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 释然金光（心静如水） -->
  <circle cx="99" cy="116" r="14" fill="#FFF7E0" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.1;0.18" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 山青释然尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="88">
      <animate attributeName="cy" values="88;80;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
