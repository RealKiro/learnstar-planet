<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨戬·二阶·拜师玉鼎·舞刀练功">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B8AC"/>
      <stop offset="100%" stop-color="#6E8A7A"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#7A8A96"/>
      <stop offset="60%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#46505C"/>
    </radialGradient>

    <g id="yangjian-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 天眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 玉泉山瀑布 -->
  <g>
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 150 20 L 158 90 Q 154 120 156 170 L 148 170 Q 146 120 150 90 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M 150 20 L 158 90 Q 154 120 156 170" fill="none" stroke="#D8E4E4" stroke-width="3" opacity="0.5"/>
    <!-- 水花 -->
    <path d="M 148 96 Q 140 104 146 112 Q 152 104 148 96 Z" fill="#E8F0F0" opacity="0.6"/>
  </g>

  <!-- 山岩 -->
  <path d="M 120 160 Q 150 130 190 150 L 200 200 L 110 200 Z" fill="#5B6B7A" opacity="0.5"/>

  <!-- 地面 -->
  <path d="M 0 168 Q 60 162 120 166 Q 170 170 200 164 L 200 200 L 0 200 Z" fill="#6E8A7A" opacity="0.5"/>

  <!-- 白犬（蹲坐瀑布边） -->
  <path d="M 118 146 Q 126 138 134 144 L 136 152 Q 124 156 116 152 Z" fill="#F0EEE8"/>
  <circle cx="132" cy="138" r="4.5" fill="#F0EEE8"/>
  <circle cx="133" cy="137" r="1" fill="#3A2A1A"/>
  <path d="M 128 140 L 124 136" stroke="#F0EEE8" stroke-width="2" stroke-linecap="round"/>

  <!-- 角色：青袍少年舞刀 -->
  <!-- 青布道袍 -->
  <path d="M 78 94 Q 72 108 76 128 Q 88 138 96 128 Q 100 112 96 98 Z" fill="url(#robe)"/>
  <!-- 束发 -->
  <path d="M 78 76 Q 88 68 98 74 L 96 66 Q 86 60 80 66 Z" fill="#2A1A0A"/>

  <!-- 头（基础脸） -->
  <use href="#yangjian-face" transform="translate(86,84) scale(0.95) rotate(-6)"/>

  <!-- 天眼渐睁（放微光） -->
  <circle cx="87" cy="66" r="8" fill="url(#eye)">
    <animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 手臂（舞刀） -->
  <path d="M 88 100 C 98 102 106 106 110 112" fill="none" stroke="url(#robe)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="112" cy="115" r="3.5" fill="#DCC4A0"/>

  <!-- 三尖两刃刀（舞动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 120 40;8 120 40;-6 120 40" dur="2.4s" repeatCount="indefinite"/>
    <line x1="104" y1="126" x2="136" y2="34" stroke="#D8D4CC" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 136 34 L 140 24 L 136 28 L 144 22 L 136 32 Z" fill="#E8E0D0"/>
    <path d="M 136 34 L 130 28 L 136 32 L 132 38 Z" fill="#E8E0D0"/>
  </g>

  <!-- 水珠微粒 -->
  <g fill="#D8E4E4">
    <circle cx="130" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="112">
      <animate attributeName="cy" values="112;104;112" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
