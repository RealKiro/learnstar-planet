<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汉钟离·一阶·燕台武将·跃马挥戈赤发猎猎">
  <defs>
    <!-- 背景：沙场烽烟 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A2E"/>
      <stop offset="52%" stop-color="#3E2418"/>
      <stop offset="100%" stop-color="#241210"/>
    </linearGradient>
    <!-- 落日金 -->
    <radialGradient id="sun" cx="78%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#E8A84E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8A84E" stop-opacity="0"/>
    </radialGradient>
    <!-- 红袍战甲 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0484E"/>
      <stop offset="100%" stop-color="#8E2E38"/>
    </linearGradient>
    <!-- 战马 -->
    <linearGradient id="horse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E4A3E"/>
      <stop offset="100%" stop-color="#4E3228"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D0B0"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="han_zhongli-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <path d="M -4.5 7 Q -2 9 0 7.4 M 0 7.4 Q 2 9 4.5 7 M -2 9.2 Q 0 11 2 9.2" stroke="#2E1A10" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 落日 -->
  <circle cx="156" cy="52" r="48" fill="url(#sun)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 烽烟战旗 -->
  <g opacity="0.8">
    <path d="M 20 24 L 20 100" stroke="#2E241C" stroke-width="2.2"/>
    <path d="M 20 24 L 50 32 L 20 42 Z" fill="#8E2E22">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 烽烟柱 -->
  <g stroke="#3A2E28" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <path d="M 150 40 Q 158 28 154 16">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 战场地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#2E1E14" opacity="0.8"/>
  <path d="M 0 154 L 200 154" stroke="#3E2A1E" stroke-width="1.4" opacity="0.6"/>

  <!-- 战马（跃马） -->
  <path d="M 62 136 Q 54 124 62 112 Q 76 104 88 106 Q 110 110 114 128 Q 116 142 108 148 Q 96 154 80 150 Q 66 146 62 136 Z" fill="url(#horse)" stroke="#3E2418" stroke-width="1.2"/>
  <path d="M 68 146 L 62 162 L 68 162 L 72 148 Z" fill="#4E3228"/>
  <path d="M 104 148 L 112 164 L 106 164 L 100 150 Z" fill="#4E3228"/>
  <path d="M 72 144 L 62 130 L 68 128 L 78 142 Z" fill="#4E3228"/>
  <!-- 马头 -->
  <path d="M 64 122 Q 52 112 50 102 Q 50 94 58 92 Q 66 92 70 98 Q 72 108 68 118 Z" fill="#6E4A3E" stroke="#3E2418" stroke-width="1"/>
  <path d="M 54 98 Q 46 96 44 90 Q 44 84 50 82 Q 56 82 60 88 Q 62 94 58 98 Z" fill="#6E4A3E" stroke="#3E2418" stroke-width="1"/>
  <path d="M 50 86 L 44 74 L 52 80 Z" fill="#8E5A3E"/>
  <circle cx="56" cy="92" r="1.6" fill="#1E1008"/>
  <!-- 马鬃 -->
  <path d="M 62 96 Q 60 90 64 86" stroke="#3E2418" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- 马尾 -->
  <path d="M 114 138 Q 124 134 128 126" stroke="#3E2418" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 114 138;10 114 138;0 114 138" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 马鞍 -->
  <path d="M 74 116 Q 84 112 94 116 L 92 126 L 76 126 Z" fill="#8E3A3E"/>

  <!-- 红袍战将（跃马挥戈） -->
  <!-- 战甲身 -->
  <!-- 肩甲 -->
  <!-- 腰带 -->
  <path d="M 82 112 L 104 112" stroke="#E8D8A8" stroke-width="2"/>

  <!-- 头（国字脸，赤发，浓眉虎目虬髯） -->
  <!-- 浓眉 -->
  <!-- 虎目含威 -->
  <!-- 鼻梁挺 -->
  <!-- 虬髯 -->

  <!-- 左臂勒缰 -->
  <path d="M 84 100 C 76 104 72 108 70 116" fill="none" stroke="#C0484E" stroke-width="4.4" stroke-linecap="round"/>

  <!-- 右臂挥戈 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 100 98;4 100 98;-5 100 98" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 100 98 C 106 92 112 88 118 84" fill="none" stroke="#C0484E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="120" cy="83" r="3.4" fill="#D8B894"/>
    <!-- 长戈 -->
    <line x1="120" y1="84" x2="142" y2="56" stroke="#C8CCD4" stroke-width="3" stroke-linecap="round"/>
    <path d="M 142 56 L 148 48" stroke="#E8ECF4" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 戈刃 -->
    <path d="M 140 54 L 136 44 L 144 48 Z" fill="#E8ECF4"/>
  </g>

    <animate attributeName="opacity" values="0.1;0.06;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 沙场金尘 -->
  <g fill="#E8A84E">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#han_zhongli-face" transform="translate(93,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 84 86 Q 88 81 93 81 Q 98 81 102 86 Q 98 82 93 82 Q 88 82 84 86 Z" fill="#B8432E"/>
</svg>
