<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝采和·二阶·遇仙点化·梦醒放下歌者执念">
  <defs>
    <!-- 背景：梦影月夜客店 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E6E8E"/>
      <stop offset="52%" stop-color="#4A586E"/>
      <stop offset="100%" stop-color="#36424E"/>
    </linearGradient>
    <!-- 梦影蓝 -->
    <radialGradient id="dream" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8EA8C8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8EA8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 破绿衫 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA878"/>
      <stop offset="100%" stop-color="#4E885E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="48" r="40" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>

  <!-- 梦影（歌台盛名如烟散尽） -->
  <circle cx="100" cy="70" r="60" fill="url(#dream)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 歌台虚影（散尽） -->
  <g opacity="0.4">
    <path d="M 70 40 L 130 40 L 126 50 L 74 50 Z" fill="#A8B8C8"/>
    <path d="M 80 50 L 80 66 M 120 50 L 120 66" stroke="#A8B8C8" stroke-width="1.4"/>
    <!-- 盛名如烟 -->
    <path d="M 100 36 Q 94 30 100 26 Q 106 22 100 18" stroke="#C8D8E8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 飘落的奖牌/荣耀散 -->
    <path d="M 84 58 L 90 64 L 84 62 M 116 58 L 110 64 L 116 62" stroke="#E8C07A" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 汉钟离（右，月下，手持芭蕉扇） -->
  <g opacity="0.85">
    <path d="M 146 108 Q 144 92 150 86 Q 156 90 156 106 Z" fill="#C0484E"/>
    <circle cx="152" cy="84" r="6.5" fill="#F0D0B0"/>
    <path d="M 148 80 Q 152 76 156 80 Q 154 75 152 75 Q 150 75 148 80 Z" fill="#B8432E"/>
    <!-- 芭蕉扇 -->
    <path d="M 158 88 Q 166 84 170 90 Q 172 96 166 98 Q 160 98 156 92 Z" fill="#6EA878" stroke="#4E885E" stroke-width="0.8"/>
  </g>

  <!-- 客店窗 -->
  <path d="M 20 96 L 56 96 L 56 128 L 20 128 Z" fill="#3A464E" stroke="#5A6E7E" stroke-width="2"/>
  <path d="M 20 112 L 56 112 M 38 96 L 38 128" stroke="#5A6E7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E3642" opacity="0.7"/>
  <path d="M 0 150 L 200 150" stroke="#424E5A" stroke-width="1.4" opacity="0.6"/>

  <!-- 歌童（赤足立于月下，望汉钟离而悟，眼神澄澈） -->
  <!-- 腿 -->
  <path d="M 88 132 L 82 156 L 87 156 L 92 134 Z" fill="#4E885E"/>
  <path d="M 104 132 L 112 158 L 106 158 L 100 134 Z" fill="#4E885E"/>
  <!-- 破绿衫 -->
  <path d="M 88 100 Q 84 116 90 134 Q 100 140 108 134 Q 114 116 110 100 Q 100 94 88 100 Z" fill="url(#cloth)" stroke="#3E6E4E" stroke-width="1"/>

  <!-- 头（眼神从迷惘到澄澈） -->
  <circle cx="99" cy="92" r="10" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
  <!-- 短发 -->
  <path d="M 90 88 Q 88 82 92 78" stroke="#2E2620" stroke-width="2" stroke-linecap="round"/>
  <path d="M 90 88 Q 94 84 99 84 Q 104 84 108 88 Q 104 85 99 85 Q 94 85 90 88 Z" fill="#2E2620"/>
  <!-- 眉眼 -->
  <path d="M 91 89 Q 94 87.8 97 88.4 M 101 88.4 Q 104 87.8 107 89" stroke="#1E1008" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- 眼（澄澈） -->
  <circle cx="94" cy="91.6" r="2.3" fill="#1E1008"/>
  <circle cx="104" cy="91.6" r="2.3" fill="#1E1008"/>
  <circle cx="95" cy="90.8" r="0.8" fill="#FFF"/>
  <circle cx="105" cy="90.8" r="0.8" fill="#FFF"/>
  <circle cx="94" cy="91.6" r="0.6" fill="#8EA8C8"/>
  <!-- 鼻梁 -->
  <path d="M 99 93.5 L 99 96" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 浅笑 -->
  <path d="M 94 99 Q 99 101.4 104 99" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 左臂垂持玉板 -->
  <path d="M 90 104 C 84 108 82 112 82 118" fill="none" stroke="#5E986E" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="77" y="116" width="9" height="14" rx="1.5" fill="#E8E0D0" stroke="#B8B0A0" stroke-width="0.8"/>

  <!-- 右臂（悟后负背/抚心） -->
  <path d="M 108 104 C 114 108 118 112 118 118" fill="none" stroke="#5E986E" stroke-width="3.6" stroke-linecap="round"/>

  <!-- 点化之光（自汉钟离扇端入心） -->
  <path d="M 152 90 Q 130 100 112 104" fill="none" stroke="#E8F0FA" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 梦醒星尘 -->
  <g fill="#8EA8C8">
    <circle cx="44" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="126" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
