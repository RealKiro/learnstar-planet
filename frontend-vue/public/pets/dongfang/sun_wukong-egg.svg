<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·一阶·灵胎·灵根育孕">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6A"/>
      <stop offset="100%" stop-color="#2A3542"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stone" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#6A7A8A"/>
      <stop offset="60%" stop-color="#5A6A7A"/>
      <stop offset="100%" stop-color="#44505E"/>
    </radialGradient>
    <radialGradient id="spirit" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：仙山地气 -->
  <ellipse cx="100" cy="182" rx="84" ry="9" fill="#222C38" opacity="0.7"/>
  <path d="M 26 186 Q 70 176 116 184 T 194 182" fill="none" stroke="#3A4A5A" stroke-width="1.8" opacity="0.5"/>

  <!-- 氛围：仙金灵光（呼吸） -->
  <circle cx="100" cy="150" r="48" fill="url(#halo)">
    <animate attributeName="r" values="48;56;48" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 灵石（不规则，顶有裂缝，非光滑蛋） -->
  <path d="M 70 138 L 76 124 L 86 132 L 96 120 L 100 112 L 104 120 L 116 128 L 124 138 L 130 154 L 120 170 L 100 178 L 80 172 L 70 158 Z" fill="url(#stone)"/>
  <path d="M 80 146 Q 88 152 84 162" fill="none" stroke="#3A4550" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 112 142 Q 118 150 114 160" fill="none" stroke="#3A4550" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 裂缝发光（石猴将出，微微闪动） -->
  <path d="M 96 122 L 100 114 L 104 122 L 102 132 L 98 132 Z" fill="#F5D742">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 石猴雏形（从裂缝探出，尖桃心脸雏形 + 金毛虚影） -->
  <circle cx="100" cy="102" r="18" fill="url(#spirit)">
    <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 尖桃心脸雏形（上宽下尖） -->
  <path d="M 100 88 C 109 88 112 96 110 102 C 108 109 103 114 100 116 C 97 114 92 109 90 102 C 88 96 91 88 100 88 Z" fill="#F5D742" opacity="0.4"/>
  <!-- 猴耳雏形 -->
  <circle cx="89" cy="94" r="2.5" fill="#F5D742" opacity="0.4"/>
  <circle cx="111" cy="94" r="2.5" fill="#F5D742" opacity="0.4"/>
  <!-- 金毛虚影 -->
  <path d="M 94 90 Q 98 85 100 83 M 100 83 Q 102 85 106 90 M 92 96 Q 88 94 86 96" stroke="#F5D742" stroke-width="1.4" stroke-linecap="round" opacity="0.6" fill="none"/>

  <!-- 仙气粒子（飘浮） -->
  <g fill="#C9B37E">
    <circle cx="72" cy="158">
      <animate attributeName="cy" values="158;150;158" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="154">
      <animate attributeName="cy" values="154;146;154" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
