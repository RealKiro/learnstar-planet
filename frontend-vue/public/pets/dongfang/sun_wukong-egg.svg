<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·一阶·灵胎·灵石孕育">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6A"/>
      <stop offset="100%" stop-color="#2A3542"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stone" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#6A7A8A"/>
      <stop offset="60%" stop-color="#5A6A7A"/>
      <stop offset="100%" stop-color="#44505E"/>
    </radialGradient>
    <radialGradient id="spirit" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>

    <!-- 孙悟空头部模板（脸中心 0,0；桃心脸+丹凤眼+雷公嘴） -->
    <g id="wukong-head">
      <path d="M 0 -34 C 16 -34 21 -20 19 -7 C 17 5 9 13 0 16 C -9 13 -17 5 -19 -7 C -21 -20 -16 -34 0 -34 Z" fill="#F7E6C6" stroke="#8B6914" stroke-width="1.2"/>
      <circle cx="-21" cy="-8" r="5" fill="#E0B13B"/>
      <circle cx="21" cy="-8" r="5" fill="#E0B13B"/>
      <path d="M -8 -33 Q -6 -42 -1 -46 Q 3 -43 5 -40 Q 8 -44 12 -42 Q 10 -34 6 -32" fill="none" stroke="#C08E26" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -18 -10 Q -25 -6 -27 -1 M 18 -10 Q 25 -6 27 -1" fill="none" stroke="#C08E26" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
      <path d="M -12 -6 Q -6 -14 2 -9 Q -6 -3 -12 -6 Z" fill="#1A0A0A"/>
      <path d="M -2 -9 Q 6 -14 12 -6 Q 6 -3 -2 -9 Z" fill="#1A0A0A"/>
      <circle cx="-4" cy="-9" r="1.4" fill="#F5D742"/>
      <circle cx="4" cy="-9" r="1.4" fill="#F5D742"/>
      <path d="M -13 -7 Q -11 -3 -8 -5" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M 13 -7 Q 11 -3 8 -5" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M -6 8 Q 0 14 6 8 Q 0 16 -6 8 Z" fill="#B0852A"/>
      <path d="M -4 10 Q 0 13 4 10" fill="none" stroke="#8E5A14" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-15" cy="2" r="4" fill="#C85A4A" opacity="0.25"/>
      <circle cx="15" cy="2" r="4" fill="#C85A4A" opacity="0.25"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 仙山云雾（托灵石） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="6s" repeatCount="indefinite"/>
    <path d="M 34 172 Q 60 164 88 170 Q 112 176 140 168 Q 162 162 182 170 L 176 184 Q 140 178 112 184 Q 84 190 52 184 Z" fill="#FFFFFF" opacity="0.5"/>
    <path d="M 58 178 Q 84 172 112 178 Q 138 184 158 180" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 氛围：仙金灵光（呼吸） -->
  <circle cx="100" cy="140" r="46" fill="url(#halo)">
    <animate attributeName="r" values="46;54;46" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 石内猴形轮廓（头部模板·隐约，无清晰五官） -->
  <g opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    <circle cx="100" cy="142" r="24" fill="url(#spirit)"/>
    <use href="#wukong-head" transform="translate(100,142) scale(0.5)" fill="#F5D742" opacity="0.35"/>
  </g>

  <!-- 灵石（悬于云雾，裂纹透金光） -->
  <path d="M 70 138 L 76 122 L 86 130 L 96 118 L 100 110 L 104 118 L 116 126 L 124 136 L 130 152 L 120 168 L 100 176 L 80 170 L 70 156 Z" fill="url(#stone)"/>
  <path d="M 80 146 Q 88 152 84 162" fill="none" stroke="#3A4550" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 112 140 Q 118 148 114 158" fill="none" stroke="#3A4550" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 裂纹金光（闪动） -->
  <path d="M 96 120 L 100 112 L 104 120 L 102 130 L 98 130 Z" fill="#F5D742">
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 100 114 L 100 106" stroke="#F5D742" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 仙气粒子（飘浮） -->
  <g fill="#C9B37E">
    <circle cx="68" cy="156">
      <animate attributeName="cy" values="156;148;156" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="152">
      <animate attributeName="cy" values="152;144;152" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
