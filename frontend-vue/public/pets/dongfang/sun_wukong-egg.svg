<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="孙悟空·一阶·灵胎·灵根育孕">
  <defs>
    <!-- 背景：玄青仙山灵气 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A6A"/>
      <stop offset="100%" stop-color="#2A3542"/>
    </linearGradient>
    <!-- 仙金微光 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
    <!-- 灵石 -->
    <radialGradient id="stone" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#6A7A8A"/>
      <stop offset="60%" stop-color="#5A6A7A"/>
      <stop offset="100%" stop-color="#44505E"/>
    </radialGradient>
    <!-- 猴形灵光 -->
    <radialGradient id="spirit" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：仙山地气 -->
  <ellipse cx="100" cy="182" rx="84" ry="9" fill="#222C38" opacity="0.7"/>
  <path d="M 26 186 Q 70 176 116 184 T 194 182" fill="none" stroke="#3A4A5A" stroke-width="1.8" opacity="0.5"/>

  <!-- 氛围：仙金灵光 -->
  <circle cx="100" cy="148" r="46" fill="url(#halo)"/>

  <!-- 灵石（下1/3居中，石卵孕育猴王） -->
  <path d="M 76 140 Q 72 158 86 168 Q 100 177 114 168 Q 128 158 124 140 Q 122 126 100 124 Q 78 126 76 140 Z" fill="url(#stone)"/>
  <!-- 石纹 -->
  <path d="M 86 148 Q 94 154 90 164" fill="none" stroke="#3A4550" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 110 138 Q 116 148 112 158" fill="none" stroke="#3A4550" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 100 126 Q 98 134 102 140" fill="none" stroke="#3A4550" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- 内部金毛猴王轮廓（微光蜷缩） -->
  <circle cx="100" cy="148" r="22" fill="url(#spirit)"/>
  <ellipse cx="100" cy="148" rx="10" ry="13" fill="#F5D742" opacity="0.45"/>
  <!-- 金毛线条 -->
  <path d="M 92 142 Q 96 138 100 141 M 100 141 Q 104 138 108 142 M 94 152 Q 100 149 106 152" stroke="#F5D742" stroke-width="1.3" stroke-linecap="round" opacity="0.7" fill="none"/>

  <!-- 仙气粒子 -->
  <circle cx="72" cy="158" r="1.2" fill="#C9B37E" opacity="0.5"/>
  <circle cx="128" cy="154" r="1" fill="#C9B37E" opacity="0.4"/>
  <circle cx="116" cy="164" r="0.9" fill="#C9B37E" opacity="0.35"/>
</svg>
