<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="申公豹·六阶·分水将军·执掌海眼以罪镇海护水族归家">
  <defs>
    <!-- 背景：北海海天澄澈 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E9EC0"/>
      <stop offset="55%" stop-color="#5E8EAC"/>
      <stop offset="100%" stop-color="#4E7E9C"/>
    </linearGradient>
    <!-- 神袍青光 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C8E8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8E8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 波光银 -->
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F4FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F4FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 分水将军神袍（青） -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8EAC"/>
      <stop offset="100%" stop-color="#3E6E8C"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>

    <!-- 头部模板：长脸·眉目淡泊·目含平静·薄唇温和 -->
    <g id="shenface">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 鹰目·薄唇 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 神袍青光 -->
  <circle cx="100" cy="92" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 波光银 -->
  <g fill="#E8F4FA" opacity="0.6">
    <circle cx="40" cy="60" r="2"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="158" cy="52" r="1.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="34" r="1.8"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 北海浪头（托足） -->
  <path d="M 0 138 Q 40 130 80 136 Q 120 142 160 134 Q 180 130 200 136 L 200 200 L 0 200 Z" fill="#4E7E9C"/>
  <path d="M 0 152 Q 50 144 100 150 Q 150 156 200 148 L 200 200 L 0 200 Z" fill="#3E6E8C"/>
  <!-- 浪头归平 -->
  <path d="M 20 160 Q 60 154 100 160 Q 140 166 180 158" stroke="#C8E8F0" stroke-width="1.6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <!-- 波光银点 -->
  <g fill="#E8F4FA">
    <circle cx="50" cy="170" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="176" r="1"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 水族送行（右下，受护归家） -->
  <g opacity="0.8">
    <!-- 小海豚/鱼 -->
    <path d="M 146 152 Q 152 146 160 150 Q 166 152 166 158 Q 166 164 160 164 Q 152 162 148 158 Q 145 156 146 152 Z" fill="#A8C8E0" stroke="#8EACB8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 166 158 L 172 154 L 170 162 Z" fill="#A8C8E0"/>
    <circle cx="158" cy="153" r="1.2" fill="#2E4E6E"/>
    <!-- 小龟 -->
    <path d="M 126 164 Q 130 160 136 162 Q 140 164 140 168 Q 140 172 134 173 Q 128 173 126 168 Z" fill="#6E8E8E" stroke="#5E7E7E" stroke-width="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="138" cy="165" r="1.4" fill="#3A5E5E"/>
  </g>

  <!-- 分水将军（神袍立于浪头，戾气尽消） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 158 L 86 158 L 90 136 Z" fill="#3E6E8C"/>
  <path d="M 108 134 L 114 160 L 108 160 L 104 136 Z" fill="#3E6E8C"/>
  <!-- 神袍下摆 -->
  <path d="M 84 124 Q 96 136 110 130 Q 114 124 110 116 Q 104 126 96 122 Q 88 126 84 124 Z" fill="url(#robe)"/>
  <!-- 身体 -->
  <path d="M 86 90 Q 82 106 88 124 Q 98 130 108 124 Q 114 106 110 90 Q 98 84 86 90 Z" fill="url(#robe)" stroke="#2E5E7C" stroke-width="1"/>
  <!-- 水纹带 -->
  <path d="M 86 110 L 110 110" stroke="#C8E8F0" stroke-width="1.8"/>
  <!-- 神袍水纹 -->
  <path d="M 90 96 Q 92 100 90 104 M 106 96 Q 104 100 106 104" stroke="#7EB8D0" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- 头（面部模板） -->
  <use href="#shenface" transform="translate(98,82) scale(1)"/>
  <!-- 神冠 -->
  <path d="M 88 72 Q 98 66 108 72 L 106 68 Q 98 62 90 68 Z" fill="#7EB8D0" opacity="0.9"/>
  <circle cx="98" cy="64" r="3" fill="#E8F4FA">
    <animate attributeName="r" values="3;4;3" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 左臂衣袖轻拂（止波平浪） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 88 94;3 88 94;-4 88 94" dur="3s" repeatCount="indefinite"/>
    <path d="M 88 94 C 80 98 76 104 74 112" fill="none" stroke="#5E8EAC" stroke-width="4.6" stroke-linecap="round"/>
    <!-- 拂袖水气 -->
    <path d="M 74 110 Q 64 116 66 124 Q 70 128 76 122" fill="#C8E8F0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手请水族留步（归家） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 108 94 C 116 96 122 100 126 106" fill="none" stroke="#5E8EAC" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="128" cy="108" r="3.2" fill="#D8C0A4"/>
    <path d="M 128 108 L 134 104" stroke="#C8E8F0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 波光星尘 -->
  <g fill="#E8F4FA">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
