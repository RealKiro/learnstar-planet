<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="铁拐李·四阶·济世跛仙·葫芦倾星斗百姓敬拜">
  <defs>
    <!-- 背景：市井街头人间烟火 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8A88A"/>
      <stop offset="52%" stop-color="#9E8E72"/>
      <stop offset="100%" stop-color="#7E6E58"/>
    </linearGradient>
    <!-- 葫芦金 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <!-- 星斗蓝 -->
    <radialGradient id="stars" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9AC8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 破衣 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E7A5E"/>
      <stop offset="100%" stop-color="#6E5E42"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E0C8AC"/>
      <stop offset="100%" stop-color="#C8B090"/>
    </radialGradient>

    <!-- 头部模板：蓬头·眼神慈悲明亮（脸中心 0,0） -->
    <g id="tieguaili-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 蓬头·眼亮 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.7" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <circle cx="-4.6" cy="0.4" r="2.8" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="2.8" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.5" r="1" fill="#FFF"/>
      <circle cx="4" cy="-0.5" r="1" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 葫芦金光 -->
  <circle cx="100" cy="110" r="82" fill="url(#aura)">
    <animate attributeName="opacity" values="0.75;0.45;0.75" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 市井屋舍 -->
  <g opacity="0.85">
    <path d="M 20 92 L 20 78 L 44 78 L 44 92 L 54 92 L 54 70 L 10 70 L 10 92 Z" fill="#A87A56"/>
    <path d="M 32 78 L 32 68 L 31 78 Z" fill="#A87A56"/>
    <path d="M 150 90 L 150 76 L 172 76 L 172 90 L 180 90 L 180 68 L 142 68 L 142 90 Z" fill="#B08A62"/>
    <path d="M 161 76 L 161 68 L 160 76 Z" fill="#B08A62"/>
  </g>

  <!-- 葫芦倾出的星斗（自左肩葫芦口涌出，漫天） -->
  <circle cx="60" cy="70" r="40" fill="url(#stars)">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#9AC8F0">
    <circle cx="46" cy="56" r="1.8"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="62" cy="44" r="1.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="78" cy="60" r="1.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="74" r="1.4"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="86" cy="48" r="1.2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- 星斗流泻光带 -->
  <path d="M 70 78 Q 76 86 84 90" fill="none" stroke="#9AC8F0" stroke-width="1.6" opacity="0.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 百姓敬拜（右） -->
  <g opacity="0.95">
    <circle cx="140" cy="138" r="4.5" fill="#E8D8BC"/>
    <path d="M 137 134 Q 140 131 143 134 Q 142 136 140 136 Q 138 136 137 134 Z" fill="#2E2620"/>
    <path d="M 138 142 Q 136 152 138 158 Q 142 158 142 142 Z" fill="#8E7E6E"/>
    <circle cx="158" cy="142" r="4" fill="#E8D8BC"/>
    <path d="M 155 138.5 Q 158 136 161 138.5 Q 160 140 158 140 Q 156 140 155 138.5 Z" fill="#2E2620"/>
    <path d="M 156 146 Q 154 154 156 158 Q 160 158 160 146 Z" fill="#C8B498"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 158 L 200 158 L 200 200 L 0 200 Z" fill="#6E5E4E" opacity="0.7"/>
  <path d="M 0 158 L 200 158" stroke="#7E6E5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 跛足仙翁（拄拐而立，葫芦倾星斗） -->
  <!-- 腿 -->
  <path d="M 88 138 L 82 160 L 88 160 L 94 140 Z" fill="#6E5E42"/>
  <path d="M 106 138 L 114 162 L 108 162 L 102 140 Z" fill="#6E5E42"/>
  <!-- 破衣 -->
  <path d="M 86 112 Q 82 128 88 140 Q 98 146 108 140 Q 114 128 110 112 Q 100 106 86 112 Z" fill="url(#cloth)" stroke="#5E4E38" stroke-width="1"/>
  <!-- 草绳腰带 -->
  <path d="M 86 124 L 110 124" stroke="#5E4E38" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#tieguaili-face" transform="translate(98,104) scale(1)"/>

  <!-- 左臂拄铁拐 -->
  <path d="M 88 114 C 82 118 78 122 76 128" fill="none" stroke="#8E7A5E" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="75" cy="130" r="3.2" fill="#D8C0A4"/>
  <line x1="75" y1="130" x2="60" y2="176" stroke="#3A3A3E" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 右肩葫芦（倾星斗） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 106 104 C 112 100 116 92 114 86 C 112 82 108 82 106 84 C 104 82 100 82 98 86 C 96 92 100 100 106 104 Z" fill="#A86A3E" stroke="#8E5A2E" stroke-width="1"/>
    <!-- 葫芦口 -->
    <path d="M 104 84 L 104 78 L 110 78 L 110 84" fill="#8E5A2E"/>
    <path d="M 101 102 Q 104 108 107 102" stroke="#C8905E" stroke-width="1.2" opacity="0.7"/>
  </g>
  <!-- 右手托葫芦底 -->
  <path d="M 108 112 C 112 114 116 116 118 120" fill="none" stroke="#8E7A5E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="119" cy="122" r="3" fill="#D8C0A4"/>

  <!-- 葫芦金尘 -->
  <g fill="#F5D742">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="72">
      <animate attributeName="cy" values="72;64;72" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
