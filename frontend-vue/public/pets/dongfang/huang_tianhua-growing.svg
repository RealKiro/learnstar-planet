<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黄天化·三阶·下山救父·玉麒麟莫邪剑">
  <defs>
    <!-- 背景：雄关与烽烟 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8906A"/>
      <stop offset="55%" stop-color="#7E6A4A"/>
      <stop offset="100%" stop-color="#5A4A32"/>
    </linearGradient>
    <!-- 烽烟战火 -->
    <radialGradient id="fire" cx="76%" cy="26%" r="55%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 剑光白 -->
    <radialGradient id="sword" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青布战袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E6E8E"/>
      <stop offset="100%" stop-color="#2E4256"/>
    </linearGradient>
    <!-- 玉麒麟青玉 -->
    <linearGradient id="qilin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8E0C8"/>
      <stop offset="55%" stop-color="#5EA878"/>
      <stop offset="100%" stop-color="#3E8058"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：少年方脸·剑眉入鬓·凤目英武（脸中心 0,0） -->
    <g id="huangtianhua-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 束发簪冠 -->
      <path d="M -5 -10 Q 0 -13 5 -10 Q 3 -14 0 -14 Q -3 -14 -5 -10 Z" fill="#1E1008"/>
      <!-- 额发 -->
      <path d="M -10 -4 Q -6 -9 0 -9 Q 6 -9 10 -4 Q 6 -8 0 -8 Q -6 -8 -10 -4 Z" fill="#1E1008"/>
      <!-- 剑眉入鬓 -->
      <path d="M -9 -2 Q -5 -4 -2 -3 M 9 -2 Q 5 -4 2 -3" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 凤目 -->
      <path d="M -8 0 Q -5 -1.6 -2 -0.8 L -2 0.8 Q -5 0 -8 1 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.6 2 -0.8 L 2 0.8 Q 5 0 8 1 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.5" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.5" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5" cy="-0.8" r="0.5" fill="#FFF"/>
      <circle cx="4" cy="-0.8" r="0.5" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1 L 0 3.4" stroke="#C8A882" stroke-width="1" stroke-linecap="round"/>
      <!-- 坚毅唇线 -->
      <path d="M -3.4 6 Q 0 7.6 3.4 6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 战火（右，烽烟） -->
  <circle cx="156" cy="52" r="70" fill="url(#fire)"/>
  <!-- 烽烟柱 -->
  <g fill="none" stroke="#3A3026" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M 168 40 Q 176 28 172 14">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 158 48 Q 164 34 160 22">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 雄关城墙 -->
  <path d="M 0 70 L 30 66 L 30 200 L 0 200 Z" fill="#6E5A42"/>
  <path d="M 0 66 L 200 66" stroke="#5A4A32" stroke-width="3"/>
  <path d="M 0 66 Q 30 74 60 66 Q 100 76 140 66 Q 170 74 200 66 L 200 84 Q 150 92 100 84 Q 50 92 0 84 Z" fill="#6E5A42"/>
  <path d="M 30 70 L 30 96 M 60 68 L 60 92 M 140 68 L 140 92 M 170 70 L 170 96" stroke="#5A4A32" stroke-width="2.4" opacity="0.6"/>

  <!-- 战场地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#5A4A32" opacity="0.6"/>
  <path d="M 0 150 L 200 150" stroke="#6E5A42" stroke-width="1.4" opacity="0.5"/>

  <!-- 黄飞虎残军（背景，模糊剪影） -->
  <g opacity="0.35">
    <path d="M 132 140 Q 132 124 138 120 Q 144 122 144 140 Z" fill="#3A2E24"/>
    <path d="M 152 146 Q 150 132 156 128 Q 162 130 162 146 Z" fill="#2E241C"/>
    <path d="M 176 142 Q 176 128 181 124 Q 187 127 186 142 Z" fill="#3A2E24"/>
  </g>

  <!-- 玉麒麟（青玉，昂首踏云） -->
  <!-- 法云托足 -->
  <path d="M 66 158 Q 88 150 110 158 Q 120 164 108 172 Q 88 180 70 172 Q 58 164 66 158 Z" fill="#E8E4DC" opacity="0.85"/>
  <!-- 后腿 -->
  <path d="M 78 148 L 72 162 L 77 162 L 82 150 Z" fill="#4E9870"/>
  <path d="M 122 148 L 128 160 L 123 160 L 118 150 Z" fill="#4E9870"/>
  <!-- 麒麟身 -->
  <path d="M 74 130 Q 66 118 74 108 Q 86 100 96 102 Q 116 106 120 122 Q 122 136 116 144 Q 104 150 92 148 Q 80 146 74 130 Z" fill="url(#qilin)" stroke="#3E8058" stroke-width="1.2"/>
  <!-- 前腿（腾踏） -->
  <path d="M 84 146 L 78 158 L 83 158 L 88 148 Z" fill="#4E9870"/>
  <path d="M 100 148 L 94 160 L 99 160 L 104 150 Z" fill="#5EA878"/>
  <!-- 麒麟头颈 -->
  <path d="M 76 118 Q 64 110 62 100 Q 62 92 70 90 Q 78 90 82 96 Q 84 106 80 112 Z" fill="#5EA878" stroke="#3E8058" stroke-width="1"/>
  <!-- 龙头形首 -->
  <path d="M 62 96 Q 54 94 52 88 Q 52 82 58 80 Q 64 80 68 86 Q 70 92 66 96 Z" fill="#5EA878" stroke="#3E8058" stroke-width="1"/>
  <!-- 麒麟角 -->
  <path d="M 60 84 L 56 72 L 62 78 Z" fill="#A8E0C8"/>
  <!-- 鬃毛（流苏） -->
  <path d="M 66 92 Q 62 98 60 104" stroke="#4E9870" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 眼 -->
  <circle cx="60" cy="88" r="1.5" fill="#1E3A2A"/>
  <!-- 尾巴 -->
  <g stroke="#3E8058" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M 120 126 Q 130 122 134 116">
      <animateTransform attributeName="transform" type="rotate" values="0 120 126;10 120 126;0 120 126" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年将军（跨玉麒麟，5头身） -->
  <!-- 战袍下摆 -->
  <path d="M 84 128 Q 92 138 104 138 Q 110 132 108 122 Q 102 130 96 128 Q 90 130 84 128 Z" fill="url(#robe)"/>
  <!-- 身体 -->
  <path d="M 88 98 Q 84 112 90 126 Q 98 130 106 126 Q 112 112 108 98 Q 98 93 88 98 Z" fill="url(#robe)" stroke="#1E2E42" stroke-width="1"/>
  <!-- 腰带金钩 -->
  <path d="M 88 114 L 108 114" stroke="#D8A040" stroke-width="1.8"/>
  <circle cx="108" cy="114" r="2" fill="#E8B64C"/>
  <!-- 左臂勒缰 -->
  <path d="M 90 100 C 82 104 78 108 76 116" fill="none" stroke="#2E4256" stroke-width="4.6" stroke-linecap="round"/>
  <!-- 头（面部模板） -->
  <use href="#huangtianhua-face" transform="translate(98,88) scale(1)"/>

  <!-- 右手擎莫邪剑出鞘（剑光如虹） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 112 100;3 112 100;-4 112 100" dur="1.7s" repeatCount="indefinite"/>
    <path d="M 108 102 C 114 98 120 94 124 88" fill="none" stroke="#2E4256" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="125" cy="87" r="3.4" fill="#F2DEC2"/>
    <!-- 莫邪剑 -->
    <path d="M 124 90 L 136 58" stroke="#F0F4FA" stroke-width="3" stroke-linecap="round"/>
    <path d="M 136 58 L 139 50" stroke="#F0F4FA" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 132 62 L 137 54" stroke="#FFF" stroke-width="1" opacity="0.9"/>
    <rect x="122" y="86" width="5" height="3" rx="1" fill="#D8A040"/>
  </g>
  <!-- 剑光（如虹） -->
  <circle cx="134" cy="56" r="22" fill="url(#sword)">
    <animate attributeName="r" values="22;28;22" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 冲刺尘烟（马蹄踏尘） -->
  <g fill="#8A7A5E" opacity="0.6">
    <circle cx="70" cy="160" r="4">
      <animate attributeName="cy" values="160;154;160" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="166" r="3">
      <animate attributeName="cy" values="166;160;166" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
