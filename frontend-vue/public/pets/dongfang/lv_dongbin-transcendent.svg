<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="吕洞宾·六阶·纯阳剑仙·人间市井点化众生">
  <defs>
    <!-- 背景：人间市井斜阳 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A878"/>
      <stop offset="52%" stop-color="#C8906A"/>
      <stop offset="100%" stop-color="#A87050"/>
    </linearGradient>
    <!-- 暮阳金 -->
    <radialGradient id="sun" cx="76%" cy="30%" r="38%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 剑符微光 -->
    <radialGradient id="talisman" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白衣便装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8DCD0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C0A4"/>
    </radialGradient>

    <!-- 头部模板：俊逸面容·眉目含笑·眼神慈悲温润（白发） -->
    <g id="lvdongbin-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -8 8 Q 0 12 8 8 Q 5 12 0 12.5 Q -5 12 -8 8 Z" fill="url(#skin)" opacity="0.6"/>
      <!-- 剑眉星目 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暮阳 -->
  <circle cx="152" cy="56" r="54" fill="url(#sun)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="56" r="13" fill="#FFF3C4" opacity="0.9">
    <animate attributeName="r" values="13;15;13" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 人间烟火（远景屋舍） -->
  <path d="M 0 118 Q 40 110 80 116 Q 120 122 160 112 Q 180 108 200 114 L 200 200 L 0 200 Z" fill="#8E6A50" opacity="0.7"/>
  <!-- 屋舍 -->
  <g opacity="0.9">
    <path d="M 24 96 L 24 84 L 40 84 L 40 96 L 48 96 L 48 78 L 16 78 L 16 96 Z" fill="#A87A56"/>
    <path d="M 30 84 L 30 76 L 29 84 Z" fill="#A87A56"/>
    <path d="M 120 92 L 120 82 L 134 82 L 134 92 L 140 92 L 140 74 L 114 74 L 114 92 Z" fill="#B08A62"/>
    <path d="M 126 82 L 126 74 L 125 82 Z" fill="#B08A62"/>
    <!-- 炊烟 -->
    <path d="M 33 76 Q 28 70 33 66 Q 38 62 33 58" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 古树（右） -->
  <path d="M 176 104 Q 174 88 178 74" stroke="#7E6A4E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="178" cy="70" r="10" fill="#8EA878"/>
  <circle cx="170" cy="74" r="6" fill="#7E9E68"/>
  <circle cx="186" cy="72" r="6" fill="#7E9E68"/>

  <!-- 市井地 -->
  <path d="M 0 156 L 200 156 L 200 200 L 0 200 Z" fill="#A8805E" opacity="0.8"/>
  <path d="M 0 156 L 200 156" stroke="#B89A74" stroke-width="1.4" opacity="0.6"/>

  <!-- 孩童（右下，听老翁讲古） -->
  <g opacity="0.95">
    <!-- 孩童一 -->
    <circle cx="146" cy="150" r="4.5" fill="#E8D8BC"/>
    <path d="M 143 146 Q 146 143 149 146 Q 148 148 146 148 Q 144 148 143 146 Z" fill="#2E2620"/>
    <path d="M 144 154 Q 142 164 144 170 Q 148 170 148 154 Z" fill="#C04848"/>
    <path d="M 145 156 L 147 150" fill="none" stroke="#E8D8BC" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 孩童二（蹲坐） -->
    <circle cx="166" cy="152" r="4" fill="#E8D8BC"/>
    <path d="M 163 148.5 Q 166 146 169 148.5 Q 168 150 166 150 Q 164 150 163 148.5 Z" fill="#2E2620"/>
    <path d="M 164 156 Q 162 164 164 168 Q 168 168 168 156 Z" fill="#5E8E7E"/>
    <path d="M 165 158 L 167 152" fill="none" stroke="#E8D8BC" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- 讲古老翁（白衣，白发，坐于树侧石凳） -->
  <!-- 石凳 -->
  <path d="M 96 158 L 130 156 L 132 166 L 94 168 Z" fill="#9A8A6E"/>
  <!-- 腿 -->
  <path d="M 104 148 L 100 158 L 106 158 L 108 150 Z" fill="#E8DCD0"/>
  <path d="M 120 148 L 126 158 L 121 158 L 118 150 Z" fill="#E8DCD0"/>
  <!-- 白衣身（坐） -->
  <path d="M 102 112 Q 98 128 102 146 Q 112 152 120 146 Q 124 128 120 112 Q 111 106 102 112 Z" fill="url(#robe)" stroke="#D8C8B8" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 102 130 L 120 130" stroke="#C8A84E" stroke-width="1.4"/>

  <!-- 头（面部模板，白发，扮老翁） -->
  <use href="#lvdongbin-face" transform="translate(111,104) scale(1)"/>
  <!-- 垂髫银须 -->
  <path d="M 106 113 Q 108 120 110 124 M 116 113 Q 114 120 112 124" stroke="#E8E0D0" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 105 108 Q 100 112 98 118" stroke="#E8E0D0" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- 腰间剑符微光（化于心中一念） -->
  <g>
    <path d="M 102 128 Q 96 132 98 138 Q 102 141 106 136 Q 108 130 104 127 Z" fill="#E8E0D0" stroke="#C8A84E" stroke-width="0.8"/>
    <circle cx="102" cy="133" r="10" fill="url(#talisman)">
      <animate attributeName="r" values="10;14;10" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 左臂（指向前方孩童，讲古） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 104 116;3 104 116;-4 104 116" dur="3s" repeatCount="indefinite"/>
    <path d="M 104 116 C 98 120 94 124 92 130" fill="none" stroke="#E8DCD0" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="91" cy="132" r="3.2" fill="#D8C0A4"/>
  </g>

  <!-- 右臂负手看斜阳 -->
  <path d="M 120 116 C 128 120 132 126 132 134" fill="none" stroke="#E8DCD0" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 点化之光（自剑符洒向孩童） -->
  <path d="M 102 136 Q 122 142 142 146" fill="none" stroke="#FFF7E0" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 暮阳金尘 -->
  <g fill="#FFF3C4">
    <circle cx="40" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="76">
      <animate attributeName="cy" values="76;66;76" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
