<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="张果老·一阶·恒山樵夫·挑担唱山歌自在">
  <defs>
    <!-- 背景：恒山古道 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA890"/>
      <stop offset="55%" stop-color="#7E8E72"/>
      <stop offset="100%" stop-color="#5E7258"/>
    </linearGradient>
    <!-- 云白 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 麻衣 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A89068"/>
      <stop offset="100%" stop-color="#8E7252"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="zhang_guolao-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉长垂 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="82" fill="url(#glow)"/>

  <!-- 远山叠嶂 -->
  <path d="M 0 126 Q 40 106 90 116 Q 140 124 200 112 L 200 200 L 0 200 Z" fill="#6E8E68" opacity="0.5"/>
  <path d="M 0 146 Q 60 132 120 140 Q 170 146 200 138 L 200 200 L 0 200 Z" fill="#5E7E5E" opacity="0.7"/>

  <!-- 白云绕峰 -->
  <g opacity="0.65">
    <path d="M 0 92 Q 28 82 52 90 Q 66 98 54 106 Q 34 114 10 104 Q 0 100 0 92 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 古道 -->
  <path d="M 60 170 Q 84 158 110 162 Q 136 166 158 156 L 180 160 L 180 200 L 40 200 Z" fill="#8E9E86" opacity="0.7"/>

  <!-- 粗布樵夫（6头身，挑柴而行） -->
  <!-- 腿 -->
  <path d="M 88 136 L 84 158 L 90 158 L 94 138 Z" fill="#8E7252"/>
  <path d="M 108 136 L 114 160 L 108 160 L 104 138 Z" fill="#8E7252"/>
  <!-- 麻衣 -->
  <!-- 腰带 -->
  <path d="M 90 118 L 110 118" stroke="#5E4A32" stroke-width="1.8"/>
  <!-- 腰别酒葫芦 -->
  <path d="M 90 114 Q 84 120 88 128 Q 92 132 96 128 Q 98 120 92 114 Z" fill="#A86A3E" stroke="#8E5A2E" stroke-width="1"/>

  <!-- 头（圆脸憨厚，粗眉，乱发扎巾） -->
  <!-- 扎巾 -->
  <!-- 粗眉 -->
  <!-- 眼大而诚 -->
  <!-- 鼻梁宽 -->
  <!-- 带笑 -->

  <!-- 柴担（肩挑） -->
  <line x1="70" y1="108" x2="132" y2="104" stroke="#5E4A32" stroke-width="2.6"/>
  <!-- 柴捆左 -->
  <path d="M 62 104 L 60 118 L 78 120 L 80 108 Z" fill="#8E6A42"/>
  <path d="M 66 108 L 64 116 M 72 108 L 70 116 M 76 108 L 74 116" stroke="#6E5238" stroke-width="1" opacity="0.6"/>
  <!-- 柴捆右 -->
  <path d="M 128 102 L 126 116 L 144 118 L 146 106 Z" fill="#8E6A42"/>
  <path d="M 132 104 L 130 114 M 138 104 L 136 114" stroke="#6E5238" stroke-width="1" opacity="0.6"/>

  <!-- 左臂扶担 -->
  <path d="M 92 102 C 86 104 84 106 82 108" fill="none" stroke="#A89068" stroke-width="4" stroke-linecap="round"/>

  <!-- 右臂摆（唱山歌） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 108 102;4 108 102;-5 108 102" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 108 102 C 114 100 118 98 120 94" fill="none" stroke="#A89068" stroke-width="4" stroke-linecap="round"/>
    <circle cx="121" cy="93" r="3" fill="#D8C0A0"/>
  </g>

  <!-- 山歌音浪 -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.5" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山野金尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="106">
      <animate attributeName="cy" values="106;98;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="154" cy="88">
      <animate attributeName="cy" values="88;80;88" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#zhang_guolao-face" transform="translate(100,90) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 90 88 Q 94 83 100 83 Q 106 83 110 88 Q 106 84 100 84 Q 94 84 90 88 Z" fill="#2E2620"/>
</svg>
