<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="太上老君·一阶·一气化生·混沌初开天地分">
  <defs>
    <!-- 背景：混沌虚空星海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2E4E"/>
      <stop offset="52%" stop-color="#221E3E"/>
      <stop offset="100%" stop-color="#16122E"/>
    </linearGradient>
    <!-- 紫气 -->
    <radialGradient id="ziqi" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#9E6EB8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9E6EB8" stop-opacity="0"/>
    </radialGradient>
    <!-- 初光金 -->
    <radialGradient id="first" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫金道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EB8"/>
      <stop offset="100%" stop-color="#5E4E8E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="100%" stop-color="#E0C8A8"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="taishang_laojun-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 星海 -->
  <g fill="#C8D8F0">
    <circle cx="30" cy="40" r="1.2"/><circle cx="70" cy="22" r="1"/>
    <circle cx="160" cy="30" r="1.3"/><circle cx="180" cy="70" r="1"/>
    <circle cx="24" cy="150" r="1"/><circle cx="150" cy="170" r="1.2"/>
  </g>
  <!-- 紫气缭绕 -->
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 清气上升（右上） -->
  <path d="M 120 60 Q 132 44 128 28" stroke="#E8F4E8" stroke-width="2" stroke-linecap="round" opacity="0.7" fill="none">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="128" cy="26" r="3" fill="#E8F4E8" opacity="0.8">
    <animate attributeName="cy" values="26;18;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 浊气下沉（右下） -->
  <path d="M 120 132 Q 132 146 128 162" stroke="#4E3E5E" stroke-width="2" stroke-linecap="round" opacity="0.7" fill="none">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <circle cx="128" cy="164" r="3" fill="#4E3E5E" opacity="0.8">
    <animate attributeName="cy" values="164;172;164" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 天地初分线（清浊之间） -->
  <path d="M 30 96 Q 100 88 170 94" stroke="#FFF3C4" stroke-width="1.4" opacity="0.5" fill="none">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 腿 -->
  <path d="M 88 134 L 84 158 L 90 158 L 94 136 Z" fill="#5E4E8E"/>
  <path d="M 106 134 L 114 160 L 108 160 L 102 136 Z" fill="#5E4E8E"/>
  <!-- 紫金道袍 -->
  <!-- 腰带 -->
  <path d="M 88 116 L 110 116" stroke="#E8D8A8" stroke-width="1.6"/>
  <!-- 紫气纹 -->

  <!-- 头（童颜鹤发，白发白须） -->
  <!-- 眉目慈悲 -->
  <!-- 眼含无量道意 -->
  <!-- 鼻梁 -->
  <!-- 白须 -->
  <!-- 含笑 -->

  <!-- 左手拈诀（清浊分判） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 90 100 C 82 104 76 106 72 100" fill="none" stroke="#7E6E9E" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 拈诀指尖 -->
    <circle cx="71" cy="98" r="3" fill="#E0C8A8"/>
    <!-- 诀端初光 -->
    <circle cx="70" cy="96" r="8" fill="url(#first)">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右手负背 -->
  <path d="M 108 100 C 114 104 116 110 114 118" fill="none" stroke="#7E6E9E" stroke-width="4.2" stroke-linecap="round"/>

  <!-- 紫气星尘 -->
  <g fill="#9E6EB8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#taishang_laojun-face" transform="translate(99,88) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 94 79 Q 99 75 104 79 Q 102 74 99 74 Q 96 74 94 79 Z" fill="#E8E4DC"/>
  <path d="M 89 86 Q 93 81 99 81 Q 105 81 109 86 Q 105 82 99 82 Q 93 82 89 86 Z" fill="#E8E4DC"/>
</svg>
