<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="曹国舅·五阶·八仙过海·玉磬一击磬音开道">
  <defs>
    <!-- 背景：沧海澄净 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E8EAE"/>
      <stop offset="52%" stop-color="#4E7E9E"/>
      <stop offset="100%" stop-color="#3E6E8E"/>
    </linearGradient>
    <!-- 磬光玉白 -->
    <radialGradient id="qing" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#E8F4E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8F4E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白衣鹤氅 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#D0CCC4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：清俊面容·眉目宁静·眼含雅意 -->
    <g id="caoguojiu-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="11" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 莲花冠 -->
      <path d="M -6 -8 Q 0 -11 6 -8 Q 4 -12 0 -12 Q -4 -12 -6 -8 Z" fill="#E8D8A8" stroke="#C8B068" stroke-width="0.7"/>
      <circle cx="0" cy="-11" r="2.6" fill="#F0C8D8"/>
      <path d="M -2.4 -12 Q 0 -13.6 2.4 -12 Q 0 -11 0 -11 Z" fill="#F0C8D8"/>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8.5 0 -8.5 Q 5 -8.5 9 -3.5 Q 5 -7.5 0 -7.5 Q -5 -7.5 -9 -3.5 Z" fill="#1E1814"/>
      <!-- 眉目宁静 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.3" ry="2.1" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.4" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 宁静 -->
      <path d="M -3.2 6 Q 0 7.2 3.2 6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 磬光 -->
  <circle cx="100" cy="104" r="84" fill="url(#qing)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.25;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 沧海 -->
  <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#3E6E8E"/>
  <path d="M 0 160 Q 60 152 120 158 Q 170 164 200 156 L 200 200 L 0 200 Z" fill="#2E5E7E"/>

  <!-- 八仙虚影 -->
  <g opacity="0.4">
    <path d="M 28 132 Q 30 120 35 116 Q 40 118 40 132 Z" fill="#C8C0A8"/>
    <path d="M 50 136 Q 51 124 56 120 Q 61 122 60 136 Z" fill="#B8A878"/>
    <path d="M 168 130 Q 169 118 174 114 Q 179 116 178 130 Z" fill="#A8B8A8"/>
  </g>

  <!-- 磬音开道（脚下清波） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 96 142;4 96 142;0 96 142" dur="3s" repeatCount="indefinite"/>
    <path d="M 56 146 Q 76 138 96 142 Q 118 146 136 140" stroke="#E8F4E8" stroke-width="2" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="96" cy="142" r="16" fill="#E8F4E8" opacity="0.35">
    <animate attributeName="r" values="16;21;16" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 白衣道人（击磬凌波） -->
  <!-- 腿 -->
  <path d="M 90 128 L 86 146 L 92 146 L 96 130 Z" fill="#C8C4BC"/>
  <path d="M 106 128 L 114 150 L 108 150 L 102 130 Z" fill="#C8C4BC"/>
  <!-- 白衣鹤氅 -->
  <path d="M 88 100 Q 84 114 90 132 Q 100 138 108 132 Q 114 114 110 100 Q 100 94 88 100 Z" fill="url(#robe)" stroke="#C0BCB4" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 88 116 L 110 116" stroke="#B8B0A8" stroke-width="1.4"/>

  <!-- 头（面部模板） -->
  <use href="#caoguojiu-face" transform="translate(99,92) scale(1)"/>

  <!-- 左臂托玉磬 -->
  <path d="M 90 106 C 84 110 80 114 78 120" fill="none" stroke="#E8E4DC" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="77" cy="122" r="3" fill="#D8C0A0"/>

  <!-- 右臂执磬槌（一击） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 108 104;5 108 104;-6 108 104" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 106 104 C 112 100 116 96 118 90" fill="none" stroke="#E8E4DC" stroke-width="4" stroke-linecap="round"/>
    <circle cx="119" cy="88" r="3" fill="#D8C0A0"/>
    <line x1="119" y1="90" x2="116" y2="80" stroke="#8E7A5E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="116" cy="78" r="2.6" fill="#C8B498"/>
  </g>

  <!-- 玉磬 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 76 134;-6 76 134;0 76 134" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 70 130 Q 76 126 82 130 Q 84 136 78 139 Q 72 139 70 134 Z" fill="#E8F4E8" stroke="#B8D8C8" stroke-width="1"/>
    <circle cx="76" cy="133" r="12" fill="url(#qing)">
      <animate attributeName="r" values="12;16;12" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- 磬音开道波 -->
    <g stroke="#E8F4E8" stroke-width="1.4" opacity="0.6" fill="none">
      <circle cx="76" cy="133" r="20">
        <animate attributeName="r" values="20;30;20" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 磬音雅尘 -->
  <g fill="#E8F4E8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
