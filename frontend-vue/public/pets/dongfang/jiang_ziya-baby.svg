<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·二阶·昆仑拜师·挑水砍柴">
  <defs>
    <!-- 背景：昆仑云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A9BA8"/>
      <stop offset="100%" stop-color="#5B6B7A"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="sun" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F0E0B8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0E0B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#7A8A96"/>
      <stop offset="60%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#46505C"/>
    </radialGradient>

    <g id="jiangziya-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉·白须 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="60" r="70" fill="url(#sun)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海（翻涌） -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="7s" repeatCount="indefinite"/>
    <path d="M 0 150 Q 40 138 80 146 Q 120 154 160 144 Q 180 140 200 148 L 200 200 L 0 200 Z" fill="#C8D4DC" opacity="0.7"/>
    <path d="M 20 158 Q 60 150 100 156 Q 150 162 190 154" fill="none" stroke="#D8E0E4" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 远山（昆仑） -->
  <path d="M 0 160 Q 50 120 110 148 Q 150 164 200 140 L 200 200 L 0 200 Z" fill="#5B6B7A" opacity="0.5"/>

  <!-- 古松（身后） -->
  <path d="M 150 120 L 150 160" stroke="#3E4A3A" stroke-width="5" stroke-linecap="round"/>
  <path d="M 150 126 Q 138 116 132 120 M 150 136 Q 164 126 170 130 M 150 120 Q 162 110 168 114" fill="none" stroke="#4A5A4A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 150 116 Q 146 108 150 102 Q 154 108 150 116 Z" fill="#3E5C4B" opacity="0.9"/>

  <!-- 角色：青袍面东坐石（晨光照背影） -->
  <!-- 坐石 -->
  <path d="M 66 158 L 100 158 L 96 168 L 70 168 Z" fill="#6E7A86" opacity="0.7"/>
  <!-- 青袍身体（坐姿面东） -->
  <path d="M 82 100 Q 76 116 80 134 Q 90 144 98 134 Q 102 118 100 104 Z" fill="url(#robe)"/>
  <!-- 布巾束发（黑发） -->
  <path d="M 84 84 Q 92 76 100 82 L 98 74 Q 90 68 84 74 Z" fill="#4A5A66" opacity="0.9"/>
  <!-- 头（基础脸，侧面朝东） -->
  <use href="#jiangziya-face" transform="translate(94,90) scale(0.92) rotate(-8)"/>
  <!-- 晨光打亮背影轮廓 -->
  <path d="M 100 88 C 104 96 104 112 100 126" fill="none" stroke="#F0E0B8" stroke-width="1.6" opacity="0.5"/>

  <!-- 柴担（旁） -->
  <path d="M 120 132 L 142 120" stroke="#8E6E3A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 128 128 L 132 134 L 140 124" stroke="#6E5A3A" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- 晨光微粒 -->
  <g fill="#F0E0B8">
    <circle cx="150" cy="88">
      <animate attributeName="cy" values="88;80;88" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="118">
      <animate attributeName="cy" values="118;110;118" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
