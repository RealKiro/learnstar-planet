<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="姜子牙·二阶·凡尘·垂钓渭水">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#414E5A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="robe" cx="45%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#8A9BA8"/>
      <stop offset="60%" stop-color="#7A8A96"/>
      <stop offset="100%" stop-color="#5B6B7A"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>

    <g id="jiangziya-head">
      <ellipse cx="0" cy="0" rx="17" ry="16" fill="#F5EEDC" stroke="#D8C0A0" stroke-width="1"/>
      <path d="M -10 -6 Q -6 -10 -2 -8 M 10 -6 Q 6 -10 2 -8" fill="none" stroke="#8E7A5A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -8 -4 Q -5 -2 -2 -4 M 8 -4 Q 5 -2 2 -4" fill="none" stroke="#5A4A3A" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M -1 0 L 1 0 L 0 3" fill="none" stroke="#C0A884" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M -4 7 Q 0 9 4 7" fill="none" stroke="#A08A68" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -14 -8 Q -10 -18 0 -20 Q 10 -18 14 -8 Q 8 -14 0 -15 Q -8 -14 -14 -8 Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="-22" r="5" fill="#FFFFFF" opacity="0.9"/>
      <path d="M -7 10 Q -4 20 0 24 Q 4 20 7 10 Q 3 14 0 15 Q -3 14 -7 10 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#side)"/>

  <!-- 灵光（呼吸） -->
  <circle cx="100" cy="112" r="66" fill="url(#core)">
    <animate attributeName="r" values="66;74;66" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 渭水（水面） -->
  <path d="M 0 164 Q 50 158 100 162 Q 150 166 200 160 L 200 200 L 0 200 Z" fill="#5B6B7A" opacity="0.5"/>
  <path d="M 40 168 Q 70 164 100 167 Q 130 170 160 166" fill="none" stroke="#8A9BA8" stroke-width="1.4" stroke-linecap="round" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 身体（布衣老翁，侧坐水边） -->
  <path d="M 84 96 Q 76 110 82 130 Q 100 142 118 130 Q 124 110 116 96 Q 100 88 84 96 Z" fill="url(#robe)"/>
  <!-- 衣襟 -->
  <path d="M 100 92 L 100 132" stroke="#5B6B7A" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <!-- 盘腿 -->
  <ellipse cx="100" cy="156" rx="20" ry="9" fill="#5B6B7A" opacity="0.6"/>

  <!-- 手臂（执竿） -->
  <path d="M 104 104 C 114 106 120 110 122 116" fill="none" stroke="url(#robe)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="123" cy="119" r="4" fill="#D8C0A0"/>

  <!-- 钓竿（直钩垂钓） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 123 119;3 123 119;0 123 119" dur="4s" repeatCount="indefinite"/>
    <path d="M 123 119 C 130 112 138 106 148 100" fill="none" stroke="#8E6E3A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 148 100 L 150 140" fill="none" stroke="#C9B37E" stroke-width="0.8" opacity="0.9"/>
    <path d="M 148 138 L 154 142 M 148 142 L 154 138" stroke="#C9B37E" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 头（头部模板 scale 0.95，身体正上方） -->
  <use href="#jiangziya-head" transform="translate(100,98) scale(0.95)"/>

  <!-- 束发布巾 -->
  <path d="M 84 82 Q 100 76 116 82 L 114 74 Q 100 68 86 74 Z" fill="#4A5A6A" opacity="0.85"/>

  <!-- 晨光微粒 -->
  <g fill="#E8B84B">
    <circle cx="42" cy="110">
      <animate attributeName="cy" values="110;102;110" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="118">
      <animate attributeName="cy" values="118;110;118" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
