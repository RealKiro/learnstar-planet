<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杨任·三阶·掌中生目·掌目重光照彻云海">
  <defs>
    <!-- 背景：仙山洞府晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B8A0"/>
      <stop offset="55%" stop-color="#7E9078"/>
      <stop offset="100%" stop-color="#5E705E"/>
    </linearGradient>
    <!-- 掌目金光 -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 青布道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E7E6E"/>
      <stop offset="100%" stop-color="#3E5E52"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8BC98"/>
    </radialGradient>

    <!-- 头部模板：国字脸·眉目清明·束发（脸中心 0,0） -->
    <g id="yangren-face">
      <ellipse cx="0" cy="0" rx="11" ry="10.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <path d="M -10 4 L 10 4 L 8 10 L -8 10 Z" fill="url(#skin)" stroke="#C8A882" stroke-width="0.5"/>
      <!-- 白眉·掌目 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -8 0 Q -5 -1.8 -2 -0.9 L -2 0.9 Q -5 0 -8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <path d="M 8 0 Q 5 -1.8 2 -0.9 L 2 0.9 Q 5 0 8 1.2 Z" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="4.8" cy="-0.3" r="1.3" fill="#1E1008"/>
      <circle cx="-5.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <circle cx="4.3" cy="-0.9" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.2 Q 0 7 3.2 6.2" fill="none" stroke="#8E5A3E" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 洞府晨光 -->
  <radialGradient id="morning" cx="50%" cy="32%" r="56%">
    <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="64" r="80" fill="url(#morning)"/>

  <!-- 青山如洗 -->
  <path d="M 0 130 Q 40 108 90 118 Q 140 126 200 112 L 200 200 L 0 200 Z" fill="#6E8268" opacity="0.55"/>
  <path d="M 0 152 Q 50 138 110 146 Q 160 152 200 142 L 200 200 L 0 200 Z" fill="#5E745C" opacity="0.7"/>

  <!-- 仙云 -->
  <g opacity="0.6">
    <path d="M 0 90 Q 30 80 56 88 Q 70 96 58 104 Q 36 112 12 104 Q 0 98 0 90 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 洞前石台 -->
  <path d="M 60 166 L 140 158 L 150 176 L 48 176 Z" fill="#5E6E5E"/>
  <path d="M 60 166 L 140 158" stroke="#7E8E7E" stroke-width="1.6" opacity="0.6"/>

  <!-- 青袍道者（7头身，双手抬起，掌目放光） -->
  <!-- 腿 -->
  <path d="M 84 138 L 82 162 L 88 162 L 90 140 Z" fill="#3E5E52"/>
  <path d="M 108 138 L 112 162 L 106 162 L 104 140 Z" fill="#3E5E52"/>
  <!-- 道袍下摆 -->
  <path d="M 82 128 Q 96 140 112 134 Q 116 126 112 118 Q 104 130 96 126 Q 88 130 82 128 Z" fill="url(#robe)"/>
  <!-- 身体 -->
  <path d="M 84 92 Q 80 108 86 128 Q 98 134 110 128 Q 116 108 112 92 Q 98 86 84 92 Z" fill="url(#robe)" stroke="#2E4E42" stroke-width="1"/>
  <!-- 腰带 -->
  <path d="M 84 112 L 112 112" stroke="#8E9A6E" stroke-width="1.8"/>

  <!-- 头（面部模板） -->
  <use href="#yangren-face" transform="translate(98,84) scale(1)"/>

  <!-- 左臂抬起，掌心目放光 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 86 96 C 76 100 70 92 66 82" fill="none" stroke="#4E6E60" stroke-width="5" stroke-linecap="round"/>
    <!-- 掌心（掌目） -->
    <circle cx="65" cy="80" r="6" fill="#E8D8C0" stroke="#B8A888" stroke-width="0.8"/>
    <ellipse cx="65" cy="80" rx="3.4" ry="3" fill="#1E1008"/>
    <circle cx="65.6" cy="79.2" r="1.1" fill="#FFF"/>
    <!-- 掌目金光 -->
    <circle cx="65" cy="80" r="16" fill="url(#eyeGlow)">
      <animate attributeName="r" values="16;21;16" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右臂抬起，掌心目放光 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 110 96 C 120 100 126 92 130 82" fill="none" stroke="#4E6E60" stroke-width="5" stroke-linecap="round"/>
    <circle cx="131" cy="80" r="6" fill="#E8D8C0" stroke="#B8A888" stroke-width="0.8"/>
    <ellipse cx="131" cy="80" rx="3.4" ry="3" fill="#1E1008"/>
    <circle cx="131.6" cy="79.2" r="1.1" fill="#FFF"/>
    <circle cx="131" cy="80" r="16" fill="url(#eyeGlow)">
      <animate attributeName="r" values="16;21;16" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 掌目双光照云海 -->
  <g stroke="#FFF3C4" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <path d="M 65 80 Q 40 120 30 170">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 131 80 Q 156 120 166 170">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 金尘 -->
  <g fill="#FFE066">
    <circle cx="40" cy="60">
      <animate attributeName="cy" values="60;50;60" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="56">
      <animate attributeName="cy" values="56;46;56" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
