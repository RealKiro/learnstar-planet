<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="太上老君·二阶·青牛出关·五千言道化众生">
  <defs>
    <!-- 背景：函谷关古道落日 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#C8985E"/>
      <stop offset="100%" stop-color="#9E7850"/>
    </linearGradient>
    <!-- 落日金 -->
    <radialGradient id="sun" cx="76%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 经文化金 -->
    <radialGradient id="gold" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫金道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EB8"/>
      <stop offset="100%" stop-color="#5E4E8E"/>
    </linearGradient>
    <!-- 青牛 -->
    <linearGradient id="ox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8E8E"/>
      <stop offset="100%" stop-color="#3E6E6E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2E2CC"/>
      <stop offset="100%" stop-color="#E0C8A8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 落日 -->
  <circle cx="152" cy="48" r="46" fill="url(#sun)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="12" fill="#FFF3C4" opacity="0.9"/>

  <!-- 函谷关（右，关隘） -->
  <g opacity="0.8">
    <path d="M 140 40 L 196 40 L 190 58 Q 166 70 148 64 Z" fill="#A8805E"/>
    <path d="M 140 40 L 196 40" stroke="#C8A878" stroke-width="1.2"/>
    <rect x="162" y="58" width="14" height="48" rx="2" fill="#8E6A48"/>
    <rect x="150" y="58" width="8" height="48" rx="2" fill="#8E6A48"/>
  </g>
  <!-- 古道 -->
  <path d="M 0 170 Q 40 162 90 166 Q 140 170 170 162 L 180 170 L 180 200 L 0 200 Z" fill="#8E7858" opacity="0.7"/>

  <!-- 尹喜伏拜（右） -->
  <g opacity="0.9">
    <circle cx="132" cy="140" r="4.5" fill="#E8D8BC"/>
    <path d="M 129 136 Q 132 133 135 136 Q 134 138 132 138 Q 130 138 129 136 Z" fill="#2E2620"/>
    <path d="M 130 144 Q 128 154 130 160 Q 134 160 134 144 Z" fill="#6E5E8E"/>
    <!-- 伏拜手 -->
    <path d="M 130 150 Q 126 154 128 160" fill="none" stroke="#E8D8BC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 五千言化金光（洒向人间） -->
  <circle cx="100" cy="100" r="70" fill="url(#gold)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 金色经文（方块字） -->
  <g fill="#FFF3C4" opacity="0.85">
    <rect x="54" y="70" width="7" height="9" rx="1"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="70" y="56" width="7" height="9" rx="1"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.8s" repeatCount="indefinite"/></rect>
    <rect x="82" y="68" width="7" height="9" rx="1"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="108" y="60" width="7" height="9" rx="1"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="62" y="86" width="6" height="8" rx="1"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="118" y="78" width="6" height="8" rx="1"><animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.6s" repeatCount="indefinite"/></rect>
  </g>
  <!-- 经文散开光带 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <path d="M 70 96 Q 50 104 40 116">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青牛（缓行） -->
  <path d="M 40 130 Q 32 120 40 112 Q 52 106 64 110 Q 80 114 84 128 Q 86 140 78 146 Q 66 152 52 148 Q 40 144 40 130 Z" fill="url(#ox)" stroke="#2E5E5E" stroke-width="1.2"/>
  <path d="M 46 144 L 42 162 L 48 162 L 52 146 Z" fill="#3E6E6E"/>
  <path d="M 72 146 L 80 164 L 74 164 L 68 148 Z" fill="#3E6E6E"/>
  <!-- 牛头 -->
  <path d="M 42 120 Q 32 112 30 102 Q 30 94 38 92 Q 46 92 50 98 Q 52 108 48 116 Z" fill="#5E8E8E" stroke="#2E5E5E" stroke-width="1"/>
  <path d="M 34 98 L 28 88 L 36 94 Z" fill="#5E8E8E"/>
  <path d="M 42 98 L 38 88 L 44 94 Z" fill="#5E8E8E"/>
  <circle cx="38" cy="96" r="1.6" fill="#1E1008"/>
  <path d="M 34 100 Q 36 102 40 102" stroke="#2E5E5E" stroke-width="1" fill="none"/>
  <!-- 牛尾 -->
  <path d="M 84 134 Q 94 130 98 122" stroke="#2E5E5E" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 84 134;8 84 134;0 84 134" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 牛鞍 -->
  <path d="M 46 116 Q 56 112 66 116 L 64 126 L 48 126 Z" fill="#8E6A42"/>

  <!-- 道祖（骑青牛，持拂尘） -->
  <!-- 腿 -->
  <path d="M 48 118 L 44 128 M 64 118 L 68 128" stroke="#7E6E9E" stroke-width="4.2" stroke-linecap="round"/>
  <!-- 紫金道袍 -->
  <path d="M 44 96 Q 40 108 44 120 Q 52 124 60 120 Q 64 108 62 96 Q 52 90 44 96 Z" fill="url(#robe)" stroke="#4E3E7E" stroke-width="1"/>

  <!-- 头（面部模板，白发白须） -->
  <circle cx="53" cy="86" r="10.5" fill="url(#skin)" stroke="#D0B890" stroke-width="0.9"/>
  <!-- 白发 -->
  <path d="M 48 77 Q 53 73 58 77 Q 56 72 53 72 Q 50 72 48 77 Z" fill="#E8E4DC"/>
  <!-- 额发 -->
  <path d="M 43 84 Q 47 79 53 79 Q 59 79 63 84 Q 59 80 53 80 Q 47 80 43 84 Z" fill="#E8E4DC"/>
  <!-- 眉目含笑 -->
  <path d="M 44 84 Q 48 82.5 51 83 M 55 83 Q 58 82.5 62 84" stroke="#B8B0A8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- 深邃眼 -->
  <ellipse cx="48" cy="87" rx="2.4" ry="2.1" fill="#1E1814"/>
  <ellipse cx="58" cy="87" rx="2.4" ry="2.1" fill="#1E1814"/>
  <circle cx="49" cy="86.2" r="0.8" fill="#FFF3C4"/>
  <circle cx="59" cy="86.2" r="0.8" fill="#FFF3C4"/>
  <!-- 鼻梁 -->
  <path d="M 53 89 L 53 91.5" stroke="#D0B890" stroke-width="1" stroke-linecap="round"/>
  <!-- 白须 -->
  <path d="M 47 95 Q 51 98 53 95 M 53 95 Q 57 98 59 95" stroke="#E8E4DC" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- 右手持拂尘（前指） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 60 96;3 60 96;-3 60 96" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 58 96 C 64 92 68 90 72 88" fill="none" stroke="#7E6E9E" stroke-width="3.8" stroke-linecap="round"/>
    <!-- 拂尘柄 -->
    <line x1="72" y1="88" x2="82" y2="72" stroke="#8E7A5E" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 拂尘丝（化作金光） -->
    <path d="M 80 74 Q 88 66 94 62 M 82 72 Q 92 66 98 64" stroke="#FFF3C4" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 左臂垂持 -->
  <path d="M 46 100 C 40 104 38 110 40 118" fill="none" stroke="#7E6E9E" stroke-width="4" stroke-linecap="round"/>

  <!-- 落日金尘 -->
  <g fill="#FFE066">
    <circle cx="112" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="60">
      <animate attributeName="cy" values="60;50;60" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
