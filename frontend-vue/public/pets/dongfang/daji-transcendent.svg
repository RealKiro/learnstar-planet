<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妲己·六阶·狐心归山·轩辕坟月下小白狐安眠">
  <defs>
    <!-- 背景：轩辕坟月夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A6A88"/>
      <stop offset="52%" stop-color="#46546E"/>
      <stop offset="100%" stop-color="#36405A"/>
    </linearGradient>
    <!-- 月光如水 -->
    <radialGradient id="moon" cx="76%" cy="30%" r="34%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 小狐月光柔白 -->
    <radialGradient id="fur" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8F4"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月轮 -->
  <circle cx="152" cy="56" r="52" fill="url(#moon)">
    <animate attributeName="opacity" values="0.95;0.7;0.95" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="56" r="12" fill="#F4F8FC" opacity="0.95">
    <animate attributeName="r" values="12;14;12" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 荒坟（远景） -->
  <path d="M 24 160 Q 34 140 52 148 Q 70 156 62 172 Q 34 176 24 160 Z" fill="#3E485E"/>
  <path d="M 30 156 Q 40 148 52 152" stroke="#4E5870" stroke-width="1.2" opacity="0.6"/>

  <!-- 古柏（右下，根下安睡处） -->
  <path d="M 170 120 Q 168 96 174 72" stroke="#2E3A28" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 173 96 Q 156 90 148 94 M 171 80 Q 188 74 196 78 M 173 104 Q 186 100 192 104" stroke="#2E3A28" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- 老柏根（盘曲，小狐蜷处） -->
  <path d="M 174 120 Q 162 132 148 140 Q 140 144 136 150" stroke="#3A482E" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 136 150 Q 128 154 122 160" stroke="#3A482E" stroke-width="3.4" stroke-linecap="round" fill="none"/>

  <!-- 地面 -->
  <path d="M 0 158 L 200 158 L 200 200 L 0 200 Z" fill="#2E3648" opacity="0.8"/>
  <path d="M 0 158 L 200 158" stroke="#404A5E" stroke-width="1.4" opacity="0.6"/>
  <!-- 枯草 -->
  <path d="M 60 168 Q 62 160 60 154 M 88 172 Q 91 164 89 158" stroke="#3E485E" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 小白狐（蜷古柏根下，无尾无光，安睡） -->
  <!-- 蜷曲身 -->
  <path d="M 96 150 Q 90 144 94 138 Q 100 132 110 134 Q 120 136 122 144 Q 124 152 118 156 Q 108 160 100 156 Q 96 152 96 150 Z" fill="url(#fur)" stroke="#C8C8D8" stroke-width="0.8"/>
  <!-- 狐头（埋于身侧，安睡） -->
  <path d="M 92 142 Q 86 138 88 132 Q 90 128 96 128 Q 102 128 104 132 Q 105 138 100 142 Z" fill="url(#fur)" stroke="#C8C8D8" stroke-width="0.8"/>
  <!-- 尖耳（轻垂） -->
  <path d="M 89 130 L 86 122 L 94 126 Z" fill="#E8E8F4"/>
  <path d="M 101 130 L 104 122 L 96 126 Z" fill="#E8E8F4"/>
  <!-- 安睡闭眼 -->
  <path d="M 90 136 Q 92 137.4 94 136 M 96 136 Q 98 137.4 100 136" stroke="#5A5A6E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <!-- 鼻尖（湿润） -->
  <circle cx="94" cy="139" r="1.2" fill="#5A5A6E"/>
  <!-- 尾巴蜷（无九尾，仅一条） -->
  <path d="M 122 152 Q 130 154 134 160 Q 128 164 120 158" stroke="#E8E8F4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- 呼吸起伏 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="3.4s" repeatCount="indefinite"/>
    <path d="M 104 138 Q 110 136 114 138" stroke="#FFFFFF" stroke-width="1.4" opacity="0.7" fill="none"/>
  </g>

  <!-- 月下一点清光（妖力尽散，唯余清明） -->
  <circle cx="100" cy="148" r="16" fill="#E8F0FA" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.15;0.25" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 月华星尘 -->
  <g fill="#E8F0FA">
    <circle cx="40" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="36">
      <animate attributeName="cy" values="36;26;36" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="126" cy="78">
      <animate attributeName="cy" values="78;68;78" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
