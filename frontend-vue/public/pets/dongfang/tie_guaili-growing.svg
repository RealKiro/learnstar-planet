<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="铁拐李·三阶·附身乞丐·破衣铁拐仰天大笑">
  <defs>
    <!-- 背景：荒野旷野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A8A72"/>
      <stop offset="52%" stop-color="#7E6E5A"/>
      <stop offset="100%" stop-color="#5E5242"/>
    </linearGradient>
    <!-- 暮光金 -->
    <radialGradient id="glow" cx="76%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#E8C07A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8C07A" stop-opacity="0"/>
    </radialGradient>
    <!-- 破衣 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E7A5E"/>
      <stop offset="100%" stop-color="#6E5E42"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E0C8AC"/>
      <stop offset="100%" stop-color="#C8B090"/>
    </radialGradient>

    <!-- 头部模板：蓬头乱发·眼清亮有神·嘴角含笑（脸中心 0,0） -->
    <g id="tieguaili-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#skin)" stroke="#B8A080" stroke-width="0.9"/>
      <!-- 蓬头乱发 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#3A2A20"/>
      <path d="M -9 -3 L -12 -1 M 9 -3 L 12 -1 M -8 -6 L -11 -5 M 8 -6 L 11 -5" stroke="#3A2A20" stroke-width="1.6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#3A2A20"/>
      <!-- 眉（笑） -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 眼清亮有神 -->
      <ellipse cx="-4.5" cy="0.4" rx="2.2" ry="2" fill="#1E1008"/>
      <ellipse cx="4.5" cy="0.4" rx="2.2" ry="2" fill="#1E1008"/>
      <circle cx="-5" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.5" cy="0.4" r="0.6" fill="#E8C07A"/>
      <circle cx="4.5" cy="0.4" r="0.6" fill="#E8C07A"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.2" stroke="#B8A080" stroke-width="1" stroke-linecap="round"/>
      <!-- 仰天大笑 -->
      <path d="M -3.4 5.4 Q 0 8 3.4 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暮光 -->
  <circle cx="152" cy="52" r="52" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 旷野 -->
  <path d="M 0 156 Q 40 148 90 154 Q 140 160 200 150 L 200 200 L 0 200 Z" fill="#5E5242" opacity="0.8"/>
  <path d="M 0 156 L 200 156" stroke="#6E6254" stroke-width="1.4" opacity="0.6"/>

  <!-- 云中汉钟离虚影（右，点头） -->
  <g opacity="0.5">
    <path d="M 156 20 L 194 20 L 190 30 Q 176 36 160 32 Z" fill="#D8E0E8" opacity="0.7"/>
    <path d="M 172 34 Q 174 28 177 25 Q 180 28 180 34 Z" fill="#E8C0B0"/>
    <circle cx="177" cy="23" r="3.6" fill="#E0B0A0"/>
    <path d="M 180 28 L 188 34" stroke="#C8B0A0" stroke-width="1.4"/>
  </g>

  <!-- 跛脚乞丐（拄铁拐而立，破衣扬风，仰天大笑） -->
  <!-- 腿（一跛一实） -->
  <path d="M 88 138 L 82 160 L 88 160 L 94 140 Z" fill="#6E5E42"/>
  <path d="M 106 138 L 114 162 L 108 162 L 102 140 Z" fill="#6E5E42"/>
  <!-- 破衣（扬风） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 96 120;3 96 120;-4 96 120" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 86 112 Q 82 128 88 140 Q 98 146 108 140 Q 114 128 110 112 Q 100 106 86 112 Z" fill="url(#cloth)" stroke="#5E4E38" stroke-width="1"/>
    <!-- 破补丁 -->
    <rect x="92" y="120" width="8" height="8" fill="#7E6A4E" stroke="#5E4E38" stroke-width="0.8"/>
    <path d="M 90 128 L 94 132 M 96 126 L 100 130" stroke="#5E4E38" stroke-width="0.8"/>
  </g>
  <!-- 腰带（草绳） -->
  <path d="M 86 124 L 110 124" stroke="#5E4E38" stroke-width="1.6"/>

  <!-- 头（面部模板，仰天） -->
  <use href="#tieguaili-face" transform="translate(98,104) scale(1)"/>

  <!-- 左臂拄铁拐 -->
  <g>
    <path d="M 88 114 C 82 118 78 122 76 128" fill="none" stroke="#8E7A5E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="75" cy="130" r="3.2" fill="#D8C0A4"/>
    <!-- 铁拐 -->
    <line x1="75" y1="130" x2="60" y2="176" stroke="#3A3A3E" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- 右臂叉腰大笑 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 108 114;3 108 114;-4 108 114" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 106 114 C 112 116 116 120 116 126" fill="none" stroke="#8E7A5E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="116" cy="128" r="3.2" fill="#D8C0A4"/>
  </g>

  <!-- 大笑音浪 -->
  <g stroke="#E8C07A" stroke-width="1.5" opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M 84 108 Q 74 102 70 94">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 86 112 Q 74 106 68 98">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暮光金尘 -->
  <g fill="#E8C07A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
