<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="铁拐李·六阶·乞丐道祖·铁拐问天葫芦纳星辰">
  <defs>
    <!-- 背景：云端星河 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4E6E"/>
      <stop offset="52%" stop-color="#2E3E58"/>
      <stop offset="100%" stop-color="#1E2E46"/>
    </linearGradient>
    <!-- 道气金光 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <!-- 星河蓝 -->
    <radialGradient id="galaxy" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9AC8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 破衣道气 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E7A5E"/>
      <stop offset="100%" stop-color="#6E5E42"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E0C8AC"/>
      <stop offset="100%" stop-color="#C8B090"/>
    </radialGradient>

    <!-- 头部模板：蓬头·眼神澄澈如日月 -->
    <g id="tieguaili-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#skin)" stroke="#B8A080" stroke-width="0.9"/>
      <!-- 蓬头道气 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#3A2A20"/>
      <path d="M -9 -3 L -12 -1 M 9 -3 L 12 -1" stroke="#3A2A20" stroke-width="1.6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#3A2A20"/>
      <!-- 眉（澄澈） -->
      <path d="M -8 -1.5 Q -5 -3.2 -2 -2.4 M 8 -1.5 Q 5 -3.2 2 -2.4" stroke="#1E1008" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <!-- 眼澄澈如日月 -->
      <ellipse cx="-4.5" cy="0.4" rx="2.2" ry="2" fill="#1E1008"/>
      <ellipse cx="4.5" cy="0.4" rx="2.2" ry="2" fill="#1E1008"/>
      <circle cx="-5" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.5" cy="0.4" r="0.6" fill="#F5D742"/>
      <circle cx="4.5" cy="0.4" r="0.6" fill="#F5D742"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.2" stroke="#B8A080" stroke-width="1" stroke-linecap="round"/>
      <!-- 安然 -->
      <path d="M -3.2 5.4 Q 0 7 3.2 5.4" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 道气金光 -->
  <circle cx="100" cy="92" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星河 -->
  <circle cx="100" cy="86" r="72" fill="url(#galaxy)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 星斗（四周） -->
  <g fill="#9AC8F0">
    <circle cx="30" cy="60" r="1.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="56" cy="36" r="1.3"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="44" r="1.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="172" cy="80" r="1.2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="110" r="1.2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.7">
    <path d="M 0 148 Q 50 140 100 146 Q 150 152 200 144 L 200 200 L 0 200 Z" fill="#4E5E78">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="92" r="56" fill="none" stroke="#F5D742" stroke-width="2.2" opacity="0.8">
      <animate attributeName="r" values="56;61;56" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="92" r="48" fill="none" stroke="#F5D742" stroke-width="1" opacity="0.45">
      <animate attributeName="r" values="48;51;48" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 跛足道祖（拄拐云端，道气冲霄） -->
  <!-- 腿 -->
  <path d="M 88 132 L 82 152 L 88 152 L 94 134 Z" fill="#6E5E42"/>
  <path d="M 106 132 L 114 156 L 108 156 L 102 134 Z" fill="#6E5E42"/>
  <!-- 破衣（道气冲霄） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 96 120;2 96 120;-3 96 120" dur="3s" repeatCount="indefinite"/>
    <path d="M 86 108 Q 82 124 88 136 Q 98 142 108 136 Q 114 124 110 108 Q 100 102 86 108 Z" fill="url(#cloth)" stroke="#5E4E38" stroke-width="1"/>
    <!-- 道气纹（破衣上金光） -->
    <path d="M 92 114 Q 94 120 92 126 M 104 114 Q 102 120 104 126" stroke="#F5D742" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 草绳 -->
  <path d="M 86 120 L 110 120" stroke="#5E4E38" stroke-width="1.6"/>

  <!-- 头（面部模板） -->
  <use href="#tieguaili-face" transform="translate(98,100) scale(1)"/>

  <!-- 左臂拄铁拐（问天） -->
  <path d="M 88 110 C 82 114 78 118 76 124" fill="none" stroke="#8E7A5E" stroke-width="4.2" stroke-linecap="round"/>
  <circle cx="75" cy="126" r="3.2" fill="#D8C0A4"/>
  <!-- 铁拐问天（指向星河） -->
  <line x1="75" y1="126" x2="52" y2="76" stroke="#3A3A3E" stroke-width="3.4" stroke-linecap="round"/>
  <!-- 铁拐端道光 -->
  <circle cx="52" cy="74" r="7" fill="#F5D742" opacity="0.7">
    <animate attributeName="r" values="7;11;7" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 右肩葫芦（纳星辰） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 106 106 C 112 102 116 94 114 88 C 112 84 108 84 106 86 C 104 84 100 84 98 88 C 96 94 100 102 106 106 Z" fill="#A86A3E" stroke="#8E5A2E" stroke-width="1"/>
    <path d="M 104 86 L 104 80 L 110 80 L 110 86" fill="#8E5A2E"/>
    <!-- 星辰入葫芦 -->
    <path d="M 107 78 Q 108 72 106 66" fill="none" stroke="#9AC8F0" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 右手托葫芦底 -->
  <path d="M 108 114 C 112 116 116 118 118 122" fill="none" stroke="#8E7A5E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="119" cy="124" r="3" fill="#D8C0A4"/>

  <!-- 道气金光粒子 -->
  <g fill="#F5D742">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#F5D742" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 24 L 100 14"/><path d="M 56 48 L 48 40"/><path d="M 144 48 L 152 40"/>
  </g>
</svg>
