<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="张果老·六阶·混元仙翁·倒骑驴巡看人间指点迷途">
  <defs>
    <!-- 背景：云端夕阳金霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#C8985E"/>
      <stop offset="100%" stop-color="#9E7850"/>
    </linearGradient>
    <!-- 金霞 -->
    <radialGradient id="aura" cx="76%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰白道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#C8C4BC"/>
    </linearGradient>
    <!-- 白驴 -->
    <linearGradient id="donkey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F0EC"/>
      <stop offset="100%" stop-color="#C8C8C4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：慈祥面容·白眉长垂·眼含笑意·悠然 -->
    <g id="zhangguolao-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 白发飘飘 -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#E8E0D0"/>
      <path d="M -9 -4 L -13 -1 M 9 -4 L 13 -1" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <!-- 白眉长垂 -->
      <path d="M -8 -2 Q -5 -3.5 -2 -3 M 8 -2 Q 5 -3.5 2 -3" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <path d="M -9 -1 Q -11 1 -11 3" stroke="#E8E0D0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 9 -1 Q 11 1 11 3" stroke="#E8E0D0" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眼含笑 -->
      <path d="M -7 0 Q -4.5 -1.2 -2 -0.4 L -2 0.6 Q -4.5 0 -7 1.2 Z" fill="#2E1A10"/>
      <path d="M 7 0 Q 4.5 -1.2 2 -0.4 L 2 0.6 Q 4.5 0 7 1.2 Z" fill="#2E1A10"/>
      <!-- 鼻梁圆 -->
      <circle cx="0" cy="2.6" r="1.8" fill="#C8A880"/>
      <!-- 悠然 -->
      <path d="M -3 5.6 Q 0 7.2 3 5.6" fill="none" stroke="#8E5A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 金霞 -->
  <circle cx="152" cy="52" r="56" fill="url(#aura)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="13" fill="#FFF3C4" opacity="0.9">
    <animate attributeName="r" values="13;15;13" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g opacity="0.7">
    <path d="M 0 142 Q 50 134 100 140 Q 150 146 200 138 L 200 200 L 0 200 Z" fill="#E8E0D0">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 168 Q 60 160 120 166 Q 170 172 200 164 L 200 200 L 0 200 Z" fill="#D8CCB8" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 1;0 0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 人间山河（右下） -->
  <path d="M 120 180 Q 150 172 178 178 Q 190 180 200 176 L 200 200 L 120 200 Z" fill="#7E9E6E" opacity="0.8"/>
  <path d="M 150 184 Q 158 178 166 184" stroke="#5E7E5E" stroke-width="1.2" opacity="0.6"/>

  <!-- 迷途旅人（右下山路，被指点） -->
  <g opacity="0.95">
    <circle cx="156" cy="160" r="4" fill="#E8D8BC"/>
    <path d="M 153 156 Q 156 153 159 156 Q 158 158 156 158 Q 154 158 153 156 Z" fill="#2E2620"/>
    <path d="M 154 164 Q 152 174 154 180 Q 158 180 158 164 Z" fill="#7E6A56"/>
    <path d="M 155 166 L 159 160" fill="none" stroke="#E8D8BC" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- 指点回头路（金光指引） -->
  <path d="M 140 126 Q 148 140 154 152" fill="none" stroke="#FFF3C4" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 白驴（云端踏行） -->
  <path d="M 82 112 Q 74 102 82 94 Q 94 88 106 92 Q 122 96 126 110 Q 128 122 120 128 Q 108 134 94 132 Q 82 130 82 112 Z" fill="url(#donkey)" stroke="#A8A8A4" stroke-width="1"/>
  <path d="M 88 128 L 84 146 L 90 146 L 94 130 Z" fill="#C8C8C4"/>
  <path d="M 116 130 L 122 148 L 117 148 L 112 132 Z" fill="#C8C8C4"/>
  <!-- 驴头 -->
  <path d="M 124 110 Q 134 104 138 98 Q 142 92 136 90 Q 128 90 124 96 Q 122 104 124 110 Z" fill="#D8D8D4" stroke="#A8A8A4" stroke-width="1"/>
  <path d="M 132 92 L 130 82 L 136 88 Z" fill="#C8C8C4"/>
  <path d="M 136 92 L 136 82 L 140 88 Z" fill="#C8C8C4"/>
  <path d="M 133 96 Q 135 95.5 137 96" stroke="#2E2E2A" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M 122 96 Q 120 92 122 88" stroke="#A8A8A4" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 84 106 Q 76 102 74 94" stroke="#A8A8A4" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 84 106;8 84 106;0 84 106" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 驴鞍 -->
  <path d="M 86 102 Q 98 98 110 102 L 108 112 L 88 112 Z" fill="#8E6A42" stroke="#6E5238" stroke-width="1"/>

  <!-- 道翁（倒骑，鱼鼓） -->
  <!-- 腿 -->
  <path d="M 86 106 L 82 118 M 106 106 L 110 118" stroke="#C8C4BC" stroke-width="4.4" stroke-linecap="round"/>
  <!-- 道袍 -->
  <path d="M 80 90 Q 76 100 80 110 Q 88 114 96 110 Q 100 100 98 90 Q 88 84 80 90 Z" fill="url(#robe)" stroke="#A8A8A4" stroke-width="1"/>

  <!-- 头（面部模板，面向左） -->
  <use href="#zhangguolao-face" transform="translate(89,80) scale(1)"/>

  <!-- 左臂持鱼鼓（轻敲，天音震三界） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 82 90;4 82 90;-5 82 90" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 84 90 C 78 94 74 98 72 104" fill="none" stroke="#C8C4BC" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="70" cy="110" rx="5" ry="7" fill="#A86A3E" stroke="#8E5A2E" stroke-width="0.8"/>
    <path d="M 70 103 L 70 117" stroke="#8E5A2E" stroke-width="1.2"/>
  </g>
  <!-- 鱼鼓天音 -->
  <g stroke="#FFF3C4" stroke-width="1.5" opacity="0.5" fill="none">
    <circle cx="70" cy="110" r="13">
      <animate attributeName="r" values="13;21;13" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右臂负背看云/指点 -->
  <path d="M 96 90 C 102 94 106 98 108 104" fill="none" stroke="#C8C4BC" stroke-width="4" stroke-linecap="round"/>

  <!-- 金霞星尘 -->
  <g fill="#FFF3C4">
    <circle cx="40" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="60">
      <animate attributeName="cy" values="60;50;60" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
