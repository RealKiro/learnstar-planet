<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝采和·三阶·踏歌云游·步步生莲歌声清光">
  <defs>
    <!-- 背景：云山古道 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="52%" stop-color="#7E9088"/>
      <stop offset="100%" stop-color="#5E7268"/>
    </linearGradient>
    <!-- 莲白光 -->
    <radialGradient id="aura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 破绿衫 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA878"/>
      <stop offset="100%" stop-color="#4E885E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：少年面容·眉眼弯弯·高歌含笑（脸中心 0,0） -->
    <g id="lancaihe-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 少年·弯眉眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 云山 -->
  <path d="M 0 136 Q 40 118 90 128 Q 140 136 200 124 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>
  <!-- 云海 -->
  <g opacity="0.6">
    <path d="M 0 150 Q 50 142 100 148 Q 150 154 200 146 L 200 200 L 0 200 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 步步生莲（脚下莲花，一步一莲） -->
  <g>
    <circle cx="96" cy="148" r="14" fill="url(#aura)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="96" cy="146" r="8" fill="#F0B8D8"/>
      <path d="M 92 144 Q 96 140 100 144 Q 96 146 92 144 Z" fill="#F8D8E8"/>
      <path d="M 92 149 Q 96 145 100 149 Q 96 151 92 149 Z" fill="#F8D8E8"/>
      <circle cx="96" cy="146" r="2" fill="#F8E8A0"/>
    </g>
    <!-- 后两朵莲（渐远） -->
    <circle cx="76" cy="154" r="7" fill="#F0B8D8" opacity="0.7"/>
    <circle cx="60" cy="158" r="5" fill="#F0B8D8" opacity="0.5"/>
  </g>

  <!-- 赤足歌童（踏歌而行） -->
  <!-- 腿 -->
  <path d="M 88 126 L 84 148 L 90 148 L 94 128 Z" fill="#4E885E"/>
  <path d="M 104 126 L 112 150 L 106 150 L 100 128 Z" fill="#4E885E"/>
  <!-- 赤足 -->
  <path d="M 85 148 Q 83 151 86 153 Q 89 151 88 148 Z" fill="#DCC4A0"/>
  <!-- 破绿衫（飘动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 96 116;3 96 116;-4 96 116" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 88 98 Q 84 112 90 130 Q 100 136 108 130 Q 114 112 110 98 Q 100 92 88 98 Z" fill="url(#cloth)" stroke="#3E6E4E" stroke-width="1"/>
    <!-- 补丁 -->
    <rect x="97" y="108" width="7" height="7" fill="#5E986E" stroke="#3E6E4E" stroke-width="0.7"/>
  </g>
  <!-- 铜钱 -->
  <g fill="#E8B64C">
    <circle cx="90" cy="112" r="2"/>
    <circle cx="106" cy="112" r="2"/>
  </g>

  <!-- 头（面部模板） -->
  <use href="#lancaihe-face" transform="translate(99,88) scale(1)"/>

  <!-- 左臂持玉板（一拍） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 90 100;5 90 100;-6 90 100" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 90 100 C 84 104 80 106 78 112" fill="none" stroke="#5E986E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="77" cy="114" r="2.8" fill="#DCC4A0"/>
    <rect x="71" y="110" width="10" height="16" rx="1.5" fill="#E8E0D0" stroke="#B8B0A0" stroke-width="0.8"/>
    <path d="M 71 114 L 81 114 M 71 118 L 81 118" stroke="#B8B0A0" stroke-width="0.7"/>
  </g>

  <!-- 右臂摆动（踏歌） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="5 108 100;-4 108 100;5 108 100" dur="2s" repeatCount="indefinite"/>
    <path d="M 108 100 C 114 104 118 106 120 112" fill="none" stroke="#5E986E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="121" cy="114" r="2.8" fill="#DCC4A0"/>
  </g>

  <!-- 歌声化作清光散开 -->
  <g fill="#FFF7E0">
    <path d="M 84 92 L 86 86 L 90 88 Z" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="74" cy="86" r="2" opacity="0.6">
      <animate attributeName="cy" values="86;80;86" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="78" r="1.5" opacity="0.5">
      <animate attributeName="cy" values="78;72;78" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 莲白星尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;96;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
