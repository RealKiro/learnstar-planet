<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="张果老·二阶·食首乌返老·对溪自照青春复来">
  <defs>
    <!-- 背景：恒山溪畔 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8A0"/>
      <stop offset="55%" stop-color="#7E9288"/>
      <stop offset="100%" stop-color="#5E7468"/>
    </linearGradient>
    <!-- 首乌棕 -->
    <radialGradient id="youth" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#C8784E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8784E" stop-opacity="0"/>
    </radialGradient>
    <!-- 麻衣 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A89068"/>
      <stop offset="100%" stop-color="#8E7252"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="zhang_guolao-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 白眉长垂 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#E8E4DC" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M -3.5 6.4 Q 0 8.4 3.5 6.4" fill="none" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
    <animate attributeName="opacity" values="0.4;0.25;0.4" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山古树 -->
  <path d="M 0 130 Q 40 112 90 122 Q 140 130 200 118 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>
  <!-- 古树（右） -->
  <path d="M 168 110 Q 164 90 168 72" stroke="#5E6E5E" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <circle cx="168" cy="68" r="11" fill="#7EA878"/>
  <circle cx="160" cy="72" r="6" fill="#6E9E68"/>
  <circle cx="176" cy="70" r="6" fill="#6E9E68"/>

  <!-- 溪水 -->
  <path d="M 0 156 Q 40 148 90 154 Q 140 160 200 150 L 200 200 L 0 200 Z" fill="#7E9EA8"/>
  <path d="M 20 164 Q 60 156 100 162 Q 140 168 180 160" stroke="#A8C8D0" stroke-width="1.6" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 水中少年倒影（返老还童） -->
  <g opacity="0.75">
    <!-- 倒影身形 -->
    <path d="M 108 142 Q 106 150 108 158 Q 112 162 116 158 Q 118 150 116 142 Z" fill="#8E7252"/>
    <!-- 倒影头（青丝） -->
    <circle cx="112" cy="138" r="7" fill="#E8D0B0"/>
    <path d="M 106 136 Q 108 132 112 132 Q 116 132 118 136 Q 116 133 112 133 Q 108 133 106 136 Z" fill="#2E1A10"/>
  </g>

  <!-- 溪石（蹲坐处） -->
  <path d="M 70 160 Q 82 152 94 158 Q 104 162 98 170 Q 78 172 70 160 Z" fill="#7E8E84"/>

  <!-- 腿（蹲） -->
  <path d="M 84 150 L 78 158 L 84 158 L 90 152 Z" fill="#8E7252"/>
  <!-- 麻衣 -->
  <!-- 腰带 -->
  <path d="M 88 132 L 108 132" stroke="#5E4A32" stroke-width="1.6"/>
  <!-- 酒葫芦 -->
  <path d="M 88 128 Q 82 134 86 142 Q 90 146 94 142 Q 96 134 90 128 Z" fill="#A86A3E" stroke="#8E5A2E" stroke-width="0.8"/>

  <!-- 头（返青，粗眉，黑发披肩，眼亮有神） -->
  <!-- 粗眉 -->
  <!-- 眼亮有神 -->
  <!-- 鼻梁 -->
  <!-- 含笑 -->

  <!-- 左臂撑膝 -->
  <path d="M 90 118 C 84 122 80 126 80 132" fill="none" stroke="#A89068" stroke-width="4" stroke-linecap="round"/>

  <!-- 右臂指水中倒影（惊觉青春） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 108 118;3 108 118;-4 108 118" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 106 118 C 112 120 116 122 118 126" fill="none" stroke="#A89068" stroke-width="4" stroke-linecap="round"/>
    <circle cx="119" cy="128" r="3" fill="#D8C0A0"/>
    <path d="M 119 128 L 122 132" stroke="#8E5A3E" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <g fill="#C8784E">
    <circle cx="60" cy="118">
      <animate attributeName="cy" values="118;110;118" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#zhang_guolao-face" transform="translate(98,108) scale(1.05)"/>

</svg>
