<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="申公豹·一阶·玉虚弟子·昆仑论道舌灿莲花">
  <defs>
    <!-- 背景：昆仑山玉虚宫论道场 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8B8"/>
      <stop offset="52%" stop-color="#7E8E9E"/>
      <stop offset="100%" stop-color="#5E6E7E"/>
    </linearGradient>
    <!-- 玉虚金光 -->
    <radialGradient id="glow" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 昆仑道袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E8EAE"/>
      <stop offset="100%" stop-color="#4E6E8E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>
  
    <!-- 差异化脸谱（脚本注入） -->
    <g id="shen_gongbao-face">
      <ellipse cx="0" cy="0" rx="9.5" ry="12" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 鹰目·薄唇 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.8 Q -5 -3.4 -2 -2.6 M 8 -1.8 Q 5 -3.4 2 -2.6" stroke="#1E1008" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.1" cy="-0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 2.6 Q 1.6 4 0 5 Q -1.6 4 0 2.6" fill="none" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3.2 6.4 Q 0 6.8 3.2 6.4" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 远山云海 -->
  <path d="M 0 132 Q 40 112 90 122 Q 140 130 200 118 L 200 200 L 0 200 Z" fill="#6E8090" opacity="0.5"/>
  <!-- 仙云 -->
  <g opacity="0.65">
    <path d="M 0 96 Q 28 86 52 94 Q 66 102 54 110 Q 34 118 10 108 Q 0 102 0 96 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 1;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 玉虚宫（左上，飞檐） -->
  <path d="M 0 0 L 88 0 L 72 18 Q 44 30 16 26 Z" fill="#4E6E8E" opacity="0.8"/>
  <path d="M 0 0 L 88 0" stroke="#6E8EAE" stroke-width="1.4"/>

  <!-- 众仙虚影（背景） -->
  <g opacity="0.25">
    <path d="M 120 120 Q 122 108 128 104 Q 134 106 134 120 Z" fill="#3E4A5A"/>
    <path d="M 142 124 Q 143 112 149 108 Q 155 110 154 124 Z" fill="#42506A"/>
    <path d="M 158 122 Q 160 110 165 106 Q 171 109 169 122 Z" fill="#3E4A5A"/>
  </g>

  <!-- 论道石台 -->
  <path d="M 30 162 L 150 152 L 160 172 L 20 172 Z" fill="#5E6E7E"/>
  <path d="M 30 162 L 150 152" stroke="#7E8E9E" stroke-width="1.6" opacity="0.6"/>

  <!-- 意气道人（7头身，衣袖生风，侃侃而谈） -->
  <!-- 腿 -->
  <path d="M 84 136 L 80 160 L 86 160 L 90 138 Z" fill="#4E6E8E"/>
  <path d="M 108 136 L 114 162 L 108 162 L 104 138 Z" fill="#4E6E8E"/>
  <!-- 道袍下摆（翻飞） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 96 128;2 96 128;-3 96 128" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 84 126 Q 96 138 110 132 Q 114 126 110 118 Q 104 128 96 124 Q 88 128 84 126 Z" fill="url(#robe)"/>
  </g>
  <!-- 身体 -->
  <!-- 腰带 -->
  <path d="M 86 112 L 110 112" stroke="#FFF7E0" stroke-width="1.8"/>
  <!-- 佩剑（腰间） -->
  <path d="M 86 108 L 80 126" stroke="#C8CCD4" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="78" y="104" width="5" height="4" rx="1" fill="#B8964E"/>

  <!-- 头（长脸剑眉，目如鹰隼，傲气） -->
  <!-- 剑眉微挑 -->
  <!-- 鹰目 -->
  <!-- 鼻梁高挺 -->
  <!-- 薄唇善辩（微挑） -->

  <!-- 左袖生风（指画天下） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 90 96;4 90 96;-5 90 96" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 90 96 C 82 100 78 104 76 112" fill="none" stroke="#6E8EAE" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="75" cy="114" r="3.4" fill="#DCC4A0"/>
  </g>

  <!-- 右臂负背 -->
  <path d="M 108 96 C 116 100 120 106 120 114" fill="none" stroke="#6E8EAE" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 论道音浪（口前） -->
  <g stroke="#FFF7E0" stroke-width="1.4" opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M 84 96 Q 74 94 68 90">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 86 100 Q 74 98 66 94">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 玉虚金尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 差异化脸谱覆盖（脚本注入） -->
  <use href="#shen_gongbao-face" transform="translate(98,84) scale(1.05)"/>

  <!-- 原头发（保留在模板之上） -->
  <path d="M 94 75 Q 98 72 102 75 Q 100 70 98 70 Q 96 70 94 75 Z" fill="#1E1814"/>
  <path d="M 88 82 Q 92 77 98 77 Q 104 77 108 82 Q 104 78 98 78 Q 92 78 88 82 Z" fill="#1E1814"/>
</svg>
