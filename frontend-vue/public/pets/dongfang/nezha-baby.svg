<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哪吒·二阶·凡尘·陈塘哪吒">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B6B7A"/>
      <stop offset="100%" stop-color="#414E5A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFEBD8"/>
      <stop offset="100%" stop-color="#F5D9C0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>

    <g id="nezha-head">
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#FBEBD6" stroke="#D8B894" stroke-width="1"/>
      <circle cx="-14" cy="-21" r="7" fill="#2A1A0A"/>
      <circle cx="14" cy="-21" r="7" fill="#2A1A0A"/>
      <path d="M -10 -14 Q -4 -18 0 -15 Q 4 -18 10 -14" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="-5.4" cy="-3.6" r="1.5" fill="#FFF"/>
      <circle cx="8.6" cy="-3.6" r="1.5" fill="#FFF"/>
      <path d="M -11 -6 Q -8 -9 -5 -8 M 11 -6 Q 8 -9 5 -8" fill="none" stroke="#2A1A0A" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -4 6 Q 0 9 4 6" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-11" cy="4" r="3.6" fill="#C85A4A" opacity="0.28"/>
      <circle cx="11" cy="4" r="3.6" fill="#C85A4A" opacity="0.28"/>
      <path d="M 0 -18 Q 2 -22 5 -23" fill="none" stroke="#2A1A0A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <polygon points="0,0 140,0 30,200 0,200" fill="url(#side)"/>

  <!-- 晨光灵光（呼吸） -->
  <circle cx="100" cy="116" r="70" fill="url(#core)">
    <animate attributeName="r" values="70;80;70" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 环境：地面 -->
  <path d="M 12 170 Q 60 165 108 168 T 196 164" fill="none" stroke="#333F4A" stroke-width="2" opacity="0.7"/>

  <!-- 混天绫（缠腕飘动，红色长带） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 84 108 C 62 112 50 128 40 120 C 32 114 40 104 52 108 C 62 112 74 104 84 108 Z" fill="#C22A1A" opacity="0.9"/>
    <path d="M 40 120 C 34 132 44 136 38 148 C 46 140 44 128 40 120 Z" fill="#C22A1A" opacity="0.75"/>
  </g>

  <!-- 腿（赤足） -->
  <path d="M 92 138 C 88 150 86 156 84 162" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 108 138 C 112 150 114 156 116 162" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="82" cy="163" rx="7" ry="5" fill="url(#skin)"/>
  <ellipse cx="118" cy="163" rx="7" ry="5" fill="url(#skin)"/>

  <!-- 身体（小童身 + 红肚兜） -->
  <path d="M 90 96 Q 82 112 88 130 Q 100 140 112 130 Q 118 112 112 96 Q 104 90 90 96 Z" fill="url(#skin)"/>
  <!-- 红肚兜 -->
  <path d="M 86 104 L 100 96 L 114 104 L 100 126 Z" fill="#D82A1A"/>
  <path d="M 90 106 L 110 106 M 94 112 L 106 112" stroke="#FFE9C0" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <!-- 肚兜系带 -->
  <path d="M 86 104 L 80 96 M 114 104 L 120 96" stroke="#D82A1A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 手臂（一好奇前伸，一握绫） -->
  <path d="M 100 102 C 96 100 92 100 88 104" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="85" cy="106" r="4" fill="url(#skin)"/>
  <path d="M 108 102 C 114 104 116 108 116 112" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>

  <!-- 头（头部模板 scale 0.95，身体正上方） -->
  <use href="#nezha-head" transform="translate(100,100) scale(0.95)"/>

  <!-- 晨光微粒（飘浮） -->
  <g fill="#E8B84B">
    <circle cx="40" cy="108">
      <animate attributeName="cy" values="108;100;108" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="112">
      <animate attributeName="cy" values="112;104;112" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
