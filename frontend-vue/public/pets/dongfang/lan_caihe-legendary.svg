<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝采和·五阶·八仙过海·浪花化作音符踏浪歌">
  <defs>
    <!-- 背景：沧海明月 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E8EAE"/>
      <stop offset="52%" stop-color="#4E7E9E"/>
      <stop offset="100%" stop-color="#3E6E8E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="32%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 破绿衫 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA878"/>
      <stop offset="100%" stop-color="#4E885E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：青年面容·眉眼弯弯·高歌含笑 -->
    <g id="lancaihe-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 少年·弯眉眼 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.5 Q -5 -3 0 -2.6 Q 5 -3 8 -1.5" stroke="#1E1008" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <ellipse cx="4.6" cy="0.4" rx="2.4" ry="2.2" fill="#FFFDF2" stroke="#1E1008" stroke-width="0.7"/>
      <circle cx="-4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="4.6" cy="0.4" r="1.4" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.5" fill="#FFF"/>
      <!-- 鼻 -->
      <path d="M 0 1.5 L 0 3 Q 1.2 4.4 0 5.4 Q -1.2 4.4 0 3" fill="none" stroke="#C0A884" stroke-width="1" stroke-linecap="round"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 明月 -->
  <circle cx="152" cy="52" r="44" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="11" fill="#F4F8FC" opacity="0.95"/>

  <!-- 沧海 -->
  <path d="M 0 146 Q 50 138 100 144 Q 150 150 200 142 L 200 200 L 0 200 Z" fill="#3E6E8E"/>
  <path d="M 0 160 Q 60 152 120 158 Q 170 164 200 156 L 200 200 L 0 200 Z" fill="#2E5E7E"/>

  <!-- 八仙虚影 -->
  <g opacity="0.4">
    <path d="M 28 132 Q 30 120 35 116 Q 40 118 40 132 Z" fill="#C8C0A8"/>
    <path d="M 50 136 Q 51 124 56 120 Q 61 122 60 136 Z" fill="#B8A878"/>
    <path d="M 168 130 Q 169 118 174 114 Q 179 116 178 130 Z" fill="#A8B8A8"/>
  </g>

  <!-- 浪花化作音符铺路（脚下） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 96 140;4 96 140;0 96 140" dur="3s" repeatCount="indefinite"/>
    <path d="M 60 144 Q 78 138 96 142 Q 116 146 132 140" stroke="#E8F0FA" stroke-width="2" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 音符（浪花化作） -->
  <g fill="#FFF7E0" opacity="0.85">
    <path d="M 70 138 L 72 132 L 76 134 Z">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="120" cy="138" r="2.4">
      <animate attributeName="cy" values="138;132;138" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="134" r="1.8">
      <animate attributeName="cy" values="134;128;134" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 浪头托足 -->
  <circle cx="96" cy="142" r="16" fill="#E8F0FA" opacity="0.4">
    <animate attributeName="r" values="16;21;16" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 赤足歌仙（踏浪而歌） -->
  <!-- 腿 -->
  <path d="M 88 124 L 84 142 L 90 142 L 94 126 Z" fill="#4E885E"/>
  <path d="M 104 124 L 112 146 L 106 146 L 100 126 Z" fill="#4E885E"/>
  <!-- 破绿衫（飘） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 96 114;3 96 114;-4 96 114" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 88 96 Q 84 110 90 128 Q 100 134 108 128 Q 114 110 110 96 Q 100 90 88 96 Z" fill="url(#cloth)" stroke="#3E6E4E" stroke-width="1"/>
  </g>

  <!-- 头（面部模板） -->
  <use href="#lancaihe-face" transform="translate(99,86) scale(1)"/>

  <!-- 左臂持玉板（一拍，击浪成音） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 90 98;5 90 98;-6 90 98" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 90 98 C 84 102 80 104 78 110" fill="none" stroke="#5E986E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="77" cy="112" r="2.8" fill="#DCC4A0"/>
    <rect x="71" y="108" width="10" height="16" rx="1.5" fill="#E8E0D0" stroke="#B8B0A0" stroke-width="0.8"/>
    <path d="M 71 112 L 81 112 M 71 116 L 81 116" stroke="#B8B0A0" stroke-width="0.7"/>
  </g>

  <!-- 右臂摆动 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="5 108 98;-4 108 98;5 108 98" dur="2s" repeatCount="indefinite"/>
    <path d="M 108 98 C 114 102 118 104 120 110" fill="none" stroke="#5E986E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="121" cy="112" r="2.8" fill="#DCC4A0"/>
  </g>

  <!-- 歌声随行（音符） -->
  <g fill="#FFF7E0">
    <path d="M 82 90 L 84 84 L 88 86 Z" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="72" cy="84" r="2" opacity="0.6">
      <animate attributeName="cy" values="84;78;84" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 浪花银尘 -->
  <g fill="#E8F0FA">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="88">
      <animate attributeName="cy" values="88;78;88" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
