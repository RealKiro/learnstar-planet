<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妲己·五阶·城破显形·九尾狐身被缚法台宿命">
  <defs>
    <!-- 背景：朝歌城破之夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E1E2E"/>
      <stop offset="55%" stop-color="#221418"/>
      <stop offset="100%" stop-color="#160E14"/>
    </linearGradient>
    <!-- 火光冲天 -->
    <radialGradient id="fire" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白狐身 -->
    <radialGradient id="fur" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0EC"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 火光冲天 -->
  <circle cx="160" cy="140" r="80" fill="url(#fire)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#E8623A" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 150 80 Q 144 68 148 56">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 164 88 Q 160 76 166 66">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 倾颓宫阙（远景剪影） -->
  <g opacity="0.4">
    <path d="M 0 60 L 64 60 L 52 78 Q 32 88 12 82 Z" fill="#1A1218"/>
    <path d="M 0 60 L 64 60" stroke="#2E2228" stroke-width="1.2"/>
    <path d="M 16 82 L 16 140 L 26 140 L 26 82" stroke="#1A1218" stroke-width="2.4"/>
    <path d="M 42 80 L 42 132 L 52 132 L 52 80" stroke="#1A1218" stroke-width="2.4"/>
    <!-- 断旗 -->
    <path d="M 30 60 L 30 90" stroke="#1A1218" stroke-width="1.4"/>
  </g>

  <!-- 军旗（远处） -->
  <g opacity="0.55">
    <path d="M 120 20 L 120 70" stroke="#2E2228" stroke-width="2"/>
    <path d="M 120 20 L 146 28 L 120 38 Z" fill="#6E2A22">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 法台 -->
  <path d="M 56 158 L 144 148 L 152 168 L 48 168 Z" fill="#3A2E34"/>
  <path d="M 56 158 L 144 148" stroke="#5A4A52" stroke-width="1.6" opacity="0.7"/>

  <!-- 被缚雪白九尾狐（狐身低垂，被缚法台） -->
  <!-- 缚绳（金） -->
  <path d="M 88 146 L 96 138 M 96 146 L 104 140 M 88 152 L 96 144" stroke="#F5D742" stroke-width="1.8" opacity="0.9"/>
  <path d="M 88 146 L 60 162 M 104 146 L 132 160" stroke="#F5D742" stroke-width="1.6" opacity="0.8"/>
  <!-- 狐身（伏卧低垂） -->
  <path d="M 84 138 Q 76 130 82 120 Q 90 112 104 116 Q 120 120 124 132 Q 126 144 118 150 Q 104 156 94 150 Q 86 144 84 138 Z" fill="url(#fur)" stroke="#C0C0D0" stroke-width="0.9"/>
  <!-- 狐头（低垂） -->
  <path d="M 86 124 Q 78 118 80 108 Q 82 102 90 102 Q 98 102 100 108 Q 102 116 96 122 Z" fill="url(#fur)" stroke="#C0C0D0" stroke-width="0.9"/>
  <!-- 尖耳（低垂） -->
  <path d="M 82 104 L 78 94 L 88 98 Z" fill="#E8E8F4"/>
  <path d="M 96 104 L 100 94 L 90 98 Z" fill="#E8E8F4"/>
  <!-- 狐目（圆睁，妖气散） -->
  <circle cx="88" cy="109" r="1.6" fill="#3A3A4E"/>
  <circle cx="96" cy="109" r="1.6" fill="#3A3A4E"/>
  <!-- 鼻尖 -->
  <circle cx="92" cy="114" r="1.5" fill="#3A3A4E"/>
  <!-- 狐火明灭（将熄） -->
  <circle cx="86" cy="104" r="4" fill="#9AC8F0" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 九尾（低垂贴地） -->
  <g stroke="#E8E8F4" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 118 148 Q 128 152 136 156"/>
    <path d="M 112 150 Q 122 156 130 162"/>
    <path d="M 104 152 Q 112 160 120 166"/>
  </g>
  <g stroke="#D8D8E8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 94 152 Q 88 160 84 168"/>
    <path d="M 84 148 Q 76 154 72 162"/>
  </g>

  <!-- 狐火渐熄星尘 -->
  <g fill="#9AC8F0">
    <circle cx="76" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="98">
      <animate attributeName="cy" values="98;88;98" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火绛灰烬 -->
  <g fill="#E8623A">
    <circle cx="140" cy="120">
      <animate attributeName="cy" values="120;130;120" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="104">
      <animate attributeName="cy" values="104;114;104" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.08;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
