<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="何仙姑·一阶·岭南采药女·背篓采药医者仁心">
  <defs>
    <!-- 背景：岭南青山晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AB8A0"/>
      <stop offset="55%" stop-color="#7E9E88"/>
      <stop offset="100%" stop-color="#5E7E6E"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="morning" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF7E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF7E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 素裙 -->
    <linearGradient id="gown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0EEE8"/>
      <stop offset="100%" stop-color="#D8D4CC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E2C8A8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#morning)"/>

  <!-- 远山 -->
  <path d="M 0 130 Q 40 108 90 118 Q 140 126 200 112 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.5"/>

  <!-- 村落炊烟（右） -->
  <g opacity="0.9">
    <path d="M 150 96 L 150 86 L 164 86 L 164 96 L 170 96 L 170 78 L 144 78 L 144 96 Z" fill="#A87A56"/>
    <path d="M 156 86 L 156 78 L 155 86 Z" fill="#A87A56"/>
    <path d="M 157 76 Q 152 70 157 66 Q 162 62 157 58" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 药草（前景） -->
  <g>
    <path d="M 40 156 Q 38 148 42 142" stroke="#6E9E6E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M 40 148 Q 34 146 32 142 M 40 146 Q 46 144 48 140" stroke="#6E9E6E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 60 160 Q 58 152 62 146" stroke="#7EA87E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M 130 158 Q 128 150 132 144" stroke="#6E9E6E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M 132 150 Q 126 148 124 144" stroke="#6E9E6E" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 山路 -->
  <path d="M 70 170 Q 90 160 110 164 Q 130 168 150 160 L 170 164 L 170 200 L 50 200 Z" fill="#8E9E86" opacity="0.7"/>

  <!-- 素裙少女（6头身，背竹篓，俯身采药） -->
  <!-- 腿 -->
  <path d="M 92 138 L 88 160 L 94 160 L 98 140 Z" fill="#C8C4BC"/>
  <path d="M 108 138 L 114 162 L 108 162 L 104 140 Z" fill="#C8C4BC"/>
  <!-- 素裙 -->
  <path d="M 90 120 Q 88 132 92 140 Q 100 146 108 140 Q 112 132 110 120 Q 100 114 90 120 Z" fill="url(#gown)" stroke="#C8C4BC" stroke-width="1"/>
  <!-- 上身 -->
  <path d="M 94 98 Q 90 108 94 120 Q 100 126 106 120 Q 110 108 106 98 Q 100 94 94 98 Z" fill="url(#gown)" stroke="#C8C4BC" stroke-width="1"/>
  <!-- 荆钗腰带 -->
  <path d="M 94 112 L 106 112" stroke="#A8906E" stroke-width="1.4"/>

  <!-- 头（鹅蛋脸清秀，眉眼弯弯带笑） -->
  <circle cx="100" cy="90" r="10" fill="url(#skin)" stroke="#D8BC98" stroke-width="0.8"/>
  <!-- 青丝挽髻 + 荆钗 -->
  <path d="M 94 82 Q 98 78 102 82 Q 100 77 98 77 Q 96 77 94 82 Z" fill="#1E1814"/>
  <path d="M 94 80 L 90 78" stroke="#A8906E" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 额发 -->
  <path d="M 91 88 Q 95 83 100 83 Q 105 83 109 88 Q 105 84 100 84 Q 95 84 91 88 Z" fill="#1E1814"/>
  <!-- 眉眼弯弯带笑 -->
  <path d="M 92 88 Q 95 86.8 98 87.4 M 102 87.4 Q 105 86.8 108 88" stroke="#1E1008" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <circle cx="95" cy="90.6" r="2.2" fill="#1E1008"/>
  <circle cx="105" cy="90.6" r="2.2" fill="#1E1008"/>
  <circle cx="96" cy="89.8" r="0.7" fill="#FFF"/>
  <circle cx="106" cy="89.8" r="0.7" fill="#FFF"/>
  <!-- 鼻梁 -->
  <path d="M 100 92 L 100 94.5" stroke="#C8A884" stroke-width="1" stroke-linecap="round"/>
  <!-- 温柔笑 -->
  <path d="M 95 98 Q 100 100.6 105 98" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 竹篓（背） -->
  <path d="M 84 96 L 78 122 L 90 128 L 94 100 Z" fill="#C8A868" stroke="#A8884E" stroke-width="1"/>
  <!-- 竹篓背带 -->
  <path d="M 86 98 C 82 102 80 106 82 112" stroke="#A8884E" stroke-width="1.4" fill="none"/>
  <!-- 篓中药草 -->
  <path d="M 82 112 Q 78 106 80 100 M 86 116 Q 84 108 88 102" stroke="#6E9E6E" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- 右臂俯身采药 -->
  <path d="M 106 100 C 112 104 116 110 118 118" fill="none" stroke="#E8E4DC" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="119" cy="120" r="3" fill="#E2C8A8"/>

  <!-- 左臂护篓 -->
  <path d="M 96 102 C 92 106 90 110 90 116" fill="none" stroke="#E8E4DC" stroke-width="3.6" stroke-linecap="round"/>

  <!-- 药草微光（仁心） -->
  <g fill="#A8E0A8">
    <circle cx="124" cy="124">
      <animate attributeName="cy" values="124;118;124" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="118">
      <animate attributeName="cy" values="118;112;118" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光金尘 -->
  <g fill="#FFF7E0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="52">
      <animate attributeName="cy" values="52;44;52" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
