<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="土行孙·五阶·土府星君·执笏镇土">
  <defs>
    <!-- 背景：云端土府星君殿前 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AA8B8"/>
      <stop offset="50%" stop-color="#6E7E90"/>
      <stop offset="100%" stop-color="#4E5E70"/>
    </linearGradient>
    <!-- 土黄星光 -->
    <radialGradient id="aura" cx="50%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <!-- 星君官袍（土金） -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C86A"/>
      <stop offset="100%" stop-color="#A88A3E"/>
    </linearGradient>
    <!-- 山河大地如棋盘 -->
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E9862"/>
      <stop offset="100%" stop-color="#5E7A4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DEC2"/>
      <stop offset="100%" stop-color="#DCC4A0"/>
    </radialGradient>

    <!-- 头部模板：圆脸·细眉·眯眼端方·官威 -->
    <g id="tuxingsun-face">
      <ellipse cx="0" cy="0" rx="11" ry="11.5" fill="url(#skin)" stroke="#C8A882" stroke-width="0.8"/>
      <!-- 胖腮·蒜头鼻 -->
      
      <!-- 眉 -->
      <path d="M -8 -1.3 Q -5 -2.4 -2 -2 M 8 -1.3 Q 5 -2.4 2 -2" stroke="#1E1008" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <!-- 眼 -->
      <path d="M -7 0.6 Q -4.5 -1.4 -1.8 -0.4 L -1.8 1.4 Q -4.5 0.6 -7 2.2 Z" fill="#1E1008"/>
      <path d="M 7 0.6 Q 4.5 -1.4 1.8 -0.4 L 1.8 1.4 Q 4.5 0.6 7 2.2 Z" fill="#1E1008"/>
      <!-- 鼻 -->
      <circle cx="0" cy="3.4" r="2" fill="#C8A880"/>
      <path d="M -2 4.4 Q 0 4.8 2 4.4" stroke="#B8A080" stroke-width="0.8" fill="none"/>
      <!-- 唇 -->
      <path d="M -3 5.6 Q 0 7.6 3 5.6" fill="none" stroke="#B06A4A" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 土黄星光 -->
  <circle cx="100" cy="96" r="84" fill="url(#aura)">
    <animate attributeName="opacity" values="1;0.72;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星君神光圆 -->
  <g>
    <circle cx="100" cy="96" r="58" fill="none" stroke="#F5D742" stroke-width="2.4" opacity="0.85">
      <animate attributeName="r" values="58;63;58" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="96" r="50" fill="none" stroke="#F5D742" stroke-width="1.1" opacity="0.5">
      <animate attributeName="r" values="50;53;50" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 四方土纹 -->
    <path d="M 100 38 L 101.5 42 L 99 42.5 L 100 46" fill="none" stroke="#F5D742" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 42 90 L 46 91.5 L 45.5 89 L 49 90" fill="none" stroke="#F5D742" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 158 90 L 154 91.5 L 154.5 89 L 151 90" fill="none" stroke="#F5D742" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 云海托足 -->
  <g opacity="0.75">
    <path d="M 0 132 Q 50 124 100 130 Q 150 136 200 128 L 200 200 L 0 200 Z" fill="#E8E4DC">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 2;0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 脚下山河大地（棋盘） -->
  <g>
    <path d="M 0 158 Q 40 150 80 158 Q 120 166 160 156 Q 180 152 200 158 L 200 200 L 0 200 Z" fill="url(#land)"/>
    <!-- 河道 -->
    <path d="M 46 200 Q 44 172 58 164 Q 72 158 78 148" fill="none" stroke="#9AB8C8" stroke-width="2.4" opacity="0.8"/>
    <path d="M 140 200 Q 142 176 132 166" fill="none" stroke="#9AB8C8" stroke-width="2" opacity="0.7"/>
    <!-- 田野线 -->
    <path d="M 20 172 L 60 170 M 30 180 L 70 178" stroke="#5E7A4E" stroke-width="1" opacity="0.6"/>
    <path d="M 110 178 L 150 176 M 118 186 L 158 184" stroke="#5E7A4E" stroke-width="1" opacity="0.6"/>
    <!-- 村舍烟火 -->
    <path d="M 118 172 L 118 166 L 126 166 L 126 172 L 130 172 L 130 162 L 114 162 L 114 172 Z" fill="#8E5A3E" opacity="0.9"/>
    <path d="M 122 162 L 122 154 L 120 162 Z" fill="#8E5A3E"/>
    <path d="M 122 154 Q 118 150 122 146 Q 126 142 122 138" stroke="#E8E4DC" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 角色：土府星君（矮小，执笏镇土） -->
  <!-- 法云托足 -->
  <path d="M 82 128 Q 96 122 110 128 Q 118 133 110 138 Q 96 144 82 138 Q 74 133 82 128 Z" fill="#FFF7E0" opacity="0.9"/>
  <!-- 官袍下摆 -->
  <path d="M 86 118 Q 98 126 110 118 L 114 132 Q 100 142 84 132 Z" fill="url(#robe)"/>
  <!-- 上身 -->
  <path d="M 88 82 Q 84 100 90 118 Q 100 124 108 118 Q 114 100 110 82 Q 98 76 88 82 Z" fill="url(#robe)" stroke="#8E702E" stroke-width="1"/>
  <!-- 袍纹 -->
  <path d="M 92 92 Q 94 98 92 104 M 104 92 Q 102 98 104 104" stroke="#C8A84E" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 腰绦（捆仙绳化） -->
  <path d="M 88 106 L 110 106" stroke="#F5D742" stroke-width="2"/>
  <circle cx="110" cy="106" r="2" fill="#C8A028"/>

  <!-- 头（面部模板，官帽） -->
  <use href="#tuxingsun-face" transform="translate(99,74) scale(1)"/>
  <!-- 官帽后翘 -->
  <path d="M 92 66 Q 88 58 96 56 L 106 56 Q 114 58 110 66 Q 108 62 100 62 Q 94 62 92 66 Z" fill="#A88A3E" stroke="#8E702E" stroke-width="0.8"/>

  <!-- 左臂垂袖 -->
  <path d="M 90 86 C 84 92 82 100 84 108" fill="none" stroke="#E8C86A" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 右臂执笏（镔铁棍化） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 112 88;2 112 88;-2 112 88" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 108 86 C 114 90 118 94 120 100" fill="none" stroke="#E8C86A" stroke-width="4.4" stroke-linecap="round"/>
    <circle cx="121" cy="102" r="3.2" fill="#DCC4A0"/>
    <!-- 执笏 -->
    <rect x="118" y="58" width="7" height="42" rx="2" fill="#E8D880" stroke="#B8964E" stroke-width="1" transform="rotate(8 121 79)"/>
  </g>

  <!-- 神性土金星光 -->
  <g fill="#F5D742">
    <circle cx="46" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="126" cy="46">
      <animate attributeName="cy" values="46;38;46" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#F5D742" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 52 L 48 44"/><path d="M 144 52 L 152 44"/>
  </g>
</svg>
