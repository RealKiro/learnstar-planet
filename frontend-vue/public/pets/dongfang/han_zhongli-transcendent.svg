<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="汉钟离·六阶·太阳真火·御日行空照临万物">
  <defs>
    <!-- 背景：天穹朝霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#C8905E"/>
      <stop offset="100%" stop-color="#9E6E4E"/>
    </linearGradient>
    <!-- 太阳金 -->
    <radialGradient id="sun" cx="76%" cy="26%" r="38%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 真火红 -->
    <radialGradient id="aura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FF8A6E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8A6E" stop-opacity="0"/>
    </radialGradient>
    <!-- 甘霖蓝 -->
    <radialGradient id="rain" cx="50%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#9AC8E8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9AC8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 红袍 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0484E"/>
      <stop offset="100%" stop-color="#8E2E38"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D0B0"/>
      <stop offset="100%" stop-color="#D8B894"/>
    </radialGradient>

    <!-- 头部模板：赤发·浓眉·虎目含日光·虬髯慈严 -->
    <g id="hanzhongli-face">
      <ellipse cx="0" cy="0" rx="11" ry="11" fill="url(#skin)" stroke="#C8A880" stroke-width="0.9"/>
      <!-- 赤发（日光为冕） -->
      <path d="M -4 -8 Q 0 -11 4 -8 Q 2 -12 0 -12 Q -2 -12 -4 -8 Z" fill="#B8432E"/>
      <path d="M -8 -4 L -12 -2 M 8 -4 L 12 -2" stroke="#B8432E" stroke-width="1.6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- 额发 -->
      <path d="M -9 -3.5 Q -5 -8 0 -8 Q 5 -8 9 -3.5 Q 5 -7 0 -7 Q -5 -7 -9 -3.5 Z" fill="#B8432E"/>
      <!-- 浓眉 -->
      <path d="M -8.5 -1.5 Q -5 -3.2 -2 -2.4 M 8.5 -1.5 Q 5 -3.2 2 -2.4" stroke="#2E1A10" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <!-- 虎目含日光 -->
      <ellipse cx="-4.6" cy="0.4" rx="2.5" ry="2.2" fill="#1E1008"/>
      <ellipse cx="4.6" cy="0.4" rx="2.5" ry="2.2" fill="#1E1008"/>
      <circle cx="-5.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="4.1" cy="-0.4" r="0.8" fill="#FFF"/>
      <circle cx="-4.6" cy="0.4" r="0.7" fill="#FFE066"/>
      <circle cx="4.6" cy="0.4" r="0.7" fill="#FFE066"/>
      <!-- 鼻梁 -->
      <path d="M 0 1.5 L 0 3.6" stroke="#C0A884" stroke-width="1.1" stroke-linecap="round"/>
      <!-- 虬髯 -->
      <path d="M -5 6 Q -3 8 0 6.5 M 0 6.5 Q 3 8 5 6 M -2 8.5 Q 0 10 2 8.5" stroke="#2E1A10" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 太阳（御日） -->
  <circle cx="152" cy="52" r="56" fill="url(#sun)">
    <animate attributeName="opacity" values="0.95;0.7;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="15" fill="#FFF3C4" opacity="0.95">
    <animate attributeName="r" values="15;17;15" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 太阳光轮 -->
  <g stroke="#FFE066" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <path d="M 152 26 L 152 16 M 172 40 L 182 34 M 172 64 L 182 70 M 132 40 L 122 34 M 132 64 L 122 70"/>
  </g>

  <!-- 真火神光 -->
  <circle cx="100" cy="92" r="80" fill="url(#aura)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 阳光遍洒（自御日洒向人间，扇来） -->
  <g stroke="#FFF3C4" stroke-width="1.8" opacity="0.55" stroke-linecap="round">
    <path d="M 130 70 Q 112 96 108 124">
      <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 80 Q 128 104 126 130">
      <animate attributeName="opacity" values="0.5;0.18;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 甘霖（右侧，扇来） -->
  <circle cx="156" cy="150" r="50" fill="url(#rain)">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#9AC8E8" stroke-width="1.3" opacity="0.6" stroke-linecap="round">
    <path d="M 140 130 L 136 154">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 160 126 L 156 150">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 174 134 L 170 158">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 人间山川城池（下方沐光） -->
  <path d="M 0 158 Q 40 150 80 156 Q 120 162 160 154 Q 180 150 200 156 L 200 200 L 0 200 Z" fill="#7E9E6E"/>
  <path d="M 0 172 Q 60 164 120 170 Q 170 176 200 168 L 200 200 L 0 200 Z" fill="#6E8E5E"/>
  <!-- 城池 -->
  <g opacity="0.9">
    <path d="M 20 148 L 20 136 L 40 136 L 40 148 L 48 148 L 48 130 L 12 130 L 12 148 Z" fill="#A87A56"/>
    <path d="M 30 136 L 30 128 L 29 136 Z" fill="#A87A56"/>
    <path d="M 80 150 L 80 140 L 96 140 L 96 150 L 102 150 L 102 132 L 74 132 L 74 150 Z" fill="#B08A62"/>
    <path d="M 88 140 L 88 132 L 87 140 Z" fill="#B08A62"/>
  </g>
  <!-- 农田沐光 -->
  <g stroke="#A8C878" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 120 166 Q 118 160 122 155"/>
    <path d="M 150 170 Q 148 164 152 159"/>
  </g>

  <!-- 红袍帝君（御日巡天，芭蕉扇） -->
  <!-- 腿 -->
  <path d="M 88 126 L 84 148 L 90 148 L 94 128 Z" fill="#7E242E"/>
  <path d="M 106 126 L 114 152 L 108 152 L 102 128 Z" fill="#7E242E"/>
  <!-- 红袍 -->
  <path d="M 88 88 Q 84 104 90 126 Q 100 132 110 126 Q 116 104 112 88 Q 100 82 88 88 Z" fill="url(#robe)" stroke="#6E1E2A" stroke-width="1"/>
  <!-- 日光冠冕 -->
  <path d="M 90 80 Q 100 72 110 80 L 108 76 Q 100 68 92 76 Z" fill="#FFE066" opacity="0.9"/>
  <circle cx="100" cy="70" r="3.4" fill="#FFF3C4">
    <animate attributeName="r" values="3.4;4.6;3.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 腰带 -->
  <path d="M 88 108 L 112 108" stroke="#E8D8A8" stroke-width="2"/>

  <!-- 头（面部模板） -->
  <use href="#hanzhongli-face" transform="translate(100,72) scale(1)"/>

  <!-- 左臂持芭蕉扇（一挥阳光遍洒） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 90 92;3 90 92;-4 90 92" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 90 92 C 82 96 78 100 76 108" fill="none" stroke="#C0484E" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M 74 106 Q 66 110 70 118 Q 78 120 80 112" fill="#6EA878" stroke="#4E885E" stroke-width="1" opacity="0.9"/>
  </g>

  <!-- 右臂指向人间（御日照临） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 108 92 C 114 96 120 100 124 106" fill="none" stroke="#C0484E" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="126" cy="108" r="3.4" fill="#D8B894"/>
    <!-- 照临之光 -->
    <path d="M 126 110 Q 136 126 140 140" fill="none" stroke="#FFF3C4" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 太阳星尘 -->
  <g fill="#FFE066">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="40">
      <animate attributeName="cy" values="40;30;40" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
