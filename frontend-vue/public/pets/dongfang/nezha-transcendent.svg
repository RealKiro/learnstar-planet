<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哪吒·六阶·归真·肉身成圣">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE8DE"/>
      <stop offset="70%" stop-color="#E6E4E0"/>
      <stop offset="100%" stop-color="#CBCFD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9A8FB8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9A8FB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robe" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8E4DC" stop-opacity="0.55"/>
    </radialGradient>

    <g id="nezha-head">
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#FBEBD6" stroke="#D0C0A4" stroke-width="1"/>
      <circle cx="-14" cy="-21" r="7" fill="#3A2A1A"/>
      <circle cx="14" cy="-21" r="7" fill="#3A2A1A"/>
      <path d="M -10 -14 Q -4 -18 0 -15 Q 4 -18 10 -14" fill="none" stroke="#3A2A1A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="4.4" fill="#3A2A1A"/>
      <circle cx="7" cy="-2" r="4.4" fill="#3A2A1A"/>
      <circle cx="-5.4" cy="-3.6" r="1.5" fill="#FFF" opacity="0.8"/>
      <circle cx="8.6" cy="-3.6" r="1.5" fill="#FFF" opacity="0.8"/>
      <path d="M -4 6 Q 0 9 4 6" fill="none" stroke="#B8A284" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-11" cy="4" r="3.6" fill="#C85A4A" opacity="0.2"/>
      <circle cx="11" cy="4" r="3.6" fill="#C85A4A" opacity="0.2"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 神光（呼吸，融入山河） -->
  <circle cx="100" cy="104" r="80" fill="url(#glow)">
    <animate attributeName="r" values="80;90;80" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 环境：远山云海 -->
  <path d="M 0 168 Q 40 152 80 160 Q 120 172 150 156 Q 175 144 200 154 L 200 200 L 0 200 Z" fill="#B7BDC9" opacity="0.5"/>
  <path d="M 0 178 Q 30 170 60 176 Q 90 182 120 174 Q 160 164 200 174 L 200 196 Q 150 186 100 192 Q 50 198 0 192 Z" fill="#FFFFFF" opacity="0.75"/>

  <!-- 莲花座 -->
  <path d="M 84 166 Q 88 154 92 164 Q 96 150 100 162 Q 104 150 108 164 Q 112 154 116 166 Q 104 174 84 166 Z" fill="#F5EEDC" opacity="0.9"/>
  <path d="M 70 170 Q 84 158 96 170 Q 110 158 122 168 Q 112 178 96 174 Q 84 176 70 170 Z" fill="#E8DCC0" opacity="0.8"/>

  <!-- 素衣盘坐孩童（半透明返璞） -->
  <path d="M 70 102 Q 86 94 102 100 L 100 148 Q 84 158 66 148 Z" fill="url(#robe)"/>
  <path d="M 102 100 L 122 108 L 118 148 Q 104 156 94 150 Z" fill="#F0ECE4" opacity="0.5"/>
  <!-- 盘腿 -->
  <ellipse cx="94" cy="156" rx="18" ry="8" fill="#E8E4DC" opacity="0.55"/>

  <!-- 头（头部模板 scale 0.9，半透明神光内蕴） -->
  <g opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.8;0.55" dur="3.2s" repeatCount="indefinite"/>
    <use href="#nezha-head" transform="translate(92,80) scale(0.9) rotate(-12)"/>
  </g>

  <!-- 素莲簪发（发间一朵素莲） -->
  <path d="M 88 62 Q 84 56 90 52 Q 94 56 92 62 Z" fill="#F5EEDC" opacity="0.85"/>
  <path d="M 96 60 Q 94 54 100 50 Q 104 54 102 60 Z" fill="#E8DCC0" opacity="0.85"/>

  <!-- 混天绫化为一缕淡光 -->
  <path d="M 104 108 C 124 108 138 116 136 130" fill="none" stroke="#E0C0B8" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 归真粒子（飘浮） -->
  <g fill="#9A8FB8">
    <circle cx="62" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="138" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
