<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="哪吒·六阶·道果·三头六臂莲花战神">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#B03030"/>
      <stop offset="55%" stop-color="#6E1A1A"/>
      <stop offset="100%" stop-color="#2A0E18"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFE9D4"/>
      <stop offset="100%" stop-color="#F0D4B8"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D742"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC24A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC24A" stop-opacity="0"/>
    </radialGradient>

    <g id="nezha-head">
      <ellipse cx="0" cy="0" rx="19" ry="17" fill="#FBEBD6" stroke="#D8B894" stroke-width="1"/>
      <circle cx="-14" cy="-21" r="7" fill="#2A1A0A"/>
      <circle cx="14" cy="-21" r="7" fill="#2A1A0A"/>
      <path d="M -10 -14 Q -4 -18 0 -15 Q 4 -18 10 -14" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="7" cy="-2" r="4.4" fill="#1A0A0A"/>
      <circle cx="-5.4" cy="-3.6" r="1.5" fill="#FFF"/>
      <circle cx="8.6" cy="-3.6" r="1.5" fill="#FFF"/>
      <path d="M -11 -6 Q -8 -9 -5 -8 M 11 -6 Q 8 -9 5 -8" fill="none" stroke="#2A1A0A" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M -4 6 Q 0 9 4 6" fill="none" stroke="#C85A4A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-11" cy="4" r="3.6" fill="#C85A4A" opacity="0.35"/>
      <circle cx="11" cy="4" r="3.6" fill="#C85A4A" opacity="0.35"/>
      <path d="M 0 -18 Q 2 -22 5 -23" fill="none" stroke="#2A1A0A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 战斗圣光（呼吸） -->
  <circle cx="100" cy="104" r="84" fill="url(#core)">
    <animate attributeName="r" values="84;94;84" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="72" fill="none" stroke="#FFC24A" stroke-width="2" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 100 104;20 100 104;0 100 104" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- 风火轮（踏焰） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 82 158;60 82 158;120 82 158" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="82" cy="158" r="14" fill="none" stroke="#FFC24A" stroke-width="5"/>
    <path d="M 82 144 L 82 172 M 68 158 L 96 158" stroke="#FFC24A" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 118 158;60 118 158;120 118 158" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="118" cy="158" r="14" fill="none" stroke="#FFC24A" stroke-width="5"/>
    <path d="M 118 144 L 118 172 M 104 158 L 132 158" stroke="#FFC24A" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- 侧头×2（三头六臂全开） -->
  <use href="#nezha-head" transform="translate(70,86) scale(0.72) rotate(-45)" opacity="0.75"/>
  <use href="#nezha-head" transform="translate(130,86) scale(0.72) rotate(45)" opacity="0.75"/>

  <!-- 腿（腾跃威临） -->
  <path d="M 88 134 C 82 144 78 150 76 156" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 112 132 C 116 142 118 148 120 152" fill="none" stroke="url(#skin)" stroke-width="8" stroke-linecap="round" transform="rotate(-8 116 142)"/>

  <!-- 身体（莲花金甲） -->
  <path d="M 90 92 Q 82 108 88 128 Q 100 138 112 128 Q 118 108 112 92 Q 104 86 90 92 Z" fill="url(#skin)"/>
  <path d="M 88 96 Q 100 88 112 96 L 110 120 Q 100 126 90 120 Z" fill="url(#armor)"/>
  <path d="M 96 94 L 96 122 M 104 94 L 104 122" stroke="#8E6E14" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <circle cx="86" cy="104" r="7" fill="url(#armor)"/>
  <circle cx="114" cy="104" r="7" fill="url(#armor)"/>

  <!-- 六臂（正面2 + 两侧各2，法宝齐发） -->
  <path d="M 102 100 C 112 92 120 84 126 74" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="128" cy="72" r="4" fill="url(#skin)"/>
  <path d="M 96 100 C 86 102 78 108 72 116" fill="none" stroke="url(#skin)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 90 104 C 72 110 58 122 50 134" fill="none" stroke="url(#skin)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="48" cy="137" r="3.5" fill="url(#skin)"/>
  <path d="M 112 104 C 130 110 144 120 152 130" fill="none" stroke="url(#skin)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="154" cy="133" r="3.5" fill="url(#skin)"/>

  <!-- 火尖枪（主臂） -->
  <line x1="58" y1="156" x2="134" y2="40" stroke="#8E1A12" stroke-width="5" stroke-linecap="round"/>
  <path d="M 134 40 L 144 30 L 134 34 L 140 26 Z" fill="#FFC24A"/>
  <path d="M 138 32 C 132 22 136 14 140 8 C 144 14 146 22 138 32 Z" fill="#F97316" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- 掷出的乾坤圈 + 套颈圈 -->
  <circle cx="52" cy="118" r="7" fill="none" stroke="#F5D742" stroke-width="3.4">
    <animate attributeName="cx" values="52;34;52" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="116" r="6" fill="none" stroke="#F5D742" stroke-width="3"/>

  <!-- 混天绫（两侧飘，长绫） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 2;0 0" dur="2s" repeatCount="indefinite"/>
    <path d="M 112 124 C 140 126 156 138 152 154 C 164 146 162 128 144 120 C 132 116 118 120 112 124 Z" fill="#C22A1A" opacity="0.95"/>
  </g>

  <!-- 主头（头部模板 scale 1.05） -->
  <use href="#nezha-head" transform="translate(100,84) scale(1.05)"/>

  <!-- 金冠 -->
  <path d="M 82 62 Q 100 54 118 62" fill="none" stroke="#F5D742" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 84 58 C 92 52 108 52 116 58" fill="none" stroke="#F5D742" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="100" cy="48" r="4" fill="#F5D742">
    <animate attributeName="r" values="4;5;4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 火星（飘浮） -->
  <g fill="#FFC24A">
    <circle cx="54" cy="112">
      <animate attributeName="cy" values="112;100;112" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="106">
      <animate attributeName="cy" values="106;94;106" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
