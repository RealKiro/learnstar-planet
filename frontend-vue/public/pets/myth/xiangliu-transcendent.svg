<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="相柳·六阶·守土传说·暮色看小蛇学收放毒雾尾碰传语">
  <defs>
    <!-- 背景：河谷暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAC74"/>
      <stop offset="100%" stop-color="#8EA69A"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#C8E8D8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8E8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蛇鳞青 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA898"/>
      <stop offset="100%" stop-color="#4A8E7E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="112" r="58" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#B88E5E" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 河谷地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E8E82" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#8EAEA2" stroke-width="1.2" opacity="0.6"/>
  <!-- 河水 -->
  <path d="M 0 152 Q 40 150 80 152 Q 120 154 160 152 L 200 154 L 200 200 L 0 200 Z" fill="#7E9E92" opacity="0.6"/>

  <!-- 小蛇（左下，学收放毒雾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蛇身（小，蜷） -->
    <path d="M 52 140 Q 64 136 72 140 Q 78 144 82 140" fill="none" stroke="#6EB8A8" stroke-width="4.4" stroke-linecap="round"/>
    <!-- 小头（3个） -->
    <ellipse cx="56" cy="132" rx="3.6" ry="3.2" fill="#6EB8A8" stroke="#4A8E7E" stroke-width="0.5"><circle cx="54" cy="131" r="0.9" fill="#24180E"/><circle cx="58" cy="131" r="0.9" fill="#24180E"/></ellipse>
    <ellipse cx="66" cy="134" rx="3.4" ry="3" fill="#6EB8A8" stroke="#4A8E7E" stroke-width="0.5"><circle cx="64" cy="133" r="0.8" fill="#24180E"/><circle cx="68" cy="133" r="0.8" fill="#24180E"/></ellipse>
    <!-- 学吐的小毒雾 -->
    <g fill="#AEC8BC" opacity="0.4">
      <circle cx="48" cy="130" r="2.2">
        <animate attributeName="r" values="1.6;3;1.6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 老相柳（大，看小蛇，尾碰传语） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 蛇身（盘踞） -->
    <path d="M 88 142 Q 110 136 132 140 Q 148 144 156 138" fill="none" stroke="url(#scale)" stroke-width="9" stroke-linecap="round"/>
    <!-- 尾（碰小蛇，传语） -->
    <path d="M 156 138 Q 150 130 140 126 Q 134 124 128 126" fill="none" stroke="url(#scale)" stroke-width="4.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 156 138;5 156 138;0 156 138" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 鳞纹 -->
    <path d="M 100 140 L 102 148 M 124 138 L 126 146" stroke="#3E7E6E" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 老主头（温和，看小蛇） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="128" rx="7.5" ry="6.5" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.8"/>
    <!-- 眼（温和） -->
    <path d="M 92 126 Q 94 125 96 126 M 100 126 Q 102 125 104 126" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="94" cy="127" r="1.6" fill="#24180E"/>
    <circle cx="94.4" cy="126.7" r="0.5" fill="#FFF"/>
    <circle cx="102" cy="127" r="1.6" fill="#24180E"/>
    <circle cx="102.4" cy="126.7" r="0.5" fill="#FFF"/>
  </g>

  <!-- 老次头 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="86" cy="120" rx="4.6" ry="4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="84" cy="119" r="1.1" fill="#24180E"/><circle cx="89" cy="119" r="1.1" fill="#24180E"/></ellipse>
    <ellipse cx="108" cy="122" rx="4.6" ry="4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="106" cy="121" r="1.1" fill="#24180E"/><circle cx="111" cy="121" r="1.1" fill="#24180E"/></ellipse>
    <ellipse cx="98" cy="114" rx="4.2" ry="3.6" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="96" cy="113" r="1" fill="#24180E"/><circle cx="101" cy="113" r="1" fill="#24180E"/></ellipse>
  </g>

  <!-- 传语微光（尾与小蛇间） -->
  <circle cx="124" cy="128" r="6" fill="#FFF0D0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.15;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
