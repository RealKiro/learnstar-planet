<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青龙·一阶·东方幼鳞·云间吐暖息枝头冒芽">
  <defs>
    <!-- 背景：东方初春天色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8EC"/>
      <stop offset="52%" stop-color="#9CC0D8"/>
      <stop offset="100%" stop-color="#86ACB0"/>
    </linearGradient>
    <!-- 春光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F0FAF4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0FAF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC8B8"/>
      <stop offset="100%" stop-color="#5EB0A0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云 -->
  <g fill="#EAF4F2" opacity="0.9">
    <path d="M 0 120 Q 30 110 60 118 Q 90 126 120 118 Q 150 110 180 118 L 200 114 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#F6FCF8" opacity="0.9">
    <path d="M 20 126 Q 50 118 80 126 Q 108 132 138 124 Q 168 116 200 124 L 200 200 L 0 200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 枝头冒芽（暖息所至） -->
  <path d="M 128 138 Q 140 130 152 134" stroke="#6E5640" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M 138 130 L 134 122 M 144 131 L 148 123" stroke="#6E5640" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#7EB86A">
    <path d="M 134 122 Q 130 118 128 114 Q 133 118 136 120 Z"/>
    <path d="M 148 123 Q 152 119 154 115 Q 150 119 146 121 Z"/>
    <animateTransform attributeName="transform" type="scale" values="0.8 0.8;1 1;0.8 0.8" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- 青鳞幼龙（云间翻滚，吐暖息） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 蛇身（盘云） -->
    <path d="M 96 98 C 84 92 80 82 86 72 C 92 64 104 62 112 68 Q 118 74 114 84 Q 110 92 104 96" fill="none" stroke="url(#scale)" stroke-width="7" stroke-linecap="round"/>
    <!-- 龙角 -->
    <path d="M 98 66 L 94 58 M 102 66 L 106 58" stroke="#E0D088" stroke-width="2" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="100" cy="70" rx="9" ry="8" fill="url(#scale)" stroke="#4A9E8E" stroke-width="0.8"/>
    <circle cx="95" cy="68" r="2.4" fill="#24180E"/>
    <circle cx="95.6" cy="67.4" r="0.8" fill="#FFF"/>
    <circle cx="106" cy="68" r="2.4" fill="#24180E"/>
    <circle cx="106.6" cy="67.4" r="0.8" fill="#FFF"/>
    <path d="M 109 71 Q 116 72 120 70" stroke="#5EB0A0" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 吐暖息（化芽） -->
    <g stroke="#F0FAF4" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 112 74 Q 120 78 128 76">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 小翼鳍 -->
    <path d="M 88 78 Q 78 72 74 62" stroke="#8AD0C0" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 春光星尘 -->
  <g fill="#F0FAF4">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
