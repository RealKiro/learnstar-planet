<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青龙·二阶·春寒之痛·冻僵田边盘身挡风春苗蔫黄">
  <defs>
    <!-- 背景：寒霜田边 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0B8C8"/>
      <stop offset="52%" stop-color="#8EA6B4"/>
      <stop offset="100%" stop-color="#7E9A9E"/>
    </linearGradient>
    <!-- 寒光 -->
    <radialGradient id="glow" cx="44%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#DCE8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DCE8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青鳞（沾霜，黯淡） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA898"/>
      <stop offset="100%" stop-color="#4A8E7E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 寒霜（空中） -->
  <g stroke="#DCE8F0" stroke-width="1" opacity="0.4" stroke-linecap="round">
    <path d="M 30 40 L 28 52 M 90 32 L 88 44 M 150 38 L 148 50">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 春苗（蔫黄） -->
  <g stroke="#B0A058" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M 100 140 Q 98 132 96 124"/>
    <path d="M 120 142 Q 120 134 118 126"/>
  </g>

  <!-- 农人（拢苗） -->
  <g opacity="0.85">
    <path d="M 144 130 L 142 144 L 146 144 L 148 130 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="146" cy="124" r="3.6" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.5"/>
    <!-- 拢苗的臂 -->
    <path d="M 144 132 L 138 128 M 138 128 L 134 130" stroke="#7E6E4E" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 草帽 -->
    <path d="M 140 121 Q 146 117 152 121 L 140 121 Z" fill="#C8A860" stroke="#A88840" stroke-width="0.5"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9278" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#9EB296" stroke-width="1.2" opacity="0.6"/>
  <!-- 冻霜土 -->
  <path d="M 0 150 Q 40 148 80 150 Q 120 152 160 150 L 200 152 L 200 200 L 0 200 Z" fill="#8EA298" opacity="0.6"/>

  <!-- 青鳞幼龙（盘身挡风，龙角垂） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 蛇身（盘，挡在苗前） -->
    <path d="M 56 138 Q 72 132 88 136 Q 100 138 108 134" fill="none" stroke="url(#scale)" stroke-width="7" stroke-linecap="round"/>
    <!-- 龙角（垂） -->
    <path d="M 58 130 L 55 123" stroke="#B8A868" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 头（垂，含忧） -->
    <ellipse cx="60" cy="130" rx="7" ry="6.2" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.7"/>
    <circle cx="57" cy="129" r="1.8" fill="#24180E"/>
    <circle cx="57.4" cy="128.7" r="0.6" fill="#FFF"/>
    <circle cx="64" cy="129" r="1.8" fill="#24180E"/>
    <circle cx="64.4" cy="128.7" r="0.6" fill="#FFF"/>
    <!-- 沾霜 -->
    <path d="M 56 134 Q 62 136 68 134" stroke="#DCE8F0" stroke-width="1" opacity="0.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 寒光尘 -->
  <g fill="#DCE8F0">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
