<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麒麟·二阶·乱世之痛·欲挡铁骑被冲撞角顶断木救伤卒">
  <defs>
    <!-- 背景：战场烽烟 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A89080"/>
      <stop offset="52%" stop-color="#8E7A6E"/>
      <stop offset="100%" stop-color="#6E5E54"/>
    </linearGradient>
    <!-- 烽火光 -->
    <radialGradient id="glow" cx="72%" cy="24%" r="36%">
      <stop offset="0%" stop-color="#FFB878" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFB878" stop-opacity="0"/>
    </radialGradient>
    <!-- 麟青（沾尘） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA898"/>
      <stop offset="100%" stop-color="#4A8E7E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 烽火 -->
  <circle cx="144" cy="48" r="46" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g fill="#FF9048" opacity="0.7">
    <path d="M 138 30 Q 142 20 148 26 Q 152 32 142 42 Q 138 36 138 30 Z"/>
    <path d="M 152 34 Q 158 26 164 30 Q 168 36 156 46 Q 152 40 152 34 Z"/>
  </g>
  <g fill="#6E5A50" opacity="0.8">
    <path d="M 136 44 L 148 44 L 146 56 L 138 56 Z"/>
  </g>

  <!-- 铁骑剪影（远处冲来） -->
  <g stroke="#4E3E36" stroke-width="1.8" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 150 96 L 156 110 L 162 96"/>
    <path d="M 152 100 L 160 100"/>
  </g>
  <!-- 刀光 -->
  <g stroke="#E8E8E0" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <path d="M 146 84 L 154 90">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 烽烟 -->
  <g stroke="#6E5A50" stroke-width="2" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 60 60 Q 56 50 60 42 M 100 52 Q 104 42 100 34">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 断木（被角顶开） -->
  <g fill="#7E6A4E" stroke="#5E4E38" stroke-width="0.8">
    <path d="M 96 128 L 116 124 L 118 132 L 98 136 Z"/>
  </g>

  <!-- 伤卒（被救） -->
  <g opacity="0.85">
    <ellipse cx="116" cy="140" rx="9" ry="5" fill="#7E6E54" stroke="#5E523E" stroke-width="0.8"/>
    <circle cx="112" cy="135" r="3.4" fill="#8E7E64" stroke="#5E523E" stroke-width="0.6"/>
    <!-- 血流 -->
    <path d="M 108 136 Q 106 138 106 141" stroke="#B05050" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5E4E42" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#7E6E5E" stroke-width="1.2" opacity="0.6"/>

  <!-- 幼麟（欲挡铁骑，被冲撞，仍角顶断木救卒） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 74 132 L 70 142 M 82 132 L 86 142" stroke="#4A8E7E" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 身体（微弓，被撞） -->
    <path d="M 58 116 Q 54 128 64 134 Q 78 140 90 134 Q 96 128 92 116 Q 78 110 58 116 Z" fill="url(#scale)" stroke="#3E7E6E" stroke-width="1"/>
    <!-- 麟甲纹 -->
    <path d="M 64 122 Q 72 119 80 122" stroke="#3E7E6E" stroke-width="1" opacity="0.5"/>
    <!-- 沾尘 -->
    <path d="M 60 130 Q 68 132 76 130" stroke="#8E7E6E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    <!-- 尾 -->
    <path d="M 92 128 Q 100 126 104 122" stroke="#4A8E7E" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- 前蹄（撑住） -->
    <path d="M 62 128 L 58 138 M 62 128 L 64 136" stroke="#3E7E6E" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 头（角顶断木，含悲） -->
  <g>
    <ellipse cx="62" cy="106" rx="10" ry="9" fill="url(#scale)" stroke="#3E7E6E" stroke-width="1"/>
    <path d="M 56 100 Q 52 96 54 92 M 58 102 Q 55 98 56 94" stroke="#5EA898" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- 独角（顶断木） -->
    <path d="M 66 98 Q 68 92 72 88" stroke="#F0E0C0" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="72" cy="87" r="2" fill="#FFE8A0" opacity="0.8"/>
    <!-- 眼（含悲，但坚定） -->
    <circle cx="56" cy="105" r="2.4" fill="#24180E"/>
    <circle cx="56.5" cy="104.5" r="0.8" fill="#FFF"/>
    <circle cx="68" cy="105" r="2.4" fill="#24180E"/>
    <circle cx="68.5" cy="104.5" r="0.8" fill="#FFF"/>
    <!-- 泪 -->
    <path d="M 69 107 Q 71 111 69 113" stroke="#A8E0D8" stroke-width="1.2" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 鼻 -->
    <path d="M 54 109 Q 60 110.6 66 109" stroke="#3E7E6E" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 烽火星尘 -->
  <g fill="#FFB878">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
