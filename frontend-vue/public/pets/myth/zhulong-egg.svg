<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="烛龙·一阶·灵胎·烛火微光">
  <defs>
    <!-- 背景：混沌大地（上暗下更暗，大留白） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24242D"/>
      <stop offset="100%" stop-color="#16161C"/>
    </linearGradient>
    <!-- 淡金微弱灵光 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
    <!-- 灵种（蜷缩渺小） -->
    <radialGradient id="seed" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4A4A58"/>
      <stop offset="60%" stop-color="#38383F"/>
      <stop offset="100%" stop-color="#26262D"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：混沌地气（仅底部一道） -->
  <ellipse cx="100" cy="182" rx="88" ry="9" fill="#202029" opacity="0.75"/>
  <path d="M 24 186 Q 70 174 116 184 T 196 180" fill="none" stroke="#2E2E3A" stroke-width="1.8" opacity="0.5"/>

  <!-- 氛围：极淡灵光 -->
  <circle cx="100" cy="146" r="44" fill="url(#halo)"/>

  <!-- 角色：蜷缩烛火灵种（渺小、未醒，画幅下1/3） -->
  <ellipse cx="100" cy="152" rx="13" ry="16" fill="url(#seed)"/>
  <ellipse cx="100" cy="152" rx="13" ry="16" fill="none" stroke="#8B7E6A" stroke-opacity="0.35" stroke-width="1"/>
  <!-- 蜷曲纹（胚胎未醒） -->
  <path d="M 91 150 Q 97 156 100 151 Q 103 146 109 150" fill="none" stroke="#C9B37E" stroke-width="1.1" opacity="0.5"/>
  <path d="M 93 141 Q 98 146 101 142" fill="none" stroke="#C9B37E" stroke-width="1" opacity="0.4"/>

  <!-- 顶焰（烛火如豆，照彻幽冥） -->
  <path d="M 100 137 C 95.5 129 97.5 123 100 119 C 102.5 123 104.5 129 100 137 Z" fill="url(#flame)"/>
  <path d="M 100 134 C 98 129 99 125.5 100 124 C 101 125.5 102 129 100 134 Z" fill="#FFF3C4"/>

  <!-- 混沌微光粒子 -->
  <circle cx="72" cy="160" r="1.2" fill="#C9B37E" opacity="0.5"/>
  <circle cx="128" cy="156" r="1" fill="#C9B37E" opacity="0.4"/>
  <circle cx="116" cy="166" r="0.9" fill="#C9B37E" opacity="0.35"/>
</svg>
