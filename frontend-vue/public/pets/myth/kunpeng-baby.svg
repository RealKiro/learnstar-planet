<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="鲲鹏·二阶·浅海之困·搁浅滩涂挣扎望天">
  <defs>
    <!-- 背景：滩涂与天空 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D0E0"/>
      <stop offset="52%" stop-color="#98B8CC"/>
      <stop offset="100%" stop-color="#C4B08C"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#F4FAFE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4FAFE" stop-opacity="0"/>
    </radialGradient>
    <!-- 墨黑鳞（沾沙） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E5668"/>
      <stop offset="100%" stop-color="#363E4C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="44" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 云（天空辽远） -->
  <g fill="#EAF0F8" opacity="0.8">
    <path d="M 20 50 Q 44 42 70 48 Q 90 52 100 48"/>
    <path d="M 120 34 Q 148 28 176 34 Q 188 38 196 34"/>
  </g>
  <!-- 飞鸟（自由） -->
  <g stroke="#5E768E" stroke-width="1.2" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 56 66 Q 60 62 64 66"/>
    <path d="M 140 56 Q 144 52 148 56">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 滩涂 -->
  <path d="M 0 138 Q 60 128 130 136 Q 170 140 200 132 L 200 200 L 0 200 Z" fill="#C4B08C" opacity="0.9"/>
  <path d="M 0 138 Q 60 128 130 136 Q 170 140 200 132" stroke="#D8C4A0" stroke-width="1.2" opacity="0.7"/>
  <!-- 沙纹 -->
  <path d="M 30 152 Q 60 148 96 152 M 120 160 Q 150 156 184 160" stroke="#D8C4A0" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 潮线（远处退去的海） -->
  <g fill="#7EA8C0" opacity="0.6">
    <path d="M 0 138 Q 40 134 70 138 L 70 150 L 0 150 Z"/>
  </g>

  <!-- 幼鲲（搁浅，挣扎，鳞沾沙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.2s" repeatCount="indefinite"/>
    <!-- 尾（拍沙挣扎） -->
    <path d="M 128 122 Q 144 118 150 108 Q 148 116 142 120 Z" fill="url(#scale)" stroke="#262E3C" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 128 122;14 128 122;0 128 122" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- 拍起的沙花 -->
    <g fill="#D8C4A0">
      <circle cx="150" cy="118" r="1.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -5;0 0" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="156" cy="124" r="1.3">
        <animateTransform attributeName="transform" type="translate" values="0 0;5 -6;0 0" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.12;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 身体（搁浅） -->
    <ellipse cx="102" cy="128" rx="34" ry="15" fill="url(#scale)" stroke="#262E3C" stroke-width="1"/>
    <!-- 沾沙 -->
    <path d="M 82 132 Q 96 138 112 134 M 100 140 Q 108 142 116 140" stroke="#C4B08C" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    <!-- 鳞纹 -->
    <path d="M 80 124 Q 96 120 116 124" stroke="#3A4250" stroke-width="1" opacity="0.6"/>
    <!-- 背鳍 -->
    <path d="M 98 113 Q 102 106 108 110 Q 110 114 106 116 Z" fill="#262E3C"/>
    <!-- 鳍干（晒） -->
    <path d="M 96 130 Q 94 136 92 138" stroke="#3A4250" stroke-width="1" opacity="0.5"/>
    <!-- 眼（望天） -->
    <circle cx="78" cy="124" r="3.2" fill="#C8D8E8"/>
    <circle cx="78" cy="123" r="1.6" fill="#16223A"/>
    <!-- 口（张，喘） -->
    <path d="M 68 128 Q 72 131 76 128" fill="none" stroke="#5E5E6A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 喘的水汽 -->
    <g stroke="#EAF0F8" stroke-width="1" opacity="0.5" stroke-linecap="round" fill="none">
      <path d="M 70 124 Q 68 120 70 116">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 望天的渴慕 -->
  <g stroke="#F4FAFE" stroke-width="1" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 78 112 Q 76 104 80 96">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 滩光 -->
  <g fill="#F4FAFE">
    <circle cx="40" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.08;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
