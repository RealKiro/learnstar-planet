<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="獬豸·四阶·触佞初成·公堂跃入独角触真凶冤者得雪">
  <defs>
    <!-- 背景：公堂 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B89868"/>
      <stop offset="52%" stop-color="#9E8258"/>
      <stop offset="100%" stop-color="#866E4E"/>
    </linearGradient>
    <!-- 正光 -->
    <radialGradient id="glow" cx="44%" cy="36%" r="48%">
      <stop offset="0%" stop-color="#E8ECF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8ECF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 羊雪白 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8F6"/>
      <stop offset="100%" stop-color="#E0E0DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="72" r="66" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 公堂柱 -->
  <g stroke="#7E5E3E" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 30 60 L 30 160 M 170 60 L 170 160"/>
  </g>
  <!-- 匾额 -->
  <rect x="70" y="48" width="60" height="22" fill="#B84834" stroke="#8E3626" stroke-width="1" rx="3"/>
  <text x="100" y="64" font-size="12" fill="#FFF0D8" text-anchor="middle" font-family="serif">明镜</text>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E6A4E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#9E8A6E" stroke-width="1.2" opacity="0.6"/>

  <!-- 真凶（右，被独角触，惊慌） -->
  <g opacity="0.9">
    <path d="M 148 124 L 146 140 L 150 140 L 152 124 Z" fill="#5E5E5E" stroke="#4E4E4E" stroke-width="0.8"/>
    <circle cx="150" cy="118" r="4" fill="#6E6E6E" stroke="#4E4E4E" stroke-width="0.6"/>
    <path d="M 146 120 Q 150 122 154 120" stroke="#4E4E4E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 惊慌 -->
    <path d="M 148 116 L 146 113" stroke="#4E4E4E" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M 154 117 L 156 114" stroke="#4E4E4E" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 被冤者（左，得雪拜谢） -->
  <g opacity="0.85">
    <path d="M 40 134 L 38 146 L 42 146 L 44 134 Z" fill="#7E7E7E" stroke="#5E5E5E" stroke-width="0.7"/>
    <circle cx="42" cy="128" r="3.6" fill="#8E8E8E" stroke="#5E5E5E" stroke-width="0.5"/>
    <!-- 拜谢（拱手） -->
    <path d="M 44 132 L 52 128 M 52 128 L 54 130" stroke="#7E7E7E" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 40 129 Q 42 130.6 44 129" stroke="#8E8E8E" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 獬豸（跃入，独角触真凶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
    <!-- 身体（跃） -->
    <ellipse cx="108" cy="128" rx="13" ry="9" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.8"/>
    <!-- 腿（跃） -->
    <path d="M 100 132 L 96 142 M 118 132 L 122 142" stroke="#C0B8B0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（扬） -->
    <path d="M 120 130 Q 126 126 130 122" stroke="#E0D8D0" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 头（独角触真凶，正光） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 108 116;4 108 116;0 108 116" dur="2.2s" repeatCount="indefinite"/>
    <ellipse cx="108" cy="114" rx="10" ry="9" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.8"/>
    <!-- 独角（触真凶） -->
    <path d="M 112 106 Q 118 98 126 94 Q 132 92 136 94" stroke="#F0E0C0" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 角尖正光 -->
    <circle cx="137" cy="93" r="2.6" fill="#FFE8A0" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 触向真凶的线 -->
    <g stroke="#FFE8A0" stroke-width="1.2" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 140 94 Q 146 96 150 100">
        <animate attributeName="opacity" values="0.6;0.25;0.6" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 眼（正肃） -->
    <path d="M 102 112 Q 104 111 106 112 M 112 112 Q 114 111 116 112" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="104" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="104.5" cy="112.5" r="0.7" fill="#FFF"/>
    <circle cx="114" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="114.5" cy="112.5" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="108" cy="118" rx="1.6" ry="1.2" fill="#A8A098"/>
  </g>

  <!-- 正光尘 -->
  <g fill="#E8ECF8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
