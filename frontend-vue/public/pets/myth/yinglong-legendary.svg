<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="应龙·五阶·大翼应龙·翼展千里以尾画地助禹治水">
  <defs>
    <!-- 背景：滔天洪水 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8E0"/>
      <stop offset="52%" stop-color="#88B0D0"/>
      <stop offset="100%" stop-color="#7098BC"/>
    </linearGradient>
    <!-- 治水金 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#FFF0C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青白鳞（大） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0D8EC"/>
      <stop offset="100%" stop-color="#90C0DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="44" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#5E7E9E" opacity="0.7">
    <path d="M 0 120 L 40 70 L 80 120 Z M 120 120 L 160 76 L 200 120 Z"/>
  </g>

  <!-- 洪水（滔天） -->
  <g fill="#5A8AC8" opacity="0.85">
    <path d="M 0 118 Q 40 108 80 116 Q 120 122 160 114 L 200 118 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 118 Q 40 108 80 116 Q 120 122 160 114 L 200 118" stroke="#8AB8E0" stroke-width="1.4" opacity="0.6"/>
  <!-- 水波 -->
  <path d="M 30 132 Q 60 130 90 132 M 120 138 Q 150 136 180 138" stroke="#A8D0E8" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 以尾画出的河道（水入归海） -->
  <g stroke="#C8E4F4" stroke-width="2.4" opacity="0.7" fill="none">
    <path d="M 60 126 Q 90 138 120 132 Q 150 126 172 134">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 归海的水流 -->
  <g fill="#C8E4F4">
    <circle cx="140" cy="130" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 3;0 0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="132" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;9 3;0 0" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 大禹（立于翼下，指挥） -->
  <g opacity="0.9">
    <path d="M 96 108 L 94 124 L 98 124 L 100 108 Z" fill="#C8A860" stroke="#A88840" stroke-width="0.8"/>
    <circle cx="98" cy="103" r="4.4" fill="#D8B878" stroke="#A88840" stroke-width="0.7"/>
    <path d="M 96 106 Q 98 108 100 106" stroke="#A88840" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <!-- 手持开山斧 -->
    <path d="M 92 110 L 84 100 M 84 100 L 80 96 M 87 102 L 82 98" stroke="#6E5E3E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 78 94 L 84 96 L 82 100 L 76 98 Z" fill="#8E7E4E"/>
  </g>

  <!-- 应龙（大，翼展千里，以尾画地） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 蛇身（盘旋） -->
    <path d="M 66 116 C 82 104 102 100 118 106 C 130 110 140 118 148 126" fill="none" stroke="url(#scale)" stroke-width="8" stroke-linecap="round"/>
    <!-- 尾（画地，划水） -->
    <path d="M 148 126 C 158 132 160 140 150 146 C 142 150 136 146 138 140" fill="none" stroke="url(#scale)" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 148 126;6 148 126;0 148 126" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 翼（展千里） -->
    <path d="M 82 106 Q 60 82 50 58 Q 66 74 86 90 Z" fill="#C8E4F4" stroke="#8AB8D8" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 82 106;-14 82 106;0 82 106" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 116 104 Q 138 80 148 56 Q 132 72 112 88 Z" fill="#C8E4F4" stroke="#8AB8D8" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 116 104;14 116 104;0 116 104" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 龙角（如圭） -->
    <path d="M 66 106 L 60 94 M 72 106 L 78 94" stroke="#E0D088" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 头（威严） -->
    <ellipse cx="68" cy="110" rx="10" ry="9" fill="url(#scale)" stroke="#6E9EC0" stroke-width="1"/>
    <circle cx="62" cy="108" r="2.8" fill="#24180E"/>
    <circle cx="62.7" cy="107.3" r="0.9" fill="#FFF"/>
    <circle cx="75" cy="108" r="2.8" fill="#24180E"/>
    <circle cx="75.7" cy="107.3" r="0.9" fill="#FFF"/>
    <!-- 吻须 -->
    <path d="M 78 111 Q 86 114 92 112" stroke="#8AB8D8" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 治水星尘 -->
  <g fill="#FFF0C8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
