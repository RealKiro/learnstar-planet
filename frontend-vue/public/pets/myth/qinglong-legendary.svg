<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青龙·五阶·东方之神·盘旋布春雨惊蛰长吟守四季之始">
  <defs>
    <!-- 背景：东方天际 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8EC"/>
      <stop offset="52%" stop-color="#9CC0D8"/>
      <stop offset="100%" stop-color="#7EA88C"/>
    </linearGradient>
    <!-- 神光 -->
    <radialGradient id="glow" cx="44%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#F0FAF4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0FAF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 守东威光 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#9ED8C8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9ED8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青鳞（如碧玉） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC8B8"/>
      <stop offset="100%" stop-color="#5EB0A0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="90" cy="42" r="86" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 守东威光 -->
  <circle cx="100" cy="112" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 四季（远景，一角流转） -->
  <g opacity="0.6">
    <!-- 春（左绿） -->
    <path d="M 0 128 Q 30 120 60 126 L 60 160 L 0 160 Z" fill="#7E9E5E"/>
    <!-- 秋（右金） -->
    <path d="M 140 126 Q 170 120 200 128 L 200 160 L 140 160 Z" fill="#C8A860"/>
    <!-- 冬（上白） -->
    <path d="M 60 120 L 100 104 L 140 120 L 100 112 Z" fill="#E8F0F0"/>
  </g>

  <!-- 云（下） -->
  <g fill="#EAF4F2" opacity="0.9">
    <path d="M 0 118 Q 30 110 60 116 Q 90 122 120 116 Q 150 110 180 116 L 200 114 L 200 200 L 0 200 Z"/>
  </g>

  <!-- 春雨（洒向春野） -->
  <g stroke="#C8E8E0" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <path d="M 40 100 L 38 120 M 60 98 L 58 118 M 80 100 L 78 120">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#7EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 青鳞青龙（大，盘旋东方，长吟） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 蛇身（盘旋，大） -->
    <path d="M 62 118 C 80 100 104 96 122 104 Q 136 112 144 122" fill="none" stroke="url(#scale)" stroke-width="8" stroke-linecap="round"/>
    <!-- 翼鳍（展） -->
    <path d="M 80 104 Q 58 80 46 54 Q 64 76 86 96 Z" fill="#9ED8C8" stroke="#5EB0A0" stroke-width="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0 80 104;-12 80 104;0 80 104" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 112 104 Q 134 80 146 54 Q 128 76 106 96 Z" fill="#9ED8C8" stroke="#5EB0A0" stroke-width="0.9">
      <animateTransform attributeName="transform" type="rotate" values="0 112 104;12 112 104;0 112 104" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 龙角（如圭） -->
    <path d="M 64 108 L 58 96 M 70 108 L 76 96" stroke="#E0D088" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 头（长吟，威） -->
    <ellipse cx="66" cy="112" rx="10" ry="9" fill="url(#scale)" stroke="#4A9E8E" stroke-width="1"/>
    <path d="M 60 110 Q 62 109 64 110 M 70 110 Q 72 109 74 110" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="111" r="2.6" fill="#24180E"/>
    <circle cx="62.6" cy="110.4" r="0.8" fill="#FFF"/>
    <circle cx="72" cy="111" r="2.6" fill="#24180E"/>
    <circle cx="72.6" cy="110.4" r="0.8" fill="#FFF"/>
    <!-- 长吟（惊蛰） -->
    <g stroke="#F0FAF4" stroke-width="1.6" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 58 102 Q 50 94 52 84">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 66 98 Q 62 90 66 82">
        <animate attributeName="opacity" values="0.45;0.15;0.45" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 神光星尘 -->
  <g fill="#F0FAF4">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
