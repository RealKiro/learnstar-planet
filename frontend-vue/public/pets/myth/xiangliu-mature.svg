<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="相柳·四阶·守土初成·田埂缺口盘身作墙九头镇流沙守田">
  <defs>
    <!-- 背景：山洪田埂 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8BCB0"/>
      <stop offset="52%" stop-color="#8EA69A"/>
      <stop offset="100%" stop-color="#7E968A"/>
    </linearGradient>
    <!-- 洪光 -->
    <radialGradient id="glow" cx="42%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#E8ECF0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8ECF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 蛇鳞青（沾泥） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA898"/>
      <stop offset="100%" stop-color="#4A8E7E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 山洪（从右上冲来） -->
  <g fill="#7E9EAC" opacity="0.8">
    <path d="M 120 90 Q 140 82 168 88 L 200 84 L 200 130 L 140 122 Q 130 120 124 112 Z"/>
  </g>
  <!-- 洪流 -->
  <path d="M 140 96 Q 152 92 168 96" stroke="#A8C8D8" stroke-width="1.2" opacity="0.6" fill="none"/>
  <g fill="#C8E0EC" opacity="0.6">
    <circle cx="160" cy="92" r="1.4"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 田埂缺口 -->
  <path d="M 0 148 L 96 144 L 96 200 L 0 200 Z" fill="#8EA66E" opacity="0.9"/>
  <path d="M 96 144 L 200 146 L 200 200 L 96 200 Z" fill="#7E965E" opacity="0.9"/>
  <!-- 缺口（中间） -->
  <path d="M 88 144 Q 100 140 112 144 L 112 200 L 88 200 Z" fill="#6E8A5E" opacity="0.85"/>
  <!-- 流沙（被镇） -->
  <g stroke="#9E9E86" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 98 146 Q 96 152 98 158">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5E7E4E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#7E9E6E" stroke-width="1.2" opacity="0.6"/>

  <!-- 村民（赶到，远处） -->
  <g opacity="0.8">
    <path d="M 176 132 L 174 144 L 178 144 L 180 132 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="178" cy="126" r="3.6" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.5"/>
    <path d="M 174 128 L 170 126" stroke="#7E6E4E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 相柳（盘身作墙，九头镇流沙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 蛇身（盘成墙，横贯缺口） -->
    <path d="M 70 142 Q 86 138 100 142 Q 114 146 126 142" fill="none" stroke="url(#scale)" stroke-width="9" stroke-linecap="round"/>
    <!-- 鳞纹 -->
    <path d="M 80 140 L 82 146 M 100 142 L 101 148 M 118 140 L 120 146" stroke="#3E7E6E" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 主头（吐雾镇沙，威） -->
  <g>
    <ellipse cx="76" cy="126" rx="7.5" ry="6.5" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.8"/>
    <path d="M 72 124 Q 74 123 76 124 M 80 124 Q 82 123 84 124" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="74" cy="125" r="1.6" fill="#24180E"/>
    <circle cx="74.4" cy="124.7" r="0.5" fill="#FFF"/>
    <circle cx="82" cy="125" r="1.6" fill="#24180E"/>
    <circle cx="82.4" cy="124.7" r="0.5" fill="#FFF"/>
    <!-- 吐雾 -->
    <path d="M 70 128 Q 64 130 60 128" stroke="#D85050" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 次头（同心吐雾） -->
  <g>
    <ellipse cx="66" cy="118" rx="5" ry="4.4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"/>
    <circle cx="64" cy="117" r="1.2" fill="#24180E"/>
    <circle cx="69" cy="117" r="1.2" fill="#24180E"/>
    <ellipse cx="88" cy="118" rx="5" ry="4.4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"/>
    <circle cx="86" cy="117" r="1.2" fill="#24180E"/>
    <circle cx="91" cy="117" r="1.2" fill="#24180E"/>
    <ellipse cx="110" cy="120" rx="5" ry="4.4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"/>
    <circle cx="108" cy="119" r="1.2" fill="#24180E"/>
    <circle cx="113" cy="119" r="1.2" fill="#24180E"/>
    <ellipse cx="124" cy="128" rx="4.6" ry="4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"/>
    <circle cx="122" cy="127" r="1.1" fill="#24180E"/>
    <circle cx="127" cy="127" r="1.1" fill="#24180E"/>
  </g>

  <!-- 镇流沙的毒雾 -->
  <g stroke="#9EBCAE" stroke-width="1.4" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 80 132 Q 88 136 96 134 Q 104 132 112 134">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 洪光尘 -->
  <g fill="#E8ECF0">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
