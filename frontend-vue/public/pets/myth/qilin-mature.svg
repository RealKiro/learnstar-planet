<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麒麟·四阶·止戈初成·立于对峙兽群中间眼神止戈">
  <defs>
    <!-- 背景：山林晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E8C0"/>
      <stop offset="52%" stop-color="#ACCC9C"/>
      <stop offset="100%" stop-color="#8AAE78"/>
    </linearGradient>
    <!-- 仁光 -->
    <radialGradient id="glow" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#FFF0C8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 麟青（生辉） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC0B0"/>
      <stop offset="100%" stop-color="#5EA898"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 仁光笼罩 -->
  <circle cx="100" cy="120" r="60" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 山林 -->
  <g stroke="#5E8E5E" stroke-width="2.6" stroke-linecap="round" opacity="0.5">
    <path d="M 12 44 Q 10 96 6 160 M 28 52 Q 24 100 18 160 M 176 42 Q 180 98 186 160"/>
  </g>
  <g fill="#6EA868" opacity="0.7">
    <path d="M 12 48 Q 6 42 4 34 Q 10 40 12 48 Z"/>
    <path d="M 176 46 Q 182 40 184 32 Q 178 38 176 46 Z"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#8EB87E" stroke-width="1.4" opacity="0.6"/>

  <!-- 对峙的兽群（左，放下锋芒） -->
  <g opacity="0.8">
    <ellipse cx="40" cy="138" rx="9" ry="6" fill="#8E7A5E" stroke="#6E5E42" stroke-width="0.8"/>
    <circle cx="36" cy="130" r="4.4" fill="#9E8A6E" stroke="#6E5E42" stroke-width="0.6"/>
    <path d="M 33 129 L 29 127 M 33 131 L 29 133" stroke="#C8B898" stroke-width="0.6" stroke-linecap="round"/>
    <circle cx="35" cy="129" r="1" fill="#24180E"/>
    <circle cx="39" cy="129" r="1" fill="#24180E"/>
    <!-- 垂下的锋芒（爪放下） -->
    <path d="M 44 134 L 48 138" stroke="#6E5E42" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- 对峙的兽群（右，放下锋芒） -->
  <g opacity="0.8">
    <ellipse cx="160" cy="140" rx="9" ry="6" fill="#6E7E5E" stroke="#4E5E42" stroke-width="0.8"/>
    <circle cx="164" cy="132" r="4.4" fill="#7E8E6E" stroke="#4E5E42" stroke-width="0.6"/>
    <path d="M 161 131 L 157 129 M 161 133 L 157 135" stroke="#AEBE9E" stroke-width="0.6" stroke-linecap="round"/>
    <circle cx="163" cy="131" r="1" fill="#24180E"/>
    <circle cx="167" cy="131" r="1" fill="#24180E"/>
    <path d="M 156 136 L 152 140" stroke="#4E5E42" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- 对峙的视线（向中间） -->
  <g stroke="#6E5E4E" stroke-width="1.2" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 48 128 Q 60 124 70 120"/>
    <path d="M 152 130 Q 140 124 130 120"/>
  </g>

  <!-- 幼麟（立中间，角垂含仁光，眼神止戈） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 92 136 L 88 146 M 100 136 L 104 146" stroke="#5EA898" stroke-width="3" stroke-linecap="round"/>
    <!-- 身体（稳立） -->
    <path d="M 76 118 Q 72 130 82 136 Q 96 142 108 136 Q 114 130 110 118 Q 96 112 76 118 Z" fill="url(#scale)" stroke="#4A8E7E" stroke-width="1"/>
    <!-- 麟甲纹 -->
    <path d="M 82 124 Q 90 121 98 124 M 80 132 Q 92 136 104 132" stroke="#4A8E7E" stroke-width="1" opacity="0.5"/>
    <!-- 尾 -->
    <path d="M 110 130 Q 118 128 122 124" stroke="#5EA898" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 前蹄 -->
    <path d="M 80 130 L 76 140 M 80 130 L 82 138" stroke="#4A8E7E" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 头（角垂含仁光，眼神温厚止戈） -->
  <g>
    <ellipse cx="80" cy="108" rx="11" ry="9.5" fill="url(#scale)" stroke="#4A8E7E" stroke-width="1"/>
    <path d="M 74 102 Q 70 98 72 94 M 76 104 Q 73 100 74 96" stroke="#6EB8A8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 独角（垂，含仁光） -->
    <path d="M 84 100 Q 87 92 90 88" stroke="#F0E0C0" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 仁光（眼周笼罩） -->
    <circle cx="80" cy="104" r="10" fill="#FFF0C8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.18;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（温厚） -->
    <path d="M 74 106 Q 76 105 78 106 M 84 106 Q 86 105 88 106" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="107" r="2.4" fill="#24180E"/>
    <circle cx="76.6" cy="106.4" r="0.8" fill="#FFF"/>
    <circle cx="86" cy="107" r="2.4" fill="#24180E"/>
    <circle cx="86.6" cy="106.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 73 111 Q 79 112.6 85 111" stroke="#4A8E7E" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 温和 -->
    <path d="M 77 114 Q 81 115.4 85 114" fill="none" stroke="#4A7E72" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 止戈的仁光（扩散） -->
  <g fill="none" stroke="#FFF0C8" stroke-width="1.2" opacity="0.5">
    <circle cx="80" cy="108" r="24">
      <animateTransform attributeName="transform" type="scale" values="0.6 0.6;1.3 1.3;0.6 0.6" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="40" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
