<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱雀·四阶·掌火初成·翅引火线隔离带野火被挡熄护林">
  <defs>
    <!-- 背景：南荒林缘 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C888"/>
      <stop offset="52%" stop-color="#D8AE72"/>
      <stop offset="100%" stop-color="#7EAE84"/>
    </linearGradient>
    <!-- 火线光 -->
    <radialGradient id="glow" cx="52%" cy="24%" r="54%">
      <stop offset="0%" stop-color="#FCE8B8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FCE8B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽（如霞） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F06854"/>
      <stop offset="100%" stop-color="#D84A38"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 保住的山林（左，青绿） -->
  <g fill="#5E9268" opacity="0.5">
    <path d="M 0 96 Q 40 88 90 94 L 90 200 L 0 200 Z"/>
  </g>
  <g fill="#6EAE7A" opacity="0.35">
    <path d="M 0 112 Q 36 104 78 110 L 78 200 L 0 200 Z"/>
  </g>
  <!-- 焦土（右，火场） -->
  <g fill="#7E6E58" opacity="0.6">
    <path d="M 118 108 Q 158 116 200 110 L 200 200 L 118 200 Z"/>
  </g>
  <!-- 隔离带（火线烧出） -->
  <path d="M 104 108 Q 110 130 108 148 L 116 148 L 118 108 Z" fill="#8E7E60" opacity="0.5"/>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#A0C088" stroke-width="1.4" opacity="0.5"/>

  <!-- 火线（隔离带边，燃） -->
  <g fill="#F0A030">
    <path d="M 108 138 Q 112 134 114 128 Q 116 134 112 138 Z">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 150 Q 114 146 116 140 Q 118 146 114 150 Z">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 野火（右，被挡熄边缘） -->
  <g fill="#E88A3C" opacity="0.8">
    <path d="M 156 116 Q 160 110 162 104 Q 164 112 160 116 Z">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 被护的小树苗 -->
  <g>
    <path d="M 46 144 L 46 136 M 46 136 Q 40 130 36 122 Q 44 128 46 132 Z" stroke="#6E5640" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M 46 136 Q 52 130 56 122 Q 48 128 46 132 Z" fill="#7EB86A"/>
  </g>

  <!-- 朱雀（翅引火线，挡火） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 尾羽 -->
    <path d="M 100 130 Q 90 138 84 130" stroke="url(#feather)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 98 132 Q 92 140 88 138" stroke="#D84636" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 身体 -->
    <ellipse cx="110" cy="116" rx="10.5" ry="8.5" fill="url(#feather)" stroke="#B83828" stroke-width="0.9"/>
    <!-- 右翅（引火线） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 120 110;-12 120 110;0 120 110" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 121 110 L 138 102 L 148 94 L 132 104 Z" fill="url(#feather)" stroke="#B83828" stroke-width="0.7"/>
      <!-- 翅尖引火线（带光） -->
      <path d="M 148 94 L 158 88 L 162 84" stroke="#F8A030" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 左翅（收，护身） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 100 110;6 100 110;0 100 110" dur="2.2s" repeatCount="indefinite"/>
      <path d="M 99 110 L 86 102 L 78 94 L 92 104 Z" fill="url(#feather)" stroke="#B83828" stroke-width="0.7"/>
    </g>
  </g>

  <!-- 朱雀头（温锐，翅尖火线） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="110" cy="100" rx="8" ry="7.2" fill="url(#feather)" stroke="#B83828" stroke-width="0.8"/>
    <path d="M 106 94 Q 106 88 110 86 M 110 94 Q 112 88 116 87" stroke="#F0604C" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="106.5" cy="99" r="2.2" fill="#24180E"/>
    <circle cx="107" cy="98.5" r="0.7" fill="#FFF"/>
    <circle cx="114.5" cy="99" r="2.2" fill="#24180E"/>
    <circle cx="115" cy="98.5" r="0.7" fill="#FFF"/>
    <path d="M 110 102 L 108 105.4 L 112 104.4 Z" fill="#E8B838"/>
    <!-- 额间火光 -->
    <circle cx="110" cy="93" r="2.4" fill="#F8C878" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火尘星尘 -->
  <g fill="#FCE8B8">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
