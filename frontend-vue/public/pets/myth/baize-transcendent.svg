<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白泽·六阶·白泽传说·暮色看雏追蝶尾碰传语懂了为帮人">
  <defs>
    <!-- 背景：山间暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAC74"/>
      <stop offset="100%" stop-color="#94AE84"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛（泛岁月光） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE6DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#8E9E94" opacity="0.4">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 蝶（被幼白泽追） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -3;0 0" dur="2.4s" repeatCount="indefinite"/>
    <g fill="#E894AC">
      <path d="M 74 100 Q 68 96 66 90 Q 72 94 76 98 Z"/>
      <path d="M 74 100 Q 80 96 82 90 Q 76 94 72 98 Z"/>
    </g>
    <ellipse cx="74" cy="102" r="1.2" ry="2" fill="#6E5650"/>
  </g>

  <!-- 幼白泽（左下，追蝶问，仰头） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="60" cy="136" rx="10" ry="7.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.8"/>
    <!-- 腿 -->
    <path d="M 54 141 L 52 147 M 66 141 L 68 147" stroke="#C8C2B8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 70 140 Q 76 140 77 145" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 前蹄（问蝶） -->
    <path d="M 56 130 Q 52 124 54 120" stroke="url(#fur)" stroke-width="1.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 56 130;-8 56 130;0 56 130" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 幼白泽头（仰头问蝶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="60" cy="124" rx="8.5" ry="7.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.8"/>
    <path d="M 53 119 L 49 113 L 57 117 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.5"/>
    <path d="M 67 119 L 71 113 L 63 117 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.5"/>
    <path d="M 55 116 Q 53 113 55 111 Q 57 113 57 115" fill="url(#fur)"/>
    <path d="M 63 116 Q 65 113 63 111 Q 61 113 61 115" fill="url(#fur)"/>
    <circle cx="56.5" cy="122" r="2" fill="#24180E"/>
    <circle cx="57" cy="121.6" r="0.65" fill="#FFF"/>
    <circle cx="64" cy="122" r="2" fill="#24180E"/>
    <circle cx="64.5" cy="121.6" r="0.65" fill="#FFF"/>
    <ellipse cx="60" cy="125.5" rx="1.3" ry="1" fill="#C8A0A0"/>
    <path d="M 57 128 Q 60 129.4 63 128" fill="none" stroke="#A8A098" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 老白泽（尾碰幼白泽，传道） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="116" cy="128" rx="15" ry="10.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 106 135 L 104 144 M 126 135 L 128 144" stroke="#C8C2B8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（垂，碰幼白泽） -->
    <path d="M 102 132 Q 94 134 90 138" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 102 132;5 102 132;0 102 132" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 传道微光（尾→幼白泽） -->
    <circle cx="82" cy="132" r="8" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老白泽头（温和，授理） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="112" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <path d="M 107 105 L 103 98 L 111 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 125 105 L 129 98 L 121 103 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 110 103 Q 108 100 110 98 Q 112 100 112 102" fill="url(#fur)"/>
    <path d="M 120 103 Q 122 100 120 98 Q 118 100 118 102" fill="url(#fur)"/>
    <!-- 双角（如圭，泛岁月） -->
    <path d="M 109 103 L 106 96 Q 110 97 111 101" fill="#E8D8C0"/>
    <path d="M 123 103 L 126 96 Q 122 97 121 101" fill="#E8D8C0"/>
    <!-- 双目（温和含慈） -->
    <path d="M 108 110 Q 110 108.6 112 110 M 121 110 Q 123 108.6 125 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="111" r="2.3" fill="#24180E"/>
    <circle cx="110.5" cy="110.5" r="0.7" fill="#FFF"/>
    <circle cx="123" cy="111" r="2.3" fill="#24180E"/>
    <circle cx="123.5" cy="110.5" r="0.7" fill="#FFF"/>
    <ellipse cx="116" cy="115" rx="1.6" ry="1.2" fill="#C8A0A0"/>
    <!-- 授理的嘴 -->
    <path d="M 112 118 Q 116 119.6 120 118" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
