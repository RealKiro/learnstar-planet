<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白泽·二阶·无知之惑·村口夜蹲想村民惧鬼欲言又止">
  <defs>
    <!-- 背景：村夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5468"/>
      <stop offset="52%" stop-color="#3E4854"/>
      <stop offset="100%" stop-color="#2E3840"/>
    </linearGradient>
    <!-- 月色 -->
    <radialGradient id="glow" cx="20%" cy="18%" r="30%">
      <stop offset="0%" stop-color="#E8EEF4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8EEF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛（沾尘） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F2EC"/>
      <stop offset="100%" stop-color="#DCD8D0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="36" cy="36" r="60" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 月 -->
  <circle cx="34" cy="32" r="13" fill="#E8EEF4" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.7;0.85" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 星夜 -->
  <g fill="#E8EEF4">
    <circle cx="110" cy="24" r="1.1">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="40" r="1.3">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 村舍（右） -->
  <g>
    <path d="M 132 96 L 132 140 L 180 140 L 180 96 Z" fill="#B0A898"/>
    <path d="M 126 96 L 156 78 L 186 96 Z" fill="#8E867A"/>
    <!-- 窗（惧鬼的村民在屋内灯下） -->
    <path d="M 146 104 L 146 120 L 158 120 L 158 104 Z" fill="#F4D088"/>
    <circle cx="152" cy="112" r="3.4" fill="#3E3840"/>
    <!-- 树影（以为是鬼） -->
    <g stroke="#3E4A54" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M 184 140 Q 188 116 182 98"/>
      <path d="M 185 118 L 198 112 M 184 108 L 170 102 M 183 98 L 192 90"/>
    </g>
  </g>

  <!-- 惧鬼的村民（窗内） -->
  <g>
    <circle cx="152" cy="110" r="3.2" fill="#C8C0B0"/>
    <!-- 颤抖 -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0.8 0;0 0" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- 幼白泽（蹲村口，想了一夜） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身（蹲） -->
    <ellipse cx="82" cy="132" rx="13" ry="9" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.9"/>
    <!-- 腿（蹲） -->
    <path d="M 74 138 L 72 146 M 92 138 L 94 146" stroke="#B8B2A8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 95 136 Q 102 138 104 143" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 幼白泽头（蹲着沉思，欲言又止） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="82" cy="114" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.9"/>
    <!-- 耳（微垂） -->
    <path d="M 73 108 L 68 101 L 77 106 Z" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.6"/>
    <path d="M 91 108 L 96 101 L 87 106 Z" fill="url(#fur)" stroke="#B8B2A8" stroke-width="0.6"/>
    <!-- 鬃毛（微乱） -->
    <path d="M 77 106 Q 75 102 77 100 Q 79 102 79 105" fill="url(#fur)"/>
    <path d="M 86 106 Q 88 102 86 100 Q 84 102 84 105" fill="url(#fur)"/>
    <!-- 双目（沉思，含惑） -->
    <path d="M 74 112 Q 76 110.6 78 112 M 87 112 Q 89 110.6 91 112" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="76.5" cy="112.5" r="0.7" fill="#FFF"/>
    <circle cx="89" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="89.5" cy="112.5" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="82" cy="117" rx="1.5" ry="1.2" fill="#C8A0A0"/>
    <!-- 欲言又止的嘴（微张又闭） -->
    <path d="M 78 120 Q 82 121 86 120" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 沉思光点 -->
    <circle cx="96" cy="108" r="1.6" fill="#E8EEF4" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 月光星尘 -->
  <g fill="#E8EEF4">
    <circle cx="60" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
