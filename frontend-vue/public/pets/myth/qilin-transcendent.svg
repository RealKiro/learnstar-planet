<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麒麟·六阶·仁兽传说·暮色看幼麟让蚁角蹭幼角传仁">
  <defs>
    <!-- 背景：溪边暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCB070"/>
      <stop offset="100%" stop-color="#A8C088"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 麟青（泛岁月光） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC0B0"/>
      <stop offset="100%" stop-color="#5EA898"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="106" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#C8A060" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>
  <!-- 溪水 -->
  <path d="M 0 152 Q 40 148 80 152 Q 120 156 160 152 L 200 154 L 200 200 L 0 200 Z" fill="#7EC0B8" opacity="0.5"/>

  <!-- 蚁虫（幼麟让开的对象） -->
  <g fill="#5E4E3A">
    <circle cx="120" cy="152" r="0.9"/>
    <circle cx="124" cy="151" r="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 幼麟（左下，学着让开蚁虫） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 62 136 L 58 146 M 70 136 L 74 146" stroke="#5EA898" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 52 122 Q 48 132 56 138 Q 68 142 76 137 Q 80 131 76 121 Q 66 116 52 122 Z" fill="#6EB8A8" stroke="#4A8E7E" stroke-width="0.9"/>
    <!-- 让开蚁虫的蹄（抬起） -->
    <path d="M 62 136 L 60 144 M 62 136 L 64 142" stroke="#4A8E7E" stroke-width="2" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 76 130 Q 82 128 84 124" stroke="#5EA898" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 幼麟头 -->
  <g>
    <ellipse cx="56" cy="114" rx="8.5" ry="7.5" fill="#6EB8A8" stroke="#4A8E7E" stroke-width="0.8"/>
    <path d="M 50 109 Q 48 106 49 103 M 52 110 Q 50 107 51 104" stroke="#8ED0C0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- 小角（初生） -->
    <path d="M 60 107 Q 61 102 63 100" stroke="#F0E0C0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="63" cy="99.5" r="1.4" fill="#FFE8A0" opacity="0.8"/>
    <!-- 眼（仰头看老麒麟） -->
    <circle cx="51" cy="113" r="1.8" fill="#24180E"/>
    <circle cx="51.5" cy="112.6" r="0.6" fill="#FFF"/>
    <circle cx="61" cy="113" r="1.8" fill="#24180E"/>
    <circle cx="61.5" cy="112.6" r="0.6" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 49 117 Q 54 118.4 59 117" stroke="#4A8E7E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老麒麟（看幼麟，角蹭幼角传仁） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 112 138 L 108 148 M 120 138 L 124 148" stroke="#5EA898" stroke-width="3" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M 96 120 Q 92 132 102 138 Q 116 144 128 138 Q 134 132 130 120 Q 116 114 96 120 Z" fill="url(#scale)" stroke="#4A8E7E" stroke-width="1"/>
    <!-- 麟甲纹（泛岁月光） -->
    <path d="M 102 126 Q 110 123 118 126 M 100 134 Q 112 138 124 134" stroke="#4A8E7E" stroke-width="1" opacity="0.5"/>
    <!-- 尾 -->
    <path d="M 130 132 Q 138 130 142 126" stroke="#5EA898" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 前蹄 -->
    <path d="M 100 132 L 96 142 M 100 132 L 102 140" stroke="#4A8E7E" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 老麒麟头（角蹭幼角传仁，温和） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="110" rx="11" ry="9.5" fill="url(#scale)" stroke="#4A8E7E" stroke-width="1"/>
    <path d="M 94 104 Q 90 100 92 96 M 96 106 Q 93 102 94 98" stroke="#6EB8A8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 角（垂，蹭幼角） -->
    <path d="M 104 102 Q 104 94 100 88 Q 98 84 94 82" stroke="#F0E0C0" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="93" cy="81" r="2.2" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 传仁的微光（两角之间） -->
    <circle cx="78" cy="92" r="6" fill="#FFF0C8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（温和） -->
    <path d="M 94 108 Q 96 107 98 108 M 104 108 Q 106 107 108 108" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="109" r="2.2" fill="#24180E"/>
    <circle cx="96.5" cy="108.6" r="0.7" fill="#FFF"/>
    <circle cx="106" cy="109" r="2.2" fill="#24180E"/>
    <circle cx="106.5" cy="108.6" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 93 113 Q 99 114.6 105 113" stroke="#4A8E7E" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 温和笑 -->
    <path d="M 97 116 Q 101 117.4 105 116" fill="none" stroke="#4A7E72" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
