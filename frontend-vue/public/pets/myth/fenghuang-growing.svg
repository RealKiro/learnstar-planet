<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="凤凰·三阶·浴火苦修·立余烬火中打坐羽尖渐亮">
  <defs>
    <!-- 背景：余烬火场 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B05838"/>
      <stop offset="52%" stop-color="#8E4A3A"/>
      <stop offset="100%" stop-color="#6E3A34"/>
    </linearGradient>
    <!-- 火光 -->
    <radialGradient id="glow" cx="46%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFC080" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFC080" stop-opacity="0"/>
    </radialGradient>
    <!-- 五色羽（渐亮） -->
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A878"/>
      <stop offset="100%" stop-color="#C88058"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="64" r="72" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 余烬地面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#5E322E" opacity="0.9"/>
  <path d="M 0 146 L 200 146" stroke="#8E5E4E" stroke-width="1.4" opacity="0.6"/>
  <!-- 余烬火星 -->
  <g fill="#FF9048">
    <circle cx="40" cy="154" r="2">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="158" r="1.8">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="162" r="1.4">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火苗（舔羽） -->
  <g fill="#FF9048" opacity="0.85">
    <path d="M 70 132 Q 68 122 72 118 Q 76 124 74 132 Z"/>
    <path d="M 110 130 Q 114 118 118 116 Q 118 124 114 130 Z"/>
  </g>
  <g fill="#F07838" opacity="0.7">
    <path d="M 86 134 Q 84 126 88 122 Q 92 128 90 134 Z"/>
    <path d="M 100 134 Q 104 128 108 126 Q 108 132 104 134 Z"/>
  </g>

  <!-- 雏凤（立火中打坐，安然） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体（立姿） -->
    <ellipse cx="92" cy="118" rx="14" ry="12" fill="url(#down)" stroke="#A8684E" stroke-width="0.9"/>
    <!-- 五色羽点（渐亮） -->
    <circle cx="84" cy="114" r="2.2" fill="#78B8A8" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="98" cy="116" r="2.2" fill="#A888C8" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="122" r="2" fill="#F0C878" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾羽（重生，渐长） -->
    <path d="M 104 124 Q 116 126 124 120" stroke="#E8A878" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 104 124;6 104 124;0 104 124" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 腿（立稳） -->
    <path d="M 86 128 L 84 138 M 98 128 L 100 138" stroke="#A8684E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 头（入火安然，冠羽如冠） -->
  <g>
    <ellipse cx="92" cy="100" rx="10" ry="9" fill="url(#down)" stroke="#A8684E" stroke-width="0.8"/>
    <path d="M 90 92 Q 88 87 90 83 M 93 92 Q 94 86 96 83 M 96 92 Q 98 88 100 86" stroke="#F0C878" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 眼（澄澈入火） -->
    <path d="M 86 99 Q 88 97 90 99 M 95 99 Q 97 97 99 99" fill="none" stroke="#24180E" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="88" cy="100" r="2.2" fill="#24180E"/>
    <circle cx="88.5" cy="99.6" r="0.7" fill="#FFF"/>
    <circle cx="97" cy="100" r="2.2" fill="#24180E"/>
    <circle cx="97.5" cy="99.6" r="0.7" fill="#FFF"/>
    <!-- 喙 -->
    <path d="M 84 103 L 79 102 L 84 105 Z" fill="#D89078"/>
    <!-- 颊 -->
    <circle cx="84" cy="104" r="1.6" fill="#E07878" opacity="0.5"/>
  </g>

  <!-- 火光星尘 -->
  <g fill="#FFC080">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
