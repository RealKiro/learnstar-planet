<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白虎·五阶·西方之神·立西丘巅御风巡荒低吼镇恶">
  <defs>
    <!-- 背景：秋空金色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4DCA8"/>
      <stop offset="52%" stop-color="#DCC08C"/>
      <stop offset="100%" stop-color="#A8B47C"/>
    </linearGradient>
    <!-- 神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E8ECF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8ECF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白虎毛（如霜） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEAE4"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威光环 -->
  <circle cx="100" cy="110" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#C8A868" opacity="0.5">
    <path d="M 0 126 Q 60 118 130 124 Q 170 128 200 122 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 西丘之巅 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#9EAE72" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#C0CC88" stroke-width="1.4" opacity="0.55"/>

  <!-- 远护的幼兽（左下，安然觅食） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="144" rx="6" ry="4.6" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.7"/>
    <circle cx="52" cy="137" r="3.8" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.6"/>
    <path d="M 50 139 L 48 144 M 55 139 L 57 144" stroke="#B8AC96" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 御风巡西荒的恶兽探头（右远，被镇） -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="160" cy="136" rx="8" ry="5.5" fill="#4E463E" stroke="#3A342E" stroke-width="0.7"/>
    <circle cx="156" cy="130" r="4.5" fill="#4E463E" stroke="#3A342E" stroke-width="0.6"/>
    <circle cx="153.6" cy="129" r="1.1" fill="#C84030" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 白虎之神（立巅，御风） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 御风尾（如鞭，威） -->
    <path d="M 118 128 Q 134 118 142 104" stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 118 128;6 118 128;0 118 128" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="143" cy="102" r="1.8" fill="#3A342E"/>
    <!-- 身体（昂立） -->
    <ellipse cx="100" cy="124" rx="17.5" ry="10.5" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.9"/>
    <!-- 前爪（巡西，昂） -->
    <path d="M 86 122 L 80 130" stroke="url(#fur)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 128 L 74 128 L 76 133 L 82 131 Z" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.6"/>
    <!-- 后腿（立稳） -->
    <path d="M 108 132 L 110 142 M 92 132 L 90 142" stroke="#C8C2B8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 身周神风 -->
    <g stroke="#FFF8E0" stroke-width="1.4" stroke-linecap="round" opacity="0.55" fill="none">
      <path d="M 74 116 Q 66 112 60 106">
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 128 122 Q 136 120 144 116">
        <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 白虎之神头（王纹如圭，含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="102" rx="13.5" ry="12" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.9"/>
    <!-- 耳（如峰） -->
    <path d="M 88 93 L 81 81 L 93 90 Z" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.6"/>
    <path d="M 112 93 L 119 81 L 107 90 Z" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.6"/>
    <!-- 王纹（如圭） -->
    <path d="M 100 91 L 100 85 M 94 89 L 106 89 M 96 87.4 L 104 87.4" stroke="#24180E" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 虎目（含威含温） -->
    <path d="M 89 100 Q 91.6 98.4 95 100 M 106 100 Q 108.4 98.4 111 100" stroke="#24180E" stroke-width="1" stroke-linecap="round" fill="none"/>
    <circle cx="92" cy="101" r="2.7" fill="#24180E"/>
    <circle cx="92.6" cy="100.4" r="0.85" fill="#FFF"/>
    <circle cx="109" cy="101" r="2.7" fill="#24180E"/>
    <circle cx="109.6" cy="100.4" r="0.85" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="100" cy="106" rx="2.2" ry="1.6" fill="#C89088"/>
    <!-- 肃杀护生的嘴（威而不露） -->
    <path d="M 96 109 Q 100 110.6 104 109" fill="none" stroke="#A8A098" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 额间神光 -->
    <circle cx="100" cy="90" r="3" fill="#FFF8E0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 秋神星尘 -->
  <g fill="#FFF8E0">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
