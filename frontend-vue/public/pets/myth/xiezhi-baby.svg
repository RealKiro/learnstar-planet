<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="獬豸·二阶·曲直之惑·冲在中间角不知触谁冤者含泪离去">
  <defs>
    <!-- 背景：街市路口 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8BCB0"/>
      <stop offset="52%" stop-color="#9EA49A"/>
      <stop offset="100%" stop-color="#828A82"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="40%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#E8E4DC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8E4DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 羊雪白（沾尘） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E0DC"/>
      <stop offset="100%" stop-color="#C8C8C4"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="80" cy="56" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.35;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 街市房影 -->
  <g fill="#8E948C" opacity="0.8">
    <path d="M 0 100 L 40 84 L 80 100 L 80 160 L 0 160 Z"/>
    <path d="M 140 96 L 180 82 L 200 92 L 200 160 L 140 160 Z"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E746E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#8E948E" stroke-width="1.2" opacity="0.6"/>

  <!-- 争执的两人（右，面红耳赤） -->
  <g opacity="0.85">
    <path d="M 140 128 L 138 142 L 142 142 L 144 128 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="142" cy="122" r="3.8" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.5"/>
    <path d="M 138 124 Q 142 126 146 124" stroke="#4E3E2E" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 160 126 L 158 140 L 162 140 L 164 126 Z" fill="#8E7E5E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="162" cy="120" r="3.8" fill="#AE9E7E" stroke="#6E5E3E" stroke-width="0.5"/>
    <path d="M 158 122 Q 162 124 166 122" stroke="#4E3E2E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 被冤者（左，含泪离去） -->
  <g opacity="0.85">
    <path d="M 40 134 L 38 146 L 42 146 L 44 134 Z" fill="#6E6E6E" stroke="#5E5E5E" stroke-width="0.7"/>
    <circle cx="42" cy="128" r="3.6" fill="#7E7E7E" stroke="#5E5E5E" stroke-width="0.5"/>
    <!-- 含泪 -->
    <path d="M 40 129 Q 42 130.6 44 129" stroke="#8E8E8E" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M 44 130 Q 46 133 44 135" stroke="#B8C8D0" stroke-width="1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 低垂离去 -->
    <path d="M 36 146 Q 30 148 26 150" stroke="#5E5E5E" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 幼獬豸（冲在中间，角不知触谁） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="88" cy="130" rx="12" ry="8.5" fill="url(#fur)" stroke="#A8A8A2" stroke-width="0.8"/>
    <!-- 腿 -->
    <path d="M 82 136 L 80 146 M 96 136 L 98 146" stroke="#A8A8A2" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 100 132 Q 106 132 110 130" stroke="#C8C8C4" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 头（角垂无光，含愧） -->
  <g>
    <ellipse cx="86" cy="116" rx="9.5" ry="8.5" fill="url(#fur)" stroke="#A8A8A2" stroke-width="0.8"/>
    <!-- 角（垂，无光） -->
    <path d="M 90 108 Q 90 101 86 97" stroke="#C8B890" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 眼（含悲） -->
    <circle cx="81" cy="115" r="2.2" fill="#24180E"/>
    <circle cx="81.5" cy="114.5" r="0.7" fill="#FFF"/>
    <circle cx="92" cy="115" r="2.2" fill="#24180E"/>
    <circle cx="92.5" cy="114.5" r="0.7" fill="#FFF"/>
    <!-- 泪 -->
    <path d="M 93 117 Q 95 121 93 123" stroke="#B8C8D0" stroke-width="1.1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 鼻 -->
    <ellipse cx="86" cy="120" rx="1.6" ry="1.2" fill="#A8A098"/>
    <!-- 抿唇 -->
    <path d="M 82 123 Q 86 124.4 90 123" fill="none" stroke="#8E8E86" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 昏光尘 -->
  <g fill="#E8E4DC">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
