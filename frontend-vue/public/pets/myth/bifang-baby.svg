<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="毕方·二阶·火灾之兆·焦黑林前被村民远指羽尖落火">
  <defs>
    <!-- 背景：焦黑林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A09890"/>
      <stop offset="52%" stop-color="#8E8278"/>
      <stop offset="100%" stop-color="#6E665E"/>
    </linearGradient>
    <!-- 余烬微光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="44%">
      <stop offset="0%" stop-color="#FFB878" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB878" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽（沾灰） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D85838"/>
      <stop offset="100%" stop-color="#B84830"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="70" r="64" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 焦黑的树桩 -->
  <g fill="#4E463E" stroke="#3E3832" stroke-width="1">
    <path d="M 14 116 L 24 110 L 26 160 L 16 160 Z"/>
    <path d="M 44 122 L 54 116 L 56 160 L 46 160 Z"/>
  </g>
  <g stroke="#3E3832" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <path d="M 18 118 Q 14 108 18 100 M 48 124 Q 44 114 48 106"/>
  </g>

  <!-- 余烬 -->
  <g fill="#FF9048">
    <circle cx="60" cy="152" r="1.8">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="156" r="1.4">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#5E564E" opacity="0.9"/>
  <path d="M 0 146 L 200 146" stroke="#7E766E" stroke-width="1.2" opacity="0.6"/>

  <!-- 村民（远指，咒骂） -->
  <g opacity="0.8">
    <path d="M 154 126 L 152 142 L 156 142 L 158 126 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.8"/>
    <circle cx="156" cy="120" r="4.2" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.6"/>
    <!-- 远指的臂 -->
    <path d="M 152 128 L 144 124 M 144 124 L 141 121" stroke="#7E6E4E" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 愤怒的眉 -->
    <path d="M 153 118 Q 156 117 159 118" stroke="#4E3E2E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 毕方（焦黑林前，被远指，含冤） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 一足 -->
    <path d="M 92 124 L 92 136" stroke="#B84830" stroke-width="2" stroke-linecap="round"/>
    <path d="M 92 136 L 89 139 M 92 136 L 95 139" stroke="#B84830" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 身体（缩着） -->
    <ellipse cx="92" cy="118" rx="12" ry="10" fill="url(#feather)" stroke="#98382A" stroke-width="0.9"/>
    <!-- 沾灰 -->
    <path d="M 86 124 Q 92 128 98 124" stroke="#7E766E" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <!-- 尾羽（垂） -->
    <path d="M 102 122 Q 108 124 112 122" stroke="#B84830" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 头（含冤，羽尖落火） -->
  <g>
    <ellipse cx="92" cy="104" rx="9" ry="8" fill="url(#feather)" stroke="#98382A" stroke-width="0.8"/>
    <path d="M 90 97 Q 88 93 90 90 M 93 97 Q 94 92 96 90" stroke="#D87050" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- 眼（含泪） -->
    <circle cx="87" cy="103" r="2.2" fill="#24180E"/>
    <circle cx="87.5" cy="102.5" r="0.7" fill="#FFF"/>
    <circle cx="97" cy="103" r="2.2" fill="#24180E"/>
    <circle cx="97.5" cy="102.5" r="0.7" fill="#FFF"/>
    <!-- 泪 -->
    <path d="M 98 105 Q 100 109 98 111" stroke="#C8E0E8" stroke-width="1.1" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 喙（微张欲辩） -->
    <path d="M 84 106 L 79 105 L 84 108 Z" fill="#D89078"/>
    <!-- 羽尖落火（颤，落下） -->
    <g fill="#FF9048">
      <path d="M 92 96 Q 90 92 92 88 Q 94 92 92 96 Z">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 落下的火星 -->
    <circle cx="94" cy="110" r="1.2" fill="#FF9048">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 6;0 0" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 慌忙踩灭 -->
    <path d="M 92 134 L 94 132" stroke="#FFB878" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 灰烟尘 -->
  <g fill="#C8C0B8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
