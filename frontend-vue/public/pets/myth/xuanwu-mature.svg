<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="玄武·四阶·镇北初成·张壳拢兽蛇首盘顶守暖寒潮过兽安">
  <defs>
    <!-- 背景：北渊寒潮 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4EC"/>
      <stop offset="52%" stop-color="#B4C8D4"/>
      <stop offset="100%" stop-color="#86A4BC"/>
    </linearGradient>
    <!-- 寒光 -->
    <radialGradient id="glow" cx="48%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#F4F8FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 玄龟壳（如盾） -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#566260"/>
      <stop offset="100%" stop-color="#404A48"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.48;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 寒潮风 -->
  <g stroke="#E8F0F4" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M 30 60 Q 70 54 110 60">
      <animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 84 Q 60 78 100 84">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 0;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 冰面 -->
  <g fill="#E8F0F4" opacity="0.9">
    <path d="M 0 138 L 200 138 L 200 200 L 0 200 Z"/>
  </g>
  <g stroke="#C8D8E0" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 50 138 L 44 158 M 170 138 L 176 156"/>
  </g>

  <!-- 壳下护住的一群小兽 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 小兽1 -->
    <ellipse cx="78" cy="146" rx="5.4" ry="4" fill="#D8D0C4" stroke="#B0A898" stroke-width="0.6"/>
    <circle cx="78" cy="140" r="3.2" fill="#D8D0C4" stroke="#B0A898" stroke-width="0.5"/>
    <circle cx="76.4" cy="139.4" r="0.8" fill="#24180E"/>
    <circle cx="79.6" cy="139.4" r="0.8" fill="#24180E"/>
    <!-- 小兽2 -->
    <ellipse cx="92" cy="148" rx="4.8" ry="3.6" fill="#D0C8BA" stroke="#A8A090" stroke-width="0.5"/>
    <circle cx="92" cy="143" r="3" fill="#D0C8BA" stroke="#A8A090" stroke-width="0.4"/>
    <!-- 小兽3 -->
    <ellipse cx="106" cy="146" rx="5" ry="3.8" fill="#D8D0C4" stroke="#B0A898" stroke-width="0.5"/>
    <circle cx="106" cy="140.6" r="3" fill="#D8D0C4" stroke="#B0A898" stroke-width="0.4"/>
    <circle cx="104.4" cy="140" r="0.8" fill="#24180E"/>
    <circle cx="107.6" cy="140" r="0.8" fill="#24180E"/>
    <!-- 壳下暖光 -->
    <ellipse cx="92" cy="146" rx="20" ry="7" fill="#FCE8B8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.16;0.28" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 玄武（张壳如盾护群兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 龟壳（大，如盾） -->
    <ellipse cx="96" cy="122" rx="30" ry="19" fill="url(#shell)" stroke="#2E3836" stroke-width="1.3"/>
    <!-- 壳纹 -->
    <g stroke="#6E7E7A" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 76 118 L 96 112 L 116 118 L 96 124 Z"/>
      <path d="M 96 112 L 96 104 M 76 118 L 62 114 M 116 118 L 130 114"/>
    </g>
    <!-- 壳上冰晶 -->
    <g fill="#E8F0F4" opacity="0.7">
      <circle cx="80" cy="110" r="1.5"/>
      <circle cx="114" cy="116" r="1.3"/>
    </g>
    <!-- 爪（守） -->
    <path d="M 80 136 L 76 144 M 112 136 L 116 144" stroke="#3A4442" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 蛇首（盘顶守暖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 96 120 Q 94 110 98 102 Q 101 96 108 92" stroke="url(#shell)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 108 92 Q 114 88 118 92" stroke="#6E8E8C" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="120" cy="90" rx="5.5" ry="4.6" fill="#6E8E8C" stroke="#526E6C" stroke-width="0.7"/>
    <circle cx="122.4" cy="88.6" r="1.5" fill="#24180E"/>
    <circle cx="122.8" cy="88.2" r="0.5" fill="#FFF"/>
    <path d="M 124.4 92 L 127 93 L 123 94" fill="#E8B838"/>
    <!-- 守暖吐息 -->
    <g stroke="#FCE8B8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M 126 94 Q 130 100 132 106">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 寒光星尘 -->
  <g fill="#F4F8FC">
    <circle cx="38" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
