<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="穷奇·六阶·凶兽传说·暮色翼扶初生小翼兽学扑幼兽群嬉">
  <defs>
    <!-- 背景：深岭暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B878"/>
      <stop offset="52%" stop-color="#D09A5E"/>
      <stop offset="100%" stop-color="#8E98A0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#FFE0A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFE0A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 虎纹毛皮（泛岁月光） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0A868"/>
      <stop offset="100%" stop-color="#B88050"/>
    </linearGradient>
    <!-- 翼 -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96AEC6"/>
      <stop offset="100%" stop-color="#768EA6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="48" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#B88E5E" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 深岭地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E8A86" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#9EAAA6" stroke-width="1.2" opacity="0.6"/>

  <!-- 幼兽群（嬉戏） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="142" rx="5.4" ry="4.2" fill="#9EB886" stroke="#6E8E56" stroke-width="0.7"/>
    <circle cx="49" cy="137" r="3" fill="#AEC89E" stroke="#6E8E56" stroke-width="0.6"/>
    <path d="M 47 136 L 45 134 M 50 136 L 52 134" stroke="#AEC89E" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="48" cy="136.6" r="0.9" fill="#24180E"/>
    <circle cx="51" cy="136.6" r="0.9" fill="#24180E"/>
  </g>
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="70" cy="145" rx="4.8" ry="3.6" fill="#7E9E6E" stroke="#5E7E4E" stroke-width="0.7"/>
    <circle cx="68" cy="140" r="2.8" fill="#8EAE7E" stroke="#5E7E4E" stroke-width="0.6"/>
    <path d="M 66 139 L 64 137 M 69 139 L 71 137" stroke="#8EAE7E" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="67" cy="139.6" r="0.8" fill="#24180E"/>
    <circle cx="70" cy="139.6" r="0.8" fill="#24180E"/>
  </g>

  <!-- 初生小翼兽（学扑，被翼扶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体（小，虎纹） -->
    <ellipse cx="118" cy="138" rx="7" ry="5.6" fill="#D09860" stroke="#8E5838" stroke-width="0.7"/>
    <path d="M 114 136 Q 118 138 122 136" stroke="#4E3018" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <!-- 小翼（学扑） -->
    <path d="M 116 134 Q 110 130 108 126" stroke="#768EA6" stroke-width="1.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 116 134;-16 116 134;0 116 134" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <!-- 腿（学扑） -->
    <path d="M 114 142 L 112 146 M 122 142 L 124 146" stroke="#8E5838" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- 小翼兽头（仰头看老穷奇） -->
  <g>
    <ellipse cx="118" cy="130" rx="5.4" ry="4.8" fill="#D09860" stroke="#8E5838" stroke-width="0.7"/>
    <path d="M 114 127 L 112 124 L 116 126 Z" fill="#D09860" stroke="#8E5838" stroke-width="0.5"/>
    <path d="M 122 127 L 124 124 L 120 126 Z" fill="#D09860" stroke="#8E5838" stroke-width="0.5"/>
    <circle cx="115" cy="129" r="1.3" fill="#F0A838"/>
    <circle cx="115" cy="129" r="0.7" fill="#24180E"/>
    <circle cx="121" cy="129" r="1.3" fill="#F0A838"/>
    <circle cx="121" cy="129" r="0.7" fill="#24180E"/>
    <ellipse cx="118" cy="131.4" rx="1.2" ry="0.9" fill="#4E3018"/>
  </g>

  <!-- 老穷奇（翼扶小翼兽，温和） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾（垂稳） -->
    <path d="M 158 128 Q 170 124 176 118" stroke="url(#fur)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- 后腿 -->
    <path d="M 148 132 L 144 144 M 160 132 L 164 144" stroke="#B88050" stroke-width="4" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M 132 116 Q 128 128 138 134 Q 154 142 166 134 Q 172 128 168 116 Q 154 109 132 116 Z" fill="url(#fur)" stroke="#8E5838" stroke-width="1"/>
    <!-- 虎纹 -->
    <path d="M 134 122 Q 144 125 152 122 M 132 130 Q 144 133 158 130" stroke="#4E3018" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- 前腿 -->
    <path d="M 164 120 C 170 126 174 130 176 136" fill="none" stroke="url(#fur)" stroke-width="4.8" stroke-linecap="round"/>
    <circle cx="177" cy="138" r="3.2" fill="#B88050"/>
  </g>

  <!-- 翼（垂，扶小翼兽） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 136 100;-8 136 100;0 136 100" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 134 104 Q 120 92 114 78 Q 124 90 138 100 Z" fill="url(#wing)" stroke="#4E667E" stroke-width="0.9"/>
  </g>
  <!-- 扶小翼兽的翼尖（垂下轻触） -->
  <path d="M 132 104 Q 126 112 122 118" stroke="#96AEC6" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 132 104;4 132 104;0 132 104" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 老穷奇头（垂首看小翼兽，温和） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="148" cy="100" rx="12" ry="10" fill="url(#fur)" stroke="#8E5838" stroke-width="1"/>
    <path d="M 138 93 L 132 84 L 142 89 Z" fill="url(#fur)" stroke="#8E5838" stroke-width="0.7"/>
    <path d="M 158 93 L 164 84 L 154 89 Z" fill="url(#fur)" stroke="#8E5838" stroke-width="0.7"/>
    <!-- 獠牙（含慈，微收） -->
    <path d="M 150 106 L 152 109 L 151 106 Z" fill="#F0F0EE" opacity="0.8"/>
    <!-- 眼（温和） -->
    <path d="M 141 99 Q 143 98 145 99 M 153 99 Q 155 98 157 99" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="143" cy="100" r="2.8" fill="#F0A838"/>
    <circle cx="143" cy="100" r="1.4" fill="#24180E"/>
    <circle cx="143.6" cy="99.4" r="0.6" fill="#FFF"/>
    <circle cx="155" cy="100" r="2.8" fill="#F0A838"/>
    <circle cx="155" cy="100" r="1.4" fill="#24180E"/>
    <circle cx="155.6" cy="99.4" r="0.6" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="149" cy="104" rx="2.2" ry="1.6" fill="#4E3018"/>
    <!-- 温和 -->
    <path d="M 145 108 Q 149 109.4 153 108" fill="none" stroke="#8E5838" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
