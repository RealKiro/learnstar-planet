<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="鲲鹏·五阶·垂天巨鹏·翼若垂云背负青天幼鲲仰望">
  <defs>
    <!-- 背景：海天辽阔 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C8E4"/>
      <stop offset="52%" stop-color="#88AEC8"/>
      <stop offset="100%" stop-color="#6A8EAC"/>
    </linearGradient>
    <!-- 垂云光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="54%">
      <stop offset="0%" stop-color="#FFF0C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰羽 -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9EA6B2"/>
      <stop offset="100%" stop-color="#7E8694"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 垂云余晖 -->
  <circle cx="100" cy="96" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云（翼下） -->
  <g fill="#EAF0F8" opacity="0.9">
    <path d="M 0 148 Q 30 138 60 146 Q 90 152 120 144 Q 150 136 180 144 L 200 140 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.9">
    <path d="M 16 154 Q 44 146 72 154 Q 100 160 128 152 Q 156 144 188 152 L 200 150 L 200 200 L 0 200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 海中幼鲲（下，仰望） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="84" cy="154" rx="16" ry="8" fill="#4A5668" stroke="#323A48" stroke-width="0.8"/>
    <path d="M 66 150 Q 60 146 58 140" stroke="#4A5668" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="152" r="2" fill="#C8D8E8"/>
    <circle cx="72" cy="151.2" r="1" fill="#16223A"/>
    <!-- 仰望的视线 -->
    <g stroke="#C8E0F0" stroke-width="1" opacity="0.4" stroke-linecap="round" fill="none">
      <path d="M 76 148 Q 78 140 82 132">
        <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 巨鹏（翼若垂云，背负青天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾羽 -->
    <path d="M 136 108 Q 150 114 158 122" stroke="#6E7682" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <!-- 身体（鹏，大） -->
    <ellipse cx="106" cy="88" rx="24" ry="13" fill="url(#feather)" stroke="#5E6672" stroke-width="1"/>
    <ellipse cx="106" cy="95" rx="20" ry="8" fill="#AAB2BE" opacity="0.7"/>
    <!-- 翼（垂云，大） -->
    <path d="M 92 82 Q 60 48 28 34 Q 52 54 80 68 Q 88 74 92 82 Z" fill="url(#feather)" stroke="#5E6672" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 92 82;-10 92 82;0 92 82" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 82 Q 152 48 184 34 Q 160 54 132 68 Q 124 74 120 82 Z" fill="url(#feather)" stroke="#5E6672" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" values="0 120 82;10 120 82;0 120 82" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 翼尖羽（如云） -->
    <path d="M 28 34 L 20 28 M 34 36 L 26 30 M 184 34 L 192 28 M 178 36 L 186 30" stroke="#8E96A2" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 98 96 L 94 106 M 114 96 L 118 106" stroke="#6E7682" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 头（温和回望） -->
  <g>
    <ellipse cx="84" cy="80" rx="9.5" ry="8.5" fill="url(#feather)" stroke="#5E6672" stroke-width="0.9"/>
    <path d="M 76 80 L 62 75 L 76 85 Z" fill="#6E7682"/>
    <circle cx="82" cy="78" r="2.2" fill="#24180E"/>
    <circle cx="82.5" cy="77.6" r="0.7" fill="#FFF"/>
    <path d="M 86 71 Q 88 67 92 65" stroke="#8E96A2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 云光星尘 -->
  <g fill="#FFF0C8">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
