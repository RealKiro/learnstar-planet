<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精卫·二阶·溺海之痛·浪涛中白喙赤足衔枝恨望大海">
  <defs>
    <!-- 背景：东海浪涛 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E96AE"/>
      <stop offset="52%" stop-color="#5E7E9E"/>
      <stop offset="100%" stop-color="#4A6E8E"/>
    </linearGradient>
    <!-- 恨海之光 -->
    <radialGradient id="glow" cx="46%" cy="34%" r="44%">
      <stop offset="0%" stop-color="#E8ECF2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8ECF2" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽 -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F0F2"/>
      <stop offset="100%" stop-color="#D8D8E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="72" r="62" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.35;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 风暴云 -->
  <g fill="#5E6E7E" opacity="0.8">
    <path d="M 0 36 Q 30 28 60 36 Q 90 28 120 36 Q 150 30 180 38 L 200 34 L 200 52 L 0 52 Z"/>
  </g>
  <g stroke="#C8D4DE" stroke-width="1.2" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M 30 44 Q 24 36 28 28 M 150 40 Q 156 32 152 24">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 浪涛（滔天） -->
  <g fill="#4A6E8E" opacity="0.9">
    <path d="M 0 120 Q 40 108 80 118 Q 120 126 160 116 L 200 120 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#5E7E9E" opacity="0.8">
    <path d="M 0 136 Q 40 128 80 136 Q 120 144 160 134 L 200 138 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 浪花 -->
  <g fill="#C8E0F0" opacity="0.6">
    <circle cx="60" cy="114" r="1.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="112" r="1.3"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- 浪线 -->
  <path d="M 20 122 Q 50 118 80 122 M 120 130 Q 150 126 180 130" stroke="#A8C8E0" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 精卫鸟（白喙赤足，衔枝，恨望大海） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 赤足 -->
    <path d="M 84 116 L 82 124 M 90 116 L 92 124" stroke="#D85050" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 身体（白羽） -->
    <ellipse cx="87" cy="108" rx="12" ry="8" fill="url(#feather)" stroke="#B8B8C4" stroke-width="0.8"/>
    <!-- 翅（半张） -->
    <path d="M 94 106 Q 106 98 112 90" stroke="#D8D8E0" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 尾羽 -->
    <path d="M 98 112 Q 106 114 110 112" stroke="#D8D8E0" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 头（黑首，白喙，衔枝，恨望） -->
  <g>
    <ellipse cx="78" cy="104" rx="6.5" ry="6" fill="#2E2E3A" stroke="#1E1E2A" stroke-width="0.6"/>
    <!-- 白喙（衔枝） -->
    <path d="M 72 105 L 64 106 L 72 107 Z" fill="#F0F0F2"/>
    <!-- 衔着的枝 -->
    <path d="M 60 106 L 70 107 L 78 109" stroke="#8E6A4E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M 60 106 L 56 103 M 60 106 L 56 109" stroke="#6EAE5E" stroke-width="1" stroke-linecap="round"/>
    <!-- 眼（恨望大海） -->
    <circle cx="76" cy="103" r="1.6" fill="#24180E"/>
    <circle cx="76.4" cy="102.7" r="0.5" fill="#FFF"/>
    <!-- 恨意的眉 -->
    <path d="M 74 101 Q 76 100 78 101" stroke="#1E1E2A" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 恨望的视线（向下，看海） -->
  <g stroke="#E8ECF2" stroke-width="1.2" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 80 110 Q 82 116 80 122">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 浪尘 -->
  <g fill="#C8E0F0">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
