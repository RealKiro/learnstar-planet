<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="饕餮·四阶·护食初成·盗兽夜袭守仓口一口一叼护粮全">
  <defs>
    <!-- 背景：村仓夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5668"/>
      <stop offset="52%" stop-color="#3A4450"/>
      <stop offset="100%" stop-color="#2E3640"/>
    </linearGradient>
    <!-- 仓灯暖光 -->
    <radialGradient id="glow" cx="56%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F4D088" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F4D088" stop-opacity="0"/>
    </radialGradient>
    <!-- 饕餮毛（如铁） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E827E"/>
      <stop offset="100%" stop-color="#465E5C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="112" cy="96" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星夜 -->
  <g fill="#E8EEF4">
    <circle cx="40" cy="34" r="1.2">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="26" r="1">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="18" r="1.3">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 村仓（右） -->
  <g>
    <!-- 仓身 -->
    <path d="M 136 108 L 136 150 L 186 150 L 186 108 Z" fill="#B8B0A0"/>
    <!-- 木纹 -->
    <g stroke="#9E9686" stroke-width="0.8" opacity="0.6">
      <path d="M 136 118 L 186 118 M 136 130 L 186 130 M 136 142 L 186 142"/>
    </g>
    <!-- 屋顶 -->
    <path d="M 130 108 L 161 92 L 192 108 Z" fill="#8E8474"/>
    <!-- 仓门（紧闭，守住了） -->
    <path d="M 156 128 L 156 150 L 172 150 L 172 128 Z" fill="#6E6658"/>
    <circle cx="164" cy="140" r="1.2" fill="#D8C060"/>
    <!-- 粮满（透过门缝微光） -->
    <path d="M 158 130 L 158 150" stroke="#E8C860" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- 被叼出的盗兽（右前，丢出村外） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="166" cy="134" rx="6" ry="4.4" fill="#4E4A40" stroke="#3A362E" stroke-width="0.7"/>
    <circle cx="166" cy="127" r="4" fill="#4E4A40" stroke="#3A362E" stroke-width="0.6"/>
    <circle cx="163.8" cy="126" r="1.2" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 饕餮（守仓口，护粮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 羊身（如铁） -->
    <ellipse cx="116" cy="132" rx="17" ry="11.5" fill="url(#fur)" stroke="#3A5250" stroke-width="1"/>
    <!-- 腿（立稳） -->
    <path d="M 106 140 L 104 148 M 128 140 L 130 148" stroke="#3A5250" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 133 136 Q 142 132 146 126" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 133 136;5 133 136;0 133 136" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 前蹄（叼走盗兽后的护姿） -->
    <path d="M 100 128 L 92 122" stroke="url(#fur)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 92 120 L 86 116 L 90 124 Z" fill="url(#fur)" stroke="#3A5250" stroke-width="0.7"/>
  </g>

  <!-- 饕餮头（大嘴威仪，护粮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="112" rx="13.5" ry="12" fill="url(#fur)" stroke="#3A5250" stroke-width="1"/>
    <!-- 羊耳（挺立） -->
    <path d="M 105 104 L 98 98 L 103 108 Q 106 106 105 104 Z" fill="#5E7E7A"/>
    <path d="M 127 104 L 134 98 L 129 108 Q 126 106 127 104 Z" fill="#5E7E7A"/>
    <!-- 双目（含威） -->
    <path d="M 107 108 Q 109 106.6 111 108 M 122 108 Q 124 106.6 126 108" stroke="#24180E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <circle cx="109" cy="109" r="2.9" fill="#24180E"/>
    <circle cx="109.6" cy="108.4" r="0.9" fill="#FFF"/>
    <circle cx="124" cy="109" r="2.9" fill="#24180E"/>
    <circle cx="124.6" cy="108.4" r="0.9" fill="#FFF"/>
    <!-- 大嘴（威仪，护守） -->
    <path d="M 106 117 Q 116 120 126 117" fill="none" stroke="#3E4E4A" stroke-width="1.7" stroke-linecap="round"/>
    <!-- 护粮的威严（低吼） -->
    <g stroke="#E8F0E0" stroke-width="1.2" stroke-linecap="round" opacity="0.55" fill="none">
      <path d="M 128 104 Q 136 100 142 96">
        <animate attributeName="opacity" values="0.55;0.2;0.55" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 灯下微光 -->
    <circle cx="116" cy="100" r="3" fill="#F4D088" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 夜光星尘 -->
  <g fill="#F4D088">
    <circle cx="48" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
