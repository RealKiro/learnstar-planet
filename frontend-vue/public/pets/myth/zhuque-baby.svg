<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱雀·二阶·南荒野火·飞护幼鸟滚灭火苗赤羽燎焦">
  <defs>
    <!-- 背景：野火焦林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E89858"/>
      <stop offset="52%" stop-color="#C88048"/>
      <stop offset="100%" stop-color="#6E5640"/>
    </linearGradient>
    <!-- 火光 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="54%">
      <stop offset="0%" stop-color="#F8C878" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽（燎焦） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D85844"/>
      <stop offset="100%" stop-color="#B83A2C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 焦树 -->
  <g stroke="#4E3E30" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 40 140 Q 42 110 36 88"/>
    <path d="M 38 120 L 24 110 M 38 106 L 52 96 M 40 92 L 28 82"/>
    <path d="M 168 146 Q 166 116 172 94"/>
    <path d="M 170 124 L 184 116 M 170 112 L 156 102 M 172 98 L 184 90"/>
  </g>
  <!-- 枯枝火苗 -->
  <g fill="#F0A030">
    <path d="M 24 110 Q 20 106 22 100 Q 26 106 24 110 Z">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 184 116 Q 188 112 186 106 Q 182 112 184 116 Z">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 焦土 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#4A3C30" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#6E5840" stroke-width="1.4" opacity="0.5"/>

  <!-- 被护下的幼鸟（左，翅膀下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="84" cy="142" rx="5.4" ry="4.2" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.6"/>
    <circle cx="84" cy="136" r="3.4" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.5"/>
    <path d="M 84 135 L 83 132 M 86 135 L 87 132" stroke="#E8D8C0" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="82.4" cy="135.4" r="0.9" fill="#24180E"/>
    <circle cx="85.6" cy="135.4" r="0.9" fill="#24180E"/>
    <path d="M 84 137.6 L 83.4 139 L 84.6 139 Z" fill="#E8B838"/>
  </g>

  <!-- 朱雀（滚灭火苗，翅护幼鸟，羽燎焦） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 展翅（护） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 108 112;-8 108 112;0 108 112" dur="1.8s" repeatCount="indefinite"/>
      <!-- 左翅（遮幼鸟） -->
      <path d="M 96 114 L 76 104 L 70 92 L 88 104 Z" fill="url(#feather)" stroke="#9E3224" stroke-width="0.8"/>
      <!-- 右翅（滚火燎焦） -->
      <path d="M 120 114 L 140 106 L 148 94 L 130 106 Z" fill="url(#feather)" stroke="#9E3224" stroke-width="0.8"/>
      <!-- 燎焦边缘 -->
      <path d="M 70 92 L 72 94 M 148 94 L 146 96" stroke="#3A3028" stroke-width="1" stroke-linecap="round"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="108" cy="122" rx="10" ry="8.5" fill="url(#feather)" stroke="#9E3224" stroke-width="0.8"/>
    <!-- 尾羽（燎焦颤抖） -->
    <path d="M 114 128 Q 124 132 128 140" stroke="url(#feather)" stroke-width="2.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 114 128;5 114 128;0 114 128" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 128 140 L 130 143" stroke="#3A3028" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 朱雀头（含惧却护雏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="108" cy="104" rx="8" ry="7.2" fill="url(#feather)" stroke="#9E3224" stroke-width="0.8"/>
    <!-- 冠羽（焦） -->
    <path d="M 104 98 Q 103 92 106 89" stroke="#9E4A3C" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 眼（含惧却亮） -->
    <circle cx="104.5" cy="103" r="2.2" fill="#24180E"/>
    <circle cx="105" cy="102.5" r="0.7" fill="#FFF"/>
    <circle cx="112.5" cy="103" r="2.2" fill="#24180E"/>
    <circle cx="113" cy="102.5" r="0.7" fill="#FFF"/>
    <!-- 喙 -->
    <path d="M 108 106 L 106 109.4 L 110 108.4 Z" fill="#E8B838"/>
    <!-- 火影（被燎） -->
    <circle cx="108" cy="112" r="4" fill="#F0A030" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火灰星尘 -->
  <g fill="#F8C878">
    <circle cx="38" cy="98">
      <animate attributeName="cy" values="98;88;98" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
