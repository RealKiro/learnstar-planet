<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="应龙·一阶·云海龙卵·探头舔翼呼雨成雾">
  <defs>
    <!-- 背景：云海天青 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8EC"/>
      <stop offset="52%" stop-color="#9CC0DC"/>
      <stop offset="100%" stop-color="#86ACCC"/>
    </linearGradient>
    <!-- 云光 -->
    <radialGradient id="glow" cx="46%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#F4FAFE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4FAFE" stop-opacity="0"/>
    </radialGradient>
    <!-- 青白鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8D0E8"/>
      <stop offset="100%" stop-color="#8AB8D8"/>
    </linearGradient>
    <!-- 翼膜 -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4ECF8"/>
      <stop offset="100%" stop-color="#B4D8EC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海（下） -->
  <g fill="#EAF0F8" opacity="0.95">
    <path d="M 0 120 Q 30 110 60 118 Q 90 126 120 118 Q 150 110 180 118 L 200 114 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#F6FAFE" opacity="0.9">
    <path d="M 20 126 Q 50 118 80 126 Q 108 132 138 124 Q 168 116 200 124 L 200 200 L 0 200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;0 0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 龙卵（云上） -->
  <g>
    <ellipse cx="96" cy="108" rx="20" ry="24" fill="#E8E8EE" stroke="#C4C8D4" stroke-width="1.2"/>
    <!-- 裂口 -->
    <path d="M 96 84 L 90 96 L 96 106 L 103 94 Z" fill="#F6F6FA"/>
    <path d="M 96 84 L 103 94 M 96 106 L 90 96" stroke="#C4C8D4" stroke-width="0.8"/>
    <!-- 卵光 -->
    <ellipse cx="88" cy="100" rx="4" ry="6" fill="#F4FAFE" opacity="0.6"/>
  </g>

  <!-- 应龙小龙（探头，翼芽湿润，呼雾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 蛇身（盘卵边） -->
    <path d="M 96 96 C 84 92 80 84 84 74 C 88 66 100 64 110 70 Q 118 76 116 86 Q 114 92 108 94" fill="none" stroke="url(#scale)" stroke-width="7" stroke-linecap="round"/>
    <!-- 翼芽（湿润，两片） -->
    <path d="M 86 80 Q 74 72 68 60 Q 78 66 88 72 Z" fill="url(#wing)" stroke="#8AB8D8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 86 80;-8 86 80;0 86 80" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 78 Q 120 70 126 58 Q 116 64 106 70 Z" fill="url(#wing)" stroke="#8AB8D8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 108 78;8 108 78;0 108 78" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 龙角（初露） -->
    <path d="M 98 66 L 94 58 M 102 66 L 106 58" stroke="#D8C878" stroke-width="2" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="100" cy="70" rx="9" ry="8" fill="url(#scale)" stroke="#6E9EC0" stroke-width="0.8"/>
    <!-- 圆目（好奇） -->
    <circle cx="95" cy="68" r="2.4" fill="#24180E"/>
    <circle cx="95.6" cy="67.4" r="0.8" fill="#FFF"/>
    <circle cx="106" cy="68" r="2.4" fill="#24180E"/>
    <circle cx="106.6" cy="67.4" r="0.8" fill="#FFF"/>
    <!-- 吻须 -->
    <path d="M 109 71 Q 116 72 120 70" stroke="#8AB8D8" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 呼雾（笨扑吐雾） -->
    <g stroke="#F4FAFE" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 111 73 Q 118 76 126 74">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
      <circle cx="130" cy="73" r="2" fill="#F4FAFE" opacity="0.4">
        <animate attributeName="r" values="1;3;1" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 云光星尘 -->
  <g fill="#F4FAFE">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
