<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青龙·三阶·布春苦修·云下布雨雨含暖息化冻土春苗抬头">
  <defs>
    <!-- 背景：东方云下 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8EC"/>
      <stop offset="52%" stop-color="#9CC0D8"/>
      <stop offset="100%" stop-color="#8AA898"/>
    </linearGradient>
    <!-- 春雨光 -->
    <radialGradient id="glow" cx="42%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#F0FAF4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0FAF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC8B8"/>
      <stop offset="100%" stop-color="#5EB0A0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="50" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.6;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云（上） -->
  <g fill="#EAF4F2" opacity="0.95">
    <path d="M 0 74 Q 30 64 60 72 Q 90 80 120 72 Q 150 64 180 72 L 200 68 L 200 86 L 0 86 Z"/>
  </g>
  <g fill="#F6FCF8" opacity="0.9">
    <path d="M 16 80 Q 44 72 72 80 Q 100 86 128 78 Q 156 70 188 78 L 200 76 L 200 90 L 0 90 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 冻土（下，开始化） -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#7E9278" opacity="0.9"/>
  <path d="M 0 146 L 200 146" stroke="#9EB296" stroke-width="1.2" opacity="0.6"/>
  <!-- 化冻处（湿润） -->
  <ellipse cx="100" cy="152" rx="46" ry="7" fill="#5E8E6E" opacity="0.8"/>

  <!-- 春苗（抬头） -->
  <g stroke="#7EB86A" stroke-width="1.8" stroke-linecap="round" opacity="0.95">
    <path d="M 72 146 Q 70 138 68 130 Q 72 134 74 130">
      <animateTransform attributeName="transform" type="rotate" values="0 72 146;4 72 146;0 72 146" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 128 146 Q 128 138 126 130 Q 130 134 132 130">
      <animateTransform attributeName="transform" type="rotate" values="0 128 146;-4 128 146;0 128 146" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 雨（含暖息） -->
  <g stroke="#C8E8E0" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
    <path d="M 60 92 L 58 108 M 80 90 L 78 106 M 100 92 L 98 110 M 120 90 L 118 108 M 140 92 L 138 106">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青鳞幼龙（翼展收云化雨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蛇身 -->
    <path d="M 70 118 C 82 110 96 106 110 110 Q 122 114 130 120" fill="none" stroke="url(#scale)" stroke-width="6" stroke-linecap="round"/>
    <!-- 翼鳍 -->
    <path d="M 84 110 Q 70 94 62 76 Q 74 86 88 96 Z" fill="#9ED8C8" stroke="#5EB0A0" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 84 110;-10 84 110;0 84 110" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 106 108 Q 120 92 128 74 Q 116 84 102 94 Z" fill="#9ED8C8" stroke="#5EB0A0" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 106 108;10 106 108;0 106 108" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 龙角 -->
    <path d="M 70 110 L 66 102 M 74 110 L 78 102" stroke="#E0D088" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="72" cy="114" rx="8.5" ry="7.5" fill="url(#scale)" stroke="#4A9E8E" stroke-width="0.8"/>
    <circle cx="67" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="67.6" cy="111.4" r="0.8" fill="#FFF"/>
    <circle cx="78" cy="112" r="2.4" fill="#24180E"/>
    <circle cx="78.6" cy="111.4" r="0.8" fill="#FFF"/>
    <path d="M 80 115 Q 86 118 90 116" stroke="#5EB0A0" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 春雨星尘 -->
  <g fill="#F0FAF4">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
