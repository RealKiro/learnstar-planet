<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="穷奇·二阶·凶名之累·夜蜷荒岭舔伤望村落灯火">
  <defs>
    <!-- 背景：荒岭夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4E68"/>
      <stop offset="52%" stop-color="#2E4058"/>
      <stop offset="100%" stop-color="#263650"/>
    </linearGradient>
    <!-- 冷月 -->
    <radialGradient id="glow" cx="70%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#DCE8F4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DCE8F4" stop-opacity="0"/>
    </radialGradient>
    <!-- 虎纹毛皮（沾尘） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B07850"/>
      <stop offset="100%" stop-color="#8E5838"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冷月 -->
  <circle cx="140" cy="44" r="12" fill="#DCE8F4"/>
  <circle cx="136" cy="41" r="2.4" fill="#C4D0E4" opacity="0.7"/>
  <circle cx="140" cy="34" r="40" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山夜影 -->
  <g fill="#2A3A52" opacity="0.9">
    <path d="M 0 110 L 36 70 L 72 110 Z M 100 110 L 142 72 L 180 110 Z"/>
  </g>

  <!-- 村落灯火（远处，没有它的位置） -->
  <g opacity="0.8">
    <path d="M 150 116 Q 164 110 178 114 L 178 124 L 150 124 Z" fill="#3A4A62"/>
    <circle cx="158" cy="116" r="1.6" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="115" r="1.4" fill="#FFE8A0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 荒岭山石 -->
  <path d="M 0 134 Q 24 126 56 132 Q 72 136 80 134 L 84 200 L 0 200 Z" fill="#3A4658" stroke="#4A5668" stroke-width="1"/>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#1E2C44" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#4A5E78" stroke-width="1.2" opacity="0.5"/>

  <!-- 穷奇幼兽（蜷着舔伤，翼垂） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 尾（垂） -->
    <path d="M 52 136 Q 42 138 38 144" stroke="url(#fur)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- 身体（蜷） -->
    <ellipse cx="44" cy="132" rx="13" ry="9" fill="url(#fur)" stroke="#6E4228" stroke-width="0.8"/>
    <!-- 虎纹 -->
    <path d="M 36 128 Q 42 130 48 128" stroke="#3E2614" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
    <!-- 腿 -->
    <path d="M 36 138 L 34 144 M 52 138 L 54 144" stroke="#6E4228" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 翼（低垂） -->
  <path d="M 38 124 Q 28 118 24 110" stroke="#667E96" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 50 124 Q 60 118 64 110" stroke="#667E96" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（舔伤，含悲） -->
  <g>
    <ellipse cx="44" cy="114" rx="10" ry="9" fill="url(#fur)" stroke="#6E4228" stroke-width="0.8"/>
    <path d="M 36 108 L 32 101 L 39 105 Z" fill="url(#fur)" stroke="#6E4228" stroke-width="0.6"/>
    <path d="M 52 108 L 56 101 L 49 105 Z" fill="url(#fur)" stroke="#6E4228" stroke-width="0.6"/>
    <!-- 伤（皮被蹭破） -->
    <path d="M 38 112 Q 40 111 40 109" stroke="#B05848" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 舔伤的舌 -->
    <path d="M 40 116 Q 38 114 39 112" stroke="#D89080" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 眼（含悲，望灯火） -->
    <circle cx="39" cy="113" r="2.6" fill="#D8A048"/>
    <circle cx="39" cy="113" r="1.4" fill="#24180E"/>
    <circle cx="39.5" cy="112.5" r="0.5" fill="#FFF"/>
    <circle cx="50" cy="113" r="2.6" fill="#D8A048"/>
    <circle cx="50" cy="113" r="1.4" fill="#24180E"/>
    <!-- 獠牙（隐去） -->
    <path d="M 46 117 L 47 119 L 46.5 117 Z" fill="#E8E8E6" opacity="0.7"/>
    <!-- 望灯火的方向 -->
    <path d="M 52 110 Q 56 106 60 102" stroke="#D8A048" stroke-width="1" opacity="0.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 夜风 -->
  <g stroke="#A8C0D8" stroke-width="1.2" opacity="0.3" stroke-linecap="round" fill="none">
    <path d="M 30 96 Q 44 92 58 96">
      <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 夜雪尘 -->
  <g fill="#DCE8F4">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
