<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="凤凰·六阶·涅槃传说·暮色看雏凤学步尾羽轻扶余晖如火">
  <defs>
    <!-- 背景：梧桐暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#E0AC74"/>
      <stop offset="100%" stop-color="#A8C088"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#FFD8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 五色羽（泛岁月光） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0B878"/>
      <stop offset="100%" stop-color="#D89058"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="104" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#C8A060" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 梧桐（右） -->
  <g stroke="#6E5640" stroke-width="3.4" stroke-linecap="round">
    <path d="M 158 200 L 156 152 Q 156 130 148 118 Q 144 112 138 108"/>
    <path d="M 154 140 Q 142 130 134 124"/>
  </g>
  <g fill="#6E9E6E" opacity="0.9">
    <path d="M 138 108 Q 132 102 128 96 Q 134 102 140 104 Z"/>
    <path d="M 146 112 Q 140 106 136 100 Q 142 106 148 108 Z"/>
    <path d="M 134 124 Q 128 118 124 112 Q 130 118 136 120 Z"/>
  </g>

  <!-- 百鸟（归栖） -->
  <g stroke="#8E7660" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 80 88 Q 84 84 88 88"/>
    <path d="M 96 76 Q 100 72 104 76"/>
  </g>

  <!-- 雏凤（左下，学步） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="140" rx="10" ry="8" fill="#E8A878" stroke="#B07848" stroke-width="0.8"/>
    <circle cx="60" cy="136" r="2" fill="#78B8A8" opacity="0.8"/>
    <circle cx="70" cy="138" r="2" fill="#A888C8" opacity="0.8"/>
    <path d="M 72 142 Q 80 142 84 138" stroke="#D89058" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 58 146 L 56 150 M 70 146 L 72 150" stroke="#B07848" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- 雏凤头（仰头看老凤凰） -->
  <g>
    <ellipse cx="64" cy="128" rx="7.5" ry="6.8" fill="#E8A878" stroke="#B07848" stroke-width="0.7"/>
    <path d="M 62 122 Q 61 118 62 115 M 65 122 Q 66 117 67 115" stroke="#F0C878" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="127" r="1.8" fill="#24180E"/>
    <circle cx="60.5" cy="126.6" r="0.6" fill="#FFF"/>
    <circle cx="68" cy="127" r="1.8" fill="#24180E"/>
    <circle cx="68.5" cy="126.6" r="0.6" fill="#FFF"/>
    <path d="M 58 130 L 54 129 L 58 131 Z" fill="#D89078"/>
  </g>

  <!-- 老凤凰（立梧桐巅，尾羽轻扶雏凤） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾羽（轻扶雏凤，一羽垂下） -->
    <g fill="none" stroke-width="2.6" stroke-linecap="round">
      <path d="M 132 124 Q 150 132 160 130" stroke="#E07878"/>
      <path d="M 130 128 Q 144 138 150 140" stroke="#F0A878"/>
      <path d="M 134 130 Q 150 144 154 150" stroke="#78B8A8"/>
    </g>
    <!-- 扶雏凤的尾羽（垂下轻触） -->
    <path d="M 130 130 Q 124 138 120 142" stroke="#A888C8" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 130 130;4 130 130;0 130 130" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 身体 -->
    <ellipse cx="124" cy="108" rx="15" ry="11" fill="url(#feather)" stroke="#B87848" stroke-width="0.9"/>
    <circle cx="118" cy="104" r="2.4" fill="#78B8A8" opacity="0.9"/>
    <circle cx="130" cy="106" r="2.4" fill="#A888C8" opacity="0.9"/>
    <!-- 腿 -->
    <path d="M 118 116 L 116 126 M 130 116 L 132 126" stroke="#B87848" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 老凤凰头（温和，看雏凤） -->
  <g>
    <ellipse cx="120" cy="92" rx="9" ry="8" fill="url(#feather)" stroke="#B87848" stroke-width="0.8"/>
    <path d="M 118 85 Q 116 80 118 76 M 121 85 Q 122 79 124 76" stroke="#F0C878" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 眼（温和） -->
    <path d="M 115 91 Q 117 89 119 91 M 124 91 Q 126 89 128 91" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="117" cy="92" r="2" fill="#24180E"/>
    <circle cx="117.5" cy="91.6" r="0.7" fill="#FFF"/>
    <circle cx="126" cy="92" r="2" fill="#24180E"/>
    <circle cx="126.5" cy="91.6" r="0.7" fill="#FFF"/>
    <path d="M 112 94 L 107 93 L 112 96 Z" fill="#D89078"/>
    <!-- 余晖如火（落满山林） -->
    <g stroke="#FFD8A0" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 108 84 Q 100 78 96 70">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 120 80 Q 116 74 118 66">
        <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
