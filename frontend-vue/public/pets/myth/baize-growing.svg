<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白泽·三阶·求智苦修·走遍山川问兽名夜宿听僧记鬃里">
  <defs>
    <!-- 背景：山水古刹晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8D8D0"/>
      <stop offset="52%" stop-color="#A8BCB4"/>
      <stop offset="100%" stop-color="#849E94"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F0F6F2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0F6F2" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛（亮） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE6E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#8E9E94" opacity="0.4">
    <path d="M 0 108 Q 50 100 110 106 Q 160 110 200 104 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 古刹（右） -->
  <g>
    <!-- 塔 -->
    <path d="M 156 96 L 156 128 L 172 128 L 172 96 Z" fill="#A89E92"/>
    <path d="M 152 96 L 164 84 L 176 96 Z" fill="#8E847A"/>
    <path d="M 156 112 L 172 112" stroke="#8E847A" stroke-width="1"/>
    <!-- 窗（暖灯） -->
    <path d="M 161 104 L 161 116 L 167 116 L 167 104 Z" fill="#F4D088"/>
  </g>

  <!-- 老僧（窗前讲善恶，侧影） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <circle cx="164" cy="108" r="3.6" fill="#6E6A62"/>
    <!-- 袈裟 -->
    <path d="M 160 112 L 160 120 L 168 120 L 168 112 Z" fill="#B06050"/>
  </g>

  <!-- 幼白泽（游历问学，听僧） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="96" cy="132" rx="14" ry="9.5" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 88 139 L 86 147 M 106 139 L 108 147" stroke="#C8C2B8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 110 136 Q 120 132 124 124" stroke="url(#fur)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 110 136;7 110 136;0 110 136" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 幼白泽头（认真听，双目清明） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="96" cy="114" rx="11" ry="10" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 耳（立，听） -->
    <path d="M 87 107 L 81 98 L 91 104 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 105 107 L 111 98 L 101 104 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <!-- 鬃毛（隐隐有字） -->
    <path d="M 90 105 Q 88 100 90 98 Q 92 100 92 104" fill="url(#fur)"/>
    <path d="M 100 105 Q 102 100 100 98 Q 98 100 98 104" fill="url(#fur)"/>
    <!-- 鬃毛间字痕 -->
    <path d="M 90 101 L 92 101" stroke="#8E9E94" stroke-width="0.6" opacity="0.6"/>
    <path d="M 98 102 L 100 102" stroke="#8E9E94" stroke-width="0.6" opacity="0.6"/>
    <!-- 双目（清明） -->
    <path d="M 87 112 Q 89 110.6 91 112 M 102 112 Q 104 110.6 106 112" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="89" cy="113" r="2.4" fill="#24180E"/>
    <circle cx="89.6" cy="112.4" r="0.8" fill="#FFF"/>
    <circle cx="104" cy="113" r="2.4" fill="#24180E"/>
    <circle cx="104.6" cy="112.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="96" cy="117" rx="1.7" ry="1.3" fill="#C8A0A0"/>
    <!-- 问学的嘴 -->
    <path d="M 92 120 Q 96 121.6 100 120" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 听到的善光 -->
    <circle cx="108" cy="108" r="2" fill="#F4D088" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F0F6F2">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
