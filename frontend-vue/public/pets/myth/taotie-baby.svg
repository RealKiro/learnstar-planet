<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="饕餮·二阶·贪食之祸·吞光囤粮缩山后听村民叹悔怕">
  <defs>
    <!-- 背景：风雪冬村 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CCD4D8"/>
      <stop offset="52%" stop-color="#AEB8BC"/>
      <stop offset="100%" stop-color="#8E9AA0"/>
    </linearGradient>
    <!-- 昏黄灯 -->
    <radialGradient id="glow" cx="30%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#F4E0A8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4E0A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 饕餮毛（沾雪） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9290"/>
      <stop offset="100%" stop-color="#526E6C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="56" cy="80" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 飘雪 -->
  <g fill="#F4F8FC" opacity="0.8">
    <circle cx="30" cy="40" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="30" r="1.2">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="50" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 村舍（右，被吞光的仓） -->
  <g>
    <!-- 屋 -->
    <path d="M 128 120 L 128 152 L 168 152 L 168 120 Z" fill="#B8B0A0"/>
    <!-- 屋顶 -->
    <path d="M 122 120 L 148 104 L 174 120 Z" fill="#8E8474"/>
    <!-- 雪覆屋顶 -->
    <path d="M 124 120 L 148 106 L 172 120 L 170 122 L 148 109 L 126 122 Z" fill="#E8EEF2"/>
    <!-- 粮仓（空） -->
    <path d="M 140 136 L 140 152 L 160 152 L 160 136 Z" fill="#A09686"/>
    <path d="M 138 136 L 162 136" stroke="#8E8474" stroke-width="1.4"/>
    <!-- 门开（空的） -->
    <path d="M 142 140 L 142 152 L 150 152 L 150 140 Z" fill="#6E6658"/>
  </g>

  <!-- 村民叹（风雪中，灯光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="3.4s" repeatCount="indefinite"/>
    <path d="M 134 152 L 132 160 M 134 152 L 137 158" stroke="#6E6658" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="135" cy="147" r="3" fill="#8E8474"/>
    <!-- 叹气的呵白 -->
    <path d="M 137 145 Q 140 143 142 145 Q 145 143 147 145" stroke="#E8EEF2" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 提灯 -->
    <path d="M 126 150 L 128 152 M 128 152 L 124 156 L 132 156 L 128 152" fill="#D8C060"/>
    <circle cx="128" cy="154" r="3" fill="#F4E0A8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 幼饕餮（缩山后，大嘴紧闭，悔怕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 山石（遮） -->
    <path d="M 30 120 Q 40 104 56 108 Q 70 112 72 126 L 40 140 Z" fill="#8E8A7E"/>
    <path d="M 30 120 L 40 104 Q 52 108 60 120 L 72 126" fill="#A09A8E"/>
    <!-- 羊身（缩） -->
    <ellipse cx="52" cy="134" rx="14" ry="10" fill="url(#fur)" stroke="#4E726E" stroke-width="0.9"/>
    <!-- 腿（蜷） -->
    <path d="M 44 142 L 42 148 M 60 142 L 62 148" stroke="#4E726E" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（垂） -->
    <path d="M 66 138 Q 72 140 72 145" stroke="url(#fur)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 幼饕餮头（大嘴紧闭，悔怕） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="114" rx="12" ry="10.5" fill="url(#fur)" stroke="#4E726E" stroke-width="0.9"/>
    <!-- 羊耳（耷拉） -->
    <path d="M 42 108 L 36 110 L 38 116 Q 43 113 42 108 Z" fill="#5E7E7A"/>
    <path d="M 62 108 L 68 110 L 66 116 Q 61 113 62 108 Z" fill="#5E7E7A"/>
    <!-- 双目（悔） -->
    <path d="M 45 110 Q 47 108.6 49 110 M 56 110 Q 58 108.6 60 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="47" cy="111" r="2.6" fill="#24180E"/>
    <circle cx="47.5" cy="110.5" r="0.8" fill="#FFF"/>
    <circle cx="58" cy="111" r="2.6" fill="#24180E"/>
    <circle cx="58.5" cy="110.5" r="0.8" fill="#FFF"/>
    <!-- 大嘴（紧闭，悔） -->
    <path d="M 44 118 Q 52 120.6 60 118" fill="none" stroke="#3E4E4A" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 懊悔泪 -->
    <path d="M 47 113.6 Q 45 116 45.5 118" stroke="#A8CCE8" stroke-width="1.2" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 风雪星尘 -->
  <g fill="#F4F8FC">
    <circle cx="96" cy="90">
      <animate attributeName="cy" values="90;80;90" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
