<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="相柳·五阶·九头镇水·河谷盘踞九头分望山洪让道两岸安然">
  <defs>
    <!-- 背景：河谷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8CCC0"/>
      <stop offset="52%" stop-color="#98B0A4"/>
      <stop offset="100%" stop-color="#7E9A8E"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="44%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#F0F4F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0F4F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 镇水威光 -->
    <radialGradient id="halo" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#C8E8D8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8E8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蛇鳞青 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA898"/>
      <stop offset="100%" stop-color="#4A8E7E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="90" cy="46" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 镇水威光 -->
  <circle cx="100" cy="120" r="58" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#7E9A8E" opacity="0.7">
    <path d="M 0 124 L 40 74 L 80 124 Z M 100 124 L 144 78 L 186 124 Z"/>
  </g>

  <!-- 河谷（蛇让出的河道，洪水过） -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E8E82" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#8EAEA2" stroke-width="1.2" opacity="0.6"/>
  <!-- 让出的河道（水循道走） -->
  <path d="M 20 150 Q 60 146 100 150 Q 140 154 180 150" stroke="#A8C8BC" stroke-width="2.4" opacity="0.7" fill="none">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 水流 -->
  <g fill="#C8E8D8">
    <circle cx="60" cy="150" r="1.4"><animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="152" r="1.2"><animateTransform attributeName="transform" type="translate" values="0 0;12 0;0 0" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 两岸（安然，绿） -->
  <g stroke="#7EAE7E" stroke-width="1.8" stroke-linecap="round" opacity="0.8">
    <path d="M 24 146 Q 24 138 22 130 M 170 146 Q 170 138 168 130">
      <animateTransform attributeName="transform" type="rotate" values="0 24 146;3 24 146;0 24 146" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 相柳（大，盘踞河谷，九头分望） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 蛇身（盘踞，横贯） -->
    <path d="M 56 140 Q 78 134 100 138 Q 122 142 144 138" fill="none" stroke="url(#scale)" stroke-width="10" stroke-linecap="round"/>
    <!-- 鳞纹 -->
    <path d="M 70 138 L 72 146 M 100 140 L 101 148 M 130 138 L 132 146" stroke="#3E7E6E" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- 主头（威，望河道） -->
  <g>
    <ellipse cx="70" cy="126" rx="8" ry="7" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.8"/>
    <path d="M 66 124 Q 68 123 70 124 M 74 124 Q 76 123 78 124" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="68" cy="125" r="1.8" fill="#24180E"/>
    <circle cx="68.4" cy="124.7" r="0.6" fill="#FFF"/>
    <circle cx="76" cy="125" r="1.8" fill="#24180E"/>
    <circle cx="76.4" cy="124.7" r="0.6" fill="#FFF"/>
  </g>

  <!-- 次头（分望四方，8个） -->
  <g>
    <ellipse cx="58" cy="118" rx="5.4" ry="4.6" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="56" cy="117" r="1.3" fill="#24180E"/><circle cx="61" cy="117" r="1.3" fill="#24180E"/></ellipse>
    <ellipse cx="82" cy="118" rx="5.4" ry="4.6" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="80" cy="117" r="1.3" fill="#24180E"/><circle cx="85" cy="117" r="1.3" fill="#24180E"/></ellipse>
    <ellipse cx="66" cy="110" rx="5" ry="4.2" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="64" cy="109" r="1.2" fill="#24180E"/><circle cx="69" cy="109" r="1.2" fill="#24180E"/></ellipse>
    <ellipse cx="76" cy="110" rx="5" ry="4.2" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="74" cy="109" r="1.2" fill="#24180E"/><circle cx="79" cy="109" r="1.2" fill="#24180E"/></ellipse>
    <ellipse cx="96" cy="112" rx="5" ry="4.2" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="94" cy="111" r="1.2" fill="#24180E"/><circle cx="99" cy="111" r="1.2" fill="#24180E"/></ellipse>
    <ellipse cx="112" cy="116" rx="5" ry="4.4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="110" cy="115" r="1.2" fill="#24180E"/><circle cx="115" cy="115" r="1.2" fill="#24180E"/></ellipse>
    <ellipse cx="126" cy="122" rx="5" ry="4.4" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="124" cy="121" r="1.2" fill="#24180E"/><circle cx="129" cy="121" r="1.2" fill="#24180E"/></ellipse>
    <ellipse cx="138" cy="128" rx="4.8" ry="4.2" fill="url(#scale)" stroke="#3E7E6E" stroke-width="0.6"><circle cx="136" cy="127" r="1.1" fill="#24180E"/><circle cx="141" cy="127" r="1.1" fill="#24180E"/></ellipse>
  </g>

  <!-- 天光尘 -->
  <g fill="#F0F4F0">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
