<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="应龙·四阶·布雨初成·翼展压云甘霖倾盆幼苗回春">
  <defs>
    <!-- 背景：雨后晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8EC"/>
      <stop offset="52%" stop-color="#98C0D8"/>
      <stop offset="100%" stop-color="#7EA88C"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="44%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 青白鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8D0E8"/>
      <stop offset="100%" stop-color="#8AB8D8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="46" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 虹（雨后） -->
  <g fill="none" stroke-width="3" opacity="0.55">
    <path d="M 120 96 A 50 50 0 0 1 176 70" stroke="#F07878"/>
    <path d="M 122 104 A 42 42 0 0 1 172 78" stroke="#F0B878"/>
    <path d="M 124 110 A 34 34 0 0 1 168 86" stroke="#78C0A8"/>
  </g>

  <!-- 云（上，渐散） -->
  <g fill="#EAF0F8" opacity="0.9">
    <path d="M 0 78 Q 30 68 60 76 Q 90 84 120 76 Q 150 68 180 76 L 200 72 L 200 88 L 0 88 Z"/>
  </g>

  <!-- 旱地回春 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#7E9A68" opacity="0.85"/>
  <path d="M 0 146 L 200 146" stroke="#9EC088" stroke-width="1.4" opacity="0.6"/>
  <!-- 湿润泥土 -->
  <ellipse cx="100" cy="152" rx="46" ry="7" fill="#5E7E54" opacity="0.8"/>

  <!-- 幼苗（挺直回春） -->
  <g stroke="#5EAE5E" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <path d="M 66 146 Q 64 136 62 128">
      <animateTransform attributeName="transform" type="rotate" values="0 66 146;3 66 146;0 66 146" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 62 130 Q 58 128 56 124 M 62 130 Q 66 128 68 124" fill="none" stroke="#5EAE5E" stroke-width="1.4"/>
    <path d="M 134 146 Q 134 136 132 128">
      <animateTransform attributeName="transform" type="rotate" values="0 134 146;-3 134 146;0 134 146" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 130 Q 128 128 126 124 M 132 130 Q 136 128 138 124" fill="none" stroke="#5EAE5E" stroke-width="1.4"/>
  </g>

  <!-- 甘霖（倾盆） -->
  <g stroke="#C8E4F4" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
    <path d="M 50 90 L 48 112 M 70 88 L 68 112 M 92 90 L 90 114 M 114 88 L 112 112 M 136 90 L 134 112 M 156 88 L 154 110">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 应龙（翼展压云布雨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蛇身 -->
    <path d="M 68 116 C 82 108 98 104 112 108 C 122 111 130 116 136 122" fill="none" stroke="url(#scale)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- 翼（压云） -->
    <path d="M 84 106 Q 68 88 60 68 Q 72 80 88 92 Z" fill="#C8E4F4" stroke="#8AB8D8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 84 106;-12 84 106;0 84 106" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 106 Q 124 88 132 68 Q 120 80 104 92 Z" fill="#C8E4F4" stroke="#8AB8D8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 108 106;12 108 106;0 108 106" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 翼端雨 -->
    <g fill="#C8E4F4">
      <circle cx="60" cy="68" r="1.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;-3 8;0 0" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="132" cy="68" r="1.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;3 8;0 0" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 龙角 -->
    <path d="M 68 108 L 64 100 M 72 108 L 76 100" stroke="#D8C878" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 头（含笑） -->
    <ellipse cx="70" cy="112" rx="8.5" ry="7.5" fill="url(#scale)" stroke="#6E9EC0" stroke-width="0.8"/>
    <circle cx="65" cy="110" r="2.4" fill="#24180E"/>
    <circle cx="65.6" cy="109.4" r="0.8" fill="#FFF"/>
    <circle cx="76" cy="110" r="2.4" fill="#24180E"/>
    <circle cx="76.6" cy="109.4" r="0.8" fill="#FFF"/>
    <!-- 吻须 -->
    <path d="M 78 113 Q 84 116 88 114" stroke="#8AB8D8" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
