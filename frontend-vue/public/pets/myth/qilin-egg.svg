<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="麒麟·一阶·幼麟初生·溪边让开蚁虫角蹭花不落瓣">
  <defs>
    <!-- 背景：溪边山林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E8C0"/>
      <stop offset="52%" stop-color="#ACCC9C"/>
      <stop offset="100%" stop-color="#8AAE78"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="44%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 麟青 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC0B0"/>
      <stop offset="100%" stop-color="#5EA898"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="50" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 山林 -->
  <g stroke="#5E8E5E" stroke-width="2.6" stroke-linecap="round" opacity="0.55">
    <path d="M 12 44 Q 10 96 6 160 M 28 52 Q 24 100 18 160 M 176 42 Q 180 98 186 160"/>
  </g>
  <g fill="#6EA868" opacity="0.7">
    <path d="M 12 48 Q 6 42 4 34 Q 10 40 12 48 Z"/>
    <path d="M 176 46 Q 182 40 184 32 Q 178 38 176 46 Z"/>
  </g>
  <!-- 远山 -->
  <path d="M 0 126 Q 50 116 110 124 Q 160 128 200 120 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>
  <!-- 草地 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.8"/>
  <path d="M 0 146 L 200 146" stroke="#8EB87E" stroke-width="1.4" opacity="0.6"/>

  <!-- 溪水 -->
  <path d="M 0 150 Q 40 146 80 150 Q 120 154 160 150 L 200 152 L 200 200 L 0 200 Z" fill="#7EC0B8" opacity="0.6"/>
  <path d="M 20 156 Q 50 154 80 156" stroke="#A8E0D8" stroke-width="1" opacity="0.6" fill="none"/>

  <!-- 蚁虫（让开的对象） -->
  <g fill="#5E4E3A">
    <circle cx="130" cy="150" r="1"/>
    <circle cx="134" cy="149" r="1"/>
    <circle cx="138" cy="148" r="1">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 花丛（角蹭，不落瓣） -->
  <g fill="#E07878" opacity="0.9">
    <path d="M 138 138 Q 140 132 142 138 Z M 134 138 Q 136 131 138 138 Z M 142 138 Q 144 131 146 138 Z"/>
  </g>
  <g stroke="#5E8E5E" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <path d="M 138 138 L 138 146 M 138 138 L 136 144"/>
  </g>

  <!-- 幼麟（龙头鹿身，让开蚁虫，角蹭花） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 92 132 L 88 142 M 100 132 L 104 142" stroke="#5EA898" stroke-width="3" stroke-linecap="round"/>
    <!-- 身体 -->
    <path d="M 74 116 Q 70 128 80 134 Q 94 140 106 134 Q 112 128 108 116 Q 94 110 74 116 Z" fill="url(#scale)" stroke="#4A8E7E" stroke-width="1"/>
    <!-- 麟甲纹 -->
    <path d="M 80 122 Q 88 119 96 122 M 78 130 Q 90 134 102 130" stroke="#4A8E7E" stroke-width="1" opacity="0.5"/>
    <!-- 尾 -->
    <path d="M 108 128 Q 116 126 120 122" stroke="#5EA898" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 蹄（抬起让蚁） -->
    <path d="M 92 132 L 90 140 M 92 132 L 94 138" stroke="#4A8E7E" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 头（龙头，角含珠，垂向花丛） -->
  <g>
    <ellipse cx="78" cy="106" rx="11" ry="9.5" fill="url(#scale)" stroke="#4A8E7E" stroke-width="1"/>
    <!-- 鬃毛 -->
    <path d="M 72 98 Q 66 92 68 86 M 74 100 Q 70 94 72 88" stroke="#6EB8A8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 独角（含珠） -->
    <path d="M 82 98 Q 82 90 78 84" stroke="#F0E0C0" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="78" cy="83" r="2" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（温厚） -->
    <circle cx="72" cy="105" r="2.4" fill="#24180E"/>
    <circle cx="72.6" cy="104.4" r="0.8" fill="#FFF"/>
    <circle cx="84" cy="105" r="2.4" fill="#24180E"/>
    <circle cx="84.6" cy="104.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 70 109 Q 76 110.6 82 109" stroke="#4A8E7E" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 小嘴（温） -->
    <path d="M 74 112 Q 78 113.4 82 112" fill="none" stroke="#4A7E72" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 蹄下留生的微光 -->
    <circle cx="92" cy="136" r="4" fill="#FFF8DC" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.12;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
