<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="相柳·二阶·灾祸之累·毒水伤牲畜村民举锄驱逐九头低垂">
  <defs>
    <!-- 背景：溪边黄昏 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A89890"/>
      <stop offset="52%" stop-color="#8E8278"/>
      <stop offset="100%" stop-color="#6E665E"/>
    </linearGradient>
    <!-- 昏光 -->
    <radialGradient id="glow" cx="40%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#E8DCC8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8DCC8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蛇鳞青（黯淡） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E8E7E"/>
      <stop offset="100%" stop-color="#3E7E6E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="80" cy="56" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.35;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#6E665E" opacity="0.7">
    <path d="M 0 116 L 36 76 L 72 116 Z M 100 116 L 142 78 L 180 116 Z"/>
  </g>

  <!-- 溪边 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#7E766E" opacity="0.9"/>
  <!-- 毒水（泛灰绿） -->
  <path d="M 0 150 Q 40 148 80 150 Q 120 152 160 150 L 200 152 L 200 200 L 0 200 Z" fill="#6E8E7E" opacity="0.7"/>

  <!-- 牲畜（倒下，中毒） -->
  <g opacity="0.85">
    <ellipse cx="132" cy="142" rx="11" ry="6" fill="#8E8E86" stroke="#6E6E66" stroke-width="0.8"/>
    <circle cx="124" cy="137" r="4" fill="#9E9E96" stroke="#6E6E66" stroke-width="0.6"/>
    <path d="M 121 136 L 118 135 M 125 136 L 128 135" stroke="#AEAEA6" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="123" cy="136.4" r="1" fill="#24180E"/>
    <circle cx="127" cy="136.4" r="1" fill="#24180E"/>
    <!-- 倒下 -->
    <path d="M 126 142 L 124 148 M 138 142 L 140 148" stroke="#6E6E66" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 村民（举锄驱逐） -->
  <g opacity="0.9">
    <path d="M 162 122 L 160 138 L 164 138 L 166 122 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.8"/>
    <circle cx="164" cy="116" r="4" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.6"/>
    <!-- 举锄 -->
    <path d="M 160 124 L 150 120" stroke="#7E6E4E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 146 118 L 152 120 L 150 124 L 144 122 Z" fill="#8E7E5E"/>
    <!-- 怒 -->
    <path d="M 161 113 Q 164 112 167 113" stroke="#4E3E2E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 相柳（九头低垂，逃入深谷） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 蛇身（低伏逃） -->
    <path d="M 60 140 Q 40 136 30 130 Q 24 126 22 120" fill="none" stroke="url(#scale)" stroke-width="6" stroke-linecap="round"/>
    <!-- 主头（低垂，含愧） -->
    <ellipse cx="58" cy="130" rx="6.5" ry="5.6" fill="url(#scale)" stroke="#2E6E5E" stroke-width="0.7"/>
    <circle cx="55" cy="129" r="1.4" fill="#24180E"/>
    <circle cx="62" cy="129" r="1.4" fill="#24180E"/>
    <!-- 垂首（含愧） -->
    <path d="M 54 133 Q 58 134 62 133" fill="none" stroke="#2E6E5E" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- 次头（低垂） -->
  <g>
    <ellipse cx="50" cy="122" rx="4.4" ry="3.8" fill="url(#scale)" stroke="#2E6E5E" stroke-width="0.6"/>
    <circle cx="48" cy="121" r="1.1" fill="#24180E"/>
    <ellipse cx="66" cy="124" rx="4.4" ry="3.8" fill="url(#scale)" stroke="#2E6E5E" stroke-width="0.6"/>
    <circle cx="68" cy="123" r="1.1" fill="#24180E"/>
    <ellipse cx="56" cy="116" rx="4" ry="3.4" fill="url(#scale)" stroke="#2E6E5E" stroke-width="0.6"/>
    <circle cx="54" cy="115" r="1" fill="#24180E"/>
  </g>

  <!-- 昏光尘 -->
  <g fill="#E8DCC8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
