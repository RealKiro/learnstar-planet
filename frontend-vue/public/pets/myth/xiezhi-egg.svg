<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="獬豸·一阶·幼獬豸·溪边照水晃角小羊顶角抢草">
  <defs>
    <!-- 背景：溪边 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0E8C0"/>
      <stop offset="52%" stop-color="#ACCC9C"/>
      <stop offset="100%" stop-color="#8AAE78"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="44%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 羊雪白 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8F6"/>
      <stop offset="100%" stop-color="#E0E0DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="50" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 山林 -->
  <g stroke="#5E8E5E" stroke-width="2.6" stroke-linecap="round" opacity="0.55">
    <path d="M 12 44 Q 10 96 6 160 M 28 52 Q 24 100 18 160 M 176 42 Q 180 98 186 160"/>
  </g>
  <g fill="#6EA868" opacity="0.7">
    <path d="M 12 48 Q 6 42 4 34 Q 10 40 12 48 Z"/>
    <path d="M 176 46 Q 182 40 184 32 Q 178 38 176 46 Z"/>
  </g>
  <!-- 远山 -->
  <path d="M 0 126 Q 50 116 110 124 Q 160 128 200 120 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>
  <!-- 溪水 -->
  <path d="M 0 150 Q 40 146 80 150 Q 120 154 160 150 L 200 152 L 200 200 L 0 200 Z" fill="#7EC0B8" opacity="0.55"/>

  <!-- 小羊（右，顶角抢草） -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="140" cy="136" rx="8" ry="6" fill="#D8D0C8" stroke="#B0A8A0" stroke-width="0.7"/>
    <circle cx="135" cy="129" r="4.4" fill="#E8E0D8" stroke="#B0A8A0" stroke-width="0.6"/>
    <!-- 小角（顶向同伴） -->
    <path d="M 133 126 L 130 121 M 137 126 L 140 121" stroke="#B8B0A8" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="133" cy="128" r="1" fill="#24180E"/>
    <circle cx="138" cy="128" r="1" fill="#24180E"/>
    <path d="M 132 131 Q 135 132.4 138 131" stroke="#B0A8A0" stroke-width="0.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 抢的草 -->
  <g stroke="#6E9E5E" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <path d="M 128 132 Q 128 128 126 124 M 130 132 Q 130 127 130 123"/>
  </g>

  <!-- 幼獬豸（独角白羊，照水得意转圈） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="84" cy="128" rx="13" ry="9" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.8"/>
    <!-- 羊毛卷 -->
    <path d="M 76 124 Q 80 122 84 124 M 88 126 Q 92 124 96 126" stroke="#E0D8D0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- 腿（蹦） -->
    <path d="M 78 134 L 76 144 M 92 134 L 94 144" stroke="#C0B8B0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 尾（甩） -->
    <path d="M 96 130 Q 102 128 106 124" stroke="#E0D8D0" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 96 130;12 96 130;0 96 130" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 头（独角含光，得意） -->
  <g>
    <ellipse cx="82" cy="114" rx="10" ry="9" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.8"/>
    <!-- 独角（神气） -->
    <path d="M 86 106 Q 88 98 92 94" stroke="#F0E0C0" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="93" cy="93" r="2" fill="#FFF0D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 耳 -->
    <path d="M 76 108 L 72 104" stroke="#E0D8D0" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 眼（得意） -->
    <path d="M 77 112 Q 79 111 81 112 M 86 112 Q 88 111 90 112" fill="none" stroke="#24180E" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="79" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="79.5" cy="112.5" r="0.7" fill="#FFF"/>
    <circle cx="88" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="88.5" cy="112.5" r="0.7" fill="#FFF"/>
    <!-- 得意小嘴 -->
    <path d="M 77 117 Q 81 118.6 85 117" fill="none" stroke="#A8A098" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
