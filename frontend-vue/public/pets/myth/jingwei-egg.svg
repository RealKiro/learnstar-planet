<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精卫·一阶·炎帝幼女·东海边拾贝追浪望大海">
  <defs>
    <!-- 背景：东海边 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8CCE0"/>
      <stop offset="52%" stop-color="#88B0CC"/>
      <stop offset="100%" stop-color="#6E9AB8"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#FFF0D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 素衣 -->
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8F4"/>
      <stop offset="100%" stop-color="#E0E0DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="50" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 海（远处，一望无际） -->
  <path d="M 0 110 Q 50 104 110 108 Q 160 110 200 106 L 200 200 L 0 200 Z" fill="#5E8EC8" opacity="0.85"/>
  <path d="M 0 110 Q 50 104 110 108 Q 160 110 200 106" stroke="#8EB8E0" stroke-width="1.2" opacity="0.6"/>
  <!-- 海浪 -->
  <path d="M 20 120 Q 50 118 80 120 M 120 130 Q 150 128 180 130" stroke="#A8D0E8" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 沙滩 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#D8C8A8" opacity="0.95"/>
  <path d="M 0 146 L 200 146" stroke="#E8D8B8" stroke-width="1.4" opacity="0.7"/>

  <!-- 贝壳（捡起） -->
  <g fill="#F0D8B8" stroke="#C8A878" stroke-width="0.6">
    <path d="M 96 138 Q 100 134 104 138 Q 100 142 96 138 Z"/>
  </g>
  <g fill="#E8C898" stroke="#B89868" stroke-width="0.5">
    <path d="M 120 144 Q 123 141 126 144 Q 123 147 120 144 Z"/>
  </g>

  <!-- 少女（素衣，拾贝追浪，望海） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 裙 -->
    <path d="M 76 128 Q 70 136 66 146 L 92 146 Q 88 136 82 128 Z" fill="url(#cloth)" stroke="#B8B8B4" stroke-width="0.8"/>
    <!-- 赤带 -->
    <path d="M 79 128 L 73 136 Q 72 138 74 138 L 80 130" fill="#E06048" opacity="0.9"/>
    <!-- 身 -->
    <path d="M 76 108 Q 72 118 78 128 Q 82 128 80 116 Q 80 110 76 108 Z" fill="url(#cloth)" stroke="#B8B8B4" stroke-width="0.8"/>
    <!-- 手臂（追浪/拾贝） -->
    <path d="M 78 112 L 88 118 L 94 122" stroke="#D8C8B8" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 腿 -->
    <path d="M 74 144 L 72 150 M 84 144 L 86 150" stroke="#D8C8B8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 头（笑靥，望海） -->
  <g>
    <ellipse cx="78" cy="98" rx="7" ry="7.5" fill="#F0E0D0" stroke="#C8A890" stroke-width="0.7"/>
    <!-- 双丫髻 -->
    <circle cx="74" cy="91" r="3.4" fill="#3A3A44"/>
    <circle cx="83" cy="91" r="3.4" fill="#3A3A44"/>
    <path d="M 74 87 Q 73 84 74 82 M 83 87 Q 84 84 83 82" stroke="#3A3A44" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 眼（清澈，望海） -->
    <path d="M 75 97 Q 77 96 79 97 M 80 97 Q 82 96 84 97" fill="none" stroke="#24180E" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="77" cy="98" r="1.8" fill="#24180E"/>
    <circle cx="77.4" cy="97.7" r="0.6" fill="#FFF"/>
    <circle cx="82" cy="98" r="1.8" fill="#24180E"/>
    <circle cx="82.4" cy="97.7" r="0.6" fill="#FFF"/>
    <!-- 笑靥 -->
    <path d="M 75 101 Q 78 103 81 101" fill="none" stroke="#B09078" stroke-width="0.7" stroke-linecap="round"/>
    <!-- 颊红晕 -->
    <circle cx="74" cy="100" r="1.4" fill="#F0A098" opacity="0.5"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF0D8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
