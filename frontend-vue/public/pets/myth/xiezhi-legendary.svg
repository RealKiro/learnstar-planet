<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="獬豸·五阶·执法神羊·以角辨曲直触邪佞众人拜服">
  <defs>
    <!-- 背景：公堂晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0B098"/>
      <stop offset="52%" stop-color="#A89A82"/>
      <stop offset="100%" stop-color="#8E8270"/>
    </linearGradient>
    <!-- 正光 -->
    <radialGradient id="glow" cx="46%" cy="36%" r="50%">
      <stop offset="0%" stop-color="#E8ECF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8ECF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 羊雪白（如银） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8F6"/>
      <stop offset="100%" stop-color="#E0E0DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="72" r="66" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 公堂柱 -->
  <g stroke="#7E5E3E" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M 24 60 L 24 160 M 176 60 L 176 160"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E6A4E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#9E8A6E" stroke-width="1.2" opacity="0.6"/>

  <!-- 众人（拜服） -->
  <g opacity="0.8">
    <path d="M 40 136 L 38 148 L 42 148 L 44 136 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="42" cy="130" r="3.6" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.5"/>
    <path d="M 44 134 L 52 130 M 52 130 L 54 132" stroke="#7E6E4E" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 56 138 L 54 150 L 58 150 L 60 138 Z" fill="#8E7E5E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="58" cy="132" r="3.6" fill="#AE9E7E" stroke="#6E5E3E" stroke-width="0.5"/>
    <path d="M 60 136 L 68 132 M 68 132 L 70 134" stroke="#8E7E5E" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 被触的邪佞（远，退） -->
  <g opacity="0.7">
    <path d="M 168 132 Q 174 126 180 132" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="124" r="3.4" fill="#6E6E6E" stroke="#5E5E5E" stroke-width="0.7"/>
    <path d="M 182 128 Q 186 132 188 136" stroke="#5E5E5E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 獬豸（执法神羊，角辨曲直） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="108" cy="128" rx="14" ry="9.5" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.9"/>
    <!-- 羊毛卷 -->
    <path d="M 100 124 Q 104 122 108 124 M 112 126 Q 116 124 120 126" stroke="#E0D8D0" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- 腿 -->
    <path d="M 100 134 L 98 146 M 118 134 L 120 146" stroke="#C0B8B0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 122 130 Q 128 128 132 124" stroke="#E0D8D0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 头（独角如圭，辨曲直） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="108" cy="112" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.9"/>
    <!-- 独角（如圭） -->
    <path d="M 112 104 Q 118 94 126 88" stroke="#F0E0C0" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 角尖正光 -->
    <circle cx="127" cy="87" r="2.8" fill="#FFE8A0" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 辨曲直的划线（角尖划出） -->
    <g stroke="#FFE8A0" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 128 92 Q 136 98 144 104">
        <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 眼（正肃） -->
    <path d="M 102 110 Q 104 109 106 110 M 112 110 Q 114 109 116 110" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="104" cy="111" r="2.2" fill="#24180E"/>
    <circle cx="104.5" cy="110.5" r="0.7" fill="#FFF"/>
    <circle cx="114" cy="111" r="2.2" fill="#24180E"/>
    <circle cx="114.5" cy="110.5" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="108" cy="116" rx="1.7" ry="1.3" fill="#A8A098"/>
    <!-- 抿唇（公正） -->
    <path d="M 104 119 Q 108 120.4 112 119" fill="none" stroke="#A8A098" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 正光尘 -->
  <g fill="#E8ECF8">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
