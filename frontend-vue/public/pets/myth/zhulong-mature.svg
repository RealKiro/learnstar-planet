<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="烛龙·四阶·淬炼·昼夜使者">
  <defs>
    <!-- 背景：玄黑，四周火光 -->
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A0A0A"/>
      <stop offset="70%" stop-color="#120606"/>
      <stop offset="100%" stop-color="#2B0E0E"/>
    </radialGradient>
    <radialGradient id="body" cx="42%" cy="36%" r="74%">
      <stop offset="0%" stop-color="#301515"/>
      <stop offset="60%" stop-color="#1A0A0A"/>
      <stop offset="100%" stop-color="#0D0505"/>
    </radialGradient>
    <radialGradient id="head" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3A1818"/>
      <stop offset="70%" stop-color="#1A0A0A"/>
      <stop offset="100%" stop-color="#0D0505"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B1A1A"/>
      <stop offset="55%" stop-color="#D43A2A"/>
      <stop offset="100%" stop-color="#FF6A4A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：底部火丛 -->
  <path d="M 22 188 Q 34 170 44 182 Q 54 164 66 178 Q 78 160 90 176 Q 100 158 112 174 Q 122 160 132 178 Q 144 166 156 182 Q 166 168 178 186 Z" fill="#8B1A1A" opacity="0.55"/>
  <path d="M 30 190 Q 40 176 50 186 Q 60 172 72 184 Q 84 168 96 182 Q 108 170 120 184 Q 132 172 144 186 Q 154 176 168 188 Z" fill="#D43A2A" opacity="0.4"/>

  <!-- 环境：雷电（破碎） -->
  <path d="M 34 42 L 50 58 L 40 62 L 56 80" fill="none" stroke="#FFE3D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <path d="M 172 92 L 158 104 L 168 108 L 152 126" fill="none" stroke="#FFE3D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- 角色：腾跃盘旋（爆发动态） -->
  <path d="M 100 90 C 132 78 156 104 142 132 C 132 154 102 160 74 150 C 50 140 44 116 62 98 C 76 84 96 78 100 90 Z" fill="none" stroke="url(#body)" stroke-width="15" stroke-linecap="round"/>
  <!-- 左侧回绕 -->
  <path d="M 100 92 C 68 82 48 106 62 134" fill="none" stroke="url(#body)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- 战损裂纹 -->
  <path d="M 116 118 L 106 128 L 112 138" fill="none" stroke="#C22A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 76 134 L 86 142 L 80 152" fill="none" stroke="#C22A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 132 110 L 124 102 L 130 96" fill="none" stroke="#C22A2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- 头（怒目，顶部） -->
  <ellipse cx="100" cy="66" rx="16" ry="14" fill="url(#head)"/>
  <!-- 吻部 -->
  <ellipse cx="100" cy="80" rx="9" ry="7" fill="url(#head)"/>

  <!-- 角芒凌厉 -->
  <path d="M 88 54 C 80 42 80 32 88 26 L 93 36 L 98 30" fill="none" stroke="#C22A2A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 112 54 C 120 42 120 32 112 26 L 107 36 L 102 30" fill="none" stroke="#C22A2A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 怒目（血红竖瞳） -->
  <ellipse cx="93" cy="64" rx="3" ry="4.8" fill="#0D0505"/>
  <ellipse cx="107" cy="64" rx="3" ry="4.8" fill="#0D0505"/>
  <ellipse cx="93" cy="64" rx="1.1" ry="4" fill="#FF6A4A"/>
  <ellipse cx="107" cy="64" rx="1.1" ry="4" fill="#FF6A4A"/>
  <path d="M 82 54 Q 93 49 104 54" fill="none" stroke="#0D0505" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 口衔烛（血焰） -->
  <path d="M 94 84 Q 100 88 106 84" fill="none" stroke="#0D0505" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="96.5" y="86" width="7" height="9" rx="1.4" fill="#1A0A0A" stroke="#8B1A1A" stroke-width="1"/>
  <path d="M 100 84 C 93 70 96 62 100 57 C 104 62 107 70 100 84 Z" fill="url(#flame)"/>

  <!-- 须张如戟 -->
  <path d="M 82 78 C 70 84 60 82 54 92 L 60 96" fill="none" stroke="#C22A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 118 78 C 130 84 140 82 146 92 L 140 96" fill="none" stroke="#C22A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 燃烧光环（碎裂） -->
  <circle cx="100" cy="66" r="28" fill="none" stroke="#D43A2A" stroke-width="1.6" opacity="0.55" stroke-dasharray="6 5"/>

  <!-- 淬炼光点 -->
  <circle cx="56" cy="120" r="1.8" fill="#FF6A4A" opacity="0.8"/>
  <circle cx="146" cy="118" r="1.6" fill="#D43A2A" opacity="0.7"/>
  <circle cx="100" cy="176" r="1.5" fill="#FFE3D6" opacity="0.6"/>
</svg>
