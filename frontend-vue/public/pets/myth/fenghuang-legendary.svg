<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="凤凰·五阶·百鸟之王·尾羽如虹开屏百鸟朝鸣翼息山火">
  <defs>
    <!-- 背景：晨光山林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E8C0"/>
      <stop offset="52%" stop-color="#B4D09C"/>
      <stop offset="100%" stop-color="#90B080"/>
    </linearGradient>
    <!-- 晨光金 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 五色羽 -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0B878"/>
      <stop offset="100%" stop-color="#D89058"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="52" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <path d="M 0 130 Q 50 120 110 128 Q 160 132 200 124 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>

  <!-- 梧桐（左） -->
  <g stroke="#6E5640" stroke-width="3.4" stroke-linecap="round">
    <path d="M 60 200 L 62 150 Q 62 128 54 116 Q 50 108 44 104"/>
    <path d="M 60 136 Q 48 126 40 120"/>
  </g>
  <g fill="#6E9E6E" opacity="0.9">
    <path d="M 44 104 Q 38 98 34 92 Q 40 98 46 100 Z"/>
    <path d="M 52 108 Q 46 102 42 96 Q 48 102 54 104 Z"/>
    <path d="M 40 120 Q 34 114 30 108 Q 36 114 42 116 Z"/>
  </g>

  <!-- 百鸟朝鸣（环绕） -->
  <g stroke="#8E7660" stroke-width="1.4" opacity="0.65" stroke-linecap="round" fill="none">
    <path d="M 96 76 Q 100 72 104 76"/>
    <path d="M 112 92 Q 116 88 120 92"/>
    <path d="M 130 70 Q 134 66 138 70">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 88 90 Q 92 86 96 90">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山火（右远，被翼风平息） -->
  <g fill="#FF9048" opacity="0.5">
    <path d="M 156 118 Q 160 108 164 112 Q 166 118 158 124 Z"/>
    <path d="M 172 122 Q 176 112 180 116 Q 182 122 174 128 Z"/>
  </g>
  <!-- 翼风（压向山火） -->
  <g stroke="#FFF8DC" stroke-width="1.6" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 120 96 Q 138 108 152 116">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 116 104 Q 134 114 148 120">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#8EB87E" stroke-width="1.4" opacity="0.6"/>

  <!-- 凤凰（立梧桐巅，尾羽如虹开屏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 尾羽（如虹开屏，长） -->
    <g fill="none" stroke-width="2.8" stroke-linecap="round">
      <path d="M 62 118 Q 92 126 108 120 Q 120 116 126 120" stroke="#E07878"/>
      <path d="M 64 122 Q 94 134 112 132 Q 124 130 130 136" stroke="#F0A878"/>
      <path d="M 62 126 Q 90 142 106 144 Q 118 146 122 152" stroke="#78B8A8"/>
      <path d="M 60 130 Q 84 148 98 152 Q 108 156 110 162" stroke="#A888C8"/>
    </g>
    <!-- 尾羽虹光 -->
    <g fill="#FFE0A0" opacity="0.7">
      <circle cx="126" cy="118" r="2"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="134" r="1.8"><animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="110" cy="162" r="1.6"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- 身体 -->
    <ellipse cx="52" cy="104" rx="15" ry="11" fill="url(#feather)" stroke="#B87848" stroke-width="0.9"/>
    <!-- 五色羽点 -->
    <circle cx="46" cy="100" r="2.4" fill="#78B8A8" opacity="0.9"/>
    <circle cx="58" cy="102" r="2.4" fill="#A888C8" opacity="0.9"/>
    <circle cx="50" cy="108" r="2.2" fill="#F0C878" opacity="0.9"/>
    <!-- 腿 -->
    <path d="M 46 112 L 44 122 M 58 112 L 60 122" stroke="#B87848" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 头（含威，长鸣） -->
  <g>
    <ellipse cx="48" cy="88" rx="9" ry="8" fill="url(#feather)" stroke="#B87848" stroke-width="0.8"/>
    <path d="M 46 81 Q 44 76 46 72 M 49 81 Q 50 75 52 72 M 52 81 Q 54 77 56 75" stroke="#F0C878" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 43 86 Q 45 85 47 86 M 52 86 Q 54 85 56 86" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="45" cy="87" r="2.2" fill="#24180E"/>
    <circle cx="45.5" cy="86.6" r="0.7" fill="#FFF"/>
    <circle cx="54" cy="87" r="2.2" fill="#24180E"/>
    <circle cx="54.5" cy="86.6" r="0.7" fill="#FFF"/>
    <!-- 喙（长鸣） -->
    <path d="M 40 89 L 33 86 L 40 92 Z" fill="#D89078"/>
    <!-- 长鸣声波 -->
    <g stroke="#FFF8DC" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 32 84 Q 26 78 28 70">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 28 88 Q 22 84 22 76">
        <animate attributeName="opacity" values="0.45;0.15;0.45" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF8DC">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
