<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="饕餮·五阶·铜器瑞兽·盘仓檐角看秋收低低震慑鼠盗休">
  <defs>
    <!-- 背景：丰收秋空 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0DCA8"/>
      <stop offset="52%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#A8B078"/>
    </linearGradient>
    <!-- 神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF4D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青铜神晕 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#C8A868" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C8A868" stop-opacity="0"/>
    </radialGradient>
    <!-- 饕餮毛（如青铜） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A89470"/>
      <stop offset="100%" stop-color="#8E7C5E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 青铜神晕 -->
  <circle cx="100" cy="110" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 丰收谷垛 -->
  <g>
    <path d="M 40 142 L 34 152 L 46 152 Z" fill="#E0B060"/>
    <path d="M 52 140 L 44 152 L 60 152 Z" fill="#C89850"/>
    <path d="M 64 144 L 58 152 L 70 152 Z" fill="#E0B060"/>
  </g>

  <!-- 谷仓（大） -->
  <g>
    <!-- 仓身 -->
    <path d="M 118 108 L 118 150 L 178 150 L 178 108 Z" fill="#B8A892"/>
    <!-- 木纹 -->
    <g stroke="#9E8E76" stroke-width="0.8" opacity="0.5">
      <path d="M 118 118 L 178 118 M 118 130 L 178 130 M 118 142 L 178 142"/>
    </g>
    <!-- 屋顶 -->
    <path d="M 110 108 L 148 90 L 186 108 Z" fill="#8E7E66"/>
    <!-- 檐角（饕餮盘守处） -->
    <path d="M 176 108 L 186 108" stroke="#8E7E66" stroke-width="2"/>
    <!-- 仓门 -->
    <path d="M 146 126 L 146 150 L 164 150 L 164 126 Z" fill="#6E5E4A"/>
    <circle cx="155" cy="139" r="1.2" fill="#D8C060"/>
  </g>

  <!-- 被震慑的鼠盗（右下，逃） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="160" cy="144" rx="4.4" ry="3.2" fill="#6E6660"/>
    <circle cx="160" cy="139" r="2.8" fill="#6E6660"/>
    <circle cx="158.6" cy="138.2" r="0.8" fill="#C84030"/>
  </g>

  <!-- 饕餮（盘仓檐角，低低震慑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 羊身（青铜色，盘） -->
    <ellipse cx="108" cy="126" rx="16" ry="11" fill="url(#fur)" stroke="#7A6A50" stroke-width="1"/>
    <!-- 腿 -->
    <path d="M 98 134 L 96 142 M 120 134 L 122 142" stroke="#7A6A50" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾（如鼎尾） -->
    <path d="M 124 130 Q 134 124 138 116" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 124 130;5 124 130;0 124 130" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 饕餮头（青铜威仪，低低震慑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="108" cy="106" rx="13.5" ry="12" fill="url(#fur)" stroke="#7A6A50" stroke-width="1"/>
    <!-- 羊耳（如鼎耳） -->
    <path d="M 97 98 L 90 92 L 96 102 Q 99 100 97 98 Z" fill="#8E7C5E"/>
    <path d="M 119 98 L 126 92 L 120 102 Q 117 100 119 98 Z" fill="#8E7C5E"/>
    <!-- 双目（威严） -->
    <path d="M 99 102 Q 101 100.6 103 102 M 114 102 Q 116 100.6 118 102" stroke="#24180E" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <circle cx="101" cy="103" r="2.9" fill="#24180E"/>
    <circle cx="101.6" cy="102.4" r="0.9" fill="#FFF"/>
    <circle cx="116" cy="103" r="2.9" fill="#24180E"/>
    <circle cx="116.6" cy="102.4" r="0.9" fill="#FFF"/>
    <!-- 大嘴（如鉴，只守不夺） -->
    <path d="M 98 112 Q 108 115 118 112" fill="none" stroke="#3E4E4A" stroke-width="1.7" stroke-linecap="round"/>
    <!-- 低低震慑（声纹） -->
    <g stroke="#FFF4D0" stroke-width="1.2" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M 120 98 Q 128 94 134 90">
        <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 额间青铜光 -->
    <circle cx="108" cy="94" r="2.6" fill="#FFF4D0" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 丰收星尘 -->
  <g fill="#FFF4D0">
    <circle cx="36" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
