<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="玄武·五阶·北方之神·深冬立巅龟蛇盘守张壳笼暖护兽">
  <defs>
    <!-- 背景：北渊深冬 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCE6EE"/>
      <stop offset="52%" stop-color="#BCCED8"/>
      <stop offset="100%" stop-color="#8CA4B8"/>
    </linearGradient>
    <!-- 神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FCE8B8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCE8B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 神威暖晕 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8C878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 玄龟壳（如玄铁） -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E5A58"/>
      <stop offset="100%" stop-color="#363E3C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 神威暖晕 -->
  <circle cx="100" cy="112" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 北渊雪峰 -->
  <g fill="#C8D4DC" opacity="0.5">
    <path d="M 0 128 Q 60 120 130 126 Q 170 130 200 124 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 雪原 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#E8F0F4" opacity="0.9"/>
  <g stroke="#C8D8E0" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 40 150 L 30 170 M 168 150 L 178 172"/>
  </g>

  <!-- 笼暖的小兽（左下，安然） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="62" cy="146" rx="5.6" ry="4.2" fill="#D8D0C4" stroke="#B0A898" stroke-width="0.6"/>
    <circle cx="62" cy="140" r="3.4" fill="#D8D0C4" stroke="#B0A898" stroke-width="0.5"/>
    <circle cx="60.4" cy="139.4" r="0.9" fill="#24180E"/>
    <circle cx="63.6" cy="139.4" r="0.9" fill="#24180E"/>
    <ellipse cx="62" cy="146" rx="11" ry="5" fill="#FCE8B8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.15;0.3" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 玄武之神（立巅，龟蛇盘守） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 龟壳（如玄铁大） -->
    <ellipse cx="106" cy="122" rx="32" ry="20" fill="url(#shell)" stroke="#2A3432" stroke-width="1.3"/>
    <!-- 壳纹 -->
    <g stroke="#6E7E7A" stroke-width="1" fill="none" opacity="0.75">
      <path d="M 84 118 L 106 111 L 128 118 L 106 125 Z"/>
      <path d="M 106 111 L 106 102 M 84 118 L 68 114 M 128 118 L 144 114"/>
      <path d="M 92 116 L 92 110 M 120 116 L 120 110" />
    </g>
    <!-- 壳上寒霜（神御，不结冰） -->
    <g fill="#E8F0F4" opacity="0.6">
      <circle cx="90" cy="112" r="1.4"/>
      <circle cx="122" cy="114" r="1.2"/>
    </g>
    <!-- 爪（立稳） -->
    <path d="M 88 138 L 84 146 M 124 138 L 128 146" stroke="#3A4442" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 蛇首（如圭，盘顶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 106 118 Q 104 108 108 100 Q 111 94 118 90" stroke="url(#shell)" stroke-width="5.4" stroke-linecap="round" fill="none"/>
    <path d="M 118 90 Q 124 86 128 90" stroke="#6E8E8C" stroke-width="4.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="130" cy="88" rx="6" ry="5" fill="#6E8E8C" stroke="#526E6C" stroke-width="0.8"/>
    <circle cx="132.4" cy="86.6" r="1.6" fill="#24180E"/>
    <circle cx="132.8" cy="86.2" r="0.5" fill="#FFF"/>
    <path d="M 134.4 90 L 137 91 L 133 92" fill="#E8B838"/>
    <!-- 蛇首额间神光 -->
    <circle cx="129" cy="84" r="2.2" fill="#FCE8B8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 张壳笼暖（光弧） -->
  <path d="M 70 132 Q 66 118 76 108" stroke="#FCE8B8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 暖光星尘 -->
  <g fill="#FCE8B8">
    <circle cx="36" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
