<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="穷奇·五阶·镇山凶兽·深岭之巅翼展低吼镇山翼下幼兽嬉戏">
  <defs>
    <!-- 背景：深岭之巅 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8EA6B8"/>
      <stop offset="52%" stop-color="#7690A4"/>
      <stop offset="100%" stop-color="#5E7A90"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#F0F4F6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0F4F6" stop-opacity="0"/>
    </radialGradient>
    <!-- 镇山威光 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F8D878" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8D878" stop-opacity="0"/>
    </radialGradient>
    <!-- 虎纹毛皮（鎏金） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0A868"/>
      <stop offset="100%" stop-color="#B88050"/>
    </linearGradient>
    <!-- 翼 -->
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96AEC6"/>
      <stop offset="100%" stop-color="#768EA6"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="46" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 镇山威光 -->
  <circle cx="100" cy="116" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#5E7690" opacity="0.8">
    <path d="M 0 126 L 40 76 L 80 126 Z M 100 126 L 144 80 L 186 126 Z"/>
  </g>

  <!-- 远山恶兽（闻低吼而退） -->
  <g opacity="0.5">
    <path d="M 176 108 Q 180 102 186 106" stroke="#4E5E6E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="186" cy="100" r="3.4" fill="#5E6E7E" stroke="#4E5E6E" stroke-width="0.8"/>
    <path d="M 190 104 Q 194 108 196 112" stroke="#4E5E6E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 188 102 Q 192 104 194 106" stroke="#4E5E6E" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 深岭之巅（穷奇所立） -->
  <path d="M 56 136 L 92 104 Q 100 100 108 104 L 136 136 L 56 136 Z" fill="#6E869A" stroke="#567080" stroke-width="1"/>
  <path d="M 76 122 Q 96 112 116 122" stroke="#8EA6B8" stroke-width="1" opacity="0.6" fill="none"/>

  <!-- 翼下幼兽（嬉戏） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.2s" repeatCount="indefinite"/>
    <ellipse cx="64" cy="142" rx="5.4" ry="4.2" fill="#9EB886" stroke="#6E8E56" stroke-width="0.7"/>
    <circle cx="61" cy="137" r="3" fill="#AEC89E" stroke="#6E8E56" stroke-width="0.6"/>
    <path d="M 59 136 L 57 134 M 62 136 L 64 134" stroke="#AEC89E" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="60" cy="136.6" r="0.9" fill="#24180E"/>
    <circle cx="63" cy="136.6" r="0.9" fill="#24180E"/>
    <path d="M 61 140 Q 63 141 65 140" stroke="#6E8E56" stroke-width="0.5" stroke-linecap="round" fill="none"/>
  </g>
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;-2 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="84" cy="145" rx="4.8" ry="3.6" fill="#7E9E6E" stroke="#5E7E4E" stroke-width="0.7"/>
    <circle cx="82" cy="140" r="2.8" fill="#8EAE7E" stroke="#5E7E4E" stroke-width="0.6"/>
    <path d="M 80 139 L 78 137 M 83 139 L 85 137" stroke="#8EAE7E" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="81" cy="139.6" r="0.8" fill="#24180E"/>
    <circle cx="84" cy="139.6" r="0.8" fill="#24180E"/>
  </g>

  <!-- 穷奇（大，翼展而立，低吼镇山） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 尾（扬起如鞭） -->
    <path d="M 120 124 Q 132 116 138 106" stroke="url(#fur)" stroke-width="4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 120 124;8 120 124;0 120 124" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 后腿 -->
    <path d="M 108 128 L 104 140 M 122 128 L 126 140" stroke="#B88050" stroke-width="4" stroke-linecap="round"/>
    <!-- 身体（大） -->
    <path d="M 92 112 Q 88 124 98 130 Q 114 138 128 130 Q 134 124 130 112 Q 114 105 92 112 Z" fill="url(#fur)" stroke="#8E5838" stroke-width="1"/>
    <!-- 虎纹 -->
    <path d="M 94 118 Q 104 121 112 118 M 92 126 Q 104 129 118 126 M 126 118 Q 130 121 132 118" stroke="#4E3018" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- 前腿 -->
    <path d="M 126 116 C 132 122 136 126 138 132" fill="none" stroke="url(#fur)" stroke-width="4.8" stroke-linecap="round"/>
    <circle cx="139" cy="134" r="3.2" fill="#B88050"/>
  </g>

  <!-- 翼（展，镇山） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 96 96;-12 96 96;0 96 96" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 94 100 Q 76 78 66 58 Q 82 74 100 92 Z" fill="url(#wing)" stroke="#4E667E" stroke-width="1"/>
    <path d="M 66 58 L 60 52 M 70 62 L 64 56" stroke="#A6BED6" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 126 96;12 126 96;0 126 96" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 124 100 Q 142 78 152 58 Q 136 74 118 92 Z" fill="url(#wing)" stroke="#4E667E" stroke-width="1"/>
    <path d="M 152 58 L 158 52 M 148 62 L 154 56" stroke="#A6BED6" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 头（低吼镇山，威中含护） -->
  <g>
    <ellipse cx="110" cy="96" rx="12" ry="10" fill="url(#fur)" stroke="#8E5838" stroke-width="1"/>
    <path d="M 100 89 L 94 80 L 104 85 Z" fill="url(#fur)" stroke="#8E5838" stroke-width="0.7"/>
    <path d="M 120 89 L 126 80 L 116 85 Z" fill="url(#fur)" stroke="#8E5838" stroke-width="0.7"/>
    <!-- 低吼獠牙 -->
    <path d="M 112 102 L 115 107 L 113 102 Z" fill="#F0F0EE"/>
    <path d="M 117 101 L 120 105 L 118 101 Z" fill="#F0F0EE"/>
    <!-- 眼（含威，护弱） -->
    <path d="M 102 94 Q 105 93 107 94 M 115 94 Q 118 93 120 94" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="105" cy="95" r="3" fill="#F0A838"/>
    <circle cx="105" cy="95" r="1.6" fill="#24180E"/>
    <circle cx="105.6" cy="94.4" r="0.6" fill="#FFF"/>
    <circle cx="117" cy="95" r="3" fill="#F0A838"/>
    <circle cx="117" cy="95" r="1.6" fill="#24180E"/>
    <circle cx="117.6" cy="94.4" r="0.6" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="111" cy="99" rx="2.2" ry="1.6" fill="#4E3018"/>
    <!-- 低吼镇山声波 -->
    <g stroke="#F0F4F6" stroke-width="1.6" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 122 90 Q 132 84 142 88">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 124 98 Q 134 94 144 100">
        <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 天光星尘 -->
  <g fill="#F0F4F6">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
