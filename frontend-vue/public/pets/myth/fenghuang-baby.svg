<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="凤凰·二阶·山火之劫·翼护百鸟冲出浓烟身陷火圈">
  <defs>
    <!-- 背景：山火烈焰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B05030"/>
      <stop offset="52%" stop-color="#9A4A38"/>
      <stop offset="100%" stop-color="#6E3A34"/>
    </linearGradient>
    <!-- 火光 -->
    <radialGradient id="glow" cx="46%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#FFB878" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB878" stop-opacity="0"/>
    </radialGradient>
    <!-- 五色羽（被火燎） -->
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D89068"/>
      <stop offset="100%" stop-color="#B06A4E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="70" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 火焰（四周） -->
  <g fill="#FF9048" opacity="0.8">
    <path d="M 30 60 Q 34 50 40 54 Q 44 58 40 68 Q 36 66 30 60 Z"/>
    <path d="M 160 44 Q 166 32 172 38 Q 176 44 168 56 Q 162 52 160 44 Z"/>
    <path d="M 120 30 Q 126 20 132 26 Q 136 32 126 42 Q 122 36 120 30 Z"/>
  </g>
  <g fill="#F07838" opacity="0.7">
    <path d="M 50 40 Q 54 32 58 38 Q 60 44 52 52 Q 50 46 50 40 Z"/>
    <path d="M 146 60 Q 152 50 158 56 Q 160 62 150 72 Q 146 66 146 60 Z"/>
  </g>

  <!-- 浓烟 -->
  <g stroke="#6E4A42" stroke-width="2" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 60 40 Q 56 32 60 24 M 120 36 Q 124 28 120 20">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 百鸟（被护着，冲出） -->
  <g stroke="#8E6E5E" stroke-width="1.4" opacity="0.8" stroke-linecap="round" fill="none">
    <path d="M 60 108 Q 64 104 68 108"/>
    <path d="M 76 112 Q 80 108 84 112"/>
    <path d="M 68 118 Q 72 114 76 118">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 -3;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5E322E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#8E5E4E" stroke-width="1.4" opacity="0.6"/>
  <!-- 余烬 -->
  <g fill="#FF9048">
    <circle cx="40" cy="156" r="2">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="160" r="1.6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 雏凤（翼护百鸟，身陷火圈，不屈） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="96" cy="118" rx="14" ry="11" fill="url(#down)" stroke="#8E5238" stroke-width="0.9"/>
    <!-- 翼（张开护鸟，被燎） -->
    <path d="M 88 112 Q 72 100 60 96 Q 70 104 80 108 Z" fill="#B87858" stroke="#8E5238" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 88 112;-8 88 112;0 88 112" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 104 112 Q 120 100 132 96 Q 122 104 112 108 Z" fill="#B87858" stroke="#8E5238" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 104 112;8 104 112;0 104 112" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 尾羽（焦黑） -->
    <path d="M 108 124 Q 120 126 126 120" stroke="#4E3A32" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 腿 -->
    <path d="M 90 126 L 88 138 M 102 126 L 104 138" stroke="#8E5238" stroke-width="2" stroke-linecap="round"/>
    <!-- 五色羽（被燎的痕迹） -->
    <path d="M 88 120 Q 92 122 96 120" stroke="#4E3A32" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 头（含毅，冠羽微焦） -->
  <g>
    <ellipse cx="96" cy="102" rx="10" ry="9" fill="url(#down)" stroke="#8E5238" stroke-width="0.8"/>
    <path d="M 94 94 Q 92 89 94 86 M 97 94 Q 98 88 100 86 M 100 94 Q 102 90 104 88" stroke="#B89048" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 眼（含毅） -->
    <path d="M 90 100 Q 92 99 94 100 M 98 100 Q 100 99 102 100" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="92" cy="101" r="2.2" fill="#24180E"/>
    <circle cx="92.5" cy="100.6" r="0.7" fill="#FFF"/>
    <circle cx="101" cy="101" r="2.2" fill="#24180E"/>
    <circle cx="101.5" cy="100.6" r="0.7" fill="#FFF"/>
    <!-- 喙（紧闭） -->
    <path d="M 88 104 L 83 103 L 88 106 Z" fill="#D89078"/>
    <!-- 颊 -->
    <circle cx="88" cy="105" r="1.5" fill="#E07878" opacity="0.5"/>
  </g>

  <!-- 火圈（身陷） -->
  <g fill="none" stroke="#FF9048" stroke-width="1.4" opacity="0.6">
    <circle cx="96" cy="112" r="30">
      <animateTransform attributeName="transform" type="scale" values="0.8 0.8;1.1 1.1;0.8 0.8" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="112" r="22">
      <animateTransform attributeName="transform" type="scale" values="1.1 1.1;1.3 1.3;1.1 1.1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火光星尘 -->
  <g fill="#FFB878">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
