<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱雀·六阶·朱雀传说·盛夏看雏敛火翅拨火意护蚁传心">
  <defs>
    <!-- 背景：南方夏林暮霞 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAC74"/>
      <stop offset="100%" stop-color="#8EAE86"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FFD888" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD888" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽（泛岁月光） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E86858"/>
      <stop offset="100%" stop-color="#C84A3C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 夏林（下） -->
  <g fill="#5E9268" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 南枝（右） -->
  <path d="M 104 146 Q 112 138 128 136" stroke="#6E5640" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 116 140 L 110 134 M 124 137 L 128 132" stroke="#6E5640" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 蚁群搬家长队（左，护） -->
  <g>
    <g fill="#5E5448">
      <circle cx="44" cy="152" r="1.1"/>
      <circle cx="52" cy="154" r="1.1"/>
      <circle cx="60" cy="153" r="1.1"/>
      <circle cx="68" cy="155" r="1.1"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;1.5 0;0 0" dur="3s" repeatCount="indefinite"/>
    </g>
    <circle cx="48" cy="151" r="1" fill="#E8D8B0"/>
  </g>

  <!-- 雏鸟（左下，敛火护蚁，仰头） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="62" cy="136" rx="7.5" ry="6.4" fill="url(#feather)" stroke="#B83A2E" stroke-width="0.7"/>
    <!-- 尾羽 -->
    <path d="M 68 140 Q 74 143 76 138" stroke="url(#feather)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- 翅（敛，护蚁） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 58 132;5 58 132;0 58 132" dur="2s" repeatCount="indefinite"/>
      <path d="M 57 132 L 46 126 L 42 120 L 52 126 Z" fill="url(#feather)" stroke="#B83A2E" stroke-width="0.6"/>
      <!-- 翅尖火意（敛住） -->
      <circle cx="42" cy="120" r="1.8" fill="#F0A030" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.32;0.6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <!-- 雏鸟头（仰头看老朱雀） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="62" cy="124" rx="6.5" ry="5.8" fill="url(#feather)" stroke="#B83A2E" stroke-width="0.7"/>
    <path d="M 59 120 Q 59 115 62 113.5 M 63 120 Q 65 115 67 114.5" stroke="#E86858" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <circle cx="59" cy="123" r="1.8" fill="#24180E"/>
    <circle cx="59.4" cy="122.6" r="0.6" fill="#FFF"/>
    <circle cx="65.5" cy="123" r="1.8" fill="#24180E"/>
    <circle cx="65.9" cy="122.6" r="0.6" fill="#FFF"/>
    <path d="M 62 126 L 60.6 128.4 L 63.4 127.6 Z" fill="#E8B838"/>
  </g>

  <!-- 老朱雀（翅拨雏鸟火意，传心） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾羽 -->
    <g stroke="url(#feather)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M 118 130 Q 110 140 104 132">
        <animateTransform attributeName="transform" type="rotate" values="0 118 130;-4 118 130;0 118 130" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 身体 -->
    <ellipse cx="116" cy="116" rx="10" ry="8.5" fill="url(#feather)" stroke="#B83A2E" stroke-width="0.9"/>
    <!-- 左翅（垂，拨雏鸟火意） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 106 110;10 106 110;0 106 110" dur="2.4s" repeatCount="indefinite"/>
      <path d="M 105 110 L 90 104 L 80 96 L 96 104 Z" fill="url(#feather)" stroke="#B83A2E" stroke-width="0.7"/>
      <!-- 翅尖轻拨火意（传） -->
      <path d="M 80 96 L 72 92" stroke="#F8A030" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 老朱雀头（翅拨火意，温和） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="116" cy="102" rx="7.5" ry="6.8" fill="url(#feather)" stroke="#B83A2E" stroke-width="0.8"/>
    <path d="M 111 97 Q 110 91 114 89 M 116 97 Q 118 91 121 90" stroke="#E86858" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="112.5" cy="101" r="2.1" fill="#24180E"/>
    <circle cx="113" cy="100.5" r="0.7" fill="#FFF"/>
    <circle cx="120" cy="101" r="2.1" fill="#24180E"/>
    <circle cx="120.5" cy="100.5" r="0.7" fill="#FFF"/>
    <path d="M 116 104 L 114.6 107 L 117.4 106 Z" fill="#E8B838"/>
    <!-- 传心微光（翅拨→雏鸟） -->
    <path d="M 76 94 Q 68 108 64 118" stroke="#FFF0D0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
