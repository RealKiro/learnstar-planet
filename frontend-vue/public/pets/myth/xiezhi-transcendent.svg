<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="獬豸·六阶·明辨传说·暮色角碰小獬豸传辨直之心">
  <defs>
    <!-- 背景：村口暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAC74"/>
      <stop offset="100%" stop-color="#94B080"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#E8ECF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E8ECF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 羊雪白 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8F6"/>
      <stop offset="100%" stop-color="#E0E0DC"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="58" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#C8A060" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 众人往来（远） -->
  <g opacity="0.6">
    <path d="M 30 140 L 28 150 L 32 150 L 34 140 Z" fill="#7E6E4E"/>
    <circle cx="31" cy="135" r="2.8" fill="#9E8E6E"/>
    <path d="M 152 142 L 150 152 L 154 152 L 156 142 Z" fill="#8E7E5E"/>
    <circle cx="153" cy="137" r="2.8" fill="#AE9E7E"/>
  </g>

  <!-- 小獬豸（左下，学着辨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 64 138 Q 70 136 74 132" stroke="#E0D8D0" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="56" cy="132" rx="9" ry="6.6" fill="#F0ECE8" stroke="#C8C0B8" stroke-width="0.7"/>
    <path d="M 50 137 L 48 145 M 62 137 L 64 145" stroke="#C8C0B8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- 小獬豸头 -->
  <g>
    <ellipse cx="56" cy="120" rx="7.5" ry="6.8" fill="#F0ECE8" stroke="#C8C0B8" stroke-width="0.7"/>
    <!-- 小角（初生） -->
    <path d="M 59 115 Q 60 110 62 108" stroke="#F0E0C0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="63" cy="107" r="1.5" fill="#FFF0D8" opacity="0.85"/>
    <path d="M 51 115 L 48 112" stroke="#E0D8D0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="52" cy="119" r="1.8" fill="#24180E"/>
    <circle cx="52.5" cy="118.6" r="0.6" fill="#FFF"/>
    <circle cx="61" cy="119" r="1.8" fill="#24180E"/>
    <circle cx="61.5" cy="118.6" r="0.6" fill="#FFF"/>
    <path d="M 52 123 Q 56 124.4 60 123" fill="none" stroke="#A8A098" stroke-width="0.7" stroke-linecap="round"/>
    <ellipse cx="56" cy="124" rx="1.3" ry="1" fill="#A8A098"/>
  </g>

  <!-- 老獬豸（角碰小獬豸传心） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <ellipse cx="112" cy="130" rx="14" ry="9.5" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 104 136 L 102 148 M 122 136 L 124 148" stroke="#C0B8B0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 126 132 Q 132 130 136 126" stroke="#E0D8D0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老獬豸头（角垂碰小角，传心） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="114" rx="10.5" ry="9.5" fill="url(#fur)" stroke="#C0B8B0" stroke-width="0.9"/>
    <!-- 独角（垂，碰小角） -->
    <path d="M 116 106 Q 114 98 108 92 Q 104 88 100 86" stroke="#F0E0C0" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="99" cy="85" r="2.6" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 传心微光 -->
    <circle cx="82" cy="100" r="6" fill="#FFF0D0" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（温和） -->
    <path d="M 106 112 Q 108 111 110 112 M 116 112 Q 118 111 120 112" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="108" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="108.5" cy="112.5" r="0.7" fill="#FFF"/>
    <circle cx="118" cy="113" r="2.2" fill="#24180E"/>
    <circle cx="118.5" cy="112.5" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="112" cy="118" rx="1.7" ry="1.3" fill="#A8A098"/>
    <!-- 温和 -->
    <path d="M 108 121 Q 112 122.4 116 121" fill="none" stroke="#A8A098" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
