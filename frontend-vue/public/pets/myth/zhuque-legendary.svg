<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="朱雀·五阶·南方之神·火翼如霞翅引火线示警暖芽守夏">
  <defs>
    <!-- 背景：南疆夏空 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C890"/>
      <stop offset="52%" stop-color="#DCB07C"/>
      <stop offset="100%" stop-color="#8EB086"/>
    </linearGradient>
    <!-- 神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FCE8C0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCE8C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 火霞光环 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F8A048" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8A048" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽（如火） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F06854"/>
      <stop offset="100%" stop-color="#D84A38"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 火霞光环 -->
  <circle cx="100" cy="110" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 夏林（下） -->
  <g fill="#5E9268" opacity="0.5">
    <path d="M 0 128 Q 60 122 130 126 Q 170 130 200 124 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E9E6A" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#90B88E" stroke-width="1.4" opacity="0.55"/>

  <!-- 被隔的野火（右远，熄边） -->
  <g opacity="0.7">
    <g fill="#E88A3C">
      <path d="M 172 128 Q 176 122 178 116 Q 180 124 176 128 Z">
        <animate attributeName="opacity" values="0.7;0.35;0.7" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <!-- 被护的幼芽（左，暖） -->
  <g>
    <path d="M 48 144 L 48 138" stroke="#6E5640" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 48 138 Q 42 132 38 124 Q 46 130 48 134 Z" fill="#7EB86A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1.1 1.1;1 1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="48" cy="146" r="6" fill="#F8C878" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 朱雀之神（火翼如霞，展） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾羽（如霞） -->
    <g stroke="url(#feather)" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M 102 132 Q 92 142 84 134">
        <animateTransform attributeName="transform" type="rotate" values="0 102 132;-4 102 132;0 102 132" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 106 134 Q 102 144 98 142">
        <animateTransform attributeName="transform" type="rotate" values="0 106 134;4 106 134;0 106 134" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 身体 -->
    <ellipse cx="112" cy="116" rx="11" ry="9" fill="url(#feather)" stroke="#B83828" stroke-width="0.9"/>
    <!-- 火翼（展） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 120 110;6 120 110;-6 120 110" dur="2s" repeatCount="indefinite"/>
      <!-- 右翼 -->
      <path d="M 124 110 L 146 98 L 158 88 L 142 102 Z" fill="url(#feather)" stroke="#B83828" stroke-width="0.8"/>
      <path d="M 146 98 L 158 88" stroke="#F8A048" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 左翼 -->
      <path d="M 100 110 L 78 98 L 66 88 L 82 102 Z" fill="url(#feather)" stroke="#B83828" stroke-width="0.8"/>
      <path d="M 78 98 L 66 88" stroke="#F8A048" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <!-- 示警火线（右翼引出） -->
    <g stroke="#F8A030" stroke-width="1.4" stroke-linecap="round" opacity="0.7" fill="none">
      <path d="M 158 88 L 168 84 L 174 82">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 朱雀之神头（火冠，含威含温） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="112" cy="100" rx="8.5" ry="7.5" fill="url(#feather)" stroke="#B83828" stroke-width="0.8"/>
    <!-- 火冠 -->
    <path d="M 106 94 Q 104 86 110 84 M 112 94 Q 114 86 118 85" stroke="#F0604C" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <!-- 眼（含威含温） -->
    <circle cx="108" cy="99" r="2.3" fill="#24180E"/>
    <circle cx="108.5" cy="98.5" r="0.75" fill="#FFF"/>
    <circle cx="116.5" cy="99" r="2.3" fill="#24180E"/>
    <circle cx="117" cy="98.5" r="0.75" fill="#FFF"/>
    <!-- 喙（如火） -->
    <path d="M 112 102 L 110 105.4 L 114 104.4 Z" fill="#E8B838"/>
    <!-- 额间神光 -->
    <circle cx="112" cy="93" r="2.8" fill="#FCE8C0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火霞星尘 -->
  <g fill="#FCE8C0">
    <circle cx="36" cy="102">
      <animate attributeName="cy" values="102;92;102" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
