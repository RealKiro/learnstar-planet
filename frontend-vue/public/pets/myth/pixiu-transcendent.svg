<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="貔貅·六阶·貔貅传说·宅门暮色角碰小貔貅传福孩童嬉戏">
  <defs>
    <!-- 背景：宅门暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAC74"/>
      <stop offset="100%" stop-color="#C0A870"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 貔貅金毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#D8B060"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="108" r="58" fill="url(#halo)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 宅门（远） -->
  <path d="M 150 134 Q 170 128 188 134 L 196 200 L 150 200 Z" fill="#B08A5E" stroke="#96683E" stroke-width="1.2"/>
  <path d="M 162 134 Q 174 130 184 134" stroke="#C8A878" stroke-width="1" opacity="0.7" fill="none"/>
  <circle cx="170" cy="140" r="3.4" fill="#E06048" stroke="#B84834" stroke-width="0.7">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 孩童（门前嬉戏） -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 128 140 L 126 150 L 130 150 L 132 140 Z" fill="#A0886E" stroke="#8E7660" stroke-width="0.7"/>
    <circle cx="130" cy="135" r="3.4" fill="#D8C8A8" stroke="#8E7660" stroke-width="0.6"/>
    <path d="M 128 136 Q 130 137.6 132 136" stroke="#8E7660" stroke-width="0.5" stroke-linecap="round" fill="none"/>
    <path d="M 124 140 L 118 136 M 118 136 L 116 134" stroke="#8E7660" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8A5E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#BEA878" stroke-width="1.4" opacity="0.7"/>

  <!-- 小貔貅（左下，学辨福） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 64 138 Q 72 136 76 132" stroke="#D8B060" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M 46 126 Q 43 134 50 139 Q 60 144 70 139 Q 74 134 71 125 Q 60 120 46 126 Z" fill="#E8C878" stroke="#B88E3E" stroke-width="0.8"/>
    <path d="M 50 135 L 48 143 M 66 135 L 68 143" stroke="#B88E3E" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 小貔貅头 -->
  <g>
    <ellipse cx="50" cy="118" rx="9" ry="8" fill="#E8C878" stroke="#B88E3E" stroke-width="0.8"/>
    <path d="M 53 112 Q 54 107 56 105" stroke="#F0E0C0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="57" cy="104" r="1.6" fill="#FFE8A0" opacity="0.8"/>
    <circle cx="45" cy="117" r="2" fill="#24180E"/>
    <circle cx="45.5" cy="116.6" r="0.6" fill="#FFF"/>
    <circle cx="56" cy="117" r="2" fill="#24180E"/>
    <circle cx="56.5" cy="116.6" r="0.6" fill="#FFF"/>
    <path d="M 42 121 Q 47 123 52 121" fill="none" stroke="#8E6E2E" stroke-width="0.9" stroke-linecap="round"/>
    <ellipse cx="50" cy="122" rx="1.8" ry="1.3" fill="#8E6E2E"/>
  </g>

  <!-- 老貔貅（角碰小貔貅传福） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾 -->
    <path d="M 128 132 Q 138 128 144 122" stroke="#D8B060" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- 身体 -->
    <path d="M 96 114 Q 92 126 102 132 Q 116 140 128 132 Q 134 126 130 114 Q 116 108 96 114 Z" fill="url(#fur)" stroke="#B88E3E" stroke-width="1"/>
    <!-- 腿 -->
    <path d="M 102 130 L 100 142 M 124 130 L 126 142" stroke="#B88E3E" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- 老貔貅头（角垂，碰小貔貅） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="104" rx="12" ry="10" fill="url(#fur)" stroke="#B88E3E" stroke-width="1"/>
    <!-- 角（垂，碰小貔貅） -->
    <path d="M 104 96 Q 102 88 96 82 Q 92 78 88 76" stroke="#F0E0C0" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="87" cy="75" r="2.4" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 传福微光（两角间） -->
    <circle cx="70" cy="92" r="6" fill="#FFF0C8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（温和） -->
    <path d="M 94 102 Q 96 101 98 102 M 106 102 Q 108 101 110 102" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="96" cy="103" r="2.4" fill="#24180E"/>
    <circle cx="96.6" cy="102.4" r="0.8" fill="#FFF"/>
    <circle cx="108" cy="103" r="2.4" fill="#24180E"/>
    <circle cx="108.6" cy="102.4" r="0.8" fill="#FFF"/>
    <!-- 大嘴（传福语） -->
    <path d="M 90 108 Q 97 111 104 108" fill="none" stroke="#8E6E2E" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 鼻 -->
    <ellipse cx="100" cy="110" rx="2.2" ry="1.6" fill="#8E6E2E"/>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
