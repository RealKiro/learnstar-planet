<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白泽·五阶·通晓万物·伏案写白泽图村民执图辨妖安心">
  <defs>
    <!-- 背景：书房暖灯 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8DCC8"/>
      <stop offset="52%" stop-color="#D0C0A8"/>
      <stop offset="100%" stop-color="#A89E8C"/>
    </linearGradient>
    <!-- 灯暖神光 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FCF0D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 通晓神晕 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F4D088" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F4D088" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛（如雪） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAE6DE"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="56" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 通晓神晕 -->
  <circle cx="100" cy="112" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 书案 -->
  <path d="M 40 138 L 170 138 L 164 146 L 46 146 Z" fill="#8E7A5E"/>
  <path d="M 60 146 L 60 154 M 150 146 L 150 154" stroke="#7A684E" stroke-width="2.4"/>
  <!-- 竹简（白泽图） -->
  <g>
    <path d="M 84 118 L 128 118 L 128 136 L 84 136 Z" fill="#E8DCB8"/>
    <g stroke="#B8A878" stroke-width="0.6">
      <path d="M 88 118 L 88 136 M 94 118 L 94 136 M 100 118 L 100 136 M 106 118 L 106 136 M 112 118 L 112 136 M 118 118 L 118 136 M 124 118 L 124 136"/>
    </g>
    <!-- 字痕 -->
    <g stroke="#6E6248" stroke-width="0.8" stroke-linecap="round" opacity="0.7">
      <path d="M 90 124 L 92 124 M 96 122 L 99 122 M 102 124 L 104 124"/>
      <path d="M 90 130 L 92 130 M 96 128 L 99 128 M 108 130 L 111 130"/>
    </g>
    <!-- 墨光 -->
    <circle cx="106" cy="127" r="14" fill="#FCF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.16;0.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 白泽（伏案写图，通晓万物） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 身（伏案） -->
    <ellipse cx="100" cy="130" rx="16" ry="10" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 后腿 -->
    <path d="M 90 137 L 88 145 M 112 137 L 114 145" stroke="#C8C2B8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 尾（轻扬） -->
    <path d="M 116 134 Q 126 128 130 120" stroke="url(#fur)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 116 134;6 116 134;0 116 134" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- 前蹄（执笔） -->
    <path d="M 92 124 L 92 118" stroke="url(#fur)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 92 118 L 88 116 M 92 118 L 95 116" stroke="#C8C2B8" stroke-width="1" stroke-linecap="round"/>
    <!-- 毛笔 -->
    <path d="M 94 116 L 98 104 L 96 100" stroke="#6E6248" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M 96 100 Q 93 96 95 94 Q 97 96 96 100" fill="#24180E"/>
  </g>

  <!-- 白泽头（双目澄明含智，伏案专注） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="106" rx="11" ry="10" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.9"/>
    <!-- 耳 -->
    <path d="M 90 99 L 85 91 L 94 96 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <path d="M 110 99 L 115 91 L 106 96 Z" fill="url(#fur)" stroke="#C8C2B8" stroke-width="0.6"/>
    <!-- 鬃毛（如卷，字流转） -->
    <path d="M 93 97 Q 90 93 92 91 Q 95 93 95 96" fill="url(#fur)"/>
    <path d="M 105 97 Q 108 93 106 91 Q 103 93 103 96" fill="url(#fur)"/>
    <!-- 双角（如圭） -->
    <path d="M 92 97 L 88 90 Q 92 90 94 95" fill="#E8D8C0"/>
    <path d="M 108 97 L 112 90 Q 108 90 106 95" fill="#E8D8C0"/>
    <!-- 双目（澄明含智） -->
    <path d="M 90 104 Q 92 102.6 94 104 M 107 104 Q 109 102.6 111 104" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="92" cy="105" r="2.4" fill="#24180E"/>
    <circle cx="92.6" cy="104.4" r="0.8" fill="#FFF"/>
    <circle cx="109" cy="105" r="2.4" fill="#24180E"/>
    <circle cx="109.6" cy="104.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="100" cy="109" rx="1.7" ry="1.3" fill="#C8A0A0"/>
    <!-- 额间通晓光 -->
    <circle cx="100" cy="96" r="2.8" fill="#FCF0D0" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 村民执图辨妖（右，安心） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 140 138 L 138 146 M 140 138 L 144 145" stroke="#8E7A5E" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="141" cy="133" r="3.2" fill="#C8B8A0"/>
    <!-- 执图 -->
    <path d="M 148 132 L 160 132 L 160 142 L 148 142 Z" fill="#E8DCB8"/>
    <path d="M 152 134 L 152 140" stroke="#B8A878" stroke-width="0.6"/>
  </g>

  <!-- 灯暖星尘 -->
  <g fill="#FCF0D0">
    <circle cx="36" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
