<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="九尾狐·六阶·青丘传说·九尾如屏护满山小狐幼狐问福">
  <defs>
    <!-- 背景：青丘暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C898"/>
      <stop offset="52%" stop-color="#D0B078"/>
      <stop offset="100%" stop-color="#A8C088"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF8E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 奶白绒毛（泛岁月光） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFAF4"/>
      <stop offset="100%" stop-color="#EAE2D4"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="106" r="64" fill="url(#halo)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 青丘暮山 -->
  <g fill="#C8A060" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 满山小狐（花下，安然） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="44" cy="142" rx="6" ry="4.6" fill="#E4DCCE" stroke="#C0B8A8" stroke-width="0.7"/>
    <circle cx="44" cy="135" r="3.8" fill="#E4DCCE" stroke="#C0B8A8" stroke-width="0.6"/>
    <path d="M 41 134 Q 39 132 39 130" stroke="#E4DCCE" stroke-width="1" stroke-linecap="round"/>
    <circle cx="42" cy="134" r="1" fill="#4A3820"/>
    <circle cx="46" cy="134" r="1" fill="#4A3820"/>
    <path d="M 42 136 Q 44 137 46 136" stroke="#B09A8A" stroke-width="0.5" stroke-linecap="round" fill="none"/>
    <path d="M 40 142 L 38 145 M 48 142 L 50 145" stroke="#B0A89A" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="70" cy="145" rx="5.4" ry="4" fill="#D8D0C2" stroke="#B0A898" stroke-width="0.7"/>
    <circle cx="70" cy="139" r="3.4" fill="#D8D0C2" stroke="#B0A898" stroke-width="0.6"/>
    <path d="M 67.5 138 Q 66 136 66 134" stroke="#D8D0C2" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="68" cy="138" r="0.9" fill="#4A3820"/>
    <circle cx="72" cy="138" r="0.9" fill="#4A3820"/>
    <path d="M 66 145 L 64 148 M 74 145 L 76 148" stroke="#A8A090" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 幼狐（左前，仰头问福） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 90 142 Q 100 140 106 134" stroke="url(#fur)" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 90 142;8 90 142;0 90 142" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 身体（蹲坐仰头） -->
    <ellipse cx="96" cy="134" rx="8" ry="6.4" fill="url(#fur)" stroke="#C0B8A8" stroke-width="0.7"/>
    <path d="M 91 138 L 90 145 M 101 138 L 102 145" stroke="#C0B8A8" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 额间灵光 -->
    <circle cx="94" cy="124" r="2.4" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 幼狐头（仰头问福） -->
  <g>
    <ellipse cx="94" cy="120" rx="7.5" ry="6.8" fill="url(#fur)" stroke="#C0B8A8" stroke-width="0.7"/>
    <path d="M 88 116 L 84 108 L 90 113 Z" fill="url(#fur)" stroke="#C0B8A8" stroke-width="0.5"/>
    <path d="M 100 116 L 104 108 L 98 113 Z" fill="url(#fur)" stroke="#C0B8A8" stroke-width="0.5"/>
    <!-- 眼（仰慕） -->
    <circle cx="90" cy="120" r="1.8" fill="#4A3820"/>
    <circle cx="90.5" cy="119.6" r="0.6" fill="#FFF"/>
    <circle cx="99" cy="120" r="1.8" fill="#4A3820"/>
    <circle cx="99.5" cy="119.6" r="0.6" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="94" cy="123.5" rx="1.1" ry="0.8" fill="#C8A89A"/>
    <!-- 问福小嘴（张） -->
    <path d="M 91 126 Q 94 127.2 97 126" fill="none" stroke="#B09A8A" stroke-width="0.7" stroke-linecap="round"/>
  </g>

  <!-- 老九尾狐（九尾如屏，垂首看幼狐） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 九尾（如屏） -->
    <g stroke="url(#fur)" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M 116 124 Q 134 112 140 94">
        <animateTransform attributeName="transform" type="rotate" values="0 116 124;5 116 124;0 116 124" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 118 126 Q 140 120 152 106">
        <animateTransform attributeName="transform" type="rotate" values="0 118 126;4 118 126;0 118 126" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 116 128 Q 138 130 152 120">
        <animateTransform attributeName="transform" type="rotate" values="0 116 128;3 116 128;0 116 128" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 126 126 Q 140 136 148 140">
        <animateTransform attributeName="transform" type="rotate" values="0 126 126;2 126 126;0 126 126" dur="3.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 尾尖灵光如星 -->
    <g fill="#FFE8A0" opacity="0.7">
      <circle cx="140" cy="92" r="1.8"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="152" cy="104" r="1.6"><animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- 身体 -->
    <ellipse cx="112" cy="122" rx="13" ry="9.5" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 104 128 L 102 138 M 120 128 L 122 138" stroke="#C8C0AE" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 额间灵光 -->
    <circle cx="110" cy="108" r="3.6" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 老狐头（垂首看幼狐，温和） -->
  <g>
    <ellipse cx="110" cy="102" rx="9.5" ry="8.5" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.8"/>
    <path d="M 102 96 L 97 86 L 105 92 Z" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.6"/>
    <path d="M 118 96 L 123 86 L 115 92 Z" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.6"/>
    <!-- 眼（温和，微眯） -->
    <path d="M 104 101 Q 106 99 108 101 M 113 101 Q 115 99 117 101" fill="none" stroke="#4A3820" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="106" cy="101.6" r="2" fill="#4A3820"/>
    <circle cx="106.5" cy="101.2" r="0.7" fill="#FFF"/>
    <circle cx="115" cy="101.6" r="2" fill="#4A3820"/>
    <circle cx="115.5" cy="101.2" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="110" cy="105" rx="1.3" ry="0.9" fill="#C8A89A"/>
    <!-- 温和笑 -->
    <path d="M 106 108 Q 110 109.4 114 108" fill="none" stroke="#B09A8A" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 落灵光如星 -->
  <g fill="#FFE8A0">
    <circle cx="98" cy="112" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="106" cy="116" r="1.1">
      <animateTransform attributeName="transform" type="translate" values="0 0;1 6;0 0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.12;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮霞星尘 -->
  <g fill="#FFF8E0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
