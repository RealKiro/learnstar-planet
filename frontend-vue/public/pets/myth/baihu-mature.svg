<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="白虎·四阶·镇西初成·一爪按前低吼退恶兽小兽蹭腿">
  <defs>
    <!-- 背景：西丘夕照 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8A8"/>
      <stop offset="52%" stop-color="#D8BC84"/>
      <stop offset="100%" stop-color="#9EB078"/>
    </linearGradient>
    <!-- 吼威青光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8F4F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白虎毛（如月） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E6E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.48;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#C8A868" opacity="0.45">
    <path d="M 0 122 Q 60 114 130 120 Q 170 124 200 118 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 西丘 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9EAE72" opacity="0.8"/>
  <path d="M 0 148 L 200 148" stroke="#C0CC88" stroke-width="1.4" opacity="0.55"/>

  <!-- 被救下的小兽（左前，蹭腿） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="62" cy="142" rx="6.5" ry="5" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.7"/>
    <circle cx="62" cy="135" r="4" fill="#D8CCB4" stroke="#B8AC96" stroke-width="0.6"/>
    <path d="M 59 133.6 Q 57 131.6 57 129.6" stroke="#D8CCB4" stroke-width="1" stroke-linecap="round"/>
    <circle cx="60" cy="134" r="1" fill="#3A342E"/>
    <circle cx="65" cy="134" r="1" fill="#3A342E"/>
    <path d="M 60 136.5 Q 62 137.4 64 136.5" stroke="#A89882" stroke-width="0.5" stroke-linecap="round" fill="none"/>
    <path d="M 58 142 L 56 146 M 66 142 L 68 146" stroke="#B8AC96" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 逃窜的恶兽（右，背影仓皇） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 身 -->
    <ellipse cx="158" cy="128" rx="12" ry="8.5" fill="#4E463E" stroke="#3A342E" stroke-width="0.9"/>
    <!-- 腿（奔逃） -->
    <path d="M 150 134 L 148 144 M 166 134 L 168 144" stroke="#4E463E" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 尾（夹紧） -->
    <path d="M 170 130 L 178 134" stroke="#4E463E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 头（回望惊惧） -->
    <ellipse cx="146" cy="118" rx="7.5" ry="6.5" fill="#4E463E" stroke="#3A342E" stroke-width="0.7"/>
    <circle cx="143" cy="116.5" r="1.4" fill="#C84030" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 白虎（一爪按前，低吼镇西） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 尾（如鞭，微扬） -->
    <path d="M 116 130 Q 128 122 134 112" stroke="url(#fur)" stroke-width="3.2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 116 130;6 116 130;0 116 130" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="135" cy="110" r="1.8" fill="#3A342E"/>
    <!-- 身体 -->
    <ellipse cx="100" cy="126" rx="17" ry="10.5" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.9"/>
    <!-- 前爪（按前，镇） -->
    <path d="M 88 122 L 78 130 L 74 138" stroke="url(#fur)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 74 136 L 68 136 L 70 141 L 78 139 Z" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.6"/>
    <!-- 后腿 -->
    <path d="M 106 133 L 108 143 M 90 133 L 88 143" stroke="#C8C2B8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 爪下镇威（地面震纹） -->
    <g stroke="#FFF4D0" stroke-width="1.2" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M 62 140 Q 70 138 78 140">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 白虎头（虎目含威却护弱，低吼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <ellipse cx="100" cy="104" rx="13" ry="11.5" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.9"/>
    <!-- 耳 -->
    <path d="M 88 95 L 82 84 L 93 92 Z" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.6"/>
    <path d="M 112 95 L 118 84 L 107 92 Z" fill="url(#fur)" stroke="#C0BAB0" stroke-width="0.6"/>
    <!-- 王纹（威严） -->
    <path d="M 100 93 L 100 88 M 95 91 L 105 91 M 97 89.6 L 103 89.6" stroke="#24180E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 虎目（含威含温） -->
    <path d="M 90 102 Q 92 100.4 95 102 M 106 102 Q 108 100.4 110 102" stroke="#24180E" stroke-width="1" stroke-linecap="round" fill="none"/>
    <circle cx="93" cy="103" r="2.6" fill="#24180E"/>
    <circle cx="93.6" cy="102.4" r="0.8" fill="#FFF"/>
    <circle cx="108" cy="103" r="2.6" fill="#24180E"/>
    <circle cx="108.6" cy="102.4" r="0.8" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="100" cy="108" rx="2.2" ry="1.6" fill="#C89088"/>
    <!-- 低吼（露齿镇） -->
    <path d="M 96 111 Q 100 112.8 104 111" fill="none" stroke="#A8A098" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 97 111 L 98 113 M 100 112 L 100 114 M 103 111 L 102 113" stroke="#FFF" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 吼威震纹 -->
    <g stroke="#C8D8E8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M 112 96 Q 120 92 126 86">
        <animate attributeName="opacity" values="0.55;0.18;0.55" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 114 110 Q 122 112 128 114">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 夕照星尘 -->
  <g fill="#FFF4D0">
    <circle cx="38" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
