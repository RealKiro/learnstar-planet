<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="毕方·六阶·火鸟传说·暮色拨雏鸟羽尖火苗传灯">
  <defs>
    <!-- 背景：林间暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C088"/>
      <stop offset="52%" stop-color="#DCAE74"/>
      <stop offset="100%" stop-color="#A8C088"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#FFD8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽 -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E86848"/>
      <stop offset="100%" stop-color="#D05038"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="106" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <g fill="#C8A060" opacity="0.5">
    <path d="M 0 132 Q 50 122 110 130 Q 160 134 200 126 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7E9E5E" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#9EBE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 山林 -->
  <g stroke="#5E8E5E" stroke-width="2.6" stroke-linecap="round" opacity="0.6">
    <path d="M 12 44 Q 10 96 6 160 M 176 42 Q 180 98 186 160"/>
  </g>
  <g fill="#6EA868" opacity="0.7">
    <path d="M 12 48 Q 6 42 4 34 Q 10 40 12 48 Z"/>
    <path d="M 176 46 Q 182 40 184 32 Q 178 38 176 46 Z"/>
  </g>

  <!-- 雏鸟（左下，一足立，羽尖跳火） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 一足 -->
    <path d="M 64 138 L 64 148" stroke="#D05038" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 64 148 L 61 151 M 64 148 L 67 151" stroke="#D05038" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="64" cy="132" rx="10" ry="8" fill="#E86848" stroke="#A83828" stroke-width="0.8"/>
    <circle cx="60" cy="128" r="1.6" fill="#F08868" opacity="0.8"/>
    <!-- 尾羽 -->
    <path d="M 72 135 Q 77 137 80 135" stroke="#D05038" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 雏鸟头 -->
  <g>
    <ellipse cx="64" cy="120" rx="7.5" ry="6.8" fill="#E86848" stroke="#A83828" stroke-width="0.7"/>
    <path d="M 62 114 Q 61 111 62 109 M 65 114 Q 66 110 67 109" stroke="#F08868" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="119" r="1.8" fill="#24180E"/>
    <circle cx="60.5" cy="118.6" r="0.6" fill="#FFF"/>
    <circle cx="68" cy="119" r="1.8" fill="#24180E"/>
    <circle cx="68.5" cy="118.6" r="0.6" fill="#FFF"/>
    <path d="M 57 122 L 53 121 L 57 123 Z" fill="#D89078"/>
    <!-- 羽尖小火苗（跳） -->
    <g fill="#FF9048">
      <path d="M 64 113 Q 62 109 64 106 Q 66 109 64 113 Z">
        <animateTransform attributeName="transform" type="scale" values="0.8 0.8;1.2 1.2;0.8 0.8" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 老毕方（拨雏鸟火苗，传灯） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 一足 -->
    <path d="M 112 124 L 112 138" stroke="#D05038" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 112 138 L 109 141 M 112 138 L 115 141" stroke="#D05038" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="112" cy="118" rx="13" ry="10" fill="url(#feather)" stroke="#A83828" stroke-width="0.9"/>
    <!-- 尾羽 -->
    <path d="M 123 121 Q 129 123 133 121" stroke="#D05038" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 老毕方头（垂首看雏鸟，拨火） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 110 102;6 110 102;0 110 102" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="110" cy="102" rx="9" ry="8" fill="url(#feather)" stroke="#A83828" stroke-width="0.8"/>
    <path d="M 108 95 Q 106 91 108 88 M 111 95 Q 112 90 114 88" stroke="#F08868" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 眼（温和） -->
    <path d="M 105 101 Q 107 100 109 101 M 114 101 Q 116 100 118 101" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="107" cy="102" r="2" fill="#24180E"/>
    <circle cx="107.5" cy="101.6" r="0.6" fill="#FFF"/>
    <circle cx="116" cy="102" r="2" fill="#24180E"/>
    <circle cx="116.5" cy="101.6" r="0.6" fill="#FFF"/>
    <path d="M 102 104 L 97 103 L 102 106 Z" fill="#D89078"/>
  </g>

  <!-- 拨火的喙尖（轻触雏鸟火苗） -->
  <path d="M 98 103 Q 92 104 86 108 Q 82 110 78 112" stroke="#D89078" stroke-width="2" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 98 103;3 98 103;0 98 103" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- 传灯的微光 -->
  <circle cx="78" cy="112" r="5" fill="#FFD8A0" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 暮霞星尘 -->
  <g fill="#FFF0D0">
    <circle cx="34" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
