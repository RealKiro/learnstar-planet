<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="貔貅·五阶·招财瑞兽·宅门口吞纳四方财气暗吐福光">
  <defs>
    <!-- 背景：宅院晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8A0"/>
      <stop offset="52%" stop-color="#E0C488"/>
      <stop offset="100%" stop-color="#C0A870"/>
    </linearGradient>
    <!-- 财气金光 -->
    <radialGradient id="glow" cx="46%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 貔貅金毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D080"/>
      <stop offset="100%" stop-color="#D8B060"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 财气 -->
  <circle cx="92" cy="100" r="62" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 宅院（背景） -->
  <path d="M 120 130 Q 150 120 180 128 L 196 200 L 120 200 Z" fill="#B08A5E" stroke="#96683E" stroke-width="1.2"/>
  <path d="M 134 130 Q 158 122 178 130" stroke="#C8A878" stroke-width="1" opacity="0.7" fill="none"/>
  <path d="M 150 124 L 152 116 M 162 122 L 163 115" stroke="#96683E" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 红灯笼 -->
  <circle cx="142" cy="138" r="4" fill="#E06048" stroke="#B84834" stroke-width="0.8">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="174" cy="140" r="4" fill="#E06048" stroke="#B84834" stroke-width="0.8">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 四方财气（汇聚） -->
  <g stroke="#FFE8A0" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 30 60 Q 50 70 66 80">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 100 Q 40 100 58 98">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 40 130 Q 56 122 66 112">
      <animate attributeName="opacity" values="0.5;0.22;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 财气星 -->
  <g fill="#FFE8A0">
    <circle cx="40" cy="70" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 4;0 0" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="110" r="1.3">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#9E8A5E" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#BEA878" stroke-width="1.4" opacity="0.7"/>

  <!-- 貔貅（气定神闲，吞纳） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 尾 -->
    <path d="M 96 132 Q 106 128 112 122" stroke="#D8B060" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 96 132;6 96 132;0 96 132" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 身体（雄浑） -->
    <path d="M 64 114 Q 60 126 70 132 Q 84 140 96 132 Q 102 126 98 114 Q 84 108 64 114 Z" fill="url(#fur)" stroke="#B88E3E" stroke-width="1"/>
    <!-- 鬃毛 -->
    <path d="M 68 108 Q 76 100 84 102" stroke="#F0D890" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 腿 -->
    <path d="M 70 130 L 68 142 M 92 130 L 94 142" stroke="#B88E3E" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- 头（气定神闲） -->
  <g>
    <ellipse cx="68" cy="104" rx="12" ry="10" fill="url(#fur)" stroke="#B88E3E" stroke-width="1"/>
    <!-- 一角（如圭） -->
    <path d="M 72 96 Q 76 86 82 80" stroke="#F0E0C0" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="83" cy="79" r="2.4" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- 眼（气定神闲） -->
    <path d="M 61 102 Q 63 101 65 102 M 73 102 Q 75 101 77 102" stroke="#24180E" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <circle cx="63" cy="103" r="2.4" fill="#24180E"/>
    <circle cx="63.6" cy="102.4" r="0.8" fill="#FFF"/>
    <circle cx="75" cy="103" r="2.4" fill="#24180E"/>
    <circle cx="75.6" cy="102.4" r="0.8" fill="#FFF"/>
    <!-- 大嘴（吞纳，含福） -->
    <path d="M 56 108 Q 62 111 68 108" fill="none" stroke="#8E6E2E" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 鼻 -->
    <ellipse cx="68" cy="110" rx="2.2" ry="1.6" fill="#8E6E2E"/>
    <!-- 吞纳的福光 -->
    <circle cx="64" cy="96" r="4" fill="#FFE8A0" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF0C8">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
