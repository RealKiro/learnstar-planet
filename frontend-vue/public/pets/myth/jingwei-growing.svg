<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="精卫·三阶·衔石苦修·西山与东海间衔石飞越日复一日">
  <defs>
    <!-- 背景：山海之间 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8CCE0"/>
      <stop offset="52%" stop-color="#8AB0CC"/>
      <stop offset="100%" stop-color="#6E9AB8"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="40%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#FFF0D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白羽 -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F0F2"/>
      <stop offset="100%" stop-color="#D8D8E0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 晨光 -->
  <circle cx="80" cy="48" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 朝阳（左） -->
  <circle cx="36" cy="108" r="12" fill="#FFF0D8" opacity="0.9"/>

  <!-- 西山（左） -->
  <g fill="#7E9E6E" opacity="0.85">
    <path d="M 0 120 L 30 82 L 56 120 Z"/>
    <path d="M 20 120 L 40 96 L 58 120 Z" opacity="0.7"/>
  </g>
  <!-- 东海（右） -->
  <path d="M 120 120 Q 150 114 200 118 L 200 200 L 120 200 Z" fill="#5E8EC8" opacity="0.85"/>
  <path d="M 120 120 Q 150 114 200 118" stroke="#8EB8E0" stroke-width="1.2" opacity="0.6"/>
  <path d="M 140 132 Q 160 130 180 132" stroke="#A8D0E8" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 地面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#8E9E76" opacity="0.9"/>
  <path d="M 0 146 L 200 146" stroke="#AEBE96" stroke-width="1.2" opacity="0.6"/>

  <!-- 往返的虚影轨迹（日复一日） -->
  <g stroke="#F0F0F2" stroke-width="1" opacity="0.3" stroke-dasharray="4 6" fill="none">
    <path d="M 44 100 Q 80 72 116 96"/>
    <path d="M 52 92 Q 84 68 112 90"/>
  </g>

  <!-- 精卫（衔石，飞越） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 赤足（收） -->
    <path d="M 92 112 Q 88 118 86 122" stroke="#D85050" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="96" cy="104" rx="12" ry="8" fill="url(#feather)" stroke="#B8B8C4" stroke-width="0.8"/>
    <!-- 翅（张，飞越） -->
    <path d="M 90 100 Q 76 90 68 78 Q 78 86 88 94 Z" fill="#E8E8EC" stroke="#B8B8C4" stroke-width="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 90 100;-14 90 100;0 90 100" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 102 100 Q 116 90 124 78 Q 114 86 104 94 Z" fill="#E8E8EC" stroke="#B8B8C4" stroke-width="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 102 100;14 102 100;0 102 100" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 头（黑首，白喙，衔石，坚定） -->
  <g>
    <ellipse cx="84" cy="102" rx="6.5" ry="6" fill="#2E2E3A" stroke="#1E1E2A" stroke-width="0.6"/>
    <path d="M 78 103 L 70 104 L 78 105 Z" fill="#F0F0F2"/>
    <!-- 衔着的石 -->
    <path d="M 66 103 Q 68 101 71 102 Q 73 104 70 106 Q 67 105 66 103 Z" fill="#8E96A2" stroke="#6E7682" stroke-width="0.6"/>
    <!-- 眼（坚定） -->
    <path d="M 82 100 Q 84 99 86 100" stroke="#1E1E2A" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="84" cy="101" r="1.4" fill="#24180E"/>
    <circle cx="84.4" cy="100.7" r="0.5" fill="#FFF"/>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#FFF0D8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
