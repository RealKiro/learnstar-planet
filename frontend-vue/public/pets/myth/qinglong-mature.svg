<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="青龙·四阶·布春初成·盘旋布春雨满田新苗回绿">
  <defs>
    <!-- 背景：东方春野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8EC"/>
      <stop offset="52%" stop-color="#9CC0D8"/>
      <stop offset="100%" stop-color="#7EA88C"/>
    </linearGradient>
    <!-- 春辉 -->
    <radialGradient id="glow" cx="44%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#F0FAF4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F0FAF4" stop-opacity="0"/>
    </radialGradient>
    <!-- 青鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AC8B8"/>
      <stop offset="100%" stop-color="#5EB0A0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="46" r="84" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云（上，渐散） -->
  <g fill="#EAF4F2" opacity="0.9">
    <path d="M 0 78 Q 30 68 60 76 Q 90 84 120 76 Q 150 68 180 76 L 200 72 L 200 88 L 0 88 Z"/>
  </g>

  <!-- 春田（满田新绿） -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#5E9E5E" opacity="0.85"/>
  <path d="M 0 146 L 200 146" stroke="#7EBE7E" stroke-width="1.4" opacity="0.6"/>
  <!-- 新苗（绿，成排） -->
  <g stroke="#7EB86A" stroke-width="1.8" stroke-linecap="round" opacity="0.95">
    <path d="M 40 146 Q 38 138 36 130 M 60 146 Q 60 138 58 130 M 80 146 Q 80 138 78 130 M 100 146 Q 100 138 98 130 M 120 146 Q 120 138 118 130 M 140 146 Q 140 138 138 130">
      <animateTransform attributeName="transform" type="rotate" values="0 80 146;3 80 146;0 80 146" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 春雨 -->
  <g stroke="#C8E8E0" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
    <path d="M 50 92 L 48 112 M 70 90 L 68 112 M 90 92 L 88 114 M 110 90 L 108 112 M 130 92 L 128 112">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 农人（拜谢） -->
  <g opacity="0.9">
    <path d="M 156 132 L 154 146 L 158 146 L 160 132 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.7"/>
    <circle cx="158" cy="126" r="3.8" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.5"/>
    <path d="M 160 130 L 168 126 M 168 126 L 170 128" stroke="#7E6E4E" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 152 123 Q 158 119 164 123 L 152 123 Z" fill="#C8A860" stroke="#A88840" stroke-width="0.5"/>
  </g>

  <!-- 青鳞青龙（盘旋，长吟布春雨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 蛇身（盘旋） -->
    <path d="M 66 116 C 82 104 102 100 118 106 Q 130 112 138 120" fill="none" stroke="url(#scale)" stroke-width="7" stroke-linecap="round"/>
    <!-- 翼鳍 -->
    <path d="M 84 104 Q 66 84 56 62 Q 72 80 90 96 Z" fill="#9ED8C8" stroke="#5EB0A0" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 84 104;-12 84 104;0 84 104" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 110 104 Q 128 84 138 62 Q 122 80 104 96 Z" fill="#9ED8C8" stroke="#5EB0A0" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 110 104;12 110 104;0 110 104" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 龙角 -->
    <path d="M 68 108 L 64 100 M 72 108 L 76 100" stroke="#E0D088" stroke-width="2" stroke-linecap="round"/>
    <!-- 头（长吟） -->
    <ellipse cx="70" cy="112" rx="9" ry="8" fill="url(#scale)" stroke="#4A9E8E" stroke-width="0.8"/>
    <path d="M 65 110 Q 67 109 69 110 M 74 110 Q 76 109 78 110" stroke="#24180E" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="67" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="67.6" cy="110.4" r="0.8" fill="#FFF"/>
    <circle cx="76" cy="111" r="2.4" fill="#24180E"/>
    <circle cx="76.6" cy="110.4" r="0.8" fill="#FFF"/>
    <!-- 长吟声波 -->
    <g stroke="#F0FAF4" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
      <path d="M 62 104 Q 56 98 58 90">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 春辉星尘 -->
  <g fill="#F0FAF4">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
