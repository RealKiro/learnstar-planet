<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="应龙·二阶·旱魃之危·飞过龟裂大地呼云即散">
  <defs>
    <!-- 背景：龟裂大地，烈日 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0C898"/>
      <stop offset="52%" stop-color="#C4AC7C"/>
      <stop offset="100%" stop-color="#A89868"/>
    </linearGradient>
    <!-- 烈日 -->
    <radialGradient id="glow" cx="74%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青白鳞（沾尘） -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8AB0D0"/>
      <stop offset="100%" stop-color="#6E96B8"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 烈日 -->
  <circle cx="148" cy="40" r="15" fill="#FFF8D8"/>
  <circle cx="148" cy="40" r="42" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.7;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FFF8D8" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <path d="M 160 52 L 168 62 M 154 58 L 158 68 M 176 40 L 188 42">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 龟裂大地 -->
  <path d="M 0 144 L 200 144 L 200 200 L 0 200 Z" fill="#9E8A5E" opacity="0.9"/>
  <path d="M 0 144 L 200 144" stroke="#BEA878" stroke-width="1.4" opacity="0.7"/>
  <g stroke="#8E7A4E" stroke-width="1.2" opacity="0.6" fill="none">
    <path d="M 20 150 L 44 148 L 52 156 M 80 152 L 96 148 L 104 158 M 140 150 L 158 154 L 170 148"/>
  </g>

  <!-- 焦黄幼苗（弯着腰） -->
  <g stroke="#A89858" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <path d="M 56 142 Q 54 136 52 128"/>
    <path d="M 54 134 Q 50 132 48 128"/>
  </g>
  <!-- 干涸的池塘 -->
  <ellipse cx="120" cy="152" rx="24" ry="6" fill="#B0A070" opacity="0.7"/>
  <path d="M 104 152 Q 120 150 136 152" stroke="#8E7A4E" stroke-width="1" opacity="0.7" fill="none"/>

  <!-- 应龙幼龙（飞过，呼云即散） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 蛇身（飞） -->
    <path d="M 64 106 C 76 100 88 96 100 98 C 110 100 118 106 124 112" fill="none" stroke="url(#scale)" stroke-width="6" stroke-linecap="round"/>
    <!-- 翼（展开，略干） -->
    <path d="M 76 100 Q 66 88 62 74 Q 72 82 82 90 Z" fill="#9EC4DC" stroke="#6E96B8" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 76 100;-8 76 100;0 76 100" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 98 98 Q 108 86 112 72 Q 102 80 92 90 Z" fill="#9EC4DC" stroke="#6E96B8" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 98 98;8 98 98;0 98 98" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 龙角 -->
    <path d="M 64 98 L 60 90 M 68 98 L 72 90" stroke="#C8B868" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="66" cy="102" rx="8" ry="7" fill="url(#scale)" stroke="#5E86A8" stroke-width="0.8"/>
    <!-- 眼（焦灼） -->
    <circle cx="61" cy="100" r="2.2" fill="#24180E"/>
    <circle cx="72" cy="100" r="2.2" fill="#24180E"/>
    <!-- 吻须 -->
    <path d="M 74 103 Q 80 106 84 104" stroke="#6E96B8" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 呼云即散（几缕散云） -->
    <g stroke="#F4F8EE" stroke-width="1.2" opacity="0.5" stroke-linecap="round" fill="none">
      <path d="M 84 104 Q 90 106 96 104">
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M 92 108 Q 100 110 108 108">
        <animate attributeName="opacity" values="0.4;0.12;0.4" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 翼挡日头（给幼苗一丝影） -->
    <path d="M 112 72 Q 108 80 104 86" stroke="#8AB0D0" stroke-width="1" opacity="0.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 灼热尘 -->
  <g fill="#FFF8D8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
