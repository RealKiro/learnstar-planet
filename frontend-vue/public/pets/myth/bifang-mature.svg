<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="毕方·四阶·火警初成·夜林盘旋示警羽尖红光林户扑火">
  <defs>
    <!-- 背景：夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4E68"/>
      <stop offset="52%" stop-color="#2E4058"/>
      <stop offset="100%" stop-color="#263650"/>
    </linearGradient>
    <!-- 警红光 -->
    <radialGradient id="glow" cx="46%" cy="36%" r="46%">
      <stop offset="0%" stop-color="#FFB878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFB878" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽（如灯） -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E86848"/>
      <stop offset="100%" stop-color="#D05038"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 警红光 -->
  <circle cx="92" cy="80" r="62" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 夜林 -->
  <g stroke="#2A3A52" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 12 44 L 4 160 M 28 52 L 20 160 M 176 40 L 186 160"/>
  </g>

  <!-- 暗火（林缘闷燃） -->
  <g fill="#FF9048" opacity="0.6">
    <path d="M 140 140 Q 144 130 150 134 Q 154 138 146 146 Z"/>
    <path d="M 156 144 Q 160 136 166 140 Q 168 146 160 152 Z"/>
  </g>
  <!-- 暗烟 -->
  <g stroke="#8E7E6E" stroke-width="1.6" opacity="0.5" stroke-linecap="round" fill="none">
    <path d="M 150 130 Q 148 122 152 114">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#1E2C44" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#4A5E78" stroke-width="1.2" opacity="0.5"/>

  <!-- 林户（惊醒，扑火） -->
  <g opacity="0.9">
    <path d="M 116 130 L 114 144 L 118 144 L 120 130 Z" fill="#7E6E4E" stroke="#6E5E3E" stroke-width="0.8"/>
    <circle cx="118" cy="124" r="4" fill="#9E8E6E" stroke="#6E5E3E" stroke-width="0.6"/>
    <!-- 提桶扑火 -->
    <path d="M 114 128 L 108 124 M 108 124 L 106 130" stroke="#7E6E4E" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 104 128 L 108 130 L 106 134 L 102 132 Z" fill="#8EB8C8" stroke="#5E7E8E" stroke-width="0.6"/>
    <!-- 惊醒 -->
    <path d="M 120 121 Q 122 119 124 121" stroke="#4E3E2E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 毕方（盘旋示警，羽尖红光如信号） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 一足（收） -->
    <path d="M 88 112 Q 84 116 82 120" stroke="#D05038" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 身体（盘旋） -->
    <ellipse cx="92" cy="102" rx="13" ry="9" fill="url(#feather)" stroke="#A83828" stroke-width="0.9"/>
    <!-- 翼（张，盘旋） -->
    <path d="M 84 98 Q 70 88 62 78 Q 72 86 82 92 Z" fill="#D05038" stroke="#98382A" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 84 98;-12 84 98;0 84 98" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 98 Q 114 88 122 78 Q 112 86 102 92 Z" fill="#D05038" stroke="#98382A" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="0 100 98;12 100 98;0 100 98" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 头（锐亮，示警） -->
  <g>
    <ellipse cx="92" cy="88" rx="8.5" ry="7.5" fill="url(#feather)" stroke="#A83828" stroke-width="0.8"/>
    <path d="M 90 82 Q 88 78 90 75 M 93 82 Q 94 77 96 75" stroke="#F08868" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="87" cy="87" r="2" fill="#24180E"/>
    <circle cx="87.5" cy="86.5" r="0.7" fill="#FFF"/>
    <circle cx="97" cy="87" r="2" fill="#24180E"/>
    <circle cx="97.5" cy="86.5" r="0.7" fill="#FFF"/>
    <path d="M 84 90 L 79 89 L 84 92 Z" fill="#D89078"/>
    <!-- 嘶鸣 -->
    <path d="M 79 88 L 77 86" stroke="#D89078" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 羽尖红光（如信号） -->
  <g>
    <circle cx="92" cy="72" r="4" fill="#FFB878" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.8 0.8;1.3 1.3;0.8 0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#FFD8A0" stroke-width="1.2" opacity="0.7" stroke-linecap="round" fill="none">
      <path d="M 86 66 L 82 60 M 98 66 L 102 60">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <!-- 警圈（扩散） -->
  <g fill="none" stroke="#FFB878" stroke-width="1.2" opacity="0.5">
    <circle cx="92" cy="88" r="20">
      <animateTransform attributeName="transform" type="scale" values="0.6 0.6;1.4 1.4;0.6 0.6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 火光星尘 -->
  <g fill="#FFB878">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
