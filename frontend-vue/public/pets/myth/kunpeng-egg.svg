<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="鲲鹏·一阶·北冥幼鲲·深海潜游抬头望不见海面">
  <defs>
    <!-- 背景：北冥深海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2E4E"/>
      <stop offset="52%" stop-color="#1A2844"/>
      <stop offset="100%" stop-color="#16223A"/>
    </linearGradient>
    <!-- 天光（从海面透下） -->
    <radialGradient id="glow" cx="50%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#C8E0F0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8E0F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 墨黑鳞 -->
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A5264"/>
      <stop offset="100%" stop-color="#323A48"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 天光（一线，从海面透下） -->
  <circle cx="100" cy="20" r="60" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;0.35;0.55" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 94 0 L 106 0 L 110 120 L 90 120 Z" fill="#C8E0F0" opacity="0.12"/>

  <!-- 海面（一线亮） -->
  <path d="M 0 22 Q 50 18 100 22 Q 150 26 200 22" stroke="#A8C8E0" stroke-width="1.2" opacity="0.5" fill="none"/>
  <!-- 海面波光 -->
  <g stroke="#A8C8E0" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <path d="M 30 26 Q 44 24 58 26 M 140 26 Q 156 24 170 26">
      <animate attributeName="opacity" values="0.3;0.15;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 深海气泡 -->
  <g stroke="#6E86A0" stroke-width="1" fill="none" opacity="0.5">
    <circle cx="60" cy="90" r="3"><animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="110" r="2.4"><animate attributeName="cy" values="110;88;110" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="140" r="2"><animate attributeName="cy" values="140;120;140" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 北冥幼鲲（墨黑巨鱼，缓缓游动） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="4s" repeatCount="indefinite"/>
    <!-- 尾（摆动） -->
    <path d="M 136 116 Q 154 110 162 100 Q 158 108 150 114 Z" fill="url(#scale)" stroke="#262E3C" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 136 116;10 136 116;0 136 116" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 身体（巨鱼） -->
    <ellipse cx="104" cy="118" rx="38" ry="18" fill="url(#scale)" stroke="#262E3C" stroke-width="1"/>
    <!-- 鳞纹 -->
    <path d="M 78 112 Q 96 108 116 112 M 74 122 Q 96 126 120 122" stroke="#3A4250" stroke-width="1" opacity="0.6"/>
    <!-- 背鳍 -->
    <path d="M 100 100 Q 104 92 110 96 Q 112 100 108 102 Z" fill="#262E3C"/>
    <!-- 侧鳍 -->
    <path d="M 104 124 Q 104 132 96 134 Q 104 132 110 128 Z" fill="#3A4250" opacity="0.8"/>
    <!-- 眼（望海面） -->
    <circle cx="76" cy="114" r="3" fill="#C8D8E8"/>
    <circle cx="76" cy="113" r="1.5" fill="#16223A"/>
  </g>

  <!-- 抬头望不见海面的渴慕（视线朝上） -->
  <g stroke="#C8E0F0" stroke-width="1" opacity="0.35" stroke-linecap="round" fill="none">
    <path d="M 70 104 Q 72 96 76 88">
      <animate attributeName="opacity" values="0.35;0.15;0.35" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 深海微光 -->
  <g fill="#C8D8E8">
    <circle cx="30" cy="130">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="172" cy="96">
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
