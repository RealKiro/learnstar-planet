<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="烛龙·六阶·归真·开目为昼">
  <defs>
    <!-- 背景：云白通透 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE8DE"/>
      <stop offset="70%" stop-color="#E0E6DF"/>
      <stop offset="100%" stop-color="#C9D6CF"/>
    </linearGradient>
    <!-- 淡金神性微光 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9B37E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C9B37E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bodyFade" cx="20%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#F5F0E8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：远山（淡青） -->
  <path d="M 0 170 Q 40 148 80 162 Q 120 176 150 158 Q 175 146 200 156 L 200 200 L 0 200 Z" fill="#B7C4BD" opacity="0.55"/>
  <path d="M 0 182 Q 60 164 120 178 Q 160 186 200 176 L 200 200 L 0 200 Z" fill="#A9B8B0" opacity="0.5"/>

  <!-- 环境：云海 -->
  <path d="M 0 176 Q 30 168 60 174 Q 90 180 120 172 Q 160 162 200 172 L 200 192 Q 150 184 100 190 Q 50 196 0 190 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- 角色：化入云光的龙（半透明，闭目，尾部渐隐） -->
  <!-- 身体（S 形，向右渐隐） -->
  <path d="M 64 96 C 96 90 116 104 142 100 C 160 97 172 106 182 104" fill="none" stroke="url(#bodyFade)" stroke-width="13" stroke-linecap="round"/>
  <!-- 尾部淡出（更透明、更细） -->
  <path d="M 176 102 C 188 100 196 108 202 106" fill="none" stroke="#F5F0E8" stroke-width="7" stroke-linecap="round" opacity="0.35"/>

  <!-- 头（闭目，侧影） -->
  <ellipse cx="58" cy="94" rx="14" ry="11" fill="#F5F0E8" opacity="0.9" transform="rotate(-10 58 94)"/>
  <!-- 吻部 -->
  <ellipse cx="46" cy="98" rx="8" ry="6" fill="#F5F0E8" opacity="0.85" transform="rotate(-10 46 98)"/>
  <!-- 闭目（入定） -->
  <path d="M 58 90 Q 63 94 69 90" fill="none" stroke="#C9B37E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- 角（化光） -->
  <path d="M 64 84 C 68 76 74 72 80 74" fill="none" stroke="#C9B37E" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>

  <!-- 烛火化为一点淡金光 -->
  <circle cx="42" cy="102" r="7" fill="url(#glow)"/>
  <path d="M 40 100 C 37 94 39 91 40 89 C 41 91 43 94 40 100 Z" fill="#C9B37E" opacity="0.85"/>
  <circle cx="40" cy="100" r="1.2" fill="#FFFFFF" opacity="0.95"/>

  <!-- 归真粒子（光尘四散） -->
  <g fill="#C9B37E">
    <circle cx="88" cy="84" r="1.3" opacity="0.5"/>
    <circle cx="124" cy="92" r="1.1" opacity="0.45"/>
    <circle cx="152" cy="108" r="1" opacity="0.4"/>
    <circle cx="180" cy="96" r="0.9" opacity="0.35"/>
    <circle cx="70" cy="112" r="0.9" opacity="0.4"/>
  </g>
</svg>
