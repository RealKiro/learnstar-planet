<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="烛龙·六阶·道果·烛龙真身开目为昼">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#5B2A5E"/>
      <stop offset="55%" stop-color="#3A1A3E"/>
      <stop offset="100%" stop-color="#1E0E24"/>
    </radialGradient>
    <radialGradient id="body" cx="44%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#E3C254"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </radialGradient>
    <radialGradient id="head" cx="46%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E9CD66"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F0FF"/>
      <stop offset="100%" stop-color="#9AB8F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 紫金背光（呼吸） -->
  <circle cx="100" cy="104" r="84" fill="url(#core)">
    <animate attributeName="r" values="84;94;84" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="72" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 100 104;30 100 104;0 100 104" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 昼夜双光（左日右月） -->
  <circle cx="78" cy="54" r="26" fill="url(#sun)">
    <animate attributeName="r" values="26;32;26" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="122" cy="54" r="26" fill="url(#moon)">
    <animate attributeName="r" values="26;32;26" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 78 54 L 78 40 M 78 54 L 90 54 M 78 54 L 66 54 M 78 54 L 78 68" stroke="#FFF7D6" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 122 54 L 122 42 M 122 54 L 134 54 M 122 54 L 110 54 M 122 54 L 122 66" stroke="#D0E0FF" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

  <!-- 龙身（完整神龙盘踞，金鳞） -->
  <circle cx="100" cy="138" r="48" fill="none" stroke="url(#body)" stroke-width="30"/>
  <circle cx="100" cy="138" r="27" fill="none" stroke="#B8962A" stroke-width="13" opacity="0.5"/>
  <!-- 金鳞 -->
  <path d="M 60 124 Q 68 116 76 122" fill="none" stroke="#E9CD66" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 124 152 Q 132 160 140 152" fill="none" stroke="#E9CD66" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 60 152 Q 68 160 76 154" fill="none" stroke="#E9CD66" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- 颈（从盘身昂起） -->
  <path d="M 100 110 C 88 96 88 74 100 62" fill="none" stroke="url(#body)" stroke-width="17" stroke-linecap="round"/>

  <!-- 头（真身，昂首） -->
  <ellipse cx="100" cy="56" rx="17" ry="15" fill="url(#head)"/>
  <ellipse cx="100" cy="70" rx="10" ry="8" fill="url(#head)"/>

  <!-- 珊瑚角 -->
  <path d="M 86 46 C 78 36 78 26 86 20 L 92 30 L 97 23 L 98 36" fill="none" stroke="#7B2E8B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 114 46 C 122 36 122 26 114 20 L 108 30 L 103 23 L 102 36" fill="none" stroke="#7B2E8B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 双目睁开（日目/月目，放光） -->
  <ellipse cx="92" cy="54" rx="3.6" ry="5" fill="#3A1A0A"/>
  <ellipse cx="108" cy="54" rx="3.6" ry="5" fill="#3A1A0A"/>
  <ellipse cx="92" cy="54" rx="1.6" ry="4.2" fill="#FFF7D6"/>
  <ellipse cx="108" cy="54" rx="1.6" ry="4.2" fill="#D0E0FF"/>
  <!-- 眉 -->
  <path d="M 82 46 Q 92 41 102 45" fill="none" stroke="#B8962A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 118 46 Q 108 41 98 45" fill="none" stroke="#B8962A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 口衔烛（照天） -->
  <path d="M 94 74 Q 100 79 106 74" fill="none" stroke="#B8962A" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="96" y="76" width="8" height="10" rx="1.6" fill="#F5D742"/>
  <path d="M 100 74 C 93 60 96 52 100 47 C 104 52 107 60 100 74 Z" fill="#F97316">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 100 70 C 97 63 98.6 58 100 55.5 C 101.4 58 103 63 100 70 Z" fill="#FFF3C4"/>

  <!-- 须垂 -->
  <path d="M 82 68 C 70 74 60 72 54 80" fill="none" stroke="#7B2E8B" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 118 68 C 130 74 140 72 146 80" fill="none" stroke="#7B2E8B" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- 祥云 -->
  <path d="M 30 176 C 48 168 62 176 80 170 Q 100 164 118 172" fill="none" stroke="#C9B37E" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>

  <!-- 神光粒子 -->
  <g fill="#D4AF37">
    <circle cx="56" cy="116">
      <animate attributeName="cy" values="116;106;116" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="144" cy="112">
      <animate attributeName="cy" values="112;102;112" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
