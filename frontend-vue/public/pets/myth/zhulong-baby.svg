<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="烛龙·二阶·凡尘·衔烛之苗">
  <defs>
    <!-- 背景：青灰压抑，晨光从左上照入 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4452"/>
      <stop offset="100%" stop-color="#262D36"/>
    </linearGradient>
    <!-- 侧光（晨光/灯火） -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="body" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#5A6678"/>
      <stop offset="60%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#39424F"/>
    </radialGradient>
    <radialGradient id="head" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#616E84"/>
      <stop offset="70%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#3B4453"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 侧光从左上方照入 -->
  <polygon points="0,0 150,0 40,200 0,200" fill="url(#side)"/>

  <!-- 环境：山径地面 + 风化纹 -->
  <path d="M 12 168 Q 60 162 100 166 T 196 164" fill="none" stroke="#20272F" stroke-width="2" opacity="0.8"/>
  <path d="M 30 176 Q 80 172 130 178" fill="none" stroke="#39424F" stroke-width="1.4" opacity="0.5"/>
  <path d="M 120 160 l 5 -4 M 138 158 l 4 -3" stroke="#39424F" stroke-width="1" opacity="0.4"/>

  <!-- 角色：幼蛇侧身游弋回望（中偏下，有方向感） -->
  <path d="M 164 148 C 140 158 130 140 106 142 C 82 144 70 134 56 134" fill="none" stroke="url(#body)" stroke-width="13" stroke-linecap="round"/>
  <!-- 尾梢 -->
  <path d="M 164 148 C 176 150 178 160 170 164" fill="none" stroke="url(#body)" stroke-width="9" stroke-linecap="round"/>

  <!-- 角芽 -->
  <path d="M 58 118 C 56 112 58 108 63 106" fill="none" stroke="#8B7E6A" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 头（回望，朝左） -->
  <ellipse cx="52" cy="130" rx="14" ry="12" fill="url(#head)" transform="rotate(-12 52 130)"/>
  <!-- 吻部 -->
  <ellipse cx="40" cy="134" rx="8" ry="6" fill="url(#head)" transform="rotate(-12 40 134)"/>

  <!-- 大眼（回望懵懂） -->
  <circle cx="54" cy="126" r="4.6" fill="#1A1F2A"/>
  <circle cx="55" cy="124.6" r="1.7" fill="#FFF"/>

  <!-- 口衔小烛 -->
  <rect x="31" y="134" width="5" height="7" rx="1.2" fill="#8B7E6A"/>
  <rect x="32" y="134" width="1.2" height="7" fill="#F5E6D3" opacity="0.85"/>
  <path d="M 33.5 134 C 31 128 32.5 124 33.5 121 C 34.5 124 36 128 33.5 134 Z" fill="url(#flame)"/>

  <!-- 须丝 -->
  <path d="M 62 136 C 68 140 72 138 76 142" fill="none" stroke="#8B7E6A" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>

  <!-- 氛围：晨光微粒 -->
  <circle cx="30" cy="110" r="1.3" fill="#E8B84B" opacity="0.6"/>
  <circle cx="150" cy="130" r="1.1" fill="#E8B84B" opacity="0.4"/>
  <circle cx="90" cy="156" r="1" fill="#E8B84B" opacity="0.35"/>
</svg>
