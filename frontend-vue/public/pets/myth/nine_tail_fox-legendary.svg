<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="九尾狐·五阶·九尾祥瑞·九尾如屏灵光笼罩众生祈福">
  <defs>
    <!-- 背景：青丘云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E8C0"/>
      <stop offset="52%" stop-color="#B4D09C"/>
      <stop offset="100%" stop-color="#94B080"/>
    </linearGradient>
    <!-- 灵光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="54%">
      <stop offset="0%" stop-color="#FFF0C0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 九尾祥瑞光 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 奶白绒毛（如月） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFAF4"/>
      <stop offset="100%" stop-color="#EAE2D4"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="66" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 九尾灵光 -->
  <circle cx="100" cy="110" r="64" fill="url(#halo)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海（下） -->
  <g fill="#EAF0F0" opacity="0.9">
    <path d="M 0 128 Q 30 118 60 126 Q 90 134 120 126 Q 150 118 180 126 L 200 122 L 200 200 L 0 200 Z"/>
  </g>
  <g fill="#F6FAF2" opacity="0.9">
    <path d="M 20 132 Q 50 124 80 132 Q 108 138 138 130 Q 168 122 200 130 L 200 200 L 0 200 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 0;0 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山下祈福众生（远景） -->
  <g opacity="0.7">
    <path d="M 40 138 Q 42 132 43 130 Q 45 132 46 138 Z" fill="#7E6E4E"/>
    <circle cx="43" cy="127" r="2.6" fill="#9E8E6E"/>
    <path d="M 60 140 Q 61 134 62 132 Q 64 134 65 140 Z" fill="#8E7E5E"/>
    <circle cx="63" cy="129" r="2.6" fill="#AE9E7E"/>
    <path d="M 78 138 Q 79 132 80 130 Q 82 132 83 138 Z" fill="#7E6E4E"/>
    <circle cx="81" cy="127" r="2.6" fill="#9E8E6E"/>
    <!-- 祈福合十 -->
    <path d="M 43 124 L 43 122 M 63 126 L 63 124 M 81 124 L 81 122" stroke="#6E5E3E" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 青丘之巅（九尾狐所立） -->
  <path d="M 56 136 L 88 110 Q 96 106 104 110 L 132 136 L 56 136 Z" fill="#8EA87E" stroke="#6E8E5E" stroke-width="1"/>
  <path d="M 76 124 Q 96 116 116 124" stroke="#AEC89E" stroke-width="1" opacity="0.6" fill="none"/>

  <!-- 九尾狐（九尾如屏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 九尾（如屏展开） -->
    <g stroke="url(#fur)" stroke-width="3.4" stroke-linecap="round" fill="none">
      <path d="M 104 118 Q 122 106 128 88">
        <animateTransform attributeName="transform" type="rotate" values="0 104 118;6 104 118;0 104 118" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 106 120 Q 128 114 140 100">
        <animateTransform attributeName="transform" type="rotate" values="0 106 120;5 106 120;0 106 120" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 104 122 Q 126 124 140 114">
        <animateTransform attributeName="transform" type="rotate" values="0 104 122;4 104 122;0 104 122" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 96 118 Q 78 106 72 88">
        <animateTransform attributeName="transform" type="rotate" values="0 96 118;-6 96 118;0 96 118" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 94 120 Q 72 114 60 100">
        <animateTransform attributeName="transform" type="rotate" values="0 94 120;-5 94 120;0 94 120" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M 96 122 Q 74 124 60 114">
        <animateTransform attributeName="transform" type="rotate" values="0 96 122;-4 96 122;0 96 122" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 100 124 Q 108 132 116 134">
        <animateTransform attributeName="transform" type="rotate" values="0 100 124;3 100 124;0 100 124" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 100 124 Q 92 132 84 134">
        <animateTransform attributeName="transform" type="rotate" values="0 100 124;-3 100 124;0 100 124" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 100 122 Q 100 132 100 136">
        <animateTransform attributeName="transform" type="rotate" values="0 100 122;2 100 122;0 100 122" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 尾尖灵光 -->
    <g fill="#FFE8A0" opacity="0.7">
      <circle cx="128" cy="86" r="1.8"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="98" r="1.6"><animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="72" cy="86" r="1.8"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- 身体 -->
    <ellipse cx="100" cy="116" rx="14" ry="10" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.9"/>
    <!-- 腿 -->
    <path d="M 92 122 L 90 132 M 108 122 L 110 132" stroke="#C8C0AE" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 额间灵光（如日） -->
    <circle cx="98" cy="102" r="4" fill="#FFE8A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 头（端庄） -->
  <g>
    <ellipse cx="98" cy="96" rx="10" ry="9" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.8"/>
    <path d="M 90 90 L 85 79 L 93 86 Z" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.6"/>
    <path d="M 106 90 L 111 79 L 103 86 Z" fill="url(#fur)" stroke="#C8C0AE" stroke-width="0.6"/>
    <!-- 眼（含慈） -->
    <path d="M 91 94 Q 94 92 96 94 M 101 94 Q 104 92 106 94" fill="none" stroke="#4A3820" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="93" cy="94.8" r="2.2" fill="#4A3820"/>
    <circle cx="93.5" cy="94.4" r="0.7" fill="#FFF"/>
    <circle cx="104" cy="94.8" r="2.2" fill="#4A3820"/>
    <circle cx="104.5" cy="94.4" r="0.7" fill="#FFF"/>
    <!-- 鼻 -->
    <ellipse cx="98" cy="99" rx="1.4" ry="1" fill="#C8A89A"/>
    <!-- 小嘴（端庄） -->
    <path d="M 94 102 Q 98 103.4 102 102" fill="none" stroke="#B09A8A" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 灵光星尘 -->
  <g fill="#FFF0C0">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="166" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
