<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="毕方·一阶·赤羽雏鸟·枝头一足独立羽尖小火苗">
  <defs>
    <!-- 背景：林间 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E4C0"/>
      <stop offset="52%" stop-color="#A4C89C"/>
      <stop offset="100%" stop-color="#84AE7E"/>
    </linearGradient>
    <!-- 林光 -->
    <radialGradient id="glow" cx="44%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F4FFE8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F4FFE8" stop-opacity="0"/>
    </radialGradient>
    <!-- 赤羽 -->
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E86848"/>
      <stop offset="100%" stop-color="#D05038"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.6;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 山林 -->
  <g stroke="#5E8E5E" stroke-width="2.6" stroke-linecap="round" opacity="0.55">
    <path d="M 12 44 Q 10 96 6 160 M 28 52 Q 24 100 18 160 M 176 42 Q 180 98 186 160"/>
  </g>
  <g fill="#6EA868" opacity="0.7">
    <path d="M 12 48 Q 6 42 4 34 Q 10 40 12 48 Z"/>
    <path d="M 176 46 Q 182 40 184 32 Q 178 38 176 46 Z"/>
  </g>
  <!-- 远山 -->
  <path d="M 0 128 Q 50 118 110 126 Q 160 130 200 122 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>
  <!-- 地面 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#6E9E5E" opacity="0.8"/>
  <path d="M 0 146 L 200 146" stroke="#8EB87E" stroke-width="1.4" opacity="0.6"/>

  <!-- 枝头（毕方所立） -->
  <path d="M 60 120 Q 90 108 120 114" stroke="#6E5640" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M 90 110 L 84 100 M 100 110 L 106 100" stroke="#6E5640" stroke-width="2" stroke-linecap="round"/>
  <g fill="#6E9E6E" opacity="0.9">
    <path d="M 84 100 Q 78 94 74 88 Q 80 94 86 96 Z"/>
    <path d="M 106 100 Q 112 94 116 88 Q 110 94 104 96 Z"/>
  </g>

  <!-- 赤羽雏鸟（一足独立，羽尖火苗） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 一足（单足立） -->
    <path d="M 92 122 L 92 134" stroke="#D05038" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 92 134 L 89 137 M 92 134 L 95 137" stroke="#D05038" stroke-width="1.4" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="92" cy="116" rx="12" ry="10" fill="url(#feather)" stroke="#A83828" stroke-width="0.9"/>
    <!-- 羽点 -->
    <circle cx="86" cy="112" r="1.8" fill="#F08868" opacity="0.8"/>
    <!-- 尾羽（短） -->
    <path d="M 102 120 Q 108 122 112 120" stroke="#D05038" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 头（羽尖火苗，急扑不灭） -->
  <g>
    <ellipse cx="92" cy="102" rx="9" ry="8" fill="url(#feather)" stroke="#A83828" stroke-width="0.8"/>
    <!-- 羽冠 -->
    <path d="M 90 95 Q 88 91 90 88 M 93 95 Q 94 90 96 88" stroke="#F08868" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- 眼（圆亮） -->
    <circle cx="87" cy="101" r="2.2" fill="#24180E"/>
    <circle cx="87.6" cy="100.4" r="0.7" fill="#FFF"/>
    <circle cx="97" cy="101" r="2.2" fill="#24180E"/>
    <circle cx="97.6" cy="100.4" r="0.7" fill="#FFF"/>
    <!-- 喙 -->
    <path d="M 84 104 L 79 103 L 84 106 Z" fill="#D89078"/>
    <!-- 羽尖火苗（跳） -->
    <g fill="#FF9048">
      <path d="M 92 94 Q 90 90 92 86 Q 94 90 92 94 Z">
        <animateTransform attributeName="transform" type="scale" values="0.8 0.8;1.2 1.2;0.8 0.8" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g stroke="#FFC080" stroke-width="1" opacity="0.7" stroke-linecap="round">
      <path d="M 90 84 L 89 81 M 94 84 L 95 81">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- 林光星尘 -->
  <g fill="#F4FFE8">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
