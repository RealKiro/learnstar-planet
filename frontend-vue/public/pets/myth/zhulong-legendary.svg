<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="烛龙·五阶·封神·烛龙巡天">
  <defs>
    <!-- 背景：紫金辉煌 -->
    <radialGradient id="bg" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#4A2460"/>
      <stop offset="55%" stop-color="#2E1738"/>
      <stop offset="100%" stop-color="#180D20"/>
    </radialGradient>
    <radialGradient id="body" cx="44%" cy="38%" r="76%">
      <stop offset="0%" stop-color="#E3C254"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </radialGradient>
    <radialGradient id="head" cx="46%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E9CD66"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8962A"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7B2E8B"/>
      <stop offset="50%" stop-color="#A55EC4"/>
      <stop offset="100%" stop-color="#E3B8F2"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 神性：完整圆形背光 -->
  <circle cx="100" cy="104" r="86" fill="#D4AF37" opacity="0.12"/>
  <circle cx="100" cy="104" r="78" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.45"/>
  <circle cx="100" cy="104" r="70" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.22"/>

  <!-- 祥云（底部对称） -->
  <path d="M 26 180 C 44 172 56 178 72 172 C 84 168 96 174 100 170 C 96 176 84 174 72 178 C 58 182 44 180 26 180 Z" fill="#C9B37E" opacity="0.3"/>
  <path d="M 174 180 C 156 172 144 178 128 172 C 116 168 104 174 100 170 C 104 176 116 174 128 178 C 142 182 156 180 174 180 Z" fill="#C9B37E" opacity="0.3"/>

  <!-- 角色：对称盘踞（画幅中偏上，大） -->
  <!-- 圆盘（对称） -->
  <circle cx="100" cy="150" r="40" fill="none" stroke="url(#body)" stroke-width="26"/>
  <circle cx="100" cy="150" r="20" fill="url(#core)"/>
  <!-- 金鳞（对称） -->
  <path d="M 70 132 Q 78 126 86 131" fill="none" stroke="#E3C254" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 114 168 Q 122 174 130 168" fill="none" stroke="#E3C254" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 130 132 Q 122 126 114 131" fill="none" stroke="#E3C254" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- 颈部（对称竖立） -->
  <path d="M 100 126 C 88 108 88 82 100 66" fill="none" stroke="url(#body)" stroke-width="17" stroke-linecap="round"/>

  <!-- 头（俯视威仪） -->
  <ellipse cx="100" cy="58" rx="16" ry="14" fill="url(#head)"/>
  <ellipse cx="100" cy="72" rx="9" ry="7" fill="url(#head)"/>

  <!-- 珊瑚龙角（对称分叉） -->
  <path d="M 87 48 C 79 38 78 28 86 22 L 91 32 L 96 25 L 97 38" fill="none" stroke="#7B2E8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 113 48 C 121 38 122 28 114 22 L 109 32 L 104 25 L 103 38" fill="none" stroke="#7B2E8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 龙目洞彻（俯视） -->
  <ellipse cx="93" cy="56" rx="3" ry="4.6" fill="#3A1A0A"/>
  <ellipse cx="107" cy="56" rx="3" ry="4.6" fill="#3A1A0A"/>
  <ellipse cx="93" cy="56" rx="1.1" ry="3.8" fill="#FFD54F"/>
  <ellipse cx="107" cy="56" rx="1.1" ry="3.8" fill="#FFD54F"/>

  <!-- 口衔烛（朱紫圣焰） -->
  <path d="M 94 78 Q 100 82 106 78" fill="none" stroke="#B8962A" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="96" y="80" width="8" height="9" rx="1.4" fill="#7B2E8B"/>
  <path d="M 100 78 C 93 64 96 56 100 51 C 104 56 107 64 100 78 Z" fill="url(#flame)"/>

  <!-- 须垂 -->
  <path d="M 82 70 C 70 76 60 74 54 82" fill="none" stroke="#7B2E8B" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 118 70 C 130 76 140 74 146 82" fill="none" stroke="#7B2E8B" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- 头后小光环 -->
  <circle cx="100" cy="56" r="30" fill="none" stroke="#FFD54F" stroke-width="1.6" opacity="0.55"/>

  <!-- 祥光万道（对称放射） -->
  <g stroke="#D4AF37" stroke-width="1.4" opacity="0.4" stroke-linecap="round">
    <path d="M 30 70 L 22 62"/>
    <path d="M 170 70 L 178 62"/>
    <path d="M 40 40 L 34 30"/>
    <path d="M 160 40 L 166 30"/>
    <path d="M 24 120 L 16 118"/>
    <path d="M 176 120 L 184 118"/>
  </g>

  <!-- 神光粒子（对称） -->
  <circle cx="54" cy="120" r="1.8" fill="#D4AF37" opacity="0.85"/>
  <circle cx="146" cy="120" r="1.8" fill="#D4AF37" opacity="0.85"/>
  <circle cx="100" cy="186" r="1.5" fill="#E3B8F2" opacity="0.6"/>
  <circle cx="76" cy="150" r="1.2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="124" cy="150" r="1.2" fill="#D4AF37" opacity="0.6"/>
</svg>
