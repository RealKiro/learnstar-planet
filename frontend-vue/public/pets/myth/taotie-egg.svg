<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="饕餮·一阶·幼饕餮·大嘴吞果见伴分食憨憨停下">
  <defs>
    <!-- 背景：山间果林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4C0"/>
      <stop offset="52%" stop-color="#B8CC9E"/>
      <stop offset="100%" stop-color="#8EAE78"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="48%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#F8F4D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F8F4D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 饕餮毛（油亮） -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A9C98"/>
      <stop offset="100%" stop-color="#5E827E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="50" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 果林丘 -->
  <g fill="#5E8E68" opacity="0.35">
    <path d="M 0 104 Q 50 98 110 102 Q 160 106 200 100 L 200 200 L 0 200 Z"/>
  </g>
  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#7EAA7E" opacity="0.8"/>
  <path d="M 0 148 L 200 148" stroke="#A0C89E" stroke-width="1.4" opacity="0.55"/>

  <!-- 果树 -->
  <path d="M 150 146 Q 152 128 146 116" stroke="#6E5640" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M 146 116 Q 134 110 128 102 M 146 116 Q 158 108 164 100" stroke="#6E5640" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <!-- 果（红） -->
  <g fill="#E0684E">
    <circle cx="128" cy="100" r="3.4">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="98" r="3">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 落果（筐边） -->
  <g>
    <circle cx="96" cy="148" r="3" fill="#E0A048"/>
    <circle cx="106" cy="150" r="2.6" fill="#E0684E"/>
  </g>

  <!-- 同伴分食（右，一羊） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="138" cy="138" rx="7.5" ry="5.6" fill="#8EAA98" stroke="#6E8A7A" stroke-width="0.7"/>
    <circle cx="138" cy="130" r="5" fill="#8EAA98" stroke="#6E8A7A" stroke-width="0.6"/>
    <path d="M 134 128 L 132 125 M 142 128 L 144 125" stroke="#8EAA98" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="135.6" cy="129.4" r="1.1" fill="#24180E"/>
    <circle cx="140.4" cy="129.4" r="1.1" fill="#24180E"/>
    <path d="M 136 132 Q 138 133 140 132" stroke="#5E7A6E" stroke-width="0.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 幼饕餮（大嘴吞果，憨憨停下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 羊身（圆壮，油亮） -->
    <ellipse cx="94" cy="134" rx="17" ry="12" fill="url(#fur)" stroke="#4E726E" stroke-width="1"/>
    <!-- 腿 -->
    <path d="M 84 143 L 82 150 M 106 143 L 108 150" stroke="#4E726E" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 尾 -->
    <path d="M 110 138 Q 118 136 120 140" stroke="url(#fur)" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 110 138;8 110 138;0 110 138" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 幼饕餮头（大嘴无齿，双目无辜） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="94" cy="114" rx="14" ry="12" fill="url(#fur)" stroke="#4E726E" stroke-width="1"/>
    <!-- 羊耳（垂） -->
    <path d="M 82 106 L 76 104 L 78 112 Q 82 110 82 106 Z" fill="#6E8E8C"/>
    <path d="M 106 106 L 112 104 L 110 112 Q 106 110 106 106 Z" fill="#6E8E8C"/>
    <!-- 双目（无辜） -->
    <circle cx="88" cy="110" r="3.2" fill="#24180E"/>
    <circle cx="89" cy="109" r="1.2" fill="#FFF"/>
    <circle cx="101" cy="110" r="3.2" fill="#24180E"/>
    <circle cx="102" cy="109" r="1.2" fill="#FFF"/>
    <!-- 大嘴（无齿，吞） -->
    <path d="M 80 120 Q 94 128 108 120 Q 94 124 80 120 Z" fill="#4E5E5A"/>
    <!-- 嘴边果屑（贪） -->
    <circle cx="84" cy="121" r="1.4" fill="#E0A048"/>
    <!-- 憨憨（挠头） -->
    <path d="M 78 108 Q 72 102 74 96" stroke="#6E8E8C" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 78 108;-8 78 108;0 78 108" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 晨光星尘 -->
  <g fill="#F8F4D8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
