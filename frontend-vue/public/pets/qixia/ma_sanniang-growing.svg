<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="马三娘·三阶·潜伏玉蟾宫·回廊夜半紫影暗舞">
  <defs>
    <!-- 背景：玉蟾宫月夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5A8E"/>
      <stop offset="52%" stop-color="#3E4A7E"/>
      <stop offset="100%" stop-color="#2E3A6E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 月下紫 -->
    <radialGradient id="purple" cx="50%" cy="56%" r="42%">
      <stop offset="0%" stop-color="#C8A8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8A8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EBA"/>
      <stop offset="100%" stop-color="#6E4E9A"/>
    </linearGradient>
    <!-- 素裙 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F0F6"/>
      <stop offset="100%" stop-color="#C8D8E4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C4AE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="48" r="42" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 月下紫 -->
  <circle cx="92" cy="112" r="62" fill="url(#purple)">
    <animate attributeName="opacity" values="0.6;0.36;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 玉蟾宫回廊 -->
  <g opacity="0.6">
    <path d="M 26 80 L 34 72 L 62 76 L 60 152 L 26 152 Z" fill="#4E5A7E"/>
    <path d="M 30 96 L 58 100 M 30 110 L 58 114" stroke="#6E7A9E" stroke-width="1"/>
    <path d="M 150 82 L 158 74 L 186 78 L 184 152 L 150 152 Z" fill="#4E5A7E"/>
  </g>

  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="90" cy="24" r="1.1"/><circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E3A5E" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#4E5A7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 紫毛女剑客（6头身，侍女扮相，袖中软剑，夜半舞剑） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 158 L 86 158 L 90 136 Z" fill="#6E4E9A"/>
  <path d="M 98 134 L 106 160 L 100 160 L 94 136 Z" fill="#6E4E9A"/>
  <!-- 素裙（斗篷一角压入腰带） -->
  <path d="M 82 98 Q 78 118 86 136 Q 96 142 104 136 Q 110 118 106 98 Q 94 92 82 98 Z" fill="url(#robe)" stroke="#9EB4C8" stroke-width="1"/>
  <!-- 斗篷角 -->
  <path d="M 106 100 L 116 108 L 112 118 L 102 108 Z" fill="#7E6E9E" stroke="#5E4E7E" stroke-width="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 腰间 -->
  <path d="M 82 118 L 106 118" stroke="#C8D8E8" stroke-width="1.2"/>
  <!-- 尾巴 -->
  <path d="M 108 130 Q 118 124 122 116" stroke="#6E4E9A" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 108 130;10 108 130;0 108 130" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（温顺面容，夜半眼底露剑意，发髻半散） -->
  <ellipse cx="94" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3E8C" stroke-width="0.9"/>
  <!-- 猫耳 -->
  <path d="M 85 84 L 79 70 L 89 78 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 103 84 L 109 70 L 99 78 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 85 82 L 81 72 L 87 78 Z" fill="#D0B0E0"/>
  <path d="M 103 82 L 107 72 L 101 78 Z" fill="#D0B0E0"/>
  <!-- 发髻半散 -->
  <path d="M 92 82 Q 94 76 98 76 Q 101 78 100 82 Q 96 84 92 82 Z" fill="#6E4E9A"/>
  <path d="M 98 77 L 102 72 M 90 82 L 86 78" stroke="#6E4E9A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 细眉 -->
  <path d="M 87 86 Q 90 84.8 93 86 M 95 86 Q 98 84.8 101 86" stroke="#3A263E" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 浅色面斑 -->
  <ellipse cx="94" cy="96" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 夜半眼底露剑意（凤目微亮） -->
  <path d="M 87 90 Q 90 88.6 93 90 L 93 91.6 Q 90 90.2 87 91.6 Z" fill="#1E1008"/>
  <path d="M 101 90 Q 98 88.6 95 90 L 95 91.6 Q 98 90.2 101 91.6 Z" fill="#1E1008"/>
  <circle cx="88.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="99.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="89.6" cy="90.4" r="0.6" fill="#C8A8F0"/>
  <circle cx="98.4" cy="90.4" r="0.6" fill="#C8A8F0"/>
  <!-- 鼻梁挺 -->
  <path d="M 94 93 L 94 95.5" stroke="#B09078" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 薄唇 -->
  <path d="M 90 99 Q 94 100.4 98 99" fill="none" stroke="#A06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（持紫影软剑，暗处一舞） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 84 106;5 84 106;-6 84 106" dur="2s" repeatCount="indefinite"/>
    <path d="M 84 106 C 78 110 76 116 78 122" fill="none" stroke="#E8F0F6" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="78" cy="124" r="3" fill="#F0DCC6"/>
    <!-- 紫影软剑 -->
    <line x1="78" y1="122" x2="56" y2="148" stroke="#C8A8F0" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56 148 L 54 154" stroke="#C8A8F0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑光紫影 -->
    <path d="M 56 148 Q 46 156 40 162" stroke="#C8A8F0" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，敛袖） -->
  <path d="M 104 106 C 110 102 114 98 116 92" fill="none" stroke="#E8F0F6" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="90" r="2.8" fill="#F0DCC6"/>

  <!-- 月下紫星尘 -->
  <g fill="#C8A8F0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
