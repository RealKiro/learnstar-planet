<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="莎丽·四阶·忍辱重练·深夜荒野缠绷带练剑">
  <defs>
    <!-- 背景：夜月荒野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5A8E"/>
      <stop offset="52%" stop-color="#3E4A7E"/>
      <stop offset="100%" stop-color="#2E3A6E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="78%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫云剑微亮 -->
    <radialGradient id="purple" cx="50%" cy="56%" r="40%">
      <stop offset="0%" stop-color="#C8A8F0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C8A8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E5EC0"/>
      <stop offset="100%" stop-color="#6E3EA0"/>
    </linearGradient>
    <!-- 粗布劲装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E6E9E"/>
      <stop offset="100%" stop-color="#5E527E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="156" cy="48" r="42" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="156" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 紫云剑微亮 -->
  <circle cx="92" cy="112" r="54" fill="url(#purple)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 荒原孤石 -->
  <path d="M 60 152 Q 70 144 82 148 Q 90 152 86 158 Q 72 162 60 152 Z" fill="#3E4A6E" stroke="#4E5A7E" stroke-width="1"/>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E3A5E" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#4E5A7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="90" cy="24" r="1.1"/><circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 紫毛松鼠（6头身，粗布劲装，腕缠绷带，练剑） -->
  <!-- 腿 -->
  <path d="M 80 136 L 76 158 L 82 158 L 86 138 Z" fill="#5E3A88"/>
  <path d="M 96 136 L 104 160 L 98 160 L 92 138 Z" fill="#5E3A88"/>
  <!-- 粗布劲装 -->
  <path d="M 78 100 Q 74 118 82 136 Q 92 142 100 136 Q 106 118 102 100 Q 90 94 78 100 Z" fill="url(#robe)" stroke="#4E4274" stroke-width="1"/>
  <!-- 紫带重新系上 -->
  <path d="M 78 118 L 102 118" stroke="#C8A8F0" stroke-width="1.4"/>
  <!-- 蓬松大尾 -->
  <path d="M 104 130 Q 114 124 120 116 Q 124 106 118 102 Q 112 106 112 114 Q 110 122 102 128 Z" fill="#7E50A8" stroke="#5E3A88" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 104 130;8 104 130;0 104 130" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（松鼠脸，圆眼坚韧，颊边蓬毛沾汗，咬牙） -->
  <ellipse cx="90" cy="94" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3490" stroke-width="0.9"/>
  <!-- 松鼠耳 -->
  <path d="M 81 86 L 75 72 L 85 80 Z" fill="#8E5EC0" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 99 86 L 105 72 L 95 80 Z" fill="#8E5EC0" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 81 84 L 77 74 L 83 80 Z" fill="#D8B8E8"/>
  <path d="M 99 84 L 103 74 L 97 80 Z" fill="#D8B8E8"/>
  <!-- 颊边蓬毛 -->
  <path d="M 79 94 Q 74 92 76 98 Q 78 100 82 98" fill="#7E50A8"/>
  <path d="M 101 94 Q 106 92 104 98 Q 102 100 98 98" fill="#7E50A8"/>
  <!-- 汗珠 -->
  <circle cx="96" cy="82" r="1.3" fill="#C8E8F8" opacity="0.7">
    <animate attributeName="cy" values="82;86;82" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 发带系紧 -->
  <path d="M 84 84 Q 90 80 96 84 L 94 82 Q 90 78 86 82 Z" fill="#C8A8F0"/>
  <!-- 浅色面斑 -->
  <ellipse cx="90" cy="98" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 圆眼坚韧 -->
  <circle cx="85" cy="92" r="3" fill="#1E1008"/>
  <circle cx="95" cy="92" r="3" fill="#1E1008"/>
  <circle cx="86" cy="91" r="1" fill="#FFF"/>
  <circle cx="96" cy="91" r="1" fill="#FFF"/>
  <!-- 鼻 -->
  <circle cx="90" cy="97" r="1.5" fill="#C86A9E"/>
  <!-- 咬牙 -->
  <path d="M 86 101 Q 90 102.6 94 101" fill="none" stroke="#8E5A8E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（持紫云剑，练剑） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 76 104;4 76 104;-5 76 104" dur="2s" repeatCount="indefinite"/>
    <path d="M 82 104 C 76 108 74 114 76 120" fill="none" stroke="#7E6E9E" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="76" cy="122" r="3" fill="#F0DCC6"/>
    <!-- 腕缠绷带 -->
    <path d="M 78 120 L 74 126" stroke="#E8E0D0" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 紫云剑 -->
    <line x1="76" y1="120" x2="56" y2="146" stroke="#C8A8F0" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56 146 L 54 152" stroke="#C8A8F0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑光微亮 -->
    <path d="M 56 146 Q 46 154 40 160" stroke="#C8A8F0" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，缠绷带） -->
  <path d="M 98 104 C 104 100 108 96 110 90" fill="none" stroke="#7E6E9E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="111" cy="88" r="2.8" fill="#F0DCC6"/>
  <path d="M 108 92 L 113 87" stroke="#E8E0D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 紫云星尘 -->
  <g fill="#C8A8F0">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
