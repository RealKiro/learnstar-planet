<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑心虎·六阶·天地霸业·暮色山巅望家园灯火释然">
  <defs>
    <!-- 背景：暮色天地 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E5A4E"/>
      <stop offset="52%" stop-color="#6E4A3E"/>
      <stop offset="100%" stop-color="#5E3A2E"/>
    </linearGradient>
    <!-- 家园灯火暖 -->
    <radialGradient id="warm" cx="78%" cy="62%" r="36%">
      <stop offset="0%" stop-color="#FFE6A0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE6A0" stop-opacity="0"/>
    </radialGradient>
    <!-- 暮色橙 -->
    <radialGradient id="sunset" cx="30%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#F0A04E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0A04E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <!-- 暗甲残破 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5A6E"/>
      <stop offset="100%" stop-color="#3E3A4E"/>
    </linearGradient>
    <!-- 玄披落地 -->
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E3A4E"/>
      <stop offset="100%" stop-color="#2A2636"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#B89068"/>
      <stop offset="100%" stop-color="#9E7858"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暮色橙 -->
  <circle cx="60" cy="60" r="70" fill="url(#sunset)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 家园灯火暖 -->
  <circle cx="156" cy="122" r="50" fill="url(#warm)">
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- 家园（山下，灯火） -->
  <g opacity="0.8">
    <path d="M 146 130 L 146 116 Q 146 112 152 112 L 176 112 Q 182 112 182 118 L 182 130 Z" fill="#8E6A4E" stroke="#6E4A3E" stroke-width="0.8"/>
    <path d="M 148 116 L 180 116" stroke="#A88A68" stroke-width="1"/>
    <!-- 灯火 -->
    <path d="M 156 128 Q 154 124 156 121 Q 158 124 157 128 Z" fill="#FFE6A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 170 128 Q 168 124 170 121 Q 172 124 171 128 Z" fill="#FFE6A0" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 远山 -->
  <path d="M 0 140 Q 60 128 120 136 Q 160 142 200 132 L 200 200 L 0 200 Z" fill="#4E3A32" opacity="0.7"/>

  <!-- 暮色星 -->
  <g fill="#FFE6B8">
    <circle cx="40" cy="40" r="1.3"/><circle cx="90" cy="26" r="1.1"/><circle cx="70" cy="70" r="1"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#3E2E26" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#5E4A3E" stroke-width="1.4" opacity="0.6"/>

  <!-- 黑毛猛虎（7头身，伤痕，立于暮色） -->
  <!-- 腿 -->
  <path d="M 78 136 L 74 158 L 80 158 L 84 138 Z" fill="#1E2028"/>
  <path d="M 96 136 L 104 160 L 98 160 L 92 138 Z" fill="#1E2028"/>
  <!-- 身体 -->
  <path d="M 76 98 Q 72 118 80 136 Q 90 142 100 136 Q 106 118 102 98 Q 88 92 76 98 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 暗甲残破 -->
  <path d="M 82 102 Q 90 96 100 102 L 98 116 Q 90 122 84 116 Z" fill="url(#armor)" stroke="#2E2A3E" stroke-width="0.8"/>
  <!-- 伤痕 -->
  <path d="M 84 108 Q 86 112 83 116" stroke="#C85A3E" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 96 110 Q 98 114 96 118" stroke="#C85A3E" stroke-width="1.1" stroke-linecap="round" opacity="0.6"/>
  <!-- 玄披落地 -->
  <path d="M 78 100 Q 60 118 56 140 Q 68 146 80 138 L 76 118 Z" fill="url(#cape)" stroke="#1E1A2E" stroke-width="0.8"/>
  <!-- 黑尾（垂） -->
  <path d="M 104 130 Q 112 126 114 120" stroke="#242630" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- 头（虎脸，圆眼释然含暖） -->
  <ellipse cx="90" cy="92" rx="12" ry="11" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳 -->
  <path d="M 80 84 Q 76 72 82 70 Q 86 72 84 84 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 100 84 Q 104 72 98 70 Q 94 72 96 84 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="82" cy="74" r="2.4" fill="#FFE066" opacity="0.7"/>
  <circle cx="98" cy="74" r="2.4" fill="#FFE066" opacity="0.7"/>
  <!-- 王纹（淡） -->
  <path d="M 90 80 L 85 75 M 90 80 L 95 75 M 90 80 L 90 73" stroke="#FFE066" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <!-- 白面斑 -->
  <ellipse cx="90" cy="96" rx="7" ry="5" fill="#C8A888"/>
  <!-- 圆眼释然含暖 -->
  <path d="M 80 89 Q 84 91 88 89 Q 82 93 80 89 Z" fill="#FFF3C4"/>
  <path d="M 100 89 Q 96 91 92 89 Q 98 93 100 89 Z" fill="#FFF3C4"/>
  <ellipse cx="84" cy="90" rx="1.8" ry="2.3" fill="#E8A024"/>
  <ellipse cx="96" cy="90" rx="1.8" ry="2.3" fill="#E8A024"/>
  <circle cx="84" cy="90" r="0.8" fill="#1E1008"/>
  <circle cx="96" cy="90" r="0.8" fill="#1E1008"/>
  <circle cx="85" cy="89.4" r="0.6" fill="#FFE6A0"/>
  <circle cx="95" cy="89.4" r="0.6" fill="#FFE6A0"/>
  <!-- 虎鼻 -->
  <ellipse cx="90" cy="95" rx="2.6" ry="1.8" fill="#3A2E26"/>
  <!-- 释然抿唇 -->
  <path d="M 85 99 Q 90 101.4 95 99" fill="none" stroke="#5E4A3E" stroke-width="1" stroke-linecap="round"/>
  <!-- 虎须 -->
  <path d="M 80 94 L 74 93 M 80 96 L 74 97 M 100 94 L 106 93 M 100 96 L 106 97" stroke="#D8C8B0" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 前爪（轻落） -->
  <path d="M 82 130 C 76 136 74 142 76 146" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="148" r="3.4" fill="#C8A888"/>
  <!-- 后爪 -->
  <path d="M 98 128 C 104 132 108 138 110 144" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="111" cy="146" r="3.2" fill="#C8A888"/>

  <!-- 暮色暖光星尘 -->
  <g fill="#FFE6A0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
