<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑小虎·四阶·黑小虎·谋·暗室摆弄毒药暗器">
  <defs>
    <!-- 背景：暗室 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A3E"/>
      <stop offset="52%" stop-color="#222A2E"/>
      <stop offset="100%" stop-color="#161A1E"/>
    </linearGradient>
    <!-- 毒液暗绿 -->
    <radialGradient id="poison" cx="34%" cy="52%" r="36%">
      <stop offset="0%" stop-color="#6E9E5E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6E9E5E" stop-opacity="0"/>
    </radialGradient>
    <!-- 阴影 -->
    <radialGradient id="shadow" cx="72%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#3E4A4E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3E4A4E" stop-opacity="0"/>
    </radialGradient>
    <!-- 墨黑 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <!-- 暗色劲装 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5A6E"/>
      <stop offset="100%" stop-color="#3E3A4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#C8A888"/>
      <stop offset="100%" stop-color="#AE8A70"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 毒液暗绿 -->
  <circle cx="68" cy="104" r="52" fill="url(#poison)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 阴影 -->
  <circle cx="146" cy="76" r="56" fill="url(#shadow)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 暗室案台 -->
  <path d="M 100 130 L 96 114 Q 96 110 102 110 L 140 110 Q 146 110 146 116 L 144 130 Z" fill="#3E3A44" stroke="#5E5A64" stroke-width="1"/>
  <!-- 药瓶（毒药） -->
  <g>
    <path d="M 108 108 L 110 98 L 116 98 L 118 108 Z" fill="#5E8E4E" stroke="#4E7E3E" stroke-width="0.6"/>
    <path d="M 130 108 L 132 100 L 136 100 L 138 108 Z" fill="#4E7E3E" stroke="#3E6E2E" stroke-width="0.6"/>
  </g>
  <!-- 暗器 -->
  <path d="M 122 112 L 126 116 L 122 120 Z" fill="#8E96A6" stroke="#6E7686" stroke-width="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- 毒气升腾 -->
  <path d="M 113 98 Q 111 92 113 86" stroke="#6E9E5E" stroke-width="1.2" opacity="0.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#121418" opacity="0.95"/>
  <path d="M 0 150 L 200 150" stroke="#2E3238" stroke-width="1.4" opacity="0.6"/>

  <!-- 墨黑小虎（6头身，暗器在身，神色阴冷） -->
  <!-- 腿 -->
  <path d="M 72 134 L 68 156 L 74 156 L 78 136 Z" fill="#1E2028"/>
  <path d="M 88 134 L 96 158 L 90 158 L 84 136 Z" fill="#1E2028"/>
  <!-- 身体 -->
  <path d="M 70 98 Q 66 118 74 134 Q 84 140 92 134 Q 98 118 94 98 Q 82 92 70 98 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 暗色劲装 -->
  <path d="M 74 100 Q 82 94 92 100 L 90 112 Q 82 118 76 112 Z" fill="url(#armor)" stroke="#2E2A3E" stroke-width="0.8"/>
  <!-- 腰间暗器皮囊 -->
  <path d="M 86 118 L 94 124 L 92 128 L 84 122 Z" fill="#4E4A56" stroke="#6E6A76" stroke-width="0.7"/>
  <!-- 黑尾 -->
  <path d="M 96 126 Q 106 120 112 112" stroke="#242630" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 96 126;10 96 126;0 96 126" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，圆眼阴冷，眼底迷茫） -->
  <ellipse cx="82" cy="92" rx="11.5" ry="10.5" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳 -->
  <path d="M 72 84 Q 67 70 74 68 Q 79 71 76 84 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 92 84 Q 97 70 90 68 Q 85 71 88 84 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="74" cy="72" r="2.2" fill="#6E9E5E" opacity="0.8"/>
  <circle cx="90" cy="72" r="2.2" fill="#6E9E5E" opacity="0.8"/>
  <!-- 王纹（深） -->
  <path d="M 82 79 L 78 75 M 82 79 L 86 75 M 82 79 L 82 73" stroke="#FFE066" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- 白面斑 -->
  <ellipse cx="82" cy="96" rx="6.5" ry="4.8" fill="#C8A888"/>
  <!-- 圆眼阴冷 -->
  <path d="M 72 89 L 79 92 L 72 95 Z" fill="#FFF3C4"/>
  <path d="M 92 89 L 85 92 L 92 95 Z" fill="#FFF3C4"/>
  <ellipse cx="76" cy="92" rx="1.7" ry="2.3" fill="#6E9E5E"/>
  <ellipse cx="88" cy="92" rx="1.7" ry="2.3" fill="#6E9E5E"/>
  <circle cx="76" cy="92" r="0.8" fill="#1E1008"/>
  <circle cx="88" cy="92" r="0.8" fill="#1E1008"/>
  <!-- 虎鼻 -->
  <ellipse cx="82" cy="95" rx="2.4" ry="1.7" fill="#3A2E26"/>
  <!-- 阴冷抿唇 -->
  <path d="M 77 99 Q 82 101.2 87 99" fill="none" stroke="#5E4A3E" stroke-width="1" stroke-linecap="round"/>
  <!-- 虎须 -->
  <path d="M 72 94 L 66 93 M 72 96 L 66 97 M 92 94 L 98 93 M 92 96 L 98 97" stroke="#D8C8B0" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 前爪（把玩暗器） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 74 130 C 68 136 66 142 68 146" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
    <circle cx="68" cy="148" r="3.4" fill="#C8A888"/>
    <!-- 爪间暗器 -->
    <path d="M 66 148 L 60 152 L 66 154 Z" fill="#8E96A6" stroke="#6E7686" stroke-width="0.6"/>
  </g>
  <!-- 后爪 -->
  <path d="M 90 126 C 96 130 100 136 102 142" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="103" cy="144" r="3.2" fill="#C8A888"/>

  <!-- 暗绿毒光星尘 -->
  <g fill="#6E9E5E">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
