<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="达达·二阶·竹林被毁·焦土拾焦叶立志">
  <defs>
    <!-- 背景：焦土竹林余烬 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E5E4E"/>
      <stop offset="52%" stop-color="#4E4636"/>
      <stop offset="100%" stop-color="#302E26"/>
    </linearGradient>
    <!-- 余烬火光 -->
    <radialGradient id="fire" cx="72%" cy="36%" r="44%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 一线青 -->
    <radialGradient id="green" cx="34%" cy="56%" r="34%">
      <stop offset="0%" stop-color="#7EA878" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7EA878" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿面 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE6D8"/>
      <stop offset="100%" stop-color="#BCC8B8"/>
    </linearGradient>
    <!-- 青衫染灰 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E7E68"/>
      <stop offset="100%" stop-color="#465E4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8DCC6"/>
      <stop offset="100%" stop-color="#D0C4AE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 余烬火光 -->
  <circle cx="148" cy="80" r="62" fill="url(#fire)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 一线青 -->
  <circle cx="72" cy="112" r="46" fill="url(#green)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 焚毁竹林（焦黑枯竹） -->
  <g stroke="#3E3A2E" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M 124 60 Q 120 90 116 150"/>
    <path d="M 152 54 Q 156 92 150 150"/>
    <path d="M 138 64 L 132 78 M 152 60 L 158 76"/>
  </g>
  <!-- 余烬火星 -->
  <g fill="#E8623A">
    <circle cx="130" cy="96" r="2"><animate attributeName="cy" values="96;108;96" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="102" r="2"><animate attributeName="cy" values="102;114;102" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 被护村民（虚影，右） -->
  <g opacity="0.45">
    <path d="M 164 118 Q 166 110 169 108 Q 172 110 172 118 Z" fill="#5E5656"/>
    <circle cx="170" cy="106" r="4.5" fill="#D8CCBC"/>
  </g>

  <!-- 焦土 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E2C26" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#4E4A3E" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿面熊猫（5头身，青衫染灰，蹲身拾焦叶） -->
  <!-- 腿（蹲） -->
  <path d="M 76 146 Q 82 150 90 146 Q 92 142 88 140 Q 82 144 76 140 Z" fill="#3E5E46"/>
  <path d="M 94 146 Q 100 150 106 146 Q 108 142 104 140 Q 98 144 94 140 Z" fill="#3E5E46"/>
  <!-- 青衫 -->
  <path d="M 72 100 Q 68 124 80 146 Q 90 152 100 146 Q 108 124 104 100 Q 90 94 72 100 Z" fill="url(#robe)" stroke="#364E3E" stroke-width="1"/>
  <!-- 玉带（仍在） -->
  <path d="M 72 120 L 104 120" stroke="#C8B888" stroke-width="1.4"/>
  <!-- 灰渍 -->
  <path d="M 84 112 Q 86 118 83 124" stroke="#8E8676" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- 尾巴 -->
  <circle cx="106" cy="138" r="2.8" fill="#3E5E46"/>

  <!-- 头（熊猫脸，圆眼隐忍，眼底坚毅，束发微乱） -->
  <ellipse cx="88" cy="96" rx="11" ry="11.5" fill="url(#fur)" stroke="#7E9A76" stroke-width="0.9"/>
  <!-- 熊猫耳 -->
  <circle cx="77" cy="86" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <circle cx="99" cy="86" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <!-- 眼周黑斑 -->
  <ellipse cx="83" cy="93" rx="4" ry="3.4" fill="#2A4236"/>
  <ellipse cx="93" cy="93" rx="4" ry="3.4" fill="#2A4236"/>
  <!-- 束发微乱 -->
  <path d="M 85 84 Q 88 76 93 76 Q 96 76 94 84 Z" fill="#465E4E"/>
  <path d="M 88 76 Q 89 70 91 70 Q 92 72 91 76" fill="#465E4E"/>
  <!-- 沾尘 -->
  <path d="M 80 92 Q 78 94 80 96" stroke="#8E8676" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <!-- 圆眼隐忍 -->
  <circle cx="83" cy="93" r="2.2" fill="#1E1008"/>
  <circle cx="93" cy="93" r="2.2" fill="#1E1008"/>
  <circle cx="83.6" cy="92.4" r="0.8" fill="#FFF"/>
  <circle cx="93.6" cy="92.4" r="0.8" fill="#FFF"/>
  <!-- 鼻 -->
  <ellipse cx="88" cy="99" rx="2.4" ry="1.8" fill="#5E7668"/>
  <!-- 隐忍抿唇 -->
  <path d="M 84 103 Q 88 104.6 92 103" fill="none" stroke="#6E8E7E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（垂下，握拳） -->
  <path d="M 76 104 C 70 108 68 114 70 120" fill="none" stroke="#5E7E68" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="70" cy="122" r="3" fill="#E8DCC6"/>

  <!-- 右手（拾起焦叶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 96 104 C 102 100 106 96 108 90" fill="none" stroke="#5E7E68" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="109" cy="88" r="2.8" fill="#E8DCC6"/>
    <!-- 焦叶 -->
    <path d="M 109 86 Q 114 82 116 78 Q 112 80 109 86 Z" fill="#8E6A3E" stroke="#6E4A2E" stroke-width="0.6"/>
  </g>

  <!-- 一线青星尘 -->
  <g fill="#7EA878">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
