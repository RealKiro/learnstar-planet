<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="跳跳·五阶·青光掠影·快剑扬名归正七侠">
  <defs>
    <!-- 背景：战场前奏 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8C878"/>
      <stop offset="52%" stop-color="#A8A85E"/>
      <stop offset="100%" stop-color="#888A46"/>
    </linearGradient>
    <!-- 青光蓝 -->
    <radialGradient id="cyan" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#6EE8D8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3E9EC8" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="82%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52B060"/>
      <stop offset="100%" stop-color="#348A4C"/>
    </linearGradient>
    <!-- 绿色侠客装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9E5E"/>
      <stop offset="100%" stop-color="#367E48"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DCC4"/>
      <stop offset="100%" stop-color="#DAC4AC"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 青光 -->
  <circle cx="100" cy="86" r="74" fill="url(#cyan)">
    <animate attributeName="opacity" values="0.85;0.55;0.85" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 战火 -->
  <circle cx="158" cy="48" r="48" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 破敌残影（右上，被剑光掠过） -->
  <g opacity="0.5">
    <path d="M 156 56 Q 158 48 161 46 Q 164 48 164 56 Z" fill="#4E3A3E"/>
    <path d="M 172 50 Q 174 42 177 40 Q 180 42 180 50 Z" fill="#5E4A4E"/>
  </g>
  <!-- 剑光掠影 -->
  <path d="M 148 62 Q 140 70 134 78" stroke="#6EE8D8" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E8A5E" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#A8A46E" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿毛小猴（6头身，七侠装束，青光剑在手） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 156 L 86 156 L 90 136 Z" fill="#348A4C"/>
  <path d="M 100 134 L 108 158 L 102 158 L 96 136 Z" fill="#348A4C"/>
  <!-- 绿色侠客装 -->
  <path d="M 84 100 Q 80 118 86 134 Q 96 140 104 134 Q 110 118 106 100 Q 96 94 84 100 Z" fill="url(#robe)" stroke="#2E6E3E" stroke-width="1"/>
  <!-- 腰间绿带 -->
  <path d="M 84 116 L 106 116" stroke="#6EE8D8" stroke-width="1.6"/>
  <!-- 尾巴 -->
  <path d="M 110 128 Q 120 120 124 112" stroke="#348A4C" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 110 128;12 110 128;0 110 128" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（猴脸，圆眼含笑，绿毛束起） -->
  <ellipse cx="94" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6E3E" stroke-width="0.9"/>
  <!-- 圆耳 -->
  <circle cx="84" cy="82" r="3.6" fill="#52B060" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="104" cy="82" r="3.6" fill="#52B060" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="84" cy="82" r="1.8" fill="#D8B090"/>
  <circle cx="104" cy="82" r="1.8" fill="#D8B090"/>
  <!-- 马尾 -->
  <path d="M 94 80 Q 92 72 96 70 Q 100 74 98 80 Z" fill="#348A4C"/>
  <path d="M 96 70 Q 99 64 97 61" stroke="#6EE8D8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 猴脸浅色 -->
  <ellipse cx="94" cy="97" rx="6.5" ry="5" fill="#F2DCC4"/>
  <!-- 圆眼含笑 -->
  <path d="M 88 91 Q 91 89 94 91 Q 91 93 88 91 Z" fill="#1E1008"/>
  <path d="M 100 91 Q 97 89 94 91 Q 97 93 100 91 Z" fill="#1E1008"/>
  <circle cx="89.4" cy="90.4" r="0.7" fill="#6EE8D8"/>
  <circle cx="98.6" cy="90.4" r="0.7" fill="#6EE8D8"/>
  <!-- 猴鼻 -->
  <circle cx="94" cy="96" r="1.6" fill="#C06A4E"/>
  <!-- 咧嘴笑 -->
  <path d="M 89 100 Q 94 104 99 100" fill="none" stroke="#8E5A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 86 104 C 80 108 78 114 80 120" fill="none" stroke="#4E9E5E" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="80" cy="122" r="3" fill="#F2DCC4"/>

  <!-- 右手持青光剑（掠影，指天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 102 104 C 110 98 116 94 120 86" fill="none" stroke="#4E9E5E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="84" r="3.2" fill="#F2DCC4"/>
    <!-- 青光剑 -->
    <line x1="122" y1="86" x2="132" y2="54" stroke="#6EE8D8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 132 54 L 135 48" stroke="#6EE8D8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 掠影剑光 -->
    <circle cx="132" cy="52" r="13" fill="url(#cyan)">
      <animate attributeName="r" values="13;18;13" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 132 50 L 138 38 M 134 54 L 144 46" stroke="#6EE8D8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 青光星尘 -->
  <g fill="#6EE8D8">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
