<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑心虎·二阶·黑风虎王·威压四野黑风缭绕">
  <defs>
    <!-- 背景：幽暗山林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4A5E"/>
      <stop offset="52%" stop-color="#2E3A4E"/>
      <stop offset="100%" stop-color="#1E2A3E"/>
    </linearGradient>
    <!-- 黑风 -->
    <radialGradient id="dark" cx="50%" cy="44%" r="54%">
      <stop offset="0%" stop-color="#5E5A7E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5E5A7E" stop-opacity="0"/>
    </radialGradient>
    <!-- 虎目金 -->
    <radialGradient id="eye" cx="50%" cy="40%" r="36%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <!-- 暗色甲片 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5A6E"/>
      <stop offset="100%" stop-color="#3E3A4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#B89068"/>
      <stop offset="100%" stop-color="#9E7858"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 黑风 -->
  <circle cx="100" cy="90" r="82" fill="url(#dark)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 虎目金 -->
  <circle cx="100" cy="80" r="54" fill="url(#eye)">
    <animate attributeName="opacity" values="0.7;0.42;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 黑风缭绕 -->
  <g stroke="#6E6A8E" stroke-width="1.6" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 40 60 Q 56 52 72 58">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 128 50 Q 144 44 158 50">
      <animate attributeName="opacity" values="0.5;0.18;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 暗林剪影 -->
  <g stroke="#26304A" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
    <path d="M 24 100 L 20 160 M 172 98 L 176 160"/>
    <path d="M 28 110 L 16 120 M 168 108 L 180 118"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#1E2638" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#3E4658" stroke-width="1.4" opacity="0.6"/>

  <!-- 黑毛猛虎（6头身，肩胛暗甲，黑风绕身） -->
  <!-- 腿 -->
  <path d="M 78 134 L 74 156 L 80 156 L 84 136 Z" fill="#1E2028"/>
  <path d="M 96 134 L 104 158 L 98 158 L 92 136 Z" fill="#1E2028"/>
  <!-- 身体 -->
  <path d="M 76 98 Q 72 116 80 134 Q 90 140 100 134 Q 106 116 102 98 Q 88 92 76 98 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎纹 -->
  <path d="M 80 106 Q 84 110 82 116 M 94 106 Q 98 110 96 116" stroke="#1E2028" stroke-width="1.3" stroke-linecap="round"/>
  <!-- 肩胛暗甲 -->
  <path d="M 80 96 Q 86 92 90 96 L 88 104 Q 82 106 78 100 Z" fill="url(#armor)" stroke="#2E2A3E" stroke-width="0.8"/>
  <!-- 黑尾如鞭 -->
  <path d="M 104 128 Q 114 122 122 114" stroke="#242630" stroke-width="2.8" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 104 128;12 104 128;0 104 128" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，圆眼含威，王纹深） -->
  <ellipse cx="90" cy="94" rx="12" ry="11" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳 -->
  <path d="M 80 86 Q 76 74 82 72 Q 86 74 84 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 100 86 Q 104 74 98 72 Q 94 74 96 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="82" cy="76" r="2.4" fill="#FFE066" opacity="0.8"/>
  <circle cx="98" cy="76" r="2.4" fill="#FFE066" opacity="0.8"/>
  <!-- 王纹（深） -->
  <path d="M 90 82 L 85 77 M 90 82 L 95 77 M 90 82 L 90 75" stroke="#FFE066" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <!-- 白面斑 -->
  <ellipse cx="90" cy="98" rx="7" ry="5" fill="#C8A888"/>
  <!-- 圆眼含威（金瞳） -->
  <path d="M 80 90 L 88 93 L 80 96 Z" fill="#FFF3C4"/>
  <path d="M 100 90 L 92 93 L 100 96 Z" fill="#FFF3C4"/>
  <ellipse cx="84" cy="93" rx="2" ry="2.6" fill="#E8A024"/>
  <ellipse cx="96" cy="93" rx="2" ry="2.6" fill="#E8A024"/>
  <circle cx="84" cy="93" r="0.9" fill="#1E1008"/>
  <circle cx="96" cy="93" r="0.9" fill="#1E1008"/>
  <!-- 虎鼻 -->
  <ellipse cx="90" cy="97" rx="2.6" ry="1.8" fill="#3A2E26"/>
  <!-- 威压唇 -->
  <path d="M 85 101 Q 90 103.6 95 101" fill="none" stroke="#5E4A3E" stroke-width="1.1" stroke-linecap="round"/>
  <!-- 虎须 -->
  <path d="M 80 96 L 74 95 M 80 98 L 74 99 M 100 96 L 106 95 M 100 98 L 106 99" stroke="#D8C8B0" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 前爪（扬威） -->
  <path d="M 82 130 C 76 136 74 142 76 146" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="148" r="3.4" fill="#C8A888"/>
  <!-- 后爪 -->
  <path d="M 98 128 C 104 132 108 138 110 144" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="111" cy="146" r="3.2" fill="#C8A888"/>

  <!-- 虎啸音波 -->
  <path d="M 74 82 Q 64 80 60 74 M 106 82 Q 116 80 120 74" stroke="#FFE066" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 黑风星尘 -->
  <g fill="#FFE066">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
