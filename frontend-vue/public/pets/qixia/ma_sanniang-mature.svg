<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="马三娘·四阶·身份动摇·月下剑影半紫半暖">
  <defs>
    <!-- 背景：玉蟾宫夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E4A6E"/>
      <stop offset="52%" stop-color="#3E3A5E"/>
      <stop offset="100%" stop-color="#2E2A4E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="72%" cy="30%" r="32%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫影 -->
    <radialGradient id="purple" cx="36%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#C8A8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8A8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 暖烛 -->
    <radialGradient id="warm" cx="72%" cy="58%" r="36%">
      <stop offset="0%" stop-color="#F0C878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EBA"/>
      <stop offset="100%" stop-color="#6E4E9A"/>
    </linearGradient>
    <!-- 紫黑劲装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E4E9E"/>
      <stop offset="100%" stop-color="#4E327E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C4AE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="144" cy="60" r="44" fill="url(#moon)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="144" cy="60" r="9" fill="#E8F0FA" opacity="0.9"/>
  <!-- 紫影 -->
  <circle cx="72" cy="104" r="56" fill="url(#purple)">
    <animate attributeName="opacity" values="0.6;0.36;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 暖烛 -->
  <circle cx="144" cy="116" r="48" fill="url(#warm)">
    <animate attributeName="opacity" values="0.6;0.38;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 烛火（前景，宫阙窗） -->
  <path d="M 148 106 L 148 96 L 150 96 L 150 106 Z" fill="#8E6A4E"/>
  <path d="M 148 96 Q 146 90 148 87 Q 150 90 149 96 Z" fill="#F0C878" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="90" cy="24" r="1.1"/><circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2A2A44" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 紫衣剑客（6头身，独立，剑横膝上，眉间纠结） -->
  <!-- 腿（盘坐） -->
  <path d="M 82 148 Q 88 152 96 148 Q 98 144 94 142 Q 88 146 82 142 Z" fill="#4E327E"/>
  <!-- 紫黑劲装 -->
  <path d="M 78 100 Q 74 124 84 148 Q 94 154 102 148 Q 108 124 104 100 Q 92 94 78 100 Z" fill="url(#robe)" stroke="#3E2670" stroke-width="1"/>
  <!-- 斗篷半披 -->
  <path d="M 78 102 L 70 118 L 74 130 L 82 118 Z" fill="#7E6E9E" stroke="#5E4E7E" stroke-width="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 尾巴 -->
  <path d="M 106 140 Q 114 136 116 130" stroke="#6E4E9A" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（清冷面容，眼底迷惘，长发束起） -->
  <ellipse cx="91" cy="94" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3E8C" stroke-width="0.9"/>
  <!-- 猫耳 -->
  <path d="M 82 86 L 76 72 L 86 80 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 100 86 L 106 72 L 96 80 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 82 84 L 78 74 L 84 80 Z" fill="#D0B0E0"/>
  <path d="M 100 84 L 104 74 L 98 80 Z" fill="#D0B0E0"/>
  <!-- 长发束起 -->
  <path d="M 91 82 Q 89 74 93 72 Q 97 76 95 82 Z" fill="#6E4E9A"/>
  <path d="M 93 72 Q 97 64 95 60" stroke="#C8A8F0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 细眉（微蹙） -->
  <path d="M 84 86 Q 87 85 89 86 M 93 86 Q 95 85 98 86" stroke="#3A263E" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 浅色面斑 -->
  <ellipse cx="91" cy="98" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 眼底迷惘（半紫半暖） -->
  <path d="M 84 90 Q 87 88.6 90 90 L 90 91.6 Q 87 90.2 84 91.6 Z" fill="#1E1008"/>
  <path d="M 98 90 Q 95 88.6 92 90 L 92 91.6 Q 95 90.2 98 91.6 Z" fill="#1E1008"/>
  <circle cx="85.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="96.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="85.6" cy="90.4" r="0.6" fill="#C8A8F0"/>
  <circle cx="95.4" cy="90.4" r="0.6" fill="#F0C878"/>
  <!-- 鼻梁挺 -->
  <path d="M 91 95 L 91 97.5" stroke="#B09078" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 薄唇（纠结微抿） -->
  <path d="M 87 101 Q 91 102.6 95 101" fill="none" stroke="#A06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（撑膝） -->
  <path d="M 82 106 C 76 110 74 116 76 122" fill="none" stroke="#6E4E9E" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="76" cy="124" r="3" fill="#F0DCC6"/>

  <!-- 剑横膝上（半紫半暖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <line x1="78" y1="136" x2="104" y2="144" stroke="#C8A8F0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 半紫 -->
    <path d="M 78 136 Q 76 132 78 128" stroke="#C8A8F0" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 半暖 -->
    <path d="M 104 144 Q 108 144 110 140" stroke="#F0C878" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（抚剑，迷惘） -->
  <path d="M 100 106 C 106 110 110 116 112 122" fill="none" stroke="#6E4E9E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="113" cy="124" r="2.8" fill="#F0DCC6"/>

  <!-- 半紫半暖星尘 -->
  <g fill="#C8A8F0">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#F0C878">
    <circle cx="130" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
