<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝兔·一阶·玉蟾宫雪·宫阙飞雪冰魄剑意">
  <defs>
    <!-- 背景：玉蟾宫雪晨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8DCE8"/>
      <stop offset="52%" stop-color="#9AC8DE"/>
      <stop offset="100%" stop-color="#7EB0CE"/>
    </linearGradient>
    <!-- 雪光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#F4FBFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F4FBFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 冰魄蓝 -->
    <radialGradient id="ice" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#B8E8F8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4E9EC8" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA8E0"/>
      <stop offset="100%" stop-color="#3E86C0"/>
    </linearGradient>
    <!-- 素白长裙 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F8FC"/>
      <stop offset="100%" stop-color="#D8E8F4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E4CEB6"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>
  <!-- 冰魄剑意 -->
  <circle cx="100" cy="96" r="66" fill="url(#ice)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 玉蟾宫宫阙 -->
  <g opacity="0.8">
    <path d="M 140 96 L 140 78 L 168 78 L 168 96 L 176 96 L 176 72 L 132 72 L 132 96 Z" fill="#D8E8F2"/>
    <path d="M 154 78 L 154 66 L 153 78 Z" fill="#D8E8F2"/>
    <!-- 青瓦 -->
    <path d="M 132 72 L 154 60 L 176 72 L 154 66 Z" fill="#4E9EC8"/>
    <!-- 檐角 -->
    <path d="M 132 72 L 126 68 M 176 72 L 182 68" stroke="#4E9EC8" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 远山雪 -->
  <path d="M 0 128 Q 50 116 100 124 Q 150 130 200 120 L 200 200 L 0 200 Z" fill="#AECCE0" opacity="0.6"/>

  <!-- 雪地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#E8F4FA" opacity="0.85"/>
  <path d="M 0 148 L 200 148" stroke="#D0E4F0" stroke-width="1.4" opacity="0.7"/>

  <!-- 飞雪 -->
  <g fill="#F4FBFF" opacity="0.9">
    <circle cx="40" cy="36" r="1.4"><animate attributeName="cy" values="36;52;36" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="30" r="1.2"><animate attributeName="cy" values="30;46;30" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="56" r="1"><animate attributeName="cy" values="56;72;56" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 蓝毛白兔（4头身，素白长裙，立雪） -->
  <!-- 腿 -->
  <path d="M 86 136 L 82 158 L 88 158 L 92 138 Z" fill="#3E86C0"/>
  <path d="M 102 136 L 110 160 L 104 160 L 98 138 Z" fill="#3E86C0"/>
  <!-- 素白长裙 -->
  <path d="M 86 104 Q 82 120 88 136 Q 98 142 106 136 Q 112 120 108 104 Q 98 98 86 104 Z" fill="url(#robe)" stroke="#B8D0E0" stroke-width="1"/>
  <!-- 淡蓝披帛 -->
  <path d="M 86 108 L 78 120" stroke="#8EB8D8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 108 108 L 118 116" stroke="#8EB8D8" stroke-width="2" stroke-linecap="round"/>
  <!-- 腰间冰魄坠 -->
  <circle cx="98" cy="122" r="2.2" fill="#7EB8E8" stroke="#D8F0FC" stroke-width="0.6"/>
  <!-- 尾巴（绒球） -->
  <circle cx="110" cy="130" r="3.4" fill="#F4F8FC"/>

  <!-- 头（兔脸，圆眼温柔，蓝毛） -->
  <ellipse cx="97" cy="96" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 兔耳 -->
  <path d="M 89 88 Q 84 74 88 64 Q 93 64 94 76 Q 94 84 95 88 Z" fill="#5EA8E0" stroke="#2E6EA8" stroke-width="0.8"/>
  <path d="M 105 88 Q 110 74 106 64 Q 101 64 100 76 Q 100 84 99 88 Z" fill="#5EA8E0" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 内耳粉 -->
  <path d="M 89 86 Q 86 76 89 70 Q 92 72 92 80 Z" fill="#F0C0D0"/>
  <path d="M 105 86 Q 108 76 105 70 Q 102 72 102 80 Z" fill="#F0C0D0"/>
  <!-- 白脸斑 -->
  <ellipse cx="97" cy="100" rx="6.5" ry="5" fill="#F6E2CC"/>
  <!-- 兔眼温柔 -->
  <circle cx="92" cy="94" r="2.8" fill="#1E1008"/>
  <circle cx="102" cy="94" r="2.8" fill="#1E1008"/>
  <circle cx="93" cy="93" r="1" fill="#FFF"/>
  <circle cx="103" cy="93" r="1" fill="#FFF"/>
  <!-- 兔鼻 -->
  <path d="M 95 99 L 97 101 L 99 99" fill="none" stroke="#C85A78" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 微笑 -->
  <path d="M 93 103 Q 97 105.2 101 103" fill="none" stroke="#B06A84" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 珠花发饰 -->
  <circle cx="97" cy="84" r="1.8" fill="#B8E8F8" stroke="#7EB8E8" stroke-width="0.5"/>

  <!-- 左臂（指尖凝霜） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 90 108;2 90 108;-3 90 108" dur="2.2s" repeatCount="indefinite"/>
    <path d="M 90 108 C 84 112 80 116 78 121" fill="none" stroke="#F4F8FC" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="77" cy="123" r="3" fill="#F6E2CC"/>
    <!-- 凝霜 -->
    <circle cx="77" cy="121" r="4.5" fill="url(#ice)">
      <animate attributeName="r" values="4.5;7;4.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右手（望雪） -->
  <path d="M 104 108 C 110 104 114 100 116 94" fill="none" stroke="#F4F8FC" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="92" r="2.8" fill="#F6E2CC"/>

  <!-- 冰魄星尘 -->
  <g fill="#B8E8F8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
