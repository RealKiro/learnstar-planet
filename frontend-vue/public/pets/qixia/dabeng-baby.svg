<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大奔·二阶·至亲之痛·跪地砸拳护亲立志">
  <defs>
    <!-- 背景：夜色屋外 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5A7E"/>
      <stop offset="52%" stop-color="#3E4A6E"/>
      <stop offset="100%" stop-color="#2E3A5E"/>
    </linearGradient>
    <!-- 屋内烛火暖 -->
    <radialGradient id="fire" cx="80%" cy="46%" r="34%">
      <stop offset="0%" stop-color="#F0C878" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F0C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 棕毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#96582E"/>
      <stop offset="100%" stop-color="#6E4022"/>
    </linearGradient>
    <!-- 布衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E7A5E"/>
      <stop offset="100%" stop-color="#6E5A44"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#B89672"/>
      <stop offset="100%" stop-color="#9E7E60"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 屋内烛火 -->
  <circle cx="160" cy="92" r="46" fill="url(#fire)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- 屋内至亲灯影（右，虚） -->
  <g opacity="0.55">
    <path d="M 168 96 L 168 74 Q 168 70 174 70 L 194 70 Q 198 70 198 76 L 198 96 Z" fill="#8E7A5E" stroke="#6E5A44" stroke-width="0.8"/>
    <path d="M 170 74 L 196 74" stroke="#A8906E" stroke-width="1"/>
    <!-- 至亲卧影 -->
    <path d="M 180 72 Q 180 66 183 64 Q 186 66 186 72 Z" fill="#4E3A4E"/>
    <circle cx="183" cy="62" r="4" fill="#D8C8B8"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E2A3E" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="90" cy="24" r="1.1"/><circle cx="60" cy="60" r="1"/>
  </g>

  <!-- 棕毛大熊（5头身，布衣沾尘，跪地） -->
  <!-- 腿（跪） -->
  <path d="M 78 150 Q 84 154 92 150 Q 96 146 92 143 Q 86 147 80 143 Z" fill="#6E4022"/>
  <path d="M 100 150 Q 106 154 112 150 Q 114 146 110 143 Q 104 147 100 143 Z" fill="#6E4022"/>
  <!-- 布衣 -->
  <path d="M 76 104 Q 72 126 82 150 Q 92 156 102 150 Q 110 126 106 104 Q 92 98 76 104 Z" fill="url(#robe)" stroke="#5E4A3E" stroke-width="1"/>
  <!-- 尘渍 -->
  <path d="M 88 112 Q 90 118 87 124" stroke="#4E3A2E" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <!-- 麻绳 -->
  <path d="M 78 122 L 104 122" stroke="#7E6A4E" stroke-width="1.4"/>
  <!-- 右臂（裸露，撑地） -->
  <path d="M 104 108 C 112 110 116 118 114 128" fill="none" stroke="#9E7E60" stroke-width="5" stroke-linecap="round"/>
  <circle cx="114" cy="130" r="3.2" fill="#9E7E60"/>
  <!-- 尾巴 -->
  <circle cx="108" cy="142" r="2.8" fill="#6E4022"/>

  <!-- 头（熊脸，圆眼含泪，眼底坚毅，棕毛凌乱） -->
  <ellipse cx="91" cy="96" rx="12" ry="11.5" fill="url(#fur)" stroke="#4E2A18" stroke-width="0.9"/>
  <!-- 圆耳 -->
  <circle cx="79" cy="86" r="4" fill="#96582E" stroke="#4E2A18" stroke-width="0.8"/>
  <circle cx="103" cy="86" r="4" fill="#96582E" stroke="#4E2A18" stroke-width="0.8"/>
  <circle cx="79" cy="86" r="2" fill="#B08868"/>
  <circle cx="103" cy="86" r="2" fill="#B08868"/>
  <!-- 棕毛凌乱 -->
  <path d="M 83 85 Q 85 79 91 81 Q 97 79 99 85" stroke="#4E2A18" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 86 80 Q 82 74 88 72" stroke="#4E2A18" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 熊脸浅斑 -->
  <ellipse cx="91" cy="101" rx="7" ry="5" fill="#B89672"/>
  <!-- 圆眼含泪 -->
  <circle cx="85" cy="94" r="3.2" fill="#1E1008"/>
  <circle cx="97" cy="94" r="3.2" fill="#1E1008"/>
  <circle cx="86" cy="93" r="1.1" fill="#FFF"/>
  <circle cx="98" cy="93" r="1.1" fill="#FFF"/>
  <!-- 泪光 -->
  <path d="M 83 96 Q 82 98 83 100" stroke="#C8E8F8" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
    <animate attributeName="cy" values="96;101;96" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 宽鼻 -->
  <ellipse cx="91" cy="99" rx="2.6" ry="2" fill="#3A2E26"/>
  <!-- 咬牙抿唇 -->
  <path d="M 87 103 Q 91 104.6 95 103" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 左臂（握拳砸地） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 78 108 C 72 112 70 118 72 124" fill="none" stroke="#968A6E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="72" cy="127" r="3.4" fill="#B89672"/>
    <!-- 砸地迸尘 -->
    <path d="M 66 132 Q 62 130 60 128 M 74 134 Q 76 136 78 134" stroke="#C8B8A0" stroke-width="1.2" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 烛火星尘 -->
  <g fill="#F0C878">
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
