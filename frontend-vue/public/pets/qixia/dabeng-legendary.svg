<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="大奔·五阶·奔雷震山·一剑震山威震江湖">
  <defs>
    <!-- 背景：战场山河 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A878"/>
      <stop offset="52%" stop-color="#B88858"/>
      <stop offset="100%" stop-color="#986844"/>
    </linearGradient>
    <!-- 奔雷金光 -->
    <radialGradient id="thunder" cx="50%" cy="34%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="82%" cy="24%" r="34%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 棕毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A86434"/>
      <stop offset="100%" stop-color="#7A4828"/>
    </linearGradient>
    <!-- 侠客装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8805E"/>
      <stop offset="100%" stop-color="#7E5E3E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#C8A07E"/>
      <stop offset="100%" stop-color="#AE8E6C"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 奔雷金光 -->
  <circle cx="100" cy="82" r="78" fill="url(#thunder)">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 战火 -->
  <circle cx="162" cy="44" r="46" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 敌阵溃散（右上） -->
  <g opacity="0.5">
    <path d="M 160 52 Q 162 44 165 42 Q 168 44 168 52 Z" fill="#4E3A3E"/>
    <path d="M 174 48 Q 176 40 179 38 Q 182 40 182 48 Z" fill="#5E4A4E"/>
  </g>
  <!-- 溃散迸溅 -->
  <g fill="#FFE066" opacity="0.7">
    <circle cx="148" cy="50" r="2"><animate attributeName="cy" values="50;42;50" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="138" cy="44" r="1.6"><animate attributeName="cy" values="44;36;44" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 至亲（旁，含泪含笑） -->
  <g opacity="0.6">
    <path d="M 44 120 Q 46 112 49 110 Q 52 112 52 120 Z" fill="#6E5A4E"/>
    <circle cx="49" cy="108" r="4.5" fill="#D8C8B0"/>
  </g>

  <!-- 山河（下方） -->
  <g opacity="0.5">
    <path d="M 0 154 Q 40 146 90 152 Q 140 158 200 150 L 200 200 L 0 200 Z" fill="#7E6A4E"/>
  </g>
  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E6A4E" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#A8805E" stroke-width="1.4" opacity="0.6"/>

  <!-- 棕毛大熊（6头身，侠客装，奔雷剑在手） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 156 L 86 156 L 90 136 Z" fill="#6E4022"/>
  <path d="M 100 134 L 108 158 L 102 158 L 96 136 Z" fill="#6E4022"/>
  <!-- 侠客装 -->
  <path d="M 84 100 Q 80 118 86 134 Q 96 140 104 134 Q 110 118 106 100 Q 96 94 84 100 Z" fill="url(#robe)" stroke="#6E4E34" stroke-width="1"/>
  <!-- 宽革带 -->
  <path d="M 84 116 L 106 116" stroke="#5E4430" stroke-width="2"/>
  <!-- 右臂（裸露，肌肉虬结） -->
  <path d="M 104 102 C 112 98 118 96 122 90" fill="none" stroke="#C8A07E" stroke-width="5" stroke-linecap="round"/>
  <circle cx="124" cy="88" r="3.4" fill="#C8A07E"/>
  <!-- 尾巴 -->
  <path d="M 110 128 Q 120 122 124 114" stroke="#7A4828" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 110 128;10 110 128;0 110 128" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（熊脸，圆眼豪迈，眼底含光） -->
  <ellipse cx="94" cy="92" rx="12" ry="11.5" fill="url(#fur)" stroke="#4E2A18" stroke-width="0.9"/>
  <!-- 圆耳 -->
  <circle cx="82" cy="82" r="4" fill="#A86434" stroke="#4E2A18" stroke-width="0.8"/>
  <circle cx="106" cy="82" r="4" fill="#A86434" stroke="#4E2A18" stroke-width="0.8"/>
  <circle cx="82" cy="82" r="2" fill="#C89678"/>
  <circle cx="106" cy="82" r="2" fill="#C89678"/>
  <!-- 高马尾 -->
  <path d="M 90 80 Q 86 70 90 66 Q 96 68 98 78" fill="#7A4828"/>
  <!-- 熊脸浅斑 -->
  <ellipse cx="94" cy="97" rx="7" ry="5" fill="#C8A07E"/>
  <!-- 圆眼豪迈 -->
  <circle cx="88" cy="90" r="3.2" fill="#1E1008"/>
  <circle cx="100" cy="90" r="3.2" fill="#1E1008"/>
  <circle cx="89" cy="89" r="1.1" fill="#FFF"/>
  <circle cx="101" cy="89" r="1.1" fill="#FFF"/>
  <circle cx="88.6" cy="89.6" r="0.7" fill="#FFE066"/>
  <circle cx="99.4" cy="89.6" r="0.7" fill="#FFE066"/>
  <!-- 宽鼻 -->
  <ellipse cx="94" cy="95" rx="2.6" ry="2" fill="#3A2E26"/>
  <!-- 豪迈抿唇 -->
  <path d="M 90 99 Q 94 100.6 98 99" fill="none" stroke="#6E4A3E" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 86 104 C 80 108 78 114 80 120" fill="none" stroke="#A8805E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="122" r="3.2" fill="#C8A07E"/>

  <!-- 右手持奔雷剑（震山，指天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 剑在手 -->
    <line x1="124" y1="90" x2="136" y2="58" stroke="#FFE066" stroke-width="3" stroke-linecap="round"/>
    <path d="M 136 58 L 139 52" stroke="#FFE066" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 震山剑光 -->
    <circle cx="136" cy="56" r="14" fill="url(#thunder)">
      <animate attributeName="r" values="14;19;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 136 54 L 142 42 M 138 58 L 148 50" stroke="#FFF3C4" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 奔雷星尘 -->
  <g fill="#FFE066">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
