<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="达达·五阶·旋风破竹·焦土新笋春风起">
  <defs>
    <!-- 背景：春风新竹 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E0B8"/>
      <stop offset="52%" stop-color="#A8C89A"/>
      <stop offset="100%" stop-color="#88B07E"/>
    </linearGradient>
    <!-- 春风暖光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="54%">
      <stop offset="0%" stop-color="#FFF8E8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 旋风金 -->
    <radialGradient id="wind" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#C8E878" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8E878" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿面 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F0E4"/>
      <stop offset="100%" stop-color="#CAD6CA"/>
    </linearGradient>
    <!-- 青衫侠客 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA878"/>
      <stop offset="100%" stop-color="#4E8860"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2E4CE"/>
      <stop offset="100%" stop-color="#DACC B6"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 春风暖光 -->
  <circle cx="100" cy="86" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 旋风金 -->
  <circle cx="100" cy="96" r="64" fill="url(#wind)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 新竹（成片） -->
  <g stroke="#6E9E6E" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
    <path d="M 24 120 Q 22 80 26 44"/>
    <path d="M 176 118 Q 178 78 174 42"/>
    <path d="M 30 90 L 20 104 M 172 88 L 182 102"/>
  </g>
  <!-- 新笋（焦土中破土） -->
  <g fill="#8EC878" opacity="0.9">
    <path d="M 146 148 Q 148 140 152 138 Q 154 144 152 148 Z">
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 156 150 Q 158 144 161 142 Q 163 148 161 150 Z">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E72" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#96B08A" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿面熊猫（6头身，青衫侠客，旋风剑在手，蹲身轻抚新竹） -->
  <!-- 腿 -->
  <path d="M 82 134 L 78 156 L 84 156 L 88 136 Z" fill="#4E8860"/>
  <path d="M 98 134 L 106 158 L 100 158 L 94 136 Z" fill="#4E8860"/>
  <!-- 青衫 -->
  <path d="M 80 100 Q 76 118 84 134 Q 94 140 102 134 Q 108 118 104 100 Q 92 94 80 100 Z" fill="url(#robe)" stroke="#3E7048" stroke-width="1"/>
  <!-- 腰间玉带 -->
  <path d="M 80 116 L 104 116" stroke="#E8D8A8" stroke-width="1.4"/>
  <!-- 尾巴 -->
  <path d="M 106 128 Q 114 124 116 118" stroke="#4E8860" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 106 128;8 106 128;0 106 128" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（熊猫脸，圆眼含笑，眼底有光，斗笠轻抬） -->
  <!-- 斗笠 -->
  <path d="M 72 82 Q 88 72 106 82 Q 110 86 108 88 L 74 88 Q 72 86 72 82 Z" fill="#7E9678" stroke="#668A60" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 90 82;2 90 82;0 90 82" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 熊猫脸 -->
  <ellipse cx="90" cy="92" rx="11" ry="11.5" fill="url(#fur)" stroke="#7E9A76" stroke-width="0.9"/>
  <!-- 熊猫耳 -->
  <circle cx="79" cy="82" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <circle cx="101" cy="82" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <!-- 眼周黑斑 -->
  <ellipse cx="85" cy="90" rx="4" ry="3.4" fill="#2A4236"/>
  <ellipse cx="95" cy="90" rx="4" ry="3.4" fill="#2A4236"/>
  <!-- 圆眼含笑 -->
  <path d="M 84 90 Q 86 88.4 88 90 Q 86 91.6 84 90 Z" fill="#1E1008"/>
  <path d="M 96 90 Q 94 88.4 92 90 Q 94 91.6 96 90 Z" fill="#1E1008"/>
  <circle cx="85.6" cy="89.6" r="0.7" fill="#C8E878"/>
  <circle cx="94.4" cy="89.6" r="0.7" fill="#C8E878"/>
  <!-- 鼻 -->
  <ellipse cx="90" cy="95" rx="2.4" ry="1.8" fill="#5E7668"/>
  <!-- 含笑 -->
  <path d="M 86 99 Q 90 101.4 94 99" fill="none" stroke="#6E8E7E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（持旋风剑，指地，剑意春风） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 82 104;3 82 104;-3 82 104" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 82 104 C 76 108 74 114 76 120" fill="none" stroke="#6EA878" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="76" cy="122" r="3" fill="#F2E4CE"/>
    <!-- 旋风剑 -->
    <line x1="76" y1="120" x2="58" y2="144" stroke="#C8E878" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 58 144 L 56 150" stroke="#C8E878" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 春风剑意 -->
    <path d="M 58 144 Q 48 152 42 158" stroke="#C8E878" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（轻抚新笋） -->
  <path d="M 100 104 C 108 108 114 114 116 120" fill="none" stroke="#6EA878" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="122" r="2.8" fill="#F2E4CE"/>

  <!-- 旋叶星尘 -->
  <g fill="#C8E878">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
