<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝兔·五阶·冰魄封霜·一剑封霜百里雪夜护盟">
  <defs>
    <!-- 背景：雪夜营地决战前 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E5A8E"/>
      <stop offset="52%" stop-color="#2E4A7E"/>
      <stop offset="100%" stop-color="#1E3A6E"/>
    </linearGradient>
    <!-- 冰魄封霜 -->
    <radialGradient id="ice" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#B8E8F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5E9EC8" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火微红 -->
    <radialGradient id="fire" cx="82%" cy="24%" r="34%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA8E0"/>
      <stop offset="100%" stop-color="#3E86C0"/>
    </linearGradient>
    <!-- 素白长裙 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F0F6"/>
      <stop offset="100%" stop-color="#C0D4E4"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冰魄封霜 -->
  <circle cx="100" cy="88" r="82" fill="url(#ice)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 战火微红 -->
  <circle cx="164" cy="44" r="48" fill="url(#fire)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 夜袭之敌（被冻住，右） -->
  <g opacity="0.6">
    <path d="M 162 58 Q 164 48 167 46 Q 170 48 170 58 Z" fill="#3E4E6E"/>
    <path d="M 176 52 Q 178 44 181 42 Q 184 44 184 52 Z" fill="#4E5E7E"/>
    <!-- 封霜 -->
    <path d="M 160 54 L 152 50 M 184 48 L 192 44" stroke="#B8E8F8" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- 雪地 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#DCE4EE" opacity="0.65"/>
  <path d="M 0 152 L 200 152" stroke="#E8F0FA" stroke-width="1.4" opacity="0.5"/>

  <!-- 雪 -->
  <g fill="#E8F0FA" opacity="0.8">
    <circle cx="40" cy="36" r="1.3"><animate attributeName="cy" values="36;52;36" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="28" r="1.1"><animate attributeName="cy" values="28;44;28" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="58" r="1"><animate attributeName="cy" values="58;74;58" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 蓝毛白兔（6头身，冰魄剑在手，七侠巾帼） -->
  <!-- 腿 -->
  <path d="M 82 136 L 78 158 L 84 158 L 88 138 Z" fill="#3E86C0"/>
  <path d="M 98 136 L 106 160 L 100 160 L 94 138 Z" fill="#3E86C0"/>
  <!-- 素白长裙 -->
  <path d="M 82 102 Q 78 120 84 136 Q 94 142 102 136 Q 108 120 104 102 Q 94 96 82 102 Z" fill="url(#robe)" stroke="#98AEBE" stroke-width="1"/>
  <!-- 披帛飘动 -->
  <path d="M 82 106 L 72 118 M 104 106 L 114 116" stroke="#8EB8D8" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 腰间冰魄坠 -->
  <circle cx="94" cy="122" r="2.2" fill="#7EB8E8" stroke="#D8F0FC" stroke-width="0.5"/>
  <!-- 尾巴 -->
  <path d="M 108 130 Q 116 126 118 120" stroke="#C0D4E4" stroke-width="2.4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 108 130;8 108 130;0 108 130" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（兔脸，坚定守望） -->
  <ellipse cx="92" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 兔耳 -->
  <path d="M 84 84 Q 79 70 83 60 Q 88 60 89 72 Q 89 80 90 84 Z" fill="#5EA8E0" stroke="#2E6EA8" stroke-width="0.8"/>
  <path d="M 100 84 Q 105 70 101 60 Q 96 60 95 72 Q 95 80 94 84 Z" fill="#5EA8E0" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 内耳粉 -->
  <path d="M 84 82 Q 81 72 84 66 Q 87 68 87 76 Z" fill="#DCA8BC"/>
  <path d="M 100 82 Q 103 72 100 66 Q 97 68 97 76 Z" fill="#DCA8BC"/>
  <!-- 白脸斑 -->
  <ellipse cx="92" cy="96" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 兔眼坚定（金瞳微光） -->
  <circle cx="87" cy="90" r="2.8" fill="#1E1008"/>
  <circle cx="97" cy="90" r="2.8" fill="#1E1008"/>
  <circle cx="88" cy="89" r="1" fill="#FFF"/>
  <circle cx="98" cy="89" r="1" fill="#FFF"/>
  <circle cx="87.6" cy="89.6" r="0.7" fill="#B8E8F8"/>
  <circle cx="96.4" cy="89.6" r="0.7" fill="#B8E8F8"/>
  <!-- 兔鼻 -->
  <path d="M 90 95 L 92 97 L 94 95" fill="none" stroke="#C85A78" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 坚定抿唇 -->
  <path d="M 88 99 Q 92 100.6 96 99" fill="none" stroke="#8E5A6E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 84 106 C 78 110 76 116 78 122" fill="none" stroke="#E8F0F6" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="78" cy="124" r="3" fill="#F0DCC6"/>

  <!-- 右手持冰魄剑（封霜，指前） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 100 106 C 108 100 114 96 118 90" fill="none" stroke="#E8F0F6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="88" r="3.2" fill="#F0DCC6"/>
    <!-- 冰魄剑 -->
    <line x1="120" y1="90" x2="134" y2="58" stroke="#B8E8F8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 134 58 L 137 52" stroke="#B8E8F8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 封霜剑光 -->
    <circle cx="134" cy="56" r="12" fill="url(#ice)">
      <animate attributeName="r" values="12;17;12" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 134 54 L 140 42 M 136 58 L 146 50" stroke="#B8E8F8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 冰魄星尘 -->
  <g fill="#B8E8F8">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
