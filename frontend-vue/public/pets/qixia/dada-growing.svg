<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="达达·三阶·借风苦修·荒山风口借风旋叶">
  <defs>
    <!-- 背景：荒山风口 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8B8A0"/>
      <stop offset="52%" stop-color="#889E80"/>
      <stop offset="100%" stop-color="#6E8468"/>
    </linearGradient>
    <!-- 风青 -->
    <radialGradient id="wind" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#B8E8A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8E8A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 旋叶金 -->
    <radialGradient id="leaf" cx="30%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#E8D868" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8D868" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿面 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0EAD8"/>
      <stop offset="100%" stop-color="#C0CCC0"/>
    </linearGradient>
    <!-- 青衫练剑装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8E68"/>
      <stop offset="100%" stop-color="#427048"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E2CC"/>
      <stop offset="100%" stop-color="#D8C8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 风青 -->
  <circle cx="100" cy="96" r="70" fill="url(#wind)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 旋叶 -->
  <circle cx="66" cy="106" r="48" fill="url(#leaf)">
    <animate attributeName="opacity" values="0.5;0.28;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <path d="M 0 130 Q 40 118 90 126 Q 140 132 200 122 L 200 200 L 0 200 Z" fill="#889E80" opacity="0.6"/>

  <!-- 风线 -->
  <g stroke="#B8D8A8" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <path d="M 20 60 Q 36 56 50 60">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 48 Q 164 44 178 48">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 旋叶（随剑起舞） -->
  <g fill="#E8D868" opacity="0.8">
    <path d="M 44 92 Q 40 88 40 84 Q 44 86 44 92 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 44 92;180 44 92;360 44 92" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 52 76 Q 48 72 48 68 Q 52 70 52 76 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 52 76;-180 52 76;-360 52 76" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6E8468" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#88A080" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿面熊猫（5头身，青衫束袖，头戴斗笠，旋风剑在手） -->
  <!-- 腿 -->
  <path d="M 82 136 L 78 158 L 84 158 L 88 138 Z" fill="#427048"/>
  <path d="M 98 136 L 106 160 L 100 160 L 94 138 Z" fill="#427048"/>
  <!-- 青衫 -->
  <path d="M 80 100 Q 76 118 84 136 Q 94 142 102 136 Q 108 118 104 100 Q 92 94 80 100 Z" fill="url(#robe)" stroke="#36603E" stroke-width="1"/>
  <!-- 束袖 -->
  <path d="M 80 102 L 76 108 M 104 102 L 110 106" stroke="#6E9E78" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 腰间玉带 -->
  <path d="M 80 118 L 104 118" stroke="#E8D8A8" stroke-width="1.4"/>
  <!-- 尾巴 -->
  <path d="M 106 130 Q 114 126 116 120" stroke="#427048" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（熊猫脸，圆眼坚毅，斗笠压着） -->
  <!-- 斗笠 -->
  <path d="M 72 84 Q 88 74 106 84 Q 110 88 108 90 L 74 90 Q 72 88 72 84 Z" fill="#7E9678" stroke="#668A60" stroke-width="0.8"/>
  <path d="M 72 86 Q 88 80 106 86 L 108 90 L 74 90 Z" fill="#8EA688"/>
  <!-- 熊猫脸 -->
  <ellipse cx="90" cy="94" rx="11" ry="11.5" fill="url(#fur)" stroke="#7E9A76" stroke-width="0.9"/>
  <!-- 熊猫耳 -->
  <circle cx="79" cy="84" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <circle cx="101" cy="84" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <!-- 眼周黑斑 -->
  <ellipse cx="85" cy="92" rx="4" ry="3.4" fill="#2A4236"/>
  <ellipse cx="95" cy="92" rx="4" ry="3.4" fill="#2A4236"/>
  <!-- 束发道髻 -->
  <path d="M 87 82 Q 90 74 95 74 Q 98 74 96 82 Z" fill="#427048"/>
  <!-- 圆眼坚毅 -->
  <circle cx="85" cy="92" r="2.2" fill="#1E1008"/>
  <circle cx="95" cy="92" r="2.2" fill="#1E1008"/>
  <circle cx="85.6" cy="91.4" r="0.8" fill="#FFF"/>
  <circle cx="95.6" cy="91.4" r="0.8" fill="#FFF"/>
  <!-- 鼻 -->
  <ellipse cx="90" cy="97" rx="2.4" ry="1.8" fill="#5E7668"/>
  <!-- 沉稳抿唇 -->
  <path d="M 86 101 Q 90 102.6 94 101" fill="none" stroke="#6E8E7E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（持旋风剑，借风） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 76 104;5 76 104;-6 76 104" dur="2s" repeatCount="indefinite"/>
    <path d="M 82 104 C 76 108 74 114 76 120" fill="none" stroke="#5E8E68" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="76" cy="122" r="3" fill="#F0E2CC"/>
    <!-- 旋风剑 -->
    <line x1="76" y1="120" x2="54" y2="146" stroke="#B8E8A8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 54 146 L 52 152" stroke="#B8E8A8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑引旋风 -->
    <path d="M 54 146 Q 44 154 38 160" stroke="#B8E8A8" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，借风旋叶） -->
  <path d="M 100 104 C 106 100 110 96 112 90" fill="none" stroke="#5E8E68" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="113" cy="88" r="2.8" fill="#F0E2CC"/>

  <!-- 旋叶星尘 -->
  <g fill="#B8E8A8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
