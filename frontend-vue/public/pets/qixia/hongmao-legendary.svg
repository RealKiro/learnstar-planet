<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="虹猫·五阶·长虹贯日·一剑贯日威震魔营">
  <defs>
    <!-- 背景：战场决战前奏 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A878"/>
      <stop offset="52%" stop-color="#B88858"/>
      <stop offset="100%" stop-color="#986844"/>
    </linearGradient>
    <!-- 长虹贯日 -->
    <radialGradient id="sun" cx="60%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="78%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 红毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E84E3A"/>
      <stop offset="100%" stop-color="#B83A2E"/>
    </linearGradient>
    <!-- 侠客装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8403A"/>
      <stop offset="100%" stop-color="#B83030"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：猫脸·圆眼含光·剑意圆满（脸中心 0,0） -->
    <g id="hongmao-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#A83228" stroke-width="0.8"/>
      <path d="M -9 -8 L -15 -18 L -3 -12 Z" fill="#E84E3A" stroke="#A83228" stroke-width="0.8"/>
      <path d="M 9 -8 L 15 -18 L 3 -12 Z" fill="#E84E3A" stroke="#A83228" stroke-width="0.8"/>
      <path d="M -10 -10 L -13 -16 L -5 -12 Z" fill="#F0B8C0"/>
      <path d="M 10 -10 L 13 -16 L 5 -12 Z" fill="#F0B8C0"/>
      <path d="M -7 -6 Q 0 -9 7 -6 L 5 -8 Q 0 -11 -5 -8 Z" fill="#B83A2E"/>
      <path d="M 7 -6 L 11 -8" stroke="#B83A2E" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="0" cy="3" rx="7" ry="5.5" fill="#F0D8BC"/>
      <circle cx="-5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="-4" cy="-1" r="1" fill="#FFF"/>
      <circle cx="6" cy="-1" r="1" fill="#FFF"/>
      <circle cx="-4.2" cy="0.2" r="0.6" fill="#FFE066"/>
      <circle cx="4.2" cy="0.2" r="0.6" fill="#FFE066"/>
      <circle cx="0" cy="4" r="1.5" fill="#C85068"/>
      <path d="M -9 4 L -15 3 M -9 6 L -15 7 M 9 4 L 15 3 M 9 6 L 15 7" stroke="#C8B098" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -4 8 Q 0 9.2 4 8" fill="none" stroke="#8E5A3E" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 长虹贯日（光柱冲天） -->
  <circle cx="110" cy="80" r="80" fill="url(#sun)">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 贯日光柱 -->
  <path d="M 108 60 L 104 20 L 112 16 L 114 0 L 118 0 L 118 20 L 126 24 L 122 62 Z" fill="#FFF3C4" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 战火 -->
  <circle cx="156" cy="48" r="50" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 魔营敌影（右上，被贯日重创溃散） -->
  <g opacity="0.5">
    <path d="M 160 40 Q 162 32 165 30 Q 168 32 168 40 Z" fill="#3E2E3E"/>
    <path d="M 174 44 Q 176 36 179 34 Q 182 36 182 44 Z" fill="#4E3A4E"/>
  </g>
  <!-- 溃散迸溅 -->
  <g fill="#FFE066" opacity="0.7">
    <circle cx="146" cy="50" r="2"><animate attributeName="cy" values="50;42;50" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="136" cy="44" r="1.6"><animate attributeName="cy" values="44;36;44" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E6A4E" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#A8805E" stroke-width="1.4" opacity="0.6"/>

  <!-- 红毛小猫（6头身，七侠之首气度，长虹剑在手） -->
  <!-- 腿 -->
  <path d="M 80 134 L 76 156 L 82 156 L 86 136 Z" fill="#B83030"/>
  <path d="M 96 134 L 104 158 L 98 158 L 92 136 Z" fill="#B83030"/>
  <!-- 侠客装 -->
  <path d="M 80 100 Q 76 118 82 134 Q 92 140 100 134 Q 106 118 102 100 Q 92 94 80 100 Z" fill="url(#robe)" stroke="#982020" stroke-width="1"/>
  <!-- 护腕 -->
  <path d="M 82 102 L 100 102 L 99 106 L 83 106 Z" fill="#E8D8A8" stroke="#B8964E" stroke-width="0.8"/>
  <!-- 革带 -->
  <path d="M 80 116 L 102 116" stroke="#8E6A42" stroke-width="1.6"/>
  <!-- 尾巴 -->
  <path d="M 104 128 Q 114 122 118 114" stroke="#B83A2E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 104 128;10 104 128;0 104 128" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（猫脸，金瞳） -->
  <use href="#hongmao-face" transform="translate(90,92) scale(1)"/>
  <!-- 发带迎风 -->
  <path d="M 90 84 L 76 78" stroke="#B83A2E" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 左臂（护身） -->
  <path d="M 82 106 C 76 110 74 116 76 122" fill="none" stroke="#D8403A" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="76" cy="124" r="3" fill="#D0B090"/>

  <!-- 右手持长虹剑（贯日，指天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 98 106 C 106 100 112 96 116 90" fill="none" stroke="#D8403A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="118" cy="88" r="3.2" fill="#D0B090"/>
    <!-- 长虹剑（贯日） -->
    <line x1="118" y1="90" x2="130" y2="60" stroke="#E8D8A8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 130 60 L 133 54" stroke="#E8D8A8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 贯日剑光 -->
    <circle cx="130" cy="58" r="12" fill="url(#sun)">
      <animate attributeName="r" values="12;17;12" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 130 56 L 136 44 M 132 60 L 142 52" stroke="#FFF3C4" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 长虹星尘 -->
  <g fill="#FFE066">
    <circle cx="30" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
