<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="虹猫·四阶·剑成初试·长虹与冰魄交明">
  <defs>
    <!-- 背景：初战之地烽火 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A878"/>
      <stop offset="52%" stop-color="#B88858"/>
      <stop offset="100%" stop-color="#986844"/>
    </linearGradient>
    <!-- 长虹金 -->
    <radialGradient id="rainbow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 冰魄蓝 -->
    <radialGradient id="ice" cx="70%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9AC8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 魔教暗 -->
    <radialGradient id="dark" cx="85%" cy="22%" r="30%">
      <stop offset="0%" stop-color="#4E3A4E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4E3A4E" stop-opacity="0"/>
    </radialGradient>
    <!-- 红毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E84E3A"/>
      <stop offset="100%" stop-color="#B83A2E"/>
    </linearGradient>
    <!-- 侠客装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8403A"/>
      <stop offset="100%" stop-color="#B83030"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：猫脸·圆眼含笑·剑意初亮（脸中心 0,0） -->
    <g id="hongmao-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#A83228" stroke-width="0.8"/>
      <path d="M -9 -8 L -15 -18 L -3 -12 Z" fill="#E84E3A" stroke="#A83228" stroke-width="0.8"/>
      <path d="M 9 -8 L 15 -18 L 3 -12 Z" fill="#E84E3A" stroke="#A83228" stroke-width="0.8"/>
      <path d="M -10 -10 L -13 -16 L -5 -12 Z" fill="#F0B8C0"/>
      <path d="M 10 -10 L 13 -16 L 5 -12 Z" fill="#F0B8C0"/>
      <path d="M -7 -6 Q 0 -9 7 -6 L 5 -8 Q 0 -11 -5 -8 Z" fill="#B83A2E"/>
      <path d="M 7 -6 L 11 -8" stroke="#B83A2E" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="0" cy="3" rx="7" ry="5.5" fill="#F0D8BC"/>
      <circle cx="-5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="-4" cy="-1" r="1" fill="#FFF"/>
      <circle cx="6" cy="-1" r="1" fill="#FFF"/>
      <circle cx="0" cy="4" r="1.5" fill="#C85068"/>
      <path d="M -9 4 L -15 3 M -9 6 L -15 7 M 9 4 L 15 3 M 9 6 L 15 7" stroke="#C8B098" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -4 8 Q 0 9.4 4 8" fill="none" stroke="#8E5A3E" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 长虹光 -->
  <circle cx="80" cy="90" r="70" fill="url(#rainbow)">
    <animate attributeName="opacity" values="0.85;0.5;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 冰魄光 -->
  <circle cx="140" cy="96" r="50" fill="url(#ice)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 魔教远影 -->
  <circle cx="170" cy="44" r="40" fill="url(#dark)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 164 44 Q 168 52 162 60 Q 158 50 164 44 Z" fill="#3E2E3E" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 初战烽火 -->
  <g fill="#E8623A" opacity="0.6">
    <circle cx="30" cy="50" r="2"><animate attributeName="cy" values="50;62;50" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="40" r="1.6"><animate attributeName="cy" values="40;52;40" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#8E6A4E" opacity="0.7"/>
  <path d="M 0 154 L 200 154" stroke="#A8805E" stroke-width="1.4" opacity="0.6"/>

  <!-- 红毛小猫（5头身，侠客装，长虹剑小成，与蓝兔并肩） -->
  <!-- 腿 -->
  <path d="M 74 134 L 70 156 L 76 156 L 80 136 Z" fill="#B83030"/>
  <path d="M 90 134 L 98 158 L 92 158 L 86 136 Z" fill="#B83030"/>
  <!-- 侠客装 -->
  <path d="M 74 100 Q 70 118 76 134 Q 86 140 94 134 Q 100 118 96 100 Q 86 94 74 100 Z" fill="url(#robe)" stroke="#982020" stroke-width="1"/>
  <!-- 护腕 -->
  <path d="M 76 102 L 94 102 L 93 106 L 77 106 Z" fill="#E8D8A8" stroke="#B8964E" stroke-width="0.8"/>
  <!-- 革带 -->
  <path d="M 74 116 L 96 116" stroke="#8E6A42" stroke-width="1.6"/>
  <!-- 腰间长虹剑 -->
  <line x1="94" y1="112" x2="100" y2="134" stroke="#E8D8A8" stroke-width="2" stroke-linecap="round"/>
  <!-- 尾巴 -->
  <path d="M 98 128 Q 108 122 112 114" stroke="#B83A2E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 98 128;10 98 128;0 98 128" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（猫脸） -->
  <use href="#hongmao-face" transform="translate(84,92) scale(1)"/>

  <!-- 左臂（持长虹剑，小成） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 78 106;3 78 106;-4 78 106" dur="2s" repeatCount="indefinite"/>
    <path d="M 78 106 C 72 110 68 114 66 120" fill="none" stroke="#D8403A" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="65" cy="122" r="3" fill="#D0B090"/>
    <!-- 长虹剑 -->
    <line x1="65" y1="120" x2="42" y2="146" stroke="#E8D8A8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 42 146 L 40 152" stroke="#E8D8A8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 长虹贯日小成（剑光） -->
    <path d="M 42 146 Q 32 156 26 162" stroke="#FFE066" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，望向蓝兔） -->
  <path d="M 92 106 C 98 102 102 98 104 92" fill="none" stroke="#D8403A" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="105" cy="90" r="2.8" fill="#D0B090"/>

  <!-- 蓝兔（右，并肩，冰魄剑） -->
  <g opacity="0.9">
    <path d="M 130 134 L 126 156 L 132 156 L 136 136 Z" fill="#4E8EAE"/>
    <path d="M 130 100 Q 126 118 132 134 Q 142 140 150 134 Q 156 118 152 100 Q 142 94 130 100 Z" fill="#5E9EBE" stroke="#3E7E9E" stroke-width="1"/>
    <!-- 蓝兔长发 -->
    <path d="M 140 92 Q 144 88 142 82" stroke="#1E1814" stroke-width="2" stroke-linecap="round"/>
    <path d="M 138 92 Q 134 90 132 92" stroke="#1E1814" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 蓝兔脸 -->
    <circle cx="140" cy="92" r="9" fill="#F6E2CC"/>
    <circle cx="137" cy="91" r="2" fill="#1E1008"/>
    <circle cx="143" cy="91" r="2" fill="#1E1008"/>
    <circle cx="137" cy="90.3" r="0.7" fill="#FFF"/>
    <circle cx="143" cy="90.3" r="0.7" fill="#FFF"/>
    <!-- 蓝兔冰魄剑 -->
    <line x1="140" y1="108" x2="150" y2="132" stroke="#B8E8F8" stroke-width="2" stroke-linecap="round"/>
    <!-- 冰魄光 -->
    <circle cx="148" cy="128" r="10" fill="url(#ice)">
      <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 长虹冰魄交映 -->
  <path d="M 68 130 Q 104 118 140 126" stroke="#FFF3C4" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 长虹星尘 -->
  <g fill="#FFE066">
    <circle cx="30" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
