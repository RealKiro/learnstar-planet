<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="马三娘·二阶·奉命潜伏·侍女素裙剑藏于拙">
  <defs>
    <!-- 背景：玉蟾宫外 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8DCE8"/>
      <stop offset="52%" stop-color="#9AC8DE"/>
      <stop offset="100%" stop-color="#7EB0CE"/>
    </linearGradient>
    <!-- 宫阙暖光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#F4FBFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4FBFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 眼底紫 -->
    <radialGradient id="purple" cx="50%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#C8A8F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8A8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EBA"/>
      <stop offset="100%" stop-color="#6E4E9A"/>
    </linearGradient>
    <!-- 素裙 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F8FC"/>
      <stop offset="100%" stop-color="#D8E4EE"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C4AE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 宫阙暖光 -->
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>
  <!-- 眼底紫 -->
  <circle cx="100" cy="112" r="56" fill="url(#purple)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 玉蟾宫宫阙 -->
  <g opacity="0.7">
    <path d="M 132 96 L 132 78 L 160 78 L 160 96 L 168 96 L 168 72 L 124 72 L 124 96 Z" fill="#D8E8F2"/>
    <path d="M 146 78 L 146 66 L 145 78 Z" fill="#D8E8F2"/>
    <path d="M 124 72 L 146 60 L 168 72 L 146 66 Z" fill="#4E9EC8"/>
    <path d="M 124 72 L 118 68 M 168 72 L 174 68" stroke="#4E9EC8" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#E8F4FA" opacity="0.85"/>
  <path d="M 0 150 L 200 150" stroke="#D0E4F0" stroke-width="1.4" opacity="0.7"/>

  <!-- 紫毛女剑客（6头身，侍女素裙，低眉顺眼，眼底剑光） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 158 L 86 158 L 90 136 Z" fill="#6E4E9A"/>
  <path d="M 98 134 L 106 160 L 100 160 L 94 136 Z" fill="#6E4E9A"/>
  <!-- 素裙 -->
  <path d="M 82 98 Q 78 118 86 136 Q 96 142 104 136 Q 110 118 106 98 Q 94 92 82 98 Z" fill="url(#robe)" stroke="#B8CEE0" stroke-width="1"/>
  <!-- 腰间（假装笨拙的围裙带） -->
  <path d="M 82 118 L 106 118" stroke="#C8D8E8" stroke-width="1.4"/>
  <!-- 发间一缕紫纱 -->
  <path d="M 94 84 L 84 80 L 80 82 L 90 86" stroke="#C8A8F0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- 尾巴 -->
  <path d="M 108 130 Q 116 126 118 118" stroke="#6E4E9A" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（温顺面容，侍女髻，眼底微光） -->
  <ellipse cx="94" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3E8C" stroke-width="0.9"/>
  <!-- 猫耳（略垂） -->
  <path d="M 85 84 L 80 71 L 89 79 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 103 84 L 108 71 L 99 79 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 85 82 L 81 73 L 87 79 Z" fill="#D0B0E0"/>
  <path d="M 103 82 L 107 73 L 101 79 Z" fill="#D0B0E0"/>
  <!-- 侍女髻 -->
  <path d="M 92 82 Q 94 76 98 76 Q 101 78 100 82 Q 96 84 92 82 Z" fill="#6E4E9A"/>
  <path d="M 98 77 L 100 72" stroke="#C8A8F0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 细眉（温顺） -->
  <path d="M 87 86 Q 90 84.8 93 86 M 95 86 Q 98 84.8 101 86" stroke="#3A263E" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 浅色面斑 -->
  <ellipse cx="94" cy="96" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 温顺眼（低眉） -->
  <path d="M 87 90 Q 90 88.8 93 90 L 93 91.6 Q 90 90.2 87 91.6 Z" fill="#1E1008"/>
  <path d="M 101 90 Q 98 88.8 95 90 L 95 91.6 Q 98 90.2 101 91.6 Z" fill="#1E1008"/>
  <circle cx="88.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="99.5" cy="90.3" r="1" fill="#FFF"/>
  <!-- 眼底剑光一闪 -->
  <circle cx="89.6" cy="90.4" r="0.5" fill="#C8A8F0"/>
  <circle cx="98.4" cy="90.4" r="0.5" fill="#C8A8F0"/>
  <!-- 鼻梁挺 -->
  <path d="M 94 93 L 94 95.5" stroke="#B09078" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 薄唇（温顺微抿） -->
  <path d="M 90 99 Q 94 100.4 98 99" fill="none" stroke="#A06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（假装笨拙端盆） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <path d="M 84 106 C 78 110 76 116 78 122" fill="none" stroke="#F4F8FC" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="78" cy="124" r="3" fill="#F0DCC6"/>
    <!-- 水盆 -->
    <path d="M 70 122 Q 72 128 80 128 Q 88 128 90 122 Z" fill="#B0C8D8" stroke="#8EAEBE" stroke-width="0.8"/>
  </g>

  <!-- 右手（袖中暗藏袖剑，敛于裙侧） -->
  <path d="M 104 106 C 110 102 114 98 116 92" fill="none" stroke="#F4F8FC" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="90" r="2.8" fill="#F0DCC6"/>
  <!-- 腕间袖剑微光 -->
  <line x1="115" y1="94" x2="120" y2="88" stroke="#C8A8F0" stroke-width="1.4" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- 眼底紫星尘 -->
  <g fill="#C8A8F0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
