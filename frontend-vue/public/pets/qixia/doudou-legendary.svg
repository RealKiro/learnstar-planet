<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="逗逗·五阶·妙手回春·连日救治名动江湖">
  <defs>
    <!-- 背景：医馆灯火 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8A878"/>
      <stop offset="52%" stop-color="#968A5E"/>
      <stop offset="100%" stop-color="#746A46"/>
    </linearGradient>
    <!-- 人间暖光 -->
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF3D8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF3D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 药草绿 -->
    <radialGradient id="herb" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8EC878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8EC878" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F6F8"/>
      <stop offset="100%" stop-color="#D0D8E0"/>
    </linearGradient>
    <!-- 医者装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCC878"/>
      <stop offset="100%" stop-color="#B49E54"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 人间暖光 -->
  <circle cx="100" cy="88" r="78" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 药草绿 -->
  <circle cx="100" cy="112" r="62" fill="url(#herb)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 百姓感激（右，虚影） -->
  <g opacity="0.5">
    <path d="M 168 108 Q 170 100 173 98 Q 176 100 176 108 Z" fill="#6E5A6E"/>
    <circle cx="174" cy="96" r="4.5" fill="#D8C8D8"/>
    <path d="M 182 112 Q 184 104 187 102 Q 190 104 190 112 Z" fill="#7E6A7E"/>
    <circle cx="188" cy="100" r="4" fill="#D8C8D8"/>
  </g>
  <!-- 谢意福光 -->
  <path d="M 170 90 Q 174 84 172 76" stroke="#FFE6B8" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- 药铺屋檐（左） -->
  <g opacity="0.6">
    <path d="M 20 60 L 40 52 L 80 60 L 78 68 L 40 60 L 22 68 Z" fill="#8E7A5E"/>
    <path d="M 30 68 L 74 68 L 74 78 L 30 78 Z" fill="#A89270"/>
    <!-- 药幌子 -->
    <path d="M 36 68 L 36 84 Q 30 86 36 90 L 36 96" stroke="#6E4A3E" stroke-width="2"/>
    <circle cx="36" cy="80" r="4" fill="#D8C878" stroke="#A89258" stroke-width="0.6"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E7A5E" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#A8906E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白毛小狗（6头身，医者装，雨花剑在手） -->
  <!-- 腿 -->
  <path d="M 86 134 L 82 156 L 88 156 L 92 136 Z" fill="#C8D0D8"/>
  <path d="M 102 134 L 110 158 L 104 158 L 98 136 Z" fill="#C8D0D8"/>
  <!-- 医者装 -->
  <path d="M 86 100 Q 82 118 88 134 Q 98 140 106 134 Q 112 118 108 100 Q 98 94 86 100 Z" fill="url(#robe)" stroke="#8E7844" stroke-width="1"/>
  <!-- 药囊 -->
  <path d="M 106 102 L 118 112 L 116 124 L 102 110 Z" fill="#D0C0A0" stroke="#A89268" stroke-width="0.8"/>
  <path d="M 106 106 L 112 116" stroke="#7E6A4E" stroke-width="0.6" stroke-linecap="round"/>
  <!-- 腰间药葫芦 -->
  <circle cx="94" cy="120" r="2.4" fill="#A88A4E" stroke="#8E6A3E" stroke-width="0.6"/>
  <!-- 尾巴（摇） -->
  <path d="M 110 128 Q 120 122 124 114" stroke="#D8E0E8" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 110 128;12 110 128;0 110 128" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（狗脸，圆眼含笑，发揪迎风） -->
  <ellipse cx="96" cy="92" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#9AA2A8" stroke-width="0.8"/>
  <!-- 垂耳 -->
  <path d="M 87 86 Q 79 86 77 94 Q 77 100 83 98 Q 87 94 89 88 Z" fill="#D8C068" stroke="#9E8A50" stroke-width="0.8"/>
  <path d="M 105 86 Q 113 86 115 94 Q 115 100 109 98 Q 105 94 103 88 Z" fill="#D8C068" stroke="#9E8A50" stroke-width="0.8"/>
  <!-- 发揪系新布条 -->
  <path d="M 96 80 Q 94 74 97 71 Q 100 74 98 80 Z" fill="#B0B8C0"/>
  <path d="M 97 71 L 98 66 M 98 66 L 100 68" stroke="#D8C878" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 狗脸白斑 -->
  <ellipse cx="96" cy="96" rx="7" ry="5.5" fill="#F0DCC6"/>
  <!-- 圆眼含笑 -->
  <path d="M 90 91 Q 93 89 96 91 Q 93 93 90 91 Z" fill="#1E1008"/>
  <path d="M 102 91 Q 99 89 96 91 Q 99 93 102 91 Z" fill="#1E1008"/>
  <!-- 狗鼻 -->
  <circle cx="96" cy="95" r="1.8" fill="#3A2E26"/>
  <!-- 咧嘴笑 -->
  <path d="M 91 99 Q 96 103 101 99" fill="none" stroke="#8E6A5E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（持雨花剑，横持） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 78 104;3 78 104;-3 78 104" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 88 104 C 82 108 78 112 76 118" fill="none" stroke="#D8C868" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="75" cy="120" r="3" fill="#F0DCC6"/>
    <!-- 雨花剑 -->
    <line x1="75" y1="118" x2="54" y2="142" stroke="#7EE8C8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 54 142 L 52 148" stroke="#7EE8C8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑气如雨 -->
    <path d="M 54 142 Q 44 150 38 156" stroke="#7EE8C8" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（把脉，仁心） -->
  <path d="M 104 104 C 110 100 114 96 116 90" fill="none" stroke="#D8C868" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="88" r="2.8" fill="#F0DCC6"/>

  <!-- 药香星尘 -->
  <g fill="#8EC878">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
