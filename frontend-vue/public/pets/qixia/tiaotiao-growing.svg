<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="跳跳·三阶·忍辱卧底·暗室练剑一缕青光">
  <defs>
    <!-- 背景：魔教暗殿 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E3A52"/>
      <stop offset="52%" stop-color="#2E2A42"/>
      <stop offset="100%" stop-color="#1E1A32"/>
    </linearGradient>
    <!-- 青光（压得极暗） -->
    <radialGradient id="cyan" cx="50%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#6EE8D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6EE8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 魔烛微红 -->
    <radialGradient id="candle" cx="82%" cy="28%" r="26%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E4E6E"/>
      <stop offset="100%" stop-color="#2A364E"/>
    </linearGradient>
    <!-- 绿毛隐现 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E8E50"/>
      <stop offset="100%" stop-color="#246E3A"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E0C8B0"/>
      <stop offset="100%" stop-color="#C8B098"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 青光（暗） -->
  <circle cx="92" cy="110" r="54" fill="url(#cyan)">
    <animate attributeName="opacity" values="0.5;0.28;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 魔烛 -->
  <circle cx="164" cy="54" r="36" fill="url(#candle)">
    <animate attributeName="opacity" values="0.45;0.25;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 烛 -->
  <path d="M 164 70 L 164 60 L 166 60 L 166 70 Z" fill="#8E6A4E"/>
  <path d="M 164 60 Q 162 54 164 51 Q 166 54 165 60 Z" fill="#E8623A" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- 魔教殿柱 -->
  <g opacity="0.6">
    <path d="M 26 74 Q 28 62 34 60 Q 40 62 42 74 L 42 152 L 26 152 Z" fill="#4E4A5E"/>
    <path d="M 176 76 Q 178 64 184 62 Q 190 64 192 76 L 192 152 L 176 152 Z" fill="#4E4A5E"/>
  </g>

  <!-- 黑心虎身影（窗外） -->
  <g opacity="0.4">
    <path d="M 170 96 Q 172 88 175 86 Q 178 88 178 96 Z" fill="#1E1A2E"/>
    <circle cx="175" cy="84" r="4.5" fill="#3E3A4E"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#1E1E32" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#3E3E52" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿毛小猴（5头身，夜行黑衣蒙面，练剑） -->
  <!-- 腿 -->
  <path d="M 80 132 L 76 152 L 82 152 L 86 134 Z" fill="#2A364E"/>
  <path d="M 96 132 L 104 154 L 98 154 L 92 134 Z" fill="#2A364E"/>
  <!-- 夜行黑衣 -->
  <path d="M 78 98 Q 74 116 82 132 Q 92 138 100 132 Q 106 116 102 98 Q 90 92 78 98 Z" fill="url(#robe)" stroke="#1E2A3E" stroke-width="1"/>
  <!-- 腰间魔教信物 -->
  <path d="M 92 120 L 98 126" stroke="#C8B068" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="100" cy="128" r="2" fill="#C8B068"/>
  <!-- 尾巴（藏） -->
  <path d="M 102 126 Q 108 122 110 116" stroke="#246E3A" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- 头（蒙面，斗笠压低，露一双带刀的眼） -->
  <!-- 斗笠 -->
  <path d="M 74 84 Q 88 74 104 84 Q 108 88 106 90 L 76 90 Q 74 88 74 84 Z" fill="#4E4A5E" stroke="#3E3A4E" stroke-width="0.8"/>
  <path d="M 74 86 Q 88 80 104 86 L 106 90 L 76 90 Z" fill="#5E5A6E"/>
  <!-- 蒙面 -->
  <path d="M 78 92 Q 90 88 104 92 L 104 100 Q 90 104 78 100 Z" fill="#3E4E6E" stroke="#2E3E5E" stroke-width="0.8"/>
  <!-- 露眼 -->
  <circle cx="86" cy="90" r="2.6" fill="#1E1008"/>
  <circle cx="96" cy="90" r="2.6" fill="#1E1008"/>
  <circle cx="86.6" cy="89.4" r="0.8" fill="#FFF"/>
  <circle cx="96.6" cy="89.4" r="0.8" fill="#FFF"/>
  <!-- 眼底藏刀微光 -->
  <circle cx="86.4" cy="89.8" r="0.5" fill="#6EE8D8"/>
  <circle cx="95.6" cy="89.8" r="0.5" fill="#6EE8D8"/>

  <!-- 左臂（持青光软剑，暗练） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 72 106;5 72 106;-6 72 106" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 80 104 C 74 108 70 112 68 118" fill="none" stroke="#3E4E6E" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="67" cy="120" r="3" fill="#E0C8B0"/>
    <!-- 青光软剑（压暗） -->
    <line x1="67" y1="118" x2="50" y2="92" stroke="#6EE8D8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 50 92 L 48 86" stroke="#6EE8D8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 剑气压暗 -->
    <path d="M 50 94 Q 44 88 42 82" stroke="#6EE8D8" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，掩光） -->
  <path d="M 98 104 C 104 100 108 96 110 90" fill="none" stroke="#3E4E6E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="111" cy="88" r="2.8" fill="#E0C8B0"/>

  <!-- 青光星尘（暗） -->
  <g fill="#6EE8D8">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
