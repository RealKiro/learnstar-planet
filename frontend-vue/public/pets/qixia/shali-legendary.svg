<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="莎丽·五阶·夺回紫云·一剑归主雪耻而立">
  <defs>
    <!-- 背景：对决之地风云 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8A0D8"/>
      <stop offset="52%" stop-color="#9680BE"/>
      <stop offset="100%" stop-color="#7460A4"/>
    </linearGradient>
    <!-- 紫云万丈 -->
    <radialGradient id="purple" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#D8BCF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A078D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 对决冷 -->
    <radialGradient id="cold" cx="26%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#9EC8D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9EC8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A06ED0"/>
      <stop offset="100%" stop-color="#7E4EB0"/>
    </linearGradient>
    <!-- 紫色女侠装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A64CE"/>
      <stop offset="100%" stop-color="#7442A8"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E4CEB6"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 紫云万丈 -->
  <circle cx="100" cy="84" r="78" fill="url(#purple)">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 对决冷 -->
  <circle cx="52" cy="96" r="48" fill="url(#cold)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 马三娘（右，被一剑败退） -->
  <g opacity="0.55">
    <path d="M 156 92 Q 158 84 161 82 Q 164 84 164 92 Z" fill="#3E3A5E"/>
    <circle cx="163" cy="80" r="4.5" fill="#D8C8D8"/>
    <path d="M 160 90 L 152 100" stroke="#C8A8F0" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- 败退迸光 -->
  <g fill="#D8BCF8" opacity="0.7">
    <circle cx="148" cy="70" r="2"><animate attributeName="cy" values="70;62;70" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="78" r="1.6"><animate attributeName="cy" values="78;70;78" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#8E7AAC" opacity="0.7"/>
  <path d="M 0 152 L 200 152" stroke="#A890BE" stroke-width="1.4" opacity="0.6"/>

  <!-- 紫毛松鼠（6头身，紫色女侠装，紫云剑重回在手） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 156 L 86 156 L 90 136 Z" fill="#6E3EA0"/>
  <path d="M 100 134 L 108 158 L 102 158 L 96 136 Z" fill="#6E3EA0"/>
  <!-- 紫色女侠装 -->
  <path d="M 84 100 Q 80 118 86 134 Q 96 140 104 134 Q 110 118 106 100 Q 96 94 84 100 Z" fill="url(#robe)" stroke="#5E3490" stroke-width="1"/>
  <!-- 腰间紫带 -->
  <path d="M 84 116 L 106 116" stroke="#D8BCF8" stroke-width="1.6"/>
  <!-- 蓬松大尾 -->
  <path d="M 108 128 Q 118 122 124 114 Q 128 104 122 100 Q 116 104 116 112 Q 114 120 106 126 Z" fill="#8E5EC0" stroke="#6E3EA0" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 108 128;8 108 128;0 108 128" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（松鼠脸，圆眼凛然，颊边蓬毛扬起，含雪耻之光） -->
  <ellipse cx="94" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3490" stroke-width="0.9"/>
  <!-- 松鼠耳 -->
  <path d="M 85 84 L 79 70 L 89 78 Z" fill="#A06ED0" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 103 84 L 109 70 L 99 78 Z" fill="#A06ED0" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 85 82 L 81 72 L 87 78 Z" fill="#E0C0F0"/>
  <path d="M 103 82 L 107 72 L 101 78 Z" fill="#E0C0F0"/>
  <!-- 颊边蓬毛扬起 -->
  <path d="M 83 92 Q 78 90 80 96 Q 82 98 86 96" fill="#8E5EC0"/>
  <path d="M 105 92 Q 110 90 108 96 Q 106 98 102 96" fill="#8E5EC0"/>
  <!-- 发带鲜亮迎风 -->
  <path d="M 88 82 Q 94 78 100 82 L 98 80 Q 94 76 90 80 Z" fill="#D8BCF8"/>
  <path d="M 100 80 L 104 78" stroke="#D8BCF8" stroke-width="1.3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 浅色面斑 -->
  <ellipse cx="94" cy="96" rx="6.5" ry="5" fill="#F6E2CC"/>
  <!-- 圆眼凛然 -->
  <circle cx="89" cy="90" r="3" fill="#1E1008"/>
  <circle cx="99" cy="90" r="3" fill="#1E1008"/>
  <circle cx="90" cy="89" r="1" fill="#FFF"/>
  <circle cx="100" cy="89" r="1" fill="#FFF"/>
  <circle cx="89.6" cy="89.6" r="0.7" fill="#D8BCF8"/>
  <circle cx="98.4" cy="89.6" r="0.7" fill="#D8BCF8"/>
  <!-- 鼻 -->
  <circle cx="94" cy="95" r="1.5" fill="#C86A9E"/>
  <!-- 凛然抿唇 -->
  <path d="M 90 99 Q 94 100.6 98 99" fill="none" stroke="#9E5A8E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 86 104 C 80 108 78 114 80 120" fill="none" stroke="#9A64CE" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="80" cy="122" r="3" fill="#F6E2CC"/>

  <!-- 右手持紫云剑（归主，指天） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 102 104 C 110 98 116 94 120 86" fill="none" stroke="#9A64CE" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="84" r="3.2" fill="#F6E2CC"/>
    <!-- 紫云剑 -->
    <line x1="122" y1="86" x2="132" y2="54" stroke="#D8BCF8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 132 54 L 135 48" stroke="#D8BCF8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 紫云万丈剑光 -->
    <circle cx="132" cy="52" r="13" fill="url(#purple)">
      <animate attributeName="r" values="13;18;13" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 132 50 L 138 38 M 134 54 L 144 46" stroke="#D8BCF8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 紫云星尘 -->
  <g fill="#D8BCF8">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
