<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="莎丽·二阶·被夺剑·重伤倒地剑离身">
  <defs>
    <!-- 背景：暗夜阴冷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E4A6E"/>
      <stop offset="52%" stop-color="#3E3A5E"/>
      <stop offset="100%" stop-color="#2E2A4E"/>
    </linearGradient>
    <!-- 血绛 -->
    <radialGradient id="blood" cx="50%" cy="56%" r="40%">
      <stop offset="0%" stop-color="#B84E3E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B84E3E" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫云剑黯淡 -->
    <radialGradient id="purple" cx="72%" cy="44%" r="30%">
      <stop offset="0%" stop-color="#A088C8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A088C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E5EC0"/>
      <stop offset="100%" stop-color="#6E3EA0"/>
    </linearGradient>
    <!-- 紫衣染血 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E50A8"/>
      <stop offset="100%" stop-color="#5E3A88"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 血绛 -->
  <circle cx="92" cy="112" r="60" fill="url(#blood)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 紫云剑黯淡 -->
  <circle cx="144" cy="90" r="42" fill="url(#purple)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 马三娘（夺剑，右，虚影） -->
  <g opacity="0.55">
    <path d="M 158 104 Q 160 96 163 94 Q 166 96 166 104 Z" fill="#3E3A5E"/>
    <circle cx="164" cy="92" r="4.5" fill="#D8C8D8"/>
    <!-- 夺走的紫云剑 -->
    <line x1="162" y1="98" x2="176" y2="78" stroke="#C8A8F0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E2A44" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 紫毛松鼠（5头身，重伤倒地，手伸向空处） -->
  <!-- 身体（倒地） -->
  <path d="M 70 122 Q 76 116 88 118 Q 112 118 120 112 Q 126 116 120 126 Q 110 132 84 132 Q 72 132 70 122 Z" fill="url(#robe)" stroke="#4E3280" stroke-width="1"/>
  <!-- 血痕 -->
  <path d="M 80 122 Q 82 128 79 134" stroke="#B84E3E" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 96 120 Q 98 124 95 130" stroke="#B84E3E" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <!-- 断裂紫带 -->
  <path d="M 76 118 L 68 114 M 118 116 L 126 112" stroke="#C8A8F0" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- 蓬松大尾（垂） -->
  <path d="M 122 124 Q 132 118 136 110 Q 138 100 132 96 Q 128 100 128 108 Q 126 116 120 122 Z" fill="#7E50A8" stroke="#5E3A88" stroke-width="0.8"/>

  <!-- 头（松鼠脸，圆眼含泪，颊边蓬毛沾血，手伸向空处） -->
  <ellipse cx="82" cy="104" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3490" stroke-width="0.9"/>
  <!-- 松鼠耳 -->
  <path d="M 73 96 L 67 82 L 77 90 Z" fill="#8E5EC0" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 91 96 L 97 82 L 87 90 Z" fill="#8E5EC0" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 73 94 L 69 84 L 75 90 Z" fill="#C8A8E0"/>
  <path d="M 91 94 L 95 84 L 89 90 Z" fill="#C8A8E0"/>
  <!-- 颊边蓬毛凌乱沾血 -->
  <path d="M 71 104 Q 66 102 68 108 Q 70 110 74 108" fill="#7E50A8"/>
  <path d="M 93 104 Q 98 102 96 108 Q 94 110 90 108" fill="#7E50A8"/>
  <path d="M 74 106 Q 72 108 73 110" stroke="#B84E3E" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- 发带散开 -->
  <path d="M 78 94 Q 80 90 84 92 L 82 90 Q 80 88 78 90 Z" fill="#C8A8F0"/>
  <path d="M 84 91 L 88 88" stroke="#C8A8F0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 浅色面斑 -->
  <ellipse cx="82" cy="108" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 圆眼含泪 -->
  <circle cx="77" cy="102" r="3" fill="#1E1008"/>
  <circle cx="87" cy="102" r="3" fill="#1E1008"/>
  <circle cx="78" cy="101" r="1" fill="#FFF"/>
  <circle cx="88" cy="101" r="1" fill="#FFF"/>
  <!-- 泪光 -->
  <path d="M 75 104 Q 74 106 75 108" stroke="#C8E8F8" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
    <animate attributeName="cy" values="104;109;104" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 鼻 -->
  <circle cx="82" cy="107" r="1.5" fill="#C86A9E"/>
  <!-- 抿唇忍痛 -->
  <path d="M 78 111 Q 82 112.4 86 111" fill="none" stroke="#9E5A8E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（撑地） -->
  <path d="M 76 118 C 70 122 66 126 64 132" fill="none" stroke="#7E50A8" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="63" cy="134" r="3" fill="#F0DCC6"/>

  <!-- 右手（伸向空处，索剑） -->
  <path d="M 96 118 C 102 114 108 110 114 106" fill="none" stroke="#7E50A8" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="116" cy="104" r="2.8" fill="#F0DCC6"/>

  <!-- 黯淡星尘 -->
  <g fill="#A088C8">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
