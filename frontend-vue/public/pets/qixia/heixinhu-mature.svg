<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑心虎·四阶·霸业之争·独对七剑黑风尽出">
  <defs>
    <!-- 背景：决战战场 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E4A6E"/>
      <stop offset="52%" stop-color="#4E3A5E"/>
      <stop offset="100%" stop-color="#3E2A4E"/>
    </linearGradient>
    <!-- 七剑彩光 -->
    <radialGradient id="seven" cx="24%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑风尽出 -->
    <radialGradient id="dark" cx="62%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#6E6A8E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6E6A8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <!-- 暗甲战痕 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5A6E"/>
      <stop offset="100%" stop-color="#3E3A4E"/>
    </linearGradient>
    <!-- 玄色披风残破 -->
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36324A"/>
      <stop offset="100%" stop-color="#242034"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#B89068"/>
      <stop offset="100%" stop-color="#9E7858"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 七剑彩光 -->
  <circle cx="48" cy="82" r="60" fill="url(#seven)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 黑风尽出 -->
  <circle cx="122" cy="94" r="72" fill="url(#dark)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 七剑虚影（左，合璧） -->
  <g opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 36 68 Q 30 56 34 44" stroke="#FFE066" stroke-width="2.4">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 28 84 Q 20 76 16 64" stroke="#F58A3E" stroke-width="2">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 44 96 Q 40 104 32 110" stroke="#6EE8D8" stroke-width="2">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#2E2A3E" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 黑毛猛虎（7头身，战痕，独对七剑） -->
  <!-- 腿 -->
  <path d="M 78 136 L 74 158 L 80 158 L 84 138 Z" fill="#1E2028"/>
  <path d="M 96 136 L 104 160 L 98 160 L 92 138 Z" fill="#1E2028"/>
  <!-- 身体 -->
  <path d="M 76 98 Q 72 118 80 136 Q 90 142 100 136 Q 106 118 102 98 Q 88 92 76 98 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 暗甲战痕 -->
  <path d="M 82 102 Q 90 96 100 102 L 98 116 Q 90 122 84 116 Z" fill="url(#armor)" stroke="#2E2A3E" stroke-width="0.8"/>
  <path d="M 86 104 Q 88 108 85 112" stroke="#B8432E" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- 玄披残破 -->
  <path d="M 78 100 Q 62 118 58 138 Q 68 144 80 136 L 76 118 Z" fill="url(#cape)" stroke="#1E1A2E" stroke-width="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 0;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 黑尾 -->
  <path d="M 104 130 Q 116 122 124 112" stroke="#242630" stroke-width="3" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 104 130;12 104 130;0 104 130" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，圆眼含威又空落） -->
  <ellipse cx="90" cy="94" rx="12" ry="11" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳 -->
  <path d="M 80 86 Q 76 74 82 72 Q 86 74 84 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 100 86 Q 104 74 98 72 Q 94 74 96 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="82" cy="76" r="2.4" fill="#FFE066" opacity="0.8"/>
  <circle cx="98" cy="76" r="2.4" fill="#FFE066" opacity="0.8"/>
  <!-- 王纹 -->
  <path d="M 90 82 L 85 77 M 90 82 L 95 77 M 90 82 L 90 75" stroke="#FFE066" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
  <!-- 白面斑 -->
  <ellipse cx="90" cy="98" rx="7" ry="5" fill="#C8A888"/>
  <!-- 圆眼含威又空落 -->
  <path d="M 80 90 L 88 93 L 80 96 Z" fill="#FFF3C4"/>
  <path d="M 100 90 L 92 93 L 100 96 Z" fill="#FFF3C4"/>
  <ellipse cx="84" cy="93" rx="1.8" ry="2.4" fill="#E8A024"/>
  <ellipse cx="96" cy="93" rx="1.8" ry="2.4" fill="#E8A024"/>
  <circle cx="84" cy="93" r="0.8" fill="#1E1008"/>
  <circle cx="96" cy="93" r="0.8" fill="#1E1008"/>
  <!-- 虎鼻 -->
  <ellipse cx="90" cy="97" rx="2.6" ry="1.8" fill="#3A2E26"/>
  <!-- 抿唇 -->
  <path d="M 85 101 Q 90 103.6 95 101" fill="none" stroke="#5E4A3E" stroke-width="1.1" stroke-linecap="round"/>
  <!-- 虎须 -->
  <path d="M 80 96 L 74 95 M 80 98 L 74 99 M 100 96 L 106 95 M 100 98 L 106 99" stroke="#D8C8B0" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 前爪（扬起） -->
  <path d="M 82 130 C 76 136 74 142 76 146" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="148" r="3.4" fill="#C8A888"/>
  <!-- 后爪 -->
  <path d="M 98 128 C 104 132 108 138 110 144" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="111" cy="146" r="3.2" fill="#C8A888"/>

  <!-- 虎啸音波 -->
  <path d="M 72 82 Q 62 80 58 72 M 108 82 Q 118 80 122 72" stroke="#FFE066" stroke-width="1.8" opacity="0.7" stroke-linecap="round">
    <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 战场星尘 -->
  <g fill="#FFF3C4">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
