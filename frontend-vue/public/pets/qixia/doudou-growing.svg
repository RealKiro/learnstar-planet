<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="逗逗·三阶·采药苦修·翻山夜读医剑双修">
  <defs>
    <!-- 背景：群山夜色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5E7E"/>
      <stop offset="52%" stop-color="#3E4E6E"/>
      <stop offset="100%" stop-color="#2E3E5E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="78%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 夜灯暖 -->
    <radialGradient id="lamp" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#F0C878" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 雨花青 -->
    <radialGradient id="rain" cx="34%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#7EE8C8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7EE8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E6EC"/>
      <stop offset="100%" stop-color="#B0BCC6"/>
    </linearGradient>
    <!-- 粗布劲装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8A860"/>
      <stop offset="100%" stop-color="#968A4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="156" cy="48" r="42" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="156" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 夜灯暖 -->
  <circle cx="100" cy="118" r="60" fill="url(#lamp)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 雨花微光 -->
  <circle cx="70" cy="96" r="48" fill="url(#rain)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 苍茫群山 -->
  <path d="M 0 130 Q 40 116 90 124 Q 140 130 200 120 L 200 200 L 0 200 Z" fill="#3E4E6E" opacity="0.6"/>
  <path d="M 0 148 Q 60 138 120 144 Q 170 150 200 142 L 200 200 L 0 200 Z" fill="#2E3E5E" opacity="0.7"/>

  <!-- 采药（药草点缀山间） -->
  <g fill="#7EA878" opacity="0.8">
    <path d="M 40 140 L 36 130 M 44 142 L 40 132 M 152 136 L 148 126" stroke="#7EA878" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="20" r="1.1"/><circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 白毛小狗（5头身，粗布劲装，背药囊） -->
  <!-- 腿 -->
  <path d="M 86 138 L 82 158 L 88 158 L 92 140 Z" fill="#B0BCC6"/>
  <path d="M 102 138 L 110 160 L 104 160 L 98 140 Z" fill="#B0BCC6"/>
  <!-- 粗布劲装 -->
  <path d="M 86 104 Q 82 120 88 138 Q 98 144 106 138 Q 112 120 108 104 Q 98 98 86 104 Z" fill="url(#robe)" stroke="#7E7440" stroke-width="1"/>
  <!-- 药囊背带 -->
  <path d="M 104 104 L 116 116 L 114 126 L 100 112 Z" fill="#B8A880" stroke="#968A60" stroke-width="0.8"/>
  <path d="M 88 104 L 84 110 L 96 122" stroke="#A89268" stroke-width="1" stroke-linecap="round"/>
  <!-- 腰间药葫芦 -->
  <circle cx="92" cy="120" r="2.4" fill="#A88A4E" stroke="#8E6A3E" stroke-width="0.6"/>
  <!-- 尾巴（低垂） -->
  <path d="M 110 132 Q 118 128 120 122" stroke="#B0BCC6" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（狗脸，圆眼坚毅，发揪束起） -->
  <ellipse cx="96" cy="96" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#9AA2A8" stroke-width="0.8"/>
  <!-- 垂耳 -->
  <path d="M 87 90 Q 79 90 77 98 Q 77 104 83 102 Q 87 98 89 92 Z" fill="#B8A860" stroke="#968A50" stroke-width="0.8"/>
  <path d="M 105 90 Q 113 90 115 98 Q 115 104 109 102 Q 105 98 103 92 Z" fill="#B8A860" stroke="#968A50" stroke-width="0.8"/>
  <!-- 发揪系布条 -->
  <path d="M 96 84 Q 94 77 97 74 Q 100 77 98 84 Z" fill="#A8B0B8"/>
  <path d="M 97 74 L 98 70" stroke="#C8B878" stroke-width="1" stroke-linecap="round"/>
  <!-- 狗脸白斑 -->
  <ellipse cx="96" cy="100" rx="7" ry="5.5" fill="#F0DCC6"/>
  <!-- 圆眼坚毅 -->
  <circle cx="91" cy="94" r="3" fill="#1E1008"/>
  <circle cx="101" cy="94" r="3" fill="#1E1008"/>
  <circle cx="92" cy="93" r="1" fill="#FFF"/>
  <circle cx="102" cy="93" r="1" fill="#FFF"/>
  <!-- 狗鼻 -->
  <circle cx="96" cy="99" r="1.8" fill="#3A2E26"/>
  <!-- 坚毅抿唇 -->
  <path d="M 92 103 Q 96 104.4 100 103" fill="none" stroke="#7E5A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（持雨花剑，苦练） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 78 108;4 78 108;-5 78 108" dur="2s" repeatCount="indefinite"/>
    <path d="M 88 108 C 82 112 78 116 76 122" fill="none" stroke="#C8B868" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="75" cy="124" r="3" fill="#F0DCC6"/>
    <!-- 雨花剑 -->
    <line x1="75" y1="122" x2="52" y2="148" stroke="#7EE8C8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 52 148 L 50 154" stroke="#7EE8C8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑气如雨 -->
    <path d="M 52 148 Q 42 156 36 162" stroke="#7EE8C8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（夜读医书，灯火） -->
  <path d="M 104 108 C 110 104 114 100 116 94" fill="none" stroke="#C8B868" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="92" r="2.8" fill="#F0DCC6"/>
  <!-- 医书 -->
  <path d="M 116 96 Q 120 100 118 106 L 112 104 Q 114 98 116 96 Z" fill="#D8D0B8" stroke="#A89A78" stroke-width="0.7"/>

  <!-- 至亲虚影（烛火里） -->
  <g opacity="0.3">
    <path d="M 158 96 Q 160 88 164 86 Q 168 88 168 96 Z" fill="#6E5A78"/>
    <circle cx="165" cy="84" r="4.5" fill="#D8C8E0"/>
  </g>

  <!-- 雨花星尘 -->
  <g fill="#7EE8C8">
    <circle cx="40" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
