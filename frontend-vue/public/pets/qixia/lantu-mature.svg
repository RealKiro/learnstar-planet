<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝兔·四阶·剑成护侠·雪夜炉火为情裹伤">
  <defs>
    <!-- 背景：雪夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5A7E"/>
      <stop offset="52%" stop-color="#3E4A6E"/>
      <stop offset="100%" stop-color="#2E3A5E"/>
    </linearGradient>
    <!-- 炉火暖 -->
    <radialGradient id="fire" cx="72%" cy="62%" r="40%">
      <stop offset="0%" stop-color="#E8A04E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E8A04E" stop-opacity="0"/>
    </radialGradient>
    <!-- 冰魄蓝 -->
    <radialGradient id="ice" cx="34%" cy="52%" r="36%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9AC8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EA8E0"/>
      <stop offset="100%" stop-color="#3E86C0"/>
    </linearGradient>
    <!-- 白衣染血 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8EEF2"/>
      <stop offset="100%" stop-color="#C0D0DE"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 炉火暖 -->
  <circle cx="142" cy="122" r="60" fill="url(#fire)">
    <animate attributeName="opacity" values="0.75;0.5;0.75" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 冰魄微光 -->
  <circle cx="70" cy="104" r="46" fill="url(#ice)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 火堆（暖炉） -->
  <g>
    <path d="M 132 150 Q 138 142 146 146 Q 150 150 146 154 Q 134 156 132 150 Z" fill="#C85A3E" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.55;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 138 146 Q 134 138 139 134 Q 144 138 141 146 Z" fill="#E8A04E" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 144 144 Q 149 138 147 132 Q 142 138 144 144 Z" fill="#E8623A" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 雪地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#DCE4EE" opacity="0.7"/>
  <path d="M 0 150 L 200 150" stroke="#E8F0FA" stroke-width="1.4" opacity="0.5"/>

  <!-- 魔教远影（右后，隐约） -->
  <g opacity="0.35">
    <path d="M 168 60 Q 170 52 173 50 Q 176 52 176 60 Z" fill="#3E2E4E"/>
    <path d="M 182 56 Q 184 48 187 46 Q 190 48 190 56 Z" fill="#4E3A5E"/>
  </g>

  <!-- 雪 -->
  <g fill="#E8F0FA" opacity="0.7">
    <circle cx="30" cy="40" r="1.3"><animate attributeName="cy" values="40;56;40" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="30" r="1.1"><animate attributeName="cy" values="30;46;30" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="66" r="1"><animate attributeName="cy" values="66;82;66" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 蓝毛白兔（坐雪，白衣染血，冰魄剑在手） -->
  <!-- 腿（盘坐） -->
  <path d="M 80 150 Q 86 154 94 150 Q 96 146 92 143 Q 86 147 80 143 Z" fill="#3E86C0"/>
  <!-- 白衣 -->
  <path d="M 78 104 Q 74 126 82 150 Q 92 156 100 150 Q 106 126 102 104 Q 90 98 78 104 Z" fill="url(#robe)" stroke="#98AEBE" stroke-width="1"/>
  <!-- 血痕 -->
  <path d="M 88 120 Q 90 128 87 136" stroke="#C8483E" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <!-- 披帛裹身 -->
  <path d="M 80 106 L 72 116 L 74 124" stroke="#8EB8D8" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- 腰间冰魄坠 -->
  <circle cx="92" cy="124" r="2.2" fill="#7EB8E8" stroke="#D8F0FC" stroke-width="0.5"/>
  <!-- 尾巴 -->
  <circle cx="104" cy="140" r="3" fill="#E8EEF2"/>

  <!-- 头（兔脸，含笑有暖，蓝毛散落） -->
  <ellipse cx="91" cy="96" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 兔耳 -->
  <path d="M 83 88 Q 78 74 82 64 Q 87 64 88 76 Q 88 84 89 88 Z" fill="#5EA8E0" stroke="#2E6EA8" stroke-width="0.8"/>
  <path d="M 99 88 Q 104 74 100 64 Q 95 64 94 76 Q 94 84 93 88 Z" fill="#5EA8E0" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 内耳粉 -->
  <path d="M 83 86 Q 80 76 83 70 Q 86 72 86 80 Z" fill="#DCA8BC"/>
  <path d="M 99 86 Q 102 76 99 70 Q 96 72 96 80 Z" fill="#DCA8BC"/>
  <!-- 白脸斑 -->
  <ellipse cx="91" cy="100" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 兔眼含笑 -->
  <path d="M 85 93 Q 88 91 91 93 Q 88 95 85 93 Z" fill="#1E1008"/>
  <path d="M 97 93 Q 94 91 91 93 Q 94 95 97 93 Z" fill="#1E1008"/>
  <!-- 兔鼻 -->
  <path d="M 89 99 L 91 101 L 93 99" fill="none" stroke="#C85A78" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 微笑 -->
  <path d="M 87 103 Q 91 105.2 95 103" fill="none" stroke="#B06A84" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（抱冰魄剑于怀） -->
  <path d="M 82 108 C 76 112 74 118 76 124" fill="none" stroke="#E8EEF2" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="76" cy="126" r="3" fill="#F0DCC6"/>
  <!-- 怀中冰魄剑（微光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <line x1="76" y1="124" x2="98" y2="138" stroke="#B8E8F8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="88" cy="130" r="9" fill="url(#ice)">
      <animate attributeName="r" values="9;12;9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右手（炉火旁，暖） -->
  <path d="M 100 108 C 106 112 112 116 118 122" fill="none" stroke="#E8EEF2" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="120" cy="124" r="2.8" fill="#F0DCC6"/>

  <!-- 暖光星尘 -->
  <g fill="#FFE6B8">
    <circle cx="120" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
