<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑小虎·一阶·虎子初生·学父习武少年意气">
  <defs>
    <!-- 背景：魔教庭院 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E5A6E"/>
      <stop offset="52%" stop-color="#4E4A5E"/>
      <stop offset="100%" stop-color="#3E3A4E"/>
    </linearGradient>
    <!-- 少年光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <!-- 虎目金 -->
    <radialGradient id="eye" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 墨黑 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#C8A888"/>
      <stop offset="100%" stop-color="#AE8A70"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 少年光 -->
  <circle cx="100" cy="70" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 虎目金 -->
  <circle cx="100" cy="92" r="62" fill="url(#eye)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 魔教庭院柱 -->
  <g opacity="0.6">
    <path d="M 20 56 L 28 48 L 46 52 L 44 152 L 20 152 Z" fill="#5E4A5E"/>
    <path d="M 156 54 L 164 46 L 182 50 L 180 152 L 156 152 Z" fill="#5E4A5E"/>
  </g>
  <!-- 父亲身影（右，习武指点） -->
  <g opacity="0.55">
    <path d="M 156 108 Q 158 98 162 95 Q 166 97 166 108 Z" fill="#3E3A4E"/>
    <circle cx="163" cy="93" r="5" fill="#4A4E58"/>
    <!-- 指爪 -->
    <path d="M 162 98 Q 168 102 172 100" stroke="#5E5A6E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E2A3E" opacity="0.9"/>
  <path d="M 0 150 L 200 150" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 墨黑小虎（4头身，学父习武，爪牙初利） -->
  <!-- 腿 -->
  <path d="M 80 134 L 76 156 L 82 156 L 86 136 Z" fill="#1E2028"/>
  <path d="M 96 134 L 104 158 L 98 158 L 92 136 Z" fill="#1E2028"/>
  <!-- 身体 -->
  <path d="M 78 98 Q 74 116 82 134 Q 92 140 100 134 Q 106 116 102 98 Q 90 92 78 98 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎纹 -->
  <path d="M 82 106 Q 86 110 84 116 M 96 106 Q 100 110 98 116" stroke="#1E2028" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 黑尾 -->
  <path d="M 104 128 Q 114 122 120 114" stroke="#242630" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 104 128;12 104 128;0 104 128" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，圆眼热切，王纹初显，双耳立起） -->
  <ellipse cx="90" cy="94" rx="11.5" ry="10.5" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳（立起） -->
  <path d="M 80 86 Q 75 72 82 70 Q 87 73 84 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 100 86 Q 105 72 98 70 Q 93 73 96 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="82" cy="74" r="2.4" fill="#FFE066" opacity="0.9"/>
  <circle cx="98" cy="74" r="2.4" fill="#FFE066" opacity="0.9"/>
  <!-- 王纹初显 -->
  <path d="M 90 81 L 86 77 M 90 81 L 94 77 M 90 81 L 90 75" stroke="#FFE066" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- 白面斑 -->
  <ellipse cx="90" cy="98" rx="6.5" ry="4.8" fill="#C8A888"/>
  <!-- 圆眼热切 -->
  <circle cx="84" cy="92" r="3" fill="#FFF3C4"/>
  <circle cx="96" cy="92" r="3" fill="#FFF3C4"/>
  <ellipse cx="84" cy="92" rx="1.9" ry="2.6" fill="#E8A024"/>
  <ellipse cx="96" cy="92" rx="1.9" ry="2.6" fill="#E8A024"/>
  <circle cx="84" cy="92" r="0.9" fill="#1E1008"/>
  <circle cx="96" cy="92" r="0.9" fill="#1E1008"/>
  <!-- 虎鼻 -->
  <ellipse cx="90" cy="97" rx="2.4" ry="1.7" fill="#3A2E26"/>
  <!-- 热切笑 -->
  <path d="M 85 101 Q 90 104 95 101" fill="none" stroke="#5E4A3E" stroke-width="1" stroke-linecap="round"/>
  <!-- 虎须 -->
  <path d="M 80 96 L 74 95 M 80 98 L 74 99 M 100 96 L 106 95 M 100 98 L 106 99" stroke="#D8C8B0" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 前爪（一爪击出，少年意气） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 80 132;6 80 132;-5 80 132" dur="1.6s" repeatCount="indefinite"/>
    <path d="M 82 130 C 76 136 72 142 72 148" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
    <circle cx="71" cy="150" r="3.4" fill="#C8A888"/>
    <!-- 爪刃 -->
    <path d="M 68 150 L 67 153 M 71 151 L 71 154 M 74 150 L 75 153" stroke="#D8D0C8" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- 后爪 -->
  <path d="M 98 128 C 104 132 108 138 110 144" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="111" cy="146" r="3.2" fill="#C8A888"/>

  <!-- 少年星光 -->
  <g fill="#FFE066">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
