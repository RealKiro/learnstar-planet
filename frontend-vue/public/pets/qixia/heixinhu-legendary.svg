<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑心虎·五阶·迷途之虎·独坐王座望月迷惘">
  <defs>
    <!-- 背景：空荡大殿 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E4A5E"/>
      <stop offset="52%" stop-color="#3E3A4E"/>
      <stop offset="100%" stop-color="#2E2A3E"/>
    </linearGradient>
    <!-- 月光白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="32%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 窗光 -->
    <radialGradient id="window" cx="72%" cy="44%" r="26%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <!-- 玄披垂地 -->
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E3A4E"/>
      <stop offset="100%" stop-color="#2A2636"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#B89068"/>
      <stop offset="100%" stop-color="#9E7858"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月光 -->
  <circle cx="152" cy="52" r="44" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="52" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 窗光 -->
  <circle cx="152" cy="88" r="34" fill="url(#window)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 大殿柱 -->
  <g opacity="0.5">
    <path d="M 18 64 L 26 56 L 44 60 L 42 152 L 18 152 Z" fill="#4E4A5E"/>
  </g>

  <!-- 窗（月光洒入） -->
  <path d="M 140 72 L 168 72 L 168 108 L 140 108 Z" fill="#3E4A5E" stroke="#6E6A7E" stroke-width="1.2"/>
  <path d="M 154 72 L 154 108 M 140 90 L 168 90" stroke="#6E6A7E" stroke-width="1"/>
  <!-- 月光光束 -->
  <path d="M 152 52 L 138 152 L 166 152 L 154 52 Z" fill="#E8F0FA" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.2;0.12" dur="3.4s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2A2A3E" opacity="0.95"/>
  <path d="M 0 150 L 200 150" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 王座 -->
  <path d="M 80 148 L 74 108 Q 76 102 84 102 L 112 102 Q 120 102 120 110 L 116 148 Z" fill="#4E4A5E" stroke="#6E6A7E" stroke-width="1"/>
  <path d="M 82 120 L 114 120" stroke="#6E6A7E" stroke-width="1"/>

  <!-- 黑毛猛虎（7头身，独坐王座，望月） -->
  <!-- 腿（坐） -->
  <path d="M 82 146 Q 88 150 96 146 Q 98 142 94 140 Q 88 144 82 140 Z" fill="#1E2028"/>
  <!-- 身体（暗甲卸下一半） -->
  <path d="M 80 102 Q 76 122 84 146 Q 92 152 100 146 Q 106 122 102 102 Q 90 96 80 102 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 玄披垂地 -->
  <path d="M 80 104 Q 64 120 60 140 Q 70 148 82 142 L 76 118 Z" fill="url(#cape)" stroke="#1E1A2E" stroke-width="0.8"/>
  <!-- 黑尾（垂） -->
  <path d="M 104 138 Q 112 134 114 128" stroke="#242630" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- 头（虎脸，圆眼迷惘，望向月光） -->
  <ellipse cx="88" cy="94" rx="12" ry="11" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳 -->
  <path d="M 78 86 Q 74 74 80 72 Q 84 74 82 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 98 86 Q 102 74 96 72 Q 92 74 94 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="80" cy="76" r="2.2" fill="#FFE066" opacity="0.7"/>
  <circle cx="96" cy="76" r="2.2" fill="#FFE066" opacity="0.7"/>
  <!-- 王纹 -->
  <path d="M 88 82 L 83 77 M 88 82 L 93 77 M 88 82 L 88 75" stroke="#FFE066" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- 白面斑 -->
  <ellipse cx="88" cy="98" rx="7" ry="5" fill="#C8A888"/>
  <!-- 圆眼迷惘（望向月光，微低） -->
  <path d="M 78 92 Q 84 94 88 92 Q 82 96 78 92 Z" fill="#FFF3C4"/>
  <path d="M 98 92 Q 92 94 88 92 Q 94 96 98 92 Z" fill="#FFF3C4"/>
  <ellipse cx="84" cy="93" rx="1.7" ry="2.2" fill="#E8A024"/>
  <ellipse cx="92" cy="93" rx="1.7" ry="2.2" fill="#E8A024"/>
  <circle cx="84" cy="93" r="0.8" fill="#1E1008"/>
  <circle cx="92" cy="93" r="0.8" fill="#1E1008"/>
  <!-- 虎鼻 -->
  <ellipse cx="88" cy="97" rx="2.6" ry="1.8" fill="#3A2E26"/>
  <!-- 迷惘抿唇 -->
  <path d="M 83 101 Q 88 103.2 93 101" fill="none" stroke="#5E4A3E" stroke-width="1.1" stroke-linecap="round"/>

  <!-- 前爪（垂放王座扶手上） -->
  <path d="M 84 116 C 80 120 78 124 80 128" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="130" r="3.4" fill="#C8A888"/>

  <!-- 月光星尘 -->
  <g fill="#E8F0FA">
    <circle cx="152" cy="120">
      <animate attributeName="cy" values="120;112;120" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
