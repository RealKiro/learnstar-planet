<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="马三娘·六阶·剑心归处·收剑垂地相视一笑月色融">
  <defs>
    <!-- 背景：玉蟾宫月下 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E5A8E"/>
      <stop offset="52%" stop-color="#5E4A7E"/>
      <stop offset="100%" stop-color="#4E3A6E"/>
    </linearGradient>
    <!-- 月色白 -->
    <radialGradient id="moon" cx="30%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#F4F8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F4F8FF" stop-opacity="0"/>
    </radialGradient>
    <!-- 融光暖 -->
    <radialGradient id="warm" cx="64%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#FFE6B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE6B8" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E6EBA"/>
      <stop offset="100%" stop-color="#6E4E9A"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#D8C4AE"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月色 -->
  <circle cx="60" cy="56" r="56" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="56" r="11" fill="#F4F8FF" opacity="0.9"/>
  <!-- 融光 -->
  <circle cx="128" cy="104" r="60" fill="url(#warm)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 玉蟾宫宫阙（远） -->
  <g opacity="0.6">
    <path d="M 150 100 L 150 84 L 176 84 L 176 100 L 183 100 L 183 78 L 143 78 L 143 100 Z" fill="#6E5E8E"/>
    <path d="M 163 84 L 163 72 L 162 84 Z" fill="#6E5E8E"/>
    <path d="M 143 78 L 163 66 L 183 78 L 163 72 Z" fill="#8E7E9E"/>
  </g>

  <!-- 月色星 -->
  <g fill="#F4F8FF">
    <circle cx="30" cy="40" r="1.3"/><circle cx="90" cy="26" r="1.1"/><circle cx="176" cy="76" r="1"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#3E3A5E" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#5E5A7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 紫衣剑客（6头身，收剑垂地，神色释然） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 158 L 86 158 L 90 136 Z" fill="#5E3E8C"/>
  <path d="M 98 134 L 106 160 L 100 160 L 94 136 Z" fill="#5E3E8C"/>
  <!-- 紫衣 -->
  <path d="M 82 98 Q 78 118 86 136 Q 96 142 104 136 Q 110 118 106 98 Q 94 92 82 98 Z" fill="url(#robe)" stroke="#5E3E8C" stroke-width="1"/>
  <!-- 斗篷垂地 -->
  <path d="M 82 100 Q 66 116 62 138 Q 72 148 84 138 L 80 118 Z" fill="#7E6E9E" stroke="#5E4E7E" stroke-width="0.8"/>
  <!-- 面纱已落 -->
  <path d="M 92 104 L 102 104 L 103 110 L 91 110 Z" fill="#C8A8F0" opacity="0.6" transform="translate(0,8)"/>
  <!-- 尾巴 -->
  <path d="M 108 128 Q 116 124 118 118" stroke="#6E4E9A" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（清冷面容，眉目释然，眼底含泪而笑，长发披散） -->
  <ellipse cx="94" cy="92" rx="10.5" ry="11" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.9"/>
  <!-- 猫耳 -->
  <path d="M 85 84 L 79 70 L 89 78 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 103 84 L 109 70 L 99 78 Z" fill="#8E6EBA" stroke="#5E3E8C" stroke-width="0.8"/>
  <path d="M 85 82 L 81 72 L 87 78 Z" fill="#D8B8E8"/>
  <path d="M 103 82 L 107 72 L 101 78 Z" fill="#D8B8E8"/>
  <!-- 长发披散 -->
  <path d="M 90 84 Q 86 80 84 84 M 98 84 Q 102 80 104 84" stroke="#6E4E9A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 92 82 Q 88 76 90 72 M 96 82 Q 100 76 98 72" stroke="#6E4E9A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 细眉（舒展） -->
  <path d="M 86 86 Q 90 84.6 93 86 M 95 86 Q 98 84.6 102 86" stroke="#3A263E" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 浅色面斑 -->
  <ellipse cx="94" cy="96" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 眼底含泪而笑 -->
  <path d="M 87 90 Q 90 88.4 93 90 L 93 91.6 Q 90 90.2 87 91.6 Z" fill="#1E1008"/>
  <path d="M 101 90 Q 98 88.4 95 90 L 95 91.6 Q 98 90.2 101 91.6 Z" fill="#1E1008"/>
  <circle cx="88.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="99.5" cy="90.3" r="1" fill="#FFF"/>
  <circle cx="89.6" cy="90.4" r="0.7" fill="#FFE6B8"/>
  <circle cx="98.4" cy="90.4" r="0.7" fill="#FFE6B8"/>
  <!-- 泪光 -->
  <path d="M 86 92 Q 85 94 86 96" stroke="#C8E8F8" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <animate attributeName="cy" values="92;97;92" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 鼻梁挺 -->
  <path d="M 94 93 L 94 95.5" stroke="#B09078" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 含泪浅笑 -->
  <path d="M 90 99 Q 94 101.4 98 99" fill="none" stroke="#A06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（垂放） -->
  <path d="M 84 106 C 78 110 76 116 78 122" fill="none" stroke="#8E6EBA" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="78" cy="124" r="3" fill="#F0DCC6"/>

  <!-- 右手持剑（垂于地，剑光消融月色） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 102 106 C 106 112 108 120 108 128" fill="none" stroke="#8E6EBA" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="108" cy="130" r="3" fill="#F0DCC6"/>
    <!-- 紫影剑（垂地） -->
    <line x1="108" y1="132" x2="106" y2="150" stroke="#C8A8F0" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 剑光消融月色 -->
    <path d="M 106 148 Q 100 154 94 158" stroke="#C8A8F0" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 紫云剑主（右，相视一笑，虚影） -->
  <g opacity="0.5">
    <path d="M 146 116 Q 148 108 151 106 Q 154 108 154 116 Z" fill="#8E5EC0"/>
    <circle cx="151" cy="104" r="4.5" fill="#E8D8C0"/>
  </g>

  <!-- 月色融星尘 -->
  <g fill="#FFE6B8">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="80">
      <animate attributeName="cy" values="80;72;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
