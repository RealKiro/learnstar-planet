<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="跳跳·一阶·灵巧小猴·林间跳跃如飞">
  <defs>
    <!-- 背景：山林家园 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFD8B8"/>
      <stop offset="52%" stop-color="#A0C89A"/>
      <stop offset="100%" stop-color="#82B07E"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#F4FFF0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4FFF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 青光 -->
    <radialGradient id="cyan" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#6EE8D8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6EE8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4EA85E"/>
      <stop offset="100%" stop-color="#2E8648"/>
    </linearGradient>
    <!-- 绿色短打 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9E5E"/>
      <stop offset="100%" stop-color="#367E48"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8C0"/>
      <stop offset="100%" stop-color="#D8C0A8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>
  <!-- 青光 -->
  <circle cx="100" cy="96" r="66" fill="url(#cyan)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <path d="M 0 130 Q 40 116 90 126 Q 140 132 200 122 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.5"/>

  <!-- 藤蔓（跳跃之间） -->
  <path d="M 30 60 Q 44 52 60 58 Q 76 64 90 56" stroke="#4E7E4E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.7"/>
  <path d="M 0 150 L 200 150" stroke="#96AE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿毛小猴（4头身，轻盈跃起，绿色短打） -->
  <!-- 腿（跃起，轻盈） -->
  <path d="M 88 128 L 82 146 L 88 148 L 94 130 Z" fill="#2E8648"/>
  <path d="M 104 126 L 112 142 L 108 146 L 100 130 Z" fill="#2E8648"/>
  <!-- 绿色短打 -->
  <path d="M 84 98 Q 80 116 88 132 Q 98 138 108 132 Q 114 116 110 98 Q 98 92 84 98 Z" fill="url(#robe)" stroke="#2E6E3E" stroke-width="1"/>
  <!-- 腰间绿带 -->
  <path d="M 84 118 L 110 118" stroke="#6EE8D8" stroke-width="1.6"/>
  <!-- 尾巴（卷曲） -->
  <path d="M 110 124 Q 120 116 124 106 Q 120 102 116 106" stroke="#2E8648" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 110 124;12 110 124;0 110 124" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（猴脸，圆眼机灵，咧嘴笑，绿毛束马尾） -->
  <ellipse cx="97" cy="94" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6E3E" stroke-width="0.9"/>
  <!-- 圆耳 -->
  <circle cx="87" cy="84" r="3.6" fill="#4EA85E" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="107" cy="84" r="3.6" fill="#4EA85E" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="87" cy="84" r="1.8" fill="#D0A884"/>
  <circle cx="107" cy="84" r="1.8" fill="#D0A884"/>
  <!-- 小马尾 -->
  <path d="M 97 82 Q 95 74 99 72 Q 103 76 101 82 Z" fill="#2E8648"/>
  <path d="M 99 72 Q 102 66 100 63" stroke="#6EE8D8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 猴脸浅色 -->
  <ellipse cx="97" cy="99" rx="6.5" ry="5" fill="#F0D8C0"/>
  <!-- 圆眼机灵 -->
  <circle cx="92" cy="93" r="3" fill="#1E1008"/>
  <circle cx="102" cy="93" r="3" fill="#1E1008"/>
  <circle cx="93" cy="92" r="1" fill="#FFF"/>
  <circle cx="103" cy="92" r="1" fill="#FFF"/>
  <!-- 猴鼻 -->
  <circle cx="97" cy="98" r="1.6" fill="#C06A4E"/>
  <!-- 咧嘴笑 -->
  <path d="M 92 102 Q 97 106 102 102" fill="none" stroke="#8E5A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（青光剑意在指尖） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 88 106;4 88 106;-5 88 106" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 88 106 C 82 110 78 114 76 120" fill="none" stroke="#4E9E5E" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="75" cy="122" r="3" fill="#F0D8C0"/>
    <!-- 指尖青光 -->
    <path d="M 75 120 Q 70 114 68 108" stroke="#6EE8D8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（抬臂，雀跃） -->
  <path d="M 106 106 C 112 100 116 94 118 88" fill="none" stroke="#4E9E5E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="119" cy="86" r="2.8" fill="#F0D8C0"/>

  <!-- 父母虚影（旁） -->
  <g opacity="0.5">
    <path d="M 36 120 Q 38 112 41 110 Q 44 112 44 120 Z" fill="#5E8E6E"/>
    <circle cx="41" cy="108" r="4.5" fill="#E0D0B8"/>
    <path d="M 156 118 Q 158 110 161 108 Q 164 110 164 118 Z" fill="#4E7E5E"/>
    <circle cx="161" cy="106" r="4.5" fill="#DCC8AE"/>
  </g>

  <!-- 青光星尘 -->
  <g fill="#6EE8D8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
