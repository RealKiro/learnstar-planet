<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="黑小虎·二阶·黑风小虎·初遇宿敌败后立誓">
  <defs>
    <!-- 背景：初战暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E5A4E"/>
      <stop offset="52%" stop-color="#5E4A3E"/>
      <stop offset="100%" stop-color="#4E3A2E"/>
    </linearGradient>
    <!-- 暮色橙 -->
    <radialGradient id="sunset" cx="30%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#F0A04E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0A04E" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑风 -->
    <radialGradient id="dark" cx="62%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#6E6A8E" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6E6A8E" stop-opacity="0"/>
    </radialGradient>
    <!-- 墨黑 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A4E58"/>
      <stop offset="100%" stop-color="#242630"/>
    </linearGradient>
    <!-- 暗色短甲 -->
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5A6E"/>
      <stop offset="100%" stop-color="#3E3A4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#C8A888"/>
      <stop offset="100%" stop-color="#AE8A70"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 暮色橙 -->
  <circle cx="56" cy="56" r="66" fill="url(#sunset)">
    <animate attributeName="opacity" values="0.55;0.35;0.55" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 黑风 -->
  <circle cx="122" cy="92" r="70" fill="url(#dark)">
    <animate attributeName="opacity" values="0.65;0.4;0.65" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 虹猫离去方向（左，远影） -->
  <g opacity="0.5">
    <path d="M 44 108 Q 46 100 49 98 Q 52 100 52 108 Z" fill="#6E4A3E"/>
    <circle cx="49" cy="96" r="4.5" fill="#D8B090"/>
    <!-- 长虹余光 -->
    <path d="M 46 102 Q 40 96 36 90" stroke="#FFE066" stroke-width="1.4" opacity="0.6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#3E2E26" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#5E4A3E" stroke-width="1.4" opacity="0.6"/>

  <!-- 墨黑小虎（5头身，暗色短甲，立于黑风） -->
  <!-- 腿 -->
  <path d="M 80 136 L 76 158 L 82 158 L 86 138 Z" fill="#1E2028"/>
  <path d="M 96 136 L 104 160 L 98 160 L 92 138 Z" fill="#1E2028"/>
  <!-- 身体 -->
  <path d="M 78 100 Q 74 118 82 136 Q 92 142 100 136 Q 106 118 102 100 Q 90 94 78 100 Z" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 暗色短甲 -->
  <path d="M 82 102 Q 90 96 100 102 L 98 114 Q 90 120 84 114 Z" fill="url(#armor)" stroke="#2E2A3E" stroke-width="0.8"/>
  <!-- 黑风缭绕 -->
  <g stroke="#6E6A8E" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 62 72 Q 74 68 86 72">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 黑尾 -->
  <path d="M 104 130 Q 114 124 120 116" stroke="#242630" stroke-width="2.8" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 104 130;12 104 130;0 104 130" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 头（虎脸，圆眼执拗，王纹渐显） -->
  <ellipse cx="90" cy="94" rx="11.5" ry="10.5" fill="url(#fur)" stroke="#1E2028" stroke-width="1"/>
  <!-- 虎耳 -->
  <path d="M 80 86 Q 75 72 82 70 Q 87 73 84 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <path d="M 100 86 Q 105 72 98 70 Q 93 73 96 86 Z" fill="#4A4E58" stroke="#1E2028" stroke-width="0.8"/>
  <circle cx="82" cy="74" r="2.4" fill="#FFE066" opacity="0.85"/>
  <circle cx="98" cy="74" r="2.4" fill="#FFE066" opacity="0.85"/>
  <!-- 王纹 -->
  <path d="M 90 81 L 86 77 M 90 81 L 94 77 M 90 81 L 90 75" stroke="#FFE066" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
  <!-- 白面斑 -->
  <ellipse cx="90" cy="98" rx="6.5" ry="4.8" fill="#C8A888"/>
  <!-- 圆眼执拗 -->
  <path d="M 80 90 L 88 93 L 80 96 Z" fill="#FFF3C4"/>
  <path d="M 100 90 L 92 93 L 100 96 Z" fill="#FFF3C4"/>
  <ellipse cx="84" cy="93" rx="1.9" ry="2.5" fill="#E8A024"/>
  <ellipse cx="96" cy="93" rx="1.9" ry="2.5" fill="#E8A024"/>
  <circle cx="84" cy="93" r="0.9" fill="#1E1008"/>
  <circle cx="96" cy="93" r="0.9" fill="#1E1008"/>
  <!-- 虎鼻 -->
  <ellipse cx="90" cy="97" rx="2.4" ry="1.7" fill="#3A2E26"/>
  <!-- 执拗抿唇 -->
  <path d="M 85 101 Q 90 103.6 95 101" fill="none" stroke="#5E4A3E" stroke-width="1" stroke-linecap="round"/>
  <!-- 虎须 -->
  <path d="M 80 96 L 74 95 M 80 98 L 74 99 M 100 96 L 106 95 M 100 98 L 106 99" stroke="#D8C8B0" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 前爪（握拳，立誓） -->
  <path d="M 82 130 C 76 136 74 142 76 146" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="148" r="3.4" fill="#C8A888"/>
  <!-- 后爪 -->
  <path d="M 98 128 C 104 132 108 138 110 144" fill="none" stroke="#4A4E58" stroke-width="4" stroke-linecap="round"/>
  <circle cx="111" cy="146" r="3.2" fill="#C8A888"/>

  <!-- 暮色星尘 -->
  <g fill="#FFE6B8">
    <circle cx="44" cy="100">
      <animate attributeName="cy" values="100;90;100" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.12;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
