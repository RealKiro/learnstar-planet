<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="达达·四阶·以柔护弱·四两拨千斤退敌">
  <defs>
    <!-- 背景：村落黄昏 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8C8A8"/>
      <stop offset="52%" stop-color="#96AE8E"/>
      <stop offset="100%" stop-color="#749676"/>
    </linearGradient>
    <!-- 竹青 -->
    <radialGradient id="wind" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#B8E8A8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#B8E8A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 家园暖 -->
    <radialGradient id="warm" cx="82%" cy="60%" r="34%">
      <stop offset="0%" stop-color="#F0D898" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F0D898" stop-opacity="0"/>
    </radialGradient>
    <!-- 魔教远影 -->
    <radialGradient id="dark" cx="86%" cy="24%" r="26%">
      <stop offset="0%" stop-color="#4E4A5E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4E4A5E" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿面 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4EEE0"/>
      <stop offset="100%" stop-color="#C6D2C6"/>
    </linearGradient>
    <!-- 青衫侠者 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E8E68"/>
      <stop offset="100%" stop-color="#427048"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0E2CC"/>
      <stop offset="100%" stop-color="#D8C8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 竹青 -->
  <circle cx="92" cy="92" r="72" fill="url(#wind)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 家园暖 -->
  <circle cx="164" cy="120" r="44" fill="url(#warm)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 魔教远影 -->
  <circle cx="172" cy="48" r="38" fill="url(#dark)">
    <animate attributeName="opacity" values="0.55;0.32;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 168 48 Q 172 40 175 38 Q 178 40 178 48 Z" fill="#4E4A5E" opacity="0.6"/>

  <!-- 村舍 -->
  <g opacity="0.6">
    <path d="M 154 100 L 154 88 L 176 88 L 176 100 L 182 100 L 182 80 L 148 80 L 148 100 Z" fill="#C8B090"/>
    <path d="M 165 88 L 165 76 L 164 88 Z" fill="#C8B090"/>
  </g>

  <!-- 村民得救（右，虚影） -->
  <g opacity="0.5">
    <path d="M 142 122 Q 144 114 147 112 Q 150 114 150 122 Z" fill="#6E6A6E"/>
    <circle cx="148" cy="110" r="4.5" fill="#D8CCBC"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#749676" opacity="0.8"/>
  <path d="M 0 150 L 200 150" stroke="#8EAC86" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿面熊猫（6头身，青衫侠者，旋风剑在手） -->
  <!-- 腿 -->
  <path d="M 82 134 L 78 156 L 84 156 L 88 136 Z" fill="#427048"/>
  <path d="M 98 134 L 106 158 L 100 158 L 94 136 Z" fill="#427048"/>
  <!-- 青衫 -->
  <path d="M 80 100 Q 76 118 84 134 Q 94 140 102 134 Q 108 118 104 100 Q 92 94 80 100 Z" fill="url(#robe)" stroke="#36603E" stroke-width="1"/>
  <!-- 腰间玉带 -->
  <path d="M 80 116 L 104 116" stroke="#E8D8A8" stroke-width="1.4"/>
  <!-- 尾巴 -->
  <path d="M 106 128 Q 114 124 116 118" stroke="#427048" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（熊猫脸，圆眼沉稳温和，斗笠） -->
  <!-- 斗笠 -->
  <path d="M 72 82 Q 88 72 106 82 Q 110 86 108 88 L 74 88 Q 72 86 72 82 Z" fill="#7E9678" stroke="#668A60" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 90 82;2 90 82;0 90 82" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 熊猫脸 -->
  <ellipse cx="90" cy="92" rx="11" ry="11.5" fill="url(#fur)" stroke="#7E9A76" stroke-width="0.9"/>
  <!-- 熊猫耳 -->
  <circle cx="79" cy="82" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <circle cx="101" cy="82" r="4" fill="#2A4236" stroke="#1E3A2E" stroke-width="0.8"/>
  <!-- 眼周黑斑 -->
  <ellipse cx="85" cy="90" rx="4" ry="3.4" fill="#2A4236"/>
  <ellipse cx="95" cy="90" rx="4" ry="3.4" fill="#2A4236"/>
  <!-- 圆眼沉稳温和 -->
  <circle cx="85" cy="90" r="2.2" fill="#1E1008"/>
  <circle cx="95" cy="90" r="2.2" fill="#1E1008"/>
  <circle cx="85.6" cy="89.4" r="0.8" fill="#FFF"/>
  <circle cx="95.6" cy="89.4" r="0.8" fill="#FFF"/>
  <!-- 鼻 -->
  <ellipse cx="90" cy="95" rx="2.4" ry="1.8" fill="#5E7668"/>
  <!-- 温和抿唇 -->
  <path d="M 86 99 Q 90 100.6 94 99" fill="none" stroke="#6E8E7E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 82 104 C 76 108 74 114 76 120" fill="none" stroke="#5E8E68" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="76" cy="122" r="3" fill="#F0E2CC"/>

  <!-- 右手持旋风剑（以柔克刚，卸力） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 100 104 C 108 98 114 94 118 86" fill="none" stroke="#5E8E68" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="84" r="3.2" fill="#F0E2CC"/>
    <!-- 旋风剑 -->
    <line x1="120" y1="86" x2="130" y2="54" stroke="#B8E8A8" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 130 54 L 133 48" stroke="#B8E8A8" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 卸力剑光 -->
    <circle cx="130" cy="52" r="13" fill="url(#wind)">
      <animate attributeName="r" values="13;18;13" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 130 50 L 136 38 M 132 54 L 142 46" stroke="#B8E8A8" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 旋叶星尘 -->
  <g fill="#B8E8A8">
    <circle cx="36" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80">
      <animate attributeName="cy" values="80;70;80" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
