<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="跳跳·二阶·灭门血仇·崖边回望目光如刀">
  <defs>
    <!-- 背景：灭门火夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E2E22"/>
      <stop offset="52%" stop-color="#4E2018"/>
      <stop offset="100%" stop-color="#301410"/>
    </linearGradient>
    <!-- 冲天烈焰 -->
    <radialGradient id="fire" cx="72%" cy="36%" r="52%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 青光冷冽 -->
    <radialGradient id="cyan" cx="50%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#6EE8D8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6EE8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E8E50"/>
      <stop offset="100%" stop-color="#246E3A"/>
    </linearGradient>
    <!-- 绿色短打染尘 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E6E52"/>
      <stop offset="100%" stop-color="#36523E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D0B8"/>
      <stop offset="100%" stop-color="#D0B8A0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 冲天烈焰 -->
  <circle cx="152" cy="80" r="76" fill="url(#fire)">
    <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 火舌 -->
  <g fill="#E8623A" opacity="0.8">
    <path d="M 150 48 Q 144 36 150 28 Q 156 36 154 44 Z">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 162 60 Q 168 50 164 40 Q 158 50 160 58 Z">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 青光冷冽 -->
  <circle cx="80" cy="110" r="50" fill="url(#cyan)">
    <animate attributeName="opacity" values="0.55;0.3;0.55" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 家园成灰（废墟） -->
  <g opacity="0.6">
    <path d="M 120 110 Q 118 96 124 92 Q 132 94 132 110 Z" fill="#4E2A1E"/>
    <path d="M 148 116 Q 156 110 152 102 Q 144 104 142 116 Z" fill="#3A2018"/>
    <!-- 余烬火星 -->
    <g fill="#E8623A">
      <circle cx="130" cy="100" r="2"><animate attributeName="cy" values="100;112;100" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="106" r="2"><animate attributeName="cy" values="106;118;106" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 山崖 -->
  <path d="M 0 138 L 200 138 L 200 200 L 0 200 Z" fill="#2E1E14" opacity="0.85"/>
  <path d="M 0 138 L 200 138" stroke="#4E3424" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿毛小猴（5头身，带伤，立于崖边，紧握青光剑） -->
  <!-- 腿 -->
  <path d="M 78 128 L 74 148 L 80 148 L 84 130 Z" fill="#246E3A"/>
  <path d="M 92 128 L 100 150 L 94 150 L 88 130 Z" fill="#246E3A"/>
  <!-- 短打染尘带伤 -->
  <path d="M 76 96 Q 72 112 80 130 Q 90 136 98 130 Q 104 112 100 96 Q 88 90 76 96 Z" fill="url(#robe)" stroke="#2E4A34" stroke-width="1"/>
  <!-- 伤疤 -->
  <path d="M 80 104 Q 82 108 79 112" stroke="#B84E3E" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- 绿带松散 -->
  <path d="M 76 114 L 100 114" stroke="#6EE8D8" stroke-width="1.2"/>
  <path d="M 76 114 L 70 118" stroke="#6EE8D8" stroke-width="1" stroke-linecap="round"/>
  <!-- 尾巴（僵直） -->
  <path d="M 100 124 Q 106 120 108 114" stroke="#246E3A" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（猴脸，圆眼含泪却如刀，再不见笑，绿毛凌乱） -->
  <ellipse cx="87" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6E3E" stroke-width="0.9"/>
  <!-- 圆耳 -->
  <circle cx="77" cy="82" r="3.6" fill="#3E8E50" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="97" cy="82" r="3.6" fill="#3E8E50" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="77" cy="82" r="1.8" fill="#C8A080"/>
  <circle cx="97" cy="82" r="1.8" fill="#C8A080"/>
  <!-- 绿毛凌乱 -->
  <path d="M 82 82 Q 84 76 90 78 Q 94 76 96 82" stroke="#246E3A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 84 78 Q 80 72 86 70" stroke="#246E3A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 猴脸浅色 -->
  <ellipse cx="87" cy="97" rx="6.5" ry="5" fill="#E8D0B8"/>
  <!-- 圆眼含泪如刀 -->
  <circle cx="82" cy="91" r="3" fill="#1E1008"/>
  <circle cx="92" cy="91" r="3" fill="#1E1008"/>
  <circle cx="83" cy="90" r="1" fill="#FFF"/>
  <circle cx="93" cy="90" r="1" fill="#FFF"/>
  <!-- 泪痕 -->
  <path d="M 80 93 Q 79 95 80 97" stroke="#C8E8F8" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
    <animate attributeName="cy" values="93;98;93" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 猴鼻 -->
  <circle cx="87" cy="96" r="1.6" fill="#C06A4E"/>
  <!-- 咬牙 -->
  <path d="M 83 100 Q 87 101.6 91 100" fill="none" stroke="#8E5A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（握青光剑，护身） -->
  <path d="M 78 100 C 72 104 70 110 72 116" fill="none" stroke="#4E6E52" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="72" cy="118" r="3" fill="#E8D0B8"/>
  <!-- 青光剑 -->
  <line x1="72" y1="116" x2="60" y2="92" stroke="#6EE8D8" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 60 92 L 58 86" stroke="#6EE8D8" stroke-width="2" stroke-linecap="round"/>

  <!-- 右手（握拳，含恨） -->
  <path d="M 96 100 C 102 96 106 92 108 86" fill="none" stroke="#4E6E52" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="109" cy="84" r="2.8" fill="#E8D0B8"/>

  <!-- 火星星尘 -->
  <g fill="#E8623A">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="70">
      <animate attributeName="cy" values="70;60;70" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
