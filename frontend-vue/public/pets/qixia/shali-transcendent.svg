<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="莎丽·六阶·七剑合璧·紫云万丈护苍生">
  <defs>
    <!-- 背景：决战之巅 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3A6E"/>
      <stop offset="52%" stop-color="#3E2E5E"/>
      <stop offset="100%" stop-color="#2E1E4E"/>
    </linearGradient>
    <!-- 七色剑光 -->
    <radialGradient id="seven" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D8BCF8" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫云万丈 -->
    <radialGradient id="purple" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#D8BCF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A078D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="82%" cy="24%" r="32%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A472D8"/>
      <stop offset="100%" stop-color="#8254B8"/>
    </linearGradient>
    <!-- 紫色女侠装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9E68D0"/>
      <stop offset="100%" stop-color="#7846AC"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E4CEB6"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 七色剑光 -->
  <circle cx="100" cy="80" r="90" fill="url(#seven)">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 紫云万丈 -->
  <circle cx="100" cy="80" r="72" fill="url(#purple)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 战火 -->
  <circle cx="162" cy="48" r="46" fill="url(#fire)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="80" r="60" fill="none" stroke="#FFF3C4" stroke-width="2.2" opacity="0.85">
      <animate attributeName="r" values="60;66;60" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="80" r="52" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="52;55;52" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 七色剑光冲天 -->
  <g stroke-linecap="round" fill="none">
    <path d="M 100 44 Q 96 28 100 12" stroke="#FFF3C4" stroke-width="3" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 84 50 Q 76 38 72 24" stroke="#F58A3E" stroke-width="2.6" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 116 50 Q 124 38 128 24" stroke="#F58A3E" stroke-width="2.6" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 62 Q 58 54 50 44" stroke="#D8BCF8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 62 Q 142 54 150 44" stroke="#D8BCF8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 78 Q 50 72 42 64" stroke="#7EA878" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 78 Q 150 72 158 64" stroke="#7EA878" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山河人间（下方，被护） -->
  <g opacity="0.5">
    <path d="M 0 154 Q 40 146 90 152 Q 140 158 200 150 L 200 200 L 0 200 Z" fill="#3E2E5E"/>
    <path d="M 40 150 L 40 142 L 52 142 L 52 150 M 120 152 L 120 144 L 132 144 L 132 152" fill="#5E4E7E" opacity="0.7"/>
  </g>

  <!-- 紫毛松鼠（6头身，紫色女侠装，紫云剑在手） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 156 L 86 156 L 90 136 Z" fill="#6E3EA0"/>
  <path d="M 100 134 L 108 158 L 102 158 L 96 136 Z" fill="#6E3EA0"/>
  <!-- 紫色女侠装 -->
  <path d="M 84 100 Q 80 118 86 134 Q 96 140 104 134 Q 110 118 106 100 Q 96 94 84 100 Z" fill="url(#robe)" stroke="#5E3490" stroke-width="1"/>
  <!-- 腰间紫带 -->
  <path d="M 84 116 L 106 116" stroke="#D8BCF8" stroke-width="1.6"/>
  <!-- 蓬松大尾 -->
  <path d="M 108 128 Q 118 122 124 114 Q 128 104 122 100 Q 116 104 116 112 Q 114 120 106 126 Z" fill="#8E5EC0" stroke="#6E3EA0" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 108 128;8 108 128;0 108 128" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（松鼠脸，圆眼温柔明亮，颊边蓬毛轻拂） -->
  <ellipse cx="94" cy="90" rx="10.5" ry="11" fill="url(#fur)" stroke="#5E3490" stroke-width="0.9"/>
  <!-- 松鼠耳 -->
  <path d="M 85 82 L 79 68 L 89 76 Z" fill="#A472D8" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 103 82 L 109 68 L 99 76 Z" fill="#A472D8" stroke="#5E3490" stroke-width="0.8"/>
  <path d="M 85 80 L 81 70 L 87 76 Z" fill="#E0C0F0"/>
  <path d="M 103 80 L 107 70 L 101 76 Z" fill="#E0C0F0"/>
  <!-- 颊边蓬毛轻拂 -->
  <path d="M 83 90 Q 78 88 80 94 Q 82 96 86 94" fill="#8E5EC0"/>
  <path d="M 105 90 Q 110 88 108 94 Q 106 96 102 94" fill="#8E5EC0"/>
  <!-- 发带在剑气中流转 -->
  <path d="M 88 80 Q 94 76 100 80 L 98 78 Q 94 74 90 78 Z" fill="#D8BCF8"/>
  <path d="M 100 78 L 104 76" stroke="#D8BCF8" stroke-width="1.3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <!-- 浅色面斑 -->
  <ellipse cx="94" cy="94" rx="6.5" ry="5" fill="#F6E2CC"/>
  <!-- 圆眼温柔明亮（金瞳） -->
  <path d="M 88 88 Q 91 86 94 88 Q 91 90 88 88 Z" fill="#1E1008"/>
  <path d="M 100 88 Q 97 86 94 88 Q 97 90 100 88 Z" fill="#1E1008"/>
  <circle cx="89.4" cy="87.4" r="0.7" fill="#FFF3C4"/>
  <circle cx="98.6" cy="87.4" r="0.7" fill="#FFF3C4"/>
  <!-- 鼻 -->
  <circle cx="94" cy="93" r="1.5" fill="#C86A9E"/>
  <!-- 温柔含笑 -->
  <path d="M 90 97 Q 94 99.2 98 97" fill="none" stroke="#B06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 86 102 C 80 106 78 112 80 118" fill="none" stroke="#9E68D0" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="80" cy="120" r="3" fill="#F6E2CC"/>

  <!-- 右手持紫云剑（七剑合璧·为引） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 102 102 C 110 96 116 92 120 84" fill="none" stroke="#9E68D0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="82" r="3.2" fill="#F6E2CC"/>
    <!-- 紫云剑（为引，指天） -->
    <line x1="122" y1="84" x2="132" y2="52" stroke="#D8BCF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 132 52 L 135 46" stroke="#D8BCF8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 剑引七色 -->
    <circle cx="132" cy="50" r="14" fill="url(#purple)">
      <animate attributeName="r" values="14;19;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 紫云星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
