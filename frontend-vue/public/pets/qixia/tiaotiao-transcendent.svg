<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="跳跳·六阶·七剑合璧·青光掠影报仇归守护">
  <defs>
    <!-- 背景：决战之巅 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E4E5E"/>
      <stop offset="52%" stop-color="#1E3E4E"/>
      <stop offset="100%" stop-color="#122E3E"/>
    </linearGradient>
    <!-- 七色剑光 -->
    <radialGradient id="seven" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6EE8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 青光掠影 -->
    <radialGradient id="cyan" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#6EE8D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3E9EC8" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="82%" cy="24%" r="32%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56B464"/>
      <stop offset="100%" stop-color="#38904E"/>
    </linearGradient>
    <!-- 绿色侠客装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#52A460"/>
      <stop offset="100%" stop-color="#3A8450"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F2DCC4"/>
      <stop offset="100%" stop-color="#DAC4AC"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 七色剑光 -->
  <circle cx="100" cy="80" r="90" fill="url(#seven)">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 青光 -->
  <circle cx="100" cy="80" r="72" fill="url(#cyan)">
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 战火 -->
  <circle cx="162" cy="48" r="46" fill="url(#fire)">
    <animate attributeName="opacity" values="0.65;0.4;0.65" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="80" r="60" fill="none" stroke="#FFF3C4" stroke-width="2.2" opacity="0.85">
      <animate attributeName="r" values="60;66;60" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="80" r="52" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="52;55;52" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 七色剑光冲天 -->
  <g stroke-linecap="round" fill="none">
    <path d="M 100 44 Q 96 28 100 12" stroke="#FFF3C4" stroke-width="3" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 84 50 Q 76 38 72 24" stroke="#F58A3E" stroke-width="2.6" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 116 50 Q 124 38 128 24" stroke="#F58A3E" stroke-width="2.6" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 62 Q 58 54 50 44" stroke="#6EE8D8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 62 Q 142 54 150 44" stroke="#6EE8D8" stroke-width="2.4" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 78 Q 50 72 42 64" stroke="#7EA878" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 78 Q 150 72 158 64" stroke="#7EA878" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 山河人间（下方，被护） -->
  <g opacity="0.5">
    <path d="M 0 154 Q 40 146 90 152 Q 140 158 200 150 L 200 200 L 0 200 Z" fill="#1E3E4E"/>
    <path d="M 40 150 L 40 142 L 52 142 L 52 150 M 120 152 L 120 144 L 132 144 L 132 152" fill="#3E5E6E" opacity="0.7"/>
  </g>

  <!-- 黑心虎残影（被青光直取，右上） -->
  <g opacity="0.45">
    <path d="M 158 58 Q 160 50 163 48 Q 166 50 166 58 Z" fill="#2E1E2E"/>
    <circle cx="163" cy="46" r="4" fill="#4E3A4E"/>
    <path d="M 160 56 L 150 52 M 166 54 L 174 50" stroke="#6EE8D8" stroke-width="1.4" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 绿毛小猴（6头身，青光剑在手，七侠） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 156 L 86 156 L 90 136 Z" fill="#38904E"/>
  <path d="M 100 134 L 108 158 L 102 158 L 96 136 Z" fill="#38904E"/>
  <!-- 绿色侠客装 -->
  <path d="M 84 100 Q 80 118 86 134 Q 96 140 104 134 Q 110 118 106 100 Q 96 94 84 100 Z" fill="url(#robe)" stroke="#2E7240" stroke-width="1"/>
  <!-- 腰间绿带 -->
  <path d="M 84 116 L 106 116" stroke="#6EE8D8" stroke-width="1.6"/>
  <!-- 尾巴 -->
  <path d="M 110 128 Q 120 120 124 112" stroke="#38904E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 110 128;12 110 128;0 110 128" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（猴脸，圆眼含泪含笑，绿毛束起） -->
  <ellipse cx="94" cy="90" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6E3E" stroke-width="0.9"/>
  <!-- 圆耳 -->
  <circle cx="84" cy="80" r="3.6" fill="#56B464" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="104" cy="80" r="3.6" fill="#56B464" stroke="#2E6E3E" stroke-width="0.7"/>
  <circle cx="84" cy="80" r="1.8" fill="#D8B090"/>
  <circle cx="104" cy="80" r="1.8" fill="#D8B090"/>
  <!-- 马尾 -->
  <path d="M 94 78 Q 92 70 96 68 Q 100 72 98 78 Z" fill="#38904E"/>
  <path d="M 96 68 Q 99 62 97 59" stroke="#6EE8D8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 猴脸浅色 -->
  <ellipse cx="94" cy="95" rx="6.5" ry="5" fill="#F2DCC4"/>
  <!-- 圆眼含泪含笑 -->
  <path d="M 88 89 Q 91 87 94 89 Q 91 91 88 89 Z" fill="#1E1008"/>
  <path d="M 100 89 Q 97 87 94 89 Q 97 91 100 89 Z" fill="#1E1008"/>
  <!-- 泪光 -->
  <path d="M 86 90 Q 85 92 86 94" stroke="#C8E8F8" stroke-width="1" stroke-linecap="round" opacity="0.7">
    <animate attributeName="cy" values="90;95;90" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="89.4" cy="88.4" r="0.7" fill="#FFE066"/>
  <circle cx="98.6" cy="88.4" r="0.7" fill="#FFE066"/>
  <!-- 猴鼻 -->
  <circle cx="94" cy="94" r="1.6" fill="#C06A4E"/>
  <!-- 含笑 -->
  <path d="M 89 98 Q 94 102 99 98" fill="none" stroke="#8E5A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（护身） -->
  <path d="M 86 102 C 80 106 78 112 80 118" fill="none" stroke="#52A460" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="80" cy="120" r="3" fill="#F2DCC4"/>

  <!-- 右手持青光剑（七剑合璧·为引） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 102 102 C 110 96 116 92 120 84" fill="none" stroke="#52A460" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="82" r="3.2" fill="#F2DCC4"/>
    <!-- 青光剑（为引，指天） -->
    <line x1="122" y1="84" x2="132" y2="52" stroke="#6EE8D8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 132 52 L 135 46" stroke="#6EE8D8" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 剑引七色 -->
    <circle cx="132" cy="50" r="14" fill="url(#cyan)">
      <animate attributeName="r" values="14;19;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 青光星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
