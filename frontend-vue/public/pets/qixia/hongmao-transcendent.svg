<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="虹猫·六阶·七剑合璧·长虹为引护山河人间">
  <defs>
    <!-- 背景：决战之巅天地 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3A6E"/>
      <stop offset="52%" stop-color="#3E2E5E"/>
      <stop offset="100%" stop-color="#2E1E4E"/>
    </linearGradient>
    <!-- 七色剑光（长虹七色） -->
    <radialGradient id="seven" cx="50%" cy="36%" r="56%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 战火红 -->
    <radialGradient id="fire" cx="78%" cy="26%" r="36%">
      <stop offset="0%" stop-color="#E8623A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8623A" stop-opacity="0"/>
    </radialGradient>
    <!-- 神光金 -->
    <radialGradient id="gold" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 红毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E84E3A"/>
      <stop offset="100%" stop-color="#B83A2E"/>
    </linearGradient>
    <!-- 侠客装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8403A"/>
      <stop offset="100%" stop-color="#B83030"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0D8BC"/>
      <stop offset="100%" stop-color="#D8C0A0"/>
    </radialGradient>

    <!-- 头部模板：猫脸·圆眼含笑含光·剑意圆满（脸中心 0,0） -->
    <g id="hongmao-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#A83228" stroke-width="0.8"/>
      <path d="M -9 -8 L -15 -18 L -3 -12 Z" fill="#E84E3A" stroke="#A83228" stroke-width="0.8"/>
      <path d="M 9 -8 L 15 -18 L 3 -12 Z" fill="#E84E3A" stroke="#A83228" stroke-width="0.8"/>
      <path d="M -10 -10 L -13 -16 L -5 -12 Z" fill="#F0B8C0"/>
      <path d="M 10 -10 L 13 -16 L 5 -12 Z" fill="#F0B8C0"/>
      <path d="M -7 -6 Q 0 -9 7 -6 L 5 -8 Q 0 -11 -5 -8 Z" fill="#B83A2E"/>
      <path d="M 7 -6 L 11 -8" stroke="#B83A2E" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="0" cy="3" rx="7" ry="5.5" fill="#F0D8BC"/>
      <circle cx="-5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="-4" cy="-1" r="1" fill="#FFF"/>
      <circle cx="6" cy="-1" r="1" fill="#FFF"/>
      <circle cx="-4.2" cy="0.2" r="0.7" fill="#FFE066"/>
      <circle cx="4.2" cy="0.2" r="0.7" fill="#FFE066"/>
      <circle cx="0" cy="4" r="1.5" fill="#C85068"/>
      <path d="M -9 4 L -15 3 M -9 6 L -15 7 M 9 4 L 15 3 M 9 6 L 15 7" stroke="#C8B098" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M -4 8 Q 0 9.4 4 8" fill="none" stroke="#8E5A3E" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 七色剑光 -->
  <circle cx="100" cy="76" r="90" fill="url(#seven)">
    <animate attributeName="opacity" values="0.95;0.6;0.95" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- 神光 -->
  <circle cx="100" cy="76" r="70" fill="url(#gold)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 金色圆光 -->
  <g>
    <circle cx="100" cy="76" r="60" fill="none" stroke="#FFF3C4" stroke-width="2.2" opacity="0.85">
      <animate attributeName="r" values="60;66;60" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="76" r="52" fill="none" stroke="#FFF3C4" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="52;55;52" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 七色剑光冲天（七道剑影） -->
  <g stroke-linecap="round" fill="none">
    <path d="M 100 40 Q 96 24 100 8" stroke="#FFE066" stroke-width="3" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 84 46 Q 76 34 72 20" stroke="#F58A3E" stroke-width="2.6" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 116 46 Q 124 34 128 20" stroke="#F58A3E" stroke-width="2.6" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 72 56 Q 60 48 52 38" stroke="#6E9EF0" stroke-width="2.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 128 56 Q 140 48 148 38" stroke="#6E9EF0" stroke-width="2.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 62 70 Q 52 64 44 56" stroke="#7EA878" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 138 70 Q 148 64 156 56" stroke="#7EA878" stroke-width="2" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.4;0.75" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 魔教（右上，被七色剑光斩向） -->
  <g opacity="0.55">
    <path d="M 156 60 Q 158 48 162 44 Q 166 46 166 60 Z" fill="#3E2E3E"/>
    <path d="M 170 54 Q 172 44 175 41 Q 178 43 178 54 Z" fill="#4E3A4E"/>
  </g>
  <!-- 战火 -->
  <circle cx="158" cy="42" r="40" fill="url(#fire)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 山河人间（下方，被护） -->
  <g opacity="0.5">
    <path d="M 0 152 Q 40 144 90 150 Q 140 156 200 148 L 200 200 L 0 200 Z" fill="#1E2E56"/>
    <path d="M 40 148 L 40 140 L 52 140 L 52 148 M 120 150 L 120 142 L 132 142 L 132 150" fill="#3E5E8E" opacity="0.7"/>
  </g>
  <!-- 剑光护山河 -->
  <g stroke="#FFF3C4" stroke-width="1.5" opacity="0.5" stroke-linecap="round">
    <path d="M 60 110 Q 52 128 54 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 140 110 Q 148 128 146 146">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 红毛小猫（长虹为引，立于决战之巅） -->
  <!-- 腿 -->
  <path d="M 88 130 L 84 152 L 90 152 L 94 132 Z" fill="#B83030"/>
  <path d="M 106 130 L 114 154 L 108 154 L 102 132 Z" fill="#B83030"/>
  <!-- 侠客装 -->
  <path d="M 86 100 Q 82 118 88 134 Q 100 140 110 134 Q 116 118 112 100 Q 100 94 86 100 Z" fill="url(#robe)" stroke="#982020" stroke-width="1"/>
  <!-- 护腕 -->
  <path d="M 88 102 L 108 102 L 107 106 L 89 106 Z" fill="#E8D8A8" stroke="#B8964E" stroke-width="0.8"/>
  <!-- 革带 -->
  <path d="M 86 116 L 112 116" stroke="#8E6A42" stroke-width="1.6"/>
  <!-- 尾巴 -->
  <path d="M 112 128 Q 122 120 126 112" stroke="#B83A2E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 112 128;10 112 128;0 112 128" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（猫脸，金瞳含光） -->
  <use href="#hongmao-face" transform="translate(100,94) scale(1)"/>
  <!-- 发带在剑气中猎猎 -->
  <path d="M 100 86 L 84 78" stroke="#B83A2E" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;4 -2;0 0" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 100 86 L 116 78" stroke="#B83A2E" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;-4 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 左臂（护身，长虹剑为引） -->
  <path d="M 88 108 C 82 112 80 118 82 124" fill="none" stroke="#D8403A" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="82" cy="126" r="3" fill="#D0B090"/>

  <!-- 右手高举长虹剑（七剑合璧·长虹为引） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 108 108 C 116 102 120 96 122 88" fill="none" stroke="#D8403A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="123" cy="86" r="3.2" fill="#D0B090"/>
    <!-- 长虹剑（为引，指天） -->
    <line x1="123" y1="88" x2="130" y2="56" stroke="#FFE066" stroke-width="3" stroke-linecap="round"/>
    <path d="M 130 56 L 132 50" stroke="#FFE066" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 剑引七色 -->
    <circle cx="130" cy="54" r="14" fill="url(#gold)">
      <animate attributeName="r" values="14;19;14" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 七色星尘 -->
  <g fill="#FFF3C4">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 云端散光 -->
  <g stroke="#FFF3C4" stroke-width="1.4" opacity="0.45" stroke-linecap="round">
    <path d="M 100 22 L 100 12"/><path d="M 56 36 L 48 28"/><path d="M 144 36 L 152 28"/>
  </g>
</svg>
