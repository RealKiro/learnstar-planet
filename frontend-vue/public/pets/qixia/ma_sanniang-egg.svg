<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="马三娘·一阶·魔教剑手·剑场练剑紫影藏锋">
  <defs>
    <!-- 背景：魔教剑场 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E4A6E"/>
      <stop offset="52%" stop-color="#4E3A5E"/>
      <stop offset="100%" stop-color="#3E2A4E"/>
    </linearGradient>
    <!-- 剑影紫 -->
    <radialGradient id="purple" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#C8A8F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8A8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 魔教暗 -->
    <radialGradient id="dark" cx="80%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#2E2A4E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2E2A4E" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫黑毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E5EAC"/>
      <stop offset="100%" stop-color="#5E3E8C"/>
    </linearGradient>
    <!-- 紫黑劲装 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E4E9E"/>
      <stop offset="100%" stop-color="#4E327E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E4D0B8"/>
      <stop offset="100%" stop-color="#C8B49E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 剑影紫 -->
  <circle cx="100" cy="92" r="70" fill="url(#purple)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 魔教暗 -->
  <circle cx="160" cy="52" r="48" fill="url(#dark)">
    <animate attributeName="opacity" values="0.7;0.42;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 魔教剑场柱 -->
  <g opacity="0.6">
    <path d="M 18 64 L 26 56 L 44 60 L 42 152 L 18 152 Z" fill="#4E4A5E"/>
    <path d="M 158 60 L 166 52 L 184 56 L 182 152 L 158 152 Z" fill="#4E4A5E"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#2E2A3E" opacity="0.9"/>
  <path d="M 0 152 L 200 152" stroke="#4E4A5E" stroke-width="1.4" opacity="0.6"/>

  <!-- 紫毛女剑客（6头身，身形清瘦，紫黑劲装，佩剑如影） -->
  <!-- 腿 -->
  <path d="M 84 134 L 80 158 L 86 158 L 90 136 Z" fill="#4E327E"/>
  <path d="M 98 134 L 106 160 L 100 160 L 94 136 Z" fill="#4E327E"/>
  <!-- 紫黑劲装 -->
  <path d="M 82 98 Q 78 118 86 136 Q 96 142 104 136 Q 110 118 106 98 Q 94 92 82 98 Z" fill="url(#robe)" stroke="#3E2670" stroke-width="1"/>
  <!-- 袖口暗金云纹 -->
  <path d="M 82 100 L 78 106 Q 80 110 84 108" stroke="#D8C878" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M 106 100 L 110 104" stroke="#D8C878" stroke-width="1" stroke-linecap="round"/>
  <!-- 腰悬紫影剑 -->
  <line x1="104" y1="118" x2="112" y2="138" stroke="#C8A8F0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 尾巴（修长） -->
  <path d="M 108 130 Q 118 124 122 116" stroke="#5E3E8C" stroke-width="2.6" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="0 108 130;10 108 130;0 108 130" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <!-- 头（清冷面容，细眉凤目，高马尾） -->
  <ellipse cx="94" cy="92" rx="10.5" ry="11" fill="url(#fur)" stroke="#4E327E" stroke-width="0.9"/>
  <!-- 猫耳 -->
  <path d="M 85 84 L 79 70 L 89 78 Z" fill="#7E5EAC" stroke="#4E327E" stroke-width="0.8"/>
  <path d="M 103 84 L 109 70 L 99 78 Z" fill="#7E5EAC" stroke="#4E327E" stroke-width="0.8"/>
  <path d="M 85 82 L 81 72 L 87 78 Z" fill="#C8A8D8"/>
  <path d="M 103 82 L 107 72 L 101 78 Z" fill="#C8A8D8"/>
  <!-- 高马尾 -->
  <path d="M 94 80 Q 92 72 96 70 Q 100 74 98 80 Z" fill="#5E3E8C"/>
  <path d="M 96 70 Q 100 62 98 58 M 98 58 L 100 60" stroke="#D8C878" stroke-width="1.2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 细眉 -->
  <path d="M 86 86 Q 90 84.4 93 86 M 95 86 Q 98 84.4 102 86" stroke="#2E1A2E" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 浅色面斑 -->
  <ellipse cx="94" cy="96" rx="6.5" ry="5" fill="#E4D0B8"/>
  <!-- 凤目含剑意 -->
  <path d="M 86 90 Q 90 88.6 93 90 L 93 91.4 Q 90 90 86 91.4 Z" fill="#1E1008"/>
  <path d="M 102 90 Q 98 88.6 95 90 L 95 91.4 Q 98 90 102 91.4 Z" fill="#1E1008"/>
  <circle cx="88" cy="90" r="1.2" fill="#FFF"/>
  <circle cx="100" cy="90" r="1.2" fill="#FFF"/>
  <!-- 鼻梁挺 -->
  <path d="M 94 93 L 94 95.5" stroke="#B09078" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 薄唇 -->
  <path d="M 90 99 Q 94 100.4 98 99" fill="none" stroke="#A06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（持紫影剑，剑光如影） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-5 84 106;4 84 106;-5 84 106" dur="2s" repeatCount="indefinite"/>
    <path d="M 84 106 C 78 110 76 116 78 122" fill="none" stroke="#6E4E9E" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="78" cy="124" r="3" fill="#E4D0B8"/>
    <!-- 紫影剑 -->
    <line x1="78" y1="122" x2="56" y2="148" stroke="#C8A8F0" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 56 148 L 54 154" stroke="#C8A8F0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑光如影 -->
    <path d="M 56 148 Q 46 156 40 162" stroke="#C8A8F0" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，藏锋） -->
  <path d="M 104 106 C 110 102 114 98 116 92" fill="none" stroke="#6E4E9E" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="90" r="2.8" fill="#E4D0B8"/>

  <!-- 剑影星尘 -->
  <g fill="#C8A8F0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
