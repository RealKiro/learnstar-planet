<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="逗逗·二阶·医者无奈·守榻喂药药囊散落">
  <defs>
    <!-- 背景：昏黄屋中 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E7A5E"/>
      <stop offset="52%" stop-color="#6E5A44"/>
      <stop offset="100%" stop-color="#4E3A2E"/>
    </linearGradient>
    <!-- 烛火昏黄 -->
    <radialGradient id="fire" cx="70%" cy="40%" r="46%">
      <stop offset="0%" stop-color="#F0C878" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0C878" stop-opacity="0"/>
    </radialGradient>
    <!-- 药草微绿 -->
    <radialGradient id="herb" cx="34%" cy="56%" r="34%">
      <stop offset="0%" stop-color="#7EA878" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7EA878" stop-opacity="0"/>
    </radialGradient>
    <!-- 白毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8ECEE"/>
      <stop offset="100%" stop-color="#C0C8CE"/>
    </linearGradient>
    <!-- 黄米色布衣 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8B878"/>
      <stop offset="100%" stop-color="#A08A4E"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 烛火 -->
  <circle cx="142" cy="78" r="60" fill="url(#fire)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <!-- 药草微光 -->
  <circle cx="72" cy="112" r="44" fill="url(#herb)">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 烛火（前景） -->
  <g>
    <path d="M 150 108 L 150 88 L 152 88 L 152 108 Z" fill="#B08A5E"/>
    <path d="M 150 88 Q 148 80 150 76 Q 152 80 151 88 Z" fill="#F0C878" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 床榻 -->
  <path d="M 118 132 L 118 108 Q 118 104 124 104 L 186 104 Q 190 104 190 110 L 190 132 Z" fill="#6E5648" stroke="#564238" stroke-width="1"/>
  <path d="M 120 108 L 188 108" stroke="#806858" stroke-width="1.2"/>
  <!-- 至亲虚影（卧榻） -->
  <g opacity="0.5">
    <path d="M 148 106 Q 148 100 152 98 Q 156 100 156 106 L 156 112 Q 152 114 148 112 Z" fill="#4E3E36"/>
    <circle cx="152" cy="96" r="5" fill="#D8C8B0"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 152 L 200 152 L 200 200 L 0 200 Z" fill="#3E2E24" opacity="0.85"/>
  <path d="M 0 152 L 200 152" stroke="#5E4A3E" stroke-width="1.4" opacity="0.6"/>

  <!-- 白毛小狗（5头身，布衣，守榻） -->
  <!-- 腿 -->
  <path d="M 82 136 L 78 156 L 84 156 L 88 138 Z" fill="#B8C0C8"/>
  <path d="M 98 136 L 106 158 L 100 158 L 94 138 Z" fill="#B8C0C8"/>
  <!-- 布衣 -->
  <path d="M 82 102 Q 78 120 84 136 Q 94 142 102 136 Q 108 120 104 102 Q 94 96 82 102 Z" fill="url(#robe)" stroke="#8E7440" stroke-width="1"/>
  <!-- 药囊（摔过又缝上） -->
  <path d="M 104 104 L 114 114 L 112 124 L 100 110 Z" fill="#B8A880" stroke="#968A60" stroke-width="0.8"/>
  <path d="M 102 108 L 108 116" stroke="#5E4A3E" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
  <!-- 散落药草 -->
  <g fill="#7EA878" opacity="0.7">
    <path d="M 66 150 L 62 142 M 74 152 L 70 144" stroke="#7EA878" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- 尾巴（垂） -->
  <path d="M 108 130 Q 114 126 115 120" stroke="#C0C8CE" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（狗脸，圆眼含泪，白毛凌乱） -->
  <ellipse cx="93" cy="96" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#9AA2A8" stroke-width="0.8"/>
  <!-- 垂耳 -->
  <path d="M 84 90 Q 76 90 74 98 Q 74 104 80 102 Q 84 98 86 92 Z" fill="#C0B068" stroke="#968A50" stroke-width="0.8"/>
  <path d="M 102 90 Q 110 90 112 98 Q 112 104 106 102 Q 102 98 100 92 Z" fill="#C0B068" stroke="#968A50" stroke-width="0.8"/>
  <!-- 发揪散开 -->
  <path d="M 93 84 Q 91 78 94 75 Q 97 78 95 84 Z" fill="#A8B0B8"/>
  <path d="M 90 82 Q 86 80 84 82 M 96 82 Q 100 80 102 82" stroke="#A8B0B8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 狗脸白斑 -->
  <ellipse cx="93" cy="100" rx="7" ry="5.5" fill="#F0DCC6"/>
  <!-- 圆眼含泪 -->
  <circle cx="88" cy="94" r="3" fill="#1E1008"/>
  <circle cx="98" cy="94" r="3" fill="#1E1008"/>
  <circle cx="89" cy="93" r="1" fill="#FFF"/>
  <circle cx="99" cy="93" r="1" fill="#FFF"/>
  <!-- 泪光 -->
  <path d="M 86 96 Q 85 98 86 100" stroke="#C8E8F8" stroke-width="1.1" stroke-linecap="round" opacity="0.8">
    <animate attributeName="cy" values="96;101;96" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 狗鼻 -->
  <circle cx="93" cy="99" r="1.8" fill="#3A2E26"/>
  <!-- 悲恸抿唇 -->
  <path d="M 89 103 Q 93 104.4 97 103" fill="none" stroke="#7E5A4E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（端药，手抖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 84 108 C 78 112 76 118 78 124" fill="none" stroke="#C0B068" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="78" cy="126" r="3" fill="#F0DCC6"/>
    <!-- 药碗 -->
    <path d="M 72 124 Q 74 130 80 130 Q 86 130 88 124 Z" fill="#B08A5E" stroke="#8E6A44" stroke-width="0.8"/>
  </g>

  <!-- 右手（伸向榻前） -->
  <path d="M 100 108 C 106 112 110 116 112 122" fill="none" stroke="#C0B068" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="113" cy="124" r="2.8" fill="#F0DCC6"/>

  <!-- 烛火星尘 -->
  <g fill="#F0C878">
    <circle cx="120" cy="92">
      <animate attributeName="cy" values="92;82;92" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
