<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="虹猫·三阶·寻剑苦修·雪夜独坐对剑低语">
  <defs>
    <!-- 背景：深山雪夜月光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5E7E"/>
      <stop offset="52%" stop-color="#3E4E6E"/>
      <stop offset="100%" stop-color="#2E3E5E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 剑光微亮 -->
    <radialGradient id="sword" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <!-- 红毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C84836"/>
      <stop offset="100%" stop-color="#96302A"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#E8D0B4"/>
      <stop offset="100%" stop-color="#D0B89C"/>
    </radialGradient>

    <!-- 头部模板：猫脸·圆眼坚毅·眉间风霜（脸中心 0,0） -->
    <g id="hongmao-face">
      <ellipse cx="0" cy="0" rx="10.5" ry="10.5" fill="url(#fur)" stroke="#96302A" stroke-width="0.8"/>
      <!-- 猫耳 -->
      <path d="M -9 -8 L -15 -18 L -3 -12 Z" fill="#C84836" stroke="#96302A" stroke-width="0.8"/>
      <path d="M 9 -8 L 15 -18 L 3 -12 Z" fill="#C84836" stroke="#96302A" stroke-width="0.8"/>
      <path d="M -10 -10 L -13 -16 L -5 -12 Z" fill="#E8ACB8"/>
      <path d="M 10 -10 L 13 -16 L 5 -12 Z" fill="#E8ACB8"/>
      <!-- 红发带 -->
      <path d="M -7 -6 Q 0 -9 7 -6 L 5 -8 Q 0 -11 -5 -8 Z" fill="#96302A"/>
      <path d="M 7 -6 L 11 -8" stroke="#96302A" stroke-width="1.3" stroke-linecap="round"/>
      <!-- 猫脸白斑 -->
      <ellipse cx="0" cy="3" rx="7" ry="5.5" fill="#E8D0B4"/>
      <!-- 圆眼坚毅 -->
      <circle cx="-5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="5" cy="0" r="3" fill="#1E1008"/>
      <circle cx="-4" cy="-1" r="1" fill="#FFF"/>
      <circle cx="6" cy="-1" r="1" fill="#FFF"/>
      <!-- 猫鼻 -->
      <circle cx="0" cy="4" r="1.5" fill="#C85068"/>
      <!-- 猫须 -->
      <path d="M -9 4 L -15 3 M -9 6 L -15 7 M 9 4 L 15 3 M 9 6 L 15 7" stroke="#C8B098" stroke-width="0.8" stroke-linecap="round"/>
      <!-- 坚毅抿唇 -->
      <path d="M -4 8 Q 0 9 4 8" fill="none" stroke="#8E5A3E" stroke-width="1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="48" r="42" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>
  <!-- 月光星 -->
  <g fill="#E8F0FA">
    <circle cx="30" cy="40" r="1.3"/><circle cx="160" cy="20" r="1.1"/>
    <circle cx="180" cy="80" r="1"/>
  </g>

  <!-- 苍茫群山 -->
  <path d="M 0 130 Q 40 112 90 122 Q 140 130 200 118 L 200 200 L 0 200 Z" fill="#3E4E6E" opacity="0.6"/>
  <path d="M 0 148 Q 60 136 120 144 Q 170 150 200 142 L 200 200 L 0 200 Z" fill="#2E3E5E" opacity="0.7"/>

  <!-- 雪 -->
  <g fill="#E8F0FA" opacity="0.8">
    <circle cx="40" cy="40" r="1.4"><animate attributeName="cy" values="40;56;40" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="30" r="1.2"><animate attributeName="cy" values="30;46;30" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="60" r="1"><animate attributeName="cy" values="60;76;60" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 老者指点之影（左，远） -->
  <g opacity="0.45">
    <path d="M 40 120 Q 42 110 46 107 Q 50 109 50 120 Z" fill="#2E3A3E"/>
    <circle cx="48" cy="105" r="4.5" fill="#4E5A5E"/>
    <!-- 指点 -->
    <path d="M 48 106 Q 56 102 60 98" stroke="#C8B098" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- 巨石（雪夜坐处） -->
  <path d="M 60 156 Q 74 146 90 152 Q 102 156 96 164 Q 76 168 60 156 Z" fill="#4E5E6E" stroke="#5E6E7E" stroke-width="1"/>

  <!-- 红毛小猫（5头身，独坐石上，长虹剑横膝） -->
  <!-- 腿（蹲坐） -->
  <path d="M 74 150 Q 80 156 90 152 Q 94 148 92 144 Q 86 150 78 146 Z" fill="#96302A"/>
  <!-- 粗布劲装 -->
  <path d="M 74 116 Q 70 132 76 150 Q 84 156 92 150 Q 98 132 94 116 Q 84 110 74 116 Z" fill="#7E6E56" stroke="#5E503E" stroke-width="1"/>
  <!-- 腰间红带（磨旧） -->
  <path d="M 74 132 L 94 132" stroke="#B83A2E" stroke-width="1.3"/>
  <!-- 腕上缠布 -->
  <path d="M 82 116 L 78 122" stroke="#C8B8A0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 尾巴（低垂） -->
  <path d="M 94 146 Q 102 142 104 136" stroke="#96302A" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- 头（面部模板） -->
  <use href="#hongmao-face" transform="translate(84,106) scale(1)"/>

  <!-- 左臂（抱剑膝上） -->
  <path d="M 76 120 C 70 124 68 130 70 136" fill="none" stroke="#8E7A5E" stroke-width="3.8" stroke-linecap="round"/>
  <circle cx="70" cy="138" r="3" fill="#D0B89C"/>

  <!-- 膝上长虹剑（横放，剑光微亮） -->
  <g>
    <line x1="68" y1="140" x2="94" y2="150" stroke="#E8D8A8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 68 139 L 66 144" stroke="#E8D8A8" stroke-width="2" stroke-linecap="round"/>
    <!-- 剑光微亮 -->
    <circle cx="82" cy="145" r="9" fill="url(#sword)">
      <animate attributeName="r" values="9;13;9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 右手（抚剑，对剑低语） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 92 120 C 98 124 102 128 102 134" fill="none" stroke="#8E7A5E" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="102" cy="136" r="3" fill="#D0B89C"/>
    <!-- 对剑低语之光 -->
    <path d="M 88 110 Q 82 104 80 96" stroke="#E8F0FA" stroke-width="1.3" opacity="0.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 雪夜星尘 -->
  <g fill="#E8F0FA">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
