<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="达达·一阶·沉稳少年·竹林闲坐观竹叶旋">
  <defs>
    <!-- 背景：竹海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFD8B8"/>
      <stop offset="52%" stop-color="#A0C89A"/>
      <stop offset="100%" stop-color="#82B07E"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#F4FFF0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4FFF0" stop-opacity="0"/>
    </radialGradient>
    <!-- 旋风剑意 -->
    <radialGradient id="wind" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#B8E8A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8E8A8" stop-opacity="0"/>
    </radialGradient>
    <!-- 绿面 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F0E4"/>
      <stop offset="100%" stop-color="#D0DCC8"/>
    </linearGradient>
    <!-- 青衫 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EA878"/>
      <stop offset="100%" stop-color="#4E8860"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E8D0"/>
      <stop offset="100%" stop-color="#E0D0B8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>
  <!-- 旋风剑意 -->
  <circle cx="100" cy="96" r="66" fill="url(#wind)">
    <animate attributeName="opacity" values="0.6;0.35;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 竹影 -->
  <g stroke="#6E9E6E" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
    <path d="M 28 40 L 24 160"/>
    <path d="M 178 36 L 174 160"/>
    <path d="M 32 60 L 22 80 M 174 60 L 180 84"/>
  </g>
  <!-- 竹叶 -->
  <g fill="#7EB878" opacity="0.7">
    <path d="M 26 44 Q 20 40 18 34 Q 24 36 26 44 Z"/>
    <path d="M 178 40 Q 184 36 186 30 Q 180 32 178 40 Z"/>
  </g>
  <!-- 旋落的竹叶 -->
  <g fill="#8EC878" opacity="0.8">
    <path d="M 150 60 Q 146 56 146 52 Q 150 54 150 60 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 6;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 76 Q 128 72 128 68 Q 132 70 132 76 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 6;0 0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#7E9E6E" opacity="0.7"/>
  <path d="M 0 150 L 200 150" stroke="#96AE7E" stroke-width="1.4" opacity="0.6"/>

  <!-- 绿面熊猫（5头身，青衫书生，闲坐） -->
  <!-- 腿（盘坐） -->
  <path d="M 82 148 Q 88 152 96 148 Q 98 144 94 142 Q 88 146 82 142 Z" fill="#4E8860"/>
  <!-- 青衫 -->
  <path d="M 78 102 Q 74 124 84 148 Q 94 154 102 148 Q 108 124 104 102 Q 92 96 78 102 Z" fill="url(#robe)" stroke="#3E7048" stroke-width="1"/>
  <!-- 腰间玉带 -->
  <path d="M 78 122 L 104 122" stroke="#E8D8A8" stroke-width="1.6"/>
  <!-- 折扇（膝上） -->
  <path d="M 94 140 L 108 134 L 112 140 Z" fill="#D8C890" stroke="#B8A868" stroke-width="0.8"/>
  <!-- 尾巴 -->
  <circle cx="106" cy="140" r="3" fill="#4E8860"/>

  <!-- 头（熊猫脸，圆眼温和，束发道髻） -->
  <ellipse cx="91" cy="96" rx="11" ry="11.5" fill="url(#fur)" stroke="#8EA886" stroke-width="0.9"/>
  <!-- 熊猫耳 -->
  <circle cx="80" cy="86" r="4" fill="#2E4A3A" stroke="#1E3A2E" stroke-width="0.8"/>
  <circle cx="102" cy="86" r="4" fill="#2E4A3A" stroke="#1E3A2E" stroke-width="0.8"/>
  <!-- 眼周黑斑（熊猫） -->
  <ellipse cx="86" cy="93" rx="4" ry="3.4" fill="#2E4A3A"/>
  <ellipse cx="96" cy="93" rx="4" ry="3.4" fill="#2E4A3A"/>
  <!-- 束发道髻 -->
  <path d="M 88 84 Q 91 76 96 76 Q 99 76 97 84 Z" fill="#4E6E5E"/>
  <path d="M 91 76 Q 92 70 94 70 Q 95 72 94 76" fill="#4E6E5E"/>
  <!-- 圆眼温和 -->
  <circle cx="86" cy="93" r="2.2" fill="#1E1008"/>
  <circle cx="96" cy="93" r="2.2" fill="#1E1008"/>
  <circle cx="86.6" cy="92.4" r="0.8" fill="#FFF"/>
  <circle cx="96.6" cy="92.4" r="0.8" fill="#FFF"/>
  <!-- 鼻 -->
  <ellipse cx="91" cy="99" rx="2.4" ry="1.8" fill="#5E7668"/>
  <!-- 温和微笑 -->
  <path d="M 87 103 Q 91 105.4 95 103" fill="none" stroke="#6E8E7E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（端茶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M 82 106 C 76 110 74 116 76 122" fill="none" stroke="#6EA878" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="76" cy="124" r="3" fill="#F6E8D0"/>
    <!-- 茶碗 -->
    <path d="M 70 122 Q 72 128 78 128 Q 84 128 86 122 Z" fill="#B08A5E" stroke="#8E6A44" stroke-width="0.8"/>
    <!-- 茶气 -->
    <path d="M 78 120 Q 76 116 78 112 Q 80 108 78 104" stroke="#E8E0D0" stroke-width="1" opacity="0.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（指竹叶，剑意） -->
  <path d="M 100 106 C 106 102 110 98 112 92" fill="none" stroke="#6EA878" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="113" cy="90" r="2.8" fill="#F6E8D0"/>

  <!-- 旋叶星尘 -->
  <g fill="#B8E8A8">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
