<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="莎丽·一阶·紫云剑主·溪边练剑剑影如云">
  <defs>
    <!-- 背景：溪边晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C8E8"/>
      <stop offset="52%" stop-color="#B8A8D8"/>
      <stop offset="100%" stop-color="#9A8AC0"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#F4F0FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4F0FF" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫云 -->
    <radialGradient id="purple" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#C8A8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8A8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 紫毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A6AC8"/>
      <stop offset="100%" stop-color="#7A4EA8"/>
    </linearGradient>
    <!-- 紫色短打 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E5EC0"/>
      <stop offset="100%" stop-color="#6E3EA0"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F6E2CC"/>
      <stop offset="100%" stop-color="#E4CEB6"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="70" r="80" fill="url(#glow)"/>
  <!-- 紫云 -->
  <circle cx="100" cy="96" r="66" fill="url(#purple)">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山流水 -->
  <path d="M 0 132 Q 40 118 90 126 Q 140 132 200 122 L 200 200 L 0 200 Z" fill="#9EA8C8" opacity="0.5"/>
  <!-- 溪流 -->
  <path d="M 0 150 Q 50 146 100 150 Q 150 154 200 148 L 200 200 L 0 200 Z" fill="#9EC8D8" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 0 150 Q 50 146 100 150 Q 150 154 200 148" stroke="#B8E0EA" stroke-width="1.4" opacity="0.7"/>

  <!-- 紫毛松鼠（4头身，紫色短打，紫云剑在手） -->
  <!-- 腿 -->
  <path d="M 86 136 L 82 158 L 88 158 L 92 138 Z" fill="#6E3EA0"/>
  <path d="M 102 136 L 110 160 L 104 160 L 98 138 Z" fill="#6E3EA0"/>
  <!-- 紫色短打 -->
  <path d="M 86 102 Q 82 120 88 136 Q 98 142 106 136 Q 112 120 108 102 Q 98 96 86 102 Z" fill="url(#robe)" stroke="#5E3490" stroke-width="1"/>
  <!-- 腰间紫带 -->
  <path d="M 86 120 L 108 120" stroke="#C8A8F0" stroke-width="1.6"/>
  <!-- 蓬松大尾 -->
  <path d="M 108 128 Q 120 120 126 110 Q 130 100 124 94 Q 118 98 118 108 Q 114 118 106 126 Z" fill="#8E5EC0" stroke="#6E3EA0" stroke-width="0.8">
    <animateTransform attributeName="transform" type="rotate" values="0 108 128;8 108 128;0 108 128" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 头（松鼠脸，圆眼温柔，颊边蓬毛，发间紫带） -->
  <ellipse cx="97" cy="96" rx="10.5" ry="11" fill="url(#fur)" stroke="#6E3EA0" stroke-width="0.9"/>
  <!-- 松鼠耳 -->
  <path d="M 88 88 L 82 74 L 92 82 Z" fill="#9A6AC8" stroke="#6E3EA0" stroke-width="0.8"/>
  <path d="M 106 88 L 112 74 L 102 82 Z" fill="#9A6AC8" stroke="#6E3EA0" stroke-width="0.8"/>
  <path d="M 88 86 L 84 76 L 90 82 Z" fill="#D8B8E8"/>
  <path d="M 106 86 L 110 76 L 104 82 Z" fill="#D8B8E8"/>
  <!-- 颊边蓬毛 -->
  <path d="M 86 96 Q 80 94 82 100 Q 84 102 88 100" fill="#8E5EC0"/>
  <path d="M 108 96 Q 114 94 112 100 Q 110 102 106 100" fill="#8E5EC0"/>
  <!-- 发间紫带 -->
  <path d="M 92 86 Q 97 82 102 86 L 100 84 Q 97 80 94 84 Z" fill="#C8A8F0"/>
  <path d="M 102 84 L 106 82" stroke="#C8A8F0" stroke-width="1.3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <!-- 浅色面斑 -->
  <ellipse cx="97" cy="100" rx="6.5" ry="5" fill="#F6E2CC"/>
  <!-- 圆眼温柔 -->
  <circle cx="92" cy="94" r="3" fill="#1E1008"/>
  <circle cx="102" cy="94" r="3" fill="#1E1008"/>
  <circle cx="93" cy="93" r="1" fill="#FFF"/>
  <circle cx="103" cy="93" r="1" fill="#FFF"/>
  <!-- 鼻 -->
  <circle cx="97" cy="99" r="1.5" fill="#C86A9E"/>
  <!-- 温柔微笑 -->
  <path d="M 93 103 Q 97 105.2 101 103" fill="none" stroke="#B06A8E" stroke-width="0.9" stroke-linecap="round"/>

  <!-- 左臂（持紫云剑，斜持） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 88 106;3 88 106;-4 88 106" dur="2s" repeatCount="indefinite"/>
    <path d="M 88 106 C 82 110 78 114 76 120" fill="none" stroke="#8E5EC0" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="75" cy="122" r="3" fill="#F6E2CC"/>
    <!-- 紫云剑 -->
    <line x1="75" y1="120" x2="54" y2="146" stroke="#C8A8F0" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 54 146 L 52 152" stroke="#C8A8F0" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 剑影如云 -->
    <path d="M 54 146 Q 44 154 38 160" stroke="#C8A8F0" stroke-width="1.6" opacity="0.7" stroke-linecap="round">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，剑意） -->
  <path d="M 104 106 C 110 102 114 98 116 92" fill="none" stroke="#8E5EC0" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="117" cy="90" r="2.8" fill="#F6E2CC"/>

  <!-- 紫云星尘 -->
  <g fill="#C8A8F0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
