<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="蓝兔·三阶·雪中苦修·一剑封霜从叶到湖">
  <defs>
    <!-- 背景：玉蟾宫雪夜 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E5E8E"/>
      <stop offset="52%" stop-color="#3E4E7E"/>
      <stop offset="100%" stop-color="#2E3E6E"/>
    </linearGradient>
    <!-- 月白 -->
    <radialGradient id="moon" cx="76%" cy="26%" r="30%">
      <stop offset="0%" stop-color="#E8F0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0FA" stop-opacity="0"/>
    </radialGradient>
    <!-- 冰魄剑光 -->
    <radialGradient id="ice" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#9AC8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9AC8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E86C0"/>
      <stop offset="100%" stop-color="#2E6EA8"/>
    </linearGradient>
    <!-- 练剑裙 -->
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE8F2"/>
      <stop offset="100%" stop-color="#B8CCDE"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F0DCC6"/>
      <stop offset="100%" stop-color="#DCC8B2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 月 -->
  <circle cx="152" cy="48" r="42" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="48" r="10" fill="#E8F0FA" opacity="0.9"/>

  <!-- 宫阙远影 -->
  <g opacity="0.5">
    <path d="M 30 116 L 30 104 L 50 104 L 50 116 L 56 116 L 56 98 L 24 98 L 24 116 Z" fill="#4E5E8E"/>
    <path d="M 40 104 L 40 94 L 39 104 Z" fill="#4E5E8E"/>
  </g>

  <!-- 被冻住的湖（一弯冰镜） -->
  <path d="M 60 156 Q 100 150 150 156 Q 160 158 160 162 Q 100 170 60 162 Z" fill="#7EA8D0" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.75;0.55" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 66 158 Q 100 152 152 158" stroke="#B8DCF4" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>

  <!-- 雪 -->
  <g fill="#E8F0FA" opacity="0.8">
    <circle cx="40" cy="36" r="1.3"><animate attributeName="cy" values="36;52;36" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="30" r="1.1"><animate attributeName="cy" values="30;46;30" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="58" r="1"><animate attributeName="cy" values="58;74;58" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 蓝毛白兔（5头身，练剑裙束袖，一剑封霜） -->
  <!-- 腿 -->
  <path d="M 84 138 L 80 158 L 86 158 L 90 140 Z" fill="#2E6EA8"/>
  <path d="M 100 138 L 108 160 L 102 160 L 96 140 Z" fill="#2E6EA8"/>
  <!-- 练剑裙 -->
  <path d="M 84 102 Q 80 120 86 138 Q 96 144 104 138 Q 110 120 106 102 Q 96 96 84 102 Z" fill="url(#robe)" stroke="#96AEBF" stroke-width="1"/>
  <!-- 束袖 -->
  <path d="M 84 104 L 80 110 M 106 104 L 112 108" stroke="#C8D8E8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 腰间冰魄坠 -->
  <circle cx="96" cy="122" r="2.2" fill="#7EB8E8" stroke="#D8F0FC" stroke-width="0.5"/>
  <!-- 尾巴 -->
  <circle cx="110" cy="132" r="3" fill="#DCE8F2"/>

  <!-- 头（兔脸，坚毅专注） -->
  <ellipse cx="95" cy="96" rx="10.5" ry="11" fill="url(#fur)" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 兔耳 -->
  <path d="M 87 88 Q 82 74 86 64 Q 91 64 92 76 Q 92 84 93 88 Z" fill="#4E86C0" stroke="#2E6EA8" stroke-width="0.8"/>
  <path d="M 103 88 Q 108 74 104 64 Q 99 64 98 76 Q 98 84 97 88 Z" fill="#4E86C0" stroke="#2E6EA8" stroke-width="0.8"/>
  <!-- 内耳粉 -->
  <path d="M 87 86 Q 84 76 87 70 Q 90 72 90 80 Z" fill="#DCA8BC"/>
  <path d="M 103 86 Q 106 76 103 70 Q 100 72 100 80 Z" fill="#DCA8BC"/>
  <!-- 白脸斑 -->
  <ellipse cx="95" cy="100" rx="6.5" ry="5" fill="#F0DCC6"/>
  <!-- 兔眼坚毅 -->
  <circle cx="90" cy="94" r="2.8" fill="#1E1008"/>
  <circle cx="100" cy="94" r="2.8" fill="#1E1008"/>
  <circle cx="91" cy="93" r="1" fill="#FFF"/>
  <circle cx="101" cy="93" r="1" fill="#FFF"/>
  <!-- 兔鼻 -->
  <path d="M 93 99 L 95 101 L 97 99" fill="none" stroke="#C85A78" stroke-width="0.9" stroke-linecap="round"/>
  <!-- 专注抿唇 -->
  <path d="M 91 103 Q 95 104.6 99 103" fill="none" stroke="#8E5A6E" stroke-width="1" stroke-linecap="round"/>

  <!-- 左臂（持冰魄剑，向前封霜） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 76 106;4 76 106;-6 76 106" dur="1.8s" repeatCount="indefinite"/>
    <path d="M 88 106 C 82 110 78 114 76 120" fill="none" stroke="#DCE8F2" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="75" cy="122" r="3" fill="#F0DCC6"/>
    <!-- 冰魄剑 -->
    <line x1="75" y1="120" x2="50" y2="148" stroke="#B8E8F8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 50 148 L 48 154" stroke="#B8E8F8" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 封霜剑光 -->
    <path d="M 50 148 Q 40 156 34 162" stroke="#9AC8F0" stroke-width="1.6" opacity="0.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 右手（剑指，凝霜） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 102 106 C 108 102 112 98 114 92" fill="none" stroke="#DCE8F2" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="115" cy="90" r="2.8" fill="#F0DCC6"/>
    <!-- 指尖凝霜 -->
    <circle cx="115" cy="88" r="4" fill="url(#ice)">
      <animate attributeName="r" values="4;6.5;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 冰魄星尘 -->
  <g fill="#9AC8F0">
    <circle cx="44" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
