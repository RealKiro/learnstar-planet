<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="掠风隼·三阶·练风苦修·顺风穿云疾飞穿云破风风为翼">
  <defs>
    <!-- 背景：宝可梦云海 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A8AB0"/>
      <stop offset="52%" stop-color="#8AB0C8"/>
      <stop offset="100%" stop-color="#C8E0EC"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F4F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰蓝羽 -->
    <radialGradient id="feather" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#829EB8"/>
      <stop offset="100%" stop-color="#5A7492"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云海 -->
  <g fill="#F0F8FC" opacity="0.75">
    <ellipse cx="56" cy="134" rx="26" ry="9"/>
    <ellipse cx="150" cy="142" rx="30" ry="10"/>
    <ellipse cx="170" cy="66" rx="18" ry="6"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#A8C8DC" opacity="0.6"/>

  <!-- 风痕（穿云） -->
  <g stroke="#D8ECF4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 30 80 Q 44 72 56 76">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 144 68 Q 158 62 170 66" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年掠风隼（中，顺风疾飞） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（展，如云） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 82 108;4 82 108;-4 82 108" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 82 108 L 56 94 L 68 100 L 50 92 L 66 106 Z" fill="url(#feather)" stroke="#42586E" stroke-width="0.9"/>
      <path d="M 82 108 L 62 100 L 74 103" stroke="#A8C0D4" stroke-width="0.7" fill="none" opacity="0.7"/>
      <path d="M 68 100 L 60 95" stroke="#D8ECF4" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 122 106;4 122 106;-4 122 106" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 122 106 L 148 92 L 136 98 L 154 90 L 138 104 Z" fill="url(#feather)" stroke="#42586E" stroke-width="0.9"/>
      <path d="M 122 106 L 142 98 L 130 101" stroke="#A8C0D4" stroke-width="0.7" fill="none" opacity="0.7"/>
      <path d="M 136 98 L 144 93" stroke="#D8ECF4" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- 身（流线） -->
    <ellipse cx="102" cy="116" rx="14" ry="11" fill="url(#feather)" stroke="#42586E" stroke-width="0.9"/>
    <ellipse cx="101" cy="121" rx="8" ry="5" fill="#E0EAF2" opacity="0.7"/>
    <!-- 尾（带风） -->
    <path d="M 90 122 L 80 128 L 88 131 L 78 136 L 88 134 L 80 142 L 92 132 Z" fill="url(#feather)" stroke="#42586E" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="-4 90 122;4 90 122;-4 90 122" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 头 -->
    <ellipse cx="102" cy="104" rx="9" ry="8" fill="url(#feather)" stroke="#42586E" stroke-width="0.8"/>
    <path d="M 98 98 Q 102 92 106 98" fill="#5A7492" stroke="#42586E" stroke-width="0.4"/>
    <!-- 喙 -->
    <path d="M 109 102 L 116 101 L 109 105 Z" fill="#E8B868" stroke="#C89848" stroke-width="0.5"/>
    <!-- 眼（沉稳） -->
    <circle cx="104" cy="103" r="2.3" fill="#2E2A24"/>
    <circle cx="104.8" cy="101.8" r="0.9" fill="#FFF"/>
    <circle cx="110" cy="103" r="2.3" fill="#2E2A24"/>
    <circle cx="110.8" cy="101.8" r="0.9" fill="#FFF"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F4F8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
