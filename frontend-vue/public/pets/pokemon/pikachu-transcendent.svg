    <circle cx="156" cy="96" r="1.6"><animate attributeName="cy" values="96;80;96" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="140" r="1.4"><animate attributeName="cy" values="140;124;140" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(100,122) scale(1.24)">
