    <path d="M -10 -28 Q 0 -24 10 -28" stroke="#8E6E3E" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <ellipse cx="-16" cy="30" rx="9" ry="7" fill="url(#fur)" stroke="#C89A22" stroke-width="1"/>
    <ellipse cx="16" cy="30" rx="9" ry="7" fill="url(#fur)" stroke="#C89A22" stroke-width="1"/>
    <use href="#pk-head" transform="translate(0,-40) scale(1.06)"/>
  </g>
  <g stroke="#FDE68A" stroke-width="1.8" opacity="0.95" stroke-linecap="round" fill="none">
    <path d="M 58 58 L 66 68 M 142 58 L 134 68 M 100 42 L 100 54"><animate attributeName="opacity" values="0.95;0.3;0.95" dur="1s" repeatCount="indefinite"/></path>
