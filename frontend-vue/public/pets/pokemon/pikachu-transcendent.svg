    <path d="M 26 -24 Q 54 -36 66 -54 L 52 -38 L 64 -26 L 44 -38 Z" fill="url(#fur)" stroke="#C89A22" stroke-width="1.2" class="tail">
      <animateTransform attributeName="transform" type="rotate" values="0 44 -26;6 44 -26;0 44 -26" dur="1s" repeatCount="indefinite"/>
    </path>
