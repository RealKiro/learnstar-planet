<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="皮卡丘·六阶·电光传说">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241B3E"/><stop offset="100%" stop-color="#120E22"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDD05A"/><stop offset="100%" stop-color="#E8A832"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4D0"/><stop offset="100%" stop-color="#F6DD9A"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <g id="pk-head">
      <circle cx="0" cy="0" r="34" fill="url(#fur)" stroke="#C89A22" stroke-width="1.6"/>
      <path d="M -14 -25 L -40 -68 L -4 -38 Z" fill="url(#fur)" stroke="#C89A22" stroke-width="1.2"/>
      <path d="M -27 -56 L -36 -68 L -18 -54 Z" fill="#2B2B2B"/>
      <path d="M 14 -25 L 40 -68 L 4 -38 Z" fill="url(#fur)" stroke="#C89A22" stroke-width="1.2"/>
      <path d="M 27 -56 L 36 -68 L 18 -54 Z" fill="#2B2B2B"/>
      <circle cx="-13" cy="-1" r="8.2" fill="#2B2B2B"/>
      <circle cx="-11" cy="-3.5" r="3.1" fill="#FFF"/>
      <circle cx="13" cy="-1" r="8.2" fill="#2B2B2B"/>
      <circle cx="15" cy="-3.5" r="3.1" fill="#FFF"/>
