      <circle cx="20" cy="7" r="7.2" fill="#F87171" opacity="1"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="96" r="92" fill="url(#aura)">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FDE68A" stroke-width="3" opacity="0.95" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 28 40 L 46 56 L 36 62 L 56 76"><animate attributeName="opacity" values="0.95;0.4;0.95" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M 176 36 L 156 52 L 166 60 L 144 74"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M 100 24 L 108 40 L 100 46 L 112 60"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.3s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#FFF8C0">
