<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="晨曦鹿·五阶·晨曦守护·立森林最高处角光如晨破雾引路光照暗处">
  <defs>
    <!-- 背景：宝可梦森林晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8A0"/>
      <stop offset="52%" stop-color="#E0C080"/>
      <stop offset="100%" stop-color="#A8C878"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#F8F0D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 栗色毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#D0A070"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
    <!-- 角光 -->
    <radialGradient id="horn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.66;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 森林雾 -->
  <g fill="#F8F0DC" opacity="0.45">
    <ellipse cx="52" cy="138" rx="26" ry="9"/>
    <ellipse cx="150" cy="144" rx="30" ry="10"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#A8C878" opacity="0.9"/>

  <!-- 雾里的迷路者（左，被破雾引） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="124" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="56" cy="122.8" r="1" fill="#2E2A24"/>
    <circle cx="61" cy="122.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 暗处（右，被光照亮） -->
  <g fill="#8A9468" opacity="0.5">
    <path d="M 168 60 Q 176 54 182 62 Q 178 70 168 68 Z"/>
  </g>
  <circle cx="168" cy="72" r="2.5" fill="#FFF8D8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 晨曦守护（中，角光如晨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 角（如晨，大光） -->
    <path d="M 88 98 L 76 78 L 84 84 L 78 66 L 86 82 Z" fill="#D0A070" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 110 98 L 122 78 L 114 84 L 120 66 L 112 82 Z" fill="#D0A070" stroke="#8E6838" stroke-width="0.8"/>
    <circle cx="78" cy="70" r="6" fill="url(#horn)">
      <animate attributeName="opacity" values="1;0.72;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="70" r="6" fill="url(#horn)">
      <animate attributeName="opacity" values="1;0.72;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="99" cy="78" r="10" fill="#FFF8D8" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.25;0.45" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳 -->
    <path d="M 84 108 L 74 98 L 86 102 Z" fill="#D0A070" stroke="#8E6838" stroke-width="0.7"/>
    <path d="M 114 108 L 124 98 L 112 102 Z" fill="#D0A070" stroke="#8E6838" stroke-width="0.7"/>
    <!-- 身 -->
    <ellipse cx="99" cy="122" rx="17" ry="13" fill="url(#fur)" stroke="#8E6838" stroke-width="1"/>
    <ellipse cx="97" cy="129" rx="10" ry="6" fill="#F0E4D0" opacity="0.7"/>
    <!-- 头 -->
    <ellipse cx="99" cy="108" rx="11" ry="10" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <path d="M 103 112 Q 108 112 110 110 Q 108 116 103 116 Z" fill="#F0E4D0" stroke="#D0C0A8" stroke-width="0.6"/>
    <!-- 眼（含威含温） -->
    <circle cx="94" cy="107" r="2.6" fill="#2E2A24"/>
    <circle cx="94.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="104" cy="107" r="2.6" fill="#2E2A24"/>
    <circle cx="104.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 额饰（晨光） -->
    <circle cx="99" cy="100" r="2.5" fill="#FFF8D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 108 111 L 106 113.5 L 110 113.5 Z" fill="#8E6838"/>
    <!-- 嘴（定） -->
    <path d="M 107 116 Q 109 117.4 111 116" fill="none" stroke="#8E6838" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 86 132 L 81 142" stroke="#A87848" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 112 132 L 117 142" stroke="#A87848" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF8D8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
