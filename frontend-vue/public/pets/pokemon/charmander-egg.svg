<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·一阶·火苗幼蜥">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FC4E8"/><stop offset="100%" stop-color="#6FA8CC"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0803A"/><stop offset="100%" stop-color="#D86224"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F2CE96"/>
    </linearGradient>
    <g id="ch-head">
      <circle cx="0" cy="0" r="29" fill="url(#fur)" stroke="#B84E16" stroke-width="1.4"/>
      <ellipse cx="0" cy="9" rx="13" ry="8" fill="url(#belly)" opacity="0.85"/>
      <circle cx="-11" cy="-2" r="7.4" fill="#2B2B2B"/>
      <circle cx="-9.2" cy="-4.2" r="2.8" fill="#FFF"/>
      <circle cx="11" cy="-2" r="7.4" fill="#2B2B2B"/>
      <circle cx="12.8" cy="-4.2" r="2.8" fill="#FFF"/>
      <ellipse cx="0" cy="4" rx="1.6" ry="1.1" fill="#5A3A20"/>
      <path d="M -6 9 Q -3 12 0 9 Q 3 12 6 9" fill="none" stroke="#5A3A20" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <path d="M 0 158 Q 50 152 100 158 Q 150 164 200 158 L 200 200 L 0 200 Z" fill="#5E9E5E"/>
  <g stroke="#4E8E4E" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 30 150 Q 28 144 26 136 M 38 152 Q 38 146 38 138"/>
  </g>
  <g fill="#4E8E4E" opacity="0.7">
    <path d="M 120 156 Q 128 150 132 142 Q 122 148 120 156 Z"/>
  </g>
  <!-- 蝴蝶 -->
  <g transform="translate(142,70)">
    <animateTransform attributeName="transform" type="translate" values="142 70;148 66;142 70" dur="2.2s" repeatCount="indefinite"/>
    <path d="M -6 0 Q -10 -6 -6 -10 Q -2 -6 -6 0 Z" fill="#E8A0C0"/>
    <path d="M 6 0 Q 10 -6 6 -10 Q 2 -6 6 0 Z" fill="#E8A0C0"/>
    <line x1="0" y1="0" x2="0" y2="3" stroke="#5A3A20" stroke-width="1.2"/>
  </g>
  <g transform="translate(108,120) scale(0.8)">
    <animateTransform attributeName="transform" type="translate" values="108 120;108 117;108 120" dur="1.8s" repeatCount="indefinite"/>
    <!-- 尾焰（欢快跳动） -->
    <path d="M 30 -6 Q 52 -4 56 -20 Q 50 -34 38 -30 Q 32 -22 34 -12 Z" fill="#E86A2A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.15;1 1" dur="0.6s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 48 -18 Q 54 -26 44 -28 Q 38 -22 40 -16 Z" fill="#F8C858"/>
    <!-- 尾巴 -->
    <path d="M 18 -4 Q 26 -6 32 -8" stroke="#B84E16" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="2" rx="30" ry="26" fill="url(#fur)" stroke="#B84E16" stroke-width="1.3"/>
    <ellipse cx="0" cy="10" rx="18" ry="12" fill="url(#belly)" opacity="0.9"/>
    <path d="M 0 -22 L 2 -16 M 6 -22 L 7 -16 M -4 -22 L -3 -16" stroke="#B84E16" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="-11" cy="24" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <ellipse cx="11" cy="24" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <use href="#ch-head" transform="translate(0,-29) scale(0.95)"/>
  </g>
</svg>
