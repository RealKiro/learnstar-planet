<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·一阶·灵胎·火纹蛋">
  <defs>
    <!-- 背景：暖褐暗（大地色，低调柔和） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332B24"/>
      <stop offset="100%" stop-color="#1E1A15"/>
    </linearGradient>
    <!-- 孵化微光 -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
    <!-- 蛋壳 -->
    <radialGradient id="shell" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="60%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E0CBB0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 环境：地气 -->
  <ellipse cx="100" cy="182" rx="70" ry="7" fill="#26211B" opacity="0.7"/>

  <!-- 氛围：孵化微光 -->
  <circle cx="100" cy="146" r="44" fill="url(#halo)"/>

  <!-- 角色：火纹蛋（蜷缩待醒，下1/3） -->
  <ellipse cx="100" cy="150" rx="21" ry="25" fill="url(#shell)"/>
  <ellipse cx="100" cy="150" rx="21" ry="25" fill="none" stroke="#E0A86A" stroke-opacity="0.4" stroke-width="1"/>

  <!-- 火纹 -->
  <path d="M 84 136 Q 98 146 90 162" fill="none" stroke="#E8A44A" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 118 136 Q 102 146 112 162" fill="none" stroke="#E8A44A" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 92 126 Q 100 133 108 126" fill="none" stroke="#E8A44A" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>

  <!-- 裂缝 + 漏出的尾焰 -->
  <path d="M 100 126 L 94 138 L 100 148 L 95 158" fill="none" stroke="#D98A50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M 100 126 C 94 118 96 113 100 109 C 104 113 106 118 100 126 Z" fill="url(#flame)"/>
  <path d="M 100 122 C 97.5 117 98.6 114 100 112 C 101.4 114 102.5 117 100 122 Z" fill="#FFF3C4"/>

  <!-- 光点 -->
  <circle cx="76" cy="158" r="1.3" fill="#E8B84B" opacity="0.5"/>
  <circle cx="126" cy="154" r="1.1" fill="#E8B84B" opacity="0.4"/>
  <circle cx="114" cy="164" r="1" fill="#E8B84B" opacity="0.35"/>
</svg>
