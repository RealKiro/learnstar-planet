<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰霜翎狐·四阶·护夏初成·大旱展翎凉笼护住兽群挤凉影里缓过气">
  <defs>
    <!-- 背景：大旱旷野 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C878"/>
      <stop offset="52%" stop-color="#E0B058"/>
      <stop offset="100%" stop-color="#C89848"/>
    </linearGradient>
    <!-- 烈日 -->
    <radialGradient id="sun" cx="78%" cy="16%" r="34%">
      <stop offset="0%" stop-color="#FFF0C0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 凉意 -->
    <radialGradient id="glow" cx="44%" cy="44%" r="42%">
      <stop offset="0%" stop-color="#C8F0FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8F0FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0EAF2"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="156" cy="32" r="60" fill="url(#sun)">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="88" cy="88" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- 太阳 -->
  <circle cx="156" cy="32" r="10" fill="#FFF0C0" opacity="0.95"/>

  <!-- 旷野 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#C89848" opacity="0.9"/>
  <g fill="#B88838" opacity="0.6">
    <path d="M 20 148 Q 24 140 20 134 M 150 148 Q 154 140 150 134"/>
  </g>

  <!-- 凉影里的兽群（下） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#F0C898" stroke="#D8A878" stroke-width="0.5"/>
    <circle cx="90" cy="134.8" r="1" fill="#2E2A24"/>
    <circle cx="95" cy="134.8" r="1" fill="#2E2A24"/>
    <circle cx="104" cy="140" r="3.5" fill="#E8B888" stroke="#D09868" stroke-width="0.5"/>
    <circle cx="82" cy="141" r="3" fill="#F0D0A0" stroke="#D8B878" stroke-width="0.5"/>
  </g>

  <!-- 展翎凉笼的霜翎狐（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 凉意笼（弧形） -->
    <path d="M 60 112 Q 88 86 116 112 Q 122 128 114 136 Q 88 144 62 136 Q 56 128 60 112 Z" fill="#C8F0FC" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.16;0.28" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 大耳 -->
    <path d="M 78 100 L 68 84 L 84 94 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 104 100 L 114 84 L 98 94 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 78 94 L 72 87" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 104 94 L 110 87" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 蓬尾 -->
    <path d="M 74 118 Q 60 106 56 118 Q 54 130 66 134 Q 78 134 82 124 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-4 74 118;4 74 118;-4 74 118" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 身 -->
    <ellipse cx="90" cy="116" rx="16" ry="13" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.9"/>
    <!-- 霜翎（大展，如罩） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 76 108;3 76 108;-3 76 108" dur="2s" repeatCount="indefinite"/>
      <path d="M 78 108 L 58 90 L 70 96 L 52 82 L 72 98 L 62 78 L 78 100 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.8" opacity="0.95"/>
      <path d="M 78 108 L 94 92 L 88 98 L 102 84 L 94 98 L 100 80 L 92 98 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.7" opacity="0.8"/>
    </g>
    <circle cx="78" cy="100" r="7" fill="#C8F0FC" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.25;0.45" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 头 -->
    <ellipse cx="90" cy="102" rx="10" ry="9" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 94 106 Q 100 106 102 104 Q 100 110 94 110 Z" fill="#E8F0F8" stroke="#C8D8E8" stroke-width="0.6"/>
    <!-- 眼（含温含亮） -->
    <circle cx="86" cy="101" r="2.5" fill="#2E2A24"/>
    <circle cx="86.8" cy="99.8" r="1" fill="#FFF"/>
    <circle cx="95" cy="101" r="2.5" fill="#2E2A24"/>
    <circle cx="95.8" cy="99.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 100 105 L 98 107.5 L 102 107.5 Z" fill="#8AA0B8"/>
    <!-- 嘴（定） -->
    <path d="M 97 110 Q 99 111.4 101 110" fill="none" stroke="#8AA0B8" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 爪 -->
    <path d="M 78 124 L 74 129" stroke="#D8E8F0" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 102 124 L 106 129" stroke="#D8E8F0" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8F0FC">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
