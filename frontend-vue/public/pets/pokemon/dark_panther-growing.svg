<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="夜隐豹·三阶·练隐苦修·融影无声不惊落叶暗处护迷路小兽">
  <defs>
    <!-- 背景：月夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A3E"/>
      <stop offset="52%" stop-color="#2E3A4E"/>
      <stop offset="100%" stop-color="#3E4E5E"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moon" cx="76%" cy="20%" r="36%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乌黑毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#2E323C"/>
      <stop offset="100%" stop-color="#14161E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="152" cy="40" r="66" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.64;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="40" r="11" fill="#E8F0F8" opacity="0.95"/>

  <!-- 星 -->
  <g fill="#C8D8E8" opacity="0.5">
    <circle cx="36" cy="44" r="1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="30" r="0.9">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 夜林树影 -->
  <g fill="#0E141E" opacity="0.8">
    <path d="M 0 70 L 8 30 L 16 66 L 24 40 L 32 72 L 0 200 L 0 72 Z"/>
    <path d="M 178 60 L 188 22 L 196 56 L 200 46 L 200 200 L 178 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#2E3A4E" opacity="0.9"/>

  <!-- 迷路的迷路小兽（右，安行） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="150" cy="130" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="148" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="153" cy="128.8" r="1.1" fill="#2E2A24"/>
  </g>

  <!-- 少年夜隐豹（中，融影无声） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 影（融） -->
    <ellipse cx="92" cy="140" rx="24" ry="5" fill="#0E141E" opacity="0.75"/>
    <!-- 长尾（悄卷） -->
    <path d="M 72 120 Q 56 112 54 124 Q 54 134 66 138" stroke="#14161E" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- 大耳 -->
    <path d="M 82 110 L 74 96 L 88 105 Z" fill="#14161E" stroke="#060810" stroke-width="0.7"/>
    <path d="M 104 110 L 112 96 L 98 105 Z" fill="#14161E" stroke="#060810" stroke-width="0.7"/>
    <!-- 身（乌黑如影） -->
    <ellipse cx="92" cy="122" rx="16" ry="13" fill="url(#fur)" stroke="#060810" stroke-width="0.9"/>
    <!-- 头 -->
    <ellipse cx="92" cy="110" rx="10" ry="9" fill="url(#fur)" stroke="#060810" stroke-width="0.8"/>
    <!-- 眼（沉稳亮） -->
    <circle cx="87" cy="109" r="2.3" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="97" cy="109" r="2.3" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="87.5" cy="108.5" r="0.8" fill="#FFF8E0" opacity="0.9"/>
    <circle cx="97.5" cy="108.5" r="0.8" fill="#FFF8E0" opacity="0.9"/>
    <!-- 鼻 -->
    <path d="M 95 113 L 97 113 L 96 115 Z" fill="#2E3A4E"/>
    <!-- 爪（悄） -->
    <path d="M 78 130 L 73 137" stroke="#14161E" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 106 130 L 111 137" stroke="#14161E" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 悄悄赶危（暗护） -->
    <path d="M 106 118 L 122 114" stroke="#0E141E" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#C8D8E8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
