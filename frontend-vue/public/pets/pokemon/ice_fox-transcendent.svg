<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰霜翎狐·六阶·霜翎狐传说·暮光尾拨小霜翎传冰为护夏凉不伤">
  <defs>
    <!-- 背景：宝可梦雪原暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#A0A890"/>
      <stop offset="100%" stop-color="#A8D8F0"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E0E8"/>
    </radialGradient>
    <!-- 霜翎 -->
    <radialGradient id="frost" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8F0FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8F0FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#D8E8F0" opacity="0.9"/>

  <!-- 安住的晒蔫小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#F0C898" stroke="#D8A878" stroke-width="0.5"/>
    <circle cx="90" cy="134.8" r="1" fill="#2E2A24"/>
    <circle cx="95" cy="134.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 小霜翎狐（右，抖翎） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 138 118 L 132 106 L 142 112 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.6"/>
    <path d="M 154 118 L 160 106 L 150 112 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.6"/>
    <ellipse cx="146" cy="124" rx="10" ry="8.5" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.7"/>
    <path d="M 140 118 L 132 108 L 140 116 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.4" opacity="0.8"/>
    <ellipse cx="146" cy="118" rx="7" ry="6" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.6"/>
    <circle cx="143" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="143.8" cy="116.2" r="0.7" fill="#FFF"/>
    <circle cx="150" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="150.8" cy="116.2" r="0.7" fill="#FFF"/>
    <path d="M 154 121 L 152 123.5 L 156 123.5 Z" fill="#8AA0B8"/>
    <path d="M 136 130 L 133 134" stroke="#D8E8F0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 156 130 L 159 134" stroke="#D8E8F0" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 老霜翎狐（左，尾拨小霜翎） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳 -->
    <path d="M 66 104 L 56 88 L 72 98 Z" fill="url(#fur)" stroke="#A0B0C0" stroke-width="0.8"/>
    <path d="M 92 104 L 102 88 L 86 98 Z" fill="url(#fur)" stroke="#A0B0C0" stroke-width="0.8"/>
    <path d="M 66 98 L 60 90" stroke="#C8F0FC" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <path d="M 92 98 L 98 90" stroke="#C8F0FC" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <!-- 蓬尾（伸向小霜翎，拨） -->
    <path d="M 78 118 Q 96 106 108 112 Q 112 120 104 124 Q 92 126 82 122 Z" fill="url(#fur)" stroke="#A0B0C0" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-3 78 118;3 78 118;-3 78 118" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="96" cy="114" r="2" fill="#C8F0FC" opacity="0.7"/>
    <!-- 身（大） -->
    <ellipse cx="80" cy="120" rx="16" ry="12" fill="url(#fur)" stroke="#A0B0C0" stroke-width="0.9"/>
    <!-- 霜翎（泛岁月光） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 68 108;3 68 108;-3 68 108" dur="2.4s" repeatCount="indefinite"/>
      <path d="M 70 108 L 54 92 L 64 96 L 50 84 L 66 96 L 60 80 L 70 96 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.7" opacity="0.9"/>
    </g>
    <circle cx="68" cy="98" r="6" fill="url(#frost)">
      <animate attributeName="opacity" values="0.5;0.28;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 头 -->
    <ellipse cx="80" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#A0B0C0" stroke-width="0.8"/>
    <path d="M 85 112 Q 91 112 93 110 Q 91 116 85 116 Z" fill="#E0E8F0" stroke="#C0D0E0" stroke-width="0.6"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 75 107 Q 77 105.6 79 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 84 107 Q 86 105.6 87 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 鼻 -->
    <path d="M 90 111 L 88 113.5 L 92 113.5 Z" fill="#7A90A8"/>
    <!-- 嘴（慈） -->
    <path d="M 87 116 Q 85 117.4 83 116" fill="none" stroke="#7A90A8" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 尾拨传 -->
    <path d="M 92 112 Q 108 108 126 114" stroke="#C8F0FC" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="112" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
