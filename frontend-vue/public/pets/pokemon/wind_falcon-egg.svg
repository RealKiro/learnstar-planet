<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="掠风隼·一阶·翎羽初展·宝可梦天空崖扑翼生风俯冲引迷路小兽">
  <defs>
    <!-- 背景：宝可梦天空崖 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6A8AB0"/>
      <stop offset="52%" stop-color="#8AB0C8"/>
      <stop offset="100%" stop-color="#B0D0DC"/>
    </linearGradient>
    <!-- 天光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#E8F4F8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8F4F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰蓝羽 -->
    <radialGradient id="feather" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#7A96B0"/>
      <stop offset="100%" stop-color="#56708E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.55;0.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 崖 -->
  <path d="M 0 140 L 200 138 L 200 200 L 0 200 Z" fill="#78889A" opacity="0.8"/>

  <!-- 被引的迷路小兽（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="132" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="154" cy="130.8" r="1.1" fill="#2E2A24"/>
    <circle cx="159" cy="130.8" r="1.1" fill="#2E2A24"/>
  </g>

  <!-- 风（卷草叶） -->
  <g stroke="#D8ECF4" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 120 96 Q 132 90 140 94">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -1;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M 118 104 Q 124 98 130 102 Q 124 108 118 104 Z" fill="#E8A838" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0;2 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 小掠风隼（中，扑翼生风） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 翼（扑展） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 84 112;5 84 112;-5 84 112" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 84 112 L 62 100 L 72 106 L 56 98 L 70 110 Z" fill="url(#feather)" stroke="#42586E" stroke-width="0.8"/>
      <path d="M 84 112 L 66 104 L 76 107" stroke="#A8C0D4" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 112 110;5 112 110;-5 112 110" dur="1.8s" repeatCount="indefinite"/>
      <path d="M 112 110 L 134 98 L 124 104 L 140 96 L 126 108 Z" fill="url(#feather)" stroke="#42586E" stroke-width="0.8"/>
      <path d="M 112 110 L 130 102 L 120 105" stroke="#A8C0D4" stroke-width="0.6" fill="none" opacity="0.7"/>
    </g>
    <!-- 身 -->
    <ellipse cx="98" cy="118" rx="13" ry="11" fill="url(#feather)" stroke="#42586E" stroke-width="0.8"/>
    <!-- 腹白 -->
    <ellipse cx="97" cy="123" rx="8" ry="5" fill="#DCE8F0" opacity="0.7"/>
    <!-- 尾（带风） -->
    <path d="M 86 124 L 78 130 L 84 132 L 76 136 L 84 134 L 78 140 L 88 132 Z" fill="url(#feather)" stroke="#42586E" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="-4 86 124;4 86 124;-4 86 124" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 头 -->
    <ellipse cx="98" cy="106" rx="9" ry="8" fill="url(#feather)" stroke="#42586E" stroke-width="0.8"/>
    <!-- 头羽（翎） -->
    <path d="M 94 100 Q 98 94 102 100" fill="#56708E" stroke="#42586E" stroke-width="0.4"/>
    <!-- 喙（锐） -->
    <path d="M 105 104 L 112 103 L 105 107 Z" fill="#E8B868" stroke="#C89848" stroke-width="0.5"/>
    <!-- 眼（锐亮） -->
    <circle cx="100" cy="105" r="2.2" fill="#2E2A24"/>
    <circle cx="100.8" cy="103.8" r="0.9" fill="#FFF"/>
    <circle cx="106" cy="105" r="2.2" fill="#2E2A24"/>
    <circle cx="106.8" cy="103.8" r="0.9" fill="#FFF"/>
    <!-- 翼尖风痕 -->
    <path d="M 62 100 L 56 96" stroke="#D8ECF4" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M 134 98 L 140 94" stroke="#D8ECF4" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F4F8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
