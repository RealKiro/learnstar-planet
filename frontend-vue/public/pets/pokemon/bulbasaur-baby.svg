<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妙蛙种子·二阶·烈日之灾">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C890"/><stop offset="100%" stop-color="#B8986E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9A72"/><stop offset="100%" stop-color="#2E7A52"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0D8"/><stop offset="100%" stop-color="#9AD8B0"/>
    </linearGradient>
    <g id="bb-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
      <circle cx="-11" cy="-14" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="12" cy="-13" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="6" rx="1.8" ry="1.4" fill="#1E4E3A"/>
      <path d="M -6 12 Q 0 16 6 12" fill="none" stroke="#1E4E3A" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="40" r="26" fill="#F8E8A0" opacity="0.9"/>
  <g stroke="#F8E8A0" stroke-width="2.6" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="4" x2="100" y2="12"/>
    <line x1="66" y1="34" x2="74" y2="40"/>
    <line x1="134" y1="34" x2="126" y2="40"/>
  </g>
  <!-- 龟裂大地 -->
  <path d="M 0 168 L 200 168 L 200 200 L 0 200 Z" fill="#9A7A58"/>
  <g stroke="#6E5638" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 40 176 L 52 172 M 70 184 L 80 178 M 120 180 L 134 176 M 160 186 L 172 182"/>
  </g>
  <g stroke="#6E8E4E" stroke-width="1.6" opacity="0.8">
    <path d="M 56 168 L 58 158 M 62 170 L 64 160 M 140 170 L 142 160 M 146 172 L 148 162"/>
  </g>
  <g transform="translate(100,118) scale(0.85)">
    <animateTransform attributeName="transform" type="translate" values="100 118;100 116;100 118" dur="2.4s" repeatCount="indefinite"/>
    <path d="M -16 8 Q -26 10 -30 16" stroke="#2E6A4E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M -32 14 L -28 20 L -36 18 Z" fill="#4E9A72"/>
    <!-- 种子苞（蔫） -->
    <ellipse cx="13" cy="-12" rx="10" ry="10" fill="#3E7A5A" stroke="#2E6A4E" stroke-width="1.2"/>
    <path d="M 16 -20 Q 12 -24 17 -26" stroke="#5E9A6E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="4" rx="31" ry="27" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.3"/>
    <ellipse cx="0" cy="13" rx="18" ry="12" fill="url(#belly)" opacity="0.9"/>
    <circle cx="-8" cy="19" r="2.4" fill="#E85A5A" opacity="0.7"/>
    <circle cx="8" cy="20" r="2.4" fill="#E85A5A" opacity="0.7"/>
    <ellipse cx="-13" cy="27" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <ellipse cx="13" cy="27" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <use href="#bb-head" transform="translate(0,-30) scale(0.95)"/>
    <!-- 藤鞭无力（垂着） -->
    <path d="M 20 6 Q 30 10 34 20 Q 36 26 32 30" stroke="#3E8A62" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
