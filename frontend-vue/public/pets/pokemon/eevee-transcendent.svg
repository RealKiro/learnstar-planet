<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="伊布·六阶·伊布传说·暮光老伊布蓬尾碰小伊布传进化皆为陪">
  <defs>
    <!-- 背景：宝可梦草原暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#A0A880"/>
      <stop offset="100%" stop-color="#68B880"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 棕褐毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#C89858"/>
      <stop offset="100%" stop-color="#9A6E34"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 草地 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#68B880" opacity="0.9"/>

  <!-- 安住的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="90" cy="136" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="88" cy="134.8" r="1" fill="#24180E"/>
    <circle cx="93" cy="134.8" r="1" fill="#24180E"/>
  </g>

  <!-- 小伊布（右，毛绒扑叶） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 134 118 L 129 106 L 139 112 Z" fill="url(#fur)" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 152 118 L 157 106 L 147 112 Z" fill="url(#fur)" stroke="#8E6838" stroke-width="0.6"/>
    <ellipse cx="142" cy="124" rx="11" ry="9" fill="url(#fur)" stroke="#8E6838" stroke-width="0.7"/>
    <path d="M 146 128 Q 152 128 154 126 Q 152 132 146 132 Z" fill="#E8D8C8" stroke="#C8B098" stroke-width="0.5"/>
    <ellipse cx="142" cy="118" rx="7" ry="6" fill="url(#fur)" stroke="#8E6838" stroke-width="0.6"/>
    <circle cx="139" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="139.8" cy="116.2" r="0.7" fill="#FFF"/>
    <circle cx="146" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="146.8" cy="116.2" r="0.7" fill="#FFF"/>
    <path d="M 150 121 L 148 123.5 L 152 123.5 Z" fill="#8E6838"/>
    <path d="M 132 128 Q 128 130 126 134 Q 130 136 134 133 Z" fill="url(#fur)" stroke="#8E6838" stroke-width="0.5"/>
  </g>

  <!-- 老伊布（左，蓬尾碰小伊布） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳（古蓬） -->
    <path d="M 66 104 L 56 88 L 72 98 Z" fill="url(#fur)" stroke="#7A5828" stroke-width="0.8"/>
    <path d="M 92 104 L 102 88 L 86 98 Z" fill="url(#fur)" stroke="#7A5828" stroke-width="0.8"/>
    <path d="M 66 98 L 60 90" stroke="#D0B080" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <path d="M 92 98 L 98 90" stroke="#D0B080" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <!-- 蓬尾（伸向小伊布） -->
    <path d="M 78 118 Q 96 108 108 114 Q 112 122 104 126 Q 92 128 82 124 Z" fill="url(#fur)" stroke="#7A5828" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-3 78 118;3 78 118;-3 78 118" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 96 112 L 102 120" stroke="#D8C898" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- 身（大） -->
    <ellipse cx="80" cy="120" rx="16" ry="12" fill="url(#fur)" stroke="#7A5828" stroke-width="0.9"/>
    <ellipse cx="78" cy="126" rx="9" ry="5" fill="#E0D0BC" opacity="0.8"/>
    <!-- 头 -->
    <ellipse cx="80" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#7A5828" stroke-width="0.8"/>
    <path d="M 85 112 Q 91 112 93 110 Q 91 116 85 116 Z" fill="#E0D0BC" stroke="#C0B098" stroke-width="0.6"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 75 107 Q 77 105.6 79 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 84 107 Q 86 105.6 87 107" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 鼻 -->
    <path d="M 90 111 L 88 113.5 L 92 113.5 Z" fill="#7A5828"/>
    <!-- 嘴（慈） -->
    <path d="M 87 116 Q 85 117.4 83 116" fill="none" stroke="#7A5828" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 尾碰（传） -->
    <path d="M 96 118 Q 112 114 126 118" stroke="#FFF0D0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="116" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
