<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·五阶·喷火龙">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC4E8"/><stop offset="100%" stop-color="#4E8EC8"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28A3E"/><stop offset="100%" stop-color="#D86A28"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0C888"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EC4E0"/><stop offset="100%" stop-color="#4A8EB0"/>
    </linearGradient>
    <g id="ch-head">
      <circle cx="0" cy="0" r="32" fill="url(#fur)" stroke="#B84E16" stroke-width="1.5"/>
      <ellipse cx="0" cy="10" rx="14" ry="9" fill="url(#belly)" opacity="0.85"/>
      <circle cx="-12" cy="-2" r="8.2" fill="#2B2B2B"/>
      <circle cx="-10" cy="-4.4" r="3.1" fill="#FFF"/>
      <circle cx="12" cy="-2" r="8.2" fill="#2B2B2B"/>
      <circle cx="14" cy="-4.4" r="3.1" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="1.7" ry="1.2" fill="#5A3A20"/>
      <path d="M -8 10 L -4 6 L 0 10 L 4 6 L 8 10" fill="none" stroke="#5A3A20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -14 -20 L -20 -40 L -6 -28 Z" fill="#D8A828" stroke="#B84E16" stroke-width="0.8"/>
      <path d="M 14 -20 L 20 -40 L 6 -28 Z" fill="#D8A828" stroke="#B84E16" stroke-width="0.8"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="92" r="80" fill="#FFF8C0" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 168 L 200 168 L 200 200 L 0 200 Z" fill="#3E6A4E"/>
  <g transform="translate(100,124) scale(1.2)">
    <animateTransform attributeName="transform" type="translate" values="100 124;100 118;100 124" dur="1.6s" repeatCount="indefinite"/>
    <!-- 左翼 -->
    <path d="M -18 -14 Q -46 -44 -66 -34 Q -46 -14 -20 2 Z" fill="url(#wing)" stroke="#3A6E88" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" values="0 -24 -6;-4 -24 -6;0 -24 -6" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- 右翼 -->
    <path d="M 18 -14 Q 46 -44 66 -34 Q 46 -14 20 2 Z" fill="url(#wing)" stroke="#3A6E88" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" values="0 24 -6;4 24 -6;0 24 -6" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- 尾焰（冲天） -->
    <path d="M 28 -8 Q 54 -6 62 -26 Q 56 -48 40 -42 Q 30 -26 34 -14 Z" fill="#E86A2A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.2;1 1" dur="0.5s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 54 -24 Q 64 -36 50 -40 Q 40 -30 46 -20 Z" fill="#F8C858"/>
    <path d="M 16 -6 Q 24 -8 30 -10" stroke="#B84E16" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="2" rx="36" ry="31" fill="url(#fur)" stroke="#B84E16" stroke-width="1.5"/>
    <ellipse cx="0" cy="13" rx="22" ry="16" fill="url(#belly)" opacity="0.9"/>
    <path d="M 0 -26 L 3 -18 M 8 -26 L 9 -18 M -6 -26 L -4 -18" stroke="#B84E16" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-14" cy="29" rx="8" ry="6" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <ellipse cx="14" cy="29" rx="8" ry="6" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <use href="#ch-head" transform="translate(0,-35) scale(1.04)"/>
    <g stroke="#F8C858" stroke-width="2.8" opacity="0.95" stroke-linecap="round" fill="none">
      <path d="M 26 6 L 46 -4 L 40 -14 L 66 -24"><animate attributeName="opacity" values="0.95;0.45;0.95" dur="0.8s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
