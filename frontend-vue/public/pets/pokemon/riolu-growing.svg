<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="利欧路·三阶·练波苦修·山谷练波稳定如常波导荡开安抚伤心伙伴">
  <defs>
    <!-- 背景：宝可梦山谷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A7AA8"/>
      <stop offset="52%" stop-color="#6A8AB0"/>
      <stop offset="100%" stop-color="#7AA8C0"/>
    </linearGradient>
    <!-- 谷光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#B8D8F0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#B8D8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑蓝身形 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#5E6E8E"/>
      <stop offset="100%" stop-color="#3E4E6E"/>
    </radialGradient>
    <!-- 波导光 -->
    <radialGradient id="wave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68D8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#68D8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 山谷 -->
  <g fill="#4A6A88" opacity="0.5">
    <path d="M 0 120 Q 50 104 100 118 Q 160 130 200 112 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6A8AB0" opacity="0.9"/>

  <!-- 被安抚的伤心伙伴（右，安静） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="148" cy="126" r="4.5" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="146" cy="124.8" r="1.1" fill="#24180E"/>
    <circle cx="151" cy="124.8" r="1.1" fill="#24180E"/>
    <!-- 安静（闭眼） -->
    <path d="M 144 125 Q 146 123.6 148 125" stroke="#7A90A8" stroke-width="0.6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 波导安抚带 -->
  <path d="M 106 118 Q 122 122 138 124" stroke="#68D8F8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.24;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 少年利欧路（中，波导稳定） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 头冠（立） -->
    <path d="M 92 100 Q 96 90 100 100 M 90 102 Q 94 94 98 102" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.5"/>
    <!-- 尖耳（立） -->
    <path d="M 82 104 L 74 90 L 88 100 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.7"/>
    <path d="M 104 104 L 112 90 L 98 100 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.7"/>
    <path d="M 82 99 L 78 93" stroke="#68D8F8" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
    <path d="M 104 99 L 108 93" stroke="#68D8F8" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
    <!-- 细尾 -->
    <path d="M 76 122 Q 64 116 62 124 Q 62 132 70 134" stroke="#3E4E6E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 身 -->
    <ellipse cx="92" cy="120" rx="15" ry="12" fill="url(#body)" stroke="#2E3E58" stroke-width="0.9"/>
    <!-- 头 -->
    <ellipse cx="92" cy="106" rx="10" ry="9" fill="url(#body)" stroke="#2E3E58" stroke-width="0.8"/>
    <!-- 眼（沉稳，闭冥想） -->
    <path d="M 87 105 Q 89 103.6 91 105" stroke="#1E2A38" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 96 105 Q 98 103.6 99 105" stroke="#1E2A38" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（定） -->
    <path d="M 89 110 Q 92 111.6 95 110" fill="none" stroke="#8EA8C0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 胸前波导（稳定亮） -->
    <circle cx="92" cy="118" r="4" fill="url(#wave)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="118" r="7" fill="#68D8F8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.15;0.28" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 短爪（安抚伸出） -->
    <path d="M 104 118 L 112 114" stroke="#3E4E6E" stroke-width="2.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-4 104 118;4 104 118;-4 104 118" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#B8D8F0">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
