<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰霜翎狐·一阶·霜翎初生·宝可梦雪原抖翎落凉救晒蔫小兽">
  <defs>
    <!-- 背景：宝可梦雪原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8F0"/>
      <stop offset="52%" stop-color="#C8E8F8"/>
      <stop offset="100%" stop-color="#F0F8FC"/>
    </linearGradient>
    <!-- 雪光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E8F0"/>
    </radialGradient>
    <!-- 霜翎光 -->
    <radialGradient id="frost" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8F0FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8F0FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#F0F8FC" opacity="0.9"/>
  <path d="M 0 152 Q 50 148 110 151 Q 160 154 200 150" stroke="#D8E8F0" stroke-width="1.5" fill="none"/>

  <!-- 被晒蔫的小宝可梦（右，缓过气） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="132" r="4.5" fill="#F0C898" stroke="#D8A878" stroke-width="0.5"/>
    <circle cx="150" cy="130.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="130.8" r="1.1" fill="#2E2A24"/>
    <!-- 落下的凉 -->
    <circle cx="150" cy="124" r="1.5" fill="#C8F0FC" opacity="0.8">
      <animate attributeName="cy" values="124;128;124" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 小霜翎狐（中，抖翎落凉） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大耳 -->
    <path d="M 84 110 L 76 96 L 90 104 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 108 110 L 116 96 L 102 104 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 85 104 L 80 98" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 107 104 L 112 98" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 蓬尾（带霜） -->
    <path d="M 78 128 Q 66 118 62 128 Q 60 138 70 142 Q 80 142 84 134 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.7">
      <animateTransform attributeName="transform" type="rotate" values="-4 78 128;4 78 128;-4 78 128" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="68" cy="134" r="2" fill="#C8F0FC" opacity="0.7"/>
    <!-- 身（雪白） -->
    <ellipse cx="96" cy="126" rx="15" ry="13" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.9"/>
    <!-- 霜翎（背上晶亮） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 84 114;3 84 114;-3 84 114" dur="2s" repeatCount="indefinite"/>
      <path d="M 86 114 L 74 102 L 82 104 L 72 94 L 84 104 L 80 90 L 88 104 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.6" opacity="0.9"/>
    </g>
    <circle cx="84" cy="108" r="5" fill="url(#frost)">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 头 -->
    <ellipse cx="96" cy="112" rx="10" ry="9" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 100 116 Q 106 116 108 114 Q 106 120 100 120 Z" fill="#E8F0F8" stroke="#C8D8E8" stroke-width="0.6"/>
    <!-- 眼（圆亮） -->
    <circle cx="92" cy="111" r="2.6" fill="#2E2A24"/>
    <circle cx="92.8" cy="109.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="111" r="2.6" fill="#2E2A24"/>
    <circle cx="101.8" cy="109.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 106 115 L 104 117.5 L 108 117.5 Z" fill="#8AA0B8"/>
    <!-- 嘴（轻） -->
    <path d="M 103 120 Q 105 121.4 107 120" fill="none" stroke="#8AA0B8" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 爪（结冰花） -->
    <path d="M 84 134 L 80 139" stroke="#D8E8F0" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 108 134 L 112 139" stroke="#D8E8F0" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 爪印冰花 -->
    <circle cx="80" cy="141" r="1.2" fill="#C8F0FC" opacity="0.7"/>
    <circle cx="112" cy="141" r="1.2" fill="#C8F0FC" opacity="0.7"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8F0FC">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
