<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰霜翎狐·二阶·冻伤之痛·霜翎失控冻住伙伴慌忙收翎看晶爪">
  <defs>
    <!-- 背景：宝可梦雪原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AC0E0"/>
      <stop offset="52%" stop-color="#A8D8F0"/>
      <stop offset="100%" stop-color="#D8E8F0"/>
    </linearGradient>
    <!-- 冻光 -->
    <radialGradient id="glow" cx="70%" cy="36%" r="40%">
      <stop offset="0%" stop-color="#E8F8FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E8F8FC" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F0F8FC"/>
      <stop offset="100%" stop-color="#C0D8E8"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="72" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#D8E8F0" opacity="0.9"/>

  <!-- 被冻住的伙伴（右，发抖） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- 冰霜裹身 -->
    <circle cx="150" cy="126" r="5" fill="#D8F0FC" stroke="#8AC8E0" stroke-width="0.8" opacity="0.9"/>
    <circle cx="150" cy="126" r="4" fill="#F0C898" stroke="#D8A878" stroke-width="0.5"/>
    <circle cx="148" cy="124.8" r="1.1" fill="#2E2A24"/>
    <circle cx="153" cy="124.8" r="1.1" fill="#2E2A24"/>
    <!-- 发抖 -->
    <path d="M 145 131 L 143 134 M 155 131 L 157 134" stroke="#D8A878" stroke-width="1.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- 冰晶 -->
    <circle cx="146" cy="120" r="1.2" fill="#C8F0FC" opacity="0.8"/>
    <circle cx="155" cy="122" r="1" fill="#C8F0FC" opacity="0.7"/>
  </g>

  <!-- 慌收翎的小霜翎狐（左，愧疚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 大耳（垂） -->
    <path d="M 72 116 L 66 104 L 76 110 Z" fill="url(#fur)" stroke="#A0B8C8" stroke-width="0.7"/>
    <path d="M 94 116 L 100 104 L 90 110 Z" fill="url(#fur)" stroke="#A0B8C8" stroke-width="0.7"/>
    <!-- 蓬尾（垂） -->
    <path d="M 64 132 Q 54 132 54 140 Q 56 146 64 144 Z" fill="url(#fur)" stroke="#A0B8C8" stroke-width="0.6"/>
    <!-- 身 -->
    <ellipse cx="76" cy="132" rx="13" ry="11" fill="url(#fur)" stroke="#A0B8C8" stroke-width="0.8"/>
    <!-- 霜翎（乱，晶亮过） -->
    <path d="M 66 122 L 58 112 L 64 114 L 56 106 L 64 114 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.5" opacity="0.9"/>
    <circle cx="64" cy="116" r="4" fill="#C8F0FC" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 头（垂） -->
    <ellipse cx="76" cy="122" rx="9" ry="8" fill="url(#fur)" stroke="#A0B8C8" stroke-width="0.8" transform="rotate(-6 76 122)"/>
    <path d="M 80 126 Q 86 126 88 124 Q 86 130 80 130 Z" fill="#E0ECF4" stroke="#C0D0E0" stroke-width="0.5"/>
    <!-- 眼（含愧） -->
    <circle cx="72" cy="121" r="2.2" fill="#2E2A24"/>
    <circle cx="72.8" cy="119.8" r="0.9" fill="#FFF"/>
    <circle cx="81" cy="121" r="2.2" fill="#2E2A24"/>
    <circle cx="81.8" cy="119.8" r="0.9" fill="#FFF"/>
    <circle cx="73" cy="120.5" r="1" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 85 125 L 83 127.5 L 87 127.5 Z" fill="#7A90A8"/>
    <!-- 嘴（低垂） -->
    <path d="M 84 129 Q 81 127.6 78 129" fill="none" stroke="#7A90A8" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 晶爪（看） -->
    <path d="M 66 138 L 62 143" stroke="#D8E8F0" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 62 144 L 61 147 M 64 144 L 64 147" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#E8F8FC" opacity="0.4">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.14;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
