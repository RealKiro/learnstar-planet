<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·二阶·干涸之痛">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8C890"/><stop offset="100%" stop-color="#B8986E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9ED8"/><stop offset="100%" stop-color="#2E7EBC"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0CE96"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89A5E"/><stop offset="100%" stop-color="#9A6E3E"/>
    </linearGradient>
    <g id="sq-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.4"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="1.8" ry="1.3" fill="#1E4E7E"/>
      <path d="M -5 10 Q 0 14 6 11" fill="none" stroke="#1E4E7E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="40" r="26" fill="#F8E8A0" opacity="0.9"/>
  <g stroke="#F8E8A0" stroke-width="2.6" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="4" x2="100" y2="12"/><line x1="66" y1="34" x2="74" y2="40"/><line x1="134" y1="34" x2="126" y2="40"/>
  </g>
  <path d="M 0 168 L 200 168 L 200 200 L 0 200 Z" fill="#9A7A58"/>
  <g stroke="#6E5638" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M 40 176 L 52 172 M 70 184 L 80 178 M 120 180 L 134 176 M 160 186 L 172 182"/>
  </g>
  <g transform="translate(100,116) scale(0.85)">
    <animateTransform attributeName="transform" type="translate" values="100 116;100 114;100 116" dur="2.4s" repeatCount="indefinite"/>
    <path d="M -18 16 Q -28 24 -24 34 Q -20 42 -12 38 Q -10 30 -16 26 Z" fill="#3E7EAC" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="10" cy="-2" rx="25" ry="23" fill="url(#shell)" stroke="#6E4A24" stroke-width="1.6"/>
    <path d="M 6 -17 Q 17 -7 11 13 Q 1 21 -7 7 Q -5 -9 6 -17 Z" fill="#B87E4E" opacity="0.6"/>
    <ellipse cx="-4" cy="4" rx="29" ry="26" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.3"/>
    <ellipse cx="-4" cy="13" rx="17" ry="11" fill="url(#belly)" opacity="0.9"/>
    <ellipse cx="-15" cy="27" rx="6" ry="4" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="8" cy="27" rx="6" ry="4" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <use href="#sq-head" transform="translate(-4,-29) scale(0.94)"/>
    <!-- 水枪无力（一小注） -->
    <path d="M 10 16 Q 22 12 26 20 Q 28 26 24 30" stroke="#8EC8E8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
