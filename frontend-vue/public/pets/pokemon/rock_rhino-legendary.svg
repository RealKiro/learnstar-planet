<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="岩甲犀·五阶·山岭守护·卧山岭高处岩甲如墙起身挡石展甲护群">
  <defs>
    <!-- 背景：山岭最高处 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AB0A0"/>
      <stop offset="52%" stop-color="#B0C0A8"/>
      <stop offset="100%" stop-color="#78886C"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F0F4DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0F4DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#E8F0D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 岩皮 -->
    <radialGradient id="rock" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#B8A890"/>
      <stop offset="100%" stop-color="#90785E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 山岭 -->
  <g fill="#68805E" opacity="0.5">
    <path d="M 0 132 Q 60 116 120 128 Q 170 138 200 122 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#78886C" opacity="0.9"/>

  <!-- 被挡的落石（右） -->
  <g>
    <path d="M 158 60 L 176 54 L 172 72 Z" fill="#8E7A64" stroke="#6E5A46" stroke-width="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 护住的群落（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="130" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="70" cy="134" r="3.5" fill="#D0B888" stroke="#B09868" stroke-width="0.5"/>
    <circle cx="48" cy="135" r="3" fill="#C0A070" stroke="#A88858" stroke-width="0.5"/>
  </g>

  <!-- 山岭守护（中，岩甲如古墙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 岩墙（大展） -->
    <path d="M 72 148 Q 96 84 128 148 Z" fill="#A8987E" stroke="#6E5A46" stroke-width="1.1" opacity="0.55"/>
    <!-- 岩皮身（大，如古墙） -->
    <ellipse cx="100" cy="120" rx="19" ry="15" fill="url(#rock)" stroke="#5E4A36" stroke-width="1.1"/>
    <!-- 岩甲纹（古墙砖） -->
    <path d="M 83 112 Q 100 104 117 112" stroke="#C0B098" stroke-width="1.4" fill="none" opacity="0.8"/>
    <path d="M 85 130 Q 100 122 115 130" stroke="#C0B098" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 92 108 L 92 116 M 108 108 L 108 116" stroke="#C0B098" stroke-width="0.9" fill="none" opacity="0.6"/>
    <!-- 岩甲亮斑（如峰） -->
    <circle cx="88" cy="114" r="1.8" fill="#E0D8C0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="128" r="1.6" fill="#E0D8C0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 头 -->
    <ellipse cx="100" cy="106" rx="11" ry="10" fill="url(#rock)" stroke="#5E4A36" stroke-width="0.9"/>
    <!-- 岩角（如峰） -->
    <path d="M 104 100 L 108 84 L 112 100 Z" fill="#C0B098" stroke="#5E4A36" stroke-width="0.8"/>
    <!-- 眼（含威含温） -->
    <circle cx="95" cy="105" r="2.6" fill="#2E2A24"/>
    <circle cx="95.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="105" cy="105" r="2.6" fill="#2E2A24"/>
    <circle cx="105.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 额饰（岩纹） -->
    <circle cx="100" cy="98" r="2.5" fill="#E0D8C0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 108 109 L 112 109 L 110 111.5 Z" fill="#5E4A36"/>
    <!-- 嘴（定） -->
    <path d="M 109 114 Q 111 115.4 113 114" fill="none" stroke="#4E3A28" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 腿（如柱） -->
    <path d="M 84 132 L 78 144" stroke="#90785E" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 116 132 L 122 144" stroke="#90785E" stroke-width="4.2" stroke-linecap="round"/>
    <!-- 挡石震光 -->
    <circle cx="120" cy="102" r="3.5" fill="#E0D8C0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#F0F4DC">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
