<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妙蛙种子·四阶·藤鞭护生">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8B8"/><stop offset="100%" stop-color="#78B890"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9A72"/><stop offset="100%" stop-color="#2E7A52"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0D8"/><stop offset="100%" stop-color="#9AD8B0"/>
    </linearGradient>
    <g id="bb-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
      <circle cx="-11" cy="-14" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="12" cy="-13" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="6" rx="1.8" ry="1.4" fill="#1E4E3A"/>
      <path d="M -8 12 L -4 8 L 0 12 L 4 8 L 8 12" fill="none" stroke="#1E4E3A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="62" fill="#FFF8C0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.17;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 168 Q 50 160 100 168 Q 150 176 200 168 L 200 200 L 0 200 Z" fill="#4E8E6E"/>
  <!-- 枯花（被救回，渐绽） -->
  <g transform="translate(46,152)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#3E7A5A" stroke-width="2"/>
    <ellipse cx="0" cy="-4" rx="5" ry="4" fill="#F8A8C0"/>
    <ellipse cx="0" cy="-8" rx="3.4" ry="2.6" fill="#F8C8D8"/>
  </g>
  <g transform="translate(158,150)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#3E7A5A" stroke-width="2"/>
    <ellipse cx="0" cy="-4" rx="5" ry="4" fill="#F8A8C0"/>
    <ellipse cx="0" cy="-8" rx="3.4" ry="2.6" fill="#F8C8D8"/>
  </g>
  <g transform="translate(100,120) scale(1.0)">
    <animateTransform attributeName="transform" type="translate" values="100 120;100 117;100 120" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -18 8 Q -28 10 -32 16" stroke="#2E6A4E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M -34 14 L -30 20 L -38 18 Z" fill="#4E9A72"/>
    <!-- 种子苞（微绽） -->
    <ellipse cx="14" cy="-14" rx="13" ry="14" fill="#3E8A62" stroke="#2E6A4E" stroke-width="1.2"/>
    <ellipse cx="16" cy="-22" rx="6" ry="4" fill="#6EC89A"/>
    <ellipse cx="0" cy="4" rx="34" ry="30" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
    <ellipse cx="0" cy="13" rx="21" ry="15" fill="url(#belly)" opacity="0.9"/>
    <circle cx="-9" cy="20" r="2.8" fill="#E85A5A" opacity="0.7"/>
    <circle cx="9" cy="21" r="2.8" fill="#E85A5A" opacity="0.7"/>
    <ellipse cx="-14" cy="30" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <ellipse cx="14" cy="30" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <use href="#bb-head" transform="translate(0,-32) scale(1.0)"/>
    <!-- 藤鞭护花（伸向枯花渡养分） -->
    <path d="M 20 8 Q -20 14 -44 6 Q -56 2 -58 -6" stroke="#3E8A62" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="0 -20 10;6 -20 10;0 -20 10" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
