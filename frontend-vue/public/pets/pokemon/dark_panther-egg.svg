<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="夜隐豹·一阶·夜影初生·宝可梦夜林乌黑藏影月下看迷路小兽">
  <defs>
    <!-- 背景：宝可梦夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A3E"/>
      <stop offset="52%" stop-color="#2E3A4E"/>
      <stop offset="100%" stop-color="#3E4E5E"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moon" cx="76%" cy="20%" r="36%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乌黑毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#2A2E36"/>
      <stop offset="100%" stop-color="#12141C"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="152" cy="40" r="66" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.64;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="40" r="11" fill="#E8F0F8" opacity="0.95"/>

  <!-- 星 -->
  <g fill="#C8D8E8" opacity="0.5">
    <circle cx="36" cy="44" r="1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="30" r="0.9">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 夜林树影 -->
  <g fill="#0E141E" opacity="0.8">
    <path d="M 0 70 L 8 30 L 16 66 L 24 40 L 32 72 L 0 200 L 0 72 Z"/>
    <path d="M 178 60 L 188 22 L 196 56 L 200 46 L 200 200 L 178 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#2E3A4E" opacity="0.9"/>

  <!-- 月光下迷路的小兽（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="148" cy="130" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="146" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="151" cy="128.8" r="1.1" fill="#2E2A24"/>
  </g>

  <!-- 小夜隐豹（中，藏影） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 影（融黑） -->
    <ellipse cx="92" cy="140" rx="22" ry="5" fill="#0E141E" opacity="0.7"/>
    <!-- 长尾（卷） -->
    <path d="M 74 122 Q 60 116 58 126 Q 58 134 68 136" stroke="#12141C" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- 大耳 -->
    <path d="M 84 112 L 78 100 L 90 107 Z" fill="#12141C" stroke="#060810" stroke-width="0.6"/>
    <path d="M 104 112 L 110 100 L 98 107 Z" fill="#12141C" stroke="#060810" stroke-width="0.6"/>
    <!-- 身（乌黑） -->
    <ellipse cx="92" cy="124" rx="15" ry="12" fill="url(#fur)" stroke="#060810" stroke-width="0.9"/>
    <!-- 头 -->
    <ellipse cx="92" cy="112" rx="9" ry="8" fill="url(#fur)" stroke="#060810" stroke-width="0.8"/>
    <!-- 眼（亮两盏光） -->
    <circle cx="88" cy="111" r="2.2" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="97" cy="111" r="2.2" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88.5" cy="110.5" r="0.8" fill="#FFF8E0" opacity="0.9"/>
    <circle cx="97.5" cy="110.5" r="0.8" fill="#FFF8E0" opacity="0.9"/>
    <!-- 鼻 -->
    <path d="M 95 115 L 97 115 L 96 117 Z" fill="#2E3A4E"/>
    <!-- 爪（融影） -->
    <path d="M 80 132 L 76 138" stroke="#12141C" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 104 132 L 108 138" stroke="#12141C" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8D8E8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
