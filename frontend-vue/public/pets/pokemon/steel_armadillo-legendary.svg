<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="磁甲兽·五阶·铁原守护·甲收如盾立高展甲挡器磁光引救小兽">
  <defs>
    <!-- 背景：铁原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A9AA8"/>
      <stop offset="52%" stop-color="#9AA8B0"/>
      <stop offset="100%" stop-color="#788890"/>
    </linearGradient>
    <!-- 守护神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#E0E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0E8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#D8E8F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D8E8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 钢蓝甲 -->
    <radialGradient id="armor" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#8EAED4"/>
      <stop offset="100%" stop-color="#5A7AA2"/>
    </radialGradient>
    <!-- 磁光 -->
    <radialGradient id="mag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 铁原 -->
  <g fill="#6E7E88" opacity="0.5">
    <path d="M 0 138 Q 60 130 120 136 Q 170 140 200 132 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#788890" opacity="0.9"/>

  <!-- 被磁光引救的小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="126" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="56" cy="124.8" r="1" fill="#2E2A24"/>
    <circle cx="61" cy="124.8" r="1" fill="#2E2A24"/>
  </g>
  <!-- 磁光引 -->
  <path d="M 78 114 Q 68 118 62 122" stroke="#C8E8F8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.2;0.45" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 滚落的铁器（右，被甲挡） -->
  <g>
    <path d="M 158 64 L 176 58 L 172 76 Z" fill="#8A9AA8" stroke="#6E7E88" stroke-width="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 铁原守护（中，甲如铁壁） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 甲墙（大展） -->
    <path d="M 70 148 Q 96 80 126 148 Z" fill="#86A6CC" stroke="#3E5E86" stroke-width="1.2" opacity="0.5"/>
    <!-- 甲身（如铁壁） -->
    <ellipse cx="98" cy="120" rx="18" ry="14" fill="url(#armor)" stroke="#3E5E86" stroke-width="1.1"/>
    <!-- 甲纹（如铁壁砖） -->
    <path d="M 81 112 Q 98 104 115 112" stroke="#A0BCDC" stroke-width="1.4" fill="none" opacity="0.8"/>
    <path d="M 83 128 Q 98 120 113 128" stroke="#A0BCDC" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 90 108 L 90 116 M 106 108 L 106 116" stroke="#A0BCDC" stroke-width="0.9" fill="none" opacity="0.6"/>
    <!-- 甲亮斑 -->
    <circle cx="86" cy="114" r="1.8" fill="#E0E8F0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="126" r="1.6" fill="#E0E8F0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 短尾 -->
    <path d="M 80 124 Q 70 120 68 128" stroke="#5A7AA2" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="98" cy="106" rx="11" ry="10" fill="url(#armor)" stroke="#3E5E86" stroke-width="0.9"/>
    <path d="M 106 106 L 111 104 L 106 109 Z" fill="#3E5E86"/>
    <!-- 眼（含威含温） -->
    <circle cx="93" cy="105" r="2.5" fill="#2E2A24"/>
    <circle cx="93.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="103" cy="105" r="2.5" fill="#2E2A24"/>
    <circle cx="103.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 额饰（磁辉） -->
    <circle cx="98" cy="97" r="2.5" fill="#C8E8F8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（定） -->
    <path d="M 107 109 Q 109 110.4 111 109" fill="none" stroke="#3E5E86" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 磁光爪（挡器） -->
    <path d="M 108 114 L 130 104" stroke="#5A7AA2" stroke-width="3.4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 108 114;5 108 114;-5 108 114" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="132" cy="102" r="4" fill="url(#mag)">
      <animate attributeName="opacity" values="1;0.72;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="132" cy="102" r="7" fill="#C8E8F8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.16;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 短腿 -->
    <path d="M 84 132 L 78 142" stroke="#5A7AA2" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 112 132 L 118 142" stroke="#5A7AA2" stroke-width="3.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E0E8F0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
