<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·一阶·水泡幼龟·水边吐泡泡捉弄小鱼">
  <defs>
    <!-- 背景：水泽边 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8E8"/>
      <stop offset="52%" stop-color="#98C0D8"/>
      <stop offset="100%" stop-color="#7EAAC4"/>
    </linearGradient>
    <!-- 泽光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F4FAFE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4FAFE" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝色皮肤 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E9ED8"/>
      <stop offset="100%" stop-color="#5A8AC8"/>
    </linearGradient>
    <!-- 龟壳棕褐 -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0905E"/>
      <stop offset="100%" stop-color="#A87848"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远水泽芦苇 -->
  <g stroke="#5E8E7E" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 14 42 Q 12 96 8 160 M 26 54 Q 22 100 18 160"/>
  </g>
  <g fill="#C4A86E">
    <ellipse cx="12" cy="40" rx="4" ry="7" opacity="0.9"/>
    <ellipse cx="24" cy="52" rx="4" ry="7" opacity="0.9"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1 1;0 0" dur="3.4s" repeatCount="indefinite"/>
  </g>
  <!-- 远山 -->
  <path d="M 0 128 Q 50 118 110 126 Q 160 130 200 122 L 200 200 L 0 200 Z" fill="#6E9E9E" opacity="0.5"/>

  <!-- 水泽（前景） -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#5A8AC8" opacity="0.8"/>
  <path d="M 0 146 L 200 146" stroke="#8AB8E0" stroke-width="1.4" opacity="0.6"/>
  <path d="M 20 154 Q 44 152 70 154 M 120 160 Q 148 158 178 160" stroke="#C8E4F4" stroke-width="1" opacity="0.5" fill="none"/>

  <!-- 小鱼（被泡泡捉弄） -->
  <g>
    <ellipse cx="130" cy="126" rx="6" ry="3" fill="#A0B8C8"/>
    <path d="M 125 126 L 120 122 L 120 130 Z" fill="#A0B8C8"/>
    <circle cx="127" cy="125.4" r="0.8" fill="#24180E"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 -2;0 0" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- 泡泡（杰尼龟吐出，飘向小鱼） -->
  <g stroke="#C8E4F4" stroke-width="1" fill="none">
    <circle cx="104" cy="118" r="4">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 -10;0 0" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="98" cy="128" r="2.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -8;0 0" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="124" r="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -14;0 0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.25;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 杰尼龟（2头身，机灵，吐泡泡） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 62 140 L 58 148 L 64 149 L 70 142 Z" fill="url(#skin)" stroke="#4672AE" stroke-width="0.9"/>
    <!-- 尾巴（卷） -->
    <path d="M 78 142 Q 86 142 90 138 Q 88 134 82 136 Q 80 139 78 142 Z" fill="url(#skin)" stroke="#4672AE" stroke-width="0.8"/>
    <!-- 前腿 -->
    <path d="M 60 138 C 54 142 52 145 52 148" fill="none" stroke="url(#skin)" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="52" cy="149" r="2.4" fill="#5A8AC8"/>
    <path d="M 72 138 C 78 142 80 145 80 148" fill="none" stroke="url(#skin)" stroke-width="4.2" stroke-linecap="round"/>
    <circle cx="81" cy="149" r="2.4" fill="#5A8AC8"/>
  </g>

  <!-- 背壳（棕褐圆壳） -->
  <ellipse cx="62" cy="120" rx="17" ry="14" fill="url(#shell)" stroke="#8E6232" stroke-width="1"/>
  <!-- 壳纹 -->
  <path d="M 62 108 L 62 132 M 48 118 L 76 122 M 50 126 L 74 128" stroke="#8E6232" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 头（机灵，吐泡泡，眨眼） -->
  <g>
    <ellipse cx="58" cy="102" rx="13" ry="11.5" fill="url(#skin)" stroke="#4672AE" stroke-width="1"/>
    <!-- 口（吐泡，俏皮） -->
    <path d="M 52 106 Q 56 108.6 60 106" fill="none" stroke="#3A5E94" stroke-width="0.9" stroke-linecap="round"/>
    <!-- 眼（机灵，一只眨眼） -->
    <circle cx="51" cy="101" r="3.2" fill="#4A3820"/>
    <circle cx="51.7" cy="100.3" r="1" fill="#FFF"/>
    <path d="M 64 100 Q 66 98 68 100" stroke="#4A3820" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- 腮帮圆 -->
    <circle cx="47" cy="105" r="2" fill="#4672AE" opacity="0.5"/>
    <!-- 头顶浅斑 -->
    <circle cx="58" cy="94" r="2.6" fill="#8AB8E0" opacity="0.6"/>
  </g>

  <!-- 泽光星尘 -->
  <g fill="#F4FAFE">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
