<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·一阶·水泡幼龟">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E8"/><stop offset="100%" stop-color="#4EA8CC"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9ED8"/><stop offset="100%" stop-color="#2E7EBC"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0CE96"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89A5E"/><stop offset="100%" stop-color="#9A6E3E"/>
    </linearGradient>
    <g id="sq-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.4"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="1.8" ry="1.3" fill="#1E4E7E"/>
      <path d="M -5 10 Q 0 14 6 11" fill="none" stroke="#1E4E7E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <path d="M 0 170 Q 50 162 100 170 Q 150 178 200 170 L 200 200 L 0 200 Z" fill="#5EA8CC"/>
  <g fill="#B8E8F8" opacity="0.5">
    <circle cx="40" cy="160" r="2.6"/>
    <circle cx="64" cy="164" r="2"/>
    <circle cx="156" cy="162" r="2.4"/>
    <circle cx="178" cy="158" r="1.8"/>
  </g>
  <g transform="translate(100,116) scale(0.88)">
    <animateTransform attributeName="transform" type="translate" values="100 116;100 113;100 116" dur="2.2s" repeatCount="indefinite"/>
    <!-- 卷尾（毛茸） -->
    <path d="M -20 16 Q -30 24 -26 34 Q -22 42 -14 38 Q -12 30 -18 26 Z" fill="#3E7EAC" stroke="#1E5E8E" stroke-width="1"/>
    <!-- 背壳（圆，藏身后） -->
    <ellipse cx="10" cy="-2" rx="26" ry="24" fill="url(#shell)" stroke="#6E4A24" stroke-width="1.6"/>
    <path d="M 6 -18 Q 18 -8 12 14 Q 2 22 -8 8 Q -6 -10 6 -18 Z" fill="#B87E4E" opacity="0.6"/>
    <!-- 身体 -->
    <ellipse cx="-4" cy="4" rx="30" ry="27" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.3"/>
    <ellipse cx="-4" cy="13" rx="18" ry="12" fill="url(#belly)" opacity="0.9"/>
    <ellipse cx="-16" cy="28" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="8" cy="28" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <use href="#sq-head" transform="translate(-4,-30) scale(0.95)"/>
    <!-- 吐泡泡 -->
    <g fill="#E8F8FF" opacity="0.85">
      <circle cx="8" cy="16" r="2.4"><animate attributeName="cy" values="16;4;16" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0.2;0.85" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="14" cy="22" r="1.8"><animate attributeName="cy" values="22;10;22" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
