<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妙蛙种子·五阶·妙蛙花">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CD8B4"/><stop offset="100%" stop-color="#6EB892"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9A72"/><stop offset="100%" stop-color="#2E7A52"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0D8"/><stop offset="100%" stop-color="#9AD8B0"/>
    </linearGradient>
    <g id="bb-head">
      <circle cx="0" cy="0" r="30" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
      <circle cx="-11" cy="-14" r="2.6" fill="#E85A5A" opacity="0.8"/>
      <circle cx="12" cy="-13" r="2.6" fill="#E85A5A" opacity="0.8"/>
      <circle cx="-11" cy="-1" r="8.4" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.6" r="3.1" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8.4" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.6" r="3.1" fill="#FFF"/>
      <ellipse cx="0" cy="6" rx="1.9" ry="1.5" fill="#1E4E3A"/>
      <path d="M -8 12 L -4 8 L 0 12 L 4 8 L 8 12" fill="none" stroke="#1E4E3A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="62" r="66" fill="#FFF8C0" opacity="0.28">
    <animate attributeName="opacity" values="0.28;0.16;0.28" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 168 Q 50 158 100 168 Q 150 178 200 168 L 200 200 L 0 200 Z" fill="#4E8E6E"/>
  <g fill="#6EB892" opacity="0.8">
    <path d="M 30 168 Q 34 158 42 156 Q 38 166 30 168 Z"/>
    <path d="M 168 170 Q 172 158 180 156 Q 176 168 168 170 Z"/>
  </g>
  <g transform="translate(100,124) scale(1.14)">
    <animateTransform attributeName="transform" type="translate" values="100 124;100 119;100 124" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -19 8 Q -30 10 -34 16" stroke="#2E6A4E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M -36 14 L -32 20 L -40 18 Z" fill="#4E9A72"/>
    <ellipse cx="0" cy="4" rx="37" ry="32" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
    <ellipse cx="0" cy="14" rx="23" ry="17" fill="url(#belly)" opacity="0.9"/>
    <circle cx="-10" cy="22" r="3" fill="#E85A5A" opacity="0.7"/>
    <circle cx="10" cy="23" r="3" fill="#E85A5A" opacity="0.7"/>
    <ellipse cx="-15" cy="32" rx="7" ry="5" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <ellipse cx="15" cy="32" rx="7" ry="5" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <!-- 背上的大花（妙蛙花） -->
    <g transform="translate(14,-30)">
      <path d="M -6 6 L -16 -10 L -6 -6 L 0 -18 L 6 -6 L 16 -10 L 6 6 Z" fill="#F8A8C0" stroke="#D87898" stroke-width="1"/>
      <ellipse cx="0" cy="2" rx="7" ry="5" fill="#F8D8E0"/>
      <ellipse cx="0" cy="-16" rx="8" ry="4" fill="#6E9A6E"/>
      <path d="M -8 -18 Q 0 -24 8 -18" fill="#5E8E5E"/>
    </g>
    <use href="#bb-head" transform="translate(0,-36) scale(1.05)"/>
    <!-- 藤蔓如臂 -->
    <path d="M 20 10 Q 34 4 40 -4" stroke="#3E8A62" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M -20 12 Q -32 8 -36 0" stroke="#3E8A62" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
