<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="夜隐豹·六阶·夜隐豹传说·暮光影中现出尾碰小豹传最深黑是最稳藏">
  <defs>
    <!-- 背景：夜林暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#5E6A6E"/>
      <stop offset="100%" stop-color="#2E3A4E"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乌黑毛 -->
    <radialGradient id="fur" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#2E323C"/>
      <stop offset="100%" stop-color="#10121A"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 地面 -->
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#2E3A4E" opacity="0.9"/>

  <!-- 安睡的小兽（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="90" cy="134.8" r="1" fill="#2E2A24"/>
    <circle cx="95" cy="134.8" r="1" fill="#2E2A24"/>
    <path d="M 88 135 Q 90 133.6 92 135" stroke="#7A90A8" stroke-width="0.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小夜隐豹（右，融影） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="144" cy="122" rx="10" ry="8.5" fill="url(#fur)" stroke="#060810" stroke-width="0.7"/>
    <path d="M 136 118 L 131 108 L 139 113 Z" fill="#10121A" stroke="#060810" stroke-width="0.5"/>
    <path d="M 152 118 L 157 108 L 149 113 Z" fill="#10121A" stroke="#060810" stroke-width="0.5"/>
    <ellipse cx="144" cy="114" rx="7" ry="6" fill="url(#fur)" stroke="#060810" stroke-width="0.6"/>
    <circle cx="140" cy="113" r="1.8" fill="#F8E4A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="113" r="1.8" fill="#F8E4A0" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 147 117 L 149 117 L 148 119 Z" fill="#2E3A4E"/>
    <path d="M 135 127 L 132 132" stroke="#10121A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 153 127 L 156 132" stroke="#10121A" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 老夜隐豹（左，尾碰小豹） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.14">
      <animate attributeName="opacity" values="0.14;0.08;0.14" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 长尾（伸向小豹，碰） -->
    <path d="M 76 118 Q 96 108 110 114" stroke="#10121A" stroke-width="2.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-3 76 118;3 76 118;-3 76 118" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 大耳 -->
    <path d="M 66 104 L 58 90 L 72 99 Z" fill="#10121A" stroke="#060810" stroke-width="0.7"/>
    <path d="M 88 104 L 96 90 L 82 99 Z" fill="#10121A" stroke="#060810" stroke-width="0.7"/>
    <!-- 身（大，泛岁月光） -->
    <ellipse cx="80" cy="122" rx="17" ry="13" fill="url(#fur)" stroke="#060810" stroke-width="1"/>
    <!-- 头 -->
    <ellipse cx="80" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#060810" stroke-width="0.9"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 74 107 Q 76 105.6 78 107" stroke="#F8E4A0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 84 107 Q 86 105.6 87 107" stroke="#F8E4A0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="75" cy="106.5" r="0.7" fill="#FFF8E0" opacity="0.8"/>
    <circle cx="85" cy="106.5" r="0.7" fill="#FFF8E0" opacity="0.8"/>
    <!-- 鼻 -->
    <path d="M 83 111 L 85 111 L 84 113 Z" fill="#2E3A4E"/>
    <!-- 爪 -->
    <path d="M 66 130 L 61 139" stroke="#10121A" stroke-width="3" stroke-linecap="round"/>
    <path d="M 94 130 L 99 139" stroke="#10121A" stroke-width="3" stroke-linecap="round"/>
    <!-- 尾碰传 -->
    <path d="M 90 112 Q 106 108 124 112" stroke="#C8D8E8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="122" cy="112" r="10" fill="#FFF0D0" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.12;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
