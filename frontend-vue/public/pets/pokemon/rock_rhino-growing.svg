<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="岩甲犀·三阶·炼甲苦修·对岩练撞岩甲磨亮撞壁不裂撞碎落石">
  <defs>
    <!-- 背景：岩壁前 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AB0A0"/>
      <stop offset="52%" stop-color="#B0C0A8"/>
      <stop offset="100%" stop-color="#889888"/>
    </linearGradient>
    <!-- 岭光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#E8F0D8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8F0D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 岩皮（磨亮） -->
    <radialGradient id="rock" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#B0A088"/>
      <stop offset="100%" stop-color="#88705A"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 岩壁（右） -->
  <g fill="#8898A0" opacity="0.8">
    <path d="M 140 40 L 200 36 L 200 200 L 140 200 Z"/>
  </g>
  <g stroke="#6E7E88" stroke-width="1" opacity="0.6">
    <path d="M 150 70 L 150 90 M 160 110 L 160 130 M 150 150 L 150 170"/>
  </g>

  <!-- 被撞碎的落石（右） -->
  <g>
    <path d="M 128 100 L 136 94 L 132 106 Z" fill="#8E7A64" stroke="#6E5A46" stroke-width="0.6" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;2 4;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="124" cy="112" r="2.5" fill="#8E7A64" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#889888" opacity="0.9"/>

  <!-- 少年岩甲犀（中，甲如铁） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 岩皮身（如铁，磨亮） -->
    <ellipse cx="92" cy="122" rx="17" ry="13" fill="url(#rock)" stroke="#5E4A36" stroke-width="1"/>
    <!-- 岩甲纹（铁亮） -->
    <path d="M 77 114 Q 92 108 107 114" stroke="#B0A088" stroke-width="1.3" fill="none" opacity="0.8"/>
    <path d="M 79 128 Q 92 122 105 128" stroke="#B0A088" stroke-width="1.1" fill="none" opacity="0.7"/>
    <!-- 岩甲亮斑 -->
    <circle cx="86" cy="116" r="1.5" fill="#D8D0B8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="128" r="1.3" fill="#D8D0B8" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 头 -->
    <ellipse cx="92" cy="108" rx="10" ry="9" fill="url(#rock)" stroke="#5E4A36" stroke-width="0.8"/>
    <!-- 岩角（利） -->
    <path d="M 96 102 L 100 90 L 104 102 Z" fill="#B0A088" stroke="#5E4A36" stroke-width="0.7"/>
    <!-- 眼（沉稳） -->
    <circle cx="88" cy="107" r="2.3" fill="#2E2A24"/>
    <circle cx="88.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="97" cy="107" r="2.3" fill="#2E2A24"/>
    <circle cx="97.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 100 111 L 104 111 L 102 113.5 Z" fill="#5E4A36"/>
    <!-- 嘴（定） -->
    <path d="M 101 115 Q 103 116.4 105 115" fill="none" stroke="#4E3A28" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 腿（如柱） -->
    <path d="M 80 130 L 75 139" stroke="#88705A" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 104 130 L 109 139" stroke="#88705A" stroke-width="3.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#E8F0D8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
