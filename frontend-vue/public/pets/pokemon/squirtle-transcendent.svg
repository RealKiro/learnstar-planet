<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·六阶·泽水传说">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E5E9E"/><stop offset="100%" stop-color="#14304E"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9ED8"/><stop offset="100%" stop-color="#2E7EBC"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0CE96"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89A5E"/><stop offset="100%" stop-color="#9A6E3E"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7EC8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7EC8FF" stop-opacity="0"/>
    </radialGradient>
    <g id="sq-head">
      <circle cx="0" cy="0" r="32" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.5"/>
      <circle cx="-12" cy="-1" r="9" fill="#2B2B2B"/>
      <circle cx="-10" cy="-3.8" r="3.4" fill="#FFF"/>
      <circle cx="12" cy="-1" r="9" fill="#2B2B2B"/>
      <circle cx="14" cy="-3.8" r="3.4" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="2" ry="1.5" fill="#1E4E7E"/>
      <path d="M -7 10 L -3 7 L 0 10 L 3 7 L 7 10" fill="none" stroke="#1E4E7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="92" fill="url(#aura)">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#B8E8F8" stroke-width="2.6" opacity="0.8" stroke-linecap="round" fill="none">
    <path d="M 30 40 L 44 56 L 36 62 L 54 76"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M 172 42 L 156 58 L 166 66 L 146 80"><animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.7s" repeatCount="indefinite"/></path>
  </g>
  <path d="M 0 172 Q 50 162 100 172 Q 150 182 200 172 L 200 200 L 0 200 Z" fill="#2E5E8E"/>
  <g transform="translate(100,128) scale(1.3)">
    <animateTransform attributeName="transform" type="translate" values="100 128;100 120;100 128" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -23 16 Q -33 24 -29 34 Q -25 42 -17 38 Q -15 30 -21 26 Z" fill="#3E7EAC" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="10" cy="-4" rx="32" ry="30" fill="url(#shell)" stroke="#6E4A24" stroke-width="1.6"/>
    <path d="M 6 -24 Q 20 -11 15 14 Q 4 26 -10 10 Q -8 -12 6 -24 Z" fill="#B87E4E" opacity="0.6"/>
    <path d="M 0 -15 L -9 -32 L 5 -32 L 9 -15 Z" fill="#7E6A4E" stroke="#5E4A2E" stroke-width="1"/>
    <path d="M -13 -32 L -9 -39 L 3 -39 L 5 -32 Z" fill="#A88A5E" stroke="#5E4A2E" stroke-width="1"/>
    <path d="M 22 -15 L 16 -32 L 28 -32 L 26 -15 Z" fill="#7E6A4E" stroke="#5E4A2E" stroke-width="1"/>
    <path d="M 11 -32 L 15 -39 L 27 -39 L 28 -32 Z" fill="#A88A5E" stroke="#5E4A2E" stroke-width="1"/>
    <ellipse cx="-4" cy="4" rx="38" ry="33" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.5"/>
    <ellipse cx="-4" cy="15" rx="23" ry="16" fill="url(#belly)" opacity="0.9"/>
    <ellipse cx="-18" cy="34" rx="8" ry="6" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="11" cy="34" rx="8" ry="6" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <use href="#sq-head" transform="translate(-4,-38) scale(1.08)"/>
    <path d="M -8 -35 Q -22 -46 -32 -42" stroke="#8EC8E8" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 -14 -36;-4 -14 -36;0 -14 -36" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 24 -35 Q 38 -46 48 -42" stroke="#8EC8E8" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 30 -36;4 30 -36;0 30 -36" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#B8E8F8">
    <circle cx="52" cy="104" r="1.8"><animate attributeName="cy" values="104;90;104" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="96" r="1.5"><animate attributeName="cy" values="96;82;96" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
