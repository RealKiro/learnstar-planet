<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·六阶·泽水传说·双炮如瀑续泽新生水箭龟伏旁">
  <defs>
    <!-- 背景：泽畔暮光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C898"/>
      <stop offset="52%" stop-color="#D0B078"/>
      <stop offset="100%" stop-color="#A8C0B0"/>
    </linearGradient>
    <!-- 暮泽光 -->
    <radialGradient id="glow" cx="46%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8DC" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#A8D8F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A8D8F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝色皮肤 -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EB0E8"/>
      <stop offset="100%" stop-color="#5E94D0"/>
    </linearGradient>
    <!-- 龟壳 -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0A068"/>
      <stop offset="100%" stop-color="#AC7C48"/>
    </linearGradient>
    <!-- 水炮管 -->
    <linearGradient id="cannon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA6BE"/>
      <stop offset="100%" stop-color="#6E869E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="92" cy="48" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- 传说余晖 -->
  <circle cx="100" cy="100" r="64" fill="url(#halo)">
    <animate attributeName="opacity" values="0.45;0.28;0.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 远水草 -->
  <g stroke="#5E8E7E" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <path d="M 16 44 Q 14 96 8 156 M 30 56 Q 26 100 20 156 M 174 46 Q 178 98 184 156"/>
  </g>
  <g fill="#C4A86E">
    <ellipse cx="14" cy="42" rx="4" ry="7" opacity="0.95"/>
    <ellipse cx="28" cy="54" rx="4" ry="7" opacity="0.95"/>
    <ellipse cx="176" cy="44" rx="4" ry="7" opacity="0.95"/>
  </g>

  <!-- 泽水（前景） -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#5E8EC8" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#9EC8EC" stroke-width="1.4" opacity="0.6"/>
  <!-- 波光 -->
  <path d="M 30 156 Q 54 154 80 156 M 120 162 Q 148 160 178 162 M 16 166 Q 40 164 66 166" stroke="#D8F0FC" stroke-width="1" opacity="0.5" fill="none"/>
  <!-- 水草（泽中） -->
  <g stroke="#5E9E6E" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
    <path d="M 30 156 Q 26 146 28 138 M 36 158 Q 36 148 36 140">
      <animateTransform attributeName="transform" type="rotate" values="0 32 156;6 32 156;0 32 156" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M 168 158 Q 172 148 170 140 M 162 160 Q 160 150 161 142">
      <animateTransform attributeName="transform" type="rotate" values="0 166 158;-6 166 158;0 166 158" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 新生水箭龟（左下，伏旁，安然） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <ellipse cx="52" cy="142" rx="10" ry="6" fill="#7EB0E8" stroke="#4A7AB6" stroke-width="0.8"/>
    <ellipse cx="52" cy="136" rx="7.5" ry="5" fill="#C0905E" stroke="#8E6232" stroke-width="0.8"/>
    <circle cx="45" cy="138" r="3.8" fill="#7EB0E8" stroke="#4A7AB6" stroke-width="0.7"/>
    <path d="M 43 137 Q 41 135 41 133" stroke="#5A8AC8" stroke-width="1" stroke-linecap="round"/>
    <circle cx="43" cy="137" r="1" fill="#4A3820"/>
    <circle cx="47" cy="137" r="1" fill="#4A3820"/>
    <path d="M 43 139 Q 45 140.4 47 139" fill="none" stroke="#4A7AB6" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 新生的炮（小） -->
    <path d="M 54 134 Q 58 132 62 132 Q 66 132 68 134 L 68 138 Q 66 140 62 140 Q 58 140 54 138 Z" fill="url(#cannon)" stroke="#4E6278" stroke-width="0.5"/>
  </g>

  <!-- 老水箭龟（沉水，只留壳与头在波光中，双炮如瀑续泽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 身体（沉入水下，仅上部露出） -->
    <ellipse cx="110" cy="138" rx="24" ry="12" fill="url(#skin)" stroke="#4A78B4" stroke-width="1"/>
    <!-- 背壳（露出水面） -->
    <ellipse cx="110" cy="128" rx="19" ry="13" fill="url(#shell)" stroke="#8E6232" stroke-width="1"/>
    <path d="M 110 117 L 110 139 M 94 126 L 126 130 M 96 134 L 124 136" stroke="#8E6232" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- 双炮（如瀑） -->
    <path d="M 94 122 Q 86 118 80 118 Q 74 118 72 122 L 72 130 Q 74 134 80 134 Q 86 134 94 130 Z" fill="url(#cannon)" stroke="#4E6278" stroke-width="0.7"/>
    <path d="M 126 122 Q 134 118 140 118 Q 146 118 148 122 L 148 130 Q 146 134 140 134 Q 134 134 126 130 Z" fill="url(#cannon)" stroke="#4E6278" stroke-width="0.7"/>
    <!-- 双炮如瀑（水持续倾入泽） -->
    <g stroke="#C8E8F8" stroke-width="2.4" opacity="0.8" stroke-linecap="round" fill="none">
      <path d="M 76 136 Q 74 142 76 148">
        <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M 144 136 Q 146 142 144 148">
        <animate attributeName="opacity" values="0.8;0.45;0.8" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 瀑花 -->
    <g fill="#D8EFFC">
      <circle cx="76" cy="150" r="1.8">
        <animateTransform attributeName="transform" type="translate" values="0 0;-2 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="144" cy="150" r="1.8">
        <animateTransform attributeName="transform" type="translate" values="0 0;2 -4;0 0" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- 头（沉水，露头，沉稳含笑，像在点头） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="110" cy="100" rx="14" ry="12" fill="url(#skin)" stroke="#4A78B4" stroke-width="1"/>
    <!-- 口（沉稳含笑） -->
    <path d="M 104 104 Q 110 106.6 116 104" fill="none" stroke="#4A76AE" stroke-width="1" stroke-linecap="round"/>
    <!-- 眼（温和） -->
    <path d="M 101 100 Q 103 98 105 100 M 115 100 Q 117 98 119 100" stroke="#4A3820" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="103" cy="100.6" r="2.8" fill="#4A3820"/>
    <circle cx="103.6" cy="100" r="0.9" fill="#FFF"/>
    <circle cx="117" cy="100.6" r="2.8" fill="#4A3820"/>
    <circle cx="117.6" cy="100" r="0.9" fill="#FFF"/>
    <!-- 腮帮 -->
    <circle cx="98" cy="103" r="2.2" fill="#4A78B4" opacity="0.5"/>
    <circle cx="122" cy="103" r="2.2" fill="#4A78B4" opacity="0.5"/>
    <!-- 头顶浅斑 -->
    <circle cx="110" cy="92" r="3" fill="#9EC6F0" opacity="0.6"/>
    <!-- 头上水珠 -->
    <circle cx="116" cy="96" r="1.2" fill="#D8F0FC" opacity="0.8"/>
  </g>

  <!-- 泽水星尘 -->
  <g fill="#FFF8DC">
    <circle cx="36" cy="106">
      <animate attributeName="cy" values="106;96;106" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="164" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
