    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE8C8"/><stop offset="100%" stop-color="#F2C88C"/>
    </linearGradient>
    <g id="pk-head">
