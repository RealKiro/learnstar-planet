      <path d="M -14 -24 L -38 -66 L -4 -37 Z" fill="url(#fur)" stroke="#B8761C" stroke-width="1.2"/>
      <path d="M -26 -54 L -34 -66 L -18 -52 Z" fill="#2B2B2B"/>
      <path d="M 14 -24 L 38 -66 L 4 -37 Z" fill="url(#fur)" stroke="#B8761C" stroke-width="1.2"/>
