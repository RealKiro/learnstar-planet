<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="磁甲兽·四阶·护群初成·铁雨落群冲中央展甲铁墙叮当纹动群安然">
  <defs>
    <!-- 背景：铁原铁雨 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78889A"/>
      <stop offset="52%" stop-color="#889898"/>
      <stop offset="100%" stop-color="#6E7E88"/>
    </linearGradient>
    <!-- 铁雨光 -->
    <radialGradient id="glow" cx="44%" cy="40%" r="46%">
      <stop offset="0%" stop-color="#C8E0F0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C8E0F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 钢蓝甲 -->
    <radialGradient id="armor" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#86A6CC"/>
      <stop offset="100%" stop-color="#52729A"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="80" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 铁雨（右，被甲挡） -->
  <g fill="#8A9AA8" opacity="0.8">
    <path d="M 150 44 L 156 36 L 154 46 Z">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 166 60 L 172 52 L 170 62 Z">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 158 74 L 164 66 L 162 76 Z">
      <animate attributeName="opacity" values="0.75;0.38;0.75" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E7E88" opacity="0.9"/>

  <!-- 安然在甲下的群落（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="56" cy="130" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="68" cy="134" r="3.5" fill="#D0B888" stroke="#B09868" stroke-width="0.5"/>
  </g>

  <!-- 展甲护群的磁甲兽（中，甲挡铁雨） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 展甲的铁穹（弧形） -->
    <path d="M 60 148 Q 88 76 120 148 Z" fill="#7A9AC0" stroke="#3E5E86" stroke-width="1.2" opacity="0.5"/>
    <!-- 甲身 -->
    <ellipse cx="92" cy="120" rx="17" ry="13" fill="url(#armor)" stroke="#3E5E86" stroke-width="1"/>
    <!-- 甲纹 -->
    <path d="M 76 112 Q 92 106 108 112" stroke="#8AA8CC" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M 78 126 Q 92 120 106 126" stroke="#8AA8CC" stroke-width="1" fill="none" opacity="0.7"/>
    <!-- 甲坑点（被铁雨砸） -->
    <circle cx="80" cy="110" r="1.5" fill="#3E5E86" opacity="0.8"/>
    <circle cx="104" cy="122" r="1.3" fill="#3E5E86" opacity="0.7"/>
    <!-- 短尾 -->
    <path d="M 76 126 Q 68 126 66 132" stroke="#52729A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="92" cy="106" rx="10" ry="9" fill="url(#armor)" stroke="#3E5E86" stroke-width="0.8"/>
    <path d="M 100 106 L 104 104.5 L 100 109 Z" fill="#3E5E86"/>
    <!-- 眼（含威含护） -->
    <circle cx="88" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="88.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="97" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="97.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 101 108 Q 103 109.4 105 108" fill="none" stroke="#3E5E86" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 磁光爪（撑甲） -->
    <path d="M 106 112 L 122 104" stroke="#52729A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="124" cy="102" r="3" fill="#C8E0F0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 短腿 -->
    <path d="M 80 130 L 75 138" stroke="#52729A" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 104 130 L 109 138" stroke="#52729A" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 挡雨震光 -->
    <circle cx="100" cy="92" r="3" fill="#C8E0F0" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.25;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#C8E0F0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
