<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="磁甲兽·一阶·磁甲初生·宝可梦铁原钢蓝甲收展磁光爪拨开铁片">
  <defs>
    <!-- 背景：宝可梦铁原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A9AA8"/>
      <stop offset="52%" stop-color="#9AA8B0"/>
      <stop offset="100%" stop-color="#788890"/>
    </linearGradient>
    <!-- 铁原光 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#D8E0E8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D8E0E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 钢蓝甲 -->
    <radialGradient id="armor" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#7A9AC0"/>
      <stop offset="100%" stop-color="#4E6E96"/>
    </radialGradient>
    <!-- 磁光 -->
    <radialGradient id="mag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 铁原 -->
  <g fill="#6E7E88" opacity="0.5">
    <path d="M 0 138 Q 60 130 120 136 Q 170 140 200 132 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#788890" opacity="0.9"/>

  <!-- 受伤的小兽（右，铁片被拨开） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="152" cy="130" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="128.8" r="1.1" fill="#2E2A24"/>
    <!-- 伤处 -->
    <path d="M 154 134 L 158 136" stroke="#D87868" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- 被拨开的铁片 -->
  <g>
    <path d="M 136 116 L 144 112 L 142 120 Z" fill="#8A9AA8" stroke="#6E7E88" stroke-width="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 小磁甲兽（中，甲收展） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 甲身（钢蓝，分节） -->
    <ellipse cx="96" cy="124" rx="16" ry="12" fill="url(#armor)" stroke="#3E5E86" stroke-width="1"/>
    <!-- 甲纹（分节） -->
    <path d="M 82 116 Q 96 112 110 116" stroke="#6E8EB4" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 84 128 Q 96 124 108 128" stroke="#6E8EB4" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 90 112 L 90 118 M 102 112 L 102 118" stroke="#6E8EB4" stroke-width="0.8" fill="none" opacity="0.6"/>
    <!-- 短尾 -->
    <path d="M 80 126 Q 74 126 72 130" stroke="#4E6E96" stroke-width="2" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="96" cy="110" rx="10" ry="9" fill="url(#armor)" stroke="#3E5E86" stroke-width="0.8"/>
    <!-- 鼻（尖） -->
    <path d="M 104 110 L 108 108.5 L 104 113 Z" fill="#3E5E86"/>
    <!-- 眼（圆亮） -->
    <circle cx="92" cy="109" r="2.4" fill="#2E2A24"/>
    <circle cx="92.8" cy="107.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="109" r="2.4" fill="#2E2A24"/>
    <circle cx="101.8" cy="107.8" r="1" fill="#FFF"/>
    <!-- 嘴（轻） -->
    <path d="M 105 112 Q 107 113.4 109 112" fill="none" stroke="#3E5E86" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 磁光爪（拨铁片） -->
    <path d="M 104 118 L 122 112" stroke="#4E6E96" stroke-width="2.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 104 118;5 104 118;-5 104 118" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="124" cy="110" r="2.5" fill="url(#mag)">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="124" cy="110" r="4.5" fill="#C8E8F8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 短腿 -->
    <path d="M 84 132 L 80 138" stroke="#4E6E96" stroke-width="3" stroke-linecap="round"/>
    <path d="M 108 132 L 112 138" stroke="#4E6E96" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#D8E0E8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
