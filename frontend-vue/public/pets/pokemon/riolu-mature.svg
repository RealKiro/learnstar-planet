<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="利欧路·四阶·读心初成·月夜波导接住伙伴恐惧说别怕我在伴靠着睡">
  <defs>
    <!-- 背景：月夜山谷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3A5E"/>
      <stop offset="52%" stop-color="#3E4A6E"/>
      <stop offset="100%" stop-color="#5A6A8E"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moon" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 波导暖 -->
    <radialGradient id="glow" cx="40%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#68D8F8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#68D8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑蓝身形 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#5E6E8E"/>
      <stop offset="100%" stop-color="#3E4E6E"/>
    </radialGradient>
    <!-- 波导光 -->
    <radialGradient id="wave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68D8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#68D8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="160" cy="40" r="70" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.64;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="40" r="12" fill="#E8F0F8" opacity="0.95"/>
  <circle cx="80" cy="88" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#C8D8E8" opacity="0.5">
    <circle cx="36" cy="40" r="1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="30" r="0.9">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#3E4A6E" opacity="0.9"/>

  <!-- 靠着睡的伙伴（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="138" cy="132" r="4.5" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="136" cy="130.8" r="1.1" fill="#24180E"/>
    <circle cx="141" cy="130.8" r="1.1" fill="#24180E"/>
    <!-- 睡（闭眼） -->
    <path d="M 134 131 Q 136 129.6 138 131" stroke="#7A90A8" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <!-- 安睡的 z -->
    <text x="146" y="122" font-size="9" fill="#A8C8E0" opacity="0.7">z</text>
  </g>

  <!-- 少年利欧路（左，波导安抚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 头冠（立） -->
    <path d="M 72 100 Q 76 90 80 100" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.4"/>
    <!-- 尖耳 -->
    <path d="M 62 104 L 54 92 L 68 100 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.7"/>
    <path d="M 84 104 L 92 92 L 78 100 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.7"/>
    <!-- 细尾 -->
    <path d="M 56 122 Q 44 116 42 124 Q 42 132 50 134" stroke="#3E4E6E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- 身 -->
    <ellipse cx="72" cy="122" rx="14" ry="12" fill="url(#body)" stroke="#2E3E58" stroke-width="0.9"/>
    <!-- 头 -->
    <ellipse cx="72" cy="106" rx="10" ry="9" fill="url(#body)" stroke="#2E3E58" stroke-width="0.8"/>
    <!-- 眼（含温，望伙伴） -->
    <circle cx="68" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="68.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="77" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="77.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 嘴（说别怕我在） -->
    <path d="M 69 110 Q 72 111.8 75 110" fill="none" stroke="#8EA8C0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 胸前波导（暖） -->
    <circle cx="72" cy="120" r="4" fill="url(#wave)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="120" r="7" fill="#68D8F8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.15;0.28" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 波导接住恐惧 -->
    <path d="M 78 122 Q 100 128 126 130" stroke="#68D8F8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.24;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <!-- 轻碰的爪 -->
    <path d="M 84 118 L 98 116" stroke="#3E4E6E" stroke-width="2.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-3 84 118;3 84 118;-3 84 118" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#C8D8E8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
