<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·三阶·蓄水苦修">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E8"/><stop offset="100%" stop-color="#4EA8CC"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9ED8"/><stop offset="100%" stop-color="#2E7EBC"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0CE96"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89A5E"/><stop offset="100%" stop-color="#9A6E3E"/>
    </linearGradient>
    <g id="sq-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.4"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="1.8" ry="1.3" fill="#1E4E7E"/>
      <path d="M -6 10 L -3 7 L 0 10 L 3 7 L 6 10" fill="none" stroke="#1E4E7E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <path d="M 0 172 Q 50 164 100 172 Q 150 180 200 172 L 200 200 L 0 200 Z" fill="#5EA8CC"/>
  <g transform="translate(104,120) scale(0.96)">
    <animateTransform attributeName="transform" type="translate" values="104 120;104 117;104 120" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -19 16 Q -29 24 -25 34 Q -21 42 -13 38 Q -11 30 -17 26 Z" fill="#3E7EAC" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="10" cy="-2" rx="27" ry="25" fill="url(#shell)" stroke="#6E4A24" stroke-width="1.6"/>
    <path d="M 6 -19 Q 18 -8 12 14 Q 2 23 -8 9 Q -6 -10 6 -19 Z" fill="#B87E4E" opacity="0.6"/>
    <ellipse cx="-4" cy="4" rx="32" ry="29" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.3"/>
    <ellipse cx="-4" cy="13" rx="19" ry="13" fill="url(#belly)" opacity="0.9"/>
    <ellipse cx="-16" cy="30" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="9" cy="30" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <use href="#sq-head" transform="translate(-4,-32) scale(0.98)"/>
    <!-- 水炮（练向右侧岩壁） -->
    <path d="M 8 14 Q 24 8 34 18 Q 40 26 48 22" stroke="#8EC8E8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="0 16 14;5 16 14;0 16 14" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <g fill="#B8E8F8" opacity="0.7">
      <circle cx="40" cy="20" r="2"/><circle cx="46" cy="26" r="1.6"/>
    </g>
  </g>
  <path d="M 162 172 L 166 118 L 178 118 L 176 172 Z" fill="#8A6E4E"/>
  <g stroke="#B8E8F8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 164 128 L 158 120 M 170 132 L 166 122"/>
  </g>
</svg>
