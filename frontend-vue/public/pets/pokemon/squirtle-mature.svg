<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·四阶·水炮护泽">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E8"/><stop offset="100%" stop-color="#4EA8CC"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9ED8"/><stop offset="100%" stop-color="#2E7EBC"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0CE96"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89A5E"/><stop offset="100%" stop-color="#9A6E3E"/>
    </linearGradient>
    <g id="sq-head">
      <circle cx="0" cy="0" r="30" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.4"/>
      <circle cx="-11" cy="-1" r="8.2" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.5" r="3.1" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8.2" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.5" r="3.1" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="1.9" ry="1.4" fill="#1E4E7E"/>
      <path d="M -7 10 L -3 7 L 0 10 L 3 7 L 7 10" fill="none" stroke="#1E4E7E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="60" cy="92" r="70" fill="#E8F8FF" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 172 Q 50 162 100 172 Q 150 182 200 172 L 200 200 L 0 200 Z" fill="#5EA8CC"/>
  <path d="M 30 172 Q 28 162 34 154 Q 40 162 30 172 Z" fill="#8EC8E8"/>
  <g transform="translate(104,122) scale(1.0)">
    <animateTransform attributeName="transform" type="translate" values="104 122;104 118;104 122" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -20 16 Q -30 24 -26 34 Q -22 42 -14 38 Q -12 30 -18 26 Z" fill="#3E7EAC" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="10" cy="-2" rx="28" ry="26" fill="url(#shell)" stroke="#6E4A24" stroke-width="1.6"/>
    <path d="M 6 -20 Q 18 -9 13 14 Q 3 24 -8 9 Q -6 -10 6 -20 Z" fill="#B87E4E" opacity="0.6"/>
    <ellipse cx="-4" cy="4" rx="33" ry="30" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.4"/>
    <ellipse cx="-4" cy="14" rx="20" ry="14" fill="url(#belly)" opacity="0.9"/>
    <ellipse cx="-16" cy="31" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="9" cy="31" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <use href="#sq-head" transform="translate(-4,-33) scale(1.0)"/>
    <!-- 水炮护泽（向泽注水） -->
    <path d="M 8 14 Q 28 4 42 12 Q 50 18 58 14" stroke="#8EC8E8" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" values="0 20 12;4 20 12;0 20 12" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <g fill="#B8E8F8" opacity="0.7">
      <circle cx="44" cy="12" r="2.2"/><circle cx="52" cy="16" r="1.8"/><circle cx="60" cy="12" r="1.4"/>
    </g>
  </g>
</svg>
