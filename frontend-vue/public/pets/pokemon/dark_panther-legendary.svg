<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="夜隐豹·五阶·夜隐守护·融影巡守暗挡危机悄悄引路向安全">
  <defs>
    <!-- 背景：宝可梦夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A3E"/>
      <stop offset="52%" stop-color="#2E3A4E"/>
      <stop offset="100%" stop-color="#3E4E5E"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moon" cx="76%" cy="20%" r="38%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 守护光环（微） -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#C8D8E8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8D8E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乌黑毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#323642"/>
      <stop offset="100%" stop-color="#161820"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="152" cy="40" r="70" fill="url(#moon)">
    <animate attributeName="opacity" values="0.95;0.68;0.95" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="40" r="12" fill="#E8F0F8" opacity="0.95"/>
  <circle cx="100" cy="82" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.18;0.1;0.18" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 星 -->
  <g fill="#C8D8E8" opacity="0.5">
    <circle cx="36" cy="44" r="1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="30" r="0.9">
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 夜林树影 -->
  <g fill="#0E141E" opacity="0.8">
    <path d="M 0 70 L 8 30 L 16 66 L 24 40 L 32 72 L 0 200 L 0 72 Z"/>
    <path d="M 178 60 L 188 22 L 196 56 L 200 46 L 200 200 L 178 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#2E3A4E" opacity="0.9"/>

  <!-- 被引向安全的小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="126" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="56" cy="124.8" r="1" fill="#2E2A24"/>
    <circle cx="61" cy="124.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 危机（右，被暗挡） -->
  <g stroke="#5A7898" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 164 66 Q 172 78 168 90">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 172 70 Q 180 82 176 94" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 夜隐守护（中，融影） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 影（大融） -->
    <ellipse cx="94" cy="140" rx="28" ry="5.5" fill="#0E141E" opacity="0.8"/>
    <!-- 长尾（如影） -->
    <path d="M 74 118 Q 54 108 50 122 Q 48 134 62 140 Q 76 142 82 130" stroke="#161820" stroke-width="3" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 74 118;4 74 118;-4 74 118" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 大耳（立） -->
    <path d="M 82 106 L 70 86 L 88 101 Z" fill="#161820" stroke="#060810" stroke-width="0.8"/>
    <path d="M 108 106 L 120 86 L 102 101 Z" fill="#161820" stroke="#060810" stroke-width="0.8"/>
    <!-- 身（乌黑如影） -->
    <ellipse cx="94" cy="120" rx="18" ry="14" fill="url(#fur)" stroke="#060810" stroke-width="1"/>
    <!-- 头 -->
    <ellipse cx="94" cy="106" rx="11" ry="10" fill="url(#fur)" stroke="#060810" stroke-width="0.9"/>
    <!-- 眼（如灯） -->
    <circle cx="88" cy="105" r="2.6" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="105" r="2.6" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.72;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88.5" cy="104.4" r="0.9" fill="#FFF8E0" opacity="0.9"/>
    <circle cx="100.5" cy="104.4" r="0.9" fill="#FFF8E0" opacity="0.9"/>
    <!-- 额饰（月光纹） -->
    <circle cx="94" cy="97" r="2.2" fill="#C8D8E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 98 109 L 100 109 L 99 111.5 Z" fill="#2E3A4E"/>
    <!-- 前爪（暗挡） -->
    <path d="M 108 114 L 128 104" stroke="#161820" stroke-width="3.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 108 114;5 108 114;-5 108 114" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 后爪 -->
    <path d="M 80 130 L 74 140" stroke="#161820" stroke-width="3" stroke-linecap="round"/>
    <path d="M 110 130 L 116 140" stroke="#161820" stroke-width="3" stroke-linecap="round"/>
    <!-- 引路（暗处） -->
    <path d="M 80 114 Q 70 118 64 122" stroke="#C8D8E8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.18;0.4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#C8D8E8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
