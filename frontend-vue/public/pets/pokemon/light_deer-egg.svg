<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="晨曦鹿·一阶·晨曦初生·宝可梦森林晨光角光微亮引小兽出雾">
  <defs>
    <!-- 背景：宝可梦森林晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8A0"/>
      <stop offset="52%" stop-color="#E0C080"/>
      <stop offset="100%" stop-color="#A8C878"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="50%" cy="24%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 栗色毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#C89868"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
    <!-- 角光 -->
    <radialGradient id="horn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 晨雾 -->
  <g fill="#F8F0DC" opacity="0.5">
    <ellipse cx="60" cy="140" rx="28" ry="9"/>
    <ellipse cx="150" cy="146" rx="32" ry="10"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#A8C878" opacity="0.9"/>

  <!-- 被引的小兽（右，出雾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="156" cy="130" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="154" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="159" cy="128.8" r="1.1" fill="#2E2A24"/>
  </g>
  <!-- 角光引路 -->
  <path d="M 122 104 Q 136 114 148 124" stroke="#FFF8D8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.24;0.5" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- 小晨曦鹿（中，角带晨光） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 角（带晨光） -->
    <path d="M 92 100 L 86 90 L 90 92 L 88 84 L 92 90 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 102 100 L 108 90 L 104 92 L 106 84 L 102 90 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <circle cx="88" cy="86" r="3" fill="url(#horn)">
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="106" cy="86" r="3" fill="url(#horn)">
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳 -->
    <path d="M 90 104 L 84 98 L 92 100 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 104 104 L 110 98 L 102 100 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <!-- 短尾 -->
    <path d="M 78 122 Q 72 122 72 126" stroke="#C89868" stroke-width="2" stroke-linecap="round"/>
    <!-- 身 -->
    <ellipse cx="96" cy="122" rx="14" ry="11" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <!-- 腹白 -->
    <ellipse cx="94" cy="128" rx="8" ry="5" fill="#F0E4D0" opacity="0.7"/>
    <!-- 头 -->
    <ellipse cx="96" cy="106" rx="9" ry="8" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <!-- 吻 -->
    <path d="M 100 110 Q 105 110 107 108 Q 105 114 100 114 Z" fill="#F0E4D0" stroke="#D0C0A8" stroke-width="0.5"/>
    <!-- 眼（大温柔） -->
    <circle cx="92" cy="105" r="2.5" fill="#2E2A24"/>
    <circle cx="92.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="105" r="2.5" fill="#2E2A24"/>
    <circle cx="101.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 105 109 L 103 111 L 107 111 Z" fill="#8E6838"/>
    <!-- 嘴（轻） -->
    <path d="M 104 114 Q 106 115.4 108 114" fill="none" stroke="#8E6838" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 86 128 L 83 135" stroke="#A87848" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 106 128 L 109 135" stroke="#A87848" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF8D8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
