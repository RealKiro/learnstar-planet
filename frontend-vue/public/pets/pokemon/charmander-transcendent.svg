<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·六阶·道果·超级喷火龙圣焰">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#2A3A5E"/>
      <stop offset="55%" stop-color="#1A2A4E"/>
      <stop offset="100%" stop-color="#0E1830"/>
    </radialGradient>
    <radialGradient id="body" cx="42%" cy="36%" r="76%">
      <stop offset="0%" stop-color="#FFB84D"/>
      <stop offset="60%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E8602E"/>
    </radialGradient>
    <radialGradient id="belly" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="100%" stop-color="#FFE0B8"/>
    </radialGradient>
    <linearGradient id="holy" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FFF3A6"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5D742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5D742" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 圣光（呼吸） -->
  <circle cx="100" cy="104" r="84" fill="url(#core)">
    <animate attributeName="r" values="84;94;84" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="104" r="72" fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 100 104;25 100 104;0 100 104" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- 大翼（遮天，圣焰翼） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 100 70;-3 100 70;0 100 70" dur="2.6s" repeatCount="indefinite"/>
    <path d="M 60 82 C 26 64 10 34 16 12 C 48 26 72 52 78 80 Z" fill="url(#holy)" opacity="0.9"/>
    <path d="M 140 82 C 174 64 190 34 184 12 C 152 26 128 52 122 80 Z" fill="url(#holy)" opacity="0.9"/>
    <path d="M 46 68 C 28 58 18 44 18 32 C 40 42 52 56 58 66 Z" fill="#FFF3A6" opacity="0.95"/>
    <path d="M 154 68 C 172 58 182 44 182 32 C 160 42 148 56 142 66 Z" fill="#FFF3A6" opacity="0.95"/>
  </g>

  <!-- 圣焰尾 -->
  <path d="M 132 146 C 162 138 178 112 172 84" fill="none" stroke="url(#body)" stroke-width="15" stroke-linecap="round"/>
  <g>
    <animateTransform attributeName="transform" type="scale" values="1 1;1.15 1.2;1 1" dur="1.8s" repeatCount="indefinite" transform-origin="170 60"/>
    <path d="M 173 78 C 164 60 168 46 173 36 C 178 46 182 60 173 78 Z" fill="url(#holy)"/>
    <path d="M 173 70 C 168 60 170 52 173 48 C 176 52 178 60 173 70 Z" fill="#FFF3A6" opacity="0.95"/>
  </g>

  <!-- 脚 -->
  <ellipse cx="85" cy="160" rx="13" ry="9" fill="#E8602E"/>
  <ellipse cx="115" cy="160" rx="13" ry="9" fill="#E8602E"/>

  <!-- 身体（完全体，挺立） -->
  <ellipse cx="100" cy="126" rx="36" ry="42" fill="url(#body)"/>
  <ellipse cx="100" cy="136" rx="22" ry="28" fill="url(#belly)"/>
  <!-- 金色祥纹 -->
  <path d="M 72 106 Q 82 112 74 124" fill="none" stroke="#FFD54F" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 128 106 Q 118 112 126 124" fill="none" stroke="#FFD54F" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- 手（展开蓄势） -->
  <ellipse cx="68" cy="114" rx="8" ry="11" fill="#E8602E"/>
  <ellipse cx="132" cy="114" rx="8" ry="11" fill="#E8602E"/>

  <!-- 金鬃 -->
  <path d="M 84 44 C 74 36 74 24 84 16 C 94 24 96 36 92 44 Z" fill="#FFD54F"/>
  <path d="M 116 44 C 126 36 126 24 116 16 C 106 24 104 36 108 44 Z" fill="#FFD54F"/>

  <!-- 头 -->
  <ellipse cx="100" cy="70" rx="30" ry="28" fill="url(#body)"/>
  <ellipse cx="100" cy="85" rx="16" ry="11" fill="url(#belly)"/>
  <circle cx="93" cy="80" r="1.6" fill="#D84A20"/>
  <circle cx="107" cy="80" r="1.6" fill="#D84A20"/>

  <!-- 目光如炬（圣焰金瞳） -->
  <circle cx="86" cy="67" r="7.6" fill="#1A0F0A"/>
  <circle cx="114" cy="67" r="7.6" fill="#1A0F0A"/>
  <circle cx="86" cy="67" r="4.2" fill="#F5D742"/>
  <circle cx="114" cy="67" r="4.2" fill="#F5D742"/>
  <path d="M 76 56 Q 86 50 96 55" fill="none" stroke="#E8602E" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 124 56 Q 114 50 104 55" fill="none" stroke="#E8602E" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 口中圣焰 -->
  <path d="M 92 88 Q 100 94 108 88" fill="none" stroke="#E8602E" stroke-width="2" stroke-linecap="round"/>
  <path d="M 108 90 C 116 88 118 94 116 100 C 110 96 104 94 108 90 Z" fill="url(#holy)" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.5;0.95" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- 圣焰环绕（光粒） -->
  <g fill="#4FC3F7">
    <circle cx="52" cy="110">
      <animate attributeName="cy" values="110;100;110" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="148" cy="108">
      <animate attributeName="cy" values="108;98;108" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.15;0.75" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="182">
      <animate attributeName="cy" values="182;172;182" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
