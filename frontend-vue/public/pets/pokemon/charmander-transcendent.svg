<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·六阶·圣焰传说">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1436"/><stop offset="100%" stop-color="#0E0A20"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F58E44"/><stop offset="100%" stop-color="#DA6A28"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F2CE96"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ECCE0"/><stop offset="100%" stop-color="#4E92B8"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8C858" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F8C858" stop-opacity="0"/>
    </radialGradient>
    <g id="ch-head">
      <circle cx="0" cy="0" r="33" fill="url(#fur)" stroke="#B84E16" stroke-width="1.5"/>
      <ellipse cx="0" cy="10" rx="15" ry="9" fill="url(#belly)" opacity="0.85"/>
      <circle cx="-12" cy="-2" r="8.6" fill="#2B2B2B"/>
      <circle cx="-10" cy="-4.6" r="3.2" fill="#FFF"/>
      <circle cx="12" cy="-2" r="8.6" fill="#2B2B2B"/>
      <circle cx="14" cy="-4.6" r="3.2" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="1.8" ry="1.2" fill="#5A3A20"/>
      <path d="M -9 10 L -5 5 L 0 10 L 5 5 L 9 10" fill="none" stroke="#5A3A20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -15 -22 L -22 -44 L -7 -30 Z" fill="#E8B028" stroke="#B84E16" stroke-width="0.8"/>
      <path d="M 15 -22 L 22 -44 L 7 -30 Z" fill="#E8B028" stroke="#B84E16" stroke-width="0.8"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="96" r="90" fill="url(#aura)">
    <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FDE68A" stroke-width="2.8" opacity="0.9" stroke-linecap="round" fill="none">
    <path d="M 30 42 L 46 58 L 38 64 L 58 78"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M 174 38 L 156 54 L 166 62 L 144 76"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="1.5s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#FFF8C0">
    <circle cx="52" cy="116" r="1.8"><animate attributeName="cy" values="116;100;116" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="92" r="1.5"><animate attributeName="cy" values="92;76;92" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(100,126) scale(1.3)">
