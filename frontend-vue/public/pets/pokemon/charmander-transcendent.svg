    <path d="M -20 -16 Q -50 -48 -72 -38 Q -50 -16 -22 2 Z" fill="url(#wing)" stroke="#3A6E88" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" values="0 -26 -8;-5 -26 -8;0 -26 -8" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 -16 Q 50 -48 72 -38 Q 50 -16 22 2 Z" fill="url(#wing)" stroke="#3A6E88" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" values="0 26 -8;5 26 -8;0 26 -8" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 28 -8 Q 58 -6 68 -30 Q 60 -54 42 -48 Q 30 -28 34 -14 Z" fill="#E86A2A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.25;1 1" dur="0.45s" repeatCount="indefinite" additive="sum"/>
