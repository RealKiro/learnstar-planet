<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·六阶·归真·超级喷火龙X">
  <defs>
    <!-- 背景：云白通透 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDE8DE"/>
      <stop offset="70%" stop-color="#E0E6DF"/>
      <stop offset="100%" stop-color="#C9D6CF"/>
    </linearGradient>
    <!-- 淡金神性微光 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#F5F0E8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#EDE5D4" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="55%" stop-color="#FFE98A"/>
      <stop offset="100%" stop-color="#FFFBE0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- 圣光环（淡） -->
  <circle cx="100" cy="110" r="78" fill="none" stroke="#C9B37E" stroke-width="1.6" opacity="0.35"/>

  <!-- 环境：远山 -->
  <path d="M 0 168 Q 40 148 80 160 Q 120 174 150 156 Q 175 144 200 154 L 200 200 L 0 200 Z" fill="#B7C4BD" opacity="0.5"/>

  <!-- 环境：云海（与角色融合） -->
  <path d="M 0 176 Q 30 168 60 174 Q 90 180 120 172 Q 160 162 200 172 L 200 192 Q 150 184 100 190 Q 50 196 0 190 Z" fill="#FFFFFF" opacity="0.75"/>

  <!-- 角色：白色半透明喷火龙侧坐（融于光，收敛） -->
  <!-- 尾（光焰） -->
  <path d="M 126 128 C 152 126 166 112 168 94" fill="none" stroke="#F5F0E8" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
  <path d="M 168 90 C 162 78 165 70 168 64 C 171 70 174 78 168 90 Z" fill="url(#flame)" opacity="0.95"/>

  <!-- 翼（微收，半透明） -->
  <path d="M 66 96 C 40 84 30 62 34 44 C 52 54 66 72 72 92 Z" fill="#F5F0E8" opacity="0.6"/>
  <path d="M 128 100 C 150 90 162 70 158 52 C 144 62 132 80 124 96 Z" fill="#F5F0E8" opacity="0.55"/>

  <!-- 身体（坐姿，微垂） -->
  <ellipse cx="92" cy="130" rx="30" ry="32" fill="url(#body)"/>

  <!-- 脚（蜷缩） -->
  <ellipse cx="80" cy="156" rx="10" ry="7" fill="#F5F0E8" opacity="0.7"/>
  <ellipse cx="102" cy="158" rx="10" ry="7" fill="#F5F0E8" opacity="0.7"/>

  <!-- 头（微垂，闭目） -->
  <ellipse cx="88" cy="86" rx="24" ry="21" fill="url(#body)"/>
  <ellipse cx="86" cy="98" rx="12" ry="8" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="82" cy="95" r="1.3" fill="#D8C6A8" opacity="0.8"/>
  <circle cx="90" cy="95" r="1.3" fill="#D8C6A8" opacity="0.8"/>

  <!-- 闭目（入定安详） -->
  <path d="M 78 84 Q 86 88 94 84" fill="none" stroke="#C9B37E" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- 柔和光晕 -->
  <circle cx="88" cy="110" r="44" fill="url(#glow)"/>

  <!-- 归真粒子 -->
  <g fill="#C9B37E">
    <circle cx="60" cy="120" r="1.4" opacity="0.55"/>
    <circle cx="130" cy="84" r="1.2" opacity="0.45"/>
    <circle cx="150" cy="120" r="1.1" opacity="0.4"/>
    <circle cx="104" cy="80" r="1" opacity="0.45"/>
    <circle cx="72" cy="100" r="0.9" opacity="0.4"/>
  </g>
</svg>
