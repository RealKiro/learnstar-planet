    <path d="M 16 -6 Q 25 -8 31 -10" stroke="#B84E16" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="2" rx="39" ry="33" fill="url(#fur)" stroke="#B84E16" stroke-width="1.5"/>
    <ellipse cx="0" cy="14" rx="24" ry="17" fill="url(#belly)" opacity="0.9"/>
    <path d="M 0 -28 L 3 -20 M 9 -28 L 10 -20 M -7 -28 L -5 -20" stroke="#B84E16" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="-15" cy="30" rx="9" ry="7" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <ellipse cx="15" cy="30" rx="9" ry="7" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <use href="#ch-head" transform="translate(0,-38) scale(1.08)"/>
    <g stroke="#F8C858" stroke-width="3" opacity="0.95" stroke-linecap="round" fill="none">
      <path d="M 28 6 L 50 -6 L 44 -18 L 72 -28"><animate attributeName="opacity" values="0.95;0.45;0.95" dur="0.7s" repeatCount="indefinite"/></path>
