<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="磁甲兽·二阶·夹痛之痛·甲夹住伙伴尾巴慌忙松开看甲">
  <defs>
    <!-- 背景：铁原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78889A"/>
      <stop offset="52%" stop-color="#889898"/>
      <stop offset="100%" stop-color="#6E7E88"/>
    </linearGradient>
    <!-- 弱磁光 -->
    <radialGradient id="glow" cx="44%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#C8E0F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8E0F0" stop-opacity="0"/>
    </radialGradient>
    <!-- 钢蓝甲 -->
    <radialGradient id="armor" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#6E8EB4"/>
      <stop offset="100%" stop-color="#3E5E86"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="72" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.26;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 铁原 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6E7E88" opacity="0.9"/>

  <!-- 被夹疼的伙伴（右，尾巴疼） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="146" cy="126" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="144" cy="124.8" r="1.1" fill="#2E2A24"/>
    <circle cx="149" cy="124.8" r="1.1" fill="#2E2A24"/>
    <!-- 疼的嘴 -->
    <ellipse cx="147" cy="130" rx="1.5" ry="2" fill="#A88858"/>
    <!-- 尾巴（被夹过，疼） -->
    <path d="M 152 131 Q 158 133 160 138" stroke="#A88858" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 158 136 L 161 135" stroke="#D87868" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 慌忙松开的小磁甲兽（左，愧疚） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 甲身（微乱） -->
    <ellipse cx="68" cy="134" rx="13" ry="11" fill="url(#armor)" stroke="#2E4E76" stroke-width="0.9" transform="rotate(-8 68 134)"/>
    <!-- 甲纹（乱） -->
    <path d="M 57 128 Q 68 124 79 128" stroke="#6E8EB4" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 63 126 L 63 132" stroke="#6E8EB4" stroke-width="0.7" fill="none" opacity="0.5"/>
    <!-- 短尾（垂） -->
    <path d="M 55 136 Q 50 138 50 142" stroke="#3E5E86" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 头（低垂） -->
    <ellipse cx="68" cy="122" rx="9" ry="8" fill="url(#armor)" stroke="#2E4E76" stroke-width="0.8" transform="rotate(-8 68 122)"/>
    <path d="M 76 122 L 80 120.5 L 76 125 Z" fill="#2E4E76"/>
    <!-- 眼（含愧） -->
    <circle cx="64" cy="121" r="2.2" fill="#2E2A24"/>
    <circle cx="64.8" cy="119.8" r="0.9" fill="#FFF"/>
    <circle cx="73" cy="121" r="2.2" fill="#2E2A24"/>
    <circle cx="73.8" cy="119.8" r="0.9" fill="#FFF"/>
    <circle cx="65" cy="120.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 嘴（低垂） -->
    <path d="M 75 125 Q 77 123.6 79 125" fill="none" stroke="#2E4E76" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 磁光爪（颤，松开） -->
    <path d="M 58 130 L 54 135" stroke="#3E5E86" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 78 130 L 82 135" stroke="#3E5E86" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="82" cy="136" r="2" fill="#C8E0F0" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 尘灰 -->
  <g fill="#C8E0F0" opacity="0.3">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
