<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妙蛙种子·三阶·扎根苦修">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8B8"/><stop offset="100%" stop-color="#78B890"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9A72"/><stop offset="100%" stop-color="#2E7A52"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0D8"/><stop offset="100%" stop-color="#9AD8B0"/>
    </linearGradient>
    <g id="bb-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
      <circle cx="-11" cy="-14" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="12" cy="-13" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="6" rx="1.8" ry="1.4" fill="#1E4E3A"/>
      <path d="M -7 12 L -3 8 L 0 12 L 3 8 L 7 12" fill="none" stroke="#1E4E3A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="58" r="60" fill="#FFF8C0" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 168 Q 50 160 100 168 Q 150 176 200 168 L 200 200 L 0 200 Z" fill="#4E8E6E"/>
  <!-- 扎根：根系入土 -->
  <g stroke="#3E7A5A" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M 74 168 Q 70 176 72 186"/>
    <path d="M 100 168 Q 100 178 104 186"/>
    <path d="M 126 168 Q 130 176 128 186"/>
  </g>
  <g transform="translate(100,120) scale(0.95)">
    <animateTransform attributeName="transform" type="translate" values="100 120;100 117;100 120" dur="2s" repeatCount="indefinite"/>
    <path d="M -17 8 Q -27 10 -31 16" stroke="#2E6A4E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M -33 14 L -29 20 L -37 18 Z" fill="#4E9A72"/>
    <!-- 种子苞（鼓，含芽） -->
    <ellipse cx="14" cy="-14" rx="12" ry="13" fill="#3E8A62" stroke="#2E6A4E" stroke-width="1.2"/>
    <path d="M 16 -25 Q 10 -32 18 -34 M 20 -25 Q 24 -30 22 -34" stroke="#5EB88A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="4" rx="33" ry="29" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.3"/>
    <ellipse cx="0" cy="13" rx="20" ry="14" fill="url(#belly)" opacity="0.9"/>
    <circle cx="-9" cy="20" r="2.8" fill="#E85A5A" opacity="0.7"/>
    <circle cx="9" cy="21" r="2.8" fill="#E85A5A" opacity="0.7"/>
    <ellipse cx="-14" cy="29" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <ellipse cx="14" cy="29" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <use href="#bb-head" transform="translate(0,-31) scale(0.98)"/>
    <!-- 藤鞭练习（卷向石头） -->
    <path d="M 22 8 Q 36 4 42 14 Q 46 24 56 22" stroke="#3E8A62" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="0 30 12;8 30 12;0 30 12" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  <ellipse cx="164" cy="142" rx="10" ry="7" fill="#6E8E5E"/>
</svg>
