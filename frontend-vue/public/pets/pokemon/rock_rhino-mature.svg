<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="岩甲犀·四阶·护群初成·山崩落石冲最前展甲稳挡石碎群安然">
  <defs>
    <!-- 背景：山崩落石 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88989A"/>
      <stop offset="52%" stop-color="#9AA8A0"/>
      <stop offset="100%" stop-color="#78886C"/>
    </linearGradient>
    <!-- 落石光 -->
    <radialGradient id="glow" cx="58%" cy="36%" r="44%">
      <stop offset="0%" stop-color="#D8E0C8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D8E0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 岩皮 -->
    <radialGradient id="rock" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#B0A088"/>
      <stop offset="100%" stop-color="#88705A"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="116" cy="72" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 滚落的岩石（右） -->
  <g>
    <path d="M 150 52 L 166 44 L 164 62 Z" fill="#8E7A64" stroke="#6E5A46" stroke-width="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 168 70 L 182 64 L 178 80 Z" fill="#8E7A64" stroke="#6E5A46" stroke-width="0.6" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="176" cy="96" r="5" fill="#8E7A64" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#78886C" opacity="0.9"/>

  <!-- 安然在身后的群落（左） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="52" cy="128" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="64" cy="132" r="3.5" fill="#D0B888" stroke="#B09868" stroke-width="0.5"/>
    <circle cx="44" cy="133" r="3" fill="#C0A070" stroke="#A88858" stroke-width="0.5"/>
  </g>

  <!-- 护群的岩甲犀（中，展甲如墙） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 展甲的岩墙（弧形） -->
    <path d="M 76 148 Q 92 96 120 148 Z" fill="#A09078" stroke="#6E5A46" stroke-width="1" opacity="0.5"/>
    <!-- 岩皮身（大） -->
    <ellipse cx="98" cy="122" rx="18" ry="14" fill="url(#rock)" stroke="#5E4A36" stroke-width="1"/>
    <!-- 岩甲纹 -->
    <path d="M 82 114 Q 98 108 114 114" stroke="#B0A088" stroke-width="1.3" fill="none" opacity="0.8"/>
    <path d="M 84 130 Q 98 124 112 130" stroke="#B0A088" stroke-width="1.1" fill="none" opacity="0.7"/>
    <!-- 头（顶向前） -->
    <ellipse cx="98" cy="108" rx="11" ry="10" fill="url(#rock)" stroke="#5E4A36" stroke-width="0.9"/>
    <!-- 岩角（如峰） -->
    <path d="M 102 102 L 106 88 L 110 102 Z" fill="#B0A088" stroke="#5E4A36" stroke-width="0.7"/>
    <!-- 眼（含威含护） -->
    <circle cx="93" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="93.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="103" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="103.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 106 111 L 110 111 L 108 113.5 Z" fill="#5E4A36"/>
    <!-- 嘴（定） -->
    <path d="M 107 115 Q 109 116.4 111 115" fill="none" stroke="#4E3A28" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 腿（如柱） -->
    <path d="M 84 132 L 79 142" stroke="#88705A" stroke-width="4" stroke-linecap="round"/>
    <path d="M 112 132 L 117 142" stroke="#88705A" stroke-width="4" stroke-linecap="round"/>
    <!-- 挡石震光 -->
    <circle cx="116" cy="104" r="3" fill="#D8D0B8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#D8E0C8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
