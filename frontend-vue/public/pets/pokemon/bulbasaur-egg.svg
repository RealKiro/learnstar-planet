<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妙蛙种子·一阶·种子之芽">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FC8A0"/><stop offset="100%" stop-color="#6EA884"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9A72"/><stop offset="100%" stop-color="#2E7A52"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0D8"/><stop offset="100%" stop-color="#9AD8B0"/>
    </linearGradient>
    <g id="bb-head">
      <circle cx="0" cy="0" r="29" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.4"/>
      <circle cx="-11" cy="-14" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="12" cy="-13" r="2.5" fill="#E85A5A" opacity="0.8"/>
      <circle cx="-11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.4" r="3" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.4" r="3" fill="#FFF"/>
      <ellipse cx="0" cy="6" rx="1.8" ry="1.4" fill="#1E4E3A"/>
      <path d="M -6 12 Q 0 16 6 12" fill="none" stroke="#1E4E3A" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="66" r="70" fill="#FFF8C0" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 160 Q 50 154 100 160 Q 150 166 200 160 L 200 200 L 0 200 Z" fill="#4E8E6E"/>
  <g stroke="#3E7A5E" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 34 150 Q 32 144 30 138 M 42 152 Q 42 146 42 140"/>
  </g>
  <g transform="translate(100,118) scale(0.9)">
    <animateTransform attributeName="transform" type="translate" values="100 118;100 115;100 118" dur="2.4s" repeatCount="indefinite"/>
    <!-- 尾巴（短） -->
    <path d="M -18 8 Q -28 10 -32 16" stroke="#2E6A4E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M -34 14 L -30 20 L -38 18 Z" fill="#4E9A72"/>
    <!-- 背上的种子苞（含蕾） -->
    <ellipse cx="14" cy="-14" rx="11" ry="12" fill="#3E8A62" stroke="#2E6A4E" stroke-width="1.2"/>
    <path d="M 18 -22 Q 14 -28 20 -30" stroke="#5EB88A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="4" rx="32" ry="28" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.3"/>
    <ellipse cx="0" cy="13" rx="19" ry="13" fill="url(#belly)" opacity="0.9"/>
    <circle cx="-8" cy="20" r="2.6" fill="#E85A5A" opacity="0.7"/>
    <circle cx="8" cy="21" r="2.6" fill="#E85A5A" opacity="0.7"/>
    <ellipse cx="-13" cy="28" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <ellipse cx="13" cy="28" rx="6" ry="4" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <use href="#bb-head" transform="translate(0,-30) scale(0.95)"/>
  </g>
</svg>
