<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="岩甲犀·二阶·甲裂之痛·硬顶大落石岩甲裂痕护住小兽看裂甲">
  <defs>
    <!-- 背景：山岭 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88989A"/>
      <stop offset="52%" stop-color="#9AA8A0"/>
      <stop offset="100%" stop-color="#78886C"/>
    </linearGradient>
    <!-- 弱岭光 -->
    <radialGradient id="glow" cx="50%" cy="34%" r="44%">
      <stop offset="0%" stop-color="#D8E0C8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D8E0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 岩皮 -->
    <radialGradient id="rock" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#9A8A72"/>
      <stop offset="100%" stop-color="#7A644E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="68" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.34;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 大落石（右，被顶住） -->
  <g>
    <path d="M 138 84 L 158 76 L 162 92 L 146 98 Z" fill="#8E7A64" stroke="#6E5A46" stroke-width="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 2;0 0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#78886C" opacity="0.9"/>

  <!-- 被护住的小兽（左后） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="62" cy="128" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="60" cy="126.8" r="1" fill="#2E2A24"/>
    <circle cx="65" cy="126.8" r="1" fill="#2E2A24"/>
  </g>

  <!-- 甲裂的小岩甲犀（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 岩皮身 -->
    <ellipse cx="92" cy="132" rx="15" ry="12" fill="url(#rock)" stroke="#5E4A36" stroke-width="0.9"/>
    <!-- 甲裂痕 -->
    <path d="M 84 122 L 88 128 L 86 134 L 92 138" stroke="#4E3A28" stroke-width="1.2" stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 124 L 104 129" stroke="#4E3A28" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- 岩甲纹 -->
    <path d="M 80 128 Q 92 124 104 128" stroke="#8E7A64" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- 头 -->
    <ellipse cx="92" cy="120" rx="9" ry="8" fill="url(#rock)" stroke="#5E4A36" stroke-width="0.8"/>
    <!-- 岩角（钝） -->
    <path d="M 96 115 L 99 107 L 102 115 Z" fill="#8E7A64" stroke="#5E4A36" stroke-width="0.6"/>
    <!-- 眼（含痛含坚） -->
    <circle cx="88" cy="119" r="2.2" fill="#2E2A24"/>
    <circle cx="88.8" cy="117.8" r="0.9" fill="#FFF"/>
    <circle cx="97" cy="119" r="2.2" fill="#2E2A24"/>
    <circle cx="97.8" cy="117.8" r="0.9" fill="#FFF"/>
    <circle cx="89" cy="118.5" r="1" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 鼻 -->
    <path d="M 100 123 L 103 123 L 101.5 125 Z" fill="#5E4A36"/>
    <!-- 嘴（咬） -->
    <path d="M 99 126 Q 101 124.6 103 126" fill="none" stroke="#4E3A28" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 82 140 L 78 146" stroke="#7A644E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 102 140 L 106 146" stroke="#7A644E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#D8E0C8" opacity="0.35">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
