<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·二阶·火熄之惧">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4A5E"/><stop offset="100%" stop-color="#1E2A3C"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0803A"/><stop offset="100%" stop-color="#CE5A1E"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0C888"/>
    </linearGradient>
    <g id="ch-head">
      <circle cx="0" cy="0" r="29" fill="url(#fur)" stroke="#B84E16" stroke-width="1.4"/>
      <ellipse cx="0" cy="9" rx="13" ry="8" fill="url(#belly)" opacity="0.85"/>
      <circle cx="-11" cy="-2" r="7.4" fill="#2B2B2B"/>
      <circle cx="-9.2" cy="-4.2" r="2.8" fill="#FFF"/>
      <circle cx="11" cy="-2" r="7.4" fill="#2B2B2B"/>
      <circle cx="12.8" cy="-4.2" r="2.8" fill="#FFF"/>
      <ellipse cx="0" cy="4" rx="1.6" ry="1.1" fill="#5A3A20"/>
      <path d="M -6 9 Q -3 12 0 9 Q 3 12 6 9" fill="none" stroke="#5A3A20" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <g stroke="#FDE68A" stroke-width="2.4" opacity="0.85" stroke-linecap="round" fill="none">
    <path d="M 26 32 L 38 52 L 30 58 L 48 78"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M 166 28 L 154 48 L 162 56 L 146 74"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="1.8s" repeatCount="indefinite"/></path>
  </g>
  <g stroke="#A8BCD0" stroke-width="1.6" opacity="0.6" stroke-linecap="round">
    <line x1="44" y1="90" x2="40" y2="106"><animate attributeName="y1" values="90;100;90" dur="0.6s" repeatCount="indefinite"/></line>
    <line x1="74" y1="84" x2="70" y2="98"><animate attributeName="y1" values="84;94;84" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="132" y1="86" x2="128" y2="102"><animate attributeName="y1" values="86;96;86" dur="0.55s" repeatCount="indefinite"/></line>
  </g>
  <path d="M 0 166 Q 50 158 100 166 Q 150 174 200 166 L 200 200 L 0 200 Z" fill="#2A3850"/>
  <g transform="translate(102,118) scale(0.86)">
    <animateTransform attributeName="transform" type="translate" values="102 118;102 115;102 118" dur="1.8s" repeatCount="indefinite"/>
    <!-- 蜷身护焰：尾焰微弱但护着 -->
    <path d="M 28 -6 Q 46 -4 50 -18 Q 46 -28 36 -26 Q 30 -18 32 -10 Z" fill="#E86A2A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 0.7;1 1" dur="0.8s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 45 -16 Q 49 -22 42 -24 Q 38 -18 39 -13 Z" fill="#F8C858"/>
    <path d="M 16 -4 Q 24 -6 30 -8" stroke="#B84E16" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="3" rx="30" ry="26" fill="url(#fur)" stroke="#B84E16" stroke-width="1.3"/>
    <ellipse cx="0" cy="11" rx="18" ry="12" fill="url(#belly)" opacity="0.9"/>
    <path d="M 0 -21 L 2 -15 M 6 -21 L 7 -15 M -4 -21 L -3 -15" stroke="#B84E16" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="-11" cy="25" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <ellipse cx="11" cy="25" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <use href="#ch-head" transform="translate(0,-29) scale(0.95)"/>
  </g>
</svg>
