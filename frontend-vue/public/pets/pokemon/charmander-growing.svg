<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·三阶·燃火苦修">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A3E"/><stop offset="100%" stop-color="#1E1422"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0823C"/><stop offset="100%" stop-color="#D66220"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F2CE96"/>
    </linearGradient>
    <g id="ch-head">
      <circle cx="0" cy="0" r="29" fill="url(#fur)" stroke="#B84E16" stroke-width="1.4"/>
      <ellipse cx="0" cy="9" rx="13" ry="8" fill="url(#belly)" opacity="0.85"/>
      <circle cx="-11" cy="-2" r="7.4" fill="#2B2B2B"/>
      <circle cx="-9.2" cy="-4.2" r="2.8" fill="#FFF"/>
      <circle cx="11" cy="-2" r="7.4" fill="#2B2B2B"/>
      <circle cx="12.8" cy="-4.2" r="2.8" fill="#FFF"/>
      <ellipse cx="0" cy="4" rx="1.6" ry="1.1" fill="#5A3A20"/>
      <path d="M -7 9 L -3 6 L 0 9 L 3 6 L 7 9" fill="none" stroke="#5A3A20" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <path d="M 0 176 L 200 176 L 200 200 L 0 200 Z" fill="#2A202A"/>
  <path d="M 40 176 L 48 108 L 62 108 L 58 176 Z" fill="#4E3A2C" stroke="#382818" stroke-width="1.5"/>
  <path d="M 30 120 Q 55 108 80 120 Q 55 132 30 120 Z" fill="#6E5A44"/>
  <g stroke="#F8C858" stroke-width="2.6" opacity="0.95" stroke-linecap="round" fill="none">
    <path d="M 36 100 L 50 90 L 44 80 L 60 68"><animate attributeName="opacity" values="0.95;0.4;0.95" dur="1s" repeatCount="indefinite"/></path>
  </g>
  <g transform="translate(112,118) scale(0.95)">
    <animateTransform attributeName="transform" type="translate" values="112 118;112 114;112 118" dur="1.5s" repeatCount="indefinite"/>
    <!-- 尾焰强盛 -->
    <path d="M 30 -6 Q 54 -4 60 -22 Q 54 -40 40 -36 Q 32 -24 36 -12 Z" fill="#E86A2A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.15;1 1" dur="0.5s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 52 -20 Q 60 -30 48 -34 Q 40 -26 44 -18 Z" fill="#F8C858"/>
    <path d="M 18 -4 Q 26 -6 32 -8" stroke="#B84E16" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="2" rx="32" ry="28" fill="url(#fur)" stroke="#B84E16" stroke-width="1.3"/>
    <ellipse cx="0" cy="11" rx="19" ry="13" fill="url(#belly)" opacity="0.9"/>
    <path d="M 0 -23 L 2 -17 M 6 -23 L 7 -17 M -4 -23 L -3 -17" stroke="#B84E16" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="-12" cy="26" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <ellipse cx="12" cy="26" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <use href="#ch-head" transform="translate(0,-31) scale(0.98)"/>
    <!-- 口中火焰 -->
    <g stroke="#F8C858" stroke-width="2" opacity="0.95" stroke-linecap="round" fill="none">
      <path d="M 28 8 L 38 4 M 30 14 L 40 12 M 28 20 L 36 22"><animate attributeName="opacity" values="0.95;0.4;0.95" dur="0.8s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <g fill="#F8C858">
    <circle cx="80" cy="52" r="1.6"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="72" r="1.2"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
