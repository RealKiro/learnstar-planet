<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="伊布·五阶·进化之路·进化矫健形态巡守草原叼果引兽挡危机">
  <defs>
    <!-- 背景：宝可梦草原夕光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AB8A0"/>
      <stop offset="52%" stop-color="#8AD0A0"/>
      <stop offset="100%" stop-color="#68B880"/>
    </linearGradient>
    <!-- 进化神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#F8F8D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8F8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 进化光环 -->
    <radialGradient id="halo" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#E8F0C8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8F0C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 进化毛色（明亮） -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#E8C078"/>
      <stop offset="100%" stop-color="#B88848"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="88" r="62" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 草地 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#68B880" opacity="0.9"/>

  <!-- 被引回的小宝可梦（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="118" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="56" cy="116.8" r="1" fill="#24180E"/>
    <circle cx="61" cy="116.8" r="1" fill="#24180E"/>
  </g>
  <!-- 叼的果（引兽） -->
  <circle cx="78" cy="110" r="2.5" fill="#E87858" stroke="#C85838" stroke-width="0.5"/>

  <!-- 危机（右，被挡） -->
  <g stroke="#5A7898" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 164 70 Q 172 82 168 94">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 172 74 Q 180 86 176 98" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 进化伊布（中，矫健巡守） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 长尾（如蓬，扬） -->
    <path d="M 78 118 Q 62 104 56 116 Q 52 130 64 136 Q 76 138 82 128 Z" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-4 78 118;4 78 118;-4 78 118" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 58 116 L 55 126" stroke="#E8D8B8" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <!-- 大耳（立，长） -->
    <path d="M 84 104 L 74 84 L 90 98 Z" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 110 104 L 120 84 L 104 98 Z" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 84 98 L 78 88" stroke="#E8D8B8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 110 98 L 116 88" stroke="#E8D8B8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 身（矫健修长） -->
    <ellipse cx="96" cy="116" rx="16" ry="11" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <ellipse cx="94" cy="122" rx="9" ry="5" fill="#F0E4D0" opacity="0.8"/>
    <!-- 头 -->
    <ellipse cx="96" cy="104" rx="10" ry="9" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 101 108 Q 107 108 109 106 Q 107 112 101 112 Z" fill="#F0E4D0" stroke="#D0C0A8" stroke-width="0.6"/>
    <!-- 眼（含威含温） -->
    <circle cx="92" cy="103" r="2.6" fill="#2E2A24"/>
    <circle cx="92.8" cy="101.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="103" r="2.6" fill="#2E2A24"/>
    <circle cx="101.8" cy="101.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 107 107 L 105 109.5 L 109 109.5 Z" fill="#8E6838"/>
    <!-- 嘴（定） -->
    <path d="M 104 112 Q 106 113.4 108 112" fill="none" stroke="#8E6838" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 额饰（进化） -->
    <circle cx="96" cy="96" r="2.5" fill="#F8F8D8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 前爪（挡危机） -->
    <path d="M 110 114 L 124 108" stroke="#B88848" stroke-width="2.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 110 114;5 110 114;-5 110 114" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- 后爪 -->
    <path d="M 82 122 L 76 130" stroke="#B88848" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#F8F8D8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
