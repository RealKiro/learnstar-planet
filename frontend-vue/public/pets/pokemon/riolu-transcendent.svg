<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="利欧路·六阶·利欧路传说·暮光尾轻碰小利欧路传先稳己心暖人心">
  <defs>
    <!-- 背景：宝可梦山谷暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#9EA890"/>
      <stop offset="100%" stop-color="#5A7AA8"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑蓝身形 -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#5A6A8A"/>
      <stop offset="100%" stop-color="#36465E"/>
    </radialGradient>
    <!-- 波导光 -->
    <radialGradient id="wave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68D8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#68D8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 山谷 -->
  <g fill="#4A6A88" opacity="0.5">
    <path d="M 0 126 Q 50 112 100 124 Q 160 134 200 118 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#6A8AB0" opacity="0.9"/>

  <!-- 安睡的伙伴（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="90" cy="134.8" r="1" fill="#24180E"/>
    <circle cx="95" cy="134.8" r="1" fill="#24180E"/>
    <path d="M 88 135 Q 90 133.6 92 135" stroke="#7A90A8" stroke-width="0.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 小利欧路（右，胸前波导微亮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M 138 118 L 133 108 L 143 113 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.6"/>
    <path d="M 152 118 L 157 108 L 147 113 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.6"/>
    <ellipse cx="144" cy="124" rx="10" ry="8.5" fill="url(#body)" stroke="#2E3E58" stroke-width="0.7"/>
    <ellipse cx="144" cy="118" rx="7" ry="6" fill="url(#body)" stroke="#2E3E58" stroke-width="0.6"/>
    <circle cx="141" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="141.8" cy="116.2" r="0.7" fill="#FFF"/>
    <circle cx="148" cy="117" r="1.8" fill="#2E2A24"/>
    <circle cx="148.8" cy="116.2" r="0.7" fill="#FFF"/>
    <circle cx="144" cy="126" r="2.6" fill="url(#wave)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="144" cy="126" r="4.5" fill="#68D8F8" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M 136 130 L 133 134" stroke="#3E4E6E" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 152 130 L 155 134" stroke="#3E4E6E" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 老利欧路（左，尾轻碰小利欧路） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 头冠（古） -->
    <path d="M 72 100 Q 78 88 84 100" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.5"/>
    <!-- 尖耳 -->
    <path d="M 62 104 L 52 88 L 68 100 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.7"/>
    <path d="M 84 104 L 94 88 L 78 100 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.7"/>
    <path d="M 62 99 L 57 91" stroke="#68D8F8" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
    <path d="M 84 99 L 89 91" stroke="#68D8F8" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
    <!-- 尾（伸向小利欧路） -->
    <path d="M 78 120 Q 96 114 110 118" stroke="#36465E" stroke-width="2.6" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-3 78 120;3 78 120;-3 78 120" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 身（大） -->
    <ellipse cx="78" cy="122" rx="15" ry="12" fill="url(#body)" stroke="#22324E" stroke-width="0.9"/>
    <!-- 头 -->
    <ellipse cx="78" cy="108" rx="10" ry="9" fill="url(#body)" stroke="#22324E" stroke-width="0.8"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 73 107 Q 75 105.6 77 107" stroke="#1E2A38" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 83 107 Q 85 105.6 86 107" stroke="#1E2A38" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 75 112 Q 78 113.6 81 112" fill="none" stroke="#8EA8C0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 胸前波导（泛岁月光） -->
    <circle cx="78" cy="120" r="4" fill="url(#wave)">
      <animate attributeName="opacity" values="1;0.72;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="78" cy="120" r="7" fill="#68D8F8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.15;0.28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 尾碰传 -->
    <path d="M 88 116 Q 104 112 122 116" stroke="#68D8F8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="120" cy="116" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
