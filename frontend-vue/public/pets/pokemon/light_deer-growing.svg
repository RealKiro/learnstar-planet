<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="晨曦鹿·三阶·练光苦修·雾里练亮角光聚成束破开薄雾照亮路径">
  <defs>
    <!-- 背景：雾林晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D0A0"/>
      <stop offset="52%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#A8C878"/>
    </linearGradient>
    <!-- 晨光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 栗色毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#C89868"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
    <!-- 角光 -->
    <radialGradient id="horn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雾 -->
  <g fill="#F8F0DC" opacity="0.5">
    <ellipse cx="56" cy="138" rx="28" ry="9"/>
    <ellipse cx="150" cy="144" rx="32" ry="10"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#A8C878" opacity="0.9"/>

  <!-- 被破开的雾（右，光路） -->
  <g stroke="#FFF8D8" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 126 108 Q 140 116 152 126">
      <animate attributeName="opacity" values="0.5;0.24;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年晨曦鹿（中，角光聚束） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 角（光聚） -->
    <path d="M 90 100 L 82 88 L 87 91 L 84 80 L 89 88 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 104 100 L 112 88 L 107 91 L 110 80 L 105 88 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <circle cx="84" cy="82" r="4" fill="url(#horn)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="82" r="4" fill="url(#horn)">
      <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="97" cy="86" r="5" fill="#FFF8D8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.18;0.35" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳 -->
    <path d="M 88 106 L 82 100 L 90 102 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 106 106 L 112 100 L 104 102 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <!-- 身 -->
    <ellipse cx="97" cy="120" rx="14" ry="11" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <ellipse cx="95" cy="126" rx="8" ry="5" fill="#F0E4D0" opacity="0.7"/>
    <!-- 短尾 -->
    <path d="M 84 122 Q 78 122 78 126" stroke="#C89868" stroke-width="2" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="97" cy="106" rx="9" ry="8" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 101 110 Q 106 110 108 108 Q 106 114 101 114 Z" fill="#F0E4D0" stroke="#D0C0A8" stroke-width="0.5"/>
    <!-- 眼（专注） -->
    <circle cx="93" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="93.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="102" cy="105" r="2.4" fill="#2E2A24"/>
    <circle cx="102.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 106 109 L 104 111 L 108 111 Z" fill="#8E6838"/>
    <!-- 嘴（定） -->
    <path d="M 105 114 Q 107 115.4 109 114" fill="none" stroke="#8E6838" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 86 128 L 83 135" stroke="#A87848" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 108 128 L 111 135" stroke="#A87848" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF8D8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
