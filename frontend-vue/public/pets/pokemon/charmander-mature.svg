<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="小火龙·四阶·火焰护伴">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A3C"/><stop offset="100%" stop-color="#121A28"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0843E"/><stop offset="100%" stop-color="#D86624"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F2CE96"/>
    </linearGradient>
    <g id="ch-head">
      <circle cx="0" cy="0" r="30" fill="url(#fur)" stroke="#B84E16" stroke-width="1.4"/>
      <ellipse cx="0" cy="9" rx="13" ry="8" fill="url(#belly)" opacity="0.85"/>
      <circle cx="-11" cy="-2" r="7.6" fill="#2B2B2B"/>
      <circle cx="-9.2" cy="-4.2" r="2.9" fill="#FFF"/>
      <circle cx="11" cy="-2" r="7.6" fill="#2B2B2B"/>
      <circle cx="12.8" cy="-4.2" r="2.9" fill="#FFF"/>
      <ellipse cx="0" cy="4" rx="1.6" ry="1.1" fill="#5A3A20"/>
      <path d="M -8 9 L -4 5 L 0 9 L 4 5 L 8 9" fill="none" stroke="#5A3A20" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 夜路火光 -->
  <circle cx="86" cy="112" r="76" fill="#F8C858" opacity="0.13">
    <animate attributeName="opacity" values="0.13;0.07;0.13" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#2A3A52" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 168 30 L 172 150 M 156 50 L 158 150"/>
  </g>
  <path d="M 0 154 L 200 154 L 200 200 L 0 200 Z" fill="#1E2838" opacity="0.9"/>
  <!-- 同伴（被护，安然） -->
  <g transform="translate(40,132)" opacity="0.9">
    <ellipse cx="0" cy="6" rx="8" ry="6" fill="#5E8E6E"/>
    <circle cx="0" cy="-2" r="6" fill="#6EA87E"/>
    <circle cx="-2.6" cy="-2" r="1.2" fill="#24180E"/>
    <circle cx="2.6" cy="-2" r="1.2" fill="#24180E"/>
  </g>
  <g transform="translate(98,120) scale(1.0)">
    <animateTransform attributeName="transform" type="translate" values="98 120;98 116;98 120" dur="1.5s" repeatCount="indefinite"/>
    <path d="M 28 -6 Q 52 -4 58 -20 Q 54 -36 40 -34 Q 32 -22 34 -12 Z" fill="#E86A2A">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.15;1 1" dur="0.5s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 50 -18 Q 58 -28 46 -32 Q 38 -24 42 -16 Z" fill="#F8C858"/>
    <path d="M 17 -4 Q 25 -6 31 -8" stroke="#B84E16" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="2" rx="33" ry="29" fill="url(#fur)" stroke="#B84E16" stroke-width="1.4"/>
    <ellipse cx="0" cy="12" rx="20" ry="14" fill="url(#belly)" opacity="0.9"/>
    <path d="M 0 -24 L 2 -18 M 6 -24 L 7 -18 M -4 -24 L -3 -18" stroke="#B84E16" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="-12" cy="27" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <ellipse cx="12" cy="27" rx="7" ry="5" fill="url(#fur)" stroke="#B84E16" stroke-width="1"/>
    <use href="#ch-head" transform="translate(0,-32) scale(1)"/>
    <!-- 火焰照路 -->
    <g stroke="#F8C858" stroke-width="2.6" opacity="0.95" stroke-linecap="round" fill="none">
      <path d="M 26 6 L 44 -4 L 38 -12 L 60 -20"><animate attributeName="opacity" values="0.95;0.45;0.95" dur="0.9s" repeatCount="indefinite"/></path>
    </g>
  </g>
</svg>
