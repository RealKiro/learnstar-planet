<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="皮卡丘·三阶·电系苦修·对树桩放电双颊噼啪">
  <defs>
    <!-- 背景：夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4E68"/>
      <stop offset="52%" stop-color="#2E4058"/>
      <stop offset="100%" stop-color="#263650"/>
    </linearGradient>
    <!-- 电光 -->
    <radialGradient id="glow" cx="48%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#FFF8C0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFF8C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 奶黄短毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0BC38"/>
      <stop offset="100%" stop-color="#D8A820"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="96" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.75;0.5;0.75" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 夜林剪影 -->
  <g stroke="#2A3A52" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 14 44 L 6 160 M 30 52 L 22 160 M 176 40 L 186 160"/>
  </g>
  <!-- 远处雷云（立志方向） -->
  <g fill="#4A5E78" opacity="0.8">
    <path d="M 130 40 Q 144 34 158 40 Q 170 38 178 46 L 130 46 Z"/>
  </g>
  <g stroke="#F8F8A0" stroke-width="1" opacity="0.5">
    <path d="M 150 46 L 156 54 L 152 54 L 158 62">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#1E2C44" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#4A5E78" stroke-width="1.2" opacity="0.5"/>

  <!-- 树桩（放电目标，右） -->
  <path d="M 122 132 L 142 126 L 146 148 L 122 148 Z" fill="#6E624E" stroke="#5A4E3C" stroke-width="1"/>
  <ellipse cx="134" cy="129" rx="12" ry="4" fill="#8E7E62" stroke="#5A4E3C" stroke-width="0.8"/>
  <!-- 电击痕迹 -->
  <path d="M 128 132 L 140 130" stroke="#4A3E2C" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- 放电电光（从双颊到树桩） -->
  <g stroke="#FFF8A0" stroke-width="1.6" opacity="0.85" stroke-linecap="round" fill="none">
    <path d="M 96 116 L 108 124 L 104 124 L 116 132 L 110 132 L 122 138">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 108 110 L 114 118 L 111 118 L 120 124">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 电光星 -->
  <g fill="#FFF8A0">
    <circle cx="120" cy="126" r="1.4">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="120" r="1">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 皮丘（2头身，对树桩放电，绷紧发力） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="1.4s" repeatCount="indefinite"/>
    <!-- 尾巴（闪电，尾尖火花） -->
    <path d="M 58 128 Q 46 122 40 112 Q 38 108 34 108 L 37 114 L 32 114 L 38 122 Q 44 130 56 134 Z" fill="url(#fur)" stroke="#B89018" stroke-width="0.8"/>
    <g stroke="#F8A838" stroke-width="1.2" opacity="0.8">
      <path d="M 34 106 L 32 102 M 36 104 L 36 100">
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 身体（圆球，绷紧发力） -->
    <ellipse cx="70" cy="122" rx="16" ry="14" fill="url(#fur)" stroke="#B89018" stroke-width="1"/>
    <!-- 背部深棕纹 -->
    <path d="M 68 108 Q 70 112 70 116" stroke="#8E6E3E" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- 双颊电囊（噼啪） -->
    <circle cx="59" cy="128" r="5" fill="#E86A4A"/>
    <circle cx="81" cy="128" r="5" fill="#E86A4A"/>
    <!-- 双颊噼啪电光 -->
    <g stroke="#FFF8A0" stroke-width="1.4" opacity="0.9" stroke-linecap="round" fill="none">
      <path d="M 54 126 L 49 124 M 55 131 L 50 133 M 86 126 L 91 124 M 85 131 L 90 133">
        <animate attributeName="opacity" values="0.9;0.35;0.9" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 小短腿（发力撑地） -->
    <path d="M 62 134 L 60 144 M 78 134 L 80 144" stroke="#B89018" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 头（专注，望树桩） -->
  <g>
    <ellipse cx="70" cy="98" rx="13.5" ry="12.5" fill="url(#fur)" stroke="#B89018" stroke-width="1"/>
    <!-- 双耳（立起） -->
    <path d="M 59 90 Q 52 78 48 70 Q 52 76 56 86 Z" fill="url(#fur)" stroke="#B89018" stroke-width="0.8"/>
    <circle cx="50" cy="73" r="2.5" fill="#D8A820"/>
    <path d="M 81 90 Q 88 78 92 70 Q 88 76 84 86 Z" fill="url(#fur)" stroke="#B89018" stroke-width="0.8"/>
    <circle cx="90" cy="73" r="2.5" fill="#D8A820"/>
    <!-- 黑豆圆眼（专注） -->
    <circle cx="63" cy="98" r="3.4" fill="#24180E"/>
    <circle cx="63.7" cy="97.3" r="1.1" fill="#FFF"/>
    <circle cx="77" cy="98" r="3.4" fill="#24180E"/>
    <circle cx="77.7" cy="97.3" r="1.1" fill="#FFF"/>
    <!-- 小鼻尖 -->
    <ellipse cx="70" cy="103" rx="1.6" ry="1.2" fill="#8E6E3E"/>
    <!-- 抿唇（发力） -->
    <path d="M 66 107 Q 70 108.6 74 107" fill="none" stroke="#8E6E3E" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- 夜电星尘 -->
  <g fill="#FFF8C0">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
