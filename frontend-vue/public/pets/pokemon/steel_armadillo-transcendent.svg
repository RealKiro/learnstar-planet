<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="磁甲兽·六阶·磁甲兽传说·暮光甲尖碰小磁甲兽传硬壳暖的是护心">
  <defs>
    <!-- 背景：铁原暮色 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8B088"/>
      <stop offset="52%" stop-color="#9EA890"/>
      <stop offset="100%" stop-color="#788890"/>
    </linearGradient>
    <!-- 暮霞金 -->
    <radialGradient id="glow" cx="50%" cy="26%" r="54%">
      <stop offset="0%" stop-color="#FFF0D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF0D0" stop-opacity="0"/>
    </radialGradient>
    <!-- 传说余晖 -->
    <radialGradient id="halo" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#F0E8C8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0E8C8" stop-opacity="0"/>
    </radialGradient>
    <!-- 钢蓝甲 -->
    <radialGradient id="armor" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#7A9AC0"/>
      <stop offset="100%" stop-color="#46668E"/>
    </radialGradient>
    <!-- 磁光 -->
    <radialGradient id="mag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="108" r="60" fill="url(#halo)">
    <animate attributeName="opacity" values="0.35;0.22;0.35" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 铁原 -->
  <g fill="#6E7E88" opacity="0.5">
    <path d="M 0 142 Q 60 134 120 140 Q 170 144 200 136 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 150 L 200 150 L 200 200 L 0 200 Z" fill="#788890" opacity="0.9"/>

  <!-- 安然的群落（下） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="92" cy="136" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="104" cy="140" r="3.5" fill="#D0B888" stroke="#B09868" stroke-width="0.5"/>
  </g>

  <!-- 小磁甲兽（右，甲初合） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <ellipse cx="144" cy="122" rx="11" ry="9" fill="url(#armor)" stroke="#3E5E86" stroke-width="0.7"/>
    <path d="M 135 116 Q 144 112 153 116" stroke="#8AA8CC" stroke-width="1" fill="none" opacity="0.7"/>
    <ellipse cx="144" cy="114" rx="7" ry="6" fill="url(#armor)" stroke="#3E5E86" stroke-width="0.6"/>
    <path d="M 151 114 L 155 112.5 L 151 117 Z" fill="#3E5E86"/>
    <circle cx="141" cy="113" r="1.8" fill="#2E2A24"/>
    <circle cx="141.8" cy="112.2" r="0.7" fill="#FFF"/>
    <circle cx="149" cy="113" r="1.8" fill="#2E2A24"/>
    <circle cx="149.8" cy="112.2" r="0.7" fill="#FFF"/>
    <path d="M 152 117 Q 154 118.4 156 117" fill="none" stroke="#3E5E86" stroke-width="0.4" stroke-linecap="round"/>
    <path d="M 136 128 L 133 132" stroke="#46668E" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 152 128 L 155 132" stroke="#46668E" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 老磁甲兽（左，甲尖碰小磁甲兽） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="76" cy="112" r="26" fill="#F0E8C8" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.09;0.16" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 甲身（大，泛岁月光） -->
    <ellipse cx="80" cy="120" rx="18" ry="14" fill="url(#armor)" stroke="#2E4E76" stroke-width="1"/>
    <!-- 甲纹（如古铁） -->
    <path d="M 64 112 Q 80 104 96 112" stroke="#A0BCDC" stroke-width="1.3" fill="none" opacity="0.7"/>
    <path d="M 66 128 Q 80 120 94 128" stroke="#A0BCDC" stroke-width="1.1" fill="none" opacity="0.6"/>
    <path d="M 76 108 L 76 116 M 86 108 L 86 116" stroke="#A0BCDC" stroke-width="0.8" fill="none" opacity="0.5"/>
    <!-- 甲尖（伸向小磁甲兽） -->
    <path d="M 88 112 L 112 108" stroke="#46668E" stroke-width="2.6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-3 88 112;3 88 112;-3 88 112" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <!-- 头 -->
    <ellipse cx="84" cy="106" rx="10" ry="9" fill="url(#armor)" stroke="#2E4E76" stroke-width="0.8"/>
    <path d="M 92 106 L 96 104.5 L 92 109 Z" fill="#2E4E76"/>
    <!-- 眼（温和，目含慈） -->
    <path d="M 79 105 Q 81 103.6 83 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 88 105 Q 90 103.6 91 105" stroke="#2E2A24" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（慈） -->
    <path d="M 93 108 Q 95 109.4 97 108" fill="none" stroke="#2E4E76" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 磁光（泛古辉） -->
    <circle cx="80" cy="118" r="3" fill="url(#mag)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="118" r="5.5" fill="#C8E8F8" opacity="0.28">
      <animate attributeName="opacity" values="0.28;0.15;0.28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 短腿 -->
    <path d="M 66 130 L 60 140" stroke="#46668E" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 94 130 L 100 140" stroke="#46668E" stroke-width="3.4" stroke-linecap="round"/>
    <!-- 甲尖碰传 -->
    <path d="M 94 108 Q 110 106 128 110" stroke="#C8E8F8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- 传心微光 -->
    <circle cx="124" cy="108" r="10" fill="#FFF0D0" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.14;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 暮色星尘 -->
  <g fill="#FFF0D0">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;72;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
