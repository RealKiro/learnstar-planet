<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="磁甲兽·三阶·炼甲苦修·甲收如盾展如墙收放自如磁光吸走铁器">
  <defs>
    <!-- 背景：铁原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A9AA8"/>
      <stop offset="52%" stop-color="#9AA8B0"/>
      <stop offset="100%" stop-color="#788890"/>
    </linearGradient>
    <!-- 铁原光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#D8E0E8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D8E0E8" stop-opacity="0"/>
    </radialGradient>
    <!-- 钢蓝甲（亮） -->
    <radialGradient id="armor" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#86A6CC"/>
      <stop offset="100%" stop-color="#52729A"/>
    </radialGradient>
    <!-- 磁光 -->
    <radialGradient id="mag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;0.5;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 铁原 -->
  <g fill="#6E7E88" opacity="0.5">
    <path d="M 0 138 Q 60 130 120 136 Q 170 140 200 132 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#788890" opacity="0.9"/>

  <!-- 被吸走的危险铁器（右） -->
  <g>
    <path d="M 140 112 L 148 106 L 146 116 Z" fill="#8A9AA8" stroke="#6E7E88" stroke-width="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="136" cy="118" r="2" fill="#8A9AA8" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 -2;0 0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年磁甲兽（中，甲收如盾） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 甲身（如盾） -->
    <ellipse cx="96" cy="120" rx="17" ry="13" fill="url(#armor)" stroke="#3E5E86" stroke-width="1"/>
    <!-- 甲纹（如墙砖） -->
    <path d="M 80 112 Q 96 106 112 112" stroke="#8AA8CC" stroke-width="1.3" fill="none" opacity="0.8"/>
    <path d="M 82 126 Q 96 120 110 126" stroke="#8AA8CC" stroke-width="1.1" fill="none" opacity="0.7"/>
    <path d="M 88 108 L 88 116 M 104 108 L 104 116" stroke="#8AA8CC" stroke-width="0.8" fill="none" opacity="0.6"/>
    <!-- 甲亮斑 -->
    <circle cx="90" cy="114" r="1.5" fill="#C8E0F0" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.35;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="104" cy="126" r="1.3" fill="#C8E0F0" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 短尾（扬） -->
    <path d="M 80 124 Q 72 122 70 128" stroke="#52729A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse cx="96" cy="106" rx="10" ry="9" fill="url(#armor)" stroke="#3E5E86" stroke-width="0.8"/>
    <path d="M 104 106 L 108 104.5 L 104 109 Z" fill="#3E5E86"/>
    <!-- 眼（沉稳） -->
    <circle cx="92" cy="105" r="2.3" fill="#2E2A24"/>
    <circle cx="92.8" cy="103.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="105" r="2.3" fill="#2E2A24"/>
    <circle cx="101.8" cy="103.8" r="1" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 105 108 Q 107 109.4 109 108" fill="none" stroke="#3E5E86" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 磁光爪（吸铁器） -->
    <path d="M 106 114 L 126 106" stroke="#52729A" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 106 114;5 106 114;-5 106 114" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="128" cy="104" r="3.5" fill="url(#mag)">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="104" r="6" fill="#C8E8F8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.16;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 短腿 -->
    <path d="M 84 128 L 79 136" stroke="#52729A" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 108 128 L 113 136" stroke="#52729A" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#D8E0E8">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
