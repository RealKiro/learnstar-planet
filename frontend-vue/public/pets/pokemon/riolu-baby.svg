<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="利欧路·二阶·波导之伤·读深悲被情绪淹没波导紊乱倒地看胸前光颤">
  <defs>
    <!-- 背景：山谷影 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5A7A"/>
      <stop offset="52%" stop-color="#3A4A66"/>
      <stop offset="100%" stop-color="#5A7A94"/>
    </linearGradient>
    <!-- 波导乱光 -->
    <radialGradient id="glow" cx="44%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#68D8F8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#68D8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑蓝身形 -->
    <radialGradient id="body" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#4E5E7E"/>
      <stop offset="100%" stop-color="#2E3E58"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="72" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 混乱的情绪波 -->
  <g stroke="#68D8F8" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 120 60 Q 130 70 124 80">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 132 54 Q 142 64 136 74" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#3A4A66" opacity="0.9"/>

  <!-- 慌忙扶它的伙伴（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.8s" repeatCount="indefinite"/>
    <circle cx="142" cy="128" r="4.5" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="140" cy="126.8" r="1.1" fill="#24180E"/>
    <circle cx="145" cy="126.8" r="1.1" fill="#24180E"/>
    <path d="M 136 132 Q 130 134 128 138" stroke="#5AA8C8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 波导紊乱倒地的小利欧路（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 头冠（垂） -->
    <path d="M 72 108 Q 74 102 78 108" fill="#3E4E6A" stroke="#22324E" stroke-width="0.4"/>
    <!-- 尖耳（垂） -->
    <path d="M 66 110 L 62 104 L 72 108 Z" fill="#3E4E6A" stroke="#22324E" stroke-width="0.6"/>
    <path d="M 84 110 L 88 104 L 78 108 Z" fill="#3E4E6A" stroke="#22324E" stroke-width="0.6"/>
    <!-- 身（倒地，颤） -->
    <ellipse cx="72" cy="134" rx="13" ry="10" fill="url(#body)" stroke="#22324E" stroke-width="0.9" transform="rotate(-12 72 134)"/>
    <!-- 头 -->
    <ellipse cx="72" cy="122" rx="9" ry="8" fill="url(#body)" stroke="#22324E" stroke-width="0.8" transform="rotate(-8 72 122)"/>
    <!-- 眼（含痛，闭） -->
    <path d="M 67 121 Q 69 119.6 71 121" stroke="#1E2A38" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <path d="M 76 121 Q 78 119.6 79 121" stroke="#1E2A38" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    <!-- 嘴（咬） -->
    <path d="M 70 125 Q 72 123.6 74 125" fill="none" stroke="#6E88A0" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 胸前波导（紊乱闪烁） -->
    <circle cx="72" cy="130" r="3" fill="#68D8F8" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="72" cy="130" r="5" fill="#68D8F8" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.08;0.2" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 爪（垂） -->
    <path d="M 62 138 L 58 142" stroke="#2E3E58" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 82 138 L 86 142" stroke="#2E3E58" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 尘灰 -->
  <g fill="#8EA8C0" opacity="0.3">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
