<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="皮卡丘·四阶·十万伏特·一记电光轰开坏蛋护同伴">
  <defs>
    <!-- 背景：夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5E7E"/>
      <stop offset="52%" stop-color="#3A4E6E"/>
      <stop offset="100%" stop-color="#2E4260"/>
    </linearGradient>
    <!-- 十万伏特电光 -->
    <radialGradient id="glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF8C0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF8C0" stop-opacity="0"/>
    </radialGradient>
    <!-- 奶黄短毛 -->
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0BC38"/>
      <stop offset="100%" stop-color="#D8A820"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- 电光照夜 -->
  <circle cx="86" cy="106" r="70" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.65;0.95" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 夜林剪影 -->
  <g stroke="#2A3A52" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 12 44 L 4 160 M 26 52 L 18 160"/>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#1E2C44" opacity="0.9"/>
  <path d="M 0 148 L 200 148" stroke="#4A5E78" stroke-width="1.2" opacity="0.5"/>

  <!-- 坏蛋（右，被十万伏特轰开，踉跄退） -->
  <g opacity="0.85">
    <path d="M 160 118 Q 158 128 160 140" stroke="#3E3E34" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 158 130 Q 152 126 150 122" stroke="#3E3E34" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="163" cy="112" r="4.4" fill="#4E4E42"/>
    <!-- 被电击的乱线 -->
    <g stroke="#E8E8B0" stroke-width="1" opacity="0.7" stroke-linecap="round">
      <path d="M 156 114 L 150 112 M 160 108 L 156 104 M 168 114 L 172 110">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M 160 138 Q 156 142 152 144" stroke="#3E3E34" stroke-width="2" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="translate" values="0 0;-2 0;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 十万伏特（粗壮闪电，从皮丘轰向右） -->
  <g stroke="#FFF8A0" stroke-width="3.2" opacity="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 104 100 L 118 104 L 112 108 L 128 112 L 120 116 L 138 118 L 128 122 L 146 120 L 138 126 L 156 122">
      <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g stroke="#FFF8A0" stroke-width="1.4" opacity="0.6" stroke-linecap="round" fill="none">
    <path d="M 108 94 L 116 100 L 112 102 L 124 106">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 电光星 -->
  <g fill="#FFF8A0">
    <circle cx="132" cy="112" r="1.6">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="144" cy="120" r="1.3">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 同伴（左，安然，看皮丘） -->
  <g opacity="0.85">
    <ellipse cx="40" cy="132" rx="7" ry="6" fill="#8EAE6E" stroke="#6E8E5E" stroke-width="0.8"/>
    <circle cx="40" cy="124" r="4.6" fill="#9EBE7E" stroke="#6E8E5E" stroke-width="0.7"/>
    <path d="M 38 123 Q 36 120 36 118" stroke="#9EBE7E" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="123" r="1.2" fill="#24180E"/>
    <circle cx="43" cy="123" r="1.2" fill="#24180E"/>
    <path d="M 40 126 Q 42 126.6 44 126" stroke="#6E8E5E" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    <path d="M 36 132 L 34 136 M 44 132 L 46 136" stroke="#6E8E5E" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- 皮丘（2头身，双颊电光迸发，咧嘴笑） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="1.4s" repeatCount="indefinite"/>
    <!-- 尾巴（闪电铮亮） -->
    <path d="M 52 128 Q 40 122 34 112 Q 32 108 28 108 L 31 114 L 26 114 L 32 122 Q 38 130 50 134 Z" fill="url(#fur)" stroke="#B89018" stroke-width="0.8"/>
    <g stroke="#FFF8A0" stroke-width="1.2" opacity="0.7">
      <path d="M 28 106 L 26 102 M 30 104 L 30 100">
        <animate attributeName="opacity" values="0.7;0.25;0.7" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 身体 -->
    <ellipse cx="66" cy="124" rx="16" ry="14" fill="url(#fur)" stroke="#B89018" stroke-width="1"/>
    <!-- 背部深棕纹 -->
    <path d="M 64 110 Q 66 114 66 118" stroke="#8E6E3E" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- 双颊电囊（迸发） -->
    <circle cx="55" cy="130" r="5.4" fill="#E86A4A"/>
    <circle cx="77" cy="130" r="5.4" fill="#E86A4A"/>
    <!-- 双颊电光迸发 -->
    <g stroke="#FFF8A0" stroke-width="1.6" opacity="0.95" stroke-linecap="round" fill="none">
      <path d="M 50 127 L 44 124 M 51 133 L 45 136 M 82 127 L 88 124 M 81 133 L 87 136">
        <animate attributeName="opacity" values="0.95;0.35;0.95" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- 小短腿 -->
    <path d="M 58 136 L 56 146 M 74 136 L 76 146" stroke="#B89018" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 头（咧嘴笑，电光迸发） -->
  <g>
    <ellipse cx="66" cy="100" rx="13.5" ry="12.5" fill="url(#fur)" stroke="#B89018" stroke-width="1"/>
    <!-- 双耳（立起） -->
    <path d="M 55 92 Q 48 80 44 72 Q 48 78 52 88 Z" fill="url(#fur)" stroke="#B89018" stroke-width="0.8"/>
    <circle cx="46" cy="75" r="2.5" fill="#D8A820"/>
    <path d="M 77 92 Q 84 80 88 72 Q 84 78 80 88 Z" fill="url(#fur)" stroke="#B89018" stroke-width="0.8"/>
    <circle cx="86" cy="75" r="2.5" fill="#D8A820"/>
    <!-- 黑豆圆眼（亮起） -->
    <circle cx="59" cy="100" r="3.4" fill="#24180E"/>
    <circle cx="59.7" cy="99.3" r="1.1" fill="#FFF"/>
    <circle cx="73" cy="100" r="3.4" fill="#24180E"/>
    <circle cx="73.7" cy="99.3" r="1.1" fill="#FFF"/>
    <!-- 小鼻尖 -->
    <ellipse cx="66" cy="105" rx="1.6" ry="1.2" fill="#8E6E3E"/>
    <!-- 咧嘴笑 -->
    <path d="M 61 109 Q 66 112 71 109" fill="none" stroke="#8E6E3E" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- 电光星尘 -->
  <g fill="#FFF8C0">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
