<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="妙蛙种子·六阶·花开传说">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8E8C0"/><stop offset="100%" stop-color="#78C89A"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9A72"/><stop offset="100%" stop-color="#2E7A52"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8F0D8"/><stop offset="100%" stop-color="#9AD8B0"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <g id="bb-head">
      <circle cx="0" cy="0" r="31" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.5"/>
      <circle cx="-11" cy="-14" r="2.6" fill="#E85A5A" opacity="0.8"/>
      <circle cx="12" cy="-13" r="2.6" fill="#E85A5A" opacity="0.8"/>
      <circle cx="-11" cy="-1" r="8.6" fill="#2B2B2B"/>
      <circle cx="-9" cy="-3.7" r="3.2" fill="#FFF"/>
      <circle cx="11" cy="-1" r="8.6" fill="#2B2B2B"/>
      <circle cx="13" cy="-3.7" r="3.2" fill="#FFF"/>
      <ellipse cx="0" cy="6" rx="1.9" ry="1.5" fill="#1E4E3A"/>
      <path d="M -8 12 L -4 8 L 0 12 L 4 8 L 8 12" fill="none" stroke="#1E4E3A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="96" r="90" fill="url(#aura)">
    <animate attributeName="opacity" values="1;0.65;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 172 Q 50 162 100 172 Q 150 182 200 172 L 200 200 L 0 200 Z" fill="#4E8E6E"/>
  <g fill="#F8A8C0" opacity="0.9">
    <ellipse cx="40" cy="166" rx="5" ry="4"/>
    <ellipse cx="164" cy="168" rx="5" ry="4"/>
    <ellipse cx="70" cy="176" rx="4" ry="3"/>
    <ellipse cx="140" cy="178" rx="4" ry="3"/>
  </g>
  <g transform="translate(100,128) scale(1.24)">
    <animateTransform attributeName="transform" type="translate" values="100 128;100 120;100 128" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -20 8 Q -31 10 -35 16" stroke="#2E6A4E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M -37 14 L -33 20 L -41 18 Z" fill="#4E9A72"/>
    <ellipse cx="0" cy="4" rx="40" ry="34" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1.5"/>
    <ellipse cx="0" cy="15" rx="25" ry="18" fill="url(#belly)" opacity="0.9"/>
    <circle cx="-10" cy="23" r="3.2" fill="#E85A5A" opacity="0.7"/>
    <circle cx="10" cy="24" r="3.2" fill="#E85A5A" opacity="0.7"/>
    <ellipse cx="-16" cy="33" rx="7" ry="5" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <ellipse cx="16" cy="33" rx="7" ry="5" fill="url(#skin)" stroke="#2E6A4E" stroke-width="1"/>
    <!-- 巨大的花（守护森林） -->
    <g transform="translate(16,-36)">
      <ellipse cx="0" cy="-6" rx="18" ry="6" fill="#5E8E5E"/>
      <path d="M -6 2 L -22 -20 L -8 -12 L 0 -30 L 8 -12 L 22 -20 L 6 2 Z" fill="#F8A8C0" stroke="#D87898" stroke-width="1.2"/>
      <path d="M -4 -12 L -14 -26 L -4 -20 L 0 -34 L 4 -20 L 14 -26 L 4 -12 Z" fill="#F8C8D8" opacity="0.9"/>
      <ellipse cx="0" cy="2" rx="9" ry="6" fill="#F8D8E0"/>
      <ellipse cx="0" cy="-10" rx="6" ry="2.4" fill="#F8E0C8"/>
    </g>
    <use href="#bb-head" transform="translate(0,-39) scale(1.08)"/>
    <path d="M 22 10 Q 38 2 46 -8" stroke="#3E8A62" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -22 12 Q -36 6 -42 -2" stroke="#3E8A62" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <g fill="#FFF8C0">
    <circle cx="50" cy="100" r="1.8"><animate attributeName="cy" values="100;86;100" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="154" cy="90" r="1.5"><animate attributeName="cy" values="90;76;90" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
