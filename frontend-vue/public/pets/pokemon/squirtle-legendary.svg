<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·五阶·水箭龟">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EB8E0"/><stop offset="100%" stop-color="#3E92BE"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E9ED8"/><stop offset="100%" stop-color="#2E7EBC"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCE8C8"/><stop offset="100%" stop-color="#F0CE96"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C89A5E"/><stop offset="100%" stop-color="#9A6E3E"/>
    </linearGradient>
    <g id="sq-head">
      <circle cx="0" cy="0" r="31" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.5"/>
      <circle cx="-12" cy="-1" r="8.6" fill="#2B2B2B"/>
      <circle cx="-10" cy="-3.7" r="3.2" fill="#FFF"/>
      <circle cx="12" cy="-1" r="8.6" fill="#2B2B2B"/>
      <circle cx="14" cy="-3.7" r="3.2" fill="#FFF"/>
      <ellipse cx="0" cy="5" rx="2" ry="1.5" fill="#1E4E7E"/>
      <path d="M -7 10 L -3 7 L 0 10 L 3 7 L 7 10" fill="none" stroke="#1E4E7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="96" r="78" fill="#E8F8FF" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.09;0.18" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M 0 170 Q 50 160 100 170 Q 150 180 200 170 L 200 200 L 0 200 Z" fill="#4E9EC8"/>
  <g transform="translate(100,124) scale(1.18)">
    <animateTransform attributeName="transform" type="translate" values="100 124;100 118;100 124" dur="1.8s" repeatCount="indefinite"/>
    <path d="M -22 16 Q -32 24 -28 34 Q -24 42 -16 38 Q -14 30 -20 26 Z" fill="#3E7EAC" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="10" cy="-4" rx="30" ry="28" fill="url(#shell)" stroke="#6E4A24" stroke-width="1.6"/>
    <path d="M 6 -22 Q 19 -10 14 14 Q 3 25 -9 10 Q -7 -11 6 -22 Z" fill="#B87E4E" opacity="0.6"/>
    <!-- 双炮管 -->
    <path d="M 0 -14 L -8 -30 L 4 -30 L 8 -14 Z" fill="#7E6A4E" stroke="#5E4A2E" stroke-width="1"/>
    <path d="M -12 -30 L -8 -36 L 2 -36 L 4 -30 Z" fill="#A88A5E" stroke="#5E4A2E" stroke-width="1"/>
    <path d="M 20 -14 L 14 -30 L 26 -30 L 24 -14 Z" fill="#7E6A4E" stroke="#5E4A2E" stroke-width="1"/>
    <path d="M 10 -30 L 14 -36 L 24 -36 L 26 -30 Z" fill="#A88A5E" stroke="#5E4A2E" stroke-width="1"/>
    <ellipse cx="-4" cy="4" rx="35" ry="31" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1.4"/>
    <ellipse cx="-4" cy="14" rx="21" ry="15" fill="url(#belly)" opacity="0.9"/>
    <ellipse cx="-17" cy="32" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <ellipse cx="10" cy="32" rx="7" ry="5" fill="url(#skin)" stroke="#1E5E8E" stroke-width="1"/>
    <use href="#sq-head" transform="translate(-4,-35) scale(1.04)"/>
    <!-- 双炮齐发 -->
    <path d="M -8 -33 Q -20 -42 -28 -38" stroke="#8EC8E8" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M 22 -33 Q 34 -42 42 -38" stroke="#8EC8E8" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <g fill="#B8E8F8" opacity="0.7">
      <circle cx="-30" cy="-38" r="2"/><circle cx="44" cy="-38" r="2"/>
    </g>
  </g>
</svg>
