<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="杰尼龟·五阶·水箭龟·背驮双炮水柱冲霄">
  <defs>
    <!-- 背景：水泽 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8D8E8"/>
      <stop offset="52%" stop-color="#96C0D8"/>
      <stop offset="100%" stop-color="#7AAAC4"/>
    </linearGradient>
    <!-- 水光 -->
    <radialGradient id="glow" cx="46%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#F4FAFE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4FAFE" stop-opacity="0"/>
    </radialGradient>
    <!-- 蓝色皮肤（健硕） -->
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EB0E8"/>
      <stop offset="100%" stop-color="#5E94D0"/>
    </linearGradient>
    <!-- 龟壳 -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D0A068"/>
      <stop offset="100%" stop-color="#AC7C48"/>
    </linearGradient>
    <!-- 水炮管 -->
    <linearGradient id="cannon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA6BE"/>
      <stop offset="100%" stop-color="#6E869E"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="88" cy="50" r="82" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 远山 -->
  <path d="M 0 126 Q 50 116 110 124 Q 160 128 200 120 L 200 200 L 0 200 Z" fill="#6E9E9E" opacity="0.5"/>
  <!-- 水泽 -->
  <path d="M 0 146 L 200 146 L 200 200 L 0 200 Z" fill="#5E8EC8" opacity="0.85"/>
  <path d="M 0 146 L 200 146" stroke="#8EC0E8" stroke-width="1.4" opacity="0.6"/>
  <path d="M 20 154 Q 46 152 74 154 M 120 162 Q 148 160 178 162" stroke="#C8E4F4" stroke-width="1" opacity="0.5" fill="none"/>
  <!-- 水箭龟倒影 -->
  <g opacity="0.3">
    <ellipse cx="100" cy="164" rx="18" ry="4" fill="#7EB0E8"/>
    <path d="M 100 150 Q 98 156 100 168" stroke="#C0905E" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 水箭龟（3头身，背驮双炮） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- 后腿 -->
    <path d="M 100 138 L 96 148 L 104 149 L 110 140 Z" fill="url(#skin)" stroke="#4A78B4" stroke-width="1"/>
    <!-- 尾 -->
    <path d="M 116 140 Q 126 140 130 134 Q 128 130 120 132 Q 118 136 116 140 Z" fill="url(#skin)" stroke="#4A78B4" stroke-width="0.8"/>
    <!-- 身体（健硕） -->
    <ellipse cx="92" cy="122" rx="24" ry="20" fill="url(#skin)" stroke="#4A78B4" stroke-width="1"/>
    <!-- 前腿 -->
    <path d="M 76 134 C 70 140 68 144 68 148" fill="none" stroke="url(#skin)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="68" cy="149" r="3" fill="#5E94D0"/>
    <path d="M 106 134 C 112 140 114 144 114 148" fill="none" stroke="url(#skin)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="115" cy="149" r="3" fill="#5E94D0"/>
  </g>

  <!-- 背壳（在背上，承载双炮） -->
  <ellipse cx="92" cy="112" rx="19" ry="15" fill="url(#shell)" stroke="#8E6232" stroke-width="1"/>
  <path d="M 92 99 L 92 125 M 76 110 L 108 114 M 78 118 L 106 120" stroke="#8E6232" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

  <!-- 双管水炮（从壳侧伸出） -->
  <g>
    <!-- 左炮 -->
    <path d="M 76 108 Q 68 104 60 104 Q 52 104 50 108 L 50 116 Q 52 120 60 120 Q 68 120 76 116 Z" fill="url(#cannon)" stroke="#4E6278" stroke-width="0.8"/>
    <ellipse cx="53" cy="112" rx="4" ry="3" fill="#A8C0D8" stroke="#4E6278" stroke-width="0.6"/>
    <!-- 右炮 -->
    <path d="M 108 108 Q 116 104 124 104 Q 132 104 134 108 L 134 116 Q 132 120 124 120 Q 116 120 108 116 Z" fill="url(#cannon)" stroke="#4E6278" stroke-width="0.8"/>
    <ellipse cx="131" cy="112" rx="4" ry="3" fill="#A8C0D8" stroke="#4E6278" stroke-width="0.6"/>
  </g>

  <!-- 双炮齐发，水柱冲霄 -->
  <g stroke="#A8D8F0" stroke-width="3.4" opacity="0.85" stroke-linecap="round" fill="none">
    <path d="M 53 110 C 48 96 44 80 46 62">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 131 110 C 136 96 140 80 138 62">
      <animate attributeName="opacity" values="0.85;0.5;0.85" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 水柱顶花 -->
  <g fill="#D8EFFC">
    <circle cx="46" cy="58" r="2.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;-3 -5;0 0" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="138" cy="58" r="2.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 -5;0 0" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 头（沉稳，圆眼） -->
  <g>
    <ellipse cx="92" cy="88" rx="14" ry="12" fill="url(#skin)" stroke="#4A78B4" stroke-width="1"/>
    <!-- 口（沉稳） -->
    <path d="M 86 92 Q 92 94.6 98 92" fill="none" stroke="#4A76AE" stroke-width="1" stroke-linecap="round"/>
    <!-- 眼（沉稳，圆） -->
    <circle cx="84" cy="88" r="3.2" fill="#4A3820"/>
    <circle cx="84.7" cy="87.3" r="1" fill="#FFF"/>
    <circle cx="100" cy="88" r="3.2" fill="#4A3820"/>
    <circle cx="100.7" cy="87.3" r="1" fill="#FFF"/>
    <!-- 腮帮 -->
    <circle cx="79" cy="91" r="2.4" fill="#4A78B4" opacity="0.5"/>
    <circle cx="105" cy="91" r="2.4" fill="#4A78B4" opacity="0.5"/>
    <!-- 头顶浅斑 -->
    <circle cx="92" cy="80" r="3" fill="#9EC6F0" opacity="0.6"/>
  </g>

  <!-- 水光星尘 -->
  <g fill="#F4FAFE">
    <circle cx="40" cy="104">
      <animate attributeName="cy" values="104;94;104" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="162" cy="86">
      <animate attributeName="cy" values="86;76;86" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
