<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="掠风隼·二阶·坠风之惧·追风被大风掀落栽进树丛挂枝羽乱发抖">
  <defs>
    <!-- 背景：崖下树丛 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A566E"/>
      <stop offset="52%" stop-color="#5E6E6E"/>
      <stop offset="100%" stop-color="#4E7858"/>
    </linearGradient>
    <!-- 大风光 -->
    <radialGradient id="glow" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#A8C8E0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8C8E0" stop-opacity="0"/>
    </radialGradient>
    <!-- 灰蓝羽（乱） -->
    <radialGradient id="feather" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#6E8AA4"/>
      <stop offset="100%" stop-color="#48627E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="140" cy="40" r="66" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.32;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 大风 -->
  <g stroke="#A8C8E0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 22 50 Q 42 44 56 46">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 30 Q 168 26 182 28">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 树丛 -->
  <g fill="#3E6850" opacity="0.85">
    <path d="M 60 148 L 66 120 L 76 148 Z"/>
    <path d="M 90 148 L 94 112 L 106 148 Z"/>
    <ellipse cx="80" cy="110" rx="30" ry="20" fill="#3E6850" opacity="0.7"/>
    <ellipse cx="110" cy="100" rx="26" ry="18" fill="#46705A" opacity="0.7"/>
  </g>
  <!-- 枝 -->
  <path d="M 76 104 L 120 96" stroke="#2E4E3E" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 挂枝的小掠风隼（中） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0.8;0 0" dur="3s" repeatCount="indefinite"/>
    <!-- 翼（垂乱） -->
    <path d="M 88 100 L 80 112" stroke="#48627E" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 108 98 L 116 110" stroke="#48627E" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 身（挂，乱羽） -->
    <ellipse cx="98" cy="104" rx="12" ry="10" fill="url(#feather)" stroke="#364A60" stroke-width="0.8" transform="rotate(-6 98 104)"/>
    <!-- 乱羽 -->
    <path d="M 88 104 L 84 108 M 110 102 L 114 106" stroke="#48627E" stroke-width="0.8" stroke-linecap="round"/>
    <!-- 头（低垂） -->
    <ellipse cx="98" cy="94" rx="8" ry="7" fill="url(#feather)" stroke="#364A60" stroke-width="0.7" transform="rotate(-6 98 94)"/>
    <!-- 喙（垂） -->
    <path d="M 104 92 L 109 91 L 104 95 Z" fill="#D8A858" stroke="#B88838" stroke-width="0.4"/>
    <!-- 眼（含惧含坚，微湿） -->
    <circle cx="94" cy="93" r="2" fill="#2E2A24"/>
    <circle cx="94.8" cy="91.8" r="0.8" fill="#FFF"/>
    <circle cx="101" cy="93" r="2" fill="#2E2A24"/>
    <circle cx="101.8" cy="91.8" r="0.8" fill="#FFF"/>
    <circle cx="95" cy="92.5" r="0.9" fill="#A8D4E8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <!-- 爪（挂枝） -->
    <path d="M 92 112 L 90 118" stroke="#48627E" stroke-width="2" stroke-linecap="round"/>
    <path d="M 104 112 L 106 118" stroke="#48627E" stroke-width="2" stroke-linecap="round"/>
    <!-- 翼伤 -->
    <path d="M 108 100 L 112 98" stroke="#D87868" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 尘灰 -->
  <g fill="#A8C8E0" opacity="0.3">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="82">
      <animate attributeName="cy" values="82;74;82" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0.1;0.28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
