<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="晨曦鹿·四阶·破雾初成·浓雾封林角光大放破雾引群兽走出">
  <defs>
    <!-- 背景：雾林晨光 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D0A0"/>
      <stop offset="52%" stop-color="#D8C090"/>
      <stop offset="100%" stop-color="#A8C878"/>
    </linearGradient>
    <!-- 破雾晨光 -->
    <radialGradient id="glow" cx="42%" cy="36%" r="46%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
    <!-- 栗色毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#C89868"/>
      <stop offset="100%" stop-color="#A87848"/>
    </radialGradient>
    <!-- 角光 -->
    <radialGradient id="horn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF8D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="84" cy="72" r="76" fill="url(#glow)">
    <animate attributeName="opacity" values="0.95;0.66;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 浓雾（被破开） -->
  <g fill="#F8F0DC" opacity="0.45">
    <ellipse cx="60" cy="138" rx="28" ry="9"/>
    <ellipse cx="150" cy="142" rx="32" ry="10"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#A8C878" opacity="0.9"/>

  <!-- 跟出的群兽（右） -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0;1 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="148" cy="128" r="4" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="136" cy="132" r="3.5" fill="#D0B888" stroke="#B09868" stroke-width="0.5"/>
    <circle cx="158" cy="133" r="3" fill="#C0A070" stroke="#A88858" stroke-width="0.5"/>
  </g>
  <!-- 破雾光路 -->
  <g stroke="#FFF8D8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 110 106 Q 124 114 138 124">
      <animate attributeName="opacity" values="0.5;0.24;0.5" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 破雾的晨曦鹿（中，角光大放） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 角（光大放） -->
    <path d="M 86 100 L 76 84 L 82 88 L 78 74 L 84 86 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.7"/>
    <path d="M 104 100 L 114 84 L 108 88 L 112 74 L 106 86 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.7"/>
    <circle cx="78" cy="76" r="5" fill="url(#horn)">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="76" r="5" fill="url(#horn)">
      <animate attributeName="opacity" values="1;0.7;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="82" r="8" fill="#FFF8D8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.22;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- 大耳 -->
    <path d="M 84 108 L 76 100 L 86 103 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <path d="M 106 108 L 114 100 L 104 103 Z" fill="#C89868" stroke="#8E6838" stroke-width="0.6"/>
    <!-- 身 -->
    <ellipse cx="95" cy="122" rx="15" ry="12" fill="url(#fur)" stroke="#8E6838" stroke-width="0.9"/>
    <ellipse cx="93" cy="128" rx="9" ry="5.5" fill="#F0E4D0" opacity="0.7"/>
    <!-- 头 -->
    <ellipse cx="95" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#8E6838" stroke-width="0.8"/>
    <path d="M 99 112 Q 104 112 106 110 Q 104 116 99 116 Z" fill="#F0E4D0" stroke="#D0C0A8" stroke-width="0.5"/>
    <!-- 眼（含温含亮） -->
    <circle cx="91" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="91.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="100" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="100.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 104 111 L 102 113 L 106 113 Z" fill="#8E6838"/>
    <!-- 嘴（定） -->
    <path d="M 103 116 Q 105 117.4 107 116" fill="none" stroke="#8E6838" stroke-width="0.5" stroke-linecap="round"/>
    <!-- 腿 -->
    <path d="M 84 130 L 80 138" stroke="#A87848" stroke-width="3" stroke-linecap="round"/>
    <path d="M 106 130 L 110 138" stroke="#A87848" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#FFF8D8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
