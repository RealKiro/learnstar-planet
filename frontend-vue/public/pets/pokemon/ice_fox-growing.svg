<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="冰霜翎狐·三阶·练凉苦修·凉意如风不结冰精准落凉稳降温">
  <defs>
    <!-- 背景：宝可梦雪原 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8D8F0"/>
      <stop offset="52%" stop-color="#C8E8F8"/>
      <stop offset="100%" stop-color="#F0F8FC"/>
    </linearGradient>
    <!-- 凉光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 雪白毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0EAF2"/>
    </radialGradient>
    <!-- 霜翎 -->
    <radialGradient id="frost" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8F0FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8F0FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="46" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.6;0.85" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 雪原 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#F0F8FC" opacity="0.9"/>

  <!-- 缓过气的晒蔫小兽（右） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="150" cy="130" r="4.5" fill="#F0C898" stroke="#D8A878" stroke-width="0.5"/>
    <circle cx="148" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="153" cy="128.8" r="1.1" fill="#2E2A24"/>
    <!-- 落下的凉（如风） -->
    <circle cx="148" cy="122" r="1.8" fill="#C8F0FC" opacity="0.9">
      <animate attributeName="cy" values="122;126;122" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="154" cy="124" r="1.5" fill="#C8F0FC" opacity="0.7">
      <animate attributeName="cy" values="124;128;124" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 少年霜翎狐（中，霜翎如纱） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 大耳 -->
    <path d="M 84 106 L 74 90 L 90 100 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 110 106 L 120 90 L 104 100 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 84 100 L 78 93" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 110 100 L 116 93" stroke="#C8F0FC" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- 蓬尾（带霜） -->
    <path d="M 78 124 Q 64 112 60 124 Q 58 136 70 140 Q 82 140 86 130 Z" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-4 78 124;4 78 124;-4 78 124" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="66" cy="130" r="2.2" fill="#C8F0FC" opacity="0.7"/>
    <!-- 身 -->
    <ellipse cx="96" cy="122" rx="16" ry="13" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.9"/>
    <!-- 霜翎（如纱，展） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 82 112;3 82 112;-3 82 112" dur="2s" repeatCount="indefinite"/>
      <path d="M 84 112 L 68 98 L 78 102 L 64 90 L 80 102 L 74 86 L 86 102 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.7" opacity="0.95"/>
      <path d="M 84 112 L 96 98 L 90 102 L 100 90 L 92 102 L 98 86 L 92 102 Z" fill="#C8F0FC" stroke="#8AC8E0" stroke-width="0.6" opacity="0.8"/>
    </g>
    <circle cx="82" cy="104" r="6" fill="url(#frost)">
      <animate attributeName="opacity" values="0.6;0.32;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 头 -->
    <ellipse cx="96" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#B8C8D8" stroke-width="0.8"/>
    <path d="M 100 112 Q 106 112 108 110 Q 106 116 100 116 Z" fill="#E8F0F8" stroke="#C8D8E8" stroke-width="0.6"/>
    <!-- 眼（沉稳） -->
    <circle cx="92" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="92.8" cy="105.8" r="1" fill="#FFF"/>
    <circle cx="101" cy="107" r="2.5" fill="#2E2A24"/>
    <circle cx="101.8" cy="105.8" r="1" fill="#FFF"/>
    <!-- 鼻 -->
    <path d="M 106 111 L 104 113.5 L 108 113.5 Z" fill="#8AA0B8"/>
    <!-- 嘴（定） -->
    <path d="M 103 116 Q 105 117.4 107 116" fill="none" stroke="#8AA0B8" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 抖翎的爪 -->
    <path d="M 84 128 L 80 133" stroke="#D8E8F0" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 108 128 L 112 133" stroke="#D8E8F0" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- 星尘 -->
  <g fill="#C8F0FC">
    <circle cx="46" cy="96">
      <animate attributeName="cy" values="96;88;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;76;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
