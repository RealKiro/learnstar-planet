<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="夜隐豹·四阶·暗护初成·影跃悄挡危机又隐回小兽安然归家">
  <defs>
    <!-- 背景：月夜林 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A3E"/>
      <stop offset="52%" stop-color="#2E3A4E"/>
      <stop offset="100%" stop-color="#3E4E5E"/>
    </linearGradient>
    <!-- 月光 -->
    <radialGradient id="moon" cx="76%" cy="20%" r="36%">
      <stop offset="0%" stop-color="#E8F0F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8F0F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 乌黑毛 -->
    <radialGradient id="fur" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#2E323C"/>
      <stop offset="100%" stop-color="#14161E"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="152" cy="40" r="66" fill="url(#moon)">
    <animate attributeName="opacity" values="0.9;0.64;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="40" r="11" fill="#E8F0F8" opacity="0.95"/>

  <!-- 星 -->
  <g fill="#C8D8E8" opacity="0.5">
    <circle cx="36" cy="44" r="1">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 地面 -->
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#2E3A4E" opacity="0.9"/>

  <!-- 安然的小兽（右，归家） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="152" cy="130" r="4.5" fill="#C8A878" stroke="#A88858" stroke-width="0.5"/>
    <circle cx="150" cy="128.8" r="1.1" fill="#2E2A24"/>
    <circle cx="155" cy="128.8" r="1.1" fill="#2E2A24"/>
  </g>

  <!-- 被挡开的危机（右，消散） -->
  <g stroke="#5A7898" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 164 100 Q 172 108 168 118">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 170 104 Q 178 112 174 122" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 少年夜隐豹（中，影跃挡危） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.2;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 影 -->
    <ellipse cx="92" cy="140" rx="24" ry="5" fill="#0E141E" opacity="0.75"/>
    <!-- 长尾（扬） -->
    <path d="M 72 120 Q 58 110 54 122 Q 52 132 64 136" stroke="#14161E" stroke-width="2.8" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform" type="rotate" values="-4 72 120;4 72 120;-4 72 120" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- 大耳 -->
    <path d="M 82 108 L 73 92 L 88 103 Z" fill="#14161E" stroke="#060810" stroke-width="0.7"/>
    <path d="M 104 108 L 113 92 L 98 103 Z" fill="#14161E" stroke="#060810" stroke-width="0.7"/>
    <!-- 身 -->
    <ellipse cx="92" cy="120" rx="16" ry="13" fill="url(#fur)" stroke="#060810" stroke-width="0.9"/>
    <!-- 头 -->
    <ellipse cx="92" cy="108" rx="10" ry="9" fill="url(#fur)" stroke="#060810" stroke-width="0.8"/>
    <!-- 眼（含温含亮） -->
    <circle cx="87" cy="107" r="2.3" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="97" cy="107" r="2.3" fill="#F8E4A0">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="87.5" cy="106.5" r="0.8" fill="#FFF8E0" opacity="0.9"/>
    <circle cx="97.5" cy="106.5" r="0.8" fill="#FFF8E0" opacity="0.9"/>
    <!-- 鼻 -->
    <path d="M 95 111 L 97 111 L 96 113 Z" fill="#2E3A4E"/>
    <!-- 前爪（挡危，伸向危机） -->
    <path d="M 104 114 L 122 106" stroke="#14161E" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 104 114;5 104 114;-5 104 114" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- 后爪 -->
    <path d="M 78 128 L 73 136" stroke="#14161E" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 106 128 L 111 136" stroke="#14161E" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 挡危震光（暗处护） -->
    <circle cx="124" cy="104" r="3" fill="#C8D8E8" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.22;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 星尘 -->
  <g fill="#C8D8E8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.16;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.14;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
