<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="利欧路·五阶·波导守护·波导如网荡开感知接住藏痛波聚屏障守山谷">
  <defs>
    <!-- 背景：宝可梦山谷 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A7AA8"/>
      <stop offset="52%" stop-color="#6A8AB0"/>
      <stop offset="100%" stop-color="#7AA8C0"/>
    </linearGradient>
    <!-- 波导神光 -->
    <radialGradient id="glow" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#A8E8F8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A8E8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 波导光环 -->
    <radialGradient id="halo" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#C8E8F8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C8E8F8" stop-opacity="0"/>
    </radialGradient>
    <!-- 黑蓝身形 -->
    <radialGradient id="body" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#62749A"/>
      <stop offset="100%" stop-color="#42547A"/>
    </radialGradient>
    <!-- 波导光 -->
    <radialGradient id="wave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68D8F8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#68D8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="52" r="80" fill="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.62;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="82" r="66" fill="url(#halo)">
    <animate attributeName="opacity" values="0.3;0.18;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 波导网（荡开） -->
  <g stroke="#68D8F8" stroke-width="0.8" fill="none" opacity="0.3">
    <circle cx="100" cy="96" r="30">
      <animate attributeName="opacity" values="0.3;0.15;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="96" r="46">
      <animate attributeName="opacity" values="0.22;0.1;0.22" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="96" r="62">
      <animate attributeName="opacity" values="0.16;0.07;0.16" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 山谷 -->
  <g fill="#4A6A88" opacity="0.5">
    <path d="M 0 120 Q 50 104 100 118 Q 160 130 200 112 L 200 200 L 0 200 Z"/>
  </g>
  <path d="M 0 148 L 200 148 L 200 200 L 0 200 Z" fill="#6A8AB0" opacity="0.9"/>

  <!-- 被接住的藏痛小兽（左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="58" cy="122" r="4" fill="#A8D8E8" stroke="#5AA8C8" stroke-width="0.5"/>
    <circle cx="56" cy="120.8" r="1" fill="#24180E"/>
    <circle cx="61" cy="120.8" r="1" fill="#24180E"/>
    <path d="M 60 126 Q 58 129 60 131" stroke="#68D8F8" stroke-width="0.8" fill="none" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 危机（右，被波聚屏障挡） -->
  <g stroke="#5A7898" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 164 66 Q 172 78 168 90">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 172 70 Q 180 82 176 94" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 波聚屏障 -->
  <path d="M 134 148 Q 148 96 134 44" stroke="#68D8F8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- 波导战士（中，立山谷） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.4;0 0" dur="2.4s" repeatCount="indefinite"/>
    <!-- 头冠（立） -->
    <path d="M 94 98 Q 100 86 106 98 M 92 100 Q 98 90 104 100" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.5"/>
    <!-- 尖耳（立，如冠） -->
    <path d="M 82 102 L 70 84 L 88 98 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.8"/>
    <path d="M 108 102 L 120 84 L 102 98 Z" fill="#4A5A78" stroke="#2E3E58" stroke-width="0.8"/>
    <path d="M 82 97 L 76 88" stroke="#68D8F8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M 108 97 L 114 88" stroke="#68D8F8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- 细尾（如纱） -->
    <path d="M 76 120 Q 60 110 56 122 Q 54 132 64 136" stroke="#42547A" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- 身（矫健） -->
    <ellipse cx="96" cy="118" rx="16" ry="12" fill="url(#body)" stroke="#2E3E58" stroke-width="1"/>
    <!-- 头 -->
    <ellipse cx="96" cy="104" rx="11" ry="10" fill="url(#body)" stroke="#2E3E58" stroke-width="0.9"/>
    <!-- 眼（含威含温，微亮） -->
    <circle cx="90" cy="103" r="2.6" fill="#2E2A24"/>
    <circle cx="90.8" cy="101.8" r="1" fill="#FFF"/>
    <circle cx="102" cy="103" r="2.6" fill="#2E2A24"/>
    <circle cx="102.8" cy="101.8" r="1" fill="#FFF"/>
    <!-- 嘴（定） -->
    <path d="M 93 109 Q 96 110.6 99 109" fill="none" stroke="#8EA8C0" stroke-width="0.6" stroke-linecap="round"/>
    <!-- 胸前波导（如心） -->
    <circle cx="96" cy="116" r="4.5" fill="url(#wave)">
      <animate attributeName="opacity" values="1;0.72;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="116" r="8" fill="#68D8F8" opacity="0.32">
      <animate attributeName="opacity" values="0.32;0.18;0.32" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- 前爪（聚屏障） -->
    <path d="M 110 114 L 126 108" stroke="#42547A" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-5 110 114;5 110 114;-5 110 114" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 星尘 -->
  <g fill="#A8E8F8">
    <circle cx="44" cy="96">
      <animate attributeName="cy" values="96;86;96" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="84">
      <animate attributeName="cy" values="84;74;84" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
